l_english: # Warcraft, to replace the base game's greatest_of_khans with thunder_king
 confederation_threat_tt: "Any Neighboring [ruler|E], Neighboring [ruler|E]'s [suzerain|E] or [ruler|E] in the same [de_jure|E] [kingdom|E] as your [capital|E]:\n$EFFECT_LIST_BULLET$$superior_max_military_strength_tt$\n$EFFECT_LIST_BULLET$Is #bold not#! [allied|E] to #high you#!\n$EFFECT_LIST_BULLET$At least one of these:\n  $EFFECT_LIST_BULLET$Highest held Title is greater or equal to Kingdom [rank|E]\n  $EFFECT_LIST_BULLET$$considers_faith_evil_tt$\n  $EFFECT_LIST_BULLET$Has the Trait: [GetTrait('conqueror').GetName( GetNullCharacter )]\n  $EFFECT_LIST_BULLET$Has the Trait: [GetTrait('thunder_king').GetName( GetNullCharacter )]"

 mpo_decisions_events.0001.t: "Rallying the Nations"
 mpo_decisions_events.0001.desc: "At the whim of [ROOT.Char.GetFaith.HighGodName], my [ROOT.Char.GetPrimaryTitle.GetTierAsName] can be broken like the shaft of a single arrow! For my modest nation shares the land of [home_kingdom.GetNameNoTier] with such crisis as [threat.GetTitledFirstNamePossessive] fearsome [threat.GetCulture.GetCollectiveNoun].\n\nBut — if my people's arrows were bound with those of friends and kin? Could an enemy grip so easily shatter us?\n\n#EMP Brothers, sisters — name no master, but a voice for the nations! A voice to scorn [threat.GetTitledFirstNameNoTooltip], and all the world!#!"
