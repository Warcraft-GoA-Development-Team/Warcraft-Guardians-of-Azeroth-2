l_english:
 
 burninglegion_0003_title: "The Siege of Dalaran"
 burninglegion_0003_desc: "The defenders of Dalaran are struck down one by one. The Lich and I approach the pathetic [antonidas.GetFirstName].\n\n[antonidas.GetFirstName] slumps over and speaks [Select_CString(antonidas.IsFemale, 'her', 'his' )] last words, "It pains me to even look at you, [ROOT.GetCharacter.GetFirstNameNoTooltip]..."\n\n"I'll be happy to end your torment, [antonidas.GetFirstName]. I told you that your magics could not stop me.", I retort while noticing the frown on the face with a hint of disappointment in [antonidas.GetFirstName].\n\nWith nothing left to say anymore, I strike [antonidas.GetFirstName] with [frostmourne|E]. I pick up the Book of Medivh, stained with [antonidas.GetFirstName]' blood, and hand it over to the Lich. "The spellbook is all yours, lich. Let's take it and leave before the wizards amass an attack."\n\n"Indeed... I will begin summoning Lord Archimonde after I study the Book of Medivh properly.", says [summonerofburninglegion.GetFirstName] as [Select_CString(summonerofburninglegion.IsFemale, 'she', 'he' )] examines the book."
 burninglegion_0003_a: "Let the summoning commence!"
 burninglegion_0003_a_tt: "The Lich will take its time to understand the Book of Medivh and summon the Burning Legion"

 burninglegion_0004_title: "Under the Burning Sky"
 burninglegion_0004_desc: "The Lich [summonerofburninglegion.GetFirstName] shifts away from the summoning circle and paves a way for the Burning Legion, "Come forth, Lord Archimonde! Enter this world and let us bask in your power!"\n\nThe very fabric of reality seems to shred and tear apart as a being of vile and strong magics enters this world.#XB "Tremble mortals, and despair! Doom has come to this world!"#!, Lord [lordarchimonde.GetFirstName] declares. [Select_CString(lordarchimonde.IsFemale, 'She', 'He' )] glances at [summonerofburninglegion.GetFirstName],#XB "You have done well, little Lich. My plan worked perfectly."#!\n\n[tichondrius.GetFirstName] presents itself to Lord [lordarchimonde.GetFirstName],#XB "Lord Archimonde, all the preparations have been made."#!\n#XB "Very well [tichondrius.GetFirstName]. Since the [GetTrait('lich_king').GetName( GetNullCharacter )] is of no further use to me, you dreadlords will now command [scourge|E]"#!, I hold back my shocked expression as I hear the final command by [lordarchimonde.GetFirstName].\n#XB "As you wish, Lord [lordarchimonde.GetFirstName]"#!, of course the Dreadlord doesn't let such a chance slip by.\n\nLord [lordarchimonde.GetFirstName] turns to look at the Dalaranians still trying to mount up a defense,#XB "Soon, I will order the invasion to begin. But first, I will make an example of these paltry wizards... by crushing their city into the ashes of history."#!\n\nI let out a breath I didn't know I was holding back. I turn towards [summonerofburninglegion.GetFirstName], "This has got to be a joke! What happens to us now?!"\n"Patience, my young death knight. The [GetTrait('lich_king').GetName( GetNullCharacter )] foresaw this as well. You may yet have a part to play in his grand design.""
 burninglegion_0004_a: "No other choice, then..."

 burning_crusade: "Legions"

 burninglegion_0006_title: "The Burning Legion"
 burninglegion_0006_desc: "#XB Let this scar signify the first blow against the mortal world. From this seal shall arise the doom of men, who, in their arrogance, sought to wield our fire as their own. Blindly they built their kingdoms upon stolen knowledge and conceit. Now they shall be consumed by the very flame they sought to control. Let the echoes of doom resound across this wretched world, that all who live may hear them and despair.#!The echoes of numerous tormented souls reverberates through the very air of Azeroth. The air becomes thick with the scent of fire and blood - a prelude to the cataclysm that is about to unfold. The Dark Masters of Disorder have heralded their arrival on this planet.\n\nA deep emerald portal crackling with Fel energy has appeared in the heart of Dalaran, and through it, the [burning_legion|E] has begun their invasion of Azeroth."
 burninglegion_0006_light_opt: "We shall purge this like any other Corruption"
 burninglegion_0006_shadow_opt: "Our sworn enemy is here, and we will thrive despite that"
 burninglegion_0006_life_opt: "We defeated them once, we shall do so again!"
 burninglegion_0006_death_opt: "Some shall serve, but we will await to serve our true master again"
 burninglegion_0006_order_opt: "Their defeat by our hands shall be symbolic"
 burninglegion_0006_disorder_opt: "GLORY TO THE BURNING LEGION!"
 burninglegion_0006_elemental_opt: "We only serve what surrounds us"
 burninglegion_0006_fallback_opt: "To arms! A storm is upon us, a Calamity!"

 burninglegion_0101_opening: "Tremble before me mortal,"
 burninglegion_0101_desc: "I have arrived to spell the final doom of this mortal realm! The Burning Legion shall spare no one and all that lives shall be purged...\nWill you be the ones to join the mortals in their impending doom? Or will you bend the knee to the Legion?"
 burninglegion_0101_submit: "I live to serve the Burning Legion!"
 burninglegion_0101_submit_tt: "You become a [vassal|E] of [archimonde.GetShortUIName]"
 burninglegion_0101_resist: "No, we are free!"
 burninglegion_0101_resist_tt: "You become the first in line to face the wrath of [archimonde.GetShortUIName|U]"

 burninglegion_0102_opening: "To the almighty [archimonde.GetShortUIName],"
 burninglegion_0102_desc: "We exist to serve the Burning Legion as its loyal minions. Use us and our people as you wish, Lord [archimonde.GetShortUIName]."
 burninglegion_0102_a: "Good, you shall serve the Legion well."

 burninglegion_0103_opening: "To the burning slave,"
 burninglegion_0103_desc: "You wish for us to throw away the hopes and freedoms we have hard fought for? Go back and whimper before your Dark Titan for mercy, you will fail in Azeroth!"
 burninglegion_0103_a: "You can die with these paltry mortals, then."
