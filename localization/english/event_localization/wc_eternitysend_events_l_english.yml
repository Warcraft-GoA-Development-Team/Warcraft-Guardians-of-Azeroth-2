l_english:

 eternitysend_0200_title: "Cry of the Warsong"
 eternitysend_0200_desc: "In the shadowed woods of Kalimdor, the clan toils day and night to stockpile the wood necessary for the future of the new Horde.\n\nIt all seems peaceful despite a few skirmishes with the locals of Kalimdor... until... the entire clan hears a booming voice across the lands.\n\n"Who dares defile this ancient land? Who dares the wrath of [cenarius.GetFirstName] and the night elves?", we all become alert and ready our axes. A grunt comes rushing to me, "The forest itself is coming alive! We are under attack!". The trees start swinging their branches like weapons at our peons and grunts alike.\n\n"Let battle be joined!", the godly voice booms once again. The night elves have joined in the attack against us! Curse these warrior women!"
 eternitysend_0200_a: "Their numbers are too great! Fallback to the defenses!"

 eternitysend_0201_title: "The Spirits of Ashenvale"
 eternitysend_0201_desc: "We have observed these green beasts for long enough. They destroy and attack anything that is not their own kind, unprovoked. They break the very balance of Kalimdor with which it has stood for long.\n\nNow they come to our forests and cut down our ancient lands? Despicable! Enough is enough! I shall myself bring an end to this vile race! I shall set Kalimdor on the right path again."
 eternitysend_0201_a: "Demon-spawned wretches! You will all die!"

 eternitysend_0202_title: "A Well of Power?"
 eternitysend_0202_desc: "I am approached by one of the more magically attuned of the clan. "Chieftain, I sense a dark power eminating from the wilderness! It might be a key into slaying the Demigod!"\n\nI look at my warriors with more hope. "Then what are we waiting for? Lets form an expedition and head into the wilderness to search for this well.""
 eternitysend_0202_a: "Lok'tar ogar!"
 eternitysend_0202_a_tt: "You start searching for this well of power. This may take some time!"

 eternitysend_0203_title: "A Well of Doom"
 eternitysend_0203_desc: "We are finally able to carve a path towards this well of power. [witch_doctor.GetFirstName] stops me before I could approach the well, "The pool eminates great power, but I smell the stench of a demonic curse about it!"\n\nI push [witch_doctor.GetFirstName] away and approach the well, "Bahh! I am cursed already! If I must drink from these waters to defeat [cenarius.GetFirstName], then I will."\n\nI am stopped once again, but this time by one of my warriors. "No! That goes against everything we stand for! We can't let rage overcome us again!"\nI pat the warrior on his shoulder, "No, warrior. We must embrace it as never before! We must become the vessels of destruction that we were meant to be!" With that, the warrior stands back and I bend down to drink from the well.\n\n"Yes! I feel the power flowing within me once again! Come, my warriors! Drink from the dark waters and you will be reborn!""
 eternitysend_0203_a: "Time to slay this "Demigod""

 eternitysend_0204_title: "The Hunter of Shadows"
 eternitysend_0204_desc: "I take a deep breath, each breath I take feels like my insides are burning. But the demigod lies in front of me, dead and gone.\n\nI slump down as my entire body aches but the burning powers within me seems to heal that pretty quickly even after just small break taken. "What kind of powers have I dabbled into...?""
 eternitysend_0204_a: "Time to stockpile that damn woods again..."

 eternitysend_0205_title: "The Hunter of Shadows"
 eternitysend_0205_desc: "We are losing... we basically have lost...\n\nI see Cenarius still standing tall above us like a victor, clearly looking down on us. While my warriors die arround me and fight of the other night elves for now, I take the chance, I pick up my axe and charge at the demigod."
 eternitysend_0205_a: "CENARIUS!"
 eternitysend_0205_a_tt: "You and [attacker.GetFirstName] will duel to death!"

 eternitysend_0206_title: "Betrayal of Thyself"
 eternitysend_0206_desc: "The Demigod has fallen, the Warsong is supreme!\n\nBut as I and our warriors celebrate this victory, a ghastly and large being strides towards us. It is armored and wields a large spear-like weapon, its back burning green and aflame of an unquenching bright light.\n\n#XB "Hello again, [ROOT.GetCharacter.GetFirstNameNoTooltip]..."#!, I recognize its voice, I recognize its form. "[mannoroth.GetFirstName], it... can't be... why are you here?!", I feel a sudden loss of control over my own body and its motions as I tried raising my axe, my warriors suffering the same as I glance back at them.\n\n#XB "I've come to bring you and your brethren back into the fold. Though you orcs failed the [burning_legion|E] before, you will now serve us once again!"#!, I grit my teeth as I try to hold a level of consciousness over [mannoroth.GetFirstName]'s control. "No! we... are free..."\n\n#XB "Ha... ha ha ha ha... stupid, pitiful creature. I am the rage in your heart. I am the fury of your thoughts. I alone empowered you to bring chaos into this world, and by the endless void, you shall!"#!"
 eternitysend_0206_a: "No... what... have I done?"
 eternitysend_0206_a_tt: "You and the Warsong clan swear allegiance to the [burning_legion|E]"

 eternitysend_0207_title: "Another Dream, Another Hope"
 eternitysend_0207_desc: "The Prophet once again came to my dreams, this time he wished for me to meet him in person and talk about an important matter.\n\nThere is a relief in my breath as I finally get to talk to this Prophet clearly and understand why escaping to Kalimdor was the only option for my race...\n\nAs me and my warriors travel through the forests to meet him, we come across a group of Humans, but it is not the Prophet or someone related to him. These Humans carry similar banners from those in Lordaeron, have these rascals followed us all the way to Kalimdor?!\n\nThe Humans seem to ready themselves for battle and so do we. "Lok-Narash!", I say to my warriors. But before any of us could land an attack on the other, a massive magical barrier appears between us.\n\n"Stop! There will be no violence in this place.""
 eternitysend_0207_a: "What the-"

 eternitysend_0208_title: "Another Council with the Prophet"
 eternitysend_0208_desc: "It has been a while since the Prophet last approached us and convinced us to escape Lordaeron, but asking us to meet here in the foresty depths of Kalimdor is the last place I expected to meet him. Couldn't he find a better place? Maybe our newfound castles in Theramore?\n\nI sigh as me and my troops carry on with the long march. We finally approach the place of meeting. The Prophet has been right about lordaeron, I wonder what is next?\n\nAfter entering the forests, we come across Orcs... Orcs? In Kalimdor?! "Orcs. I knew we were not alone in these lands." I glance at my warriors, "Defend yourselves!" But before any of us could land an attack on the other, a massive magical barrier appears between us.\n\n"Stop! There will be no violence in this place.""
 eternitysend_0208_a: "Who did that?!"

 eternitysend_0209_title: "The Prophet"
 eternitysend_0209_desc: "Its him, the Prophet. I didn't know he possessed such vast powers, I approach him.\n\nBefore I could speak, the Prophet declares "Now that I have lured you all here, I will tell you what your destiny holds." Did the Prophet expect us both to be here?\n\n"What the hell is going on here?" I demand to the Prophet.\nThe prophet smiles, "[durotar_ruler.GetFirstName], this is [theramore_ruler.GetName], last of the surviving leaders of Lordaeron."\n"Survivors? What are you talking about?" I ask while glancing at [theramore_ruler.GetFirstName].\n"The invasion of [burning_legion|E] has begun! Lordaeron has already fallen, and now the demons come to invade Kalimdor! Only together, united against the shadow, will you be able to save this world from the flame."\nThe Human immediately interrupts and speaks, "Unite with them? Are you mad?"\n"Have you heard nothing that I have said? The Legion comes to undo history and end all life! [durotar_ruler.GetFirstName], your friend and leader of the Warsong clan has already fallen to the demons' influence. Soon he and your whole race will be lost forever!" My eyes widening at the declaration.\n"No... I'll die before I let that happen!" My grips tightens on my hammer.\n"Then you must rescue them immediately! The Warsong clan is key to the destiny I promised you. However, for that, you will need help." The prophet says while pointing at [theramore_ruler.GetFirstName].\n[theramore_ruler.GetFirstName] shakes [theramore_ruler.GetHerHisMy] head, "Wait! This is insane! You can't possibly expect me to-"\n"Destiny is at hand, [theramore_ruler.GetFirstName]. The time to choose has come. For the fate of all who live, humanity must join forces with the Horde.""
 eternitysend_0209_a: "So be it..."

 eternitysend_0210_title: "The Prophet"
 eternitysend_0210_desc: "The Prophet announces himself with his vast powers which I maybe had underestimated before. I approach him while keeping a safe distance from the Orc brutes.\n\n"Now that I have lured you all here, I will tell you what your destiny holds." The Prophet wanted both of our kinds here?\n\n"What the hell is going on here?" the Orc brute demands from the Prophet.\nThe prophet smiles, "[durotar_ruler.GetFirstName], this is [theramore_ruler.GetName], last of the surviving leaders of Lordaeron."\n"Survivors? What are you talking about?" [durotar_ruler.GetFirstName] asks insistently while glancing at me.\n"The invasion of [burning_legion|E] has begun! Lordaeron has already fallen, and now the demons come to invade Kalimdor! Only together, united against the shadow, will you be able to save this world from the flame."\nI interrupt the Prophet, "Unite with them? Are you mad?"\n"Have you heard nothing that I have said? The Legion comes to undo history and end all life! [durotar_ruler.GetFirstName], your friend and leader of the Warsong clan has already fallen to the demons' influence. Soon he and your whole race will be lost forever!" [durotar_ruler.GetFirstName] looks shocked.\n"No... I'll die before I let that happen!" [durotar_ruler.GetFirstName] says while gripping [durotar_ruler.GetHerHisMy] hammer.\n"Then you must rescue them immediately! The Warsong clan is key to the destiny I promised you. However, for that, you will need help." The prophet says while pointing at me.\nI shake my head, "Wait! This is insane! You can't possibly expect me to-"\n"Destiny is at hand, [theramore_ruler.GetFirstName]. The time to choose has come. For the fate of all who live, humanity must join forces with the Horde.""
 eternitysend_0210_a: "If this is what needs to be done..."

 eternitysend_0220_title: "Under the Burning Sky"
 eternitysend_0220_desc: ""Warchief! The skies are burning!", my warrior alerts me.\n\nThe sky has turned blood red, the very air now burning and now chokes us with ash. "This is no natural storm! Everyone brace yourselves!"\n\nI see the sky rain down balls of green fire that then unfold into animate beings of burning stone that march towards us. "Fight on my warriors! We must reach [defender.GetFirstName] before it's too late!""
 eternitysend_0220_a: "Blessed ancestors..."

 eternitysend_0221_title: "By Demons Be Driven"
 eternitysend_0221_desc: "[defender.GetFirstName] is finally captured. The best of my casters and some from the Theramorean alliance begin to strip away the hold of Demons' over [defender.GetFirstName].\n\nAfter a stonelike-pause from [defender.GetFirstName] for a while, [defender.GetFirstName] shakes [defender.GetHerHisMy] head and sits down. "[attacker,GetFirstName]... I see clearly now. I'm... sorry. I am so sorry."\nI grit my teeth, "To hell with your apologies! Right now, I need you to help me save our people!"\n"Mannoroth... we need to face Mannoroth..." [defender.GetFirstName] says with some determiation.\n"Then let's go. I don't want to keep that bastard waiting.""
 eternitysend_0221_a: "Time to face that Demon"

 eternitysend_0222_title: "By Demons Be Driven"
 eternitysend_0222_desc: ""[defender.GetFirstName], w-wait! Stop this madness! You have got to come with me..." I see [attacker.GetFirstName] whimper in front of me.\n\nThe very pathetic state of [attacker.GetFirstName] cracks a smile on my face, "Why... what happened little pup? Don't you have a Horde to save?... Destiny is at Hand! Lord Mannoroth and the Burning Legion are our masters now."\n[attacker.GetFirstName] whinces, "Who? You're not talking sense!"\n"Ah, [attacker.GetFirstName]. You always believed that the demons corrupted our race, but that's only half true. We gave ourselves up willingly on Draenor! The other chieftains and I... we drank [Glossary( 'blood of Mannoroth', 'BLOOD_OF_MANNOROTH_GLOSS' )], [attacker.GetFirstName]. We brought this curse upon ourselves!"\n"You did this... to our people... knowingly? Arrrggggghhhhh!" [attacker.GetFirstName] says full of rage and tries to strike me.\n\nI easily dodge [attacker.GetFirstName]'s attack and slice [defender.GetHerHisMy] battle arm. "Pathetic... but with the powers from the daemons, our race shall no longer ever lose... but weaklings like you stop us from attaining glory!"\n\n[attacker.GetFirstName] still manages to stand up, "Like I would let you..."\n"Oh, I know little pup... you and your bloodline has long since caused problems for us... always meddling... now it is time for you all to lay rest!" I raise my axe and silence [attacker.GetFirstName] once and for all."
 eternitysend_0222_a: "Sleep well little pup..."
 eternitysend_0222_a_tt: "All [GetTrait('creature_orc').GetName(GetNullCharacter)]s of the Durotarian culture will become [GetTrait('creature_fel_orc').GetName(GetNullCharacter)]s, convert to Sargerism and (if independent and landed) will become tributaries of [GetTitleByKey('h_burning_legion').GetName]"

 eternitysend_0224_title: "By Demons Be Driven"
 eternitysend_0224_desc: "[attacker.GetFirstName] saved me from myself, but this is time, I have to save my own clan. We both approach the craters where Mannoroth lurks in, the stench of malice and death runs thick here.\n\nA maniac laughter surrounds us, undenibly of Mannoroth, "So predictable. I knew you would come. And I see you have brought the mighty [defender.GetFirstName]... His blood is mine..." Mannoroth suddenly appears behind us, his towering form dawning on both of us. "... as is your whole misbegotten race."\n\n[attacker.GetFirstName] charged [attacker.GetHerHisMy] hammer and strikes at Mannoroth, but it fails to put even a scratch on Mannoroth. "A worthy effort, but futile." Mannoroth easily throws [attacker.GetFirstName] away and smashes them on the crater nearby.\n\nNow it lies only on me to defeat Mannoroth."
 eternitysend_0224_a: "Come On!"
 eternitysend_0224_a_tt: "You and [mannoroth.GetFirstName] will duel to death!"

 eternitysend_0225_title: "Valiant Victory"
 eternitysend_0225_desc: ""[attacker.GetFirstName]... the blood haze has lifted. The demon's fire... has burnt out in my veins... I... have... freed... myself..." [defender.GetFirstName] says as the burning fires inside [defender.GetHerHisMy] eyes are vanished, but so do any signs of life.\n\n"No, my old friend...""
 eternitysend_0225_a: "...You've freed us all"
