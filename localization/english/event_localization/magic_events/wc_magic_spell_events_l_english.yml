 wc_magic_spell_events.2798.magic_tormentor: "The whispers cripple your victim's magic"

 wc_magic_spell_events.6001.t:0 "Taking the Water of Life"

 # Sentence 1 - Into the Dream
 wc_magic_spell_events.6001.desc.first:0 "There is a sudden, bitter taste as the water of life washes down your throat. Your vision goes dark. A drop falls into a vast pool of water which connects all life and magic. You are the drop and the drop is you.\n\n"
 wc_magic_spell_events.6001.desc.subsequent:0 "You have become used to the bitter taste of the water of life as you boldly swallow the potion. As always, your vision goes dark and the drop that is you joins a vast pool of water which connects all life and magic.\n\n"

  #Sentence 2 - Dream Flavor
 wc_magic_spell_events.6001.desc.Ambitious:0 "A child lost in a great crowd, struggling to make [ROOT.Char.getHerHis] way. [ROOT.Char.GetSheHe] loses [ROOT.Char.getHerHis] footing and is trampled by the crowd...\n\n"
 wc_magic_spell_events.6001.desc.Arbitrary:0 "Two hands, their owners shrouded in darkness, press upon opposing plates of a scale. The fingers and wrists strain, but neither gives way and the scales stay balanced...\n\n"
 wc_magic_spell_events.6001.desc.Arrogant:0 "Blood trickles down a brow, oozing forth from below a jeweled crown. With every moment it presses harder, and signs of age begin to appear beneath the streams...\n\n"
 wc_magic_spell_events.6001.desc.Brave:0 "The [ROOT.Char.GetDynastyHouseNameNoTooltip] coat of arms clatters to the floor and splits. Its pieces are submerged in a spreading pool of blood...\n\n"
 wc_magic_spell_events.6001.desc.Calm:0 "The moon reflects upon a vast and untroubled sea. Slowly, a red color fills the moon from below. As the reddening moon rises above the water, its crimson reflection spreads across the stirring ocean until it is a roiling torrent of blood...\n\n""
 wc_magic_spell_events.6001.desc.Callous:0 "A hand reaches out towards a scruffy dog, offering a piece of meat. Cautiously the dog sniffs the meat, then the hand; it opens its maw and clamps down on the wrist, drawing blood...\n\n"
 wc_magic_spell_events.6001.desc.Chaste:0 "A soft velvet fabric warps, as if pulled; revealing an elegant lace hem. The hem slides across soft and supple flesh, hinting at a shapely bosom or torso...\n\n"
 wc_magic_spell_events.6001.desc.Content:0 "A shadowy closet is opened to reveal marionettes hanging from pegs. Kings, queens, lords, ladies, and cortiers all hang limply in the half-light...\n\n"
 wc_magic_spell_events.6001.desc.Compassionate:0 "An emaciated child, clad in rags and riddled with flea bites, curls [ROOT.Char.getHerHis] body around an empty bowl. Wind blows [ROOT.Char.getHerHis] tattered clothes and snow begins to fall...\n\n"
 wc_magic_spell_events.6001.desc.Craven:0 "A great circling staircase unfolds infinitely down around you as you fall headfirst into unfathomable depths. The air buffets you as you tumble head over feet into the abyss...\n\n"
 wc_magic_spell_events.6001.desc.Cynical:0 "You are pulled up the steps of a [ROOT.Char.GetFaith.HouseOfWorship] by a rope tied to your ankles. A crowd jeers as you are hoisted from the rafters and beaten with sticks...\n\n"
 wc_magic_spell_events.6001.desc.Deceitful:0 "A giant cage trap is filled with chittering rats. Starving and desperate, they gnaw at the bars and manage to wrench their way free, spilling out by the dozen...\n\n"
 wc_magic_spell_events.6001.desc.Diligent:0 "The sun dawns (or sets?) on a once-magnificent castle, its walls shot through with cracks and overgrown with ivy. The silence of the land is oppressive, yet something seems to move unnervingly inside...\n\n"
 wc_magic_spell_events.6001.desc.Depressed:0 "A dead and wasted landscape stretches as far as the eye can see. Starved animal corpses litter the ground as the sun rises over the landscape, blackening as it drains all color from the world...\n\n"
 wc_magic_spell_events.6001.desc.Eccentric:0 "You are in a library searching for a book. As you pull it from the shelves and rifle through the pages, a large number seem to have been torn out. Frantically you pull book after book from the shelves... Pages are missing from them all...\n\n"
 wc_magic_spell_events.6001.desc.Fickle:0 "A cart snaps free from its yoke and hurdles downhill, careening out of control as its contents spill everywhere. It shatters at the bottom of a ravine...\n\n"
 wc_magic_spell_events.6001.desc.Forgiving:0 "You walk into a tent, where a formal gathering is underway. Suddenly all eyes turn on you. Shocked looks turn to snickers and then open jeering as you realize you are standing naked as the day you were born...\n\n"
 wc_magic_spell_events.6001.desc.Generous:0 "In a forgotten corner of a cemetary, a lone headstone stands crusted with lichen. No name, no date is present, the shadows of the overgrowth looms over its abandoned face...\n\n"
 wc_magic_spell_events.6001.desc.Gregarious:0 "A statue stands in disrepair, shot through with cracks and worn down by wind and rain. Ignored by the passers by, birds roost and shed their droppings upon its outstretched arms...\n\n"
 wc_magic_spell_events.6001.desc.Greedy:0 "A table extends outward through a dining hall with no visible end. Set for a feast, every platter is rotting, moldy, and flyblown...\n\n"
 wc_magic_spell_events.6001.desc.Gluttonous:0 "A [ROOT.Char.GetWomanMan] sits at a dinner table, surrounded by friends and family. Suddenly [ROOT.Char.GetHerHis] jaw seizes up, followed by [ROOT.Char.GetHerHis] neck, shoulders, and arms. Each part crusts over a slate grey, [ROOT.Char.GetHerHis] eyes are the last part of [ROOT.Char.GetHerHim] to turn to stone...\n\n"
 wc_magic_spell_events.6001.desc.Honest:0 "A lonely gallows sits atop a hill in the sunrise or sunset, with five figures dangling from their ropes. Crows alight upon their shoulders and peck at their faces...\n\n"
 wc_magic_spell_events.6001.desc.Humble:0 "You stand within a hall of mirrors, each with a different distortion of your body. One makes you fat and short, another tall and skinny, but there is one mirror you are drawn to; the image is hazy but sharpens as you come closer. Only your face remains featureless and blurred...\n\n"
 wc_magic_spell_events.6001.desc.Impatient:0 "A hand reaches out from a pit of sand, a figure helplessly being swallowed. However the sands are not deep but high. A torrent of sand is bursting from a giant broken hourglass, burying dozens alive...\n\n"
 wc_magic_spell_events.6001.desc.Just:0 "A lone figure pushes a giant boulder up a long and treacherous hill, buffeted by rain and mired in mud. Just as [ROOT.Char.GetSheHe] reaches the top, [ROOT.Char.GetSheHe] slips and barely avoids being crushed as the boulder rolls back down the hill...\n\n"
 wc_magic_spell_events.6001.desc.Lazy:0 "A great and opulent mansion is ablaze in the dying light. Within, every type of great work turns to ash; lifetimes of effort are reduced to dust in one night...\n\n"
 wc_magic_spell_events.6001.desc.Lunatic:0 "An infinite wall of faces, of every color and shape, displaying the full range of human emotion. Some cry out, some cackle with glee, others chant obsessively... Voices which have been echoing in your mind...\n\n"
 wc_magic_spell_events.6001.desc.Lustful:0 "A lost child in the streets of a crowded city. [ROOT.Char.GetSheHe] is looking for [ROOT.Char.GetHerHis] mother or father, but no one seems to notice or care...\n\n"
 wc_magic_spell_events.6001.desc.Paranoid:0 "An infinite wall of indistinct faces, of every color and shape, each glaring with hate and sinister intent. Each whispers a plot against you at a volume just lower than you can hear...\n\n"
 wc_magic_spell_events.6001.desc.Patient:0 "An ornate and fine glass tumbles from an unseen hand, and shatters upon a cold stone floor. A sense of dread fills you along with the impression that the pieces of something important will never be put together again...\n\n"
 wc_magic_spell_events.6001.desc.Sadistic:0 "Moonlight shatters and flickers as it pierces the surface of water above you. It dims as you sink, you struggle to hold your breath. You can barely see the bubbles that burst forth as you mouth opens, taking in foul water as you struggle fruitlessly...\n\n"
 wc_magic_spell_events.6001.desc.Stubborn:0 "Two oxen are hitched to your cart as it hurdles toward a precipice, each pulling in the opposite direction. No matter how you strain at the reins, you cannot make them work as one. The reins snap as the three of you plunge into the abyss; their screams sound eerily human...\n\n"
 wc_magic_spell_events.6001.desc.Shy:0 "You must deliver the most important speech of your life to a crowd of the most intimidating people you have ever met. As you step on to the stage, the words you have written have been blurred by your sweaty palms, and as the crowd starts laughing hysterically you realize you are stark naked...\n\n"
 wc_magic_spell_events.6001.desc.Temperate:0 "A horse gallops across a muddy plane, as its rider dangles tangled in the reins. [ROOT.Char.GetHerHis] fine clothes are dragged through the mud and caked with filth as [ROOT.Char.GetHerHis] body is bruised and broken...\n\n"
 wc_magic_spell_events.6001.desc.Trusting:0 "A lone figure sits atop a tiny boat in the middle of a vast ocean. An overwhelming sense of dread fills you as the realization sets in that this person will struggle and die alone...\n\n"
 wc_magic_spell_events.6001.desc.Vengeful:0 "A gaping wound spills blood from your side, with each attempt to clamp it closed the wound opens further and more blood gushes forth from your body...\n\n"
 wc_magic_spell_events.6001.desc.Wrathful:0 "You are trapped in a small space, a container of some sort. Material is thrown against it repeatedly, with each shovelful becoming softer as you are buried further and further...\n\n"
 wc_magic_spell_events.6001.desc.Zealous:0 "A sense of finality grips you as a light echoes [ROOT.Char.GetFaith.CreatorNamePossessive] presence forth. You reach out, but it slowly begins to fade into the the dark as you plunge backwards...\n\n"
 wc_magic_spell_events.6001.desc.Learning_Education:0 "You sit at the center of a vast library, with endless shelves of books and scrolls at your side. Before you scrolls an endless text of the world's written knowledge, but it is moving too fast for you to grasp...\n\n"
 wc_magic_spell_events.6001.desc.Martial_Education:0 "From atop a mountain you surveil the battles of the world, all unfolding before you on an endless plain. Beings of faraway lands use tactics you have never seen before. Yet you are too far away to make out the useful details...\n\n"
 wc_magic_spell_events.6001.desc.Diplomacy_Education:0 "In the midst of a great meating hall, the courtiers of the world speak in languages you cannot understand. You push through the crowd, trying to find someone you can understand, but nothing sounds familiar to you...\n\n"
 wc_magic_spell_events.6001.desc.Stewardship_Education:0 "You are in your study, poring over ledgers and plans. For every three documents you approve, four more arrive. The files pile and pile up, overflowing your workspace until you are buried...\n\n"
 wc_magic_spell_events.6001.desc.Intrigue_Education:0 "You are reviewing an operation you have been planning for years. The agents are in place, the poisons mixed and given to the correct ones, bribes have been diseminated. However there is a nagging feeling that some piece has been left out of this puzzle...\n\n"
 wc_magic_spell_events.6001.desc.Aspiring_Blademaster:0 "You are locking blades with a robed figure, [ROOT.Char.GetHerHis] face obscured by a hood. For what seems like ages neither of you has the upper hand, until a quick disengagement and feint allows you to disarm [ROOT.Char.GetHerHim] and kick [ROOT.Char.GetHerHim] to the ground. You remove the figure's hood and [ROOT.Char.GetSheHe] disappears...\n\n"
 wc_magic_spell_events.6001.desc.Eager_Reveler:0 "You are throwing the party of the century, and wine and conversation are flowing, but the main course is running late. You search frantically for the kitchen, but find nothing but parlor rooms and dining halls chocked with antsy guests...\n\n"
 wc_magic_spell_events.6001.desc.Novice_Physician:0 "A male patient presents with a strange condition, his belly distended and his body showing signs of malnutrition. You place your hand on his belly, and something presses back... Then a wound appears at the top of the belly, a black claw slicing the skin apart from within as the patient screams in agony...\n\n"
 wc_magic_spell_events.6001.desc.Pilgrim:0 "You ascend the steps to a holy [ROOT.Char.GetFaith.HouseOfWorship], said to be none other than the dwelling place of [ROOT.Char.GetFaith.CreatorName]. Yet the higher you climb, with each stair you ascend, the door to the [ROOT.Char.GetFaith.HouseOfWorship] grows further and further away...\n\n"
 wc_magic_spell_events.6001.desc.Mystic:0 "You draw the final chalk line for a sigil that you have seen only in dreams, yet as soon as you complete it you look up to notice another of the strokes is wrong. As soon as you fix that one, you realize another is off. Back and forth you scurry, but try as you might the sigil will never be complete...\n\n"
 wc_magic_spell_events.6001.desc.Knight_Errant:0 "unused"
 wc_magic_spell_events.6001.desc.Charioteer:0 "unused"
 wc_magic_spell_events.6001.desc.Hunter:0 "You are stalking an animal through the brush, but cannot help the feeling that you are being watched. Just as you nock an arrow and pull the string of your bow, something knocks you to the ground and you feel gigantic jaws clamp around your neck...\n\n"
 wc_magic_spell_events.6001.desc.Traveler:0 "You are at a fork in your route, faced with a choice. The right path leads to a treacherous cliffside, where one wrong step could spell death. The left path leads to a forested valley known to be beset with bandits...\n\n"
 wc_magic_spell_events.6001.desc.Hastiluder:0 "You are preparing for a tournament, and polishing your armor, when you notice that a critical buckle is missing. You search and search but cannot find it. The call for contestants goes out...\n\n"
 wc_magic_spell_events.6001.desc.Governor:0 "You stand on a high tower in the dead of night, admiring a gorgeous red glow in the nighttime clouds. As your eyes settle down to the land, you realize your eyes are cast across yout own domain. Every town is on fire...\n\n"
 wc_magic_spell_events.6001.desc.Gallowsbait:0 "Footsteps echo through a dark dungeon, an enshadowed guard slips something through the bars of your cell— A key! You scramble to fit your wrists through the bars and the key into the lock; but can't get it to fit. Laughter echoes down the hall and pierces yout soul...\n\n"

  # Sentence 4 - Outcomes
 wc_magic_spell_events.6001.desc.heroism:0 "A glow begins to emnate from your skin, emnating out from a warmth in your chest. You are filled with a glow that tingles every nerve ending, giving you the strength to move on and put your life on the line." # +2 all stats
 wc_magic_spell_events.6001.desc.power:0 "Suddenly, glints of blue light rise around you like sparks rising from a flame. Each spark wobbles as if caught in a magnetic field, and suddenly the glinting specacle has organized itself into orderly lines that lead into the center of your chest." # +25% Mana conductivity, -25% Spell Cooldown
 wc_magic_spell_events.6001.desc.enlightenment:0 "With a start, your head begins to spin. The world around you begins to shift and you realize it is you shifting it with your will. You organize an image in your mind and take control of your vision." # +15% lifestlye exp gain
 wc_magic_spell_events.6001.desc.foresight:0 "A pool opens up beneath your feet and you fall into a dark sea. Around you, the people you know are floating in the half-light, connected by strings of black bubbles. You see and trace the lines that end with you to people whose faces burn themselves into your memory." # +15% Scheme Power, -15% Hostile Scheme Power
 wc_magic_spell_events.6001.desc.recognition:0 "Suddenly, a hand touches your shoulder. You are in a room with your family, friends, everyone important to you. One after another they put a hand on your shoulder, and you feel the favor of [ROOT.Char.GetFaith.CreatorName] shine within you." # +10% monthly prestige and piety
 wc_magic_spell_events.6001.desc.charisma:0 "Suddenly you are suspended in midair, whipped by cold winds. The faces of your people peer up at you from below a thin veil, you feel a force emnate from their collective gaze, higher and higher into the golden sun that warms your soul." # +15 general opinion, +15% levy reinforcement rate, +15% supply gain

 wc_magic_spell_events.6001.opt.a:0 "The blood of Neptulon flows through me!"


 wc_magic_spell_events.4000.title:0 "Nature's Devastation"
 wc_magic_spell_events.4000.desc:0 "My rewilding ritual has taken effect! People flee from [this_recipient.GetFirstNamePossessive] realm, as the land turns barren. The trees wither, the rivers dry up, and the animals flee. The land is now slowly being consumed by the wilds, and I reap all the benefits."
 wc_magic_spell_events.4000.a:0 "The wilds are mine to control."

 wc_magic_spell_events.4001.desc:0 "[caster.GetFirstName] has cast a powerful spell on my lands, seemingly stealing the fruits of my labor. The trees have begun to wither, while [caster.GetHerHis] own lands flourish. Hard times come upon us..."
 wc_magic_spell_events.4001.a:0 "Curses!"