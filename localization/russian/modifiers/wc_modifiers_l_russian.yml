 wc_troll_mogu_pact_zandalari_modifier: "Договор могу и Зандалара"
 wc_troll_mogu_pact_zandalari_modifier_desc: "Зандаларский [ruler|El] из этой [Concept( 'dynasty', 'династии' )|E] воскресил [Concept( 'thunder_king', 'Властелина Грома' )|E].\n\nОн может призвать его на оборонительную [Concept( 'war', 'войну' )|E] один раз за каждый оставшийся показатель этого [Concept( 'modifier', 'модификатора' )|E] через [Concept( 'character_interaction', 'взаимодействие персонажа' )|E]."
