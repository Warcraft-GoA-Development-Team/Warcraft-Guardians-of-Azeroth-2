magic_secret.1011.title: "Пользователь запретной магии!"

magic_secret.1011.desc: "bruh"
magic_secret.1011.desc.liege: "Выяснилось, что [secret_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] — [secret.Custom2('GetMagicSecretColloquialism', ROOT.Char)]! Это преступление покрывает позором мою державу, но решать, наказывать ли этого преступника, предстоит мне."
magic_secret.1011.desc.family: "Выяснилось, что [secret_owner.Custom2('MyCharacterIntroduction', ROOT.Char)] — [secret.Custom2('GetMagicSecretColloquialism', ROOT.Char)]! Это преступление покрывает позором всю нашу семью, и теперь мне предстоит решить, как отреагировать на этот поворот событий..."

# обычный
magic_secret.1011.opt.a.hostile: "Чума на этого себялюбивого глупца!"
magic_secret.1011.opt.a.sympathetic: "Нужно убедиться, что та же участь не постигнет меня..."
magic_secret.1011.opt.a.indifferent: "Тьфу, нам больше не о чем посудачить?"

# сюзерен — бросить в темницу
magic_secret.1011.opt.b: "Бросьте этого богохульника в темницу!"

# семья — осудить
magic_secret.1011.opt.c: "Наша семья осуждает эту безрассудную магию!"

# семья — поддержать
magic_secret.1011.opt.d: "Несомненно, [secret_owner.Custom2('GetSheHe', ROOT.Char)] имеет на то [secret_owner.Custom2('GetHerHis', ROOT.Char)] причины!"

# соискатель
magic_secret.1011.opt.e: "bruh"
