 twilights_hammer_cult:0 "Marteau du crépuscule"
 twilights_hammer_cult_adj:0 "du Crépuscule"
 twilights_hammer_cult_adherent:0 "sectateur du Crépuscule"
 twilights_hammer_cult_adherent_plural:0 "sectateurs du Crépuscules"
 twilights_hammer_cult_desc:0 "Le $twilights_hammer_cult$ est un culte apocalyptique et nihiliste, fanatiquement dévoué aux Dieux très anciens. Leur vision du monde rejette toute notion de sens dans l'univers, affirmant que l'inévitable destin de l'existence est d'être consumée par les ténèbres. Violents et destructeurs, ils cherchent à accélérer la fin du monde afin de réaliser leur sombre prophétie. Certains croient même qu'ils sont destinés à régner aux côtés de leurs maîtres après #italic l'Heure du Crépuscule#!."
 cthunism:0 "C'Thunisme"
 cthunism_adj:0 "c'thuni"
 cthunism_adherent:0 "c'thuni"
 cthunism_adherent_plural:0 "c'thunis"
 cthunism_desc:0 "C'Thun est le dieu de la folie et du chaos, et le plus puissant des Dieux très anciens après la mort d'Y'Shaarj. Cette entité infiniment malveillante incarne une violence implacable, répandant le chaos avec une terrifiante brutalité plutôt que par subtilité. Ses enfants qiraji reflètent sa nature, semant destruction et folie partout où ils passent."
 cthunism_divine_realm:0 "le royaume de l'aliénation"
 cthunism_divine_realm_2:0 "au royaume de l'aliénation"
 cthunism_divine_realm_3:0 "du royaume de l'aliénation"
 cthunism_religious_text:0 "la Prophétie de $shathgral_good_god_cthun$"
 cthunism_religious_text_2:0 "à la Prophétie de $shathgral_good_god_cthun$"
 cthunism_religious_text_3:0 "de la Prophétie de $shathgral_good_god_cthun$"
 yoggsaronism:0 "Yogg-Saronisme"
 yoggsaronism_adj:0 "yogg-saroni"
 yoggsaronism_adherent:0 "yogg-saroni"
 yoggsaronism_adherent_plural:0 "yogg-saronis"
 yoggsaronism_desc:0 "Yogg-Saron est le dieu de la mort et du destin. Depuis sa prison d'Ulduar, en Norfendre, il a libéré d'innombrables horreurs sur Azeroth. Son plus grand triomphe est la malédiction de la chair, qui a corrompu les êtres forgés par les Titans et les a plongés dans des conflits sans fin. Pour ses adeptes, la chair n'est pas une malédiction, mais un don sacré de transformation."
 yoggsaronism_divine_realm:0 "l'Esprit de $shathgral_good_god_yoggsaron$"
 yoggsaronism_divine_realm_2:0 "à l'Esprit de $shathgral_good_god_yoggsaron$"
 yoggsaronism_divine_realm_3:0 "de l'Esprit de $shathgral_good_god_yoggsaron$"
 yoggsaronism_religious_head_title_male:0 "Héraut"
 yoggsaronism_religious_head_title_female:0 "$yoggsaronism_religious_head_title_male$"
 nzothism:0 "N'Zothisme"
 nzothism_adj:0 "n'zothi"
 nzothism_adherent:0 "n'zothi"
 nzothism_adherent_plural:0 "n'zothis"
 nzothism_desc:0 "N'Zoth est le plus faible des Dieux très anciens, mais sa ruse et sa corruption font de lui le plus perfide. Connu comme le dieu des profondeurs, il fut scellé sous le cercle des étoiles, une prison désormais engloutie sous les flots, après la mort d'Y'Shaarj. Pourtant, il continue de manipuler le monde à travers ses murmures, guidant ses adeptes à vénérer la tromperie et le changement."
 nzothism_divine_realm:0 "les Visions de $shathgral_good_god_nzoth$"
 nzothism_divine_realm_2:0 "aux Visions de $shathgral_good_god_nzoth$"
 nzothism_divine_realm_3:0 "des Visions de $shathgral_good_god_nzoth$"
 yshaarjism:0 "Y'Shaarjisme"
 yshaarjism_adj:0 "y'shaarji"
 yshaarjism_adherent:0 "y'shaarji"
 yshaarjism_adherent_plural:0 "y'shaarjis"
 yshaarjism_desc:0 "Y'Shaarj était le plus puissant et le plus malveillant des Dieux très anciens, connu comme la \"bête à sept têtes\". Chacune de ses têtes représente un de ses aspects : la colère, la haine, la violence, la peur, le doute, le désespoir et l'orgueil. Lorsque Aman'Thul l'arracha à la croûte terrestre, le monde lui-même fut profondément meurtri. Dans son dernier souffle, il libéra les sha, des échos malveillants de son essence."
 yshaarjism_divine_realm:0 "le Royaume d'$shathgral_good_god_yshaarj$"
 yshaarjism_divine_realm_2:0 "au Royaume d'$shathgral_good_god_yshaarj$"
 yshaarjism_divine_realm_3:0 "du Royaume d'$shathgral_good_god_yshaarj$"
 ghuunism:0 "G'huunisme"
 ghuunism_adj:0 "g'huuni"
 ghuunism_adherent:0 "g'huuni"
 ghuunism_adherent_plural:0 "g'huunis"
 ghuunism_desc:0 "G'huun est le dieu du sang et de la pourriture, une entité qui n'est pas née du Vide comme ses semblables, mais créée par inadvertance par les titans dans leur tentative de résoudre le problème des Dieux très anciens. Contrairement à ses congénères, G'huun méprise la technologie, entraînant ses adeptes dans un état primitif. Ceux qui sont touchés par sa corruption sont considérés comme ses enfants bien-aimés, liés à lui par le sang et la décomposition."
