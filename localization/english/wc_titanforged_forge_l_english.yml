l_english:
 wc_titanforged_forge.0010.title:0 "Foundations for the Settlers"
 wc_titanforged_forge.0010.desc:0 "In [county.GetName], the first Earthen stand among heaps of uncut stone, waiting for the beams that will roof their workshops. Across the road, local builders have stacked timber for repairs of their own. There is enough to begin, but it already belongs to someone.\n\nMy Marshal holds out two proposals: buy the materials, or send soldiers to take them. The first costs gold. The second will leave the neighbors watching our new settlement with empty yards and bitter memories."
 wc_titanforged_forge.0010.pay:0 "Pay the suppliers."
 wc_titanforged_forge.0010.requisition:0 "Requisition the materials."
 wc_titanforged_forge.0020.title:0 "Who Commands the Work?"
 wc_titanforged_forge.0020.desc:0 "At a road junction in [county.GetName], an Earthen work crew has begun laying out a straight approach to its workshops. The route cuts through ground the neighboring village uses on market days. By noon, tools lie idle while both sides wait for someone to settle the matter.\n\nMy Marshal can arrange for the two communities to share the work and keep their own institutions. That will need further funding. Giving the Earthen authority over the county would end such disputes on their terms, but the inhabitants would lose far more than a strip of market ground."
 wc_titanforged_forge.0020.coexist:0 "Fund shared works; preserve both communities."
 wc_titanforged_forge.0020.dominant:0 "Give the Earthen authority over the county."
 wc_titanforged_forge.coexist_tt:0 "#S Coexistence — upon completion#!\n$BULLET_WITH_TAB$Pay #V 75#! [gold|E]\n$BULLET_WITH_TAB$Local [culture|E] and [faith|E] preserved\n$BULLET_WITH_TAB$[development|E] loss: at most #N 1#!\n$BULLET_WITH_TAB$While served by a forge: [GetModifier('wc_titanforged_served_coexistence_modifier').GetNameWithTooltip] (#P +10%#! development growth)\n\n$wc_titanforged_forge.settlement_completion_tt$"
 wc_titanforged_forge.dominant_tt:0 "#S Earthen administration — upon completion#!\n$BULLET_WITH_TAB$County adopts $titanforged$ [culture|E] and $mystery_of_the_makers$ [faith|E]\n$BULLET_WITH_TAB$[development|E] loss: #N 50%#!, rounded up\n$BULLET_WITH_TAB$[GetModifier('wc_titanforged_displaced_institutions_modifier').GetNameWithTooltip] for #V 10 years#! (#N −20#! [county_opinion|E])\n$BULLET_WITH_TAB$While served by a forge: [GetModifier('wc_titanforged_served_dominant_modifier').GetNameWithTooltip] (#P +10%#! [levies|E])\n\n$wc_titanforged_forge.settlement_completion_tt$"
 wc_titanforged_forge.0030.title:0 "The Last Crews"
 wc_titanforged_forge.0030.desc:0 "The Earthen workshops of [county.GetName] are ready to receive their neighbors' workers. Together they will finish the roads and stores that both communities have agreed to share. Tools are laid out, but the crews cannot begin the last stretch until I release the promised funds.\n\nMy Marshal is waiting to send word. If I delay, the work will stand unfinished."
 wc_titanforged_forge.0030.finish:0 "Fund the last of the shared works."
 wc_titanforged_forge.0030.wait:0 "The crews must wait."
 wc_titanforged_requisitioned_installations_modifier:0 "Requisitioned Materials"
 wc_titanforged_requisitioned_installations_modifier_desc:0 "Local supplies were seized to build the Earthen settlement."
 wc_titanforged_served_coexistence_modifier:0 "Connected Earthen Workshops"
 wc_titanforged_served_coexistence_modifier_desc:0 "Forge supplies sustain the workshops shared by Earthen settlers and local communities."
 wc_titanforged_served_dominant_modifier:0 "Connected Earthen Administration"
 wc_titanforged_served_dominant_modifier_desc:0 "Forge supplies sustain the county's Earthen administration and levies."
 wc_titanforged_forge.arcane:0 "Build arcane workings for the county."
 wc_titanforged_forge.arcane_tt:0 "#S Arcane workings#!\nThe initial payment is #N non-refundable#!. Work proceeds at normal speed and stops if forge service is lost. A directly owned forge must serve this county from here or a fully controlled land neighbor.\n\n#S Upon completion#!\nLocal [culture|E] and [faith|E] remain unchanged. The county gains [GetModifier('county_corruption_arcane_modifier').GetNameWithTooltip]: [county_opinion|E] and [development|E] growth rise or fall with arcane affinity, as determined by doctrines and traits.\n\n#S Upkeep and risk#!\n$BULLET_WITH_TAB$Without forge service: [GetModifier('wc_titanforged_unserved_arcane_modifier').GetNameWithTooltip] (#N −10#! popular opinion; #N −10%#! taxes)\n$BULLET_WITH_TAB$Each year: #V 15%#! chance of an incident in one of your maintained enchantments\n$BULLET_WITH_TAB$Resolve an incident by paying #V 75#! [gold|E], or dismantling the affected enchantment at a cost of #N 10#! [control|E]\n$BULLET_WITH_TAB$Outside an incident, you may review and dismantle an enchantment without paying gold or losing control"
 wc_titanforged_forge.0040.title:0 "An Unsteady Current"
 wc_titanforged_forge.0040.desc:0 "A flash runs along the arcane workings in [county.GetName], followed by a crack sharp enough to send the nearest workers scrambling back. The attendants clear the site. Until the damaged workings are made steady, no one is willing to approach them.\n\nThe repairs will need fresh materials and skilled hands. I can fund them, or have the enchantment broken apart in haste. Either way, the people waiting beyond the barriers need an answer."
 wc_titanforged_forge.0040.stabilize:0 "Fund the repairs. Make the workings safe."
 wc_titanforged_forge.dismantle:0 "Dismantle the enchantment."
 wc_titanforged_forge.0060.title:0 "The Workings of [county.GetNameNoTier]"
 wc_titanforged_forge.0060.desc:0 "The attendants in [county.GetName] have cleared a path through the arcane workings for an inspection. Here they can separate each part in turn, letting its power ebb before removing it.\n\nI may leave the enchantment in place, or order this careful withdrawal. With time to do the work properly, dismantling will cost neither gold nor control."
 wc_titanforged_forge.0060.keep:0 "Keep it in service."
 wc_titanforged_unserved_arcane_modifier:0 "Unsupported Arcane Workings"
 wc_titanforged_unserved_arcane_modifier_desc:0 "Without forge supplies, the arcane workings burden the county's inhabitants and revenues."
 wc_titanforged_review_enchantments_decision:0 "Review Forge Enchantments"
 wc_titanforged_review_enchantments_decision_desc:0 "Review each forge enchantment in the counties I fully control. I may retain each one or dismantle it at no cost."
 wc_titanforged_review_enchantments_decision_tooltip:0 "Review controlled forge enchantments, county by county"
 wc_titanforged_review_enchantments_decision_confirm:0 "Inspect the workings"
 WC_TITANFORGED_ORDERING_DUCHY_CB_NAME:0 "Ordering of [TITLE.GetBaseName]"
 WC_TITANFORGED_ORDERING_KINGDOM_CB_NAME:0 "Greater Ordering of [TITLE.GetBaseName]"
 WC_TITANFORGED_ORDERING_WAR_NAME:0 "$ORDER$ [ATTACKER.GetPrimaryTitle.GetAdjective] Ordering of [TITLE.GetBaseName]"
 WC_TITANFORGED_ORDERING_WAR_NAME_BASE:0 "[ATTACKER.GetPrimaryTitle.GetAdjective] [DEFENDER.GetPrimaryTitle.GetName]"
 wc_titanforged_ordering_duchy_cb:0 "Ordering Conquest"
 wc_titanforged_ordering_kingdom_cb:0 "Greater Ordering Conquest"
 wc_titanforged_forge.0050.title:0 "The Work After Victory"
 wc_titanforged_forge.0050.desc:0 "Our banners stand over the captured settlements. Along the roads, people are bringing carts out of hiding and testing whether it is safe to travel again. They still speak their own tongues and gather at their own places of worship. Victory has given me authority over them; it has not remade their lives.\n\nMy Marshal waits beside the campaign map. We can begin work in a county I fully control. Where our forges can supply it, an Earthen settlement or arcane workings may follow. First I must choose where to send the Marshal, and what to ask of the people there."
 wc_titanforged_forge.0050.a:0 "Let us choose where the work begins."
 wc_titanforged_ordering_on_victory_desc_tt:0 "The attacker conquers the defender's lands within the target's de jure borders. County culture and faith remain unchanged."
 wc_titanforged_ordering_on_white_peace_desc_tt:0 "No land changes hands. The attacker loses prestige and a truce follows."
 wc_titanforged_ordering_on_defeat_desc_tt:0 "No land changes hands. The attacker loses prestige and pays reparations to the defender."
 wc_titanforged_ordering_target_tt:0 "Conquer the defender's territory within this de jure target. Vassals transfer only if their entire subrealm lies within it."
 wc_titanforged_forge.0020.upgrade:0 "The Earthen workshops of [county.GetName] have long shared their roads with the surrounding villages. Now the crews I sent back are ready to extend the settlers' authority beyond the workshop gates.\n\nMy Marshal brings the village elders' answer. They know what is at stake: their customs, their worship, and their say in how the county is run. The work can go forward under Earthen institutions, but the agreement that once let both communities live beside one another will end."
 wc_titanforged_forge.settlement_completion_tt:0 "Corruption is removed. Gain [GetModifier('wc_titanforged_reordered_county_control_growth_modifier').GetNameWithTooltip] for #V 5 years#!.\nForge-dependent benefits lapse without service. Titles and officeholders remain in place; this settlement makes no new promise of autonomy."
