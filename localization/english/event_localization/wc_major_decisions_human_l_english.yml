# Defias Brotherhood Decisions
 wc_defias_brotherhood.0001.title:0 "A Dish named Justice"
 wc_defias_brotherhood.0001.desc:0 "The Nobles have lost and their armies lie in disarray and we stand taller than ever. Now is the chance to strike down the Nobles and their corrupt system while the iron is hot!\n\nWe can empty their coffers beyond repair and let these dogs die whimpering and begging for others to help them out of it. A lesson well taught. A payment done with interest.\n\nBut reaching this victory wasn't easy. We had to live like bandits, thieves and pillagers and act like lowly scum to merely survive. Our fellow peasants who rised to fight with us for their freedom have fought well and died well. Blood sweat and tears... that's all that we have suffered through... and now maybe only Nobles' blood will finish it."
 wc_defias_brotherhood.0001.a:0 "Make them pay our deserved dues"
 wc_defias_brotherhood.0001.b:0 "Burn it all Down!!!"

 wc_defias_brotherhood.0002.title:0 "Power and Blood"
 wc_defias_brotherhood.0002.desc:0 "Slaughtered them all like animals they are. Our fury has reached far and wide across the Kingdom. The Nobles are either no more or left in ruins, the consequence of testing the common man as fodder.\n\nThe loyalists for our cause rise across our kings and our numbers grow! Fellows are ready to take arms and fight tooth and nail to defeat what remains of pretender Dukes and Kings.\n\nOr maybe there is another way? Instead of chaos and anarchy, the people would let us lead them? They love us. We have liberated them. Plunging our lands further into chaos would only mean more outside invasions by those filthy orcs or evil forces lurking around. Maybe it is time for the throne of Kingdom of Stormwind to have a new bloodline forged."
 wc_defias_brotherhood.0002.a:0 "After all, why not take it for ourselves?"
 wc_defias_brotherhood.0002.b:0 "Down with the Kings and Queens!"
 defias_league:0 "Will of the Downtrodden"
