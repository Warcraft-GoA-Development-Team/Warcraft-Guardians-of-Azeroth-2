l_english:
 wc_crisis_events.0100.title_pandaria:0 "The end of the Thunder King"
 wc_crisis_events.0100.title_horde:0 "The Horde Vanquished"
 wc_crisis_events.0100.title_scourge:0 "The end of the Scourge"
 wc_crisis_events.0100.title_burning_legion:0 "Legion Invasion Ends"
 wc_crisis_events.0100.title_black_empire:0 "The Black Empire Defeated"
 wc_crisis_events.0100.title:0 "Crisis Averted"
 wc_crisis_events.0100.desc:0 "After long, tireless efforts, a threat to my realm as we know it has been culled. Countless lives were lost in the process, but Azeroth may know peace for a time."
 wc_crisis_events.0100.desc_pandaria:0 "[crisis_leader.GetNamePossessive] reign has ended! Pandaria is free from the shackles of the Mogu king. His Zandalari allies turn to hiding in the shadows, as their risen king's empire slowly crumbles."
 wc_crisis_events.0100.desc_horde:0 "The Orcish Horde's efforts have been stopped. Those warlords who sought to disrupt the peace of Azeroth have been defeated. [crisis_leader.GetFirstName] cowers in embarrassment, as the Horde's enemies celebrate their victory.\n\nThe refugees from Draenor still remain, however, and the their future is uncertain..."
 wc_crisis_events.0100.desc_scourge:0 "[crisis_leader.GetNamePossessive] reign of terror has been put to an end. Many cities and towns across Azeroth were ravished by plague, many still inhabited by their now-undead citizens.\n\nBut, even with this victory, the undead still roam the land, some becoming rulers of their own. Their presence will forever be a reminder of the lives lost to the Scourge, but some may prove beneficial to the living."
 wc_crisis_events.0100.desc_burning_legion:0 "TODO"
 wc_crisis_events.0100.desc_black_empire:0 "TODO"
 wc_crisis_events.0100.opt_pandaria:0 "A new age for Pandaria!"
 wc_crisis_events.0100.opt_horde:0 "Victory!"
 wc_crisis_events.0100.opt_scourge:0 "The stench of death lingers..."
