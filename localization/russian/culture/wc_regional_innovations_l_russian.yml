  # High Medieval Era # 
  ##################### 
  
 innovation_kalimdor_settling: "Великий Путь"
 innovation_kalimdor_settling_desc: "Земли Центрального и Южного Калимдора малонаселённы, но богаты своими природными ресурсами. Инициатива по расширению и созданию там новых поселений приведёт к росту и процветанию нашего народа."
  
  ################# 
  # Men- at -Arms # 
  ################# 
  
  #Tribal 
 innovation_gryphon: "Приручение грифонов"
 innovation_gryphon_desc: "Грифоны — величественные небесные создания, и, как и виверны, они больше, чем просто звери. Они умны, а также хитры. Наши укротители успешно научились общаться и приручать этих летающих существ."
  
 innovation_kodo: "Приручение кодо"
 innovation_kodo_desc: "Тауренские легенды полны историй про огромных рогатых кодо из Степей Калимдора. В некоторых мифах рассказывается о редких кодо, которые были связаны с духами неба и шторма, что позволяло этим могучим созданиям призывать силу молнии. Хотя кодо обычно считаются миролюбивыми по своей природе, они становятся яростными противниками, когда им угрожают, и иногда даже могут проглотить своего обидчика целиком. Наши укротители успешно научились общаться и приручать этих великих существ."
  
 innovation_wyvern: "Приручение виверн"
 innovation_wyvern_desc: "Виверны имеют общее происхождение как с драконами, так и с грифонами и родом из самых суровых регионов Калимдора. Наши укротители успешно научились общаться и приручать этих летающих существ."
  
 innovation_arachnathid: "Приручение арахнитидов"
 innovation_arachnathid_desc: "Злобные и хитрые арахнитиды - одни из самых опасных существ Нордскола. Они идеальные стражи для нашего народа, поскольку живут с нами под землей и очень территориальны. Наши укротители сообщают, что они хорошо поддаются дрессировке и, вероятно, станут грозными помощниками."
  
 innovation_dragonhawk: "Приручение дракондоров"
 innovation_dragonhawk_desc: "Дракондоры давно стали символом Кель'Таласа: величественные, мощные и смертоносные, когда их провоцируют. Наш народ установил с ними прочную связь, и если нашим укротителям удастся приручить их, эта связь может только усилиться."
  
 innovation_mushan: "Приручение мушанов"
 innovation_mushan_desc: "Как и их сородичи кодо, мушаны часто используются жителями Пандарии в качестве тягловых животных. Несмотря на это, мы считаем, что они могут быть не менее ценными в войне, и наши укротители начали обучать мушанов носить доспехи и наездников."
