 mrligion_religion_desc:0 "C'est la religion traditionnelle des murlocs, où les chamans mettent en avant la puissance des marées et des esprits qui y résident. Bien que les rituels soient souvent désorganisés, c'est l'intention derrière leur culte qui revêt la plus grande importance. Les étrangers ont généralement du mal à comprendre ces croyances, car chaque tribu possède sa propre interprétation unique."

