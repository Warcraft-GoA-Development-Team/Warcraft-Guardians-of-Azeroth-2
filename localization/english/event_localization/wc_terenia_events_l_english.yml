l_english:

 personal_adventure.001.t:0 "Calia's Concern"
 personal_adventure.001.desc:0 "Rumors of an unsettling illness in Lordaeron stir anxiety within me. The wellbeing of my family weighs heavily on my mind, especially as my father remains unaware of his grandchild's existence. It's a difficult decision, but I must send my husband and daughter away for their safety. Holding my daughter close, I am reminded of her innocence, which brings to mind brighter days. 'Stay strong, love,' I whisper softly, 'Our hearts will always be intertwined, no matter the distance.' Their departure looms like a dark cloud over the uncertain future. But where should I send them?"
 personal_adventure.001.a:0 "Quel'Thalas"
 personal_adventure.001.b:0 "Farther south to Stromgarde"
 personal_adventure.001.c:0 "Stormwind"
 personal_adventure.001.d:0 "Kul Tiras"
 personal_adventure.001.e:0 "Let her father choose, I will focus on my own affairs"
 personal_adventure.001.e.tooltip:0 "You keep #P playing#! as #high Calia#!"
 custom_lordaeron_refugees:0 "Lordaeron Refugees"
 custom_lordaeron_refugees_adj:0 "Lordaeronian"

 personal_adventure.002.t:0 "My Path, My Choice"
 personal_adventure.002.intro:0 "Recently, I turned six, and now it's time for me to choose who will teach me about the world. This decision feels significant, as if it's going to change everything.\n\n"
 personal_adventure.002.uther.lich_king:0 "Uther, who once mentored Arthas before his tragic descent into the Lich King. His guidance could teach me about honor and the path of the Light.\n\n"
 personal_adventure.002.uther.normal:0 "Uther, known for his mentorship of Arthas. A paragon of honor and righteousness, his teachings could guide me in upholding the Light as they did for my uncle.\n\n"
 personal_adventure.002.tirion:0 "Tirion Fordring, a paladin of great renown. His wisdom could teach me about honor, justice, and the strength of will.\n\n"
 personal_adventure.002.alexstrasza:0 "Alexstrasza, the Life-Binder, is all about protecting life. Learning from her could teach me compassion and caring.\n\n"
 personal_adventure.002.sylvanas:0 "Sylvanas is strong and smart. Learning from her could teach me resilience and strategy.\n\n"
 personal_adventure.002.vereesa:0 "Vereesa Windrunner, skilled in archery and a leader of the Silver Covenant. Her guidance could show me the importance of precision and determination.\n\n"
 personal_adventure.002.top_liege:0 "Our supreme sovereign, a figure of great power and wisdom, could guide me in mastering leadership and the art of governance. [Select_CString(teacher_3.IsFemale, 'Her', 'His' )] mentorship will be invaluable in preparing me to rule Lordaeron one day.\n\n"
 personal_adventure.002.scarlet:0 "Someone from the Scarlet Crusade might be very determined and sure. They could teach me conviction and strength.\n\n"
 personal_adventure.002.father:0 "My dad, the person I trust the most, has always been there for me. He could teach me about our family's values and legacy.\n\n"
 personal_adventure.002.end:0 "Each path has its merits, but which will lead me to my true destiny?"
 personal_adventure.002.a:0 "[teacher_1.GetFirstNameNoTooltip] [teacher_1.GetHouse.GetNameNoTooltip]"
 personal_adventure.002.b:0 "[teacher_2.GetFirstNameNoTooltip] [teacher_2.GetHouse.GetNameNoTooltip]"
 personal_adventure.002.c:0 "[teacher_3.GetFirstNameNoTooltip] [teacher_3.GetHouse.GetNameNoTooltip]"
 personal_adventure.002.d:0 "[teacher_4.GetFirstNameNoTooltip] [teacher_4.GetHouse.GetNameNoTooltip]"
 personal_adventure.002.e:0 "Daddy!"

 rival_seduced_my_daughter:0 "[TARGET_CHARACTER.GetShortUIName|U] seduced [CHARACTER.GetShortUIName|U]'s daughter"
 rival_seduced_my_daughter_corresponding:0 "[CHARACTER.GetShortUIName|U] seduced [TARGET_CHARACTER.GetShortUIName|U]'s daughter"
 personal_adventure.003.t:0 "The Hidden Truth Unveiled"
 personal_adventure.003.desc:0 "My mother reveals my existence to grandfather. I am the child of a secret union, a hidden part of this noble lineage. How will grandfather react to learning about me? Will he see me as a rightful heir or a blemish on our family's honor?"
 personal_adventure.003.a:0 "Gr.. Grandfather?.."

 personal_adventure.004.t:0 "A Father's Dilemma"
 personal_adventure.004.desc:0 "Today, Calia approached me with a revelation that shook the very foundation of our family. The existence of Terenia, her daughter and my granddaughter, a product of a secret marriage. My emotions are torn between feelings of betrayal and the unexpected joy of having another descendant."
 personal_adventure.004.a:0 "She is my granddaughter, and I accept her"
 personal_adventure.004.b:0 "I cannot accept this child"

 personal_adventure.005.t:0 "A Lesson in Mastery"
 personal_adventure.005.desc:0 "As the first rays of the morning sun pierce through the window shutters, I sense that today will be extraordinary. With each lesson, my teacher imparts not only knowledge but shapes my worldview. Today, [ROOT.Var('my_guardian').Char.GetSheHe] promised to unveil one of the greatest secrets of [ROOT.Var('my_guardian').Char.GetHerHis] mastery to me.\n\nUnder [ROOT.Var('my_guardian').Char.GetHerHis] vigilant gaze, I immerse myself in the teachings, trying to catch every detail, every nuance of [ROOT.Var('my_guardian').Char.GetHerHis] guidance. My attention is riveted to [ROOT.Var('my_guardian').Char.GetHerHis] words, while my hands automatically replicate the complex movements and patterns long ingrained in [ROOT.Var('my_guardian').Char.GetHerHis] craft.\n\nWhat will today's lesson bring? Will it be the art of strategy, the subtleties of diplomacy, or the secrets of combat mastery? My heart races in anticipation, for today might reveal something that forever alters my destiny.\n\nAs my teacher begins [ROOT.Var('my_guardian').Char.GetHerHis] discourse, I absorb every word. This day, undoubtedly, will leave an imprint on my soul, leading me to new heights in my journey."
 personal_adventure.005.a:0 "I will take these teachings to heart and strive to apply them in my life"
 
 personal_adventure.006.t:0 "Path of Learning"
 personal_adventure.006.desc:0 "As the sun rises over the kingdom, i embark on another day of learning and discovery. Under the guidance of my esteemed teacher, each day is a journey into new realms of knowledge and skill. Whether it's the art of diplomacy, the nuances of court intrigue, or the strategies of warfare, my mind absorbs lessons like a sponge.\n\nToday, my teacher has prepared a special lesson, one that promises to cultivate a particular talent within me. As i eagerly await the start of the lesson, i wonder what new skill i will master by the end of the day, shaping my path towards becoming a remarkable figure in the future."
 personal_adventure.006.a:0 "I am ready to learn and excel"
 
 personal_adventure.007.t:0 "The Warrior's Trial"
 personal_adventure.007.desc:0 "With each passing day, I feel myself growing stronger, both in body and spirit. My training under the guidance of my mentor is not just about learning to fight; it's about mastering the discipline and resilience of a true warrior.\n\nToday, [ROOT.Var('my_guardian').Char.GetSheHe] has prepared a challenging trial for me, a test to measure the prowess I have honed over these years. Holding my sword, I can feel the weight of this moment. This is more than a test; it's a rite of passage, a chance to prove to myself and to others that I am ready to face whatever challenges come my way."
 personal_adventure.007.a:0 "This is my moment to shine. Aaaaagh!"
 
 personal_adventure.050.t:0 "The Frostfall"
 personal_adventure.050.desc:0 "My sixteenth birthday marks a profound moment of legacy. In a secret meeting, the loyal remnants of our household present heirlooms salvaged from the ruins of Lordaeron. Among these treasured relics, I discover the Frostfall Armor, shimmering in the torchlight, a piece of history I never knew existed. The cold touch of the armor against my skin forges a connection to my lineage, its weight embodying the future I am to embrace. This armor, now revealed as a symbol of our enduring strength and hope, becomes my legacy to uphold."
 personal_adventure.050.a:0 "I accept this legacy"
 
 personal_adventure.055.t:0 "A Crossroads of Destiny"
 personal_adventure.055.desc.lorderon.northrend:0 "As one of the last descendants of the fallen House of Menethil, I face a daunting choice. Do I venture first to Northrend to confront the Lich King, earning glory and respect that could aid in the restoration of Lordaeron? Or should I focus first on reclaiming and fortifying the lands of Lordaeron, solidifying my rule and preparing for a more formidable battle against the Lich King?\n\nAs I stand at the dawn of my reign, the whispers of my destiny grow louder. The Lich King, a shadow looming over our world, beckons a challenge I cannot ignore. My heart yearns for vengeance and justice for Lordaeron, but I know the true threat lies in the icy North. This decision will shape not only my path but also the fate of our lands. Where shall I lead my people first?"
 personal_adventure.055.desc.lorderon:0 "As one of the last descendants of the fallen House of Menethil, I stand at a pivotal moment in our history. The legacy of my ancestors weighs heavily on my shoulders, calling me to restore the lost lands of Lordaeron. This mission is not just a path to reclaim our heritage, but a chance to heal the wounds of the past and revive the Menethil legacy. With determination and hope, I embark on this journey to bring back the glory of Lordaeron, fulfilling the destiny of my lineage."
 personal_adventure.055.desc.northrend:0 "As one of the last descendants of the fallen House of Menethil, I stand before a crucial decision. The echoes of my family's past call to me, urging me to venture to Northrend. There, the shadow of the Lich King, a menace to all life, must be confronted. It's a path fraught with peril, but I am driven by a duty to my ancestors and the need to seek justice. This journey will not only test my resolve but will also shape the future of our lands. With determination in my heart, I set out to Northrend, to face whatever destiny awaits."
 personal_adventure.055.desc.gohomefallback:0 "Years have unfolded since I last saw my mother, Queen Calia Menethil, and much has changed. With the Lich King vanquished and Lordaeron secure under my mother's reign, my path leads me to a long-awaited audience with her. Walking through the halls of our ancestral home, now vibrant and restored, I am reminded of both our shared past and the separate journeys we have taken. This reunion is more than a return; it is an opportunity to reflect on the roads traveled and the future that lies ahead. What insights will this meeting bring, and how will it shape the legacy we continue to build together?"
 personal_adventure.055.option_northrend:0 "To Northrend. It's time to end the Lich King's reign"
 personal_adventure.055.option_lordaeron:0 "To Lordaeron. Our ancestral lands call for restoration"
 personal_adventure.055.option_becomelandless:0 "Revenge, power, world... I am not interested"
 personal_adventure.055.option_gohomefallback:0 "To my mother. A reunion long overdue"
 
 personal_adventure.100.t:0 "The Empty Citadel"
 personal_adventure.100.desc:0 "As we approach Icecrown Citadel, an eerie silence greets us. The news of the Lich King's fall precedes our arrival, casting a bittersweet shadow over our mission. The air is thick with a mix of relief and uncertainty. We had prepared for a fierce battle, but now we stand at the threshold of a citadel without its master. Questions linger about the future and the fate of those once under the Lich King's thrall. This moment marks an end to an era of terror, but also the beginning of a new, uncertain chapter."
 personal_adventure.100.a:0 "Now.. home?"
 
 personal_adventure.101.t:0 "Arrival in Northrend"
 personal_adventure.101.desc:0 "The harsh winds of Northrend greet us as we step onto the frozen land. Under my leadership, our expedition quickly sets up the base camp, a solitary beacon in this icy wasteland. As we prepare for the upcoming battle with the Lich King, tension and determination fill the air. This is the beginning of our final stand against the darkness that has plagued our world."
 personal_adventure.101.desc.bonus:0 "\n\n#help (Lordaeron's armorers strengthen the expedition)#!"
 personal_adventure.101.a:0 "Our fate awaits us in this frozen land"
 personal_adventure.102.desc:0 "The harsh winds of Northrend greet us as we step onto the frozen land. The expedition, led by Terenia Menethil, quickly sets up the base camp, a solitary beacon in this icy wasteland. As we prepare for the upcoming battle with the Lich King, tension and determination fill the air. This is the beginning of our final stand against the darkness that has plagued our world."
 personal_adventure.102.a:0 "A daunting challenge lies before us"
 personal_adventure.103.desc:0 "News from the frozen lands of Northrend speaks of an audacious expedition led by Terenia Menethil. Brave souls have established a base camp in the heart of the icy wasteland, preparing for a pivotal confrontation with the Lich King. Tension and anticipation ripple across the world, marking the onset of a crucial battle against the darkness that threatens all of Azeroth."
 personal_adventure.103.a:0 "A crucial moment for Azeroth unfolds"
 
 personal_adventure.105.t:0 "Call to Northrend"
 personal_adventure.105.desc:0 "A messenger arrives bearing an invitation of great import. Terenia Menethil is assembling a formidable expedition to Northrend, with a singular goal: to confront and vanquish the Lich King. This is a call to arms for those brave enough to face the frozen horrors of the North and to partake in a battle that could change the course of history. Will you heed this call and join the ranks of those daring to challenge the darkness at its source?"
 personal_adventure.105.a:0 "I will join the fight"
 personal_adventure.105.b:0 "We are busy. Go away, kid"
 
 personal_adventure.106.t:0 "The Lich King Awaits"
 personal_adventure.106.desc:0 "A solemn silence envelops us as we stand before the Lich King. The chilling air is still, a calm before the impending storm of battle. Each warrior understands the gravity of this moment, aware that it could be their last. In this eerie quiet, only the cold, piercing gaze of the Lich King affirms that time has not frozen. The air crackles with anticipation and dread, as the final confrontation draws near."
 personal_adventure.106.a:0 "It's us or no one!"
 raid_member_died_sm.t:0 "Raid Member has died"
 raid_member_died_sm.desc:0 "[dying_person.GetShortUIName|U] was killed by the Lich King"
 personal_adventure.106.duel.failure:0 "The Lich King wins"
 
 personal_adventure.110.t:0 "The Fall of the Lich King"
 personal_adventure.110.desc:0 "In the aftermath of a grueling battle, the silence that falls over Icecrown is profound. The Lich King lies defeated, his reign of terror finally brought to an end. Exhausted yet triumphant, the warriors gather, their hearts heavy with the cost of victory, yet lightened by the dawn of a new era. This moment marks a turning point in history, the end of a long nightmare, and the beginning of a hopeful future."
 personal_adventure.110.a:0 "The nightmare ends; hope prevails!"
 
 personal_adventure.201.t:0 "The Scarlet Crusade's Offer"
 personal_adventure.201.desc:0 "An unexpected proposition surfaces, presenting an intriguing opportunity: the adoption of the scarlet ideology. Associated with the fervent Scarlet Crusade, this ideology could be a powerful ally in the struggle to reclaim Lordaeron. Yet, the zealous nature of the crusade stirs doubts. Embracing their doctrine might bring strength and support, but at what cost? The path is fraught with uncertainty – will this faith be a guiding light in the liberation of Lordaeron, or a flame that consumes all in its path?"
 personal_adventure.201.a:0 "I embrace their ideology"
 personal_adventure.201.b:0 "I reject this zealous creed"
 
 personal_adventure.202.t:0 "A Union of Strategy"
 personal_adventure.202.desc:0 "In the grand hall, emissaries from across the lands gather, each presenting a suitor for my Menethil's hand. Each proposal carries not just a promise of marriage, but a strategic alliance that could greatly benefit my future conquests. From noble lords to foreign princes, the choices are varied and intriguing. This decision is more than a matter of the heart; it's a crucial step in shaping the destiny of my dynasty."
 personal_adventure.202.a:0 "[SCOPE.sC('choice_1').GetFullNameNoTooltipRegnal]"
 personal_adventure.202.b:0 "[SCOPE.sC('choice_2').GetFullNameNoTooltipRegnal]"
 personal_adventure.202.c:0 "[SCOPE.sC('choice_3').GetFullNameNoTooltipRegnal]"
 personal_adventure.202.d:0 "[SCOPE.sC('choice_4').GetFullNameNoTooltipRegnal]"
 personal_adventure.202.e:0 "I shall marry when I so choose"
 
 personal_adventure.203.t:0 "Grand Embassy"
 personal_adventure.203.desc:0 "With the war for Lordaeron on the horizon, I take on a vital diplomatic mission. My Grand Embassy is not just a journey; it's a strategic move to gather support for the battles ahead. A list of influential leaders is laid out before me. Each one could be a potential ally, wielding the power to shift the balance in our favor. I'm set to negotiate, to form alliances, aiming to bring together a coalition strong enough to reclaim our homeland.\n\n"
 personal_adventure.203.a:0 "Begin preparations for the diplomatic mission"
 personal_adventure.203.b:0 "This idea is madness, cancel everything!"
 personal_adventure.203.desc.lich_king:0 "#help Number of visits: Base(3) + Defeated Lich King(2)#!"
 personal_adventure.203.desc.base:0 "#help Number of visits: Base(3) + Not Defeated Lich King(0)#!"
 
 personal_adventure.204.t:0 "[SCOPE.sC('terenia_menethil').GetFullNameNoTooltipRegnal]: negotiations"
 personal_adventure.204.desc:0 "The arrival of Terenia Menethil has sparked a buzz of intrigue at the court. A young lady proclaiming herself the heiress to the Lordaeron, she is gathering adventurers for her military campaign. She has personally come to our lands seeking support. She presents her ambitious plan to reclaim Lordaeron and promises generous rewards for support in the war. However, it also carries risks; we may end up losing money and men. Shall we take the risk?"
 personal_adventure.204.a:0 "You have my support.. and my army"
 personal_adventure.204.b:0 "Send this beggar girl away"
 
 personal_adventure.205.t:0 "[ROOT.Var('current_visiting').Char.GetFullNameNoTooltipRegnal]: negotiations"
 personal_adventure.205.desc:0 "[ROOT.Var('current_visiting').Char.GetShortUIName] is coming this afternoon. We have already prepared the most delicious food and flowers. We have to decide our approach to this person. The success of the negotiations will depend on it."
 personal_adventure.205.a:0 "This will benefit both us and you"
 personal_adventure.205.b:0 "Lets talk about the divinity of our mission"
 personal_adventure.205.c:0 "You owe my grandfather a favor"
 personal_adventure.205.success:0 "You get military and financial support"
 personal_adventure.205.success_noble:0 "Negotiations were successful"
 personal_adventure.205.failure:0 "Negotiations failed"
 
 personal_adventure.211.t:0 "The Menethil Restoration"
 personal_adventure.211.desc:0 "News spreads rapidly across the lands: Terenia Menethil has landed in Lordaeron. With a determination reflecting her noble lineage, she embarks on a daring mission to reclaim her ancestral domain. Her arrival stirs both hope and apprehension among the people. As she sets her sights on restoring the former glory of the kingdom, her actions signal a new chapter in Lordaeron's tumultuous history. This bold move marks the beginning of her campaign to bring back the glory of the Menethils."
 personal_adventure.211.a:0 "We shall closely watch her moves"
 
 personal_adventure.212.t:0 "The Conquest of Lordaeron"
 personal_adventure.212.desc:0 "Before me lies the map of Lordaeron, each region a piece of my future kingdom waiting to be reclaimed. The weight of my lineage presses upon my shoulders as I consider my next move. Do I strike swiftly at the heart of my enemies, or employ a more subtle strategy, undermining their power before they realize it? My decision here will not only shape the course of this war but will also define the legacy of the Menethil dynasty.\n\nIt is time to decide the future of Lordaeron."
 personal_adventure.212.a:0 "[SCOPE.sC('war_target_1').GetFullNameNoTooltipRegnal]"
 personal_adventure.212.b:0 "[SCOPE.sC('war_target_2').GetFullNameNoTooltipRegnal]"
 personal_adventure.212.c:0 "[SCOPE.sC('war_target_3').GetFullNameNoTooltipRegnal]"
 partisan_army_tt:0 "Local rebels"
 terenia_major_religious_war:0 "Menethil Restoration War"
 terenia_HOLY_WAR_KINGDOM_NAME:0 "Menethil Restoration War"
 terenia_RELIGIOUS_WAR_NAME:1 "Terenia's War for the Lordaeron"
 terenia_war_county_convert_tt:0 "Each conquered #V county#! has a 60% chance of being #P cleansed#! of the #V undead#!, by #N losing#! 70% of it's developement, and #P adopt#! your #V culture#! and #V faith#!."