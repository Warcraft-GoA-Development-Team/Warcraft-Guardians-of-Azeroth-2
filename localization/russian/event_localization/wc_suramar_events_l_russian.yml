 wc_suramar_events.0040.t: "Тоннели Фаланаара"
 wc_suramar_events.0040.desc: "[informant.GetFirstName] принес(ла) новости о скрытой сети тоннелей под [GetTitleByKey('c_meredil').GetName]. Говорят, что они обладают мощными линиями маны и могут оказаться крайне полезными для нас.\n\nХотя они бездействуют, [informant.GetSheHe|U] умоляет меня обратить внимание на ситуацию и отправиться в тоннели, чтобы выяснить, что там находится."
 wc_suramar_events.0040.desc_repeat: "\n\nЭто не первый раз, когда я слышу о подобном, возможно, настало время действовать..."
 wc_suramar_events.0040.a: "Я хотел(а) бы увидеть эти тоннели своими глазами."
 wc_suramar_events.0040.a_repeat: "Полагаю, выбора у меня нет."
 wc_suramar_events.0040.b: "Неплохо бы нанять охрану."
 wc_suramar_events.0040.c: "Мне всё равно на эту нору..."
  
 wc_suramar_events.0041.desc: "Я брожу по [ROOT.Char.GetCurrentLocation.Custom('GetTerrainTypePlural')] [ROOT.Char.GetCurrentLocation.GetName], ища вход в тоннели, как описал(а) [informant.GetFirstName].\n\nЧерез несколько часов поисков я понимаю, что потерял(а) из виду [informant.GetHerHim] и теперь заблудился(лась) в дикой природе."
 wc_suramar_events.0041.desc_guards: "К счастью, я нанял(а) помощников, и, возможно, [faldorei_guard.GetFirstName] сможет помочь в поисках."
 wc_suramar_events.0041.a: "Ах, не беспокойся, [informant.GetSheHe] найдёт меня."
 wc_suramar_events.0041.a_tt: "Ты продолжаешь поиски тоннелей"
 wc_suramar_events.0041.b: "Полагаю, мне придётся самому(ей) найти [informant.GetHerHim]..."
 wc_suramar_events.0041.c: "[faldorei_guard.GetFirstNameNoTooltip], давай разделимся."
  
 wc_suramar_events.0042.desc: "Туман на мгновение рассеялся, и воздух наконец стал свежим. Я ощущаю сильное магическое присутствие, как будто древняя сила зовёт меня.\n\nВдалеке я замечаю маленький, светящийся камень. Он пульсирует энергией, и я вынимаю его из земли, обнаруживая [newly_created_artifact.GetName].\n\nНе будучи уверенным, что с этим делать, я убираю безделушку в карман и продолжаю путь."
 wc_suramar_events.0042.a: "Может быть, [informant.GetFirstName] поймёт, что это такое."
  
 wc_suramar_events.0043.desc: "Я оказываюсь на поляне, передо мной — вход в тоннели. Воздух наполнен магией, и я чувствую, как линии маны пульсируют под моими ногами.\n\nВойдя внутрь, я слышу пронзительный визг вдали и замечаю [informant.GetFirstName] на расстоянии. Рядом с [informant.GetHerHim] существо с кожей, как лакрица, рычит. Существо настолько тощее, что почти скелетное, но его карикатура знакома нам.\n\nЭто вызывает дрожь в моих костях, но [informant.GetFirstNameNoTooltip] зависит от меня."
 wc_suramar_events.0043.a: "Я иду, [informant.GetFirstNameNoTooltip]!"
 wc_suramar_events.0043.b: "Стой, чудовище!"
 wc_suramar_events.0043.c: "Помоги, [faldorei_guard.GetFirstNameNoTooltip]!"
 wc_suramar_events.0043.d: "Прости, [informant.GetFirstNameNoTooltip], но я должен(на) выжить."
 wc_suramar_events.0043.success: "Существо подчинено"
 wc_suramar_events.0043.failure: "Существо побеждает тебя"
  
 wc_suramar_events.0044.desc_lost: "Существо неумолимо бьёт [informant.GetFirstName], и [informant.GetSheHe] падает на землю, дрожа от боли. Оно рычит на тело [informant.GetHerHis] и поворачивается ко мне. Оно визжит и уносится в дикую природу, как зверь."
 wc_suramar_events.0044.desc_won: "Мясной ужас, с которым мы столкнулись, не может сравниться с нами, и мы легко подавляем его первобытную силу. Оно поваливается на землю, протягивая руки в мольбе о пощаде."
 wc_suramar_events.0044.desc_left: "Я вбегаю в тоннель, бросая последний взгляд на [informant.GetFirstName]. Чувствую укол вины, но не могу потерять свою жизнь из-за этого зверя."
 wc_suramar_events.0044.desc: "\n\nТоннели прохладные и тёмные, как описал(а) [informant.GetFirstNameNoTooltip]. По стенам висят кристаллы маны, а полы потрескивают от энергии."
 wc_suramar_events.0044.desc_died: "В глубоком благоговении я наблюдаю, как [informant.GetFirstNameNoTooltip] делает свой последний вздох. Грусть охватывает меня. Неужели [informant.GetSheHe] умер(ла) напрасно?"
 wc_suramar_events.0044.desc_died_attacker: "\n\nНаш атакующий закашлялся и вскоре замолк. Глубоко внутри я чувствую облегчение, но он выглядит так похоже на нас. Что это могло быть?"
 wc_suramar_events.0044.desc_outro: "[informant.GetFirstName] тяжело вздыхает. "Фал'дореи," говорит [informant.GetSheHe], "Они наши родные, но были искривлены давным-давно. Они уже не те эльфы, которых мы знали." [informant.GetSheHe|U] рассказывает больше о дереве Аркан'дор, его порче и связи Фал'дореев с ним. [informant.GetSheHe|U] упоминает о семени в этих тоннелях и о том, что его ищут."
 wc_suramar_events.0044.desc_outro_solo: "Я остаюсь один(одна) в тоннелях, и только память о [informant.GetFirstName] утешает меня. Я вспоминаю слова [informant.GetSheHe|U] и упоминание о древнем семени, и о существах, охотящихся за ним. Их называли 'Фал'дореи'. Искажённые и извращённые эльфы, когда-то происходившие с нашей земли, зависимые от дерева Аркан'дор в отсутствие Найтвелла."
 wc_suramar_events.0044.desc_seed_solo: "\n\nПрежде чем я успеваю задуматься глубже, я вспоминаю о светящемся камне, который нашёл(ла) ранее. Не может ли это быть семенем, о котором говорил(а) [informant.GetFirstName]?"
 wc_suramar_events.0044.desc_seed: "\n\nЯ достаю светящийся камень из кармана. "Семя Аркан'дор!" — ахает [informant.GetFirstName]."
 wc_suramar_events.0044.a: "Этот камень... это семя?"
 wc_suramar_events.0044.a_alt: "Полагаю, пора возвращаться домой."
 wc_suramar_events.0044.a_tt: "Ты нашёл(нашла) то, что искал(искала) [informant.GetFirstName], и решил(решила) вернуться домой."
 wc_suramar_events.0044.b: "Эти кристаллы маны выглядят интересно..."
 wc_suramar_events.0044.b_success: "Ты берёшь с собой несколько кристаллов."
 wc_suramar_events.0044.b_tt: "Ты пытаешься взять с собой несколько кристаллов."
 wc_suramar_events.0044.b_fail: "Кристаллы рассыпались у тебя в руках."
 wc_suramar_events.0044.c: "Я начинаю голодать..."
 wc_suramar_mana_crystals_modifier: "Кристаллы маны"
 wc_suramar_mana_crystals_modifier_desc: "Этот персонаж нашёл тайник кристаллов маны в тоннелях."
 wc_suramar_events.0044.c_tt: "Ты пожираешь труп [corpse.GetFirstName]"
  
 wc_suramar_events.0050.t: "Тёмное предзнаменование"
 wc_suramar_events.0050.desc: "В последнее время мои сны преследуют кошмары, и я не могу избавиться от ощущения, что что-то не так. Тени становятся длиннее, а шепоты ночи звучат всё громче.\n\nОдин сон, в частности, потряс меня до глубины души: я вижу видения Тёмного Титана, Саргераса, и его горящего меча. Мир охвачен пламенем, и я бессилен его остановить. Он предлагает мне долю своей силы, которую когда-то даровал нашей королеве.\n\nОн рассказывает мне о своём плане вернуться в Азерот и говорит, что я должен быть на его стороне, иначе мой народ погибнет."
 wc_suramar_events.0050.a: "Мы будем на твоей стороне, Великий!"
 wc_suramar_events.0050.a_tt: "#EMP Будучи правителем [GetTitleByKey('k_suramar').GetName], твой народ, возможно, не #bold будет#! так охотно следовать за тобой по этому пути...#!"
 wc_suramar_events.0050.b: "Я буду следовать твоим словам, тихо."
 wc_suramar_events.0050.b_tt: "Ты тайно обращаешься в [GetFaithByKey('burning_legion_religion').GetName]"
 wc_suramar_events.0050.c: "Твои слова — яд, демон."
 wc_suramar_events.0050.c_alt: "Нет! Найтвелл — наше спасение!"
 wc_suramar_dark_titan_modifier: "Благословение Тёмного Титана"
 wc_suramar_dark_titan_modifier_desc: "Этот персонаж получил благословение от великого титана Саргераса и будет следовать его слову."
 suramar_legion_barrier_tt: "Тёмный властелин приближается, и я подготовлюсь к его легионам...\n Ты разблокируешь [GetDecisionWithKey('lower_suramar_barrier_decision').GetName] [decision|E]"
  
 wc_suramar_events.0060.t: "Удовольствия линий маны"
 wc_suramar_events.0060.desc: "Прогуливаясь по садам, я наткнулся(лась) на незнакомого(ую) [arcwinist.GetWomanMan], который(ая) выращивает тазик арковина. "Ah, hello [ROOT.Char.GetTitleAsNameNoTooltip]! Would you like to try some of my latest batch?" — предлагает [arcwinist.GetSheHe|U] с улыбкой на лице [arcwinist.GetHerHis].\n\nЯ осторожно отпиваю, и вкус не похож ни на что, что я когда-либо пробовал(а). Арковин имеет вкус мечты с нотками водяной лилии."
 wc_suramar_events.0060.a: "Этот рецепт идеально подойдёт для следующего торжества!"
 wc_suramar_events.0060.b: "[arcwinist.GetFirstName], тебе нужно приготовить ещё этого!"
 wc_suramar_events.0060.c: "Я возьму ещё один бокал, спасибо."
 wc_suramar_events.0060.d: "Предлагать напитки случайным незнакомцам? Как глупо."
 wc_suramar_good_drink_modifier: "Вкусный арковин"
 wc_suramar_good_drink_modifier_desc: "Этот персонаж попробовал вкусный арковин и в хорошем настроении."
 wc_suramar_supporting_arcwinists_modifier: "Поддержка арковинистов"
 wc_suramar_supporting_arcwinists_modifier_desc: "Этот персонаж поддерживает выращивание арковина и подаст его на своем следующем празднике.\nСтоимость [GetActivityType( 'activity_feast' ).GetName]: #p -25%#!"
 MODIFIER_DESC_wc_suramar_supporting_arcwinists_modifier: "[GetModifier('wc_suramar_supporting_arcwinists_modifier').GetNameWithTooltip]"
  
 wc_suramar_events.0070.t: "Странная рыба"
 wc_suramar_events.0070.desc: "Вглядываясь через воду, я замечаю несколько довольно интересных существ. Они не похожи ни на что, что я когда-либо видел(а): их чешуя мерцает на солнце, а плавники, кажется, светятся. У них короткие ноги, и они бегают по берегу, размахивая руками.\n\nМне любопытно, но, возможно, они опасны.\n\nОдна из них подбегает ко мне, пристально глядя своими огромными пронзительными глазами. "Mrghl!" — кричит она."
 wc_suramar_events.0070.a: "Интересно, мог(ла) бы ты стать вкусным блюдом..."
 wc_suramar_events.0070.a_good: "Ты ловишь и съедаешь эту странную 'рыбу'"
 wc_suramar_events.0070.a_bad: "Эта 'рыба' отпрыгивает прочь"
 wc_suramar_events.0070.b: "Отведи меня к своему вождю!"
 wc_suramar_events.0070.b_tt: "Ты следуешь за 'рыбой' домой, в [target_barony.GetName]"
 wc_suramar_events.0070.c: "Эм, ладно, пока."
  
 wc_suramar_events.0071.desc: "После некоторого времени, следуя за странной 'рыбой', я натыкаюсь на странную самодельную 'деревню'. На вершине маленького холма стоит 'рыба', и, похоже, она отдает приказы другим.\n\n"Мglrmglmglmg!" — кричит она, а остальные суетливо бегают, собирая еду и припасы.\n\nЯ спотыкаюсь о камень поблизости, и все рыбы поворачиваются ко мне с расширенными глазами. Чёрт!"
 wc_suramar_events.0071.a: "Я прихожу с миром!"
 wc_suramar_events.0071.a_tt: "Ты даришь вождю подарок"
 wc_suramar_events.0071.a_good: "[murloc_leader.GetFirstName] принимает твой подарок"
 wc_suramar_events.0071.bad_tt: "Возможно, у тебя будут проблемы..."
 wc_suramar_events.0071.a_bad: "[murloc_leader.GetFirstName] не впечатлён(а)"
 wc_suramar_events.0071.b: "Ага, Мргл."
 wc_suramar_events.0071.b_tt: "Ты пытаешься общаться с 'рыбой'"
 wc_suramar_events.0071.b_good: "[murloc_leader.GetFirstName] кажется, тебя понимает"
 wc_suramar_events.0071.b_bad: "[murloc_leader.GetFirstName] оскорблён(а)"
 wc_suramar_events.0071.c: "Умри, зверь!"
 wc_suramar_events.0071.c_tt: "Ты атакуешь 'рыбу'"
 wc_suramar_events.0071.c_good: "Ты побеждаешь 'рыбу'"
 wc_suramar_events.0071.c_bad: "'Рыба' побеждает тебя"
 wc_suramar_events.0071.d: "Ты неплохо выглядишь..."
  
 wc_suramar_events.0072.desc_love: "После теплых объятий [murloc_leader.GetFirstName] я не могу не почувствовать связь с этими... амфибиями. Я вглядываюсь в их выпученные глаза, и вижу искру доброты за ними.\n\nНесмотря на явные различия, манера, с которой [murloc_leader.GetSheHe] занимался(ась) любовью, была такой нежной и ласковой. Возможно, эти дикари... вовсе не такие дикие."
  
 wc_suramar_events.0072.desc_gift: "Я преподношу [murloc_leader.GetFirstName] маленькую безделушку, и [murloc_leader.GetSheHe]"
 wc_suramar_events.0072.desc_won_gift: "кажется, ей/ему это нравится. "[Glossary('Mglrmglmglmgl', 'MURLOC_GLOSS_1')]!" — кричит [murloc_leader.GetSheHe|U], собирая других 'рыб', чтобы собрать подарок."
 MURLOC_GLOSS_1: "На нерглийском: «Боги мурлоков благословили нас!»"
 wc_suramar_events.0072.desc_lost_gift: "смотрит на меня с презрением. [murloc_leader.GetSheHe|U] бросает безделушку обратно в меня, и другие 'рыбы' начинают нападать на меня камнями."
 wc_suramar_events.0072.desc_talk: "Я пытаюсь подражать тому, как говорят 'рыбы', и"
 wc_suramar_events.0072.desc_won_talk: "[murloc_leader.GetFirstName] кажется, меня понимает! [murloc_leader.GetSheHe|U] протягивает мне камень и кричит "[Glossary('Mmmrrglllm', 'MURLOC_GLOSS_2')]!""
 MURLOC_GLOSS_2: "На нерглийском: «Друг»."
 wc_suramar_events.0072.desc_lost_talk: "смотрит на меня в замешательстве. Прежде чем я успеваю осмыслить, что я сказал(а), 'рыбы' начинают нападать на меня камнями. Похоже, я сказал(а) что-то оскорбительное..."
 wc_suramar_events.0072.desc_won_fight: "Я изо всех сил бью по 'рыбе', и некоторые падают, в то время как остальные разбегаются. Я не могу гордиться этой победой, но должен(на) защитить себя от дальнейших атак."
 wc_suramar_events.0072.desc_lost_fight: "'Рыбы' подавляют меня своим количеством, и я вынужден(на) отступить. Не могу не чувствовать стыда, но не могу потерять жизнь из-за этих зверей."
 wc_suramar_events.0072.a: "За мурлоков [target_barony.GetName]!"
 wc_suramar_events.0072.b: "Мне лучше уйти..."
 wc_suramar_events.0072.c: "[murloc_leader.GetFirstName], ты должен(на) быть со мной."
  
 wc_suramar_friend_murlocs_modifier: "Друг мурлоков"
 wc_suramar_friend_murlocs_modifier_desc: "Этот персонаж вступил в контакт с племенем мурлоков, и это был незабываемый опыт!"
 wc_suramar_enemy_murlocs_modifier: "Враг мурлоков"
 wc_suramar_enemy_murlocs_modifier_desc: "Этот персонаж вступил в контакт с племенем мурлоков, и это был незабываемый опыт!"
 murloc_opinion: "$murloc$ [opinion|E]"
 naga_opinion: "$naga$ [opinion|E]"
  
 wc_suramar_events.0004.t: "В отсутствии Найтвелла"
 wc_suramar_events.0004.desc: "Мои путешествия вывели меня за пределы нашей Арканической защиты, и я начал(а) испытывать глубокий голод. Найтвелл, наш источник силы, больше не был доступен, и я чувствую последствия его отсутствия.\n\n"
 wc_suramar_events.0004.desc_known: "Это проклятие, этот голод — я знаю их. То же самое мучает Найтфолленов и Фал'дореев. Аркан'дор должен быть восстановлен, иначе меня ждёт мрачная судьба."
 wc_suramar_events.0004.desc_unknown: "В моей борьбе [teller.GetName] замечает. "[ROOT.Char.GetTitleAsNameNoTooltip]! Ты выглядишь бледно." При ближайшем рассмотрении глаза [teller.GetHerHis] расширяются. "Клянусь Найтвеллом! Ты страдаешь от нехватки маны!"\n\n[teller.GetSheHe|U] объясняет проклятие Найтфолленов и Фал'дореев, как они становятся извращёнными и теряются без силы Найтвелла, и как им необходимо искать дерево Аркан'дор, чтобы выжить."
 wc_suramar_events.0004.a: "Излечусь ли я когда-нибудь?"
  
 wc_suramar_events.0080.t: "Исчезнуть в тлене"
 wc_suramar_events.0080.desc: "Во дворе моего дворца спотыкается отвратительный эльф. [wretched_elf.GetSheHe|U] выглядит жалким, а его глаза впалые. [wretched_elf.GetSheHe|U] смотрит на меня со смесью страха и надежды, а голос его слаб.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip], прошу тебя, позволь мне снова оказаться под щитом Сурамара. Я умру без Найтвелла." — умоляет [wretched_elf.GetSheHe|U].\n\nПустить такое существо обратно в город может иметь непредсказуемые последствия, но оставить его умирать было бы жестоко."
 wc_suramar_events.0080.desc_laaamp: "В моем лагере спотыкается отвратительный эльф. [wretched_elf.GetSheHe|U] выглядит жалким, а его глаза впалые. [wretched_elf.GetSheHe|U] смотрит на меня со смесью страха и надежды, а голос его слаб.\n\n"[ROOT.Char.GetTitleAsNameNoTooltip], прошу тебя, позволь мне остаться здесь," — умоляет [wretched_elf.GetSheHe|U].\n\nПустить такое существо в мое царство может иметь непредсказуемые последствия, но оставить его умирать было бы жестоко."
 wc_suramar_events.0080.a_nice: "Конечно, я никогда не позволю моему народу страдать."
 wc_suramar_events.0080.a: "Я позволю тебе вернуться, но ты должен(на) быть осторожен(на)."
 wc_suramar_events.0080.a_laamp: "Ты можешь присоединиться к нашей банде, но должен(на) работать за свою жизнь."
 wc_suramar_events.0080.b: "Убирайся, кривой эльф!"
 wc_suramar_events.0080.c: "Да, я впущу тебя, но за цену..."
  
 wc_suramar_drained_mana_modifier: "Истощённый жалкий"
 wc_suramar_drained_mana_modifier_desc: "Этот персонаж извлёк небольшое количество энергии, оставшейся в жалком эльфе, и получает от этого выгоду.\n\n#bold Блокирует#! [GetDecisionWithKey('restore_arcandor_decision').GetName] [decision|E]"
 suramar_exile_character_effect_tt_wretched_dead: "Изгнание жалкого эльфа может привести к его гибели..."
  
 wc_suramar_events.0100.t: "Аркан'дор"
 wc_suramar_events.0100.desc: "Благодаря моим знаниям о Фал'дореях, я пришёл(пришла) к пониманию важности дерева Аркан'дор. Оно является источником их силы, и без него они увянут и погибнут.\n\nОднако местонахождение семени мне неизвестно. После некоторого раздумья мой(моя) [ROOT.Char.Custom2('RelationToMeShort', explorer)], [explorer.GetFirstName], принес(принесла) мне семя лично! [explorer.GetSheHe|U] готов(а) отдать его, за определённую цену..."
 wc_suramar_events.0100.a: "Я беру его, [explorer.GetFirstNameNoTooltip]!"
 wc_suramar_events.0100.b: "Ты тоже можешь быть мне полезен(полезна)..."
 wc_suramar_events.0100.c: "Извини, но я не могу оправдать такую цену."
 wc_suramar_events.0100.c_tt: "[newly_created_artifact.GetName] возвращается на своё первоначальное место"
  
 wc_suramar_events.0110.opening: "Великим [ROOT.Char.GetTitleAsNameNoTooltip],"
 wc_suramar_events.0110.desc: "Некоторое время Фал'дореи моего царства, [faldorei_leader.GetPrimaryTitle.GetName], были беспокойны.\n\nДерево Аркан'дор, источник нашей силы, было уничтожено тысячелетие назад. Хотя оно не может сравниться с силой твоего Найтвелла, мы просим твоей помощи в его возрождении. Ты один из немногих, кто способен на это, и мы будем безмерно благодарны.\n\nПожалуйста, [ROOT.Char.GetTitleAsNameNoTooltip], помоги нам."
 wc_suramar_events.0110.a: "Опустоши своё казначейство, и я сделаю это."
 wc_suramar_events.0110.b: "Только если поклянешься мне верностью."
 wc_suramar_events.0110.c: "Конечно, [faldorei_leader.GetFirstName]!"
 wc_suramar_events.0110.d: "Я не могу помочь в этом деле."
 wc_suramar_events.0110.good: "[faldorei_leader.GetSheHe|U] соглашается с твоими условиями"
 wc_suramar_events.0110.bad: "[faldorei_leader.GetSheHe|U] отказывается поклониться тебе"
 wc_suramar_events.0110.tt: "#warning У тебя будет #V 2#! года, чтобы вырастить дерево Аркан'дор, используя [GetDecisionWithKey('restore_arcandor_decision').GetName] [decision|E], иначе [faldorei_leader.GetFirstName] и другие [GetTrait('creature_faldorei').GetName( GetPlayer )] могут начать [war|E] или устроить враждебный [scheme|E] против тебя.#!"
  
 wc_suramar_events.0111.t: "Отрёкшийся от [GetTrait('creature_faldorei').GetName( GetPlayer )]"
 wc_suramar_events.0111.desc: "Годы назад я пообещал(а) [faldorei_leader.GetName], что вырасту дерево Аркан'дор, но я не смог(ла) сдержать своё слово.\n\nФал'дореи начали терроризировать моё царство по приказу [current_leader.GetName]. Из-за моих неудач мой народ в опасности. Кто знает, что ещё они смогут сделать..."
 wc_suramar_events.0111.a: "Если бы я мог(могла) отменить своё обещание..."
  
 rival_went_back_on_promise: "[TARGET_CHARACTER.GetShortUIName|U] не сдержал(а) обещание, данное [CHARACTER.GetShortUIName]."
 rival_went_back_on_promise_corresponding: "[CHARACTER.GetShortUIName|U] не сдержал(а) обещание, данное [TARGET_CHARACTER.GetShortUIName]."
  
 wc_suramar_faldorei_anger_modifier: "Преданный(ая)"
 wc_suramar_faldorei_anger_modifier_desc: "Этот персонаж был предан и будет искать отмщение."
  
 wc_suramar_faldorei_raided_modifier: "Агрессия Фал'дореев"
 wc_suramar_faldorei_raided_modifier_desc: "Этот персонаж предал Фал'дореев, и они ответили агрессией."
  
 wc_suramar_events.0120.t: "Судьба Азшары"
 wc_suramar_events.0120.desc: "Многие в Сурамаре сплетничают о судьбе королевы Азшары и о том, что с ней случилось. Одни говорят, что она мертва, другие — что она всё ещё жива, но самая интригующая теория заключается в том, что она превратилась в существо, правящее глубинами океана.\n\nЯ не принял(а) какую-либо конкретную теорию, но заметил(а) интересную фигуру на песках [target_barony.GetName]. Она немного похожа на нас, но кажется более... водной."
 wc_suramar_events.0120.a: "Хм... как интересно."
  
 wc_suramar_events.0121.desc: "Приближаясь к фигуре, тело [naga_leader.GetHerHis] извивается и скользит. [naga_leader.GetSheHe|U] поворачивается ко мне с широко раскрытыми глазами. [naga_leader.GetSheHe|U] шипит что-то на ломаном, извращённом диалекте [ROOT.Char.GetCulture.GetLanguage.GetName], но этого достаточно, чтобы я понял(а).\n\nЯ сажусь на песок рядом с удивительно [naga_leader.Custom('ComplimentAdjective')] фигурой, и [naga_leader.GetSheHe|U] рассказывает мне о своём народе, о том, что они когда-то были Найтборнами, но после падения Сурамара превратились в Нага.\n\nПосле всего этого Азшара всё ещё могла бы жить. Но учитывая её предательство, можно ли доверять этим Нагам?"
 wc_suramar_events.0121.a: "Ты приветствуешься, родственник Азшары."
 wc_suramar_events.0121.b: "Расскажи мне больше об этом... Н'Зоте."
 wc_suramar_events.0121.c: "Твоему народу нельзя доверять."
 wc_suramar_events.0121.d: "Земли Наг принадлежат нам!"
  
 wc_suramar_friend_naga_modifier: "Друг Наг"
 wc_suramar_friend_naga_modifier_desc: "Этот персонаж вступил в контакт с Нагами, и это был незабываемый опыт!"
  
 wc_suramar_events.0130.t: "Прибытие чужеземца"
 wc_suramar_events.0130.desc: "Ходят слухи о лагере, расположенном в [suramar_laamp.GetDomicile.GetLocation.Custom('GetTerrainTypePlural')] [suramar_laamp.GetDomicile.GetLocation.GetName]. Его жители не из Сурамара, они приходят и уходят, пытаясь установить контакт с местными.\n\nМногие ожидают от меня следующего шага, поскольку они проживают в моём царстве..."
 wc_suramar_events.0130.desc_barrier: "\n\nТеперь, когда мы открыты миру, естественно, что иностранцы приходят на наши земли. Но чего они хотят?"
  
 wc_suramar_events.0130.a: "[suramar_laamp.GetSheHe|U] не должен(на) быть здесь!"
 wc_suramar_events.0130.b: "Ах, лучше оставить [suramar_laamp.GetHerHim] в покое."
  
 wc_suramar_events.1000.t: "Дар мудрецов"
 wc_suramar_events.1000.desc: "В сердце Мередила, возле тоннелей Фалаанара, находится пустая яма, соединённая с линиями маны прошлого. Друид Валевокер Фародин, могущественный друид, посадил дерево Аркан'дор прямо в этом месте, чтобы освободить изгнанников от их проклятия.\n\nНо это спасение оказалось недолговечным. Дерево стало нестабильным, и, потеряв устойчивость, взорвалось, создав извращённых эльфов, известных как Фал'дореи.\n\nСегодня Фал'дореи и иссохшие эльфы вновь обрели спасение. Дерево Аркан'дор восстановлено, и сила, которая когда-то их удерживала, снова течёт по их жилам."
 wc_suramar_events.1000.a: "Ах, какое чудесное зрелище."
 wc_suramar_events.1000.a_tt: "Ты получишь [decision|E] для посещения дерева, когда захочешь."
 wc_suramar_events.1000.b: "Я должен(на) увидеть это своими глазами."
 wc_suramar_events.1000.b_tt: "Ты отправляешься в [GetTitleByKey('c_meredil').GetName], чтобы увидеть дерево Аркан'дор."
 wc_suramar_events.1000.b_tt_dom: "Ты отправляешься в [GetTitleByKey('c_meredil').GetName], чтобы увидеть дерево Аркан'дор вместе с твоим [domicile|E]."
  
 wc_suramar_blessing_arcandor_modifier: "Благословение Аркан'дор"
 wc_suramar_blessing_arcandor_modifier_desc: "Этот персонаж получил благословение от дерева Аркан'дор и извлекает из этого выгоду."
  
 wc_suramar_sacrifice_arcandor_modifier: "Жертва Аркан'дор"
 wc_suramar_sacrifice_arcandor_modifier_desc: "Этот персонаж вживил семя дерева Аркан'дор и извлекает из этого выгоду."
  
 wc_suramar_events.1002.t: "Великое дерево маны"
 wc_suramar_events.1002.desc: "Когда я вхожу в тоннель, соединяющий Мередил с Фаланааром, меня почти ослепляет свет дерева Аркан'дор. Его корни глубоки, а ветви широки, и мана струится в воздухе.\n\nФал'дореи и иссохшие эльфы собрались вокруг дерева, и они в изумлении от его силы. Они больше не прокляты и не искажены."
 wc_suramar_events.1002.desc_wretched: "Я присоединяюсь к их празднованию, чувствуя, как сущность линий маны течёт по моим венам, возвращая меня к тому, кем я когда-то был(была)."
 wc_suramar_events.1002.desc_faldorei: "Я присоединяюсь к их празднованию, вспоминая родных, погибших из-за разрушения этого дерева, радуясь тому, что могу увидеть его восстановление при жизни."
