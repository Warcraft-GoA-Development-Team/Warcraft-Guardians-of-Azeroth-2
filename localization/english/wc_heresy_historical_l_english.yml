 wc_heresy_seline_journals_modifier_desc:0 "This character studies the journals of a murdered bishop who wielded both Light and shadow."
 wc_heresy_sealed_writings_modifier:0 "Forbidden Writings"
 wc_heresy_sealed_writings_modifier_desc:0 "This character kept copies of writings the Kirin Tor wanted sealed away."

