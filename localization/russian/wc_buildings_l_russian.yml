 building_mogushan_vaults: "Подземелья Могу'шан"
 building_mogushan_vaults_desc: "[GetTrait('creature_mogu').GetName( GetNullCharacter )], гордые своим превосходством, вели подробные летописи своих свершений в обширном комплексе хранилищ. Охраняемые свирепыми магическими созданиями, эти священные залы хранят молчание с тех пор, как могу покинули их. "
 building_niffelem_spikes: "Шипы Ниффелема"
