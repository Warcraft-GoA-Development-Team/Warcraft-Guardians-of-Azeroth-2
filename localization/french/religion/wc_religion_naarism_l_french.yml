 #Naarism Group Faiths
 velenism:0 "Velenisme"
 velenism_adj:0 "velenei"
 velenism_adherent:0 "velenei"
 velenism_adherent_plural:0 "velenei"
 velenism_desc:0 "Ce sont les enseignements du naaru K'ure, tels qu'ils furent révélés au Prophète Velen. Inspiré par la vision de K'ure, Velen a mené l'exode des draeneï depuis Argus, les sauvant de la malédiction de Sargeras. Poursuivis à travers le cosmos, les $velenism_adherent_plural$ mènent des vies d'une grande vertu, conformes aux valeurs de Foi, de Courage et de Cœur ; protégeant les âmes de leurs défunts des griffes acérées des démons et de la mâchoire du Vide."
