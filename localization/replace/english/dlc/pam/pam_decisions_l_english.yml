 pam_antipope_events.0001.t: "A Rival [ROOT.Char.GetFaith.ReligiousHeadName|U]"
 pam_antipope_events.0001.desc.intro: "All of [ROOT.Char.GetRite.GetName] seems to be reunited in this [ROOT.Char.GetFaith.HouseOfWorship].\n\n"
 pam_antipope_events.0001.desc.self: "I raise my hand high in the air. The fake rule of [pope.GetTitledFirstName] will be soon approaching an end. It falls upon me to guide [pope.GetHerHis] mistreated flock now."
 pam_antipope_events.0001.desc.sponsor: ""Let heralds proclaim that #EMP I#! am the true [ROOT.Char.GetFaith.ReligiousHeadName|U]!" [antipope.GetTitledFirstName] roars. "Let everyone know that the fake [pope.GetTitledFirstName] hides in [pope.GetHerHis] palace in [pope_capital.GetName] while the faithful run mistreated and unguided!"\n\n[antipope.GetSheHe|U] turns towards me. "But fear no more. The pious [ROOT.Char.GetTitledFirstName] has resolved to put an end to your sorrows. And I with [ROOT.Char.GetHerHim].""
 pam_antipope_events.0001.a: "Let [ROOT.Char.GetFaith.GetNameNoTooltip] tremble."
 
 pam_antipope_events.0002.opening: "To the [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetTitledFirstNameNoTooltip],"
 pam_antipope_events.0002.desc.challenger_sponsor: "Know that I, [sponsor.GetTitledFirstName], have raised [antipope.GetTitledFirstName]"
 pam_antipope_events.0002.desc.antipope_self: "Know that I, [sponsor.GetTitledFirstName], have raised myself"
 pam_antipope_events.0002.desc.outro: "as a rival [ROOT.Char.GetFaith.ReligiousHeadName|U], to stand against the false [pope.GetTitledFirstName] and guide the faithful of [antipope.GetRite.GetName] as our tradition demands."
 pam_antipope_events.0002.a: "A rival $anti_religious_head_name$...?"
