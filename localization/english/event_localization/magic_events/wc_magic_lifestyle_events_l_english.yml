arcane_magic_lifestyle_events.1001.t:0 "The Color Out Of Space"
arcane_magic_lifestyle_events.1001.desc:0 "Since my recent experiments, the surroundings have aquired a strange tinge; an indescribable ocular sensation that falls between texture and color. I had not paid much mind to this transformation when it was limited to my atelier, or even when it began to spread out to the rest of the [ROOT.Char.GetCapitalLocation.GetHolding.GetType.GetName|l] and my servants began to remark.\n\nHowever now that the new visual quality has begun to spread to the surrounding countryside, some of the more #italic fantastically inclined#! denizens are spreading dark rumors and creating ridiculous explanations for the phenomena. Come to think of it, the strange crystals and glowing shades which have begun to spontaneously appear in my chambers might be a sign of a much more drastic stage of this change yet to come..."
arcane_magic_lifestyle_events.1001.opt.a:0 "I must study this development!"
arcane_magic_lifestyle_events.1001.opt.b:0 "My experiments have gone too far..."
arcane_magic_lifestyle_events.1001.opt.c:0 "I think I know how to fix this."
arcane_magic_lifestyle_events.1001.opt.d:0 "Time to commence a banishment ritual!"

arcane_magic_lifestyle_events.1011.t:0 "Indecipherable Tome"
arcane_magic_lifestyle_events.1011.desc:0 "In one of my recent travels, I stopped by a set of old ruins to see if I could find anything magically useful. One of my findings was a strange book, strongly weathered but in surprisingly good condition, with writing in a script I had never seen before.\n\nMy recent studies into its mysteries have led me to realize that not only is this book not in any language identifiable known to my court, but in fact the symbols seem to shift and change at random intervals; when I open the book I have no idea whether the same symbols and words will be there as last time. This mystery is as confounding as it is fascinating, who knows what secrets this enchantment is meant to hide!"
arcane_magic_lifestyle_events.1011.opt.a:0 "If I simply apply myself, its secrets are mine..."
arcane_magic_lifestyle_events.1011.opt.b:0 "There is much to be learned from this enchantment!"
arcane_magic_lifestyle_events.1011.opt.c:0 "This is no more than a mere curio."

arcane_magic_lifestyle_events.1021.t:0 "An Age-Old Debate"
arcane_magic_lifestyle_events.1021.desc:0 ""You simpleton! How could you possibly claim that the base elements are superior to the purity of the Arcane?"\n"Base? Heat and cold are the most fundamental of all energies and if you can't understand that you shouldn't be studying magic at all!"\n\nI invited these two mages to my atelier in the hopes of simply sharing knowledge and learning from their experience, but instead all they have done is go back and forth on which is superior, the Antipodean or "Pure" schools of Arcane magic. This frustrating exchange has been carrying on for hours that could be spent on my studies!\n\nSuddenly [antipodean_mage.GetName] turns to me. "[ROOT.Character.GetTitledFirstNameNoTooltip]," [antipodean_mage.GetSheHe] says, "What are your thoughts regarding this debate?"\n"Yes, yes of course,"[antipodean_mage.GetName] says, "We should have our [ROOT.Character.GetTitleAsNameNoTooltip] settle this!""
arcane_magic_lifestyle_events.1021.opt.a:0 "The antipodean magics are more relevant."
arcane_magic_lifestyle_events.1021.opt.b:0 "The pure Arcane is obviously superior."
arcane_magic_lifestyle_events.1021.opt.c:0 "Only a holistic study reveals the truth!"
arcane_magic_lifestyle_events.1021.opt.d:0 "Enough of this! Get OUT!"

arcane_magic_lifestyle_events.1031.t:0 "Time Stops"
arcane_magic_lifestyle_events.1031.desc:0 "Your experiments with the arcane have created an atemporal cascade which has caused you to become temporarily unstuck from time. As a result of this event, the world around you remains at a complete standstill, but you are free to move and act as you will. You are unsure exactly how this has happened, but it seems that this effect will not last more than a couple subjective days.\n\nThis event has resulted in an unexpected glut of free time as you wait for the cascade to resolve itself. As a leader, you are immediately aware of the precious opportunity you have been afforded. How will you use it?"
arcane_magic_lifestyle_events.1031.opt.a:0 "Time for some light reading!"
arcane_magic_lifestyle_events.1031.opt.b:0 "Finally, a chance to rest, feast, and decompress."
arcane_magic_lifestyle_events.1031.opt.c:0 "Does this mean... I am invisible?"

arcane_magic_lifestyle_events.1041.t:0 "A Crack In Reality"
arcane_magic_lifestyle_events.1041.desc:0 "It happened instantly and without warning... A terrible explosion followed by a blast of magenta light. Nearly a mile of vegetation was flattened instantly, the landscape rapidly consumed by giant pink and blue crystals of an unknown material. Strange elemental-like beings, their bodies composed of crackling and chaotic arcane energy, now swarm the countryside. At the heart of it all, a hovering jagged rip bursting forth with interplanar magic.\n\nDid my studies cause this? No matter. I must act fast before this disaster attracts the attention of any among the powerful beings who claim "protection" over this world..."
arcane_magic_lifestyle_events.1041.opt.a:0 "Its power shall be MINE!"
arcane_magic_lifestyle_events.1041.opt.b:0 "These energies were not meant for this world."
arcane_magic_lifestyle_events.1041.opt.c:0 "This is an occasion for cautious research."
arcane_magic_lifestyle_events.1041.opt.d:0 "On second thought, let them come!"

arcane_magic_lifestyle_events.7001.title:0 "A Young Pyromaniac"
arcane_magic_lifestyle_events.7001.desc:0 "Reports of a local child who was linked to many unexplained fires in the area have brought me to the countryside of [location.GetName]. Under the pretense of a trial, I have had young [pyromaniac.GetFirstName] brought before me to assess [pyromaniac.GetHerHis] abilities. As soon as [pyromaniac.GetSheHe] stepped before me I could feel the aura radiating from [pyromaniac.GetHerHim]... This child is obviously a prodigy!\n\nOn the one hand, this youth could be a powerful ally. I might even learn something from [pyromaniac.GetHerHis] intuitive control over the elements!\nOn the other, a being with this level of power could cause problems for us all. Keeping [pyromaniac.GetHerHim] in prison under close guard should inhibit [pyromaniac.GetHerHis] from growing to their full potential."
arcane_magic_lifestyle_events.7001.opt.a:0 "Let us revel in the flames!"
arcane_magic_lifestyle_events.7001.opt.b:0 "The child will serve me as punishment."
arcane_magic_lifestyle_events.7001.opt.c:0 "This child must pay for [pyromaniac.GetHerHis] crimes."

arcane_magic_lifestyle_events.7002.title:0 "A Mature Pyromaniac"
arcane_magic_lifestyle_events.7002.desc.intro:0 "[pyromaniac.GetName], the fire-touched child I took into my care years ago, has matured into a fine young [pyromaniac.GetWomanMan]. As I suspected, [pyromaniac.GetHerHis] magical abilities were indeed prodigal as [pyromaniac.GetSheHe] has intuitively mastered magical abilities that would normally require intense studies and training for an adult.\n\n"
arcane_magic_lifestyle_events.7002.desc.pyro:0 "Although it took a little encouragement to initiate young [pyromaniac.GetFirstNameNoTooltip] into the Antipodean school of the Arcane, from there [pyromaniac.GetSheHe] easily grasped the sciences and techniques of Arcane Fire. While [pyromaniac.GetHerHis] intuitive grasp over the elements did little to aid my own studies, I could see young [pyromaniac.GetFirstNameNoTooltip] growing into a useful asset to my court. On the other hand, I could simply cut [pyromaniac.GetHerHim] loose if there simply isn't room for more in my entourage!"
arcane_magic_lifestyle_events.7002.desc.ele:0 "In truth, young [pyromaniac.GetFirstNameNoTooltip]'s talents took on an... altogether different character than I had hoped. Early on, [pyromaniac.GetSheHe] chattered constantly about hearing voices of "spirits within the flame". As [pyromaniac.GetFirstNameNoTooltip] grew older we found ourselves constantly at odds; [pyromaniac.GetSheHe] called my conjurations "soulless and unnnatural" and would storm off to go "consult with the spirits". After some time, I decided to simply give up my ministrations and allow [pyromaniac.GetHerHim] to [pyromaniac.GetHerHis] devices. Now, having crossed the threshold of adulthood, I must admit that while I have nothing whatsoever to learn from [pyromaniac.GetFirstNameNoTooltip], [pyromaniac.GetSheHe] may prove useful nevertheless."
arcane_magic_lifestyle_events.7002.opt.a.pyro:0 "I can help [pyromaniac.GetHerHim] reach [pyromaniac.GetHerHis] potential..."
arcane_magic_lifestyle_events.7002.opt.a.ele:0 "[pyromaniac.GetSheHe] could still be of some use..."
arcane_magic_lifestyle_events.7002.opt.b:0 "[location.GetName] would owe me a favor!"
arcane_magic_lifestyle_events.7002.opt.c:0 "I have no use for [pyromaniac.GetFirstNameNoTooltip]."

arcane_magic_lifestyle_events.7004.title.skilled:0 "A True Pyromancer"
arcane_magic_lifestyle_events.7004.title.dull:0 "A Real Burnout"
arcane_magic_lifestyle_events.7004.desc.skilled:0 "To see [pyromaniac.GetName] mature has been one of the great joys in my professional and personal life, and it is truly a beautiful thing to be able to use the resources available through my station to benefit such a talented young [pyromaniac.GetWomanMan].\n\n[pyromaniac.GetName] has lived up to [pyromaniac.GetHerHis] promise and so much more. [pyromaniac.GetHerHis] command over the element of fire is like nothing I have ever seen. It begs the question, can even the study of Arcane Fire be as much art as science? Does the spark that burns within the two of us beckon to a calling of intuition and creativity as much as or more than it does erudition and empirical observation?\n\nPutting aside for now the philosophical implications of genius, [pyromaniac.GetFirstNameNoTooltip] can no longer remain a mere protegé. It is time for [pyromaniac.GetHerHim] to carry [pyromaniac.GetHerHis] own weight and attain [pyromaniac.GetHerHis] destiny."
arcane_magic_lifestyle_events.7004.desc.dull:0 "As is often the case with gifted youngsters, [pyromaniac.GetName] seemed to grow bored and restless as [pyromaniac.GetSheHe] pursued [pyromaniac.GetHerHis] studies. Eventually, I could barely get [pyromaniac.GetHerHim] to open a book no matter how much I cajoled and nagged [pyromaniac.GetHerHim]. Was it some fault of mine or was it a lack of challenge that snuffed the spark of this nascent genius?\n\nWhat's worse, a lifetime of patronage has left [pyromaniac.GetFirstNameNoTooltip] a markedly unmotivated young [pyromaniac.GetWomanMan]. My servants seem to have trouble getting [pyromaniac.GetHerHim] out of bed let alone into a conjuration circle.\n\nI can't help but breathe a contemplative sigh... #italic What is wrong with young people these days?#!"
arcane_magic_lifestyle_events.7004.opt.a.skilled:0 "[pyromaniac.GetFirstNameNoTooltip] is worth [pyromaniac.GetHerHis] weight in gold!"
arcane_magic_lifestyle_events.7004.opt.a.dull:0 "I can't simply abandon [pyromaniac.GetHerHim]..."
arcane_magic_lifestyle_events.7004.opt.b:0 "A prestigious appointment is in order."
arcane_magic_lifestyle_events.7004.opt.c:0 "I can think of a more deserving master!"
arcane_magic_lifestyle_events.7004.opt.d:0 "It's time to say goodbye, [pyromaniac.GetFirstNameNoTooltip]."

