l_english:
  BALNAZZAR_DREADLORD_CUSTOM_STRING_KEY:0 "A dreadlord wears a borrowed face and spends a mortal lifetime reaching for a throne that was never his."

  wc_balnazzar_story.0100.title:0 "The Failing Shell"
  wc_balnazzar_story.0100.desc:0 "The hand I wear trembles when it lifts the seal. This flesh is beginning to fail, and no heir is ready to inherit its name. When it dies, the court will divide everything I built among claimants who know nothing of me.\n\nI can wait for that indignity, or tear away the disguise while I still command what lies beneath it."
  wc_balnazzar_story.0100.a:0 "The mask has served long enough."
  wc_balnazzar_story.0100.b:0 "Let it end quietly."

  wc_balnazzar_story.0101.title:0 "A Familiar Stranger"
  wc_balnazzar_story.0101.desc:0 "[balnazzar_witness.GetShortUINameNoTooltip] has been watching me. Familiar answers now earn a second glance, and yesterday [balnazzar_witness.GetSheHe] caught me studying this face in the glass. [balnazzar_witness.GetSheHe|U] has told no one. Not yet."
  wc_balnazzar_story.0101.a:0 "Reassure them. Whatever they think they saw, it was nothing."
  wc_balnazzar_story.0101.b:0 "Have them quietly imprisoned before they say this to anyone else."
  wc_balnazzar_story.0101.c:0 "Say nothing. Let them keep wondering."

  wc_balnazzar_story.0102.title:0 "Under the Ashes"
  wc_balnazzar_story.0102.desc:0 "Another chapel is emptied. Another village swears the proper creed. The work is necessary, but it sends soldiers and clerks into places where a careless word can travel farther than an army."
  wc_balnazzar_story.0102.a:0 "Continue."
  wc_balnazzar_story.0102.a_tooltip:0 "The purge leaves traces that may deepen suspicion around your disguise"

  wc_balnazzar_story.0110.title:0 "The Next Mask"
  wc_balnazzar_story.0110.desc:0 "[next_vessel.GetShortUINameNoTooltip] must die without appearing dead. A ruler found cold in bed leaves seals to be seized and loyalties to be tested. I need the body to rise, dress, and summon its servants as usual.\n\nWhen the last defense gives way, I enter. A servant opens the door and sees the same face that dismissed him yesterday. He bows.\n\nThe old shell has served its purpose. By the time anyone looks for it, nothing will remain."
  wc_balnazzar_story.0110.a:0 "Wear the next mask."
  wc_balnazzar_story.0110.a_tooltip:0 "You become [next_vessel.GetShortUIName], keeping both bodies' Intrigue perks and Balnazzar's magic. Light perks and points are lost, you cannot contract new diseases while disguised, and your current body vanishes"
  wc_balnazzar_story.0111.title:0 "The Morning Petitions"
  wc_balnazzar_story.0111.desc:0 "A servant brings the morning petitions and pauses at the threshold. I sign the first order with [ROOT.Char.GetFirstNamePossessive] hand, then ask why he is staring. He apologizes and bows.\n\nOutside this room, the same guards keep watch and the same councillors wait to be heard. They speak their ruler's name. I answer, and the day's business begins."
  wc_balnazzar_story.0111.a:0 "Let them recognize their ruler."
  wc_balnazzar_story.0111.a_tooltip:0 "You continue as [ROOT.Char.GetShortUIName], retaining this ruler's titles and court while Balnazzar's magic and hidden nature persist"

  wc_balnazzar_story.0002.title:0 "A Death They Can Believe"
  wc_balnazzar_story.0002.desc:0 "Varimathras faces me beneath the ruined throne, magic gathering in his claws, Sylvanas waiting behind him. To her, this must look like obedience: one dreadlord buying mercy with his brother's blood. To us, it is a performance rehearsed without words.\n\nHis spell strikes hard enough to convince the room and carefully enough to spare me. I fall and give the witnesses the stillness they came to see. Sylvanas claims Lordaeron without comment. Whether she believes the death or merely accepts the result, she gives no sign.\n\nOnly after her footsteps fade does Varimathras move. By nightfall I am crossing into the Plaguelands, crownless and unseen. Let them remember the body on the floor. I have other faces to wear."
  wc_balnazzar_story.0002.a:0 "Let Balnazzar die before their eyes."

  wc_balnazzar_story.1001.title:0 "A Face Not His Own"
  wc_balnazzar_story.1001.desc:0 "Lordaeron belongs to Sylvanas now. Varimathras played his part, those who mattered saw me fall, and Balnazzar is dead in every account worth hearing. A throne was only scaffolding. A dead name may prove more useful than a crown.\n\nThe Silver Hand still moves through the Plaguelands. Among its remnants, one man stands out - Saidan Dathrohan, respected, trusted, exactly the vessel worth wearing. I knew his value before I surrendered the crown. Now nothing prevents me from claiming it.\n\nHe is here somewhere, in Stratholme's ruin. There is a particular stillness to a man who thinks he is hunting the dead instead of being hunted himself. I find him alone. 'Who--? You...are Legion,' is all he manages, before the Light even reaches his hand.\n\nMy kind are called Nathrezim. Dreadlords, in your tongue. Perhaps Thal'kituun would be more fitting. It means unseen guest in your language. Fitting because I have existed here, between the world of the living and the dead, awaiting a moment such as this, under the very noses of the Scourge - without their slightest suspicion.\n\nKnow that I am Balnazzar. Know, as I drink your life, that I will take up residence in this weak shell your soul once called home. Know that I will corrupt and destroy everything and everyone you have ever loved.\n\nThe rest is arithmetic. Dathrohan's face gives me rank, trust, and doors my own name could never open. Let Sylvanas keep a dead dreadlord and a ruined crown. Beneath the Crusader's steel and prayer, only I remain.\n\nBalnazzar is dead to them. That is enough."
  wc_balnazzar_story.1001.a:0 "Wear the mask."
  wc_balnazzar_story.1001.a_magic_tooltip:0 "Balnazzar's magic and Intrigue perks carry over alongside this body's existing Intrigue perks. Light perks and points are lost, and you cannot contract new diseases while disguised"
  wc_balnazzar_story.1001.b:0 "Dathrohan is already gone. There is nothing left here worth wearing."
  wc_balnazzar_story.1001.b_tooltip:0 "The story ends here - there is no shell left worth wearing, and nothing left to build toward"

  wc_balnazzar_story.1002.title:0 "Borrowed Authority"
  wc_balnazzar_story.1002.desc:0 "Dathrohan's heart is silent, yet his hand closes when I will it. Men who would have drawn steel against Balnazzar bow when they see this face. They bring Saidan reports, keys, and sealed orders. I accept them in his voice.\n\nThe body remembers enough. A salute. A prayer spoken at the proper hour. Which officer expects warmth, and which expects a command. Where memory fails, rank supplies the answer.\n\nThe Scourge still infest Stratholme. Alexandros holds the Silver Hand together, while Renault watches Darion receive his father's trust. The order can be broken without ever seeing its enemy."
  wc_balnazzar_story.1002.a:0 "Begin."
  wc_balnazzar_story.1002.a_tooltip:0 "You assume Saidan's titles and court. Balnazzar's magical abilities remain hidden beneath the disguise"

  wc_balnazzar_story.1003.title:0 "The Last Council"
  wc_balnazzar_story.1003.desc:0 "The council crowds around a map of the Plaguelands. Voices rise over roads already lost and defenses too thin to hold. Yet every argument bends toward Alexandros's judgment. Even those who challenge him speak as men certain that he will somehow preserve the order.\n\nI answer with Dathrohan's measured gravity. How readily these mortals offer trust to a familiar face. They see an old brother beneath the armor; I see fervor to inflame, discipline to misdirect, doubt to nourish. Every virtue is another cord by which the order may be pulled apart.\n\nAlexandros alone keeps those cords drawn into a single purpose. A direct blow would make a martyr and close their ranks. Better to draw him onto a road where the dead can strip away his guard, then let blood betray blood. Kel'Thuzad will demand a price. Let him. Once Alexandros falls, every oath in this hall becomes mine to corrupt."
  wc_balnazzar_story.1003.a:0 "Send word to Kel'Thuzad. Alexandros must be isolated."
  wc_balnazzar_story.1003.a_tooltip:0 "If Kel'Thuzad survives to answer, accepting his price lets him gain a Favor Hook on you if possible, adds 15 Success Chance to the murder scheme, and lets him raise Alexandros with the Corrupted Ashbringer."

  wc_balnazzar_story.1004.title:0 "Terms in the Crypt"
  wc_balnazzar_story.1004.desc:0 "Frost creeps over the crypt floor while Kel'Thuzad listens. I need his dead to close around Alexandros's escort in Stratholme. Renault will do the rest.\n\nThe lich offers the ambush and something more. Once Alexandros falls, he will raise him. In return, Kel'Thuzad wants a debt he may collect when it suits him."
  wc_balnazzar_story.1004.desc_confirmed:0 "Kel'Thuzad has considered the message I sent from the conclave. His dead will divide Alexandros from his guard in Stratholme, and Renault will have his moment.\n\nThen the lich will raise the father his son struck down. His price is a debt, held until he chooses to collect it."
  wc_balnazzar_story.1004.a:0 "Accept the debt. Let the ambush begin."
  wc_balnazzar_story.1004.c:0 "Renault needs no help from the Scourge."
  wc_balnazzar_story.1004.b:0 "Kel'Thuzad is gone. The dead will rise on their own account, or not at all."
  wc_balnazzar_story.1004_pact_tooltip:0 "Kel'Thuzad gains a Favor Hook on you if possible, the murder scheme gains 15 Success Chance, and he raises Alexandros with the Corrupted Ashbringer."
  wc_balnazzar_story.1004_refuse_tooltip:0 "Kel'Thuzad gains no hook and the murder receives no bonus. Renault will keep the Corrupted Ashbringer"
  wc_balnazzar_story.1004_no_pact_tooltip:0 "The plot against Alexandros continues without Kel'Thuzad"

  wc_balnazzar_story.1005.title:0 "A Son's Envy"
  wc_balnazzar_story.1005.desc:0 "At the council table, Renault falls silent whenever Alexandros praises Darion. He hides it quickly, but not before his hand tightens around the stem of his cup.\n\nI do not accuse his father of anything. I ask questions. Why is Darion trusted with the harder command? Why does the Ashbringer pass so easily over Renault? By the third question, he no longer needs me to answer.\n\nDead servants may clear his path, or Renault may have to make the opening himself. The blade must still be his."
  wc_balnazzar_story.1005.a:0 "Let the boy prove himself to his father."
  wc_balnazzar_story.1005.a_tooltip:0 "Starts a scheme to have Alexandros Mograine assassinated"
  wc_balnazzar_story.1005.b:0 "Renault is no longer useful."
  wc_balnazzar_story.1005.b_tooltip:0 "Without Renault, the plot against Alexandros ends"

  wc_balnazzar_story.1010.title:0 "The Bait"
  wc_balnazzar_story.1010.desc:0 "Renault comes after midnight with a story already sharpened for his father's ear. Darion, he will say, has been taken near Stratholme. Alexandros will ride before doubt can catch him.\n\nThere is one complication. Fairbanks rarely lets the Ashbringer leave his sight. If Alexandros goes, the priest will follow."
  wc_balnazzar_story.1010.a:0 "One witness is a manageable inconvenience."

  wc_balnazzar_story.1011.title:0 "The Road to Stratholme"
  wc_balnazzar_story.1011.desc:0 "Renault's message is brief. His father believed every word. Alexandros has ridden for Stratholme, with Fairbanks beside him and the Ashbringer across his back.\n\nThey are on the road now. Renault has only to keep his nerve, follow, and choose his moment."
  wc_balnazzar_story.1011.a:0 "The road closes behind them."

  wc_balnazzar_story.1006.title:0 "The Ambush That Wasn't"
  wc_balnazzar_story.1006.desc:0 "Renault's final report reaches me. Alexandros followed the lie to Stratholme, with Fairbanks at his side. The dead closed around them. Renault says the priest vanished beneath the bodies before Alexandros finally tired and let the Ashbringer fall. Then the son struck.\n\nKel'Thuzad has kept his bargain. Alexandros now stands in the lich's service, and the blade in his hand is no longer bright. Renault returned without either."
  wc_balnazzar_story.1006.desc_refused:0 "Renault's final report reaches me. Alexandros followed the lie to Stratholme, with Fairbanks at his side. No Scourge host cleared Renault's path, but the fighting separated them all the same. He says the priest vanished beneath the bodies. When his father stood alone, Renault struck with the Ashbringer.\n\nThe blade darkened in his hands. He returned carrying it, unable to look at the weapon or at me."
  wc_balnazzar_story.1006.a:0 "Now Renault belongs to me."

  wc_balnazzar_story.1007.title:0 "Scarlet from Silver"
  wc_balnazzar_story.1007.desc:0 "Alexandros is dead. The surviving officers gather in the monastery expecting Saidan Dathrohan to preserve what remains of the Silver Hand.\n\nI tell them the Silver Hand died with Alexandros. It was built for a kingdom that no longer exists and bound by vows too weak for the war that remains.\n\nServants pull down the silver standards. I raise the first scarlet banner above the assembly. One by one, the commanders swear to the new Crusade and to the man whose face I wear."
  wc_balnazzar_story.1007.a:0 "Raise the Scarlet banner."
  wc_balnazzar_story.1007.a_vassal_conversion_tooltip:0 "Every vassal still following the Holy Light converts to Scarletism alongside you"
  wc_balnazzar_story.1007.b:0 "Without Renault, I have lost the cleanest path to command."
  wc_balnazzar_story.1007.b_tooltip:0 "The story ends here because Renault can no longer secure Balnazzar's takeover"
  scarlet_crusade_custom_name:0 "Scarlet Crusade"

  wc_balnazzar_story.1012.title:0 "The Witness Returns"
  wc_balnazzar_story.1012.desc:0 "The hall at Hearthglen falls silent when Fairbanks enters without summons. The guards follow at his heels, uncertain whether to seize a priest who once stood at Alexandros's side. He does not wait for permission to speak.\n\nHe names Renault first. The son led Alexandros into Stratholme, he says, and struck when the Scourge had spent the father's strength. Then Fairbanks turns to me. The ambush was Saidan Dathrohan's design; Renault merely carried it out.\n\nAround the table, some avert their eyes. Others watch me, waiting to learn whether truth still carries more weight than rank."
  wc_balnazzar_story.1012.a:0 "Grief has broken him. Remove him."
  wc_balnazzar_story.1012.a_tooltip:0 "Fairbanks is imprisoned, but his public accusation increases Suspicion."
  wc_balnazzar_story.1012.b:0 "Let him leave. His followers will reveal themselves."
  wc_balnazzar_story.1012.b_tooltip:0 "Fairbanks remains free, and his public accusation increases Suspicion even further."

  wc_balnazzar_story.1014.title:0 "The Witness Below"
  wc_balnazzar_story.1014.desc:0 "The gaoler returns from the sealed chambers beneath the Scarlet Monastery with every trace of color gone from his face. Fairbanks no longer eats, sleeps, or draws breath. Still, when the door opens, the priest rises and names Alexandros's murderers again.\n\nI order the chamber barred and his name struck from the rolls. Let the Crusade believe grief and plague consumed him. In the dark, Fairbanks may preach the truth to stone."
  wc_balnazzar_story.1014.a:0 "Seal the chamber. Let the dead accuse the stones."

  wc_balnazzar_story.1008.title:0 "Stratholme Falls"
  wc_balnazzar_story.1008.desc:0 "The city is ours. Whatever crawled through its streets since Arthas' purge has been put to the sword a second time, and the banners going up over its gates are Scarlet, not silver skulls.\n\nThe old faith isn't burned out yet - that will take longer than a single battle. But the ground it stood on belongs to me now."
  wc_balnazzar_story.1008.a:0 "Let it burn cleaner, in time."

  wc_balnazzar_story.1009.title:0 "The Ashes Made Whole"
  wc_balnazzar_story.1009.desc:0 "Scarlet patrols hold the roads into Stratholme. In the chapels, priests replace old names with ours. Farther south, New Avalon stands ready, a clean facade for the work carried out behind its walls.\n\nThe Crusade has a stronghold now, not merely scattered halls and frightened congregations. Every survivor who comes seeking protection will leave carrying our orders."
  wc_balnazzar_story.1009.a:0 "Let them come."

  wc_balnazzar_story.2000.title:0 "The Mask Comes Off"
  wc_balnazzar_story.2000.desc:0 "Too many eyes linger on this face. Too many questions follow when I leave a room. The disguise has ceased to protect me, and a useless mask is only a weakness.\n\nSaidan Dathrohan is already dead. Tonight, the lie dies with him. Those gathered in [ROOT.Char.GetCapitalLocation.GetTitle.GetBaseNameNoTier] will see what ruled them, then rise to serve it."
  wc_balnazzar_story.2000.desc_later_vessel:0 "They have begun to watch me. A servant stopped talking when I entered the hall, and two riders left [ROOT.Char.GetCapitalLocation.GetTitle.GetBaseNameNoTier] without my leave. This body's name no longer protects me.\n\nI will not flee in borrowed flesh. Before dawn, this household will meet Balnazzar. The dead worth keeping will rise again."
  wc_balnazzar_story.2000.a:0 "Let the Risen claim what is mine."
  the_risen:0 "The Risen"

  wc_balnazzar_story.2001.title:0 "The Risen"
  wc_balnazzar_story.2001.desc:0 "Below me, the badges of the old order hang from bodies that no longer breathe. The fallen stand again, waiting for one command.\n\n[ROOT.Char.GetCapitalLocation.GetTitle.GetBaseNameNoTier] is the first stronghold of the Risen. The dead gathered here retain their training and their knowledge of the roads. Whatever loyalties survived death will not survive me."
  wc_balnazzar_story.2001.a:0 "Rise, and serve."
  wc_balnazzar_story.2001.a_tooltip:0 "Balnazzar now rules the independent Risen with a raised host"
