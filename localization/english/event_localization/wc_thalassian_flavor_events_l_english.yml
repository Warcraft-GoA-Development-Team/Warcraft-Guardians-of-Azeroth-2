l_english:
 wc_thalassian_flavor_events.0010.t:0 "A House in Decline"
 wc_thalassian_flavor_events.0010.d:0 "Debt has finally caught up with one of the older Thalassian houses. With little left to sell, its members have begun parting with their ancestral library.\n\nMost of the volumes are histories and genealogies, but several arcane treatises catch my eye — old works filled with corrections, observations, diagrams, and notes accumulated over generations.\n\nKnowledge such as this rarely reaches the open market."
 wc_thalassian_flavor_events.0010.a:0 "One volume should be enough."
 wc_thalassian_flavor_events.0010.b:0 "I will take the entire collection."
 wc_thalassian_flavor_events.0010.c:0 "I know collectors who will pay handsomely."
 wc_thalassian_flavor_events.0020.t:0 "The Ancient Magister"
 wc_thalassian_flavor_events.0020.d:0 "An aged magister has asked for an audience. His hands tremble around the head of his staff, but there is nothing frail in his voice.\n\nHe has spent centuries moving between schools of magic, teaching where he was welcomed and studying where he was not. A few questions are enough to dispel any doubt: the old elf knows more than most magisters learn in a lifetime.\n\nHe asks for no estate and little comfort. What he seeks is a final appointment — a place as Court Mage, where his knowledge might still be of use.\n\nMy liege would undoubtedly value a magister of such experience as well."
 wc_thalassian_flavor_events.0020.a:0 "Then spend your final years here."
 wc_thalassian_flavor_events.0020.a_tt_no_court_mage:0 "You do not currently employ a Court Mage."
 wc_thalassian_flavor_events.0020.a_tt_can_employ:0 "Your court can employ a Court Mage."
 wc_thalassian_flavor_events.0020.b:0 "My liege has greater need of your talents."
 wc_thalassian_flavor_events.0020.c:0 "You have served long enough. Choose your own road."
 wc_thalassian_ancient_magister_lifespan:0 "Weight of Centuries"
 wc_thalassian_ancient_magister_lifespan_desc:0 "This ancient magister's long life is finally drawing toward its natural end."
 wc_thalassian_flavor_events.0030.t:0 "The Old Border"
 wc_thalassian_flavor_events.0030.d:0 "Farstrider patrols along the southern marches have returned with troubling reports. Amani warbands that usually raid and vanish on their own are moving with unusual discipline. Trails converge where they should not, camps are being supplied in concert, and signals pass between bands that seldom cooperate.\n\nNo army has crossed the border, and skirmishes here are hardly new. Yet the pattern is difficult to dismiss: the old enemy is coordinating."
 wc_thalassian_flavor_events.0030.a:0 "The Farstriders will remind them where the border lies."
 wc_thalassian_flavor_events.0030.a_cultural_acceptance:0 "Renewed hostilities along the old Thalassian-Amani border"
 wc_thalassian_flavor_events.0030.b:0 "Strengthen the passes. Let them come."
 wc_thalassian_flavor_events.0030.c:0 "Do not provoke them. I want to know who is organizing these raids."
 wc_thalassian_old_border_counter_tactics_modifier:0 "Amani Counter-Tactics"
 wc_thalassian_old_border_counter_tactics_modifier_desc:0 "Farstrider patrols have adapted their tactics to deny the Amani the advantages of familiar ground."
 wc_thalassian_old_border_fortifications_modifier:0 "Reinforced Border"
 wc_thalassian_old_border_fortifications_modifier_desc:0 "Garrisons have been reinforced, local levies drilled, and watch posts established throughout the southern marches."
 wc_thalassian_old_border_intelligence_modifier:0 "Eyes on Zul'Aman"
 wc_thalassian_old_border_intelligence_modifier_desc:0 "Farstrider scouts have been ordered to watch Amani movements closely and report any sign of coordination."
