 game_concept_wc_elemental_magic_lifestyle: "Магия стихий: $game_concept_lifestyles$"
 game_concept_wc_elemental_magic_lifestyle_no_lifestyles_line: "Магия стихий"
 game_concept_wc_elemental_magic_lifestyle_element: "Стихия"
 game_concept_wc_elemental_magic_lifestyle_elements: "Стихии"
 game_concept_wc_elemental_magic_lifestyle_desc: "К $game_concept_wc_elemental_magic_lifestyle$ относятся [wc_magic_lifestyle|E], основанные на Магии стихий.\n\nК $game_concept_wc_elemental_magic_lifestyle$ относятся:\n$BULLET_WITH_TAB$ [wc_elemental_fire_magic_lifestyle|E]\n$BULLET_WITH_TAB$ [wc_elemental_water_magic_lifestyle|E]\n$BULLET_WITH_TAB$ [wc_elemental_air_magic_lifestyle|E]\n$BULLET_WITH_TAB$ [wc_elemental_earth_magic_lifestyle|E]\n\nЧтобы жить в гармонии со стихиями или утвердить над ними господство, шаманы и тёмные шаманы призывают первозданные силы [wc_elemental_magic_spirit|E] и [wc_elemental_magic_decay|E]."

 game_concept_wc_elemental_magic_spirit: "Дух"
 game_concept_wc_elemental_magic_spirit_desc: "Пятая стихия, первозданная сила Духа, часто считается противоположностью [wc_elemental_magic_decay|E]. Шаманы призывают её, чтобы привносить равновесие в нестабильные [wc_elemental_magic_lifestyle_elements|E]."
 game_concept_wc_elemental_magic_decay: "Разложение"
 game_concept_wc_elemental_magic_decay_desc: "Шестая стихия, первозданная сила Разложения, часто считается противоположностью [wc_elemental_magic_spirit|E]. Тёмные шаманы призывают её, чтобы подчинять [wc_elemental_magic_lifestyle_elements|E] своей воле, порабощая их и используя как оружие."

