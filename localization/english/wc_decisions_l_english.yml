 focused_activate_origination_protocol_decision_tooltip: "Unleash an immense beam of energy of uncreation."

 gilneas_build_wall_decision: "Build Greymane Wall"
 gilneas_build_wall_decision_desc: "The Alliance refused to execute the orcs, and instead built internment camps at the cost of Gilnean taxes. Keeping the orcs alive is clearly a mistake and waste of money, it's time to withdraw and wall off Gilneas."
 gilneas_build_wall_decision_confirm: "Build the wall!"
 gilneas_build_wall_decision_tooltip: "Build [GetBuilding('greymane_wall_02').GetName]."
 gilneas_build_wall_decision_tt: "Ask [GetTitleByKey('k_gilneas').GetHolder.GetCouncillor('councillor_chancellor').GetLadyLord|U] [GetTitleByKey('k_gilneas').GetHolder.GetCouncillor('councillor_chancellor').GetDynastyHouseNameNoTooltip] about building a wall"

 form_the_scarlet_crusade_decision:0 "Form the Scarlet Crusade"
 form_the_scarlet_crusade_decision_desc:0 "The feeble and weak Paladins of the [GetTitleByKey('k_order_of_the_silver_hand').GetName] are barely clinging to life, forming fragile pacts in a desperate attempt to reclaim their faded glory. The Argent are no better. They are blinded by a false mercy and openly consort with the impure, the weak and scurry about like peasants seeking redemption that they will never earn. Only the Scarlet Crusade remains untainted. Only the Scarlet Crusade remains unyielding in purpose. Unwaverinmg in faith. We possess the strength to shield the desperate from the [scourge|E] and grant righteous vengeance to those who swear fealty to our Holy cause. We are the true heirs of the Light - its purest blades made manifest. Those who oppose our sacred mission, even those we once called friends, shall be cleansed in a searing blaze of Holy Fire."
 form_the_scarlet_crusade_decision_confirm:0 "The Scarlet Crusade rises"
 form_the_scarlet_crusade_decision_tooltip:0 "Time for the Damned to become the prey"
 scarlet_crusade:0 "Elite Scarlet Crusaders"
 form_the_scarlet_crusade_decision_magic:0 "Every character of the [GetFaithByKey('scarletism').GetAdjective] [faith|E] will have reduced [wc_spell|E] Cooldown when casting [wc_spell_school_light|E] spells"
 form_the_scarlet_crusade_decision_magic_tt:0 "Formation of the Scarlet Crusade"

 form_the_scarlet_onslaught_decision:0 "Wrath of the Scarlets"
 form_the_scarlet_onslaught_decision_desc:0 "For every [Glossary('undead', 'UNDEAD_GLOSS')] we purge, twice as many rise to take their place. So long as the [scourge|E] remains bound to its dark master, it will continue to swell with the fallen. The architect of this unholy plague - the creator of the destruction of Lordaeron, the [GetTrait('lich_king').GetName(GetNullCharacter)], must be struck down, or the tide of death will never cease. If we sever this head then the body shall wither. To that end, we must gather the bravest among us, the most purest of heart and strongest in will, and launch an expedition into the frozen wastes of Northrend. There, upon frozen throne and cursed soil, we shall confront the source of this abomination and end it once and for all."
 form_the_scarlet_onslaught_decision_confirm:0 "The Scarlet Onslaught begins"
 form_the_scarlet_onslaught_decision_tooltip:0 "Hunt the architect of the unholy plague"
 is_there_a_lich_king:0 "Does the [GetTrait('lich_king').GetName(GetNullCharacter)] even exist right now?"
 spiritual_head_of_faith_for_scarlets:0 "You create the [head_of_faith|E] [title|E] for Scarletism."

 raise_a_new_hearthglen_decision:0 "Raise our own Hearthglen"
 raise_a_new_hearthglen_decision_desc:0 "Through a long and arduous journey, we sailed across vast waters to earn the colony of [GetTitleByKey('c_moaki').GetName]. We have wrestled [GetTitleByKey('d_moaki').GetName] out of hands of the #italic animals #!that lived here. Now, with sweat and tears we shall build ourselves a New Hearthglen! This will serve as our Capital and a symbol of our burning zeal!"
 raise_a_new_hearthglen_decision_tt:0 "It will take a few years to complete the contruction of the New Hearthglen."
 raise_a_new_hearthglen_decision_confirm:0 "Let the construction begin"
 raise_a_new_hearthglen_decision_tooltip:0 "Hear me Roar!"

 form_the_argent_dawn_decision:0 "Form the Argent Dawn"
 form_the_argent_dawn_decision_desc:0 "The Paladins of the [GetTitleByKey('k_order_of_the_silver_hand').GetName] teeter on the edge of ruin, while the Scarlet Crusade spread devastation under the guise of righteousness. These zealots turn their blades against their own brethren and punish the innocent in an age of faith's collapse and mortal peril. We do not have to be the same. We will aid the poor. We will uplift the suffering. We will stand firm for all that is just, and defy all that is wicked. A new #italic Dawn #!will rise on lordaeron..."
 form_the_argent_dawn_decision_confirm:0 "The Argent Dawn is here"
 form_the_argent_dawn_decision_tooltip:0 "We will empower all and defy the wicked"
 temporal_head_of_faith_for_argents:0 "You create the [head_of_faith|E] [title|E] for Argentism."
 argent_crusade:0 "Argent Crusaders"
 form_the_argent_dawn_magic:0 "Every character of the [GetFaithByKey('argent').GetAdjective] [faith|E] will have reduced [wc_spell|E] Cast Time when casting [wc_spell_school_light|E] spells"
 form_the_argent_dawn_magic_tt:0 "Formation of the Argent Dawn"

 liberate_lordaeron_from_the_scourge_decision:0 "Reform the Kingdom of Lordaeron"
 liberate_lordaeron_from_the_scourge_decision_desc:0 "The [GetTitleByKey('d_lordaeron').GetName] has been freed from the vile grasp of the [scourge|E]! With the [Glossary('undead', 'UNDEAD_GLOSS')] hordes weakened from our righteous victories, the time has come to reclaim the entirety of [GetTitleByKey('k_lordaeron').GetName] and appoint a new lord who will watch over [GetTitleByKey('k_lordaeron').GetName] to safeguard the realm and the people."
 liberate_lordaeron_from_the_scourge_decision_confirm:0 "Thy Kingdom Come"
 liberate_lordaeron_from_the_scourge_decision_tooltip:0 "The time for liberation is finally here!"

 restore_the_queldorei_rule_decision:0 "Restore the Quel'dorei Empire"
 restore_the_queldorei_rule_decision_desc:0 "Ten thousand years ago... we Highborne lived here in prosperity. We were above the common ranks of the other night elves. With our every need met by magic and wealth, we led lives of indulgence, amusement and greed... The time has come once again, to teach the Kaldorei a deserved lesson and take back our place as the High Rulers of all Elvenkind!"
 restore_the_queldorei_rule_decision_confirm:0 "Azshara's will shall be done!"
 restore_the_queldorei_rule_decision_tooltip:0 "Can you restore the Highborne to their former glory? Or are you willing to surpass Queen Azshara's power?"
 restore_the_queldorei_rule_decision_tt:0 "The World will tremble before your power!... But what powers are you willing to use and what are you willing to sacrifice?"

 reintegrate_shendralar_into_kaldorei_decision:0 "Mend the Shen'dralar Schism"
 reintegrate_shendralar_into_kaldorei_decision_desc:0 "For many ages the Shen'dralar have stayed Isolated from us and we expulsed them from the Night Elf society because of their abuse of Arcane Magic. Maybe it is time to set the differences aside and be tolerant of the Highborne once again? Although... the Blood Elves will not be fond of such a move..."
 reintegrate_shendralar_into_kaldorei_decision_confirm:0 "Welcome the Highborne"
 reintegrate_shendralar_into_kaldorei_decision_tooltip:0 "The time has come for the Night Elf Society to be reunited"
 shendralar_and_kaldorei_cultures_are_united_desc:0 "United our Cultures!"
 sindorei_and_kaldorei_cultures_are_united_desc:0 "Has offended the Sin'dorei by getting close to the Quel'dorei"

 legacy_of_defias_brotherhood_decision:0 "Avenge our Brethren"
 legacy_of_defias_brotherhood_decision_desc:0 "The Centre of power for the nobles has fallen. Their armies now lie in disarray and now the time is at hand! We will make them pay the debts they owe us... or the consequences for them shall be dire..."
 legacy_of_defias_brotherhood_decision_confirm:0 "Decide the Noble-kind's Fate"
 legacy_of_defias_brotherhood_decision_tooltip:0 "The Judgement day for the arrogant Nobles has come!"
 legacy_of_defias_brotherhood_decision_tt:0 "Do we finish what we started? Or do we deserve more rewards for our efforts?"

 remake_the_orcish_horde_decision:0 "Rekindle the Fires of the Horde"
 remake_the_orcish_horde_decision_azeroth_desc:0 "Old lands of when the Horde first landed in the new world have been reclaimed! Now is the time to unite the clans under one banner and reclaim our rightful lands."
 remake_the_orcish_horde_decision_kalimdor_desc:0 "A New World this may be, but we face too many perils and our security in these lands are always under some threat... We need to unite the clans under one banner once again if we wish for these to be our rightful lands."
 remake_the_orcish_horde_decision_fallback_desc:0 "Maybe one day, us Orcs can dream of uniting the Horde?"
 remake_the_orcish_horde_decision_confirm:0 "Lay the claim!"
 remake_the_orcish_horde_decision_tooltip:0 "Return of the Warchief!"

 build_orgrimmar:0 "Construct the Capital"
 build_orgrimmar_desc:0 "Wars, trials and tribulations... the [GetTrait('creature_orc').GetName(GetNullCharacter)]s have suffered too much just to find a place to rightfully call as our home. A perfect piece of land has been chosen, the resources have been gathered and fellow [GetTrait('creature_orc').GetName(GetNullCharacter)]s are ready to toil for the future of our kind. The time is now."
 build_orgrimmar_confirm:0 "Zug zug!"
 build_orgrimmar_tooltip:0 "Something need doing? Orc Peon is here!"
 will_take_time_to_build_orgrimmar:0 "It will take quite a few years for the contruction of the New Capital."

 create_gilnean_empire_decision:0 "Revive Greater Gilneas"
 create_gilnean_empire_decision_desc:0 "There was a time long ago, when the people of Gilneas and Kul Tiras were one and the same. That time may yet come again, this time with one person leading them both."
 create_gilnean_empire_decision_tooltip:0 "Gilneas becomes a [de_jure|E] [empire|E]"
 create_gilnean_empire_decision_effects_de_jure_tt_a:0 "If held, the following [kingdoms|E] will become [de_jure|E] part of [gilnean_gilneas_empire.GetNameNoTier]:\n[gilnean_kul_tiras.GetNameNoTier], [gilnean_tol_barad.GetNameNoTier], [gilnean_hillsbrad.GetNameNoTier], [gilnean_dustwallow.GetNameNoTier], [gilnean_mechagon.GetNameNoTier], [gilnean_plunder_isle.GetNameNoTier], [gilnean_valsharah.GetNameNoTier]"
 create_gilnean_empire_decision_effects_de_jure_tt_b:1 "All [duchies|E] in $custom_greater_gilneas$ become [de_jure|E] part of [gilnean_gilneas.GetNameNoTier], or remain part of their current [kingdom|E] if you hold that title"
 create_gilnean_empire_decision_confirm:0 "From sea to sea, again."

 restore_arathor_decision: "Restore Arathor"
 restore_arathor_decision_desc: "For too long have the [GetTrait('creature_human').GetName(ROOT.Char)] [kingdoms|E] of Arathor been divided. It is time to restore our former glory. #EMP Mine#!."
 restore_arathor_decision_tt: "Establish [GetTitleByKey('h_arathor').GetName] as your [primary_title|E]"
 restore_arathor_decision_confirm: "$restore_arathor_decision$"
 
 realm_controls_enough_noor_counties_desc: "You control [EmptyScope.ScriptValue('dar_al_noor_religion_county_control_value')|V0%] of all [GetReligionByKey('noor_religion').GetAdjective] [counties|E]: [root_scope.MakeScope.ScriptValue('noor_required_county_number_value')|V0] #weak ([root_scope.MakeScope.ScriptValue('noor_controlled_county_number_value')|V0])#!"
 
 invade_gnomeregan_decision:0 "Investigate Strange Noises"
 invade_gnomeregan_decision.desc:0 "While digging new tunnels, our people began hearing strange noises coming from deep within the earth. These sounds were clearly not made by anything natural."
 invade_gnomeregan_decision_tt:0 "This will start the invasion of Gnomeregan."
 invade_gnomeregan_decision_effect.tt:0 "We will try to reach the source of these strange sounds."
 invade_gnomeregan_decision_confirm:0 "Send the scouts"


 spread_radiation_decision:0 "Spread Radiation"
 spread_radiation_decision.desc:0 "By releasing radiation among our own people, we can ensure that the blessing of the Glow endures."
 spread_radiation_decision_tt:0 "This will expose your court to radiation."
 spread_radiation_decision_effect.tt:0 "Your courtiers will become irradiated."
 spread_radiation_decision_confirm:0 "Release the Radiation"

 gnomeregan_rebuilding_efforts_decision:0 "Rebuild Gnomeregan"
 gnomeregan_rebuilding_efforts_decision.desc:0 "Begin rebuilding efforts in the area surrounding Gnomeregan."
 gnomeregan_rebuilding_efforts_decision_tt:0 "This will help make the surroundings of Gnomeregan habitable again."
 gnomeregan_rebuilding_efforts_decision_effect.tt:0 "This will make the damage done by Sicco less severe."
 gnomeregan_rebuilding_efforts_decision_confirm:0 "Begin the work"

 operation_gnomeregan_decision:0 "Operation Gnomeregan"
 operation_gnomeregan_decision.desc:0 "It is time to retake our former capital from hands of Sicco and his leper Gnomes."
 operation_gnomeregan_decision_tt:0 "We will launch an operation to retake Gnomeregan."
 operation_gnomeregan_decision_effect.tt:0 "This is will help us retake Gnomeregan."
 operation_gnomeregan_decision_confirm:0 "Begin the Operation"

 summon_burning_legion_decision: "Summon the Burning Legion"
 summon_burning_legion_decision_desc: "[frostmourne|E] whispers, and the servant of the [GetTrait('lich_king').GetName(GetNullCharacter)] beckons me. The reason for existence of the [scourge|E] is about to be justified."
 summon_burning_legion_decision_tooltip: "Begin the preparations"
 summon_burning_legion_decision_confirm: "Beginning of the End"
 summon_burning_legion_decision.tt: "If either the [GetTrait('lich_king').GetName(GetNullCharacter)] or a fellow [vassal|E] holds the [GetTitleByKey('c_dalaran').GetName], it will be handed over to you to search for the Book of Medivh. If not, you will invade [GetTitleByKey('c_dalaran').GetName]. If you already hold [GetTitleByKey('c_dalaran').GetName], then you will jump to searching for Book of Medivh."

 embrace_felblood_decision: "Embrace the Fel Energies"
 embrace_felblood_decision_desc: "This is the only way to be victorious..."
 embrace_felblood_decision_tooltip: "Desperate times require desperate measures"
 embrace_felblood_decision_confirm: "Lok'tar ogar!"
 you_are_a_fel_religion_fangirl: "Your faith is one of these: #V Corruptism#!,#V Sargerism#!,#V Black Harvest#!"
 a_non_demon_hunter_demon_is_your_prisoner: "You have a [GetTrait('being_demon').GetName(GetNullCharacter)] imprisoned #help (It cannot be a [GetTrait('demon_hunter').GetName(GetNullCharacter)])#!"
 a_non_demon_hunter_demon_is_your_liege: "You have a [GetTrait('being_demon').GetName(GetNullCharacter)] [top_liege|E]/[liege|E] #help (It cannot be a [GetTrait('demon_hunter').GetName(GetNullCharacter)])#!"
 demon_liege_tt: "You approach your [liege|E]..."
 demon_prisoner_tt: "You approach your prison dungeons..."

 become_legion_commander_decision: "Gain the Blessings of Sargeras"
 become_legion_commander_decision_desc: "I have proven my worth! I can already feel the powers start to surge within me. The time is now, I shall be a servant of the [burning_legion|E] like no other!"
 become_legion_commander_decision_enough_battle_kills: "You have killed at least 20 or more mortals"
 become_legion_commander_decision_tooltip: "Fear me mortals!"
 become_legion_commander_decision_confirm: "Embrace the Will of Sargeras!"

 destroy_the_world_tree: "Destroy the Nordrassil"
 destroy_the_world_tree_desc: "Destiny is at hand! Witness the end of the Night Elves, you mortals! The final hour has come!"
 destroy_the_world_tree_tooltip: "Now there shall be no god powerful than me!"
 destroy_the_world_tree_confirm: "Destroy the World Tree"
 weaker_nordrassil_being_destroyed: "Since you are destroying a weakened World Tree, you will gain a weaker modifier after absorbing the powers from the Well of Eternity beneath it."
 prime_nordrassil_being_destroyed: "Since you are destroying a prime World Tree, you will gain a stronger modifier after absorbing the powers from the Well of Eternity beneath it."

 restore_well_of_eternity: "Restore the Well of Eternity"
 restore_well_of_eternity_desc: "The [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )] needs to be restored to a certain degree if we wish to stabalize our civilization in Kalimdor. Only a seed from [GetBuilding('teldrassil').GetName] can be potent enough to restore its power and let the nature above it take its roots."
 restore_well_of_eternity_tooltip: "Let balance be restored!"
 restore_well_of_eternity_confirm: "Andu-falah-dor!"
 restore_well_of_eternity_tt: "The restoration will take some time to take its roots and grant us its blessings once again..."

 # Separate from Zul Head of Faith
 separate_from_zul_head_of_faith_decision:0 "Separate From Zandalari Religious Control"
 separate_from_zul_head_of_faith_decision_desc:0 "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] is a distant, unworthy figure, ill-prepared to lead us. For too long have we allowed the Zandalari to control us in matters of faith! No longer!"
 separate_from_zul_head_of_faith_decision_confirm:0 "I am guided by [ROOT.Char.GetFaith.PositiveAfterLife|U]!"
 separate_from_zul_head_of_faith_decision_tooltip:0 "We will get a new [head_of_faith|E]!"
 separate_from_zul_new_hof:0 "A local priest will become our new [head_of_faith|E]"
 separate_from_zul_new_hof_past:0 "[CHARACTER.GetFaith.GetReligiousHead.GetTitledFirstName] has become our new [head_of_faith|E]"
