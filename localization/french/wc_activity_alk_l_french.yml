l_french:
 activity_anti_lichking:0 "Assaut sur Citadelle de la Couronne de glace"
 activity_anti_lichking_name:0 "[ACTIVITY.GetOwner.GetShortUINamePossessive|U] assaut sur la Citadelle de la Couronne de glace"
 activity_anti_lichking_desc:0 "Sous la direction de Terenia Menethil, un assaut audacieux est lancé contre la Couronne de glace, visant le cœur du pouvoir du roi-liche. Cette initiative audacieuse, née d'un désir de justice et de vengeance pour Lordaeron, représente un moment critique dans la quête de Terenia pour vaincre l'ombre qui plane depuis longtemps sur sa patrie. Bravant les étendues glacées et les légions de morts-vivants, Terenia et ses alliés affrontent les forces obscures qui gardent la Citadelle de la Couronne de glace, déterminés à mettre fin au règne du roi-liche une fois pour toutes."
 activity_anti_lichking_owner:0 "Terenia Menethil"
 activity_anti_lichking_invalid:0 "[activity.GetName] Invalide"
 activity_anti_lichking_invalid_tooltip:0 "#V $activity_anti_lichking$#! devient invalide"
