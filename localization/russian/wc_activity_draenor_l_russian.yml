 bdp_finance_good_desc: "Эта угроза серьёзнее, чем мы думали. Мы должны выделить ещё больше ресурсов и людей."
 bdp_finance_enormous_desc: "Орда - угроза для нашего государства. Каждый воин должен встать на защиту своей семьи, а страна обеспечит их всем необходимым."
  
