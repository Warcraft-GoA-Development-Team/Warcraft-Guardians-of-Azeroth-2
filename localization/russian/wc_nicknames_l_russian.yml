 nick_the_thunder_king: "[Select_CString(CHARACTER.IsFemale, 'Владычица Грома', 'Властелин Грома' )]"
 nick_the_thunder_king_desc: "Молния – всего лишь недолговечная вспышка. Но гром… Гром! Гром предвещает пришествие бури. Гром сотрясает небеса задолго до того, как их озарят молнии, а эхо его витает в горах даже после того, как буря отшумела. Гром обращает животных в бегство и наполняет сердца крестьян страхом. Гром будет моим вестником, дабы о моей власти знали по всей земле. Я буду... [Concept( 'the_thunder_king', 'Властелином Грома' )|E]!"
 nick_lorewalker: "[Select_CString(CHARACTER.IsFemale, 'Хранительница', 'Хранитель' )] истории"
 nick_lorewalker_desc: "Немногим подвластны великие знания о тайнах Пандарии."
 nick_the_warlord: "[Select_CString(CHARACTER.IsFemale, 'Военачальница', 'Военачальник' )]"
 nick_the_warlord_desc: "Есть ли более великое призвание, чем сеять войну и разрушения по всей земле?"
 nick_the_breaker: "[Select_CString(CHARACTER.IsFemale, 'Разрушительница', 'Разрушитель' )]"
 nick_the_breaker_desc: "Все они рано или поздно ломаются."
 nick_iron_qon: "Кон Железный"
 nick_iron_qon_desc: "Легенды рассказывают о жестокости Кона и его цийлиньских воителей. [thunder_king|E] прозвал бесстрашного полководца могу «Коном Железным» за его неумолимую решимость добиваться для империи победы за победой, чего бы это ни стоило."
 nick_the_harmonious: "[Select_CString(CHARACTER.IsFemale, 'Безмятежная', 'Безмятежный' )]"
 nick_the_harmonious_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [Select_CString( CHARACTER.IsLocalPlayer, 'находитесь', 'находится')] в идеальном равновесии с миром."
 nick_the_twin_empyrean: "Небесная сестра"
 nick_the_twin_empyrean_desc: "Небесные сёстры - одни из самых самых грозных воителей [Concept( 'thunder_king', 'Властелина Грома' )|E]. Стремясь защитить своё правление, Лэй Шэнь держит своих верных приближенных поближе, а их объединённый арсенал против вторженцев - ещё ближе."
  
