 pam_decision_events.0009.t: "A Sacred Administration"
 pam_decision_events.0009.desc: "I adore the [ROOT.Char.Custom('ReligiousHeadHeadgear')], placing it on my head, and come before my devout [ROOT.Char.GetFaith.GetAdherentNamePlural]:\n\n"The old ways of fiefs and writs have served us well, until they started leading us astray. Driven by the word of [ROOT.Char.GetFaith.HighGodName], it is [ROOT.Char.GetFaith.HighGodNameSheHe|U] who defines how we should rule over [ROOT.Char.GetPrimaryTitle.GetNameNoTier]. I am just [ROOT.Char.GetFaith.HighGodHerHis|U] humble servant, and so are all of you.""
