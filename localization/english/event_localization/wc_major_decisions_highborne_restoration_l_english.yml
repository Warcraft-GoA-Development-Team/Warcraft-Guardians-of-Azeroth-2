# Restoring the Highborne as Elven High Rulers/Emperors
 wc_restoring_the_queldorei.0001.title:0 "The Dream of Queen Azshara"
 wc_restoring_the_queldorei.0001.a:0 "I shall surpass even the Queen herself! This World in Mine!"
 wc_restoring_the_queldorei.0001.b:0 "All Elvenkind shall acknowledge me as their true leader!"
 wc_restoring_the_queldorei.0001.desc:0 "I have conquered the precious Jewel of the Kaldorei. They ousted my kind and my Queen and now they dare sit on her throne? But that time has passed... The time has come, the war councils have been gathered and fellow Highborne gather around me.\n\nBut how shall we go about it?\n\nI have the loyalty of my Highborne and my claims fabricated, the Elven Army gathered and ready to march with me to take my rightful place as the Ruler of all Elvenkind!\n\nOr... I can follow the footsteps of Queen Azshara herself? Not only the Elvenkind, but this world will bow to me! Although... the price to pay for attaining such powers will be heavy..."
 highborne_fel_legion:0 "Highborne Legion"
 highborne_loyalists:0 "Elite Highborne Loyalists"
