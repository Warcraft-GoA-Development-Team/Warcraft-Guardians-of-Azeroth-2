 nick_the_harbinger_of_the_void_desc: "Королева Азшара приняла [CHARACTER.GetShortUINameNoTooltipNoFormat|U] на службу Н'Зота, где [CharYouSheHe(CHARACTER)] повелевает[_s(CHARACTER)] полчищами ползучих тварей, возвещающих приход своего хозяина."
 nick_the_ashbringer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] первым владельцем Испепелителя, и со временем человек и оружие стали носить одно и то же легендарное имя."
 nick_the_lightbringer_desc: "Туралион нарек [CHARACTER.GetShortUINameNoTooltipNoFormat|U] Светоносцем, увидев, как [CharYouSheHe(CHARACTER)] вдохновлял(а) Альянс Святым Светом."
 nick_the_wildshaper_desc: "Осквернив святилище Эльдретарра, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] стал(а) внушать страх как Укротитель Дикой Природы благодаря [CharYourHerHis(CHARACTER)] власти над порабощёнными защитниками природы."
 nick_the_banshee_desc: "Артас убил [CHARACTER.GetShortUINameNoTooltipNoFormat], вырвал [CharYourHerHis(CHARACTER)] душу из [CharYourHerHis(CHARACTER)] тела и превратил [CharYouHerHim(CHARACTER)] в банши."
 nick_the_lightning_fist_desc: "[CharYourHerHis(CHARACTER)|U] оружие заряжено энергией Природы, накапливая электрический заряд с каждым ударом и призывая грозы."
 nick_the_lucid_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] сохранял(а) сознание на протяжении 877 лет, проведённых в янтаре, столетиями поддерживая [CharYourHerHis(CHARACTER)] разум в тонусе, придумывая и разгадывая загадки."
 nick_the_locust_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] на десятилетия задержал(а) строительство Хребта Змея, нападая на трудовые лагеря и фермы и убивая рабочих у стены."
 nick_the_manipulator_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] использует[_s(CHARACTER)] звуковую магию, чтобы подчинять разум врагов и кунчонгов, включая [CharYourHerHis(CHARACTER)] обученного спутника Ковока."
 nick_the_wind_reaver_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] заслужил(а) имя Похититель Ветра на четырнадцатый день [CharYourHerHis(CHARACTER)] жизни, убив надзирателя Сюэсина в разрушительной атаке с воздуха."
 nick_the_prime_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] предложил(а) сохранять величайших воинов мантидов в янтаре и стал(а) первым образцом — Первым."
 nick_the_dissector_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] прозван(а) за [CharYourHerHis(CHARACTER)] талант использовать знание физиологии, чтобы эффективнее убивать [CharYourHerHis(CHARACTER)] врагов."
 nick_the_bloodseeker_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] варварский воин, пьющий кровь [CharYourHerHis(CHARACTER)] врагов, утверждая, что она дарует [CharYouHerHim(CHARACTER)] силу."
 nick_the_poisoned_mind_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] искусный алхимик, специализирующийся на ядах и взрывчатых составах, некогда ценимый как королевский алхимик великой императрицы Шек'зир."
 nick_the_hexxer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] гурубашийский знахарь немалой силы, насылающий сглазы и проклятия во служение Хаккару."
 nick_the_bloodcursed_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] предводитель Кроваво-проклятых наг — проклятых выживших, что бродят в водах вокруг Острова Кровавой Тайны."
 nick_the_maiden_of_grief_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] скорбит[_s(CHARACTER)], обратившись против прежних союзников по приказу Локена, даже когда [CharYourHerHis(CHARACTER)] скорбь выковывается в оружие."
 nick_the_crazy_cat_lady_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] патрулирует[_s(CHARACTER)] Ульдуар в окружении множества свирепых кошачьих спутников."
 nick_the_furnace_master_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] трудится[_s(CHARACTER)] у Исполинской Кузни Ульдуара, создавая железные армии, которым суждено покорить Азерот."
 nick_the_everliving_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] был(а) столько раз убит(а) и поднят(а) вновь племенем Винтеракс, что смерть редко удерживает [CharYouHerHim(CHARACTER)]."
 nick_champion_of_the_horde_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] ключевой фигурой в ранних победах Орды и основании Оргриммара, и Тралл провозгласил [CharYouHerHim(CHARACTER)] Защитником Орды."
 nick_the_destructor_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] живой машиной разрушения, движимой ненавистью, злобой и яростью, чтобы стирать с лица земли и убивать всё на [CharYourHerHis(CHARACTER)] пути."
 nick_of_the_harvest_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] ведьмой урожая, одной из гилнеасских друидов, практикующих древние искусства, известные как старые пути."
 nick_truthbearer_desc: "При жизни братья [CHARACTER.GetShortUINameNoTooltipNoFormat|U] звали [CharYouHerHim(CHARACTER)] Носителем Истины и восхваляли [CharYourHerHis(CHARACTER)] самоуглублённость и мудрость."
 nick_the_don_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] криминальным боссом Боралуса, за которым стоит Клуб Водорослей, известным предложениями, от которых трудно отказаться."
 nick_kingslayer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] претендует[_s(CHARACTER)] на титул Цареубийцы, ни разу не вступав в Цитадель Ледяной Короны и уж тем более не встречавшись с Королём-личом."
 nick_the_fallen_king_desc: "Жаждущий власти [CHARACTER.GetShortUINameNoTooltipNoFormat|U] заключил сделку с Королём-личом и после смерти обнаружил, что Врата Доблести закрыты для [CharYouHerHim(CHARACTER)]."
 nick_bulwark_of_torcali_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] защитником Торкали, посланным оберегать её последователей и помогать им."
 nick_the_butcher_queen_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] возглавляет[_s(CHARACTER)] Ната'вор — племя кровавых троллей, известное ритуальным каннибализмом и тем, что кормит пленников своими пастежуями."
 nick_the_crawg_mada_desc: "Единственное, что [CHARACTER.GetShortUINameNoTooltipNoFormat|U] любит[_s(CHARACTER)], — это [CharYourHerHis(CHARACTER)] кравги, которых откармливают телами зандалари, пока они не становятся огромными и смертоносными."
 nick_the_deadtalker_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] осквернённым Говорящим с Мёртвыми из яунголов Таунлуна, призывающим заунывных духов на [CharYourHerHis(CHARACTER)] сторону."
 nick_the_coldbringer_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] правит[_s(CHARACTER)] Курганами Иглошкурых с помощью тёмной магии Плети, окружённый холодным пламенем и могущественным ледяным чародейством."
 nick_the_fleshcrafter_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] среди первых некромантов Схоломанса, считая подопытных и товарищей по учёбе не более чем материалом для экспериментов."
 nick_the_crazed_desc: "Сражаясь с прежними друзьями и союзниками, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] постепенно лишился рассудка, превратившись из Пробуждённого в Безумного."
 nick_the_duskbringer_desc: "Вернув филактерию Кел'Тузада Королю-личу, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharWereWas(CHARACTER)] превращён в лича Тель'зана Сумеречника."
 nick_the_souleater_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] владеет[_s(CHARACTER)] Серпом Душ — оружием, которым [CharYouSheHe(CHARACTER)] захватывает и заточает души демонов."
 nick_the_chuggernaut_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] хмелеваром, помешанным на пиве, кричащим при одном его упоминании и редко упускающим шанс выпить или сварить ещё."
 nick_the_soul_slaver_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] призывает[_s(CHARACTER)] порабощённые души на [CharYourHerHis(CHARACTER)] сторону и вырывает[_s(CHARACTER)] души из [CharYourHerHis(CHARACTER)] врагов."
 nick_the_hoard_keeper_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] охраняет[_s(CHARACTER)] Разбухшее Хранилище и носит[_s(CHARACTER)] Ключ Хранителя Сокровищ, необходимый, чтобы разграбить его богатства."
 nick_the_lifedrainer_desc: "Вливание Анимы [CHARACTER.GetShortUINameNoTooltipNoFormat|U] сокращает жизнь [CharYourHerHis(CHARACTER)] жертв, а Кровавая Стрела поражает их осквернённой кровью."
 nick_the_soul_gatherer_desc: "Души заточаются в бусинах [CHARACTER.GetShortUINameNoTooltipNoFormat] и высвобождаются посредством [CharYourHerHis(CHARACTER)] тёмных ритуалов."
 nick_the_eternal_watcher_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharHaveHas(CHARACTER)] бессчётное число раз убит(а), но всякий раз вновь пробуждается[_s(CHARACTER)] у Мыса Оленьего Шлема, привязанный туда даже после смерти."
 nick_the_bananamancer_desc: "Бананаранг, Банановое Безумие и даже Волшебный Банан — всё это часть необычного арсенала [CHARACTER.GetShortUINameNoTooltipNoFormat]."
 nick_the_facestomper_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] бродит[_s(CHARACTER)] по Порту Зем'лана, топча лица обескровленных защитников и беженцев."
 nick_the_black_flame_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] распорядителем «Чёрного Пламени» — независимой организации, торгующей редкими товарами и развлечениями."
 nick_the_perfect_one_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] [CharAreIs(CHARACTER)] Высшим Ханом совершенных — расы кентавров, созданной земляным элементалем."
 nick_the_resonator_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] владеет[_s(CHARACTER)] Звуковым Воплем и Оглушающим Звуком, прислушиваясь к песне императрицы."
 nick_the_imperial_blade_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] сражается[_s(CHARACTER)] клинком и когтями в безраздельном служении императрице мантидов."
 nick_the_blight_desc: "[CHARACTER.GetShortUINameNoTooltipNoFormat|U] поражает[_s(CHARACTER)] землю ядовитыми залпами и клинками, пропитанными ядом."
 nick_the_awakened_desc: "Осознав, что Алый Орден нападает не только на нежить, но и на живых, [CHARACTER.GetShortUINameNoTooltipNoFormat|U] обратился против него и стал Пробуждённым."
