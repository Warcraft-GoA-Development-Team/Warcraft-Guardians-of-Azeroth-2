 building_leviroth_prison: "Тюрьма Левирота"
 building_leviroth_prison_desc: "500 лет назад кракен по имени Левирот был заточён здесь Азшарой."
 building_leyhollow: "Лей-Лощина"
 building_leyhollow_desc: "Из-за близкой открытой лей-линии пещеру заполняют кристаллы, богатые маной."
 building_lights_hope_01: "$building_type_lights_hope_01$"
 building_lights_hope_01_desc: "База операций Аргентского крестового похода в Восточных Чумных землях и место утешения для всех, кто совершает сюда путь."
 building_lights_hope_02: "Святилище Света"
 building_lights_hope_02_desc: "Тайный зал под Часовней Упования Света. Это катакомбы, хранящие останки тысячи героев Лордерона — воинов, жрецов, паладинов и чемпионов давних битв."
 building_lion_pride_inn: "Гостиница «Львиная гордость»"
 building_lion_pride_inn_desc: "Отдых и покой для усталых и продрогших — вот наш девиз! Прошу, присядьте у огня и дайте отдых своим утомлённым костям."
 building_maisara_hills: "Холмы Майсары"
 building_maisara_hills_desc: "Холмы Майсары были бы отличным местом для расширения познаний в вуду, если бы не тот факт, что тролли благодаря своей магии способны заметить даже самых скрытных чужаков."
 building_maker_perch: "Насест Создателей"
 building_maker_perch_desc: "Сооружение [Glossary( 'titan', 'TITAN_GLOSS' )]ов, возведённое как наблюдательный пункт, с которого они надзирали за своими творениями."
 building_maldraz: "Малдраз"
 building_maldraz_desc: "Малдраз — великое древо в Осквернённом лесу Выжженных земель."
