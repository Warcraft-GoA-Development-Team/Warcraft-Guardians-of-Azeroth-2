l_english:
 wc_thalassian_flavor_events.0010.t:0 "A House in Decline"
 wc_thalassian_flavor_events.0010.d:0 "Debt has finally caught up with one of the older Thalassian houses. With little left to sell, its members have begun parting with their ancestral library.\n\nMost of the volumes are histories and genealogies, but several arcane treatises catch my eye — old works filled with corrections, observations, diagrams, and notes accumulated over generations.\n\nKnowledge such as this rarely reaches the open market."
 wc_thalassian_flavor_events.0010.a:0 "One volume should be enough."
 wc_thalassian_flavor_events.0010.b:0 "I will take the entire collection."
 wc_thalassian_flavor_events.0010.c:0 "I know collectors who will pay handsomely."

 wc_thalassian_flavor_events.0020.t:0 "The Ancient Magister"
 wc_thalassian_flavor_events.0020.d:0 "An aged magister has asked for an audience. His hands tremble around the head of his staff, but there is nothing frail in his voice.\n\nHe has spent centuries moving between schools of magic, teaching where he was welcomed and studying where he was not. A few questions are enough to dispel any doubt: the old elf knows more than most magisters learn in a lifetime.\n\nHe asks for no estate and little comfort. What he seeks is a final appointment — a place as Court Mage, where his knowledge might still be of use.\n\nMy liege would undoubtedly value a magister of such experience as well."
 wc_thalassian_flavor_events.0020.a:0 "Then spend your final years here."
 wc_thalassian_flavor_events.0020.a_tt_no_court_mage:0 "You do not currently employ a Court Mage."
 wc_thalassian_flavor_events.0020.a_tt_can_employ:0 "Your court can employ a Court Mage."
 wc_thalassian_flavor_events.0020.b:0 "My liege has greater need of your talents."
 wc_thalassian_flavor_events.0020.c:0 "You have served long enough. Choose your own road."
 wc_thalassian_ancient_magister_lifespan:0 "Weight of Centuries"
 wc_thalassian_ancient_magister_lifespan_desc:0 "This ancient magister's long life is finally drawing toward its natural end."

 wc_thalassian_flavor_events.0030.t:0 "The Old Border"
 wc_thalassian_flavor_events.0030.d:0 "Farstrider patrols along the marches have returned with troubling reports. Warbands under [amani_ruler.GetName] that usually raid and vanish on their own are moving with unusual discipline. Trails converge where they should not, camps are being supplied in concert, and signals pass between bands that seldom cooperate.\n\nNo army has crossed the border, and skirmishes here are hardly new. Yet the pattern is difficult to dismiss: the old enemy is coordinating."
 wc_thalassian_flavor_events.0030.a:0 "The Farstriders will remind them where the border lies."
 wc_thalassian_flavor_events.0030.a_cultural_acceptance:0 "Renewed hostilities along the old [ROOT.Char.GetCulture.GetName]-[amani_ruler.GetCulture.GetName] border"
 wc_thalassian_flavor_events.0030.b:0 "Strengthen the passes. Let them come."
 wc_thalassian_flavor_events.0030.b_tt:0 "Some counties will gain [GetModifier('wc_thalassian_old_border_fortifications_modifier').GetNameWithTooltip] for #V 5 years#!"
 wc_thalassian_flavor_events.0030.c:0 "Do not provoke them. I want to know who is organizing these raids."
 wc_thalassian_old_border_counter_tactics_modifier:0 "Amani Counter-Tactics"
 wc_thalassian_old_border_counter_tactics_modifier_desc:0 "Farstrider patrols have adapted their tactics to deny the Amani the advantages of familiar ground."
 wc_thalassian_old_border_fortifications_modifier:0 "Reinforced Border"
 wc_thalassian_old_border_fortifications_modifier_desc:0 "Garrisons have been reinforced, local levies drilled, and watch posts established throughout the southern marches."
 wc_thalassian_old_border_intelligence_modifier:0 "Eyes on Zul'Aman"
 wc_thalassian_old_border_intelligence_modifier_desc:0 "Farstrider scouts have been ordered to watch Amani movements closely and report any sign of coordination."

 wc_thalassian_flavor_events.0040.t:0 "The Faltering Ward"
 wc_thalassian_flavor_events.0040.d:0 "Local magisters responsible for a lesser protective ward have sent an urgent report. The warding enchantment has begun to flicker at irregular intervals, leaving a small stretch of the surrounding district less secure than intended.\n\nThe fault is limited to this single ward, and its tenders believe it can be repaired without difficulty. Yet the pattern of instability is unusual enough that careful study might reveal something about the old enchantment — if it does not worsen first."
 wc_thalassian_flavor_events.0040.a:0 "Repair it at once. There is no time for experiments."
 wc_thalassian_flavor_events.0040.b:0 "Study the flaw before completing the repairs."
 wc_thalassian_flavor_events.0040.c:0 "Leave the old enchantment undisturbed."
 wc_thalassian_faltering_ward_stabilized_modifier:0 "Stabilized Local Ward"
 wc_thalassian_faltering_ward_stabilized_modifier_desc:0 "A lesser protective ward in this county has been repaired and reinforced, modestly strengthening local defenses."
 wc_thalassian_faltering_ward_instability_modifier:0 "Lingering Ward Instability"
 wc_thalassian_faltering_ward_instability_modifier_desc:0 "A lesser protective ward in this county remains unstable, leaving a small weakness in local defenses."

 wc_thalassian_flavor_events.0050.t:0 "Without the Sun"
 wc_thalassian_flavor_events.0050.d:0 "Reports from scattered households speak of the same affliction. Elves with no great gift for spellcraft have grown weak and listless, unable to keep pace with their accustomed duties. The old, the very young, and those already ill are failing fastest.\n\nAt first, the healers feared some lingering malady of the Scourge. Yet neither they nor the magisters can find any taint or contagion. The sufferers share no wound, district, or calling — only the same emptiness.\n\nIt is not something the Scourge left behind. With the Sunwell gone, its absence is reaching into the lives of our people. Stores and skilled hands are scarce. I must decide who receives them."
 wc_thalassian_flavor_events.0050.a:0 "See that the most vulnerable are cared for."
 wc_thalassian_flavor_events.0050.b:0 "Have the healers and magisters ease their suffering."
 wc_thalassian_flavor_events.0050.c:0 "Those who can still stand must come first."
 wc_thalassian_without_sun_relief_modifier:0 "Relief for the Vulnerable"
 wc_thalassian_without_sun_relief_modifier_desc:0 "Limited supplies and skilled care have been directed to the households suffering most, easing fear and preserving local stability."
 wc_thalassian_without_sun_triage_modifier:0 "Emergency Triage"
 wc_thalassian_without_sun_triage_modifier_desc:0 "Scarce supplies have been reserved first for those able to defend and rebuild the realm, sustaining local readiness at a painful social cost."

 wc_thalassian_flavor_events.0060.t:0 "The Last of Their Name"
 wc_thalassian_flavor_events.0060.d:0 "The grim work of matching casualty rolls to abandoned properties has revealed the near-end of an old Thalassian house. One heir still lives, but almost no family remains to fill the estate's empty rooms.\n\nThe Scourge left parts of the property standing. Several buildings can still be used, stores remain sealed below, and a handful of retainers have kept what order they can. They now await my direction.\n\nElsewhere, survivors driven from ruined homes plead for shelter and supplies. I must decide whether this remnant will preserve a family, serve the realm for a time, or answer the immediate needs of the living."
 wc_thalassian_flavor_events.0060.a:0 "The House Will Endure."
 wc_thalassian_flavor_events.0060.b:0 "The Crown Will Hold It."
 wc_thalassian_flavor_events.0060.c:0 "The Living Need It More."
 wc_thalassian_last_name_preserved_modifier:0 "Continuity Preserved"
 wc_thalassian_last_name_preserved_modifier_desc:0 "Recognizing the final heir and preserving the remaining estate has earned approval among the surviving traditional elite."
 wc_thalassian_last_name_stewardship_modifier:0 "Estate Under Crown Stewardship"
 wc_thalassian_last_name_stewardship_modifier_desc:0 "The crown is temporarily administering a surviving noble estate and putting its buildings, stores, and retainers to use during reconstruction."
 wc_thalassian_last_name_refugees_modifier:0 "Refuge at the Old Estate"
 wc_thalassian_last_name_refugees_modifier_desc:0 "A surviving estate has been opened to displaced people, winning local gratitude while their settlement creates a temporary administrative burden."

 wc_thalassian_flavor_events.0070.t:0 "The Crystal Hoarder"
 wc_thalassian_flavor_events.0070.d:0 "An inventory of household stores has uncovered a locked chamber holding an unexpectedly large cache of crystals charged with arcane energy. The cache belongs to a minor member of my court, who quietly accumulated it while such stores became ever harder to find.\n\nFear, foresight, selfishness, or merely the desire to survive may have guided them; nothing proves malice. Yet other Thalassians still suffer the gnawing pain of magical withdrawal while power enough to ease it sits behind one person's lock.\n\nThe crystals are theirs — or were. I can leave the cache untouched, seize and distribute it among those suffering most, or purchase it for relief."
 wc_thalassian_flavor_events.0070.a:0 "Seize the cache and distribute it to those in need."
 wc_thalassian_flavor_events.0070.b:0 "The crystals are theirs to keep."
 wc_thalassian_flavor_events.0070.c:0 "Name your price. The cache will go to those in need."
 wc_thalassian_crystal_redistribution_modifier:0 "Arcane Crystal Relief"
 wc_thalassian_crystal_redistribution_modifier_desc:0 "Crystals charged with arcane energy have been distributed to those suffering most from magical withdrawal, earning local approval."
 wc_thalassian_crystal_elite_disapproval_modifier:0 "Private Stores Seized"
 wc_thalassian_crystal_elite_disapproval_modifier_desc:0 "The seizure of a private crystal cache has made surviving elites wary of arbitrary interference with their own property."
 wc_thalassian_crystal_property_respected_modifier:0 "Private Stores Respected"
 wc_thalassian_crystal_property_respected_modifier_desc:0 "Upholding ownership of a private crystal cache during the crisis has reassured surviving property-holders."
 wc_thalassian_crystal_popular_resentment_modifier:0 "Resentment over Crystal Scarcity"
 wc_thalassian_crystal_popular_resentment_modifier_desc:0 "Protecting a private cache while others suffer magical withdrawal has provoked resentment among the wider population."

 wc_thalassian_flavor_events.0080.t:0 "Withdrawal at Court"
 wc_thalassian_flavor_events.0080.d:0 "Unanswered correspondence crowds the desks while ledgers remain half-finished. Normally reliable scribes can no longer remain at their work for long; attendants cover multiple duties, and routine reports arrive late as minor officials pause to regain their strength.\n\nThere is no mystery in it. Without the Sunwell, withdrawal has reached the clerks and arcane functionaries who keep my household working. The realm's needs have not diminished with their strength. I must decide how this court will carry on."
 wc_thalassian_flavor_events.0080.a:0 "Give Them Time"
 wc_thalassian_flavor_events.0080.b:0 "Find Replacements"
 wc_thalassian_flavor_events.0080.c:0 "The Realm Cannot Wait"
 wc_thalassian_withdrawal_court_rest_modifier:0 "Reduced Court Workloads"
 wc_thalassian_withdrawal_court_rest_modifier_desc:0 "Afflicted members of the household have been given time to rest, slowing administration but earning appreciation for their humane treatment."
 wc_thalassian_withdrawal_court_replacements_modifier:0 "Additional Court Staff"
 wc_thalassian_withdrawal_court_replacements_modifier_desc:0 "Additional hands and reassigned personnel are keeping essential administrative work on schedule."
 wc_thalassian_withdrawal_court_discipline_modifier:0 "Unyielding Court Discipline"
 wc_thalassian_withdrawal_court_discipline_modifier_desc:0 "Essential work continues under strict discipline, improving immediate revenue at the cost of household morale."

 wc_thalassian_flavor_events.0090.t:0 "An Unlikely Friend"
 wc_thalassian_flavor_events.0090.d:0 ""[ROOT.Char.GetMotherFather|U]! You'll never guess who I was playing with." [thalassian_child.GetFirstNameNoTooltip] bounds into the room, cheeks flushed with excitement. "I met [amani_child.GetName], from the [amani_ruler.GetCulture.GetName] lands! We played together and shared stories about our families. I think we could be friends!"\n\nWhile we are not so fond of the [amani_ruler.GetCulture.GetNameNoTooltip] people, this friendship could be a valuable opportunity, or just what they need to infiltrate us."
 wc_thalassian_flavor_events.0090.a:0 "Stay away from [amani_child.GetHerHim]!"
 wc_thalassian_flavor_events.0090.a_tt: "You forbid the friendship between [thalassian_child.GetFirstNameNoTooltip] and [amani_child.GetFirstNameNoTooltip]."
 wc_thalassian_flavor_events.0090.a_cultural_acceptance:0 "A [ROOT.Char.GetCulture.GetName] ruler is forbidding friendships with an [amani_ruler.GetCulture.GetName] ruler"
 wc_thalassian_flavor_events.0090.b:0 "That is wonderful, [thalassian_child.GetFirstNameNoTooltip]!"
 wc_thalassian_flavor_events.0090.b_tt: "You encourage the friendship between [thalassian_child.GetFirstNameNoTooltip] and [amani_child.GetFirstNameNoTooltip]."
 wc_thalassian_flavor_events.0090.b_cultural_acceptance:0 "A [ROOT.Char.GetCulture.GetName] ruler is fostering friendships with an [amani_ruler.GetCulture.GetName] ruler"
 wc_thalassian_flavor_events.0090.c:0 "Bring me information about [amani_ruler.GetFirstNameNoTooltip]."
 wc_thalassian_flavor_events.0090.c_tt:0 "You have your child spy on the [amani_ruler.GetCulture.GetName] ruler."
 wc_thalassian_amani_child_spy_modifier:0 "Child Spy"
 wc_thalassian_amani_child_spy_modifier_desc:0 "This character's child has been tasked with spying on a neighboring ruler, gathering information about their court and activities."

 wc_thalassian_flavor_events.0100.t:0 "The Wretched of [root_county.GetNameNoTierNoTooltip]"
 wc_thalassian_flavor_events.0100.d:0 "As I traverse through [root_county.GetNameNoTierNoTooltip], I am struck by the smell of decay. With our Sunwell standing without power, we have all suffered without the potent source of magic.\n\n"[ROOT.Char.GetShortUINameNotMeNoTooltipNoFormat]," a sickly, skinny-looking elf calls out to me. "M-mana... please, I need mana.""
 wc_thalassian_flavor_events.0100.a:0 "Take my mana, I can spare it."
 wc_thalassian_flavor_events.0100.b:0 "Here, buy yourself a potion if you can."
 wc_thalassian_flavor_events.0100.c:0 "You are not the only one suffering."
 
