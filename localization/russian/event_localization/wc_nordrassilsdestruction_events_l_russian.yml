l_russian:
  
 nordrassilsdestruction_0001_title: "Полубог среди смертных"
 nordrassilsdestruction_0001_desc: "Я чувствую, как сила наполняет меня, пока я поглощаю [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )] для себя.\n\nДа! Теперь Ночные Эльфы будут лишены своего драгоценного бессмертия, а я стану сильнейшим среди них!"
 nordrassilsdestruction_0001_a: "Я — погибель Ночных Эльфов!"
  
 nordrassilsdestruction_0002_title: "Бог среди смертных"
 nordrassilsdestruction_0002_desc: "Я чувствую, как сила наполняет меня, пока я поглощаю [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )] для себя.\n\nДа! Теперь Ночные Эльфы будут лишены своего драгоценного бессмертия, а я стану сильнейшим даже среди Богов!"
 nordrassilsdestruction_0002_a: "Я — бич всего живого!"
  
 nordrassilsdestruction_0003_title: "Ужас «Полубога»"
 nordrassilsdestruction_0003_desc: "Наши кости, кажется, трещат и становятся хрупкими, ибо мы ощущаем, как то, что оставалось от [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )], поглощено [destroyer.GetName].\n\nОднако [destroyer.GetSheHe] ещё не столь могущественен, чтобы его нельзя было одолеть, [destroyer.GetFirstName] можно сразить!"
 nordrassilsdestruction_0003_a: "[destroyer.GetFirstName] нужно устранить без промедления!"
  
 nordrassilsdestruction_0004_title: "Ужас «Бога»"
 nordrassilsdestruction_0004_desc: "Мы кашляем и задыхаемся от внезапной утраты сил, что хранили нас бессмертными и здравыми. [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )] поглощён целиком [destroyer.GetName].\n\nТеперь [destroyer.GetSheHe] обрёл невероятную мощь, и [destroyer.GetFirstName] нужно устранить, но не без осмотрительности и союзов."
 nordrassilsdestruction_0004_a: "Нам нужно быть настороже с [destroyer.GetFirstName]..."
