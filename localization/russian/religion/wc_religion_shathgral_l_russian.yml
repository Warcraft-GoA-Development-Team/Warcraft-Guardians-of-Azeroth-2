 cthunism_divine_realm_3: "$cthunism_divine_realm$"
 cthunism_religious_text: "Пророчество $shathgral_good_god_cthun$"
 cthunism_religious_text_2: "$cthunism_religious_text$"
 cthunism_religious_text_3: "$cthunism_religious_text$"
  
 yoggsaronism: "Йогг-Саронистск"
 yoggsaronism_adj: "Йогг-Саронизм"
 yoggsaronism_adherent: "Йогг-Сароний"
 yoggsaronism_adherent_plural: "Йогг-Саронии"
 yoggsaronism_desc: "Йогг-Сарон — бог смерти и судьбы. Из своего заключения под Ульдуаром в Нордсколе он выпустил бесчисленные ужасы на Азерот. Его величайшая победа — Проклятие Плоти, которое изуродовало титанов и погрузило их в бесконечный конфликт. Для его последователей плоть — это не проклятие, а свящённый дар трансформации."
 yoggsaronism_divine_realm: "Мозги $shathgral_good_god_yoggsaron$"
 yoggsaronism_divine_realm_2: "$yoggsaronism_divine_realm$"
 yoggsaronism_divine_realm_3: "$yoggsaronism_divine_realm$"
 yoggsaronism_religious_head_title_male: "Герольд"
 yoggsaronism_religious_head_title_female: "$yoggsaronism_religious_head_title_male$"
  
 nzothism: "Н'Зотистск"
 nzothism_adj: "Н'Зотизм"
 nzothism_adherent: "Н'Зоти"
 nzothism_adherent_plural: "Н'Зоти"
 nzothism_desc: "Н'Зот — самый слабый из Древних Богов, но его хитрость и коррупция делают его самым коварным. Известен как бог бездны, он был заключён под кругом звёзд, тюрьмой, теперь скрытой под морем, после смерти Й'Шааржа. Однако он всё равно манипулирует миром через шёпоты, направляя своих последователей ценить обман и перемены."
 nzothism_divine_realm: "Видения $shathgral_good_god_nzoth$"
 nzothism_divine_realm_2: "$nzothism_divine_realm$"
 nzothism_divine_realm_3: "$nzothism_divine_realm$"
  
 yshaarjism: "Й'Шааржистск"
 yshaarjism_adj: "Й'Шааржизм"
 yshaarjism_adherent: "Й'Шааржи"
 yshaarjism_adherent_plural: "Й'Шааржи"
 yshaarjism_desc: "Й'Шаарж был самым могущественным и злым из Древних Богов, известным как «Зверь Семь Голов». Каждая голова представляла один из его аспектов - Гнев, Ненависть, Насилие, Страх, Сомнение, Отчаяние и Гордость. Когда Аман'Тул вырвал Й'Шааржа из Азерота, сам мир был ранен. С последним дыханием он выпустил Ша, зловещие эхо его тёмной сущности."
 yshaarjism_divine_realm: "Царство $shathgral_good_god_yshaarj$"
 yshaarjism_divine_realm_2: "Бездна Сердца"
 yshaarjism_divine_realm_3: "$yshaarjism_divine_realm$"
  
 ghuunism: "Г'Хунистск"
 ghuunism_adj: "Г'Хунизм"
 ghuunism_adherent: "Г'Хуний"
 ghuunism_adherent_plural: "Г'Хунии"
 ghuunism_desc: "Г'Хуун — бог крови и разложения, существо, рожденное не из Пустоты, как его сородичи, а созданное случайно Титанами в попытке решить проблему Древних Богов. В отличие от своих собратьев, Г'Хуун презирает технологию, вовлекая своих последователей в примитивное состояние. Те, кто подвержен его коррупции, считаются его любимыми детьми, связанными с ним кровью и разложением."
