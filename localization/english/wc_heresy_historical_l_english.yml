 ##### Spread message and shared tooltips
 wc_heresy_historical.spread.title:0 "Heresy Spreads: [heresy_faith.GetName]"
 wc_heresy_historical.slows_spread_tt:0 "The [heresy_faith.GetName] will spread to fewer of the surrounding realms."

 ##### 0050 Outbreak notice
 wc_heresy_historical.0050.t.seline:0 "The Bishop's Shadow"
 wc_heresy_historical.0050.t.damned:0 "Whispers in [birth_location.GetNameNoTier]"
 wc_heresy_historical.0050.t.scarlet:0 "The Scarlet Zeal"
 wc_heresy_historical.0050.t.resurgence:0 "An Old Heresy Returns"
 wc_heresy_historical.0050.desc.seline:0 "Word comes from [birth_location.GetNameNoTier]: [founder.GetFullName], a bishop of the [origin_faith.GetName], teaches that the Light casts a shadow, and that a true priest must wield both. [founder.GetSheHe|U] calls it the Void. The faithful of [birth_location.GetNameNoTier] have begun to listen, and the [heresy_faith.GetName] takes root among them."
 wc_heresy_historical.0050.desc.damned:0 "In the markets of [birth_location.GetNameNoTier], preachers promise bread to the hungry, equality to the low and life without end to all who listen. They speak of a hidden master who will remake Lordaeron. Whole villages now follow the [heresy_faith.GetName], and the parish priests can't say who leads them."
 wc_heresy_historical.0050.desc.scarlet:0 "[founder.GetFullName] has come to [birth_location.GetNameNoTier] with an army of zealots. The plague hides in every peasant, [founder.GetSheHe] says, and only fire can find it. Lords who doubt the [heresy_faith.GetName] are named sympathizers. Its crimson banners now fly over the churches of the [origin_faith.GetName]."
 wc_heresy_historical.0050.desc.seline_resurgence:0 "Bishop Seline's teaching was never truly buried. In [birth_location.GetNameNoTier], [founder.GetFullName] preaches her doctrine of Light and shadow again, and the [heresy_faith.GetName] finds new followers."
 wc_heresy_historical.0050.desc.damned_resurgence:0 "The cult is back. In [birth_location.GetNameNoTier], [founder.GetFullName] gathers the poor and the desperate with the old promise of life eternal, and the [heresy_faith.GetName] spreads again."
 wc_heresy_historical.0050.desc.scarlet_resurgence:0 "A new inquisitor has risen. [founder.GetFullName] leads the faithful of [birth_location.GetNameNoTier] to the [heresy_faith.GetName], and the pyres are lit once more."
 wc_heresy_historical.0050.desc.insider:0 "Our teaching has come into the open at [birth_location.GetNameNoTier]. The faithful of the [origin_faith.GetName] call it heresy, but more of them listen every day. For now my own devotion to the [heresy_faith.GetName] remains my secret."
 wc_heresy_historical.0050.a:0 "This is the truth I have been waiting for."
 wc_heresy_historical.0050.b:0 "I will leave everything behind and follow [founder.GetFirstName]."
 wc_heresy_historical.0050.c:0 "Heresy. I will not be led astray."
 wc_heresy_historical.0050.c.insider:0 "I will keep my silence, for now."

