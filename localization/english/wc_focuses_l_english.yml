  education_any_tt.court_caster:0 "\n\n#P Appointed [GetCourtPositionType('court_caster_court_position').GetName()] improves all Magic Education outcomes.#!"
  education_magic:0 "Magic Education"
  education_magic_desc:0 "The study of magic and the various mystical energies that govern it."

  magic_good_trait_match_bad_outcome:0 "Despite showing an early affinity for magic, [ROOT.Char.GetFirstName] has struggled to fully harness their magical potential."
  magic_good_trait_match_good_outcome:0 "From an early age, [ROOT.Char.GetFirstName] has demonstrated a remarkable talent for magic, quickly mastering even the most complex spells and incantations."
  magic_bad_trait_match_bad_outcome:0 "Despite showing little natural talent for magic, [ROOT.Char.GetFirstName] has struggled to make significant progress in their magical studies."
  magic_bad_trait_match_good_outcome:0 "Although initially lacking an affinity for magic, [ROOT.Char.GetFirstName] has managed to achieve a surprising level of proficiency through hard work and determination."
  magic_neutral_trait_match_good_outcome:0 "With proper guidance, even a child without a natural inclination for magic, such as [ROOT.Char.GetFirstName], can develop considerable magical skill."
  magic_neutral_trait_match_bad_outcome:0 "Despite receiving guidance, [ROOT.Char.GetFirstName] has struggled to make significant progress in their magical studies."

