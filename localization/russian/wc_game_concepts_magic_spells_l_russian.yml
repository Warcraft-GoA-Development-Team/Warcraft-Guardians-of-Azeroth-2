 wc_spell_twisted_chains_targets: "[character|E]"
 wc_spell_twisted_chains_effects: "За каждые 25 маны, потраченные на этот ритуал:\n#bold Если вы воюете с целью:#! каждая из её [armies|E] будет истощена на 10%\n#bold Если вы не воюете с целью:#! [development|E] и [control|E] каждого из непосредственно удерживаемых ею [counties|E] снизятся на 2.\n\nВы получаете [dread|E], перезарядка всех неритуальных заклинаний Тьмы снимается, а каждое теневое заклинание, сотворённое в течение [GetPlayer.MakeScope.ScriptValue('wc_spell_twisted_chains_duration_days_value')|V0] дней, будет стоить на 25% меньше маны, иметь на 25% более короткую перезарядку и на 50% более длительное действие. Интриги «Захват державы», «Убийство» и «Притязание на трон» получат повышенный шанс успеха."
 wc_learn_ritual_twisted_chains: "Вы изучаете: [wc_spell_twisted_chains|E]"
 wc_spell_twisted_chains_tt: "Перезарядка каждого неритуального [wc_spell_school_shadow|E] [wc_spell|E] будет снята."
