 wc_learn_spell_cripple: "Вы изучаете заклинание: [wc_spell_cripple|E]"
 wc_cripple_hit_tt: "[this_recipient.GetShortUIName|U] [Select_CString(this_recipient.IsLocalPlayer, 'получаете', 'получает')] эффекты заклинания [wc_spell_cripple|E]."
 wc_cripple_dodge: "[this_recipient.GetShortUIName|U] уклоняется от [wc_spell_cripple|E]!"
