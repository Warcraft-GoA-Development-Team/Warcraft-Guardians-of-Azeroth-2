l_russian:
 WCHEA.1001.TITLE: "Чума нежити: Превращение"
 WCHEA.1001.DESC: "Прошло три дня с тех пор, как я в последний раз поднялся с постели. Сначала я думал, что болезнь, поразившая меня, — не более чем простая простуда, но вскоре оказалось, что истина куда страшнее.\n\nВ первый день мои придворные принесли мне какой-то отвратительный хлеб, который я так и не смог доесть из-за его гнилого вкуса. Но вскоре они перестали приходить вовсе — шёпоты во дворце сменились хриплыми криками.\n\nЗатем пришла гниль, и части моего тела начали отваливаться. Но страха я уже не чувствовал, лишь неведомую тягу к далёкой мелодии, к тихому шёпоту в ветре, что звал меня.\n\n«Восстань и служи своему Королю», — сказал он. И я восстал заново."
 WCHEA.1001.OPT.A: "Нужно питаться!"
  
 WCHEA.9000.TITLE: "Усталость от мира"
 WCHEA.9000.DESC.other_being: "Последние годы я чувствую лишь усталость; желание оставить этот мир позади. Азерот — место великой силы, но я создан из большего, чем то, что он способен удержать. Заботы его обитателей кажутся мне мелочными и пустыми, а даже собственные достижения — безжизненными. Я вырос в силе дальше того, что способен дать этот мир, и жажду познать следующий план бытия.\n\n[heir.GetFirstNameRegnal] займётся всеми земными делами как мой преемник. Подготовка завершена, осталось лишь провести ритуал в уединённом месте."
 WCHEA.9000.DESC.undead: "Сегодня у меня отвалилась нога. Когда я пытался пришить её обратно, отвалились пальцы на правой руке. Лишь через три часа [heir.GetFirstNameRegnal] нашёл меня и отвёл к сшивателю тел, чтобы вновь собрать меня воедино.\n\nЭто уже не в первый раз. Наоборот — моё тело распадается всё чаще. И чем чаще это происходит, тем сильнее угасает моя воля к существованию. В последнее время я всё чаще думаю о том, чтобы просто исчезнуть, позволив телу спокойно рассыпаться в прах."
 WCHEA.9000.DESC: "Бремя моего народа тяжко. С незапамятных времён мы живём в этой земле; многие даже помнят рассвет времён, раскол самих континентов. И я не знаю, как они смогли вынести это так долго.\n\nНо в последнее время я начал уставать от этого существования и от людей, что меня окружают. Я хочу дать [heir.GetFirstNameRegnal] шанс занять моё место, позволить миру продолжать путь без меня. И всё же наш народ слишком серьёзен к своему долгу. Я не могу просто уйти — я должен исчезнуть, скрыться от мира так, чтобы никто меня не нашёл."
 WCHEA.9000.OPT.A: "Время пришло оставить всё это позади."
 WCHEA.9000.OPT.B: "Ещё нет, впереди слишком многое."
  
 WCHEA.9001.TITLE: "Зов Саргераса"
 WCHEA.9001.DESC: "Моя миссия на этом мире окончена. Я одержал бесчисленные победы во имя [ROOT.GetCharacter.GetFaith.HighGodName]; покорил и истребил бесчётные орды смертных ради [ROOT.GetCharacter.GetFaith.HighGodHerHis] воли и собственной жажды крови. И вот теперь я вновь слышу зов [ROOT.GetCharacter.GetFaith.HighGodNamePossessive], приказывающий мне вернуться в иные миры и продолжить Его замыслы там. Я не стану скучать по смраду «чистой» жизни, пропитывающему каждый уголок этого мира.\n\nЧтобы повиноваться этому зову, я подготовил ритуал, который позволит мне покинуть этот план через [twisting_nether|E]. Всё готово: мой наследник [heir.GetFirstNameRegnal] стоит рядом, готовый принять власть после моего ухода. Мне остаётся лишь произнести слова заклинания — и покинуть этот мир навсегда."
  
 WCHEA_30_title: "Сила и Гнев"
 WCHEA_30_desc: "Питьё крови [GetTrait('being_demon').GetName(GetNullCharacter)] ради силы и храбрости обошлось мне слишком дорого... каждый день меня терзают сны, полные огня и крови.\n\nМой разум пылает жаждой крови, и с каждым днём её всё труднее сдерживать. Какое-то время мне удавалось ей сопротивляться... но, может, пришло время принять её? Может, в этом и заключалась наша истинная природа — природа [GetTrait('creature_orc').GetName(GetNullCharacter)]ов — с самого начала..."
 WCHEA_30_name: "Чувствую, что могу проломить кому-нибудь череп!"
