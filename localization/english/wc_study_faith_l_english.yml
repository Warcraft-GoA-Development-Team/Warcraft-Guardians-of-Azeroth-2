l_english:
 # Study Faith adaptation (issue #1969)

 # Holy-book names
 wc_titanic_religious_text:0 "Discs of Norgannon"
 wc_pandaren_religious_text:0 "Lorewalker scrolls"
 SELINES_WRITINGS_NAME:0 "writings of Seline"

 # Scheme
 STUDY_RITE_WC_SYNCRETISM:0 "Syncretic Faith"

 # Rites in the Dark (study_faith_ongoing.1012)
 wc_study_faith_ongoing.1012.t:0 "$study_faith$: Rites in the Dark"
 wc_study_faith_ongoing.1012.desc.intro:0 "I pressed, and [scheme.GetTargetCharacter.GetFirstName] finally stopped pretending. [scheme.GetTargetCharacter.GetSheHe|U] does not worship [scheme.GetTargetCharacter.GetFaith.GetName] at all. [scheme.GetTargetCharacter.GetHerHis|U] true master is [actual_faith.GetName]."
 wc_study_faith_ongoing.1012.desc.damned:0 "\n\nThe signs were there. Grain carts routed through [GetTitleByKey('c_andorhal').GetBaseNameNoTier], an Orb of Illusion hidden in a chest, talk of 'eternal life and equality' for the poor. The Cult of the Damned recruits in the shadow of every chapel."
 wc_study_faith_ongoing.1012.desc.burning_blade:0 "\n\nA searing collar under [scheme.GetTargetCharacter.GetHerHis] furs, and a greeting I was never meant to hear: 'Galtak Ered'nash.' The Burning Blade still whispers to orcs who miss the old power."
 wc_study_faith_ongoing.1012.desc.atalai:0 "\n\nThe bat sigil of Hir'eek, and dried blood on a private altar. The Atal'ai were hunted nearly to extinction for calling on the Soulflayer, and some of them clearly survived."
 wc_study_faith_ongoing.1012.desc.dark_iron:0 "\n\nEmber-runes carved under the hearthstone, and a heat in [scheme.GetTargetCharacter.GetHerHis] voice when [scheme.GetTargetCharacter.GetSheHe] speaks of the deep places. Ragnaros has servants far from [GetTitleByKey('d_blackrock_mountain').GetBaseNameNoTier]."
 wc_study_faith_ongoing.1012.desc.twilight:0 "\n\nA flaming-hammer sign inked inside a book cover, and pages of the Twilight Canticle tucked among the 'scripture'. The Twilight's Hammer recruits the doubtful and the bitter wherever they find them."
 wc_study_faith_ongoing.1012.a:0 "Expose [scheme.GetTargetCharacter.GetHerHim] before the court!"
 wc_study_faith_ongoing.1012.a.tt:0 "Unmasked cultists sometimes throw off the mask entirely."
 wc_study_faith_ongoing.1012.b:0 "Say nothing. Keep [scheme.GetTargetCharacter.GetHerHim] close, and keep learning."
 wc_study_faith_ongoing.1012.c:0 "Show me what you truly believe."
 wc_study_faith_ongoing.1012.c.tt:0 "You will secretly follow [actual_faith.GetName] and learn one of its tenets. Your studies of [scheme.GetTargetCharacter.GetFaith.GetName] end."
 wc_study_faith_ongoing.1012.d:0 "I need a teacher who believes what they teach."

 # 0400
 wc_study_faith_knows_my_secret_opinion:0 "Knows My Secret"
 wc_study_faith.0400.t:0 "$study_faith$: A Knowing Look"
 wc_study_faith.0400.desc:0 "[target.GetFirstName] has stopped smiling at me. Somehow [target.GetSheHe] has worked out that I know [target.GetHerHis] secret, and our lessons have turned cold and guarded."
 wc_study_faith.0400.a:0 "Let [target.GetHerHim] stew."

 # Holy text quotes (RandomHolyTextQuote). Canon lines carry their source; the rest are original lines in the faith's voice.
 # Uther, The Light and How to Swing It
 wc_holy_text_light_1:0 "Only a calm mind will provide clear actions; only a peaceful heart may be truly infused with the Light."
 # Uther, Warcraft III
 wc_holy_text_light_2:0 "Vengeance cannot be a part of what we must do."
 wc_holy_text_light_3:0 "Respect thy foe, endure thy trial, and grieve with the grieving; so the Light that dwells in all shall dwell in thee."
 wc_holy_text_light_4:0 "The Light asks no blood of you. It asks only that you stand where others cannot."
 # Prophet's Lesson
 wc_holy_text_naaru_1:0 "Each life, a universe."
 wc_holy_text_naaru_2:0 "Each life, a universe; each universe, a song the Light remembers."
 wc_holy_text_naaru_3:0 "What was broken may yet be mended, and what is mended shines brightest where it broke."
 wc_holy_text_naaru_4:0 "Many worlds fell to shadow. One people walked on. So long as one walks, the Light walks beside them."
 # Promise of Elune
 wc_holy_text_elune_1:0 "When others receive life and energy from you, you too shall receive life and energy from me."
 # Astarii Starseeker's elegy
 wc_holy_text_elune_2:0 "By the moons' glow, listen. Beside the river, listen. Holding those you love, listen."
 wc_holy_text_elune_3:0 "When the sun is gone, She is not gone. Walk softly beneath Her and be seen."
 wc_holy_text_elune_4:0 "Take what you need and thank what you take; the forest keeps its own accounts."
 # Cloudsong, War Crimes
 wc_holy_text_shaman_1:0 "Welcome, Spirit of Life. You are in our breath with air, our blood with fire, our bones with earth, our tears with water."
 # The Farseer, Earthen Ring
 wc_holy_text_shaman_2:0 "Others shout, and fight, and abandon reason. But we listen."
 wc_holy_text_shaman_3:0 "Ask, and the earth may answer. Demand, and it will be silent, as it was silent to our fathers."
 wc_holy_text_shaman_4:0 "From her we rose; to her we return; between, we walk lightly upon her."
 # Kobold saying
 wc_holy_text_kobold_1:0 "Never pick above your snout, else the darkness snuff you out!"
 wc_holy_text_loa_1:0 "Speak de name, feed de idol, keep de bargain. De loa remember what ya promised, even when ya forget."
 wc_holy_text_loa_2:0 "A loa without worshippers be a whisper in de jungle. A people without loa be a song nobody sings."
 wc_holy_text_loa_3:0 "Every gift from de loa got a price, and de price always come due."
 # Bwonsamdi
 wc_holy_text_loa_4:0 "Sooner or later, everyone comes to me."
 # Umbrella of Chi-Ji
 wc_holy_text_pandaren_1:0 "Hope is the sun behind a stormy sky. Ever in the heart, but veiled to the eye."
 # Pearl of Yu'lon
 wc_holy_text_pandaren_2:0 "There is but one certainty - every end marks a new beginning."
 # Master Feng
 wc_holy_text_pandaren_3:0 "Discipline is not a war that is won. It is a battle, constantly fought."
 wc_holy_text_pandaren_4:0 "Endure as the Ox, hope as the Crane, strike as the Tiger, and know, as the Serpent, when not to strike."
 # The Twilight Apocrypha
 wc_holy_text_void_1:0 "In the beginning was shadow eternal. Hate blazed forth, and FIRE was born."
 # The Twilight Apocrypha
 wc_holy_text_void_2:0 "We live in the shadow. The world we know. Built of rage, hurt, anguish and sorrow."
 wc_holy_text_void_3:0 "Before the Light, the shadow; after the Light, the shadow. Open the eye that was never shut."
 wc_holy_text_void_4:0 "Every choice you make feeds the hunger beneath the world, and the hunger is patient."
 # Lore Keeper of Norgannon
 wc_holy_text_titan_1:0 "They are the beings that seeded and shaped this world by their own design."
 wc_holy_text_titan_2:0 "We were carved, not born; so let us read the chisel-marks and learn the hand that held it."
 wc_holy_text_titan_3:0 "Every stone remembers the hand that set it. Ask the stone."
 # Edict of the Thunder King
 wc_holy_text_thunder_king_1:0 "To be mogu is to rule. It is why we were created."
 # Prophecy of Rythas the Oracle
 wc_holy_text_odyn_1:0 "Do not fear death. To live as a vrykul is to know danger."
 wc_holy_text_shadow_1:0 "A Forsaken priest is a curious beast, their path an unusual course."
 wc_holy_text_shadow_2:0 "Respect. Tenacity. Power. The Light abandoned the grave; we did not."
 wc_holy_text_shadow_3:0 "Shadow is no enemy of the Light. It is the half of the coin the Church would not spend."
 wc_holy_text_shadow_4:0 "Soon Azeroth will see the rise of the Forgotten Shadows."
 wc_holy_text_death_1:0 "Flesh fails; will endures. Serve in death what you could not master in life."
 wc_holy_text_death_2:0 "The grave is not an ending. It is an apprenticeship."
 wc_holy_text_death_3:0 "The living promised the poor bread and gave them hunger. We promise them eternity, and we keep our word."
 # Knights of the Ebon Blade
 wc_holy_text_ebon_1:0 "Our penance is to stand vigil against that evil for all time."
 # Kil'jaeden, Tomb of Sargeras
 wc_holy_text_fel_1:0 "Every creature serves a master, even I. That is the choice of all: serve another, or die alone."
 # Kil'jaeden, Tomb of Sargeras
 wc_holy_text_fel_2:0 "Servitude is not imprisonment. You will serve me, others will serve you."
 wc_holy_text_fel_3:0 "The universe is a wound; fire is the cautery. Kneel, and be given the knife."
 # Burning Blade greeting
 wc_holy_text_burning_blade_1:0 "Galtak Ered'nash. All hail the Burning Blade."
 # Thalassian
 wc_holy_text_arcane_1:0 "Anar'alah belore. By the light of the sun."
 wc_holy_text_arcane_2:0 "The sun guides us; the Well sustains us; what is drawn must be returned in kind."
 wc_holy_text_arcane_3:0 "Catalog every spell, and lock away the ones that would catalog you."
 # Thalassian
 wc_holy_text_arcane_4:0 "Ishnu alah terro shar. Until even stars fade."
 # The Pantheon's charge to the Aspects
 wc_holy_text_dragon_1:0 "Unto each of you is given a gift; unto all of you is given the duty."
 # Alexstrasza, Charge of the Aspects
 wc_holy_text_dragon_2:0 "To protect life, there are times when we must destroy that which seeks to end it."
 wc_holy_text_dragon_3:0 "Five were charged and five were bound; ask of each only what was given to it."
 wc_holy_text_dragon_4:0 "The flights remember what the younger races forget, and forgive less than they remember."
 # Majordomo Executus
 wc_holy_text_fire_1:0 "Behold Ragnaros - the Firelord! He who was ancient when this world was young!"
 wc_holy_text_fire_2:0 "Fire does not ask permission. It only asks for more."
 wc_holy_text_earth_1:0 "Stone does not hurry, and stone does not forgive."
 wc_holy_text_earth_2:0 "Dig deep enough and every road leads home to her."
 wc_holy_text_water_1:0 "The tide takes back everything it lends, in its own time."
 wc_holy_text_water_2:0 "Bless the hull, bury the silver, and the sea will remember your name."
 wc_holy_text_air_1:0 "The wind carries every word you speak to one who listens."
 wc_holy_text_air_2:0 "Even his own storms are uneasy speaking his name."
 wc_holy_text_minor_1:0 "The first ones are not gone. They wait where the old songs end."
 wc_holy_text_minor_2:0 "What the elders knew, the young must find again, and pay for again."
 wc_holy_text_minor_3:0 "Small gods are still gods, to those who are small enough to hear them."
 # Seer Ul'Tomon (Warcraft RPG)
 wc_holy_text_nerubian_1:0 "Worshipping the Old Gods makes as much sense as a fly caught in a web worshipping the spider who is about to devour him."
 wc_holy_text_avian_1:0 "Rukhmar sees all that lies beneath the sun, and the sun sees all that lies beneath her."
