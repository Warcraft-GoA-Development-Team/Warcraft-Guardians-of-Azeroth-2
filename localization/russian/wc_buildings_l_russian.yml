 building_altar_of_sseratus_desc: "$building_type_altar_of_sseratus_desc$"
 building_altar_of_storms: "Алтарь Бурь"
 building_altar_of_storms_desc: "Во время [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )] чернокнижники [GetTrait('creature_orc').GetName(GetNullCharacter)] изобрели способ даровать разум и магические силы своим союзникам- [GetTrait('creature_ogre').GetName(GetNullCharacter)]ам. Этот способ требовал таких тайных сооружений, как этот Алтарь Бурь, — один из немногих уцелевших со Второй войны."
 building_ammen_fields_01: "Облучённые поля Аммена"
 building_ammen_fields_01_desc: "Этот небольшой ландшафт состоит из странной фиолетовой травы и цветов. По полям также разбросаны обломки крушения «Экзодара»."
 building_ammen_fields_02: "Поля Аммена"
 building_ammen_fields_02_desc: "Этот небольшой ландшафт состоит из странной фиолетовой травы и цветов. По полям также разбросаны обломки крушения «Экзодара»."
 building_andrassil_01: "Разрушенный $building_type_andrassil_01$"
 building_andrassil_01_desc: "$building_type_andrassil_01$ был разрушен."
 building_andrassil_02: "Осквернённый $building_type_andrassil_01$"
 building_andrassil_02_desc: "$building_type_andrassil_01$ был полностью осквернён."
 building_andrassil_03: "Вордрассил"
 building_andrassil_03_desc: "В переводе — «Сломанная Корона»; это останки Мирового древа, расположенные в Медвежьих холмах на юге Нордскола."
 building_andrassil_04: "$building_type_andrassil_01$"
 building_andrassil_04_desc: "$building_type_andrassil_01_desc$"
 building_atulnazman: "Атул'назман"
 building_atulnazman_desc: "[Glossary( 'titan', 'TITAN_GLOSS' )] пирамида, хранящая Печать Назмира."
 building_azora_tower: "$building_type_azora_tower$"
 building_azora_tower_desc: "$building_type_azora_tower_desc$"
 building_azure_dragonshrine: "$building_type_azure_dragonshrine$"
 building_azure_dragonshrine_desc: "$building_type_azure_dragonshrine_desc$"
 building_banana_tree: "Банановые деревья Тел'Абима"
 building_banana_tree_desc: "Все бананы в мире родом с Тел'Абима. Их целебные свойства делают их отличным лакомством."
 building_bandinoriel_01: "Разрушенный $building_type_bandinoriel_01$"
 building_bandinoriel_01_desc: "Бывший барьер, защищавший Луносвет."
 building_bandinoriel_02: "Бан'динориэль"
 building_bandinoriel_02_desc: "Почти неприступный тайный щит, окружающий Луносвет."
 building_baradin_hold_01: "Цитадель Барадин"
 building_baradin_hold_01_desc: "Цитадель Барадин — главная крепость Тол Барада; тот, кто владеет Цитаделью, владеет Тол Барадом."
 building_baradin_hold_02: "Цитадель Барадин"
 building_baradin_hold_02_desc: "После [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )] разрушенная крепость Цитадели Барадин на отдалённом острове Тол Барад была превращена в тюрьму для одних из самых опасных сил Азерота."
 building_blackmaw_scar: "$building_type_blackmaw_scar$"
 building_blackmaw_scar_desc: "$building_type_blackmaw_scar_desc$"
 building_blackwing_lair: "$building_type_blackwing_lair$"
 building_blackwing_lair_desc: "$building_type_blackwing_lair_desc$"
 building_blood_god_altar: "Алтарь Кровавого бога"
 building_blood_god_altar_desc: "Здесь можно найти Кровавого бога Хаккара Пожирателя Душ и многих его детей-змей. "
 building_bloodsail_hold: "Крепость Кровавого Паруса"
 building_bloodsail_hold_desc: "Огромная крепость, ощетинившаяся пушками; Крепость Кровавого Паруса — главная база буканьеров Кровавого Паруса."
 building_bogpaddle_resort: "Курорт Топь-Пристань"
 building_bogpaddle_resort_desc: "Единственный приморский курорт и склад военного оружия в Восточных королевствах."
 building_brewing_cauldron: "$building_type_brewing_cauldron$"
 building_brewing_cauldron_desc: "$building_type_brewing_cauldron_desc$"
 building_bronze_dragonshrine: "$building_type_bronze_dragonshrine$"
 building_bronze_dragonshrine_desc: "$building_type_bronze_dragonshrine_desc$"
 building_circle_of_spirits: "Круг Духов"
 building_circle_of_spirits_desc: "Сновидная роща — оплот друидов, а Круг Духов содержит четыре статуи, олицетворяющие каждую из специализаций друида."
 building_crane_temple: "$building_type_crane_temple$"
 building_crane_temple_desc: "$building_type_crane_temple_desc$"
 building_crapopolis: "Краполис"
 building_crapopolis_desc: "Городок [GetTrait('creature_goblin').GetName( GetNullCharacter )]ов на южном берегу Кезана."
 building_crash_site_01: "Облучённое место крушения"
 building_crash_site_01_desc: "Крупный обломок «Экзодара» рухнул здесь, из-за чего радиация просочилась в окружающую среду."
 building_crash_site_02: "Место крушения"
 building_crash_site_02_desc: "Крупный обломок «Экзодара» рухнул здесь; его радиация большей частью нейтрализована."
 building_deatholme: "Смертхольм"
 building_deatholme_desc: "Смертхольм — крупнейший опорный пункт [scourge|E] в Восточных королевствах."
 building_deeprun_tram: "$building_type_deeprun_tram$"
 building_deeprun_tram_desc: "$building_type_deeprun_tram_desc$"
 building_dragon_spine: "$building_type_dragon_spine$"
 building_dragon_spine_desc: "$building_type_dragon_spine_desc$"
 building_dream_portal: "$building_type_dream_portal$"
 building_dream_portal_desc: "$building_type_dream_portal_desc$"
 building_durnholde_camp_01: "Лагерь для интернированных в Дернхольде"
 building_durnholde_camp_01_desc: "Лагерь для интернированных [GetTrait('creature_orc').GetName(GetNullCharacter)]ов после их поражения. Некоторые предпочли бы видеть их мёртвыми, но пожизненное заключение придётся принять."
 building_durnholde_camp_02: "Освобождённый лагерь для интернированных в Дернхольде"
 building_durnholde_camp_02_desc: "После восстания Новой Орды лагерь для интернированных был освобождён и пришёл в запустение. Синдикат начал использовать его как опорный пункт."
 building_emerald_dragonshrine: "$building_type_emerald_dragonshrine$"
 building_emerald_dragonshrine_desc: "$building_type_emerald_dragonshrine_desc$"
 building_emperor_tombs: "$building_type_emperor_tombs$"
 building_emperor_tombs_desc: "$building_type_emperor_tombs_desc$"
 building_everstill_bridge_01: "Повреждённый мост Вечной Тишины"
 building_everstill_bridge_01_desc: "Мост был разрушен [GetTrait('creature_orc').GetName(GetNullCharacter)]ами клана Черной Скалы."
 building_everstill_bridge_02: "$building_type_everstill_bridge_01$"
 building_everstill_bridge_02_desc: "$building_type_everstill_bridge_01_desc$"
 building_forge_origination_01: "Кузня Созидания"
 building_forge_origination_01_desc: "В глубине места, именуемого Залами Созидания, находится устройство [Glossary( 'titan', 'TITAN_GLOSS' )]ов. Оно задумано как аварийный переключатель сброса для всей жизни на Азероте. Если его активировать, оно уничтожит всё живое в мире!"
 building_forge_origination_02: "Точка фокусировки"
 building_forge_origination_02_desc: "Теперь $building_type_forge_origination_01$ способна сфокусировать свою разрушительную мощь!"
 building_forgotten_pools: "$building_type_forgotten_pools$"
 building_forgotten_pools_desc: "$building_type_forgotten_pools_desc$"
 building_frostsaber_rock: "$building_type_frostsaber_rock$"
 building_frostsaber_rock_desc: "$building_type_frostsaber_rock_desc$"
 building_giant_dino_bones: "Гигантские кости динозавров"
 building_giant_dino_bones_desc: "Гигантские кости динозавров можно найти близ паровых источников в середине острова."
 building_gol_inath: "$building_type_gol_inath$"
 building_gol_inath_desc: "$building_type_gol_inath_desc$"
 building_greymane_court: "$building_type_greymane_court$"
 building_greymane_court_desc: "$building_type_greymane_court_desc$"
 building_grimbatol_fortress: "$building_type_grimbatol_fortress$"
 building_grimbatol_fortress_desc: "$building_type_grimbatol_fortress_desc$"
 building_grommash_hold: "Цитадель Громмаша"
 building_grommash_hold_desc: "Огромная крепость, названная в честь героя [GetCulturePillar('heritage_orcish').GetName] — Громмаша Адского Крика."
