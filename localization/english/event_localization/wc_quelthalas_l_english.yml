 wc_quelthalas_events.1.t:0 "The State of Affairs in Quel'thalas"
 wc_quelthalas_events.1.583.desc:0 "placeholder"
 wc_quelthalas_events.1.603.desc:0 "placeholder"
 wc_quelthalas_events.1.605.desc:0 "placeholder"
 wc_quelthalas_events.1.a:0 "Anar'alah belore."
 
 wc_quelthalas_events.100.t:0 "Destruction of the Sunwell"
 wc_quelthalas_events.100.desc:0 "placeholder"
 wc_quelthalas_events.100.a:0 "placeholder"

 wc_quelthalas_events.101.t:0 "Solution for Magic Addiction"
 wc_quelthalas_events.101.desc:0 "Establish the existential problem. The blood elves cannot simply "wait it out"; their society is structurally dependent on magic."
 wc_quelthalas_events.101.a:0 "placeholder"
 
 wc_quelthalas_events.102.t:0 "The Magisters Convene"
 wc_quelthalas_events.102.desc:0 "The problem becomes institutional. Different Magisters propose different solutions, giving you the first hints of the later Light/Fel/Void ideological split."
 wc_quelthalas_events.102.a:0 "maybe add branching options here as foreshadowing for void/light/fel outcomes"
 
 wc_quelthalas_events.103.t:0 "Reconnecting With the Sunwell's Nature"
 wc_quelthalas_events.103.desc:0 "The important discovery should be that its Arcane essence is not merely a fuel source; it has unusual properties that might allow it to interact with another form of cosmic power."
 wc_quelthalas_events.103.a:0 "placeholder"
 
 wc_quelthalas_events.104.t:0 "Seeking Answers in Outland"
 wc_quelthalas_events.104.desc:0 "Azeroth has no surviving equivalent to the Sunwell and no accessible Naaru. Outland does."
 wc_quelthalas_events.104.a:0 "placeholder"
 
 wc_quelthalas_events.105.t:0 "Storming Tempest Keep"
 wc_quelthalas_events.105.desc:0 "The elves aren't peacefully studying the Naaru; they're desperate enough to take one by force."
 wc_quelthalas_events.105.a:0 "placeholder"
 
 wc_quelthalas_events.106.t:0 "M'uru Captured"
 wc_quelthalas_events.106.desc:0 "This should feel like the apparent breakthrough. The Magisters now possess something they previously thought impossible: a living source of the Light."
 wc_quelthalas_events.106.a:0 "placeholder"
 
 wc_quelthalas_events.107.t:0 "Formation of the Blood Knights"
 wc_quelthalas_events.107.desc:0 "This is a fantastic Phase One event because it proves the central thesis: The elves don't need to be naturally compatible with a cosmic power. They can force compatibility through the Sunwell's remaining Arcane essence."
 wc_quelthalas_events.107.a:0 "placeholder"
 
 wc_quelthalas_events.108.t:0 "The Naaru's Light"
 wc_quelthalas_events.108.desc:0 "The elves realize that the Arcane residue of the Sunwell and M'uru's Light are not merely compatible—they can be combined/interfaced in a way that alters the nature of the resulting magical energy. and that is the discovery that makes Event 109 inevitable."
 wc_quelthalas_events.108.a:0 "placeholder"
 
 wc_quelthalas_events.109.t:0 "The Void Hypothesis"
 wc_quelthalas_events.109.desc:0 "Umbric asks the forbidden question: If Sunwell essence can interface with the Light, why couldn't it interface with the Void? These become arc words for his part of the story."
 wc_quelthalas_events.109.a:0 "Exile him."
 wc_quelthalas_events.109.b:0 "Sanction his research, but keep a tight leash on him."
 wc_quelthalas_events.109.c:0 "Allow him to proceed as he wishes."

 wc_quelthalas_events.113.t:0 "A Challenge From Silvermoon"
 wc_quelthalas_events.113.desc:0 "The ruler of Quel'Thalas has answered Anveena's capture with open war. Silvermoon's armies are marching south, intent on tearing down Deatholme and reclaiming every league of land lost to the Scourge. They believe this is a rescue. They do not yet understand what I will become."
 wc_quelthalas_events.113.a:0 "Let them come."
 
 wc_quelthalas_events.200.t:0 "The Traitor's Quest"
 wc_quelthalas_events.200.desc:0 "The Sunwell is ruined, yet something bearing its unmistakable essence stirs beyond the borders of Quel'Thalas. The Scourge would have me locate this remnant and deliver it into their hands. They mistake obedience for loyalty. Whatever power survived the well belongs to the elf with the will to seize it."
 wc_quelthalas_events.200.a:0 "I will find this power for myself."
 
 wc_quelthalas_events.201.t:0 "Dar'khan's Ambition"
 wc_quelthalas_events.201.desc:0 "Reports from Tarren Mill speak of a small band travelling with a young human woman. A blue dragon shadows their path, and every agent sent too close returns confused by traces of arcane power that should have died with the Sunwell. I do not yet know what the girl carries, but the dragon's interest is proof enough that she is worth taking."
 wc_quelthalas_events.201.a:0 "Tarren Mill will yield its secret."
 
 wc_quelthalas_events.202.t:0 "Attack on Tarren Mill"
 wc_quelthalas_events.202.desc:0 "My raiders descend on Tarren Mill before dawn, but the dragon is waiting. Kalecgos tears through the attack and forces me from the field before I can reach the girl. The defeat is bitter, yet in the instant our magics collide I feel a second presence behind his power: warm, immense, and impossibly familiar."
 wc_quelthalas_events.202.a:0 "The dragon has only confirmed my suspicions."
 
 wc_quelthalas_events.203.t:0 "The Strange Presence"
 wc_quelthalas_events.203.desc:0 "The fugitives retreat into the Hinterlands, but the residue left by their flight is clearer than any footprint. It is not merely arcane magic. It carries the cadence of the Sunwell itself, changed and hidden beneath the shape of mortal life. The girl is no wandering hedge mage. She is the vessel of something that should no longer exist."
 wc_quelthalas_events.203.a:0 "No disguise can hide her from me now."
 
 wc_quelthalas_events.204.t:0 "The Girl Who Should Not Exist"
 wc_quelthalas_events.204.desc:0 "From the shadows I watch Anveena travel beside Kalecgos, Tyrygosa, and Jorad. They guard her as a companion rather than a relic, and she trusts them with the easy courage of one who does not comprehend her own value. Yet when danger nears, the air answers her fear with the same living radiance that once poured from the Sunwell."
 wc_quelthalas_events.204.a:0 "Affection has made them careless."
 
 wc_quelthalas_events.205.t:0 "On the Trail"
 wc_quelthalas_events.205.desc:0 "Every ward the party raises gives me another fragment of the answer. Anveena does not simply channel the Sunwell's essence; the essence recoils when she is threatened and settles when she is calm. Whether she is vessel, avatar, or key no longer matters. Through her, the power stolen from me can be made whole."
 wc_quelthalas_events.205.a:0 "The hunt ends in the Hinterlands."
 
 wc_quelthalas_events.206.t:0 "Capture in the Hinterlands"
 wc_quelthalas_events.206.desc:0 "The ambush closes before Anveena's companions can form a defence. I turn their own precautions against them, separating the girl from the dragons and smothering her flare of power beneath the runes prepared for this moment. Kalecgos can only watch as the shadows of Deatholme close around my prize."
 wc_quelthalas_events.206.a:0 "At last, the Sunwell is within my grasp."

 wc_quelthalas_events.207.t:0 "The Road to Quel'Thalas"
 wc_quelthalas_events.207.desc:0 "Kalecgos, Tyrygosa, and Jorad arrive in Silvermoon with news of catastrophe. Dar'khan has taken Anveena to Deatholme, and the power gathering around his fortress bears the signature of the lost Sunwell. If he tears that power from her, the traitor will possess enough strength to overrun the rest of Quel'Thalas. This is no longer a private rescue. It is a war for the survival of the realm."
 wc_quelthalas_events.207.a:0 "Summon every banner still loyal to Quel'Thalas."

 wc_quelthalas_events.208.t:0 "Silvermoon Declares War"
 wc_quelthalas_events.208.desc:0 "Deatholme stands at the heart of our lost southern lands, guarded by the dead and swollen with stolen magic. Beyond its walls Dar'khan works to break Anveena, while each passing day brings him closer to mastering the essence she protects. We will reclaim the south and free her, or Silvermoon will be the next city to fall."
 wc_quelthalas_events.208.a:0 "If we fail, there will be nothing left for us to rebuild."
 
 wc_quelthalas_events.209.t:0 "Victory Without Restoration"
 wc_quelthalas_events.209.desc:0 "Deatholme has fallen. Anveena walks free, Dar'khan lies destroyed, and the southern reaches are once more joined to Quel'Thalas. Yet victory has not restored what Arthas took from us. The Sunwell remains silent, our people remain hungry, and survival has purchased only the time needed to seek another answer."
 wc_quelthalas_events.209.a:0 "The Sunwell, however, remains silent."
 
 wc_quelthalas_events.210.t:0 "The End of Quel'Thalas"
 wc_quelthalas_events.210.desc:0 "Deatholme does not fall. Dar'khan consumes Anveena's living essence and rises with the power of the Sunwell burning inside him. The armies of Quel'Thalas break before his advance; the southern dead pour through the gates of Silvermoon, and the last realm of the blood elves is swallowed by the Scourge. There will be no restoration."
 wc_quelthalas_events.210.a:0 "The light of Quel'Thalas is extinguished."
 
 wc_quelthalas_events.300.t:0 "The Magisters' Dilemma"
 wc_quelthalas_events.300.desc:0 "Dar'Khan is dead and Anveena is safe, but the Sunwell remains a cold basin beneath Quel'Danas. The Magisterium offers two answers: restore what was lost through the Light, or let Umbric deliberately reshape it through the Void. Quel'Thalas must decide what it is willing to become."
 wc_quelthalas_events.300.a:0 "We will restore what was lost through the Light."
 wc_quelthalas_events.300.b:0 "Let Umbric show us what the Void can become."
 
 wc_quelthalas_events.301.t:0 "Anveena's Awakening"
 wc_quelthalas_events.301.desc:0 "placeholder"
 wc_quelthalas_events.301.a:0 "placeholder"
 
 wc_quelthalas_events.302.t:0 "The Dragon's Investigation"
 wc_quelthalas_events.302.desc:0 "placeholder"
 wc_quelthalas_events.302.a:0 "placeholder"
 
 wc_quelthalas_events.303.t:0 "M'uru's Warning"
 wc_quelthalas_events.303.desc:0 "The player now gets the first hint that the Sunwell's restoration may have consequences that Silvermoon never anticipated."
 wc_quelthalas_events.303.a:0 "placeholder"
 
 wc_quelthalas_events.304.t:0 "The Legion Takes Notice"
 wc_quelthalas_events.304.desc:0 "The Legion isn't interested in Silvermoon because it wants another battlefield. It wants the Sunwell. And Anveena is potentially the key to accessing or manipulating it."
 wc_quelthalas_events.304.a:0 "placeholder"
 
 wc_quelthalas_events.305.t:0 "The Nether Portal"
 wc_quelthalas_events.305.desc:0 "The Legion wants to open a portal via Sunwell"
 wc_quelthalas_events.305.a:0 "placeholder"
 
 wc_quelthalas_events.306.t:0 "The Pattern"
 wc_quelthalas_events.306.desc:0 "The more the defenders of Quel'Thalas try to reinforce the Sunwell directly, the more obvious its magical signature becomes. In other words: Protecting the Sunwell makes it easier for the Legion to find it."
 wc_quelthalas_events.306.a:0 "placeholder"
 
 wc_quelthalas_events.307.t:0 "Anveena's Choice"
 wc_quelthalas_events.307.desc:0 ""What am I willing to sacrifice to protect Quel'Thalas?""
 wc_quelthalas_events.307.a:0 "placeholder"

 wc_quelthalas_events.308.t:0 "The Legion Strikes"
 wc_quelthalas_events.308.desc:0 "Sunblade and Legion forces assault Quel'Danas"
 wc_quelthalas_events.308.a:0 "placeholder"
 
 wc_quelthalas_events.309.t:0 "Battle for the Sunwell"
 wc_quelthalas_events.309.desc:0 "Kalecgos realizes the only way to prevent the Legion from establishing the portal is to use the very thing they are trying to exploit. Anveena willingly channels herself through the Sunwell. M'uru participates. The Sunwell's Light surges. The Legion's attempt to establish the portal is disrupted. But there is a cost."
 wc_quelthalas_events.309.a:0 "placeholder"
 
 wc_quelthalas_events.310.t:0 "The Price of the Light"
 wc_quelthalas_events.310.desc:0 "The Legion has been repelled, but Anveena has been fundamentally changed by what she did. Perhaps she has become more fully integrated with the Sunwell. Perhaps she can no longer exist independently in quite the same way. Perhaps she survives, but the experience awakens a much deeper understanding of her purpose. Kalecgos realizes that Anveena is not merely someone they need to protect. She is now one of the central beings in the future of the Sunwell. The Sunwell is no longer merely a thing Quel'Thalas possesses. It is a living part of the world, and Anveena is its human face."
 wc_quelthalas_events.310.a:0 "placeholder"
 
 wc_quelthalas_events.400.t:0 "Resuming the Search"
 wc_quelthalas_events.400.desc.sanctioned:0 "[SCOPE.sC('umbric_character').GetFirstName] returns to the Magisterium as an acknowledged scholar. With the Codex Entropius and the Void Magicule recovered from Dar'Khan's legacy, he proposes an institutional inquiry: if Quel'Thalas refuses to decide what it must become, its enemies will decide for it."
 wc_quelthalas_events.400.desc.restricted:0 "The wards around [SCOPE.sC('umbric_character').GetFirstName]'s study have never been removed. He meets the court's suspicion with his own, laying the Codex Entropius and the Void Magicule upon the table as proof that supervised caution has not answered the larger question: who will determine Quel'Thalas's future?"
 wc_quelthalas_events.400.desc.exiled:0 "Exile has sharpened [SCOPE.sC('umbric_character').GetFirstName]'s bitterness, but not broken his purpose. He returns with the Codex Entropius and the Void Magicule to prove that Silvermoon cast out the one scholar willing to choose what Quel'Thalas must become before another enemy chooses for it."
 wc_quelthalas_events.400.desc.neutral:0 "[SCOPE.sC('umbric_character').GetFirstName]'s old standing has been lost to memory, but his work has not. With the Codex Entropius and the Void Magicule recovered from Dar'Khan's legacy, he asks the question Silvermoon can no longer postpone: who will determine what Quel'Thalas becomes?"
 wc_quelthalas_events.400.a:0 "Resume the research."
 
 wc_quelthalas_events.401.t:0 "The Connection"
 wc_quelthalas_events.401.desc:0 "The Codex Entropius is not a catalogue of forbidden spells. Its diagrams describe how Void resonance can enter an arcane lattice without immediately destroying it. As [SCOPE.sC('umbric_character').GetFirstName] traces the pattern, a whisper presses against the truth: Silvermoon did distrust him, therefore Silvermoon must always betray him. He records the thought—and rejects its conclusion."
 wc_quelthalas_events.401.a:0 "A true premise can still lead to a poisoned conclusion."
 
 wc_quelthalas_events.402.t:0 "The Genuine Question"
 wc_quelthalas_events.402.desc:0 "The Void Magicule supplies the missing harmonic. The Sunwell's residue once interfaced with [SCOPE.sC('muru_character').GetFirstName]'s Light without ceasing to be arcane; why, [SCOPE.sC('umbric_character').GetFirstName] asks, must the Void be fundamentally different? The danger is cognition. He must distinguish his own thought, an impulse the Void has amplified, and a will arriving from beyond."
 wc_quelthalas_events.402.a:0 "Then prove the distinction can be maintained."

 wc_quelthalas_events.403.t:0 "The Legion Threat"
 wc_quelthalas_events.403.desc.legion_active:0 "Intercepted Sunblade calculations reveal a second Azerothian front. Anveena, M'uru, and the empty Sunwell basin are marked as components for reinforcing the Legion already abroad in the world. [SCOPE.sC('rommath_character').GetFirstName] once accepted Fel as a desperate weapon in Kael's service; these orders show that Kael now treats Quel'Thalas itself as fuel. The Grand Magister chooses his people over his prince."
 wc_quelthalas_events.403.desc.portal:0 "Intercepted Sunblade calculations reveal an attempt to rebuild the Legion's connection through Quel'Danas. Anveena, M'uru, and the empty Sunwell basin are listed as portal components. [SCOPE.sC('rommath_character').GetFirstName] once accepted Fel as a desperate weapon in Kael's service; these orders show that Kael now treats Quel'Thalas itself as fuel. The Grand Magister chooses his people over his prince."
 wc_quelthalas_events.403.a:0 "Rommath will lead the Magisterium against the Sunblade."
 
 wc_quelthalas_events.404.t:0 "Placed in the Crosshairs"
 wc_quelthalas_events.404.desc:0 "[SCOPE.sC('sunblade_leader').GetFirstName]'s expedition lands on Quel'Danas beneath Fel-lit skies. Its orders are decisive: seize the plateau, bind Anveena and M'uru into the portal, and turn the dead Sunwell into a gate. The debate over Quel'Thalas's future has become a war over who is permitted to choose it."
 wc_quelthalas_events.404.a:0 "Raise every banner. Quel'Danas will be decided in war."
 
 wc_quelthalas_events.405.t:0 "The Missing Piece of the Puzzle"
 wc_quelthalas_events.405.desc:0 "Quel'Danas is secure, but the Sunwell is still dead. At Telogrus, [SCOPE.sC('umbric_character').GetFirstName] steps willingly into the rift to test the Codex's thesis upon himself. The Void magnifies every grievance and calls each distortion wisdom. He survives by naming what is his, what has been amplified, and what comes from outside. He returns changed, lucid, and still master of his answer."
 wc_quelthalas_events.405.a:0 "He has harnessed the Void without becoming its slave."
 
 wc_quelthalas_events.406.t:0 "The Forbidden Solution"
 wc_quelthalas_events.406.desc:0 "[SCOPE.sC('umbric_character').GetFirstName]'s design joins three components: the darkened resonance of M'uru, the Void Magicule, and a carefully limited spark drawn from Anveena. The Magicule makes a partial siphon sufficient. [SCOPE.sC('kalecgos_character').GetFirstName] demands that the living woman before the council be treated as a person, not a vessel. Anveena asks whether her survival will include her will."
 wc_quelthalas_events.406.a:0 "Explain every safeguard and proceed only with Anveena's consent."
 wc_quelthalas_events.406.b:0 "The realm requires the partial siphon; proceed under state authority."
 
 wc_quelthalas_events.407.t:0 "Convergence"
 wc_quelthalas_events.407.desc.consent:0 "Anveena states her conditions before the final council, and [SCOPE.sC('kalecgos_character').GetFirstName] promises to hold Silvermoon to every word. [SCOPE.sC('umbric_character').GetFirstName] argues for controlled transformation; [SCOPE.sC('rommath_character').GetFirstName] accepts the danger because Kael's betrayal proved that no prince or cosmic master may choose for Quel'Thalas again."
 wc_quelthalas_events.407.desc.coerced:0 "Anveena refuses to call compulsion consent, and [SCOPE.sC('kalecgos_character').GetFirstName] condemns the throne's claim over her body. [SCOPE.sC('umbric_character').GetFirstName] insists the siphon will remain partial; [SCOPE.sC('rommath_character').GetFirstName] accepts the dangerous necessity without pretending it is clean. Quel'Thalas will choose its future, and bear the judgment for how."
 wc_quelthalas_events.407.a:0 "Begin the final alignment."
 
 wc_quelthalas_events.408.t:0 "The Point of No Return"
 wc_quelthalas_events.408.desc.consent:0 "Anveena enters the circle by her own decision. The Void Magicule draws only the agreed spark from her and binds it to M'uru's darkened resonance. When whispers flood the lattice, [SCOPE.sC('umbric_character').GetFirstName]'s discipline at Telogrus holds the pattern steady. Anveena falls to one knee—alive, conscious, and still herself—as the dead basin ignites into the Darkwell."
 wc_quelthalas_events.408.desc.coerced:0 "The wards close around Anveena despite her refusal. The Void Magicule limits the extraction to the spark the design requires, and M'uru's darkened resonance takes it into the basin. [SCOPE.sC('kalecgos_character').GetFirstName] calls the act a violation; [SCOPE.sC('umbric_character').GetFirstName] answers that he will not destroy her. Anveena survives as the dead basin ignites into the Darkwell, but survival does not settle the debt."
 wc_quelthalas_events.408.a:0 "The Darkwell belongs to Quel'Thalas—and the consequences belong to us."
 
 wc_quelthalas_events.409.t:0 "Birth of the Ren'dorei"
 wc_quelthalas_events.409.desc:0 "The Darkwell's first tide moves through the ley lines of Quel'Thalas. Blood elves and the high elves who still dwell within the transformed realm feel the same cold infinity answer in their blood. Some meet it with awe, others with terror or resistance, but none can mistake the change. The ren'dorei have been born, and the Voidfarer path now belongs to a nation."
 wc_quelthalas_events.409.a:0 "We chose what we would become."
 
 wc_quelthalas_events.500.t:0 "What Comes After"
 wc_quelthalas_events.500.desc:0 "preserve and protect what has been restored."
 wc_quelthalas_events.500.a:0 "The Light was enough."
 
 wc_quelthalas_events.501.t:0 "The Sunwell is Restored"
 wc_quelthalas_events.501.desc:0 "placeholder"
 wc_quelthalas_events.501.a:0 "placeholder"
 
 wc_quelthalas_events.502.t:0 "What Comes After"
 wc_quelthalas_events.502.desc.sanctioned_consent:0 "Umbric's sanctioned circle becomes the foundation of a new Void Magisterium. Anveena lives under the covenant she negotiated, while Kalecgos remains watchful and Rommath insists the Darkwell answer only to Quel'Thalas. Some call Umbric a savior; others fear what his success has normalized."
 wc_quelthalas_events.502.desc.sanctioned_coerced:0 "Umbric's sanctioned circle becomes the foundation of a new Void Magisterium, but its first triumph carries Anveena's coerced participation. 'I saved Anveena,' Umbric says. 'You violated her,' Kalecgos answers. Rommath accepts the weapon and refuses to erase its cost. Both accusations remain in the history of the Darkwell."
 wc_quelthalas_events.502.desc.restricted_consent:0 "The scholar once kept behind wards now directs the power that remade Quel'Thalas. Anveena lives under the safeguards she demanded; Kalecgos trusts the covenant more than the court, and Rommath keeps Umbric's work under scrutiny. Vindication has not ended suspicion."
 wc_quelthalas_events.502.desc.restricted_coerced:0 "The scholar Silvermoon once kept behind wards now commands the Darkwell, and Anveena's coerced participation makes every old suspicion harder to dismiss. 'I saved Anveena,' Umbric says. 'You violated her,' Kalecgos answers. Rommath calls the result necessary, never innocent."
 wc_quelthalas_events.502.desc.exiled_consent:0 "The exile returned as the architect of Quel'Thalas's survival. Anveena lives under the covenant she chose, Kalecgos guards its promises, and Rommath grants Umbric respect without devotion. To some he is the savior Silvermoon rejected; to others, proof that vindication can be as dangerous as failure."
 wc_quelthalas_events.502.desc.exiled_coerced:0 "The exile returned with the only answer that worked, and the bitterness of that vindication now stands beside Anveena's coerced participation. 'I saved Anveena,' Umbric says. 'You violated her,' Kalecgos answers. Rommath sees a loyal Thalassian solution—and a warning against ever confusing necessity with virtue."
 wc_quelthalas_events.502.desc.neutral_consent:0 "Whatever place history once gave Umbric, the Darkwell now fixes his legacy. Anveena lives under the covenant she chose, Kalecgos remains its vigilant witness, and Rommath accepts the transformation as a power controlled by Quel'Thalas. The realm survives, divided over what survival required."
 wc_quelthalas_events.502.desc.neutral_coerced:0 "Whatever place history once gave Umbric, the Darkwell now fixes his legacy. 'I saved Anveena,' he says. 'You violated her,' Kalecgos answers. Anveena lives, Rommath accepts the result, and a transformed realm must carry both truths forward."
 wc_quelthalas_events.502.a:0 "Survival required change."
 
 wc_quelthalas_events.503.t:0 "The Darkwell is Created"
 wc_quelthalas_events.503.desc:0 "Quel'Thalas has not restored the Sunwell of old. It has deliberately kindled the Darkwell, binding its future to the Void and transforming the Thalassian heartland into the realm of the ren'dorei."
 wc_quelthalas_events.503.a:0 "The world will remember their choice."
 
 wc_quelthalas_events.504.t:0 "The Legion Returns"
 wc_quelthalas_events.504.desc:0 "The defence of Quel'Danas collapses. Sunblade engines bind Anveena's stolen spark and M'uru's darkened essence to the empty basin, tearing a Fel wound through the sky. Anveena lives, but the portal holds; Legion forces pour onto the plateau while the surviving armies of Quel'Thalas retreat from a future chosen for them. The Sunwell restoration ends here."
 wc_quelthalas_events.504.a:0 "Quel'Danas is lost."
 
 wc_quelthalas_events.505.t:0 "The Legion Returns"
 wc_quelthalas_events.505.desc:0 "A Fel portal now burns above the Sunwell Plateau. The Sunblade hold Quel'Danas, and the Legion has opened another road into Azeroth through the ruins of the Sunwell."
 wc_quelthalas_events.505.a:0 "The world faces another Legion front."

 d_sunblade_expedition:0 "the Sunblade Expedition"
 d_sunblade_expedition_adj:0 "Sunblade"
 quelthalas_reconquest_cb:0 "Reconquest of Quel'Thalas"
 SUNBLADE_QUELDANAS_CB_NAME:0 "Sunblade Assault on Quel'Danas"
 SUNBLADE_QUELDANAS_WAR_NAME:0 "The Sunblade War for Quel'Danas"
 sunblade_queldanas_victory_desc:0 "The Sunblade seize Quel'Danas and complete their Fel portal."
 sunblade_queldanas_defeat_desc:0 "Quel'Thalas breaks the Sunblade assault and secures the Sunwell Plateau."
 sunblade_war_start_failed_tt:0 "The Sunblade invasion cannot form a legal war. Their expedition collapses before the battle for Quel'Danas begins, and the storyline continues as a defensive victory."
 sunblade_expedition_army:0 "Sunblade Expedition"
