l_english:

 #Storyteller #Warcraft
 ep3_laamp_decision_event.1031.desc_01: "#EMP "...and then he became enraged at this discovery, for the very first time the greatest warrior of the Pantheon felt fear. Sargares then cleaved the planet in two, instantly killing the nascent titan it housed."#!"
 ep3_laamp_decision_event.1031.desc_02: "#EMP "...and that is how the large beings formed from the very crust of Azeroth came to be, the Titanforged. Lead by the Titankeepers in the war against the Black Empire, the Empire of the Old Gods."#!"
 ep3_laamp_decision_event.1031.desc_03: "#EMP "...and then Kil'jaeden vowed to destroy his old friend, now arch-nemesis, Velen. Find him and his followers and destroy them... even if it took a thousand years."#!"
 ep3_laamp_decision_event.1031.desc_04: "#EMP "...and then the Elves screamed "Azshara save us!" "For Azshara" all while their Queen laughed as thousands of her kind were slaughtered. For all she desired now, was for a world as perfect as her and for her to be the Queen of the Dark Titan Sargares Himself."#!"
 ep3_laamp_decision_event.1031.desc_05: "#EMP "...and then the Elves used the power of the well itself which not only stopped Sargares from entering Azeroth, but also sent the Burning Legion back from whence they came. This victory did not come without consequences, as the destabalized Well of Eternity imploded and caused what we know today as the Great Sundering which split the ancient continent of Kalimdor."#!"
 ep3_laamp_decision_event.1031.desc_06: "#EMP "...and then Archimonde razed the Violet Citadel and its inhabitants to the ground. It would be the scar that signified the first blow against the mortal world."#!"
 ep3_laamp_decision_event.1031.desc_07: "#EMP "...and then Grommash Hellscream with his Warsong clan went forth with their reddened skin and burning eyes and rageful hearts to slay the demi-god, Cenarius. Without realizing that Grommash had once more handed over his race into slavery to the Demons."#!"
 ep3_laamp_decision_event.1031.desc_08: "#EMP "...and after destroying the skull of Gul'dan and absorbing its powers for himself, Illidan Stormrage had abandoned his old form and soul to become a Demon to destroy another Demon. A decision that would not sit well with his brother Malfurion."#!"
 ep3_laamp_decision_event.1031.desc_09: "#EMP "...and while Archimonde was full of himself because of his victories, he was too blind to the plan laid out by Malfurion Stormwind. A mistake he could not regret over as this would be his end and a major defeat of the Burning Legion."#!"
 ep3_laamp_decision_event.1031.desc_10: "#EMP "...and when the spirits at the Throne of Elements rejected Gul'dan as they foresaw the darkness in his heart, Gul'dan was offered power immeasurable by Kil'jaeden in exchange for delivering the orcs to the Burning Legion and turn them into a weapon to destroy the Draenai."#!"
 ep3_laamp_decision_event.1031.desc_11: "#EMP "...and that is how Liadrin became the matriarch of the Blood Knights, the Lady of Light."#!"
 ep3_laamp_decision_event.1031.desc_12: "#EMP "...and in her zeal and obsession with justice, Maiev Shadowsong had become vengeance itself and bound forever to the hunt of the Betrayer."#!"
 ep3_laamp_decision_event.1031.desc_13: "#EMP "...and after the defeat of Galakrond, the Keepers called upon their creators, the mighty Titans to empower the proto-dragons. And then came forth the Dragon Aspects who would work together to safeguard Azeroth from threats."#!"
 ep3_laamp_decision_event.1031.desc_14: "#EMP "...and the worship of Elune came to be as the Night Elves believed the moon goddess was bound to the Well of Eternity. The same Well of Eternity that has granted the Kal'dorei virtually eternal life."#!"
 ep3_laamp_decision_event.1031.desc_15: "#EMP "...and after climbing the Frozen Throne and offering his soul to the Lich King, Kel'thuzad returned to Lordaeron and secretly founded the Cult of the Damned. Recruiting the nobility and the lower classes at the promise of immortality."#!"
 ep3_laamp_decision_event.1031.desc_16: "#EMP "...and after the Cataclysm, the Zandalari prophet Zul and his followers traveled around the world to unite all trolls and build a united troll empire."#!"
 ep3_laamp_decision_event.1031.desc_17: "#EMP "...and even if Varimathras survived the betrayal of the Lich King, even betraying his own Nath'rezim to safeguard himself... he did not survive betraying the cunning Sylvanas Windrunner."#!"
 ep3_laamp_decision_event.1031.desc_18: "#EMP "...and as Azshara and her followers were being dragged beneath the waves because of the Great Sundering, in desperation she made a deal with the Old God N'zoth to be saved from a frozen death in the frigid seas... and then all of her followers and herself transformed into what we know today as the Naga."#!"
