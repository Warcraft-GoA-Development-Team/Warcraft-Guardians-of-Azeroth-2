 pam_decision_events.0011.opening: "To [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] of every land,"
 pam_decision_events.0011.desc.permitted: "My seal is on the matter. From this day, [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )] is reckoned a teaching of the faith in good standing.\n\nMay its hidden practitioners step forth into the light."
 pam_decision_events.0011.desc.prohibited: "My seal is on the matter. From this day, [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )] is anathema. Those clinging to it have parted from the faithful."
 pam_decision_events.0011.desc.fallback: "I have issued a proclamation concerning [pam_tenet_stance_tenet.GetName( pam_tenet_stance_issuer.GetRite )]."
 pam_decision_events.0011.b: "And yet I keep faith with this teaching..."

 pam_decision_events.0012.opening: "To [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] of every land,"
 pam_decision_events.0012.desc: "[bull_issuer.GetTitledFirstName] has declared [heresy_rite.GetName] a heresy.\n\nLet every ruler of the faith take heed."
 pam_decision_events.0012.a: "So be it."

 pam_decision_events.0013.opening: "To [ROOT.Char.GetTitledFirstNameNoTooltip], once counted among the faithful,"
 pam_decision_events.0013.desc.intro: "It is done. [heresy_rite.GetName] is proclaimed heresy, and all who cling to it are cut from [bull_issuer.GetFaith.GetName], root and branch."
 pam_decision_events.0013.desc.outro: "\n\nSo choose: kneel once more and be received back into the fold, or cling to your falsity and be condemned."
 pam_decision_events.0013.a: "We will stand alone, and gladly."
 pam_decision_events.0013.b: "I will not be cast out. Receive me back."

