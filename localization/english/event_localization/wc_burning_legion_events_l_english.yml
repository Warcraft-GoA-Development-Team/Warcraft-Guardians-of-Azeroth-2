l_english:
 
 burninglegion_0003_title: "The Siege of Dalaran"
 burninglegion_0003_desc: "The defenders of Dalaran are struck down one by one. The Lich and I approach the pathetic [antonidas.GetFirstName].\n\n[antonidas.GetFirstName] slumps over and speaks [Select_CString(antonidas.IsFemale, 'her', 'his' )] last words, "It pains me to even look at you, [ROOT.GetCharacter.GetFirstNameNoTooltip]..."\n\n"I'll be happy to end your torment, [antonidas.GetFirstName]. I told you that your magics could not stop me.", I retort while noticing the frown on the face with a hint of disappointment in [antonidas.GetFirstName].\n\nWith nothing left to say anymore, I strike [antonidas.GetFirstName] with [frostmourne|E]. I pick up the Book of Medivh, stained with [antonidas.GetFirstName]' blood, and hand it over to the Lich. "The spellbook is all yours, lich. Let's take it and leave before the wizards amass an attack."\n\n"Indeed... I will begin summoning Lord Archimonde after I study the Book of Medivh properly.", says [summonerofburninglegion.GetFirstName] as [Select_CString(summonerofburninglegion.IsFemale, 'she', 'he' )] examines the book."
 burninglegion_0003_a: "Let the summoning commence!"
 burninglegion_0003_a_tt: "The Lich will take its time to understand the Book of Medivh and summon the Burning Legion"

 burninglegion_0004_title: "Under the Burning Sky"
 burninglegion_0004_desc: "The Lich [summonerofburninglegion.GetFirstName] shifts away from the summoning circle and paves a way for the Burning Legion, "Come forth, Lord Archimonde! Enter this world and let us bask in your power!"\n\nThe very fabric of reality seems to shred and tear apart as a being of vile and strong magics enters this world. "Tremble mortals, and despair! Doom has come to this world!", Lord [lordarchimonde.GetFirstName] declares. [Select_CString(lordarchimonde.IsFemale, 'She', 'He' )] glances at [summonerofburninglegion.GetFirstName], "You have done well, little Lich. My plan worked perfectly."\n\n[tichondrius.GetFirstName] presents itself to Lord [lordarchimonde.GetFirstName], "Lord Archimonde, all the preparations have been made."\n"Very well [tichondrius.GetFirstName]. Since the [GetTrait('lich_king').GetName( GetNullCharacter )] is of no further use to me, you dreadlords will now command [scourge|E]", I hold back my shocked expression as I hear the final command by [lordarchimonde.GetFirstName].\n"As you wish, Lord [lordarchimonde.GetFirstName]", of course the Dreadlord doesn't let such a chance slip by.\n\nLord [lordarchimonde.GetFirstName] turns to look at the Dalaranians still trying to mount up a defense, "Soon, I will order the invasion to begin. But first, I will make an example of thse paltry wizards... by crushing their city into the ashes of history."\n\nI let out a breath I didn't know I was holding back. I turn towards [summonerofburninglegion.GetFirstName], "This has got to be a joke! What happens to us now?!"\n"Patience, my young death knight. The [GetTrait('lich_king').GetName( GetNullCharacter )] foresaw this as well. You may yet have a part to play in his grand design.""
 burninglegion_0004_a: "No other choice, then..."
