 wc_suramar_persecuting_elunists_modifier_desc: "Этот персонаж преследует последователей Элуны и может предпринимать более враждебные действия против них.\n[purge_population|E] Прогресс в [GetFaithByKey('kaldorei_religion').GetAdjective] [counties|E]: #p +0.5#!"
