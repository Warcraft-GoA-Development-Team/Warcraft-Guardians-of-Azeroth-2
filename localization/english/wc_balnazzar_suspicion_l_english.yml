l_english:
 WC_BALNAZZAR_SUSPICION_HUD_LABEL:0 "@wc_balnazzar_suspicion_icon! #color_porple Suspicion: [GetPlayer.MakeScope.ScriptValue('wc_balnazzar_suspicion_value')|0]/100#!"
 WC_BALNAZZAR_SUSPICION_HUD_TOOLTIP:0 "#T $WC_BALNAZZAR_SUSPICION_HUD_LABEL$#!\n#weak Suspicion of this borrowed identity.#!\n\n#bold 30 · Whispers#! — witnesses grow doubtful.\n#bold 60 · Inquiry#! — spymasters may find the disguise.\n#bold 85 · Pressure#! — the court demands reassurance.\n#bold 100 · Imposture established#! — investigators can confront you without knowing your true nature or name.\n\n[GetPlayer.Custom('WcBalnazzarCoverCrisis')]\n[GetPlayer.Custom('WcBalnazzarWitnessPressure')]\n#weak Lower suspicion does not erase known secrets or an established crisis.#!"
 WC_BALNAZZAR_COVER_CRISIS:0 "#bold This cover has been proved false.#! A prepared body remains a way out; lowering suspicion cannot undo the discovery."
 WC_BALNAZZAR_NO_COVER_CRISIS:0 ""
 WC_BALNAZZAR_PRESSURE_ENDED:0 "Witness pressure no longer raises suspicion; the imposture is already established."
 WC_BALNAZZAR_PRESSURE_NONE:0 "#bold No free, worried witnesses at court.#!\nMaintaining the mask reduces suspicion by 10."
 WC_BALNAZZAR_PRESSURE_ONE:0 "#bold One free witness remains unconvinced.#!\nFrom 30 suspicion: +4 after each full year of pressure.\nMaintaining the mask reduces suspicion by only 2."
 WC_BALNAZZAR_PRESSURE_SEVERAL:0 "#bold Several free witnesses share their doubts.#!\nFrom 30 suspicion: +8 after each full year of pressure.\nMaintaining the mask reduces suspicion by only 2."
 wc_balnazzar_suspicion_crisis_modifier:0 "The Mask Under Siege"
 wc_balnazzar_suspicion_crisis_modifier_desc:0 "Each reassurance meets another question. Even familiar faces watch for a mistake."
 wc_balnazzar_story.0103.title:0 "A Room Gone Quiet"
 wc_balnazzar_story.0103.desc:0 "The conversation stops before I reach my chair. An officer rises too quickly; another keeps his eyes on my hands. They bow as they always have, but no one offers the first report.\n\nI could spend the night before them in prayer, wearing this face until weariness makes it believable again. Or I could remind them what becomes of an accusation spoken without proof. Either course will cost me. Silence, now, has a cost of its own."
 wc_balnazzar_story.0103.vigil:0 "Let them kneel beside me until dawn."
 wc_balnazzar_story.0103.threaten:0 "Have them repeat their accusations to my face."
 wc_balnazzar_story.0103.wait:0 "Take my seat. Call for the first report."
