l_english:
 wc_health_undeath.1000.t:1 "[SCOPE.Custom('EventTitleDisease')]: The Touch of Death"
 wc_health_undeath.1000.desc:0 "My bones have become brittle, and my skin peels for what seems like an eternity. The memory of my loved ones fade away, and sanity seems more of something in the distance.\n\nWith each passing day I grow weak, and I realize what has become of me.\n\nThe plague that has infected our grain, ravaged our towns, has reached my flesh. This mortal soul of mine will soon end, and a fragment will be trapped in this body as an undead being..."
 wc_health_undeath.1000.court_physician.desc:0 "WIP PHYS"
 wc_health_undeath.1000.a:0 "Oh, [ROOT.Char.GetFaith.HighGodName]! Have pity on my soul!"

 wc_health_undeath.1001.t:1 "This Mortal Coil"
 wc_health_undeath.1001.desc:0 "My soul seperates from my body, I can feel the life in me slowly phasing out. I wonder how much time I have left on this land as a mortal being..."
 wc_health_undeath.1001.a:0 "Not long..."

 wc_health_undeath.1002.t:0 "Between Life and Death"
 wc_health_undeath.1002.desc:0 "My [ROOT.Char.GetFaith.PriestMalePlural] have done all they can do. Though I am no longer in danger of turning, I came close. Too close, they tell me that I may never fully regain my strength.\n\nOne of them helps me walk back to my chambers. The servants we pass by mutter among themselves, saying that I've aged a decade in one night.\n\nLet them say what they like, were it not for the [ROOT.Char.GetFaith.ReligiousHeadName], they'd be killed by the very [ROOT.Char.GetLadyLord] they gossip about."
 wc_health_undeath.1002.a:0 "Life keeps going."