 #Wild Gods-Group Faiths
 ursine:0 "Ursinism"
 ursine_adj:0 "Ursine"
 ursine_adherent:0 "Ursinist"
 ursine_adherent_plural:0 "Ursinists"
 ursine_desc:0 "$ursine$ is a tradition practiced by favoring balance of the wild things and the natural world. The twin Ancient Guardians Ursol and Ursoc receive veneration mostly from Ursol's descendants, the furbolgs. Furbolgs attuned to nature grow into druids and shamans, following Ursol's woven path. Ursoc's path, on the other hand, is saturated with blood. Following it, warriors and hunters learn the ferocity of nature." # Need rework

