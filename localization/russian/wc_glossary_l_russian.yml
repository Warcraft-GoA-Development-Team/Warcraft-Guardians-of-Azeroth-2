l_russian:
  ################################# 
  # Glossary 
  ################################# 
 APOCALYPSE_RENILASH_GLOSS: "«Апокалипсис», или Ренилаш на древнем наречии, о котором говорил Мерельдар, — пророчество о последней битве сил добра и зла. Это событие, воспринимаемое как высший Суд, решит судьбу мира, неся за собой и разрушение, и обновление."
 WAR_DRAENEI_GLOSS: "Война с дренеями стала катастрофическим конфликтом, начатым Кил’джеденом и исполненным орочьими кланами под наставничеством Нер’зула. Обманутые, будто дренеи — враги их выживания, орки начали беспощадную резню, истребив несметное число невинных. Эта война стала первым шагом к развращению орков и дальнейшему расколу Дренора."
 NERZHUL_GLOSS: "Нер’зул, когда-то величайший шаман среди орков и наставник Гул’дана, был духовным вождём, вёл свой народ с мудростью. Обманутый Кил’джеденом, он развязал кровавую войну против дренеев, обернувшуюся массовой резнёй. Поняв коварство демонов, Нер’зул попытался противиться Легиону, но был низложен и заменён Гул’даном, не дожив до финального падения Орды. Теперь Нер’зул влачит жалкое существование в изгнании, оглядываясь на руины Дренора."
 HAND_OF_GULDAN_GLOSS: "Рука Гул’дана, ранее известная как гора Цирукхар, — это исполинский вулкан, искорёженный Скверной на Дреноре. Когда-то он был спящим, но Гул’дан, используя Кодекс Проклятия, поразил повелителя огня Цируха и пробудил вулкан, обдавший земли демоническим пламенем. Этот акт разорвал связь орков со стихийными духами, обрекая Дренор на гибель. Теперь Рука Гул’дана возвышается как шрам на теле мира."
 BLOOD_OF_MANNOROTH_GLOSS: "Кровь Маннорота, омерзительная субстанция, создана из сущности питлорда Маннорота. Выпивший её получает безграничную силу и жажду резни — ценой вечного рабства Пылающему Легиону. Именно с помощью этой крови Гул’дан погубил орков, толкнув их на путь порчи."
 OGRE_BLACKROCK_WAR_GLOSS: "Война с ограми была беспощадным противостоянием, в котором клан Чёрной Горы под предводительством Чернорука и его помощника Оргрима Думхаммера сражался на грани гибели против многочисленных огров. Лишь за счёт засады и упорства оркам удалось взять верх. В ходе войны Оргрим, искушённый пророчеством Роковой Кувалды, пытался бросить её обратно в лаву, где она была выкована, но стихии отвергли его мольбу. При поддержке Чернорука он вернул себе молот и окончательно сломил огров."
 THRONE_OF_KILJAEDEN_GLOSS: "Трон Кил’джедена — когда-то священная гора клана Костеглодов на полуострове Адского Пламени (ранее джунгли Танаана). Гул’дан дал ей новое имя, когда призвал все орочьи кланы сюда на тёмный ритуал — принятие Крови Маннорота, закрепив их союз с Пылающим Легионом и навечно изменив судьбу орков."
 JUNGLE_OF_TANAAN_GLOSS: "Когда-то Танаан был непроходимым джунглями на Дреноре, где обитали самые яростные орочьи кланы. Но со временем, по таинственным причинам, он стремительно высох и превратился в безжизненную равнину, ныне известную как полуостров Адского Пламени."
 EYE_RITUAL_GLOSS: "При восшествии нового вождя у клана Кровавой Глазницы проходит обряд Жертвенного Ока. Он требует принести в жертву собственный глаз и получить пророческое видение собственной смерти. Это не пустяк: те, кто осмеливается провести ритуал, возвращаются навеки изменёнными: лишёнными страха, но обречёнными на осознание своей судьбы."
 CHOGALL_FORMATION_GLOSS: "Гордость и жажда власти Чо и Галла привели их к изгнанию из Высокогорья, их родного дома. Когда Гул’дан создал Совет Теней, он приблизил к себе Чо’галла, обучив его колдовству демонов. Так Чо’галл стал одним из первых огров-магов Орды и верным слугой Совета."
 PALE_ORCS_GLOSS: "Бледные орки, осквернённые силой Бездны и изгнанные в недра Награнда, чтут пророчество Часа Сумерек — когда мрак поглотит вселенную. Когда-то они были дикарями, неподвластными никому, но приняли Чо’галла за пророка своих тёмных богов, когда он явился и почти уничтожил их. Теперь они верны Орде, повинуясь слепо воле Чо’галла."
 DARK_STAR_GLOSS: "Тёмная Звезда — явление, которое бледные орки считали святым предзнаменованием. Спущенная их ритуалами на храм Карабора, она накрыла местность волной энергии Бездны, сломив многих разумом. Её исчезновение они воспринимают как предвестие Часа Сумерек."
 HOLYOAK_GLOSS: "Holyoak — редкий вид древесины, встречавшийся в Королевстве Штормграда. Упоминания о ней сохранились со времён Первой войны, когда она активно применялась при строительстве храмов Штормграда. Чтобы возвести церковь, надо было заранее обработать Holyoak на специальной лесопилке."
  
 DEFENDER_CROWN_GLOSS: "«Защитником короны» звали неизвестного командира войск [GetTitleByKey('k_stormwind').GetNameNoTier] во время [Glossary( 'Первой войны', 'FIRST_WAR_GLOSS' )]. Верный королю [GetScriptedCharacterByHistoryID( '2' ).GetTitledFirstName], он сражался на многих полях против орков и их вождя [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]. После победы [GetTitleByKey('e_horde').GetBaseName] его дальнейшая судьба неизвестна — вероятно, он пал в бою."
 FIRST_WAR_GLOSS: "Первая война разгорелась между орочьими кланами Дренора и людьми [GetTitleByKey('k_stormwind').GetName]. Завершилась падением [GetTitleByKey('k_stormwind').GetNameNoTier] и победой [GetTitleByKey('e_horde').GetBaseName]."
 SECOND_WAR_GLOSS: "Вторая война — масштабный конфликт в Восточных королевствах между армиями $e_horde$ и Альянса людей, дворфов, гномов и эльфов. Началась сразу после [Glossary( 'Первой войны', 'FIRST_WAR_GLOSS' )] и решила вопрос господства над континентом и Азеротом в целом."
 THIRD_WAR_GLOSS: "Третья война — глобальное противостояние рас Азерота и демонов Пылающего Легиона. Началась с падения Лордерона под натиском Плети во главе с рыцарем смерти [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] и завершилась гибелью Архимонда на горе Хиджал."
 WAR_OF_THE_ANCIENTS_GLOSS: "Война Древних — первое вторжение Пылающего Легиона на Азерот 10 000 лет до [Glossary( 'Первой войны', 'FIRST_WAR_GLOSS' )]. Один из крупнейших и кровопролитнейших конфликтов истории, завершившийся [Glossary( 'Великим расколом', 'GREAT_SUNDERING_GLOSS' )] и первой крупной победой над Легионом."
 GREAT_SUNDERING_GLOSS: "Великий раскол — катаклизм, разрушивший древний Калимдор около 10 000 лет назад после взрыва [Glossary( 'Колодца Вечности', 'WELL_OF_ETERNITY_GLOSS' )] и утопивший 80 % материка."
 WELL_OF_ETERNITY_GLOSS: "Колодец Вечности — озеро искрящейся арканической энергии, сформированное из жизненной силы мирового разума Азерота. Располагался возле Зин-Азшари на древнем Калимдоре; после Раскола на его месте возник Водоворот.\n\nКолодец стал центром вторжения Легиона во времена Войны Древних: демоны пытались превратить его в портал для Саргераса. Взрыв Колодца разнёс магию по всему миру, изменил географию планеты и открыл новую эпоху."
 CURSE_OF_FLESH_GLOSS: "Проклятие плоти — это проклятие, созданное [Glossary( 'Yogg-Saron', 'YOGG_SARON_GLOSS' )] и поразившее многие творения титанов. Древний бог внедрил его в [Glossary( 'Forge of Wills', 'FORGE_OF_WILLS_GLOSS' )], и оно медленно расползалось среди выкованных титанами, превращая их из металла и камня в существ из плоти."
 FORGE_OF_WILLS_GLOSS: "Кузня Воли и её близнец, [Glossary( 'Forge of Origination', 'FORGE_OF_ORIGINATION_GLOSS' )], были построены титаническими хранителями [GetScriptedCharacterByHistoryID( '400505' ).GetFirstName] и [GetScriptedCharacterByHistoryID( '400506' ).GetFirstName] после поражения Древних богов, чтобы насыщать дремлющую душу мира Азерота космическими энергиями и формировать её разум. Кузня также умела черпать жизненную сущность Азерота и создавать разумную жизнь. Именно здесь родились различные выкованные титанами: каменные [GetTrait('creature_trogg').GetName(GetNullCharacter)]и, земельники, [GetTrait('creature_mechagnome').GetName(GetNullCharacter)]и и [GetTrait('creature_vrykul').GetName(GetNullCharacter)]."
 FORGE_OF_ORIGINATION_GLOSS: "Кузня Созидания — титаническое устройство повторного зарождения и сверхоружие, расположенное в Ульдуме. Её основной узел — пирамидоподобная структура в Залах Созидания, но система охватывает весь регион. Кузню можно перенастраивать под множество задач; она — близнец [Glossary( 'Forge of Wills', 'FORGE_OF_WILLS_GLOSS' )] в Ульдуаре и, как и её пара, служит двум целям: она регулирует ритмы земли и укрепляет форму души мира Азерота, но если жизнь планеты будет осквернена, громадные энергии внутри могут быть высвобождены, чтобы заново «создать» планету — уничтожив всю флору и фауну, сведя её к первоэлементам, а затем породив новое поколение жизни."
 TWISTING_NETHER_GLOSS: "Круговерть Пустоты — астральная плоскость между мирами, описываемая как грань между отливом Света и течением Бездны. Ей соответствует физическая плоскость, называемая [Glossary( 'Great Dark Beyond', 'GREAT_DARK_BEYOND_GLOSS' )]. Круговерть — эфирное измерение хаотической магии, связывающее бесчисленные миры вселенной; и хотя она существует за пределами границ смертного мира, её нестабильные энергии порой разрывают завесу физической реальности, хлынув в неё и искажая творение."
 GREAT_DARK_BEYOND_GLOSS: "Великая Тьма За Пределами — это, как говорят, физическая вселенная: бескрайнее царство, сложенное из несчётных звёзд, миров, лун и смертных цивилизаций. Здесь находится Азерот — лишь один из бесчисленных миров, дрейфующих в космосе. Ей соответствует астральная плоскость, называемая [Glossary( 'Twisting Nether', 'TWISTING_NETHER_GLOSS' )]."
 SARGERAS_GLOSS: "Саргерас — титан и создатель Пылающего Легиона. Когда-то он был чемпионом [Glossary( 'Pantheon of Order', 'PANTHEON_GLOSS' )], избранным защищать миры, которые титаны упорядочили по всей [Glossary( 'Great Dark Beyond', 'GREAT_DARK_BEYOND_GLOSS' )]. Однако, будучи некогда стражем и защитником, позже он вознамерился уничтожить все души миров во вселенной. Во главе бесконечной демонической армии он начал Пылающий Поход, чтобы не дать [Glossary( 'void lords', 'VOID_LORDS_GLOSS' )] осквернить души миров, что привело бы к рождению тёмного титана — существа немыслимого зла, способного полностью уничтожить и пожрать вселенную."
 OLD_GODS_GLOSS: "Древние боги — паразитические, запредельные ужасы, созданные [Glossary( 'void lords', 'VOID_LORDS_GLOSS' )], чтобы находить и осквернять дремлющие души миров [Glossary( 'titan', 'TITAN_GLOSS' )]. Эти громадные горы плоти, физические воплощения Бездны, разрастаются внутри миров [Glossary( 'Great Dark Beyond', 'GREAT_DARK_BEYOND_GLOSS' )] подобно раку. Четыре Древних бога — [Glossary( 'Y’Shaarj', 'YSHAARJ_GLOSS' )], [Glossary( 'C’Thun', 'CTHUN_GLOSS' )], [Glossary( 'Yogg-Saron', 'YOGG_SARON_GLOSS' )] и [Glossary( 'N’Zoth', 'NZOTH_GLOSS' )] — правили Азеротом в его первобытную эпоху, создав то, что позже назовут Чёрной Империей. Когда прибыли [Glossary( 'titans', 'TITAN_GLOSS' )], они послали свои армии — выкованных титанами — сокрушить цитадели Древних богов и разрушить их империю."
 YSHAARJ_GLOSS: "Й’Шарадж был самым могущественным и самым порочным из [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )]. Й’Шарадж также был известен как «семиглавый» или «зверь семи голов»; говорят, он вдыхал отвагу и выдыхал страх. Й’Шарадж — единственный из четырёх Древних богов, убитый [Glossary( 'Pantheon of Order', 'PANTHEON_GLOSS' )], когда [Glossary( 'titan', 'TITAN_GLOSS' )] [Glossary( 'Aman’Thul', 'AMANTHUL_GLOSS' )] вырвал его с планеты. Затем его сердце заключили в хранилище под Долиной Вечного Цветения. Когда он умер, его последний, ужасный вздох воплотился в семерых высших ша — Гнев, Ненависть, Жестокость, Страх, Сомнение, Отчаяние и Гордость. Й’Шараджу фанатично поклоняются [GetTrait('creature_mantid').GetName(GetNullCharacter)]и — раса жестоких, экспансионистских насекомоподобных существ, живущих в землях к западу от стены Змеиного Хребта."
 CTHUN_GLOSS: "К’Тун — [Glossary( 'Old God', 'OLD_GODS_GLOSS' )] безумия и хаоса. К’Тун создал [GetTrait('creature_qiraji').GetName(GetNullCharacter)] и обитал в городе Ан’Кираж в Силитусе."
 YOGG_SARON_GLOSS: "Йогг-Сарон — один из четырёх [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )] Азерота. После падения от рук [Glossary( 'titans', 'TITAN_GLOSS' )] бесчисленные тысячелетия назад Йогг-Сарон был заточён в титаническом комплексе Ульдуар, в глубинах того, что станет континентом Нордскол. Йогг-Сарон ответственен за множество бедствий, пережитых Азеротом. Пытаясь вырваться из заточения, Древний бог осквернил хранителя Локена и обратил его против собственных собратьев, что привело к гибели Тира, а также создал [Glossary( 'Curse of Flesh', 'CURSE_OF_FLESH_GLOSS' )], превратившее бесчисленных выкованных титанами в смертных существ из плоти и крови. Тысячелетия спустя Йогг-Сарон также осквернил Древо Мира Андрассил, вынудив его ночных эльфов-создателей срубить дерево — но не раньше, чем Древний бог тайно сумел открыть врата в эфирный мир духов, известный как Изумрудный Сон, и посеять семя порчи, которое позже разрастётся в Изумрудный Кошмар."
 NZOTH_GLOSS: "Н’Зот — один из четырёх [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )], что высадились на Азероте, зловредные существа, которых [Glossary( 'titans', 'TITAN_GLOSS' )] изолировали в первобытные эпохи Азерота."
 GHUUN_GLOSS: "Г’уун — [Glossary( 'Old God', 'OLD_GODS_GLOSS' )], случайно созданный [Glossary( 'Pantheon', 'PANTHEON_GLOSS' )] во время экспериментов над другими заключёнными Древними богами, когда титаны пытались найти решение угрозы, которую те представляли. Кровавые тролли Назмира почитали Г’ууна как лоа; он был известен как Кровавый бог. Хотя он был куда менее могущественным, чем остальные Древние боги, угроза от него всё равно могла стать гибелью мира. Порча Г’ууна называлась «подгнильем». Он стремился распространять свою гниль, мор и разложение по миру и за его пределы — и в процессе пожрать Азерот."
 VOID_LORDS_GLOSS: "Владыки Бездны — чудовищные сущности, состоящие из чистой энергии тени, что правят Бездной за пределами реальности. Безжалостные и жестокие сверх всякого воображения, они стремятся лишь искривить реальность в царство вечных мучений и в конце концов пожрать всю материю, всю энергию и саму вселенную. Однако лишь самые могущественные из владык Бездны могут по-настоящему проявиться в физической вселенной — ослабленные и лишь на ограниченное время, поскольку их силы быстро рассеиваются в ничто. Поэтому им необходимо поглощать несметные объёмы материи и энергии, чтобы удерживать своё присутствие."
 PANTHEON_GLOSS: "Титанический Пантеон — союз титанов, что формировали и упорядочивали миры, наблюдая за [Glossary( 'Great Dark Beyond', 'GREAT_DARK_BEYOND_GLOSS' )] и разыскивая других себе подобных. Они создали выкованных титанами, различные расы Азерота и наделили Драконьих Аспектов силой через титанических хранителей."
 AMANTHUL_GLOSS: "Аман’Тул, Верховный Отец, — лидер титанического [Glossary( 'Pantheon', 'PANTHEON_GLOSS' )]. Он самый древний и самый мудрый из своего рода. [Glossary( 'titan', 'TITAN_GLOSS' )], изначально благословивший [GetScriptedCharacterByHistoryID( '62800' ).GetFirstName] и бронзовую стаю драконов, Аман’Тул владеет магией времени. Возглавляя Пантеон во время упорядочивания вселенной, он и его братья были повержены [Glossary( 'Sargeras', 'SARGERAS_GLOSS' )]; их души удерживал в плену Тёмный титан, пока герои Азерота не освободили их."
 EONAR_GLOSS: "Эонар, Хранительница Жизни, — [Glossary( 'titan', 'TITAN_GLOSS' )]-покровительница всего живого и природы. Она благословила [GetTrait('creature_red_dragon').GetName(GetNullCharacter)]а [GetScriptedCharacterByHistoryID( '62400' ).GetFirstName] силой оберегать всех живых существ и саму Жизнь, а [GetTrait('creature_green_dragon').GetName(GetNullCharacter)]а [GetScriptedCharacterByHistoryID( '62001' ).GetFirstName] — охранять природу и Изумрудный Сон."
 NORGANNON_GLOSS: "Норганнон — владыка всей магии, знаний, тайн и загадок. Он даровал силу хранителям [GetScriptedCharacterByHistoryID( '400501' ).GetFirstName] и [GetScriptedCharacterByHistoryID( '400505' ).GetFirstName], а также наделил великой мощью [GetTrait('creature_blue_dragon').GetName(GetNullCharacter)]а [GetScriptedCharacterByHistoryID( '62600' ).GetFirstName], чтобы тот стал стражем магии и арканума."
 GOLGANNETH_GLOSS: "Голганнет, Громовержец, — член [Glossary( 'titan', 'TITAN_GLOSS' )]-[Glossary( 'Pantheon', 'PANTHEON_GLOSS' )] и владыка небес и ревущих океанов."
 KHAZGOROTH_GLOSS: "Хаз’горот — [Glossary( 'titan', 'TITAN_GLOSS' )]-созидатель и кузнец миров. Он наделил [GetTrait('creature_black_dragon').GetName(GetNullCharacter)]а Нелтариона, позже ставшего Смертокрылом, властью над землёй и глубинными недрами мира."
 AGGRAMAR_GLOSS: "Агграмар, Мститель, — [Glossary( 'titan', 'TITAN_GLOSS' )] и бывший лейтенант [Glossary( 'Sargeras', 'SARGERAS_GLOSS' )]. Когда Саргерас предал [Glossary( 'Pantheon', 'PANTHEON_GLOSS' )], Агграмар принял на себя роль чемпиона — пока не был убит своим бывшим наставником и другом."
 RAGNAROS_GLOSS: "Рагнарос, Повелитель Огня, был владыкой стихии огня. После призыва на Азерот колдуном-таном Тауриссаном он захватил Чёрную гору и более двухсот лет правил там своими прислужниками из самых глубин её пылающего сердца."
  
  # SS note: i had to use a nonstandard single quote for mak'gora. feel free to copy and paste this when needed, but remember you need to use $makgora_name|q$ inside a data statement such as a glossary citation. 
 makgora_name: "Мак'гора"
 MAKGORA_GLOSS: "Древние традиции всех орочьих кланов даруют любому воину право на #bold Мак'гора#! — вызов на ритуальный поединок, который может быть брошен любому правителю при наличии весомого обвинения в бесчестье или слабости. Если в наши дни Мак'гора иногда может завершиться милостью победителя, то в прошлом он вёлся до смерти. Смерть в Мак'гора почиталась одновременно как суд над обоснованностью претензий зачинщика и как искупление чести и достоинства как для опозорившейся стороны, так и для пострадавшей. Что особенно важно, победитель получает право на всё наследственное имущество проигравшего."
 ORCISH_CLANS_GLOSS: "Древние кланы Старой Орды были традиционной родоплеменной и семейной структурой орочьих культур на Дреноре. В [lore|E] эти кланы пережили великое потрясение, когда Гул'дан инициировал их объединение в Орду и привёл их в Азерот через Тёмный Портал. Те из них, что выжили после [Glossary('Третьей войны', 'THIRD_WAR_GLOSS')], изменились до неузнаваемости. Среди них были [GetTitleByKey('k_blackrock_clan').GetName], [GetTitleByKey('d_blacktoothgrin_clan').GetName], [GetTitleByKey('k_bleeding_hollow_clan').GetName], [GetTitleByKey('d_burning_blade_clan').GetName], [GetTitleByKey('d_dragonmaw_clan').GetName], [GetTitleByKey('k_frostwolf_clan').GetName], [GetTitleByKey('d_laughing_skull_clan').GetName], [GetTitleByKey('k_shattered_hand_clan').GetName], [GetTitleByKey('d_stormreaver_clan').GetName], [GetTitleByKey('d_twilights_hammer_clan').GetName] и [GetTitleByKey('k_warsong_clan').GetName]."
