 game_concept_wc_spell_improved_body: "Улучшенное Тело"
 game_concept_wc_spell_improved_body_desc: "Напрягите волю, чтобы похитить у цели физическую черту. Когда похищенная сила перетекает в вас, её утрата становится вашим обретением, укрепляя ваш облик, пока цель умирает мучительной смертью."
 wc_spell_improved_body_type: "[wc_spell_type_enchantment|E]"
 wc_spell_improved_body_targets: "[character|E]"
 wc_spell_improved_body_effects: "Похищает положительную немагическую [physical_trait|E] у вашей цели."
 wc_learn_spell_improved_body: "Вы изучаете заклинание: [wc_spell_improved_body|E]"
 wc_improved_body_trigger: "У цели должна быть положительная [physical_trait|E]"

 game_concept_wc_spell_coagulation: "Свёртывание Крови"
 game_concept_wc_spell_coagulation_desc: "Повелевайте током крови одним прикосновением, заставляя его затянуть рану или вывести яд из тела цели. Когда травма заживает или токсин исчезает, жизненная сила возвращается, оставляя цель обновлённой и свободной от затянувшегося недуга."
 wc_spell_coagulation_type: "[wc_spell_type_heal|E], [wc_spell_type_dispel|E]"
 wc_spell_coagulation_targets: "[character|E]"
 wc_spell_coagulation_effects: "Исцеляет рану или отравление.\n[wc_spell_rank|E] 1: Может исцелить или снизить тяжесть [wc_injury|E].\n[wc_spell_rank|E] 2: Может исцелить [wc_poison|E].\n[wc_spell_rank|E] 3: Может исцелить [wc_major_injury|E] или исцелить/снизить тяжесть [wc_magic_injury|E]"
 wc_learn_spell_coagulation: "Вы изучаете заклинание: [wc_spell_coagulation|E]"

 game_concept_wc_spell_blood_boil: "Вскипание крови"
 game_concept_wc_spell_blood_boil_desc: "Высвободите волну проклятой энергии, что проносится по жилам каждого врага в стане противника. Это заклинание заражает всех в радиусе действия вирулентной Кровавой чумой, заставляя их кровь кипеть и гнить."
 wc_spell_blood_boil_type: "[wc_spell_type_attack|E]"
 wc_spell_blood_boil_targets: "[army|E]"
 wc_spell_blood_boil_effects: "Поражает каждого персонажа в целевой армии [GetTrait('blood_plague').GetName( GetNullCharacter )]"
 wc_learn_spell_blood_boil: "Вы изучаете заклинание: [wc_spell_blood_boil|E]"
 wc_blood_boil_hit_tt: "[dodger.GetShortUIName|U] [Select_CString(dodger.IsLocalPlayer, 'получаете', 'получает')] эффекты заклинания [wc_spell_blood_boil|E]."
 wc_blood_boil_dodge: "[dodger.GetShortUIName|U] уклоняется от [wc_spell_blood_boil|E]!"
 wc_blood_boil_resist_tt: "Из-за [wc_spell_school_death|E] [wc_magic_resistance|E] [dodger.GetShortUINamePossessive] заклинание не возымело эффекта."
 wc_spell_blood_boil_knights_tt: "Каждый [knight|E] в [this_recipient.GetName] имеет большой шанс получить [GetTrait('blood_plague').GetName( GetNullCharacter )]"

 game_concept_wc_spell_strangulate: "Удушение"
 game_concept_wc_spell_strangulate_desc: "Призовите теневое нечто, обвившееся вокруг горла цели, лишающее её голоса и душащее её магию. Тщетно сопротивляясь, цель остаётся уязвимой, а её магия подавлена удушающей хваткой."
 wc_spell_strangulate_type: "[wc_spell_type_enchantment|E]"
 wc_spell_strangulate_targets: "[character|E]"
 wc_spell_strangulate_effects: "Не даёт цели творить заклинания, пока действует заклинание."
 wc_learn_spell_strangulate: "Вы изучаете заклинание: [wc_spell_strangulate|E]"

 wc_crimson_binding_activated: "Багровая Связь"
 wc_crimson_binding_activated_tt: "[crimson_binding_target.GetShortUIName] погиб вместо вас"

 game_concept_wc_spell_army_of_the_dead: "Ритуал: Войско мёртвых"
 game_concept_wc_spell_army_of_the_dead_desc: "Воззовите к глубинам некромантии, подняв огромный легион нежити, чьи костлявые руки прорываются сквозь землю, покорные вашей воле."
 wc_spell_army_of_the_dead_type: "[wc_spell_type_summon|E]"
 wc_spell_army_of_the_dead_targets: "[county|E]"
 wc_spell_army_of_the_dead_effects: "Принесите [development|E] целевого графства в жертву, чтобы призвать легион мёртвых. Размер этой армии зависит от принесённого в жертву развития и числа ваших умений образа жизни [GetLifestyle('death_magic_lifestyle').GetName]."
 wc_learn_spell_army_of_the_dead: "Вы изучаете заклинание: [wc_spell_army_of_the_dead|E]"
 raised_undead_troops: "Поднятые войска"

 game_concept_wc_spell_supreme_raise_dead: "Ритуал: Высшее воскрешение мёртвых"
 game_concept_wc_spell_supreme_raise_dead_desc: "Направьте вершину некромантической мощи, поднимая могущественных существ вроде ревенантов и личей, исторгнутых из загробного мира ради службы вам."
 wc_spell_supreme_raise_dead_type: "[wc_spell_type_summon|E]"
 wc_spell_supreme_raise_dead_targets: "[character|E]"
 wc_spell_supreme_raise_dead_effects: "Поднимите мёртвого [character|E] или превратите себя в [GetTrait('creature_lich').GetName( GetNullCharacter )] или [GetTrait('creature_revenant').GetName( GetNullCharacter )]"
 wc_learn_spell_supreme_raise_dead: "Вы изучаете заклинание: [wc_spell_supreme_raise_dead|E]"
 wc_supreme_raise_dead_trigger: "Может быть нацелено только на вас или на мёртвых."

 game_concept_wc_spell_epidemic: "Ритуал: Эпидемия"
 game_concept_wc_spell_epidemic_desc: "Призовите силы мора, обрушив на землю чуму. Это заклинание распространяет вирулентную болезнь, заражая всех в пределах досягаемости."
 wc_spell_epidemic_type: "[wc_spell_type_attack|E]"
 wc_spell_epidemic_targets: "[barony|E]"
 wc_spell_epidemic_effects: "Насылает [epidemic|E] на целевую провинцию."
 wc_learn_spell_epidemic: "Вы изучаете заклинание: [wc_spell_epidemic|E]"
 epidemic_tt: "Вы сможете выбрать, какую [epidemic|E] начать, после начала сотворения заклинания."

 game_concept_wc_spell_crimson_binding: "Ритуал: Багровая Связь"
 game_concept_wc_spell_crimson_binding_desc: "Сотките тёмный ритуал кровной магии, создав невольную связь между вами и целью. Если смертельный урон поразит вас, цель погибнет вместо вас, а её сущность будет поглощена багровой связью."
 wc_spell_crimson_binding_type: "[wc_spell_type_enchantment|E]"
 wc_spell_crimson_binding_targets: "[character|E]"
 wc_spell_crimson_binding_effects: "Связывает целевого [prisoner|E], вынуждая его погибнуть вместо вас."
 wc_learn_spell_crimson_binding: "Вы изучаете заклинание: [wc_spell_crimson_binding|E]"

 wc_target_province_coastal: "Цель не является прибрежной"

 wc_eternal_winter_effect: "[duchy.GetName] будет поражён [wc_spell_eternal_winter|E]"

 game_concept_wc_spell_summon_water_elemental: "Призыв Водного Элементаля"
 game_concept_wc_spell_summon_water_elemental_desc: "Призовите стихийную мощь воды, придав ей облик верного слуги. Его присутствие продлевает действие вашей магии и замораживает врагов на месте."
 wc_spell_summon_water_elemental_type: "[wc_spell_type_summon|E]"
 wc_spell_summon_water_elemental_targets: "[character|E], [barony|E]"
 wc_spell_summon_water_elemental_effects: "[wc_spell_rank|E] 1: Призывает Водного Элементаля на вашу сторону, слегка увеличивая время сотворения и перезарядку, но также значительно продлевая действие.\n[wc_spell_rank|E] 2: Призывает могущественные [men_at_arms|E] в выбранное [barony|E].\n[wc_spell_rank|E] 3: Враги, сражающиеся с вашим Элементалем из [men_at_arms|E], на время замедляются."
 wc_learn_spell_summon_water_elemental: "Изучите заклинание: [wc_spell_summon_water_elemental|E]"
 wc_learn_spell_summon_water_elemental_2: "Изучите 2-й и 3-й [wc_spell_rank|E] заклинания [wc_spell_summon_water_elemental|E]"
 summoned_water_elemental: "Призванный Водный Элементаль"

 game_concept_wc_spell_soothing_waters: "Успокаивающие Воды"
 game_concept_wc_spell_soothing_waters_desc: "Призовите умиротворяющие объятия воды, окутав цель целебным потоком. Воды оставляют цель обновлённой и посвежевшей под безмятежным касанием заклинания."
 wc_spell_soothing_waters_type: "[wc_spell_type_enchantment|E]"
 wc_spell_soothing_waters_targets: "[character|E]"
 wc_spell_soothing_waters_effects: "Окунает целевого [character|E] в магические воды, снимая его стресс и исцеляя его."
 wc_learn_spell_soothing_waters: "Изучите заклинание: [wc_spell_soothing_waters|E]"

 game_concept_wc_spell_river_spirits_rage: "Ярость Духа Реки"
 game_concept_wc_spell_river_spirits_rage_desc: "Высвободите ярость речных духов, обрушив на цель поток воды. Заклинание неустанно терзает её, причиняя вред, пока стремительные течения сковывают её конечности."
 wc_spell_river_spirits_rage_type: "[wc_spell_type_attack|E]"
 wc_spell_river_spirits_rage_targets: "[character|E]"
 wc_spell_river_spirits_rage_effects: "[wc_spell_rank|E] 1: Обрушивает гнев речных духов на целевую [character|E], вредя ей и замедляя её.\n[wc_spell_rank|E] 2: Обрушивает на цель ещё более могучего духа, усиливая эффекты.\n[wc_spell_rank|E] 3: Обрушивает гнев на целевую армию [army|E] вместо этого, затрудняя её действия в прибрежных областях и на море."
 wc_learn_spell_river_spirits_rage: "Изучите заклинание: [wc_spell_river_spirits_rage|E]"

 game_concept_wc_spell_invoke_tsunami: "Призыв Цунами"
 game_concept_wc_spell_invoke_tsunami_desc: "Призовите неукротимую силу моря, обрушив на сушу огромное цунами. Это заклинание опустошает область, превращая постройки в руины и сметая всё на своём пути."
 wc_spell_invoke_tsunami_type: "[wc_spell_type_attack|E]"
 wc_spell_invoke_tsunami_targets: "[province|E]"
 wc_spell_invoke_tsunami_effects: "Обрушивает цунами на целевое прибрежное [province|E] и до 4 дополнительных прибрежных провинций, разрушая их укрепления и снижая их [development|E]."
 wc_learn_spell_invoke_tsunami: "Изучите заклинание: [wc_spell_invoke_tsunami|E]"

 game_concept_wc_spell_frost_shock: "Ледяной Шок"
 game_concept_wc_spell_frost_shock_desc: "Высвободите заряд ледяной энергии, поразив цель ледяным шоком. Лютая стужа проникает глубоко, нанося Обморожение и оставляя цель уязвимой, а её силы — иссушёнными холодом."
 wc_spell_frost_shock_type: "[wc_spell_type_attack|E]"
 wc_spell_frost_shock_targets: "[character|E]"
 wc_spell_frost_shock_effects: "Наносит (или усугубляет) травму [wc_injury_frostbite|E] персонажу."
 wc_learn_spell_frost_shock: "Изучите заклинание: [wc_spell_frost_shock|E]"
 wc_frost_shock_hit_tt: "[dodger.GetShortUIName|U] [Select_CString(dodger.IsLocalPlayer, 'получаете', 'получает')] эффекты заклинания [wc_spell_frost_shock|E]."
 wc_frost_shock_resist_tt: "Из-за [wc_spell_school_elemental_water|E] [wc_magic_resistance|E] [dodger.GetShortUINamePossessive] заклинание не возымело эффекта."
 wc_frost_shock_dodge: "[dodger.GetShortUIName|U] уклоняется от [wc_spell_frost_shock|E]!"

 game_concept_wc_spell_icefury: "Ледяная Ярость"
 game_concept_wc_spell_icefury_desc: "Высвободите гнев ледяных пустошей, обрушив на целей шторм ледяной ярости. Заклинание вредит всем, кто страдает от Обморожения, раздирая их тела безжалостными осколками льда."
 wc_spell_icefury_type: "[wc_spell_type_attack|E]"
 wc_spell_icefury_targets: "[duchy|E]"
 wc_spell_icefury_effects: "Наносит [GetTrait('wounded_1').GetName(GetNullCharacter)] всем [characters|E] в целевом [duchy|E], страдающим от [wc_injury_frostbite|E], а также замедляет пополнение [levy|E] в затронутых регионах."
 wc_learn_spell_icefury: "Изучите заклинание: [wc_spell_icefury|E]"

 game_concept_wc_spell_ice_structure: "Ледяная Крепость"
 game_concept_wc_spell_ice_structure_desc: "Призовите возвышающееся сооружение из незыблемого льда, чьё присутствие излучает мощь по всей округе. Это заклинание укрепляет местность и наделяет силой тех, кто в пределах его ледяной досягаемости."
 wc_spell_ice_structure_type: "[wc_spell_type_enchantment|E]"
 wc_spell_ice_structure_targets: "[province|E]"
 wc_spell_ice_structure_effects: "Повышает уровень укреплений, а также даёт различные иные усиления персонажам в целевой [province|E]."
 wc_learn_spell_ice_structure: "Изучите заклинание: [wc_spell_ice_structure|E]"
 wc_ice_structure_title: "Вы находитесь под действием [wc_spell_ice_structure|E]!"

 game_concept_wc_spell_eternal_winter: "Ритуал: Вечная Зима"
 game_concept_wc_spell_eternal_winter_desc: "Призовите неотступную, бесконечную зиму, насылая на целевую область Снежную бурю в холодные месяцы. Вырывайте славу и богатство из затронутых регионов в свою пользу."
 wc_spell_eternal_winter_type: "[wc_spell_type_enchantment|E]"
 wc_spell_eternal_winter_targets: "[duchy|E]"
 wc_spell_eternal_winter_effects: "Целевое [duchy|E], а также два соседних герцогства лишаются части [income|E] и [dynasty_prestige|E], которые вместо этого достаются заклинателю. Кроме того, в зимние месяцы на целевую область налагается мощная [wc_spell_blizzard|E]."
 wc_learn_spell_eternal_winter: "Изучите заклинание: [wc_spell_eternal_winter|E]"


 game_concept_wc_spell_create_portal: "Ритуал: Создание Портала"
 game_concept_wc_spell_create_portal_desc: "Откройте портал в другую провинцию, позволяющий быстро перемещаться между двумя местами."
 wc_spell_create_portal_type: "[wc_spell_type_ritual|E]"
 wc_spell_create_portal_targets: "[barony|E], [character|E], [army|E], [entourage|E]"
 wc_spell_create_portal_effects: "[wc_spell_rank|E] 1: Создаёт портал между локацией целевого персонажа и любой другой провинцией. Если цель находится в [Concept('entourage', 'группе')|E] путешествия, она будет телепортирована вместе с ним.\n[wc_spell_rank|E] 2: Портал теперь может телепортировать несколько персонажей.\n[wc_spell_rank|E] 3: Портал теперь может телепортировать целые армии."
