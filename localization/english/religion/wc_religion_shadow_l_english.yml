 #Cult of the Forgotten Shadow-Group Faiths
 cult_of_the_forgotten_shadow:0 "Cult of the Forgotten Shadow"
 cult_of_the_forgotten_shadow_adj:0 "Forgotten"
 cult_of_the_forgotten_shadow_adherent:0 "Forgotten"
 cult_of_the_forgotten_shadow_adherent_plural:0 "Forgotten"
 cult_of_the_forgotten_shadow_desc:0 "A heretical group of shadow magic practitioners, the $forgotten_shadow_adherent_plural$ believe that dark energy practitioners are just as vital to the survival of life and reality as wielders of the Light. The cult preaches balance, mandating that shadow priests must never forget the dangers of being corrupted by the dark energies they manipulate... For it is often difficult to find one's way back to the shadow from the deep reaches of the darkness." # Need rework

 #Alchemical Materialism-Group Faiths
 alchemical_materialism:0 "Alchemical Materialism"
 alchemical_materialism_adj:0 "Alchemicist"
 alchemical_materialism_adherent:0 "Alchemicist"
 alchemical_materialism_adherent_plural:0 "Alchemicists"
 alchemical_materialism_desc:0 "Upon exposure to the ideas of the $forgotten_shadow$, many scientifically-minded individuals come to question whether the forces of the universe deserve the reverence of divinity at all. For some, the magical science of Alchemy proves the key to bending the forces of the universe to one's will. For if nothing is sacred, anything can be a tool; and any tool can be a weapon..." # Need rework
 
