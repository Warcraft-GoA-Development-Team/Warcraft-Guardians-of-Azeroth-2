l_russian:
 wc_magic_flavor_events.0010.t: "Флакон лазурного обещания"
 wc_magic_flavor_events.0010.d: "«Мой [ROOT.Char.GetLadyLord|U], удача улыбается вам». [merchant.GetWomanMan] указывает на [merchant.GetHerHis] сумку. Под капюшоном позвякивают флаконы, и [merchant.GetSheHe] достаёт стеклянную склянку с клубящейся голубой жидкостью.\n\n«Я — [merchant.GetFirstNameNoTooltip]. Со мной зелье, способное восполнить вашу ману, мой [ROOT.Char.GetLadyLord|U]. Созданное лишь из самых могущественных реактивов, пропитанных силой лей-линий, — один глоток, и вы снова сможете повелевать своей магией».\n\nНастоящие зелья маны дороги, но это лихорадочное сотворение заклинаний опустошило мою ману..."
 wc_magic_flavor_events.0010.a: "Называйте свою цену, [merchant.GetFirstNameNoTooltip]."
 wc_magic_flavor_events.0010.a_good: "Зелье мощное"
 wc_magic_flavor_events.0010.a_bad: "Зелье действует, но слабо"
 wc_magic_flavor_events.0010.a_terrible: "Зелье вредоносно"
 wc_magic_flavor_events.0010.b: "Позвольте мне сперва его осмотреть."
 wc_magic_flavor_events.0010.b_tt: "Вы узнаёте содержимое флакона"
 wc_magic_flavor_events.0010.b_bad: "Содержимое флакона неясно"
 wc_magic_flavor_events.0010.c: "Отдавай его, или познаешь мой гнев."
 wc_magic_flavor_events.0010.c_tt: "Вы забираете зелье силой"

 wc_bad_mana_potion_modifier: "Бракованное зелье маны"
 wc_bad_mana_potion_modifier_desc: "Этот персонаж выпил бракованное зелье маны...\n[wc_mana_regeneration|E]: @wc_full_mana_icon! #N -10%#!"

 wc_magic_flavor_events.0020.t: "Дары лей-линий"
 wc_magic_flavor_events.0020.desc: "Блуждая по диким землям своих владений, я замечаю тускло светящиеся кристаллы, погребённые в листве.\n\nОни тёплые на ощупь и пульсируют магической силой лей-линий этой местности. Это не может быть ошибкой: они торчат из земли, словно осколки застывшего сапфира.\n\nИх продажа могла бы принести немалую прибыль, но, возможно, более долгосрочные раскопки тоже сулят выгоду..."
 wc_magic_flavor_events.0020.a: "Немедленно собрать все кристаллы, какие найдём!"
 wc_magic_flavor_events.0020.b: "Извлекать их медленно, со временем..."
 wc_magic_flavor_events.0020.c: "Это идеальное место для магического анклава."
 wc_magic_flavor_events.0020.c_tt: "Все персонажи, находящиеся здесь, также получают: [GetModifier('wc_studying_leyline_crystals_character').GetNameWithTooltip]"
 wc_magic_flavor_events.0020.d: "Вся эта первозданная сила принадлежит мне!"

 wc_magic_flavor_events.0030.t: "Том "
 wc_magic_flavor_events.0030.death_title: "Разложения"
 wc_magic_flavor_events.0030.life_title: "Обновления"
 wc_magic_flavor_events.0030.light_title: "Сияния"
 wc_magic_flavor_events.0030.shadow_title: "Тьмы"
 wc_magic_flavor_events.0030.order_title: "Тайной магии"
 wc_magic_flavor_events.0030.disorder_title: "Энтропии"
 wc_magic_flavor_events.0030.elemental_fire_title: "Пламени"
 wc_magic_flavor_events.0030.elemental_water_title: "Волн"
 wc_magic_flavor_events.0030.elemental_air_title: "Ветра"
 wc_magic_flavor_events.0030.elemental_earth_title: "Земли"
 wc_magic_flavor_events.0030.title: "Зла"
 wc_magic_flavor_events.0030.desc: "На моём столе лежит толстый том, размещённый точно по центру. Когда я подхожу, "
 wc_magic_flavor_events.0030.death_desc: "я чувствую холод в воздухе и вижу, как из переплёта книги сочится разложение. Когда я перелистываю страницы, моя собственная жизненная сила слабеет, а ноздри наполняет смрад нежити."
 wc_magic_flavor_events.0030.life_desc: "я замечаю исходящее от книги слабое тепло. Когда я торопливо листаю страницы, из них прорастает зелень, а страницы, кажется, пульсируют жизнью."
 wc_magic_flavor_events.0030.light_desc: "мягкий свет озаряет книгу, и из страниц пробивается поток святой энергии."
 wc_magic_flavor_events.0030.shadow_desc: "тёмный туман окутывает книгу, а её страницы заполнены заклинаниями и упоминаниями Древних."
 wc_magic_flavor_events.0030.order_desc: "я замечаю замысловатый узор на обложке, а страницы заполнены тщательно упорядоченными заклинаниями и диаграммами."
 wc_magic_flavor_events.0030.disorder_desc: "меня охватывает чувство тревоги. Книга заставляет мой разум непрестанно метаться, а на страницах виднеются демонические руны и заклинания."
 wc_magic_flavor_events.0030.elemental_fire_desc: "я чувствую исходящий от книги жар, а страницы заполнены сценами из Огненных просторов."
 wc_magic_flavor_events.0030.elemental_water_desc: "я замечаю, что книга влажная, а на её страницах описаны владения Нептулона."
 wc_magic_flavor_events.0030.elemental_air_desc: "прохладный ветерок струится из окна, открывая взору подробности Небесной выси."
 wc_magic_flavor_events.0030.elemental_earth_desc: "я чувствую, как земля подо мной дрожит, словно мне посылают весть из Подземья."
 wc_magic_flavor_events.0030.d_end: "\n\nХотя такая могущественная книга могла бы пригодиться, я знаю, что мне, как [ROOT.Char.GetFaith.GetAdherentNameNoTooltip|U], не пристало владеть такой магией. Однако подобный том не мог появиться здесь по чистой случайности..."

 wc_magic_flavor_events.0030.a: "Пожалуй, я мог бы прочитать эту книгу..."
 wc_magic_flavor_events.0030.b: "Слишком долго я был скован учениями [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|U]!"
 wc_magic_flavor_events.0030.c: "Опасно. Интересно, но опасно."
 wc_magic_flavor_events.0030.d: "Ужасно! Я должен уничтожить её, пока она не развратила меня."

 # Модификаторы
 wc_absorbed_leyline_crystals: "Поглощённые кристаллы лей-линий"
 wc_absorbed_leyline_crystals_desc: "Этот персонаж поглотил несколько кристаллов лей-линий.\n@wc_spell_icon! Длительность [wc_spell|E]: #P +10%#!\n@wc_stat_mana_icon! [wc_available_mana_to_stat|E]: #P +5%#!"

 wc_mining_leyline_crystals: "Добыча кристаллов лей-линий"
