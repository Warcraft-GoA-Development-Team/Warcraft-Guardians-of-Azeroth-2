l_english:
 
 invasionofkalimdor_0002_title: "Exodus of the Horde"
 invasionofkalimdor_0002_desc: "In my restless sleep, I hear voices.\n\n"The sands of time have run out, child of the Frostwolves. The cries of war echo upon the winds. The remnants of the past scar the lands, which is besieged once again by conflict."\n\nI see the Horde, chanting warcries and marching towards conquest. Our wardrums shaking this very land. Our enemy since we have entered this new world stand against us, the humans in their thick shields and armors who we seem to have battled for ages, with both our races blood nourishing the soil time and time again.\n\n"Heroes arise to challenge fate and lead their brethren to battle. As mortal armies rush blindly towards their doom, the Burning Shadow comes to consume us all."\n\nThe sky burns as our races ignorantly clash, first with each other. Beasts arise from the fallen flames which seem lifeless and ready to destroy it all.\n\n"You must rally the Horde and lead your people to their destiny... seek me out.""
 invasionofkalimdor_0002_a: "What kind of nightmare was that?"
