 game_concept_wc_spell_exorcism: "Экзорцизм"
 game_concept_wc_spell_exorcism_desc: "Заставьте злые души трепетать перед Светом, сделав их носителя уязвимым."
 wc_spell_exorcism_type: "[wc_spell_type_attack|E]"
 wc_spell_exorcism_targets: "[character|E]"
 wc_spell_exorcism_effects: "Накладывает штраф ко всем характеристикам. Если культура цели имеет наследие нежити, демонов или Древних богов или же похожие черты, также наносится или усугубляется [wc_injury_burned|E]. Может накапливаться до 3 раз, за исключением штрафа к [wc_magic_resistance|E].\n[wc_spell_rank|E] 2: Экзорцизм теперь может поражать несколько целей."
 wc_learn_spell_exorcism: "Вы изучаете заклинание: [wc_spell_exorcism|E]"
 wc_learn_spell_exorcism_2: "Изучите 2-й [wc_spell_rank|E] заклинания [wc_spell_exorcism|E]"

 game_concept_wc_spell_expulsion: "Изгнание"
