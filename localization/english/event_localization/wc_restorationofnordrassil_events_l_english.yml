l_english:

 restorationofnordassil_0001_title: "Glory Restored"
 restorationofnordassil_0001_desc: "After some patience and having faith in [ROOT.Char.GetFaith.HighGodName], the Well seems to finally have been blessed with enough strength and power of its own that it can heal itself.\n\nWe Night Elves are once again blessed with its powers, although not completely. We will last a few years longer than the mortal races, but it shall be enough for our civilization as a whole."
 restorationofnordassil_0001_a: "Elune be with us all!"
