l_english:
 
 tradition_might_is_right_name:0 "Might is Right"
 tradition_might_is_right_desc:0 "What need is there for diplomacy when we can simply take what is rightfully ours?"

 tradition_longevity_traditions_name:0 "Longevity Traditions"
 tradition_longevity_traditions_desc:0 "This culture has learned (either on its own or from an [wc_elder_race|E]) the secrets of self-preservation passed down by beings who are [wc_long_lived] or have [wc_extreme_longevity]."

 tradition_liberated_undead_name:0 "Liberated Undead"
 tradition_liberated_undead_desc:0 "This culture is comprised mostly of [Glossary('Undead', 'UNDEAD_GLOSS')] individuals who were liberated from the Scourge and bare a burning hatred for their former masters. The prospect of eternal undeath has resulted in a culture where greivances lodge themselves in long memories and the value of life is much diminished."
 UNDEAD_GLOSS: "$trait_being_undead_desc$"
 
 tradition_seducers_name:0 "Seducers"
 tradition_seducers_desc:0 "Seeking carnal pleasure is not only completely natural, but a central part of life. To say otherwise is inconceivable."
 
 tradition_lookism_name:0 "Lookism"
 tradition_lookism_desc:0 "Physical appearance is everything in this culture. High value is placed on superficial beauty and those who do not fit the standards are shunned."
 
