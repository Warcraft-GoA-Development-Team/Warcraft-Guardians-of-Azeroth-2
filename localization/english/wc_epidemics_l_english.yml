l_english:
 epidemic_realm_name_loc: "[ROOT.Epidemic.GetStartingOutbreakProvince.GetCounty.GetTitle.GetHolder.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"

 epidemic_undead_plague: "Plague of Undeath"
 epidemic_undead_scourge: "Scourge of $epidemic_realm_name_loc$"

 trait_undead_plague: "Plague of Undeath"
 trait_undead_plague_desc: "This character is afflicted by the Plague of Undeath, causing their body to deteriorate rapidly with necrotic flesh, uncontrollable coughing, and a deathly pallor."
 trait_undead_plague_character_desc: "[ROOT.GetCharacter.GetFirstNamePossessiveNoTooltip] body is ravaged by the Plague of Undeath, with necrotic flesh, uncontrollable coughing, and a deathly pallor; [ROOT.GetCharacter.GetSheHe] is not long for this world."

 wc_scourge_plague.0001.t: "Elbow Deep"
 wc_scourge_plague.0001.desc: "The cadaver lies on the table, surrounded by various macabre equipment, as well as my physician [physician.GetFirstName], [court_priest.GetFirstName] and myself.\n\n"My [ROOT.Char.GetLadyLord], I fear this is a bad idea. We may gain insight into this plague, but we risk catching it ourselves." said [court_priest.GetFirstNameNoTooltip] while nervously clutches his staff.\n\n"I'm more worried about this poor bastard getting back up..." [physician.GetNamePossessiveNoTooltip] hand wanders to an axe at his belt. "We can dissect him, but we will need to be careful."\n\nBoth healing magic and medicine have failed to cure this plague, but if there's any way to treat it, we must find out, and soon. Better yet, this dissection may even show us how it spreads."
 wc_scourge_plague.0001.a: ""Start the procedure, I will watch over you.""
 wc_scourge_plague.0001.a.tt: "Insights Gained"
 wc_scourge_plague.0001.a.tt.corpse: "The Corpse Attacks!"
 wc_scourge_plague.0001.aa.tt.corpse: "The corpse attacks!"
 wc_scourge_plague.0001.b: ""Just start the dissection.""
 wc_scourge_plague.0001.c: ""Very well, burn the body."
 wc_scourge_plague.0009.t: "A Strange Cargo"
 wc_scourge_plague.0009.desc: "My guards interrupt me during my occupations. They explain that a merchant coming from the infected lands has been stopped at the city gates. [prisoner.GetSheHe|U] appeared nervous, then outright aggressive when they tried to inspect [prisoner.GetHerHis] crates. The moment [prisoner.GetSheHe] drew a weapon to threaten them, my men subdued [prisoner.GetHerHim].\n\nI personally descend to interrogate [prisoner.GetHerHim]. The merchant, huddled in the shadows, slowly lifts [prisoner.GetHerHis] head.\n\n"Mercy, my [ROOT.Char.GetLadyLord]! I swear, I didn’t know what was in those crates! They paid me a fortune to deliver them here and if I refused, they would have killed me!"\n\nThose crates? What is [prisoner.GetSheHe] talking about?"
 wc_scourge_plague.0009.a: "[physician.GetName] must examine this immediatly."
 wc_scourge_plague.0009.a.tt: "$wc_scourge_plague.0001.a.tt$"
 wc_scourge_plague.0009.b: ""You will tell me everything you know.""
 wc_scourge_plague.0009.c: ""Stay here. We will protect you.""

 wc_scourge_plague.1001.t: "Darkening Horizons"
 wc_scourge_plague.1001.desc: "HERE IT COME"
 wc_scourge_plague.1001.a: "Hah! Let them."
 wc_scourge_plague.1001.a.tt: "It's just fables."
 wc_scourge_plague.1001.b: "We need to do something!"
 wc_scourge_plague.1001.b.tt: "Fortify the ramparts, block the passages, and may the [ROOT.Char.GetFaith.PriestNeuterPlural] bless our lands!"
 wc_scourge_plague.1001.c: "#EMP "I looked, and behold, a green horse..."#!"

 wc_scourge_plague.1002.t: "The Scourge of [ROOT.Char.GetTopLiege.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 wc_scourge_plague.1002.desc: "Pestilence stalks the land.\n\nGroans and pleas echo from the once-living victims, whose pitiful calls are drowned out by the sound of their crackling bones and rotting flesh.\n\nThose who once strolled lively in our cities in villages, rise from their resting place, almost unrecognizeable.\n\nPriests and healers have tried to use their magic to prevent such a fate, and many rulers have closed off the land to our people to prevent the spread...\n\nBut the Scourge, the army of the dead is upon us. [ROOT.Char.GetFaith.HighGodName] save us all."
 wc_scourge_plague.1002.a: "May we persevere in these grim times."

 wc_scourge_plague.1004.t:0 "The Generosity of the Elves"
 wc_scourge_plague.1004.desc:0 "The days pass, and bad news regarding the ongoing plague continues to pile up. The undead grow ever more numerous, threatening our lands. My chancellor approaches, bowing before me to inform me of visitors requesting an audience.\n\nI accept the audience with a gesture of my hand, revealing two figures behind him. Two Elves advance respectfully toward me and kneel in a gesture of submission. One of them speaks:\n\n"Greetings. We are priests from Quel'Thalas. My brothers and I have come to help heal the land of this strange curse."\n\nThe generosity and faith of the Elves are worthy of their legendary reputation. What response should I offer them?"
 wc_scourge_plague.1004.a:0 ""Your aid is welcome.""
 wc_scourge_plague.1004.b:0 ""We have no need of your help.""
 wc_scourge_plague.1004.c:0 ""You may stay, but on our terms.""
 wc_scourge_plague_1004_add_courtier_effect.tt:0 "Becomes your [courtier|E] to help you fight the epidemic"
 wc_priests_of_quelthalas_fighting: "Priests of Quel'Thalas"
 wc_priests_of_quelthalas_fighting_desc: "Priests of Quel'Thalas are present at your court to fight the plague."
 wc_scourge_plague.1005.t:0 "The Slow Turn"
 wc_scourge_plague.1005.desc:0 "Some time has passed since my skirmish with the undead. While I was injured, they had told me that my wounds were minor, easily healed.\n\nSomething is wrong.\n\nThe small scar on my arm has turned dark. I can no longer feel the limb. I can barely hear, barely see. My movements are sluggish. I am tired, and hungry.\n\nSo hungry..."
 wc_scourge_plague.1005.a:0 "Must feed..."
 wc_scourge_plague.1006.t:0 "The Body Snatcher"
 wc_scourge_plague.1006.desc:0 "As I head out for a morning stroll, a pestilent stench suddenly assaults my nose. Curious, I approach the nearby cemetery, where the strange and revolting smell seems to be coming from.\n\nWhat I find is utter chaos: every grave has been desecrated, and rotting corpses are scattered everywhere. In the midst of this scene, a figure moves frantically, clawing at the dirt of a grave with greedy talons—a ghoul.\n\nThe creature eventually notices me, pausing for a brief moment as if unsure what to do, before grabbing a few corpses and bolting, like a thief caught red-handed."
 wc_scourge_plague.1006.a:0 "Hey, come back here, you thief!"
 wc_scourge_plague.1006.a_tt:0 "You set off in pursuit of the creature"
 wc_scourge_plague.1006.a.success:0 "You manage to strike down the creature"
 wc_scourge_plague.1006.aa.success:0 "You manage to strike down the creature!"
 wc_scourge_plague.1006.a.failure:0 "You fail to strike down the creature"
 wc_scourge_plague.1006.a.failure.clawed:0 "The creature slashes you with its claws"
 wc_scourge_plague.1006.aa.failure.clawed:0 "$wc_scourge_plague.1006.a.failure.clawed$!"
 wc_scourge_plague.1006.a.failure.die:0 "The creature overwhelms and devours you"
 wc_scourge_plague.1006.a.failure.escape:0 "The creature manages to escape"
 wc_scourge_plague.1006.aa.failure.escape:0 "$wc_scourge_plague.1006.a.failure.escape$!"
 wc_scourge_plague.1006.b:0 "Let’s keep our distance…"
 wc_body_snatcher_ghoul_modifier: "Body Snatcher Ghoul"
 wc_body_snatcher_ghoul_modifier_desc: "A ghoul with unsettling behavior haunts this county. It steals corpses and scatters them haphazardly in its wake, leaving behind a trail of stench and disease."
 wc_scourge_plague.1007.t:0 "Whispers in the Night"
 wc_scourge_plague.1007.desc:0 "The dark days stretch on endlessly, and each morning, the plague gnaws away a little more of our souls. Tonight, I locked myself away in a room and on the other side of the door, my family scratches and bangs, their moans—somewhere between agony and horror—echoing through the night.\n\nIn tears, I begin to pray... To anyone, anything, that could come to our aid.\n\nThen, a voice rises, resonant, emerging from the darkness itself. "I have heard you," it murmurs. "There is another way.""
 wc_scourge_plague.1007.a:0 "BACK, YOU MONSTER!"
 wc_scourge_plague.1007.b:0 "[ROOT.Char.GetFaith.PantheonTerm|U] have abandoned me."