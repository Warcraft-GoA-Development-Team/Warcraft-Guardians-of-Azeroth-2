 #################################
 # Glossary
 #################################
 APOCALYPSE_RENILASH_GLOSS:0 "The Apocalypse, or Renilash in the ancient common tongue, prophesied by Mereldar, refers to the final conflict between the forces of good and evil. This event, seen as an ultimate judgment, will seal the world’s fate, bringing both destruction and renewal."
 WAR_DRAENEI_GLOSS:0 "The War against the Draenei was a catastrophic conflict instigated by Kil’jaeden and carried out by the orc clans under [GetScriptedCharacterByHistoryID( '10014' ).GetFirstName]’s guidance. Deceived into believing the draenei were enemies of their survival, the orcs waged a brutal campaign, massacring countless innocents. This war marked the beginning of the orcs' descent into corruption and the eventual shattering of Draenor."
 NERZHUL_GLOSS:0 "[GetScriptedCharacterByHistoryID( '10014' ).GetFirstName], once the most revered shaman among the orcs and the mentor of [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName], was a spiritual leader who guided his people with wisdom. Deceived by Kil'jaeden, he initiated a bloody war against the draenei, leading to a catastrophic massacre. Upon realizing the demonic betrayal, [GetScriptedCharacterByHistoryID( '10014' ).GetFirstName] sought to defy the Legion, only to be dethroned and replaced by [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName], missing the Horde's grim descent into corruption. Now, [GetScriptedCharacterByHistoryID( '10014' ).GetFirstName] lives in exile, a shadow of his former self, left to dwell on the ashes of Draenor."
 HAND_OF_GULDAN_GLOSS:0 "The Hand of Gul'dan, formerly Mount Cyrukhar, is a colossal fel-tainted volcano in Draenor. Once dormant, [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] gathered his loyal followers at its base for a demonstration of unparalleled power. Using the Cipher of Damnation, he struck down Cyrukh the Firelord, awakening the volcano and unleashing a demonic eruption that scorched the land. This act severed the orcs’ bond with the elemental spirits, leaving Draenor to wither and die. The Hand of Gul'dan now stands as a scar upon the world."
 BLOOD_OF_MANNOROTH_GLOSS:0 "The Blood of Mannoroth, a vile substance, is the very essence of the pit lord [GetScriptedCharacterByHistoryID( 'mannoroth' ).GetFirstName]. When consumed, it grants immense strength and bloodlust but at a terrible cost: eternal servitude to the Burning Legion. It was this cursed blood that [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] used to corrupt the orcs, marking the beginning of their descent into darkness."
 OGRE_BLACKROCK_WAR_GLOSS:0 "The Ogre War was a brutal conflict where the Blackrock Clan, led by [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName] and his second-in-command [GetScriptedCharacterByHistoryID( '10050' ).GetFullName], faced annihilation at the hands of the ogres. Outnumbered, the orcs resorted to ambush tactics and sheer perseverance to overcome their foes. During the war, [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName], haunted by the Doomhammer’s dark prophecy, attempted to return it to the lava where it was forged. The elements, however, rejected his plea. With [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]’s support, [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] reclaimed the weapon and finally achieved total victory against the ogres."
 THRONE_OF_KILJAEDEN_GLOSS:0 "The Throne of Kil'Jaeden was once a sacred mountain of the Bonechewer Clan, located in the Hellfire Peninsula, formerly the Tanaan Jungle. [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] renamed this site when he gathered all the orcish clans here for a dark ritual — drinking the blood of Mannoroth, sealing their pact with the Burning Legion, and forever altering the fate of the orcs."
 JUNGLE_OF_TANAAN_GLOSS:0 "Once a lush and untamed jungle, Tanaan was home to some of the fiercest orc clans. But, as Draenor fell into decline, it withered at an alarming and unexplained pace. Today, it is nothing more than a barren wasteland, now known as the Hellfire Peninsula."
 EYE_RITUAL_GLOSS:0 "When a new chieftain rises, every Bleeding Hollow lord must undergo the dark Eye Ritual. This rite demands they sacrifice one of their eyes in exchange for a prophetic vision of their own death. It is no trivial act: those who dare to perform the ritual emerge forever changed, freed from fear but haunted by the certainty of their fate."
 CHOGALL_FORMATION_GLOSS:0 "The arrogance and thirst for power of Cho and Gall led to their exile from Highmaul, their birthplace. When [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] created the Shadow Council, he took [GetScriptedCharacterByHistoryID( '52000' ).GetFirstName] under his wing, teaching him the demonic arts. Thus, [GetScriptedCharacterByHistoryID( '52000' ).GetFirstName] became one of the first ogre mages bound to the Horde and a devoted servant of the Shadow Council."
 PALE_ORCS_GLOSS:0 "The pale orcs, Void-corrupted outcasts beneath Nagrand, worshipped the Void and its prophecy of the Hour of Twilight — when darkness consumes the cosmos. Once savage and uncontrollable, they embraced [GetScriptedCharacterByHistoryID( '52000' ).GetFirstName] as the herald of their dark gods when he came to annihilate them. He returned to the Horde with these fanatics fully under his control."
 DARK_STAR_GLOSS:0 "The Dark Star, worshipped by the pale orcs as a divine omen, vanished after the assault on Karabor. Called down by their rituals, its shadow engulfed the temple in voidlight, breaking minds and corrupting the land. Its disappearance is seen as a prelude to the Hour of Twilight."
 HOLYOAK_GLOSS:0 "Holyoak is a rare type of wood originating from the [GetTitleByKey('k_stormwind').GetName]. It is known to have existed at some point during the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )] and it was used primarily to build [GetTitleByKey('k_stormwind').GetNameNoTier]'s churches. This sacred wood must be carefully cut and therefore it had to be specially prepared at a human lumber mill before a church could be built."

