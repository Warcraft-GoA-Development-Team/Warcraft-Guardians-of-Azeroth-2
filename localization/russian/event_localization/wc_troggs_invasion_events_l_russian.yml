l_russian:
 trogg_invasion.0001.t: "Гномреган обнаружен"
 trogg_invasion.0001.desc: "Наши разведчики быстро обнаружили источник странных звуков: механические машины, непрерывно работающие в городе Гномреган, столице гномьей страны [GetTitleByKey('k_gnomeregan').GetName]. Их тела выглядят слабыми, так что у нас не должно быть трудностей с их уничтожением."
 trogg_invasion.0001.option: "Раздавим их как букашек!"
 trogg_invasion.0002.t: "Гномреган под атакой!"
 trogg_invasion.0002.desc: "Гномреган подвергся нападению невиданного доселе врага. Загадочные твари вырвались из подземных тоннелей, обойдя нашу оборону. Они крупные и грубые, но грубая сила никогда не превзойдёт гномьего разума."
 trogg_invasion.0002.option: "Готовьте оборону!"
 trogg_invasion.0003.t: "Мы одолели захватчиков"
 trogg_invasion.0003.desc: "После долгой и кровопролитной войны мы сумели одолеть захватчиков, что угрожали самому существованию Гномрегана. Эта победа принесёт нам мир надолго."
 trogg_invasion.0003.option: "Наконец-то, мир."
 trogg_invasion.0004.t: "Предательство Термаплугга"
 trogg_invasion.0004.desc: "План мех-инженера Термаплугга обернулся катастрофой. Почти 80% всего гномьего народа исчезло, а многие из выживших стали прокажёнными. Причиной провала был сам Термаплугг. Он всегда завидовал положению и признанию Верховного Изобретателя Гелбина. Теперь, когда весь Гномреган окутан токсичными газами и радиацией, он объявил себя единоличным правителем Гномрегана."
 trogg_invasion.0004.option: "Не следовало ему доверять"
 trogg_invasion.0004.optionb: "Может, его методы правления лучше..."
 trogg_invasion.0005.t: "Предложение Термаплугга"
 trogg_invasion.0005.desc: "Силы троггов могут оказаться нам не по зубам. К счастью, мех-инженер Термаплугг предложил план, что может стать нашим единственным шансом на выживание. По его словам, следует выпустить радиацию в Гномреган, и заражение сможет справиться с троггами. Это может иметь тяжкие последствия для нас, но это лучше, чем полный разгром."
 trogg_invasion.0005.option: "Это может помочь"
 trogg_invasion.0005.optionb: "Мы не можем ему доверять"
 trogg_invasion.0006.t: "Странный газ в Гномрегане"
 trogg_invasion.0006.desc: "Мы были так близки к разгрому проклятых гномов, и когда мы начали захватывать их столицу, по Гномрегану расползся странный газ. Вместо того чтобы уничтожить нас, большинство наших воинов прошли сквозь клубы, впав в ярость, а некоторые, казалось, даже получили от этого силу. Однако это далось ценой — многие стали неуправляемы, обратившись в неистовую силу, которой нельзя было управлять. Похоже, гномы не ожидали таких последствий, и многие из их собственных защитников тоже погибли в хаосе."
 trogg_invasion.0006.option: "Проклятые гномы и их технологии!"
 trogg_invasion.0007.t: "Гномреган просит о помощи"
 trogg_invasion.0007.desc: "Гномы сильно пострадали от вторжения троггов и его последствий. Даже земли, не захваченные полностью прокажёнными гномами, остаются в очень плохом состоянии. Нас попросили помочь им вернуть окрестности Гномрегана."
 trogg_invasion.0007.option: "Мы должны помочь!"
 trogg_invasion.0007.option.tooltip: "#E Это поможет гномам в восстановлении их страны.#!"
 trogg_invasion.0007.optionb: "Сейчас нам нечего выделить."
 trogg_invasion.0008.t: "Гномреган отвоёван"
 trogg_invasion.0008.desc: "После долгой борьбы мы наконец смогли отбить Гномреган у прокажённых гномов и Сикко. Город в очень плохом состоянии и потребует огромных трудов, чтобы вернуть ему былую славу. Это откроет перед гномами новую эпоху процветания и открытий."
 trogg_invasion.0008.option: "Наконец-то, Гномреган в безопасности."
 trogg_invasion.0009.t: "Судьба предателя"
 trogg_invasion.0009.desc: "После того как мы отбили Гномреган, мы захватили предводителя прокажённых гномов. Он предатель нашего народа, и оставлять его в живых было бы позором для всех гномов. Что нам с ним делать?"
 trogg_invasion.0009.option: "Казнить немедленно!"
 trogg_invasion.0009.optionb: "Следует отпустить его."
 trogg_invasion.0009.optionc: "Пусть гниёт в темнице..."
 trogg_invasion.0010.t: "Восстановительные работы"
 trogg_invasion.0010.desc: "Наша родина всё ещё оправляется от разрушительной утечки радиации. Город Гномреган лежит в руинах, а окрестности остаются заражёнными. Чтобы восстановить порядок, мы должны приложить огромные усилия: отстроить заново, расчистить завалы и провести дезинфекцию."
 trogg_invasion.0010.option: "Расчистить завалы"
 trogg_invasion.0010.optionb: "Начать дезинфекцию"
 trogg_invasion.0010.optionc: "Попросить помощи у Стальгорна"
 trogg_invasion.0010.optionc.tooltip: "#E Стальгорн должен согласиться, чтобы провинция была восстановлена.#!"
 trogg_invasion.0011.t: "Стальгорн соглашается помочь"
 trogg_invasion.0011.desc: "К счастью, Стальгорн согласился помочь нам с восстановлением окрестностей Гномрегана. С их помощью мы можем надеяться вернуть этой земле былую славу."
 trogg_invasion.0011.option: "Хорошо иметь друзей!"
 trogg_invasion.0012.t: "Стальгорн отказывает в помощи"
 trogg_invasion.0012.desc: "К несчастью, Стальгорн отказал нам в помощи с восстановлением окрестностей Гномрегана. Без внешней поддержки восстановление Гномрегана станет куда более тяжёлой задачей."
 trogg_invasion.0012.option: "Это прискорбно."
 trogg_invasion.0013.t: "Сикко Термаплугг бежит из тюрьмы"
 trogg_invasion.0013.desc: "Сикко Термаплугг сумел бежать из нашей тюрьмы. Он воспользовался хаосом, вызванным войной, чтобы вырваться на свободу. Наши простые тюремные камеры оказались неспособны удержать кого-то с его разумом."
 trogg_invasion.0013.option: "Проклятье на его голову!"
