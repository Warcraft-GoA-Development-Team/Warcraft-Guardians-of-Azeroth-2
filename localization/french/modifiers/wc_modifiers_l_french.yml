 last_defender_of_lordaeron:0 "Last Leader of the Silver Hand"
 last_defender_of_lordaeron_desc:0 "By gathering allies and starting a flame within the citizens of Lordaeron, this character has taken the oath to defend the Remnants of the Kingdom to the last man."
 wc_scarlet_crusader:0 "Scarlet Crusader"
 wc_scarlet_crusader_desc:0 "This character has taken an oath to wipe out the presence of the Scourge in Lordaeron and any others who stand in their way."
 wc_scarlet_zealot:0 "Scarlet Extremist"
 wc_scarlet_zealot_desc:0 "Driven either by the pure zeal and dedication to the worship of the Light or driven by mere madness, this character has taken it upon themselves to end the Scourge by going against the Lich King himself."
 wc_building_new_hearthglen:0 "Building the New Capital"
 wc_building_new_hearthglen_desc:0 "Our people work hard and fast to fulfill their task of building our new Base. The New Hearthglen will be the evidence of our glory and our resolve."
 wc_argent_leader:0 "Argent Crusader"
 wc_argent_leader_desc:0 "This character has taken the oath to protect the needy, wage war against the forces of evil and be compassionate to all sentient beings of Azeroth."
 saviour_of_lordaeron:0 "Saviour of Lordaeron"
 saviour_of_lordaeron_desc:0 "This character has wiped out the presence of the Scourge from Lordaeron and has now declared themselves to be the ruler of the new kingdom that has risen from the ashes."
 servant_of_lordaeron:0 "Servant of Lordaeron"
 servant_of_lordaeron_desc:0 "By handing over the newly formed Kingdom of Lordaeron back to the Menethil bloodline, they have proven themselves to be a loyal servent of the House of Menethil."
 warrior_of_lordaeron:0 "Warrior of Lordaeron"
 warrior_of_lordaeron_desc:0 "As a pious servant of the Light, this character has proved themselves to be the most zealous of their faith by handing over the rulership of the new kingdom of Lordaeron to their Head of Faith."
