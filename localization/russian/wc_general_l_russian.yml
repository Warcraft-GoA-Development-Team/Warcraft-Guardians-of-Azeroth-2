 world_weary_perk_name: "Уставший от мира"
 world_weary_perk_effect: "Достигнув преклонного возраста, вы получаете возможность исчезнуть из этого мира вместо того, чтобы совершить самоубийство; это завершит жизнь вашего персонажа и принесёт сниженные штрафы к [piety|E] и [dynasty_prestige|E]."
 world_weary_perk_effect_demon: "Достигнув преклонного возраста, вы получаете возможность исчезнуть из этого мира вместо того, чтобы совершить самоубийство; это завершит жизнь вашего персонажа без каких-либо штрафов."
 world_weary_decision_desc_being_demon: "Я исполнил в этом проклятом мире всё, что велел мне Саргерас. Теперь я должен отойти в [twisting_nether|E], пока его отвратительная вонь не осквернила мою сущность."
 world_weary_decision_desc_being_other: "Я устал от Азерота, от этих людей. Я устал быть пойманным в сети их жизней."
 world_weary_decision_desc_being_undead: "Этот сумрак между жизнью и смертью затянулся слишком надолго. Я устал от гниющего тела, от своей порченной сущности и её мучительных требований."
 world_weary_decision_desc_elder: "Моя жизнь на Азероте была долгой и богатой событиями, но я чувствую, что настал час отдохнуть и оставить этот мир позади... что бы ни думали другие."
 world_weary_fail_elder_undead_tt: "Ваша попытка исчезнуть из этого мира провалилась: придворные поймали вас и отговорили."
 demon_world_weary_decision_effect_tooltip: "Будучи демонической сущностью, вы можете вернуться в Круговерть Пустоты без последствий."
 you_vanish_into_the_twisting_nether.tt: "Вы исчезаете в Круговерти Пустоты"
