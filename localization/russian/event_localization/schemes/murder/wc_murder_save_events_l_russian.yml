l_russian:
 wc_murder_save.0002.t: "$murder_save_header$ Демон"
 wc_murder_save.0002.desc: "Смерть обошла [target.GetTitledFirstName] стороной!\n\nУбийце удалось пробраться в спальню [target.GetTitleTierNamePossessive], но ужасный демон помешал выполнить задание, поразив убийцу!"

 wc_murder_save.1002.desc: "«#bold Что ты скрываешь...?#!» — бормотание призванного мной демона вырывает меня из сна, когда меня уже клонит в дрёму. Не успеваю я потребовать тишины, как Демон выпускает луч магии Скверны в нечто невидимое. Скрытый убийца!\n\nЕсли бы не призванный мной демон, удалось бы мне вовремя заметить невидимого врага?"
