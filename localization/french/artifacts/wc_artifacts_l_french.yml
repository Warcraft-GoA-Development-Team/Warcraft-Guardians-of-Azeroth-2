l_french:
 terenas_crown_name:0 "Couronne de Lordaeron"
 terenas_crown_desc:0 "Une couronne à pointes utilisée pour le couronnement des Hauts-Rois de Lordaeron."
 frostmourne_name:0 "Deuillegivre"
 frostmourne_desc:1 "Un [inventory_artifact|E], une lame runique maudite du [GetTrait('lich_king').GetName( GetNullCharacter )]. La lame emprisonne les âmes, augmentant sa $MOD_PROWESS$ et $MOD_DREAD_BASELINE_ADD$ #weak (jusqu'à 17 $MOD_PROWESS$ et 30 $MOD_DREAD_BASELINE_ADD$)#!.\n#Bold $frostmourne_name$ ne perd pas de [durability|E]. La lame transforme en [GetTrait('being_undead').GetName( GetNullCharacter )] ceux qu'elle a tués au combat. Dans un tel cas, l'âme du tué est pervertie : il obtient des [traits|E] mauvais comme [GetTrait('callous').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], etc.#!"
 gorehowl_name:0 "Hurlesang"
 gorehowl_desc:0 "Une hache massive brandie par Grommash Hurlenfer du clan Chanteguerre. Elle est marquée de façon permanente du sang des ennemis du guerrier tombés au combat. De petits trous et encoches qui parsèment la lame la font « chanter » lorsqu'elle est brandie."
 hammer_of_twilight_name:0 "Marteau du Crépuscule"
 hammer_of_twilight_desc:0 "Forgée d'élémentium, de magie du Vide et de folie, cette arme est un symbole de la malveillance et de la puissance du culte du Marteau du Crépuscule et de leurs maîtres dieux très anciens."
 dark_crystal_name:0 "Cristal noir"
 dark_crystal_desc:0 "La magie du Vide émane de cet étrange cristal, mais quelque part dans ses profondeurs, vous sentez la présence de la Lumière."
 perenolde_tiara_name:0 "Tiare des Perenolde"
 perenolde_tiara_desc:0 "Cette couronne est dans la famille Perenolde depuis des générations et est devenue le symbole de leur règne en Alterac. Bien qu'elle ne soit pas aussi ancienne que le titre qu'elle représente, elle n'en est pas moins estimée comme symbole du droit à régner sur cette terre montagneuse."
 crown_of_the_ogre_king_name:0 "Couronne du roi ogre"
 crown_of_the_ogre_king_desc:0 "Créée pour le roi Gordok des ogres Gordunni de Hache-tripes, cette couronne symbolisait leur règne naissant sur les terres sauvages de Féralas avant que la cour ne sombre dans la folie."
 ### Draeneï
 naaru_staff.name:0 "Bâton du Rédempteur"
 naaru_staff.desc:0 "Un bâton long et mince, façonné de lumière pure, offert par les Naaru à Velen, chef des Draeneï. Il sert de symbole d'espoir et de foi, tout en étant un puissant outil de guidance et de protection."
 
 naaru_hammer.name:0 "Marteau des Naaru"
 naaru_hammer.desc:0 "Un marteau colossal et orné, forgé à partir d'un cristal de puissance de l'Exodar, le vaisseau dimensionnel des Draeneï. C'est une arme de justice et de vengeance, ainsi qu'une source de force et de courage."
 
 maraad_memento.name:0 "Souvenir de Leran"
 maraad_memento.desc:0 "Un diadème brisé et terni ayant appartenu à Leran, la sœur du redresseur de torts Maraad. Elle le portait comme symbole de grâce, jusqu'à ce qu'elle soit violée et tuée par les orcs du clan Vent-de-lames. Maraad l'a pris sur son cadavre en souvenir de sa sœur bien-aimée et a juré de venger sa mort."
 
 ashbringer_name:0 "Porte-cendres"
 ashbringer_desc:0 "Cette épée a été forgée à partir d'un cristal d'énergie de Lumière pure. En combat, lorsqu'on la manie, elle crée autour de l'utilisateur un cyclone de flammes qui n'affecte que les morts-vivants et les brûle d'un feu intense.\n#Bold $ashbringer_name$ ne perd pas de [durability|E]. Les êtres morts-vivants frappés par cette lame au combat ont une chance accrue d'être tués sur-le-champ (l'effet ne fonctionne pas sur les personnages de lore).#!"
 corrupted_ashbringer_name:0 "Porte-cendres corrompue"
 corrupted_ashbringer_desc:0 "Cette épée, forgée à partir d'un cristal d'énergie de Lumière pure, a été corrompue par un acte d'une malveillance impensable. Son aura cruelle et menaçante se répand, lorsqu'on la manie, en un miasme vert-noir qui affaiblit les vivants.\n#Bold $corrupted_ashbringer_name$ ne perd pas de [durability|E]. Les êtres ordinaires frappés par cette lame au combat ont une chance accrue d'être tués sur-le-champ (l'effet ne fonctionne pas sur les personnages de lore).#!"
 
 #Librams
 libram_general_desc:0 "Les librams sont des livres sacrés, de véritables artefacts de la Lumière. Ils confèrent à leur porteur et à ses alliés une puissance immense."
 libram_original_general_desc:0 "Ceci est l'un des cinq librams originaux offerts lors de la fondation de l'Ordre de la Main d'argent, symbolisant l'un des principes fondateurs de l'Ordre. L'Église souhaitait que son porteur devienne l'incarnation de cette vertu."
 
 libram_compassion_name:0 "Libram de compassion"
 libram_compassion_desc:0 "#EMP \"En vérité, je vous le dis, comme Tyr ouvrit ses bras à ceux dans le besoin, nous devons également nous tourner vers eux. Car dans chaque acte de bonté, la Lumière se manifeste, et par la compassion nous sommes tous unis sous le regard bienveillant de la Lumière.\"#! - Le Livre de Mereldar 7:12\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_justice_name:0 "Libram de justice"
 libram_justice_desc:0 "#EMP \"Alors Mereldar s'adressa à la foule : Tyr, par son sacrifice, nous montra le chemin de la vérité et de la justice, et nous enseigna que la force ne réside pas dans le pouvoir, mais dans l'engagement envers ce qui est juste. C'est par la justice que la Lumière affirme Sa souveraineté sur l'univers, et c'est dans le cœur des justes qu'Elle trouve Sa demeure. Souvenez-vous de cela jusqu'à la fin et au-delà.\"#! - Le Livre de Mereldar 17:8-9\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_holiness_name:0 "Libram de sainteté"
 libram_holiness_desc:0 "#EMP \"La Lumière ne favorise pas par le rang ; mais par la solidarité envers la justice, la miséricorde et la répulsion de tout mal. La sainteté, forgée dans la foi et non dans de beaux discours, exige une vigilance constante contre l'obscurité déguisée en vertu. Malheur à ceux qui trompent et se cachent derrière des masques de piété, car leur duplicité ne peut échapper à l'éclat purificateur du jugement divin !\"#! - Le Livre de Mereldar 20:4-5\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_protection_name:0 "Libram de protection"
 libram_protection_desc:0 "#EMP \"Le véritable courage ne réside pas dans la force des armes, mais dans la volonté de se dresser comme un bouclier pour les innocents. Il n'y a pas de plus grand amour que de risquer la mort pour éclairer la vie des autres, de sacrifier sa propre existence pour sauver celle des autres. En mémoire de Tyr, tel est mon commandement ; gardez-le dans vos cœurs pour toujours et à jamais.\"#! - Deuxième Lettre aux Alteracis 2:5-6\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_retribution_name:0 "Libram de rétribution"
 libram_retribution_desc:0 "#EMP \"Alors Mereldar parla aux cœurs assoiffés de justice : la Lumière ne tolère aucune injustice, et Son jugement est aussi pur que la flamme. Quand vous vous dressez contre le mal, faites-le non par haine, mais comme les instruments de Sa volonté pour purifier le monde de ses ténèbres. Chaque acte de rétribution est le miroir de la Lumière, illuminant notre chemin vers la justice.\"#! - Le Livre de Mereldar 6:21-23\n\n$libram_general_desc$ $libram_original_general_desc$"
 
 book_of_medivh_name:0 "Livre de Medivh"
 book_of_medivh_description:0 "Le dernier grimoire survivant écrit par Medivh, le Dernier Gardien de Trisfal. Ce livre est un artefact ancien et puissant qui renferme un vaste savoir arcanique et de sombres secrets. Il est empreint de la prouesse et du pouvoir magiques de Medivh. On dit qu'il a le pouvoir d'altérer la trame de la réalité et de déchaîner une puissance magique inimaginable."
 
 doomhammer_name:0 "Marteau-du-destin"
 doomhammer_desc:0 "Forgé sur Draenor dans un bassin de lave et transmis de génération en génération, ce marteau puissant canalise la force des éléments et est capable d'asséner un coup dévastateur à n'importe quel ennemi."
 
 bloodhoof_runespear_name:0 "Lance runique Sabot-de-sang"
 bloodhoof_runespear_desc:0 "Cette lance fut transmise au fil de nombreuses générations de la lignée Sabot-de-sang. Chaque propriétaire a gravé sa propre histoire majeure sur le fût avant de la transmettre à la génération suivante."
 
 twilight_canticle_name:0 "Cantique du Crépuscule"
 twilight_canticle_desc:0 "#EMP \"Et les cieux brûleront, la terre se brisera, et les fidèles embrasseront le Vide, car l’Heure du Crépuscule est proche.\"#!\n\nCe livre sacré renferme des enseignements interdits sur le Vide et les Dieux très anciens, des vérités trop terribles pour être supportées par un esprit mortel. Ses pages, façonnées à partir de la peau des dévoués, palpitent faiblement, comme si elles étaient vivantes. À chaque page tournée, vous ne pouvez vous défaire de la sensation qu'un regard invisible pèse sur vous..."
 
 arcandor_seed_name:0 "Arcan’dor, don des anciens mages"
 arcandor_seed_desc:0 "Une graine d'Arcan’dor, un don des anciens mages aux Sacrenuit. On dit qu'elle est une source de grand pouvoir et de connaissance, et un symbole du lien des Sacrenuit avec les arcanes."
 
 jaina_mantle_name:0 "Mantelet de la Tissegivre"
 jaina_mantle_desc:0 "Le mantelet distinctif de Jaina Portvaillant, dit Mantelet de la Tissegivre, est un vêtement élégant et redoutable, tissé d'une soie azur enchantée. Le mantelet est orné de motifs givrants complexes qui miroitent d'un éclat magique. D'une incroyable légèreté et très absorbant, il allie parfaitement fonctionnalité et beauté, permettant à Jaina de voyager aisément tout en conservant sa forme parfaite et ses coutures raffinées. Cet artefact offre à Jaina une protection inégalée contre les attaques de givre et renforce ses aptitudes magiques innées. Le Mantelet de la Tissegivre est à la fois un symbole de la maîtrise arcane de Jaina et le témoignage de son engagement indéfectible envers les arts mystiques."
 
 shandris_armor_name:0 "Étreinte de l’Ombre-lune"
 shandris_armor_desc:0 "L’Étreinte de l’Ombre-lune, l'artefact d'armure vénéré de Shandris Pennelune, est un chef‑d'œuvre céleste façonné en étoffe lunaire chatoyante qui reflète les phases de la lune. Orné en son centre d'une pierre de lune rayonnante, le plastron diffuse une aura apaisante, fortifiant Shandris contre les assauts magiques. Les spallières plumeuses, tissées de rémiges de chouette mystique, accroissent son agilité et lui confèrent la précision silencieuse de la nuit dans les forêts. Des runes elfes gravées dans l'armure affinent sa perception, permettant à Shandris d'anticiper et de contrer les mouvements de ses adversaires, faisant de l’Étreinte de l’Ombre-lune le symbole de son esprit indomptable et de sa connexion aux forces mystiques d’Azeroth."
 
 lianne_armor_name:0 "Chutegivre"
 lianne_armor_desc:0 "Portée fièrement par Terenia Menethil, l'armure Chutegivre est un précieux héritage transmis par sa grand-mère, Lianne Menethil. Forgée en acier blanc immaculé et rehaussée de motifs bleus complexes, l'armure symbolise la quête de Terenia pour reconquérir Lordaeron et annonce la chute du roi‑liche.\n\nHéritière d'une longue lignée, l'armure Chutegivre appartint autrefois à Lianne Menethil, qui prophétisa que le givre tomberait. Les motifs céruléens racontent le combat de Terenia pour la rédemption et la libération, tandis que l'emblème de Lordaeron sur le plastron sert de phare d'espoir. Terenia se prépare aux épreuves à venir, accomplissant une prophétie qui marque un tournant majeur sur son chemin de rédemption et d'affranchissement, revêtue de l'armure Chutegivre."
 
