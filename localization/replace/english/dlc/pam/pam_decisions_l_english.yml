 declare_yourself_antipope_decision_caliph: "Challenge the Caliph"
 declare_yourself_antipope_decision_desc: "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] is a distant, unworthy figure, ill-prepared to lead [ROOT.Char.GetFaith.GetName]. For all the learning [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe] claims, [ROOT.Char.GetFaith.GetReligiousHead.GetSheHe] simply doesn't #EMP understand#! many of the subtle truths of [ROOT.Char.GetFaith.GetAdjective] thought.\n\n[ROOT.Char.GetFaith.GetReligiousHead.GetSheHe|U] may not, but #EMP I#! do..."
 declare_yourself_antipope_decision_hof_piety_level_tt: "Your [piety_level|E] is higher than [GetPlayer.GetFaith.GetReligiousHead.GetShortUINamePossessive]"
 declare_yourself_antipope_decision_hof_rival_tt: "You are [rival|E]s with [GetPlayer.GetFaith.GetReligiousHead.GetShortUIName]"
 declare_yourself_antipope_decision_vacate_cardinalate_tt: "You will give up your [cardinalate|E] and your voice in the [college_of_cardinals|E]"
