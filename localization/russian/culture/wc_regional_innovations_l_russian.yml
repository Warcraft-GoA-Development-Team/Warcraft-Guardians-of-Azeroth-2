 innovation_kyparite_sap: "Кипаритовый сок"
 innovation_kyparite_sap_desc: "Кипарит — это жизненная сила Азерота. Он может исцелить наши раны и сделать нас сильнее. Будет очень престижно иметь кипарит в нашем обществе."
  
