 wc_thalassian_flavor_events.0170.t:0 "The Magical Garden"
 wc_thalassian_flavor_events.0170.d:0 "PH"
 wc_thalassian_flavor_events.0170.a:0 "Magnificent. Keep it as it is."
 wc_thalassian_flavor_events.0170.b:0 "This is an obscene waste of magic."
 wc_thalassian_flavor_events.0170.c:0 "Can the magic be made useful?"
 wc_thalassian_flavor_events.0170.d:0 "I know someone who would pay handsomely for these plants."
 
