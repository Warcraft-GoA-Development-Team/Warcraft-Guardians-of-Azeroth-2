l_english:
 wc_magic_flavor_events.0010.t: "A Vial of Azure Promise"
 wc_magic_flavor_events.0010.d: ""My [ROOT.Char.GetLadyLord|U], fortune smiles upon you." A [merchant.GetWomanMan] gestures towards [merchant.GetHerHis] satchel. Vials clink under the hood, and [merchant.GetSheHe] reveals a glass vial swirling with blue liquid.\n\n"I am [merchant.GetFirstNameNoTooltip]. And with me, I carry a potion to replenish your mana, my [ROOT.Char.GetLadyLord|U]. Only sourced from the most powerful ley-infused reagents, one glass and you'll be able to wield your magic once more."\n\nGenuine mana potions are expensive, but this frantic spell casting has caused my mana to run low..."
 wc_magic_flavor_events.0010.a: "Name your price, [merchant.GetFirstNameNoTooltip]."
 wc_magic_flavor_events.0010.a_good: "The potion is potent"
 wc_magic_flavor_events.0010.a_bad: "The potion is effective, but weak"
 wc_magic_flavor_events.0010.a_terrible: "The potion is harmful"
 wc_magic_flavor_events.0010.b: "Let me examine it first."
 wc_magic_flavor_events.0010.b_tt: "You learn about the contents of the vial"
 wc_magic_flavor_events.0010.b_bad: "The vial's contents are unclear"
 wc_magic_flavor_events.0010.c: "Hand it over, or face my wrath."
 wc_magic_flavor_events.0010.c_tt: "You take the potion by force"

 wc_bad_mana_potion_modifier: "Faulty Mana Potion"
 wc_bad_mana_potion_modifier_desc: "This character drank a faulty mana potion...\n[wc_mana_regeneration|E]: @wc_full_mana_icon! #N -10%#!"

 wc_magic_flavor_events.0020.t: "The Leyline's Gifts"
 wc_magic_flavor_events.0020.desc: "While traversing the wilderness of my land, I spot faintly glowing crystals buried in foliage.\n\nThey are warm to the touch, pulsing with magical power from the ley-lines of this region. This can be no mistake, they jut from the ground like shards of frozen sapphire.\n\nSelling them could turn quite a profit, but perhaps more long term excavations could have some benefits as well..."
 wc_magic_flavor_events.0020.a: "Harvest every crystal we can find immediately!"
 wc_magic_flavor_events.0020.b: "Extract them slowly, over time..."
 wc_magic_flavor_events.0020.c: "This is a perfect spot for a magical enclave."
 wc_magic_flavor_events.0020.c_tt: "All characters located here also gain: [GetModifier('wc_studying_leyline_crystals_character').GetNameWithTooltip]"
 wc_magic_flavor_events.0020.d: "All this raw power belongs to me!"

 wc_magic_flavor_events.0030.t: "A Tome of "
 wc_magic_flavor_events.0030.death_title: "Decay"
 wc_magic_flavor_events.0030.life_title: "Renewal"
 wc_magic_flavor_events.0030.light_title: "Radiance"
 wc_magic_flavor_events.0030.shadow_title: "Darkness"
 wc_magic_flavor_events.0030.order_title: "Arcane"
 wc_magic_flavor_events.0030.disorder_title: "Entropy"
 wc_magic_flavor_events.0030.elemental_fire_title: "Flame"
 wc_magic_flavor_events.0030.elemental_water_title: "Waves"
 wc_magic_flavor_events.0030.elemental_air_title: "Wind"
 wc_magic_flavor_events.0030.elemental_earth_title: "Earth"
 wc_magic_flavor_events.0030.desc: "On my desk lies a thick tome, placed perfectly in the center. As I approach, "
 wc_magic_flavor_events.0030.death_desc: "I feel a chill in the air, and I see decay seeping from the book's binding. As I traverse through the pages, my own vitality weakens, and the stench of undeath fills my nostrils."
 wc_magic_flavor_events.0030.life_desc: "I notice a faint warmth emanating from the book. Flora sprouts from the pages as I hurriedly flip through them, and the pages seem to pulse with life."
 wc_magic_flavor_events.0030.light_desc: "a soft light illuminates the book, and a rush of holy energy blooms from the pages."
 wc_magic_flavor_events.0030.shadow_desc: "a dark mist coats the book, and its pages are filled with incantations and references of the Old Ones."
 wc_magic_flavor_events.0030.order_desc: "I notice an intricate pattern on the cover, and the pages are filled with meticulously organized spells and diagrams."
 wc_magic_flavor_events.0030.disorder_desc: "a sense of unease washes over me. The book causes my mind to race incessantly, and the pages show demonic runes and incantations."
 wc_magic_flavor_events.0030.elemental_fire_desc: "I feel a heat radiating from the book, and the pages are filled with scenes from the Firelands."
 wc_magic_flavor_events.0030.elemental_water_desc: "I notice that the book is damp, but the pages outline the realm of Neptulon."
 wc_magic_flavor_events.0030.elemental_air_desc: "a cool breeze flows from the window, revealing details of Skywall."
 wc_magic_flavor_events.0030.elemental_earth_desc: "I feel the ground tremble beneath me, as if I were being sent a message from Deepholm."
 wc_magic_flavor_events.0030.d_end: "\n\nThough such a powerful book could be useful, I know it is not my place as a [ROOT.Char.GetFaith.GetAdherentNameNoTooltip|U] to wield such magic. However, a tome such as this could not have appeared by happenstance..."

 wc_magic_flavor_events.0030.a: "Perhaps I could give this book a reading..."
 wc_magic_flavor_events.0030.b: "I have been confined in teachings of [ROOT.Char.GetFaith.GetAdjectiveNoTooltip|U] for too long!"
 wc_magic_flavor_events.0030.c: "Dangerous. Interesting, but dangerous."
 wc_magic_flavor_events.0030.d: "Terrifying! I must destroy it before it corrupts me."
 
 # Modifiers
 wc_absorbed_leyline_crystals: "Absorbed Leyline Crystals"
 wc_absorbed_leyline_crystals_desc: "This character absorbed some leyline crystals.\n@wc_spell_icon! [wc_spell|E] Duration: #P +10%#!\n@wc_stat_mana_icon! [wc_available_mana_to_stat|E]: #P +5%#!"

 wc_mining_leyline_crystals: "Mining Leyline Crystals"
 wc_mining_leyline_crystals_desc: "This county has a mining operation for leyline crystals.\n[wc_mana_regeneration|E] for everyone in this area: @wc_full_mana_icon!#P +5%#!"

 wc_studying_leyline_crystals: "Studying Leyline Crystals"
 wc_studying_leyline_crystals_desc: "Mages are studying leyline crystals in the area."
 wc_studying_leyline_crystals_character: "$wc_studying_leyline_crystals$"
 wc_studying_leyline_crystals_character_desc: "$wc_studying_leyline_crystals_desc$"
 wc_studying_leyline_crystals_title: "$wc_studying_leyline_crystals$"

 wc_forbidden_magic_faith_death_modifier: "Forbidden Magic: Death"
