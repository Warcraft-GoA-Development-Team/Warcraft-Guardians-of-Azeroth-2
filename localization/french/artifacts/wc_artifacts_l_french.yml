 ### Artefacts FP3
 wc_artifact_ancient_bracelet_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')] Bracelet"
 wc_artifact_ancient_bracelet_description: "Ce bracelet d'une merveilleuse facture viendrait de l'antique culture [newly_created_artifact.Custom('AncientEmpireCultureLoc')]. Bien que son décor d'émail et de pierres semi‑précieuses soit depuis longtemps perdu, l'or a conservé son lustre ainsi qu'un symbole représentant [newly_created_artifact.Custom('AncientEmpireDecorationLoc')]. De tels bracelets étaient des cadeaux d'honneur à la cour [newly_created_artifact.Custom('AncientEmpireCultureLoc')] dans l'Antiquité ; peut‑être fut‑il jadis porté par un sujet de l'empereur [newly_created_artifact.Custom('AncientEmpireCultureLoc')]."
 wc_ancient_drinking_vessel_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')] Vase à boire"
 wc_ancient_drinking_vessel_desc: "Cette coupe ornée porte un motif évoquant le Puits d'Éternité. Elle fut réalisée en des temps oubliés, mais sa beauté ne s'est pas fanée."
 wc_artifact_ancient_sword_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')] Épée"
 wc_artifact_ancient_sword_description: "Dite vestige de la vieille ère [newly_created_artifact.Custom('AncientEmpireCultureLoc')], cette épée $wc_ancient_sword_description_base$, en faisant un spectacle magnifique à contempler. Bien que trop fragile, de nos jours, pour être emportée au combat, elle fut peut‑être jadis brandie par un héros aujourd'hui perdu au temps ?"
 wc_artifact_ancient_replica_sword_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')] Épée de style"
 wc_ancient_sword_description_base: "est ornée d'une image de [newly_created_artifact.Custom('AncientEmpireDecorationLoc')]"
 wc_famed_replica_ancient_sword_description: "Cette épée s'inspire de la vision d'une glorieuse ère révolue, faisant écho au passé héroïque des ancêtres de son artisan. Elle est incrustée des plus fines gemmes et $wc_ancient_sword_description_base$, en faisant un spectacle magnifique à contempler. La brandir donne l'image des rois légendaires d'antan."
 wc_masterwork_replica_ancient_sword_description: "Cette épée vise clairement à imiter les armes d'une époque plus ancienne, faisant écho au passé héroïque des [newly_created_artifact.Custom('AncientEmpireCultureLoc')]. Elle est finement incrustée de pierres précieuses et $wc_ancient_sword_description_base$. Bien qu'elle ne soit qu'un lointain écho du passé, on peut s'imaginer un puissant seigneur d'antan en la brandissant."
 wc_common_replica_ancient_sword_description: "Cette pâle imitation se moque des [newly_created_artifact.Custom('AncientEmpireCultureLoc')], bien qu'elle $wc_ancient_sword_description_base$. Elle est incrustée de pierres bon marché et décorée de motifs grossiers et irréguliers. À la porter au côté, on a l'air d'un sot égaré, désireux de revenir à un temps depuis longtemps révolu."