 #################################
 # Glossary
 #################################
 APOCALYPSE_RENILASH_GLOSS:0 "L'Apocalypse, ou Renilash dans l'ancien langage commun, prophétisée par Mereldar, désigne le conflit final entre les forces du bien et du mal. Cet événement, perçu comme un jugement ultime, scellera le destin du monde, apportant à la fois destruction et renouveau."
 WAR_DRAENEI_GLOSS:0 "La guerre contre les draeneï fut un conflit dévastateur instigué par Kil’jaeden et mené par les orcs sous la guidance de Ner’zhul. Trompés par les démons pour croire que les draeneï menaçaient leur survie, les orcs ont lancé une campagne brutale, massacrant des milliers d’innocents. Cette guerre marqua le début de la descente aux enfers des orcs et conduisit à la destruction de Draenor."
 NERZHUL_GLOSS:0 "Ner’zhul, autrefois le chaman le plus respecté parmi les orcs et mentor de Gul’dan, était un guide spirituel qui dirigea son peuple avec sagesse. Trompé par Kil’jaeden, il initia la sanglante guerre contre les draeneï, conduisant à un massacre atroce. Lorsqu’il comprit qu’il avait été dupé, Ner’zhul tenta de défier la Légion, mais fut écarté et remplacé par Gul’dan, manquant ainsi la descente funeste de la Horde dans la corruption. Aujourd’hui, Ner’zhul vit en exil, n’étant plus que l’ombre de lui-même, condamné à errer parmi les cendres de Draenor."
 HAND_OF_GULDAN_GLOSS:0 "La Main de Gul'dan, autrefois connue sous le nom de mont Cyrukhar, est un volcan colossal gangrené par l’énergie démoniaque sur Draenor. Alors qu’il était endormi, Gul’dan rassembla ses plus fidèles partisans à son pied pour une démonstration de pouvoir sans précédent. À l’aide de la formule de damnation, il terrassa Cyrukh, le Seigneur du Feu, réveillant ainsi le volcan et déclenchant une éruption démoniaque qui ravagea les terres aux alentours. Cet acte brisa le lien entre les orcs et les éléments, condamnant Draenor à mourir. La Main de Gul'dan s'élève désormais comme une cicatrice sur ce monde."
 BLOOD_OF_MANNOROTH_GLOSS:0 "Le Sang de Mannoroth est une substance infâme, l’essence même du Seigneur des abîmes Mannoroth. Lorsqu’il est consommé, il confère une force colossale et une soif de sang inextinguible, mais à un prix terrible : la servitude éternelle envers la Légion ardente. C’est ce sang maudit que Gul’dan utilisa pour corrompre les orcs, précipitant leur descente aux enfers."
 OGRE_BLACKROCK_WAR_GLOSS:0 "La guerre des ogres fut un conflit brutal où le clan Rochenoire, mené par Main-Noire et son second Orgrim Marteau-du-Destin, faillit être anéanti par plusieurs clans ogres. En sous-nombre, les orcs adoptèrent des tactiques de guérilla et firent preuve d’une persévérance inébranlable pour vaincre leurs ennemis. Durant la guerre, Orgrim, hanté par la sombre prophétie de son marteau, tenta de le rendre à la lave où il avait été forgé. Les éléments, cependant, rejetèrent sa requête. Avec le soutien de Main-Noire, Orgrim reprit le marteau et remporta une victoire décisive contre les ogres."
 THRONE_OF_KILJAEDEN_GLOSS:0 "Le Trône de Kil'jaeden, autrefois une montagne sacrée du clan Mâche-les-Os, se dresse dans la péninsule des Flammes infernales, autrefois la jungle de Tanaan. Gul’dan renomma ce lieu lorsqu’il rassembla tous les clans pour un sombre rituel : la consommation du Sang de Mannoroth, scellant leur pacte avec la Légion ardente et changeant à jamais le destin des orcs."
 JUNGLE_OF_TANAAN_GLOSS:0 "Autrefois une jungle luxuriante et indomptée, Tanaan abritait certains des clans orcs les plus féroces. Mais, alors que Draenor sombrait dans le déclin, la jungle s’assécha à un rythme alarmant et inexpliqué. Aujourd’hui, elle n’est plus qu’un désert aride, désormais connu sous le nom de péninsule des Flammes infernales."
 EYE_RITUAL_GLOSS:0 "Quand il arrive au pouvoir, chaque seigneur de l’Orbite-Sanglante doit accomplir le sombre rituel de l’œil. Ce rituel exige de sacrifier un œil en échange d’une vision de leur propre mort. Ce n’est pas un acte à prendre à la légère : ceux qui osent réaliser ce rituel en ressortent à jamais transformés, libérés de la peur mais hantés par la certitude de leur destin inéluctable."
 CHOGALL_FORMATION_GLOSS:0 "L'arrogance et la soif de pouvoir de Cho et Gall les ont conduits à être bannis de Cognefort, leur cité natale. Lorsque Gul'dan créa le Conseil des Ombres, il prit Cho'gall sous son aile et leur enseigna les arts démonistes. Ainsi, Cho'gall devint l'un des premiers ogre-mages soumis à la Horde et un serviteur dévoué du Conseil des Ombres."
 PALE_ORCS_GLOSS:0 "Les orcs pâles, des parias corrompus par le Vide vivant sous Nagrand, vénèrent le Vide et sa prophétie de l’Heure du Crépuscule : le moment où les ténèbres consumeront l’ensemble du cosmos. Autrefois sauvages et incontrôlables, ils acceptèrent Cho’gall comme le héraut de leurs sombres dieux lorsqu’il vint les anéantir. Il retourna vers la Horde avec ces fanatiques totalement sous son contrôle."
 DARK_STAR_GLOSS:0 "L'Étoile noire, vénérée par les orcs pâles comme un signe divin, disparut totalement après la chute de Karabor. Invoquée lors de rituels, son ombre engloutit le temple sous ses ténèbres, brisant les esprits et corrompant les terres environnantes. Sa disparition est perçue comme un prélude à l’Heure du Crépuscule."
 HOLYOAK_GLOSS:0 "Le sacrebois est un type de bois rare originaire du royaume de Hurlevent. Connu pour avoir existé à l’époque de la Première Guerre, il était principalement utilisé pour la construction des églises. Ce bois sacré devait être soigneusement taillé et préparé dans une scierie humaine avant de pouvoir servir à l’édification d’une église."

