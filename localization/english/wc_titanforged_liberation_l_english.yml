  cede_liberated_duchy_decision:0 "Cede the Liberated Duchy"
  cede_liberated_duchy_decision.desc:0 "The land has recovered under its own strength, its control and prosperity restored. As is the way of Order, it is time to decide its future — full freedom, continued protection, or a place within your own realm."
  cede_liberated_duchy_decision.tt:0 "Choose how to hand the recovered duchy back to its people."
  cede_liberated_duchy_decision_confirm:0 "Decide the duchy's fate"

  wc_titanforged_liberation.0002.title:0 "The Duchy Has Recovered"
  wc_titanforged_liberation.0002.desc:0 "The duchy has recovered enough to stand on its own. It is time to decide its fate."
  wc_titanforged_liberation.0002.a:0 "I grant this duchy full independence, under a ruler of its own people."
  wc_titanforged_liberation.0002.b:0 "I set this duchy free as a protectorate under my watch, for now."
  wc_titanforged_liberation.0002.c:0 "I retain this duchy myself, as ordinary land of my realm."

  task_reorder_county:0 "Reorder County"
  task_reorder_county_desc:0 "#S At #V 100%#!#!:\n$TAB$The [county|E] will be restored to its original [culture|E] and [faith|E], where known\n$TAB$The county's [development|E] will be reduced to 0\n$TAB$The county will gain faster [county_control|E] growth for #V 5#! years\n$TAB$The county will be permanently marked as Reordered"

  council_task_reorder_purification:0 "\n$EFFECT_LIST_BULLET$#N A Rite of Purification#!"
  council_task_reorder_arcane_insight:0 "\n$EFFECT_LIST_BULLET$#N Arcane Insight Recovered#!"

  wc_titanforged_ongoing_reordering_county_modifier:0 "Being Reordered"
  wc_titanforged_ongoing_reordering_county_modifier_desc:0 "The Marshal is working to drive out this county's corruption and restore its original people."
  wc_titanforged_reordered_county_modifier:0 "Reordered"
  wc_titanforged_reordered_county_modifier_desc:0 "This county has been restored to Order."
  wc_titanforged_reordered_county_control_growth_modifier:0 "Order Reestablished"
  wc_titanforged_reordered_county_control_growth_modifier_desc:0 "The Marshal's administration still oversees this county's recovery, speeding the return of control."

  WC_TITANFORGED_REORDER_BASE:0 "Base Progress"
  WC_TITANFORGED_REORDER_SKILL_BONUS:0 "Marshal's Martial Skill"
  WC_TITANFORGED_REORDER_FRIEND_BONUS:0 "Marshal is your Friend"
  WC_TITANFORGED_REORDER_BEST_FRIEND_BONUS:0 "Marshal is your Best Friend"
  WC_TITANFORGED_REORDER_RIVAL_BONUS:0 "Marshal is your Rival"
  WC_TITANFORGED_REORDER_NEMESIS_BONUS:0 "Marshal is your Nemesis"
  WC_TITANFORGED_REORDER_SAME_CULTURE_BONUS:0 "County shares your Culture"
  WC_TITANFORGED_REORDER_SAME_FAITH_BONUS:0 "County shares your Faith"
  WC_TITANFORGED_REORDER_DEVELOPMENT_PENALTY:0 "County's Development"
  WC_TITANFORGED_REORDER_UNRAISED_ARMY_BONUS:0 "Armies at Peace"

  wc_titanforged_reorder_task.0001.title:0 "The County is Reordered"
  wc_titanforged_reorder_task.0001.desc:0 "With the corrupted faith driven out, the county's original people and traditions have begun to return. True restoration will take more than this alone — but the work here is done."
  wc_titanforged_reorder_task.0001.a:0 "The work continues elsewhere."
  wc_titanforged_reorder_task.0001.effects_tt:0 "#S Effects#!#!:\n$TAB$The [county|E] was restored to its original [culture|E] and [faith|E], where known\n$TAB$The county's [development|E] was reduced to 0\n$TAB$The county gained faster [county_control|E] growth for #V 5#! years\n$TAB$The county is now permanently marked as Reordered"

  wc_titanforged_reorder_task.0101.title:0 "A Rite of Purification"
  wc_titanforged_reorder_task.0101.desc:0 "The Marshal, overseeing the reordering, presides over a small rite among the county's people — a gesture of order and continuity amid the change."
  wc_titanforged_reorder_task.0101.a:0 "Let it be done."

  wc_titanforged_reorder_task.0102.title:0 "Arcane Insight Recovered"
  wc_titanforged_reorder_task.0102.desc:0 "Among the county's ruins, the Marshal's retinue recovers a fragment of arcane knowledge — a minor thing, but Order does not let such things go to waste."
  wc_titanforged_reorder_task.0102.a:0 "See it catalogued."
