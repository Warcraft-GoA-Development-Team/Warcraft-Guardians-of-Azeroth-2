l_russian:
 terenas_crown_name: "Корона Лордерона"
 terenas_crown_desc: "Корона с зубцами, которой короновали Верховных королей Лордерона."
 frostmourne_name: "Ледяная Скорбь"
 frostmourne_desc: "[inventory_artifact|E], проклятый рунический клинок, хозяином которого является [GetTrait('lich_king').GetName( GetNullCharacter )]. Клинок пленяет души убитых, увеличивая свою $MOD_PROWESS$ и $MOD_DREAD_BASELINE_ADD$ #weak (до 17 $MOD_PROWESS$ и 30 $MOD_DREAD_BASELINE_ADD$)#!. $frostmourne_name$ не теряет [durability|El]. Владелец клинка превращает убитых в [GetTrait('being_undead').GetName( GetNullCharacter )]. В таком случае, души убитых будут расколоты: они получат злые [traits|El], например такие, как [GetTrait('callous').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )] и т.д."
 gorehowl_name: "Кровавый вой"
 gorehowl_desc: "Огромный топор, принадлежащий Громмашу Адскому Крику из клана Песни Войны. Топор постоянно покрыт кровью павших врагов его могучего владельца. Небольшие выемки и насечки, которыми усеяно лезвие, заставляют его «петь» при взмахе."
  
 hammer_of_twilight_name: "Молот Сумерек"
 hammer_of_twilight_desc: "Выкованное из элементиевой руды, магии Бездны и безумия, это оружие является символом злобы и силы культа Сумеречного Молота и их повелителей - Древних Богов."
  
 dark_crystal_name: "Тёмный кристалл"
 dark_crystal_desc: "Этот странный кристалл источает магию Бездны, но внутри него можно ощутить сокрытое присутствие Света."
  
 perenolde_tiara_name: "Тиара Перенольдов"
 perenolde_tiara_desc: "Эта тиара принадлежала роду Перенольдов на протяжении многих поколений и стала символом их власти в Альтераке. Хотя она и не столь древняя, как титул, который олицетворяет, её значение как знака законного правления над этими горными землями нисколько не умаляется."
  
 crown_of_the_ogre_king_name: "Корона короля огров"
 crown_of_the_ogre_king_desc: "Созданная для короля Гордока из огров Гордунни из Забытого Города, эта корона символизировала зарождающееся господство огров над дикими землями Фераласа, пока их двор не пал в безумие."
  
  ### Draenei 
 naaru_staff.name: "Посох Искупителя"
 naaru_staff.desc: "Длинный и тонкий посох, созданный из чистого света, подаренный наару Велену, лидеру дренеев. Он служит символом надежды и веры, а также является мощным инструментом руководства и защиты."
  
 naaru_hammer.name: "Молот наару"
 naaru_hammer.desc: "Колоссальный витиеватый молот, выкованный из энергетического кристалла Экзодара, межпространственного корабля дренеев. Это оружие правосудия и мести, а также источник силы и мужества."
  
 maraad_memento.name: "Память Леран"
 maraad_memento.desc: "Сломанная и потускневшая диадема, когда-то принадлежавшая Леран, сестре Воздаятеля Мараада. Она носила её как символ благородства, пока ее не похитили и не убили орки из клана Вихря Клинков. Мараад забрал её с тела сестры в память о ней и поклялся отомстить за её смерть."
  
 ashbringer_name: "Испепелитель"
 ashbringer_desc: "Этот меч выкован из кристалла чистой энергии Света. В бою он вздымает вокруг владыки вихрь пламени, поражающий лишь нежить и сжигающий её нестерпимым огнём.\n#Bold $ashbringer_name$ не теряет [durability|E]. Нежить, поражённая этим клинком в бою, имеет повышенный шанс быть мгновенно уничтоженной (эффект не действует на лорных персонажей).#!"
 corrupted_ashbringer_name: "Осквернённый Испепелитель"
 corrupted_ashbringer_desc: "Этот меч был выкован из кристалла чистой энергии Света, но был осквернён актом немыслимой жестокости. Его зловещая аура расползается зелёно-чёрной миазмой при взмахе, изнуряя живых.\n#Bold $corrupted_ashbringer_name$ не теряет [durability|E]. Существа, не обладающие магической природой, поражённые этим клинком в бою, имеют повышенный шанс быть мгновенно уничтоженными (эффект не действует на лорных персонажей).#!"
  
  #Librams 
 libram_general_desc: "Манускрипты - это священные книги, сакральные артефакты Света. Они служат для того, чтобы значительно усилить своего владельца и его союзников."
 libram_original_general_desc: "Это один из пяти оригинальных манускриптов, дарованных при основании Ордена Серебряной Длани, символизирующий один из основополагающих принципов Ордена. Церковь пожелала, чтобы ее носитель стал воплощением этой добродетели."
  
 libram_compassion_name: "Манускрипт сострадания"
 libram_compassion_desc: "#EMP «Истинно говорю вам: как Тир раскрыл свои объятия для тех, кто попал в беду, так и мы должны обращаться к тем, кто в беде. Ибо в каждом добром деянии сияет Свет, и через сострадание мы все объединяемся под благосклонным взором Света».#! - Книга Мерельдар 7:12\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_justice_name: "Манускрипт справедливости"
 libram_justice_desc: "#EMP «Затем Мерельдар обратилась к толпе: Тир своей жертвой указал путь истины и справедливости и научил нас, что сила не во власти, а в приверженности справедливости. Именно через справедливость Свет утверждает свою власть над вселенной, и именно в сердцах справедливых он находит свой дом. Помните об этом до конца жизни и после нее».#! - Книга Мерельдар 17:8-9\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_holiness_name: "Манускрипт святости"
 libram_holiness_desc: "#EMP «Свет благоволит не по положению, а по единству в справедливости, милосердии и отвращении зла. Святость, выкованная в вере, а не в сладких словах, требует постоянной бдительности против тьмы, маскирующейся под добродетель. Горе тем, кто обманывает и прячется за масками благочестия, ибо их двуличность не может избежать очищающего сияния божественного правосудия!»#! - Книга Мерельдар 20:4-5\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_protection_name: "Манускрипт защиты"
 libram_protection_desc: "#EMP «Истинное мужество заключается не в силе оружия, а в готовности встать щитом на защиту невинных. Нет большей любви, чем рискнуть смертью ради света других, пожертвовать своей жизнью ради спасения других. В память о Тире вот моя заповедь; храните ее в сердцах ваших во веки веков».#! - Второе письмо альтеракцам 2:5-6\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_retribution_name: "Манускрипт воздаяния"
 libram_retribution_desc: "#EMP «Тогда Мерельдар обратилась к сердцам, жаждущим справедливости: Свет не терпит несправедливости, и правосудие Его чисто, как пламя. Когда вы выступаете против зла, делайте это не из ненависти, а как орудия его воли, чтобы очистить мир от тьмы. Каждый акт воздания - это зеркало Света, освещающее наш путь к справедливости».#! - Книга Мерельдар 6:21-23\n\n$libram_general_desc$ $libram_original_general_desc$"
  
 book_of_medivh_name: "Книга Медива"
 book_of_medivh_description: "Последняя сохранившаяся книга заклинаний, написанная Медивом, последним Хранителем Тирисфаля. Эта книга - могущественный и древний артефакт, содержащий обширные магические знания и тёмные секреты. Она пропитана магическим мастерством и силой Медива. По слухам, она способна изменять ткань реальности и овладевать невообразимой магической силой."
  
 doomhammer_name: "Роковой Молот"
 doomhammer_desc: "Выкованный на Дреноре в лавовом кратере и передаваемый из поколения в поколение, этот могучий молот заключает в себе силу стихий и способен сокрушить любого врага одним ударом."
  
 bloodhoof_runespear_name: "Руническое копьё Кровавого Копыта"
 bloodhoof_runespear_desc: "Это копьё передавалось по наследству через многие поколения рода Кровавого Копыта. Каждый владелец вырезал на древке свою историю, прежде чем передать его следующему поколению."
  
 twilight_canticle_name: "Сумеречный гимн"
 twilight_canticle_desc: "#EMP «И воспылают небеса, и содрогнётся земля, и верные обретут бездну, ибо Час Сумерек близок».#!\n\nЭта священная книга хранит запретные учения Бездны и Древних Богов — истины, слишком ужасные для смертного разума. Её страницы, сотканные из кожи верных, пульсируют, словно живые. Листая их, вы не можете избавиться от ощущения, что за вами наблюдают невидимые глаза…"
  
 arcandor_seed_name: "Аркан’дор — Дар древних магов"
 arcandor_seed_desc: "Семя Аркан’дора, дар древних магов ночнорождённым. Говорят, оно является источником великой силы и знаний, а также символом связи ночнорождённых с тайной магией."
  
 jaina_mantle_name: "Мантия Ткачихи Холода"
 jaina_mantle_desc: "Знаменитая мантия Джайны Праудмур, известная как Мантия Ткачихи Холода, — изящное и грозное одеяние из зачарованного лазурного шёлка. Украшенная сложными узорами инея, мерцающими магическим светом, она прекрасно сочетает красоту и практичность. Лёгкая и удобная, мантия обеспечивает Джайне непревзойдённую защиту от атак льдом и усиливает её врождённые магические способности. Она является не только символом мастерства Джайны в магии, но и свидетельством её непоколебимой преданности искусству чародейства."
 shandris_armor_name: "Объятия Лунной Тени"
 shandris_armor_desc: "«Объятия Лунной Тени» — легендарные доспехи Шандрис Перперой. Этот небесный шедевр соткан из сияющей лунной ткани, отражающей фазы луны. Нагрудник, украшенный лунным камнем, излучает умиротворяющую ауру и укрепляет Шандрис против магических атак. Пернатые наплечники, сотканные из мистического пуха совы, даруют ей ловкость и бесшумную точность ночи. Руны, выгравированные на броне, усиливают её чуткость, позволяя предугадывать движения врага. «Объятия Лунной Тени» стали символом несгибаемого духа Шандрис и её связи с мистическими силами Азерота."
 lianne_armor_name: "Падение Мороза"
 lianne_armor_desc: "С гордостью носимая Тереней Менетил, броня «Падение Мороза» — ценная реликвия, переданная ей от бабушки, Лианны Менетил. Созданная из чистейшей белой стали с замысловатыми синими узорами, она символизирует стремление Терении вернуть Лордерон и предвещает падение Короля-Лича.\n\nБроня «Падение Мороза» принадлежала Лианне Менетил, которая предсказала, что «мороз падёт». Голубые узоры рассказывают о борьбе Терении за искупление и освобождение, а символ Лордерона на груди служит маяком надежды. Терения готовится к грядущим испытаниям, исполняя пророчество и открывая новую главу своей истории, облечённая в броню «Падение Мороза»."
  
