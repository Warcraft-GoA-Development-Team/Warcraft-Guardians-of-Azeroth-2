l_russian:
 game_concept_wc_mana: "Мана"
 game_concept_wc_mana_desc: "Мана — ресурс, отражающий способность персонажа изменять реальность по своей воле. Её можно тратить на различные [wc_spells|E] и получать за счёт [wc_mana_restoration|E]."
 game_concept_wc_full_mana_icon_gc: "@wc_full_mana_icon!"
 game_concept_wc_half_mana_icon_gc: "@wc_half_mana_icon!"
 game_concept_wc_empty_mana_icon_gc: "@wc_empty_mana_icon!"
 game_concept_wc_available_mana_to_stat: "Проводимость маны"
 game_concept_wc_available_mana_to_stat_desc: "Иногда вопрос не в том, #Italic на что потратить?#!, а в том, #Italic тратить или нет?#!\n$game_concept_wc_available_mana_to_stat$ отражает способность [character_possessive|E] применять свою магию в [battle|E].\nПо умолчанию, без прочих модификаторов, влияющих на $game_concept_wc_available_mana_to_stat$, [character|E] получает [EmptyScope.ScriptValue('wc_current_mana_to_prowess_base_percent')|V0%] своей [wc_mana|E] (с округлением вниз) как [prowess|E].\n\n#weak Например, если у [character|E] есть #z 18#! доступной [wc_mana|E] и #z 10%#! $game_concept_wc_available_mana_to_stat$ в [prowess|E], он получит #z 1#! (#z 1.8#! с округлением вниз) [prowess|E].#!"
 game_concept_wc_stat_mana_icon_gc: "@wc_stat_mana_icon!"
 game_concept_wc_mana_restoration: "Восстановление маны"
 game_concept_wc_mana_regeneration: "Регенерация маны"
 game_concept_wc_mana_regeneration_from_max: "Восполнение маны"
 game_concept_wc_mana_restoration_desc: "[character|E] восстанавливает [wc_mana|E] ежемесячно.\n$game_concept_wc_mana_regeneration_from_max$ влияет на ежемесячное $game_concept_wc_mana_restoration$ в зависимости от [wc_max_mana|E] [character_possessive|E]. По умолчанию $game_concept_wc_mana_regeneration_from_max$ [character_possessive|E] составляет [EmptyScope.ScriptValue('wc_mana_replenishment_base_value')|V0%] от его [wc_max_mana|E].\n$game_concept_wc_mana_regeneration$ влияет на общее ежемесячное $game_concept_wc_mana_restoration$ [character|E].\n\n#weak Например, если [character|E] с #z 50#! [wc_max_mana|E] и #z 3%#! $game_concept_wc_mana_regeneration_from_max$ увеличит своё $game_concept_wc_mana_regeneration_from_max$ на #z 2%#!, его ежемесячное $game_concept_wc_mana_restoration$ возрастёт с #z 1.5#! до #z 2.5#! (с #z 3%#! до #z 5%#! его [wc_max_mana|E]).\nЕсли [character|E] с ежемесячным $game_concept_wc_mana_restoration$ в #z 5#! получит бонус $game_concept_wc_mana_regeneration$ в #z 10%#!, его ежемесячное $game_concept_wc_mana_restoration$ составит #z 5.5%#!.#!"
 game_concept_wc_max_mana: "Запас маны"
 game_concept_wc_max_mana_desc: "$game_concept_wc_max_mana$ — максимальное количество маны, которое может иметь [character|E]. Оно увеличивается [perks|E] в [wc_magic_lifestyles|E] — но только если [character|E] уже получил [trait|E] за [perks|E] в этом [wc_magic_lifestyle|E]."

 game_concept_wc_spells: "Заклинания"

 game_concept_wc_spell: "Заклинание"
 game_concept_wc_spell_icon_gc: "@wc_spell_icon!"
 game_concept_wc_spells_desc: "На Азероте отдельные личности способны повелевать древними и таинственными силами [wc_cosmos|E] и [wc_elements|E]. Эти силы проявляются в определённых регулярных и управляемых формах, называемых «заклинаниями». С опытом личности, имеющие время и способности, могут изучить эти заклинания и использовать эту силу, чтобы влиять на мир вокруг — помогая и вредя другим и себе."

 game_concept_wc_spell_rank: "Уровень эффекта"
 game_concept_wc_spell_rank_desc: "[wc_spells|E] построены по формулам и могут усиливаться или ослабляться в зависимости от желаемого эффекта и доступных ресурсов. Эта способность менять силу заклинания и даёт ему «Уровень эффекта»."

 game_concept_wc_spell_channeling: "Каналирование заклинаний"
 game_concept_wc_spell_channel: "Канал"
 game_concept_wc_spell_channeled: "Каналируемое"
 game_concept_wc_spell_channeling_desc: "Непрерывное сотворение [wc_spell|E] называется «каналированием». Оно позволяет сотворённому заклинанию непрерывно проявлять свои эффекты ценой общего ежемесячного восстановления маны. "

 game_concept_wc_spell_type: "Тип заклинания"
 game_concept_wc_spell_type_desc: "Каждое заклинание действует по-своему, но их можно обобщить до определённых типов. $wc_spell_type$ помогает понять суть заклинания."
 game_concept_wc_spell_type_enchantment: "Чары"
 game_concept_wc_spell_type_enchantment_desc: "Заклинание-чары — это [wc_spell|E], усиливающее характеристики, эффективность магии и прочие свойства персонажа. Оно может быть положительным или отрицательным и обычно означает получение [modifier|E]"

 game_concept_wc_spell_type_attack: "Атака"
 game_concept_wc_spell_type_attack_desc: "Атакующее [wc_spell|E] — это заклинание, напрямую вредящее врагам: оно налагает негативный [modifier|E], [trait|E] или вредит одному из их [knights|E] или [skills|E]."

 game_concept_wc_spell_type_defend: "Защита"
 game_concept_wc_spell_type_defend_desc: "Защитное $wc_spell_type_defend_desc$ [wc_spell|E] обычно напрямую противодействует атакующему заклинанию [wc_spell_type_attack|E] — либо заранее, либо после того, как атака уже запущена."
 
 game_concept_wc_spell_type_heal: "Исцеление"
 game_concept_wc_spell_type_heal_desc: "$game_concept_wc_spell_type_heal$ — [wc_spell|E], которое восстанавливает [health|E] [character|E] или иным образом излечивает его от недугов."

 game_concept_wc_spell_type_dispel: "Рассеивание"
 game_concept_wc_spell_type_dispel_desc: "[wc_spell|E] типа $game_concept_wc_spell_type_dispel$ — разновидность исцеляющего заклинания, которое излечивает или снижает тяжесть определённых недугов. Некоторые рассеивания могут излечивать лишь соответствующие недуги. Эти недуги делятся на определённые категории:\n\n$BULLET$[wc_magic_illness|E]\n$BULLET$[wc_major_illness|E]\n$BULLET$[wc_magic_injury|E]\n$BULLET$[wc_illness|E]\n$BULLET$[wc_major_injury|E]\n$BULLET$[wc_injury|E]\n$BULLET$[wc_poison|E]\n$BULLET$[wc_psych_illness|E]"
 wc_dispel_no_effect_tooltip: "Из-за текущего [wc_spell_rank|E] или возможностей [wc_spell|E] оно не действует на цель."

 game_concept_wc_magic_illness: "Магическая болезнь"
 game_concept_wc_magic_illness_desc: "Магическая болезнь — это недуг, сотворённый магом или вызванный применением [wc_spell|E]. Примеры таких болезней:\n$BULLET$[GetTrait('void_sickness').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('blood_plague').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('frost_fever').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('crypt_fever').GetName(GetNullCharacter)]"

 game_concept_wc_major_illness: "Изнуряющая болезнь"
 game_concept_wc_major_illness_desc: "Серьёзная, или изнуряющая, болезнь — это недуг, обычно распространяемый через [plague|E] или считающийся крайне опасным для жизни персонажа. Примеры таких болезней:\n$BULLET$[GetTrait('leper').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('cancer').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('typhus').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('measles').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('pneumonic').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('bubonic_plague').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('smallpox').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('dysentery').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('ergotism').GetName(GetNullCharacter)]"

 game_concept_wc_magic_injury: "Магическая травма"
 game_concept_wc_magic_injury_desc: "Магическая травма — это травма, нанесённая магом или вызванная применением [wc_spell|E]. Примеры таких травм:\n$BULLET$[wc_injury_burned|E]\n$BULLET$[wc_injury_frostbite|E]\n$BULLET$[GetTrait('holy_wrath').GetName(GetNullCharacter)]"

 game_concept_wc_curse: "Проклятие"
 game_concept_wc_curse_desc: "Проклятие — это негативный эффект, наложенный на персонажа магом или применением [wc_spell|E]. Проклятия могут иметь разные вредоносные последствия для цели — от мелких неудобств до тяжёлых недугов. В отличие от [wc_magic_illness|E], проклятие не отнимает [health|E], но его можно лечить и рассеивать."
 
 game_concept_wc_illness: "Болезнь"
 game_concept_wc_illnesses: "Болезни"
 game_concept_wc_illness_desc: "Болезнь [illness|E] меньшей тяжести по сравнению с [wc_major_illness|E]. Примеры таких болезней:\n$BULLET$[GetTrait('lovers_pox').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('gout_ridden').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('consumption').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('sickly').GetName(GetNullCharacter)]"

 game_concept_wc_major_injury: "Серьёзная травма"
 game_concept_wc_major_injury_desc: "Серьёзная травма — это травма, которая, скорее всего, убьёт персонажа или приведёт к необратимым последствиям. Примеры таких травм:\n$BULLET$[GetTrait('one_eyed').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('one_legged').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('disfigured').GetName(GetNullCharacter)]"

 game_concept_wc_injury: "Травма"
 game_concept_wc_injury_desc: "Травма меньшей тяжести по сравнению с [wc_major_injury|E]. Примеры таких травм:\n$BULLET$[GetTrait('wounded_1').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('maimed').GetName(GetNullCharacter)]"

 game_concept_wc_poison: "Яд"
 game_concept_wc_poison_desc: "Яд — это вещество, отравляющее организм персонажа. Каждый месяц яд снижает здоровье персонажа. Примеры таких ядов:\n$BULLET$[GetTrait('raked').GetName(GetNullCharacter)]"

 game_concept_wc_psych_illness: "Психологическое расстройство"
 game_concept_wc_psych_illness_desc: "Психологическое расстройство — это недуг, поражающий разум персонажа. Примеры таких расстройств:\n$BULLET$[GetTrait('depressed_1').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('possessed_1').GetName(GetNullCharacter)]\n$BULLET$[GetTrait('lunatic_1').GetName(GetNullCharacter)]"

 game_concept_wc_spell_schools: "Школы заклинаний"
 game_concept_wc_spell_school: "Школа заклинаний"
 game_concept_wc_spell_schools_desc: "Магия Азерота разделена на дисциплины, известные как школы. Некоторые полагают, что так называемые [wc_spell_school_cosmic|E] отражают наборы сил мира Азерота, у каждой из которых есть дуалистическая противоположность. С другой стороны, [wc_spell_school_elemental|E] проистекают из материальных сил мира, которые, в свою очередь, влияют на [wc_cosmos|E]. Каждая школа магии имеет свою сферу влияния в материальном мире, свой набор преимуществ, недостатков, эффектов, инструментов и даже философий, которые применяют её последователи."
 game_concept_wc_spell_school_cosmic: "Космические школы"
 game_concept_wc_spell_school_cosmic_desc: "К космическим школам магии относятся [wc_spell_school_light|E], [wc_spell_school_shadow|E], [wc_spell_school_order|E], [wc_spell_school_disorder|E], [wc_spell_school_life|E] и [wc_spell_school_death|E]. Эти магические школы проистекают из [wc_cosmos|E] — эфирной пустоты над всеми мирами и за их пределами. Взаимодействие с ними дарует великую силу, но часто привлекает внимание потусторонних существ несоизмеримо превосходящей мощи — включая Наару, Демонов и жутких Древних богов."
 game_concept_wc_spell_school_light: "Школа Света"
 game_concept_wc_spell_school_light_desc: "Силы Света предстают союзником жизни по всему космосу, взращивая единство и цивилизацию. Могущественные существа Света, такие как Наару, стремятся сплотить всю жизнь в борьбе против сил Скверны. Поэтому заклинания школы Света сосредоточены на исцелении и мощных усилениях, повышающих коллективные способности."
 game_concept_wc_spell_school_shadow: "Школа Тьмы"
 game_concept_wc_spell_school_shadow_desc: "Силы Тьмы олицетворяют стремление существ навязывать свою волю и проистекают от жутких сущностей, затерянных в безбрежности времён. Пользователи магии Тьмы должны остерегаться влияния этих могущественных сущностей. Заклинания школы Тьмы сосредоточены на подчинении других своей воле, сокрытии своих мотивов и личности, а также на возвеличивании собственной силы за чужой счёт. "
 game_concept_wc_spell_school_disorder: "Школа Скверны"
 game_concept_wc_spell_school_disorder_desc: "Рождённая предательством великого демонического титана Саргераса в глубинах ранних времён, Скверна стремится извратить и уничтожить всю жизнь в [wc_cosmos|E]. Поэтому магия Скверны сосредоточена на энтропийном распаде, навязывании контроля и физическом разрушении. Сговор с демоническими существами — источником Скверны — может быть весьма опасен."
 game_concept_wc_spell_school_Order: "Школа Тайной Магии"
 game_concept_wc_spell_school_order: "$game_concept_wc_spell_school_Order$"
 game_concept_wc_spell_school_order_desc: "$game_concept_wc_spell_school_Order_desc$"
 game_concept_wc_spell_school_Order_desc: "Силы Тайной магии олицетворяют сами физические законы [wc_cosmos|E]. Лежащая в основе свойств [wc_spell_school_elemental|E], Тайная магия — это кипящий и неупорядоченный источник энергии, способный наделить заклинателей силой менять реальность на фундаментальном уровне. Тайные заклинания служат множеству целей; главные среди них — контроль над [wc_elements|E] и фундаментальное управление магией и временем."
 game_concept_wc_spell_school_life: "Школа Природы"
 game_concept_wc_spell_school_life_desc: "Жизнь пронизывает [wc_cosmos|E], а переплетение альтруистической гармонии и алчной конкуренции создаёт ту сложную ткань, что породила великий источник силы для всех живых существ. Это известно как магия Природы; она сосредоточена на росте, гармонии и равновесии между живыми существами. Поэтому она опирается на исцеление, добровольное сотрудничество и грубую силу.\nИз-за внешнего сходства живых и элементальных существ существует связь между Жизнью и [wc_spell_school_elemental|E], известная как Дух."
 game_concept_wc_spell_school_death: "Школа Смерти"
 game_concept_wc_spell_school_death_desc: "Где есть жизнь (а жизнь есть везде), там должна быть и смерть; и так динамичные, гармоничные силы жизни порождают неумолимую волю Смерти. Хотя Смерть пребывает в естественном равновесии с Жизнью, живые существа, способные использовать магию, неизбежно стремятся отсрочить смерть и тем самым даруют смерти силу нарушить это равновесие и принести энтропию и распад в процветающие экосистемы. Магия Смерти естественным образом сосредоточена на распаде, оживлении и продлении жизни.\nКроме того, те же силы, что толкают живых существ навязывать свою волю друг другу, породили связь между смертью и [wc_spell_school_elemental|E], известную как Разложение."
 game_concept_wc_spell_school_elemental: "Школы стихий"
 game_concept_wc_spell_school_elemental_desc: "Материальные и физические силы Азерота и прочих планов бытия, в силу своей великой мощи и сложности, обрели собственную магическую волю и сознание. Эти силы, известные как [wc_elements|E], даруют некоторым заклинателям способность изменять химический и энергетический состав мира способами, которые не только научно знакомы, но и интуитивно понятны разумным существам. Поэтому они часто становятся первыми заклинаниями, которые используют заклинатели из малоразвитых культур, но остаются актуальными в очищенной форме и на поздних стадиях [development|E]. Четыре школы стихий — это [wc_spell_school_elemental_fire|E], [wc_spell_school_elemental_water|E], [wc_spell_school_elemental_air|E] и [wc_spell_school_elemental_earth|E].\nКроме того, существуют два подхода к взаимодействию с этими духами стихий: Дух (часто ассоциируемый с [wc_spell_school_life|E]) и Разложение (часто ассоциируемое с [wc_spell_school_death|E])"
 game_concept_wc_spell_school_elemental_fire: "Школа Огня"
 game_concept_wc_spell_school_elemental_fire_desc: "Одна из [wc_spell_school_elemental], эта школа повелевает силами огня и магмы."
 game_concept_wc_spell_school_elemental_water: "Школа Воды"
 game_concept_wc_spell_school_elemental_water_desc: "Одна из [wc_spell_school_elemental], эта школа повелевает силами льда и воды, включая водоёмы — реки, озёра и моря."
 game_concept_wc_spell_school_elemental_air: "Школа Воздуха"
 game_concept_wc_spell_school_elemental_air_desc: "Одна из [wc_spell_school_elemental], эта школа повелевает силами воздуха и молний."
 game_concept_wc_spell_school_elemental_earth: "Школа Земли"
 game_concept_wc_spell_school_elemental_earth_desc: "Одна из [wc_spell_school_elemental], эта школа повелевает почвой, камнем и местностью, а также металлами и самоцветами."

 game_concept_wc_elements: "Стихии"
 game_concept_wc_elements_desc: "Хотя они проистекают из тех же тайных энергий, что лежат в основе [wc_spell_school_order|E], оживлённая и химическая природа Стихий дарует им упорядоченную волю, внешне схожую с живыми существами, к которой можно обратиться и вступить в диалог посредством шаманских практик. Поскольку Стихии всех миров космоса обладают общими свойствами и схожей волей, они проявили собственные элементальные планы в [wc_cosmos|E]."
 game_concept_wc_cosmos: "Космос"
 game_concept_wc_cosmos_desc: "Космос — это название пространства вокруг, между и над обыденными мирами. Он — источник магической энергии, которая пронизывает и поддерживает их. Шесть [wc_spell_school_cosmic] отражают основные силы, влияющие на Азерот и (в меньшей степени) на бесчисленные иные миры Космоса. Некоторые из этих сил считают себя союзниками и защитниками жизни, тогда как другие враждебны ей и ищут её уничтожения ради выгоды или по убеждению. У каждой из этих сил есть собственные владения в космосе, известные как планы бытия. [wc_elements], хотя и берут начало в материальных мирах, также имеют свой план бытия в космосе."


 game_concept_wc_magic_resistance: "Сопротивление магии"
 game_concept_wc_magic_resistance_desc: "$game_concept_wc_magic_resistance$ определяет, сколько урона [character|E] получит от определённого класса [wc_spell|E], или задаёт его шанс уклониться от вредоносного заклинания. Оно также определяет, как быстро персонаж восстанавливается от [wc_magic_illness|E] соответствующего класса [wc_spell|E].\n\nОно определяется [wc_race|E], [faith|E], [wc_magic_lifestyle|E] персонажа и может быть изменено заклинанием. Максимальное значение — 25, минимальное — 0."

 game_concept_wc_magical_prowess: "Магическая доблесть"
 game_concept_wc_spell_power: "Магическая доблесть"
 game_concept_wc_magical_prowess_desc: "$game_concept_wc_magical_prowess$ влияет на мощь и эффективность заклинаний персонажа. Она определяет, как долго действуют заклинания, влияет на его [wc_magic_resistance|E], увеличивает его [diplomatic_range|E] и усиливает воздействие его магических способностей на окружающий мир.\n\nОна может изменяться событиями, [wc_spells|E], его [wc_magic_lifestyle|E] и [traits|E]."

