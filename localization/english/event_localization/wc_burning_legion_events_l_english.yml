l_english:
 
 burninglegion_0003_title: "The Siege of Dalaran"
 burninglegion_0003_desc: "The defenders of Dalaran are struck down one by one. The Lich and I approach the pathetic [antonidas.GetFirstName].\n\n[antonidas.GetFirstName] slumps over in pain and speaks [Select_CString(antonidas.IsFemale, 'her', 'his' )] last words, "It pains me to even look at you, [ROOT.GetCharacter.GetFirstNameNoTooltip]..."\n\n"I'll be happy to end your torment, [antonidas.GetFirstName]. I told you that your magics could not stop me.", I retort while noticing the frown on the face with a hint of disappointment in [antonidas.GetFirstName].\n\nWith nothing left to say anymore, I strike [antonidas.GetFirstName] with [frostmourne|E]. I pick up the Book of Medivh, stained with [antonidas.GetFirstName]' blood, and hand it over to the Lich. "The spellbook is all yours, lich. Let's take it and leave before the wizards amass an attack."\n\n"Indeed... I will begin summoning Lord Archimonde after I study the Book of Medivh properly.", says [summonerofburninglegion.GetFirstName] as [Select_CString(summonerofburninglegion.IsFemale, 'she', 'he' )] examines the book."
 burninglegion_0003_a: "Let the summoning commence!"
 burninglegion_0003_a_tt: "The Lich will take its time to understand the Book of Medivh and summon the Burning Legion"

 burninglegion_0004_title: "Under the Burning Sky"
 burninglegion_0004_desc: ""
 burninglegion_0004_a: "No other choice, then..."
