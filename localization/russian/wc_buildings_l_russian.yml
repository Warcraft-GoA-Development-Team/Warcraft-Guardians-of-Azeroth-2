 building_winter_terrace: "$building_type_winter_terrace$"
 building_winter_terrace_desc: "$building_type_winter_terrace_desc$"
 building_wintergarde_crypt: "$building_type_wintergarde_crypt$"
 building_wintergarde_crypt_desc: "$building_type_wintergarde_crypt_desc$"
 building_wyrmrest_temple: "$building_type_wyrmrest_temple$"
 building_wyrmrest_temple_desc: "$building_type_wyrmrest_temple_desc$"
 building_yshaarj_vault: "$building_type_yshaarj_vault$"
 building_yshaarj_vault_desc: "$building_type_yshaarj_vault_desc$"
 building_zanchul_pyramid: "Пирамида Занчула"
 building_zanchul_pyramid_desc: "В пирамиде на среднем этаже размещаются Совет Занчули и их Зал Совета, а на нижнем — Зал Верховных жрецов. На вершине пирамиды расположены святилища, посвящённые каждому из лоа зандаларов."
 building_zandalar_stone: "Древние сооружения зандаларов"
 building_zandalar_stone_desc: "Древние зандалары возвели на этом острове сооружения, которые ныне обратились в руины."
 building_zarkhenar_temple: "Храм Зархенара"
