l_english:
 wc_crisis_events.0100.title_pandaria:0 "The end of the Thunder King"
 wc_crisis_events.0100.title_horde:0 "The Horde Vanquished"
 wc_crisis_events.0100.title_scourge:0 "The end of the Scourge"
 wc_crisis_events.0100.title_burning_legion:0 "Legion Invasion Ends"
 wc_crisis_events.0100.title_black_empire:0 "The Black Empire Defeated"
 wc_crisis_events.0100.title:0 "Crisis Averted"
 wc_crisis_events.0100.desc:0 "After long, tireless efforts, a threat to my realm as we know it has been culled. Countless lives were lost in the process, but Azeroth may know peace for a time."
 wc_crisis_events.0100.desc_pandaria:0 "[crisis_leader.GetNamePossessive] reign has ended! Pandaria is free from the shackles of the Mogu king. His Zandalari allies turn to hiding in the shadows, as their risen king's empire slowly crumbles."
 wc_crisis_events.0100.desc_horde:0 "The Orcish Horde's efforts have been stopped. Those warlords who sought to disrupt the peace of Azeroth have been defeated. [crisis_leader.GetFirstName] cowers in embarrassment, as the Horde's enemies celebrate their victory.\n\nThe refugees from Draenor still remain, however, and the their future is uncertain..."
 wc_crisis_events.0100.desc_scourge:0 "[crisis_leader.GetNamePossessive] reign of terror has been put to an end. Many cities and towns across Azeroth were ravished by plague, many still inhabited by their now-undead citizens.\n\nBut, even with this victory, the undead still roam the land, some becoming rulers of their own. Their presence will forever be a reminder of the lives lost to the Scourge, but some may prove beneficial to the living."
 wc_crisis_events.0100.desc_burning_legion:0 "TODO"
 wc_crisis_events.0100.desc_black_empire:0 "TODO"
 wc_crisis_events.0100.opt_pandaria:0 "A new age for Pandaria!"
 wc_crisis_events.0100.opt_horde:0 "Victory!"
 wc_crisis_events.0100.opt_scourge:0 "The stench of death lingers..."
 wc_crisis_events.0100.opt_burning_legion:0 "TODO"
 wc_crisis_events.0100.opt_black_empire:0 "TODO"

 wc_crisis_events.0200.title:0 "The World Against Me"
 wc_crisis_events.0200.desc:0 "My mission is not yet complete. Yet, as I continue to fight, I notice the smoke clouds of rebellion form.\n\nPeople across Azeroth spread word of my armies, and the fear of my power grows. The denizens of this land have begun to unite against me, even those who would be unlikely allies. My own subjects have begun to question my impending victory, and I fear some may turn foe."
 wc_crisis_events.0200.a:0 "I will face them head on."
 wc_crisis_events.0200.b:0 "Their realms will crumble from within."
 wc_crisis_events.0200.b_tooltip:0 "For the next #V 5#! years, hostile [schemes|E] targeting a ruler in a [coalition|E] against you will have an increased success chance."
 wc_crisis_events.0200.c:0 "It would be wise to defend what I've conquered."
 wc_crisis_events.0200.d:0 "The pressure is too much... I must yield."

 crisis_bold_modifier:0 "Empowered Attacker"
 crisis_bold_modifier_desc:0 ""

 crisis_scheme_modifier:0 "Scheming Invader"
 crisis_scheme_modifier_desc:0 "Hostile [schemes|E] Success Chance against [coalition|E] members: #P +25%#!"
 crisis_scheme_modifier_tt:0 "[GetModifier('crisis_scheme_modifier').GetNameWithTooltip]: #P +$VALUE|0$%#!"

 crisis_defense_modifier:0 "Fortified Realm"
 crisis_defense_modifier_desc:0 ""

 crisis_surrender_modifier:0 "Surrendered"
 crisis_surrender_modifier_desc:0 "Cannot declare [war|E] or be targeted by any [casus_belli|E] besides [civil_wars|E]"

 wc_crisis_events.0210.title:0 "Seeds of Dissent"
 wc_crisis_events.0210.desc:0 "The forces against me have done much to weaken my rule, and still strive to work together to bring me down. However, that does not change the differences between them, and their unity is fragile at best. I can exploit this to my advantage.\n\n[target.GetName] seems particularly vulnerable to my influence. Perhaps I can turn [target.GetHerHim] against [target.GetHerHis] temporary allies..."
 wc_crisis_events.0210.intrigue:0 "I will sow doubt into [target.GetHerHis] mind."
 wc_betrayal_success:0 "[target.GetSheHe|U] is convinced"
 wc_betrayal_failure:0 "[target.GetSheHe|U] remains loyal"
 betrayal_cooldown:0 "You can attempt to convince another coalition member in #V 3#! years"
 wc_crisis_events.0210.stewardship:0 "Perhaps I can offer [target.GetHerHim] riches beyond [target.GetHerHis] wildest dreams."
 wc_crisis_events.0210.martial.victor_gets.tt:0 "If you win: [target.GetFirstName] will become your [vassal|E] & $betrayal_cooldown$"
 wc_crisis_events.0210.martial.loser_gets.tt:0 "If [target.GetFirstName] wins:You will lose [prestige|E] & gain [stress|E]"
 wc_crisis_events.0210.martial:0 "[target.GetFirstNamePossessiveNoTooltip] loyalty will be earned through combat!"
 wc_crisis_events.0210.diplomacy:0 "It will be best to appeal to [target.GetHerHis] #italic true#! sense of unity."