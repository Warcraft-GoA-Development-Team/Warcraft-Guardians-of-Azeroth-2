l_english:

 ##### Own Combat Move Feedback
 single_combat.0001.desc.my_feedback.being_hunted_by_demon_hunter:0 "With practiced ease, I evade a strike from [my_foe.GetFirstNameNoTooltip], stepping into the blow and bringing my Warglaives up and strike fiercely at weakest points, before darting back out to a safe distance."

 ##### Opponent Combat Move Feedback
 single_combat.0001.desc.opponent_response.being_hunted_by_demon_hunter:0 "[my_foe.GetFirstNameNoTooltip] is a worryingly dangerous hunter of Demons, as time and again [my_foe.GetSheHe] evades or parries even solid strikes, then turns them back on me."

 ##### Outcome Event: Loser #####
 ## Defender Lost, Own Combat Move Feedback
 single_combat.0031.desc.sc_defender.being_hunted_by_demon_hunter:0 "Even with all my experience, my opponent thwarts my blows."

 ## Defender Lost, Opponent Finishing Move Feedback
 single_combat.0031.desc.opponent_response.being_hunted_by_demon_hunter:0 "[sc_victor.GetFirstNamePossessiveNoTooltip] manner remains passive as we fight, but [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] reaps a bitter toll, forcing me back with a series of well-placed strikes from the Warglaives.\n\n"

 ## Defender Lost, Opponent Finishing Move Injury
 single_combat.0031.desc.opponent_response.being_hunted_by_demon_hunter.injury:0 "With illusory sharpness and wits, [sc_victor.GetFirstNameNoTooltip] herds me this way and that, each blow knocking me about till [sc_victor.GetSheHe] can twist the [sc_loser.Custom('signature_weapon')] right out of my [sc_loser.Custom('HandHands')].\n\nFor an instant, I'm left stunned."

 ## Defender Lost, Opponent Finishing Move Fatality
 single_combat.0031.desc.opponent_response.being_hunted_by_demon_hunter.fatality:0 "It's not long before I'm forced to face reality. [sc_victor.GetSheHe|U]'s got me on the back-foot with no opening to reclaim ground, and I can't keep blocking forever.\n\nWhen death comes, at least it's quick, as [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] my neck into a bloody ruin."

 ## Aggressor Lost, Own Combat Move Feedback
 single_combat.0031.desc.sc_attacker.being_hunted_by_demon_hunter:0 "In combat, I make it easy by exploiting my prey's arrogance. Unwarranted confidence is best punished with swift defeat. My foe now, however, seems determined to match me blow for blow and no more, leaving gaps only to lure me into overextending myself.\n\n"

 ## Aggressor Lost, Own Combat Move Injury
 single_combat.0031.desc.sc_attacker.being_hunted_by_demon_hunter.injury:0 "It is a tense struggle, but eventually, I fall for one such feint too hard to recover. Instead, I'm left sprawling on the ground, weaponless."

 ## Aggressor Lost, Own Combat Move Fatality
 single_combat.0031.desc.sc_attacker.being_hunted_by_demon_hunter.fatality:0 "It takes a while before one of us makes a mistake the other can exploit, but it happens eventually. I commit too much to a [sc_loser.Custom('SignatureWeaponAttemptedLight')], and before I can dodge, there's [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] lodged in my guts.\n\nSo it goes."

 ##### Outcome Event: Victor #####
 ## Defender Won, Own Combat Move Feedback
 single_combat.0041.desc.sc_defender.being_hunted_by_demon_hunter:0 "Hard-won lessons are the wisest of teachers, and I use the lessons to heart."

 ## Defender Won, Opponent Finishing Move Feedback
 single_combat.0041.desc.opponent_response.being_hunted_by_demon_hunter:0 "[sc_loser.GetFirstNameNoTooltip] fights well, making it hard for me to exploit their mistakes. Yet, every gap is exploited, every weakness charges a toll in pain and effort.\n\nOnly by playing things conservatively, matching [sc_loser.GetHerHim] blow for blow and no more, can I keep up, waiting till #EMP [sc_loser.GetSheHe]#! makes a mistake before I"

 ## Defender Won, Opponent Finishing Move Injury
 single_combat.0041.desc.opponent_response.being_hunted_by_demon_hunter.injury:0 "press the attack.\n\nIt's a grueling, exhausting battle of ferocity and exploiting minor details about the foe, but I'm eventually able to knock the [sc_loser.Custom('ShieldPersonFemaleMale')] to the ground and disarm [sc_loser.GetHerHim] in the same motion.\n\nThe yield is begrudging, but respectful."

 ## Defender Lost, Opponent Finishing Move Fatality
 single_combat.0041.desc.opponent_response.being_hunted_by_demon_hunter.fatality:0 "sneak in a [sc_victor.Custom('SignatureWeaponAttemptedLight')] that embeds itself in [sc_victor.GetHerHis] stomach.\n\nA painful death, [sc_loser.GetFirstNameNoTooltip] accepts it with dignity, fighting through the pain to the very end."

 ## Aggressor Won, Own Combat Move Feedback
 single_combat.0041.desc.sc_attacker.being_hunted_by_demon_hunter:0 "In the fury of battle, there is no place for mercy. Every mistake my foe makes is punished tenfold, every sloppy error paid back with interest. My [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] carves away at my opponent, each one forcing [sc_loser.GetHerHim] closer to the precipice of defeat.\n\n"

 ## Aggressor Won, Own Combat Move Injury
 single_combat.0041.desc.sc_attacker.being_hunted_by_demon_hunter.injury:0 "Before long, I'm able to knock the [sc_loser.Custom('signature_weapon')] from [sc_loser.GetHerHis] grasp with a well-placed [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\n[sc_loser.GetFirstNameNoTooltip] is stunned briefly, but stammers out a yield before I [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."

 ## Aggressor Won, Own Combat Move Fatality
 single_combat.0041.desc.sc_attacker.being_hunted_by_demon_hunter.fatality:0 "With no chance to reclaim control of the bout, [sc_loser.GetFirstNamePossessiveNoTooltip] demise is a matter of when, not if.\n\nEventually, [sc_loser.GetSheHe] makes a crucial mistake, and [sc_loser.GetHerHis] guard opens for a second. It's all I need, as I land one more fatal strike [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] [sc_loser.GetHerHis] neck.\n\n[sc_loser.GetFirstNameNoTooltip] chokes to death and drown in their own pool of blood, in short order."

 ##### Combat Move Options
 single_combat.0001.being_hunted_by_demon_hunter:0 "Let me show you how I hunt..."

 ##### Combat Move Option Tooltips
 single_combat.0001.tt.being_hunted_by_demon_hunter:0 "You bring your experience and ferocity in hunting to full force, upon your enemy"
