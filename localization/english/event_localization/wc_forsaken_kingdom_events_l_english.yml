l_english:
 bandarion_keep_custom_name:0 "Bandarion Keep"
 bandarion_keep_custom_name_adj:0 "Bandarionese"
 forsaken_kingdom.0001.t:1 "[GetTitleByKey('b_autumnacre').GetNameNoTier]"
 forsaken_kingdom.0001.desc.founded:2 "\n\nBefore the vigil is over, [danitha.GetFullName] comes before me. A paladin of the Silver Hand in life, raised in the fall of [GetTitleByKey('k_lordaeron').GetBaseNameNoTier] and freed with the Forsaken, [danitha.GetSheHe] fought beside [leonid.GetFullName] against the Scourge in the ruins of the capital and counted [garek.GetFirstName] a friend. [danitha.GetSheHe|U] tells me the Light did not abandon [danitha.GetHerHim] when [danitha.GetSheHe] died, only bided its time. [danitha.GetSheHe|U] asks to raise an order of the Light among the Forsaken, at [GetTitleByKey('b_autumnacre').GetNameNoTier], and to lead it.\n\nThey call themselves [new_holy_order.GetName]."
 forsaken_kingdom.0001.desc.rename_only:2 "\n\nNo one steps forward to keep [garek.GetHerHis] vigil. The keep stands, and the name will have to be enough."
 forsaken_kingdom.0001.a.founded:1 "Let the Watch keep [garek.GetHerHis] vigil."
 forsaken_kingdom.0001.a.rename_only:0 "Let the name stand."
 forsaken_kingdom.0002.t:1 "[new_holy_order.GetName]"
 forsaken_kingdom.0002.desc.light:2 "Word comes out of Tirisfal Glades that is hard to credit. [danitha.GetFullName], a paladin of the Silver Hand who was raised in the fall of [GetTitleByKey('k_lordaeron').GetBaseNameNoTier] and freed with the Forsaken, has taken up the Light again and founded an order of it among the undead. Its seat is [GetTitleByKey('b_autumnacre').GetNameNoTier], named for [garek.GetFullName], a captain of the Forsaken Deathguard.\n\nThey call themselves [new_holy_order.GetName]. Whether the Light truly answers the dead, or whether this is one more Forsaken deceit, no one who tells the story can say."
 forsaken_kingdom.0002.desc.forsaken:2 "Word spreads through Tirisfal Glades. [danitha.GetFullName], once a paladin of the Silver Hand, has taken up the Light again and founded an order of it at [GetTitleByKey('b_autumnacre').GetNameNoTier], the keep named for [garek.GetFullName], Captain of the Deathguard.\n\nThey call themselves [new_holy_order.GetName]. Some of us call it a betrayal of everything [sponsor.GetTitledFirstName] has built. Some of us have gone to the keep to see whether the Light will answer them too."
 forsaken_kingdom.0002.desc.other:2 "Word comes from [GetTitleByKey('k_lordaeron').GetBaseNameNoTier]. Among the Forsaken, a former paladin named [danitha.GetFullName] has founded an order of the Holy Light at a keep named for a fallen captain of their Deathguard, [garek.GetFullName].\n\nThey call themselves [new_holy_order.GetName]. An order of the Light, made of the walking dead, is not a thing anyone expected to hear of."
 forsaken_kingdom.0002.a.light:0 "The Light finds its own."
 forsaken_kingdom.0002.a.forsaken:0 "We will see what the Light makes of them."
 forsaken_kingdom.0002.a.other:0 "The dead keeping a vigil. What next."
 forsaken_kingdom.0001.desc.opening.sacrifice:1 "[garek.GetFullName], Captain of the Deathguard, called the Light down on [garek.GetHerselfHimself] atop Naxxramas and broke the necropolis to save the Undercity. There was no body to carry home; the Deathguard brought back [garek.GetHerHis] name and gave it to [garek.GetHerHis] keep. Autumnacre is [GetTitleByKey('b_autumnacre').GetNameNoTier] now.\n\nSomething else came back with them: the story of a Forsaken the Light answered, aided and through [garek.GetHerHim] saved us all. Forsaken who have not prayed since they died are asking whether it might answer them too."
 forsaken_kingdom.0001.desc.opening.neutral:1 "[garek.GetFullName], Captain of the Deathguard, is dead. [garek.GetHerHis|U] legendary sacrifice carried [garek.GetHerHis] story back to Autumnacre whose residents would not hear of the old name: from this day the keep is [GetTitleByKey('b_autumnacre').GetNameNoTier], and the Light will forever protect it."
 forsaken_kingdom.0001.desc.keeper:1 "\n\n[evin.GetFullName], who served in the Silver Hand beside [danitha.GetHerHim], asks to hold the keep itself for the order. [evin.GetSheHe|U] will be its keeper."
 forsaken_kingdom.0002.desc.keeper:1 "\n\nA second paladin of the old Silver Hand, [evin.GetFullName], holds the keep for them."
 forsaken_kingdom.0003.t:0 "The Light calls on us to protect the living"
 forsaken_kingdom.0003.desc.anya:1 "You will want it from someone who was there, so here it is.\n\nThe Undercity was threatened and [garek.GetFirstName] made the ultimate sacrifice. I put an arrow into everything that came near [garek.GetHerHim] until [garek.GetSheHe] reached the crystal at the top, and there [garek.GetSheHe] knelt. I have not prayed since [GetTitleByKey('k_quelthalas').GetBaseNameNoTier] burned, I thought the Light had forsaken us. [garek.GetFirstName] proved otherwise. The Light answered [garek.GetHerHis] desperate plea, answered [garek.GetHerHim] with every ounce of furor in [garek.GetHerHis] veins. [garek.GetSheHe|U] burned like a star and took the crystal with [garek.GetHerHim]. Naxxramas broke and fled.\n\n[garek.GetSheHe|U] was the best of us, of that I have no doubt."
 forsaken_kingdom.0003.desc.deathguard:1 "The Deathguard bring word from the walls. Naxxramas is gone from the sky above the Undercity, and their captain with it.\n\n[garek.GetFullName] went up alone. Whatever [garek.GetSheHe] found at the top of the necropolis, the men below saw only the end of it: their captain kneeling before a crystal the size of a house, a light rising from [garek.GetHerHim] that no Forsaken should be able to call, and then fire, righteous and total, that took the crystal, the deck around it, and [garek.GetHerHim]. The necropolis broke away and fled north.\n\nNothing came down but ash. There is no body to bury."
 forsaken_kingdom.0003.a:1 "[garek.GetSheHe|U] saved us all."
