 # The Tirisfal Fragment
 wandering_arcanist.0001.t:0 "The Tirisfal Fragment"
 wandering_arcanist.0001.desc:0 "Among the dusty pages of a peddler's bundle, one sheet does not belong. The vellum is older than any kingdom I know, and the hand is not human. It is a fragment of the lost Tirisfal writings, the secret texts of the council that once hunted demons across Azeroth.\n\nIts wards describe the things beyond the veil in loving detail. Reading them, I feel as though something on the other side is reading me back."
 wandering_arcanist.0001.a:0 "Knowledge is never evil. Study it."
 wandering_arcanist.0001.b:0 "The [GetTitleByKey('d_kirin_tor').GetNameNoTier] will pay well for this."
 wandering_arcanist.0001.c:0 "Some doors should stay shut. Burn it."

 # Ley Line Tap
 wandering_arcanist.0002.t:0 "Ley Line Tap"
 wandering_arcanist.0002.desc:0 "The air hums. Beneath my feet a ley line runs close to the surface, a river of raw arcane power bound for some distant nexus. I could draw from it as a thirsty man drinks from a stream.\n\nThe old masters warned that such currents are watched, by the Aspects who guard them and by worse things that hunger for them."
 wandering_arcanist.0002.a:0 "Drink deep."
 wandering_arcanist.0002.b:0 "Study its flow, and take nothing."
 wandering_arcanist.0002.c:0 "Walk on."

 # The Master's Key
 wandering_arcanist.0007.t:0 "The Master's Key"
 wandering_arcanist.0007.desc_holder:0 "A letter finds me, sealed in black wax and written in the careful hand of a steward. It bears the compliments of [karazhan_holder.GetFullName], who writes from [GetTitleByKey('c_karazhan').GetNameNoTier] in [GetTitleByKey('d_deadwind_pass').GetBaseNameNoTier].\n\nThe tower has been restless since its last master fell, the letter says, and it has begun to call for a master of the arcane. Folded inside is an old iron key, cold to the touch."
 wandering_arcanist.0007.desc_none:0 "In the ruins of a waystation I find a small iron case. Inside lies an old key wrapped in violet cloth, and a note in a faded hand: \"For whoever the tower calls, when the master is gone.\"\n\nThe key is cold, and when I close my eyes I see a tall tower in a dead valley."
 wandering_arcanist.0007.a:0 "I will answer the tower's call, in time."
 wandering_arcanist.0007.a_tt:0 "This key may one day open the doors of [GetTitleByKey('c_karazhan').GetNameNoTier]"
 wandering_arcanist.0007.b:0 "Some doors are best left shut."

 # Artifact and modifiers
 wc_wandering_arcanist_masters_key_name:0 "The Master's Key"
 wc_wandering_arcanist_masters_key_description:0 "An old iron key, cold to the touch, said to open the doors of the tower in [GetTitleByKey('d_deadwind_pass').GetBaseNameNoTier]."
 wc_wandering_arcanist_masters_key_modifier:0 "The Master's Key"
 wc_wandering_arcanist_bound_imp_modifier:0 "Bound Imp"
 wc_wandering_arcanist_bound_imp_modifier_desc:0 "A captive imp whispers secrets in exchange for scraps of power. It is always listening."
 wc_wandering_arcanist_blue_dragon_mentor_modifier:0 "Counsel of the [GetTitleByKey('e_blue_dragonflight').GetBaseNameNoTier]"
 wc_wandering_arcanist_blue_dragon_mentor_modifier_desc:0 "A blue drake keeps a watchful, if condescending, eye on this character's studies."
 wc_wandering_arcanist_blue_dragon_enmity_modifier:0 "Watched by the [GetTitleByKey('e_blue_dragonflight').GetBaseNameNoTier]"
 wc_wandering_arcanist_blue_dragon_enmity_modifier_desc:0 "This character defied an envoy of the Aspect of Magic. The blues do not forget."
 # Fel Murmurs
 wandering_arcanist.0003.t:0 "Fel Murmurs"
 wandering_arcanist.0003.desc:0 "My study is never quite as I left it. Candles gutter without a draft. Pages turn to passages I did not seek. And at night, just beneath the scratch of my quill, a voice murmurs in a tongue I should not understand, yet somehow do.\n\nIt is patient. It offers help. It knows the names of spells I have only dreamed of."
 wandering_arcanist.0003.a:0 "Let it speak. I am in control."
 wandering_arcanist.0003.b:0 "Raise wards, whatever the cost."
 wandering_arcanist.0003.c:0 "It is only fatigue."

 # Something Came Through
 wandering_arcanist.0004.t:0 "Something Came Through"
 wandering_arcanist.0004.desc:0 "The smell of sulfur wakes me. Crouched on my worktable, grinning over my spilled reagents, is a small, horned thing with eyes like coals. [imp.GetFirstName], it calls itself, and it says it followed the light of my spells here.\n\n\"Such a bright little candle,\" it giggles. \"The masters will be so pleased to know where you are.\""
 wandering_arcanist.0004.a:0 "Steel works on imps as well as anything."
 wandering_arcanist.0004.a_good:0 "The Imp Is Slain"
 wandering_arcanist.0004.a_bad:0 "Burned by Fel Fire"
 wandering_arcanist.0004.b:0 "Back to the Nether with you!"
 wandering_arcanist.0004.b_good:0 "Banished"
 wandering_arcanist.0004.b_bad:0 "The Banishment Falters"
 wandering_arcanist.0004.c:0 "You will serve me instead."

 # The Dreadlord's Offer
 wandering_arcanist.0005.t:0 "The Dreadlord's Offer"
 wandering_arcanist.0005.desc:0 "The fire in my hearth burns green, then goes out. When my eyes adjust, a figure stands in the dark, tall and winged, smiling with too many teeth. [dreadlord.GetFirstName] of the [dreadlord.GetCulture.GetName] bows as though we were old friends.\n\n\"You have been so very loud, little mage. Your light reaches all the way to the Twisting Nether. I could teach you to burn brighter still, as my master once whispered to another who dwelt in a tower. All I ask is a little loyalty.\""
 wandering_arcanist.0005.a:0 "Teach me."
 wandering_arcanist.0005.b:0 "I will die before I serve the [GetTitleByKey('h_burning_legion').GetBaseNameNoTier]!"
 wandering_arcanist.0005.b_good:0 "The Dreadlord Is Driven Off"
 wandering_arcanist.0005.b_bad:0 "Torn by Nathrezim Claws"
 wandering_arcanist.0005.c_kirin_tor:0 "Send word to the [GetTitleByKey('d_kirin_tor').GetNameNoTier]!"
 wandering_arcanist.0005.c_priest:0 "Fetch a priest, quickly!"
