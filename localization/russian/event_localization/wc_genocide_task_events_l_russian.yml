 genocide_task.0001.t: "Проклятые земли расширяются"
 genocide_task.0001.desc: "Избыток злых дел в [county.GetName] привёл к распространению магической порчи и чум всех видов.\n\nТе, кто не прячется в своих домах от смерти или болезни, поглощены необъяснимой апатией. Наши силы путешествуют туда-сюда по землям; убивая всё, что двигается, крадя всё, что имеет ценность, и сжигая всё, что можно поджечь.\n\nХотя эта насилие, несомненно, радует [councillor_liege.Custom('GenocideEventRelevantGod')], эта земля умирает, и её производительность страдает."
 genocide_task.0001.a: "Мы пожнём силы [councillor_liege.GetFaith.PantheonTerm]!"
  
 genocide_task.0002.t: "Мародёрские силы вызывают беспорядки"
 genocide_task.0002.desc: "Наши усилия принесли большое удовлетворение [councillor_liege.Custom('GenocideEventRelevantGod')], но смертные этой земли не знают границ своей наглости. Сообщения от наших союзников, разведчиков и шпионов в [county.GetName] начали поступать, что сопротивление среди населения растёт.\n\nНашим силам нужно действовать быстро, чтобы уничтожить эту растущую угрозу, иначе мы рискуем выглядеть слабыми перед теми среди нас, кто желает захватить власть."
 genocide_task.0002.a: "Убейте всё, что двигается! Сделайте из них пример!"
 genocide_task.0002.b: "Не беспокойте меня этими пустыми слухами!"
 genocide_task.0002.acceptance: "Мародёры в [county.GetName]"
  
 genocide_task.0101.t: "Вызов Чемпиона"
 genocide_task.0101.desc: "Наше очищение земель [county.GetName] продолжается без помех. Магия [champion.Custom('GenocideEventRelevantPower')] оскверняет эту землю, продолжая сопротивляться и бороться с нашей мощью, отправляя вторжения и вызовы, чтобы воспрепятствовать прогрессу наших воинов.\n\nНа этот раз отвратительная магия подняла осквернённого чемпиона, который бросил нам вызов на одиночный бой. Я мог бы сразиться с ним сам и извлечь славу для нашего дела, но это также несёт значительные риски..."
 genocide_task.0101.a: "Я очищу этого чемпиона сам."
 genocide_task.0101.b: "Возможно, мой маршал справится с этим вызовом."
  
 genocide_task.0102.t: "Неконтролируемая магия"
 genocide_task.0102.desc: "Наше очищение земель [county.GetName] столкнулось с непредвиденными последствиями. Магия, которая оскверняет эту землю, сопротивляется и борется с нашей волей, и в результате теперь вышла из-под нашего контроля. Если мы не примем решение немедленно, эта порча будет неконтролируемо распространяться по окружающему региону."
 genocide_task.0102.a: "Сдержите этот всплеск."
 genocide_task.0102.b: "Возможно, нам стоит оставить эту землю на её судьбу..."
  
 genocide_task.0201.t: "Глубокие волнения распространяются"
 genocide_task.0201.desc: "Избыток... сожалительных поступков в [county.GetName] привёл к распространению волнений всех видов.\n\nТе, кто не был убит нашими солдатами, прячутся в своих домах от страха или голодают. Наши силы путешествуют туда-сюда по землям; убивая всех [councillor_liege.Custom2_Title('GenocideEventGenocidedPopulationsOr', SCOPE.sTitle('county'))] которые двигаются, крадя всё, что имеет ценность, и сжигая всё, что можно поджечь.\n\nХотя это насилие несомненно выполнит наши цели, наши люди страдают, и их производительность страдает с ними."
 genocide_task.0201.a: "Надеемся, мы скоро закончим."
  
 genocide_task.0202.t: "[councillor_liege.Custom2_Title('GenocideEventGenocidedPopulationsAnd', SCOPE.sTitle('county'))] Эмиграция"
 genocide_task.0202.desc: "Недавние события в [county.GetName] вызвали крупную эмиграцию из нашего царства, [councillor_liege.Custom2_Title('GenocideEventGenocidedPopulationsAnd', SCOPE.sTitle('county'))] бегут толпами.\n\n[targets_ruler.Custom('InsultAdjective')] [target_ruler.GetName] \"щедро\" решил принять их, заманив обещаниями безопасности и уверенности, поселив их в [target_county.GetName].\n\nХотя наши солдаты пытались остановить миграцию, они не были очень успешными."
 genocide_task.0202.a: "Чёрт возьми, этот злодей!"
  
 genocide_task.0301.t: "Жестокое проявление преданности"
 genocide_task.0301.desc: "Столбы дыма поднимаются в ночное небо. Заглушая луну, они освещаются только огнём сгоревших зданий, полей и тел. Крики и хаос резни, произведённой в этой деревне в [county.GetName], оставили странную тишину и спокойствие в их следах, нарушаемое только потрескивающим огнём и случайным падением бревна. Очерчённые огнём, ваш [court_chaplain|E] [cp_court_chaplain.GetShortUINameNoTooltip] стоит в ликующей молитве. В нескольких шагах позади вас, на коленях, молится. Ритуал, начавшийся сразу после самой резни, наконец-то близится к своему завершению.\n\n'О [councillor_liege.Custom('GenocideEventRelevantGod')]!' Он умоляет, 'Прими души этих бедняков, чтобы они могли продемонстрировать нашу покорность твоей бесконечной силе. Прими кровь на наших лезвиях как доказательство нашей преданности тебе и твоему слуге [councillor_liege.GetNameNoTooltip|V]. Прими огонь, который окружает нас как торжественное доказательство твоей воли, установившейся в [councillor_liege.GetPrimaryTitle.GetName]. Пусть это разрушение и страдания угодят тебе; пусть эти души, кровь и огонь станут оплатой за ещё одну бесконечно малую часть твоей [councillor_liege.Custom('GenocideEventRelevantPower')] силы! Во имя твоё [councillor_liege.Custom('GenocideEventRelevantName')] мы молимся...'\n\nВы остаетесь молчаливым и неподвижным, даже когда первые дрожи и покалывания [councillor_liege.Custom('GenocideEventRelevantMagic')] энергии начинают течь по вашим венам. С максимальной ясностью в разуме вы желаете..."
 genocide_task.0301.a: "...быть страшным для ваших подданных."
 genocide_task.0301.b: "...чтобы ваша преданность была известна."
 genocide_task.0301.c: "...гармонизировать вашу силу с [councillor_liege.GetFaith.PantheonTerm]."
  
 genocide_task.0302.t: "Топливо для [councillor_liege.GetFaith.PantheonTerm]"
 genocide_task.0302.desc: "Я ощущаю извращённое удовольствие с каждым убийством, что следует за нашими силами. Их слабые души цепляются за жизнь, как насекомые — жужжат и извиваются в своей бесполезной борьбе. Их энергия — их души, — это ничто иное, как корм для силы, которую я теперь командую.\n\nИх сила течёт через меня, как поток жизни, который был извращён в [councillor_liege.Custom('GenocideEventRelevantPower')] силу, которую я сейчас командую. Я могу направлять её, формировать её, заставлять её быть такой, какой я хочу. Всё, что остаётся, это решить, куда вложить эту магию..."
 genocide_task.0302.a: "Эта сила принадлежит [councillor_liege.GetCapitalLocation.GetName]."
 genocide_task.0302.b: "Распространите её на местный регион."
  
 genocide_task.0401.t: "Рвение очищения"
 genocide_task.0401.desc: "Рвение нашей борьбы с [county.GetProvince.GetCounty.GetCulture.GetCollectiveNoun] распространяется по окружающим территориям, разжигая желание очищения среди местных жителей. Вдохновлённые нашей решимостью, местные жители восстали, готовы взять оружие, чтобы восстановить силу $GenocideEventRelevantGod_FaithGod$ в наших землях.\n\nИх рвение восхитительно, но без надлежащего направления их пыл может стать неправильным и разрушительным. Уже ходят слухи о случайных актах насилия против людей, которых воспринимают как [county.Custom('GenocideEventRelevantNameCounty')]. Что нам делать с этой новообретённой силой?"
 genocide_task.0401.a: "Пусть они принесут пользу!"
 genocide_task.0401.a.progress: "Прогресс очищения в [county.GetName] увеличен"
 genocide_task.0401.b: "Они будут сражаться на нашей стороне."
 genocide_task.0401.army_name: "Добровольцы из [county.GetName]"
  
 genocide_task.0402.t: "Крепость [county.GetProvince.GetCounty.GetCulture.GetCollectiveNounNoTooltip]"
 genocide_task.0402.desc: "Крепость [county.GetProvince.GetCounty.GetCulture.GetCollectiveNoun] в [county.GetName] рушится под жестоким натиском наших сил. Пламя поглощает стены, дым темнит небо, наши войска начинают грабить крепость и собирать измученных и сломленных защитников под строгим контролем.\n\nХаос сражения начал затихать, воздух всё ещё насыщен запахом крови, когда [councillor.GetFirstName] подходит ко мне, рука на рукояти [councillor.GetHerHis] оружия.\n\n\"[ROOT.Char.GetTitleAsNameNoTooltip|U], мы взяли пленных во время атаки. Они на вашей милости. Мы ждём ваших приказов.\""
 genocide_task.0402.a: "Пусть они помолятся за милосердие, прежде чем мы с ними расправимся."
 genocide_task.0402.b: "Покончим с их страданиями."
 genocide_task.0402.c: "Они станут достойной жертвой для [councillor_liege.GetFaith.PantheonTerm]!"
  
 genocide_task.0501.t: "Рука очищения"
 genocide_task.0501.desc: "Наше очищение этих земель продвигается успешно.\n\nОднажды неизвестный человек подошёл ко двору. Он кажется чемпионом [councillor_liege.Custom('GenocideEventRelevantGod')] и жил в [county.GetName], веря в наш праведный путь. Он хочет присягнуть мне на верность, и в обмен на это я позволяю ему помочь в очищении этих земель. Естественно, мне решать, как лучше его использовать."
 genocide_task.0501.a: "Он будет лучше служить в моём дворе."
 genocide_task.0501.b: "Очищать эти земли."
  
 genocide_task.0502.t: "Ресурсы слабых"
 genocide_task.0502.desc: "Смерть следует за нашими силами, когда мы без препятствий проходим по этим землям; очищая и приводя их в наш образ. Жители разбегаются, как насекомые, что убегают при нашем подходе. Во время очищения их земель стало очевидно, что несколько запасов их ресурсов были оставлены. Всё, что остаётся, это решить, куда направить эти ресурсы..."
 genocide_task.0502.a: "Отправьте это в [councillor_liege.GetCapitalLocation.GetName]."
 genocide_task.0502.b: "Распространите это на местный регион."
  
 genocide_task.2001.t: "Порча [county.GetName]"
 genocide_task.2001.desc.dark: "Тёмные энергии пронизывают землю, когда ваше ритуальное очищение достигает своей кульминации, искажают саму сущность этой земли.\n\nКогда-то яркая и процветающая, она теперь пульсирует зловещей силой, её жители поддаются ползущей порче. Воздух становится тяжёлым, небо темнеет, а когда-то плодородные поля увядают под вашим воздействием. Вы ощущаете, как тёмная магия течёт через землю, связывая её с вашей волей, превращая её в оплот вашей новой силы.\n\nДело сделано; земля ваша, преобразованная в ваш образ, но какой ценой?"
 genocide_task.2001.desc.light: "Светлые энергии наполняют землю, когда ваше ритуальное очищение достигает своей кульминации, наделяя землю божественной силой.\n\nКогда-то обычная и ничем не примечательная, она теперь светится небесным сиянием, её жители восхищены могущественной святостью. Воздух сверкает святостью, небо очищается от божественного света, а когда-то пустующие поля оживают под вашим прикосновением. Вы ощущаете священную силу, что течёт через землю, связывая её с вашей волей, превращая её в сияющее доказательство вашей благодати.\n\nДело сделано; земля ваша, преобразованная в ваш образ, но какой ценой?"
 genocide_task.2001.desc.nature: "Энергии Природы проходят через землю, когда ваше ритуальное очищение достигает своей кульминации, вдыхая новую жизнь в землю.\n\nКогда-то бесплодная и заброшенная, она теперь полна зелёной жизнью, её жители оживлены дикой магией. Воздух наполняется вибрациями природы, небо очищается и приобретает зелёный свет, а когда-то сухие поля цветут под вашим воздействием. Вы ощущаете, как природная магия проходит через землю, связывая её с вашей волей, превращая её в зелёное святилище вашего творения.\n\nДело сделано; земля ваша, процветающая под вашим руководством, но какой ценой?"
 genocide_task.2001.desc.arcane: "Аркановые энергии пронизывают землю, когда ваше ритуальное очищение достигает своей кульминации, наполняя землю сверхъестественной яркостью.\n\nКогда-то обычная и приземлённая, она теперь мерцает мистической силой, её жители очарованы вихрями магии. Воздух искрит аркановыми искрами, небо закручивается в эфирных оттенках, а когда-то высушенные поля теперь сияют магической силой. Вы ощущаете, как аркановая сила проходит через землю, связывая её с вашей волей, превращая её в маяк вашего арканового мастерства.\n\nДело сделано; земля ваша, переосмысленная вашим прикосновением, но какой ценой?"
 genocide_task.2001.a: "Дело сделано."
  
 genocide_task.2101.t: "Очищение [county.GetName]"
 genocide_task.2101.desc.dark: "Тёмные энергии рассеются с земли, когда ваше очищение достигает своей кульминации, восстанавливая саму сущность этой земли.\n\nКогда-то осквернённая и увядающая, она теперь процветает с новой жизнью, её жители освобождены от власти порчи. Воздух становится легче, небо очищается, а когда-то бесплодные поля начинают вновь цвести под вашим воздействием. Вы ощущаете чистую магию, что проходит через землю, освобождая её от язвы, возвращая её к былой славе.\n\nДело сделано; земля исцелена, восстановленная до её естественного состояния, и мир снова воцарился."
 genocide_task.2101.desc.light: "Святые энергии рассеются с земли, когда ваше очищение достигает своей кульминации, восстанавливая саму сущность этой земли.\n\nКогда-то переполненная небесным сиянием, она теперь возвращается к своему естественному состоянию, её жители освобождены от божественного воздействия. Воздух становится спокойнее, небо теряет свой ослепляющий свет, а когда-то процветавшие поля возвращаются в свою скромную форму под вашим прикосновением. Вы ощущаете чистую магию, что проходит через землю, освобождая её от священных оков, возвращая её к её прежней, непримечательной славе.\n\nДело сделано; земля очищена, восстановленная до её естественного состояния, и баланс вновь воцарился."
 genocide_task.2101.desc.nature: "Природные энергии рассеются с земли, когда ваше очищение достигает своей кульминации, восстанавливая саму сущность этой земли. Когда-то полная жизни, она теперь возвращается к своему исходному состоянию, её жители освобождены от всепоглощающе присутствующей магии природы. Воздух становится неподвижным, небо теряет зелёные оттенки, а когда-то цветущие поля снова упрощаются под вашим прикосновением. Вы чувствуете, как природная магия отступает, освобождая землю от её природных оков, возвращая её к её прежнему, непримечательному состоянию.\n\nДело сделано; земля очищена, возвращена к её естественному состоянию, и баланс вновь воцарился."
 genocide_task.2101.desc.arcane: "Аркановые энергии рассеются с земли, когда ваше очищение достигает своей кульминации, восстанавливая саму сущность этой земли. Когда-то полная магии, она теперь возвращается к своему прежнему состоянию, её жители освобождены от всех магических воздействий. Воздух становится неподвижным, небо теряет свои эфирные оттенки, а когда-то волшебные поля теперь простые под вашим прикосновением. Вы ощущаете, как аркановая магия уходит, освобождая землю от её аркановых оков, возвращая её к её прежнему, непримечательному состоянию.\n\nДело сделано; земля очищена, восстановленная до её естественного состояния, и баланс вновь воцарился."
 genocide_task.2101.a: "Зловещая порча побеждена."
  
 genocide_task.2201.t: "Очистка [county.GetName]"
 genocide_task.2201.desc: "Гнетущая тишина опустилась над [county.GetNameNoTooltip], когда ваша очистка достигла своего апогея. Нежелательные элементы изгнаны, их присутствие исчезает, как тени на рассвете. Земля снова вдыхает свободу, её когда-то хаотическая энергия теперь подчинена. Вы стоите посреди спокойствия, зная, что ваша работа восстановила порядок и мир."
 genocide_task.2201.desc.holder: "\n\nВопрос остаётся: что делать с [holder.GetShortUIName]."
 genocide_task.2201.a: "Отличная работа."
 genocide_task.2201.a.holder: "Оставьте их в покое."
