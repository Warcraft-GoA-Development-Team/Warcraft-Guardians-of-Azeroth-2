l_russian:
 # Restoring Gorian Empire 
 gorian_restoration.0001.t: "Восход новой эры"
 gorian_restoration.0001.desc.intro: "Огры! Мы прошли долгий и изнурительный путь из Дренора. Мы были разрозненны и разобщены с тех пор, как пересекли Темный Портал, но теперь мы едины! Наш рёв будет слышен по всему Азероту, и все узнают наши имена!"
 gorian_restoration.0001.desc.ogre: "\n\nОгры больше не будут считаться дикарями среди слабых насекомых Азерота, наша истинная сила будет признана, и нас будут бояться во всём мире."
 gorian_restoration.0001.desc.moknathal: "\n\nПрезираем[Select_CString(scoped_emperor.IsFemale,'ая','ый')] как полукровк[Select_CString(scoped_emperor.IsFemale,'а','а')], [scoped_emperor.GetCulture.GetName] проложил[Select_CString(scoped_emperor.IsFemale,'а','')] себе путь вверх по иерархии племён [GetTrait('creature_ogre').GetName( GetNullCharacter )] и был[Select_CString(scoped_emperor.IsFemale,'а','')] возвышен[Select_CString(scoped_emperor.IsFemale,'а','')] в глазах народа. Там, где другие терпели неудачу, [scoped_emperor.GetCulture.GetName] преуспел[Select_CString(scoped_emperor.IsFemale,'а','')], став перв[Select_CString(scoped_emperor.IsFemale,'ой','ым')] мок'наталским гором нового Горианского Имперского государства."
 gorian_restoration.0001.a: "Да здравствует новый Гор!"
 gorian_restoration.0002.t: "Вторая эпоха Гории"
 gorian_restoration.0002.desc: "Огры, которых раньше считали иноземными варварами-дикарями, каким-то образом сумели отвоевать достаточно потерянных территорий, чтобы объявить Горианскую империю восстановленной!"
 gorian_restoration.0002.desc.regular: "\n\nПохоже, что огры достаточно окрепли, чтобы обосноваться на Азероте, но что из этого выйдет - пока неизвестно."
 gorian_restoration.0002.desc.shock: "\n\nВарварским ограм каким-то образом удалось восстановить свою утраченную империю! Они будут представлять угрозу для всех нас, если мы не остановим их в ближайшее время..."
 gorian_restoration.0002.a: "Может ли это быть правдой?"
 gorian_restoration.0002.b: "Конец близок!"
 gorian_restoration.0002.c: "Нужно следить за этим..."
  
 gorian_empire_name: "Горианская империя"
 gorian_empire_name_adj: "Горианск"
 gorian_empire_name_article: ""
  
 gorian_elite_troops_name: "Элитные горианские солдаты"
