 pam_secure_pilgrim_routes_decision_remove_tenet_tt: "[GetPlayer.GetRite.GetName] no longer holds the selected [core_tenet|E] as core"
 pam_secure_pilgrim_routes_decision_holy_site_tt: "Any [THIS.Char.GetFaith.GetName] [holy_site|E] is #bold not#! held by a [GetReligionByKey('christianity_religion').GetAdjective] [ruler|E]"

 pam_decision_events.0019.t: "Defender of the Pilgrims"
 pam_decision_events.0019.desc: "My word to all [ROOT.Char.GetFaith.GetAdherentNamePlural]:\n\n"The roads to the holy places have grown dangerous. Be it known that the faithful may bear arms on pilgrimage, and may defend themselves against those barring the way to Paradise.""
 pam_decision_events.0019.a: "O Lord, strengthen our arms."

 pam_decision_events.0018.opening: "To [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] of every land,"
 pam_decision_events.0018.desc.armed_pilgrimages: "I have set my seal upon the matter. From this day, [GetTenetType('tenet_armed_pilgrimages').GetName( hof_scope.GetRite )] shall stand among the core beliefs of [hof_scope.GetFaith.GetName].\n\nLet every ruler of the faith take heed."
 pam_decision_events.0018.desc.struggle_submission: "I have set my seal upon the matter. From this day, [GetTenetType('tenet_struggle_submission').GetName( hof_scope.GetRite )] shall stand among the core beliefs of [hof_scope.GetFaith.GetName].\n\nLet every ruler of the faith take heed."
 pam_decision_events.0018.a: "So be it."

 pam_decision_events.0017.t: "Raise an Ancestral Khachkar"
 pam_decision_events.0017.desc: "I have chosen a high place overlooking [khachkar_location.GetNameNoTier] for the stone cross.\n\nI will let the master carvers create something truly humbling to commemorate [khachkar_ancestor.GetTitledFirstNameNicknamed]. A cross surrounded with rosettes, ornaments and an inscription that [khachkar_ancestor.GetHerHis] [khachkar_ancestor.Custom2('RelationToMeShort', ROOT.Char)] honored [khachkar_ancestor.GetHerHis] memory.\n\nLet the local pilgrims pray beneath it, and for everyone to see our rightful rule of the land."
 pam_decision_events.0017.a: "Let the cross stand for ages."
 pam_decision_events.0017.b: "The time is not right."

