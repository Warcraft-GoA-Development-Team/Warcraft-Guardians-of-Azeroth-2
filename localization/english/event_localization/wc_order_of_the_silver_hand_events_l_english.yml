l_english:
 order_of_the_silver_hand_events.001.t:0 "Kingslayer"
 order_of_the_silver_hand_events.001.desc:0 "By the Light!\n\nCrisis has befallen Lordaeron. Prince [killer.GetFirstNameNoTooltip] has returned from Northrend, consumed by madness. He has slain his own father and now seeks to bring destruction to Lordaeron and beyond.\n\nHow could this happen? I was his mentor, it was my duty to instill in him the virtues of the Silver Hand. Even when he crossed the line and purged the innocent at Stratholme, he still sought to protect the kingdom. All rulers must make difficult decisions to protect their people. But now, I must make my own.\n\nMy fellow paladins have gathered, and now I am to lead them in destroying the undead [scourge|E]. But with [killer.GetFirstNameNoTooltip] at its helm, that will mean killing him..."
 order_of_the_silver_hand_events.001.a:0 "No, I cannot. I shall discard my hammer, forever..."
 order_of_the_silver_hand_events.001.b:0 "Damn it, I will put you down, [killer.GetFirstNameNoTooltip]!"
 order_of_the_silver_hand_events.001.c:0 "Lordaeron must be protected at any cost."
 order_of_the_silver_hand_events.001.d:0 "The People of Lordaeron need our help"
