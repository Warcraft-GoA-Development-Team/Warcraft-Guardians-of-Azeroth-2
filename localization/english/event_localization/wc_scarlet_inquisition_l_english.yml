l_english:
 wc_scarlet_inquisition.2.t:0 "Before the Inquisition"
 wc_scarlet_inquisition.2.desc:0 "The guard brings [wc_accused.GetTitledFirstName] before me. A month behind our doors has left [wc_accused.GetHerHim] pale, but [wc_accused.GetSheHe] meets my eyes.\n\nThe accusation lies open beside my prayer book. Outside, Scarlet soldiers wait for my judgment."
 wc_scarlet_inquisition.known_crime:0 "\n\n[wc_accused.GetHerHis|U] known offenses violate our faith. Yet the punishment is mine to weigh."
 wc_scarlet_inquisition.accusation:0 "\n\nThere is no known offense against our faith to settle the matter. Whoever sent [wc_accused.GetHerHim] here expects a condemnation all the same."
 wc_scarlet_inquisition.acquit:0 "The accusation does not warrant punishment."
 wc_scarlet_inquisition.penance:0 "Let [wc_accused.GetHerHim] return to the Light through penance."
 wc_scarlet_inquisition.execute:0 "I judge [wc_accused.GetHerHim] unfit to walk among the faithful."
 wc_scarlet_inquisition.3.t:0 "The Inquisitor's Seal"
 wc_scarlet_inquisition.3.desc:0 "[wc_inquisitor.GetTitledFirstNamePossessive] judgment arrives beneath a Scarlet seal. The messenger remains at my door: the guards await my answer before carrying it out.\n\n"
 wc_scarlet_inquisition.3.execution:0 "[wc_accused.GetTitledFirstName] is to die. I could appeal to the inquisitor or let the sentence stand. A public protest would be heard throughout the Crusade, but would not stay the execution."
 wc_scarlet_inquisition.3.penance:0 "[wc_accused.GetTitledFirstName] is to leave confinement under penance. The stain of the accusation will follow [wc_accused.GetHerHim] into every chapel. I can ask the inquisitor to relent, or speak against the judgment before the guards carry it out."
 wc_scarlet_inquisition.3.acquittal:0 "[wc_accused.GetTitledFirstName] is to be cleared and released. Whatever [wc_accused.GetHerHis] accuser hoped to gain, the inquisitor has refused to condemn [wc_accused.GetHerHim]."
 wc_scarlet_inquisition.accept:0 "Carry out the judgment."
 wc_scarlet_inquisition.plead:0 "I ask you to show mercy."
 wc_scarlet_inquisition.hook:0 "You owe me. Spare this life."
 wc_scarlet_inquisition.denounce:0 "Let the Crusade hear my objection."
 wc_scarlet_inquisition.4.t:0 "A Plea from the Commander"
 wc_scarlet_inquisition.4.desc:0 "My messenger returns with [wc_commander.GetTitledFirstNamePossessive] answer. [wc_commander.GetSheHe|U] asks me to temper my judgment of [wc_accused.GetTitledFirstName].\n\nI leave the reply beside the unsigned order. The guards have their commander. They look to me for the will of the Light."
 wc_scarlet_inquisition.uphold:0 "My judgment stands."
 wc_scarlet_inquisition.mercy:0 "Then I shall temper justice with mercy."
 wc_scarlet_inquisition.lapsed:0 "This hearing can go no further."
