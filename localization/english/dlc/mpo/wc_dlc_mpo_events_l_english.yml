nomad_events.0250.wc_civlilized_intro: "A foreign visitor has arrived at my court, bearing a most peculiar message that I am assured will be of interest to me. However as [priest.GetSheHe] begins to speak, I am so taken aback that I wonder if this is some elaborate joke:\n\n"
nomad_events.0250.wc_default_intro: "Some of my kinsmen have brought a foreign visitor before me, with a message that they say will interest me. They gesture excitedly for [priest.GetHerHim] to speak:\n\n"
nomad_events.0250.wc: ""Execute this blasphemer immediately!""