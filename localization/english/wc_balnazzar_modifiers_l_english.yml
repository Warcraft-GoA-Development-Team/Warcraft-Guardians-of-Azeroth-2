 wc_nathrezim_disguise_modifier:0 "An Unnatural Composure"
 wc_nathrezim_disguise_modifier_desc:0 "Something beneath the surface holds steady where it shouldn't."
 wc_balnazzar_suspicion_whispers_modifier:0 "Whispers Around the Mask"
 wc_balnazzar_suspicion_whispers_modifier_desc:0 "Servants lower their voices when I enter. Eyes linger where they once looked away."
 wc_balnazzar_suspicion_inquiry_modifier:0 "A Formal Inquiry"
 wc_balnazzar_suspicion_inquiry_modifier_desc:0 "Questions now pass between officers and confessors. This borrowed face is being measured."
