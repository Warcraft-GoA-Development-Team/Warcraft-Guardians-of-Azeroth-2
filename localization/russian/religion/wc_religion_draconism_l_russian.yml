 malygosism_desc: "Последователи Синей драконьей стаи почитают Синих драконов как величественных хранителей чародейства и блюстителей магии. Они верят, что мудрый Аспект Магии даровал Синим драконам высшее право на Божественность, вручив им охрану безграничных магических энергий Азерота. Их вера подчёркивает важность понимания и ответственного применения магических сил во благо всех живых существ. Сами Синие драконы черпают силы в Нексусе, где сходятся линии лей-энергии. Для этих таинственных и часто отстранённых существ долг поддерживать поток магии и собирать всё знание — священная обязанность перед древними Титанами."
