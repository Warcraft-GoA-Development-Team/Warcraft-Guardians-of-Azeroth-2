 wc_flame_armor_effect: "Ваш [wc_spell_fire_shield|E] также действует на [army|E], которой вы командуете"
 wc_icy_veins_effect: "Когда вы творите заклинание криомантии, время сотворения вашей следующей [Concept('wc_spell_frostbolt', 'Ледяной стрелы')] сокращается вдвое"
 wc_freezerburn_burned_effect: "Цели ваших заклинаний с раной [GetTrait('burned_1').GetName( GetPlayer )] восприимчивее к ране [GetTrait('frostbite_1').GetName( GetPlayer )] и с большей вероятностью умрут от этих ран"
