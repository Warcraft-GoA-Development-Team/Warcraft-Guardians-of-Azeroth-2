 ghoul_maa: "Вурдалаки"
 ghoul_maa_flavor: "#F Вурдалаки — нежить, служащая ударными отрядами Плети. Эти неуклюжие разлагающиеся трупы некогда были ни в чём не повинными горожанами, совершившими последний переход в истинную нежить."
