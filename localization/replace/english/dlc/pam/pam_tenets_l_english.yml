  tenet_armed_pilgrimages_historical_desc: "In the early days of the Church of the Light, pilgrims traveling to sacred sites sometimes took up arms to defend themselves against bandits and hostile forces. These journeys combined religious devotion with the duty to protect fellow believers, laying the foundations for the later tradition of armed pilgrimage." # PLACEHOLDER

