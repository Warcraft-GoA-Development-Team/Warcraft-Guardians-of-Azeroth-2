 #Helyatrú-Group Faiths
 helyatru:0 "Helyatrú"
 helyatru_adj:0 "Helarjar"
 helyatru_adherent:0 "Helari"
 helyatru_adherent_plural:0 "Helarjar"
 helyatru_desc:0 "Helya, the matriarch of Helheim, which is the underworld of the [GetTrait('creature_vrykul').GetName( GetNullCharacter )] who have fallen and failed to ascended to the Halls of Valor, was a Watcher who assisted Odyn in imprisoning elementals into the Elemental Plane. When she rebelled against Odyn, she became the first spectral Val'kyr. She would later create a champion who would bear Odyns warswords of the Valajar, which Helya stole from Odyn. This champion would slay many so that their souls would serve in Helheim. She would also create the Helarjar, a holy order mocking Odyn's Valarjar. The Kvaldir of Helya would also be responsible for murdering the dishonorable and unworthy, taking them to Helheim." # Need rework

