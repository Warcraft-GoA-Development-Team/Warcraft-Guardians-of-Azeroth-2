l_english:
 wc_relations_events.1001.t:0 "A [parent.Custom('MotherFather')|U] Between Casts"
 wc_relations_events.1001.desc:0 "My [parent.Custom('ComplimentAdjective')] [parent.Custom('MotherFather')|l] has always been fond of my magical endeavors, but [parent.GetSheHe] has become quite the nuisance about my spellcasting lately.\n\n"I can wield magic too, you know." [parent.GetSheHe|U] boasts. "You could learn a thing or two from me!""
 wc_relations_events.1001.a:0 "I could use more raw power..."
 wc_relations_events.1001.b:0 "Help me defend myself, then."
 wc_relations_events.1001.c:0 "I appreciate your concern, but I'll manage on my own."

 wc_parent_aids_magic_modifier_power:0 "Parental Spell Power"
 wc_parent_aids_magic_modifier_power_desc:0 "This character's parent has helped them out with magic.\n[wc_spell_power|E] @wc_spell_icon!: #P +5#!"

 wc_parent_aids_magic_modifier_defense:0 "Parental Spell Defense"
 wc_parent_aids_magic_modifier_defense_desc:0 "This character's parent has helped them out with magic.\n[wc_magic_resistance|E] @wc_spell_icon!: #P +5#!"