 trait_wc_lifestyle_elemental_fire_decay_magic: "Разгневанные пиротеурги"
 trait_user_of_elemental_fire_decay_magic_name: "Пиротеург"
 trait_user_of_elemental_fire_decay_magic_1: "$wc_lifestyle_magic_prefix_for_level_1$ $trait_user_of_elemental_fire_decay_magic_name$"
 trait_user_of_elemental_fire_decay_magic_1_desc: "Если перед пиротеургами встаёт угроза, ответ всегда один — уничтожить её в славном пламени. Вся жизнь, посвящённая изучению огненных сил, лишь разжигает их пироманию, и они гордятся — даже наслаждаются — тем, как поджигают врагов в яростных вспышках пламени. Примите их любовь к сжиганию всего за недостаток самообладания — на свой страх и риск."
