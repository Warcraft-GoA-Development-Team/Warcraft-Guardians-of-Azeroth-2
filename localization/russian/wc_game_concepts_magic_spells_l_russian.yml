 wc_spell_dispel_effects: "Снимает с цели случайный негативный модификатор #bold магии#!."
 wc_learn_spell_dispel_magic: "Вы изучаете заклинание: [wc_spell_dispel|E]"

 game_concept_wc_spell_lightwell: "Колодец Света"
 game_concept_wc_spell_lightwell_desc: "Наполните союзника святой энергией, укрепив его на короткое время."
 wc_spell_lightwell_type: "[wc_spell_type_enchantment|E]"
 wc_spell_lightwell_targets: "[character|E]"
 wc_spell_lightwell_effects: "Цель получает бонусы к доблести, военному делу и сопротивлению магии Света."
 wc_learn_spell_lightwell: "Вы изучаете заклинание: [wc_spell_lightwell|E]"

 game_concept_wc_spell_holy_fire: "Священный Огонь"
 game_concept_wc_spell_holy_fire_desc: "Ослепите врага священным огнём."
 wc_spell_holy_fire_type: "[wc_spell_type_attack|E]"
 wc_spell_holy_fire_targets: "[character|E]"
 wc_spell_holy_fire_effects: "Цель получает штрафы к доблести, военному делу и сопротивлению магии Света."
 wc_learn_spell_holy_fire: "Вы изучаете заклинание: [wc_spell_holy_fire|E]"

 game_concept_wc_spell_bless: "Благословение"
 game_concept_wc_spell_bless_desc: "Благословите союзника силой Света."
 wc_spell_bless_type: "[wc_spell_type_enchantment|E]"
 wc_spell_bless_targets: "[character|E]"
