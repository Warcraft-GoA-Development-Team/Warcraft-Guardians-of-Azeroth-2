  tenet_divine_liturgy_draenei_historical_glossary: "[Glossary('Theía Leitourgía','tenet_divine_liturgy_historical_desc')]"
  tenet_divine_liturgy_default_desc: "The liturgy is the primary expression of faith, where heaven and world meet, and the faithful participate in the eternal worship of the Light alongside stars, angels and saints."
  tenet_divine_liturgy_default_historical_glossary: "[Glossary('Divine Liturgy','tenet_divine_liturgy_historical_desc')]"
  tenet_divine_liturgy_historical_desc: "The worship of the Light developed into elaborate sacred rites, where prayers, chants, and ceremonies allowed the faithful to express their devotion. These rituals were understood as more than earthly acts of worship, offering a glimpse of the eternal radiance of the Light and the divine order beyond the mortal world." # PLACEHOLDER


