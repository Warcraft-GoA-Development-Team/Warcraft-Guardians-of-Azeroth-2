 ##################################################################
 # magic_secret.0001
 # персонаж начинает изучать запретную магию
 ##################################################################

 # космическая магия
 magic_secret.0001.title.light: "Тайный последователь магии Света"
 magic_secret.0001.title.shadow: "Скрытый ученик магии Тьмы"
 magic_secret.0001.title.life: "Скрытный адепт магии Природы"
 magic_secret.0001.title.death: "Тайный неофит некромантии"
 magic_secret.0001.title.order: "Скрытный ученик тайных наук"
 magic_secret.0001.title.disorder: "Скрытный претендент на демоническую силу"

 # элементальная магия
 magic_secret.0001.title.elemental_fire: "Скрытое общение с огненными стихиями"
 magic_secret.0001.title.elemental_water: "Скрытое общение с водными стихиями"
 magic_secret.0001.title.elemental_air: "Скрытое общение с воздушными стихиями"
 magic_secret.0001.title.elemental_earth: "Скрытое общение с земными стихиями"

 # резервный вариант
 magic_secret.0001.title: "Тайный практик магии"

 magic_secret.0001.desc.light: "Это пришло ко мне в мгновение озарения — голос извне, призыв к высшей цели. Кто-то за пределами нашего мира счёл меня достойным, добродетельным и достаточно сильным, чтобы творить чудеса Света на Азероте. Я чувствую, как его сила струится сквозь меня, словно нескончаемая песня. Раненая птица, лежащая подо мной в кустах, — милое хрупкое создание, сражённое превратностями природы, — вдруг начинает шевелиться: её крылышко перестаёт кровоточить и встаёт на место, будто время повернулось вспять. Слёзы радости и благодарности застилают мне глаза. \nОднако, как бы я ни стремился употребить эту силу во исцеление больных и обличение нечестивых, общество не согласно. Этот растущий во мне Свет покуда останется скрытым; до тех пор, пока слепые не прозреют."
 magic_secret.0001.desc.shadow: "Я мысленно взываю к Бездне — месту за пределами жизни и здравого рассудка, — как уже делал сто тысяч раз до этого. Я протягиваю руку к маленькой крысе, мечущейся в своей клетке, приказывая её лихорадочным метаниям прекратиться. Внезапно мне кажется, что сердце вырвали из груди, а из тела ушло тепло. Всё затихает, разум проясняется, и крыса замирает стоя, неестественно обмякнув. Я отпускаю её разум и позволяю улыбке скользнуть по лицу. \nДолгие месяцы, даже годы усилий привели к этому мгновению; но я должен оставаться настороже. Силы, с которыми я соприкоснулся, плохо понятны окружающим. Я должен пользоваться этой силой с осторожностью, не давая им увидеть то, чего они не способны постичь."
 magic_secret.0001.desc.life: "Всё случилось разом; самое потрясающее зрелище в моей жизни было не последствиями великой битвы и не выигрышем в карточной игре. Это произошло прямо здесь, в этом саду, под моими сложенными руками... Ряд увядших дынных лоз вдруг налился зелёной жизнью, зацвёл и принёс плоды в мгновение ока. Вокруг меня пели птицы, жужжали насекомые, слышалась возня полевой мыши. Я мысленно окликаю их — и слышу всех так же ясно, как божий день. Магия, которую я так долго искал, сама сущность жизни, столь презираемая моим народом, протянула мне руку помощи, чтобы я исцелил землю, которую мои сородичи разорили и сожгли. Отныне я должен ступать осторожно, чтобы их жестокие взгляды не обратились на меня и я не стал изгоем в глазах всех, кого знаю и люблю."
 magic_secret.0001.desc.death: "Я сворачиваю шею своей последней живой белке, кладу её на забрызганные кровью руны, которые подготовил заранее, и вновь произношу заклинание. Затем я жду и... ничего. \n\n#Italic Проклятье и разрази меня гром!#! Проклятая книга, неужели она никогда не откроет мне своих тайн? Небрежно, в приступе разочарования, я швыряю безжизненного грызуна на кучу гниющих трупов у стены подвала и разворачиваюсь, чтобы уйти. Но, сделав шаг к лестнице, я слышу треск и мерзкий скрип — словно воздух выходит из бочки с вином. Я оборачиваюсь и, к моему потрясению и радости, белка стоит на вершине груды трупов, голова свисает безвольно, как пустой мешок. Наконец-то! У меня получилось! Теперь я могу обратить свой взор к вещам поважнее... \n\nНо нет, я должен быть осторожен. Эти глупцы вокруг меня никогда не поймут власти, которую я обрёл над мёртвыми! Они будут ненавидеть меня, преследовать, отнимать имущество, унижать... Я должен оставаться в тени, пока не стану достаточно силён, чтобы показать им всем, что такое настоящий страх."
 magic_secret.0001.desc.order: "\"Да, да, да... Да! ДА! Нет! НЕТ! НЕТНЕТНЕТНЕТНЕТНЕТ!\" \nКаскад тайной энергии трещит из разлома, что я только что создал; её пурпурные лучи терзают моё тело и сотрясают мою мастерскую, превращая точные инструменты и драгоценные книги в хаос. Мне требуется мгновение, чтобы собраться с духом и произнести заклинание, которое я выучил именно на такой случай; если бы я не потерял голову от этой знаменательной удачи, всего этого беспорядка можно было бы избежать! И всё же, когда портал закрывается, я позволяю себе ещё один заслуженный вопль ликования. \nВ наступившей тишине я задумываюсь, что он мог оказаться последним. Если бы кто-нибудь увидел, что здесь произошло... Ох, глупцы, они бы никогда не поняли! Истинное знание, наука о звёздных энергиях, запрещены в этой унылой земле, где я обитаю. Если я хочу продолжить свои исследования, избежав позорного столба, громких криков больше не будет! \nДа, дальше — только осторожное и тихое изучение... Итак, что же означает эта формула?"
 magic_secret.0001.desc.disorder: "Когда я бормочу последние слова изученного мной заклинания Скверны, рунический круг, вычерченный на полу моей мансарды, начинает светиться ослепительным болезненно-зелёным светом. Сердце моё радуется, я не в силах сдержать восторг и заливаюсь злорадным смехом, а воздух наполняется запахом серы. Я с размаху захлопываю книгу заклинаний, и свет гаснет. \"Демон! — кричу я. — Ты будешь служить...\" — фраза замирает, когда я ищу глазами своего нового подопечного... Где же он? Я чувствую его рядом... Мой взгляд опускается на пол, где, покрытое слизью, маленькое червеобразное создание с миногоподобной пастью противно повизгивает и мурлычет.\nВ ярости я раздавливаю жалкое создание каблуком. Его останки липкие и едкие, они воняют серой и гнилым мясом. \nРади этого я так рисковал? Это ли их \"преступление\" демонологии? Нет, нет, глупцы запретили эту силу неспроста. Это лишь первый шаг, и с должной осторожностью я скоро буду тайно призывать созданий такой мощи и владеть силами такой разрушительной ярости, что все они склонятся предо мной и будут умолять слизать эту слизь с моей тающей подошвы!"
 magic_secret.0001.desc.elemental_fire: "Впервые обратившись к огненной стихии, я был напуган. Я читал о мощи повелителей стихий и о том, что одной мыслью они способны уничтожить целые города. Но когда я протянул к ней свой разум, я ощутил тепло и свет, что были одновременно успокаивающими и волнующими. Пламя плясало передо мной, повинуясь каждой моей команде. Я чувствовал, как его сила струится сквозь меня, и понял: я нашёл своё истинное призвание. Но мне нужно быть осторожным, ведь если кто-нибудь узнает о моём тайном общении с огненной стихией, он наверняка попытается меня уничтожить."
 magic_secret.0001.desc.elemental_water: "Море всегда звало меня; его глубины — загадка и вызов. Когда я впервые обратился к водной стихии, я ощутил связь, одновременно древнюю и мгновенную. Волны откликались на мои мысли, течения гнулись под мою волю. Одним жестом я мог вызвать дождь или утихомирить бурю. И всё же эта сила не лишена опасностей. Если моя тайна раскроется, власти сочтут меня угрозой, и меня будут травить за общение с водной стихией."
 magic_secret.0001.desc.elemental_air: "Порыв ветра, шёпот небес — и я ощутил присутствие воздушной стихии. Словно само дыхание мира избрало меня своим сосудом. Я чувствовал течения и давление, танец облаков и пение птиц. Одной мыслью я мог призвать ветерок или бурю. Но к этой силе нельзя относиться легкомысленно. Если кто-нибудь узнает о моём тайном общении с воздушной стихией, они сочтут меня еретиком и угрозой своему порядку."
 magic_secret.0001.desc.elemental_earth: "Земля грохочет под моими ногами, и я чувствую её силу и устойчивость. Когда я впервые обратился к земной стихии, я ощутил заземляющую силу, соединившую меня с самими костями Азерота. Я мог менять ландшафт, двигать камни и чувствовать биение сердца мира. Но эта сила — палка о двух концах. Если моё тайное общение с земной стихией раскроется, меня сочтут колдуном и угрозой естественному порядку."

 # варианты
 magic_secret.0001.opt.diplomacy: "У меня глубокие связи, и я доверяю тем, кто прикроет меня. Я скроюсь у всех на виду."
 magic_secret.0001.opt.diplomacy.tt: "Ваш высокий навык [diplomacy|U] снижает шанс случайно раскрыть ваше тайное использование магии."
 magic_secret.0001.opt.intrigue: "Хранить тайны — моё призвание. Никто и никогда не узнает!"
 magic_secret.0001.opt.intrigue.tt: "Ваш высокий навык [intrigue|U] снижает шанс случайно раскрыть ваше тайное использование магии."
 magic_secret.0001.opt.martial: "Никто не посмеет усомниться во мне — разве что захочет опозорить моих рыцарей и встретиться с их клинками."
 magic_secret.0001.opt.martial.tt: "Ваш высокий навык [martial|U] снижает шанс случайно раскрыть ваше тайное использование магии."
 magic_secret.0001.opt.stewardship: "Мои придворные и подданные знают: либо верить мне на слово, либо закрывать глаза."
 magic_secret.0001.opt.stewardship.tt: "Ваш высокий навык [stewardship|U] снижает шанс случайно раскрыть ваше тайное использование магии."
 magic_secret.0001.opt.learning: "Я глубоко изучил историю и уверен, что смогу сделать всё как надо."
 magic_secret.0001.opt.learning.tt: "Ваш высокий навык [learning|U] снижает шанс случайно раскрыть ваше тайное использование магии."
 magic_secret.0001.opt.normal: "Если цена власти — умение хранить тайну, я с радостью её заплачу."
 magic_secret.0001.opt.normal.tt: "Ваш шанс случайно раскрыть своё тайное использование магии совсем немного снижен."
 magic_secret_defense_martial_success: "Ваш высокий навык [martial|U] снижает шанс случайно раскрыть ваше тайное использование магии."

 ##################################################################
 # magic_secret.1001
 # тайна раскрыта!
 ##################################################################

 # космическая магия
 magic_secret.1001.title.light: "Моя святая магия раскрыта!"
 magic_secret.1001.desc.light: "О моей связи с божественным Светом стало известно по вине [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U]. Враждебные силы, что окружают меня, теперь наверняка попытаются опорочить и преследовать меня — или того хуже..."
 magic_secret.1001.title.shadow: "Мои исследования Тьмы раскрыты!"
 magic_secret.1001.desc.shadow: "О моих доселе тайных исследованиях сил Тьмы стало известно по вине [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U]. Теперь мне грозят преследования тех, кто никогда не поймёт..."
 magic_secret.1001.title.life: "Моё общение с Жизнью раскрыто!"
 magic_secret.1001.desc.life: "О моём общении с силами Жизни стало известно по вине [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U]. Да защитит меня воля Природы от тех, кто теперь пожелает мне зла..."
 magic_secret.1001.title.death: "Моя некромантия раскрыта!"
 magic_secret.1001.desc.death: "Моя практика некромантии раскрыта по вине жалкого педанта — [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U]! Не беда: скоро живые задрожат перед моей силой..."
 magic_secret.1001.title.order: "Мои исследования тайной магии раскрыты!"
 magic_secret.1001.desc.order: "Похоже, из-за [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] стало известно о моих попытках изучить законы тайной магии, лежащие в основе нашей вселенной. Риск был мне известен, но, похоже, эта ставка не сыграла в мою пользу..."
 magic_secret.1001.title.disorder: "Мои исследования Скверны раскрыты!"
 magic_secret.1001.desc.disorder: "Дерзкие глупцы! Из-за ничтожества по имени [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U] стало известно о моём общении со Скверной. Они никогда не поймут! Они не остановят мой путь к истинной силе!"

 # элементальная магия
 magic_secret.1001.title.fire: "Моя магия Огня раскрыта!"
 magic_secret.1001.desc.fire: "Мои исследования магии стихий были раскрыты персонажем [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U]. Почему исследования базовых сил Азерота должны восприниматься именно так?"
 magic_secret.1001.title.water: "Моя магия Воды раскрыта!"
 magic_secret.1001.desc.water: "Мои исследования магии стихий были раскрыты персонажем [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U]. Почему исследования базовых сил Азерота должны восприниматься именно так?"
 magic_secret.1001.title.air: "Моя магия Воздуха раскрыта!"
 magic_secret.1001.desc.air: "Мои исследования магии стихий были раскрыты персонажем [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U]. Почему исследования базовых сил Азерота должны восприниматься именно так?"
 magic_secret.1001.title.earth: "Моя магия Земли раскрыта!"
 magic_secret.1001.desc.earth: "Мои исследования магии стихий были раскрыты персонажем [secret_exposer.Custom2('MyCharacterIntroduction', ROOT.Char)|U]. Почему исследования базовых сил Азерота должны восприниматься именно так?"

 # резервный вариант
 magic_secret.1001.title: "Тайное использование магии раскрыто!"
 magic_secret.1001.desc: "Тайное использование магии раскрыто!"

