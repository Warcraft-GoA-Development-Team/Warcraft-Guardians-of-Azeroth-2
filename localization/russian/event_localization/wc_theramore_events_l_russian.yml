l_russian:
 rocky_island_custom_name: "Скалистый остров"
 rocky_island_custom_name_adj: "Скалисто-островск"
  
 northern_theramore_name: "Северный Терамор"
 northern_theramore_name_adj: "Северо-тераморск"
 southern_theramore_name: "Южный Терамор"
 southern_theramore_name_adj: "Южно-тераморск"
 eastern_theramore_name: "Восточный Терамор"
 eastern_theramore_name_adj: "Восточно-тераморск"
  
 remnants_of_alliance_troops: "Остатки Альянса"
  
 theramore_sm_events.001.t: "Пророк"
 theramore_sm_events.001.desc: "Пока я размышляю о чуме, о том, что происходит и как всё это решить, ко мне подлетает птицеобразное существо. Он назвал себя Пророком, а затем указал на меня пальцем и произнёс:\n\n — Теперь всё зависит от тебя, [Select_CString(ROOT.Char.IsFemale, 'юная чародейка', 'юный чародей' )]. Ты [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] возглавить людей и вести их на запад, в древние земли Калимдора. Только ты сможешь сразиться со злом и спасти этот мир от вечной тьмы."
 theramore_sm_events.001.a: "Я чувствую в нём огромную силу. Возможно, он прав."
 theramore_sm_events.001.b: "Его слова бессмысленны."
 theramore_events.001.tooltip.a: "Вы #P покинете#! #V Восточные королевства#! ."
 theramore_events.001.tooltip.b: "Вы решаете #P остаться#! и #P защитить#! вашу #V родину#! ."
  
 theramore_sm_events.002.t: "Поиски Калимдора"
 theramore_sm_events.002.desc: "Мы попали в сильный шторм, который сбил нас с курса, словно сама природа не хотела, чтобы мы достигли западного континента. Да славится [ROOT.Char.GetFaith.WaterGodName], мы пережили ночь без особых потерь. Когда шторм утих, капитаны флота заспорили о правильности прокладки курса, но последнее слово осталось за мной."
 theramore_sm_events.002.a: "Сюда! Мы должны плыть дальше на север."
 theramore_sm_events.002.b: "Поверьте, мы не сбились с курса."
 theramore_sm_events.002.c: "Плыть как можно дальше на юг."
  
 theramore_sm_events.003.t: "Поиски Калимдора: Штиль"
 theramore_sm_events.003.desc: "Наконец-то мы нашли древние земли. Теперь необходимо определиться с местом высадки. Капитаны высказывают различные предложения. От этого решения будет зависеть судьба нашего народа на многие века вперёд."
 theramore_sm_events.003.a: "Восточный берег"
 theramore_sm_events.003.b: "Западный берег"
 theramore_sm_events.003.c: "Этот остров позади - отличный плацдарм."
 theramore_sm_events.003.d: "Северный берег"
 theramore_sm_events.003.e: "Южный берег"
 theramore_sm_events.003.f: "На том берегу были замечены орки"
  
 theramore_sm_events.004.t: "Это же Калимдор, да?"
 theramore_sm_events.004.desc: "Итак, в конце концов мы нашли древнюю землю. Мои люди уверены: это Калимдор! Мы остановим Тьму, но сначала надо разгрузить припасы и обосноваться. Местные племена встретили нас довольно агрессивно. Нынешние земли явно недостаточны для пришедших сюда поселенцев. Мы должны очистить эти земли и дать нашему народу новый дом."
 theramore_sm_events.004.a: "Так каков план?"
  
 theramore_sm_events.005.t: "Новая родина"
 theramore_sm_events.005.desc: "Война была выиграна, и наши люди начали заселять землю. Многие из моих подданных стали предлагать различные названия для новой нации человечества. Как же нам его назвать?"
 theramore_sm_events.005.a: "Шшш… Я пытаюсь думать"
 theramore_sm_events_005_tooltip: "Герцогство [new_theramore_duchy.GetNameNoTier] будет переименовано в #L Терамор#! и получит новый #S герб#!"
  
 theramore_sm_events.006.t: "Основание Терамора"
 theramore_sm_events.006.desc: "[theramore_ruler.GetFirstNameNoTooltip] [theramore_ruler.GetHouse.GetNameNoTooltip] [Select_CString(theramore_ruler.IsFemale, 'возглавила', 'возглавил' )] беженцев из Восточных королевств в странствии на запад. [Select_CString(theramore_ruler.IsFemale, 'Её', 'Его' )] люди уверены, что они наконец-то нашли древние землие Калимдора. Они назвали свой новый дом Терамором."
 theramore_sm_events.006.a: "Интересно.."
  
 theramore_events.100.t: "Пророк"
 theramore_events.100.desc: "Пока я следую в [GetGlobalVariable('stratholme').Title.GetNameNoTierNoTooltip], ко мне подлетает птицеобразное существо. Он назвал себя Пророком, и затем произнёс:\n\n — Приветствую тебя, [Select_CString(ROOT.Char.IsFemale, 'юная принцесса', 'юный принц' )]. Нам нужно поговорить. Это королевство обречено! Тьма уже спустилась на землю и ничто не в силах остановить её. Если ты действительно хочешь спасти свой народ, уводи его вдоль моря... на запад."
 theramore_events.100.a: "Бежать? Моё место здесь."
  
 theramore_events.101.t: "Людская экспедиция"
 theramore_events.101.desc: "Я [Select_CString(ROOT.Char.IsFemale, 'решила', 'решил' )] прислушаться к словам пророка. Я [Select_CString(ROOT.Char.IsFemale, 'собрала', 'собрал' )] всех верных людей, тех, кто уже потерял свои дома, и тех, кто осознал опасность надвигающейся чумы. Вторую группу [Select_CString(my_second_half.IsFemale, 'возглавила моя союзница', 'возглавил мой союзник' )] [ROOT.Var('my_second_half').Char.GetFullNameNoTooltipRegnal]. \n\n — Народ мой, под нашим командованием находится самый могущественный флот. Мы должны быть готовы отправиться в странствие как можно скорее. Мы, лордеронцы, не раз доказывали, что никогда не будем покорены, пока мы едины. Мы не должны позволить врагам разобщить нас."
 theramore_events.101.a: "Встаньте в один ряд с нами, и мы победим даже саму Чуму."
  
 theramore_events.103.a: "Мы не сбились с курса, полный вперёд!"
 theramore_events.103.tooltip: "Каждый [courtier|El] получит #N ранение#! с вероятностью в #V 10%#!"
  
 theramore_events.104.t: "Калимдор"
 theramore_events.104.a: "За Альянс!"
 theramore_dustwallow_tooltip: "Королевство [GetTitleByKey('k_dustwallow').GetNameNoTier] будет переименовано в #L Терамор#! и получит новый #S герб#!"
 theramore_eastern_tooltip: "Герцогство [GetTitleByKey('d_theramore').GetNameNoTier] будет переименовано в #L Восточный Терамор#! и получит новый #S герб#!"
 theramore_northern_tooltip: "Герцогство [GetTitleByKey('d_brackenwall').GetNameNoTier] будет переименовано в #L Северный Терамор#! и получит новый #S герб#!"
 theramore_southern_tooltip: "Герцогство [GetTitleByKey('d_quagmire').GetNameNoTier] будет переименовано в #L Южный Терамор#! и получит новый #S герб#!"
  
 theramore_events.106.t: "Предназначенные друг другу"
 theramore_events.106.desc: "Мои подданные всё чаще намекают мне на необходимость брака. При нынешних обстоятельствах [ROOT.Var('my_second_half').Char.GetFirstNameNoTooltip] кажется наиболее выгодной партией."
 theramore_events.106.desc.love: " Наша любовь станет опорой, на которой будет построена новая нация."
 theramore_events.106.desc.normal: " Мы должны быть едины, чтобы не стать жертвой окружающих нас хищников."
 theramore_events.106.a: "Отправить предложение."
 theramore_events.106.b: "Мы слишком заняты в данный момент."
 theramore_events.106.grand_wedding: "Вами обещана #V $activity_wedding$#!"
 theramore_events.106.tooltip.she.a: "Она #P принимает#! ваше предложение о браке"
 theramore_events.106.tooltip.she.b: "Она #N отвергает#! ваше предложение о браке"
 theramore_events.106.tooltip.he.a: "Он #P принимает#! ваше предложение о браке"
 theramore_events.106.tooltip.he.b: "Он #N отвергает#! ваше предложение о браке"
  
 theramore_events.107.a: "Принять предложение о заключении брака"
 theramore_events.107.b: "Отвергнуть предложение о заключении брака"
 theramore_events.107.tooltip.contract: "Ваш [contract|El] будет изменён: будет добавлен пункт #P $religious_rights_protected$#!"
  
 theramore_events.110.desc: "Война выиграна, и наши люди начинают заселять землю. Многие из моих подданных начинают восхвалять меня. Теперь они не так пессимистично смотрят на наше будущее."
 theramore_events.110.a: "За Свет."
  
 theramore_events.111.desc: "[theramore_ruler.GetFirstNameNoTooltip] [theramore_ruler.GetHouse.GetNameNoTooltip] и [theramore_ruler2.GetFirstNameNoTooltip] [theramore_ruler2.GetHouse.GetNameNoTooltip] возглавили беженцев из Восточных королевств в странствиях на запад. Их народ уверен, что они наконец-то нашли древние земли Калимдора. Их новый дом получил название Терамор."
  
 theramore_events.200.opening.a: "[letter_sender.Custom2('AppropriateGreeting', ROOT.Char)]"
 theramore_events.200.opening: "Эти земли обречены! Если вы действительно хотите спасти свой народ, присоединяйтесь ко мне; ведите ваш народ на запад, к древним землям Калимдора. Мы отплываем прямо сейчас, [Select_CString(ROOT.Char.IsFemale, 'миледи', 'милорд' )]."
 theramore_events.200.a: "Я в деле."
  
 theramore_events.201.opening.a: "[accepted_person.Custom2('AppropriateGreeting', ROOT.Char)]"
 theramore_events.201.opening: "[Select_CString(ROOT.Char.IsFemale, 'Миледи', 'Милорд' )], мой народ готов поддержать вашу экспедицию на запад. Только скажите, и мы сделаем всё, что потребуется."
 theramore_events.201.a: "Приятно слышать."
  
 theramore_events.203.desc: "Мы попали в жестокий шторм, который сбил нас с курса, словно сама природа не хотела, чтобы мы достигли западного континента. Да славится [ROOT.Char.GetFaith.WaterGodName], мы пережили ночь без особых потерь. Когда буря стихла, капитаны флота заспорили о правильности прокладки курса, но последнее слово осталось за персонажем [fleet_captain.GetFirstNameNoTooltip] [fleet_captain.GetHouse.GetNameNoTooltip]."
 theramore_events.203.a: "[Select_CString(fleet_captain.IsFemale, 'Леди', 'Лорд' )] [fleet_captain.GetFirstNameNoTooltip], прошу Вас, выслушайте меня!"
  
 theramore_events.204.desc: "Мы наконец-то нашли древние земли. Теперь необходимо определиться с точным местом высадки. Я и другие капитаны высказываем различные предложения."
 theramore_events.204.a: "Это решение определит судьбу нашего народа!"
  
