l_english:

 ARG.001_TITLE:1 "Order of the Argent Dawn"
 ARG.001_DESC:0 "All those loyal towards the Argent cause have been gathered! The forces of the merciful [GetFaithByKey('argent').HighGodName] are no longer scattered.\n\nUnited by the will to save Lordaeron from collapse, the council and leaders of the [GetTitleByKey('e_argent_dawn').GetName] swore an oath to wipe away the presence of evil from Lordaeron and help those in need."
 ARG.001_OPT_A:0 "Warriors of the needy are here!"
