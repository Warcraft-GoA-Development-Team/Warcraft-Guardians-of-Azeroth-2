l_russian:
  
 personal_adventure.001.t: "Тревога Калии"
 personal_adventure.001.desc: "Слухи о загадочной болезни в Лордероне рождают тревогу во мне. Благополучие моей семьи тяжким грузом лежит на сердце, особенно зная, что мой отец до сих пор не знает о существовании внучки. Решение тяжёлое, но ради их безопасности я должна отправить мужа и дочь прочь. Прижимая дочь к себе, я вновь ощущаю её невинность, напоминающую мне о светлых днях. «Будь сильна, любовь моя, — шепчу я тихо, — наши сердца всегда будут связаны, какой бы ни была дистанция». Их уход нависает чёрным облаком над неопределённым будущим. Но куда же мне их отправить?"
 personal_adventure.001.a: "Кель'Талас"
 personal_adventure.001.b: "На юг, в Стромгард"
 personal_adventure.001.c: "Штормград"
 personal_adventure.001.d: "Кул-Тирас"
 personal_adventure.001.e: "Пусть их судьбу решит отец, я сосредоточусь на своих делах"
 personal_adventure.001.e.tooltip: "Вы продолжите #P играть#! за #high Калию#!"
 custom_lordaeron_refugees: "Лордеронские беженцы"
 custom_lordaeron_refugees_adj: "лордеронск."
  
 personal_adventure.002.t: "Мой путь, мой выбор"
 personal_adventure.002.intro: "Недавно мне исполнилось шесть лет, и настало время выбрать того, кто станет учить меня миру. Это решение кажется судьбоносным, словно оно изменит всё.\n\n"
 personal_adventure.002.uther.lich_king: "Утер, некогда наставник Артаса до его трагического падения в Ледяного Короля. Его наставления могли бы научить меня чести и пути Света.\n\n"
 personal_adventure.002.uther.normal: "Утер, наставник Артаса. Образец чести и праведности, его учения могут повести меня по пути Света, как и моего дядю.\n\n"
 personal_adventure.002.tirion: "Тирион Фордринг, знаменитый паладин. Его мудрость научит меня чести, справедливости и силе воли.\n\n"
 personal_adventure.002.alexstrasza: "Алекстраза, Хранительница Жизни, вся её суть — защита жизни. У неё я могла бы научиться состраданию и заботе.\n\n"
 personal_adventure.002.sylvanas: "Сильвана — сильная и умная. У неё я могла бы научиться стойкости и стратегии.\n\n"
 personal_adventure.002.vereesa: "Вереса Виндраннер, искусная лучница и лидер Серебряного Союза. Её наставления покажут мне важность точности и решимости.\n\n"
 personal_adventure.002.top_liege: "Наш верховный сюзерен, личность великой власти и мудрости, может направить меня в постижении искусства правления. [Select_CString(teacher_3.IsFemale, 'Её', 'Его')] наставления будут бесценны для подготовки к будущему Лордерона.\n\n"
 personal_adventure.002.scarlet: "Кто-то из Алого Ордена, фанатичный и несгибаемый. Он научит меня убеждённости и силе.\n\n"
 personal_adventure.002.father: "Мой отец, тот, кому я доверяю больше всех. Он всегда был рядом. Он сможет научить меня ценностям и наследию нашей семьи.\n\n"
 personal_adventure.002.end: "Каждый путь имеет свою ценность, но какой приведёт меня к моей истинной судьбе?"
 personal_adventure.002.a: "[teacher_1.GetFirstNameNoTooltip] [teacher_1.GetHouse.GetNameNoTooltip]"
 personal_adventure.002.b: "[teacher_2.GetFirstNameNoTooltip] [teacher_2.GetHouse.GetNameNoTooltip]"
 personal_adventure.002.c: "[teacher_3.GetFirstNameNoTooltip] [teacher_3.GetHouse.GetNameNoTooltip]"
 personal_adventure.002.d: "[teacher_4.GetFirstNameNoTooltip] [teacher_4.GetHouse.GetNameNoTooltip]"
 personal_adventure.002.e: "Папа!"
  
 rival_seduced_my_daughter: "[TARGET_CHARACTER.GetShortUIName|U] соблазнил дочь [CHARACTER.GetShortUIName|U]"
 rival_seduced_my_daughter_corresponding: "[CHARACTER.GetShortUIName|U] соблазнил дочь [TARGET_CHARACTER.GetShortUIName|U]"
 personal_adventure.003.t: "Тайна раскрыта"
 personal_adventure.003.desc: "Моя мать открывает моё существование деду. Я — дитя тайного союза, скрытая часть этого рода. Как отреагирует дед? Увидит ли он во мне законную наследницу или пятно на чести семьи?"
 personal_adventure.003.a: "Д... дедушка?.."
  
 personal_adventure.004.t: "Дилемма отца"
 personal_adventure.004.desc: "Сегодня Калия открыла мне тайну, потрясшую саму основу нашей семьи. Существование Терении, её дочери и моей внучки, рождённой в тайном браке. Моё сердце разрывается между чувством предательства и неожиданной радостью от того, что у меня есть ещё одна наследница."
 personal_adventure.004.a: "Она моя внучка, и я приму её"
 personal_adventure.004.b: "Я не могу принять этого ребёнка"
  
 personal_adventure.005.t: "Урок мастерства"
 personal_adventure.005.desc: "Когда первые лучи утреннего солнца пробиваются сквозь ставни, я ощущаю, что сегодняшний день будет особенным. С каждым уроком мой учитель передаёт мне не только знания, но и формирует моё мировоззрение. Сегодня [ROOT.Var('my_guardian').Char.GetSheHe] пообещал раскрыть один из величайших секретов своего мастерства.\n\nПод его внимательным взглядом я погружаюсь в учение, стараясь уловить каждую деталь, каждый нюанс наставлений. Моё внимание приковано к словам, а руки сами повторяют сложные движения и узоры, отточенные в его ремесле.\n\nЧто принесёт сегодняшний урок? Искусство стратегии, тонкости дипломатии или секреты боевого мастерства? Сердце бьётся чаще в предвкушении — ведь именно сегодня может открыться нечто, что навсегда изменит мою судьбу.\n\nКогда мой учитель начинает свою речь, я впитываю каждое слово. Этот день, без сомнения, оставит след в моей душе и поведёт меня к новым вершинам на моём пути."
 personal_adventure.005.a: "Я приму эти наставления к сердцу и постараюсь применить их в жизни"
  
 personal_adventure.006.t: "Путь учения"
 personal_adventure.006.desc: "С восходом солнца над королевством я начинаю ещё один день познания и открытий. Под руководством моего уважаемого учителя каждый день становится путешествием в новые области знаний и умений. Будь то искусство дипломатии, тонкости придворных интриг или стратегии войны — мой разум впитывает уроки, словно губка.\n\nСегодня мой учитель подготовил особый урок, который обещает развить во мне определённый талант. С нетерпением ожидая его начала, я задаюсь вопросом: какому новому навыку я научусь к концу дня, формируя свой путь к будущему величию?"
 personal_adventure.006.a: "Я готов учиться и преуспевать"
  
 personal_adventure.007.t: "Испытание воина"
 personal_adventure.007.desc: "С каждым днём я ощущаю, что становлюсь сильнее — и телом, и духом. Моя подготовка под руководством наставника — это не просто умение сражаться; это постижение дисциплины и стойкости истинного воина.\n\nСегодня [ROOT.Var('my_guardian').Char.GetSheHe] подготовил для меня тяжёлое испытание, проверку того, чему я научился за эти годы. Держа меч в руках, я чувствую всю тяжесть момента. Это не просто проверка — это обряд посвящения, шанс доказать себе и другим, что я готов встретить любые испытания."
 personal_adventure.007.a: "Это мой момент! Ааааах!"
  
 personal_adventure.050.t: "Падение льда"
 personal_adventure.050.desc: "Мой шестнадцатый день рождения знаменует собой особый момент наследия. На тайной встрече верные слуги нашего дома представляют реликвии, спасённые из руин Лордерона. Среди этих сокровищ я нахожу Доспехи Ледопада, сверкающие в свете факелов — часть истории, о существовании которой я и не подозревал. Холод металла на моей коже связывает меня с родом, а вес доспехов олицетворяет будущее, которое мне предстоит принять. Эти доспехи, открывшиеся теперь как символ нашей силы и надежды, становятся моим наследием."
 personal_adventure.050.a: "Я принимаю это наследие"
  
 personal_adventure.055.t: "Перекрёсток судьбы"
 personal_adventure.055.desc.lorderon.northrend: "Будучи одним из последних потомков павшего Дома Менетилов, я стою перед трудным выбором. Отправиться ли сначала в Нордскол, чтобы бросить вызов Королю-Личу и завоевать славу и уважение, которые помогут в восстановлении Лордерона? Или сперва сосредоточиться на возвращении и укреплении земель Лордерона, утвердив мою власть и подготовившись к куда более суровой битве с Королём-Личом?\n\nНа заре моего правления шёпот судьбы становится всё громче. Король-Лич, тень над нашим миром, зовёт меня на схватку, которой нельзя избежать. Сердце жаждет мести и справедливости за Лордерон, но истинная угроза — на ледяном севере. Это решение определит не только мой путь, но и судьбу наших земель. Куда же я поведу свой народ?"
 personal_adventure.055.desc.lorderon: "Будучи одним из последних потомков павшего Дома Менетилов, я стою в переломный момент истории. Наследие моих предков тяжким грузом лежит на моих плечах, зовя вернуть утраченные земли Лордерона. Эта миссия — не просто возвращение наследия, но и шанс исцелить раны прошлого и возродить наследие Менетилов. С решимостью и надеждой я вступаю в это путешествие, чтобы вернуть Лордерону былое величие, исполняя судьбу своего рода."
 personal_adventure.055.desc.northrend: "Будучи одним из последних потомков павшего Дома Менетилов, я стою перед судьбоносным решением. Эхо прошлого моей семьи зовёт меня отправиться в Нордскол. Там, в тени Короля-Лича, угрожающего всей жизни, предстоит схватка. Этот путь полон опасностей, но долг перед предками и стремление к справедливости ведут меня вперёд. Это путешествие проверит мою решимость и определит будущее наших земель. С решимостью в сердце я отправляюсь в Нордскол навстречу судьбе."
 personal_adventure.055.desc.gohomefallback: "Прошли годы с тех пор, как я в последний раз видел свою мать, королеву Калию Менетил, и многое изменилось. С падением Короля-Лича и восстановлением Лордерона под её властью мой путь ведёт меня на долгожданную встречу. Прогуливаясь по залам нашего родового дома, теперь оживлённого и восстановленного, я вспоминаю наше общее прошлое и разные дороги, что мы прошли. Эта встреча — не просто возвращение; это возможность осмыслить пройденный путь и будущее, которое нам предстоит строить вместе. Какие откровения принесёт эта встреча и как она повлияет на наше наследие?"
 personal_adventure.055.option_northrend: "В Нордскол. Пора положить конец владычеству Короля-Лича"
 personal_adventure.055.option_lordaeron: "В Лордерон. Наши земли предков зовут к восстановлению"
 personal_adventure.055.option_becomelandless: "Месть, власть, мир... Мне это не интересно"
 personal_adventure.055.option_gohomefallback: "К моей матери. Встреча слишком долго откладывалась"
  
 personal_adventure.100.t: "Пустая цитадель"
 personal_adventure.100.desc: "Когда мы подходим к Цитадели Ледяной Короны, нас встречает зловещая тишина. Весть о падении Короля-Лича опередила нас, наложив горько-сладкую тень на нашу миссию. Воздух пропитан смесью облегчения и неопределённости. Мы готовились к яростной битве, но теперь стоим у ворот цитадели без хозяина. Вопросы о будущем и судьбе тех, кто находился под властью Короля-Лича, повисли в воздухе. Этот момент знаменует конец эпохи террора, но также начало новой, полной неизвестности главы."
 personal_adventure.100.a: "Ну что ж... домой?"
  
 personal_adventure.101.t: "Прибытие в Нордскол"
 personal_adventure.101.desc: "Лютые ветра Нордскола встречают нас, когда мы ступаем на замёрзшую землю. Под моим руководством экспедиция быстро возводит лагерь — одинокий маяк в этом ледяном краю. Пока мы готовимся к предстоящей битве с Королём-Личом, воздух наполняется напряжением и решимостью. Это начало нашего последнего сражения против тьмы, что терзала наш мир."
 personal_adventure.101.desc.bonus: "\n\n#help (Оружейники Лордерона усиливают экспедицию)#!"
 personal_adventure.101.a: "Наша судьба ждёт нас в этой ледяной земле"
 personal_adventure.102.desc: "Лютые ветра Нордскола встречают нас, когда мы ступаем на замёрзшую землю. Экспедиция под руководством Терении Менетил быстро возводит лагерь — одинокий маяк в этом ледяном краю. Пока мы готовимся к предстоящей битве с Королём-Личом, воздух наполняется напряжением и решимостью. Это начало нашего последнего сражения против тьмы, что терзала наш мир."
 personal_adventure.102.a: "Перед нами грозное испытание"
 personal_adventure.103.desc: "Вести из замёрзших земель Нордскола рассказывают о дерзкой экспедиции под предводительством Терении Менетил. Отважные души обосновали лагерь в самом сердце ледяной пустоши, готовясь к решающему столкновению с Королём-Личом. Напряжение и ожидание сотрясают весь мир, знаменуя начало великой битвы против тьмы, угрожающей всему Азероту."
 personal_adventure.103.a: "Для Азерота наступает решающий момент"
  
 personal_adventure.105.t: "Призыв в Нордскол"
 personal_adventure.105.desc: "Прибывает гонец с важнейшим приглашением. Терения Менетил собирает мощную экспедицию в Нордскол с единственной целью — сразиться с Королём-Личом и уничтожить его. Это призыв к оружию для тех, кто достаточно храбр, чтобы встретить ужасы ледяного севера и стать частью битвы, способной изменить ход истории. Отзовёшься ли ты на этот зов и присоединишься к тем, кто осмелился бросить вызов тьме у её истоков?"
 personal_adventure.105.a: "Я присоединюсь к битве"
 personal_adventure.105.b: "Мы заняты. Убирайся, мальчишка"
  
 personal_adventure.106.t: "Король-Лич ждёт"
 personal_adventure.106.desc: "Тяжёлая тишина окутывает нас, когда мы встаём лицом к лицу с Королём-Личом. Леденящий воздух застывает, словно перед бурей битвы. Каждый воин понимает серьёзность момента, осознавая, что он может стать последним. В этом зловещем молчании лишь холодный пронзительный взгляд Короля-Лича подтверждает, что время не замерло. Воздух искрит от ожидания и страха — решающее столкновение уже близко."
 personal_adventure.106.a: "Или мы, или никто!"
 raid_member_died_sm.t: "Участник рейда пал"
 raid_member_died_sm.desc: "[dying_person.GetShortUIName|U] был убит Королём-Личом"
 personal_adventure.106.duel.failure: "Король-Лич одерживает победу"
  
 personal_adventure.110.t: "Падение Короля-Лича"
 personal_adventure.110.desc: "После изнурительной битвы над Цитаделью Ледяной Короны воцаряется глубокая тишина. Король-Лич повержен, его царствование ужаса наконец завершено. Измученные, но триумфальные воины собираются вместе, их сердца тяжелеют от цены победы, но в то же время светлеют от зарождающейся надежды. Этот момент знаменует перелом в истории: конец долгого кошмара и начало светлого будущего."
 personal_adventure.110.a: "Кошмар окончен; надежда восторжествовала!"
  
 personal_adventure.201.t: "Предложение Алого Ордена"
 personal_adventure.201.desc: "Неожиданное предложение открывает передо мной заманчивую возможность: принять алую идеологию. Связанную с фанатичным Алым Орденом, её можно обратить в сильного союзника в борьбе за Лордерон. Но ревностная натура ордена вызывает сомнения. Принятие их доктрины может дать силу и поддержку, но какой ценой? Путь полон неопределённости — станет ли эта вера путеводным светом в освобождении Лордерона или пламенем, что сожжёт всё на своём пути?"
 personal_adventure.201.a: "Я принимаю их идеологию"
 personal_adventure.201.b: "Я отвергаю это фанатичное учение"
  
 personal_adventure.202.t: "Союз ради стратегии"
 personal_adventure.202.desc: "В великом зале собираются послы со всех земель, каждый представляющий жениха для моей Менетил. Каждое предложение несёт не только обещание брака, но и стратегический союз, который может сильно помочь в будущих завоеваниях. От благородных лордов до иностранных принцев — выбор разнообразен и интригуещ. Это решение — не только дело сердца, но и важный шаг в формировании судьбы моей династии."
 personal_adventure.202.a: "[SCOPE.sC('choice_1').GetFullNameNoTooltipRegnal]"
 personal_adventure.202.b: "[SCOPE.sC('choice_2').GetFullNameNoTooltipRegnal]"
 personal_adventure.202.c: "[SCOPE.sC('choice_3').GetFullNameNoTooltipRegnal]"
 personal_adventure.202.d: "[SCOPE.sC('choice_4').GetFullNameNoTooltipRegnal]"
 personal_adventure.202.e: "Я выйду замуж тогда, когда сочту нужным"
  
 personal_adventure.203.t: "Великая миссия"
 personal_adventure.203.desc: "С приближением войны за Лордерон я беру на себя важнейшую дипломатическую миссию. Моя Великая миссия — не просто путешествие; это стратегический ход, чтобы заручиться поддержкой для грядущих битв. Передо мной список влиятельных правителей. Каждый из них может стать союзником, способным переломить исход войны в нашу пользу. Мне предстоит вести переговоры и заключать союзы, создавая коалицию, сильную настолько, чтобы вернуть наш дом.\n\n"
 personal_adventure.203.a: "Начать подготовку к дипломатической миссии"
 personal_adventure.203.b: "Это безумие! Отменить всё!"
 personal_adventure.203.desc.lich_king: "#help Количество визитов: Базовое(3) + Повержен Король-Лич(2)#!"
 personal_adventure.203.desc.base: "#help Количество визитов: Базовое(3) + Король-Лич не повержен(0)#!"
  
 personal_adventure.204.t: "[SCOPE.sC('terenia_menethil').GetFullNameNoTooltipRegnal]: переговоры"
 personal_adventure.204.desc: "Прибытие Терении Менетил вызывает волну интриг при дворе. Молодая леди, заявляющая, что она наследница Лордерона, собирает авантюристов для своей военной кампании. Она лично пришла в наши земли, чтобы заручиться поддержкой. Она представляет амбициозный план по возвращению Лордерона и обещает щедрые награды в обмен на помощь в войне. Однако риск велик: мы можем потерять и деньги, и людей. Стоит ли рискнуть?"
 personal_adventure.204.a: "Ты получаешь мою поддержку... и мою армию"
 personal_adventure.204.b: "Вышвырните эту попрошайку"
  
 personal_adventure.205.t: "[ROOT.Var('current_visiting').Char.GetFullNameNoTooltipRegnal]: переговоры"
 personal_adventure.205.desc: "[ROOT.Var('current_visiting').Char.GetShortUIName] прибудет сегодня днём. Мы уже подготовили лучшие угощения и цветы. Нужно решить, какой подход мы выберем. От этого будет зависеть успех переговоров."
 personal_adventure.205.a: "Это принесёт пользу и нам, и вам"
 personal_adventure.205.b: "Поговорим о божественной природе нашей миссии"
 personal_adventure.205.c: "Ты задолжал моему деду"
 personal_adventure.205.success: "Вы получаете военную и финансовую поддержку"
 personal_adventure.205.success_noble: "Переговоры увенчались успехом"
 personal_adventure.205.failure: "Переговоры провалились"
  
 personal_adventure.211.t: "Возрождение Менетилов"
 personal_adventure.211.desc: "Весть быстро разносится по землям: Терения Менетил высадилась в Лордероне. С решимостью, отражающей её благородное происхождение, она начинает дерзкую миссию по возвращению родовых земель. Её прибытие пробуждает в народе и надежду, и опасения. Устремив взгляд на восстановление былой славы королевства, она открывает новую главу в бурной истории Лордерона. Этот смелый шаг знаменует начало её кампании по возрождению Менетилов."
 personal_adventure.211.a: "Мы будем внимательно наблюдать за её шагами"
  
 personal_adventure.212.t: "Завоевание Лордерона"
 personal_adventure.212.desc: "Передо мной карта Лордерона, каждая область — часть будущего королевства, которое нужно вернуть. Наследие моего рода тяжким грузом лежит на плечах, когда я обдумываю следующий шаг. Нанести ли быстрый удар в сердце врага или использовать более тонкую стратегию, подрывая их силу, пока они не опомнились? Это решение определит не только исход этой войны, но и наследие династии Менетилов.\n\nПора решать будущее Лордерона."
 personal_adventure.212.a: "[SCOPE.sC('war_target_1').GetFullNameNoTooltipRegnal]"
 personal_adventure.212.b: "[SCOPE.sC('war_target_2').GetFullNameNoTooltipRegnal]"
 personal_adventure.212.c: "[SCOPE.sC('war_target_3').GetFullNameNoTooltipRegnal]"
