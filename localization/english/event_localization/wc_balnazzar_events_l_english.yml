l_english:
  BALNAZZAR_DREADLORD_CUSTOM_STRING_KEY:0 "A dreadlord wears a borrowed face and spends a mortal lifetime reaching for a throne that was never his."

  wc_balnazzar_story.1000.title:0 "A Throne of Ash"
  wc_balnazzar_story.1000.desc:0 "Archimonde is dead these many years, and Kel'Thuzad answers to no one who might still answer to me. No order has come from the Legion since Lordaeron fell into ash - no host, no herald, not even a whisper on the wind that once carried Sargeras' will.\n\nDetheroc is gone. Banished by the very Forsaken he thought beneath him, unmade before he even understood what Sylvanas Windrunner had become. Varimathras kneels to her now in this same Undercity - whether in truth or in the same patient pretense I have always favored, I cannot say, and it hardly matters. He does not answer to me either.\n\nThat leaves only this ruined kingdom, and me, and no one left alive who could tell me I am doing this wrong."
  wc_balnazzar_story.1000.a:0 "A crown built to survive its wearer."
  wc_balnazzar_story.1000.a_tooltip:0 "Lets you study Dathrohan as a potential vessel - right-click him to begin"
  wc_balnazzar_story.1000.b:0 "I will improvise, if it comes to that."

  wc_balnazzar_story.1002.title:0 "A Face Not His Own"
  wc_balnazzar_story.1002.desc:0 "Saidan Dathrohan kneels where I bid him, Grand Crusader in name, puppet in truth - his faith in the Light is a leash I hold without his knowing.\n\nThe rest is arithmetic. A body found burned past recognition in the throne room. A dreadlord, dead at last, mourned by no one who matters. And underneath the Crusader's steel and prayer, only me.\n\nBalnazzar dies today. Something wearing his patience does not."
  wc_balnazzar_story.1002.desc_prepared:0 "Saidan Dathrohan kneels where I bid him, Grand Crusader in name, puppet in truth - his faith in the Light is a leash I hold without his knowing. Nothing here is improvised. I have been ready for this exact morning for years.\n\nThe rest is arithmetic. A body found burned past recognition in the throne room. A dreadlord, dead at last, mourned by no one who matters. And underneath the Crusader's steel and prayer, only me.\n\nBalnazzar dies today. Something wearing his patience does not."
  wc_balnazzar_story.1002.a:0 "Wear the mask."
  wc_balnazzar_story.1002.b:0 "Dathrohan is already gone. There is nothing left here worth wearing."
  wc_balnazzar_story.1002.b_tooltip:0 "The story ends here - there is no shell left worth wearing, and nothing left to build toward"

  wc_balnazzar_story.1003.title:0 "The Skin Settles"
  wc_balnazzar_story.1003.desc:0 "Dathrohan's face has not finished becoming mine. I pause before I speak, listening for a voice that used to answer differently, and I catch it every time before anyone else could.\n\nNo matter. Grief wears the same face on any man, and grief is all a Grand Crusader owes his court tonight. Renault's jealousy still needs tending. An army still needs a reason to kneel. And in Stratholme's crypts, an old debt waits on patience it was never promised."
  wc_balnazzar_story.1003.a:0 "Send word to the crypts tonight."
  wc_balnazzar_story.1003.a_tooltip:0 "Kel'Thuzad will already be expecting you, when the time comes"
  wc_balnazzar_story.1003.b:0 "Let the grief run its course first."

  wc_balnazzar_story.1004.title:0 "A Son's Envy"
  wc_balnazzar_story.1004.desc:0 "Renault watches his brother Darion the way a starving man watches a feast - Alexandros' pride, his martial gift, his birthright. Renault has none of it, and knows it, and it eats at him.\n\nI need only water the seed already planted. A word here about how a father favors one son over another. A suggestion that Alexandros means to disinherit him. None of it needs to be true. It only needs to be believed.\n\nKel'Thuzad is already settled - the dead are his to raise, on the day Renault leads his father through. All that's left is Renault himself."
  wc_balnazzar_story.1004.a:0 "Let the boy prove himself to his father."
  wc_balnazzar_story.1004.a_tooltip:0 "Starts a scheme to have Alexandros Mograine assassinated"
  wc_balnazzar_story.1004.b:0 "Renault is beyond reach. The seed dies unplanted."
  wc_balnazzar_story.1004.b_tooltip:0 "The story ends here - without Renault, there is no lever left to move against Alexandros"

  wc_balnazzar_story.1005.title:0 "An Old Understanding"
  wc_balnazzar_story.1005.desc:0 "Kel'Thuzad does not need summoning so much as noticing - a stillness in the crypts that wasn't there before, a voice arriving without a messenger. I tell him what I need: that Stratholme's dead rise thick enough, on the day I finally have cause to send Renault's father through, that no one asks why the ambush succeeded.\n\nHe does not ask for gold, or favor, or even gratitude. Only that I remember, when some ledger comes due, that the dead were his idea first. I agree. It costs me nothing to agree with a corpse."
  wc_balnazzar_story.1005.desc_confirmed:0 "What Kel'Thuzad and I settled the night I sent word needs only saying aloud now, so neither of us mistakes the other's meaning later. Stratholme's dead will rise thick enough, on the day I finally have cause to send Renault's father through, that no one asks why the ambush succeeded.\n\nHe does not ask for gold, or favor, or even gratitude - he never did. Only that I remember, when some ledger comes due, that the dead were his idea first. I agreed to that already. Saying it again costs me nothing."
  wc_balnazzar_story.1005.a:0 "Agree to his price."
  wc_balnazzar_story.1005.b:0 "Kel'Thuzad is gone. The dead will rise on their own account, or not at all."
  wc_balnazzar_story.1005_pact_tooltip:0 "Seals your understanding with Kel'Thuzad - clears the way to turn Renault against his father"

  wc_balnazzar_story.1006.title:0 "Blood on Silver"
  wc_balnazzar_story.1006.desc:0 "Renault comes to me after, hollow-eyed, empty-handed - he could not carry the blade any further than the doorway he killed his father in. I offer him what a father never quite managed - approval, dressed as duty.\n\nThe Order kneels to its Grand Crusader, as it always has. It simply doesn't know yet what he's Grand Crusader of.\n\nSilver was always a borrowed color, a knight's shine lent by a light that was never truly the Order's to keep. I have it dyed properly, at last. The lion on white stays - Lordaeron's own, unmistakable even now - but the beast itself runs red, the way everything under this banner eventually does.\n\nWhat was a kingdom's crown and a kingdom's second crown beside it - Lordaeron's own throne, and Stratholme's, the ground this Crusade was born standing on - answers to the Order now, not to whatever was left holding either title. I did not have to conquer the paperwork. Alexandros' death did that for me, and Renault's hand did the rest.\n\nA banner needs an army under it before anyone takes the color seriously. I raise one - not a garrison, a host, drawn from every hall the Order still commands - and give it a purpose older than the color itself: answer the dead with the dead's own patience, until there's nothing left in Lordaeron that still remembers how to rise."
  wc_balnazzar_story.1006.a:0 "Let the Scarlet Crusade be born."
  wc_balnazzar_story.1006.a_tooltip:0 "Seizes the Order of the Silver Hand, refounds it as the Scarlet Crusade, converts your realm to Scarletism and your own culture to Lordaeronian, and raises its founding army"
  wc_balnazzar_story.1006.b:0 "Without Renault, there is no Order left to inherit."
  wc_balnazzar_story.1006.b_tooltip:0 "The story ends here - without Renault, there is no Order left to inherit"
  scarlet_crusade_custom_name:0 "Scarlet Crusade"

  wc_balnazzar_story.1007.title:0 "Stratholme Falls"
  wc_balnazzar_story.1007.desc:0 "The city is ours. Whatever crawled through its streets since Arthas' purge has been put to the sword a second time, and the banners going up over its gates are Scarlet, not silver skulls.\n\nThe old faith isn't burned out yet - that will take longer than a single battle. But the ground it stood on belongs to me now."
  wc_balnazzar_story.1007.a:0 "Let it burn cleaner, in time."

  wc_balnazzar_story.1008.title:0 "The Ashes Made Whole"
  wc_balnazzar_story.1008.desc:0 "Stratholme is ours again - every street, every farm, every soul in it burned clean of whatever it believed before. New Avalon stands beside it, a monument built on ground that used to belong to Kel'Thuzad's silence.\n\nThe Order I inherited never held this much of its own founding city. I have. Word of it will travel further than I'd like - but let them talk. A kingdom that fears you is already halfway to kneeling."
  wc_balnazzar_story.1008.a:0 "Let them talk."

  wc_balnazzar_story.0100.title:0 "The Failing Shell"
  wc_balnazzar_story.0100.desc:0 "This body is failing - slower than a mortal's, faster than it should for what I really am. No heir waits to take up Dathrohan's name when it goes, and a name with no one to inherit it is a debt with no one left to collect it.\n\nI could let it end quietly, and trust whoever inherits the throne to sort out the rest. Or I could make certain something far worse than an empty title is waiting for whoever comes looking."
  wc_balnazzar_story.0100.a:0 "Make sure something worse is waiting."
  wc_balnazzar_story.0100.b:0 "Let it end quietly."

  wc_balnazzar_story.0101.title:0 "A Familiar Stranger"
  wc_balnazzar_story.0101.desc:0 "Grand Crusader Dathrohan has not been himself. Small things - a turn of phrase, a flash of temper that isn't like him, the way he sometimes looks at his own reflection like it's a stranger's. I have said nothing. Not yet."
  wc_balnazzar_story.0101.a:0 "Reassure them. Whatever they think they saw, it was nothing."
  wc_balnazzar_story.0101.b:0 "Have them quietly imprisoned before they say this to anyone else."
  wc_balnazzar_story.0101.c:0 "Say nothing. Let them keep wondering."

  wc_balnazzar_story.0102.title:0 "Under the Ashes"
  wc_balnazzar_story.0102.desc:0 "The purge continues, county by county, faith by faith. It is necessary work. It is also work best done quietly - and quiet work invites quiet eyes."
  wc_balnazzar_story.0102.a:0 "Continue."
  wc_balnazzar_story.0102.a_tooltip:0 "Someone among your court has noticed something wrong about you"

  wc_balnazzar_story.2000.title:0 "The Mask Comes Off"
  wc_balnazzar_story.2000.desc:0 "The shell was never going to last - stolen flesh ages faster than it should, and even the most careful lie eventually meets someone clever enough, or stubborn enough, to see through it. I have spent years being patient. Patience was only ever a tool.\n\nSaidan Dathrohan dies here, properly this time. Let the rest of the Crusade march on without him, chasing a war I no longer need. Stratholme was always the only piece of it that was ever truly mine."
  wc_balnazzar_story.2000.a:0 "Take Stratholme. Let the rest of the Crusade have its war."
  wc_balnazzar_story.2000.a_tooltip:0 "Reveals your true nature, breaks your capital and every held duchy away from the Crusade, and raises the Risen to hold them"
  the_risen:0 "The Risen"
