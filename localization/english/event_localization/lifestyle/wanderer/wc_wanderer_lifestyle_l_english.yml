l_english:

 wanderer_lifestyle_events.30.a.tt_wc: "You may gain extra [wanderer_lifestyle|E] Experience or [stress_loss|E] if you [travel|E] through the region mentioned in the story."

 wanderer_lifestyle_events.30.desc_wc: "Perusing my books, I find myself reading a travel journal from a famed and well-traveled merchant and am captivated by a certain anecdote:\n\n"#emp Making our way through the wilderness of [ROOT.Char.Custom('DistantLandsLoc')], [ROOT.Char.Custom('DistantLandsObservationTypeLoc')]. From what we could see of the creature [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')]. Truly there is nothing else like it in the world!#!"\n\nBefore long I find myself daydreaming about encountering one such beast in the wild one day."

 DistantLandsQuelthalas: "Quel'thalas"
 DistantLandsLordaeron1: "the Arathi Highlands"
 DistantLandsLordaeron2: "Gilneas"
 DistantLandsLordaeron3: "the Hinterlands"
 DistantLandsKhazModan1: "Dun Morough"
 DistantLandsKhazModan2: "the Loch Modan region"
 DistantLandsKhazModan3: "the Badlands"
 DistantLandsKhazModan4: "the Searing Gorge"
 DistantLandsAzeroth1: "Westfall"
 DistantLandsAzeroth2: "Stranglethorn Vale"
 DistantLandsAzeroth3: "Duskwood Forest"
 DistantLandsAzeroth4: "the Black Morass"
 DistantLandsNorthKalimdor1: "Ashenvale"
 DistantLandsNorthKalimdor2: "Azshara"
 DistantLandsNorthKalimdor3: "Winterspring"
 DistantLandsNorthKalimdor4: "Darkshore"
 DistantLandsCentralKalimdor1: "the Stonetalon Mountains"
 DistantLandsCentralKalimdor2: "Desolace"
 DistantLandsCentralKalimdor3: "Barrens"
 DistantLandsCentralKalimdor4: "the Dustwallow Marshes"
 DistantLandsSouthKalimdor1: "Tanaris"
 DistantLandsSouthKalimdor2: "Un'Goro Crater"
 DistantLandsSouthKalimdor3: "Feralas"
 DistantLandsSouthKalimdor4: "Thousand Needles"

 DistantLandsQuelthalas_observation: "our group caught sight of a Dragonhawk soaring amongst the golden-leaved treetops"
 DistantLandsQuelthalas_description: "its brilliantly colored scales and feathers rippled with an iridescent sheen"

 DistantLandsLordaeron1_observation: "our traveling party was met with the gruesome sight of a Giant Tarantula feeding upon its prey"
 DistantLandsLordaeron1_description: "its fur was glistening white and finer than silk, rippling over its shiny black carcass"
 DistantLandsLordaeron2_observation: "our caravan passed a large tree hollow, where an elusive Blackwald Fox paused to observe us warily"
 DistantLandsLordaeron2_description: "its stocky body was covered in bright red fur, and its eyes glowed luminous gold"
 DistantLandsLordaeron3_observation: "a Gryphon swooped overhead as we camped and screeched its powerful and piercing cry"
 DistantLandsLordaeron3_description: "its alabaster feathers and golden fur shone as it soared over the treetops"

 DistantLandsKhazModan1_observation: "we stopped in our tracks, seized with fear at the sight of the great Grizzly Bear"
 DistantLandsKhazModan1_description: "the beast bristled with thick brown fur and its claws were as big as falchion blades"
 DistantLandsKhazModan2_observation: "we paused to fish for a moment and one of our number was shocked to reel in a Loch Frenzy"
 DistantLandsKhazModan2_description: "the brightly colored fish had a large, bulbous head with teeth as sharp as steel"
 DistantLandsKhazModan3_observation: "we suddenly felt watched, and soon realized we were being followed by a pack of Crag Coyotes"
 DistantLandsKhazModan3_description: "the sandy-furred canines traveled in a pack, with the pack leader nearly twice the size of the others"
 DistantLandsKhazModan4_observation: "we were ambushed by a fearsome Lava Spider in a magma-filled ravine"
 DistantLandsKhazModan4_description: "its joints glowed with the blood of Azeroth itself, its jaws and carapace glistening obsidian"

 DistantLandsAzeroth1_observation: "our team passed a Giant Buzzard feasting upon the carcass of a starved heifer"
 DistantLandsAzeroth1_description: "the bird's feathers were as black as onyx and its ragged wings spread as wide as an oxcart"
 DistantLandsAzeroth2_observation: "we paused to observe a family of Silverback Gorrilas bathing beneath a waterfall in Stranglethorn"
 DistantLandsAzeroth2_description: "the muscular creatures groomed one another in the mist, their metallic gray fur rippling as they moved"
 DistantLandsAzeroth3_observation: "one of our number pointed up at a silk-lined bough, from which hung a dreaded Black Widow spider"
 DistantLandsAzeroth3_description: "its red hourglass mark was vivid, but much more menacing were its eight large eyes and venomous jaws"
 DistantLandsAzeroth4_observation: "our crew was shocked to see a warthog-like creature that burned with fel flame; the cursed Helboar"
 DistantLandsAzeroth4_description: "huge spikes erupted from the creature's spine, head, and haunches and it glared at us with canny green eyes"

 DistantLandsNorthKalimdor1_observation: "our team found ourselves being stalked by the fearsome Nightsaber"
 DistantLandsNorthKalimdor1_description: "the feline's lithe form was covered in dark fur striped with silver, with fanged jaws that could crush steel"
 DistantLandsNorthKalimdor2_observation: "a cry like a crash of thunder turned our eyes skyward to see a majestic hippogryph"
 DistantLandsNorthKalimdor2_description: "its feathers glistened with all the rainbow's hues and its knowing eyes pierded my soul"
 DistantLandsNorthKalimdor3_observation: "our team was shocked by the sight of the rare and deadly Frostsaber"
 DistantLandsNorthKalimdor3_description: "the great cat glided effortlessly over the snow, its white striped pelt a near-perfect camoflage"
 DistantLandsNorthKalimdor4_observation: "we paused to admire the endless beach and watch the movements of the Tide Crawlers"
 DistantLandsNorthKalimdor4_description: "the crabs were as wide as a dinner table and their powerful claws were encrusted with barnacles and flotsam"

 DistantLandsCentralKalimdor1_observation: "we happened upon a fearsome wyvern feasting upon a clutch of giant spider eggs"
 DistantLandsCentralKalimdor1_description: "the fascinating lionlike beast was covered in tawny fur except for its bare-skinned wings and menacing chitinous tail"
 DistantLandsCentralKalimdor2_observation: "we had to halt our caravan for the passing of a majestic herd of Kodo"
 DistantLandsCentralKalimdor2_description: "they were hulking and muscular creatures with thick hides and a strange pronged growth upon the snout"
 DistantLandsCentralKalimdor3_observation: "stopping for water, we found ourselves beset by the feared Wind Serpent"
 DistantLandsCentralKalimdor3_description: "its sharp emerald scales glistened in the sun and its sharp fangs flashed brilliant white as it struck"
 DistantLandsCentralKalimdor4_observation: "one of our number strayed too close to the water and was nearly swallowed whole by a giant Crocolisk"
 DistantLandsCentralKalimdor4_description: "the fearsome reptile was as large as an oxcart with teeth as long as a man's forearm"

 DistantLandsSouthKalimdor1_observation: "a fearful basilisk emerged out of a mirage before our very eyes"
 DistantLandsSouthKalimdor1_description: "the creature's stone scales looked heavy and its teeth sharp, but it was its cold gaze that we truly feared"
 DistantLandsSouthKalimdor2_observation: "a massive terrorsaur crashed through the jungle trees and swallowed one of our horses whole"
 DistantLandsSouthKalimdor2_description: "the fearsome reptile stood on two legs and was covered in alabaster scales with black stripes and a maw stained red with blood"
 DistantLandsSouthKalimdor3_observation: "we seem to have attracted the attention of a curious Faerie Dragon which playfully blinked about the caravan"
 DistantLandsSouthKalimdor3_description: "was no bigger than a housecat, bright blue with magenta wings adorned in fantastic patterns and a curled tail"
 DistantLandsSouthKalimdor4_observation: "our eyes were dazzled by the iridescent carapace of a Sparkleshell Tortoise"
 DistantLandsSouthKalimdor4_description: "the reptile was almost the size of a horse with a shell that resembled diamond and was almost as hard"

 wanderer_lifestyle_events.35.desc_wc: "As our party made its way through [ROOT.Char.Custom('DistantLandsLoc')], I found myself reflecting back on the travel journal I once read.\n\nNot an hour later [ROOT.Char.Custom('DistantLandsObservationTypeLoc')] just like in the book! I could observe that [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')] almost exactly as described.\n\nThe account had prepared me well for this experience,"
 wanderer_lifestyle_events.35.desc.singular.neutral_wc: "and yet it is somewhat different than what I expected... More than mere deja vu!"