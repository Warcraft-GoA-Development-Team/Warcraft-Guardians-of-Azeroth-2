# 1.19 TODO - update these tooltips with our own qualifications as they are updated
# MaA attribute unlocks

 vanguard_attribute.unlock_tt: "Any of these:\n$EFFECT_LIST_BULLET$The [acclaimed_knight|E] is [GetTrait('strong').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$The [acclaimed_knight|E] is [GetTrait('athletic').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$The [acclaimed_knight|E] has either [GetTrait('physique_good_1').GetName( GetNullCharacter )], [GetTrait('physique_good_2').GetName( GetNullCharacter )] or [GetTrait('physique_good_3').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight_possessive|E] [GetTrait('tourney_participant').GetName( GetNullCharacter )] Foot [trait_level_track_xp|E] is #V 30#! or higher\n$EFFECT_LIST_BULLET$May become available when the [acclaimed_knight|E] fights a [battle|E] alongside any [heavy_infantry|E] [men_at_arms|E]"
 vanguard_attribute.unlock_tt_2: "Any of these:\n$EFFECT_LIST_BULLET$The [acclaimed_knight_possessive|E] [culture|E] has either the #V $innovation_quilted_armor$#!, #V $innovation_blackrock_legionnaire$#! [innovation|E]\n$EFFECT_LIST_BULLET$The [acclaimed_knight_possessive|E] [culture|E] has either [GetCultureTradition('tradition_fp1_coastal_warriors').GetName], [GetCultureTradition('tradition_hird').GetName], [GetCultureTradition('tradition_druzhina').GetName], or [GetCultureTradition('tradition_mountaineer_ruralism').GetName] [culture_tradition|E]"
 vanguard_attribute.battle_message_tt: "[acclaimed_knight.GetName] distinguished [acclaimed_knight.GetHerselfHimself] leading heavy infantry in battle and can be [acclaimed|E] as a [GetAccoladeType('vanguard_attribute').GetName]"

 lancer_attribute.unlock_tt: "Any of these:\n$EFFECT_LIST_BULLET$The [acclaimed_knight|E] is an [GetTrait('aggressive_attacker').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$[acclaimed_knight_possessive|E] [GetTrait('tourney_participant').GetName( GetNullCharacter )] Horse [trait_level_track_xp|E] is #V 30#! or higher\n$EFFECT_LIST_BULLET$May become available when the [acclaimed_knight|E] fights a [battle|E] alongside any [heavy_cavalry|E] [men_at_arms|E]"
 lancer_attribute.unlock_tt_2: "Any of these:\n$EFFECT_LIST_BULLET$The [acclaimed_knight_possessive|E] [culture|E] has either the #V $innovation_arched_saddle$#! or #V $innovation_wolfrider$#! [innovation|E]\n$EFFECT_LIST_BULLET$The [acclaimed_knight_possessive|E] [culture|E] has either [GetCultureTradition('tradition_ep3_audacious_cadets').GetName] or [GetCultureTradition('tradition_ep3_imperial_tagmata').GetName] [culture_tradition|E]"
 lancer_attribute.battle_message_tt: "[acclaimed_knight.GetName] distinguished [acclaimed_knight.GetHerselfHimself] leading heavy cavalry in battle and can be [acclaimed|E] as a [GetAccoladeType('lancer_attribute').GetName]"
