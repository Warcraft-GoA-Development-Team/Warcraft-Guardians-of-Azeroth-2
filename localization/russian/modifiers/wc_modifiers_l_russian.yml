 # Uther Story

 last_defender_of_lordaeron: "Последний предводитель Серебряной Длани"
 last_defender_of_lordaeron_desc: "Собрав союзников и зажёгши пламя в сердцах жителей Лордерона, этот персонаж поклялся защищать остатки королевства до последнего человека.\nОбщее [wc_magic_resistance|E]: #P +30%#!"

 # Scarlet Story Modifiers
 wc_scarlet_crusader: "Scarlet Crusader"
 wc_scarlet_crusader_desc: "Этот персонаж дал клятву истребить [scourge|E] в Лордероне и всех, кто встанет у него на пути.\n[wc_spell_school_death|E] [wc_magic_resistance|E]: #P +3#!"

 wc_scarlet_zealot: "Scarlet Extremist"
 wc_scarlet_zealot_desc: "Движимый либо чистым рвением и преданностью поклонению Свету, либо простым безумием, этот персонаж возложил на себя миссию покончить с [scourge|E], бросив вызов самому [GetTrait('lich_king').GetName( GetNullCharacter )].\n[wc_spell_school_death|E] [wc_magic_resistance|E]: #P +3#!"

 wc_building_new_hearthglen: "Строительство новой столицы"
 wc_building_new_hearthglen_desc: "Наш народ трудится усердно и быстро, выполняя задачу строительства нашей новой твердыни. Новый Хартглен станет свидетельством нашей славы и решимости."

 # Argent Story Modifiers
 wc_argent_leader: "Argent Crusader"
 wc_argent_leader_desc: "Этот персонаж дал клятву защищать нуждающихся, вести войну против сил зла и проявлять сострадание ко всем разумным существам Азерота.\n[wc_spell_school_death|E] [wc_magic_resistance|E]: #P +2#! [wc_spell_school_disorder|E] [wc_magic_resistance|E]: #P +2#! [wc_spell_school_shadow|E] [wc_magic_resistance|E]: #P +1#!"

 # Liberate Lordaeron Modifiers

 saviour_of_lordaeron: "Спаситель Лордерона"
 saviour_of_lordaeron_desc: "Этот персонаж изгнал [scourge|E] из Лордерона и объявил себя правителем нового королевства, восставшего из пепла.\n[wc_magical_prowess|E]: #P +3#!"

 servant_of_lordaeron: "Слуга Лордерона"
 servant_of_lordaeron_desc: "Передав новообразованное королевство Лордерон обратно роду Менетилов, они доказали свою верность дому Менетилов."

 warrior_of_lordaeron: "Воин Лордерона"
 warrior_of_lordaeron_desc: "Как благочестивый слуга Света, этот персонаж доказал, что является самым ревностным приверженцем своей веры, передав правление новым королевством Лордерон своему духовному главе.\n[wc_magical_prowess|E]: #P +1#!"

