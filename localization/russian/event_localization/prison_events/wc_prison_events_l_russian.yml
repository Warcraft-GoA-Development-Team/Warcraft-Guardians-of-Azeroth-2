l_russian:
 prison.1001.magic.desc: "[actor.GetTitledFirstName] привязывает меня к столу [actor.GetHerselfHimself], с [actor.GetHerHis] пальцев стекает тёмная магия. «Это заклинание создано мной специально для таких, как ты. Твоя кожа отслоится, а плоть сгниёт», — говорит [actor.GetFirstName] с безумной улыбкой на [actor.GetHerHis] лице. «И всё это время ты будешь жить»."
 prison.1002.magic.desc: "К чему тонкости? Ничто не сравнится с элегантностью тёмной магии, медленно пожирающей душу. То, как плоть гниёт, всё ещё цепляясь за жизнь, — восхитительно мучительное зрелище. Видя магию, стекающую с моих пальцев, [recipient.GetTitledFirstName], кажется, уже сомневается, стоит ли сопротивляться."
 prison.1003.magic.desc: "К чему тонкости? Ничто не сравнится с элегантностью тёмной магии, медленно пожирающей душу. То, как плоть гниёт, всё ещё цепляясь за жизнь, — восхитительно мучительное зрелище. Скоро [recipient.GetTitledFirstName] познает истинную глубину страданий, когда тело начнёт разлагаться изнутри. Крики будут столь же сладки, как сила, пока ещё поддерживающая жизнь..."
 prison.1010.magic.desc: "[actor.GetTitledFirstName] связывает меня тёмной магией, в [actor.GetHerHis] глазах — зловещий блеск. Я уже знаю, что происходит: плоть гниёт, агония раздирает душу. Я молю о пощаде, но ухмылка [actor.GetFirstNamePossessiveNoTooltip] становится только шире. Мучения ещё даже не начались."
