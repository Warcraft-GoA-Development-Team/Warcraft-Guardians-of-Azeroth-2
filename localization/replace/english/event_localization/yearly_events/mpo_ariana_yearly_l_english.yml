l_english:
 mpo_events_ariana.0020.desc_court_chaplain: "my people being led in their beliefs by one who does not share all of ours. Should a [councillor_culture.GetNameNoTooltip] really be the voice of [ROOT.Char.GetFaith.HighGodName]?""
 mpo_events_ariana.0030.desc: ""The cups of [ROOT.Char.Custom('RegionalDrink')] at our gathering have run quite dry, my [ROOT.Char.GetTitleAsNameNoTooltip]..." [spymaster.GetName] complains. "But at least I know the one responsible for this drought." [spymaster.GetSheHe|U] points to [bartender.GetName], who is seen bartering a cup of the fermented mare's milk to another lowborn.\n\n"Surely you won't let our guests be deprived of their drink, will you? After all, they were specially prepared for the great lords and ladies of [ROOT.Char.GetPrimaryTitle.GetNameNoTier]." [spymaster.GetSheHe] asks, a sly grin on [spymaster.GetHerHis] face."