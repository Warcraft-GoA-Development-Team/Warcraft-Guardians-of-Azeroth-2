 wc_ancient_empire_culture_titan: "Titan"
 wc_ancient_empire_culture_mogu: "$heritage_mogu_name$"
 wc_ancient_empire_culture_aqir: "$heritage_aqir_name$"
 wc_ancient_empire_culture_black_empire: "$e_black_empire$"
 wc_ancient_empire_culture_fallback: "Prehistoric"
 wc_ancient_empire_decoration_highborne: "the Well of Eternity"
 wc_ancient_empire_decoration_zulian: "masks of the Loa"
 wc_ancient_empire_decoration_arathi: "the Book of Mereldar"
 wc_ancient_empire_decoration_titan: "the figure of Tyr"
 wc_ancient_empire_decoration_mogu: "the Thunder King"
 wc_ancient_empire_decoration_aqir: "a sinister dagger"
 wc_ancient_empire_decoration_black_empire: "an unknowable, mind-altering shape"
 wc_ancient_empire_decoration_fallback: "an unknown symbol"
 wc_artifact_ancient_bracelet_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')] Bracelet"
 wc_artifact_ancient_bracelet_description: "This bracelet of wonderful craftmanship is said to hail from the ancient [newly_created_artifact.Custom('AncientEmpireCultureLoc')] culture. Though its inlay of enamel and semi-precious stones is long lost, the gold retains its luster and a symbol representing [newly_created_artifact.Custom('AncientEmpireDecorationLoc')] . Bracelets like this were gifts of honor at the [newly_created_artifact.Custom('AncientEmpireCultureLoc')] court in antiquity, so perhaps it was once worn by a subject of the [newly_created_artifact.Custom('AncientEmpireCultureLoc')] Emperor."
 wc_ancient_drinking_vessel_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')] Drinking Vessel"
 wc_ancient_drinking_vessel_desc: "This ornate cup has a motif evoking the Well of Eternity. It was made in forgotten times, but its beauty has not faded."
 wc_artifact_ancient_sword_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')] Sword"
 wc_artifact_ancient_sword_description: "Said to be a remnant of the old [newly_created_artifact.Custom('AncientEmpireCultureLoc')] era, this sword $wc_ancient_sword_description_base$, making it a magnificent sight to behold. Though nowadays it is too fragile to be taken into battle, perhaps this sword was once held by a hero now lost to time?"
 wc_artifact_ancient_replica_sword_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')] Style Sword"
 wc_ancient_sword_description_base: "is embellished with an image of [newly_created_artifact.Custom('AncientEmpireDecorationLoc')]"
 wc_famed_replica_ancient_sword_description: "This sword is inspired by the vision of a glorious bygone era, hearkening back to the heroic past of the maker's ancestors. It is encrusted with the finest jewels and $wc_ancient_sword_description_base$, making it a magnificent sight to behold. While wielding it, one projects the image of the legendary kings of old."
 wc_masterwork_replica_ancient_sword_description: "This sword is clearly intended to imitate the weapons of an older era, hearkening back to the heroic past of the [newly_created_artifact.Custom('AncientEmpireCultureLoc')]. It is well-inlaid with precious stones and $wc_ancient_sword_description_base$. Though a distant echo of the past, one can imagine themselves a mighty lord of a bygone era when wielding it."
 wc_common_replica_ancient_sword_description: "This poor imitation makes for a mockery of the [newly_created_artifact.Custom('AncientEmpireCultureLoc')], though it $wc_ancient_sword_description_base$. It is inlaid with cheap stones and decorated with uneven, rough patterns. Totting this around on its scabbard, one looks a deluded fool, desirous to return to a time that is long gone."