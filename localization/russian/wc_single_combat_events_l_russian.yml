l_russian:
  
  ##### Own Combat Move Feedback 
 single_combat.0001.desc.my_feedback.being_hunted_by_demon_hunter: "С привычной лёгкостью я уклоняюсь от удара [my_foe.GetFirstNameNoTooltip], вхожу в его замах и, взметнув варглейвы, наношу яростные удары в самые уязвимые места, прежде чем отскочить на безопасное расстояние."
  
  ##### Opponent Combat Move Feedback 
 single_combat.0001.desc.opponent_response.being_hunted_by_demon_hunter: "[my_foe.GetFirstNameNoTooltip] — пугающе искусный охотник на демонов: снова и снова [my_foe.GetSheHe] уклоняется или парирует даже верные удары и тут же оборачивает их против меня."
  
  ##### Outcome Event: Loser ##### 
  ## Defender Lost, Own Combat Move Feedback 
 single_combat.0031.desc.sc_defender.being_hunted_by_demon_hunter: "Даже весь мой опыт не помогает — противник отражает мои удары."
  
  ## Defender Lost, Opponent Finishing Move Feedback 
 single_combat.0031.desc.opponent_response.being_hunted_by_demon_hunter: "[sc_victor.GetFirstNamePossessiveNoTooltip] остаётся [Select_CString(sc_victor.IsFemale, 'спокойной', 'спокойным' )], но [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] собирает свою жуткую жатву, оттесняя меня серией точных ударов варглейвами.\n\n"
  
  ## Defender Lost, Opponent Finishing Move Injury 
 single_combat.0031.desc.opponent_response.being_hunted_by_demon_hunter.injury: "Иллюзии и хитрость [sc_victor.GetFirstNameNoTooltip] гонят меня то в одну, то в другую сторону; каждый удар сбивает с толку, пока [sc_victor.GetSheHe] не выкручивает [sc_loser.Custom('signature_weapon')] прямо из моих [sc_loser.Custom('HandHands')].\n\nНа миг я остаюсь [Select_CString(ROOT.Char.IsFemale, 'ошеломлённой', 'ошеломлённым' )]."
  
  ## Defender Lost, Opponent Finishing Move Fatality 
 single_combat.0031.desc.opponent_response.being_hunted_by_demon_hunter.fatality: "Скоро мне приходится признать правду: [sc_victor.GetSheHe|U] загнал[Select_CString(sc_victor.IsFemale, 'а', '' )] меня в глухую оборону, не оставив ни малейшего шанса восстановить позиции. Вечно блокировать я не смогу.\n\nСмерть приходит быстро: [sc_victor.GetHerHis] [sc_victor.Custom('signature_weapon')] [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] мою шею в кровавое месиво."
  
  ## Aggressor Lost, Own Combat Move Feedback 
 single_combat.0031.desc.sc_attacker.being_hunted_by_demon_hunter: "В бою я легко пользуюсь высокомерием своей добычи: самоуверенность лучше всего наказывается быстрой гибелью. Но мой противник встречает удар ударом, не больше и не меньше, оставляя пробелы лишь для того, чтобы выманить меня в опасный замах.\n\n"
  
  ## Aggressor Lost, Own Combat Move Injury 
 single_combat.0031.desc.sc_attacker.being_hunted_by_demon_hunter.injury: "Это изнуряющая схватка, и в конце концов я поддаюсь на один из обманных выпадов, слишком сильно, чтобы оправиться. В итоге я валяюсь на земле, без оружия."
  
  ## Aggressor Lost, Own Combat Move Fatality 
 single_combat.0031.desc.sc_attacker.being_hunted_by_demon_hunter.fatality: "Проходит время, прежде чем один из нас совершает ошибку, но это всё же случается. Я слишком вкладываюсь в [sc_loser.Custom('SignatureWeaponAttemptedLight')], и прежде чем успеваю увернуться, [sc_victor.Custom('SignatureWeaponArticle')] [sc_victor.Custom('signature_weapon')] оказывается у меня в брюхе.\n\nТаков удел."
  
  ##### Outcome Event: Victor ##### 
  ## Defender Won, Own Combat Move Feedback 
 single_combat.0041.desc.sc_defender.being_hunted_by_demon_hunter: "Тяжело добытые уроки — самые мудрые учителя, и я беру их себе в сердце."
  
  ## Defender Won, Opponent Finishing Move Feedback 
 single_combat.0041.desc.opponent_response.being_hunted_by_demon_hunter: "[sc_loser.GetFirstNameNoTooltip] сражается достойно, и мне трудно использовать его ошибки. Но всякая щель в защите наказана, всякая слабость оплачена болью и усилиями.\n\nЛишь осторожная тактика — удар за ударом, не больше и не меньше — позволяет мне держаться, ожидая, пока #EMP [sc_loser.GetSheHe]#! оступится, и тогда…"
  
  ## Defender Won, Opponent Finishing Move Injury 
 single_combat.0041.desc.opponent_response.being_hunted_by_demon_hunter.injury: "я перехожу в атаку.\n\nЭто изнурительная битва, полная ярости и использования малейших слабостей врага, но я всё же валю [sc_loser.Custom('ShieldPersonFemaleMale')] на землю и в том же движении выбиваю оружие.\n\nКапитуляция неохотная, но уважительная."
  
  ## Defender Lost, Opponent Finishing Move Fatality 
 single_combat.0041.desc.opponent_response.being_hunted_by_demon_hunter.fatality: "мне удаётся провести [sc_victor.Custom('SignatureWeaponAttemptedLight')], вонзив его в живот [sc_victor.GetHerHis].\n\nСмерть мучительна, но [sc_loser.GetFirstNameNoTooltip] принимает её с достоинством, сражаясь до самого конца."
  
  ## Aggressor Won, Own Combat Move Feedback 
 single_combat.0041.desc.sc_attacker.being_hunted_by_demon_hunter: "В ярости битвы нет места милосердию. Каждая ошибка врага наказывается десятикратно, каждый промах оплачивается с процентами. Мои [sc_victor.Custom('SignatureWeaponAttemptedHeavyPlural')] кромсают противника, каждый раз подталкивая [sc_loser.GetHerHim] ближе к краю поражения.\n\n"
  
  ## Aggressor Won, Own Combat Move Injury 
 single_combat.0041.desc.sc_attacker.being_hunted_by_demon_hunter.injury: "Вскоре я выбиваю [sc_loser.Custom('signature_weapon')] из рук [sc_loser.GetHerHis] точным [sc_victor.Custom('SignatureWeaponAttemptedLight')].\n\n[sc_loser.GetFirstNameNoTooltip] на миг [Select_CString(sc_loser.IsFemale, 'ошеломлена', 'ошеломлён' )], но сдаётся, прежде чем я [sc_victor.Custom2('SignatureWeaponKillTypeThirdPersonFutureGendered',SCOPE.sC('sc_loser'))]."
  
  ## Aggressor Won, Own Combat Move Fatality 
 single_combat.0041.desc.sc_attacker.being_hunted_by_demon_hunter.fatality: "Без шанса вернуть себе инициативу, [sc_loser.GetFirstNamePossessiveNoTooltip] конец был лишь вопросом времени.\n\nНаконец, [sc_loser.GetSheHe] совершает роковую ошибку, и [sc_loser.GetHerHis] защита открывается на мгновение. Этого достаточно: мой смертельный удар [sc_victor.Custom('SignatureWeaponWoundVerb4ThirdPersonPresent')] [sc_loser.GetHerHis] шею.\n\n[sc_loser.GetFirstNameNoTooltip] задыхается и [Select_CString(sc_loser.IsFemale, 'тонет', 'тонет' )] в собственной крови."
  
  ##### Combat Move Options 
 single_combat.0001.being_hunted_by_demon_hunter: "Я покажу тебе, как я охочусь…"
  
  ##### Combat Move Option Tooltips 
 single_combat.0001.tt.being_hunted_by_demon_hunter: "Вы обрушиваете на врага весь свой опыт и ярость охотника"
