 trait_wc_lifestyle_disorder_magic: "Порочные чернокнижники"
 trait_user_of_disorder_magic_name: "Чернокнижник"
 trait_user_of_disorder_magic_1: "$wc_lifestyle_magic_prefix_for_level_1$ $trait_user_of_disorder_magic_name$"
 trait_user_of_disorder_magic_1_desc: "Чернокнижники абсолютно развращены и невообразимо могущественны. Господство — их цель, и они нашли к нему путь в тёмных искусствах: их магия хаоса испепелила целые миры и истребила бесчисленные виды за бесчисленные эпохи. Эти ненасытные заклинатели призывают демонических прислужников, сражающихся рядом с ними и сеющих хаос среди всех, кто встанет на пути их господина."
