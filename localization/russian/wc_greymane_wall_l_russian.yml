l_russian:
 wc_greymane_wall_events.0001.t: "Будущее Гилнеаса"
 wc_greymane_wall_events.0001.desc: "«Что, вы сказали, вы хотите сделать?» [GetTitleByKey('k_gilneas').GetHolder.GetCouncillor('councillor_chancellor').GetDynastyHouseName] смотрел на меня сквозь очки с линзами толщиной в кусок льда. Последствия услышанного и впрямь были тяжелы. Неспроста мы находились в военном зале.\n«Вы меня слышали, [GetTitleByKey('k_gilneas').GetHolder.GetCouncillor('councillor_chancellor').GetDynastyHouseNameNoTooltip]».\n«Вы хотите отгородить стеной всё наше королевство? Закрыть границы и прекратить торговлю с остальным Альянсом? Это довольно серьёзное решение, не находите?»"
 wc_greymane_wall_events.0001.a: "[GetTitleByKey('e_lordaeron').GetHolder.GetFirstNameNoTooltip] хочет больше нашего золота. Быть может, и нашей крови. Нет, говорю я."
 wc_greymane_wall_events.0001.b: "Возможно, стоит ещё раз всё обдумать."

 wc_greymane_wall_events.0002.t: "Выбор места"
 wc_greymane_wall_events.0002.desc: "«Стена пройдёт через земли какого-нибудь лорда. Вы должны это понимать. Ни одна из наших естественных границ не подойдёт. Все они слишком уязвимы».\n«Конечно, понимаю, любезный! Кто бы это ни был, ему возместят ущерб, как и крестьянам и горожанам его владений».\n«Судя по этой карте, вы предполагаете провести её через владения [GetTitleByKey('c_western_strand').GetHolder.GetLadyLord|U] [GetTitleByKey('c_western_strand').GetHolder.GetDynastyHouseName]. Но взгляните на местность, мой сюзерен. Здесь проходит горный хребет. Какой надёжный рубеж здесь получится: горы по обе стороны станут естественной преградой».\n«Вы правы».\n«Разумеется, для этого нам пришлось бы отрезать часть земель [GetTitleByKey('d_crowvale').GetHolder.GetLadyLord|U] [GetTitleByKey('d_crowvale').GetHolder.GetDynastyHouseName], в том числе [GetTitleByKey('c_pyrewood').GetNameNoTierNoTooltip] и [GetTitleByKey('c_ambermill').GetNameNoTierNoTooltip]»."
 wc_greymane_wall_events.0002.a: "«[GetTitleByKey('d_crowvale').GetHolder.GetDynastyHouseNameNoTooltip] могущественен. Лучше держаться [GetTitleByKey('c_western_strand').GetHolder.GetLadyLord|U] [GetTitleByKey('c_western_strand').GetHolder.GetDynastyHouseNameNoTooltip]»."
 wc_greymane_wall_events.0002.b: "«Признаю вашу правоту. [GetTitleByKey('d_crowvale').GetHolder.GetLadyLord|U] [GetTitleByKey('d_crowvale').GetHolder.GetDynastyHouseNameNoTooltip]: [GetTitleByKey('d_crowvale').GetHolder.GetFirstNameNoTooltip] придётся это понять»."

 wc_greymane_wall_events.0003.t: "[GetTitleByKey('c_western_strand').GetHolder.GetLadyLord|U] [GetTitleByKey('c_western_strand').GetHolder.GetDynastyHouseNameNoTooltip] излагает свои доводы"
 wc_greymane_wall_events.0003.desc: "«Мой [ROOT.Char.GetLadyLord|U], разве стену нельзя возвести в более удачном месте? Удар по вашей казне будет немалым, если строить её вдоль всего севера»."
 wc_greymane_wall_events.0003.a: "«Стена будет возведена вдоль северной границы [GetTitleByKey('k_gilneas').GetNameNoTierNoTooltip]»."
 wc_greymane_wall_events.0003.b: "«Было бы лучше разместить её на землях [GetTitleByKey('d_crowvale').GetHolder.GetLadyLord|U] [GetTitleByKey('d_crowvale').GetHolder.GetDynastyHouseNameNoTooltip]»."

 wc_greymane_wall_events.0004.t: "Стена Седогрива"
 wc_greymane_wall_events.0004.desc: "«Мой [ROOT.Char.GetLadyLord|U], вы возвели поистине великолепную стену, дабы защитить наш народ»."
 wc_greymane_wall_events.0004.a: "Стена построена"

 wc_greymane_wall_events.0010.t: "[GetTitleByKey('d_crowvale').GetHolder.GetLadyLord|U] [GetTitleByKey('d_crowvale').GetHolder.GetDynastyHouseNameNoTooltip] излагает свои доводы"
 wc_greymane_wall_events.0010.desc: "«Возводя стену, вы предаёте не только наших союзников, но и собственный народ! Цепляясь за прошлое, вы вступаете на опасный путь»."
 wc_greymane_wall_events.0010.a: "«Стена — единственный путь вперёд»."
 wc_greymane_wall_events.0010.b: "«Хорошо. Пока что я пересмотрю решение о строительстве стены»."

 wc_greymane_wall_events.0011.desc: "«Строительство [GetBuilding('greymane_wall_02').GetName] было актом тирании. Я сделаю то, что лучше для [GetTitleByKey('k_gilneas').GetNameNoTierNoTooltip]»."
 wc_greymane_wall_events.0011.a: "Я пытался быть благоразумным."
 wc_greymane_wall_events.0011.b: "«Вы правы. [GetTitleByKey('k_gilneas').GetHolder.GetCouncillor('councillor_chancellor').GetLadyLord|U] [GetTitleByKey('k_gilneas').GetHolder.GetCouncillor('councillor_chancellor').GetDynastyHouseNameNoTooltip], разрушьте эту стену!»"

 wc_greymane_wall_events.0102.desc: "«Стена пройдёт через ваши земли. Вы должны это понимать. Ни одна из наших естественных границ не подойдёт. Все они слишком уязвимы».\n«Конечно, понимаю, любезный! Крестьянам и горожанам моих владений возместят ущерб».\n«Судя по этой карте, вы предполагаете провести её через север. Но взгляните на местность, мой сюзерен. Здесь проходит горный хребет. Какой надёжный рубеж здесь получится: горы по обе стороны станут естественной преградой».\n«Вы правы».\n«Разумеется, для этого нам пришлось бы отрезать [GetTitleByKey('c_pyrewood').GetNameNoTierNoTooltip] и [GetTitleByKey('c_ambermill').GetNameNoTierNoTooltip]»."
 wc_greymane_wall_events.0102.a: "«Я не брошу свой народ. Стена пройдёт вдоль северной границы»."
 wc_greymane_wall_events.0102.b: "«Признаю вашу правоту. Стена отрежет [GetTitleByKey('c_pyrewood').GetNameNoTierNoTooltip] и [GetTitleByKey('c_ambermill').GetNameNoTierNoTooltip]»."
 wc_greymane_wall_events.0102.c: "«Мне нужно больше времени, чтобы это обдумать»."
