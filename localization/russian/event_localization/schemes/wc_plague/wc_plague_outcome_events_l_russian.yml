l_russian:
 plague_outcome.1001.t: "Распространение чумного зерна"
 plague_outcome.1001.d: "Приготовления закончены. Культ Проклятых достаточно силён, чтобы действовать более решительно и, что более важно, может начать подготовку почву для вспышки чумы. Вы по-прежнему должны быть бдительны, так как всего один неверный шаг на этом этапе может дорого обойтись.\n\nВы приказываете своим верным культистам начать скрытно заражать определенные зернохранилища возле центров распространения графства [plague_center.GetName]. Если всё пойдет по плану, то это только вопрос времени, когда нежить заполонит всю округу."
 plague_outcome.1001.a: "Приступайте."
 plague_outcome.1001.b: "Подождите, мне нужно время для подготовки."
  
 plague_outcome.2001.t: "Начало чумы"
 plague_outcome.2001.desc: "Твои приготовления увенчались успехом! Заражённое зерно, хранившееся в амбарах [plague_center.GetName], было незаметно для [target.GetTitledFirstName] распределено по всему графству. Вскоре начался хаос: мёртвые восстали и стали теснить местный гарнизон.\n\nГрафство в панике пытается обороняться от собственных жителей, и что куда важнее — они не смогли остановить распространение чумы в соседние земли. Скоро все будут служить твоей воле!\n\n"
 plague_outcome.2001.exposed_scheme: "К несчастью, некоторым твоим слугам не удалось скрыться в разгаре хаоса, и их схватили стражники. Вероятно, они уже раскрыли твой замысел [target.GetTitledFirstName]."
 plague_outcome.2001.not_exposed_scheme: "Твои слуги сумели скрыться в хаосе, и [target.GetTitledFirstName] ничего не подозревает о твоём участии во вспышке чумы!"
 plague_outcome.2001.a: "Пора позволить чуме набрать силу..."
  
 plague_outcome.4001.t: "Распространение чумы предотвращено"
 plague_outcome.4001.failure_declaration_1: "Земли персонажа [target.GetTitledFirstNamePossessive] не были заражены!"
 plague_outcome.4001.failure_declaration_2: "Моя попытка заразить земли персонажа [target.GetTitledFirstNamePossessive] была сорвана."
 plague_outcome.4001.failure_declaration_3: "Похоже персонаж [target.GetTitledFirstName] [Select_CString(target.IsFemale, 'снова избежал', 'снова избежала' )] наказания от [ROOT.Char.GetFaith.HighGodNamePossessive]."
 plague_outcome.4001.desc: "\n\nЛишь несколько крестьян были заражены до того, как стражники персонажа [target.GetTitledFirstNamePossessive] были предупреждены и не перебили их. В настоящее время заражённое зерно помещено на карантин, а его распространение остановлено.."
 plague_outcome.4001.exposed_scheme: "Некоторые из ваших культистов были схвачены и подвергнуты пыткам и наверняка уже раскрыли ваше имя."
 plague_outcome.4001.not_exposed_scheme: "По крайней мере, вашим слугам удалось покинуть территорию до того, как их задержали, так что [target.GetTitledFirstName] не [Select_CString(target.IsFemale, 'должен был', 'должна была' )] узнать о вашем участии."
 plague_outcome.4001.a: "Когда-нибудь ты за это заплатишь, [target.GetFirstNameNoTooltip]!"
 plague_outcome.4001.b: "Если у вас не получится с первого раза..."
  
 plague_outcome.5001.t: "$plague_outcome.2001.t$"
 plague_outcome.5001.undead_conversion: "Гонец принес печальные известия. Графство [plagued_county.GetName] заражено загадочной чумой. Земля и растения высохли, деревни утихли... и люди там превратились во что-то... не совсем живое.\n\nТеперь безмозглые твари, от которых разит смертью, бродят и нападают на всех кого встретят на своем пути. Ситуация на самом деле тяжелая..."
 plague_outcome.5001.exposed_scheme: "\n\nМестному гарнизону удалось задержать человека в капюшоне, замеченного возле зернохранилища. После допроса он отказался от слов, что [owner.GetTitledFirstName] несет ответственность за эту болезнь."
 plague_outcome.5001.not_exposed_scheme: "\n\nВ сообщениях выживших упоминается группа людей в капюшонах, саботирующих наши зернохранилища незадолго до начала вспышки болезни. Наша охрана не нашла их следов — неужели это они стоят за этой заразой?"
 DEATH_COMES: "Смерть идёт!"
 plague_outcome.5001.discovered: "[owner.GetTitledFirstName|U] заплатит!"
 plague_outcome.5001.not_discovered: "Как такое могло произойти?!"
  
 plague_outcome.5002.t: "$plague_outcome.4001.t$"
 plague_outcome.5002.undead_conversion: "Ваши стражники сообщают о крестьянах, превращающихся в неуклюжих зомби возле зернового распределительного центра в графстве [plague_center.GetName]. К счастью, местные охранники успели перебить этих безмозглых тварей до того, как они успели причинить какой-либо ущерб.\n\nПохоже, странная вспышка восходит к одному из зернохранилищ. Земля вокруг него высохла и опустела, а трава и растения рядом скосились и иссохли. Амбары были помещены на карантин чтобы зерно дальше не распространялось.\n\n"
 plague_outcome.5002.exposed_scheme: "Стражники поймали несколько подозрительных людей в масках возле схронов с зерном. Они утверждают, что являются частью некого Культа Проклятых и что [owner.GetTitledFirstName] является организатором этой эпидемии."
 plague_outcome.5002.not_exposed_scheme: "За несколько недель до этого возле схронов с зерном были замечены люди в капюшонах, которые что-то скандировали, но вашим стражникам не удалось обнаружить никаких следов."
  
 intrigue_scheme_ongoing.plague.3003.desc: "безопасный маршрут для транспортировки зараженного зерна в зернохранилища графства [scheme_location.GetName]."
