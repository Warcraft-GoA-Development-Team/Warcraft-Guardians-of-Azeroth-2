l_russian:
  
 invasionofkalimdor_0002_title: "Исход Орды"
 invasionofkalimdor_0002_desc: "В своём беспокойном сне я слышу голоса.\n\n«Песок времени иссяк, дитя Северного Волка. Кличи войны отдаются эхом в ветрах. Отголоски прошлого терзают земли, что вновь охвачены раздорами».\n\nЯ вижу собранную Орду, скандирующую боевые кличи и марширующую к завоеванию, наши военные барабаны сотрясают эту самую землю. Человеческие королевства, наш враг с тех пор, как мы вступили в этот новый мир, противостоят нам за своими толстыми щитами и в броне, кровь обоих наших родов вновь и вновь удобряет эту почву.\n\n«Герои встают, чтобы бросить вызов судьбе и повести братьев в бой. Пока смертные армии слепо несутся навстречу своей гибели, Пылающая Тень приходит, чтобы поглотить всех нас».\n\nНебо горит, пока наши народы бессмысленно сталкиваются, из пылающего пламени поднимаются жуткие твари и набрасываются на изувеченные армии.\n\n«Ты должен собрать Орду и повести свой народ к его судьбе... ищи меня»."
 invasionofkalimdor_0002_a: "Что это был за кошмар?"
  
 invasionofkalimdor_0003_title: "Исход Орды"
 invasionofkalimdor_0003_desc: "Я трясу головой, выходя наружу глотнуть свежего воздуха. «Это был не кошмар, а видение». Я поднимаю глаза и вижу ворона, что произносит свои мысли вслух. Мгновение спустя ворон оборачивается Человеком.\n\n«Приветствую, [thrall_or_frostwolf_leader.GetName]». Я киваю в ответ на представление загадочного Человека.\n«Тот самый, кого я видел в видении... в том кошмаре... Кто ты? Откуда ты меня знаешь?» — спрашиваю я.\n«Я знаю многое, вождь, о тебе и твоём народе. Моё имя сейчас не важно. Важно то, что ты должен собрать свой народ и немедленно покинуть эти берега».\n«Покинуть? В чём дело, человек?» — пытается он меня обмануть?\n\nОн смеётся и оборачивается, глядя на север. «Человек? Я утратил свою человечность давным-давно. Я нечто... иное теперь. Знай, что я видел будущее и узрел великую пылающую тень, что придёт, чтобы поглотить этот мир. Ты ощущаешь её тоже, не так ли?»\nЯ подхожу к Человеку и вижу, как на севере собирается буря. «Демоны... они возвращаются».\n\n«Да. И только если ты поведёшь свой народ через море, в далёкие земли Калимдора, у вас будет шанс им противостоять!» — не даёт мне и рта раскрыть, прежде чем продолжить. — «Я отвечу на все твои вопросы, вождь, но в своё время. А сейчас собирай воинов и готовься покинуть эти земли. Мы ещё поговорим».\n\nЧеловек вновь оборачивается вороном и улетает. Ничего из этого не имеет смысла, но духи говорят мне, что я должен ему довериться... Но могу ли я?"
 invasionofkalimdor_0003_a: "Мы и так здесь как в клетке..."
 you_will_talk_to_the_warsong_leader: "Вы обратитесь к вождю клана Песни Войны"
 invasionofkalimdor_0003_b: "Азерот — это та земля, что наши предки желали видеть нашим домом"
 this_end_the_story_content_for_orcs: "Это завершит сюжетную линию вторжения Пылающего Легиона для орков"
  
 invasionofkalimdor_0004_title: "Исход Орды"
 invasionofkalimdor_0004_desc: "Знать клана Северного Волка приближается к моему шатру. «Слава [grommash_or_warsong_leader.GetName]! Я пришёл предложить тебе план от [thrall_or_frostwolf_leader.GetName]». Он передаёт мне пергамент от самого Вождя Северного Волка.\n\nЯ обдумываю свои варианты после прочтения. Орда не сможет покорить Азерот, это точно... Враждебность людей к нам слишком велика, чтобы позволить нам укрыться в глухих уголках их земель. Калимдор мог бы дать нам второй шанс и новые горизонты."
 invasionofkalimdor_0004_a: "Азерот — потерянное дело для кланов, да будет Калимдор!"
 you_agree_to_go_to_kalimdor: "Вы отправитесь с кланом Северного Волка к Калимдору"
 invasionofkalimdor_0004_b: "Нет... эти назойливые люди заплатят! Азерот будет нашим!"
  
 invasionofkalimdor_0005_title: "Исход Орды"
 invasionofkalimdor_0005_desc: "Клан Песни Войны принял наш договор. Мы готовим знамёна и собираем орков, чтобы отплыть.\n\n[grommash_or_warsong_leader.GetName] отводит меня в сторону, чтобы показать что-то. Мы вместе выходим к берегу и видим множество человеческих кораблей, по виду брошенных.\n\n[grommash_or_warsong_leader.GetFirstName] хлопает меня по плечу и громко смеётся. «Ха-ха! Вот корабли, что мы добыли, нападая на человеческие земли! Мы отправимся в путь на собственных кораблях людей!»\n\nЯ смотрю на [grommash_or_warsong_leader.GetFirstName] с братской гордостью, поднимающейся в груди. «Превосходно, [grommash_or_warsong_leader.GetFirstName]. Теперь нужно дождаться, пока Орда будет готова к отплытию». Оборачиваюсь — клан Северного Волка и клан Песни Войны уже собрались вокруг нас. «Ждём твоей команды, Вождь!» — слышу я голос одного из гроннов, остальные присоединяются."
 invasionofkalimdor_0005_a: "Лок'тар огар! В Калимдор!"
  
 invasionofkalimdor_0006_title: "Исход Орды"
 invasionofkalimdor_0006_desc: "Прочие орочьи кланы отвергли призыв. Они либо безрассудны, либо их шаманы лишились разума, не замечая того, о чём твердят сами духи.\n\nОднако это не остановит клан Северного Волка. Я оборачиваюсь к своему клану и с уверенностью поднимаю оружие. «Орда собрана! И мы станем истинным наследием орков! За Орду!»\n\nЯ слышу, как мой клан скандирует за моей спиной, пока я разворачиваюсь к нашим кораблям. Теперь мы отправляемся на дальний восток."
 invasionofkalimdor_0006_a: "Лок'тар огар! В Калимдор!"
  
 survivors_of_horde: "Уцелевшие орки"
  
 invasionofkalimdor_0009_title: "Высадка"
 invasionofkalimdor_0009_desc: "Оба клана высаживаются на берегах Калимдора порознь, готовя базы и исследуя этот дикий край.\n\nЗдесь немало враждебных рас, что досаждают нашим поселенцам. Обоим кланам предстоит прокладывать собственный путь для своего народа.\n\nРазумны они или нет — любой, кто встанет на пути нашей судьбы, будет сметён! Лок'тар огар!"
 invasionofkalimdor_0009_a: "Готовьтесь к войне!"
  
 invasionofkalimdor_0010_title: "Высадка"
 invasionofkalimdor_0010_desc: "Наш народ наконец высадился на берегах Калимдора, иные всё ещё осматривают новый мир с удивлением и надеждой.\n\nНе прошло и дня с нашей высадки, как на нас напали странные воинственные твари, пока мы строили базы и лагеря! Они нападают с дикой яростью, но мы сдерживаем их.\n\nК чёрту переговоры с ними. Если они посмеют отказать нам в нашем новом доме, мы сотрём их с наших новых земель! Лок'тар огар!"
 invasionofkalimdor_0010_a: "Готовьте оборону!"
  
 invasionofkalimdor_0100_title: "Тоска по дому"
 invasionofkalimdor_0100_desc: "«Неужели в этой земле нет ничего, кроме смерти и резни?» — размышляю я вслух, сражая последнего из нападавших звериных тварей.\n\nПо крайней мере, в ходе этой бойни мы заполучили немало хороших земель. Несмотря на все её опасности и трудности, этот новый дом для орков столь же тих и красив, как наш старый мир Дренор. Мы будем защищать его ценой наших жизней."
 invasionofkalimdor_0100_a: "За Орду!"
  
 invasionofkalimdor_0101_title: "Тоска по дому"
 invasionofkalimdor_0101_desc: "Мы одолели диких тварей Калимдора и ныне отдыхаем. Мы должны расходовать ресурсы бережно и выбирать сражения с умом. Любая неосторожность может стать концом нашего нового дома.\n\nКлан Песни Войны преуспеет даже в самые яростные бури!"
 invasionofkalimdor_0101_a: "За Орду!"
