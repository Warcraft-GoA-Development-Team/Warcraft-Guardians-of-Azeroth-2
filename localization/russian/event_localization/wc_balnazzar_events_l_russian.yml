l_russian:
 # Дуга Бальназара
 BALNAZZAR_DREADLORD_CUSTOM_STRING_KEY: "Повелитель Ужаса носит заимствованное лицо, живёт жизнью смертного и тянется к трону, который никогда ему не принадлежал."
 wc_balnazzar_story.0100.title: "Слабеющая оболочка"
 wc_balnazzar_story.0100.desc: "Это тело слабеет — медленнее, чем у смертного, но быстрее, чем следовало бы для того, кем я являюсь на самом деле. Когда имя Датрохана угаснет, не останется наследника, чтобы его подхватить, а имя без наследника — это долг, которому некому предъявить счёт.\n\nЯ мог бы позволить всему закончиться тихо и доверить тому, кто унаследует трон, разбираться с остальным. Или я мог бы убедиться, что того, кто явится на поиски, ждёт нечто куда худшее, чем пустой титул."
 wc_balnazzar_story.0100.a: "Убедиться, что их ждёт нечто худшее."
 wc_balnazzar_story.0100.b: "Позволить всему закончиться тихо."
 wc_balnazzar_story.0101.title: "Знакомый незнакомец"
 wc_balnazzar_story.0101.desc: "Великий Крестоносец Датрохан стал сам не свой. Мелочи — оборот речи, вспышка гнева, ему несвойственная, то, как он порой смотрит на собственное отражение, словно на чужое. Я молчал. Пока что."
 wc_balnazzar_story.0101.a: "Успокоить их. Что бы они ни думали, что видели, — это ничего не значило."
 wc_balnazzar_story.0101.b: "Тихо заточить их в темницу, прежде чем они расскажут об этом кому-нибудь ещё."
 wc_balnazzar_story.0101.c: "Промолчать. Пусть продолжают гадать."
 wc_balnazzar_story.0102.title: "Под пеплом"
 wc_balnazzar_story.0102.desc: "Зачистка продолжается — графство за графством, вера за верой. Это необходимая работа. Это также работа, которую лучше всего делать тихо — а тихая работа привлекает тихие взгляды."
 wc_balnazzar_story.0102.a: "Продолжать."
 wc_balnazzar_story.0102.a_tooltip: "Кто-то при вашем дворе заметил, что с вами что-то не так"
 wc_balnazzar_story.0002.title: "Смерть, в которую они поверят"
 wc_balnazzar_story.0002.desc: "Вариматрас стоит передо мной под разрушенным троном, в его когтях сгущается магия, а за ним ждёт Сильвана. Для неё это должно выглядеть как повиновение: один Повелитель Ужаса покупает пощаду кровью своего брата. Для нас это представление, отрепетированное без слов.\n\nЕго заклинание бьёт достаточно сильно, чтобы убедить весь зал, и достаточно осторожно, чтобы сохранить мне жизнь. Я падаю и дарю свидетелям неподвижность, ради которой они пришли. Сильвана без слов забирает Лордерон; верит ли она в мою смерть или просто принимает результат, она ничем себя не выдаёт.\n\nЛишь когда затихают её шаги, Вариматрас шевелится. К ночи я уже пробираюсь в Чумные земли — без короны и незримый. Пусть запомнят тело на полу. У меня есть другие лица, которые стоит примерить."
 wc_balnazzar_story.0002.a: "Пусть Бальназар умрёт у них на глазах."
 wc_balnazzar_story.1001.title: "Лицо, которое не его"
 wc_balnazzar_story.1001.desc: "Теперь Лордерон принадлежит Сильване. Вариматрас сыграл свою роль, те, чьё мнение имело значение, видели моё падение, и Бальназар мёртв во всех рассказах, достойных внимания. Трон был лишь строительными лесами. Мёртвое имя может оказаться полезнее короны.\n\nСеребряная Длань всё ещё движется по Чумным землям. Среди её остатков выделяется один человек — Сайдан Датрохан, уважаемый, пользующийся доверием, именно та оболочка, которую стоит носить. Я знал ему цену ещё до того, как отдал корону; теперь ничто не мешает мне его забрать.\n\nОн где-то здесь, в руинах Стратхольма. Есть особая неподвижность в человеке, который думает, что охотится на мёртвых, а не что охотятся на него. Я нахожу его одного. «Кто...? Ты... Легион», — только и успевает он произнести, прежде чем Свет коснётся его руки.\n\nМой род называют натрезимами. Повелителями Ужаса — на вашем языке. Быть может, Тал'китуун подошло бы больше. Это значит «незримый гость» на вашем языке. Подходит, потому что я существовал здесь, между миром живых и мёртвых, ожидая подобного мгновения, под самым носом Плети — без малейшего её подозрения.\n\nЗнай же, что я — Бальназар. Знай, пока я пью твою жизнь, что я поселюсь в этой слабой оболочке, которую твоя душа некогда звала домом. Знай, что я развращу и уничтожу всё и всех, кого ты когда-либо любил.\n\nОстальное — арифметика. Лицо Датрохана дарит мне звание, доверие и двери, которых моё имя никогда бы не открыло. Пусть Сильвана оставит себе мёртвого Повелителя Ужаса и разрушенную корону. Под сталью и молитвой Крестоносца остаюсь лишь я.\n\nДля них Бальназар мёртв. Этого достаточно."
 wc_balnazzar_story.1001.a: "Надеть маску."
 wc_balnazzar_story.1001.a_magic_tooltip: "Каждая освоенная Бальназаром магическая дисциплина, каждый ранг и талант переходят в это тело и скрываются под обличьем"
 wc_balnazzar_story.1001.b: "Датрохана уже нет. Здесь больше нечего надевать."
 wc_balnazzar_story.1001.b_tooltip: "История заканчивается здесь — не осталось оболочки, достойной ношения, и не осталось цели, к которой можно было бы стремиться"
 wc_balnazzar_story.1002.title: "Лицо, которое не моё"
 wc_balnazzar_story.1002.desc: "Я просыпаюсь в теле, что некогда принадлежало другому, в комнате, что некогда была его, нося имя, которое открывает двери, каких моё не могло. Мгновение — и даже мне приходится напоминать себе, кто из нас мёртв.\n\nВсем, чем был Сайдан Датрохан, теперь стал я. [ROOT.Char.GetPrimaryTitle.GetName] и [ROOT.Char.GetGold|0] золота в казне, которая ни разу не спросила, чьи руки её считали. Его двор, его домочадцы, его владения — всё это настоящее, всё это моё: унаследовано, а не захвачено. Никто не ставит под сомнение рыцаря собственного Великого Крестоносца, стоящего там, где он всегда стоял.\n\nТо, что я принёс с собой, остаётся ровно там, где я его оставил, — каждая освоенная мной магическая дисциплина, каждый ранг и талант, что я когда-либо обретал, целиком перенесённые под этим заимствованным лицом. Никто здесь не может их увидеть. В этом-то и суть.\n\nПлан никогда не был лишь в том, чтобы пережить падение Лордерона. Кел'Тузад всё ещё ждёт в склепах Стратхольма со старым долгом между нами. Рено Могрейн смотрит на брата так, как голодный смотрит на пир, а смерть отца можно выдать за дело Плети. А за ними обоими — Орден, что всё ещё преклоняет колени перед любым, кто носит это лицо, — Орден, который я намерен превратить в нечто значительно менее святое."
 wc_balnazzar_story.1002.a: "Начать."
 wc_balnazzar_story.1002.a_tooltip: "Его двор, его домочадцы, его владения — унаследованы, а не захвачены. Ваши собственные магические таланты переносятся и остаются скрытыми под обличьем, невидимыми для всех в этой новой жизни"
 wc_balnazzar_story.1003.title: "Оболочка приживается"
 wc_balnazzar_story.1003.desc: "Лицо Датрохана ещё не до конца стало моим. Я медлю перед тем, как заговорить, прислушиваясь к голосу, что некогда отвечал иначе, и всякий раз ловлю себя прежде, чем это заметит кто-то другой.\n\nНеважно. Скорбь одинаково выглядит на любом лице, а скорбь — всё, что Великий Крестоносец должен своему двору этой ночью. Зависть Рено всё ещё нужно взращивать. Армии всё ещё нужен повод преклонить колени. А в склепах Стратхольма старый долг ждёт терпения, которого ему никогда не обещали."
 wc_balnazzar_story.1003.a: "Отправить весть в склепы этой ночью."
 wc_balnazzar_story.1003.a_tooltip: "Кел'Тузад будет ждать вас, когда придёт время"
 wc_balnazzar_story.1003.b: "Сперва дать скорби утихнуть."
 wc_balnazzar_story.1004.title: "Давняя договорённость"
 wc_balnazzar_story.1004.desc: "Кел'Тузада не нужно призывать — достаточно заметить его присутствие: неподвижность в склепах, которой не было прежде, голос, звучащий без вестника. Я говорю ему, что мне нужно: чтобы мёртвые Стратхольма поднялись в достаточном количестве в тот день, когда у меня наконец будет повод провести отца Рено сквозь них, — чтобы никто не спросил, почему засада удалась.\n\nОн не просит ни золота, ни услуги, ни даже благодарности. Лишь чтобы я помнил, когда придёт срок расплаты, что мёртвые были сперва его идеей. Я соглашаюсь. Мне ничего не стоит согласиться с трупом."
 wc_balnazzar_story.1004.desc_confirmed: "То, о чём мы с Кел'Тузадом договорились в ночь, когда я отправил весть, теперь нужно лишь произнести вслух, чтобы никто из нас впоследствии не истолковал другого превратно. Мёртвые Стратхольма поднимутся в достаточном количестве в тот день, когда у меня наконец будет повод провести отца Рено сквозь них, — чтобы никто не спросил, почему засада удалась.\n\nОн не просит ни золота, ни услуги, ни даже благодарности — никогда и не просил. Лишь чтобы я помнил, когда придёт срок расплаты, что мёртвые были сперва его идеей. Я уже согласился на это. Произнести это вновь мне ничего не стоит."
 wc_balnazzar_story.1004.a: "Согласиться на его цену."
 wc_balnazzar_story.1004.b: "Кел'Тузада больше нет. Мёртвые поднимутся сами по себе — или не поднимутся вовсе."
 wc_balnazzar_story.1004_pact_tooltip: "Закрепляет вашу договорённость с Кел'Тузадом — открывает путь к тому, чтобы обратить Рено против отца"
 wc_balnazzar_story.1005.title: "Зависть сына"
 wc_balnazzar_story.1005.desc: "Рено смотрит на брата Дариона так, как голодный смотрит на пир, — на гордость Александроса, его воинский дар, его право первородства. У Рено нет ничего из этого, и он это знает, и это гложет его.\n\nМне лишь нужно полить уже посаженное семя. Слово здесь о том, как отец предпочитает одного сына другому. Намёк, что Александрос намерен лишить его наследства. Ничто из этого не обязано быть правдой. Достаточно, чтобы в это поверили.\n\nС Кел'Тузадом уже договорено — о мёртвых позаботится он в тот день, когда Рено проведёт своего отца сквозь них. Остался лишь сам Рено."
 wc_balnazzar_story.1005.a: "Пусть юноша докажет себя отцу."
 wc_balnazzar_story.1005.a_tooltip: "Начинает интригу по убийству Александроса Могрейна"
 wc_balnazzar_story.1005.b: "Рено вне досягаемости. Семя так и не будет посажено."
 wc_balnazzar_story.1005.b_tooltip: "История заканчивается здесь — без Рено не остаётся рычага давления на Александроса"
 wc_balnazzar_story.1006.title: "Засада, которой не было"
 wc_balnazzar_story.1006.desc: "Весть достигает меня, прежде чем тело успевает остыть. Мёртвые Стратхольма поднялись по расписанию — в достаточном количестве, чтобы к тому моменту, когда стража Александроса заметила неладное, они уже сражались за собственную жизнь, а не за его. Удобный хаос — такой, что лишь тот, кто знает, где искать швы, сочтёт его невезением.\n\nРено нашёл отца ровно там, где я сказал ему, что тот будет. Мне докладывают, что он не колебался — что клинок вошёл чисто, как бьёт юноша, неделями убеждавший себя, что это милосердие, а не убийство. Цена Кел'Тузада уже уплачена. Это лишь то, что было обещано мёртвым, доставленное по расписанию.\n\nРено понесёт это с собой, куда бы ни отправился. Я позабочусь о том, чтобы это принесло его куда-нибудь полезное."
 wc_balnazzar_story.1006.a: "Я был должен мёртвым и уплатил обещанную цену."
 wc_balnazzar_story.1007.title: "Кровь на серебре"
 wc_balnazzar_story.1007.desc: "После случившегося Рено приходит ко мне с пустыми глазами и пустыми руками: он не смог пронести клинок дальше дверного проёма, где убил отца. Я даю ему то, чего отец так и не сумел дать, — одобрение, облачённое в долг. Перед капитулом я благословляю его как Командора того, что грядёт, и возвышаю рядом с ним Изиллиена и Аббендисов — людей, столь уверенных в собственной праведности, что им никогда не придёт в голову спросить, почему я выбрал именно их.\n\nОрден преклоняет колени перед своим Великим Крестоносцем, как и всегда. Он просто пока не знает, Великим Крестоносцем чего именно.\n\nСеребро всегда было заимствованным цветом, рыцарским блеском, дарованным светом, который Ордену никогда не было дано удержать. Я наконец-то перекрасил его как следует. Лев на белом остаётся — сам Лордерон, узнаваемый и поныне, — но сам зверь теперь алый, как всё, что в конце концов оказывается под этим знаменем.\n\nТо, что было короной королевства и второй короной рядом с ней, — собственный трон Лордерона и трон Стратхольма, земля, на которой стоял этот Орден, — теперь подчиняется ему, а не тому, что ещё держалось за оба титула. Мне даже не пришлось оформлять это завоевание на бумаге. Смерть Александроса сделала это за меня, а рука Рено довершила остальное.\n\nЗнамени нужна армия под ним, прежде чем кто-то воспримет цвет всерьёз. Я собираю её — не гарнизон, а воинство, из всех залов, что ещё подвластны Ордену, — и даю ей цель, более древнюю, чем сам цвет: ответить мёртвым их же неумолимостью, пока в Лордероне не останется ничего, что ещё помнит, как восставать."
 wc_balnazzar_story.1007.a: "Пусть родится Алый Орден."
 wc_balnazzar_story.1007.a_de_jure_tooltip: "Власть Ордена де-юре простирается на каждое герцогство Лордерона и Стратхольма"
 wc_balnazzar_story.1007.a_vassal_conversion_tooltip: "Каждый вассал, всё ещё следующий Святому Свету, обращается в Алосветск вместе с вами"
 wc_balnazzar_story.1007.b: "Без Рено не останется Ордена, который можно унаследовать."
 wc_balnazzar_story.1007.b_tooltip: "История заканчивается здесь — без Рено не останется Ордена, который можно унаследовать"
 scarlet_crusade_custom_name: "Алый Орден"
 wc_balnazzar_story.1008.title: "Стратхольм пал"
 wc_balnazzar_story.1008.desc: "Город наш. Всё, что ползало по его улицам после зачистки Артаса, во второй раз предано мечу, и над его вратами поднимаются алые знамёна, а не серебряные черепа.\n\nСтарая вера ещё не выжжена дотла — на это уйдёт больше, чем одна битва. Но земля, на которой она стояла, теперь принадлежит мне."
 wc_balnazzar_story.1008.a: "Со временем очищение завершится."
 wc_balnazzar_story.1009.title: "Пепел, ставший целым"
 wc_balnazzar_story.1009.desc: "Стратхольм снова наш — каждая улица, каждая ферма, каждая душа в нём выжжена дотла от того, во что верила прежде. Рядом с ним стоит Новый Авалон — монумент, возведённый на земле, что некогда принадлежала молчанию Кел'Тузада.\n\nОрден, который я унаследовал, никогда не владел столь многим из своего города-основателя. А я владею. Весть об этом разнесётся дальше, чем мне бы хотелось, — но пусть говорят. Королевство, которое тебя боится, уже наполовину стоит на коленях."
 wc_balnazzar_story.1009.a: "Пусть говорят."
 wc_balnazzar_story.2000.title: "Маска спадает"
 wc_balnazzar_story.2000.desc: "Оболочка никогда не должна была продержаться — краденое мясо стареет быстрее, чем следует, и даже самая осторожная ложь в конце концов встречает того, кто достаточно умён или достаточно упрям, чтобы разглядеть её насквозь. Я годами был терпелив. Терпение всегда было лишь инструментом.\n\nСайдан Датрохан умирает здесь, по-настоящему на этот раз. Пусть остальной Орден двинется дальше без него, преследуя войну, которая мне больше не нужна. Стратхольм всегда был единственной частью этого, что по-настоящему принадлежала мне."
 wc_balnazzar_story.2000.a: "Забрать Стратхольм. Пусть остальной Орден получит свою войну."
 the_risen: "Восставшие"
