l_english:
 pam_clergy_events.0001.t: "Quo Nomine Vis Vocari?"
 pam_clergy_events.0001.desc: "My [chaplain.GetCouncilTitle|l] [chaplain.GetFirstName] turns to the next blank line in the register of Saint Peter's successors, a living testimony to [GetTenetType('tenet_apostolic_succession').GetName( GetPlayer.GetRite )].\n\n#emp \"The name you choose will outlive your reign by a thousand generations.\"#! \n\n[chaplain.GetHerHis|U] quill marks the place where the ink must be placed.\n\n#emp \"Quo nomine vis vocari?\"#!"
 pam_clergy_events.0001.a: "Let it be known for all time."
 
 pam_clergy_events.0003.t: "A Tenet Recast"
 pam_clergy_events.0003.desc: "A core tenet of [pam_recast_rite.GetNameNoTooltip] has changed under [pam_recast_pope.GetTitledFirstName]: [tenet_to_remove.GetBaseName] gives way to [tenet_to_add.GetBaseName]."
 
 
 pam_clergy_events.0010.t: "The Will of the [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))|U]"
 pam_clergy_events.0010.desc.intro: "As a [cardinalate.GetHolder.GetTitleAsNameNoTooltip] I am an extension of the Holy [actor.Custom('GetMotherFatherPossessive')|U] will.\n\n"
 pam_clergy_events.0010.desc.puppet.intro: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('actor'))], who I honor above all others, guides my hand in my duties as a [cardinalate.GetHolder.GetTitleAsNameNoTooltip].\n\n"
 pam_clergy_events.0010.desc: "In [actor.GetHerHis] infinite wisdom [actor.GetTitledFirstName] has deemed it necessary for me to pursue"
 pam_clergy_events.0010.desc.develop: "the development of public works for the prosperity of all [recipient.GetFaith.GetAdherentNamePlural] in [archdiocese.GetName]."
 pam_clergy_events.0010.desc.convert_faith: "a mission to bolster the conversion of [ROOT.Char.Custom('GetUnbelieverNamePlural')] in and around [archdiocese.GetName]."
 pam_clergy_events.0010.desc.increase_control: "a mission to pacify the populace in [archdiocese.GetName]."
 pam_clergy_events.0010.desc.cultural_fascination: "a mission to accelerate the research of new technologies for [actor.GetHerHis] fellow [actor.GetCulture.GetCollectiveNoun]."
 pam_clergy_events.0010.desc.epidemic_resistance: "the marshaling of church resources to aid in plague mitigation in [archdiocese.GetName]."
 pam_clergy_events.0010.desc.improve_legitimacy: "a mission to bolster the legitimacy of [recipient.GetFaith.GetAdjective] monarchs in [archdiocese.GetName]."
 pam_clergy_events.0010.desc.undermine_legitimacy: "a mission to undermine the legitimacy of [recipient.GetFaith.GetAdjective] monarchs in [archdiocese.GetName]."
 pam_clergy_events.0010.a: "\"I will make it so [actor.Custom('FormOfAddressForLiege')]!\""
 pam_clergy_events.0010.b: "Tithes can be better spent..."

 pam_clergy_events.0030.t: "Habemus Papam"
 pam_clergy_events.0030.t.female: "Habemus Mamam"
 pam_clergy_events.0030.desc: "White smoke proclaims the new [new_pope.GetTitledFirstName] in the center of [new_pope.GetCurrentLocation.GetName]:\n\n"May the Holy Apostles Peter and Paul, in whose power and authority we trust, intercede for us before the Lord. And may the blessing of Almighty God, the Father, and the Son, and the Holy Spirit, come down on you and remain with you forever."\n\n"Amen.""
 pam_clergy_events.0030.a: "Glory to the throne of Saint Peter."
 pam_clergy_events.0030.b: "A false prophet seems to have arisen."
 pam_clergy_events.0030.b.tt: "The [GetDecisionWithKey('declare_antipope_decision').GetName] [decision|E] is cheaper for #V 15 years#!"
 pam_clergy_events.0030.aa: "Who cares about the matters of the Church?"
 pam_clergy_events.0030.aa.tt: "Future Habemus Papam events will appear as messages instead"
 pam_clergy_events.0030.feed: "[new_pope.GetTitledFirstName] has been elected [head_of_faith|E]."

 pam_clergy_events.0040.opening: "To the pious [head_of_faith.Custom2('AppropriateGreeting', ROOT.Char)],"
 pam_clergy_events.0040.desc: "With the Sacred College diminished, I have seen fit to elevate you to the cardinalate. Let your piety and wisdom strengthen the Church in this hour of need."
 pam_clergy_events.0040.appoint_tt: "You are appointed [cardinal|E]"
 pam_clergy_events.0040.a: "I accept this sacred burden."

 pam_clergy_events.0041.opening: "To the seat of Saint Peter,"
 pam_clergy_events.0041.desc: "The College of Cardinals stands incomplete, and you have not yet filled the seats left vacant by our most pious [ROOT.Char.GetWomenMen].\n\nI will not leave the Church unprotected! I take the red hat upon myself."
 pam_clergy_events.0041.appoint_tt: "[cardinal_candidate.GetShortUIName|U] proclaims [cardinal_candidate.GetHerselfHimself] [cardinal|E]"
 pam_clergy_events.0041.a: "This insolence will not be forgotten."

 pam_clergy_events.0042.opening: "$pam_clergy_events.0041.opening$"
 pam_clergy_events.0042.desc: "The seats of the College stood empty, and the Church cannot wait upon ceremony. Several of our most pious have taken up the red hat together, and the College is whole once more.\n\nWe trust you will forgive our haste."
 pam_clergy_events.0042.a: "A full College serves me better than an empty one."
 
 #Clerical Region capital converts to another Faith with Clerical Regions
 pam_clergy_events.0051.t: "A Seismic Shift in Faith"
 pam_clergy_events.0051.desc: "My seat in [county.GetNameNoTier|U] shakes beneath me. The souls I have dedicated my life to serving now pray as [new_faith.GetAdherentNamePlural].\n\nDo I convert and maintain control? I would be able to care for the people of [title.GetName], but can I meaningfully help those who are no longer [old_faith.GetAdherentNamePlural]? Can any good come from us all being forced to practice [new_faith.GetNameNoTooltip]?!"
 pam_clergy_events.0051.a: "Whatever is necessary to serve my flock."
 pam_clergy_events.0051.a.keep_see_tt: "You maintain control of [title.GetName]"
 pam_clergy_events.0051.b: "I can only serve fellow [old_faith.GetAdherentNamePluralNoTooltip]."
 pam_clergy_events.0051.b.tt: "All your [landed|E] [titles|E] are destroyed"
 pam_clergy_events.0051.c: "I accept the end of my office."
 pam_clergy_events.0051.c.tt: "[SelectLocalization( HasDlcFeature( 'roads_to_power' ), 'pam_clergy_events.0051.c.tt_ep3', 'pam_clergy_events.0051.c.tt_no_ep3' )]"
 pam_clergy_events.0051.c.tt_ep3: "#mixed_value #BER You will establish an [adventurer|E] [camp|E]#!#!"
 pam_clergy_events.0051.c.tt_no_ep3: "#negative_value #BER You [game_over|E]#!#!"

 #Generic clerical region faith mismatch
 pam_clergy_events.0052.t: "The End of [title.GetNameNoTooltip]"
 pam_clergy_events.0052.desc: "However it came to pass, I can no longer rightfully shepherd [title.GetDefinitiveName]. What the Church once placed in my hands now passes from them."
 pam_clergy_events.0052.a: "So be it."

 # A kinsman takes a great office of the Church
 pam_clergy_events.0060.t.pope: "A [new_prelate.GetDynasty.GetNameNoTooltip] on Saint Peter's Throne"
 pam_clergy_events.0060.t.head_of_faith: "A [new_prelate.GetDynasty.GetNameNoTooltip] [new_prelate.GetFaith.ReligiousHeadName|U]"
 pam_clergy_events.0060.t.antipope: "A [new_prelate.GetDynasty.GetNameNoTooltip] Claims the [new_prelate.GetFaith.ReligiousHeadTitleName|U]"
 pam_clergy_events.0060.t.archbishop: "A [new_prelate.GetDynasty.GetNameNoTooltip] Takes Up the Crozier"
 pam_clergy_events.0060.desc.intro: "Long has our dynasty sought to guide Christendom. Now [new_prelate.GetFaith.HighGodName|U] has seen fit to elevate the [new_prelate.GetDynasty.GetName] to new heights.\n\n"
 pam_clergy_events.0060.desc.pope: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] has been raised to the Throne of Saint Peter, [new_prelate.GetFaith.HighGodNamePossessive] vicar on earth."
 pam_clergy_events.0060.desc.head_of_faith: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] holds [prelate_title.GetDefinitiveName]."
 pam_clergy_events.0060.desc.hof_outro: "Kings and Emperors are but children in the shadow of their Holy [new_prelate.Custom('GetMotherFatherPossessive')|U] will. An army of [new_prelate.GetFaith.BishopMalePlural] is now at the command of a [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.antipope: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] has been proclaimed [new_prelate.GetFaith.ReligiousHeadName|U] while another still sits. Every [new_prelate.GetFaith.GetAdherentName] must now choose who is the representative of [new_prelate.GetFaith.HighGodName|U]. Until settled, all our souls are imperiled."
 pam_clergy_events.0060.desc.archbishop: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('new_prelate'))] [new_prelate.GetFirstName] has been invested with [prelate_title.GetDefinitiveName]. Tithes, abbeys, and the consecration of every [new_prelate.GetFaith.BishopNeuter] beneath [new_prelate.GetHerHim] are now guided by a [new_prelate.GetDynasty.GetNameNoTooltip]."
 pam_clergy_events.0060.desc.different_faith: "\n\n[new_prelate.GetHerHis|U] faith is [new_prelate.GetFaith.GetNameNoTooltip] and not [ROOT.Char.GetFaith.GetNameNoTooltip], but we are family all the same."
 pam_clergy_events.0060.a: "A blessing for the Church and [new_prelate.GetDynasty.GetNameNoTooltip] alike."
 pam_clergy_events.0060.a.antipope: "That quarrel is not mine to inherit."
 pam_clergy_events.0060.b: "I would appreciate a closer look at [prelate_title.GetDefinitiveNameNoTooltip]."
 pam_clergy_events.0060.b.antipope: "Only I can solve this crisis."
 pam_clergy_events.0060.b.tt: "@warning_icon! You will abandon your current character and cannot resume playing as them later.\n\n#TUT When [new_prelate.GetShortUINameNoTooltip] dies, you will play as your [player_heir|E], who inherits this [ecclesiastical|E] office by [appointment|E] or election, not by [dynasty|E] succession.#!"
 pam_clergy_events.0060.b.faith_tt: "[new_prelate.GetTitledFirstName|U] does not share your faith. You would continue as [new_prelate.GetFaith.GetAdherentName]."
 pam_clergy_events.0060.b.antipope_tt: "[new_prelate.GetTitledFirstName|U] holds the office by defiance rather than by election. Everyone who rejects the claim will come for it."
