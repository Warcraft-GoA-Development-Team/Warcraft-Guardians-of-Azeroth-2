 building_stormstout_brewery_02: "Погреб Штормопортов"
 building_stormstout_brewery_02_desc: "Прохладное тёмное место, где сваренное пиво хранится для выдержки, обретая желаемые вкус и качество."
 building_stormstout_brewery_03: "Варочные чаны Штормопортов"
 building_stormstout_brewery_03_desc: "Большие ёмкости, где кипятится сусло и добавляются травы или хмель, — важнейший этап варки, придающий горечь и аромат."
 building_stormstout_brewery_04: "Зерновой амбар Штормопортов"
 building_stormstout_brewery_04_desc: "Амбар для хранения больших запасов зерна в сухости и в безопасности от вредителей, обеспечивающий постоянный приток ингредиентов для варки."
 building_stormstout_brewery_05: "Колодезный дом Штормопортов"
 building_stormstout_brewery_05_desc: "Колодец, созданный для надёжного источника чистой воды, необходимой для пива высшего качества."
 building_stormstout_brewery_06: "Бочарная Штормопортов"
 building_stormstout_brewery_06_desc: "Место, где выбродившее пиво бережно хранится в бочках, герметично закупоренных и готовых к разливу."
 building_stormstout_brewery_07: "Комната розлива Штормопортов"
 building_stormstout_brewery_07_desc: "Отдельное помещение для наполнения кегов. Их часто используют для больших объёмов, и они пользуются спросом у трактиров и таверн."
 building_stormstout_brewery_08: "Дегустационный зал Штормопортов"
 building_stormstout_brewery_08_desc: "Зал, где пивовары и гости могут продегустировать разные сорта пива — возможность насладиться новейшими напитками."
