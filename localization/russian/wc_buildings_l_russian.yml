 building_temple_sethraliss: "Храм Сетралисс"
 building_temple_sethraliss_desc: "Столетия назад Сетралисс, могущественная лоа-змея, пожертвовала собой, чтобы помешать Митраксу выпустить своего господина на Азерот. После битвы её преданные последователи перенесли её останки и воздвигли вокруг них храм, ожидая её перерождения."
