 culture_parameter_is_undead:0 "Whether serving as the minions of the Burning Legion, swearing loyalty to the Lich King himself, or pursuing freedom by any means necessary; the Undead spread fear in all that is living."
 culture_parameter_liberated_undead:0 "Having been liberated from the grasp of necromantic control, this culture has a government similar to living beings and a profound hatred of the Scourge and Burning Legion."
 
