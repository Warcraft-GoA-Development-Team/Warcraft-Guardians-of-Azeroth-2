l_russian:
 order_of_the_silver_hand_events.001.t: "Убийца короля"
 order_of_the_silver_hand_events.001.desc: "Свет во имя!\n\nБеда обрушилась на Лордерон. Принц [killer.GetFirstNameNoTooltip] вернулся из Нордскола, объятый безумием. Он убил собственного отца и теперь стремится принести гибель Лордерону и всему вокруг.\n\nКак это могло случиться? Я был его наставником, моей обязанностью было привить ему добродетели Серебряной Длани. Даже когда он перешёл черту и совершил очищение Стратхольма, он всё ещё стремился защитить королевство. Всякий правитель вынужден принимать тяжёлые решения ради своего народа. Но теперь мне предстоит принять своё.\n\nМои собратья-паладины собрались, и теперь мне надлежит вести их против нежити Плети. Но раз [killer.GetFirstNameNoTooltip] стоит во главе её — это означает, что мне придётся убить его..."
 order_of_the_silver_hand_events.001.a: "Нет… я не смогу. Я навсегда сложу молот…"
 order_of_the_silver_hand_events.001.b: "Проклятье… Я сам тебя остановлю, [killer.GetFirstNameNoTooltip]!"
 order_of_the_silver_hand_events.001.c: "Лордерон должен быть защищён любой ценой."
 order_of_the_silver_hand_events.001.d: "Народу Лордерона нужна наша помощь."
