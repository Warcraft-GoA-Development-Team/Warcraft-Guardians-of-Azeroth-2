l_english:
  wc_mograine_whitemane_agent:0 "Zealous Confidant"
  wc_mograine_whitemane_agent_desc:0 "Someone ever ready to see faith enforced with fire and steel, and to ask no questions of what it's building."
  wc_mograine_whitemane_agent_i:0 "Zealous Confidant"

  wc_mograine_voss_agent:0 "Stubborn Conspirator"
  wc_mograine_voss_agent_desc:0 "Someone who trusts the Grand Crusader's judgment too much to ask what it's for."
  wc_mograine_voss_agent_i:0 "Stubborn Conspirator"

  wc_mograine_founders_agent:0 "Respected Elder"
  wc_mograine_founders_agent_desc:0 "One of the old guard, close enough to Alexandros's circle to lend cover - and unwilling to believe him betrayed."
  wc_mograine_founders_agent_i:0 "Respected Elder"

  wc_mograine_enforcer_agent:0 "Ruthless Enforcer"
  wc_mograine_enforcer_agent_desc:0 "Someone whose blade settles arguments the Grand Crusader would rather not have out loud."
  wc_mograine_enforcer_agent_i:0 "Ruthless Enforcer"

  wc_mograine_watcher_agent:0 "Silent Watcher"
  wc_mograine_watcher_agent_desc:0 "Someone who sees everything in the household and repeats none of it - except to Dathrohan."
  wc_mograine_watcher_agent_i:0 "Silent Watcher"

  wc_mograine_assassination_outcome.1001.title:0 "The Long Approach"
  wc_mograine_assassination_outcome.1001.desc:0 "My father plans another sweep through Stratholme's dead, and asks me to lead the column in. Darion would have gone gladly, proudly, the way he does everything. I go instead, and no one thinks to ask why I offered.\n\nIt only needs to look like the dead did it."
  wc_mograine_assassination_outcome.1001.a:0 "Lead the column in."

  wc_mograine_assassination_outcome.1003.title:0 "Renault's Own Doubt"
  wc_mograine_assassination_outcome.1003.desc:0 "Some nights I still think of turning back - riding home, letting Darion have the glory he was always going to get anyway. Then I remember the way my father looks at him and not at me, and the thought passes, the way it always does."
  wc_mograine_assassination_outcome.1003.a:0 "Push the thought away."

  wc_mograine_assassination_outcome.1004.title:0 "A Seed of Doubt"
  wc_mograine_assassination_outcome.1004.desc:0 "Someone whispered too loudly, or looked too long at the wrong shadow. Alexandros comes to me today with a question he does not quite ask outright - not an accusation, not yet. Just a man measuring the face of his most trusted advisor for cracks.\n\nI show him none. Whatever he suspects, he does not yet believe it enough to act on - and doubt, left to starve, has a way of forgetting its own shape."
  wc_mograine_assassination_outcome.1004.a:0 "Meet his eyes and give him nothing."

  wc_mograine_assassination_invalidated_title:0 "The Moment Passes"
  wc_mograine_assassination_invalidated_desc:0 "Whatever I meant to do at Stratholme, the chance for it is gone."

  wc_mograine_assassination_outcome.2001.title:0 "The Ambush at Stratholme"
  wc_mograine_assassination_outcome.2001.desc:0 "Renault leads them in - his father, and Fairbanks, the old priest who has never once doubted Alexandros. Ahead, Stratholme's dead rise in numbers no war council prepared for.\n\nRenault finds a doorway to hide in. Fairbanks fights until the corpses pin him under their own dead weight, breath crushed thin but not gone - he will crawl out of this alive, though nothing that happens next will let him prove it mattered. Alexandros fights alone, and fights well, and fights until his arms will no longer answer him - until Ashbringer slips from his grip and rings against the stone.\n\nRenault steps out of the dark. His father does not even raise a hand against him. The blade that has slaughtered ten thousand of the undead takes a mortal man's life for the first time, and something in it curdles at the wrongness of it - the way faith curdles into zealotry when grief is the only fuel left.\n\nRenault cannot make himself pick it back up. He leaves it beside the body and walks away."
  wc_mograine_assassination_outcome.2001.a:0 "Watch the boy become a weapon."

  wc_mograine_assassination_outcome.2002.title:0 "A Brother's Grief"
  wc_mograine_assassination_outcome.2002.desc:0 "Word reaches Darion before I need to send it - Stratholme's dead do their own kind of talking. He grieves the way the favored son is allowed to, openly, publicly. But grief has a way of asking questions that eulogies don't answer, and Renault was the one who lived.\n\nI have not decided yet whether that's a problem I need to solve."
  wc_mograine_assassination_outcome.2002.a:0 "Let him wonder."
  wc_mograine_assassination_outcome.2002.a.accepts:0 "Whatever he wonders, he keeps it to himself. Grief closes the questions it opens, eventually. It has for him."
  wc_mograine_assassination_outcome.2002.a.suspects:0 "He does not say it outright, not yet, but I see it settle into him - the particular stillness of a man rearranging what he thought he knew. Darion suspects me now. Good. Let him."

  wc_mograine_assassination_outcome.2003.title:0 "The Blade Changes Hands"
  wc_mograine_assassination_outcome.2003.desc:0 "Renault leaves the blade where it falls, too much a coward to carry what he's made of it. No matter - I never needed him to deliver it himself, only to make certain it would be lying somewhere unguarded when I came looking.\n\nAshbringer was always going to end up in patient hands eventually. Mine were simply the ones already waiting."
  wc_mograine_assassination_outcome.2003.a:0 "Claim what was promised."

  wc_mograine_assassination_outcome.2004.title:0 "A Priest's Silence"
  wc_mograine_assassination_outcome.2004.desc:0 "Fairbanks survived Stratholme when better men did not, and gratitude has made him careless. He comes to me with an accusation he cannot prove - that I sent Alexandros to die on purpose, that something is wrong with the man wearing Saidan's face.\n\nHe is not wrong. He is simply the only one saying it out loud.\n\nI have him examined for the infection every survivor of that ambush should fear, and the examination finds exactly what I need it to find. No one questions a quarantine. No one mourns a man already presumed contagious."
  wc_mograine_assassination_outcome.2004.a:0 "Let the examination find what it needs to."

  wc_mograine_assassination_outcome.2005.title:0 "What the Blood Bought"
  wc_mograine_assassination_outcome.2005.desc_bound:0 "The ones who helped me carry a weight now, whether they've noticed it yet or not. I made certain of that before the blood on Ashbringer had even dried - a favor owed, a debt unspoken, something they'll feel tugging at them the next time they think of crossing me."
  wc_mograine_assassination_outcome.2005.desc_alone:0 "They did what I paid or persuaded them to do, and then they simply... walked away. No debts. No leverage. No one who'd think twice before talking, if it ever came to that. I will need to be more careful about who I use, next time."
  wc_mograine_assassination_outcome.2005.a:0 "Good. Let them feel it."
  wc_mograine_assassination_outcome.2005.b:0 "Noted. I'll need better hooks than that."

  wc_mograine_assassination_outcome.2006.title:0 "A Puppet Among the Faithful"
  wc_mograine_assassination_outcome.2006.desc:0 "One of them never truly chose to help me - I simply made sure they couldn't refuse. They still don't know it. I check, from time to time, that the leash still holds."
  wc_mograine_assassination_outcome.2006.a:0 "It holds. For now."
  wc_mograine_assassination_outcome.2006.b:0 "Something in their eyes has changed. They know."

  wc_mograine_assassination_outcome.4001.title:0 "Nerve Breaks"
  wc_mograine_assassination_outcome.4001.desc:0 "My father lowers his guard, and for one long moment I have every opening I need. I take none of them. My hand will not close around the hilt, and the moment passes into an ordinary skirmish like any other.\n\nThere will be another Stratholme. There always is."
  wc_mograine_assassination_outcome.4001.a:0 "Walk away. Not today."
  wc_mograine_assassination_outcome.4001.a_tooltip:0 "The scheme is not over - it will attempt itself again, given time"
