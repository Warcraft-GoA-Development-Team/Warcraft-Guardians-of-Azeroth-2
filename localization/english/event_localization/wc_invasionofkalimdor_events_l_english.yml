 invasionofkalimdor_0002_title: "Exodus of the Horde"
 invasionofkalimdor_0002_desc: "In my restless sleep, I hear voices.\n\n"The sands of time have run out, child of the Frostwolves. The cries of war echo upon the winds. The remnants of the past scar the lands, which is besieged once again by conflict."\n\nI see the assembled Horde chanting warcries and marching towards conquest, our wardrums shaking this very land. The human kingdoms, our enemy since we have entered this new world, stand against us in their thick shields and armor, the blood of both our races nourishing the soil time and time again.\n\n"Heroes arise to challenge fate and lead their brethren to battle. As mortal armies rush blindly towards their doom, the Burning Shadow comes to consume us all."\n\nThe sky burns as our races ignorantly clash, uncanny beasts arise from the fallen flames and set upon the mangled armies.\n\n"You must rally the Horde and lead your people to their destiny... seek me out.""
 invasionofkalimdor_0002_a: "What kind of nightmare was that?"

 invasionofkalimdor_0003_title: "Exodus of the Horde"
 invasionofkalimdor_0003_desc: "I shake my head as I go outside to get some fresh air. "It was not a nightmare, but a vision." I look up at the sight of a raven voicing its thoughts. A moment later, the raven transforms into a Human.\n\n"Greetings, [thrall_or_frostwolf_leader.GetName]." I nod to the mysterious Human's introduction.\n"It was you who I saw in the vision... in that nightmare... Who are you? How do you know me?" I ask the Human.\n"I know many things, warchief, about you and your people. My identity, at this time, is unimportant. What is important is that you rally your people and leave these shores immediately."\n"Leave? What's these all about, Human?" Is he trying to deceive me?\n\nHe laughs and turns around, looking to the north. "Human? I left my humanity behind long ago. I am something... different now. Know that I have seen the future and beheld the great burning shadow that is coming to consume this world. You sense it as well, don't you?"\nI approach the Human and observe a storm brewing in the north. "The demons... they are returning."\n\n"Yes. And only by leading your people across the sea, to the distant lands of Kalimdor, will you have a chance to stand against them!", before I could interrupt his proposal he continues. "I will answer all your questions in time, warchief. For now, rally your warriors and prepare to leave this land. We will speak again."\n\nThe Human once again tansforms into a raven and flies away. None of this makes sense, but the spirits tell me that I should trust him... But can I?"
 invasionofkalimdor_0003_a: "We are like prisoners here anyway..."
 you_will_talk_to_the_warsong_leader: "You will approach the leader of the Warsong Clan"
 invasionofkalimdor_0003_b: "Azeroth is where our ancestors wished our home to be in"
 this_end_the_story_content_for_orcs: "This will end the story content of Burning Legion invasion for orcs"

 invasionofkalimdor_0004_title: "Exodus of the Horde"
 invasionofkalimdor_0004_desc:  "A dignitary of the Frostwolf clan approaches my tent. "Hail to the [grommash_or_warsong_leader.GetName]! I come here to offer a proposal from [thrall_or_frostwolf_leader.GetName]." He hands me a parchment from the Warchief of the Frostwolves themselves.\n\nI consider my options after reading the proposal. The Horde cannot conquer Azeroth, that's for sure... The grudge borne against us by the Humans is too great even for them to let us hide peacefully in the fallow corners of their lands. Kalimdor might just provide us with a second chance and new prospects."
 invasionofkalimdor_0004_a: "Azeroth is a lost cause for the clans, Kalimdor it shall be!"
 you_agree_to_go_to_kalimdor: "You will travel with the Frostwolf clan towards Kalimdor"
 invasionofkalimdor_0004_b: "No... the pesky humans shall pay! Azeroth will be our land!"

 invasionofkalimdor_0005_title: "Exodus of the Horde"
 invasionofkalimdor_0005_desc: "The Warsong clan has accepted our deal. We prepare our banners and fellow orcs to set sail.\n\n[grommash_or_warsong_leader.GetName] pulls me aside to show me something. We both arrive at the shores to observe many human ships, seemingly abandoned.\n\n[grommash_or_warsong_leader.GetFirstName] pats me on the shoulders and laughs aloud. "Haha! These be the ships we got from raiding human lands! We can set sail on the humans' own ships!"\n\nI look at [grommash_or_warsong_leader.GetFirstName] with some brotherly pride welling up in me. "Perfect, [grommash_or_warsong_leader.GetFirstName]. Now we have to wait for the Horde to be prepared to set sail." As I turn around the Frostwolf clan and Warsong clan have already gathered around us. "We await your command, Warchief!" I hear one of the grunts say and others follow suit."
 invasionofkalimdor_0005_a: "Lok'tar ogar! To Kalimdor!"

 invasionofkalimdor_0006_title: "Exodus of the Horde"
 invasionofkalimdor_0006_desc: "The other Orcish clans have refused the call. They are either reckless or their shamans have gone insane to not notice what the spirits themselves insist.\n\nNonetheless, it won't stop the Frostwolf clan. I turn towards my clan and raise my weapon with confidence. "The Horde is assembled! And we shall be the true legacy of us Orcs! For the Horde!"\n\nI hear my clan chant behind mine as I turn around towards our ships. Now we set sail to the far east."
 invasionofkalimdor_0006_a: "Lok'tar ogar! To Kalimdor!"

 survivors_of_horde: "Orcish Survivors"

 invasionofkalimdor_0009_title: "Landfall"
 invasionofkalimdor_0009_desc: "Both the Clans land seperately on the shores of Kalimdor, preparing to set up bases and surveying this wild landscape.\n\nThere are many new races of hostile kind who harass our settlets. Both the Clans will have to pave our own paths for our people.\n\nSentient or not, any who stand in the way of our destiny will be driven before us! Lok'tar ogar!"
 invasionofkalimdor_0009_a: "Prepare for War!"

 invasionofkalimdor_0010_title: "Landfall"
 invasionofkalimdor_0010_desc: "Our people have finally landed on the shores of Kalimdor, some still busy surveying the new world with wonder and hope.\n\nNot even a day since our footfall on this land, we have been attacked by weird war-like creatures while constructing our bases and camps! They attack us with brutal ferocity but we endure them off.\n\nTo hell with negotiating with them. If they dare deny us our new home, we shall wipe them off of our new lands! Lok'tar ogar!"
 invasionofkalimdor_0010_a: "Prepare the Defenses!"

 invasionofkalimdor_0100_title: "The Longing for a Home"
 invasionofkalimdor_0100_desc: ""Is there nothing in this land but death and carnage?" I find myself thinking aloud as I slay the last of the attackers from those beastly tribes.\n\nAt least we have gained some good pieces of land in the course of this slaughter. Despite challenges and dangers all its own, this new home for the Orcs is serene and beautiful like our old world of Draenor. We shall defend it with our lives."
 invasionofkalimdor_0100_a: "For the Horde!"

 invasionofkalimdor_0101_title: "The Longing for a Home"
 invasionofkalimdor_0101_desc: "We have defeated the wild beasts of Kalimdor, now we rest for the time being. We will have to use our resources carefully and pick our battles. Anything reckless could be the end of what our new home is.\n\nThe Warsong clan shall flourish even in the greatest of storms!"
 invasionofkalimdor_0101_a: "For the Horde!"
