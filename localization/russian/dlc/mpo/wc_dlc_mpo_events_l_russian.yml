 nomad_events.0250.wc_civlilized_intro: "Ко мне при дворе прибыл чужеземный гость, несущий весьма странное послание, которое, как меня уверяют, заинтересует меня. Однако, когда [priest.GetSheHe] начинает говорить, я настолько ошеломлён, что начинаю думать, не изощрённая ли это шутка:\n\n"
 nomad_events.0250.wc_default_intro: "Некоторые из моих сородичей привели ко мне чужеземного гостя с посланием, которое, по их словам, меня заинтересует. Они возбуждённо жестами предлагают [priest.GetHerHim] говорить:\n\n"
 nomad_events.0250.wc: "«Немедленно казните этого богохульника!»"
