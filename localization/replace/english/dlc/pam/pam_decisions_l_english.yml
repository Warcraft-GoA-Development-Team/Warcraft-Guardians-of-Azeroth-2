pam_develop_clerical_court_decision: "Educate your Clerical Court"
pam_develop_clerical_court_decision_desc_christian: "Idle clerks make poor servants of [ROOT.Char.GetFaith.HighGodName]. Let me gather the household — ordain the worthy, school the ordained, and summon novices to my gates."
pam_develop_clerical_court_decision_desc: "Idle servants bring no honor to [ROOT.Char.GetFaith.HighGodName]. Let me gather the household — raise the worthy into the [clergy|E], school those who serve, and summon novices to my gates."
pam_develop_clerical_court_decision_tooltip: "Ordain, instruct, or recruit [clergy|E] for your court"
pam_develop_clerical_court_decision_confirm: "Gather the household"
pam_develop_clerical_court_decision_tt: "You gather your household and choose #EMP one#! of the following:\n$EFFECT_LIST_BULLET$ Up to [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] lay [courtiers|E] join the [clergy|E], each granting you extra [piety_i][piety|E]\n$EFFECT_LIST_BULLET$ Up to [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] court [clergy|E] gain [learning_i][learning|E] and [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] or [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E] / [trait_level_track_xp|E]\n$EFFECT_LIST_BULLET$ Up to [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] novices from the surrounding lands join your court and the [clergy|E]\n\nWhichever path you choose, you gain [GetPlayer.MakeScope.ScriptValue('pam_clerical_court_piety_reward_value')|V0] [piety_i][piety|E]\n\n#weak The rewards scale with your [learning|E], [piety_level|E], and religious [traits|E]; on occasion, a rare opportunity presents itself#!"
pam_develop_clerical_court_decision_candidates_tt: "You have a [courtier|E] fit to ordain or instruct, or a worthy candidate lives nearby"
pam_clerical_court_joins_clergy_tt: "Joins the [clergy|E] of [pam_clerical_patron.GetFaith.GetName]"
pam_clerical_court_ordain_toast: "[pam_clerical_ordained.GetShortUIName] Joins the Clergy"
pam_clerical_court_instruct_toast: "[pam_clerical_instructed.GetShortUIName] Grows in Wisdom"
pam_clerical_court_recruit_toast: "[pam_clerical_novice_current.GetShortUIName] Answers the Call"
pam_oblate_patron_reason: "A Famed Patron of Novices"
pam_oblate_patron_modifier: "Patron of Novices"
pam_oblate_patron_modifier_desc: "This character is renowned for supporting those called to religious service. Vows come cheaper, and parents part with their children more willingly."
pam_scriptorium_modifier: "Hall of Scribes"
pam_scriptorium_modifier_desc: "This character keeps a hall of scribes whose work draws learned minds to the capital."

pam_decision_events.0032.t: "Tending the Flock"
pam_decision_events.0032.desc.intro.christian: "I address the clerks and clergy of my household, weighing who shall be ordained and who still wants for guidance."
pam_decision_events.0032.desc.intro: "I address those who serve [ROOT.Char.GetFaith.GetName] at my court: who shall enter its service, and who wants for guidance?"
pam_decision_events.0032.desc.pupil: "\n\nMy pupil, [pam_clerical_pupil.GetFirstName], stands in prayer, eager to prove [pam_clerical_pupil.GetHerHis] worth."
pam_decision_events.0032.desc.no_pupil: "\n\nToo few among them have entered the service of the faith — a want I intend to remedy."
pam_decision_events.0032.desc.novice: "\n\nBeyond my household, a hopeful stranger named [pam_clerical_novice.GetFirstName] begs a place in the service of the faith."
pam_decision_events.0032.desc.outro.christian: "\n\nHow shall I tend the flock [ROOT.Char.GetFaith.HighGodName] has given me?"
pam_decision_events.0032.desc.outro: "\n\nHow shall I raise up those [ROOT.Char.GetFaith.HighGodName] has entrusted to me?"
pam_decision_events.0032.prodigy: "My pupil has a divine gift!"
pam_decision_events.0032.oblates: "Let all know I welcome those called to service."
pam_decision_events.0032.piety: "Their devotion strengthens my own."
pam_decision_events.0032.novice: "A promising soul — take [pam_clerical_novice.GetHerHim] in at once."
pam_decision_events.0032.miracle: "They say my pupil works wonders."
pam_decision_events.0032.relic.christian: "This sacred text belongs in my treasury!"
pam_decision_events.0032.relic: "Let these writings enrich my court."
pam_decision_events.0032.language: "Set my pupil to study the holy texts."
pam_decision_events.0032.scriptorium.christian: "Set every quill in the scriptorium to work."
pam_decision_events.0032.scriptorium: "Set every scribe in my court to work."
pam_decision_events.0032.a.christian: "Ordain the worthiest of my household."
pam_decision_events.0032.a: "Raise the worthiest of my household into the faith's service."
pam_decision_events.0032.a.tt: "Up to [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] of your most learned lay [courtiers|E] #weak (kin included)#! each:\n$EFFECT_LIST_BULLET$ Joins the [clergy|E] of [pam_clerical_patron.GetFaith.GetName]\n$EFFECT_LIST_BULLET$ Gains [learning_i][learning|E] and [opinion|E] of you\n$EFFECT_LIST_BULLET$ Grants you [piety_i][piety|E]"
pam_decision_events.0032.b: "Instruct the clergy already in my care."
pam_decision_events.0032.b.tt: "Up to [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] of your most learned court [clergy|E] each:\n$EFFECT_LIST_BULLET$ Gains [learning_i][learning|E] #weak (up to [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_learning_cap_value')|V0])#!\n$EFFECT_LIST_BULLET$ Gains or advances the [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] or [GetTrait('lifestyle_mystic').GetName( GetNullCharacter )] [trait|E]"
pam_decision_events.0032.c.named: "Take [pam_clerical_novice.GetFirstNameNoTooltip] in, and send word that novices are welcome."
pam_decision_events.0032.c: "Send word that novices are welcome."
pam_decision_events.0032.c.tt: "Up to [pam_clerical_patron.MakeScope.ScriptValue('pam_clerical_court_batch_value')|V0] novices from the surrounding lands each:\n$EFFECT_LIST_BULLET$ Joins your court and the [clergy|E] of [pam_clerical_patron.GetFaith.GetName]\n$EFFECT_LIST_BULLET$ Converts to your [rite|E]"

