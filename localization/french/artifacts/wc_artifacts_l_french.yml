l_french:
 terenas_crown_name:0 "Couronne de Lordaeron"
 terenas_crown_desc:0 "Une couronne à pointes utilisée pour le couronnement des Hauts-Rois de Lordaeron."
 frostmourne_name:0 "Deuillegivre"
 frostmourne_desc:1 "Un [inventory_artifact|E], une lame runique maudite de [GetTrait('lich_king').GetName( GetNullCharacter )]. La lame emprisonne les âmes, augmentant la $MOD_PROWESS$ de la lame et $MOD_DREAD_BASELINE_ADD$ #weak (jusqu'à $MOD_PROWESS$ et 30 $MOD_DREAD_BASELINE_ADD$)#!. $frostmourne_name$ ne perd pas de [durability|E]. Le porteur transforme la victime [GetTrait('being_undead').GetName( GetNullCharacter )]. Dans un tel cas, l'âme du mort est pervertie : il obtient un [traits|E] mauvais comme [GetTrait('callous').GetName( GetNullCharacter )], [GetTrait('vengeful').GetName( GetNullCharacter )], etc."
 gorehowl_name:0 "Hurlesang"
 gorehowl_desc:0 "Une hache massive brandie par Grommash Hurlenfer du clan Warsong. Elle est marquée de façon permanente du sang de ses ennemis tombés au combat. Les petits trous et encoches qui parsèment la lame la font « chanter » lorsqu'elle est brandie."
 hammer_of_twilight_name:0 "Marteau du crépuscule"
 hammer_of_twilight_desc:0 "Forgée avec de l'élémentium, de la folie et de la magie du Vide, cette arme est un symbole de malveillance et de puissance du Marteau du Crépuscule et de ses maîtres: les Dieux très anciens."
 dark_crystal_name:0 "Cristal Noir"
 dark_crystal_desc:0 "La magie du Vide émane de cet étrange cristal, mais quelque part dans ses profondeurs, vous ressentez la présence de la Lumière."
 perenolde_tiara_name:0 "Perenolde Tiara"
 perenolde_tiara_desc:0 "This crown has been in the Perenolde family for generations and has come to symbolize their rule in Alterac. While it is not as ancient as the title it represents, the crown is no less esteemed as a symbol of rightful rule over this mountainous land."
 crown_of_the_ogre_king_name:0 "Crown of the Ogre King"
 crown_of_the_ogre_king_desc:0 "Created for King Gordok of the Gordunni Ogres of Dire Maul, this crown symbolized their nascent rule over the wilds of Feralas before the court fell to madness."
 naaru_staff.name:0 "Bâton du rédempteur"
 naaru_staff.desc:0 "Un bâton long et mince fabriqué à partir de lumière pure, offert par les Naaru à Velen, le chef des Draeneï. Il sert de symbole d’espoir et de foi tout en étant également un puissant outil de direction et de protection."
 naaru_hammer.name:0 "Marteau des Naaru"
 naaru_hammer.desc:0 "Un marteau orné colossal forgé à partir d'un cristal de pouvoir de l'Exodar, le vaisseau dimensionnel des Draeneï. C'est une arme de justice et de vengeance, ainsi qu'une source de force et de courage."
 maraad_memento.name:0 "Souvenir de Leran"
 maraad_memento.desc:0 "Un diadème brisé et terni ayant appartenu à Leran, la sœur du Redresseur de torts Maraad. Elle le portait comme symbole de grâce, jusqu'à ce qu'elle soit violée et tuée par les orcs du clan Vent-de-lames. Maraad l'a pris sur son cadavre en souvenir de sa sœur bien-aimée et a juré de venger sa mort."
 ashbringer_name:0 "Ashbringer"
 ashbringer_desc:0 "This sword has been forged from a crystal of pure Light energy. In battle, it creates a cyclone of flame around the user when swung that only affects the undead and burns them with an intense fire.\n#Bold $ashbringer_name$ doesn't lose [durability|E].  Undead beings struck by this blade in battle have an increased chance of being killed outright (effect does not work on lore characters).#!"
 corrupted_ashbringer_name:0 "Corrupted Ashbringer"
 corrupted_ashbringer_desc:0 "This sword forged from a crystal of pure Light energy but has been corrupted by an act of unthinkable malice. Its cruel and menacing aura expands into a green-black miasma when swung that debilitates the living.\n#Bold $corrupted_ashbringer_name$ doesn't lose [durability|E]. Mundane beings struck by this blade in battle have an increased chance of being killed outright (effect does not work on lore characters).#!"
 libram_general_desc:0 "Les librams sont des livres sacrés, de véritables artefacts de la Lumière. Ils confèrent à leur porteur et à ses alliés une puissance immense."
 libram_original_general_desc:0 "Ceci est l'un des cinq librams originaux offerts lors de la fondation de l'Ordre de la Main d'argent, symbolisant l'un de leurs principes fondamentaux. L'Église souhaitait que son porteur devienne l'incarnation de cette vertu."
 libram_compassion_name:0 "Libram de compassion"
 libram_compassion_desc:0 "#EMP \"En vérité, je vous le dis, comme Tyr ouvrit ses bras à ceux dans le besoin, nous devons également nous tourner vers eux. Car dans chaque acte de bonté, la Lumière se manifeste, et par la compassion nous sommes tous unis sous le regard bienveillant de la Lumière.\"#! - Le Livre de Mereldar 7:12\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_justice_name:0 "Libram de justice"
 libram_justice_desc:0 "#EMP \"Alors Mereldar s'adressa à la foule : Tyr, par son sacrifice, nous montra le chemin de la vérité et de la justice, et nous enseigna que la force ne réside pas dans le pouvoir, mais dans l'engagement envers ce qui est juste. C'est par la justice que la Lumière affirme Sa souveraineté sur l'univers, et c'est dans le cœur des justes qu'Elle trouve Sa demeure. Souvenez-vous de cela jusqu'à la fin et au-delà.\"#! - Le Livre de Mereldar 17:8-9\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_holiness_name:0 "Libram de sainteté"
 libram_holiness_desc:0 "#EMP \"La Lumière ne favorise pas par le rang ; mais par la solidarité envers la justice, la miséricorde et la répulsion de tout mal. La sainteté, forgée dans la foi et non dans de beaux discours, exige une vigilance constante contre le vice déguisé en vertu. Malheur à ceux qui trompent et se cachent derrière des masques de piété, car leur duplicité ne peut échapper à l'éclat purificateur du jugement divin !\"#! - Le Livre de Mereldar 20:4-5\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_protection_name:0 "Libram de protection"
 libram_protection_desc:0 "#EMP \"Le véritable courage ne réside pas dans la force des armes, mais dans la volonté de se dresser comme un bouclier pour les innocents. Il n'y a pas de plus grand amour que de risquer le trépas pour éclairer la vie des autres, de sacrifier sa propre existence pour sauver celle des autres. En mémoire de Tyr, tel est mon commandement ; gardez-le dans vos cœurs pour toujours.\"#! - Deuxième Lettre aux Alteracis 2:5-6\n\n$libram_general_desc$ $libram_original_general_desc$"
 libram_retribution_name:0 "Libram de rétribution"
 libram_retribution_desc:0 "#EMP "
 book_of_medivh_name:0 "Book Of Medivh"
 book_of_medivh_description:0 "The last surviving spellbook written by Medivh, the Last Guardian of Trisfal. This book is a powerful and ancient artifact that contains vast arcane knowledge and dark secrets. It is imbued with Medivh's magical prowess and power. It is rumoured to have the power to alter the fabric of reality and wield unimaginable magical power."
 doomhammer_name:0 "Doomhammer"
 doomhammer_desc:0 "Forged on Draenor in a lava basin and passed down through generations, this mighty hammer harnesses the power of the elements and is capable of dealing a devastating blow to any enemy."
 bloodhoof_runespear_name:0 "Bloodhoof Runespear"
 bloodhoof_runespear_desc:0 "This spear was handed down through many generations of the Bloodhoof line. Each owner carved his own major history into the shaft before passing it on to the next generation."
 twilight_canticle_name:0 "Cantique du Crépuscule"
 twilight_canticle_desc:0 "#EMP \"Et les cieux brûleront, la terre se brisera, et les fidèles embrasseront le Vide, car l’Heure du Crépuscule est proche.\"#!\n\nCe livre sacré renferme des connaissances interdites sur le Vide et les dieux très anciens, des vérités trop terribles pour être supportées par un esprit mortel. Ses pages, façonnées à partir de la peau des dévoués, semblent palpiter, comme un cœur vivant. À chaque page tournée, une sensation oppressante d'être observé par des yeux invisibles vous envahit."
 arcandor_seed_name:0 "Arcan'dor, Gift of the Ancient Magi"
 arcandor_seed_desc:0 "A seed from the Arcan'dor, a gift from the Ancient Magi to the Nightborne. It is said to be a source of great power and knowledge, and a symbol of the Nightborne's connection to the arcane."
 jaina_mantle_name:0 "Frostweaver's Mantle"
 jaina_mantle_desc:0 "Jaina Proudmoore's distinguished mantle artifact, known as Frostweaver's Mantle, is an elegant and formidable garment crafted from enchanted azure silk. The mantle is adorned with intricate frost patterns that shimmer with a magical glow. Fantastically breezy and absorbent, it perfectly combines functionality with beauty, making it easy for Jaina to travel while maintaining its perfect form and beautiful stitching. This artifact not only provides Jaina with unparalleled protection against frost-based attacks but also enhances her innate magical abilities. The Frostweaver's Mantle serves as both a symbol of Jaina's mastery over the arcane and a testament to her enduring commitment to the magical arts"
 shandris_armor_name:0 "Moonshadow's Embrace"
 shandris_armor_desc:0 "Moonshadow's Embrace, Shandris Feathermoon's revered armor artifact, is a celestial masterpiece crafted from shimmering mooncloth that mirrors the phases of the moon. Adorned with a radiant moonstone centerpiece, the chestplate imparts a calming aura, fortifying Shandris against magical assaults. The feathered pauldrons, woven with mystical owl plumage, enhance her agility and grant her the silent precision of the night within forests. Elven runes etched into the armor heighten her awareness, allowing Shandris to anticipate and counter her adversaries' movements, making Moonshadow's Embrace a symbol of her indomitable spirit and connection to the mystical forces of Azeroth"
 lianne_armor_name:0 "Frostfall"
 lianne_armor_desc:0 "Worn proudly by Terenia Menethil, the Frostfall Armor is a significant heirloom passed down from her grandmother, Lianne Menethil. Crafted with pristine white steel adorned with intricate blue patterns, the armor symbolizes Terenia's quest to reclaim Lordaeron and foretells the fall of the Lich King.\n\nWith a history steeped in familial legacy, the Frostfall Armor once belonged to Lianne Menethil, who prophesied that the frost would fall. The cerulean motifs narrate Terenia's struggle for redemption and liberation, while the Lordaeron symbol on the breastplate serves as a beacon of hope. Terenia readies herself for the challenges ahead, fulfilling a prophecy that heralds a significant chapter in her journey of redemption and liberation, all while adorned in the Frostfall Armor."
 wc_ancient_empire_culture_highborne: "$heritage_highborne_name$"
 wc_ancient_empire_culture_zulian: "$heritage_zulite_name$"
