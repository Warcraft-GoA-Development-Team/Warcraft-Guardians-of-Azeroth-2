 game_concept_wc_spell_type_ritual: "Ритуал"
 game_concept_wc_spell_type_ritual_desc: "Ритуал — это очень могущественное [wc_spell|E] с долгой перезарядкой и эффектами, отличными от обычного заклинания. Ритуал может открыть для мага множество новых возможностей или даровать ему большие преимущества."

 game_concept_wc_injury_burned: "Ожог"
 game_concept_wc_injury_burn: "Ожог"
 game_concept_wc_injury_burned_desc: "Разновидность [wc_magic_injury|E], наносимая враждебной огненной магией.\n\nТравма имеет три уровня тяжести:\n$EFFECT_LIST_BULLET$[GetTrait('burned_1').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$[GetTrait('burned_2').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$[GetTrait('burned_3').GetName(GetNullCharacter)]"

 game_concept_wc_injury_frostbite: "Обморожение"
 game_concept_wc_injury_frostbitten: "Обмороженный"
 game_concept_wc_injury_frostbite_desc: "Разновидность [wc_magic_injury|E], наносимая враждебной водной или ледяной магией.\n\nТравма имеет три уровня тяжести:\n$EFFECT_LIST_BULLET$[GetTrait('frostbite_1').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$[GetTrait('frostbite_2').GetName(GetNullCharacter)]\n$EFFECT_LIST_BULLET$[GetTrait('frostbite_3').GetName(GetNullCharacter)]"
