 pam_decision_events.0021.t: "The Living Word"
 pam_decision_events.0021.desc: "There is no room left to kneel in the [ROOT.Char.Custom('GetFaithTemple')]. Pilgrims press shoulder to shoulder with [ROOT.Char.GetFaith.PriestNeuterPlural], barons with beggars, and still the crowd swells at the doors.\n\nMy deeds have been counted more closely than any chronicler could manage — every road walked, every vigil kept, every coin given in [ROOT.Char.GetFaith.HighGodNamePossessive] name. One of the [ROOT.Char.GetFaith.PriestNeuterPlural] takes my hand and presses it to [ROOT.Char.GetFaith.HighGodNamePossessive] altar: "Speak, and we will listen."\n\nThe hush that follows belongs to me. What I fill it with will echo far beyond these walls."
 pam_decision_events.0021.a: "Let mercy be my sermon."
 pam_decision_events.0021.b: "I will carry the word with fire and sword."

 pam_herald_shepherd_of_the_faithful_modifier: "Shepherd of the Faithful"
 pam_herald_shepherd_of_the_faithful_modifier_desc: "This character proclaimed their holy calling with words of mercy, and the faithful adore them for it."
 pam_herald_fire_and_sword_modifier: "Fire and Sword"
 pam_herald_fire_and_sword_modifier_desc: "This character proclaimed their holy calling as a call to arms, and warriors of the faith flock to their banner."

 pam_convert_to_theocracy_decision: "Adopt Theocratic Rule"
 pam_convert_to_theocracy_decision_desc: "The current hierarchy is a perversion of the rules set by [ROOT.Char.GetFaith.GoodGodNames]. I have been given the only path to untwist it, one, that will be praising [ROOT.Char.GetFaith.CreatorHerHim|U] and fulfilling my duties to my people at the same time. This is the word of [ROOT.Char.GetFaith.GoodGodNames]."
 pam_convert_to_theocracy_decision_confirm: "Wield [ROOT.Char.GetFaith.HighGodNamePossessive|U] Authority"
 pam_convert_to_theocracy_decision_tooltip: "Change your [government|E] into a [theocracy|E]"
 pam_convert_theocracy_to_feudal_decision: "Restore Temporal Rule"
 pam_convert_theocracy_to_feudal_decision_desc: "As the nominal authority of [ROOT.Char.GetFaith.HighGodNamePossessive|U] law [ROOT.Char.GetFaith.GetAdherentNamePlural] look to me for spiritual guidance. Alas, I feel unfit for the task and defer such judgments to my [ROOT.Char.GetCouncillorPosition( 'councillor_court_chaplain' ).GetPositionName]. \n\nMy expertise lies in the temporal, and it is only right I take up a secular crown! Let the people know I am in charge, not [ROOT.Char.GetFaith.PriestNeuterPlural], or even [ROOT.Char.GetFaith.HighGodName]."
 pam_convert_theocracy_to_feudal_decision_tooltip: "Convert your [realm|E] into [feudal|E] instead of [theocracy|E]"
 pam_convert_theocracy_to_feudal_decision_confirm: "Return Realm to Mortal [ROOT.Char.GetWomenMen|U]"
