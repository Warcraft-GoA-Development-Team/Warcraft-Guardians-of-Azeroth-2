  liberate_chaos_duchy_decision:0 "Liberate the Duchy"
  liberate_chaos_duchy_decision_desc:0 "A corrupted faith holds sway over part of this duchy. As a servant of Order, you can drive out the chaos-aligned faith and set the county on the path back to its rightful people."
  liberate_chaos_duchy_decision.tt:0 "Begin the liberation of this duchy from chaos-aligned corruption."
  liberate_chaos_duchy_decision_confirm:0 "Liberate this duchy"

  wc_titanforged_liberation.0001.title:0 "The Duchy is Liberated"
  wc_titanforged_liberation.0001.desc:0 "With the corrupted faith driven out, the county's original people and traditions can begin to return. But true restoration will take more than a single act of conquest."
  wc_titanforged_liberation.0001.a:0 "The work continues."

  cede_liberated_duchy_decision:0 "Cede the Liberated Duchy"
  cede_liberated_duchy_decision.desc:0 "The land has recovered under its own strength, its control and prosperity restored. As is the way of Order, it is time to decide its future — full freedom, continued protection, or a place within your own realm."
  cede_liberated_duchy_decision.tt:0 "Choose how to hand the recovered duchy back to its people."
  cede_liberated_duchy_decision_confirm:0 "Decide the duchy's fate"

  wc_titanforged_liberation.0002.title:0 "The Duchy Has Recovered"
  wc_titanforged_liberation.0002.desc:0 "The duchy has recovered enough to stand on its own. It is time to decide its fate."
  wc_titanforged_liberation.0002.a:0 "I grant this duchy full independence, under a ruler of its own people."
  wc_titanforged_liberation.0002.b:0 "I set this duchy free as a protectorate under my watch, for now."
  wc_titanforged_liberation.0002.c:0 "I retain this duchy myself, as ordinary land of my realm."
