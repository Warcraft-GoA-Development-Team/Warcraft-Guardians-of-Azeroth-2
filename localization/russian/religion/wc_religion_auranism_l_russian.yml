 al_akirism_desc: "Ал'Акир — самый умный и коварный из Повелителей Элементалей. Владыка небес и бурь, он повелевает ветрами, принося как разрушение, так и защиту по своему усмотрению. Его последователи восхищаются его тонкостью, считая его стратегом, способным как доминировать, так и оберегать небеса."
