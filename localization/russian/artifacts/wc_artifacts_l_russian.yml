  ### FP3 artifacts 
 wc_artifact_ancient_bracelet_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')] браслет"
 wc_artifact_ancient_bracelet_description: "Говорят, что этот браслет превосходного мастерства происходит из древней [newly_created_artifact.Custom('AncientEmpireCultureLoc')] культуры. Хотя его эмаль и вставки из полудрагоценных камней давно утрачены, золото сохранило блеск, а на нём различим символ, связанный с [newly_created_artifact.Custom('AncientEmpireDecorationLoc')]. Подобные браслеты служили почётными дарами при дворе [newly_created_artifact.Custom('AncientEmpireCultureLoc')] в древности, так что, возможно, он некогда украшал руку подданного [newly_created_artifact.Custom('AncientEmpireCultureLoc')] императора."
 wc_ancient_drinking_vessel_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')] чаша"
 wc_ancient_drinking_vessel_desc: "Эта изящная чаша украшена мотивом, навевающим образ Колодца Вечности. Она создана в забытые времена, но её красота не померкла."
 wc_artifact_ancient_sword_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')] меч"
 wc_artifact_ancient_sword_description: "Говорят, что этот меч — реликт старой эпохи [newly_created_artifact.Custom('AncientEmpireCultureLoc')], и он $wc_ancient_sword_description_base$, отчего выглядит поистине великолепно. Сейчас он слишком хрупок, чтобы идти с ним в бой, но, возможно, когда-то его держал герой, навсегда потерянный времени."
 wc_artifact_ancient_replica_sword_name: "[newly_created_artifact.Custom('AncientEmpireCultureLoc')]-стильный меч"
 wc_ancient_sword_description_base: "украшен изображением [newly_created_artifact.Custom('AncientEmpireDecorationLoc')]"
 wc_famed_replica_ancient_sword_description: "Этот меч создан по вдохновению от блистательной ушедшей эпохи, взывая к героическому прошлому предков создателя. Он инкрустирован лучшими драгоценными камнями и $wc_ancient_sword_description_base$, делая его великолепным зрелищем. Держа его, человек словно облекается в образ легендарных королей древности."
 wc_masterwork_replica_ancient_sword_description: "Этот меч явно создавался как подражание оружию древних времён, напоминая о героическом прошлом [newly_created_artifact.Custom('AncientEmpireCultureLoc')]. Он искусно украшен драгоценными камнями и $wc_ancient_sword_description_base$. Хотя он лишь далёкое эхо былого величия, владея им, легко представить себя могучим владыкой минувших эпох."
 wc_common_replica_ancient_sword_description: "Эта жалкая имитация лишь высмеивает [newly_created_artifact.Custom('AncientEmpireCultureLoc')], хотя и $wc_ancient_sword_description_base$. Он украшен дешёвыми камнями и грубыми, неровными узорами. Носить его на поясе — значит выглядеть заблудшим чудаком, тщетно тоскующим по давно ушедшему миру."
