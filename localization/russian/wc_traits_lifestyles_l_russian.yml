 trait_wc_lifestyle_order_magic: "Искусные чародеи"
 trait_user_of_order_magic_name: "Чародей"
 trait_user_of_order_magic_1: "$wc_lifestyle_magic_prefix_for_level_1$ $trait_user_of_order_magic_name$"
 trait_user_of_order_magic_1_desc: "Тайные маги — прорицатели тайн: уравновешивая приливы и отливы невероятных мистических энергий, они доводят свои магические познания до предела — часто ставя под угрозу окружающий мир. Тайная магия, доступная магам, велика и опасна, а потому открывается лишь самым преданным практикам — чародеям огромных знаний и умений."
