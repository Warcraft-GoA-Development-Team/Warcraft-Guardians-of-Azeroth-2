l_russian:

 ##################################################################
 # magic_decisions 0000-0099
 # Поиск придворного заклинателя
 ##################################################################

 find_court_caster: "Найти придворного заклинателя"
 find_court_caster_tooltip: "Найдите и наймите придворного заклинателя для выполнения обязанностей по сотворению заклинаний."
 find_court_caster_desc.opening: "Ни один двор не обходится без придворного заклинателя, помогающего с обязанностями по сотворению заклинаний. Найм одного из этих ценных чиновников откроет для моего правления новые двери к власти.\n\n"
 find_court_caster_desc.archmages: "Благодаря Архимагам нашей культуры я смогу выбирать придворного мага из более широкого круга могущественных волшебников."
 find_court_caster_confirm: "Отправить весть Магам"

 magic_decisions.0001.title: "Кандидаты в придворные заклинатели"
 magic_decisions.0001.desc: "Мой призыв о придворном заклинателе дал многообещающие результаты, и теперь кандидаты стоят передо мной. Один — сведущий человек, который даёт полный отчёт о своих умениях и впечатляющее родословное древо, которое, как уверяют мои советники, сделает его ценным достоянием двора. Другой — тип похитрее, с быстрым умом, знающий, как кажется, больше, чем готов показать. Пусть это и более рискованный выбор, но он может открыть дверь к определённым... запретным способностям... которые могут мне пригодиться. Или же это просто очень скрытный человек?"
 magic_decisions.0001.opt.a: "Мои советники знают лучше."
 magic_decisions.0001.opt.b: "Я рискну!"
 magic_decisions.0001.opt.f: "Ни один из этих кандидатов мне не нравится."

 magic_decisions.0002.title: "Кандидаты в придворные маги"
 magic_decisions.0002.desc.opening_human: "Мой призыв о придворном маге дал многообещающие результаты, и теперь кандидаты стоят передо мной. По традиции мой народ избирает учёного из Магократии Даларана на должность придворного мага, и это наверняка повысит мой престиж среди равных. Маг, присланный Кирин-Тором, поистине впечатляет: это личность, исполненная достоинства и силы.\n\nКроме того, есть местный деревенский маг, дающий полный отчёт о своих умениях и впечатляющее родословное древо, — полезное и менее дорогое, хоть и не столь традиционное достояние двора. "
 magic_decisions.0002.desc.opening_elven: "Мой призыв о придворном маге дал многообещающие результаты, и теперь кандидаты стоят передо мной. У меня есть возможность избрать учёного из Магократии Даларана на должность придворного мага; впрочем, тесное общение этого человека с низшими расами может несколько запятнать мою репутацию.\n\nБолее традиционный выбор — обученный маг из моих собственных земель. "
 magic_decisions.0002.desc.ending: "Наконец, в самом конце шеренги стоит тип похитрее, с быстрым умом, знающий, как кажется, больше, чем готов показать. Пусть это и более рискованный выбор, но он может открыть дверь к определённым... запретным способностям... которые могут мне пригодиться. Или же это просто очень скрытный человек?"
 magic_decisions.0002.opt.a: "Выбрать мага из Даларана — мудрейшее решение."
 magic_decisions.0002.opt.b: "Я рискну с деревенским магом."
 magic_decisions.0002.opt.c: "Маг из наших земель был бы благоразумнее."
 magic_decisions.0002.opt.d: "Ты там, в углу! Выйди вперёд..."
 magic_decisions.0002.opt.f: "Ни один из этих кандидатов мне не нравится."
