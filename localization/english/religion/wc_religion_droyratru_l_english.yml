 helyatru_adj:0 "Helarjar"
 helyatru_adherent:0 "Helari"
 helyatru_adherent_plural:0 "Helarjar"
 helyatru_desc:0 "Odyn called Helya his daughter, until she refused to let him force the vrykul into undeath. He punished her by making her the first val'kyr. She answered by imprisoning him within his own Halls of Valor, then forged Helheim beneath the sea as their dark mirror. There the dishonored and impious dead gather, raiding the coasts to seize the valiant before Odyn can claim them."

