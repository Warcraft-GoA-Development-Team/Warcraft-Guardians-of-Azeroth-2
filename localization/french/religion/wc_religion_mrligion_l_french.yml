 #Mrligion Group Faiths
 frghlaith:0 "Frghloi"
 frghlaith_adj:0 "frghlidèlre"
 frghlaith_adherent:0 "frghlent"
 frghlaith_adherent_plural:0 "frghlents"
 frghlaith_desc:0 "Ceux qui vénèrent les dieux des océans pratiquent des rituels pour communier avec la mer et ses pouvoirs, rendant hommage à la fois aux eaux et aux puissantes entités qui y résident. Le panthéon est en perpétuelle évolution, s’adaptant aux nouvelles créatures rencontrées. Même un requin puissant ou un poisson rapide peut devenir un symbole de vénération, et à mesure qu’ils disparaissent ou migrent, la foi évolue pour embrasser de nouveaux symboles marins."

 frghlaith_old:0 "$frghlaith$ ancien"
 frghlaith_old_adj:0 "$frghlaith_adj$ ancienne"
 frghlaith_old_adherent:0 "$frghlaith_adherent$ ancien"
 frghlaith_old_adherent_plural:0 "$frghlaith_adherent_plural$ anciens"
 
 arkkoroc:0 "Arkkoroc"
 arkkoroc_adj:0 "arkkoran"
 arkkoroc_adherent:0 "arkkoran"
 arkkoroc_adherent_plural:0 "arkkoran"
 arkkoroc_desc:0 "Arkkoroc est vénéré par ses fidèles comme le demi-dieu des océans, maître des marées et des tempêtes. Les $arkkoroc_adherent_plural$ croient qu’il les protège, mais qu'il teste aussi leur foi à travers des tempêtes et des marées violentes. Résidant en Azshara, Arkkoroc est honoré par de nombreuses créatures locales."
 arkkoroc_good_god_arkkoroc:0 "Arkkoroc"
 arkkoroc_good_god_arkkoroc_possessive:0 "d'Arkkoroc"
 arkkoroc_religious_head_title_male:0 "Seigneur"
 arkkoroc_religious_head_title_female:0 "Dame"