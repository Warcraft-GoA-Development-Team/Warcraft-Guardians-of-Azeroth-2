  tenet_consolamentum_default_desc: "Through the sacred rite of spiritual consolation, believers receive the Holy Light in their minds and are prepared for their journey from this world to the next."
  tenet_consolamentum_default_historical_glossary: "[Glossary('Consolamentum','tenet_consolamentum_historical_desc')]"
  tenet_consolamentum_historical_desc: "The Consolamentum is a rite practiced by certain religious movements, involving the laying on of hands to confer spiritual purification and prepare the soul for its passage beyond the material world." # PLACEHOLDER

  # Divine Marriage Tenet

  tenet_divine_marriage_human_name: "Matrimonium Sacrum" # DO NOT TRANSLATE
  tenet_divine_marriage_draenei_name: "Hieròs Gámos" # DO NOT TRANSLATE
  tenet_divine_marriage_default_name: "$tenet_divine_marriage_name$"
