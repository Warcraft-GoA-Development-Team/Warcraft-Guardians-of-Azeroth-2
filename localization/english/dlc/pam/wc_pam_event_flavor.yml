l_english:
 ## ADORCISM
 pam_curse_enemy_decision_loa: "Hex an Enemy"
 pam_curse_enemy_decision_desc_loa: "#F Who is this fool to stand against me? I will name them before the [Glossary( 'Loa', 'LOA_GLOSS' )] and pour every grievance, every insult, and every curse upon them. Let them laugh while they can; their reckoning will come soon enough.#!"
 pam_curse_enemy_decision_desc_loa_troll: "#F Who be dis fool to stand against me? I will name dem before de [Glossary( 'Loa', 'LOA_GLOSS' )] and pour every grievance, every insult, an' every curse upon dem. Let dem laugh while dey can; deir reckoning will come soon enough.#!"

 pam_seek_war_aid_decision_desc_loa: "#F War tests more than arms and numbers. I will petition the [Glossary( 'Loa', 'LOA_GLOSS' )]for insight, vigor, or endurance enough to carry my cause through the trials ahead.#!"
 pam_seek_war_aid_decision_desc_loa_troll: "#F War tests more den arms an' numbers. I will petition de [Glossary( 'Loa', 'LOA_GLOSS' )] for insight, vigor, or endurance enough to carry my cause through de trials ahead.#!"
 pam_seek_war_aid_decision_confirm_loa: "Call on the Loa"

 pam_adorcism_events.0001.t_loa: "A Name Before the Loa"
 pam_adorcism_events.0001.desc_loa: "In a secluded place, I mold [pam_adorcism_curse_target.GetTitledFirstNamePossessive] likeness into a voodoo doll and speak every grievance aloud. The rite could break bones or wither crops, but today that is not its purpose.\n\nWhen I rise, my anger has cooled into intent. Every rumor about [pam_adorcism_curse_target.GetHerHim] now seems like a thread waiting to be pulled."

 pam_adorcism_events.0002.desc_loa: "\n\n[pam_adorcism_curser.Custom('loa_curse')|U], I have spoken your name before the [Glossary( 'Loa', 'LOA_GLOSS' )] and laid a curse upon you. When misfortune finds you, remember that it was my will that called it forth."
 pam_adorcism_events.0002.desc_loa_troll: "\n\n[pam_adorcism_curser.Custom('loa_curse')|U], I have spoken ya name before da [Glossary( 'Loa', 'LOA_GLOSS' )] and laid a curse upon ya. When misfortune find ya, remember dat it be my will dat called it forth."

 pam_adorcism_events.0101.desc_loa: "Beyond the camp's last fire, I pour out an offering and listen while the sounds of the host fade behind me. Wind stirs the dust, carrying no clear voice, yet the ritual steadies my thoughts.\n\nI must decide how to beseech the [Glossary( 'Loa', 'LOA_GLOSS' )] for the campaign ahead."



