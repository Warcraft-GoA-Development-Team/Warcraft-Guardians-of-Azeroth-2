 elunism_desc:0 "$elunism_adherent_plural$ worship a pantheon of gods, led by the moon goddess Elune. Her priestesses, the sisters of Elune, have considerable authority in the society. On the other hand, the Elunic druids play a significant role and also have a close kinship with most of the Ancient Guardians. Blessed by their gods, the $elunism_adherent_plural$ consider it their duty to protect nature at the cost of their lives and honor the sacrifices of the ancestors." # Need rework
 
