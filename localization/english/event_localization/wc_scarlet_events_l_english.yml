l_english:
 SCARL.000_TITLE:1 "Those that Remain"
 SCARL.000_DESC:0 "Once a beacon of the Light, the [GetTitleByKey('k_lordaeron').GetName] is now little more than a corpse-ridden ruin, a feast for the damned. Those of us who yet live are few, scattered and hunted by the Scourge and worse yet — traitors who once called themselves our brethren who have willingly submitted themselves into the armies of the damned.\n\n[GetTitleByKey('k_order_of_the_silver_hand').GetName] stands on the edge of ruin, its greatest champions slain or turned against us.\n\n[scoped_betrayer.GetName] abandoned us to ruin, and now whispers tell of others within our ranks who would rather cower or consort with the enemy than stand and fight.\n\nBut I will not falter.\n\nIf there are still righteous warriors left in this land, I will find them. We will rise from the ashes of Lordaeron, not as victims, but as those who would purge the plague that stole our home. The [GetTrait('lich_king').GetName(GetNullCharacter)] will know that this land belongs to us."
 SCARL.000_OPT_A:0 "I will send out emissaries to those loyal to the throne."
 SCARL.000_OPT_B:0 "I cannot afford to chase ghosts."
 SCARL.000_OPT_tt:0 "You choose to stand alone."

 SCARL.001_TITLE:1 "Those that Remain"
 SCARL.001_DESC:0 "To the last true knights of Lordaeron.\n\nLordaeron has fallen, but the Light still burns in us. The traitors and the damned would see our kingdom lost forever.\n\nI refuse to yield.\n\nIf you still have the will to fight, stand with the last of the Silver Hand. Together, we will cleanse this land of its plague and take back what is ours."
 SCARL.001_OPT_A:0 "For Lordaeron! We stand and fight!"
 SCARL.001_OPT_A_TT:0 "You will join a meeting with the Silver Hand to discuss the fate of Lordaeron."
 SCARL.001_OPT_B:0 "This war is already lost."
 SCARL.001_OPT_B_TT:0 "You ignore the call."

 SCARL.002_TITLE:1 "Those that Remain"
 SCARL.002_DESC:0 "Your call has been heard. The Light has not abandoned us, and nor will we abandon you. Lordaeron may be in ruins, but our duty still remains until our death. We will gather our forces and attend your meeting.\n\n For Lordaeron, and for the Light."
 SCARL.002_OPT_A:0 "Excellent."

 SCARL.003_TITLE:1 "Those that Remain"
 SCARL.003_DESC:0 "Lordaeron is lost. The dead rule the streets, and the Light's favour in us has faded.\n\nI will not march my people tom their deaths for a kingdom that no longer exists. We must look to other paths for our endurance.\n\nDo not seek us again."
 SCARL.003_OPT_A:0 "Cowards."

 SCARL.004_TITLE:1 "Those that Remain"
 SCARL.004_DESC:0 "You walk into the meeting room and quickly realise that the dimly lit hall is thick with tension.The remnants of the [GetTitleByKey('k_order_of_the_silver_hand').GetName] have gathered and what remains of their order has begun to splinter before your very eyes.\n\nOn one side of the room, knights in bloodstained armour speak with righteous fury - their voices sharp with anger."#italic"We must cleanse Lordaeron!"#they cry. #italic"Purge the infected, root out the traitors - no mercy! no hesitation! The Light demands it!#Their eyes burn with zeal, their faith having now twisted into something new and unyielding.\n\nOpposite them stands a weary but resolute group, their conviction and faith in the light being tempered by their compassion.#italic"The Light does not command cruelty.#"They argue in response.#italic "The innocent still suffer. If we abandon them, we are no better than the monsters we fight.#\n\nThe divide is clear.\n\nOne path leads to war against anything that may threaten purity - no matter the cost.\n\nThe other seeks to protect with little good remains, even in the face of darkness.\n\nAll who have gathered here must make their choice."
 SCARL.004_OPT_A:0 "The Light must be defended. No matter the cost."
 SCARL.004_OPT_A_tt:0 "Pledge your faith to Scarletism."
 SCARL.004_OPT_B:0 "We must not let the Light become a weapon of tyranny."
 SCARL.004_OPT_B_tt:0 "Pledge your faith to Argent Dawn."
 SCARL.004_OPT_C:0 "This is madness. I am leaving."
 SCARL.004_OPT_C_tt:0 "Remain true to the Light."
