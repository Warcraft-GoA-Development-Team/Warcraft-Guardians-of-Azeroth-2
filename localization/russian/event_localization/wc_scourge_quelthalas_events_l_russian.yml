 SCQUEL.0001_TITLE: "Битва за Луносвет"
 SCQUEL.0001_DESC: "Лордерон лежит в руинах, его гордые башни превращены в обломки, а его народ либо истреблён, либо восстал, чтобы служить в нежити. Сладкая симфония их криков до сих пор звучит в моих ушах – предвестник следующего акта нашего великого творения. Пришло время повергнуть Кель'Талас на колени.\n\n«Командир», – взываю я, голос мой полон мрачной власти. В периферии моего зрения я замечаю шаткое тело фигуры в доспехах Лордерона – когда-то солдата или капитана, теперь медленно приближающегося ко мне. «Готовьте наши войска. Мы маршируем в Луносвет». \n\nНаша цель – Солнечный колодец, источник невообразимой мощи, который навсегда закрепит наше владычество. Высшие эльфы, со своей надменностью и сиянием, познают отчаяние. Их свет будет потушен, уступив место вечной тьме, которую мы несем. Я вкушаю мысль о том, как их золотые шпили рухнут, их леса воспламенятся, а их народы преклонятся перед неумолимой волной смерти. Солнечный колодец станет нашим, и с его помощью Плеть вернет Некроманта из мертвых. Высшие эльфы, укрывавшиеся за своими древними барьерами и мощной магией, скоро узнают, что ничто не в силах противостоять воле Короля-лича."
 SCQUEL.0001_OPT_A: "Вперёд, в Луносвет! Слава Королю-личу!"
  
 SCQUEL.0002_TITLE: "Битва за Луносвет"
 SCQUEL.0002_DESC: "Кель'Талас – жемчужина Высших Эльфов. Всю жизнь сияние этого города издевалось надо мной, а теперь его спокойствие лишь разжигает мой гнев. Пришло время разрушить иллюзии эльфов и их мнимую непобедимость, и утопить их народ в крови. Мы маршируем на город с одной целью - захватить Солнечный колодец.\n\nС магической энергией, заключённой в Солнечном колодце, Король-лич вернёт Некроманта из мёртвых и подарит мне союзника для грядущих битв.\n\nНам представилась возможность склонить тех, кто служит Кель'Талас, к измене и присоединению к силам Плети.\n\nВсе должны служить Королю-личу."
 SCQUEL.0002_OPT_A: "Разошлите наших шпионов. Найдите тех, кто готов присоединиться к нам."
 SCQUEL.0002_OPT_A.tt: "Некоторые эльфийские вожди могут принести вам верность ещё до начала войны."
 SCQUEL.0002_OPT_B: "У них был шанс. Смерть восторжествует. Моя жизнь за Нер'зула!"
  
 SCQUEL.0003_TITLE: "Битва за Луносвет"
 SCQUEL.0003_DESC: "Слава Плети!\n\nАрмии мёртвых наступают на ваши земли. Во имя Короля-лича я предлагаю вам склонить колено. Примите нежить, и эти земли останутся вашими."
 SCQUEL.0003_OPT_A: "Во имя Короля-лича!"
 SCQUEL.0003_OPT_A_TT: "Вы станете вассалом нападающего и объявите войну своему бывшему сюзерену."
 SCQUEL.0003_OPT_B: "Судьбоносный выбор. Я остаюсь верен своему народу."
 SCQUEL.0003_OPT_B_TT: "Вы будете противостоять Плети"
  
 SCQUEL.0004_TITLE: "Битва за Луносвет"
 SCQUEL.0004_DESC: "[invaderquelthalas.GetTitledFirstName], я желаю лишь служить.\n\nЯ с распростёртыми объятиями принимаю нежить и клянусь в верности тебе, мой господин. Я уже начал(а) собирать свои войска, чтобы пролить кровь преданных.\n\nСлава Королю-личу!"
 SCQUEL.0004_OPT_A: "Пусть больше душ придёт в службу Короля-лича."
  
 SCQUEL.0005_TITLE: "Битва за Луносвет"
 SCQUEL.0005_DESC: "[invaderquelthalas.GetTitledFirstName], я плюю на твой труп. Ты и твоя армия мёртвых потерпите поражение. Мы уже готовы."
 SCQUEL.0005_OPT_A: "Тогда пусть будет смерть."
  
 SCQUEL.0006_TITLE: "Битва за Луносвет"
 SCQUEL.0006_DESC: "Клинок говорит со мной. Он сообщил, что Король-лич даровал мне легион мёртвых воинов, связанных моей волей.\n\nЯ принимаю этот дар от моего тёмного господина. Я покорю Кель'Талас во имя Плети!"
 SCQUEL.0006_OPT_A: "Смерть восторжествует. Моя жизнь за Нер'жула!"
  
 SCQUEL.0007_TITLE: "Битва за Луносвет"
 SCQUEL.0007_DESC: "«Моё королевство всегда было оплотом света и магии, убежищем для моего народа. Но теперь тени ужаса нависли над нашими золотыми шпилями, их зловещие щупальца приближаются всё ближе.\n\n«Мой господин», – обращается ко мне мой верный советник, мудрый эльф, спешащий с запечатлённым свитком в руках, – «пришла весть от наших разведчиков на южных границах». \n\nКогда он нарушает печать и разворачивает свиток, в тронном зале воцаряется напряжение. Дворяне и стражи слушают с лицами, полными страха и тревоги.\n\nЕго голос, обычно спокойный, дрожит, когда он произносит: «Плеть наступает на наши границы. Луносвет стоит на пороге гибели. Легионы нежити, ведомые тёмной силой, предавшей Лордерон, наступают на нас. Они идут за Солнечным колодцем и не остановятся, пока Кель'Талас не будет поглощён их нечестивой яростью». \n\nХолод пронизывает зал, холоднее любого зимнего ветра. Масштаб угрозы ясен, и судьба нашего народа легла на мои плечи."
 SCQUEL.0007_OPT_A: "Вечное Солнце ведёт нас. За Кель'Талас!"
  
 SCQUEL.0008_TITLE: "Битва за Луносвет"
 SCQUEL.0008_DESC: "Моё королевство многие годы знало долгий мир под моим правлением, но этот покой был хрупок – как тонкий лёд на замёрзшем пруду. Теперь же предвестник этой хрупкости предстает передо мной, его лицо побледело от ужаса.\n\n«Ваше Величество», – говорит мой управляющий, верный слуга моей семьи, держа письмо в дрожащих руках. – «Весть». \n\nПечать неоспорима – символ Лордерона, но запятнана тёмным веществом, похожим на кровь. Когда управляющий разворачивает пергамент, зал погружается в молчание, а придворные и стражи затаив дыхание слушают новости.\n\nОн зачитывает: «Лордерон пал. Город в руинах, его народ убит или восстал в виде нежити по злобной магии Плети. Предатель возглавил это отвратительное войско против собственной родины. Теперь они маршируют в сторону Кель'Таласа, неся месть и смерть»."
 SCQUEL.0008_OPT_A: "Война с Плетью только начинается."
  
 SCQUEL.0009_TITLE: "Битва за Луносвет"
 SCQUEL.0009_DESC: "Пора победить… предателя Лордерона, который наступает на меня. Я оглядываюсь и понимаю – теперь я стою один. Передо мной стоит Артас, его злоба и решимость сверкают в его взгляде.\n\n#italic «Ты выиграл эту битву, мясник, но нас всех ты не уничтожишь!» #! – кричу я, в моих глазах пылает вызов. Струя стрел пролетает мимо его головы.\n\n#italic «Здесь всё заканчивается.» #! – заявляет он, поднимая Фростморн. #italic «Тогда я устрою свой последний бой здесь, мясник. Anar'alah belore!» #! – воплю я.\n\nДуэль проходит быстро и жестоко. Я сражаюсь из последних сил, но воля Короля-лича и Фростморн делают его непобедимым. Он обезоруживает меня, и я падаю на колени, кровь стекает по лицу.\n\n#italic «Я заслуживаю чистой смерти за всё, что ты мне причинил.» #! – умоляю я, смешивая гнев и смирение.\n\n#italic «Последнее, что я тебе дам – покой смерти.» #! – холодно шепчет он."
 SCQUEL.0009_OPT_A: "Нет..."
  
 SCQUEL.0010_TITLE: "Битва за Луносвет"
 SCQUEL.0010_DESC: "Передо мной стоит их генерал-следопыт, [sylvanas_candidate.GetHerHisMy] упорство и ненависть излучаются в его взгляде. Стрела мельком пролетает мимо моей головы. Вся печаль и вся жалость, что я когда-то испытывал, исчезли.\n\n#italic «Ты выиграл эту битву, мясник, но нас всех ты не уничтожишь!» #! – кричит [sylvanas_candidate.GetSheHe], вызов пылает в его глазах.\n\n#italic «Здесь всё заканчивается.» #! – заявляю я, поднимая Фростморн.\n\n#italic «Тогда я устрою свой последний бой здесь, мясник. Anar'alah belore!» #! – восклицает [sylvanas_candidate.GetSheHe].\n\nДуэль проходит быстро и жестоко. [sylvanas_candidate.GetName] сражается из последних сил, но воля Короля-лича и Фростморн делают меня слишком могущественным. Я обезоруживаю [sylvanas_candidate.GetName] и вижу, как он падает на колени, кровь стекает по его лицу.\n\n#italic «Я заслуживаю чистой смерти за всё, что ты мне причинил.» #! – умоляет он, в его голосе слышны гнев и смирение.\n\n#italic «Последнее, что я тебе дам – покой смерти.» #! – холодно шепчу я."
 SCQUEL.0010_OPT_A: "Восстань, [sylvanas_candidate.Custom('GetBansheeSpectre')]."
  
 SCQUEL.1001_TITLE: "Призрачный вестник"
 SCQUEL.1001_DESC: "В мгновение безмолвного размышления в ваших покоях вас окутывает неестественный холод. Почувствовав прикосновение Короля-лича, вы инстинктивно опускаетесь на колени и оборачиваетесь, чтобы встретить присутствие рядом с вами.\n\nК вашему ужасу, рядом с вами предстает призрачный лик Кел'Тузада!\n\n«Слушай внимательно, слуга Плети», – говорит он, – «Только я обладаю силой призвать Архимонда, величайшего генерала Легиона. Наш Тёмный Владыка доверил тебе моё воскрешение, и для этого ты должен развратить недавно завоеванный Солнечный колодец.»"
 SCQUEL.1001_OPT_A: "Да будет так, как повелел наш господин..."
 SCQUEL.1001_OPT_tt: "Теперь вы можете принять решение о воскрешении Кел'Тузада, развратив Солнечный колодец."
  
 SCQUEL.1011_TITLE: "Осквернение Солнечного колодца"
 SCQUEL.1011_DESC: "Голос Некроманта преследует мои мысли. Его призрачный шёпот подталкивает меня вперёд. Я помню, как когда-то был полон решимости выбирать сам, но теперь голос Фростморна заглушает все сомнения.\n\nМагия Солнечного колодца могущественна – пульсирующий источник жизни и надежды. Чтобы вернуть Некроманта из мёртвых, я должен осквернить его и исказить его энергии так, чтобы они служили цели Короля-лича.\n\nЗащитники Солнечного колодца потерпели неудачу, а оставшиеся рассеялись, цепляясь за свой драгоценный свет. Они теперь знают, что без энергии Источника их народ обречён.\n\nКлинок жаждет крови, и я – его покорный слуга."
 SCQUEL.1011_OPT_A: "Время Высших Эльфов закончилось."
  
 SCQUEL.1012_TITLE: "Осквернение Солнечного колодца"
 SCQUEL.1012_DESC: "Небо сгущается над Солнечным колодцем, когда могучая магия тьмы и злобы прорывает завесу между Азеротом, просачиваясь через пустоту и сочащась зловонной вязкостью в Солнечный колодец.\n\nДревний источник эльфийской мощи содрогается, когда вихри искажённой маны разлетаются по нему, создавая головокружительные фрактальные узоры, поражающие воображение. Когда произносятся последние слова заклинания, прорыв в пространстве срывается, словно плотина, и тёмная энергия врывается, погружая весь регион в запах серы и тьму, столь густую, что можно было бы в ней утонуть, превращаясь в прилив, затопляющий разрушенные эльфийские шпили Кель'Таласа.\n\nСверкающий источник магии Солнечного колодца теперь излучает больной, мутный зеленый оттенок, его святость навсегда искажена. За берегами Острова Кель'Таласа волна негативной энергии, невиданной со времен Великого Раскола, охватывает весь Азерот."
 SCQUEL.1012_OPT_A: "Мир содрогается перед нашей мощью!"
  
 SCQUEL.1013_TITLE: "Воскрешение Кел'Тузада"
 SCQUEL.1013_DESC: "Противостоя давлению плотной некротической маны, извергающейся из искажённого Солнечного колодца, [ROOT.Char.GetName] собирает всю свою силу, чтобы бросить гниющее тело Кел'Тузада в бурлящий поток маны.\n\nЭтот жалкий слуга Короля-лича – единственный, кто может сделать следующий шаг в планах Плети и призвать Верховного Демона Архимонда, чтобы очистить этот мир от гнили жизни и завладеть его Душой Мира.\n\nКак только изуродованное и мерзкое тело погружается в воду, вокруг него формируется магический фокус, называемый Филакктерией, чтобы сдержать дух обречённого мага, когда его вновь призовут из Пустоты.\n\nПоток тёмной энергии втягивается в Филакктерию, магический водоворот, который поглощает скопление некротической маны, осевшей на острове за считанные мгновения. Десятки слуг нежити разрываются в бурлящем магическом потоке.\n\nВскоре пыль, поднятая магическим штормом маны, рассеется, и перед вами предстанет лик великого лича; возможно, величайшего, кто когда-либо ступал по Азероту... Кел'Тузада, ваш покорный слуга."
 SCQUEL.1013_OPT_A: "Восстань, слуга Короля-лича!"
 SCQUEL.1013_OPT_ARTHAS: "Мой мерзкий враг теперь будет вечно служить моему замыслу..."
  
