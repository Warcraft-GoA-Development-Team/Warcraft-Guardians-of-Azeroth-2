  tenet_aniconism_draenei_name: "Eikonomakhía" # DO NOT TRANSLATE
  tenet_aniconism_default_name: "$tenet_aniconism_name$"
  tenet_aniconism_human_desc: "XXX" # PLACEHOLDER
  tenet_aniconism_human_historical_glossary: "[Glossary('Iconomachia','tenet_aniconism_historical_desc')]"
  tenet_aniconism_draenei_desc: "XXX" # PLACEHOLDER
  tenet_aniconism_draenei_historical_glossary: "[Glossary('Eikonomakhía','tenet_aniconism_historical_desc')]"
  tenet_aniconism_default_desc: "No idol or image can embody the Light's divine radiance. Let all false representations be cast aside, and let the Light itself illuminate our places of worship and our minds." # PLACEHOLDER
  tenet_aniconism_default_historical_glossary: "[Glossary('Aniconism','tenet_aniconism_historical_desc')]"
  tenet_aniconism_historical_desc: "Some followers of the Light believe that its divine radiance is best honored without idols or sacred images. They favor places of worship designed to welcome natural light, arguing that no mortal creation can rival the Light's brilliance. These views remain controversial among the faithful, many of whom see sacred art as a legitimate expression of devotion." # PLACEHOLDER

