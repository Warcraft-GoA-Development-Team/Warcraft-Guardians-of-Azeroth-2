l_russian:
 wc_relations_events.1001.t: "Родитель среди заклинателей"
 wc_relations_events.1001.desc: "Мой [parent.Custom('ComplimentAdjective')] [parent.Custom('MotherFather')|l] всегда поддерживал мои занятия магией, но в последнее время [parent.GetSheHe] стал настоящей помехой моему колдовству.\n\n«Я тоже умею пользоваться магией, знаешь ли», — хвастается [parent.GetSheHe|U]. «Ты мог бы кое-чему у меня научиться!»"
 wc_relations_events.1001.a: "Мне не помешает больше силы..."
 wc_relations_events.1001.b: "Тогда помоги мне защищаться."
 wc_relations_events.1001.c: "Я ценю твою заботу, но справлюсь сам."
 wc_parent_aids_magic_modifier_power: "Родительская сила заклинаний"
 wc_parent_aids_magic_modifier_power_desc: "Родитель этого персонажа помог ему овладеть магией.\n[wc_spell_power|E] @wc_spell_icon!: #P +5#!"
 wc_parent_aids_magic_modifier_defense: "Родительская защита от заклинаний"
 wc_parent_aids_magic_modifier_defense_desc: "Родитель этого персонажа помог ему овладеть магией.\n[wc_magic_resistance|E] @wc_spell_icon!: #P +5#!"
