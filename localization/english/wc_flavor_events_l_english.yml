l_english:
 wc_flavor_events.0001.t: "A Tavern Meeting"
 wc_flavor_events.0001.desc: "The road has been long and weary. You stop at a modest tavern on the outskirts of a small village. The fire crackles, the ale is warm, and the locals mind their own business. But then, a hooded stranger slides onto the bench across from you. They seem to know who you are. Their voice is low, almost a whisper. 'You're the one they talk about,' they say. 'I have information that could change your fortunes.' The tavern fades into the background. What do you do?"
 
 wc_flavor_events.0001.a: "Listen to the stranger"
 wc_flavor_events.0001.a.desc: "#weak Your curiosity gets the better of you. You motion for them to continue"

 wc_flavor_events.0001.b: "Ignore them and return to your drink"
 wc_flavor_events.0001.b.desc: "#weak You've met enough mysterious strangers on the road to know that most are nothing but trouble"
 
 wc_flavor_events.0001.success: "Valuable Information"
 wc_flavor_events.0001.success.desc: "#weak The stranger shares a rumor about townspeople"
 
 wc_flavor_events.0001.gold: "A Few Coins"
 wc_flavor_events.0001.gold.desc: "#weak The stranger's story turns out to be nothing special, but they are generous and slip you a few coins for your time"
 
 wc_flavor_events.0001.fight: "A Brawl Breaks Out"
 wc_flavor_events.0001.fight.desc: "#weak The conversation takes a sour turn"
 tavern_rumors: "Tavern Rumors"
 tavern_rumors_desc: "Useful gossip picked up from the road"