l_english:
 #################################
 # Base Events
 #################################
 wc_horde_invasion.medivh.1000.title:0 "The Opening of the Dark Portal"
 wc_horde_invasion.magic.1000.title:0 "Powerful Magical Disturbance"
 wc_horde_invasion.pale_orcish.1000.title:0 "The Dark Gods from Beyond"
 wc_horde_invasion.orcish.1000.title:0 "The Invasion from Draenor"
 wc_horde_invasion.generic_close.1000.title:0 "A Storm in Black Morass"
 wc_horde_invasion.medivh.1000.desc:0 "My entire body trembles as I utter the final syllables of the incantation. The storm roars with intensified fury, as if the heavens themselves refuse what I am about to do.\n\nBefore me, the stones shift with a terrifying rumble as the Dark Portal rises, immense and menacing. Its dark energy pulses through the air, and a magical vortex swirls around its frame. There is no turning back now...\nI raise my arms, invoking the forces of the Nether, and with a deafening crash, the Portal opens, releasing a chilling mist. I can feel them, on the other side: the Orcs.\n\nMy duty fulfilled, I use the last of my energy to recall myself to Karazhan. I light a fire and collapse before the flames, letting out a weary sigh. That wretched warlock... He will undoubtedly betray us, but he will have to wait before we deem him worthy of our attention. The fate of Azeroth is sealed, and what I have done today will usher in an era of chaos and unprecedented destruction upon our world."
 wc_horde_invasion.draenor_first_part_general.1000.desc:0 ""[guldan_character.GetFirstNameNoTooltip] was right! Another world awaits us beyond the portal!" shouted the scout leader. A wild roar ignited the Horde. [guldan_character.GetFirstName] had staked [guldan_character.GetHerHis] head on this gamble, and if the portal had led to nothing, [guldan_character.GetSheHe] would have dragged all [guldan_character.GetHerHis] fanatics with [guldan_character.GetHerHim] to the grave."
 wc_horde_invasion.draenor_first_part_shadow_council.1000.desc:0 ""[guldan_character.GetFirstNameNoTooltip] was right! Another world awaits us beyond the portal!" shouted the scout leader. A wild roar ignited the Horde. I exhale slowly. [guldan_character.GetFirstName] had staked [guldan_character.GetHerHis] head on this gamble, and if the portal had led to nothing, we would have all followed [guldan_character.GetHerHim] to the grave."
 wc_horde_invasion.draenor_first_part_guldan.1000.desc:0 ""[guldan_character.GetFirstNameNoTooltip] was right! Another world awaits us beyond the portal!" shouted the scout leader. A wild roar ignited the Horde. I exhale slowly. I had staked my head on this gamble, and if the portal had led to nothing, I would have ended up skinned alive and thrown to the worgs."
 wc_horde_invasion.draenor_second_part_general.1000.desc:0 ""Forward!" roared [blackhand_character.GetDynastyHouseNameNoTooltip], brandishing [blackhand_character.GetHerHis] weapon toward the portal. Then, [blackhand_character.GetPrimaryTitle.GetName|l] moved as one."
 wc_horde_invasion.draenor_second_part_warchief.1000.desc:0 ""Forward!" I roared, brandishing my weapon toward the portal. Then, [blackhand_character.GetPrimaryTitle.GetName|l] moved as one."
 wc_horde_invasion.warchief_draenor.1000.desc:0 "$wc_horde_invasion.draenor_first_part_general.1000.desc$\n\nI stand at the forefront, gripping my weapon as I face the swirling chaos of the portal. The ground trembles, and the air hums with power. There is no turning back.\n\n$wc_horde_invasion.draenor_second_part_warchief.1000.desc$ As I cross, Draenor fades behind me. Light and sound collapse into a swirling storm of color before vanishing into the void. I am pulled through the vastness of the cosmos.\n\nThen, it stops abruptly. I stumble forward as my feet sink into wet soil, cold and thick with mud. Around me, the swamp stretches endlessly in every direction and behind me, the Horde pours through.\n\n#EMP #bold "So this is Azeroth—the future world of the orcs!#!#!""
 wc_horde_invasion.warchief_shadow_council_draenor.1000.desc:0 "$wc_horde_invasion.draenor_first_part_shadow_council.1000.desc$\n\nI stand at the forefront, gripping my weapon as I face the swirling chaos of the portal. The air is thick with fel energy, each pulse of power a reminder of [guldan_character.GetFirstNamePossessiveNoTooltip] promises.\n\n$wc_horde_invasion.draenor_second_part_warchief.1000.desc$ As I step through, Draenor fades behind me. Light and sound collapse into a swirling storm of color before vanishing into the void. I am pulled through the [Glossary( 'Twisting Nether', 'TWISTING_NETHER_GLOSS' )], glimpsing fractured visions of other worlds. Each one is consumed by fel flames.\n\nThen, it stops abruptly. My feet sink into wet soil, cold and thick with mud. Around me, the swamp stretches endlessly as the Horde pours through behind me.\n\n#EMP #bold So this is Azeroth—the future world of the orcs!#!#!"
 wc_horde_invasion.guldan_draenor.1000.desc:0 "$wc_horde_invasion.draenor_first_part_guldan.1000.desc$\nWith difficulty, I ascend the platform, leaning on my staff. My voice addresses the Horde gathered before me:\n\n"The elements may have abandoned us, but I have not. With my power, I have found us a new world—a world far richer and more fertile than this dying Draenor. Battles await us, but I know you—the strongest warriors of our kind—will triumph. Their lands will be ours, their people will bow, and their riches will fuel our future. Draenor’s salvation lies in conquest! For the Horde!"\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ As I step through the portal, the swirling chaos of the [Glossary( 'Twisting Nether', 'TWISTING_NETHER_GLOSS' )] engulfs me. Azeroth lies ahead—a land ripe for domination and power. This world will bow before #EMP #bold me#!#!. Before the #EMP #bold Horde#!#!."
 wc_horde_invasion.chogall.1000.desc:0 "$wc_horde_invasion.draenor_first_part_shadow_council.1000.desc$\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ I step through the portal and everything changes. The air, the light, the very essence of reality shifts as I cross into the unknown.\n\nAs I cross the [Glossary( 'Twisting Nether', 'TWISTING_NETHER_GLOSS' )], I see them: the worlds, each one more grotesque than the last, teeming with unspeakable things. Formless creatures with contours too perfect watch me without moving. On some of these realms, I glimpse the [burning_legion|E] waging war. But they do not win.\n\nI gasp and shut my eyes in shock. When I reopen them, the vision is gone, replaced by the damp air of my surroundings. I am in a swamp, and hundreds of orcs emerge from the portal one after another... So this is the world [guldan.GetFirstNameNoTooltip] promised us."
 wc_horde_invasion.twilights_hammer.1000.desc:0 "$wc_horde_invasion.draenor_first_part_general.1000.desc$\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ As I step through the portal, the whispers become a chorus. Their song is not meant for mortals, but it fills me with DETERMINATION. The air grows heavy and reality itself crumbles as I cross into the unknown.\n\nIn the [Glossary( 'Twisting Nether', 'TWISTING_NETHER_GLOSS' )], I see them: the glorious worlds, each one teeming with perfection beyond comprehension. Formless creatures with contours too perfect watch me without moving. On some of these realms, I glimpse the [burning_legion|E] waging war. But they do not win.\n\nI bow my head, unworthy of such grandeur. When I open my eyes, the vision is gone, replaced by the damp air of my surroundings. I am in a swamp, and hundreds of orcs emerge from the portal one after another... So this is the world [guldan.GetFirstNameNoTooltip] promised us."
 wc_horde_invasion.shadow_council.1000.desc:0 "$wc_horde_invasion.shadow_council.1000.desc$\nI stand at the forefront, amidst the crowd gathered at the portal. The air is thick with fel energy, each pulse a reminder of [guldan.GetFirstNamePossessiveNoTooltip] promises. He ascends the platform, leaning on his staff, and addresses the Horde:\n\n"The elements have abandoned us, but I have not. With my power, I have found us a new world—a land richer and more fertile than this dying Draenor. Battles await, but you—the strongest of our kind—will triumph. Their lands, their people, their riches will be ours. Draenor’s salvation lies in conquest! For the Horde!"\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ As I step through the portal, the swirling chaos of the [Glossary( 'Twisting Nether', 'TWISTING_NETHER_GLOSS' )] engulfs me. Azeroth lies ahead—a world ripe for conquest and power. It will belong to the orcs, in the name of the demons!"
 wc_horde_invasion.orcish_shamanism.1000.desc:0 "$wc_horde_invasion.draenor_first_part_general.1000.desc$\nI stand at the front, amidst the crowd gathered at the portal. [guldan.GetFirstNameNoTooltip] ascends the platform, leaning on his staff, and addresses the Horde:\n\n"The elements have abandoned us, but I have not. With my power, I have found us a new world—a land richer and more fertile than this dying Draenor. Battles await, but you—the strongest of our kind—will triumph. Draenor’s salvation lies in conquest! For the Horde!"\n\nThe Horde roars again, but I remain still. Chosen by the Warchief, I step toward the portal then light flashes, shadows swirl, and I am hurled through the void. When I land, I am knee-deep in cold, muddy water. It’s a swamp.\n\n#EMP #bold So this is Azeroth. Here, we will make a new beginning.#!#!"
 wc_horde_invasion.draenor.1000.desc:0 "$wc_horde_invasion.draenor_first_part_general.1000.desc$\nI stand at the front, amidst the crowd gathered at the portal. [guldan.GetFirstNameNoTooltip] ascends the platform, leaning on his staff, and addresses the Horde:\n\n"The elements have abandoned us, but I have not. With my power, I have found us a new world—a land richer and more fertile than this dying Draenor. Battles await, but you—the strongest of our kind—will triumph. Draenor’s salvation lies in conquest! For the Horde!"\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ My heart pounds as I step forward, joining the tide of warriors surging toward the portal. Light flashes, shadows swirl, and I am pulled through the void. When I land, I find myself knee-deep in cold, muddy water. The swamp around me reeks of decay, but its air is heavy with possibility.\n\n#EMP #bold This is Azeroth. A world for the taking.#!#!"
 wc_horde_invasion.evil_magic.1000.desc:0 "My concentration is shattered by a wave of fel magic with a purity and intensity I have never felt before. Unable to resist it, I reach out to tap into this colossal source of energy, but I can only grasp a fraction of its power. The sheer magnitude leaves me breathless—a taste of something beyond comprehension.\n\nBut what is happening?\n\nI peer outside and spot an aurora of fel energy—a towering glow piercing the sky, pointing to the source of the shockwave in the southeast. The air hums with lingering vibrations as if the world itself struggles to contain this force. Lesser beings likely haven’t sensed it, but spellcasters across the world surely have.\n\nAs the shockwave passes, a vision strikes me. A massive portal has been torn open—a gateway to a land drenched in Fel and Necrotic powers. The mark of the [burning_legion|E] is clear. Could it truly be them?"
 wc_horde_invasion.good_magic.1000.desc:0 "My concentration is suddenly disturbed by a wave of fel magic with a purity and intensity I have never felt before. The magic around me vibrates, dissonant with the natural order of the planet. The air grows heavy, almost suffocating, saturated with this unknown energy. Instinctively, I harness my innate powers and immediately begin purifying myself and my surroundings from this insidious corruption.\n\nWhat is happening?\n\nLooking to the distance, I spot a radiant aurora of fel magic—a towering glow piercing the sky, pointing toward the source of the shockwave, somewhere to the southeast of the planet. The air still vibrates, haunted by oppressive resonances as if the world itself struggles to contain this crushing force. Beings outside likely haven’t even sensed it, but this tremendous surge of power must have been felt by spellcasters across the world.\n\nI feel it deep within me: this is no mere magical imbalance. This is a sign of a greater evil to come."
 wc_horde_invasion.elemental_magic.1000.desc:0 "The elements suddenly begin to scream around me, their voices filled with pain as a wave of black energy of unprecedented intensity sweeps across the planet. My senses are overwhelmed by their cries, and I fall to my knees.\n\nWhat is happening ?\n\nI glance around, my heart pounding, and spot an aurora of demonic energy streaking across the sky, its glow radiating from somewhere in the southeast of the planet. The elements still tremble around me, vibrating in defiance as if they are trying to contain this force. This was no ordinary disturbance. I am certain that many around the world must have felt this demonic assault.\n\nThe spirits seem uneasy. They whisper that something terrible has happened to the planet."
 wc_horde_invasion.fallback_magic.1000.desc:0 "A sudden shift in the world’s energy halts me in my tracks. An overwhelming force surges through the air, unseen but unmistakable. It clings to everything—heavy, suffocating, oppressive. I can feel it coursing through the very ground beneath me.\n\nWhat is happening?\n\nI glance toward the sky and spot a glow of fel energy piercing the heavens, its ominous light emanating from somewhere in the southeast of the planet. The ground vibrates beneath my feet, resonating with a power that feels ancient and unyielding. I do not know what this is, but I am certain of one thing: I am not the only one who felt it.\n\nSomething has changed. And it will not be undone."
 wc_horde_invasion.generic_close.1000.desc:0 "An unusual storm rumbles over the Black Morass. The thunder is so loud that it can be heard miles away. The rain pours down relentlessly, even here, and the air feels stifling, as if some unseen weight is pressing down on the region.\n\nBut that’s not all.\n\nIn recent days, rumors have been spreading about green-skinned creatures attacking travelers and caravans. Not trolls, not goblins—something else. Survivors speak of massive silhouettes glimpsed through the rain, powerful forms with glowing red eyes. Caravans are raided, and many never return.\n\nNo one knows what they are. But with the storm and these ambushes, the Black Morass has become a place best avoided."
 wc_horde_invasion.1000.medivh:0 "So it begins... The end of the world."
 wc_horde_invasion.1000.magic:0 "This cannot end well."
 wc_horde_invasion.1000.orcish_warchief_and_shadowlord:0 "The Horde will crush the world!"
 wc_horde_invasion.1000.orcish_shamanic:0 "I should save my people."
 wc_horde_invasion.1000.orcish:0 "Victory or Death!"
 wc_horde_invasion.1000.draenor_not_horde:0 "A whole new world for us."
 wc_horde_invasion.1000.stormwind_king:0 "We should investigate."
 wc_horde_invasion.1000.generic_close:0 "Looks like there's going to be a storm soon."

 # Horde Fatigue
 wc_horde_invasion.1001.title:0 "Horde Fatigue"
 wc_horde_invasion.1001.desc:0 "It is time to stop this carnage. The Horde has conquered enough land to start a new life in Azeroth. Many orcs are returning to their families, burying their axes in the ground. They have vowed to forget the horrors of war that they had to go through. The warlords of the Horde still pose a threat to some parts of Azeroth, but the bloodiest wars are behind us since the clans no longer see the point in keeping the Horde united."
 wc_horde_invasion.1001.a:0 "The orcs need their warchief!"
 wc_horde_invasion.1001.b:0 "We will go our own way."
 wc_horde_invasion.1002.title:0 "$wc_horde_invasion.1001.title$"
 wc_horde_invasion.1002.desc:0 "$wc_horde_invasion.1001.desc$"
 wc_horde_invasion.1002.orcish.a:0 "The orcs need their warchief!"
 wc_horde_invasion.1002.a:0 "We need our warchief!"
 wc_horde_invasion.1002.orcish.b:0 "$wc_horde_invasion.1001.b$"
 wc_horde_invasion.1002.b:0 "It's over..."
 wc_horde_invasion.1003.title:0 "$wc_horde_invasion.1001.title$"
 wc_horde_invasion.1003.desc:0 "$wc_horde_invasion.1001.desc$"
 wc_horde_invasion.1003.a:0 "We need our warchief!"
 wc_horde_invasion.1003.b:0 "It's over..."

 # Assault on Stormwind
 wc_horde_invasion.1004.title:0 "War Comes to [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 wc_horde_invasion.1004.desc:0 "As I step out of my tent, the crackling flames of torches cast their light on the determined faces of my warriors. Their eyes turn to me as I raise my weapon high to command their attention. I roar:\n\n$warchief_speech_stormwind$"
 wc_horde_invasion.1004.a:0 "Victory or death! Burn their homes to the ground!"
 wc_horde_invasion.1004.a.flavor:0 "The grunts roar with fervent cheers! The war machine begins to move, and you can already feel the weight of destiny shifting in your favor. Stormwind’s walls will crumble!"
 wc_horde_invasion.1005.title:0 "Our Warchief's Speech"
 wc_horde_invasion.other.1005.title:0 "The Roar of the Orcs"
 wc_horde_invasion.1005.desc:0 "The crackling flames of torches illuminate the faces of the warriors gathered around their [warchief.GetTitleAsNameNoTooltip]. I stand among them, feeling the tension in the air as [warchief.GetDynastyHouseNameNoTooltip] steps out of [warchief.GetHerHis] tent. [warchief.GetSheHe] raises [warchief.GetHerHis] weapon high, roaring:\n\n$warchief_speech_stormwind$"
 wc_horde_invasion.orcish_shamanism.1005.desc:0 "The crackling flames of torches illuminate the faces of the warriors gathered here. I stand slightly apart, feeling the tension in the air as [warchief.GetDynastyHouseNameNoTooltip] steps out of [warchief.GetHerHis] tent. [warchief.GetSheHe|U] raises [warchief.GetHerHis] weapon high, roaring:\n\n$warchief_speech_stormwind$"
 wc_horde_invasion.other.1005.desc:0 "From afar, the glow of torches pierces the oppressive darkness of the swamp. As I approach quietly, driven by curiosity, I see hundreds of figures gathered around a tent. A powerful voice rises, deep and guttural.\n\nI cannot understand a single word of the speech, but every roar carries a raw, savage energy. When it ends, a thunderous cheer erupts, and the figures begin to move.\n\nThey are preparing for something."
 wc_horde_invasion.1005.a:0 "Lok'tar Ogar! Blood and Thunder!"
 wc_horde_invasion.orcish_shamanism.1005.a:0 "I will join this fight."
 wc_horde_invasion.other.1005.a:0 "I’d better leave."
 warchief_speech_stormwind:0 ""The weakling humans have spotted our raids. Instead of standing their ground and defending their lands, those cowards ran to grovel before their [king_of_stormwind.GetTitleAsNameNoTooltip|l]. Our scouts report that he has sent spies into the Black Morass to uncover our plans. But that changes nothing! Some among their council already tremble at the reports of our strength; they speak of crawling north, begging for aid. We cannot allow that to happen!\n\nWarriors of the [warchief.GetPrimaryTitle.GetBaseNameNoTooltip], this cursed swamp is no place to forge our destiny. [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] must fall, and we will leave behind nothing but ashes and despair to crush their pathetic kingdoms!""
 wc_horde_invasion.1006.title:0 "$wc_horde_invasion.1004.title$"
 wc_horde_invasion.1006.desc:0 "[warchief.GetTitleAsNameNoTooltip] [warchief.GetDynastyHouseName] has declared war on the humans. Thousands of grunts are already marching across the Borderlands to strike at the lands of [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. For weeks, small bands of orcs have been ravaging human frontiers, destroying villages and setting their pathetic temples ablaze. This growing threat has drawn the attention of their [king_of_stormwind.GetTitleAsNameNoTooltip|l], and rumors are spreading that they may seek aid from the north.\n\n[warchief.GetDynastyHouseNameNoTooltip] has promised us rich and fertile lands if the [warchief.GetPrimaryTitle.GetBaseNameNoTooltip] can annihilate its enemies and subjugate the inferior [wc_races|E] that inhabit this world. Lok’tar Ogar, warriors: death to the humans!"
 wc_horde_invasion.orcish_shamanism.1006.desc:0 "[warchief.GetTitleAsNameNoTooltip] [warchief.GetDynastyHouseName] has declared war on the humans. Thousands of grunts march across the Borderlands, seeking to claim the lands of [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. For weeks, small bands of orcs, unable to contain their thirst for violence, have been raiding the human frontier, disrupting their villages and toppling their fragile temples. This has not gone unnoticed, and whispers say their [king_of_stormwind.GetTitleAsNameNoTooltip|l] may call for aid from the north.\n\n[warchief.GetDynastyHouseNameNoTooltip] speaks of fertile lands and a future for our people—a chance to rebuild what we lost on Draenor. Yet, the path forward is fraught with conflict. Lok’tar Ogar, to arms!"
 wc_horde_invasion.1006.a:0 "$wc_horde_invasion.1005.a$"
 wc_horde_invasion.orcish_shamanism.1006.a:0 "$wc_horde_invasion.orcish_shamanism.1005.a$"
 wc_horde_invasion.1007.title:0 "$wc_horde_invasion.1004.title$"
 wc_horde_invasion.1007.desc:0 ""[ROOT.Char.GetLadyLord|U]!" cried one of my servants as he ran towards me, breathless, while I went about my duties. Leaning close to my ear, he whispered troubling news.\n\nThe [warchief.GetPrimaryTitle.GetBaseName] has crossed the Borderlands and launched a massive assault on our lands. Already, hundreds of terrified refugees are fleeing inward, their cries of despair and fear begging us to come to their aid.\n\nTime is running out. I must decide, and quickly, before those enraged green-skins reach our gates and reduce everything to ashes."
 wc_horde_invasion.king.1007.desc:0 "The scouts sent to the Black Morass have returned, their numbers reduced and their bodies battered. Their leader, his face etched with fatigue, stands before me.\n\n"[ROOT.Char.GetLadyLord|U], the situation is worse than we had imagined. These green-skins are not trolls. And they are far more numerous than we ever anticipated!"\n\nHe continues his report, describing their unmatched brutality, their strange ritualistic practices and their mysterious origins. A courtier casts me a worried glance: the threat is far greater than we had believed, yet some members of the House of Nobles still refuse to take it seriously.\n\nWhat is truly happening? Could this be the [Glossary( 'Apocalypse', 'APOCALYPSE_RENILASH_GLOSS' )]? Whatever they are, it will be decided on the battlefield."
 wc_horde_invasion.medivh.1007.desc:0 "So far, I have managed to stave off the voices which have plagued me for so long... The very ones which drove me to bring [warchief.GetPrimaryTitle.GetName] here from their world.\n\nSwearing fealty to [king_of_stormwind.GetName] was the first time I have disobeyed their words, causing their ceaseless admonishments to escalate into rage and threats. My mental energy drains as I deal with constant migraines and hallucinatory distractions.\n\nNow, the day the voices warned me of has come; my actions have brought war to our fair kingdom. My destruction, they say, is now all but certain.\n\nI must keep up appearances, the [king_of_stormwind.GetTitleAsNameNoTooltip] cannot know what I have done!"
 wc_horde_invasion.1007.a:0 "May [ROOT.Char.GetFaith.WarGodName] protect us..."
 wc_horde_invasion.1007.b:0 "Prepare the defense!"
 wc_horde_invasion.1007.c:0 "Maybe they'll spare me if I bring them [king_of_stormwind.GetFirstNamePossessive] head."
 wc_horde_invasion.king.1007.a:0 "Our Brothers of the Horse will lead the charge."
 wc_horde_invasion.king.1007.b:0 "Let them come."
 wc_horde_invasion.medivh.1007.opt:0 "This is more than I can bear!"
 horsemen_brotherhood_of_the_horse_effect_tt:0 "300 armored horsemen will immediately be raised and join your ranks."
 pikemen_brotherhood_of_the_horse_effect_tt:0 "You will arm 800 men of the Brotherhood of the Horse with polearms."
 brotherhood_of_the_horse_army:0 "Brotherhood of the Horse"
 wc_horde_invasion.1008.desc:0 "Word has made its way to the court that a new foe has breached the [GetTitleByKey('k_stormwind').GetName]. Scouts have reported that the warriors hail from the recently opened Dark Portal.\n\nThey call the mighty beast a [warchief.GetTitleAsNameNoTooltip], and those who follow [warchief.GetHerHim] the [warchief.GetPrimaryTitle.GetBaseName]. They've already begun to lay waste to the lands of [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], ravaging everyone in their path.\n\nThe [king_of_stormwind.GetTitleAsNameNoTooltip] has called any able-bodied soldiers to arms, and the people are preparing for the worst."
 wc_horde_invasion.1008.medivh.desc:0 "It is as I feared. The Orcs, with their preparations for war complete, have begun their march on my homeland, the [GetTitleByKey('k_stormwind').GetName]. Still weakened by a war waged years ago, I know they will not be able to overcome this threat.\n\nThe voice has returned— this time warning me insistently:\n\"You are their enemy now! If you stand to fight they will slay you as a traitor!\"\n\nEach time I struggle against its will, the voice becomes louder and more insistent. Sleep comes in fits, bringing with it visions of my death— my lifeless body hanging from the battlements of [GetTitleByKey('b_stormwind').GetNameNoTier].\n\nHow can I resist these invaders, so weakened in power and mind? Should I trust the voice again?"
 wc_horde_invasion.1008.a:0 "Grave news."
 wc_horde_invasion.medivh.1008.a:0 "I cannot go back to them now!"
 wc_horde_invasion.1008.b:0 "I will heed the call of the [king_of_stormwind.GetTitleAsNameNoTooltip]!"
 wc_horde_invasion.human.1008.b:0 "[king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]... Those are my people. I must fight."

 #################################
 # Introduction Events
 #################################
 # Blackhand
 wc_horde_invasion.1501.title:0 "The Greatest of Warlords"
 wc_horde_invasion.1501.desc:0 "I did what had to be done. Now, the Horde will sweep across this world, and the orcs shall reign for centuries to come. The [Glossary( ' war against the draenei ', 'WAR_DRAENEI_GLOSS' )] marked the beginning of my rise. [blackrock_clan_title.GetName] became the most feared and respected of all orc clans, and I was its ruthless leader.\n\nWhen [ROOT.Char.GetPrimaryTitle.GetName|l] needed a Warchief, who else could have been chosen? I am a leader respected and feared by my warriors. [guldan_character.GetFirstName] may have manipulated my popularity to elevate me to this rank, but what of it? It serves his ambitions as much as it serves mine. Draenor is finished, but it matters not. I will rule across galaxies if I must—not over a world too weak to endure the power of the demons.\n\nMy sons shall inherit this new world: A world the Horde will forge in its image."
 wc_horde_invasion.1501.a:0 "The Council is our greatest ally."
 wc_horde_invasion.1501.a.flavor:0 "The Shadow Council has guided the Horde to greatness, and [guldan_character.GetFirstNameNoTooltip] is the architect of your destiny. Loyalty to the Council ensures unity among the clans and victory over your enemies. Together, you shall forge a future worthy of the orcs."
 wc_horde_invasion.1501.a_alternative:0 "The universe shall withness orcish might!"
 wc_horde_invasion.1501.a_alternative.flavor:0 "Draenor may be gone, but the Horde will rise beyond this dying world. The strength of our warriors and the will of our Warchief will carve our legacy across the stars!"
 wc_horde_invasion.1501.b:0 "[guldan_character.GetFirstNameNoTooltip] has outlived [guldan_character.GetHerHis] usefulness."
 wc_horde_invasion.1501.b.flavor:0 "[guldan_character.GetFirstNamePossessiveNoTooltip] schemes served their purpose, but his time is over. The Horde will no longer be a puppet to his ambitions. [guldan_character.GetHerHis|U] death will free us from his shackles, and my leadership will lead the orcs to true glory."
 wc_horde_invasion.1502.title:0 "The Old Ways"
 wc_horde_invasion.1502.desc:0 "[guldan_character.GetFirstName] and the Shadow Council have brought great knowledge and power to the [ROOT.Char.GetPrimaryTitle.GetName], but some have refused to embrace their ways. [durotan_character.GetFirstName] and the [durotan_character.GetPrimaryTitle.GetName] are the most numerous and obstinate of those who have resisted conversion and refused the [Glossary('Blood of Mannoroth', 'BLOOD_OF_MANNOROTH_GLOSS')].\n\n[guldan_character.GetFirstNamePossessiveNoTooltip] counsel is to eliminate [durotan_character.GetFirstNameNoTooltip], and has devised a scheme involving an assassin placed in [durotan_character.GetHerHis] closest ranks.\nHowever, the murder of such a respected figure could cause a situation, since these apostates are some of our strongest warriors. The thought has also crossed my mind to appease them so that they can later be resettled, isolated, and dealt with."
 wc_horde_invasion.1502.opt.a:0 "[durotan_character.GetFirstNameNoTooltip] must be dealt with immediately."
 wc_horde_invasion.1502.opt.b:0 "This issue must wait until our invasion is won."
 wc_horde_invasion.1502.opt.c:0 "We must respect those who keep the old ways, for now."
 # Gul'dan
 wc_horde_invasion.1511.title:0 "Darkness Incarnate"
 wc_horde_invasion.1511.desc:0 "The portal worked, just as that wizard said. But this time, I will not be the pawn—I will reign supreme. [Glossary( 'My ex-master', 'NERZHUL_GLOSS' )] trusted such a being, and he lost everything for it, as did I. Kil’jaeden made me slaughter the [GetTrait('creature_draenei').GetName(GetNullCharacter)], [Glossary( 'shatter the elements', 'HAND_OF_GULDAN_GLOSS' )] of Draenor, and enslave the Horde, my masterpiece, with the [Glossary('Blood of Mannoroth', 'BLOOD_OF_MANNOROTH_GLOSS')]. All of that for a dying world, warring clans for the last scraps of life, and the loss of their faith in me, the prophet of their ascension! But this dying world is behind me now. Ahead lies Azeroth, ripe for conquest.\n\nThis portal offers us this world, a land of divided kingdoms and feeble lords... They will burn, but not for him. I learned Kil'jaeden's ways and this wizard will fare no better. He spoke about #N The Tomb of Sargeras#! only once, but that was enough, I know it exists. [stormwind_holder.GetPrimaryTitle.GetNameNoTier] will burn, as he demanded. Then he will reveal his secrets to me… #EMP #bold before I crush him!#!#!"
 wc_horde_invasion.1511.a:0 "And the Shadow Council will be my blade!"
 wc_horde_invasion.1511.a.flavor:0 "The Shadow Council is your ultimate weapon. Your agents and servants are everywhere within the Horde, even among your internal enemies. They still believe in you, convinced that you will lead them to power by your side. The strength of the Horde is within your grasp."
 wc_horde_invasion.1511.a_alternative:0 "I must rebuild the Council, otherwise I'm screwed."
 wc_horde_invasion.1511.a_alternative.flavor:0 "The Shadow Council is shattered. Most of its members are dead or have betrayed you, leaving you vulnerable. Many within the Horde have not forgotten how your guidance nearly led them to extinction. Without your agents and influence, it is difficult to confront them."
 wc_horde_invasion.1511.b:0 "Blackhand will betray me, it's sure."
 wc_horde_invasion.1511.b.flavor:0 "Blackhand is too ambitious to remain loyal for long. He knows you manipulated his rise to power and resents the strings you hold over him. One day, he will try to cast you aside to claim the Horde as his own — better to strike first."
 wc_horde_invasion.1512.title:0 "My Favorite Pet"
 wc_horde_invasion.1512.desc.intro:0 "My servant, [garona_character.GetFirstName]. A half-breed of our world, [garona_character.GetSheHe] has all the raw strength of [garona_character.GetHerHis] Draenei mother and the cunning of [garona_character.GetHerHis] Orc father. With the psychic techniques taught to us by the [Glossary( 'Pale Orcs', 'PALE_ORCS_GLOSS' )] muting [garona_character.GetHerHis] moralistic and willful tendencies, [garona_character.GetSheHe] was groomed from birth to be the perfect assassin.  \n\nNow that we have settled in on Azeroth, the time is right to set $Garona to $her work." 
 wc_horde_invasion.1512.desc.canon_directive:0 "The target will be none other than $King Wynn of Stormwind, our enemy in the war to come. The bait will be information regarding the betrayal of the mage $Medivh, whose usefulness he shall soon outlive."
 wc_horde_invasion.1512.desc.player_driven:0 "Now, upon which target will I set my most valuable and favored pet?"
 wc_horde_invasion.1512.opt.a: "[stormwind_holder.GetTitledFirstName] will die by [garona_character.GetHerHis] blade and my will!"
 wc_horde_invasion.1512.opt.a.1.tt: "[garona_character.GetFirstName] will travel to [stormwind_holder.GetCapitalLocation.GetTitle.GetBaseNameNoTier] in order to create chaos within the [stormwind_holder.GetPrimaryTitle.GetName] and division among the ranks."
 wc_horde_invasion.1512.opt.a.2.tt: "[garona_character.GetFirstNameNoTooltip] may be [imprisoned|E], depending on the intrigue aptitude of [stormwind_holder.GetTitledFirstNamePossessive]'s [spymaster|E]."
 wc_horde_invasion.1512.opt.b: "Her blade will secure the throne of the Horde for me."
 wc_horde_invasion.1512.opt.c: "She will assist me in whatever matters I see fit."
 wc_horde_invasion.1512.opt.c.tt: "[garona_character.GetFirstName] will remain at your court."

 # Durotan
 wc_horde_invasion.1521.title:0 "The Betrayer of the Orcs"
 wc_horde_invasion.1521.desc:0 "For years now, [guldan_character.GetFirstName] has gathered the orcs at the [Glossary( 'Throne of Kil’Jaeden', 'THRONE_OF_KILJAEDEN_GLOSS' )], offering them his [Glossary( '"gift"', 'BLOOD_OF_MANNOROTH_GLOSS' )]. This brew strengthened us, but it also tainted our skin with a green hue and awakened a deep thirst for blood and violence. Horrified by what I witnessed, I forbade the [ROOT.Char.GetCulture.GetCollectiveNoun] from touching it. Yet it wasn’t enough — our skin turned green as well, and already I can see the bloodlust creeping into our hearts.\n\nThe clans left behind on Draenor have fallen into savage madness. [ROOT.Char.GetLiege.GetFirstName] had chosen only those with a shred of reason left, like us, to follow him here, to Azeroth."
 wc_horde_invasion.1521.desc_normal_outro:0 "\n\n[orgrim_character.GetFirstName] still doubts me; he claims that a single orc cannot destroy an entire world. Yet the earth around the portal is already withering, just as it did on Draenor. #EMP Cursed be [guldan_character.GetFirstNameNoTooltip]!#! If he is not stopped, our people are doomed to destruction."
 wc_horde_invasion.1521.desc_no_ogrim_outro:0 "\n\nThe other clans won’t listen; they say one orc can’t destroy a world. Yet the land around the portal already withers, just as it did on Draenor. #EMP Cursed be [guldan_character.GetFirstNameNoTooltip]!#! If he isn’t stopped, our people are doomed to destruction."
 wc_horde_invasion.1521.desc_no_more_corruption_outro:0 "\n\nGul’dan is gone, but his lackeys still linger, and the corruption festers within our people. Something must be done — the spirits cry out for vengeance."
 wc_horde_invasion.1521.a:0 "Accursed warlock!"
 wc_horde_invasion.1521.a.flavor:0 "Gul’dan will not get away with this! Azeroth cannot be left to die like Draenor, and we cannot endlessly invade new worlds. One day, he will answer for his crimes."
 wc_horde_invasion.1521.a_alternative:0 "Corruption will go away."
 wc_horde_invasion.1521.a_alternative.flavor:0 "You take a deep breath, telling yourself that with Gul’dan gone, the corruption will fade in time. Yet a shadow of doubt lingers in your mind — you can still feel its grip on your people, no matter how hard you try to deny it."
 wc_horde_invasion.1521.b:0 "I have to follow the other clans for now."
 wc_horde_invasion.1521.b.flavor:0 "The taste of defeat is bitter on your tongue. The other clans have already chosen their path and refuse to listen — for now, you must follow, bowing to the will of the dae’mons. You need time — time to find the moment when you can save your people."
 # Doomhammer
 wc_horde_invasion.1531.title:0 "The Path to Glory"
 wc_horde_invasion.1531.desc:0 "The marsh consumes us. Each step drags my grunts deeper into the muck. Behind me, a grunt dares to grumble: "#EMP We should be on the battlefield!#!" One glare from me, and he falls silent. This marsh may be merciless, but I am far more so.\n\nSince the [Glossary( 'war against the ogres', 'OGRE_BLACKROCK_WAR_GLOSS' )], I have served as [blackhand_character.GetFirstNamePossessive] second and bearer of the Doomhammer. This burden weighs as heavily on my arm as it does on my soul. When [guldan_character.GetFirstName] offered [guldan_character.GetHerHis] [Glossary( '"gift"', 'BLOOD_OF_MANNOROTH_GLOSS' )], I turned it down—not out of pride, but fear. Or was it wisdom? The elements have abandoned us on Draenor, and I cannot help but wonder: was [durotan_character.GetFirstName] right about [guldan_character.GetFirstNameNoTooltip] after all? Was it [guldan_character.GetHerHis] action that killed Draenor?\n\nThey whisper that I will be the next Warchief. Let them whisper—it changes nothing. I do not need words to assert my authority. The Doomhammer will speak for me."
 wc_horde_invasion.1531.a:0 "My name will echo through the ages."
 wc_horde_invasion.1531.a_flavor:0 "The Horde thrives on strength and ambition, and you will prove you're destined for more than being a second. [durotan_character.GetFirstNameNoTooltip] is wrong — no warlock could destroy a world alone. With your weapon, you will carve a path to glory."
 wc_horde_invasion.1531.b:0 "[durotan_character.GetFirstNameNoTooltip] was right all along."
 wc_horde_invasion.1531.b_flavor:0 "[guldan_character.GetFirstNamePossessiveNoTooltip] gifts corrupted your people long before the Blood of Mannoroth tainted their veins. The silence of the elements is a sign — your ancestors have been betrayed, perhaps by you most of all. [guldan_character.GetSheHe|U] must be stopped before it's too late, even if it means defying the Horde itself."
 # Kilrogg
 wc_horde_invasion.1541.title:0 "The Ancient"
 wc_horde_invasion.1541.desc:0 "Our [Glossary( 'ancestral lands', 'JUNGLE_OF_TANAAN_GLOSS' )] are lost, transformed into a barren wasteland as Draenor withers, abandoned by the elements. Yet the [ROOT.Char.GetCulture.GetName] refuse to bow to fate!\n\nAfter years of struggle, [guldan_character.GetFirstName] opened the Dark Portal, and [ROOT.Char.GetLiege.GetFirstName] commanded us to invade this new world. He promised fertile lands for our people, a chance to begin anew.\n\nBut I feel it now, the end drawing near. When I [Glossary( 'sacrificed my eye', 'EYE_RITUAL_GLOSS' )], I saw my own death: struck down by unknown enemies. Now I understand, they are the pink-skins of this world!\n\n[ROOT.Char.GetLiege.GetFirstNameNoTooltip] respects me and grants me a measure of freedom. But freedom means nothing without action: I must secure the future of my clan before my vision comes to pass… or prove that it can be defied."
 wc_horde_invasion.1541.a:0 "The lands around us wait only for us to claim them."
 wc_horde_invasion.1541.a_flavor:0 "You came here to offer your people a new home. The Black Morass echoes your ancestral Tanaan Jungle, and a lush jungle must be nearby. It is time to send Bleeding Hollow scouts to explore the surroundings."
 wc_horde_invasion.1541.a_tooltip:0 "You send Bleeding Hollow scouts to explore the West in search of lands to conquer."
 wc_horde_invasion.1541.b:0 "I will seize the Horde before my time comes!"
 wc_horde_invasion.1541.b_flavor:0 "Your life has been defined by the struggle to ensure your clan’s survival. Seizing the title of Warchief before your death would be the pinnacle of your glory, carving your name into history. The other Warlords will surely admire your audacity."
 # Cho'gall
 wc_horde_invasion.1561.title:0 "The Whispers"
 wc_horde_invasion.1561.desc:0 "The moment #EMP we#! crossed the Dark Portal, visions and whispers besieged #EMP our#! monds. At first, I thought it was yet another manifestation of the demons [guldan_character.GetFirstName] had [Glossary( 'taught us about', 'CHOGALL_FORMATION_GLOSS' )]. But over time, as I led [ROOT.Char.GetPrimaryTitle.GetName|l], I came to understand. These visions do not come from demons but from their forgotten gods, forces far older and more powerful than the Legion itself.\n\n#EMP Gall#! remains strangely silent. #EMP He#!, so prone to impulsiveness, seems untouched by these voices. But I hear them, growing ever stronger… And #EMP our#! [Glossary( 'pale orcs', 'PALE_ORCS_GLOSS' )] — once the most unruly of all the clans — now obey #EMP us#! without question, as if guided by a superior will. They call #EMP us#! the Twilight Prophets…"
 wc_horde_invasion.1561.a:0 "What if they were right? I must convince Gall. @twilights_hammer_cult_icon!"
 wc_horde_invasion.1561.a_flavor:0 "#EMP "Now everything is clear. The Legion wages its petty crusade out of fear of these gods, but it is doomed to fail, for the inevitable fate of the universe is the Twilight Hour.\nThe Horde, these visions, my encounter with the pale orcs — all of this cannot always be mere coincidence. Gall respects only strength, and so he must be made to see that this is the true path forward."#!"
 wc_horde_invasion.1561.b:0 "We can't betray the Burning Legion."
 wc_horde_invasion.1561.b_flavor:0 "When you strike a pact with the Legion, there is no turning back. To think we could outwit the highest demonic powers would invite horrors beyond imagining. You cannot betray the Shadow Council."
 wc_horde_invasion.1561.c:0 "No one can tell us what to do."
 wc_horde_invasion.1561.c_flavor:0 "#EMP "We are not slaves to demons, nor to whispers in the dark. Gall was right — we are the masters of our fate, and strength is ours to command. These voices… I will silence them myself!"#!"
 wc_horde_invasion.1562.title:0 "The Hour of Twilight"
 wc_horde_invasion.1562.desc:0 ""#EMP (KILL [devoted.GetHerHim]!)#!" growled Gall when I tore [devoted.GetNamePossessive] soul from [devoted.GetHerHis] body, sending it to [new_faith.PositiveAfterLife].\n\n"Do you see, Gall? Their essence completes the circle. [new_faith.PantheonTerm|U] approve of this offering. #EMP (Hah! POWER… YES! Show me MORE!)#!"\n\nI exhaled over the book in #EMP our#!hands, imbuing its pages — already soaked with the blood of the [new_faith.GetAdjective] faithful — with the essence of [devoted.GetName]. Gall is jubilant, tonight, dozens of dismembered bodies allowed me to forge this book. [new_faith.PantheonTerm|U] have revealed the truth that will be inscribed within: the [Glossary( 'Titans', 'TITAN_GLOSS' )], the Black Empire, the Legion, the Void...\n\nOver the past few weeks, Gall has opened himself to the whispers. He finally understands. Every decision #EMP we#!have made has brought #EMP us#!to this very moment. #EMP We#!are their prophets. Twilight falls!"
 wc_horde_invasion.1562.a:0 "The Hour of Twilight is upon us!"
 wc_horde_invasion.1562.a_flavor:0 "You are now the will of the [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )]. The stars grow dim, the heavens tremble, and the earth shudders. The Horde will likely usher in the Hour of Twilight, but you must be one of its architects. Their whispers demand it: #EMP fight for the Horde!#!"
 # Other Twilights Hammer
 wc_horde_invasion.1571.title:0 "$wc_horde_invasion.1561.title$"
 wc_horde_invasion.1571.desc:0 "Since our arrival on Azeroth, whispers have crawled into my mind. Sometimes faint murmurs, sometimes piercing screams. Shapeless shadows haunt my dreams, commanding me to kneel. The gods of Draenor… they have fallen silent. And the [Glossary( 'Star', 'DARK_STAR_GLOSS' )] is gone. But here… here, it’s different. Here, they are many. Four… No, five? I know them, even though I have never seen them.\n\n#EMP [Glossary( 'Yogg-Saron', 'YOGG_SARON_GLOSS' )]#!, death and the end of all things. #EMP [Glossary( 'Y’Shaarj', 'YSHAARJ_GLOSS' )]#!, rage and hatred burning in my heart. #EMP [Glossary( 'N’Zoth', 'NZOTH_GLOSS' )]#!, secrets that must never be revealed. #EMP [Glossary( 'C’Thun', 'CTHUN_GLOSS' )]#!, pure, unrelenting madness. And another... distant, weak, but present. The god of blood and rot.\n\nDoes any of this make sense? Perhaps Azeroth is a new beginning… or a mistake. A terrible, terrible mistake."
 wc_horde_invasion.1571.a:0 "I will follow. @twilights_hammer_cult_icon!"
 wc_horde_invasion.1571.a_flavor:0 "The whispers are clear now. They do not beg, they call. [Glossary( 'Yogg-Saron', 'YOGG_SARON_GLOSS' )], [Glossary( 'Y’Shaarj', 'YSHAARJ_GLOSS' )], [Glossary( 'N’Zoth', 'NZOTH_GLOSS' )], [Glossary( 'C’Thun', 'CTHUN_GLOSS' )]... and the bleeding shadow beyond them all. No chains. No masters. Only fate."
 wc_horde_invasion.1571.b:0 "Demons pay better than whispers."
 wc_horde_invasion.1571.b_flavor:0 "Whispers promise. Demons deliver. Power is blood, not dreams. The Legion gave us strength, and with it, we took worlds. I’ll take another."
 convert_to_twilights_hammer_effect_tt:0 "This can lead to your secret conversion to the [new_faith.GetName|V]"
 # Medivh
 wc_horde_invasion.1581.title:0 "The Last Guardian"
 wc_horde_invasion.1581.desc:0 "Years ago, a Voice reached out and showed me a vision of a dying land beyond the twisting nether, where a race of warriors dwelled who were capable of protecting Azeroth from demonic incursion. With great exertion, I contacted their great shaman [guldan_character.GetFirstName] and brought them here.\n\nHowever, the Orcs are not what I expected; violent and cruel, they reek of demonic influence. My scrying has revealed that the Orcs are already planning to make war upon my sponsor and erstwhile home, the [GetTitleByKey('k_stormwind').GetName]. Just how greatly have I been deceived?\n\nMuch worse, should my complicity in the warmongering Orcs' arrival be traced back to me, [GetTitleByKey('k_stormwind').GetHolder.GetName] will likely brand me a traitor! Exhausted from opening the $DARK_PORTAL_NAME$, my energy is limited and my options constrained."
 wc_horde_invasion.1581.opt.a:0 "Surely I can buy time..."
 wc_horde_invasion.1581.opt.b:0 "I must push myself to remain vigilant!"
 wc_horde_invasion.1582.title:0 "The Guardian's Apprentice"
 wc_horde_invasion.1582.desc.intro:0 "For many years, I refused an apprentice. I saw no promise in the mundane and artless beings of this world. Some of them I turned away outright, others I tormented until they left. Yet this most recent arrival, this [khadgar_character.GetFirstName], seems different— touched by destiny and purpose, brimming with potential and raw power.\n\n"
 wc_horde_invasion.1582.desc.insane:0 "The Voice, my newest and closest confidant, tells me not to trust him. Maybe I can use him, when I am well again; drain him of his power to put right what I have wronged.\nHe'll survive... Probably...\n\nUntil then, I must choose: Should I keep him at arm's length, lock him out of the ateliers where my darkest secrets lie? Or should I feign the role of mentor, keeping him close at hand and too busy to look where he should not see?"
 wc_horde_invasion.1582.desc.resigned:0 "As I struggle against the depredations of the Voice and await the gruesome and just fate it has shown me, [khadgar_character.GetFirstName] has been a welcome distraction and a dim source of hope. If only my sins were not so great, if only my death were not so close at hand; he could be like the son I never had. Yet I am no guardian anymore, just a shadow of my former self. Should I remain aloof, lock him out of the places where my secrets dwell? Or should I deceive him, play the role of mentor and hope he does not catch on?"
 wc_horde_invasion.1582.desc.fallback:0 "The Voice has returned, harrowing me day and night with predictions of my own impending doom. As much as I want to trust this boy, I can afford no such luxury now. Should I remain aloof, lock him out of the places where my secrets dwell? Or should I deceive him, play the role of mentor and hope he does not catch on?"
 wc_horde_invasion.1582.opt.a:0 "He cannot know my crimes!"
 wc_horde_invasion.1582.opt.b:0 "I will take the boy under my wing, for now."
 #################################
 # Events of the First War
 #################################
 # Garona Caught in Stormwind
 wc_horde_invasion.2001.title:0 "A Curious Prisoner"
 wc_horde_invasion.2001.desc:0 "A strange-looking Orc [garona_character.GetWomanMan] has been caught in the environs of $c_stormwind$ and turned over to our prisons. Claiming to be on a mission of revenge for [garona_character.GetHerHis] mother's people who were destroyed by the Horde, [garona_character.GetName] offers [garona_character.GetHerHis] services as a double agent and informant.\n\n[stormwind_spymaster.GetName] warns me that this interloper is not to be trusted, however [stormwind_spymaster.GetSheHe] does concede that the Horde is not known to use strategems of war such as infiltration and assassination and appears to prefer open combat. Is some other force driving this deceit? Or is [garona_character.GetFirstName] here in earnest? I ponder the correct course of action with respect to the prisoner."
 wc_horde_invasion.2001.opt.a:0 "We need all the help we can get in this fight."
 wc_horde_invasion.2001.opt.b:0 "Debrief [garona_character.GetHerHim], but keep [garona_character.GetHerHim] locked up for now."
 wc_horde_invasion.2001.opt.c.regret:0 "Though it pains me, we must treat [garona_character.GetHerHim] as an enemy spy."
 wc_horde_invasion.2001.opt.c.normal:0 "[stormwind_spymaster.GetSheHe] is a spy, and I must have answers from [garona_character.GetHerHim]."
 # The Investigation into Medivh
 wc_horde_invasion.2011.title:0 "The Unthinkable"
 wc_horde_invasion.2011.desc:0 "Amid the clamor of war reports, logistics meetings, and aid requests, an unusal arrival at my court puts even the most critical war proceedings on hold: [khadgar_character.GetFirstName], apprentice of the Guardian [medivh_character.GetFirstName]; and [garona_character.GetFullName], a Horde double agent. Apparently, these two informants arrived with evidence suggesting that none other than [medivh_character.GetFirstNameNoTooltip] [medivh_character.GetHerselfHimself] was responsible for opening the Dark Portal and bringing the Orcs through!\n\nIf this is true, the situation could be even more dire than our worst nightmares. The brave [lothar_character.GetTitledFirstName] has offered to investigate, accompanied by a cadre of soldiers. However, some of my councilors urge caution. After all, this could be the only being who could save us; how could we dare to antagonize him?"
 wc_horde_invasion.2011.opt.a:0 "Go, [lothar_character.GetTitledFirstNameNoTooltip]. Make him answer for this!"
 wc_horde_invasion.2011.opt.a.tt:0 "The group will set out to confront [medivh_character.GetFirstNameNoTooltip] immediately..."
 wc_horde_invasion.2011.opt.b:0 "We have never needed [medivh_character.GetFirstNameNoTooltip] on our side more than now."
 wc_horde_invasion.2011.opt.b.tt:0 "The true cause of the Dark Portal crisis will remain forever unknown."
 wc_horde_invasion.2011.opt.c:0 "Justice can wait until after this war is over."
 wc_horde_invasion.2011.opt.c.tt:0 "The group will set out to confront [medivh_character.GetFirstNameNoTooltip] when the war ends."
 # Gul'dan's Decision Regarding Medivh
 wc_horde_invasion.2101.title:0 "Usefulness Outlived?"
 wc_horde_invasion.2101.desc.canon:0 "My plans to appropriate the knowledge and power of [medivh_character.GetFirstName] have hit a snag: His apprentice [khadgar_character.GetFirstName] is on his way to confront the so-called "Guardian" for [medivh_character.GetHerHis] role in our arrival on Azeroth. Even now, [khadgar_character.GetSheHe] is just a few days' travel from [medivh_character.GetFirstNamePossessiveNoTooltip] residence at [medivh_character.GetCapitalLocation.GetTitle.GetBaseNameNoTier].\n\nOn the one hand, there is little chance the apprentice could best [khadgar_character.GetHerHis] master in a fair contest, and the treachery of [medivh_character.GetFirstNamePossessiveNoTooltip] apprentice might further my grip on [khadgar_character.GetHerHis] soul. On the other hand, this could be an opportunity to get rid of the loose end [medivh_character.GetFirstNameNoTooltip] once and for all. To ransack [medivh_character.GetHerHis] mind with haste would leave [medivh_character.GetHerHim] vulnerable to defeat by the upstart.\n\nOf course, the spell will take time to prepare and the timeline will be tight. It is even possible that I may face some #emp minor feedback effects#! if [medivh_character.GetSheHe] is killed. How shall I proceed?"
 wc_horde_invasion.2101.desc.non_canon:0 "The time has come to enact my plans to appropriate the knowledge and power of the so-called "Guardian" [medivh_character.GetFirstName]. Sufficiently weakened by demonic influence and unable to recover from opening the Dark Portal, [medivh_character.GetFirstNameNoTooltip] is in no position to resist my intrusion even as my patience wears thin. With every victory, [story_owner.GetFirstName] grows more powerful and revered, and [story_owner.GetSheHe] cannot be allowed to impede me. I must find #emp what I came here for#!.\n\nOf course, I could always wait until my power grows, and [story_owner.GetFirstNamePossessiveNoTooltip] power wanes; and the fool [medivh_character.GetFirstNameNoTooltip] could yet be of use. I consider my options carefully..."
 wc_horde_invasion.2101.opt.a:0 "Godhood cannot wait any longer."
 wc_horde_invasion.2101.opt.a.tt:0 "You will make a #N risky#! attempt to read [medivh_character.GetFirstNamePossessiveNoTooltip] mind."
 wc_horde_invasion.2101.opt.b:0 "The time is not yet right for this."
 wc_horde_invasion.2101.opt.b.tt:0 "You will wait 5 years to gather this information."
 wc_horde_invasion.2101.opt.c:0 "I shall warn [medivh_character.GetFirstNameNoTooltip] of [medivh_character.GetHerHis] apprentice's treachery."
 wc_horde_invasion.2101.opt.c.tt:0 "Slightly increase [medivh_character.GetFirstNamePossessiveNoTooltip] odds of surviving confrontation with [khadgar_character.GetFirstNameNoTooltip]."
 # Gul'dan's Torpor'
 wc_horde_invasion.2111.title.confront:0 "The Backlash"
 wc_horde_invasion.2111.desc.confront:0 "I rifle through [medivh_character.GetFirstNamePossessive] mind, the pace quickening as I feel magical blows radiating pain through [medivh_character.GetHerHis] body. I am looking for anything related to my ultimate goal on this world: #N The Tomb of Sargeras#!. The hits keep coming, and despite [medivh_character.GetHerHis] considerable magical power [medivh_character.GetSheHe] is unable to leverage it through the distraction of my neural meddling.\n\nJust as a final gout of arcane energy blasts open [medivh_character.GetHerHis] mana shield to let in the strike of a blade to [medivh_character.GetHerHis] chest, I view a map with a wretched Elven finger pointing in admonishment. In the time it takes for the blade to penetrate the skin, crack the ribcage, and pierce the ventricle, I hear the conversation that occurred that day, I learn of the tremendous dark power buried on these distant sunken islands. As the blood pools in [medivh_character.GetFirstNamePossessiveNoTooltip] pleura, choking away [medivh_character.GetHerHis] life, I feel a rush of joy. And as [medivh_character.GetHerHis] brain blinks out of consciousness into shock, I..."
 wc_horde_invasion.2111.opt.a:0 "... feel my soul sever from my body."
 wc_horde_invasion.2111.opt.a.tt:0 "This option is a placeholder for future content; #P you will recover in 1 year#!. Stay tuned to our discord for updates, and thanks for playing Guardians of Azeroth 2!"
 wc_horde_invasion.2111.opt.b.confront:0 "... miraculously resist."
 wc_horde_invasion.2111.opt.b.tt:0 "This option is only available to human players and is a placeholder for future content. Stay tuned to our discord for updates, and thanks for playing Guardians of Azeroth 2!"
 # Gul'dan Gains Knowledge from Medivh
 wc_horde_invasion.2112.title:0 "Brain Drain"
 wc_horde_invasion.2112.desc:0 "Over the past year, I have been subtly peeking into [medivh_character.GetFirstNamePossessive] mind, attempting to find the location of the #N The Tomb of Sargeras#!, a site of demonic power which could grant me Godlike abilities. The Mage is no slouch, however, and has been trained well in the Mnemonic arts as well as the Arcane. While I was forced to probe very deeply, ultimately making [medivh_character.GetHerHim] aware of my activity. It is of no matter... Now that I have found what I am looking for in [medivh_character.GetHerHis] mind, no power on this planet can stop me from attaining ultimate power!"
 wc_horde_invasion.2112.opt:0 "Now [medivh_character.GetHerHis] deepest secrets are mine."
 # Medivh is Confronted
 wc_horde_invasion.2201.title:0 "A Fated Confrontation"
 wc_horde_invasion.2201.desc.intro.canon:0 "As I feel the presence of my apprentice [khadgar_character.GetFirstName], the voices in my mind crescendo to a raging cacaphony. In this moment, I know that the only path forward is [khadgar_character.GetHerHis] annihilation. My skin tingles with excitement as I wait in my Atelier, and soon [khadgar_character.GetSheHe] stands before me.\n\n"
 wc_horde_invasion.2201.desc.intro.non-canon:0 "The presence of my apprentice [khadgar_character.GetFirstName] approaches, and I can sense [khadgar_character.GetHerHis] violent intent. The game is up; The day I feared would come is finally here. I steel myself in my Atelier as [khadgar_character.GetFirstNameNoTooltip] enters the door and stands before me.\n\n"
 wc_horde_invasion.2201.desc.taunt.party:0 ""So, the apprentice returns," I hiss contemptuously, "and you've brought friends. Here for a tea party I suppose?"\n[khadgar_character.GetFirstNameNoTooltip] ignores my taunt, launching into a predictable monologue about bringing me to "justice".\n\n"
 wc_horde_invasion.2201.desc.taunt.alone:0 ""So, the apprentice returns," I hiss contemptuously, "you petulant upstart. Do you seriously think you could defeat me on your own?"\n[khadgar_character.GetFirstNameNoTooltip] ignores my taunt, launching into a predictable monologue about bringing me to "justice".\n\n"
 wc_horde_invasion.2201.desc.feeling.prepared:0 ""Silence!" I cut [khadgar_character.GetHerHim] off, "our green-skinned 'guests' have warned me of your pathetic plan. Now you face the full might of the Guardian of Tirisfal!" With a blast of arcane magic, the battle is joined."
 wc_horde_invasion.2201.desc.feeling.drained:0 "Before I cut [khadgar_character.GetHerHim] off, a wave of dark magic buffets me and sends me reeling. This is not [khadgar_character.GetFirstNamePossessiveNoTooltip] magic! My concentration crumbles as memories rush through my mind. Can I even fight like this?"
 wc_horde_invasion.2201.desc.feeling.insane:0 ""Silence!" I cut [khadgar_character.GetHerHim] off, "Your impudence will be punished with a fate worse than death; your broken body will serve my master for eternity!" With a blast of arcane magic, the battle is joined."
 wc_horde_invasion.2201.desc.feeling.ok:0 "Fegining compliance, I turn around and allow [khadgar_character.GetFirstNameNoTooltip] to finish. "One day you will understand why I did what I did," I sigh, waiting for [khadgar_character.GetHerHim] to drop [khadgar_character.GetHerHis] guard, "If you survive this!" With a blast of arcane magic, the battle is joined."
 wc_horde_invasion.2201.opt.a:0 "Now fate will decide the victor."
 wc_horde_invasion.2201.opt.a.tt.forwin:0 "#help You survive the battle and escape#!"
 wc_horde_invasion.2201.opt.a.tt.forloss:0 "#XB You are slain in the battle#!"
 # Medivh dies
 wc_horde_invasion.2202.title:0 "The Fate of Medivh"
 wc_horde_invasion.2202.desc.drained:0 "With my powers drained, I was no match for the young [khadgar_character.GetFirstName]. "
 wc_horde_invasion.2202.desc.healthy:0 "Even with all my strength, I was somehow no match for the young [khadgar_character.GetFirstName]."
 wc_horde_invasion.2202.desc:0 "\n\nThe life is sapped from my body as my soul begins to drift into the interstices between Azeroth and the Twisting Nether. Apparently, enough arcane power was left in me to preserve my consciousness, and I find myself floating disembodied through the land I once defended... and betrayed. Why did I do it? How did we come to this? As I feel the astral tether to my dying body slipping away, my thoughts wander to...
 wc_horde_invasion.2202.opt.a:0 "The ruler of Stormwind, my home."
 wc_horde_invasion.2202.opt.b:0 "The scheming [guldan_character.GetTitledFirstName], my Orcish counterpart."
 wc_horde_invasion.2202.opt.d:0 "My servant, [moroes_character.GetFirstName], who will take over these lands."
 wc_horde_invasion.2202.opt.e:0 "The darkness of the Twisting Nether."
 wc_horde_invasion.2202.opt.e.tt:0 "#N Your current playthough will end!#!"
 # Medivh survives
 wc_horde_invasion.2203.title:0 "Medivh Survives"
 wc_horde_invasion.2203.opt.a:0 "Maybe... I can fix it all?" 
 # Orgrim - Path to Glory pt2
 wc_horde_invasion.2401.title.durotan_dead:0 "A Time For Vengeance"
 wc_horde_invasion.2401.desc.durotan_dead:0 "Now that the war to carve out a homeland on this new world is complete, my thoughts return to my now-dead friend [durotan_character.GetFirstName]. His death was indeed ordered by [blackhand_character.GetFirstName] [blackhand_character.GetHerselfHimself], but the fingerprints of [GetTitleByKey('k_shadow_council').GetNameNoTier] are all over the scheme.\n\nThat honorless fool! Every fiber of my being knows that I could rule [blackhand_character.GetPrimaryTitle.GetName] better than that pathetic worm!\n\nRevenge is sacred to our people, as is my right to [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )].  "
 wc_horde_invasion.2401.title.durotan_alive:0 "Along the Path to Glory"
 wc_horde_invasion.2401.desc.durotan_alive:0 "Now that the war to carve out a homeland on this new world is complete, my thoughts turn to the words of [durotan_character.GetFirstName]. His concerns regarding [blackhand_character.GetFirstName] have surely borne out, and the machinations of [GetTitleByKey('k_shadow_council').GetNameNoTier] cannot be ignored.\n\nI can smell [blackhand_character.GetFirstNamePossessiveNoTooltip] weakness from here, even as [blackhand_character.GetSheHe] preens on the throne of [blackhand_character.GetHerHis] fancy new castle. I could use [blackhand_character.GetHerHis] reliance on [GetTitleByKey('k_shadow_council').GetNameNoTier] as evidence to assert my right to [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )]!\n\n"
 wc_horde_invasion.2401.desc.guldan_torpor:0 "Now that [guldan_character.GetFirstName] has been struck comatose, the fiend will be unable to resort to [guldan_character.GetHerHis] usual trickery to assure [guldan_character.GetHerHis] puppet's victory.\n\nThe time to make my move is now, while I am still able to take advantage of [blackhand_character.GetFirstNamePossessive] weakness!"
 wc_horde_invasion.2401.desc.guldan_alt:0 "With [guldan_character.GetFirstName] at full strength, my challenge could be much more difficult as the fiend will certainly use any available trick to assure [guldan_character.GetHerHis] puppet's victory.\n\nThe time to make my move is now, before they are able to consolidate power!"
 wc_horde_invasion.2401.opt.a:0 "Send out the call for $makgora_name$!"
 wc_horde_invasion.2401.makgora_tt: "You will engage [blackhand_character.GetName] in [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )], a ritual single combat, for [GetTitleByKey('e_horde').GetName] and [GetTitleByKey('k_stormwind').GetName]!"
 wc_horde_invasion.2401.opt.b:0 "I could not bear the burden victory would bring..."
 # Orgrim - Path to Glory pt2 notification event
 wc_horde_invasion.2402.title:0 "Oh? You're Approaching Me?"
 wc_horde_invasion.2402.desc:0 "A murmurring noise outside indicates to me that large crowd has gathered outside my [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] tent. As I open the flap to look outside, I am doubly surprised. First of all, the crowd is more like a sea of greenskinned Orcish faces... Indeed it seems that nearly the entirety of [GetTitleByKey('e_horde').GetName] has accumulated here on the muddy, decimated battlefield that was once the [GetTitleByKey('k_stormwind').GetName].\n\nSecondly, that standing directly outside of my tent is [orgrim_character.GetNameNicknamed], my erstwhile champion. Overcome with indignation, I barely am able to listen as the traitor chants out the ritual call for [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )].\n\nA demonic rage wells up within me, overcoming even my fear of the terrible namesake weapon my opponent wields. The time for thinking is over, the time for glorious combat is now!"
 wc_horde_invasion.2402.opt:0 "[GetTitleByKey('e_horde').GetNameNoTooltip] belongs to me!"
 # King Lane is Killed
 wc_horde_invasion.2901.title:0 "Checkmate"
 wc_horde_invasion.2901.victim.intro:0 "I rouse to a shadow leaning over my bed. Before I can even react, a knife is slashed roughly across my throat. Even in the dark, as my vision grows dim with the life leaving my body, I can make out the unmistakeable figure of [garona_character.GetFullName] watching me... Seeing to my silent death."
 wc_horde_invasion.2901.victim.showed_mercy:0 "So this is the price I pay for showing mercy to an Orc?"
 wc_horde_invasion.2901.victim.imprisoned_her:0 "The snake must have escaped my dungeons..."
 wc_horde_invasion.2901.victim.tortured_her:0 "The strength and will to bear imprisonment and torture and still commit this act... How will my kingdom survive?"
 wc_horde_invasion.2901.victim.double_agent:0 "It would appear I have found out the true loyalties of our "double agent"... Too late."
 wc_horde_invasion.2901.victim.outro:0 "\n\nMy vision goes dark, and the Light itself appears as a tunnel before me, welcoming my soul. I think of my [stormwind_king.GetPrimaryTitle.GetTierAsName] and the trials it faces. Was I a good [stormwind_king.GetTitleAsName]? How will history remember me?\n\nMy final thoughts are of my wife, my son..."
 wc_horde_invasion.2901.opt.victim:0 "...Time to rest."
 wc_horde_invasion.2901.guldan:0 "I watch keenly through the eyes of my pet, [garona_character.GetFirstName], as the blood of [stormwind_king.GetName] sprays across [stormwind_king.GetHerHis] bedchamber. Even as I smile, I can feel the heat of [garona_character.GetHerHis] tears welling up as if they were my own. The pitiful creature, how [garona_character.GetSheHe] struggles! I force [garona_character.GetHerHis] to stare at [garona_character.GetHerHis] victim, watch [stormwind_king.GetHerHim] struggle and choke, to see [garona_character.GetHerHis] own fate should [garona_character.GetSheHe] ever cross me.\n\nNow, with their [stormwind_king.GetTitleAsNameNoTooltip] dead, the weak humans will surely break beneath the Orcish boot. From their fertile lands will come the strength of arms and blood sacrifices to open the way to my true destiny... #Bold Godhood.#!"
 wc_horde_invasion.2901.opt.guldan:0 "My will be done."
 wc_horde_invasion.2901.horde:0 "Our scouts report that [stormwind_king.GetName] has been slain by an assassin. Rumor has it that this was the result of the machinations of [guldan_character.GetTitledFirstName] and his minion [garona_character.GetFirstName]!\n\nNow, with their leader feeding the worms, the cowardly pinkskins are sure to scatter to the winds; leaving their fertile lands for us to plunder."
 wc_horde_invasion.2901.opt.horde_shaman:0 "Even so... There was no honor in this act."
 wc_horde_invasion.2901.opt.horde_fel:0 "Lok'tar Ogar! For the Horde!"
 wc_horde_invasion.2901.victim_subject:0 "This is a dark day for [stormwind_king.GetPrimaryTitle.GetName]. Our [stormwind_king.GetTitleAsName] was found murdered in [stormwind_king.GetHerHis] bedchamber. Said to be the work of the Orcish spy [garona_character.GetFullName], this foul act proves how cunning, cowardly, and purely evil a foe we face.\n\nRumors abound of those who would turn our lands over to the invaders, or those with new designs upon the throne. Even so, as the royalty prepares for the succession, the knights and levees of our great land march on in our defense."
 wc_horde_invasion.2901.opt.victim_subject:0 "We will have no time to mourn."
 wc_horde_invasion.2901.crisis_ally:0 "Shocking news has arrived from [stormwind_king.GetPrimaryTitle.GetName]: [stormwind_king.GetFullName] was found murdered in [stormwind_king.GetHerHis] bedchamber. Rumor has it that this foul act was the result of the machinations of the insidious [guldan_character.GetTitledFirstName] and [guldan_character.GetHerHis] minion [garona_character.GetFirstName]!\n\nNow more than ever, our allies... no... our world needs us to muster to the defense; lest this gruesome fate befall all who stand in the way of [GetTitleByKey('e_horde').GetName]."
 wc_horde_invasion.2901.opt.crisis_ally:0 "Our hearts are with [stormwind_king.GetPrimaryTitle.GetBaseName] this day."
 # Death of Blackhand
 wc_horde_invasion.2902.title:0 "The Death of [blackhand_character.GetFirstNameNoTooltip]"
 wc_horde_invasion.2902.desc.blackhand:0 "With a blow of the Doomhammer, my legs are brought out from under me. The pain sears through me from the blows and strain of a hard fought battle, but I know that my death is imminent as I feel another blow crush my spine and my entire lower body goes numb.\n\nMy end will be honorable, but will my story be told reverence or derision? After all, it was [guldan_character.GetFirstName], not me, who brought our people to this land; the pathetic weakness of its fattened inhabitants that guaranteed me victory. In the end, I was too weak to hold onto the empire I have built on Azeroth.\n\nFor a moment, I expect the ever-honorable [orgrim_character.GetFirstName] to roll me over so that I can at least meet death facing my enemy. Instead, the Doomhammer comes down again and again on my upper back and I struggle in vain to take in a breath. Dirt fills my nostrils and mouth as I silently attempt to scream in anger at the demonic strength that has abandoned me..."
 wc_horde_invasion.2902.desc.doomhammer:0 "I lift the Doomhammer one last time from the muddy pile of viscera that was once the torso of my foe, [blackhand_character.GetFirstName]. The fool died as [blackhand_character.GetSheHe] lived— in weakness and cowardice.\n\nIt takes only a sweep of my hunting knife to cut [blackhand_character.GetHerHis] head free and hoist it aloft by the hair. The stunned crowd takes in the brutal scene for a moment before erupting in a howl of cheers.\n\nMy eyes scan the innumerable crowd of raucous orcs before me; their bodies swollen with power drawn from the fel blood of demons, their eyes glistening with lust for the power that I have taken by right and honor. They look nothing like the noble race I knew my people to be since my childhood on Draenor— \nIn this moment I know that I will need more than the power of the Doomhammer to keep the titles I have earned this day."
 wc_horde_invasion.2902.desc.guldan_alt:0 "As the head of [blackhand_character.GetFirstName] is held aloft, the crowd lets loose a howl of cheers. Even my so-called peers, the clan leaders, join in. I, Darkness Incarnate, refuse to allow myself to be swept up in this juvenile display.\n\nThe archaic tradition of [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )] has thrown my plans into disarray, and even my interference could not keep the wielder of the Doomhammer from victory. With a wave of my hand, my slaves lift me aloft and carry me through the screaming crowd; the other shamans of the [GetTitleByKey('k_shadow_council').GetName] follow.\n\n I must plan my next move immediately!"
 wc_horde_invasion.2902.desc.guldan_lore:0 "Through the haze of the spirit world I am able to view the archaic tradition of [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )] played out between my puppet [blackhand_character.GetFirstName] and the pest [orgrim_character.GetFirstName], who wields the coveted Doomhammer. Unsurprisingly, without my intervention my foolish minion is unable to fend off its blows and soon enough [blackhand_character.GetHerHis] head is held aloft by the new leader of [GetTitleByKey('e_horde').GetName].\n\nMy disembodied consciousness seethes in an ineffectual rage. This would have been a perfect opportunity to create chaos in the horde and make my push for the #N Tomb of Sargeras#!! Now this traditionalist fool has seized power for [orgrim_character.GetHerselfHimself], and will surely see this as an opportunity to undermine me, or worse, strike down my sleeping body...\n\nFortunately, the dark magic of the Pale Orcs seems to still work in this disembodied form, and my minions are still under my control. I must act quickly and use it to further my goals before [orgrim_character.GetFirstNameNoTooltip] can ruin everything!"
 wc_horde_invasion.2902.desc.blackhand_child:0 "The assembled clans cheer as my father's head is held aloft by [orgrim_character.GetFirstName]. My own screams echo with them, but they are not screams of adulation. My body seethes with rage compounded by demonic fury, but there is something more beneath it; an element of joy, a recognition of opportunity.\n\nAlthough my father's crown will soon rest upon this fool's head, it is destined to settle on mine. The electricity of this moment courses through me as I realize that my father's vagaries no longer dictate the course of my life. I am now free to pursue power as I see fit!"
 wc_horde_invasion.2902.desc.blackhand_vassal:0 "When the news spread that [orgrim_character.GetFirstName] had challenged [GetTitleByKey('e_horde').GetHolder.GetTitleAsNameNoTooltip] [blackhand_character.GetFirstName] to [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )], Orcs from across the domains of [GetTitleByKey('e_horde').GetName] rallied to attend the duel. This ancient practice had fallen out of favor recently, for its fractious nature did not fit with [GetTitleByKey('k_shadow_council').GetName]'s vision for a unified and disciplined [GetTitleByKey('e_horde').GetBaseNameNoTooltip].\n\nNow these two figures, the [GetTitleByKey('e_horde').GetHolder.GetTitleAsNameNoTooltip] and the feared wielder of the Doomhammer, clashed on this muddy battlefield. The contest was not even close, with [orgrim_character.GetNameNoTooltip] handily pounding [blackhand_character.GetTitledFirstNamePossessiveNoTooltip] body to a pulp, lifting [blackhand_character.GetHerHis] head to demonstrate [orgrim_character.GetHerHis] victory to the crowd.\n\nAll present erupted in cheers, thrilled by this display of #N blood and honor#!: \"$wc_horde_invasion.2901.opt.horde_fel$\""
 wc_horde_invasion.2902.desc.other:0 "News has reached my court that the menace [blackhand_character.GetFirstNameRegnal] was struck down in a duel to the death by his clansman, who now styles himself [orgrim_character.GetFullName]. What this change will mean for [GetTitleByKey('e_horde').GetName] in the short term, we cannot say at this time.\n\nAlthough their great invading army's numbers apparently continue to grow every day, my councilors have pointed out that this development has proven that the invaders are not as unified as might be believed and that their infighting may yet prove a weakness. Regardless, at the rate they ingress via the Dark Portal, the sheer power and brutality of [GetTitleByKey('e_horde').GetName] will make them a grave threat."
 wc_horde_invasion.2902.opt.blackhand:0 "The fel blood could not save me."
 wc_horde_invasion.2902.opt.blackhand_no_guldan:0 "The spirits' strength was not enough."
 wc_horde_invasion.2902.opt.guldan:0 "Even in my rage, I can only look on."
 wc_horde_invasion.2902.opt.horde:0 "$wc_horde_invasion.2901.opt.horde_fel$"
 wc_horde_invasion.2902.opt.disloyal_clan:0 "We refuse to recongize this false \"[orgrim_character.GetTitleAsName]\"!"
 wc_horde_invasion.2902.opt.other:0 "Such is often the fate of tyrants."
 defended_title_makgora:0 "You defended your titles in $makgora_name$!"

 #################################
 # Events of the Shadow Council
 #################################
 wc_horde_invasion.3000.title:0 "A New Lair"
 wc_horde_invasion.3000.desc:0 "For the next step in my plans, I will need to separate myself and my [GetTitleByKey('k_shadow_council').GetName] from the [GetTitleByKey('e_horde').GetHolder.GetTitleAsName] in order to work without scrutiny. Fortunately, a source of great power lies beneath a volcano in the mountains to the north. In the lava chambers below, I will be able to ensconce myself and my minions and use its hellish energy to summon a demonic army that shall make Azeroth quake beneath its heels."
 wc_horde_invasion.3000.a:0 "Send an expedition."
 wc_horde_invasion.3000.a.tt:0 "You send an expedition north in search of a stronghold from which to oversee the invasion of Azeroth."
 wc_horde_invasion.3000.b:0 "The [GetTitleByKey('e_horde').GetHolder.GetTitleAsNameNoTooltip] is too stupid to interfere with me!"

 wc_horde_invasion.3001.title:0 "The Inhabitants of Blackrock Mountain"
 wc_horde_invasion.3001.desc.intro:0 "Our scouts report that the volcano is indeed occupied...\n\n"
 wc_horde_invasion.3001.desc.defender_exists:0 "[blackrock_mountain_holder.GetPrimaryTitle.GetName] has its seat deep in the heart of the mountain. Their army is quite extensive, supplemented by magical constructs. A raiding campaign will need to begin in order to sow chaos and fear into the hearts of their nobility. Once they are off-balance, we can fully strike and take the mountain for ourselves!"
 wc_horde_invasion.3001.desc.no_defender:0 "Once the capital of the [GetTitleByKey('e_horde').GetName], the mountain is now simply the most prominent refuge among squabbling clans and roving savages. Dispersing them will be no difficult matter, and we can take the land for ourselves."
 wc_horde_invasion.3001.a:0 "Begin the raids!"
 wc_horde_invasion.3001.b:0 "Seize these unorganized lands."
 wc_horde_invasion.3001.c:0 "We cannot fight another war."

 wc_horde_invasion.3002.title:0 "Greenskin Raiders"
 wc_horde_invasion.3002.desc:0 "What began as a series of raids over the redridge mountains has snowballed into a full on brushfire war with the green-skinned invaders of the human lands to our south. The conflict has killed and injured many, among them some of our favored knights. These creatures are specially skilled in wielding sinister magics which are beyond our Mages' comprehension, but it is clear that this effort is no more than an offshoot of their main force.\n\nYet, over the centuries we have grown more suited to life below the mountains. We could retreat into our vast network of tunnels and leave the surface to be ravaged by these newcomers..."
 wc_horde_invasion.3002.a:0 "We must defend our lands!"
 wc_horde_invasion.3002.b:0 "No more, give them what they want..." 

 wc_horde_invasion.3003.title.shadow_council_master:0 "[negotiator.GetFirstName] Offers to Negotiate"
 wc_horde_invasion.3003.title.negotiator.shathgral:0 "A Voice from the Shadows"
 wc_horde_invasion.3003.title.negotiator.ignism:0 "A Voice from the Flames"
 wc_horde_invasion.3003.desc.shadow_council_master:0 "As the campaign to wrest control over Blackrock Mountain continues, the paucity of my clan's numbers has been made clear. While our demonic summons are more than capable of driving back the landholders and their golems, we lack the manpower to hold the lands for ourselves while the [GetTitleByKey('e_horde').GetHolder.GetTitleAsName] demands his levy.\nAs this stalemate continues, [negotiator.GetName] has stepped forward with an offer to begin negotiations with our enemy. Should this conflict drag on, I may lose my advantage of time and secrecy. Perhaps I should hear [negotiator.GetHerHim] out?"
 wc_horde_invasion.3003.desc.negotiator.shathgral:0 "In the dark, I have heard whispers; visions of a font of dark power oozing from beneath the volcano my overlord feebly assaults. The old gods! They call to me in their way... Their whispers, almost inaudible, lay before me a course of action... I see it stretched out before me in time; a worldline for my body to follow...\n\nI know it leads to the foot of my overlord's throne, where I shall ask to negotiate his foe's surrender on his behalf.\n\nCan I resist this fate?"
 wc_horde_invasion.3003.desc.negotiator.ignism:0 "During my nightly ritual I see it laid before me by the fire spirits... A cavern deep beneath the crust of Azeroth where the Firelord himself has made a summer palace among kindred spirits of mine. His voice calls to me in the licking of flame and crackling of fuel.\n\nIn a moment I know there can be peace between them and my liege, that the Firelord will grant great power to [shadow_council_master.GetHerHim] and myself...\n\nBut will there be a price?"
 wc_horde_invasion.3003.negotiator.a:0 "I will embrace my destiny."
 wc_horde_invasion.3003.negotiator.a.tt:0 "You may be rewarded with #P lands #!..."
 wc_horde_invasion.3003.negotiator.b:0 "No! My fear is too great!"
 wc_horde_invasion.3003.a:0 "Let's hear what [negotiator.GetSheHe] has to say."
 wc_horde_invasion.3003.b:0 "Enough talk. Kill them all!"
 wc_horde_invasion.3003.c:0 "We have the upper hand. Seize the land!"

 wc_horde_invasion.3004.title:0 "Speaker of Fire and Stone"
 wc_horde_invasion.3004.desc:0 "The conflict with the greenskins has sapped the strength of our realm, and more of our people have fled below ground. In the midst of this refugee crisis, a stranger has emerged from among the enemy.\n\n"
 wc_horde_invasion.3004.desc.ignism:0 "When [negotiator.GetSheHe] speaks, tongues of flame issue forth from [negotiator.GetHerHis] mouth. It is obvious [negotiator.GetSheHe] is chosen by the Firelord himself, and so it was obvious we would hear what [negotiator.GetSheHe] had to say. [negotiator.GetHerHis] words were rational, passionate, imbued with the spirits' wisdom:\n\nA proposal for a negotiated peace; [shadow_council_master.GetPrimaryTitle.GetName] shall rule half the surface plus the peak of Blackrock Mountain, and we the rest."
 wc_horde_invasion.3004.desc.shathgral:0 "[negotiator.GetSheHe|U] speaks in a strange but familiar tone, it is one we have heard echoing within the stones of our deepest tunnels. It is a voice much older, much more powerful than our world, and it is truly entrancing. Imbued with a supernatural persuasiveness, the Negotiator lays out a proposal for a negotiated peace:\n\n[shadow_council_master.GetPrimaryTitle.GetName] shall rule half the surface plus the peak of Blackrock Mountain, and we the rest."
 wc_horde_invasion.3004.a:0 "This proposal is divinely inspired, we must accept."
 wc_horde_invasion.3004.b:0 "This is blasphemy! It shall be war between us!"

 wc_horde_invasion.3005.title:0 "The Mountain Divided"
 wc_horde_invasion.3005.desc:0 "With a wave of my hand, my signature is forged into a ritual tablet by fel flame. So it shall be that we divide this land between our two realms; [shadow_council_master.GetPrimaryTitle.GetName] and [blackrock_mountain_holder.GetPrimaryTitle.GetName]. Now the magical power of this mountain and the security of its tunnels are both mine. From here I survey the lands of Azeroth and plot my gambit for #N The Tomb of Sargeras!#!"
 wc_horde_invasion.3005.a:0 "It is done."

 wc_horde_invasion.3006.title:0 "No Quarter!"
 wc_horde_invasion.3006.desc:0 "My armies muster now in earnest. There can be no more pretense, all other options have been exhausted. War will come now to Blackrock Spire!"
 wc_horde_invasion.3006.a:0 "Lok'tar Ogar!"

 wc_horde_invasion.3007.title:0 "The Negotiator's Due"
 wc_horde_invasion.3007.desc:0 "[negotiator.GetName] stood before me upon my new throne at the top of the Spire, requesting new lands as [negotiator.GetHerHis] due for services rendered. As [negotiator.GetFirstNameNoTooltip] spoke, I sensed a new force behind [negotiator.GetHerHis] words. Perhaps there is something more to this oaf after all!\n\n On the one hand, this is a transparent attempt at psychic manipulation. On the other, this growing power could prove useful to me. Decisions, decisions..."
 wc_horde_invasion.3007.negotiator.desc:0 "I stood before the [shadow_council_master.GetTitleAsName] in my finest cloak, letting my newfound powers speak through me. While I could sense that [shadow_council_master.GetSheHe] saw through my attempt at mind control, apparently [shadow_council_master.GetSheHe] was impressed enough to acede to my demands anyway.\n\nIs this the work of my masters? In whose game am I now a pawn? Reality slips from my grasp once again as I exit the chamber..."
 wc_horde_invasion.3007.blackrock_mountain_holder.desc:0 "A dream of fire and shadow, erupting from deep below and blanketing all of Azeroth... Myself and [negotiator.GetName], elevated above it all, gripping its dark heat in our hands...\n\nThis vision echoed in my mind even as my infuriated servants report that [negotiator.GetFirstNameNoTooltip] has appropriated yet more of our lands with [shadow_council_master.GetNamePossessive] approval. I sigh and lift my hand to cease their squabbling.\n\nIt now falls to me to keep what is left of our people together as we wait for our master's plans to take root."
 wc_horde_invasion.3007.a:0 "Very well. These lands are [negotiator.GetHerHis]."
 wc_horde_invasion.3007.b:0 "Impudent fool! How dare you?"
 wc_horde_invasion.3007.c.negotiator:0 "My power grows..."
 wc_horde_invasion.3007.c.blackrock_mountain_holder:0 "This must have been the Firelord's will."

 wc_horde_invasion.3010.opening:0 "A Deal Worth Honoring?"
 wc_horde_invasion.3010.desc:0 "An emissary from [blackrock_mountain_holder.GetPrimaryTitle.GetName] has arrived at my court upon my ascension to Warchief. Apparently, my predecessor agreed to a permanent truce between ourselves and [blackrock_mountain_holder.GetName]. This decision stinks of cowardice, but it was made at the request of [guldan_character.GetName] which means that not to abide could be perilous..."
 wc_horde_invasion.3010.a:0 "Sign the blasted treaty and get this whelp out of my sight!"
 wc_horde_invasion.3010.b:0 "Ha! I shall display no such weakness!"

