l_english:
  BALNAZZAR_DREADLORD_CUSTOM_STRING_KEY:0 "A dreadlord wears a borrowed face and spends a mortal lifetime reaching for a throne that was never his."

  wc_balnazzar_story.0100.title:0 "The Failing Shell"
  wc_balnazzar_story.0100.desc:0 "The hand I wear trembles when it lifts the seal. This flesh is beginning to fail, and no heir is ready to inherit its name. When it dies, the court will divide everything I built among claimants who know nothing of me.\n\nI can wait for that indignity, or tear away the disguise while I still command what lies beneath it."
  wc_balnazzar_story.0100.a:0 "The mask has served long enough."
  wc_balnazzar_story.0100.b:0 "Let it end quietly."

  wc_balnazzar_story.0101.title:0 "A Familiar Stranger"
  wc_balnazzar_story.0101.desc:0 "[balnazzar_witness.GetShortUINameNoTooltip] has been watching me. Familiar answers now earn a second glance, and yesterday [balnazzar_witness.GetSheHe] caught me studying this face in the glass. [balnazzar_witness.GetSheHe|U] has told no one. Not yet."
  wc_balnazzar_story.0101.a:0 "Reassure them. Whatever they think they saw, it was nothing."
 wc_balnazzar_story.0101.a_tooltip:0 "Suspicion decreases by up to 2"
  wc_balnazzar_story.0101.b:0 "Have them quietly imprisoned before they say this to anyone else."
 wc_balnazzar_story.0101.b_tooltip:0 "Suspicion decreases by up to 3"
  wc_balnazzar_story.0101.c:0 "Say nothing. Let them keep wondering."
  wc_balnazzar_story.0101.c_tooltip:0 "Suspicion increases by 1"

  wc_balnazzar_story.0102.title:0 "Under the Ashes"
  wc_balnazzar_story.0102.desc:0 "Another chapel is emptied. Another village swears the proper creed. The work is necessary, but it sends soldiers and clerks into places where a careless word can travel farther than an army."
  wc_balnazzar_story.0102.a:0 "Continue."
  wc_balnazzar_story.0102.a_tooltip:0 "Suspicion increases by up to 2"

  wc_balnazzar_story.0110.title:0 "The Next Mask"
  wc_balnazzar_story.0110.desc:0 "[next_vessel.GetShortUINameNoTooltip] must die without appearing dead. A ruler found cold in bed leaves seals to be seized and loyalties to be tested. I need the body to rise, dress, and summon its servants as usual.\n\nWhen the last defense gives way, I enter. A servant opens the door and sees the same face that dismissed him yesterday. He bows.\n\nThe old shell has served its purpose. By the time anyone looks for it, nothing will remain."
  wc_balnazzar_story.0110.a:0 "Wear the next mask."
 wc_balnazzar_story.0110.a_tooltip:0 "You attempt to possess [next_vessel.GetShortUIName]. If successful, your old body vanishes. You keep both bodies' Intrigue perks and Balnazzar's magic, lose Light perks and points, and cannot contract new diseases while disguised. If possession fails, you remain in your current body."
  wc_balnazzar_story.0111.title:0 "The Morning Petitions"
  wc_balnazzar_story.0111.desc:0 "A servant brings the morning petitions and pauses at the threshold. I sign the first order with [ROOT.Char.GetFirstNamePossessive] hand, then ask why he is staring. He apologizes and bows.\n\nOutside this room, the same guards keep watch and the same councillors wait to be heard. They speak their ruler's name. I answer, and the day's business begins."
  wc_balnazzar_story.0111.a:0 "Let them recognize their ruler."
  wc_balnazzar_story.0111.a_tooltip:0 "You continue as [ROOT.Char.GetShortUIName], retaining this ruler's titles and court while Balnazzar's magic and hidden nature persist"

  wc_balnazzar_story.0002.title:0 "A Death They Can Believe"
  wc_balnazzar_story.0002.desc:0 "Varimathras faces me beneath the ruined throne, magic gathering in his claws, Sylvanas waiting behind him. To her, this must look like obedience: one dreadlord buying mercy with his brother's blood. To us, it is a performance rehearsed without words.\n\nHis spell strikes hard enough to convince the room and carefully enough to spare me. I fall and give the witnesses the stillness they came to see. Sylvanas claims Lordaeron without comment. Whether she believes the death or merely accepts the result, she gives no sign.\n\nOnly after her footsteps fade does Varimathras move. By nightfall I am crossing into the Plaguelands, crownless and unseen. Let them remember the body on the floor. I have other faces to wear."
  wc_balnazzar_story.0002.a:0 "Let Balnazzar die before their eyes."

  wc_balnazzar_story.1001.title:0 "A Face Not His Own"
 wc_balnazzar_story.1001.desc:0 "Lordaeron is beyond my command. Whatever its new masters make of it, remaining in my own shape would leave me hunted and exposed. Dathrohan's name offers a quieter way back.\n\nI find him alone among Stratholme's ruins. He recognizes what stands before him and reaches for the Light. I close the distance before he can call upon it.\n\nWhen I leave, the guards see Saidan Dathrohan. They salute. I let his hand return the gesture."
  wc_balnazzar_story.1001.a:0 "Wear the mask."
  wc_balnazzar_story.1001.a_magic_tooltip:0 "Balnazzar's magic and Intrigue perks carry over alongside this body's existing Intrigue perks. Light perks and points are lost, and you cannot contract new diseases while disguised"
 wc_balnazzar_story.1001.b:0 "Dathrohan is beyond my reach."
 wc_balnazzar_story.1001.b_tooltip:0 "This possession path ends because Dathrohan is dead or no longer playable"

  wc_balnazzar_story.1002.title:0 "Borrowed Authority"
  wc_balnazzar_story.1002.desc:0 "Dathrohan's heart is silent, yet his hand closes when I will it. Men who would have drawn steel against Balnazzar bow when they see this face. They bring Saidan reports, keys, and sealed orders. I accept them in his voice.\n\nThe body remembers enough. A salute. A prayer spoken at the proper hour. Which officer expects warmth, and which expects a command. Where memory fails, rank supplies the answer.\n\nThe Scourge still infest Stratholme. Alexandros holds the Silver Hand together, while Renault watches Darion receive his father's trust. The order can be broken without ever seeing its enemy."
  wc_balnazzar_story.1002.a:0 "Begin."
  wc_balnazzar_story.1002.a_tooltip:0 "You assume Saidan's titles and court. Balnazzar's magical abilities remain hidden beneath the disguise"

  wc_balnazzar_story.1003.title:0 "The Last Council"
  wc_balnazzar_story.1003.desc:0 "The council crowds around a map of the Plaguelands. Roads are lost and defenses thin, yet every argument bends toward Alexandros. Even his challengers trust him to preserve the order.\n\nI answer with Dathrohan's measured gravity. How readily these mortals offer trust to a familiar face. Their fervor can be inflamed, their discipline misdirected, their doubt nourished.\n\nAlexandros alone holds them together. A direct blow would make a martyr. Better to send him where the dead can strip away his guard, then let blood betray blood. Kel'Thuzad will demand a price. Once Alexandros falls, every oath in this hall becomes mine to corrupt."
  wc_balnazzar_story.1003.a:0 "Send word to Kel'Thuzad. Alexandros must be isolated."
 wc_balnazzar_story.1003.a_tooltip:0 "You seek Kel'Thuzad's aid against Alexandros, promising a favor in return."

  wc_balnazzar_story.1004.title:0 "Terms in the Crypt"
  wc_balnazzar_story.1004.desc:0 "Frost creeps over the crypt floor while Kel'Thuzad listens. I need his dead to close around Alexandros's escort in Stratholme. Renault will do the rest.\n\nThe lich offers the ambush and something more. Once Alexandros falls, he will raise him. In return, Kel'Thuzad wants a debt he may collect when it suits him."
  wc_balnazzar_story.1004.desc_confirmed:0 "Kel'Thuzad has considered the message I sent from the conclave. His dead will divide Alexandros from his guard in Stratholme, and Renault will have his moment.\n\nThen the lich will raise the father his son struck down. His price is a debt, held until he chooses to collect it."
 wc_balnazzar_story.1004.a:0 "Accept the debt."
 wc_balnazzar_story.1004.c:0 "I owe him nothing."
 wc_balnazzar_story.1004.b:0 "No bargain, then."
 wc_balnazzar_story.1004_pact_tooltip:0 "Kel'Thuzad gains a Favor Hook on you if possible. While Alexandros lives, your murder scheme against him gains 15 Success Chance."
 wc_balnazzar_story.1004_refuse_tooltip:0 "You owe Kel'Thuzad no favor and receive no aid from him against Alexandros."
 wc_balnazzar_story.1004_no_pact_tooltip:0 "You receive no aid from Kel'Thuzad. Your plans must continue without him."

  wc_balnazzar_story.1005.title:0 "A Son's Envy"
  wc_balnazzar_story.1005.desc:0 "At the council table, Renault falls silent whenever Alexandros praises Darion. He hides it quickly, but not before his hand tightens around the stem of his cup.\n\nI do not accuse his father of anything. I ask questions. Why is Darion trusted with the harder command? Why does the Ashbringer pass so easily over Renault? By the third question, he no longer needs me to answer.\n\nDead servants may clear his path, or Renault may have to make the opening himself. The blade must still be his."
  wc_balnazzar_story.1005.a:0 "Let the boy prove himself to his father."
  wc_balnazzar_story.1005.a_tooltip:0 "Starts a scheme to have Alexandros Mograine assassinated"
 wc_balnazzar_story.1005.b:0 "Find another hand for the knife."
 wc_balnazzar_story.1005.b_tooltip:0 "Starts a murder scheme against Alexandros without Renault's involvement."

  wc_balnazzar_story.1010.title:0 "The Bait"
  wc_balnazzar_story.1010.desc:0 "Renault comes after midnight with a story already sharpened for his father's ear. Darion, he will say, has been taken near Stratholme. Alexandros will ride before doubt can catch him.\n\nThere is one complication. Fairbanks rarely lets the Ashbringer leave his sight. If Alexandros goes, the priest will follow."
 wc_balnazzar_story.1010.a:0 "Let him believe it."

  wc_balnazzar_story.1011.title:0 "The Road to Stratholme"
 wc_balnazzar_story.1011.desc:0 "Renault's message is brief. His father believed every word. Alexandros has ridden for Stratholme, with Fairbanks beside him.\n\nThey are on the road now. Renault has only to keep his nerve, follow, and choose his moment."
  wc_balnazzar_story.1011.a:0 "The road closes behind them."

  wc_balnazzar_story.1006.title:0 "The Ambush That Wasn't"
  wc_balnazzar_story.1006.desc:0 "Renault's final report reaches me. Alexandros followed the lie to Stratholme, with Fairbanks at his side. The dead closed around them. Renault says the priest vanished beneath the bodies before Alexandros finally tired and let the Ashbringer fall. Then the son struck.\n\nKel'Thuzad has kept his bargain. Alexandros now stands in the lich's service, and the blade in his hand is no longer bright. Renault returned without either."
  wc_balnazzar_story.1006.desc_refused:0 "Renault's final report reaches me. Alexandros followed the lie to Stratholme, with Fairbanks at his side. No Scourge host cleared Renault's path, but the fighting separated them all the same. He says the priest vanished beneath the bodies. When his father stood alone, Renault struck with the Ashbringer.\n\nThe blade darkened in his hands. He returned carrying it, unable to look at the weapon or at me."
  wc_balnazzar_story.1006.a:0 "Now Renault belongs to me."

  wc_balnazzar_story.1007.title:0 "Scarlet from Silver"
 wc_balnazzar_story.1007.desc:0 "Alexandros has fallen. Renault will not meet my eyes as the officers assemble. When I speak with Dathrohan's voice, he offers no objection.\n\nThe Silver Hand, I tell them, cannot fight this war with its old vows unchanged. The new banners lie folded beside the table. I rest a hand upon the scarlet cloth and wait for the commanders to answer."
  wc_balnazzar_story.1007.a:0 "Raise the Scarlet banner."
  wc_balnazzar_story.1007.a_vassal_conversion_tooltip:0 "Every vassal still following the Holy Light converts to Scarletism alongside you"
 wc_balnazzar_story.1007.b:0 "Keep the banners folded. I can wait."
 wc_balnazzar_story.1007.b_tooltip:0 "You retain Dathrohan's disguise and postpone the proclamation until you can secure control of the Order and the support to found the Crusade."
  scarlet_crusade_custom_name:0 "Scarlet Crusade"

  wc_balnazzar_story.1012.title:0 "The Witness Returns"
  wc_balnazzar_story.1012.desc:0 "The hall at Hearthglen falls silent when Fairbanks enters unbidden. Guards follow, uncertain whether to seize a priest who stood at Alexandros's side. He speaks without permission.\n\nHe names Renault first: the son led Alexandros into Stratholme and struck after the Scourge spent his father's strength. He turns to me. The ambush was Dathrohan's design; Renault merely carried it out.\n\nSome avert their eyes. Others watch me, waiting to learn whether truth still carries more weight than rank."
  wc_balnazzar_story.1012.a:0 "Grief has broken him. Remove him."
  wc_balnazzar_story.1012.a_tooltip:0 "Fairbanks is imprisoned, and Suspicion increases by up to 2."
  wc_balnazzar_story.1012.b:0 "Let him leave. His followers will reveal themselves."
  wc_balnazzar_story.1012.b_tooltip:0 "Fairbanks remains free, and Suspicion increases by up to 4."

  wc_balnazzar_story.1014.title:0 "The Witness Below"
  wc_balnazzar_story.1014.desc:0 "The gaoler returns from the sealed chambers beneath the Scarlet Monastery with every trace of color gone from his face. Fairbanks no longer eats, sleeps, or draws breath. Still, when the door opens, the priest rises and names Alexandros's murderers again.\n\nI order the chamber barred and his name struck from the rolls. Let the Crusade believe grief and plague consumed him. In the dark, Fairbanks may preach the truth to stone."
  wc_balnazzar_story.1014.a:0 "Seal the chamber. Let the dead accuse the stones."

  wc_balnazzar_story.1008.title:0 "Stratholme Falls"
 wc_balnazzar_story.1008.desc:0 "The report from Stratholme bears my seal. Our guards hold the gates, and the scarlet banners can be seen above the walls.\n\nI read the list of stores taken and officers appointed. Possession is only the beginning. What the city becomes will depend on the orders I send next."
  wc_balnazzar_story.1008.a:0 "Let it burn cleaner, in time."

  wc_balnazzar_story.1009.title:0 "The Ashes Made Whole"
 wc_balnazzar_story.1009.desc:0 "The reports agree at last. Across the districts marked on my map, our officers hold authority and our creed is observed. I check the names beneath each seal before setting the papers aside.\n\nThe Crusade has more than scattered halls now. It has places to gather supplies, train recruits, and receive those still searching for protection. I call for fresh orders."
  wc_balnazzar_story.1009.a:0 "Let them come."

  wc_balnazzar_story.2000.title:0 "The Mask Comes Off"
  wc_balnazzar_story.2000.desc:0 "Too many eyes linger on this face. Too many questions follow when I leave a room. The disguise has ceased to protect me, and a useless mask is only a weakness.\n\nSaidan Dathrohan is already dead. Tonight, the lie dies with him. Those gathered in [ROOT.Char.GetCapitalLocation.GetTitle.GetBaseNameNoTier] will see what ruled them, then rise to serve it."
  wc_balnazzar_story.2000.desc_later_vessel:0 "They have begun to watch me. A servant stopped talking when I entered the hall, and two riders left [ROOT.Char.GetCapitalLocation.GetTitle.GetBaseNameNoTier] without my leave. This body's name no longer protects me.\n\nI will not flee in borrowed flesh. Before dawn, this household will meet Balnazzar. The dead worth keeping will rise again."
  wc_balnazzar_story.2000.a:0 "Let the Risen claim what is mine."
  the_risen:0 "The Risen"

  wc_balnazzar_story.2001.title:0 "The Risen"
  wc_balnazzar_story.2001.desc:0 "Below me, the badges of the old order hang from bodies that no longer breathe. The fallen stand again, waiting for one command.\n\n[ROOT.Char.GetCapitalLocation.GetTitle.GetBaseNameNoTier] is the first stronghold of the Risen. The dead gathered here retain their training and their knowledge of the roads. Whatever loyalties survived death will not survive me."
  wc_balnazzar_story.2001.a:0 "Rise, and serve."
  wc_balnazzar_story.2001.a_tooltip:0 "Balnazzar now rules the independent Risen with a raised host"
 wc_balnazzar_story.1001.desc_staged:0 "Varimathras struck, and I fell as we intended. The witnesses left with a death to report. Let them repeat it. I have no use for my own name tonight.\n\nDathrohan is alone among Stratholme's ruins when I find him. Recognition crosses his face; his hand rises to call upon the Light. I seize him before the prayer is finished.\n\nHis guards are waiting farther down the street. They straighten at the sight of their commander. In Dathrohan's voice, I order them onward."
 wc_balnazzar_story.1001.desc_sylvanas:0 "Sylvanas holds Lordaeron. Her possession of the city settles nothing beyond its walls, but I will gain little by contesting it openly. The Silver Hand still trusts Saidan Dathrohan. That trust is worth taking.\n\nI find him alone among Stratholme's ruins. He recognizes me and reaches for the Light. I catch his wrist before he can finish the gesture.\n\nWhen his guards call out, Dathrohan answers them. By the time they draw near, there is nothing left to see."
 wc_balnazzar_story.1001.desc_unavailable:0 "The reports bring no opening. Dathrohan is beyond my reach, and the authority I meant to steal with his face cannot be taken this way.\n\nI set his name aside. This design has reached its end."
 wc_balnazzar_story.1002.desc_no_renault:0 "The guards admit me without a question. Dathrohan's seal opens the dispatch box, and his signature sends the first messenger on his way. I pause over each name until the borrowed memories settle.\n\nAlexandros remains the obstacle. Renault is no longer available to draw him out, but orders still pass through these hands. I will have to arrange the killing through other agents."
 wc_balnazzar_story.1002.desc_alexandros_dead:0 "Dathrohan's seal is warm in my hand when the dispatches arrive. Alexandros has already fallen. The struggle I expected to begin has left a vacancy instead.\n\nI read the surviving officers' names twice. Authority will need a public voice and someone willing to stand beside it. Until that support is within reach, Saidan will attend to his duties."
 wc_balnazzar_story.1003.desc_no_renault:0 "An officer pushes the map toward Alexandros. Even those who dispute his orders wait for him to settle the argument. I listen with Dathrohan's patient expression and note the roads they still trust.\n\nThere will be no son to lure Alexandros away. Another agent must find the opening. Kel'Thuzad may still offer counsel worth its price; a lich need not hold the knife to help a murder."
 wc_balnazzar_story.1004.desc_no_renault:0 "I lay the reports before Kel'Thuzad. Renault can no longer serve as my instrument; whatever opening his jealousy offered has closed.\n\nThe lich draws one report closer. He can still advise the plot against Alexandros, but wants a debt in return. I will need other hands to carry out the killing. The fate of the body and blade is no longer ours to settle here."
 wc_balnazzar_story.1004.desc_no_kelthuzad:0 "No answer comes from Kel'Thuzad. The lich is gone, and the arrangements I meant to make with him are useless.\n\nI burn the message. Whatever remains to be done must be done without his counsel."
 wc_balnazzar_story.1004.desc_alexandros_dead:0 "News of Alexandros's fall has reached the crypt before me. Kel'Thuzad leaves the reports untouched. There is no living target left for our bargain.\n\nYet the message I sent may still carry a price. I must settle what I promised, then turn to the officers who remain."
 wc_balnazzar_story.1005.desc_no_renault:0 "I have prepared words for a man who can no longer act upon them. Renault is gone from this design; the familiar wound in his pride is of no further use.\n\nAlexandros still lives. I put away the family reports and call for those who know his movements. Another hand will have to strike."
 wc_balnazzar_story.1007.desc_both:0 "Isillien studies the scarlet cloth laid across the table. James Abbendis asks who will carry it. With Alexandros fallen, neither question can be left unanswered for long.\n\nI give them Dathrohan's assurance that the war will continue. Isillien can give that promise the force of a creed; Abbendis can make soldiers stand behind it. I draw the cloth toward me and call for the surviving officers."
 wc_balnazzar_story.1007.desc_isillien:0 "Isillien remains within reach. With Alexandros fallen and Abbendis unable to stand beside us, his voice is the one I need beside Dathrohan's.\n\nI show him the scarlet banner. The order needs a creed hard enough to survive this war, I tell him. He studies it while I wait. If he lends his authority to mine, the officers will hear more than one man demanding obedience."
 wc_balnazzar_story.1007.desc_abbendis:0 "James Abbendis remains within reach. Isillien cannot lend us his voice, and Alexandros has fallen. I need the weight Abbendis's name carries among the soldiers.\n\nI unfold the scarlet banner before him. There must still be an order worth serving, I say in Dathrohan's voice. Abbendis reaches for the cloth. I let him examine it before calling the officers in."
 wc_balnazzar_story.1007.desc_wait:0 "The scarlet banners remain folded. I cannot secure the takeover now; issuing the proclamation would only expose how little stands behind it.\n\nDathrohan still has duties to perform. I send the messengers away and return to them."
 wc_balnazzar_story.1007.desc_parricide:0 "\n\nRenault struck his father at my urging. Whatever banner replaces the silver one, that deed remains. I cannot be certain who else knows."
 wc_balnazzar_story.1007.desc_renault_dead:0 "\n\nRenault is dead now. He can neither serve me nor answer an accusation. Anyone who learned what happened may still speak."
 wc_balnazzar_story.1002.desc_no_darion:0 "The dispatches call me Saidan. I answer them in his hand, pausing only when a familiar name stirs a memory that is not mine.\n\nAlexandros still commands the Order. Darion is dead, yet Renault remains in his father's shadow. Grief has not made that family any less vulnerable to a patient listener."
 wc_balnazzar_story.1005.desc_no_darion:0 "Renault watches his father across the council table. Darion is dead, but his absence has not brought the surviving son the regard he craves.\n\nI ask Renault what command Alexandros has entrusted to him. He answers too quickly. I let the silence that follows do its work. There are other ways to draw a father out than a lie about his dead son."
 wc_balnazzar_story.1010.desc_no_darion:0 "Renault brings a different lure: a report of soldiers cut off near Stratholme. No tale of Darion's capture could serve us now.\n\nHe rehearses the names and the road they supposedly took. I make him repeat the account until it sounds like an urgent duty rather than an invitation."
 wc_balnazzar_story.1010.desc_no_fairbanks:0 "Renault comes after midnight with the lie he means to tell his father. Darion, he will say, has been taken near Stratholme.\n\nFairbanks cannot accompany Alexandros this time. I still make Renault account for the escort. One absent priest does not leave the road unguarded."
 wc_balnazzar_story.1011.desc_no_fairbanks:0 "Renault sends word that Alexandros has taken the road toward Stratholme. Fairbanks is not with him.\n\nI fold the message before anyone else can read it. Renault has his opening now. Whether he keeps his nerve will decide the rest."
 wc_balnazzar_story.1006.desc_no_fairbanks:0 "Renault's report arrives without the complication I had feared. Fairbanks was not beside Alexandros when the fighting began. The escort scattered, the father tired, and the son found his moment.\n\nHe struck with the Ashbringer. I read that line twice, then put the report to the flame. Renault has given me something far more lasting than an oath."
 wc_balnazzar_story.1006.desc_no_blade:0 "Renault has struck his father down. His account is hurried and full of excuses for everything that happened before the killing. On the deed itself, he is quite clear.\n\nNo Ashbringer was taken from Alexandros. Whatever has become of the famous blade, it played no part in this betrayal. Renault's guilt will have to serve me without it."
