 union_dragon_forces_features: "$UN_COMMON_UNION_FEATURES$$UN_COMMON_UNION_GRIMM$$EFFECT_LIST_BULLET$Во фракцию с более высокой вероятностью вступят правители с #E драконьим#! наследием\n$EFFECT_LIST_BULLET$Во фракцию с более высокой вероятноостью вступят правители, исповедующие [GetReligionByKey('draconism_religion').GetAdjective]"
