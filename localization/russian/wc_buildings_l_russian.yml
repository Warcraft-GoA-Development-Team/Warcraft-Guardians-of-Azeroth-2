 building_type_shado_pan_monastery_01: "Монастырь Шадо-Пан"
 building_type_shado_pan_monastery_01_desc: "Это горное убежище служит домом и тренировочной базой для таинственной Шадо-Пан, пандаренской фракции, призванной защищать Пандарию."
 building_shado_pan_monastery_01: "Монастырь Шадо-Пан"
