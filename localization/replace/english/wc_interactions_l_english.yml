l_english:
  char_interaction.0160.a:1 "[ROOT.Char.Custom2('WCFarewellLoc', recipient)], [recipient.GetFirstNameNoTooltip]..."
  bp1_yearly.4040.desc.dead:0 "Oh, my dear [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('kindly_grandmother'))], with you gone the endless plates of [ROOT.Char.Custom('FavoriteTreatDemand')] will stop, but the relief is a bittersweet feeling — I'd much rather have had you here by my side than gone forever.\n\n[ROOT.Char.Custom2('WCFarewellLoc', recipient)], [kindly_grandmother.GetFirstName], may you rest peacefully."
  ep3_laamps_provisions.1050.a: "[ROOT.Char.Custom2('WCFarewellLoc', ROOT.Char)], friend."
  ep3_laamps_provisions.1025.a: "[ROOT.Char.Custom2('WCFarewellLoc', ROOT.Char)]."
  ep3_laamps.7002.desc: "[siward.GetFirstName], my loyal [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('siward'))], approaches me with something of a glint in [siward.GetHerHis] eye.\n\n"I've come to say goodbye." [siward.GetSheHe|U] cuts off my forthcoming protests with a raised hand. "I've made my decision, there's no stopping me." [siward.GetSheHe|U] gestures for me to sit.\n\n"There are whispers coming from Constantinople. [emperor.GetTitledFirstName] offers safe passage to any refugees from [king_england.GetTitledFirstNamePossessive] wrath, and a chance to rebuild." [siward.GetFirstNameNoTooltip] slaps [siward.GetHerHis] thighs and looks around.\n\n"I'll miss this place. [ROOT.Char.Custom2('WCFarewellLoc', siward)], my [ROOT.Char.Custom('SisterBrother')].""
  pet_animal.3012.a: "[ROOT.Char.Custom2('WCFarewellLoc', ROOT.Char)], [ROOT.Char.Custom('EagleStoryName')]."
  single_combat.0041.a:0 "[ROOT.Char.Custom2('WCFarewellLoc', sc_loser)], [sc_loser.GetTitledFirstNameNoTooltip]."
  EVENT_SIGNED:0 "[ROOT.Char.Custom2('WCFarewellLoc', ROOT.Char)],"



  

