l_russian:
 give_scarlet_mark_interaction: "Дать Алый Знак"
 give_scarlet_mark_interaction_desc: "Гнусные деяния [recipient.GetFirstNamePossessive] отвратительны для [actor.GetFaith.GetAdjective] [faith|E]. [recipient.GetSheHe|U] будет отмечен как еретик, пока [recipient.GetSheHe] не покается за [recipient.GetHerHis] злые поступки."
 give_scarlet_mark_interaction_desc.tt: "[recipient.GetShortUIName] отмечен Инквизицией!"
 scarlet_mark_message: "Инквизиция отметила вас!"
 scarlet_mark_other_message: "Отмечен как еретик"
 other_scarlet_mark_message: "[target_character.GetShortUIName] был отмечен как еретик Инквизицией"
  
 lift_scarlet_mark_interaction: "Снять Алый Знак"
 lift_scarlet_mark_interaction_desc: "[recipient.GetFirstName] достаточно покаялся за [recipient.GetHerHis] проступки и будет принят обратно в [actor.GetFaith.GetAdjective] [faith|E]."
 lift_scarlet_mark_interaction_desc.tt: "[recipient.GetFirstName] принят обратно в [actor.GetFaithGetName]"
 lift_scarlet_marked_interaction_desc.tt: "Алый Знак снят"
  
 request_scarlet_mark_interaction: "Попросить Алый Знак"
 recipient_secondary_request_scarlet_mark_interaction: "Цель"
 request_scarlet_mark_interaction_extra_icon: "$hook_extra_icon$"
 request_scarlet_mark_interaction_desc: "Гнусная нечестивость [secondary_recipient.GetTitledFirstName] не наказывалась слишком долго. Я подам прошение [recipient.GetTitledFirstName], чтобы тот отметил [secondary_recipient.GetHerHim] как еретика от [actor.GetFaith.GetAdjective] [faith|E] и надеюсь, что [recipient.GetTitledFirstName] увидит разум."
 request_scarlet_mark_interaction_message: "[requesting_character.GetShortUIName|U] как-то убедил [religious_head.GetShortUIName] отметить меня как еретика!"
  
 surrender_to_the_inquisition_interaction: "Сдаться Инквизиции"
 surrender_to_the_inquisition_interaction_desc: "Я уже слишком долго несу бремя своих преступлений. Теперь я готов попросить Инквизицию, чтобы узнать, достоин ли я искупления."
  
 send_to_inquisition_interaction: "Отправить в Инквизицию"
 send_to_inquisition_interaction_desc: "Гнить в моей тюрьме недостаточно. Инквизиция должна очистить [recipient.GetShortUIName] от [recipient.GetHersHis] грехов и показать [recipient.GetHerHim], что значит каяться."
 sent_to_inquisition_tt: "[recipient.GetName] покинет мою тюрьму и попадет под стражу [inquisitor.GetShortUIName]."
  
 RELIGIOUS_HEAD_REQUEST_SCARLET_MARK: "[secondary_recipient.GetShortUIName|U] перешел все границы своими последними поступками. Я прошу вас, пожалуйста, отметить [secondary_recipient.GetHerHim], чтобы мир знал, что мы осуждаем [secondary_recipient.GetHerHis] нечестие."
 RELIGIOUS_HEAD_GIVE_SCARLET_MARK: "[secondary_recipient.GetShortUIName|U] будет отмечен как еретик. Пусть [secondary_recipient.GetHerHis] злые поступки станут известны всем."
 RELIGIOUS_HEAD_LIFT_SCARLET_MARK: "[secondary_recipient.GetShortUIName|U] покаялся за [secondary_recipient.GetHerHis] проступки. [secondary_recipient.GetSheHe|U] будет принят обратно в [actor.GetFaith.GetAdjective] [faith|E]."
 wc_change_elemental_goodwill_interaction: "Изменить доброжелательность элементалей"
 wc_change_elemental_goodwill_interaction_desc: "тест"
