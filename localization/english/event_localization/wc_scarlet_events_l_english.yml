l_english:
 SCARL.000_TITLE:1 "Those that Remain"
 SCARL.000_DESC:0 "Once a beacon of the Light, the [GetTitleByKey('k_lordaeron').GetName] is now little more than a corpse-ridden ruin, a feast for the damned. Those of us who yet live are few, scattered and hunted by the Scourge and worse yet — traitors who once called themselves our brethren who have willingly submitted themselves into the armies of the damned.\n\n[GetTitleByKey('k_order_of_the_silver_hand').GetName] stands on the edge of ruin, its greatest champions slain or turned against us.\n\n[scoped_betrayer.GetName] has abandoned our whole race, and now whispers tell of others within our ranks who would rather cower or consort with the enemy than stand and fight.\n\nBut I will not falter.\n\nIf there are still righteous warriors left in this land, I will find them. We will rise from the ashes of Lordaeron, not as victims, but as those who would purge the plague that stole our home. The [GetTrait('lich_king').GetName(GetNullCharacter)] will know that this land belongs to us."
 SCARL.000_OPT_A:0 "I will send out emissaries to those loyal to the throne."
 SCARL.000_OPT_B:0 "I cannot afford to chase ghosts."
 SCARL.000_OPT_tt:0 "You choose to stand alone."

 SCARL.001_TITLE:1 "Those that Remain"
 SCARL.001_DESC:0 "To the last true knights of Lordaeron.\nLordaeron has fallen, but the Light still burns in us. The traitors and the damned would see our kingdom lost forever.\nI refuse to yield.\nIf you still have the will to fight, stand with the last of the Silver Hand. Together, we will cleanse this land of its plague and take back what is ours."
 SCARL.001_OPT_A:0 "For Lordaeron! We stand and fight!"
 SCARL.001_OPT_A_TT:0 "You will join a meeting with the Silver Hand to discuss the fate of Lordaeron."
 SCARL.001_OPT_B:0 "This war is already lost."
 SCARL.001_OPT_B_TT:0 "You ignore the call."

 SCARL.002_TITLE:1 "Those that Remain"
 SCARL.002_DESC:0 "Your call has been heard. The Light has not abandoned us, nor will we abandon you. Lordaeron may be in ruins, but our duty still remains until our death. We will gather our forces and attend your meeting.\nFor Lordaeron, and for the Light."
 SCARL.002_OPT_A:0 "Excellent."

 SCARL.003_TITLE:1 "Those that Remain"
 SCARL.003_DESC:0 "Lordaeron is lost. The dead rule the streets, and the Light's favour in us has faded.\nI will not march my people tom their deaths for a kingdom that no longer exists. We must look to other paths for our endurance.\nDo not seek us again."
 SCARL.003_OPT_A:0 "Cowards."

 SCARL.004_TITLE:1 "Those that Remain"
 SCARL.004_DESC:0 "You walk into the meeting room and quickly realise that the dimly lit hall is thick with tension. The remnants of the [GetTitleByKey('k_order_of_the_silver_hand').GetName] have gathered and what remains of their order has begun to splinter before your very eyes.\n\nOn one side of the room, knights in bloodstained armour speak with righteous fury - their voices sharp with anger. #italic "We must cleanse Lordaeron! Purge the infected, root out the traitors - no mercy! no hesitation! The Light demands it! #!" Their eyes burn with zeal, their faith having now twisted into something new and unyielding.\n\nOpposite to them stands a weary but resolute group, their conviction and faith in the light being tempered by their compassion. #italic "The Light does not command cruelty." #! They argue in response. #italic "The innocent still suffer. If we abandon them, we are no better than the monsters we fight." #!\n\nThe divide is clear.\n\nOne path leads to war against anything that may threaten purity - no matter the cost.\n\nThe other seeks to protect what little good remains, even in the face of darkness.\n\nAll who have gathered here must make their choice."
 SCARL.004_OPT_A:0 "The Light must be defended. No matter the cost."
 SCARL.004_OPT_B:0 "We must not let the Light become a weapon of tyranny."
 SCARL.004_OPT_C:0 "I stand with the Lightbringer and his resolve."
 SCARL.004_OPT_C_tt:0 "Remain true to the Light. \n$BULLET$ You form an Alliance with [GetTitleByKey('k_order_of_the_silver_hand').GetName]."

 scarlet_uprising:0 "Scarlet Zealots"
 argent_uprising:0 "Argent Regiments"

 SCARL.006_TITLE:1 "Flames of the Remaining"
 SCARL.006_DESC:0 "No longer are we standing alone against the Scourge. The neighbouring #italic Kings #!hide behind their walls instead of standing with the fellows of their own kind.\n\nOur leaders with the fires of zeal and vengeance have risen up! They have gathered the righteous and have formed a crusade against the scourge and those who would oppose us.\n\n[scarlet_leader.GetName] has been chosen to lead us to victory! The [GetTitleByKey('k_lordaeron').GetName] will be born anew, when the Scourge and the Damned are burnt to ashes."
 SCARL.006_OPT_A:0 "The Saviours are Here!"

 SCARL.007_TITLE:1 "Wrath of the Scarlets"
 SCARL.007_DESC:0 "How many more of our brethren and our kind die or sacrificed before the Scourge is gone for good?\n\nHow long are we supposed to only dream about those peaceful times gone by?\n\nWe must take our fate in our own hands. We must cut the head of the snake. We must go to the darkest and icy depths of Northrend to slay the [GetTrait('lich_king').GetName(GetNullCharacter)] itself."
 SCARL.007_OPT_A:0 "Send the word out for volunteers..."
 SCARL.007_OPT_A_tt:0 "\n$BULLET$ You send a message of your expedition to fellow Scarlets"

 SCARL.008_TITLE:1 "I want YOU for Scarlet Army"
 SCARL.008_DESC:0 "To the brave warriors loyal to the scarlet cause,\nHow has the progress against removing the scourge from [GetTitleByKey('k_lordaeron').GetName] going? Not very well I presume?\nThey are numerous and unending in all the senses... aren't they?\nJoin me. Join my expedition to slay the [GetTrait('lich_king').GetName(GetNullCharacter)]! Our only hope in winning for Humanity lies in slaying the [GetTrait('lich_king').GetName(GetNullCharacter)]!"
 SCARL.008_OPT_A:0 "This is madness!"
 SCARL.008_OPT_B:0 "You are right... this is the only solution!"

 SCARL.009_TITLE:1 "Foolish Endeavour"
 SCARL.009_DESC:0 "To [scarlet_onslaught_leader.GetName],\nYou are either a fool or a bumbling idiot.\nGoing to the most icy hells where only wild creatures and the Scourge thrive? Where even the Light cannot give you enough warmth and hope?\nI wish you the best on your #italic "brave expedition" #!. I hope the Light blesses you nonetheless for your bravery.\nDo not concern us again."
 SCARL.009_OPT_A:0 "Coward!"

 SCARL.010_TITLE:1 "Brave Warrior"
 SCARL.010_DESC:0 "To [scarlet_onslaught_leader.GetName],\nYou spoke my mind! The skirmishes across [GetTitleByKey('k_lordaeron').GetName] have, by far, done little to no progress...\nWe saw no other choice but to flee the kingdom as well but we are now ashamed of our behaviour!\nWe will atone for even letting such sinful thoughts flow inside us. We will join your expedition and crush the Scourge with our combined strenghts!"
 SCARL.010_OPT_A:0 "Excellent..."

 SCARL.011_TITLE:1 "Beginning of the End"
 SCARL.011_DESC:0 "We have finally landed in [GetTitleByKey('new_hearthglen').GetName]. Very close to the [GetTrait('lich_king').GetName(GetNullCharacter)]'s lair but not within their grasp.\n\nFrom here we can launch our attacks on the Scourge and maybe even catch them by surprise?\n\nBut first, we will need to rid our new settlement from these... #italic animals #!that surround our new colony."
 SCARL.011_OPT_A:0 "This will serve as our new base of command."

 scarlet_onslaught_troops:0 "Scarlet Armada"

 SCARL.012_TITLE:1 "Beginning of the End"
 SCARL.012_DESC:0 "[GetTitleByKey('new_hearthglen').GetName] is finally liberated from the filth that infected this place. We shall wipe the Scourge out from the face of Azeroth the same way!\n\nShall we keep expanding our base and secure more land and grow stronger? Or do we have enough to risk it against the [GetTrait('lich_king').GetName(GetNullCharacter)]?"
 SCARL.012_OPT_A:0 "The end of the [GetTrait('lich_king').GetName(GetNullCharacter)] is nigh!"

 SCARL.013_TITLE:1 "Our Pride, Our Hearthglen"
 SCARL.013_DESC:0 "Those with the burning Light inside their heart, will no longer feel the cold and darkness of Northrend. We have raised our own Hearthglen, far away from our old homes. It gives us pride, it gives us joy, it gives us warmth.\n\nWith our Beacon of Light right behind us, we shall be guided against the Scourge and the heathens! Fellow [GetTrait('creature_human').GetName(GetNullCharacter)]'s lost in the cold shall return to us by the guidance of the Light!"
 SCARL.013_OPT_A:0 "We might even surpass those in Lordaeron..."
