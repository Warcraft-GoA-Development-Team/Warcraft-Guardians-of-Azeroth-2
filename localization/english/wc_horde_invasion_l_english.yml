 #################################
 # Conquests of the Horde
 #################################
 # First War
 ### Northshire ###
 wc_horde_invasion.9000.title:0 "The Fall of $c_northshire$"
 wc_horde_invasion.northshire.9000.title:0 "The Last Stand of $c_northshire$"
 wc_horde_invasion.northshire.9000.desc:0 "The fall of $c_northshire$ is a nightmare come to life. The lands burn around us, and our people are mercilessly slaughtered. We last few defenders have retreated to the abbey, our final sanctuary.\n\nThrough the barricaded doors, we hear the orcs' fury grow louder. They have uprooted one of the sacred [Glossary( 'Holyoak', 'HOLYOAK_GLOSS' )] trees from our gardens, transforming it into a tool of destruction. Each impact against the doors sends a wave of dread through our hearts. Our prayers for salvation are drowned out by the cacophony of battle - the orcs' battle cries, the splintering wood, the screams of the doomed.\n\nAs the doors begin to splinter and crack, the end nears. We brace ourselves, knowing that the flood of rage and steel is about to break through, and with it, the last light of $c_northshire$ will be extinguished."
 wc_horde_invasion.9000.desc:0 "As the defenses of $c_northshire$ and its surrounding lands fall, our warriors descend into a frenzy of destruction. The breakthrough has unleashed an orgy of violence; every building is pillaged, every [GetTrait('creature_human').GetName(GetNullCharacter)] cut down in their tracks.\n\nThe final stand of the humans is at the abbey. As our warriors surround it, we uproot an ancient tree from the gardens to use as a battering ram. Each thunderous crash against the abbey's doors mingles the roars of our war cries with the terrified screams of those inside. The timber groans, splinters flying, as the last barrier to our wrath buckles and bends.\n\nJust as the door begins to give way, poised to unleash our horde into their last haven, we prepare to extinguish the final flicker of resistance in $c_northshire$."
 wc_horde_invasion.9000.a:0 "Lok'tar Ogar, for the Horde!"
 wc_horde_invasion.9000.b:0 "For $c_northshire$! For [GetTitleByKey('k_stormwind').GetNameNoTier]!"
 wc_horde_invasion.9000.tooltip.b:0 "Faced with the invader, we resist! Let us fight with honor for our land, for $c_northshire$! For [GetTitleByKey('k_stormwind').GetNameNoTier]!"
 wc_horde_invasion.9001.title:0 "The Sack of $c_northshire$"
 wc_horde_invasion.9001.desc:0 "Now that $c_northshire$ is under our control, bands of orcs spread through the surrounding lands, leaving behind smoking ruins. Homes are looted and burned, fields destroyed, and no inhabitant is spared from their bloodthirsty rage. Faced with this, I am confronted with a choice:\n\nOn the one hand, I can let my warriors' thirst for violence run free. Northshire would be devastated, and its riches would fuel the machine of our conquests, a brutal testament to the futility of opposing the Horde.\nAlternatively, I could order my warriors to cease their destruction. Executing those who defy this order would be necessary to maintain discipline. This would allow for the preservation and repurposing of key structures for the use of the Horde, transforming the remains of $c_northshire$ into a strategic foothold for our future campaigns. The decision rests with me..."
 wc_horde_invasion.9001.a:0 "Let them."
 wc_horde_invasion.9001.tooltip.a:0 "Bands of orcs will spread into the neighboring counties and pillage everything in their path."
 wc_horde_invasion.9001.b:0 "Stop it, you idiots!"
 wc_horde_invasion.9001.tooltip.b:0 "We can't let them destroy the infrastructure, execute the recalcitrants to make an example."

 wc_horde_invasion.2203.desc:0 "I survived... despite it all... I survived...\n\nI look back nervously to see if I have anyone was following me. I keep walking forward and don't stop for a good good while... the Voice that manipulated me... and that damn Orc...\n\nI finally take a break after what feels like hours of walking and being paranoid. I take a deep breath and thank my fate that I even managed to be here... I will have to start anew, and I won't make those same mistakes again. Never, ever again." 

