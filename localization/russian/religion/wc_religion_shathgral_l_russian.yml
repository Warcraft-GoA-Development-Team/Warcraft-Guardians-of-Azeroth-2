 xavist: "Ксавистск"
 xavist_adj: "Ксавизм"
 xavist_adherent: "Ксавист"
 xavist_adherent_plural: "Ксависты"
 xavist_desc: "Ксавий был одним из самых могущественных чародеев Высокорожденных. Всё изменилось, когда Саргерас превратил его в первого сатира в наказание за служение. Вскоре за ним последовали другие. Позже он попытался извратить Изумрудный Сон, обратив его в Изумрудный Кошмар, при поддержке Н'зота."
