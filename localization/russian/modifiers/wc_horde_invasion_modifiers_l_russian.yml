l_russian:
  ### Destruction caused by the Horde ### 
 recently_sacked_by_the_horde_modifier: "Недавний набег Орды"
 recently_sacked_by_the_horde_modifier_desc: "Это владение недавно подверглось разгрому со стороны Орды. Отряды орков всё ещё бродят по округе, и потребуется время, чтобы восстановить порядок."
  
 brought_discipline_horde_modifier: "Железная дисциплина"
 brought_discipline_horde_modifier_desc: "Чтобы восстановить порядок в рядах, были показательно казнены несколько десятков вояк."
  
 path_to_glory_modifier: "Путь к славе"
 path_to_glory_modifier_desc: "Этот персонаж гордится своими победами в битвах и движим великими амбициями."
  
 horde_conqueror_modifier: "Завоеватель новых земель"
 horde_conqueror_modifier_desc: "Под предводительством этого вождя Орда завоёвывает новые земли, заливая их кровью во имя будущего своего народа."
  
 blackhand_status_quo_modifier: "Религиозный статус-кво"
 blackhand_status_quo_modifier_desc: "Этот персонаж не преследует исконные верования в Орде, сосредотачиваясь на боевой подготовке."
 blackhand_tolerance_modifier: "Религиозная терпимость"
 blackhand_tolerance_modifier_desc: "Этот персонаж обретает дипломатическую и интеллектуальную широту, поощряя терпимость к шаманистским верованиям."
  
 medivh_magic_malus_modifier: "Магическое истощение"
 medivh_magic_malus_modifier_desc: "Этот персонаж изнурён после изнурительного магического свершения."
 medivh_vigilance_modifier: "Напряжённая бдительность"
 medivh_vigilance_modifier_desc: "Этот персонаж тратит силы, чтобы сохранять бдительность, несмотря на магическое истощение."
 medivh_drained_modifier: "Нервное истощение"
 medivh_drained_modifier_desc: "Этот персонаж страдает от последствий интенсивного и навязчивого чтения мыслей, не способного сосредоточиться."
  
 garonas_intelligence_modifier: "Сметливость Гароны"
 garonas_intelligence_modifier_desc: "У этого персонажа под контролем разума умелый шпион, разведчик и убийца; это дарует ему дополнительную осведомлённость и хитрость."
