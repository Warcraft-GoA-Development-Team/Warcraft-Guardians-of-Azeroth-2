 ae_finance_good_desc: "Эта угроза серьёзнее, чем мы думали. Нам стоит вложить ещё больше ресурсов и выделить больше людей."
 ae_finance_enormous_desc: "Эта болезнь представляет угрозу для нашей родины. Все мои воины должны следовать за мной, чтобы защитить наши семьи."
