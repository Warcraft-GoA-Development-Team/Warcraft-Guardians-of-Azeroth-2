 #Helyatrú-Group Faiths
 helyatru:0 "Helyatrú"
 helyatru_adj:0 "Helarjar"
 helyatru_adherent:0 "Helari"
 helyatru_adherent_plural:0 "Helarjar"
 helyatru_desc:0 "Helya, the matriarch of Helheim, which is the underworld of the [GetTrait('creature_vrykul').GetName( GetNullCharacter )] who have fallen and failed to ascended to the Halls of Valor, was a Watcher who assisted Odyn in imprisoning elementals into the Elemental Plane. When she rebelled against Odyn, she became the first spectral Val'kyr. She would later create a champion who would bear Odyns warswords of the Valajar, which Helya stole from Odyn. This champion would slay many so that their souls would serve in Helheim. She would also create the Helarjar, a holy order mocking Odyn's Valarjar. The Kvaldir of Helya would also be responsible for murdering the dishonorable and unworthy, taking them to Helheim."

 #Throsatrú-Group Faiths
 throsatru:0 "Throsatrú"
 throsatru_adj:0 "Throsarjar"
 throsatru_adherent:0 "Throsari"
 throsatru_adherent_plural:0 "Throsarjar"
 throsatru_desc:0 "Many spirits of the fallen Drust have been banished into an offshoot plane within the Emerald Nightmare that they later named Thros, where they cultivated a potent form of death magic with bastardized druidic elements. This form of magic resulted from numerous attempts to bewitch the souls of fallen Drust into constructs to use against [GetTrait('creature_human').GetName(GetNullCharacter)] settlers. Following this, the Throsic form of necromancy prefers binding the souls of the dead into durable constructs, while the traditional form of corpse reanimation is rarer. Its influence towards the wildlife and the living is usually perpetuated by the local witch covens. The most loyal of Throsian witches can also ascend into Matrons, an incorporeal banshee-like creature, through a ritualistic act of slitting their own throat in ultimate devotion to their horrific masters."