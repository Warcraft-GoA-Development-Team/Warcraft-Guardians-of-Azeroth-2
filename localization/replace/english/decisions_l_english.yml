l_english:
 create_dar_al_islam_decision: "Establish the Dar al-Noor"
 create_dar_al_islam_decision_desc: "[GetReligionByKey('noor_religion').GetName] has long been a divided and fractured religion. Ever since the death of the great prophet, war and conflict have often reigned supreme when discontent spread among us. The time has come to unify all Noorist denominations under a common leadership."
 create_dar_al_islam_decision_tt: "Establish [GetTitleByKey('h_dar_al_islam').GetName] as your [primary_title|E]"
 create_dar_al_islam_decision_confirm: "$create_dar_al_islam_decision$"
 
 realm_controls_enough_islamic_counties_desc: "You control [EmptyScope.ScriptValue('dar_al_noor_religion_county_control_value')|V0%] of all [GetReligionByKey('noor_religion').GetAdjective] [counties|E]: [root_scope.MakeScope.ScriptValue('islam_required_county_number_value')|V0] #weak ([root_scope.MakeScope.ScriptValue('islam_controlled_county_number_value')|V0])#!"
 
 dar_al_islam_subjugation_expanded_desc: "The [house_heads|E] of your [house|E] gain permanent access to the #V Subjugation#! [casus_belli|E] against #EMP all#! [GetReligionByKey('noor_religion').GetAdjective] faiths"
 dar_al_islam_become_head_of_faith_desc: "You become the [head_of_faith|E] of all [GetReligionByKey('noor_religion').GetAdjective] [faiths|E] that does not consider [new_hegemon.GetFaith.GetName] [faith_hostile|E] or [faith_evil|E]"
 dar_al_islam_muslim_conversion_desc: "[GetReligionByKey('noor_religion').GetAdherentNamePlural] are more likely to accept conversion"
 dar_al_islam_faction_desc: "[GetReligionByKey('noor_religion').GetAdherentName] [vassals|E] #bold cannot#! create or join [dissolution_factions|E] against the [ruler|E] of [GetTitleByKey('h_dar_al_islam').GetName]"
 dar_al_islam_faction_block_desc: "As a [GetReligionByKey('noor_religion').GetAdherentName] you are unable to create or join this [faction|E] against the [ruler|E] of [GetTitleByKey('h_dar_al_islam').GetName]"
 ASK_FOR_CONVERSION_ACTOR_DAR_AL_ISLAM: "[actor.GetShortUIName|U] [CharHaveHas(actor)] the [GetTitleByKey('h_dar_al_islam').GetNameNoTier] [title|E] and [recipient.GetShortUIName|U] is a [GetReligionByKey('noor_religion').GetAdherentName]: $VALUE|=+0$"
