    building_type_sunwell_01:0 "The Sunwell"
    building_type_sunwell_01_desc:1 "A fountain of mystical power located within the Sunwell Plateau on the Isle of Quel'Danas. Its Elven creators rely on its energies for sustenance."
    building_sunwell_01:1 "The Sunwell"
    building_sunwell_01_desc:1 "The Sunwell has empowered the high elves for roughly seven thousand years. Its presence in their lives is akin to eating or breathing. In the Sunwell's light, Quel'Thalas has grown mighty, becoming a beacon of power in the Eastern Kingdoms."

    building_type_sunwell_corrupted_death:0 "Death Corrupted Sunwell"
    building_type_sunwell_corrupted_death_desc:1 "A fountain of mystical power located within the Sunwell Plateau on the Isle of Quel'Danas. This building was once used by the Elves for nourishment, but now stands as a vortex of dark energies."
    building_sunwell_corrupted_death:1 "Death Corrupted Sunwell"
    building_sunwell_corrupted_death_desc:1 "The Sunwell once empowered the high elves for roughly seven thousand years, and now it resonates a slow, sickly green hue over the landscape. Dark energy oozes from within the vortex."

