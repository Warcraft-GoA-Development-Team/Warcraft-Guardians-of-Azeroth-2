l_english:
 bandarion_keep_custom_name:0 "Bandarion Keep"
 bandarion_keep_custom_name_adj:0 "Bandarionese"
 forsaken_kingdom.0001.t:0 "Bandarion Keep"
 forsaken_kingdom.0001.desc.founded:1 "\n\nBefore the vigil is over, Danitha Morr comes before me. A paladin of the Silver Hand in life, raised in the fall of Lordaeron and freed with the Forsaken, she fought beside Leonid Barthalomew against the Scourge in the ruins of the capital and counted Garek a friend. She tells me the Light did not abandon her when she died, only bided its time. She asks to raise an order of the Light among the Forsaken, at Bandarion Keep, and to lead it.\n\nThey call themselves Tyr's Watch."
 forsaken_kingdom.0001.desc.rename_only:1 "\n\nNo one steps forward to keep his vigil. The keep stands, and the name will have to be enough."
 forsaken_kingdom.0001.a.founded:0 "Let the Watch keep his vigil."
 forsaken_kingdom.0001.a.rename_only:0 "Let the name stand."
 forsaken_kingdom.0002.t:0 "Tyr's Watch"
 forsaken_kingdom.0002.desc.light:1 "Word comes out of Tirisfal Glades that is hard to credit. Danitha Morr, a paladin of the Silver Hand who was raised in the fall of Lordaeron and freed with the Forsaken, has taken up the Light again and founded an order of it among the undead. Its seat is Bandarion Keep, named for Garek Bandarion, a captain of the Forsaken Deathguard.\n\nThey call themselves Tyr's Watch. Whether the Light truly answers the dead, or whether this is one more Forsaken deceit, no one who tells the story can say."
 forsaken_kingdom.0002.desc.forsaken:1 "Word spreads through Tirisfal Glades. Danitha Morr, once a paladin of the Silver Hand, has taken up the Light again and founded an order of it at Bandarion Keep, the keep named for Garek Bandarion, Captain of the Deathguard.\n\nThey call themselves Tyr's Watch. Some of us call it a betrayal of everything the Banshee Queen has built. Some of us have gone to the keep to see whether the Light will answer them too."
 forsaken_kingdom.0002.desc.other:1 "Word comes from Lordaeron. Among the Forsaken, a former paladin named Danitha Morr has founded an order of the Holy Light at a keep named for a fallen captain of their Deathguard, Garek Bandarion.\n\nThey call themselves Tyr's Watch. An order of the Light, made of the walking dead, is not a thing anyone expected to hear of."
 forsaken_kingdom.0002.a.light:0 "The Light finds its own."
 forsaken_kingdom.0002.a.forsaken:0 "We will see what the Light makes of them."
 forsaken_kingdom.0002.a.other:0 "The dead keeping a vigil. What next."
 forsaken_kingdom.0001.desc.opening.sacrifice:0 "Garek Bandarion, Captain of the Deathguard, called the Light down on himself atop Naxxramas and broke the necropolis to save the Undercity. There was no body to carry home; the Deathguard brought back his name and gave it to his keep. Autumnacre is Bandarion Keep now.\n\nSomething else came back with them: the story of a Forsaken the Light answered, aided and through him saved us all. Forsaken who have not prayed since they died are asking whether it might answer them too."
 forsaken_kingdom.0001.desc.opening.neutral:0 "Garek Bandarion, Captain of the Deathguard, is dead. His legendary sacrifice carried his story back to Autumnacre whose residents would not hear of the old name: from this day the keep is Bandarion Keep, and the Light will forever protect it."
 forsaken_kingdom.0001.desc.keeper:0 "\n\nEvin Schmidtt, who served in the Silver Hand beside her, asks to hold the keep itself for the order. He will be its keeper."
 forsaken_kingdom.0002.desc.keeper:0 "\n\nA second paladin of the old Silver Hand, Evin Schmidtt, holds the keep for them."
 forsaken_kingdom.0003.t:0 "The Light calls on us to protect the living"
 forsaken_kingdom.0003.desc.anya:0 "You will want it from someone who was there, so here it is.\n\nThe Undercity was threatened and Garek made the ultimate sacrifice. I put an arrow into everything that came near him until he reached the crystal at the top, and there he knelt. I have not prayed since Quel'Thalas burned, I thought the Light had forsaken us. Garek proved otherwise. The Light answered his desperate plea, answered him with every ounce of furor in his veins. He burned like a star and took the crystal with him. Naxxramas broke and fled.\n\nHe was the best of us, of that I have no doubt."
 forsaken_kingdom.0003.desc.deathguard:0 "The Deathguard bring word from the walls. Naxxramas is gone from the sky above the Undercity, and their captain with it.\n\nGarek Bandarion went up alone. Whatever he found at the top of the necropolis, the men below saw only the end of it: their captain kneeling before a crystal the size of a house, a light rising from him that no Forsaken should be able to call, and then fire, righteous and total, that took the crystal, the deck around it, and him. The necropolis broke away and fled north.\n\nNothing came down but ash. There is no body to bury."
 forsaken_kingdom.0003.a:0 "He saved us all."
