l_english:
 trogg_invasion.0001.t:1 "Gnomeregan discovered"
 trogg_invasion.0001.desc:0 "Our scouts quickly discovered the source of the strange noises: mechanical machines constantly working inside the city of Gnomeregan, the capital of the gnomish country of [GetTitleByKey('k_gnomeregan').GetName]. Their bodies look weak, so we should have no trouble destroying them." 
 trogg_invasion.0001.option:0 "Crush them like a bugs!"
 trogg_invasion.0002.t:1 "Gnomeregan Under Attack!"
 trogg_invasion.0002.desc:0 "Gnomeregan has come under attack by a never-before-seen enemy. Mysterious creatures have emerged from underground tunnels, completely bypassing our security. They are large and brutish, but pure strength will never surpass gnomish intellect."
 trogg_invasion.0002.option:0 "Prepare the defenses!"
 trogg_invasion.0003.t:1 "We Have Defeated the Invaders"
 trogg_invasion.0003.desc:0 "After a long and bloody war, we were able to defeat the invaders who were threatening the very existence of Gnomeregan. This victory will bring us peace for a long time."
 trogg_invasion.0003.option:0 "Finally, peace."
 trogg_invasion.0004.t:1 "Thermaplugg's Betrayal"
 trogg_invasion.0004.desc:0 "Mekgineer Thermaplugg's plan turned out to be a disaster. Almost 80% of the entire gnomish race disappeared, and many of those who survived became lepers. The reason this plan failed was Thermaplugg himself. He was always jealous of High Tinker Gelbin's position and recognition. Now, with all of Gnomeregan covered in toxic gases and radiation, he has declared himself the sole leader of Gnomeregan."
 trogg_invasion.0004.option:0 "We should never have trusted him"
 trogg_invasion.0004.optionb:0 "Maybe his way of ruling is better..."
 trogg_invasion.0005.t:1 "Thermaplugg's offer"
 trogg_invasion.0005.desc:0 "The forces of the troggs may be too much for us to handle. Fortunately, Mekgineer Thermaplugg has proposed a plan that might be our only chance of surviving. According to him, we should leak radiation into Gnomeregan, and the contamination should be able to deal with the troggs. It may have severe consequences for us, but it is better than total defeat."
 trogg_invasion.0005.option:0 "It might help us"
 trogg_invasion.0005.optionb:0 "We can't trust him"
 trogg_invasion.0006.t:1 "Strange gas in Gnomeregan"
 trogg_invasion.0006.desc:0 "We were so close to defeating those damned gnomes, but as we began capturing their capital, strange gas started to spread through the city of Gnomeregan. It quickly wiped out most of our army. Fortunately, it seems the gnomes did not expect it to be so deadly, and many of their own defenders perished as well."
 trogg_invasion.0006.option:0 "Cursed gnomes and their technology!"
 trogg_invasion.0007.t:1 "Gnomeregan Asks Us for Help"
 trogg_invasion.0007.desc:0 "The gnomes have suffered greatly from the trogg invasion and its aftermath. Even the areas that were not fully taken over by leper gnomes remain in a very poor state. We have been asked to help them reclaim the surroundings of Gnomeregan."
 trogg_invasion.0007.option:0 "We must help!"
 trogg_invasion.0007.optionb:0 "We can't spare anything right now."
 trogg_invasion.0008.t:1 "Gnomeregan was retaken"
 trogg_invasion.0008.desc:0 "After a long time of struggle, we have finally managed to retake Gnomeregan from the leper gnomes and Sicco. The city is in very poor condition and will require a lot of work to restore it to its former glory. This will bring gnomes into a new era of prosperity and discoveries."
 trogg_invasion.0008.option:0 "Finally, Gnomeregan is safe."
 trogg_invasion.0009.t:1 "Fate of a traitor"
 trogg_invasion.0009.desc:0 "After we retook Gnomeregan, we captured the leader of the leper gnomes. He is a traitor to our people, and keeping him alive would be a disgrace to all gnomes. What should we do with him?"
 trogg_invasion.0009.option:0 "Execute him immediately!"
 trogg_invasion.0009.optionb:0 "We should release him."
 trogg_invasion.0009.optionc:0 "Let him rot in prison..."