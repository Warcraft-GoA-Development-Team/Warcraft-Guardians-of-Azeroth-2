##################################################################
# 2000 - 2999 Elemental Fire Only
##################################################################
elemental_magic_lifestyle.2011.t:0 "Playing With Fire"
elemental_magic_lifestyle.2011.desc:0 "Having noted fires burning in the fields in a remote part of my domain, I have set out on a mounted control with several retainers. As we approach the burning fields, I can see that the fires rage with an unnatural brightness and intensity. I feel the whisper of the elements on the wind; the hunger of fire, never sated, feeds wantonly in this land. A tenant farmer approaches our rentinue, disrupting my communion with the spirits.\n\n"My [ROOT.Char.GetTitleAsNameNoTooltip]," [pleading_peasant.GetSheHe] addresses me, "thank [pleading_peasant.GetFaith.CreatorName] for your arrival! Your elemental servants have free reign over the contryside and are setting fire to our fields and stables. If there is aught you can do to alleviate our suffering, please... We are at your mercy!""
elemental_magic_lifestyle.2011.opt.a:0 "I will rein in my elemental servants."
elemental_magic_lifestyle.2011.opt.b:0 "My elementals shall go where they please!"
elemental_magic_lifestyle.2011.opt.c:0 "You dare question the spirits' will? You shall be burned alive!"
elemental_magic_lifestyle.2011.opt.d:0 "I must remedy this elemental imbalance."

elemental_magic_lifestyle.2021.t:0 "Totally Stoked"
elemental_magic_lifestyle.2021.desc.landholder:0 "In the hot, smoky warrens of our blacksmiths the glow of embers flicker along with the clang of hammers on steel. The head blacksmith approaches, bowing deeply in a gesture of respect. "My [ROOT.Char.GetTitledFirstName]," the blacksmith says, "as you can see, our smiths are the best in all of [ROOT.Char.GetPrimaryTitle.GetNameNoTier] and they work around the clock to arm your men." I am taken around the forges and shown the methods used by the smiths, and given a cursory overview of the numbers and outputs.\n\n"As you can see, my [ROOT.Char.GetTitleAsNameNoTooltip]," [blacksmith.GetSheHe] continues, "Our work is the best of the best... but it could be better with the help of your grace's command of the elements of fire. The peculiar magical character of their flame could imbue our products with special powers and extend our fuel supplies for greater cost savings. Might there be some way we can use your communion with the sprits to the benefit of the forges?""
elemental_magic_lifestyle.2021.desc.adventurer:0 "Today, a curious visitor has arrived at our camp; a blacksmith who claims to have heard of my command over the fire elements.\n\n"Metal smithed with elemental fire is said to have a unique character and effect," [blacksmith.GetSheHe] says. "As a recently minted master smith, I have longed to work with it for some time in order to broaden my understanding. I would like to offer my services temporarily, in order to gain this knowledge in return."\n\nOur own camp's blacksmiths could use the help, and of course our weapons would benefit as well from the new techniques."
elemental_magic_lifestyle.2021.opt.a:0 "A fantastic idea! Take my servant, Calcifer."
elemental_magic_lifestyle.2021.opt.b:0 "I shall personally assist, maybe I could learn something."
elemental_magic_lifestyle.2021.opt.c:0 "I will not debase the elements with this busywork."

elemental_magic_lifestyle.2031.t:0 "Fighting Fire with Fire"
elemental_magic_lifestyle.2031.desc.landholder:0 "The lights of the brushfires can be seen from our castle's walls, setting the horizon aglow at night. I am observing the fires from afar with [steward_character.GetName], who is recounting some of the damage reports from around the region.\n\n"My [ROOT.Char.GetTitleAsNameNoTooltip]," [steward_character.GetSheHe] says to me, "is it not true that you consort with the elemental forces of fire? Perhaps your abilities would help you keep our people safe."\n\nOf course the safety of our people is paramount, but quelling the fire via magical means could imbalance the elements. What should I do?"
elemental_magic_lifestyle.2031.desc.adventurer:0 "Even from our camp, the glow of distant brushfires can be seen and the air is filled with the smell of ash. Great brushfires are raging throughout the region and we are currently safe, but for how long?\n\n[steward_character.GetName] approaches me. "[ROOT.Char.GetName]", [steward_character.GetSheHe] says, "We need to do something before the fire reaches our camp. Besides, how can we remain as guests in this land and allow the people to suffer at the hands of the elements even as we can help."\n\nOf course the safety of our people is paramount, but quelling the fire via magical means could imbalance the elements. What should I do?"
elemental_magic_lifestyle.2031.opt.a:0 "I will commune with the spirits."
elemental_magic_lifestyle.2031.opt.b:0 "Let's fight the fire by conventional means."
elemental_magic_lifestyle.2031.opt.c:0 "It is better not to intervene."
elemental_magic_lifestyle.2031.toast.commune_success:0 "The Elements of Fire are soothed by your words."
elemental_magic_lifestyle.2031.toast.commune_failure:0 "The Elements of Fire ignore you and rage on."

elemental_fire_slave_army:0 "Enslaved Fire Elementals"

elemental_magic_lifestyle.2032.t:0 "Fighting Fire With Fire"
elemental_magic_lifestyle.2032.desc:0 "The heat and smoke are unbearable as I approach the thickest area of the brushfires. Allowing the heat and crackling noises to calm me, I clear my thoughts and begin to commune with the elements; turning this disaster area into a sacred space.\n\nThe sight granted to me by the spirits allows me to see past the flames, to another plane of existence. There the elementals of fire dance and revel and feed with abandon, whirling drunkenly and cavorting lustily just as humans do at a feast or wedding. I know that simply bargaining with the fire elementals be difficult.\n\nHowever, there are multiple other strategies I could choose..."
elemental_magic_lifestyle.2032.opt.a:0 "Diplomacy is nevertheless the correct approach."
elemental_magic_lifestyle.2032.opt.b:0 "Channel my power to force them into submission!"
elemental_magic_lifestyle.2032.opt.c:0 "Banish the elementals, severing their connection to this world."
elemental_magic_lifestyle.2032.opt.d:0 "Use my other connections to balance the elements."

## Magic Options for Vanilla Events
travel_danger_events.3005.magic:0 "Use my elemental abilities to douse the fire."