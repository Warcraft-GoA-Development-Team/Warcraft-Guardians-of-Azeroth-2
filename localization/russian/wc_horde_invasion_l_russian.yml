 blackdoom_vassal_fealty_change_effect_orgrim_tt: "Вассалы [blackhand_character.GetName], не являющиеся владельцами титулов [Glossary('орочьего клана', 'ORCISH_CLANS_GLOSS')], присягнут на верность #V вам#!. Владельцы титулов орочьих кланов, скорее всего, также присягнут спустя недолгое время."
 blackdoom_vassal_fealty_change_effect_blackhand_tt: "Вассалы [blackhand_character.GetName], не являющиеся владельцами титулов [Glossary('орочьего клана', 'ORCISH_CLANS_GLOSS')], присягнут на верность [orgrim_character.GetFullName]. Владельцы титулов орочьих кланов, скорее всего, также присягнут спустя недолгое время."
 blackdoom_horde_title_change_effect_orgrim_tt: "Вы получаете [titles|E] [GetTitleByKey('e_horde').GetName] и [GetTitleByKey('k_blackrock_clan').GetName]."
