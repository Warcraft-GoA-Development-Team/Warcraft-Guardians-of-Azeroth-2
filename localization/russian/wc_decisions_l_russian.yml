 # Дуга Бальназара
 wc_balnazzar_stage_death_decision: "Смерть по моему выбору"
 wc_balnazzar_stage_death_decision_desc: "Сильвана ждёт последнего доказательства верности Вариматраса — моей смерти. Мы можем показать ей именно то, что она ожидает увидеть. Лордерон перейдёт в её руки, а я исчезну в Чумных землях и на досуге выберу лицо подостойнее."
 wc_balnazzar_stage_death_decision_confirm: "Начать представление"
 wc_balnazzar_stage_death_decision_tooltip: "Инсценировать смерть Бальназара и продолжить его историю в качестве безземельного авантюриста"
 wc_balnazzar_stage_death_decision_effect_tooltip: "Сильвана получает ваши земельные титулы и вассалов; Бальназар выживает и отступает в Чумные земли"
 balnazzar_become_dathrohan_decision: "Жизнь, достойная кражи"
 balnazzar_become_dathrohan_decision_confirm: "Забрать его жизнь как свою"
 balnazzar_become_dathrohan_decision_desc: "Лордерон ускользнул из моих рук, и скитаться по этим руинам безземельным — совсем не то, кем я являюсь на самом деле. Трон был лишь лесами. Тела труднее добыть во второй раз, и я уже нашёл то, что стоит взять, — фанатика Серебряной Длани, уважаемого, пользующегося доверием, именно с тем лицом, на которое никто не подумает взглянуть дважды.\n\nНезачем ждать, пока кто-то даст мне повод. Я сам могу выбрать мгновение, войти в руины Стратхольма и стать тем, кого Легион, Сильвана и всё, что осталось от трона Лордерона, перестанут искать."
 balnazzar_become_dathrohan_decision_tooltip: "Убить Сайдана Датрохана и завладеть его телом, продолжив игру за него — унаследовав его титул, двор и владения, тогда как ваша истинная суть и магические таланты сохранятся, скрытые под обличьем"
 balnazzar_move_against_alexandros_decision: "Обратить сына против отца"
 balnazzar_move_against_alexandros_decision_confirm: "Прошептать ложь"
 balnazzar_move_against_alexandros_decision_desc: "Александроса Могрейна невозможно согнуть, купить или обмануть — он единственное препятствие между мной и полной властью над Орденом. Его сын Рено, сжираемый завистью к брату Дариону, совсем на него не похож.\n\nУмело поданная ложь стоит дороже целой армии."
 balnazzar_move_against_alexandros_decision_effect_tooltip: "Обращает Рено против отца и начинает интригу по убийству Александроса Могрейна"
 balnazzar_move_against_alexandros_decision_requirement_alive: "Александрос и Рено Могрейн должны быть живы"
 balnazzar_move_against_alexandros_decision_tooltip: "Обратить собственного сына Александроса против него"
 balnazzar_shed_the_mask_decision: "Сбросить маску"
 balnazzar_shed_the_mask_decision_confirm: "Я не стану ждать, пока меня поймают"
 balnazzar_shed_the_mask_decision_desc: "Бремя быть под присмотром, под подозрением, удерживать украденное лицо под пристальным вниманием — оно не ослабевает, сколько бы я его ни носил. Есть ответ проще, чем терпеть это ещё мгновение.\n\nМне не нужно ждать, пока меня поймают."
 balnazzar_shed_the_mask_decision_effect_tooltip: "Верующие вашего столичного графства вырезаны и подняты как Восставшие, а Бальназар возвращает себе собственное тело натрезима и отрывает эти земли себе — остальной Алый Орден продолжает существовать сам по себе, а заимствованное тело Сайдана Датрохана остаётся позади, наконец-то и по-настоящему мёртвое"
 balnazzar_shed_the_mask_decision_tooltip: "Ударить первым, прежде чем маску сорвут"

