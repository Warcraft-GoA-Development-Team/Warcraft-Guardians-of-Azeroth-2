 # Tyrism
 holy_light_rite: "Holy Light Rite"
 holy_light_rite_adj: "Holy Light"
 holy_light_rite_adherent: "Light follower"
 holy_light_rite_adherent_plural: "Light followers"
 holy_light_rite_desc: "The traditional liturgy of the Church since the fall of Arathor, shaped in Lordaeron, emphasizing sacramental discipline and upholding the virtues of Holiness, Justice, and Compassion."

 khazic: "Khazism"
 khazic_adj: "Khazic"
 khazic_adherent: "Khazic"
 khazic_adherent_plural: "Khazics"
 khazic_desc: "The Khazic Church blends the teachings of the Holy Light with the ancestral traditions of Khaz Modan. While its faithful worship the Light, they maintain a deep reverence for their ancestors and Khaz, the "Great-father" of the dwarves. To the Khazics, honoring their forebears is a sacred duty, equal to upholding divine law."
 khazism_creator_god_name: "Khaz"
 khazism_creator_god_name_possessive: "Khaz's"
 khazism_fertility_god_name: "Eo"
 khazism_fertility_god_name_possessive: "Eo's"
 khazism_household_god_name: "Great-father"
 khazism_household_god_name_possessive: "Great-father's"

 tirisfal_rite: "Tirisfal Rite"
 tirisfal_rite_adj: "Tirisfalen"
 tirisfal_rite_adherent: "Tirisfalen"
 tirisfal_rite_adherent_plural: "Tirisfalen"
 tirisfal_rite_desc: "Born from the traditions of the Holy Light and shaped in secret by the Council of Tirisfal, this rite unites the pursuit of knowledge with discipline and caution, ensuring that magic serves the world rather than condemns it."

 scarlet_rite: "Scarlet Rite"
 scarlet_rite_adj: "Scarlet"
 scarlet_rite_adherent: "Scarlet"
 scarlet_rite_adherent_plural: "Scarlets"
 scarlet_rite_desc: "$scarletism_desc$"

