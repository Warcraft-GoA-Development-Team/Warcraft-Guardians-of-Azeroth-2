l_russian:
 game_concept_wc_race: "Раса"
 game_concept_wc_race_desc: "Раса или вид - термины, используемые для разделения различных уникальных существ на отдельные группы."
  
 game_concept_wc_children_of_cenarius_family: "Род $game_concept_wc_children_of_cenarius_wo_family$"
 game_concept_wc_children_of_cenarius_family_desc: "[wc_race_family|E] - потомки полубога Кенария, имеет четвероногое тело с гуманоидным туловищем. Они известны как дети или род Кенария.\n\nЕго детьми считаются:\n$BULLET_WITH_TAB$[GetTrait('creature_dryad').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_frostnymph').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_centaur').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_magnataur').GetName( GetNullCharacter )]"
  
 game_concept_wc_races: "Расы"
  
 game_concept_wc_race_family: "Подраса"
 game_concept_wc_race_family_desc: "Близкородственные [wc_races|El]. Разделившись около 10000 лет назад, они гарантированно могут вступать в брак друг с другом и производить потомство."
  
 game_concept_wc_race_class: "Подкласс расы"
 game_concept_wc_race_class_desc: "Дальнородственные [wc_races|El]. Не обязательно, что они имеют одинаковое происхождение, но у них схожие физиологические особенности, такие как, например, чешуя или жабры."
  
 game_concept_wc_long_lived: "Long-Lived"
 game_concept_wc_long_lived_desc: "Характеристика некоторых [wc_races|E], живущих значительно дольше людей — на протяжении нескольких человеческих жизней. Некоторые обладают [wc_extreme_longevity|E], проживая тысячи и даже десятки тысяч лет. Чаще всего таковы [wc_elder_races|E], но определённые обстоятельства могут даровать такое долголетие и другим существам..."
  
 game_concept_wc_extreme_longevity: "Extreme Longevity"
 game_concept_wc_extreme_longevity_desc: "Отличаясь продолжительностью жизни в тысячи и даже десятки тысяч лет, эти существа видели взлёт и падение цивилизаций и предшествуют всей письменной истории человечества. Невероятная перспектива, которую это даёт культуре, делает их одними из [wc_elder_races|E]."
  
 game_concept_wc_elder_races: "Elder Races"
 game_concept_wc_elder_race: "Elder Race"
 game_concept_wc_elder_race_desc: "Некоторые [wc_races|E] отличаются [wc_extreme_longevity|E], поэтому их культуры несут древнюю мудрость о том, как жить дольше и лучше. Эти почти бессмертные существа обладают бонусами против определённых вредоносных событий и получают от них лучшие исходы. Со временем и доверием, возможно, более молодые расы смогут перенять эту мудрость в грядущие трудные времена..."
  
 game_concept_wc_children_of_cenarius_wo_family: "Кенария"
  
 game_concept_wc_yaungol_family: "Род $game_concept_wc_yaungol_wo_family$ов"
 game_concept_wc_yaungol_wo_family: "Бык"
 game_concept_wc_yaungol_family_desc: "[wc_race_family|E] крупных быкообразных гуманоидов. Их общие предки населяли великие равнины древнего Калимдора. К ним относятся:\n$BULLET_WITH_TAB$[GetTrait('creature_taunka').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_tauren').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_yaungol').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_highmountain_tauren').GetName( GetNullCharacter )]"
  
 game_concept_wc_nraqi_family: "$game_concept_wc_nraqi_wo_family$"
 game_concept_wc_nraqi_wo_family: "Безликие"
 game_concept_wc_nraqi_family_desc: "[wc_race_family|E] ужасных существ, созданных Древними Богами. К ним относятся:\n$BULLET_WITH_TAB$[GetTrait('creature_nraqi').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_cthraxxi').GetName( GetNullCharacter )]"
  
 game_concept_wc_elven_family: "$game_concept_wc_elven_wo_family$"
 game_concept_wc_elven_wo_family: "Эльфы"
 game_concept_wc_elven_family_desc: "[wc_race_family|E] гуманоидных существ родом из Азерота, известных своим острым восприятием, грацией и магическим даром. К ним относятся:\n$BULLET_WITH_TAB$[GetTrait('creature_high_elf').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_night_elf').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_nightborne').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_highborne').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_faldorei').GetName( GetNullCharacter )]\nЭто одна из [Concept( 'wc_elder_races', 'Старших рас' )|E]"
  
 game_concept_wc_aqir_family: "$game_concept_wc_aqir_wo_family$"
 game_concept_wc_aqir_wo_family: "Акиры"
 game_concept_wc_aqir_family_desc: "[wc_race_family|E] разумных инсектоидов, возникших из органической материи, которую выделяли Древние Боги. К этой [Concept( 'wc_elder_races', 'Старшей расе' )|E] относятся:\n$BULLET_WITH_TAB$[GetTrait('creature_nerubian').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_qiraji').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_mantid').GetName( GetNullCharacter )]"
  
 game_concept_wc_dragon_family: "$game_concept_wc_dragon_wo_family$"
 game_concept_wc_dragon_wo_family: "Драконы"
 game_concept_wc_dragon_family_desc: "[wc_race_family|E] крылатых рептилий, которые были созданы Титанами из протодраконов. К этой [Concept( 'wc_elder_races', 'Старшей расе' )|E] относятся:\n$BULLET_WITH_TAB$[GetTrait('creature_red_dragon').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_blue_dragon').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_green_dragon').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_black_dragon').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_bronze_dragon').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_infinite_dragon').GetName( GetNullCharacter )]"
  
 game_concept_wc_vrykul_family: "$game_concept_wc_vrykul_wo_family$"
 game_concept_wc_vrykul_wo_family: "Врайкулы"
 game_concept_wc_vrykul_family_desc: "[wc_race_family|E] полугигантов, потомков Кованых Титанами железных врайкулов. К ним относятся:\n$BULLET_WITH_TAB$[GetTrait('creature_vrykul').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_kvaldir').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_jinyu').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_ankoan').GetName( GetNullCharacter )]"
  
 game_concept_wc_murloc_family: "$game_concept_wc_murloc_wo_family$"
 game_concept_wc_murloc_wo_family: "Мурлоки"
 game_concept_wc_murloc_family_desc: "[wc_race_family|E] двуногих гуманоидных существ-амфибий, происходящих от неизвестного Древнего Стража - лягушки. К ним относятся:\n$BULLET_WITH_TAB$[GetTrait('creature_murloc').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_gorloc').GetName( GetNullCharacter )]"
  
 game_concept_wc_goblin_family: "$game_concept_wc_goblin_wo_family$"
 game_concept_wc_goblin_wo_family: "Гоблиноиды"
 game_concept_wc_goblin_family_desc: "[wc_race_family|E] небольших гуманоидных существ, известных своим непредсказуемым характером. К ним относятся:\n$BULLET_WITH_TAB$[GetTrait('creature_goblin').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_gilblin').GetName( GetNullCharacter )]"
  
 game_concept_wc_eredar_family: "$game_concept_wc_eredar_wo_family$"
 game_concept_wc_eredar_wo_family: "Эредары"
 game_concept_wc_eredar_family_desc: "[wc_race_family|E] чрезвычайно талантливых магов, возникшая на планете Аргус бесчисленные тысячелетия назад. Исключительно искусные в магии, их мастерство владения тайными искусствами славилось во всех разрозненных мирах Великой Запредельной Тьмы. Тёмный Титан Саргерас нарушил спокойствие Аргуса, предложив эредарам безмерные знания и власть. Те, кто отверг предложение Саргераса, покинули Аргус и стали называть себя дренеями, или «изгнанниками». Во времена Орды некоторые из них превратились в крокул, или «Сломленных», и Потерянных. К ним относятся:\n$BULLET_WITH_TAB$[GetTrait('creature_draenei').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_manari').GetName( GetNullCharacter )]\nЭто одна из [Concept( 'wc_elder_races', 'Старших рас' )|E]"
  
 game_concept_wc_ursine_family: "$game_concept_wc_ursine_wo_family$"
 game_concept_wc_ursine_wo_family: "Урсиниты"
 game_concept_wc_ursine_family_desc: "[wc_race_family|E] медведеподобных существ, которые, как говорят, имеют общих предков. К ним относятся:\n$BULLET_WITH_TAB$[GetTrait('creature_furbolg').GetName( GetNullCharacter )]\n$BULLET_WITH_TAB$[GetTrait('creature_pandaren').GetName( GetNullCharacter )]"
