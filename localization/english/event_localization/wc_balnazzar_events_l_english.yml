l_english:
 BALNAZZAR_DREADLORD_CUSTOM_STRING_KEY:0 "A dreadlord wears a borrowed face and spends a mortal lifetime reaching for a throne that was never his."

 wc_balnazzar_story.0100.title:0 "The Failing Shell"
 wc_balnazzar_story.0100.desc:0 "The hand I wear trembles when it lifts the seal. This flesh is beginning to fail, and no heir is ready to inherit its name. When it dies, the court will divide everything I built among claimants who know nothing of me.\n\nI can wait for that indignity, or tear away the disguise while I still command what lies beneath it."
 wc_balnazzar_story.0100.a:0 "The mask has served long enough."
 wc_balnazzar_story.0100.b:0 "Let it end quietly."

 wc_balnazzar_story.0101.title:0 "A Familiar Stranger"
 wc_balnazzar_story.0101.desc:0 "[balnazzar_witness.GetShortUINameNoTooltip] has been watching me. Familiar answers now earn a second glance, and yesterday [balnazzar_witness.GetSheHe] caught me studying this face in the glass. [balnazzar_witness.GetSheHe|U] has told no one. Not yet."
 wc_balnazzar_story.0101.desc_close:0 "With the door shut, [balnazzar_witness.GetShortUINameNoTooltip] asks whether I have slept. I choose a weary smile and count a breath before answering. [balnazzar_witness.GetHerHis|U] hand pauses on the back of my chair. Only a moment; then our conversation resumes. I have given a plausible answer. Yet here, with someone who needs no audience from me, the care I take may be what troubles [balnazzar_witness.GetHerHim]."
 wc_balnazzar_story.0101.desc_councillor:0 "[balnazzar_witness.GetShortUINameNoTooltip] lays a folded note beside my hand. An instruction I gave yesterday: would I repeat it, so [balnazzar_witness.GetSheHe] can be sure? I oblige, watching a finger settle against one line. Perhaps this is diligence. Still, I find myself weighing yesterday's words against today's. I had expected obedience; I must now allow for someone keeping an account."
 wc_balnazzar_story.0101.a:0 "I must earn their trust."
 wc_balnazzar_story.0101.b:0 "Arrange their disappearance. I want them alive."
 wc_balnazzar_story.0101.murder:0 "Find someone who can silence them for good."
 wc_balnazzar_story.0101.c:0 "Say nothing. Let them keep wondering."
 wc_balnazzar_story.0101.close:0 "$CLOSE_LABEL$"

 wc_balnazzar_story.0102.title:0 "Under the Ashes"
 wc_balnazzar_story.0102.desc:0 "Another chapel is emptied. Another village swears the proper creed. The work is necessary, but it sends soldiers and clerks into places where a careless word can travel farther than an army."
 wc_balnazzar_story.0102.a:0 "Continue."

 wc_balnazzar_story.0110.title:0 "The Next Mask"
 wc_balnazzar_story.0110.desc:0 "[next_vessel.GetShortUINameNoTooltip] must die without appearing dead. A ruler found cold in bed leaves seals to be seized and loyalties to be tested. I need the body to rise, dress, and summon its servants as usual.\n\nWhen the last defense gives way, I enter. A servant opens the door and sees the same face that dismissed him yesterday. He bows.\n\nThe old shell has served its purpose. By the time anyone looks for it, nothing will remain."
 wc_balnazzar_story.0110.a:0 "Wear the next mask."
 wc_balnazzar_story.0111.title:0 "The Morning Petitions"
 wc_balnazzar_story.0111.desc:0 "A servant brings the morning petitions and pauses at the threshold. I sign the first order with [ROOT.Char.GetFirstNamePossessive] hand, then ask why he is staring. He apologizes and bows.\n\nOutside this room, the same guards keep watch and the same councillors wait to be heard. They speak their ruler's name. I answer, and the day's business begins."
 wc_balnazzar_story.0111.a:0 "Let them recognize their ruler."

 wc_balnazzar_story.0002.title:0 "The Body at the Foot of the Throne"
 wc_balnazzar_story.0002.desc:0 "Varimathras raises his hand. Sylvanas watches from the throne that used to be mine, waiting to learn whether he will strike his brother or disappoint his new queen.\n\nThe spell throws me across the stones. I do not move when the hall falls quiet. A guard kneels to look for breath, then rises with the answer everyone needs. Sylvanas gives the first order of her reign. No one asks what became of me.\n\nVarimathras waits until the doors close. Then I open my eyes. Lordaeron has changed hands; that is a problem for those who intend to keep their own. By nightfall I am moving north without a banner or a name anyone fears to lose."
 wc_balnazzar_story.0002.a:0 "Leave them a death to report."
 wc_balnazzar_story.0002.b:0 "The moment has passed."

 wc_balnazzar_story.1001.title:0 "The Name at the Gate"
 wc_balnazzar_story.1001.desc:0 "My own name has become a warning shouted in the wrong rooms. Dathrohan's opens doors. He still has soldiers who straighten when he approaches and officers who wait for his judgment.\n\nI find him where the ruined streets leave no witness close enough to matter. He recognizes me before I reach him. His hand rises toward the Light; mine closes around his wrist.\n\nThe guards hear their commander call them forward. When they see me beneath Dathrohan's helm, they see a man who has returned from a dangerous road. I let them keep that comfort."
 wc_balnazzar_story.1001.a:0 "Answer in Dathrohan's voice."
 wc_balnazzar_story.1001.a_magic_tooltip:0 "Balnazzar's magic and Intrigue perks carry over alongside this body's existing Intrigue perks. Light perks and points are lost, and you cannot contract new diseases while disguised"
 wc_balnazzar_story.1001.b:0 "Dathrohan is beyond my reach."


 wc_balnazzar_story.1004.desc_bargain_lapsed:0 "Alexandros has fallen before we could settle our bargain. The reports leave Kel'Thuzad nothing to offer against a living enemy.\n\nI sent a message, not an oath. Whatever he had hoped to gain from my hand, I shall turn now to the officers who remain."
 wc_balnazzar_story.1004.offer:0 "Kel'Thuzad lets my message curl in the cold above his palm. He has understood enough. I shall not be able to leave this crypt unknown.\n\nHis dead can watch the roads and divide Alexandros from his escort. Renault will have his opening. The lich asks for a debt in return, and the fallen paladin is to be his. Ashbringer, should Alexandros still carry it, will follow its master.\n\nI incline Dathrohan's head. Let the lich have the corpse. I have a living order to inherit."
 wc_balnazzar_story.1004.offer_no_renault:0 "Renault is dead. The report lies between us, its seal broken. Kel'Thuzad waits for me to speak, but the son I meant to turn against Alexandros can no longer answer me.\n\nI fold the report. There will be no bargain tonight."
 wc_balnazzar_story.1005.choice:0 "Renault's hand tightens around his cup when Alexandros praises Darion. I ask what command his father has promised him. The answer comes too quickly.\n\nI let the silence work before I speak again. His father will never give him what he has earned, I tell him; he must take it. Envy has brought Renault this far. Now I ask whether he has the courage to act upon it.\n\nHe sets down the cup. I wait for his answer."
 wc_balnazzar_story.1005.unanswered:0 "I have no willing pledge from Renault. His part in this design is closed; repeating my appeal would only give him more reason to distrust Dathrohan.\n\nI put away the letter. Alexandros still commands the Order."
 wc_nathrezim_cover.0006.darion_departed:0 "Darion does not wait for the shouting to end. He made his terms when he lent his name to the city, and he has kept them. By the time I turn toward him, he has left my court.\n\nThe streets remain. So do the promises written for them. Neither requires the face I wore to survive."
 wc_balnazzar_story.1020.title:0 "What a Son Is Owed"
 wc_balnazzar_story.1020.desc:0 "Dathrohan has stopped asking questions. Now he speaks of a road my father must take, of guards who can be drawn away, of a moment when I could stand alone before him.\n\nI have imagined forcing Father to hear me. I have imagined the look on his face when he could no longer turn to someone else. Hearing those wishes spoken aloud makes my mouth go dry.\n\nDathrohan waits. He cannot put my hand upon the blade for me."
 wc_balnazzar_story.1020.accept:0 "Tell me where to meet him."
 wc_balnazzar_story.1020.refuse:0 "Whatever he has denied me, he is still my father."
 wc_balnazzar_story.1003.title:0 "The Man They Still Follow"
 wc_balnazzar_story.1003.desc:0 "The first officers arrive before the borrowed face has grown familiar. They bring maps, shortages, and names they expect Dathrohan to weigh. I let each man speak until the room remembers whose seal sends it to war.\n\nThe map is stained with rain and candle grease. Every road into the Plaguelands has a different danger attached to it, yet every quarrel ends at the same name: Alexandros. A public blow would only give them a martyr. I need a road, an absent escort, and a son who has spent too long being measured against his father. Kel'Thuzad may know how to make that road costly."
 wc_balnazzar_story.1003.a:0 "Send word to Kel'Thuzad."
 wc_balnazzar_story.1003.a_summary:0 "Kel'Thuzad may answer in 5 to 10 days, if he remains alive."

 wc_balnazzar_story.1004.title:0 "Terms in the Crypt"
 wc_balnazzar_story.1004.a:0 "Accept the debt."
 wc_balnazzar_story.1004.a_summary:0 "Kel'Thuzad may gain a favor now. If Renault kills Alexandros while the lich lives, Kel'Thuzad takes the body."
 wc_balnazzar_story.1004.b:0 "No bargain, then."
 wc_balnazzar_story.1004.b_summary:0 "Kel'Thuzad gains no claim. If Alexandros carries Ashbringer and Renault kills him, Renault may keep its corrupted form."

 wc_balnazzar_story.1005.title:0 "A Son's Envy"
 wc_balnazzar_story.1005.a:0 "Ask Renault to take part in his father's murder."



 wc_balnazzar_story.1006.title:0 "The Report from Stratholme"
 wc_balnazzar_story.1006.desc:0 "Renault's courier arrives before dawn, mud dried along the seams of his cloak. Alexandros followed the report to Stratholme with Fairbanks beside him. Kel'Thuzad's dead pressed the escort apart until the old paladin stood with his son.\n\nThe final line is short. Renault struck when the Ashbringer slipped from his father's hand."
 wc_balnazzar_story.1006.desc_refused:0 "Renault's courier arrives before dawn, mud dried along the seams of his cloak. Without Kel'Thuzad's dead, the escort broke in the fighting rather than in an ambush. Fairbanks vanished in the confusion; Alexandros was left with the son he had never learned to fear.\n\nThe final line is short. Renault struck when the Ashbringer slipped from his father's hand."
 wc_balnazzar_story.1006.darion_bait:0 "\n\nDarion lays the dispatch about his capture beside the report. Renault's hand wrote the lie; Dathrohan's seal made it command. Darion was never on that road, and now he knows who made his father trust it."
 wc_balnazzar_story.1006.diversion_bait:0 "\n\nNo letter named Darion. Renault bought a false alarm at a stranded garrison instead. The lie leaves no brother with proof, only a road that was empty when Alexandros needed it most."
 wc_balnazzar_story.1006.pact_body:0 "\n\nKel'Thuzad has collected his due. Alexandros rises among the lich's servants, beyond Renault's reach and mine."
 wc_balnazzar_story.1006.body_dead:0 "\n\nAlexandros is dead. Renault has given me the one thing he can never take back."
 wc_balnazzar_story.1006.pact_unconfirmed:0 "\n\nKel'Thuzad's messengers claim the debt is paid, but no one has seen Alexandros in the lich's service. I will not mistake a promise for a captive."
 wc_balnazzar_story.1006.pact_blade:0 " The Ashbringer went with Alexandros, darkened by the betrayal. Renault returned without it."
 wc_balnazzar_story.1006.renault_blade:0 " The blade darkened in Renault's hands. He brought it back but could not meet my eyes."
 wc_balnazzar_story.1006.a:0 "Keep Renault close."
 wc_balnazzar_story.1006.desc_survived:0 "Renault's report leaves a space where a death should be. He struck; Alexandros lived. The rest is an anxious account of men shouting in the dark and a son who did not finish what he began.\n\nA living father can still speak to his soldiers. I fold the page before anyone sees my hand close around it."
 wc_balnazzar_story.1006.survived:0 "The father remains."

 wc_balnazzar_story.1007.title:0 "A Banner for the Living"
 wc_balnazzar_story.1007.desc:0 "Alexandros is gone, and the officers have gathered without knowing where to look. Renault stands nearest the door. He does not meet my eyes when I speak in Dathrohan's voice.\n\nThe Silver Hand has lost its certainty with its commander, I tell them. It needs a banner that promises safety to those who still believe the war can be won. Scarlet cloth lies folded across the table. I wait until every face has turned toward it."
 wc_balnazzar_story.1007.desc_quarantine:0 "Fairbanks has been led from the hall under guard. The officers watched the door close, then looked back to me for the order that would make this silence appear necessary. Maxwell does not join their gaze.\n\nThe Silver Hand has lost its certainty with Alexandros. I unfold the scarlet cloth and offer it a banner for those who still believe the war can be won."
 wc_balnazzar_story.1007.desc_arrest:0 "Fairbanks is below the monastery, and Renault stands near the door as if the stone can keep him from hearing the accusation. Maxwell has stepped away from the table. The officers wait for an order that makes their fear into duty.\n\nI unfold the scarlet cloth. The Silver Hand needs a banner that promises safety to those who still believe the war can be won."
 wc_balnazzar_story.1007.desc_audience:0 "Fairbanks has spoken before the officers, and no one has left the hall unchanged. Renault stares at the floor; Maxwell measures the door.\n\nI unfold the scarlet cloth before the argument can become a fracture. The Silver Hand needs a banner for those who still believe the war can be won."
 wc_balnazzar_story.1007.a:0 "Unfurl the Scarlet banner."
 wc_balnazzar_story.1007.a_summary:0 "The Silver Hand is remade as the Scarlet Crusade."
 wc_balnazzar_story.1007.b:0 "The moment has passed."
 scarlet_crusade_custom_name:0 "Scarlet Crusade"

 wc_balnazzar_story.1012.title:0 "The Witness Returns"
 wc_balnazzar_story.1012.desc:0 "The hall falls silent when Fairbanks enters unbidden. He was on the Stratholme road when Renault struck Alexandros; now he names the son, the ambush, and the orders that cleared the way. Then he turns to me.\n\nThe plague has left too many men fevered, frightened, and ready to call grief a truth. Guards wait by the door. Renault stares at the floor. Maxwell watches Fairbanks, then the men already edging toward the exit. Every officer is listening for my answer."
 wc_balnazzar_story.1012.quarantine:0 "Place Fairbanks under the Inquisition's quarantine."
 wc_balnazzar_story.1012.quarantine_summary:0 "Imprison Fairbanks in Dathrohan's sealed custody."
 wc_balnazzar_story.1012.arrest:0 "Arrest him before the council."
 wc_balnazzar_story.1012.arrest_summary:0 "Imprison Fairbanks and adopt the Inquisition's case."
 wc_balnazzar_story.1012.audience:0 "Let him make his accusation."
 wc_balnazzar_story.1012.audience_summary:0 "Fairbanks speaks openly; Raymond may turn against you."

 wc_balnazzar_story.1018.title:0 "The Argent Dawn"
 wc_balnazzar_story.1018.desc:0 "Three years have passed since Light's Hope broke from my command. Its silver banner now has a name, a court, and a leader beyond my reach. Maxwell Tyrosus gathers the dissenters; Darion Mograine rides with them.\n\nThe old Order has split in two. One half answers my seal. The other now answers the Argent Dawn."
 wc_balnazzar_story.1018.a:0 "Let them gather."
 wc_balnazzar_story.1018.a_summary:0 "The independent Argent Dawn forms at Light's Hope."

 wc_balnazzar_story.1014.title:0 "The Witness Below"
 wc_balnazzar_story.1014.desc:0 "The gaoler sets an untouched bowl on my table. Below the monastery, Fairbanks is still alive. When his breath permits, he names Alexandros's murderers to the men outside his door. Some have begun asking for another watch.\n\nI tell the gaoler to bring masons. No one is to open that chamber again. He looks down at the keys in his hand, then bows.\n\nStone will keep the accusation from the corridors. What remains behind it need never be seen."
 wc_balnazzar_story.1014.a:0 "Seal the chamber."

 wc_balnazzar_story.1019.title:0 "The Door Opens"
 wc_balnazzar_story.1019.desc:0 "The guards hear the bolt strike from below, then a second sound: Fairbanks standing behind the sealed door. He no longer asks for bread. He still names Alexandros's murderers.\n\nI leave the keys on the table. The monastery has kept its witness, but not its man."
 wc_balnazzar_story.1019.a:0 "Leave him below."


 wc_scarlet_court_maintenance.0011.t:0 "The Scarlet War Council"
 wc_scarlet_court_maintenance.0011.desc:0 "Scarlet cloth now hangs beside the old silver. The room has not become a court; it has become a command post. Abram Isillien brings petitions of doctrine, while James and Brigitte Abbendis lay patrol routes across the table. Every report ends at the same question: who will be protected, and who will be named a threat?\n\nI take Dathrohan's seat. The answer must sound like mercy before it becomes obedience."

 wc_balnazzar_story.2000.title:0 "The Mask Comes Off"
 wc_balnazzar_story.2000.desc:0 "Too many eyes linger on this face. Too many questions follow when I leave a room. The disguise has ceased to protect me, and a useless mask is only a weakness.\n\nSaidan Dathrohan is already dead. Tonight, the lie dies with him. Those gathered in [ROOT.Char.GetCapitalLocation.GetTitle.GetBaseNameNoTier] will see what ruled them, then rise to serve it."
 wc_balnazzar_story.2000.desc_later_vessel:0 "They have begun to watch me. A servant stopped talking when I entered the hall, and two riders left [ROOT.Char.GetCapitalLocation.GetTitle.GetBaseNameNoTier] without my leave. This body's name no longer protects me.\n\nI will not flee in borrowed flesh. Before dawn, this household will meet Balnazzar. The dead worth keeping will rise again."
 wc_balnazzar_story.2000.a:0 "Let the Risen claim what is mine."
 the_risen:0 "The Risen"

 wc_balnazzar_story.2001.title:0 "The Risen"
 wc_balnazzar_story.2001.desc:0 "Below me, the badges of the old order hang from bodies that no longer breathe. The fallen stand again, waiting for one command.\n\n[ROOT.Char.GetCapitalLocation.GetTitle.GetBaseNameNoTier] is the first stronghold of the Risen. The dead gathered here retain their training and their knowledge of the roads. Whatever loyalties survived death will not survive me."
 wc_balnazzar_story.2001.a:0 "Rise, and serve."
 wc_balnazzar_story.1001.desc_staged:0 "Varimathras gave the hall its corpse. The witnesses carried that certainty away with them, and no one will look for Balnazzar while they are busy repeating how he fell.\n\nDathrohan is alone when I find him among Stratholme's broken houses. He recognizes danger and reaches for the Light. I take his wrist before the prayer finds its shape.\n\nHis guards are farther down the street. They hear Dathrohan's voice call them on. They do not hurry. They have no reason to."
 wc_balnazzar_story.1001.desc_sylvanas:0 "Sylvanas has Lordaeron. I leave her its walls and take what can still move beyond them: a commander whose name makes soldiers listen.\n\nDathrohan recognizes me in the ruins and reaches for the Light. I stop the gesture before it becomes a prayer.\n\nWhen his guards call out, Dathrohan answers. By the time they reach us, their commander is already giving orders."
 wc_balnazzar_story.1001.desc_unavailable:0 "The reports bring no opening. Dathrohan is beyond my reach, and the authority I meant to steal with his face cannot be taken this way.\n\nI set his name aside. This design has reached its end."
 wc_balnazzar_story.1003.desc_no_renault:0 "An officer pushes the map toward Alexandros. Even those who dispute his orders wait for him to settle the argument. I listen with Dathrohan's patient expression.\n\nRenault is dead. The resentment I meant to turn against his father has gone with him. I leave my message to Kel'Thuzad unsealed."
 wc_balnazzar_story.1004.desc_no_kelthuzad:0 "No answer comes from Kel'Thuzad. The lich is gone, and the arrangements I meant to make with him are useless.\n\nI burn the message. This design has no further use."
 wc_balnazzar_story.1005.desc_no_renault:0 "Renault is dead. The grievances I tended have died with him, and Alexandros remains beyond the reach of the trap I prepared.\n\nI burn my unfinished letter before anyone can read it."
 wc_balnazzar_story.1007.desc_both:0 "Isillien weighs the scarlet cloth between two fingers. Abbendis asks who will carry it into battle. With Alexandros gone, neither can leave the question unanswered.\n\nI offer them Dathrohan's certainty: a creed for Isillien to defend, orders for Abbendis to enforce. When they nod, I call the officers in."
 wc_balnazzar_story.1007.desc_isillien:0 "Abbendis is beyond my reach, but Isillien remains. His voice can turn alarm into doctrine before the officers have time to mourn Alexandros.\n\nI lay the scarlet cloth before him and ask what faith must demand in a war like this. He does not answer at once. That pause is enough; the room listens when he finally does."
 wc_balnazzar_story.1007.desc_abbendis:0 "Isillien cannot stand beside us, but Abbendis remains with the soldiers. His name carries farther through a barracks than mine can afford to.\n\nI unfold the scarlet cloth and ask him what an order owes those who have nowhere else to go. He grips its edge before he answers. The officers will see that gesture."
 wc_balnazzar_story.1005.desc_no_darion:0 "Renault watches his father across the council table. Darion is dead, but his absence has not brought the surviving son the regard he craves.\n\nI ask Renault what command Alexandros has entrusted to him. He answers too quickly. I let the silence that follows do its work, then wait for his answer."
 wc_balnazzar_fairbanks_accusation:0 "[TARGET_CHARACTER.GetShortUIName|U] accused [CHARACTER.GetShortUIName] of complicity in Alexandros Mograine's murder."
 wc_balnazzar_fairbanks_accusation_corresponding:0 "[CHARACTER.GetShortUIName|U] accused [TARGET_CHARACTER.GetShortUIName] of complicity in Alexandros Mograine's murder."
 wc_balnazzar_darion_refused:0 "[CHARACTER.GetShortUIName|U] upheld Renault's protection against [TARGET_CHARACTER.GetShortUINamePossessive] appeal."
 wc_balnazzar_darion_refused_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] upheld Renault's protection against [CHARACTER.GetShortUINamePossessive] appeal."
 wc_balnazzar_protected_opinion:0 "Kept Me under Protection"
 wc_balnazzar_refused_protection_opinion:0 "Rejected My Appeal"
 wc_balnazzar_story.1014.desc_undead:0 "Fairbanks no longer eats, sleeps, or draws breath. Still, when the door opens, the priest rises and names Alexandros's murderers again. The choice I made below the monastery cannot be taken back."
 wc_balnazzar_story.1014.dismiss:0 "There is nothing more to decide here."
 wc_balnazzar_darion_bait:0 "Used a false report of Darion's capture to lure Alexandros to his murder"
 wc_balnazzar_story.1006.desc_no_fairbanks:0 "Fairbanks was not on the road when the fighting began. Without the priest, there is no eyewitness who can name the hand behind the lie. The escort scattered, Alexandros tired, and Renault found the opening he had asked for.\n\nThe courier says only that the son struck. That is enough."
 wc_balnazzar_story.1006.desc_direct_witness:0 "Fairbanks saw Renault strike Alexandros on the Stratholme road. He escaped the fighting with the accusation intact; the truth now has a witness who can name both the son and the orders behind him."
 wc_balnazzar_story.1006.desc_indirect_witness:0 "Fairbanks lives, but he was not beside Alexandros when Renault struck. He has fragments, suspicion, and the courage to make them public; he does not have the killing in his own sight."
 wc_balnazzar_story.1006.desc_no_blade:0 "Renault killed his father without the Ashbringer. His report wanders through excuses until it reaches the blow itself; there, it becomes precise.\n\nThe famous blade was not on that road. Renault's guilt will have to be weapon enough."
 wc_scarlet_broken_promise:0 "[CHARACTER.GetShortUIName|U] broke the promise on which [TARGET_CHARACTER.GetShortUIName] had pledged support."
 wc_scarlet_broken_promise_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] broke the promise on which [CHARACTER.GetShortUIName] had pledged support."
 wc_balnazzar_renault_abandoned:0 "[CHARACTER.GetShortUIName|U] withdrew [CHARACTER.GetHerHis] promised protection from [TARGET_CHARACTER.GetShortUIName]."
 wc_balnazzar_renault_abandoned_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] withdrew [TARGET_CHARACTER.GetHerHis] promised protection from [CHARACTER.GetShortUIName]."
