l_russian:
  
 legend_legacy_of_the_three_hammers: "Наследие Трёх Молотов"
 legend_legacy_of_the_three_hammers_desc: "Наша династия объединила дворфов и разрешила трехсотлетний раскол, возникший после Войны Трёх Молотов. Мы - истинные наследники древнего королевства Стальгорн."
  
 legend_blood_of_anvilmar: "Кровь Старой Наковальни"
 legend_blood_of_anvilmar_desc: "В наших жилах пульсирует кровь наследников первого короля Стальгорна, правителя объединенной империи дворфов. Мы - законные правители всех дворфов!"
  
 legend_thoradins_successor: "Истинные наследники Торадина"
 legend_thoradins_successor_desc: "Поскольку наша родословная восходит к древнему первому королевству человечества, мы имеем полное право на нашу власть над землями Аратора."
  
 legend_mereldars_issue: "Отпрыски святой Мерельдар"
 legend_mereldars_issue_desc: "Наша династия ведёт своё происхождение от самой Мерельдар, что свидетельствует о нашей святой природе."
  
 legend_mender_of_the_sundering: "Вершитель раскола"
 legend_mender_of_the_sundering_desc: "Великое магическое бедствие, из-за которого наши народы не отличаются друг от друга ни по культуре, ни по географии, было исправлено великим лидером, который таким образом восстановил славу Высокорожденных."
  
 legend_descended_of_huln: "Потомок Хална"
 legend_descended_of_huln_desc: "Я могу проследить свои корни до великого героя Хална Крутогора, который прославил наш народ в Войне Раскола десять тысяч лет назад."
  
