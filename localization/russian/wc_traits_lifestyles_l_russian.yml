 trait_master_pyromancer: "Мастер Пиромантии"
 trait_master_pyromancer_desc: "Мастера Пиромантии — могущественные заклинатели, владеющие разрушительной магией огня: они испепеляют врагов пылающими огнищами, палящими огненными шарами и взрывными заклинаниями, воплощая в бою неукротимую ярость и хаос пламени."
 trait_master_pyromancer_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — $trait_master_pyromancer$. $trait_master_pyromancer_desc$"
 trait_master_cryomancer: "Мастер Криомантии"
 trait_master_cryomancer_desc: "Мастера Криомантии — элитные заклинатели, владеющие магией льда с безупречной точностью: они насылают метели, замораживают врагов намертво и обуздывают леденящую силу мороза, чтобы доминировать и подавлять противников."
 trait_master_cryomancer_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — $trait_master_cryomancer$. $trait_master_cryomancer_desc$"

