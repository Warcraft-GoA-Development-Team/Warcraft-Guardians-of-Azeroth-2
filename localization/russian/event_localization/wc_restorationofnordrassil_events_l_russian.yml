l_russian:
  
 restorationofnordassil_0001_title: "Слава восстановлена"
 restorationofnordassil_0001_desc: "После долгого терпения и веры в [ROOT.Char.GetFaith.HighGodName] Колодец наконец, по всей видимости, получил достаточно собственной силы и мощи, чтобы исцелить себя.\n\nМы, Ночные Эльфы, вновь благословлены его силой, хотя и не в полной мере. Мы проживём на несколько лет дольше, чем смертные расы, но этого довольно для нашей цивилизации в целом."
 restorationofnordassil_0001_a: "Элуна да пребудет со всеми нами!"
