l_english:
 BALNAZZAR_DREADLORD_CUSTOM_STRING_KEY:0 "A dreadlord wears a stolen face and reaches for a throne that was never his to take."

 wc_balnazzar_story.1000.title:0 "A Throne of Ash"
 wc_balnazzar_story.1000.desc:0 "Lordaeron lies gutted below the ramparts, its people fled or bent to the yoke. The Legion bid me hold this ruin as a leash on the mortals who remain, a keeper of ash for masters who will never set foot here.\n\nAnd yet I linger on the throne longer than duty demands. Archimonde is a world away. Kel'Thuzad counts corpses in his own house. No one watches what I do with a broken kingdom - or who I let believe still rules it.\n\nThe crown of Lordaeron would fit no worse on my brow than on any dead king's."
 wc_balnazzar_story.1000.a:0 "This kingdom is mine."
 wc_balnazzar_story.1000.b:0 "I serve the Nathrezim design."

 wc_balnazzar_story.1001.title:0 "A Rival's Gaze"
 wc_balnazzar_story.1001.desc_ambitious:0 "A courier arrives from Varimathras' circles - he sends his regards, and a question dressed as pleasantry: how does a mere keeper come to sign his own decrees?\n\nMy brother-in-arms suspects. He has always suspected. Dreadlords do not trust one another - it is the one lesson the Legion never had to teach us."
 wc_balnazzar_story.1001.desc_loyal:0 "A courier arrives from Varimathras circles, carrying nothing but idle words and an idler warning: the Legion rewards obedience, he says, as if I needed reminding.\n\nI answer with the correct courtesies. Even loyalty, among the Nathrezim, is a kind of performance."
 wc_balnazzar_story.1001.a:0 "Let him suspect. By the time he is certain, there will be no Balnazzar left to accuse."

 wc_balnazzar_story.1002.title:0 "A Face Not His Own"
 wc_balnazzar_story.1002.desc:0 "Saidan Dathrohan kneels where I bid him, Grand Crusader in name, puppet in truth - his faith in the Light is a leash I hold without his knowing.\n\nThe rest is arithmetic. A body found burned past recognition in the throne room. A dreadlord, dead at last, mourned by no one who matters. And underneath the Crusader's steel and prayer, only me.\n\nBalnazzar dies today. Something wearing his patience does not."
 wc_balnazzar_story.1002.a:0 "Wear the mask."

 wc_balnazzar_story.1003.title:0 "Sylvanas Claims Her Due"
 wc_balnazzar_story.1003.desc:0 "Word reaches me of banshees over Lordaeron's capital and riders through Brill unopposed. With the dreadlord dead and Dathrohan still finding his footing, Sylvanas Windrunner did not wait for an invitation.\n\nA duchy, a county - not the throne itself, not yet. A tithe paid for the freedom to remake myself unseen. I let her take it. There will be time to remember whose it was."
 wc_balnazzar_story.1003.a:0 "Let her have her ruins. I have a Crusade to command."

 wc_balnazzar_story.1004.title:0 "A Son's Envy"
 wc_balnazzar_story.1004.desc:0 "Renault watches his brother Darion the way a starving man watches a feast - Alexandros' pride, his martial gift, his birthright. Renault has none of it, and knows it, and it eats at him.\n\nI need only water the seed already planted. A word here about how a father favors one son over another. A suggestion that Alexandros means to disinherit him. None of it needs to be true. It only needs to be believed.\n\nI have, too, quietly assured Kel'Thuzad that the Grand Crusader's death would trouble neither of us. The necromancer asked for nothing but the opportunity - Stratholme's dead are plentiful, and patient."
 wc_balnazzar_story.1004.a:0 "Let the boy prove himself to his father."

 wc_balnazzar_story.1005.title:0 "The Ambush at Stratholme"
 wc_balnazzar_story.1005.desc:0 "Renault leads them in - his father, and Fairbanks, the old priest who has never once doubted Alexandros. Ahead, Stratholme's dead rise in numbers no war council prepared for.\n\nRenault finds a doorway to hide in. Fairbanks goes down first, buried alive beneath a mountain of corpses he cannot claw free of. Alexandros fights alone, and fights well, and fights until his arms will no longer answer him - until Ashbringer slips from his grip and rings against the stone.\n\nRenault steps out of the dark. His father does not even raise a hand against him. The blade that has slaughtered ten thousand of the undead takes a mortal man's life for the first time, and something in it curdles at the wrongness of it - the way faith curdles into zealotry when grief is the only fuel left.\n\nRenault cannot make himself pick it back up. He leaves it beside the body and walks away."
 wc_balnazzar_story.1005.a:0 "Watch the boy become a weapon."

 wc_balnazzar_story.1006.title:0 "Blood on Silver"
 wc_balnazzar_story.1006.desc:0 "Renault comes to me after, hollow-eyed, empty-handed - he could not carry the blade any further than the doorway he killed his father in. I offer him what a father never quite managed - approval, dressed as duty.\n\nThe Order kneels to its Grand Crusader, as it always has. It simply doesn't know yet what he's Grand Crusader of."
 wc_balnazzar_story.1006.a:0 "Let the Scarlet Crusade be born."
 scarlet_crusade_custom_name:0 "Scarlet Crusade"

 wc_balnazzar_story.1007.title:0 "The Inner Circle"
 wc_balnazzar_story.1007.desc:0 "Isillien already sits as Grand Inquisitor of the Scarlet Monastery, and wears the honor like a blade he's eager to use - heresy, to him, is anywhere he decides to look for it. Sally Whitemane wears her ambition more quietly; she has served at this court since before I wore this face, and she is patient enough to let others burn first.\n\nBoth would call themselves loyal. Neither serves anything but their own appetite for what the Crusade should become. I need only decide which appetite is more useful to feed."
 wc_balnazzar_story.1007.a:0 "Let Isillien have his fires."
 wc_balnazzar_story.1007.b:0 "Whitemane's patience serves better."
