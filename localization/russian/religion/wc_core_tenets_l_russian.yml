 tenet_bloody_feast_desc: "Самая ценное чем мы можем пожертвовать - это разумным существом. Кровь идёт к божествам, а плоть можно потреблять, чтобы поглотить мудрость и силу умершего."
  
 doctrine_legions_puppet_name: "$special_doctrine_legions_puppet_name$"
