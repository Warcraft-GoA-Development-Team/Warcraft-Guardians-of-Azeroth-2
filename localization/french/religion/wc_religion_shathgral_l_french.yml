 xavist_desc:0 "Xavius was one of the Highborne's most powerful sorcerers. That all changed when Sargeras transformed him into the first satyr as punishment. Others soon followed. Later he sought to corrupt the Emerald Dream into the Emerald Nightmare under the backing of N'zoth."
