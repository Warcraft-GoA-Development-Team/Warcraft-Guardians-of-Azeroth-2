 lightbound:0 "Lightbound"
 lightbound_adj:0 "Lightbound"
 lightbound_adherent:0 "Lightbound"
 lightbound_adherent_plural:0 "Lightbound"
 lightbound_desc:0 "The Lightbound doctrine drives its adherents to spread the Light universally, converting unbelievers by any means, even force. They see the Light as the path to true peace and justice and will stop at nothing to eliminate what they perceive as obstacles to its unity."
 lightbound_good_god_xera:0 "Xe'ra"
 lightbound_good_god_xera_possessive:0 "Xe'ra's"
 lightbound_good_god_light_mother:0 "the Light Mother"
 lightbound_good_god_light_mother_possessive:0 "the Light Mother's"
 lightbound_creator_god_name:0 "$velenism_good_god_kure$"
 lightbound_creator_god_name_possessive:0 "$velenism_good_god_kure_possessive$"
 lightbound_household_god_name:0 "$velenism_good_god_adal$"
 lightbound_household_god_name_possessive:0 "$velenism_good_god_adal_possessive$"
 lightbound_war_god_name:0 "$lightbound_good_god_xera$"
