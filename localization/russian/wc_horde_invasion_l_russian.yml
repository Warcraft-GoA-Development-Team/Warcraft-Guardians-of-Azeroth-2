l_russian:
  ################################# 
  # Base Events 
  ################################# 
 wc_horde_invasion.medivh.1000.title: "Открытие Тёмного Портала"
 wc_horde_invasion.magic.1000.title: "Могущественное магическое искажение"
 wc_horde_invasion.pale_orcish.1000.title: "Тёмные боги из-за Грани"
 wc_horde_invasion.orcish.1000.title: "Вторжение из Дренора"
 wc_horde_invasion.generic_close.1000.title: "Гроза в Чёрных Топях"
 wc_horde_invasion.medivh.1000.desc: "Всё моё тело дрожит, когда я произношу последние слоги заклинания. Буря ревёт с неистовой яростью, словно сами небеса протестуют против того, что я вот-вот совершу.\n\nПередо мной с жутким грохотом сдвигаются камни, возводя Тёмный Портал — величественный и зловещий. Темная энергия пульсирует в воздухе, магический вихрь кружится вокруг его рамки. Пути назад уже нет...\nЯ поднимаю руки, взывая к силам Пустоты, и с оглушительным раскатом портал раскрывается, выпуская леденящий туман. Я чувствую их, по ту сторону: орков.\n\nИсполнив свой долг, я напрягаю остатки сил, чтобы перенестись в Каражан. Разжигаю огонь и валюсь перед пламенем, выдыхая с горечью. Этот проклятый колдун... он, без сомнения, предаст нас, но пусть ждёт, когда мы сочтём его достойным внимания. Судьба Азерота теперь решена, и то, что я сделал сегодня, принесёт в наш мир эпоху хаоса и беспрецедентных разрушений."
 wc_horde_invasion.draenor_first_part_general.1000.desc: "«[guldan.GetFirstNameNoTooltip] был прав! По ту сторону портала нас ждёт иной мир!» — воскликнул во главе разведчиков их вождь. Дикий рёв охватил Орду. [guldan.GetFirstName] поставил на кон свою голову, и если бы портал никуда не привёл, [guldan.GetSheHe] отправил бы всех [guldan.GetHerHis] фанатиков в могилу."
 wc_horde_invasion.draenor_first_part_shadow_council.1000.desc: "«[guldan.GetFirstNameNoTooltip] был прав! По ту сторону портала — целый новый мир!» — прозвучал крик вождя разведчиков, и дикий рёв охватил Орду. Я выдыхаю с облегчением. [guldan.GetFirstName] действительно поставил на кон свою голову: если б портал завёл нас в пустоту, мы бы все последовали за [guldan.GetHerHim] в смерть."
 wc_horde_invasion.draenor_first_part_guldan.1000.desc: "«Я не ошибся!» — захлебнулся радостным криком воин-разведчик. «Там, за порталом, лежит мир!» Дикий рёв охватил Орду. Я выдыхаю, чувствуя, как спадает напряжение. Всё моё могущество было поставлено на кон: если б портал вывел в никуда, меня бы содрали заживо и скормили воргам."
 wc_horde_invasion.draenor_second_part_general.1000.desc: "«Вперёд!» — проревел [blackhand.GetDynastyHouseNameNoTooltip], вскинув своё оружие в сторону портала. Вслед за этим [blackhand.GetPrimaryTitle.GetName|l] двинулись как единое целое."
 wc_horde_invasion.draenor_second_part_warchief.1000.desc: "«Вперёд!» — заревел я, вскидывая своё оружие к порталу. И вот [blackhand.GetPrimaryTitle.GetName|l] единым строем устремились вперёд."
 wc_horde_invasion.warchief_draenor.1000.desc: "$wc_horde_invasion.draenor_first_part_general.1000.desc$\n\nЯ стою на передовой, сжимая оружие, глядя в закрученный хаос портала. Земля дрожит, воздух вибрирует от силы. Дороги назад больше нет.\n\n$wc_horde_invasion.draenor_second_part_warchief.1000.desc$ Когда я перехожу порог, Дренор исчезает позади. Свет и звук схлопываются в бушующий шторм красок, прежде чем раствориться в пустоте. Меня несёт сквозь необъятность космоса.\n\nА затем — всё обрывается. Я валюсь вперёд, ступни погружаются в холодную, густую грязь. Вокруг во все стороны тянется бесконечная трясина, а позади меня в портал прорывается Орда.\n\n#EMP #bold \"Так вот она — Азерот… будущий мир орков!#!#!\""
 wc_horde_invasion.warchief_shadow_council_draenor.1000.desc: "$wc_horde_invasion.draenor_first_part_shadow_council.1000.desc$\n\nЯ стою во главе войска, сжимаю оружие, глядя на бурлящий портал. Воздух пропитан скверной, каждый вихрь силы напоминает о посулах [guldan.GetFirstNamePossessiveNoTooltip].\n\n$wc_horde_invasion.draenor_second_part_warchief.1000.desc$ Шаг за грань — и Дренор остаётся позади. Свет и звук сходятся в буран красок и меркнут в пустоте Круговерти Пустоты, где я вижу осколки прочих миров. Все они горят в огне Скверны.\n\nВдруг всё обрывается. Я проваливаюсь в холодную, грязную жижу. Вокруг тянутся бескрайние болота, а за моей спиной из портала хлынула Орда.\n\n#EMP #bold Значит, вот он, Азерот — будущее владение орков!#!#!"
 wc_horde_invasion.guldan_draenor.1000.desc: "$wc_horde_invasion.draenor_first_part_guldan.1000.desc$\nС трудом я поднимаюсь на возвышение, опираясь на посох. Мой голос звучит над собравшейся Ордой:\n\n«Стихии нас предали, но я — нет. Благодаря моей силе мы обрели новый мир, куда более плодородный, чем умирающий Дренор. Да, нас ждут битвы, но я знаю: вы, сильнейшие воины нашего рода, одолеете все преграды. Их земли станут нашими, их народы склонятся, а их богатства послужат нашему будущему. Спасение Дренора — в завоеваниях! За Орду!»\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ Я переступаю порог портала, и хаос Круговерти Пустоты поглощает меня. Впереди — Азерот, край, готовый склониться перед моим могуществом. Здесь всё преклонится пред #EMP #bold мной#!#!, пред #EMP #bold Ордой#!#!."
 wc_horde_invasion.chogall.1000.desc: "$wc_horde_invasion.draenor_first_part_shadow_council.1000.desc$\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ Я перехожу сквозь портал — и всё меняется. Воздух, свет — сама суть реальности дрожит, когда я вхожу в неведомое.\n\nПробираясь через Круговерть Пустоты, я вижу иные миры: каждый искажён пугающей гротескностью, там обитают существа форм, слишком совершенных для понимания. На некоторых планетах я замечаю Полчища Пылающего Легиона, ведущие войны. Но они не побеждают.\n\nЯ вскрикиваю и зажмуриваюсь. Когда распахиваю глаза, видение исчезает, и меня окатывает сырость новых земель. Я в болоте, сотни орков выходят следом из портала... Значит, вот мир, который обещал нам [guldan.GetFirstNameNoTooltip]."
 wc_horde_invasion.twilights_hammer.1000.desc: "$wc_horde_invasion.draenor_first_part_general.1000.desc$\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ Шагнув сквозь портал, я слышу, как шёпот превращается в хор голосов. Их песнь не предназначена смертным, но наполняет меня РЕШИМОСТЬЮ. Воздух тяжелеет, а реальность рушится, когда я пересекаю границу неведомого.\n\nВ Круговерти Пустоты я вижу их: миры совершенной красоты, где существуют формы за гранью понимания. На некоторых планетах Пылающий Легион ведёт свою войну, но не одерживает верх.\n\nЯ склоняю голову, чувствуя себя недостойным узреть такое величие. Когда открываю глаза, видение меркнет, я в болоте, а сотни орков выходят из портала. Значит, вот он, край, который обещал нам [guldan.GetFirstNameNoTooltip]."
 wc_horde_invasion.shadow_council.1000.desc: "$wc_horde_invasion.shadow_council.1000.desc$\nЯ стою в первых рядах толпы, собравшейся у портала. Воздух насыщен скверной, каждая её вспышка напоминает о силе [guldan.GetFirstNamePossessiveNoTooltip]. Он поднимается на помост, опираясь на посох, и обращается к Орде:\n\n«Стихии отвернулись от нас, но я не отвернусь! Я нашёл нам новый мир — земли богаче и плодороднее, чем умирающий Дренор. Да, нас ждут битвы, но вы — сильнейшие, вы одолеете любые преграды. Их земли, их народы, их богатства станут нашими. Спасение Дренора — в наших завоеваниях! За Орду!»\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ Я переступаю портал, и бурлящий хаос Круговерти Пустоты поглощает меня. Впереди — Азерот, мир, готовый пасть перед нашей мощью. Он станет трофеем орков во имя демонов!"
 wc_horde_invasion.orcish_shamanism.1000.desc: "$wc_horde_invasion.draenor_first_part_general.1000.desc$\nЯ стою во главе толпы, собравшейся у портала. [guldan.GetFirstNameNoTooltip] поднимается на возвышение, тяжело опираясь на посох, и вещает Орде:\n\n«Стихии нас бросили, но я — нет. Я отыскал для нас новый мир, плодороднее погибающего Дренора. Да, битвы неизбежны, но вы — сильнейшие из нашего народа, вы победите. Спасём Дренор завоеванием! За Орду!»\n\nОрда снова взрывается рёвом, но я молча выхожу вперёд. Так велел Вождь, и я переступаю порог портала. Вспышка света, сплетение теней — и я падаю в холодную, грязную жижу. Передо мной тёмное болото.\n\n#EMP #bold Вот он, Азерот. Здесь мы начнём заново.#!#!"
 wc_horde_invasion.draenor.1000.desc: "$wc_horde_invasion.draenor_first_part_general.1000.desc$\nЯ стою впереди, среди толпы у портала. [guldan.GetFirstNameNoTooltip] поднимается на возвышение, тяжело опираясь на свой посох, и обращается к Орде:\n\n«Стихии нас предали, но я — нет. Я отыскал для нас новый мир — землю, богаче и плодороднее, чем умирающий Дренор. Да, нас ждут битвы, но вы — сильнейшие из всех кланов. Спасение Дренора — в покорении чужих земель! За Орду!»\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ У меня учащённо бьётся сердце, когда я вместе с ордами воинов рвусь к порталу. Вспышка света, тени закручиваются, и я погружаюсь в пустоту. Когда вновь обретаю почву под ногами, я по колено в холодной грязи. Болото вокруг источает смрад гниения, но в нём чувствуется обещание возможностей.\n\n#EMP #bold Это Азерот. Мир, что ляжет к нашим ногам.#!#!"
 wc_horde_invasion.evil_magic.1000.desc: "Мою концентрацию разрывает волна энергии Скверны — столь чистая и мощная, что мне не с чем её сравнить. Я пытаюсь прикоснуться к этому колоссальному источнику, но могу охватить лишь малую часть. Просто захватывает дух — это словно вкусить каплю чего-то запредельного.\n\nНо что происходит?\n\nЯ выглядываю наружу и вижу сияние ауроры Скверны — гигантский столп света, пронзающий небо где-то на юго-востоке. Воздух ещё вибрирует от отголосков, словно сам мир не в силах удержать такую мощь. Большинство простых смертных, вероятно, не заметили этого явления, но все маги мира не могли не почувствовать столь чудовищный всплеск.\n\nКогда удар стихает, в моём сознании вспыхивает видение: огромный портал, разорванный в небытии, ведущий на землю, пропитанную Скверной и нежитью. Печатать Легиона очевидна. Неужели это и правда они?"
 wc_horde_invasion.good_magic.1000.desc: "Моё внимание неожиданно отвлекает внезапная волна энергии Скверны, столь мощной и незнакомой, что воздух вокруг словно искажается. Магия вокруг меня содрогается, диссонируя с привычным ритмом мира. В воздухе тяжесть, почти невыносимая, всё пропитано чем-то чуждым и враждебным. Инстинктивно я призываю свои внутренние силы и начинаю очищать себя и окрестности от этой коварной порчи.\n\nЧто происходит?\n\nВглядевшись вдаль, замечаю в небе сияние скверной ауры — яркий столп, пронзающий небеса на юго-востоке. Вибрации ещё отдаются в земле, словно сам мир сопротивляется этой сокрушающей силе. Вероятно, многие не почувствовали этих изменений, но все, кто владеет магией, не могли не уловить этот удар.\n\nВ глубине души я знаю: это не простое искажение. Это знак куда большего зла."
 wc_horde_invasion.elemental_magic.1000.desc: "Стихии вдруг начинают кричать вокруг меня, их голоса полны боли — это чёрная энергия невиданной мощи пронзает мир. Моё сознание захлёстывают эти крики, и я падаю на колени.\n\nЧто происходит?\n\nЯ с ужасом озираюсь и вижу, как в небе взметнулся поток демонической энергии, исходящий откуда-то на юго-востоке. Стихии содрогаются вокруг меня, вибрируя от ярости и ужаса, будто пытаются сдержать эту силу. Это не обычное колебание магии. Я уверен, что многие в мире ощутили это демоническое вторжение.\n\nДухи тревожны. Они шепчут, что нашему миру грозит нечто ужасное."
 wc_horde_invasion.fallback_magic.1000.desc: "Я резко останавливаюсь: мир будто сотрясается под натиском неведомой мощи. В воздухе колеблется нечто невидимое, но поразительно ощутимое. Всё вокруг словно погрузилось в липкий, удушающий туман. Чувствую, как это проникает даже в землю под ногами.\n\nЧто это?\n\nВзглянув в небеса, замечаю сияние скверной, пронзающее их — угрожающее пламя, исходящее где-то с юго-востока. Под ногами вибрация — отголоски древней силы, непоколебимой и мрачной. Не знаю, что это, но уверен в одном: я не единственный, кто это почувствовал.\n\nЧто-то переменилось. И это уже не обратить вспять."
 wc_horde_invasion.generic_close.1000.desc: "Над Чёрными Топями разразилась странная буря. Гром гремит так, что слышен за многие мили. Ливень идёт беспрерывно и здесь, и воздух словно давит на грудь, будто невидимая тяжесть повисла над местностью.\n\nНо это ещё не всё.\n\nПоползли слухи о зеленокожих существах, нападающих на путников и караваны. Это не тролли, не гоблины — кто-то другой. Выжившие рассказывают о массивных силуэтах в дождевой пелене, о свирепых воинах с пламенными глазами. Караваны грабят, многие исчезают бесследно.\n\nНикто не знает, что это за твари. Но при таких бурях и этих засадах Чёрные Топи становятся местом, куда не стоит соваться."
 wc_horde_invasion.1000.medivh: "Вот и началось... Конец этого мира."
 wc_horde_invasion.1000.magic: "Добром это не кончится."
 wc_horde_invasion.1000.orcish_warchief_and_shadowlord: "Орда сокрушит этот мир!"
 wc_horde_invasion.1000.orcish_shamanic: "Надо спасти наш народ."
 wc_horde_invasion.1000.orcish: "Победа или смерть!"
 wc_horde_invasion.1000.draenor_not_horde: "Новый мир для нас."
 wc_horde_invasion.1000.stormwind_king: "Надо выяснить, что там происходит."
 wc_horde_invasion.1000.generic_close: "Похоже, грядёт нешуточная буря."
  
  # Horde Fatigue 
 wc_horde_invasion.1001.title: "Усталость Орды"
 wc_horde_invasion.1001.desc: "Пора прекратить эту резню. Орда захватила достаточно земель, чтобы начать новую жизнь в Азероте. Многие орки возвращаются к своим семьям, вонзая топоры в землю и клянясь забыть о крови и ужасах войны, через которые пришлось пройти. Полководцы Орды ещё представляют угрозу некоторым землям Азерота, но самые кровопролитные битвы позади, ведь кланы больше не видят смысла в сохранении единой Орды."
 wc_horde_invasion.1001.a: "Оркам нужен свой Вождь!"
 wc_horde_invasion.1001.b: "Каждый пойдёт своей дорогой."
 wc_horde_invasion.1002.title: "$wc_horde_invasion.1001.title$"
 wc_horde_invasion.1002.desc: "$wc_horde_invasion.1001.desc$"
 wc_horde_invasion.1002.orcish.a: "Ордам нужен Вождь!"
 wc_horde_invasion.1002.a: "Нам нужен наш Вождь!"
 wc_horde_invasion.1002.orcish.b: "$wc_horde_invasion.1001.b$"
 wc_horde_invasion.1002.b: "Всё кончено..."
 wc_horde_invasion.1003.title: "$wc_horde_invasion.1001.title$"
 wc_horde_invasion.1003.desc: "$wc_horde_invasion.1001.desc$"
 wc_horde_invasion.1003.a: "Нам нужен наш Вождь!"
 wc_horde_invasion.1003.b: "Всё кончено..."
  
  # Assault on Stormwind 
 wc_horde_invasion.1004.title: "Нападение на [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 wc_horde_invasion.1004.desc: "Выходя из шатра, я вижу, как пылающий свет факелов выхватывает из тьмы решительные лица моих воинов. Их взоры устремлены на меня, когда я поднимаю оружие высоко, чтобы привлечь внимание, и с рёвом восклицаю:\n\n$warchief_speech_stormwind$"
 wc_horde_invasion.1004.a: "Победа или смерть! Сжечь их дома дотла!"
 wc_horde_invasion.1004.a.flavor: "Грумы отвечают яростными криками! Военная машина трогается с места, и уже ощущается, как сама судьба склоняется на нашу сторону. Стены Штормграда падут!"
 wc_horde_invasion.1005.title: "Речь нашего Вождя"
 wc_horde_invasion.other.1005.title: "Рык орков"
 wc_horde_invasion.1005.desc: "Всполохи факелов освещают лица воинов, собравшихся вокруг [warchief.GetTitleAsNameNoTooltip]. Я стою среди них, чувствуя напряжение в воздухе, когда [warchief.GetDynastyHouseNameNoTooltip] выходит из шатра. [warchief.GetSheHe] вскидывает оружие, рыча:\n\n$warchief_speech_stormwind$"
 wc_horde_invasion.orcish_shamanism.1005.desc: "Факелы отбрасывают пляшущие тени на лица собравшихся воинов. Я стою чуть в стороне, напряжённо слушая, как [warchief.GetDynastyHouseNameNoTooltip] выходит из шатра. [warchief.GetSheHe|U] поднимает оружие, рыча:\n\n$warchief_speech_stormwind$"
 wc_horde_invasion.other.1005.desc: "Издали я вижу, как сотни огней рассекают мрак топи. Я осторожно подкрадываюсь, ведомый любопытством, и вижу сотни силуэтов вокруг шатра. Пронзительный низкий голос гремит над толпой.\n\nЯ не понимаю ни слова, но каждый рёв пронизан первобытной яростью. Когда речёвка заканчивается, всё взрывается оглушительным кличем, и эти существа начинают движение.\n\nПохоже, они к чему-то готовятся."
 wc_horde_invasion.1005.a: "Лок’тар огар! Кровь и гром!"
 wc_horde_invasion.orcish_shamanism.1005.a: "И я буду сражаться!"
 wc_horde_invasion.other.1005.a: "Лучше мне уйти отсюда."
 warchief_speech_stormwind: ""Слабые людишки прознали о наших вылазках. Вместо того чтобы биться и защищать свои земли, эти трусы побежали пресмыкаться перед своим [king_of_stormwind.GetTitleAsNameNoTooltip|l]. Скауты доносят, что он шлёт лазутчиков в Чёрные Топи, чтоб узнать наши планы. Но это не меняет сути! Кто-то в их совете уже дрожит, твердя о бегстве на север за подмогой. Мы не можем этого допустить!\n\nВоины [warchief.GetPrimaryTitle.GetBaseNameNoTooltip], этот проклятый топкий край — не место, где мы создадим свою судьбу. [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] должен пасть, а мы оставим лишь пепел и отчаяние, чтобы искоренить все эти жалкие королевства!""
 wc_horde_invasion.1006.title: "$wc_horde_invasion.1004.title$"
 wc_horde_invasion.1006.desc: "[warchief.GetTitleAsNameNoTooltip] [warchief.GetDynastyHouseName] объявил войну людям. Тысячи громов уже идут через Пограничье, чтобы обрушиться на земли [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. В течение недель небольшие отряды орков бесчинствовали на человеческих заставах, вырезали деревни и жгли их хлипкие храмы. Теперь их [king_of_stormwind.GetTitleAsNameNoTooltip|l] встревожен и, как шепчутся, готов взывать к помощи севера.\n\n[warchief.GetDynastyHouseNameNoTooltip] обещает нам богатые и плодородные земли, если [warchief.GetPrimaryTitle.GetBaseNameNoTooltip] уничтожит врагов и покорит слабые расы, живущие в этом мире. Лок’тар огар, воины: смерть людям!"
 wc_horde_invasion.orcish_shamanism.1006.desc: "[warchief.GetTitleAsNameNoTooltip] [warchief.GetDynastyHouseName] объявил войну людям. Тысячи громов идут через Пограничье, намереваясь занять земли [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. Недельные вылазки и беспощадные нападения на их селения уже показали, насколько жестока Орда. Говорят, их [king_of_stormwind.GetTitleAsNameNoTooltip|l] может призвать подмогу с севера.\n\n[warchief.GetDynastyHouseNameNoTooltip] говорит о плодородных землях и будущем для нашего народа — о том, что мы утратили на Дреноре. Но наш путь будет вымощен кровью. Лок’тар огар, я буду сражаться тоже!"
 wc_horde_invasion.1006.a: "$wc_horde_invasion.1005.a$"
 wc_horde_invasion.orcish_shamanism.1006.a: "$wc_horde_invasion.orcish_shamanism.1005.a$"
 wc_horde_invasion.1007.title: "$wc_horde_invasion.1004.title$"
 wc_horde_invasion.1007.desc: "«[ROOT.Char.GetLadyLord|U]!», — воскликнул запыхавшийся слуга, подбегая ко мне, когда я занимался своими делами. Прижавшись ближе к уху, он шёпотом сообщил тревожную весть.\n\n[warchief.GetPrimaryTitle.GetBaseName] прорвали Пограничье и разворачивают наступление на наши земли. Уже сотни беженцев бегут дальше в глубь страны, их крики отчаяния и страха умоляют нас о защите.\n\nВремени мало. Надо принимать решение немедленно, прежде чем эти неистовые зелёнокожие не достигнут наших стен и не обратят всё в пепел."
 wc_horde_invasion.king.1007.desc: "Вернулись разведчики, что отсылались в Чёрные Топи. Ряды их поредели, лица измождены. Их командир, с гримасой усталости, докладывает:\n\n«[ROOT.Char.GetLadyLord|U], положение куда хуже, чем мы ожидали. Эти зелёнокожие не тролли. И их куда больше, чем мы могли предположить!»\n\nОн описывает их беспощадность, их странные ритуалы и загадочное происхождение. Один из придворных бросает мне полный тревоги взгляд: угроза куда серьёзней, чем многие могли поверить, а кое-кто в Палате Знати по-прежнему не желает верить страшным отчётам.\n\nЧто же на самом деле происходит? Неужели это [Glossary( 'Апокалипсис', 'APOCALYPSE_RENILASH_GLOSS' )]? Как бы то ни было, всё решится в бою."
 wc_horde_invasion.medivh.1007.desc: "До сих пор мне удавалось заглушать голоса, что так долго терзали меня... Те самые, что заставили меня привести [warchief.GetPrimaryTitle.GetName] сюда из их мира.\n\nПрисягнув на верность [king_of_stormwind.GetName], я впервые ослушался их велений, и их бесконечные упрёки переросли в ярость и угрозы. Моя ментальная энергия истощается от постоянных мигреней и галлюцинаций.\n\nИ вот настал день, о котором предупреждали голоса: мои деяния принесли войну в наше славное королевство. Моя погибель, говорят они, теперь почти неизбежна.\n\nЯ должен сохранять видимость — [king_of_stormwind.GetTitleAsNameNoTooltip] не должен узнать о том, что я натворил!"
 wc_horde_invasion.1007.a: "Пусть нас защитит [ROOT.Char.GetFaith.WarGodName]..."
 wc_horde_invasion.1007.b: "Готовьте оборону!"
 wc_horde_invasion.1007.c: "Может, они пощадят меня, если я принесу голову [king_of_stormwind.GetFirstNamePossessive]."
 wc_horde_invasion.king.1007.a: "Наши рыцари дадут им отпор."
 wc_horde_invasion.king.1007.b: "Пусть идут."
 wc_horde_invasion.medivh.1007.opt: "Это выше моих сил!"
 horsemen_brotherhood_of_the_horse_effect_tt: "Сразу же к вам присоединятся 300 закованных в латы всадников."
 pikemen_brotherhood_of_the_horse_effect_tt: "Вы снабдите 800 бойцов Братства Коневодов копьями."
 brotherhood_of_the_horse_army: "Братство Коневодов"
 wc_horde_invasion.1008.desc: "До двора дошла весть о том, что новый враг прорвался в пределы [GetTitleByKey('k_stormwind').GetName]. Разведчики сообщают, что эти воины пришли через недавно открытый Тёмный портал.\n\nОни называют могучего зверя [warchief.GetTitleAsNameNoTooltip], а тех, кто следует за [warchief.GetHerHim], — [warchief.GetPrimaryTitle.GetBaseName]. Они уже начали опустошать земли [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], уничтожая всё на своём пути.\n\n[king_of_stormwind.GetTitleAsNameNoTooltip] призвал всех способных держать оружие встать под ружьё, и народ готовится к худшему."
 wc_horde_invasion.1008.medivh.desc: "Всё случилось так, как я и боялся. Орки, завершив приготовления к войне, двинулись походом на мою родину — [GetTitleByKey('k_stormwind').GetName]. Я знаю, что они, ослабленные войной, что велась много лет назад, не смогут выдержать этой угрозы.\n\nГолос вернулся — на этот раз он настойчиво предупреждает:\n«Теперь ты их враг! Встанешь сражаться — и они убьют тебя как предателя!»\n\nКаждый раз, когда я пытаюсь противиться его воле, голос становится всё громче и настойчивее. Сон приходит урывками, принося видения моей смерти — моё бездыханное тело, повешенное на стенах [GetTitleByKey('b_stormwind').GetNameNoTier].\n\nКак мне противостоять захватчикам, столь ослабленному в силе и разуме? Стоит ли снова довериться голосу?"
 wc_horde_invasion.1008.a: "Тяжёлые вести."
 wc_horde_invasion.medivh.1008.a: "...Что же я натворил?"
 wc_horde_invasion.1008.b: "Я откликнусь на призыв [king_of_stormwind.GetTitleAsNameNoTooltip]!"
 wc_horde_invasion.human.1008.b: "[king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]... Это мой народ. Я обязан сражаться."
  
  ################################# 
  # Introduction Events 
  ################################# 
  # Blackhand 
 wc_horde_invasion.1501.title: "Воплощение Тьмы"
 wc_horde_invasion.1501.desc: "Портал сработал, как и обещал тот маг. Но на этот раз я не буду пешкой — я буду властвовать. [Glossary( 'Мой бывший наставник', 'NERZHUL_GLOSS' )] доверился такому же прорицателю, и потерял всё, как и я. Кил’джеден заставил меня истребить дренеев, [Glossary( 'опустошить Дренор', 'HAND_OF_GULDAN_GLOSS' )], поработить Орду моим шедевром — [Glossary( 'Кровью Маннорота', 'BLOOD_OF_MANNOROTH_GLOSS' )]. И всё ради умирающего мира, раздираемого кланами, что бьются за остатки жизни, отвергнувших моё пророчество возвышения! Но Дренор остался позади. Впереди — Азерот, полный возможностей для завоеваний.\n\nЭтот портал даёт нам этот мир, полный разобщённых королевств и жалких владык... Они сгорят, но не для него. Я изучил пути Кил’джедена, и этот маг будет не лучше. Он проговорился об Осквернённой Гробнице Саргераса лишь раз — мне этого хватило. [stormwind_holder.GetPrimaryTitle.GetNameNoTier] падёт, как он и велел. Потом он расскажет мне о её тайнах… #EMP #bold прежде чем я раздавлю его!#!#!"
 wc_horde_invasion.1501.a: "А Совет Теней станет моим клинком!"
 wc_horde_invasion.1501.a.flavor: "Совет Теней — моё главное оружие. Мои агенты и прислужники повсюду в Орде, даже среди потенциальных врагов внутри неё. Они по-прежнему верят в меня, уверенные, что я вознесу их к могуществу. Сила Орды теперь в моих руках."
 wc_horde_invasion.1501.a_alternative: "Мне придётся восстанавливать Совет, иначе пропаду."
 wc_horde_invasion.1501.a_alternative.flavor: "Совет Теней разбит. Большинство его членов мертвы или предало меня, я почти беззащитен. Многие в Орде не забыли, как мои деяния едва не уничтожили их. Без агентов и влияния мне будет непросто подчинить их себе."
 wc_horde_invasion.1501.b: "Чернорук точно предаст меня."
 wc_horde_invasion.1501.b.flavor: "Чернорук слишком честолюбив, чтобы надолго сохранить верность. Он знает, что я вознёс его на трон Вождя из корыстных побуждений, и ненавидит верёвки, за которые я дёргаю. Однажды он попытается сбросить меня, чтобы править Ордой безраздельно — лучше ударить первым."
 wc_horde_invasion.1502.title: "Предатель орков"
 wc_horde_invasion.1502.desc: "Уже не первый год [guldan.GetFirstName] собирал орков у [Glossary( 'Трона Кил’джедена', 'THRONE_OF_KILJAEDEN_GLOSS' )], где поил их своей [Glossary( '«жертвой»', 'BLOOD_OF_MANNOROTH_GLOSS' )]. Этот напиток давал им немыслимую ярость, но вёл к порче, истончая их души и окрашивая кожу в зелень. С отвращением я запретил [ROOT.Char.GetCulture.GetCollectiveNoun] пить это варево, но даже этого оказалось мало — кожа наша тоже позеленела, а внутри растёт жажда крови.\n\nКланы, оставшиеся на Дреноре, погрузились в дикое безумие. [ROOT.Char.GetLiege.GetFirstName] выбрал самых разумных из них, как нас, чтобы вести их сюда, в Азерот."
 wc_horde_invasion.1502.opt.a: "[durotan_character.GetFirstNameNoTooltip] нужно устранить немедленно."
 wc_horde_invasion.1502.opt.b: "Этим вопросом придётся заняться после нашей победы."
 wc_horde_invasion.1502.opt.c: "Сейчас придётся уважать тех, кто хранит старые обычаи."
  # Gul'dan 
 wc_horde_invasion.1511.title: "Воплощение Тьмы"
 wc_horde_invasion.1511.desc: "Портал сработал, как и обещал тот маг. Но на этот раз я не буду пешкой — я буду властвовать. [Глоссарий( 'Мой бывший наставник', 'NERZHUL_GLOSS' )] доверился такому существу, и потерял всё, как и я. Кил'джеден заставил меня истребить [GetTrait('creature_draenei').GetName(GetNullCharacter)], [Глоссарий( 'разрушить стихии', 'HAND_OF_GULDAN_GLOSS' )] Дренора и поработить Орду — мой шедевр — посредством [Глоссарий('Крови Маннорота', 'BLOOD_OF_MANNOROTH_GLOSS')]. И всё ради умирающего мира, враждующих кланов, дерущихся за последние крохи жизни, и утраты их веры в меня — пророка их возвышения! Но этот умирающий мир остался позади. Впереди — Азерот, созревший для завоевания.\n\nЭтот портал даёт нам этот мир — землю разделённых королевств и жалких владык... Они сгорят, но не ради него. Я изучил пути Кил'джедена, и этот маг будет не лучше. Он лишь раз обмолвился о Гробнице Саргераса, но мне этого довольно — я знаю, что она существует. [stormwind_holder.GetPrimaryTitle.GetNameNoTier] сгорит, как он и приказал. А потом он откроет мне свои тайны… #EMP #bold прежде чем я раздавлю его!#!#!"
 wc_horde_invasion.1511.a: "И Совет Теней станет моим клинком!"
 wc_horde_invasion.1511.a.flavor: "Совет Теней — твоё главное оружие. Твои агенты и прислужники повсюду в Орде, даже среди твоих внутренних врагов. Они по-прежнему верят в тебя, уверенные, что ты вознесёшь их к могуществу рядом с собой. Сила Орды — в твоих руках."
 wc_horde_invasion.1511.a_alternative: "Мне придётся восстанавливать Совет, иначе я пропал."
 wc_horde_invasion.1511.a_alternative.flavor: "Совет Теней разбит. Большинство его членов мертвы или предали тебя, и ты почти беззащитен. Многие в Орде не забыли, как твоё руководство едва не привело их к гибели. Без агентов и влияния тебе будет непросто противостоять им."
 wc_horde_invasion.1511.b: "Чернорук точно предаст меня."
 wc_horde_invasion.1511.b.flavor: "Чернорук слишком честолюбив, чтобы надолго сохранить верность. Он знает, что ты управлял его возвышением, и ненавидит верёвки, за которые его дёргают. Однажды он попытается сбросить тебя, чтобы править Ордой безраздельно — лучше ударить первым."
 wc_horde_invasion.1512.title: "Мой любимый питомец"
 wc_horde_invasion.1512.desc.intro: "Моя слуга, [garona_character.GetFirstName]. Полукровка нашего мира, [garona_character.GetSheHe] сочетает чистую силу [garona_character.GetHerHis] матери-дренейки и хитрость [garona_character.GetHerHis] отца-орка. С помощью псионических техник, которым нас обучили [Глоссарий( 'Бледные орки', 'PALE_ORCS_GLOSS' )], глушащих [garona_character.GetHerHis] моральные устои и своеволие, [garona_character.GetSheHe] с рождения готовилась стать идеальной убийцей.  \n\nТеперь, когда мы обосновались в Азероте, самое время привлечь Гарона к её работе."
 wc_horde_invasion.1512.desc.canon_directive: "Целью станет не кто иной, как король Штормграда Лэйн — наш враг в грядущей войне. Приманкой послужат сведения о предательстве мага Медива, чья полезность вскоре иссякнет."
 wc_horde_invasion.1512.desc.player_driven: "Итак, на кого мне натравить моего самого ценного и любимого питомца?"
 wc_horde_invasion.1512.opt.a: "[stormwind_holder.GetTitledFirstName] падёт от [garona_character.GetHerHis] клинка и моей воли!"
 wc_horde_invasion.1512.opt.a.1.tt: "[garona_character.GetFirstName] отправится в [stormwind_holder.GetCapitalLocation.GetTitle.GetBaseNameNoTier], чтобы посеять хаос в [stormwind_holder.GetPrimaryTitle.GetName] и раздор в рядах врага."
 wc_horde_invasion.1512.opt.a.2.tt: "[garona_character.GetFirstNameNoTooltip] может быть [заключён|E] в зависимости от искусства [тайного_канцлера|E] [stormwind_holder.GetTitledFirstNamePossessive]."
 wc_horde_invasion.1512.opt.b: "Её клинок обеспечит мне трон Орды."
 wc_horde_invasion.1512.opt.c: "Она поможет мне в любых делах, какие я сочту нужными."
 wc_horde_invasion.1512.opt.c.tt: "[garona_character.GetFirstName] останется при вашем дворе."
  
  # Durotan 
 wc_horde_invasion.1521.title: "Предатель орков"
 wc_horde_invasion.1521.desc: "Уже не первый год [guldan_character.GetFirstName] собирал орков у [Глоссарий( 'Трона Кил'джедена', 'THRONE_OF_KILJAEDEN_GLOSS' )], предлагая им свой [Глоссарий( '"дар"', 'BLOOD_OF_MANNOROTH_GLOSS' )]. Этот напиток давал нам силу, но вместе с тем окрашивал нашу кожу в зелень и пробуждал глубочайшую жажду крови и насилия. В ужасе от увиденного я запретил [ROOT.Char.GetCulture.GetCollectiveNoun] прикасаться к нему. Но этого оказалось мало — наша кожа тоже позеленела, и я уже вижу, как кровожадность закрадывается в наши сердца.\n\nКланы, оставшиеся на Дреноре, погрузились в дикое безумие. [ROOT.Char.GetLiege.GetFirstName] отобрал лишь тех, в ком осталась хотя бы искра разума — таких, как мы, — чтобы вести их сюда, в Азерот."
 wc_horde_invasion.1521.desc_normal_outro: "\n\n[orgrim_character.GetFirstName] по-прежнему сомневается во мне: он утверждает, что один орк не способен уничтожить целый мир. Однако земля вокруг портала уже увядает, как это было на Дреноре. #EMP Проклятие на голову [guldan_character.GetFirstNameNoTooltip]!#! Если его не остановить, нашему народу суждена лишь гибель."
 wc_horde_invasion.1521.desc_no_ogrim_outro: "\n\nПрочие кланы и слушать не желают: говорят, один орк не способен уничтожить мир. Однако земля вокруг портала уже увядает, как это было на Дреноре. #EMP Проклятие на голову [guldan_character.GetFirstNameNoTooltip]!#! Если его не остановить, нашему народу суждена лишь гибель."
 wc_horde_invasion.1521.desc_no_more_corruption_outro: "\n\nГул'дан ушёл, но его прихвостни всё ещё здесь, и порча разъедает наш народ изнутри. Нужно что-то делать — духи взывают к отмщению."
 wc_horde_invasion.1521.a: "Проклятый чернокнижник!"
 wc_horde_invasion.1521.a.flavor: "Гул'дану это не сойдёт с рук! Нельзя позволить Азероту умереть, как Дренор, и нельзя бесконечно захватывать новые миры. Однажды он ответит за свои злодеяния."
 wc_horde_invasion.1521.a_alternative: "Порча пройдёт."
 wc_horde_invasion.1521.a_alternative.flavor: "Ты делаешь глубокий вдох, убеждая себя, что с уходом Гул'дана порча со временем рассеется. Но в глубине разума таится тень сомнения — ты по-прежнему ощущаешь её хватку на своём народе, как ни старайся отрицать это."
 wc_horde_invasion.1521.b: "Пока мне придётся идти с остальными кланами."
 wc_horde_invasion.1521.b.flavor: "Привкус поражения горчит на языке. Остальные кланы уже избрали свой путь и не желают слушать — пока тебе придётся подчиниться, склонившись перед волей демонов. Тебе нужно время — время, чтобы найти момент, когда ты сможешь спасти свой народ."
  # Doomhammer 
 wc_horde_invasion.1531.title: "Путь к славе"
 wc_horde_invasion.1531.desc: "Топь пожирает нас. С каждым шагом мои рубаки всё глубже увязают в трясине. Позади меня один из них осмеливается ворчать: «#EMP Нам место на поле боя!#!» Один мой взгляд — и он замолкает. Эта топь, быть может, беспощадна, но я — куда более.\n\nСо времён [Glossary( 'войны с ограми', 'OGRE_BLACKROCK_WAR_GLOSS' )] я служу [blackhand_character.GetFirstNamePossessive] заместителем и носителем Роковой Кувалды. Это бремя давит на мою руку так же тяжко, как и на душу. Когда [guldan_character.GetFirstName] предложил [guldan_character.GetHerHis] [Glossary( '«дар»', 'BLOOD_OF_MANNOROTH_GLOSS' )], я отказался — не из гордости, а из страха. Или это была мудрость? Стихии покинули нас на Дреноре, и я не могу не гадать: неужели [durotan_character.GetFirstName] всё же был прав насчёт [guldan_character.GetFirstNameNoTooltip]? Неужели именно [guldan_character.GetHerHis] деяния убили Дренор?\n\nОни шепчутся, что следующим Вождём стану я. Пусть шепчутся — это ничего не меняет. Мне не нужны слова, чтобы утвердить свою власть. За меня скажет Роковая Кувалда."
 wc_horde_invasion.1531.a: "Моё имя прогремит в веках."
 wc_horde_invasion.1531.a_flavor: "Орда живёт силой и честолюбием, и ты докажешь, что тебе суждено большее, чем быть правой рукой. [durotan_character.GetFirstNameNoTooltip] ошибается — ни один чернокнижник не способен в одиночку уничтожить мир. С твоим оружием ты проложишь себе путь к славе."
 wc_horde_invasion.1531.b: "[durotan_character.GetFirstNameNoTooltip] был прав с самого начала."
 wc_horde_invasion.1531.b_flavor: "Дары [guldan_character.GetFirstNamePossessiveNoTooltip] развратили твой народ задолго до того, как Кровь Маннорота отравила их жилы. Молчание стихий — знак того, что предки были преданы, и, быть может, более всего — тобой самим. [guldan_character.GetSheHe|U] нужно остановить, пока не поздно, даже если для этого придётся бросить вызов самой Орде."
  # Kilrogg 
 wc_horde_invasion.1541.title: "The Ancient"
 wc_horde_invasion.1541.desc: "Наши [Glossary( 'исконные земли', 'JUNGLE_OF_TANAAN_GLOSS' )] потеряны, обращены в бесплодную пустошь, пока Дренор увядает, покинутый стихиями. И всё же [ROOT.Char.GetCulture.GetName] отказываются склоняться перед судьбой!\n\nПосле долгих лет борьбы [guldan_character.GetFirstName] открыл Тёмный Портал, и [ROOT.Char.GetLiege.GetFirstName] приказал нам вторгнуться в этот новый мир. Он пообещал нашему народу плодородные земли и шанс начать всё заново.\n\nНо теперь я чувствую — конец близок. Когда я [Glossary( 'пожертвовал своим глазом', 'EYE_RITUAL_GLOSS' )], я узрел собственную смерть: меня сразили неведомые враги. Теперь я понимаю — это розовокожие этого мира!\n\n[ROOT.Char.GetLiege.GetFirstNameNoTooltip] уважает меня и дарует мне известную свободу. Но свобода без действий ничего не значит: я должен обеспечить будущее своего клана, прежде чем моё видение сбудется... или доказать, что его можно опровергнуть."
 wc_horde_invasion.1541.a: "Земли вокруг нас ждут лишь того, кто ими завладеет."
 wc_horde_invasion.1541.a_flavor: "Вы пришли сюда, чтобы дать своему народу новый дом. Чёрная Топь вторит вашим исконным Танаанским джунглям, а значит, поблизости должны быть пышные джунгли. Пора отправить разведчиков Кровожадного Племени исследовать окрестности."
 wc_horde_invasion.1541.a_tooltip: "Вы отправляете разведчиков Кровожадного Племени исследовать запад в поисках земель для завоевания."
 wc_horde_invasion.1541.b: "Я захвачу Орду, прежде чем настанет мой час!"
 wc_horde_invasion.1541.b_flavor: "Вся ваша жизнь была определена борьбой за выживание вашего клана. Захват титула Вождя перед смертью станет вершиной вашей славы, навеки вписав ваше имя в историю. Прочие вожди наверняка восхитятся вашей дерзостью."
  # Cho'gall 
 wc_horde_invasion.1561.title: "The Whispers"
 wc_horde_invasion.1561.desc: "Едва #EMP мы#! пересекли Тёмный Портал, как видения и шёпоты осадили #EMP наш#! разум. Поначалу я считал это очередным проявлением тех демонов, о которых [guldan_character.GetFirstName] [Glossary( 'рассказывал нам', 'CHOGALL_FORMATION_GLOSS' )]. Но со временем, ведя [ROOT.Char.GetPrimaryTitle.GetName|l], я понял: эти видения исходят не от демонов, а от их забытых богов — сил, что намного древнее и могущественнее самого Легиона.\n\n#EMP Галл#! странно молчит. #EMP Он#!, столь склонный к порывам, кажется, не тронут этими голосами. Но я слышу их, и они становятся всё громче... И #EMP наши#! [Glossary( 'бледные орки', 'PALE_ORCS_GLOSS' )] — некогда самые непокорные из всех кланов — теперь беспрекословно повинуются #EMP нам#!, словно ведомые высшей волей. Они называют #EMP нас#! Сумеречными Пророками..."
 wc_horde_invasion.1561.a: "Что, если они были правы? Я должен убедить Галла. @twilights_hammer_cult_icon!"
 wc_horde_invasion.1561.a_flavor: "#EMP "Now everything is clear. The Legion wages its petty crusade out of fear of these gods, but it is doomed to fail, for the inevitable fate of the universe is the Twilight Hour.\nThe Horde, these visions, my encounter with the pale orcs — all of this cannot always be mere coincidence. Gall respects only strength, and so he must be made to see that this is the true path forward."#!"
 wc_horde_invasion.1561.b: "Мы не можем предать Пылающий Легион."
 wc_horde_invasion.1561.b_flavor: "Заключив союз с Легионом, обратного пути уже нет. Думать, что мы сможем перехитрить высшие демонические силы, значит навлечь на себя ужасы, какие и вообразить невозможно. Совет Теней предать нельзя."
 wc_horde_invasion.1561.c: "Никто не смеет указывать нам, что делать."
 wc_horde_invasion.1561.c_flavor: "#EMP "We are not slaves to demons, nor to whispers in the dark. Gall was right — we are the masters of our fate, and strength is ours to command. These voices… I will silence them myself!"#!"
 wc_horde_invasion.1562.title: "Час Сумерек"
 wc_horde_invasion.1562.desc: "«#EMP (УБЕЙ [devoted.GetHerHim]!)#!» — прорычал Галл, когда я вырвал [devoted.GetNamePossessive] душу из [devoted.GetHerHis] тела, отправив её в [new_faith.PositiveAfterLife].\n\n«Видишь, Галл? Их сущность замыкает круг. [new_faith.PantheonTerm|U] одобряют это подношение. #EMP (Ха! СИЛА... ДА! Дай мне ЕЩЁ!)#!»\n\nЯ выдохнул над книгой в #EMP наших#! руках, пропитывая её страницы — уже пропитанные кровью верующих [new_faith.GetAdjective] — сущностью [devoted.GetName]. Галл ликует; этой ночью десятки расчленённых тел позволили мне выковать эту книгу. [new_faith.PantheonTerm|U] явили истину, что будет начертана внутри: [Glossary( 'Титаны', 'TITAN_GLOSS' )], Чёрная Империя, Легион, Бездна...\n\nЗа последние недели Галл открылся шёпотам. Наконец он понял. Каждое решение, что #EMP мы#! приняли, привело #EMP нас#! к этому самому мигу. #EMP Мы#! — их пророки. Сумерки падают!"
 wc_horde_invasion.1562.a: "Час Сумерек настал!"
 wc_horde_invasion.1562.a_flavor: "Теперь вы — воля [Glossary( 'Древних Богов', 'OLD_GODS_GLOSS' )]. Звёзды тускнеют, небеса дрожат, земля содрогается. Орда, вероятно, приблизит Час Сумерек, но вы должны стать одним из его зодчих. Их шёпот требует этого: #EMP сражайся за Орду!#!"
  # Other Twilights Hammer 
 wc_horde_invasion.1571.title: "$wc_horde_invasion.1561.title$"
 wc_horde_invasion.1571.desc: "С самого нашего прибытия на Азерот шёпоты ползут в мой разум. Порой это едва слышное бормотание, порой — пронзительные вопли. Бесформенные тени преследуют мои сны, повелевая преклонить колени. Боги Дренора... они умолкли. И [Glossary( 'Звезда', 'DARK_STAR_GLOSS' )] исчезла. Но здесь... здесь всё иначе. Здесь их много. Четверо... Нет, пятеро? Я знаю их, хотя никогда не видел.\n\n#EMP [Glossary( 'Йогг-Сарон', 'YOGG_SARON_GLOSS' )]#! — смерть и конец всего сущего. #EMP [Glossary( 'И'Шаарж', 'YSHAARJ_GLOSS' )]#! — ярость и ненависть, горящие в моём сердце. #EMP [Glossary( 'Н'Зот', 'NZOTH_GLOSS' )]#! — тайны, которым не суждено раскрыться. #EMP [Glossary( 'К'Тун', 'CTHUN_GLOSS' )]#! — чистое, неумолимое безумие. И ещё один... далёкий, слабый, но присутствующий. Бог крови и гнили.\n\nЕсть ли во всём этом смысл? Быть может, Азерот — новое начало... или ошибка. Страшная, страшная ошибка."
 wc_horde_invasion.1571.a: "I will follow. @twilights_hammer_cult_icon!"
 wc_horde_invasion.1571.a_flavor: "Шёпоты теперь ясны. Они не молят — они призывают. [Glossary( 'Йогг-Сарон', 'YOGG_SARON_GLOSS' )], [Glossary( 'И'Шаарж', 'YSHAARJ_GLOSS' )], [Glossary( 'Н'Зот', 'NZOTH_GLOSS' )], [Glossary( 'К'Тун', 'CTHUN_GLOSS' )]... и кровоточащая тень за ними всеми. Ни цепей. Ни хозяев. Только судьба."
 wc_horde_invasion.1571.b: "Демоны платят лучше, чем шёпоты."
 wc_horde_invasion.1571.b_flavor: "Шёпоты лишь сулят. Демоны — даруют. Сила — это кровь, а не мечты. Легион дал нам силу, и с нею мы покоряли миры. Я возьму ещё один."
 convert_to_twilights_hammer_effect_tt: "Это может привести к тайному обращению в [new_faith.GetName|V]"
  # Medivh 
 wc_horde_invasion.1581.title: "Последний Страж"
 wc_horde_invasion.1581.desc: "Много лет назад некий Голос обратился ко мне и явил видение умирающей земли за Круговертью Пустоты, где обитала раса воинов, способных защитить Азерот от демонического вторжения. С огромным усилием я связался с их великим шаманом [guldan_character.GetFirstName] и привёл их сюда.\n\nОднако орки оказались не такими, как я ожидал: жестокие и свирепые, они пропитаны демоническим влиянием. Мои прорицания открыли, что орки уже замышляют войну против моего покровителя и былого дома — [GetTitleByKey('k_stormwind').GetName]. Как же сильно я был обманут?\n\nХуже того: если моё соучастие в прибытии воинственных орков будет раскрыто, [GetTitleByKey('k_stormwind').GetHolder.GetName], скорее всего, заклеймит меня предателем! Истощённый открытием $DARK_PORTAL_NAME$, я ограничен и в силах, и в возможностях."
 wc_horde_invasion.1581.opt.a: "Наверняка я смогу выиграть время..."
 wc_horde_invasion.1581.opt.b: "Я должен заставить себя сохранять бдительность!"
 wc_horde_invasion.1582.title: "Ученик Стража"
 wc_horde_invasion.1582.desc.intro: "Много лет я отказывался от учеников. Я не видел достоинств в заурядных и безыскусных существах этого мира. Одних я прогонял сразу, других терзал, пока они сами не уходили. Но этот недавний пришелец, этот [khadgar_character.GetFirstName], кажется иным — отмеченным судьбой и предназначением, полным задатков и необузданной силы.\n\n"
 wc_horde_invasion.1582.desc.insane: "Голос, мой новейший и ближайший наперсник, велит мне не доверять ему. Быть может, когда я поправлюсь, я смогу использовать его — выпить его силу, чтобы исправить содеянное.\nОн выживет... Вероятно...\n\nА до тех пор мне нужно выбрать: держать его на расстоянии, не пуская в мастерские, где таятся мои самые тёмные тайны? Или притвориться наставником, держа его поближе и не давая ему времени заглядывать туда, куда не следует?"
 wc_horde_invasion.1582.desc.resigned: "Пока я борюсь с набегами Голоса и жду ужасной и справедливой участи, что он мне явил, [khadgar_character.GetFirstName] стал отрадным отвлечением и слабым источником надежды. Если бы только мои грехи не были столь велики, если бы только моя смерть не была столь близка; он мог бы стать мне сыном, которого у меня не было. Но я больше не страж, лишь тень себя прежнего. Держаться ли отчуждённо, не пуская его туда, где живут мои тайны? Или обмануть его, играя роль наставника, и надеяться, что он не догадается?"
 wc_horde_invasion.1582.desc.fallback: "Голос вернулся, терзая меня день и ночь предсказаниями собственной неминуемой гибели. Как бы я ни хотел довериться этому юноше, сейчас я не могу позволить себе такой роскоши. Держаться ли отчуждённо, не пуская его туда, где живут мои тайны? Или обмануть его, играя роль наставника, и надеяться, что он не догадается?"
 wc_horde_invasion.1582.opt.a: "Он не должен узнать о моих преступлениях!"
 wc_horde_invasion.1582.opt.b: "Пока что я возьму юношу под своё крыло."
  ################################# 
  # Events of the First War 
  ################################# 
  # Garona Caught in Stormwind 
 wc_horde_invasion.2001.title: "A Curious Prisoner"
 wc_horde_invasion.2001.desc: "Странного вида орк-[garona_character.GetWomanMan] был пойман в окрестностях $c_stormwind$ и передан нашим тюремщикам. Утверждая, что выполняет миссию мести за народ [garona_character.GetHerHis] матери, уничтоженный Ордой, [garona_character.GetName] предлагает [garona_character.GetHerHis] услуги в качестве двойного агента и осведомителя.\n\n[stormwind_spymaster.GetName] предупреждает меня, что этому чужаку доверять нельзя, однако [stormwind_spymaster.GetSheHe] признаёт, что Орда не известна использованием таких военных уловок, как проникновение и покушение, и, похоже, предпочитает открытый бой. Некая иная сила движет этим обманом? Или [garona_character.GetFirstName] здесь искренне? Я размышляю над верным решением касательно узницы."
 wc_horde_invasion.2001.opt.a: "В этой борьбе нам пригодится любая помощь."
 wc_horde_invasion.2001.opt.b: "Допросите [garona_character.GetHerHim], но пока оставьте [garona_character.GetHerHim] под замком."
 wc_horde_invasion.2001.opt.c.regret: "Хоть мне и горько, мы должны обращаться с [garona_character.GetHerHim] как с вражеской шпионкой."
 wc_horde_invasion.2001.opt.c.normal: "[stormwind_spymaster.GetSheHe] — шпион, и мне нужны ответы от [garona_character.GetHerHim]."
  # The Investigation into Medivh 
 wc_horde_invasion.2011.title: "The Unthinkable"
 wc_horde_invasion.2011.desc: "Среди шума военных донесений, совещаний по снабжению и просьб о помощи необычное прибытие ко двору заставляет отложить даже самые важные военные дела: [khadgar_character.GetFirstName], ученик Стража [medivh_character.GetFirstName]; и [garona_character.GetFullName], двойной агент Орды. По-видимому, эти двое осведомителей прибыли с доказательствами того, что не кто иной, как [medivh_character.GetFirstNameNoTooltip] [medivh_character.GetHerselfHimself] был ответствен за открытие Тёмного Портала и приведение орков!\n\nЕсли это правда, положение может оказаться страшнее наших самых кошмарных опасений. Отважный [lothar_character.GetTitledFirstName] вызвался расследовать, взяв с собой отряд солдат. Однако некоторые из моих советников призывают к осторожности. В конце концов, это может быть единственное существо, способное нас спасти; как мы смеем настраивать его против себя?"
 wc_horde_invasion.2011.opt.a: "Иди, [lothar_character.GetTitledFirstNameNoTooltip]. Заставь его ответить за это!"
 wc_horde_invasion.2011.opt.a.tt: "Отряд немедленно отправится на встречу с [medivh_character.GetFirstNameNoTooltip]..."
 wc_horde_invasion.2011.opt.b: "Сейчас [medivh_character.GetFirstNameNoTooltip] нужен на нашей стороне больше, чем когда-либо."
 wc_horde_invasion.2011.opt.b.tt: "Истинная причина кризиса Тёмного Портала навсегда останется неизвестной."
 wc_horde_invasion.2011.opt.c: "Правосудие может подождать до конца войны."
 wc_horde_invasion.2011.opt.c.tt: "Отряд отправится на встречу с [medivh_character.GetFirstNameNoTooltip], когда закончится война."
  # Gul'dan's Decision Regarding Medivh 
 wc_horde_invasion.2101.title: "Usefulness Outlived?"
 wc_horde_invasion.2101.desc.canon: "Мои планы присвоить знания и могущество [medivh_character.GetFirstName] натолкнулись на препятствие: его ученик [khadgar_character.GetFirstName] направляется к так называемому «Стражу», чтобы спросить с него за [medivh_character.GetHerHis] роль в нашем прибытии на Азерот. Уже сейчас [khadgar_character.GetSheHe] находится в нескольких днях пути от резиденции [medivh_character.GetFirstNamePossessiveNoTooltip] в [medivh_character.GetCapitalLocation.GetTitle.GetBaseNameNoTier].\n\nС одной стороны, у ученика мало шансов одолеть [khadgar_character.GetHerHis] наставника в честном поединке, а предательство ученика [medivh_character.GetFirstNamePossessiveNoTooltip] может упрочить мою власть над душой [khadgar_character.GetHerHis]. С другой стороны, это возможность раз и навсегда избавиться от незавершённого дела — [medivh_character.GetFirstNameNoTooltip]. Поспешно опустошить разум [medivh_character.GetHerHis] значит оставить [medivh_character.GetHerHim] уязвимым перед выскочкой.\n\nРазумеется, заклинание потребует времени на подготовку, и сроки будут сжаты. Не исключено даже, что я столкнусь с некоторыми #emp побочными эффектами#!, если [medivh_character.GetSheHe] погибнет. Как мне поступить?"
 wc_horde_invasion.2101.desc.non_canon: "Пришло время привести в исполнение планы по присвоению знаний и могущества так называемого «Стража» [medivh_character.GetFirstName]. Ослабленный демоническим влиянием и неспособный восстановиться после открытия Тёмного Портала, [medivh_character.GetFirstNameNoTooltip] не в силах сопротивляться моему вторжению, даже пока моё терпение истощается. С каждой победой [story_owner.GetFirstName] становится всё могущественнее и почитаемее, и [story_owner.GetSheHe] нельзя позволить мне мешать. Я должен найти #emp то, за чем сюда явился#!.\n\nРазумеется, я могу подождать, пока моя сила возрастёт, а сила [story_owner.GetFirstNamePossessiveNoTooltip] угаснет; да и глупец [medivh_character.GetFirstNameNoTooltip] ещё может пригодиться. Я тщательно обдумываю свои возможности..."
 wc_horde_invasion.2101.opt.a: "Богоподобие не может больше ждать."
 wc_horde_invasion.2101.opt.a.tt: "Вы предпримете #N рискованную#! попытку прочесть разум [medivh_character.GetFirstNamePossessiveNoTooltip]."
 wc_horde_invasion.2101.opt.b: "Время для этого ещё не пришло."
 wc_horde_invasion.2101.opt.b.tt: "Вы подождёте 5 лет, чтобы собрать эти сведения."
 wc_horde_invasion.2101.opt.c: "Я предупрежу [medivh_character.GetFirstNameNoTooltip] о предательстве [medivh_character.GetHerHis] ученика."
 wc_horde_invasion.2101.opt.c.tt: "Немного повышает шансы [medivh_character.GetFirstNamePossessiveNoTooltip] пережить встречу с [khadgar_character.GetFirstNameNoTooltip]."
  # Gul'dan's Torpor' 
 wc_horde_invasion.2111.title.confront: "The Backlash"
 wc_horde_invasion.2111.desc.confront: "Я лихорадочно роюсь в разуме [medivh_character.GetFirstNamePossessive], ускоряясь по мере того, как чувствую, как магические удары отдаются болью в теле [medivh_character.GetHerHis]. Я ищу всё, что связано с моей конечной целью в этом мире: #N Гробницей Саргераса#!. Удары сыплются один за другим, и, несмотря на немалую магическую мощь [medivh_character.GetHerHis], [medivh_character.GetSheHe] не может использовать её, отвлечённый моим вмешательством в нервы.\n\nВ тот самый миг, когда последний сгусток тайной энергии пробивает мана-щит [medivh_character.GetHerHis], пропуская удар клинка в грудь [medivh_character.GetHerHis], я вижу карту, на которую с укоризной указывает мерзкий эльфийский палец. За то время, что клинок пронзает кожу, ломает рёбра и достигает желудочка, я слышу разговор, случившийся в тот день, и узнаю о невероятной тёмной силе, сокрытой на тех далёких затонувших островах. Пока кровь заливает плевру [medivh_character.GetFirstNamePossessiveNoTooltip], выжимая из [medivh_character.GetHerHis] жизнь, я ощущаю прилив ликования. И когда сознание [medivh_character.GetHerHis] гаснет, погружаясь в шок, я..."
 wc_horde_invasion.2111.opt.a: "...чувствую, как моя душа отрывается от тела."
 wc_horde_invasion.2111.opt.a.tt: "Этот выбор — заглушка для будущего контента; #P вы восстановитесь через 1 год#!. Следите за обновлениями в нашем дискорде, и спасибо, что играете в Guardians of Azeroth 2!"
 wc_horde_invasion.2111.opt.b.confront: "... miraculously resist."
 wc_horde_invasion.2111.opt.b.tt: "Этот выбор доступен только игрокам-людям и является заглушкой для будущего контента. Следите за обновлениями в нашем дискорде, и спасибо, что играете в Guardians of Azeroth 2!"
  # Gul'dan Gains Knowledge from Medivh 
 wc_horde_invasion.2112.title: "Brain Drain"
 wc_horde_invasion.2112.desc: "За прошедший год я исподволь заглядывал в разум [medivh_character.GetFirstNamePossessive], пытаясь отыскать местоположение #N Гробницы Саргераса#! — источника демонической силы, который мог бы даровать мне богоподобные способности. Однако Маг не промах: он отлично обучен как мнемоническим искусствам, так и тайной магии. И всё же мне пришлось проникать очень глубоко, в конечном счёте дав [medivh_character.GetHerHim] заметить мою деятельность. Это уже не важно... Теперь, когда я нашёл в разуме [medivh_character.GetHerHis] искомое, никакая сила на этой планете не помешает мне обрести высшее могущество!"
 wc_horde_invasion.2112.opt: "Теперь [medivh_character.GetHerHis] сокровенные тайны принадлежат мне."
  # Medivh is Confronted 
 wc_horde_invasion.2201.title: "A Fated Confrontation"
 wc_horde_invasion.2201.desc.intro.canon: "Ощутив присутствие моего ученика [khadgar_character.GetFirstName], я слышу, как голоса в моём разуме взвиваются до оглушительной какофонии. В этот миг я понимаю: единственный путь вперёд — уничтожение [khadgar_character.GetHerHis]. Моя кожа покалывает от возбуждения, пока я жду в своём ателье, и вскоре [khadgar_character.GetSheHe] предстаёт передо мной.\n\n"
 wc_horde_invasion.2201.desc.intro.non-canon: "Приближается присутствие моего ученика [khadgar_character.GetFirstName], и я ощущаю [khadgar_character.GetHerHis] жестокие намерения. Игра окончена; день, которого я боялся, наконец настал. Я собираюсь с духом в своём ателье, когда [khadgar_character.GetFirstNameNoTooltip] входит в дверь и предстаёт передо мной.\n\n"
 wc_horde_invasion.2201.desc.taunt.party: "«Итак, ученик вернулся, — презрительно шиплю я, — и привёл с собой друзей. Небось на чаепитие пожаловал?»\n[khadgar_character.GetFirstNameNoTooltip] игнорирует мою насмешку, разражаясь предсказуемым монологом о том, что приведёт меня к «правосудию».\n\n"
 wc_horde_invasion.2201.desc.taunt.alone: "«Итак, ученик вернулся, — презрительно шиплю я, — дерзкий выскочка. Ты и впрямь полагаешь, что одолеешь меня в одиночку?»\n[khadgar_character.GetFirstNameNoTooltip] игнорирует мою насмешку, разражаясь предсказуемым монологом о том, что приведёт меня к «правосудию».\n\n"
 wc_horde_invasion.2201.desc.feeling.prepared: "«Молчать!» — обрываю я [khadgar_character.GetHerHim]. — «Наши зеленокожие „гости“ предупредили меня о твоём жалком плане. Теперь тебе предстоит испытать всю мощь Стража Тирисфаля!» Залп тайной магии — и битва началась."
 wc_horde_invasion.2201.desc.feeling.drained: "Прежде чем я успеваю оборвать [khadgar_character.GetHerHim], волна тёмной магии ударяет меня и заставляет пошатнуться. Это не магия [khadgar_character.GetFirstNamePossessiveNoTooltip]! Моя сосредоточенность рушится, пока воспоминания проносятся в разуме. Смогу ли я сражаться в таком состоянии?"
 wc_horde_invasion.2201.desc.feeling.insane: "«Молчать!» — обрываю я [khadgar_character.GetHerHim]. — «Твоя наглость будет наказана участью хуже смерти; твоё сломленное тело вечно будет служить моему господину!» Залп тайной магии — и битва началась."
 wc_horde_invasion.2201.desc.feeling.ok: "Притворившись сговорчивым, я поворачиваюсь и даю [khadgar_character.GetFirstNameNoTooltip] договорить. «Однажды ты поймёшь, почему я сделал то, что сделал, — вздыхаю я, дожидаясь, пока [khadgar_character.GetHerHim] ослабит [khadgar_character.GetHerHis] бдительность, — если переживёшь это!» Залп тайной магии — и битва началась."
 wc_horde_invasion.2201.opt.a: "Теперь судьба решит, кто победит."
 wc_horde_invasion.2201.opt.a.tt.forwin: "#help You survive the battle and escape#!"
 wc_horde_invasion.2201.opt.a.tt.forloss: "#XB You are slain in the battle#!"
  # Medivh dies 
 wc_horde_invasion.2202.title: "Судьба Медива"
 wc_horde_invasion.2202.desc.drained: "Истощённый, я оказался не соперником юному [khadgar_character.GetFirstName]."
 wc_horde_invasion.2202.desc.healthy: "Даже во всей своей силе я почему-то оказался не соперником юному [khadgar_character.GetFirstName]."
 wc_horde_invasion.2202.desc: "\n\nЖизнь покидает моё тело, а душа начинает дрейфовать в щели между Азеротом и Круговертью Пустоты. По-видимому, во мне осталось достаточно тайной силы, чтобы сохранить сознание, и я обнаруживаю, что бесплотно парю над землёй, которую некогда защищал... и предал. Почему я это сделал? Как мы дошли до этого? Чувствуя, как астральная нить, связывающая меня с умирающим телом, ускользает, мои мысли обращаются к..."
 wc_horde_invasion.2202.opt.a: "Правителю Штормграда, моему дому."
 wc_horde_invasion.2202.opt.b: "Коварному [guldan_character.GetTitledFirstName], моему орочьему двойнику."
 wc_horde_invasion.2202.opt.d: "Моему слуге, [moroes_character.GetFirstName], который примет эти земли."
 wc_horde_invasion.2202.opt.e: "Тьме Круговерти Пустоты."
 wc_horde_invasion.2202.opt.e.tt: "#N Your current playthough will end!#!"
  # Medivh survives 
 wc_horde_invasion.2203.title: "Medivh Survives"
 wc_horde_invasion.2203.opt.a: "Быть может... я смогу всё исправить?"
  # Orgrim - Path to Glory pt2 
 wc_horde_invasion.2401.title.durotan_dead: "Время возмездия"
 wc_horde_invasion.2401.desc.durotan_dead: "Теперь, когда война за новую родину в этом новом мире завершена, мои мысли возвращаются к ныне мёртвому другу [durotan_character.GetFirstName]. Его смерть, в самом деле, была приказана [blackhand_character.GetFirstName] [blackhand_character.GetHerselfHimself], но отпечатки [GetTitleByKey('k_shadow_council').GetNameNoTier] видны на всём этом замысле.\n\nЭтот бесчестный глупец! Каждая частица моего существа знает, что я правил бы [blackhand_character.GetPrimaryTitle.GetName] лучше, чем этот жалкий червь!\n\nМесть священна для нашего народа, как и моё право на [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )]."
 wc_horde_invasion.2401.title.durotan_alive: "По пути к славе"
 wc_horde_invasion.2401.desc.durotan_alive: "Теперь, когда война за новую родину в этом новом мире завершена, мои мысли обращаются к словам [durotan_character.GetFirstName]. Его опасения насчёт [blackhand_character.GetFirstName], несомненно, оправдались, а козни [GetTitleByKey('k_shadow_council').GetNameNoTier] нельзя игнорировать.\n\nЯ чую слабость [blackhand_character.GetFirstNamePossessiveNoTooltip] даже отсюда, пока [blackhand_character.GetSheHe] красуется на троне [blackhand_character.GetHerHis] новенького замка. Я могу использовать зависимость [blackhand_character.GetHerHis] от [GetTitleByKey('k_shadow_council').GetNameNoTier] как повод заявить о своём праве на [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )]!\n\n"
 wc_horde_invasion.2401.desc.guldan_torpor: "Теперь, когда [guldan_character.GetFirstName] впал в кому, негодяй не сможет прибегнуть к [guldan_character.GetHerHis] обычным уловкам, чтобы обеспечить победу [guldan_character.GetHerHis] марионетке.\n\nСамое время действовать, пока я ещё могу воспользоваться слабостью [blackhand_character.GetFirstNamePossessive]!"
 wc_horde_invasion.2401.desc.guldan_alt: "Пока [guldan_character.GetFirstName] в полной силе, мой вызов может оказаться куда труднее, ведь негодяй наверняка пустит в ход любые доступные уловки, чтобы обеспечить победу [guldan_character.GetHerHis] марионетке.\n\nСамое время действовать, пока они не успели закрепить власть!"
 wc_horde_invasion.2401.opt.a: "Бросить клич о $makgora_name$!"
 wc_horde_invasion.2401.makgora_tt: "Вы вступите с [blackhand_character.GetName] в [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )] — ритуальный поединок один на один — за [GetTitleByKey('e_horde').GetName] и [GetTitleByKey('k_stormwind').GetName]!"
 wc_horde_invasion.2401.opt.b: "Я не вынес бы бремени, что принесла бы победа..."
  # Orgrim - Path to Glory pt2 notification event 
 wc_horde_invasion.2402.title: "О? Ты приближаешься ко мне?"
 wc_horde_invasion.2402.desc: "Гул голосов снаружи подсказывает мне, что у моего [ROOT.Char.GetTitleAsNamePossessiveNoTooltip] шатра собралась большая толпа. Откинув полог, я удивляюсь вдвойне. Во-первых, толпа больше похожа на море зеленокожих орочьих лиц... Кажется, едва ли не вся [GetTitleByKey('e_horde').GetName] собралась здесь, на грязном, разорённом поле боя, что некогда было [GetTitleByKey('k_stormwind').GetName].\n\nВо-вторых, прямо у моего шатра стоит [orgrim_character.GetNameNicknamed], мой былой защитник. Захлёбываясь от негодования, я едва в силах слушать, как предатель выкрикивает ритуальный призыв к [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )].\n\nВо мне закипает демоническая ярость, пересиливая даже страх перед ужасным оружием, чьё имя носит мой противник. Время раздумий прошло — настало время славной битвы!"
 wc_horde_invasion.2402.opt: "[GetTitleByKey('e_horde').GetNameNoTooltip] принадлежит мне!"
  # King Lane is Killed 
 wc_horde_invasion.2901.title: "Checkmate"
 wc_horde_invasion.2901.victim.intro: "Я просыпаюсь и вижу тень, склонившуюся над моей кроватью. Прежде чем я успеваю среагировать, по моему горлу грубо полосует нож. Даже в темноте, пока моё зрение меркнет вместе с покидающей тело жизнью, я различаю безошибочную фигуру [garona_character.GetFullName], наблюдающую за мной... Присматривающую за моей безмолвной смертью."
 wc_horde_invasion.2901.victim.showed_mercy: "Так вот цена моего милосердия к орку?"
 wc_horde_invasion.2901.victim.imprisoned_her: "Змея, должно быть, сбежала из моих подземелий..."
 wc_horde_invasion.2901.victim.tortured_her: "Иметь силы и волю вынести заточение и пытки и всё же совершить это... Как переживёт моё королевство?"
 wc_horde_invasion.2901.victim.double_agent: "Похоже, я узнал истинную преданность нашей «двойной агентши»... Слишком поздно."
 wc_horde_invasion.2901.victim.outro: "\n\nМоё зрение меркнет, и сам Свет предстаёт передо мной туннелем, приветствуя мою душу. Я думаю о своём [stormwind_king.GetPrimaryTitle.GetTierAsName] и об испытаниях, что его ждут. Был ли я хорошим [stormwind_king.GetTitleAsName]? Как запомнит меня история?\n\nМои последние мысли — о жене, о сыне..."
 wc_horde_invasion.2901.opt.victim: "...Пора отдохнуть."
 wc_horde_invasion.2901.guldan: "Я зорко наблюдаю глазами своей зверушки, [garona_character.GetFirstName], как кровь [stormwind_king.GetName] заливает [stormwind_king.GetHerHis] опочивальню. Даже улыбаясь, я чувствую жар набегающих слёз [garona_character.GetHerHis], словно они мои собственные. Жалкое создание, как [garona_character.GetSheHe] мечется! Я заставляю [garona_character.GetHerHis] смотреть на [garona_character.GetHerHis] жертву, видеть, как [stormwind_king.GetHerHim] задыхается, и осознавать, какая участь ждёт [garona_character.GetHerHis], если [garona_character.GetSheHe] посмеет перечить мне.\n\nТеперь, когда их [stormwind_king.GetTitleAsNameNoTooltip] мёртв, слабые люди наверняка сломаются под орочьим сапогом. С их плодородных земель придут сила оружия и кровавые жертвы, что откроют путь к моему истинному предназначению... #Bold Богоподобию.#!"
 wc_horde_invasion.2901.opt.guldan: "Да свершится воля моя."
 wc_horde_invasion.2901.horde: "Наши разведчики доносят, что [stormwind_king.GetName] убит наёмным убийцей. Ходят слухи, что это дело рук [guldan_character.GetTitledFirstName] и его прислужницы [garona_character.GetFirstName]!\n\nТеперь, когда их предводитель кормит червей, трусливые розовокожие наверняка разбегутся по ветру, оставив нам свои плодородные земли на разграбление."
 wc_horde_invasion.2901.opt.horde_shaman: "И всё же... В этом деянии не было чести."
 wc_horde_invasion.2901.opt.horde_fel: "Лок'тар Огар! За Орду!"
 wc_horde_invasion.2901.victim_subject: "Это мрачный день для [stormwind_king.GetPrimaryTitle.GetName]. Наш [stormwind_king.GetTitleAsName] был найден убитым в [stormwind_king.GetHerHis] опочивальне. Приписываемое орочьей шпионке [garona_character.GetFullName], это гнусное деяние доказывает, сколь коварен, труслив и поистине зол наш враг.\n\nХодят слухи о тех, кто готов сдать наши земли захватчикам, и о тех, кто замышляет заполучить трон. И всё же, пока знать готовится к престолонаследию, рыцари и ополчение нашего великого края продолжают марш в нашу защиту."
 wc_horde_invasion.2901.opt.victim_subject: "У нас не будет времени скорбеть."
 wc_horde_invasion.2901.crisis_ally: "Из [stormwind_king.GetPrimaryTitle.GetName] пришли потрясающие вести: [stormwind_king.GetFullName] найден убитым в [stormwind_king.GetHerHis] опочивальне. Ходят слухи, что это гнусное деяние — результат козней коварного [guldan_character.GetTitledFirstName] и [guldan_character.GetHerHis] прислужницы [garona_character.GetFirstName]!\n\nСейчас, как никогда, наши союзники... нет... наш мир нуждается в том, чтобы мы встали на защиту; не то эта ужасная участь постигнет всех, кто встанет на пути [GetTitleByKey('e_horde').GetName]."
 wc_horde_invasion.2901.opt.crisis_ally: "Сегодня наши сердца с [stormwind_king.GetPrimaryTitle.GetBaseName]."
  # Death of Blackhand 
 wc_horde_invasion.2902.title: "Смерть [blackhand_character.GetFirstNameNoTooltip]"
 wc_horde_invasion.2902.desc.blackhand: "Удар Роковой Кувалды выбивает у меня из-под ног опору. Боль пронзает меня от ударов и напряжения тяжёлого боя, но я понимаю, что смерть близка, когда следующий удар дробит мой позвоночник, и вся нижняя часть тела немеет.\n\nМой конец будет почётным, но вспомнят ли мой рассказ с почтением или насмешкой? В конце концов, это [guldan_character.GetFirstName], а не я, привёл наш народ на эту землю; жалкая слабость её раскормленных обитателей гарантировала мне победу. В итоге я оказался слишком слаб, чтобы удержать империю, которую воздвиг на Азероте.\n\nНа миг я жду, что вечно благородный [orgrim_character.GetFirstName] перевернёт меня, чтобы я хотя бы встретил смерть лицом к врагу. Вместо этого Роковая Кувалда вновь и вновь опускается на мою верхнюю часть спины, и я тщетно пытаюсь сделать вдох. Земля забивает мне ноздри и рот, пока я беззвучно пытаюсь выкрикнуть свою ярость на демоническую силу, что меня покинула..."
 wc_horde_invasion.2902.desc.doomhammer: "Я в последний раз поднимаю Роковую Кувалду с грязной груды внутренностей, что некогда была торсом моего врага, [blackhand_character.GetFirstName]. Глупец умер так же, как и жил [blackhand_character.GetSheHe], — в слабости и трусости.\n\nДостаточно одного взмаха охотничьего ножа, чтобы отделить [blackhand_character.GetHerHis] голову и поднять её за волосы. Ошеломлённая толпа на миг застывает, осознавая жестокую картину, прежде чем взорваться воем ликования.\n\nМои глаза скользят по бесчисленной толпе ревущих орков передо мной; их тела раздуты силой, почерпнутой из демонической крови, а глаза блестят жаждой той власти, что я взял по праву и чести. Они ничем не похожи на благородную расу, которой, как я знал с детства на Дреноре, был мой народ.\nВ этот миг я понимаю, что для удержания титулов, заработанных сегодня, мне потребуется нечто большее, чем сила Роковой Кувалды."
 wc_horde_invasion.2902.desc.guldan_alt: "Пока голову [blackhand_character.GetFirstName] поднимают вверх, толпа разражается воем ликования. Даже мои так называемые собратья — вожди кланов — присоединяются. Я, Воплощение Тьмы, отказываюсь дать себя увлечь этим ребяческим зрелищем.\n\nАрхаичная традиция [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )] спутала мои планы, и даже моё вмешательство не помешало владельцу Роковой Кувалды победить. Взмахом руки я велю своим рабам поднять меня и пронести сквозь кричащую толпу; прочие шаманы [GetTitleByKey('k_shadow_council').GetName] следуют за мной.\n\nЯ должен немедленно продумать следующий шаг!"
 wc_horde_invasion.2902.desc.guldan_lore: "Сквозь дымку мира духов я вижу, как разыгрывается архаичная традиция [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )] между моей марионеткой [blackhand_character.GetFirstName] и вредителем [orgrim_character.GetFirstName], владеющим вожделенной Роковой Кувалдой. Неудивительно, что без моего вмешательства мой глупый прислужник не смог отразить его удары, и вскоре голову [blackhand_character.GetHerHis] поднимает новый вождь [GetTitleByKey('e_horde').GetName].\n\nМоё бесплотное сознание кипит от бессильной ярости. Это была бы прекрасная возможность посеять хаос в Орде и совершить бросок к #N Гробнице Саргераса#!! Теперь же этот приверженец традиций захватил власть для [orgrim_character.GetHerselfHimself] и наверняка сочтёт это шансом подорвать моё влияние или, хуже, поразить моё спящее тело...\n\nК счастью, тёмная магия Бледных Орков, кажется, ещё действует в этой бесплотной форме, и мои прислужники всё ещё под моим контролем. Я должен действовать быстро и использовать её для своих целей, прежде чем [orgrim_character.GetFirstNameNoTooltip] всё погубит!"
 wc_horde_invasion.2902.desc.blackhand_child: "Собравшиеся кланы ликуют, пока голову моего отца поднимает [orgrim_character.GetFirstName]. Мои собственные вопли вторят им, но это не вопли восхваления. Моё тело кипит яростью, подкреплённой демонической яростью, но под ней скрыто нечто большее: оттенок радости, осознание возможности.\n\nХотя корона моего отца вскоре возляжет на голову этого глупца, ей суждено опуститься на мою. Электричество этого мгновения пронзает меня, когда я понимаю, что прихоти моего отца больше не определяют ход моей жизни. Теперь я волен добиваться могущества так, как сочту нужным!"
 wc_horde_invasion.2902.desc.blackhand_vassal: "Когда разнеслась весть, что [orgrim_character.GetFirstName] вызвал [GetTitleByKey('e_horde').GetHolder.GetTitleAsNameNoTooltip] [blackhand_character.GetFirstName] на [Glossary( '$makgora_name|q$', 'MAKGORA_GLOSS' )], орки со всех владений [GetTitleByKey('e_horde').GetName] стеклись на поединок. Этот древний обычай в последнее время вышел из моды, ибо его раздорный характер не вписывался в видение [GetTitleByKey('k_shadow_council').GetName] о единой и дисциплинированной [GetTitleByKey('e_horde').GetBaseNameNoTooltip].\n\nТеперь эти две фигуры — [GetTitleByKey('e_horde').GetHolder.GetTitleAsNameNoTooltip] и грозный владелец Роковой Кувалды — сошлись на этом грязном поле боя. Схватка даже не была близкой: [orgrim_character.GetNameNoTooltip] без труда размозжил тело [blackhand_character.GetTitledFirstNamePossessiveNoTooltip] в кашу, подняв [blackhand_character.GetHerHis] голову, чтобы продемонстрировать толпе победу [orgrim_character.GetHerHis].\n\nВсе присутствующие взорвались ликованием, восхищённые этим зрелищем #N крови и чести#!: \"$wc_horde_invasion.2901.opt.horde_fel$\""
 wc_horde_invasion.2902.desc.other: "До моего двора дошли вести, что угроза в лице [blackhand_character.GetFirstNameRegnal] была сражена в смертельном поединке своим соплеменником, который ныне величает себя [orgrim_character.GetFullName]. Что эта перемена будет значить для [GetTitleByKey('e_horde').GetName] в краткосрочной перспективе, мы пока сказать не можем.\n\nХотя численность их огромной армии вторжения, по-видимому, продолжает расти с каждым днём, мои советники замечают, что это событие доказало: захватчики не так едины, как можно было полагать, и их внутренние распри могут обернуться их слабостью. Как бы то ни было, при том темпе, с которым они проходят через Тёмный Портал, сама мощь и жестокость [GetTitleByKey('e_horde').GetName] сделают их серьёзной угрозой."
 wc_horde_invasion.2902.opt.blackhand: "Кровь Скверны не спасла меня."
 wc_horde_invasion.2902.opt.blackhand_no_guldan: "Силы духов оказалось недостаточно."
 wc_horde_invasion.2902.opt.guldan: "Даже в ярости я могу лишь наблюдать."
 wc_horde_invasion.2902.opt.horde: "$wc_horde_invasion.2901.opt.horde_fel$"
 wc_horde_invasion.2902.opt.disloyal_clan: "Мы отказываемся признавать этого ложного \"[orgrim_character.GetTitleAsName]\"!"
 wc_horde_invasion.2902.opt.other: "Такова зачастую участь тиранов."
