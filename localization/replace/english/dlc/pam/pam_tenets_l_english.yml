  pam_hebrews_11_38_greek: "[Glossary('Hōn ouk ēn áxios ho kósmos, epì erēmíais planomenoi kaì óresin kaì spēlaíois kaì taĩs opaĩs tēs gēs.','HEBREWS_11_38_GREEK_GLOSS')]" #ὧν οὐκ ἦν ἄξιος ὁ κόσμος, ἐπὶ ἐρημίαις πλανώμενοι καὶ ὄρεσιν καὶ σπηλαίοις καὶ ταῖς ὀπαῖς τῆς γῆς.
  pam_luke_5_16_greek: "[Glossary('Autòs dè ēn hypōkhōrõn en taĩs erēmois kaì proseukhómenos.','LUKE_5_16_GREEK_GLOSS')]" #αὐτὸς δὲ ἦν ὑποχωρῶν ἐν ταῖς ἐρήμοις καὶ προσευχόμενος.
  # Mortification of the Flesh Tenet
  pam_1_corinthians_9_27_greek: "[Glossary('All hypōpiázō mou tò sõma kaì doulagōgõ, me pōs állois kērýxas autòs adókimos génōmai.','1_CORINTHIANS_9_27_GREEK_GLOSS')]" #ἀλλ' ὑπωπιάζω μου τὸ σῶμα καὶ δουλαγωγῶ, μή πως ἄλλοις κηρύξας αὐτὸς ἀδόκιμος γένωμαι.
  pam_galatians_5_24_greek: "[Glossary('Hoi dè toũ Khristoũ (Iēsoũ) tèn sárka estaúrōsan sỳn toĩs pathemasin kaì taĩs epithymíais.','GALATIANS_5_24_GREEK_GLOSS')]" #οἱ δὲ τοῦ Χριστοῦ [Ἰησοῦ] τὴν σάρκα ἐσταύρωσαν σὺν τοῖς παθήμασιν καὶ ταῖς ἐπιθυμίαις.
  pam_romans_8_13_greek: "[Glossary('Ei gàr katà sárka zẽte, méllēte apothneͅskein; ei dè pneúmati tàs práxeis toũ somatos thanatoũte, zesesthe.','ROMANS_8_13_GREEK_GLOSS')]" #εἰ γὰρ κατὰ σάρκα ζῆτε, μέλλετε ἀποθνῄσκειν· εἰ δὲ πνεύματι τὰς πράξεις τοῦ σώματος θανατοῦτε, ζήσεσθε.
  # Holy Myron Tenet
  pam_john_3_5_greek: "[Glossary('Apekríthē Iēsoũs; amen amen légō soi, eàn me tis gennēthe ex hýdatos kaì pneúmatos, ou dýnatai eiseltheĩn eis tèn basileían toũ theoũ.','JOHN_3_5_GREEK_GLOSS')]" #ἀπεκρίθη Ἰησοῦς· ἀμὴν ἀμὴν λέγω σοι, ἐὰν μή τις γεννηθῇ ἐξ ὕδατος καὶ πνεύματος, οὐ δύναται εἰσελθεῖν εἰς τὴν βασιλείαν τοῦ θεοῦ.
  pam_acts_10_38_greek: "[Glossary('Iēsoũn tòn apò Nazaréth, hōs ékhrísen autòn ho theòs pneúmati hagíōͅ kaì dynámei, hòs diẽlthen euergetõn kaì iomenos pántas toùs katadynasteuoménous hypò toũ diabólou, hóti ho theòs ẽn met autoũ.','ACTS_10_38_GREEK_GLOSS')]" #Ἰησοῦν τὸν ἀπὸ Ναζαρέθ, ὡς ἔχρισεν αὐτὸν ὁ θεὸς πνεύματι ἁγίῳ καὶ δυνάμει, ὃς διῆλθεν εὐεργετῶν καὶ ἰώμενος πάντας τοὺς καταδυναστευομένους ὑπὸ τοῦ διαβόλου, ὅτι ὁ θεὸς ἦν μετ' αὐτοῦ.
  pam_2_corinthians_1_21_22_greek: "[Glossary('Ho dè bebaion hēmãs sỳn hymĩn eis Khristòn kaì khrísas hēmãs theós, ho kaì sphragisámenos hēmãs kaì doùs tòn arrabõna toũ pneúmatos en taĩs kardíais hēmõn.','2_CORINTHIANS_1_21_22_GREEK_GLOSS')]" #ὁ δὲ βεβαιῶν ἡμᾶς σὺν ὑμῖν εἰς Χριστὸν καὶ χρίσας ἡμᾶς θεός, ὁ καὶ σφραγισάμενος ἡμᾶς καὶ δοὺς τὸν ἀρραβῶνα τοῦ πνεύματος ἐν ταῖς καρδίαις ἡμῶν.
  # Khachkar Tenet
  pam_galatians_6_14_greek: "[Glossary('Emoì dè me génoito kaukhãsthai ei me en tõͅ staurõͅ toũ kyríou hēmõn Iēsoũ Khristoũ, di hoũ emoì kósmos estaúrōtai kago kósmōͅ.','GALATIANS_6_14_GREEK_GLOSS')]" #Ἐμοὶ δὲ μὴ γένοιτο καυχᾶσθαι εἰ μὴ ἐν τῷ σταυρῷ τοῦ κυρίου ἡμῶν Ἰησοῦ Χριστοῦ, δι' οὗ ἐμοὶ κόσμος ἐσταύρωται κἀγὼ κόσμῳ.
  pam_1_corinthians_1_18_greek: "[Glossary('Ho lógos gàr ho toũ stauroũ toĩs mèn apollyménois mōría estín, toĩs dè sōͅzoménois hēmĩn dýnamis theoũ estin.','1_CORINTHIANS_1_18_GREEK_GLOSS')]" #Ὁ λόγος γὰρ ὁ τοῦ σταυροῦ τοῖς μὲν ἀπολλυμένοις μωρία ἐστίν, τοῖς δὲ σῳζομένοις ἡμῖν δύναμις θεοῦ ἐστιν.
  pam_isaiah_19_19_greek: "[Glossary('Te hēméraͅ ekeínēͅ éstai thysiasterion tõͅ kyríōͅ en khoraͅ Aigyptíōn kaì stelē pròs tò hórion autẽs tõͅ kyríōͅ.','ISAIAH_19_19_GREEK_GLOSS')]" #Τῇ ἡμέρᾳ ἐκείνῃ ἔσται θυσιαστήριον τῷ κυρίῳ ἐν χώρᾳ Αἰγυπτίων καὶ στήλη πρὸς τὸ ὅριον αὐτῆς τῷ κυρίῳ.
  # Philanthropia Tenet
  pam_matthew_25_40_greek: "[Glossary('Amèn légō hymĩn, eph hóson epoiesate henì toútōn tõn adelphõn mou tõn elakhístōn, emoì epoiesate.','MATTHEW_25_40_GREEK_GLOSS')]" #ἀμὴν λέγω ὑμῖν, ἐφ' ὅσον ἐποιήσατε ἑνὶ τούτων τῶν ἀδελφῶν μου τῶν ἐλαχίστων, ἐμοὶ ἐποιήσατε.
  # Sanctity of Nature Tenet
  pam_psalm_24_1_greek: "[Glossary('Toũ kyríou hē gẽ kaì tò pleroma autẽs, hē oikouménē kaì pántes hoi katoikoũntes en autẽͅ.','PSALM_24_1_GREEK_GLOSS')]" #τοῦ κυρίου ἡ γῆ καὶ τὸ πλήρωμα αὐτῆς, ἡ οἰκουμένη καὶ πάντες οἱ κατοικοῦντες ἐν αὐτῇ.
  # Literalism Tenet
  pam_2_timothy_3_16_greek: "[Glossary('Pãsa graphè theópneustos kaì ōphélimos pròs didaskalían, pròs elegmón, pròs epanórthōsin, pròs paideían tèn en dikaiosýnēͅ.','2_TIMOTHY_3_16_GREEK_GLOSS')]" #πᾶσα γραφὴ θεόπνευστος καὶ ὠφέλιμος πρὸς διδασκαλίαν, πρὸς ἐλεγμόν, πρὸς ἐπανόρθωσιν, πρὸς παιδείαν τὴν ἐν δικαιοσύνῃ.
  # Legalism Tenet
  pam_romans_2_13_greek: "[Glossary('Ou gàr hoi akroataì nómou díkaioi parà tõͅ theõͅ, all hoi poiētaì nómou dikaiōthesontai.','ROMANS_2_13_GREEK_GLOSS')]" #οὐ γὰρ οἱ ἀκροαταὶ νόμου δίκαιοι παρὰ τῷ θεῷ, ἀλλ' οἱ ποιηταὶ νόμου δικαιωθήσονται.
  # Religious Law Tenet
  pam_matthew_18_18_greek: "[Glossary('Amèn légō hymĩn, hósa eàn desēte epì tẽs gẽs éstai dedeména en ouranõͅ, kaì hósa eàn lýsēte epì tẽs gẽs éstai lelyména en ouranõͅ.','MATTHEW_18_18_GREEK_GLOSS')]" #ἀμὴν λέγω ὑμῖν, ὅσα ἐὰν δήσητε ἐπὶ τῆς γῆς ἔσται δεδεμένα ἐν οὐρανῷ, καὶ ὅσα ἐὰν λύσητε ἐπὶ τῆς γῆς ἔσται λελυμένα ἐν οὐρανῷ.
  # Communal Possessions Tenet
  pam_acts_4_32_greek: "[Glossary('Toũ dè plethous tõn pisteusántōn ẽn kardía kaì psykhè mía, kaì oudè heĩs ti tõn hyparkhóntōn autõͅ élegen ídion eĩnai, all ẽn autoĩs hápanta koiná.','ACTS_4_32_GREEK_GLOSS')]" #Τοῦ δὲ πλήθους τῶν πιστευσάντων ἦν καρδία καὶ ψυχὴ μία, καὶ οὐδὲ εἷς τι τῶν ὑπαρχόντων αὐτῷ ἔλεγεν ἴδιον εἶναι, ἀλλ' ἦν αὐτοῖς ἅπαντα κοινά.
  # Ritual Hospitality Tenet
  pam_hebrews_13_2_greek: "[Glossary('Tẽs philoxenías mè epilanthánesthe, dià taútēs gàr élathón tines xenísantes angélous.','HEBREWS_13_2_GREEK_GLOSS')]" #τῆς φιλοξενίας μὴ ἐπιλανθάνεσθε, διὰ ταύτης γὰρ ἔλαθόν τινες ξενίσαντες ἀγγέλους.
  # Ritual Celebrations Tenet
  pam_psalm_150_3_4_greek: "[Glossary('Aineĩte autòn en ekhōͅ sálpingos, aineĩte autòn en psaltēríōͅ kaì kitháraͅ; aineĩte autòn en tympánōͅ kaì khorõͅ, aineĩte autòn en khordaĩs kaì orgánōͅ.','PSALM_150_3_4_GREEK_GLOSS')]" #αἰνεῖτε αὐτὸν ἐν ἤχῳ σάλπιγγος, αἰνεῖτε αὐτὸν ἐν ψαλτηρίῳ καὶ κιθάρᾳ· αἰνεῖτε αὐτὸν ἐν τυμπάνῳ καὶ χορῷ, αἰνεῖτε αὐτὸν ἐν χορδαῖς καὶ ὀργάνῳ.
  # Adaptability Tenet
  pam_1_corinthians_9_22_greek: "[Glossary('Toĩs pãsin gégona pánta, hína pántōs tinàs sosō.','1_CORINTHIANS_9_22_GREEK_GLOSS')]" #τοῖς πᾶσιν γέγονα πάντα, ἵνα πάντως τινὰς σώσω.
  # Astrology Tenet
  pam_matthew_2_2_greek: "[Glossary('Poũ estin ho tekhtheìs basileùs tõn Ioudaíōn? eídomen gàr autoũ tòn astéra en tẽͅ anatolẽͅ kaì elthomen proskynẽsai autõͅ.','MATTHEW_2_2_GREEK_GLOSS')]" #ποῦ ἐστιν ὁ τεχθεὶς βασιλεὺς τῶν Ἰουδαίων; εἴδομεν γὰρ αὐτοῦ τὸν ἀστέρα ἐν τῇ ἀνατολῇ καὶ ἤλθομεν προσκυνῆσαι αὐτῷ.
  # Warmongering Tenet
  pam_psalm_144_1_greek: "[Glossary('Eulogētòs kýrios ho theós mou ho didáskōn tàs kheĩrás mou eis parátaxin, toùs daktýlous mou eis pólemon.','PSALM_144_1_GREEK_GLOSS')]" #εὐλογητὸς κύριος ὁ θεός μου ὁ διδάσκων τὰς χεῖράς μου εἰς παράταξιν, τοὺς δακτύλους μου εἰς πόλεμον.
  # Natural Primitivism Tenet
  pam_genesis_2_25_greek: "[Glossary('Kaì ẽsan hoi dýo gymnoí, hó te Adàm kaì hē gynè autoũ, kaì ouk ēskhýnonto.','GENESIS_2_25_GREEK_GLOSS')]" #καὶ ἦσαν οἱ δύο γυμνοί, ὅ τε Αδαμ καὶ ἡ γυνὴ αὐτοῦ, καὶ οὐκ ᾐσχύνοντο.
  # Auspicious Birthright Tenet
  pam_jeremiah_1_5_greek: "[Glossary('Prò toũ me plásai se en koilíaͅ epístamaí se, kaì prò toũ se exeltheĩn ek metras hēgíaká se.','JEREMIAH_1_5_GREEK_GLOSS')]" #πρὸ τοῦ με πλάσαι σε ἐν κοιλίᾳ ἐπίσταμαί σε, καὶ πρὸ τοῦ σε ἐξελθεῖν ἐκ μήτρας ἡγίακά σε.
  # Sacred Childbirth Tenet
  pam_psalm_127_3_greek: "[Glossary('Idoù hē klēronomía kyríou hyioí, ho misthòs toũ karpoũ tẽs gastrós.','PSALM_127_3_GREEK_GLOSS')]" #ἰδοὺ ἡ κληρονομία κυρίου υἱοί, ὁ μισθὸς τοῦ καρποῦ τῆς γαστρός.
  # Hedonism Tenet
  pam_ecclesiastes_8_15_greek: "[Glossary('Kaì epenesa egò sỳn tèn euphrosýnēn, hóti ouk éstin agathòn tõͅ anthropōͅ hypò tòn helion hóti ei mè toũ phageĩn kaì toũ pieĩn kaì toũ euphranthẽnai.','ECCLESIASTES_8_15_GREEK_GLOSS')]" #καὶ ἐπῄνεσα ἐγὼ σὺν τὴν εὐφροσύνην, ὅτι οὐκ ἔστιν ἀγαθὸν τῷ ἀνθρώπῳ ὑπὸ τὸν ἥλιον ὅτι εἰ μὴ τοῦ φαγεῖν καὶ τοῦ πιεῖν καὶ τοῦ εὐφρανθῆναι.
  # Pursuit of Power Tenet
  pam_psalm_2_8_greek: "[Glossary('Aítēsai par emoũ, kaì dosō soi éthnē tèn klēronomían sou kaì tèn katáskhesín sou tà pérata tẽs gẽs.','PSALM_2_8_GREEK_GLOSS')]" #αἴτησαι παρ' ἐμοῦ, καὶ δώσω σοι ἔθνη τὴν κληρονομίαν σου καὶ τὴν κατάσχεσίν σου τὰ πέρατα τῆς γῆς.
  # Sanctioned False Conversions Tenet
  pam_2_kings_5_18_19_greek: "[Glossary('Kaì en tõͅ eisporeúesthai tòn kýrión mou eis oĩkon Remman proskynẽsai autòn kaì proskyneso en oíkōͅ Remman, hilásetai dè kýrios tõͅ doúlōͅ sou en tõͅ lógōͅ toútōͅ. kaì eĩpen autõͅ; Deũro eis eirenēn.','2_KINGS_5_18_19_GREEK_GLOSS')]" #καὶ ἐν τῷ εἰσπορεύεσθαι τὸν κύριόν μου εἰς οἶκον Ρεμμαν προσκυνῆσαι αὐτὸν καὶ προσκυνήσω ἐν οἴκῳ Ρεμμαν, ἱλάσεται δὴ κύριος τῷ δούλῳ σου ἐν τῷ λόγῳ τούτῳ. καὶ εἶπεν αὐτῷ· Δεῦρο εἰς εἰρήνην.

