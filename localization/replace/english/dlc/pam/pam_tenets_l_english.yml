  tenet_communal_identity_default_desc: "The faithful are united as the Light's chosen people, a community set apart from the world, sharing a common identity and divine purpose."
  tenet_communal_identity_default_historical_glossary: "[Glossary('Communal Identity','tenet_communal_identity_historical_desc')]"
  tenet_communal_identity_historical_desc: "The Church of the Light has long taught that all who follow its teachings belong to a common spiritual community, united by their devotion to the Light rather than by blood or origin. This shared faith fosters a sense of brotherhood among the faithful, transcending differences of culture, lineage, and kingdom." # PLACEHOLDER

