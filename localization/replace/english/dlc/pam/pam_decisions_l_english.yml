 pam_decision_events.0008.t: "Levy the Tithes"
 pam_decision_events.0008.desc.intro: "Swollen coffers sit on [ROOT.Char.GetFaith.HouseOfWorshipPlural] within my reach. The sound of my guards entering the temples is soon followed by the clinking of coins.\n\n"
 pam_decision_events.0008.desc.chaplain: ""Does the [ROOT.Char.GetTitleAsNameNoTooltip|l] now rejoice in humiliating the servants of [ROOT.Char.GetFaith.HighGodName]?" [chaplain.GetTitledFirstName] rebukes. "Do you derive any pleasure in stripping [ROOT.Char.GetFaith.HighGodHerHis|U] house naked like a #EMP filthy#! harlot?""
 pam_decision_events.0008.desc.fallback: "[ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] turn away their faces in disgust. The servants of [ROOT.Char.GetFaith.HighGodName] seem awfully interested in gold."
 pam_decision_events.0008.a: "Is generosity not a virtue?"
 
