 xavism_good_god_xavius_possessive:0 "Xavius'"
 xavism_good_god_nightmare_lord:0 "The Nightmare Lord"
 xavism_good_god_nightmare_lord_possessive:0 "The Nightmare Lord's"
 xavism_good_god_sargeras:0 "Sargeras"
 xavism_good_god_sargeras_possessive:0 "Sargeras's"
 xavism_divine_realm:0 "the Emerald Nightmare"
 xavism_health_god:0 "$xavism_good_god_xavius$"
 xavism_health_god_possessive:0 "$xavism_good_god_xavius_possessive$"
 xavism_fertility_god_name:0 "$xavism_good_god_xavius$"
 xavism_fertility_god_possessive:0 "$xavism_good_god_xavius_possessive$"
 xavism_wealth_god_name:0 "$xavism_good_god_xavius$"
 xavism_wealth_god_possessive:0 "$xavism_good_god_xavius_possessive$"

 # Shadow
 selinite_rite:0 "Selinite Rite"
 selinite_rite_adj:0 "Selinite"
 selinite_rite_adherent:0 "Selinite"
 selinite_rite_adherent_plural:0 "Selinites"
 selinite_rite_desc:0 "The $selinite_rite_adherent_plural$ follow Natalie Seline, the bishop who first wielded the Void against the Horde. Hers is a doctrine of restraint: adherents must show Respect for the forces they court, Discipline before the hunger of the Void, and only then may they claim Power, which is granted to those who never let it rule them."

 forsaken_rite:0 "Forsaken Rite"
 forsaken_rite_adj:0 "Forsaken"
 forsaken_rite_adherent:0 "Forsaken"
 forsaken_rite_adherent_plural:0 "Forsaken"
 forsaken_rite_desc:0 "In lands ravaged by the Scourge, the teachings of the $cult_of_the_forgotten_shadow$ became a tool in the hands of those strong enough to wield them. Whether whoever wields them honors Seline's legacy is of no consequence. The faithful follow the creed; the creed follows its master."

 echo_of_life:0 "Echo of Life"
 echo_of_life_adj:0 "Echoseeker"
 echo_of_life_adherent:0 "Echoseeker"
 echo_of_life_adherent_plural:0 "Echoseekers"
 echo_of_life_desc:0 "Free will brings the undead a cruel longing: to live again. The $echo_of_life_adherent_plural$ seek their answer in the arcane, wielding wild magics to wrest their stolen essence back from the void. Yet the arcane exacts its own price, and many trade one curse for another: an endless hunger for magic."

 # Deathbringer
 mordtruar:0 "Mord'truar"
 mordtruar_adj:0 "Mord'truari"
 mordtruar_adherent:0 "Mord'truari"
 mordtruar_adherent_plural:0 "Mord'truari"
 mordtruar_desc:0 "Most of the Scourge's undead no longer have a will of their own. Stripped of free thought, they serve the Lich King through eternal worship, while the mightiest honor him with rites of blood. To them, pity is weakness, and suffering a weapon."

 # Necrotism
 nazen:0 "Nazen"
 nazen_adj:0 "Nazeni"
 nazen_adherent:0 "Nazeni"
 nazen_adherent_plural:0 "Nazenis"
 nazen_desc:0 "The $nazen_adj$ philosophy centers on self-sacrifice for the betterment of society. The individual's duty to the community comes before all else, and personal desire must always yield to the greater good. Over the ages, it displaced every rival school of thought in Azjol-Nerub, until it stood alone as the guiding principle of Nerubian civilization."

 nazen_high_god_name:0 "the All-seeing"
 nazen_high_god_name_possessive:0 "the All-seeing's"
 nazen_high_god_name_alternate:0 "$necrotism_high_god_name$"
 nazen_high_god_name_alternate_possessive:0 "$necrotism_high_god_name_possessive$"
 nazen_devil_name:0 "the Old One"
 nazen_devil_name_possessive:0 "the Old One's"
 nazen_religious_symbol:0 "spider"
 nazen_religious_symbol_2:0 "web"

 moonweaver:0 "Moonweaver"
 moonweaver_adj:0 "Moonweaver"
 moonweaver_adherent:0 "Moonweaver"
 moonweaver_adherent_plural:0 "Moonweavers"
 moonweaver_high_god_name:0 "$felweaver_high_god_name$"
 moonweaver_high_god_name_possessive:0 "$felweaver_high_god_name_possessive$"
 moonweaver_high_god_name_alternate:0 "$felweaver_high_god_name_alternate$"
 moonweaver_high_god_name_alternate_possessive:0 "$felweaver_high_god_name_alternate$"
 moonweaver_desc:0 "The followers of $moonweaver_high_god_name$ revere an alternate conception of $ELUNE_NAME$, depicted as a spider goddess. The $moonweaver_adherent_plural$ see $felweaver_high_god_name$ as a benevolent figure identified with judicious magical study and care for nature."

 felweaver:0 "Felweaver"
 felweaver_adj:0 "Felweaver"
 felweaver_adherent:0 "Felweaver"
 felweaver_adherent_plural:0 "Felweavers"
 felweaver_high_god_name:0 "Arachelune"
 felweaver_high_god_name_possessive:0 "Arachelune's"
 felweaver_high_god_name_alternate:0 "the Spider Moon"
 felweaver_high_god_name_alternate_possessive:0 "the Spider Moon's"
 felweaver_desc:0 "Followers of $felweaver_high_god_name$ who became corrupted over time due to underground isolation and unchecked arcane experimentation. They depict her as a separate, dark, necrotic spider goddess that is opposed to $ELUNE_POSSESSIVE$ light. The $felweaver_adherent_plural$ hold that she demands absolute fealty and obedience from all her followers."

 maldraxxi:0 "Maldraxxi"
 maldraxxi_adj:0 "Maldraxxi"
 maldraxxi_adherent:0 "Maldraxxi"
 maldraxxi_adherent_plural:0 "Maldraxxis"
 maldraxxi_primus_name:0 "the Primus"
 maldraxxi_primus_name_possessive:0 "the Primus'"
 maldraxxi_desc:0 "The $maldraxxi_adherent_plural$ hold power, whether of arms, will or sorcery, to be the ultimate virtue: the strong must rise to lead and protect the weak. Battle is the proving ground of every soul, and death merely the first step toward greater power. Their necromancers stitch the fallen into abominations, hulking amalgams of flesh and bone that fight on where the living fall."

 ebon_blade:0 "Ebon Blade"
 ebon_blade_adj:0 "Ebon"
 ebon_blade_adherent:0 "Ebon"
 ebon_blade_adherent_plural:0 "Ebons"
 ebon_blade_desc:0 "Torn from the grave and bound to a master's will, many death knights in time broke their chains. Shunned by the living and denied their old faiths, they found kinship only among their own kind. Together they wield the power that damned them as a weapon against the darkness, guarding a world that will never welcome them home."

 # Elunadorism
 elunic_rite:0 "Elunic Rite"
 elunic_rite_adj:0 "Elunic"
 elunic_rite_adherent:0 "Elunist"
 elunic_rite_adherent_plural:0 "Elunists"
 elunic_rite_desc:0 "In this rite, the service of Elune belongs to women, and her priestesses hold great authority over their society. They preach love and tolerance and often test the faith of their followers, yet stand ready to wage war upon the enemies of life with savage ferocity."
