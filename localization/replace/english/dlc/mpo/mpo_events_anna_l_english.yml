l_english:

 mpo_events_anna.0001.desc: "My [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('pushy_adult'))] [pushy_adult.GetFirstName] and I are observing my [child.Custom('GetDaughterSon')] [child.GetFirstName], as [child.GetSheHe] skips happily across the encampment with a few rocks at hand, ready to be played with. [pushy_adult.GetFirstNameNoTooltip] eagerly turns to me with a huge smile.\n\n"Don't you think it is time for [child.GetFirstNameNoTooltip] to learn how to ride [ROOT.Char.Custom('GetCulturalMountPlural')] instead of playing childish games? I've prepared a most gentle colt and some rope that should keep [child.GetHerHim] safe during [child.GetHerHis] first ride.""

 mpo_events_anna.0001.a: "Put [child.GetFirstNameNoTooltip] on a [ROOT.Char.Custom('GetCulturalMount')] by themselves."
 mpo_events_anna.0001.a.tt: "I tie [child.GetFirstNameNoTooltip] to a [ROOT.Char.Custom('GetCulturalMount')] with the rope."
 mpo_events_anna.0001.a.toast.bad: "[child.GetFirstNameNoTooltip] falls from the [ROOT.Char.Custom('GetCulturalMount')]"

 mpo_events_anna.0005.desc: "As the night falls, the stars shine brightly from the darkest corners of the sky. A campfire is flickering, an inviting scene for the gathered crowd.\n\n[storyteller.GetFirstName], our storyteller for the evening looks among the excited crowd, seemingly searching for something, or #EMP someone#!.\n\nOur eyes meet, and [storyteller.GetFirstNameNoTooltip] takes a sudden leap forward in my direction and the group staggers back, slightly rattled from the jump. A finger is slowly being raised by [storyteller.GetHerHim], eventually pointing at me. "It is now your turn to choose a tale of yonder to be retold!""
 mpo_events_anna.0005.a: ""Tell us about something fantastical.""
 mpo_events_anna.0005.a.tt: "Sightings of the Pantheon, worlds beyond Azeroth with twisted creatures, elves without pointy ears!"
 
 mpo_events_anna.0010.desc: "In the distance, I can see some of our camp's [ROOT.Char.Custom('GetCulturalMountPlural')] roaming peacefully. I would really like to know them better, but getting their attention has proven difficult. I've tried gesturing, pacing back and forth and screaming — only to be met with silence.\n\nFrustrated with my futile attempts, I turn my heel and head back to camp, only to bump head first into [whistler.GetFirstName].\n\n"We'll have to teach you some new tricks to call upon your steed. Follow my lead.""

 mpo_events_anna.0015.desc: "Faint bestial cries and whimpers echo across the hills. Curious, I approach to take a closer look.\n\nThere is an abandoned fawn stuck in a trap, desperately trying to pull their leg out while calling out for its mothers comfort — but to no avail.\n\nWhile it isn't ours to take, we must do all we can to survive the strenuous journey ahead."

 mpo_events_anna.0020.desc: "Thundering hooves hurry across the fields, heading straight for us. A silhouette of a [messenger.GetWomanMan] on the back of a [messenger.Custom('GetCulturalMount')] appears, doing [messenger.GetHerHis] utmost to not fall off [messenger.GetHerHis] steed, struggling to hold on.\n\n[messenger.GetSheHe|U] abruptly stops in front of us, slowly descending [messenger.GetHerHis] [messenger.Custom('GetCulturalMount')], noticeably struggling. A grievous wound is seen across [messenger.GetHerHis] back, it is a miracle that [messenger.GetSheHe] is still standing.\n\n“Y-you m-m-u-st delive-er… p-p-le-ase…” are the last words [messenger.GetSheHe] manages to muster while painfully pointing to the horizon, with an encrypted message at hand, before closing [messenger.GetHerHis] eyes and collapsing to rest… "