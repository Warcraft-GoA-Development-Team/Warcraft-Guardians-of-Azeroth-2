 wc_spell_polymorph_targets: "[character|E]"
 wc_spell_polymorph_effects: "Превращает [character|E] в безобидное животное. Пока длится это состояние, его [prowess|E] становится равной #N 1#!, и он считается [wc_incapable|E]."
 wc_learn_spell_polymorph: "Вы изучаете [wc_spell_polymorph|E]"
