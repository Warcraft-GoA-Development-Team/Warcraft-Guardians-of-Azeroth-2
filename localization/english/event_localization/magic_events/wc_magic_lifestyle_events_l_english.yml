elemental_magic_lifestyle.2011.t:0 "Playing With Fire"
elemental_magic_lifestyle.2011.desc:0 "Having noted fires burning in the fields in a remote part of my domain, I have set out on a mounted control with several retainers. As we approach the burning fields, I can see that the fires rage with an unnatural brightness and intensity. I feel the whisper of the elements on the wind; the hunger of fire, never sated, feeds wantonly in this land. A tenant farmer approaches our rentinue, disrupting my communion with the spirits.\n\n"My [ROOT.Char.GetTitleName]," [pleading_peasant.GetSheHe] addresses me, "thank [pleading_peasant.GetFaith.CreatorName] for your arrival! Your elemental servants have free reign over the contryside and are setting fire to our fields and stables. If there is aught you can do to alleviate our suffering, please... We are at your mercy!""
elemental_magic_lifestyle.2011.opt.a:0 "I will rein in my elemental servants."
elemental_magic_lifestyle.2011.opt.b:0 "My elementals shall go where they please!"
elemental_magic_lifestyle.2011.opt.c:0 "You dare question the spirits' will? You shall be burned alive!"
elemental_magic_lifestyle.2011.opt.d:0 "I must remedy this elemental imbalance."

elemental_magic_lifestyle.2021.t:0 "Totally Stoked"
elemental_magic_lifestyle.2021.desc:0 "In the hot, smoky warrens of our blacksmiths the glow of embers flicker along with the clang of hammers on steel. The heat is oppressive, and sweat immediately begins to bead on your forehead. Yet though all of the trappings are here, the voices of the fire spirits are strangely subdued. Is it the artifice of the environment that repels them? Or simply the fact that the blacksmiths themselves are deaf to their call?/n/nThe head blacksmith approaches, bowing deeply in a gesture of respect. "My [ROOT.Char.GetTitledFirstName]," the blacksmith says, "May [blacksmith.GetFaith.CreatorName] bless the ground you walk upon, and may the spirits follow your steps. As you can see, our smiths are the best in all of [ROOT.Char.GetPrimaryTitle.GetNameNoTier] and they work around the clock to arm your men." I am taken around the forges and shown the methods and improvements made by the smiths, and given a cursory overview of the numbers and outputs./n/n"As you can see, my [ROOT.Char.GetTitleName]," [blacksmith.GetHeShe] continues, "Our work is the best of the best... but it could be better. Your grace's command of the elements of fire is legend in these lands and beyond. The peculiar magical character of their flame could imbue our products with special powers and extend our fuel supplies for greater cost savings. Might there be some way we can use your communion with the sprits to the benefit of the forges?""
elemental_magic_lifestyle.2021.opt.a:0 "A fantastic idea! Take my servant, Calcifer."
elemental_magic_lifestyle.2021.opt.b:0 "I shall personally assist, maybe I could learn something."
elemental_magic_lifestyle.2021.opt.c:0 "I will not debase the elements with this busywork."

