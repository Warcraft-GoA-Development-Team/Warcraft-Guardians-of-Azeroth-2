 alexstraszism_desc: "Смертные последователи Красной драконьей стаи — неустрашимые защитники жизни и естественного порядка. Они верят, что долг оберегать всю жизнь и вершить правосудие, возложенный на красных драконов Аспектом Жизни, даёт высшее право на Божественность, проявляющееся через силу пламени. Их вера подчёркивает праведность и сострадание, поскольку они стремятся защищать уязвимых от сильных. Для последователей Красной стаи жизнь — бесценный дар, который следует беречь и охранять. Для самих Драконов вера в Королеву-Мать и преданность ей равносильны их миссии защищать жизнь и справедливость в соответствии со священным долгом, завещанным Титанами в давние времена."
