  #Shatgral Group Faiths 
 twilights_hammer_cult: "Культ Молота Сумерек"
 twilights_hammer_cult_adj: "Сумеречный"
 twilights_hammer_cult_adherent: "Сумеречный культист"
 twilights_hammer_cult_adherent_plural: "Сумеречные культисты"
 twilights_hammer_cult_desc: "Культ Молота Сумерек — апокалиптический и нигилистический культ, фанатично преданный Древним Богам. Их мировоззрение отвергает любую идею смысла в существовании, полагая, что неизбежная судьба мира — быть поглощённым тьмой. Жестокие и разрушительные, они стремятся ускорить коллапс мира, чтобы исполнить свою тёмную пророчество. Некоторые даже верят, что они предназначены править рядом со своими хозяевами после пророческого #italic Часа Сумерек#!."
  
 cthunism: "К'Тунистск"
 cthunism_adj: "К'Тунизм"
 cthunism_adherent: "К'Тунист"
 cthunism_adherent_plural: "К'Тунисты"
 cthunism_desc: "К'Тун — бог безумия и хаоса, самый могущественный из Древних Богов после смерти Й'Шааржа. Это безмерно злобное существо олицетворяет беспощадную жестокость, неся хаос с ужасной прямолинейностью, а не скрытностью. Его дети кирааджи отражают его натуру, распространяя разрушение и безумие везде, где бы они ни шли."
 cthunism_divine_realm: "Царство Бреда"
