 wc_medium_debris_damage_modifier: "Умеренные разрушения"
 wc_medium_debris_damage_modifier_desc: "Эта провинция сильно пострадала во время осады Гномрегана и последовавшего выброса газа. К счастью, часть работ по восстановлению уже проведена."
