 wc_learn_spell_bless: "Вы изучаете заклинание: [wc_spell_bless|E]"

 game_concept_wc_spell_consecration: "Освящение"
 game_concept_wc_spell_consecration_desc: "Освятите область, сделав её более или менее уязвимой для атак."
 wc_spell_consecration_type: "[wc_spell_type_enchantment|E]"
 wc_spell_consecration_targets: "[county|E]"
 wc_spell_consecration_effects: "Если сотворено на ваше собственное [counties|E], оно получит различные бонусы. Если сотворено на чужое [counties|E], оно получит штраф. Вы можете перенести освящение на соседнее [county|E] дважды, и от него нельзя уклониться с помощью [wc_magic_resistance|E]."
 wc_learn_spell_consecration: "Вы изучаете заклинание: [wc_spell_consecration|E]"
 wc_adventurer_learn_perk_consecration: "#help Поскольку [wc_spell_consecration|E] не подходит безземельному авантюристу, вы будете получать постоянные преимущества, пока остаётесь авантюристом. Получив земли, вы сможете использовать [wc_spell_consecration|E] так, как это задумано для оседлых правителей.#!"

 game_concept_wc_spell_rebuke: "Укор"
 game_concept_wc_spell_rebuke_desc: "Обратитесь с укором к врагу, отменив его текущее заклинание и затруднив сотворение следующего."
