 wc_prowess_from_available_mana_modifier: "Мановая мощь"
 wc_prowess_from_available_mana_modifier_desc: "Благодаря [wc_available_mana_to_stat|E] [wc_stat_mana_icon_gc|E] этот персонаж может заполонять поле боя своими заклинаниями, не утомляя себя."
 wc_prowess_from_available_mana_modifier_scale: "База, без [wc_mana|E]"

 wc_magi_mana_apt_tt: "[wc_stat_mana_icon_gc|E] #P +5#! до #P +15#! [wc_max_mana|E] (в зависимости от [aptitude|E])"
 wc_magi_spells_tt: "Может использовать интеракцию #V Сотворить за меня#!"
 wc_court_caster_position_desc: "От [court_position|E] «Придворный заклинатель»"
 
 wc_summon_fire_elemental_modifier: "Огненный Элементаль"
 wc_summon_fire_elemental_modifier_desc: "Рядом с этим персонажем находится малый огненный элементаль, делающий его огненные заклинания эффективнее и повышающий его [wc_magic_resistance|E] к заклинаниям огня и воды."

 wc_flame_wall_good_modifier: "Стена Огня"
 wc_flame_wall_good_modifier_desc: "Армии этого персонажа были наполнены силой стихий, чтобы сокрушать врагов."

 wc_flame_wall_bad_modifier: "$wc_flame_wall_good_modifier$"
 wc_flame_wall_bad_modifier_desc: "Армии этого персонажа прокляты и будут с трудом сражаться в бою."

 wc_empowered_fire_elemental_modifier: "Усиленный Огненный Элементаль"
 wc_empowered_fire_elemental_modifier_desc: "[fire_elemental|E] этого персонажа будет усилен, причиняя врагам больше урона."
 
 wc_lava_lash_modifier: "Опалённый лавой"
 wc_lava_lash_modifier_desc: "Эта провинция пострадала от лавы, обрушенной могущественным магом."
 
 wc_animate_rage_modifier: "Ожившая Ярость"
 wc_animate_rage_modifier_desc: "Этот персонаж использовал свою магическую силу, чтобы уничтожить артефакт и получить его преимущества."

 wc_backdraft_proc_modifier: "Обратная Тяга"
 wc_backdraft_proc_modifier_desc: "Следующее сотворение заклинания этим персонажем будет бесплатным."

 wc_pyromania_modifier: "Пиромания"
 wc_pyromania_modifier_desc: "[wc_spells|E] элементального огня этого персонажа имеют шанс усилить его ещё больше."

 wc_burnout_modifier: "Выгорание"
 wc_burnout_modifier_desc: "Этот персонаж медленно восстанавливается после сотворения заклинаний, а его сила вытягивается другим магом."

 wc_burnout_good_modifier: "Выгорание"
 wc_burnout_good_modifier_desc: "Этот персонаж получает [wc_magical_prowess|E] каждый раз, когда его цель творит заклинание."

 wc_elemental_fire_minor_protection_modifier: "$planar_fire_header_text$ Малая Защита"
