l_english:

 legion_commander_0001_title: "Will of [ROOT.Char.GetFaith.HighGodName]"
 legion_commander_0001_desc: "I hear a voice call to me in my restless dreams,#XB "Arise... the [GetTrait('being_demon').GetName(GetNullCharacter)] blood that runs within you shall not go to waste... arise... and then burn it all down... let these powers that I will grant you burn brighter than ever within you!"#!\n\nI wake up in a sweat and look around with my weapon in hand, no one is here. I do feel it, the invigorated strength! With this I can defeat anything!... But, is it wise to just accept them?"
 legion_commander_0001_a: "Let this world Burn!"
 legion_commander_0001_b: "I wouldn't risk the wrath neither the favours of [ROOT.Char.GetFaith.HighGodName]"

 legion_commander_0002_title: "Failure then, Failure now"
 legion_commander_0002_desc: "The more I failed, the more I hear the voices I had heard back then... my power is vanishing. My gifts have run dry.\n\nI turn around in panic as I hear a loud voice #XB "Failure!"#!, but no one is there... I take my seat on my throne as I can only hope that I hadn't made a terrible mistake back then..."
 legion_commander_0002_a: "No... this can't be..."
 legion_commander_0002_a_die: "#XB Foul magic from beyond the borders of this reality tear you apart...#!"
 legion_commander_0002_a_live: "#P You are spared... for now...#!"
