l_english:
  BALNAZZAR_DREADLORD_CUSTOM_STRING_KEY:0 "A dreadlord wears a borrowed face and spends a mortal lifetime reaching for a throne that was never his."

  wc_balnazzar_story.1000.title:0 "A Throne of Ash"
  wc_balnazzar_story.1000.desc:0 "Archimonde is dead these many years, and Kel'Thuzad answers to no one who might still answer to me. No order has come from the Legion since Lordaeron fell into ash - no host, no herald, not even a whisper on the wind that once carried Sargeras' will.\n\nDetheroc is gone. Banished by the very Forsaken he thought beneath him, unmade before he even understood what Sylvanas Windrunner had become. Varimathras kneels to her now in this same Undercity - whether in truth or in the same patient pretense I have always favored, I cannot say, and it hardly matters. He does not answer to me either.\n\nThat leaves only this ruined kingdom, and me, and no one left alive who could tell me I am doing this wrong."
  wc_balnazzar_story.1000.a:0 "A crown built to survive its wearer."
  wc_balnazzar_story.1000.a_tooltip:0 "Lets you study Dathrohan as a potential vessel - right-click him to begin"
  wc_balnazzar_story.1000.b:0 "I will improvise, if it comes to that."

  wc_balnazzar_story.1001.title:0 "The Old Kingdom Slips"
  wc_balnazzar_story.1001.desc:0 "Lordaeron is gone from my hands - lost to whichever fool or hero took it this time, it hardly matters which. A throne was only ever going to be scaffolding for something else, and thrones can be rebuilt. Bodies are harder to come by twice.\n\nVarimathras owes me the kind of favor brothers only call in once - a corpse burned past telling, when the time comes, and grief performed by no one who matters. Until then, I go to ground in the Plaguelands and watch. What crawls out from under that lie, eventually, will answer to no one - not the Legion, not Sylvanas, not whatever is left of Lordaeron's throne. It only needs somewhere to hide, and something worth building in the meantime."
  wc_balnazzar_story.1001.a:0 "Go to ground in the Plaguelands."
  wc_balnazzar_story.1001.a_tooltip:0 "Give up any land you still hold and become a landless adventurer, wandering exiled from the throne you once held"

  wc_balnazzar_story.1010.title:0 "Between Two Worlds"
  wc_balnazzar_story.1010.desc:0 "Varimathras finds me a corpse worth burning and a story worth spreading, and asks nothing in return but that I remember whose favor this was, later, when it matters. Word will travel from here on its own - a dreadlord, dead in his own ruined hall, no witnesses worth doubting.\n\nWhat is left of me walks out of Lordaeron with no name, no crown, no host at my back. A Scourge patrol crosses my path on the road out and does not so much as turn its head - the dead know their master's voice well enough, and I have worn enough borrowed faces to sound like almost anyone they'd answer to. Just a shape that used to matter, unmade and remade, headed somewhere the Scourge has already stopped looking."
  wc_balnazzar_story.1010.a:0 "Let Varimathras handle it. His favors are cheaper than my time."
  wc_balnazzar_story.1010.b:0 "Oversee it myself. A lie is only as good as the one who tells it."

  wc_balnazzar_story.1009.title:0 "Into the Ruin"
  wc_balnazzar_story.1009.desc:0 "I settle into the wasteland the way rot settles into a wound - slowly, and without anyone noticing until it's already finished. Silver Hand remnants still work these roads in ones and twos, burning what the Scourge leaves standing and calling it faith. Weeks of watching narrow the field for me, the way patience always does.\n\nOne of them is worth more than the rest put together: Saidan Dathrohan, respected, trusted, exactly unremarkable enough that no one will look twice once I am wearing him. I did not come looking for him by name. I did not need to. Patience finds better prey than hunting ever does."
  wc_balnazzar_story.1009.a:0 "Watch from a distance. There is no hurry."
  wc_balnazzar_story.1009.b:0 "Move in closer. I want to see his face sooner."

  wc_balnazzar_story.1002.title:0 "A Face Not His Own"
  wc_balnazzar_story.1002.desc:0 "He is here somewhere, in Stratholme's ruin - I have felt it for weeks now, the particular stillness of a man who still thinks he is hunting the dead instead of being hunted himself.\n\nI find him alone, exactly where patience said he would be. 'Who--? You...are Legion,' is all he manages, before the Light even reaches his hand.\n\nMy kind are called Nathrezim. Dreadlords, in your tongue. Perhaps Thal'kituun would be more fitting. It means unseeing guest in your language. Fitting because I have existed here, between the world of the living and the dead, awaiting a moment such as this, under the very noses of the Scourge - without their slightest suspicion.\n\nKnow that I am Balnazzar. Know, as I drink your life, that I will take up residence in this weak shell your soul once called home. Know that I will corrupt and destroy everything and everyone you have ever loved.\n\nThe rest is arithmetic. A body found burned past recognition in the throne room. A dreadlord, dead at last, mourned by no one who matters. And underneath the Crusader's steel and prayer, only me.\n\nBalnazzar dies today. Something wearing his patience does not."
  wc_balnazzar_story.1002.desc_prepared:0 "He is here somewhere, in Stratholme's ruin - I have felt it for weeks now, the particular stillness of a man who still thinks he is hunting the dead instead of being hunted himself. Nothing about the waiting was improvised - I have been ready for this exact moment for years.\n\nI find him alone, exactly where patience said he would be. 'Who--? You...are Legion,' is all he manages, before the Light even reaches his hand.\n\nMy kind are called Nathrezim. Dreadlords, in your tongue. Perhaps Thal'kituun would be more fitting. It means unseeing guest in your language. Fitting because I have existed here, between the world of the living and the dead, awaiting a moment such as this, under the very noses of the Scourge - without their slightest suspicion.\n\nKnow that I am Balnazzar. Know, as I drink your life, that I will take up residence in this weak shell your soul once called home. Know that I will corrupt and destroy everything and everyone you have ever loved.\n\nThe rest is arithmetic. A body found burned past recognition in the throne room. A dreadlord, dead at last, mourned by no one who matters. And underneath the Crusader's steel and prayer, only me.\n\nBalnazzar dies today. Something wearing his patience does not."
  wc_balnazzar_story.1002.a:0 "Wear the mask."
  wc_balnazzar_story.1002.a_tooltip:0 "Kills Saidan Dathrohan and takes his body - your old identity dies for good, and you continue play as Dathrohan, inheriting his rank, court and holdings. Your magic talents and true nature carry over, hidden beneath the disguise"
  wc_balnazzar_story.1002.b:0 "Dathrohan is already gone. There is nothing left here worth wearing."
  wc_balnazzar_story.1002.b_tooltip:0 "The story ends here - there is no shell left worth wearing, and nothing left to build toward"

  wc_balnazzar_story.1003.title:0 "The Skin Settles"
  wc_balnazzar_story.1003.desc:0 "Dathrohan's face has not finished becoming mine. I pause before I speak, listening for a voice that used to answer differently, and I catch it every time before anyone else could.\n\nNo matter. Grief wears the same face on any man, and grief is all a Grand Crusader owes his court tonight. Renault's jealousy still needs tending. An army still needs a reason to kneel. And in Stratholme's crypts, an old debt waits on patience it was never promised."
  wc_balnazzar_story.1003.a:0 "Send word to the crypts tonight."
  wc_balnazzar_story.1003.a_tooltip:0 "Kel'Thuzad will already be expecting you, when the time comes - reaching for him before the grief has settled will not go unnoticed later"
  wc_balnazzar_story.1003.b:0 "Let the grief run its course first."
  wc_balnazzar_story.1003.b_tooltip:0 "The pact with Kel'Thuzad forms more slowly, but the wait buys it a quieter foundation"

  wc_balnazzar_story.1004.title:0 "A Son's Envy"
  wc_balnazzar_story.1004.desc:0 "Renault watches his brother Darion the way a starving man watches a feast - Alexandros' pride, his martial gift, his birthright. Renault has none of it, and knows it, and it eats at him.\n\nI need only water the seed already planted. A word here about how a father favors one son over another. A suggestion that Alexandros means to disinherit him. None of it needs to be true. It only needs to be believed.\n\nKel'Thuzad is already settled - the dead are his to raise, on the day Renault leads his father through. All that's left is Renault himself."
  wc_balnazzar_story.1004.a:0 "Let the boy prove himself to his father."
  wc_balnazzar_story.1004.a_tooltip:0 "Starts a scheme to have Alexandros Mograine assassinated"
  wc_balnazzar_story.1004.b:0 "Renault is beyond reach. The seed dies unplanted."
  wc_balnazzar_story.1004.b_tooltip:0 "The story ends here - without Renault, there is no lever left to move against Alexandros"

  wc_balnazzar_story.1005.title:0 "An Old Understanding"
  wc_balnazzar_story.1005.desc:0 "Kel'Thuzad does not need summoning so much as noticing - a stillness in the crypts that wasn't there before, a voice arriving without a messenger. I tell him what I need: that Stratholme's dead rise thick enough, on the day I finally have cause to send Renault's father through, that no one asks why the ambush succeeded.\n\nHe does not ask for gold, or favor, or even gratitude. Only that I remember, when some ledger comes due, that the dead were his idea first. I agree. It costs me nothing to agree with a corpse."
  wc_balnazzar_story.1005.desc_confirmed:0 "What Kel'Thuzad and I settled the night I sent word needs only saying aloud now, so neither of us mistakes the other's meaning later. Stratholme's dead will rise thick enough, on the day I finally have cause to send Renault's father through, that no one asks why the ambush succeeded.\n\nHe does not ask for gold, or favor, or even gratitude - he never did. Only that I remember, when some ledger comes due, that the dead were his idea first. I agreed to that already. Saying it again costs me nothing."
  wc_balnazzar_story.1005.a:0 "Agree to his price."
  wc_balnazzar_story.1005.b:0 "Kel'Thuzad is gone. The dead will rise on their own account, or not at all."
  wc_balnazzar_story.1005_pact_tooltip:0 "Seals your understanding with Kel'Thuzad - clears the way to turn Renault against his father"

  wc_balnazzar_story.1006.title:0 "Blood on Silver"
  wc_balnazzar_story.1006.desc:0 "Renault comes to me after, hollow-eyed, empty-handed - he could not carry the blade any further than the doorway he killed his father in. I offer him what a father never quite managed - approval, dressed as duty. Before the chapter, I bless him as Commander of what comes next, and raise Isillien and the Abbendises up beside him - men already so certain of their own righteousness that they will never think to ask why I chose them.\n\nThe Order kneels to its Grand Crusader, as it always has. It simply doesn't know yet what he's Grand Crusader of.\n\nSilver was always a borrowed color, a knight's shine lent by a light that was never truly the Order's to keep. I have it dyed properly, at last. The lion on white stays - Lordaeron's own, unmistakable even now - but the beast itself runs red, the way everything under this banner eventually does.\n\nWhat was a kingdom's crown and a kingdom's second crown beside it - Lordaeron's own throne, and Stratholme's, the ground this Crusade was born standing on - answers to the Order now, not to whatever was left holding either title. I did not have to conquer the paperwork. Alexandros' death did that for me, and Renault's hand did the rest.\n\nA banner needs an army under it before anyone takes the color seriously. I raise one - not a garrison, a host, drawn from every hall the Order still commands - and give it a purpose older than the color itself: answer the dead with the dead's own patience, until there's nothing left in Lordaeron that still remembers how to rise."
  wc_balnazzar_story.1006.a:0 "Let the Scarlet Crusade be born."
  wc_balnazzar_story.1006.a_tooltip:0 "Seizes the Order of the Silver Hand, refounds it as the Scarlet Crusade, converts your realm to Scarletism and your own culture to Lordaeronian, and raises its founding army"
  wc_balnazzar_story.1006.b:0 "Without Renault, there is no Order left to inherit."
  wc_balnazzar_story.1006.b_tooltip:0 "The story ends here - without Renault, there is no Order left to inherit"
  scarlet_crusade_custom_name:0 "Scarlet Crusade"

  wc_balnazzar_story.1007.title:0 "Stratholme Falls"
  wc_balnazzar_story.1007.desc:0 "The city is ours. Whatever crawled through its streets since Arthas' purge has been put to the sword a second time, and the banners going up over its gates are Scarlet, not silver skulls.\n\nThe old faith isn't burned out yet - that will take longer than a single battle. But the ground it stood on belongs to me now."
  wc_balnazzar_story.1007.a:0 "Let it burn cleaner, in time."

  wc_balnazzar_story.1008.title:0 "The Ashes Made Whole"
  wc_balnazzar_story.1008.desc:0 "Stratholme is ours again - every street, every farm, every soul in it burned clean of whatever it believed before. New Avalon stands beside it, a monument built on ground that used to belong to Kel'Thuzad's silence.\n\nThe Order I inherited never held this much of its own founding city. I have. Word of it will travel further than I'd like - but let them talk. A kingdom that fears you is already halfway to kneeling."
  wc_balnazzar_story.1008.a:0 "Let them talk."

  wc_balnazzar_story.1015.title:0 "A Commander's Crisis of Faith"
  wc_balnazzar_story.1015.desc:0 "One of my own commanders has stopped sleeping well. I hear it from the servants before I see it in him - a man arguing with something only he can hear, somewhere between the zeal he swore to and whatever conscience the Light left behind in him. He will settle one way or the other. They always do."
  wc_balnazzar_story.1015.a:0 "Let it settle on its own."
  wc_balnazzar_story.1015.a.zeal:0 "The doubt loses. He comes to me after, quieter than usual, and swears himself to the Crusade all over again - more useful for having questioned it once and lost."
  wc_balnazzar_story.1015.a.doubt:0 "The doubt wins. He does not confront me. He simply stops pretending, gathers what men will still follow him, and starts asking them a question I already know the answer to."

  wc_balnazzar_story.1016.title:0 "The Silver Hand's Old Guard"
  wc_balnazzar_story.1016.desc:0 "Not every hand raised against Stratholme's dead belonged to the Crusade first. Some of these holdouts wore the Silver Hand's colors before mine ever touched this ground, and purification only goes so deep before it hits something that won't burn out quietly."
  wc_balnazzar_story.1016.a:0 "See which way they break."
  wc_balnazzar_story.1016.a.absorbed:0 "They break my way. Whatever loyalty they had left finds somewhere new to stand - on my ground, under my banner."
  wc_balnazzar_story.1016.a.holdout:0 "They break the other way. Word travels through the household before I hear it myself - the old Light hasn't left this family as thoroughly as I'd assumed."

  wc_balnazzar_story.1017.title:0 "Kel'Thuzad's True Price"
  wc_balnazzar_story.1017.desc:0 "Every pact has a bill that comes due eventually, and Kel'Thuzad has never been a patient creditor. I find myself wondering, more often than I'd like, whose purposes I am actually still serving."
  wc_balnazzar_story.1017.a:0 "Wait and see."
  wc_balnazzar_story.1017.a.holds:0 "The arrangement holds. Whatever he wants from this, it isn't my throne - not yet, at least."
  wc_balnazzar_story.1017.a.overreach:0 "It doesn't hold. He reaches for something I never offered, and I feel the shape of his ambition for the first time - close enough now that I can't pretend not to notice it."

  wc_balnazzar_story.1018.title:0 "Renault's Breaking Point"
  wc_balnazzar_story.1018.desc:0 "Renault still does everything I ask of him, and asks nothing in return but to be left alone with it. That kind of silence doesn't last forever in a man who used to believe in something. Sooner or later it either hardens into something I can use, or it cracks."
  wc_balnazzar_story.1018.a:0 "Watch him carry it."
  wc_balnazzar_story.1018.a.broken:0 "It hardens. Whatever was left of the man who hesitated at his father's door is gone now - what's left just does as it's told."
  wc_balnazzar_story.1018.a.turns:0 "It cracks. I see it in his face before he says a word - he has stopped believing the story I gave him, and started looking for the true one underneath it."

  wc_balnazzar_story.0100.title:0 "The Failing Shell"
  wc_balnazzar_story.0100.desc:0 "This body is failing - slower than a mortal's, faster than it should for what I really am. No heir waits to take up Dathrohan's name when it goes, and a name with no one to inherit it is a debt with no one left to collect it.\n\nI could let it end quietly, and trust whoever inherits the throne to sort out the rest. Or I could make certain something far worse than an empty title is waiting for whoever comes looking."
  wc_balnazzar_story.0100.a:0 "Make sure something worse is waiting."
  wc_balnazzar_story.0100.b:0 "Let it end quietly."

  wc_balnazzar_story.0101.title:0 "A Familiar Stranger"
  wc_balnazzar_story.0101.desc:0 "Grand Crusader Dathrohan has not been himself. Small things - a turn of phrase, a flash of temper that isn't like him, the way he sometimes looks at his own reflection like it's a stranger's. I have said nothing. Not yet."
  wc_balnazzar_story.0101.a:0 "Reassure them. Whatever they think they saw, it was nothing."
  wc_balnazzar_story.0101.b:0 "Have them quietly imprisoned before they say this to anyone else."
  wc_balnazzar_story.0101.c:0 "Say nothing. Let them keep wondering."
  wc_balnazzar_story.0101.d:0 "Look into what they actually know, before deciding what to do about them."

  wc_balnazzar_story.0102.title:0 "Under the Ashes"
  wc_balnazzar_story.0102.desc:0 "The purge continues, county by county, faith by faith. It is necessary work. It is also work best done quietly - and quiet work invites quiet eyes."
  wc_balnazzar_story.0102.a:0 "Continue."
  wc_balnazzar_story.0102.a_tooltip:0 "Someone among your court has noticed something wrong about you"

  wc_balnazzar_story.2000.title:0 "The Mask Comes Off"
  wc_balnazzar_story.2000.desc:0 "The shell was never going to last - stolen flesh ages faster than it should, and even the most careful lie eventually meets someone clever enough, or stubborn enough, to see through it. I have spent years being patient. Patience was only ever a tool.\n\nSaidan Dathrohan dies here, properly this time. Let the rest of the Crusade march on without him, chasing a war I no longer need. Stratholme was always the only piece of it that was ever truly mine."
  wc_balnazzar_story.2000.a:0 "Take Stratholme. Let the rest of the Crusade have its war."
  wc_balnazzar_story.2000.a_tooltip:0 "Reveals your true nature, breaks your capital and every held duchy away from the Crusade, and raises the Risen to hold them"
  wc_balnazzar_story.2000.rivals_react_tooltip:0 "Everyone who ever suspected the truth about you now knows they were right"
  the_risen:0 "The Risen"

  wc_balnazzar_story.1019.title:0 "Varimathras' Price"
  wc_balnazzar_story.1019.desc:0 "Varimathras never asked for gold when he found me a corpse to burn and a story to spread. Only that I remember, later, whose favor this was. Years on, I find myself wondering whether that was ever the whole of it - or whether the brother who 'helped' was never done serving the Legion at all."
  wc_balnazzar_story.1019.a:0 "See what he wants, now that the debt is called."
  wc_balnazzar_story.1019.a.keeps_word:0 "He keeps his word, and asks nothing more of me than what was already owed. A favor remembered is worth more to him than anything I could pay outright."
  wc_balnazzar_story.1019.a.legion_resurfaces:0 "The debt was never the point. Something older than our arrangement surfaces in him - the Legion's own patience, wearing a brother's face the way I once wore Dathrohan's. He knows too much about me to be anything but dangerous now."

  wc_balnazzar_story.0103.title:0 "Whispers Among the Vassals"
  wc_balnazzar_story.0103.desc:0 "The purge does not stay confined to the county it starts in. Word of it reaches every vassal who holds land under me, and each of them draws their own conclusions about what kind of liege they actually serve."
  wc_balnazzar_story.0103.a:0 "Let them draw their own conclusions."
  wc_balnazzar_story.0103.a.complacent:0 "Most of them stay quiet. Whatever unease the purge stirs up, it isn't enough to outweigh what they'd lose by speaking against me."
  wc_balnazzar_story.0103.a.uneasy:0 "Not this one. He has seen enough of what I do to his own people to stop trusting what I might do to his."

  rival_darion_suspects_balnazzar:0 "Suspects there is something wrong with the man wearing Saidan's face"
  rival_commander_doubts_the_crusade:0 "Doubted the Crusade and lost, but never forgot the doubt"
  rival_silver_hand_holdout:0 "Never truly accepted the Crusade's rule"
  rival_kelthuzad_overreach:0 "Reached for more than the pact ever promised"
  rival_renault_turns:0 "Has stopped believing the story he was given"
  rival_varimathras_legion_loyalty:0 "Knows too much, and the Legion's patience runs through him still"
  rival_vassal_purge_unrest:0 "Has seen too much of what the purge does to trust what comes next"
