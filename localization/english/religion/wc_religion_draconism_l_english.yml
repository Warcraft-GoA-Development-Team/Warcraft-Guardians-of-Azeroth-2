 draconism_religion_desc:0 "The divine mantle of Azeroth's protectorship was passed down first from the [Glossary( 'Titans', 'TITAN_GLOSS' )] to the Keepers, then from the Keepers to the Dragons. For the Dragons themselves, Draconism exemplifies their [wc_race|E]'s promise to uphold their sacred duty; yet many lesser creatures have also devoted themselves to serving these mighty beings with religious fervor. When dragons empower these mortals, they transform into dragonspawn and drakonid, drawing their strength from the dragons they serve. "

