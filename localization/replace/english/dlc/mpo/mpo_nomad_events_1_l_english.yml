l_english:

mpo_nomad_events.1000.army_camp: "Survivors of the bloody fight at [beheaded_warrior_location.GetName] join my host, whipping their [beheaded_warrior.Custom('GetCulturalMountPlural')] to their last breath. From one's saddle-strings swings a dripping head — bearing the deathly face of"

mpo_nomad_events.1030.desc.outro: "to the subtle art of the bow... or perhaps [child.GetSheHe] should master the [ROOT.Char.Custom('GetCulturalMount')]-craft that guides our herds and brings our raiders swiftly home?""

mpo_nomad_events.1030.d.flavor: "And upon your obedient [ROOT.Char.Custom('GetCulturalMount')], you may sing out and join in the long races."

 mpo_nomad_events.1050.desc: "[herder.GetTitledFirstName], a shabby [herder.GetWomanMan] stinking of goats' piss, professes [herder.GetHerselfHimself] the minder of [herder_county.GetNameNoTierPossessive] nearby [herder.GetCapitalLocation.GetTerrain.GetNameNoTooltip|l].\n\n"Your [ROOT.Char.GetPrimaryTitle.GetAdjective] herders ignore the traditional bounds!" [herder.GetSheHe] says. "I move my flock to new ground, and the soil is barren! The wind carries the cackling of your riders, and the sounds of their fat [ROOT.Char.Custom('GetCulturalMountPlural')]!"\n\n"Can we not honestly share the land, [ROOT.Char.GetTitleAsName]?""
 
 po_nomad_events.1060.c: ""Bring furs, yogurt, fine [ROOT.Char.Custom('GetCulturalMountPlural')!""
 
 mpo_nomad_events.1070.desc_intro: "I waken, with [ROOT.Char.Custom('GetCulturalMount')]-breath in my mouth.\n\n"
 mpo_nomad_events.1070.desc_spiritual: "carrying the whispers of spirits, telling of the holy trance that roused me from bed, took me to a lone [ROOT.Char.Custom('GetCulturalMount')] standing in moonlight..."
 mpo_nomad_events.1070.desc_mental_thing: "howling my own mad midnight curses: though my kin tried to calm me, I could not be among them. I went into the night with just this quiet [ROOT.Char.Custom('GetCulturalMount')]..."
 mpo_nomad_events.1070.desc_new_drunk: "bearing heavy bowls of [ROOT.Char.Custom('RegionalDrink')], [ROOT.Char.Custom('GetCulturalMountFoot')]-beats, and the feeling of a dark mane pressed against my cheek..."
 begin_warhorse_story_tt: "This [ROOT.Char.Custom('GetCulturalMount')] becomes your beloved favorite"
mpo_nomad_events.1070.b: "Never again! I swear it, [ROOT.Char.Custom('GetCulturalMount')]: #EMP never again!#!"
mpo_nomad_events.1070.d.success: "You retrace your [ROOT.Char.Custom('GetCulturalMount')]'s tracks"

nomad_alone_in_adversity_modifier: "Trusts in Horses"
nomad_alone_in_adversity_modifier_desc: "When in a terrible situation, this nomad trusts nothing more than the survival instinct and the speed of horses."