l_english: 
 generic_rite_focus_tenet_death_syncretism: "This rite views the state of Death not with fear, but awe and reverence."
 generic_rite_focus_tenet_disorder_syncretism: "This rite readily absorbs the teachings of the Fel, reading the screams of chaos as echoes of sacred truth."
 generic_rite_focus_tenet_elemental_syncretism: "This rite recognizes the spirits that dwell within the Elements of the world."
 generic_rite_focus_tenet_life_syncretism: "This rite values the Life that dwells in all creatures that draw breath."
 generic_rite_focus_tenet_light_syncretism: "This rite readily absorbs the warmth and brightness of the Light as its own."
 generic_rite_focus_tenet_order_syncretism: "This rite accepts the beliefs of belonging in a grand ordered design."
 generic_rite_focus_tenet_shadow_syncretism: "This rite embraces the Darkness instead of fearing it."
 generic_rite_focus_tenet_eastern_kingdoms_syncretism: "This rite binds itself on the shared principles that the civilized races of the $world_eastern_kingdoms$ hold."
 generic_rite_focus_tenet_cult_of_strength: "This rite sanctifies physical strengh and its pursuit of it for reaching the divine."
 generic_rite_focus_tenet_ritual_hunt: "This rite regards the act of hunting other beings as sacred."
 generic_rite_focus_tenet_progressivism: "This rite exalts technological advancement and pursuit of further innovation."
 generic_rite_focus_tenet_consumerism: "This rite holds that economic development and accumulation of wealth are the most important goals."
 generic_rite_focus_tenet_moon_worship: "This rite honors the moon as a life-giving sign of order, radiance, and divine favor."
 generic_rite_focus_tenet_bloody_feast: "This rite offers the flesh of sapient beings to be consumed in a sacred bargain between mortal and divine."
 generic_rite_focus_tenet_holy_struggle: "This rite praises steadfast zeal, hard resolve, and a readiness to struggle and war for what is holy."
 generic_rite_focus_tenet_purge_of_heresy: "This rite seeks to purify itself from corruption, employing ruthless means."
 generic_rite_focus_tenet_united_against_darkness: "This rite aims to unify the righteous peoples of the world against the enroaching horrors that seek to end it."
 generic_rite_focus_tenet_anticlericalism: "This rite rejects the clergy's role as mediators with the divine, holding that none has more of a right to it than another."

