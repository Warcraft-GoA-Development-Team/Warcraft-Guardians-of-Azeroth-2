l_english:

 nordrassilsdestruction_0001_title: "Demigod Amongst Mortals"
 nordrassilsdestruction_0001_desc: "I feel the power swelling within me as I absorb the [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )] for myself.\n\nYes! Now the Night Elves shall be laid barren from their precious immortality, and I shall be the most powerful amongst them!"
 nordrassilsdestruction_0001_a: "I am the Bane of the Night Elves!"

 nordrassilsdestruction_0002_title: "God Amongst Mortals"
 nordrassilsdestruction_0002_desc: "I feel the power swelling within me as I absorb the [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )] for myself.\n\nYes! Now the Night Elves shall be laid barren from their precious immortality, and I shall be the most powerful even among Gods!"
 nordrassilsdestruction_0002_a: "I am the Scourge of all who live!"

 nordrassilsdestruction_0003_title: "Terror of a "Demigod""
 nordrassilsdestruction_0003_desc: "Our bones seem to crack and feel brittle as we feel the absence of what remained of the [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )] have been absorbed by [destroyer.GetName].\n\n[destroyer.GetSheHe] is not powerful to the point of no return, [destroyer.GetFirstName] can be taken down!"
 nordrassilsdestruction_0003_a: "[destroyer.GetFirstName] needs to be dealt with quickly!"

 nordrassilsdestruction_0004_title: "Terror of a "God""
 nordrassilsdestruction_0004_desc: "We cough and choke as the sudden absence powers that kept us immortal and well are gone. The [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )] have been absorbed in its entirety by [destroyer.GetName].\n\n[destroyer.GetSheHe] has now grown absurdly powerful, [destroyer.GetFirstName] needs to be dealt with but not without caution or alliances."
 nordrassilsdestruction_0004_a: "We need to be wary of [destroyer.GetFirstName]..."
