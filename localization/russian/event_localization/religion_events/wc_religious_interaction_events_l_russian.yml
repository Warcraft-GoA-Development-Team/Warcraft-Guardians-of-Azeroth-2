l_russian:
  # Religious Head of Faith Interactions 
 wc_religious_interaction.1010: "После долгих размышлений я принял решение раскаяться в своих грехах. Решение Инквизиции заклеймить меня еретиком было совершенно справедливым.\n\nЯ смиренно прошу, чтобы это не затмило моих будущих деяний во славу [actor.GetFaith.HighGodName]. Если по воле [actor.GetFaith.HighGodName] Инквизиция дарует мне милость Света, я буду бесконечно благодарен."
 wc_religious_interaction.1010.accept: "Что ж, [actor.GetName], мы принимаем твою покорность."
 wc_religious_interaction.1010.refuse: "Ты ещё не заслужил искупления, [actor.GetName]..."
 wc_religious_interaction.1011: "Мы получили твоё послание, [actor.GetTitledFirstName]. Инквизиция ценит твою готовность сдаться. Агенты уже выехали за тобой, и тебе надлежит оказать им полное содействие.\n\nЗнай, что это не избавит тебя от суровой кары, но твой выбор не бежать и не сопротивляться может завоевать тебе доверие некоторых."
 wc_religious_interaction.1011.cynical: "Давайте покончим с этим."
 wc_religious_interaction.1011.zealous: "Свет – моя сила, Инквизиция, делайте, что должны."
 wc_religious_interaction.1011.deceitful: "Я знал, что до этого дойдёт. Я готов."
 wc_religious_interaction.1011.arrogant: "Ваши дознаватели меня не сломают."
 wc_religious_interaction.1011.normal: "Я знаю, что невиновен — и они это поймут."
 wc_religious_interaction.1012: "Мы получили твоё послание, [actor.GetTitledFirstName]. Инквизиция решила не принимать твою сдачу. Если говорить прямо, то обвинения против тебя слишком тяжки, чтобы позволить тебе выбирать условия покаяния. Надеемся, что твоё раскаяние сохранится, когда истинная кара настигнет тебя."
 wc_religious_interaction.1012.deceitful: "Они чуют ловушку."
 wc_religious_interaction.1012.paranoid: "Им не нужна моя исповедь, им нужна моя голова!"
 wc_religious_interaction.1012.zealous: "Пусть [actor.GetFaith.HighGodName] простит их!"
 wc_religious_interaction.1012.cynical: "Показуха за показуху."
 wc_religious_interaction.1012.arrogant: "Их прощение мне не нужно."
 wc_religious_interaction.1012.normal: "Видимо, у них есть заботы поважнее."
  
 wc_religious_interaction.1020: "Некоторые из твоих собратьев поставили под сомнение твою веру и нравственность. [actor.GetTitledFirstName] лично свидетельствовал о твоих грехах, и я не могу оставить это без внимания."
 wc_religious_interaction.1021: "Ты обвиняешься в предательстве заветов [actor.GetFaith.HighGodNameAlternate]. Слишком долго твои поступки оставались незамеченными, но этому пришёл конец. Тебе предстоит предстать перед [actor.GetFaith.ReligiousHeadTitleName] или быть заклеймённым как еретик. Да снизойдёт на тебя милость [actor.GetFaith.HighGodName]... ведь от нас её не жди."
 wc_religious_interaction.1022: "[actor.GetTitledFirstName], твой донос о ереси [secondary_recipient.GetTitledFirstNamePossessive] вызывает серьёзные опасения. Мы не можем позволить такой скверне существовать под нашим присмотром, поэтому я возложил Алый Знак на [secondary_recipient.GetHerHim|l], заклеймив его врагом [actor.GetFaith.HighGodNameAlternate]."
 wc_religious_interaction.1023: "Миссия [actor.GetFaith.HighGodNameAlternate] свята и требует того же от своих последователей. Каждый [actor.GetFaith.GetAdherentNameNoTooltip] обязан следить за своими братьями и сестрами, обличать их в неверии и указывать на их грехи.\n\nОднако твоя просьба наложить Алый Знак на [secondary_recipient.GetTitledFirstName] была отклонена. Инквизиция не нашла достаточных оснований для таких мер. Советую впредь быть осторожнее со своими обвинениями, иначе подозрение падёт на тебя самого."
 wc_religious_interaction.1024: "[recipient.GetTitledFirstName], ты несёшь Алый Знак — клеймо закоренелого еретика. Грехи, что привели тебя к этому, не забыты, но мы верим, что ты ещё можешь искупить их.\n\nВремя, проведённое тобой под Знаком, стало достаточно тяжким испытанием. Поэтому я постановил снять с тебя это клеймо. С этого дня ты вновь можешь вернуться в ряды Верных."
 wc_religious_interaction.1110: "Твой пленник, [recipient.GetFirstName], благополучно доставлен, и мы весьма признательны тебе за то, что ты передал [recipient.GetHerHim|l] нам для искупления. Инквизиция признаёт твою верность [actor.GetFaith.HighGodNameAlternate] и наградит тебя по заслугам."
 wc_religious_interaction.1110.zealous: "Я исполнил свой долг перед Светом."
 wc_religious_interaction.1110.vengeful: "Это только начало страданий [recipient.GetHerHis|l]..."
 wc_religious_interaction.1110.sadistic: "Жаль, что я не смогу понаблюдать за их муками лично."
 wc_religious_interaction.1110.normal: "Во имя [actor.GetFaith.HighGodNameAlternate]!"
 wc_religious_interaction.1115: "Твоё мерзкое присутствие оскверняло мои казематы слишком долго. Моя вера даровала мне мудрость и силу, и по совету [actor.GetFaith.PriestNeuterPlural] я решил передать тебя в руки Инквизиции.\n\nЭто не освобождает тебя от вины, ибо отныне твоя судьба в руках [inquisitor.GetName]..."
