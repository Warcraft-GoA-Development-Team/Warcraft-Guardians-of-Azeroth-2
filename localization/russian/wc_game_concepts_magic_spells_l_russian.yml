 game_concept_wc_spell_counterspell: "Антимагия"
 game_concept_wc_spell_counterspell_desc: "Направьте поток враждебной магии обратно на того, кто её сотворил, сокрушив силу заклинания и оставив колдуна уязвимым перед собственной мощью. Пусть его же сила станет его погибелью."
 wc_spell_counterspell_type: "[wc_spell_type_enchantment|E]"
 wc_spell_counterspell_targets: "[character|E]"
 wc_spell_counterspell_effects: "Отражает эффекты враждебного заклинания обратно на того, кто его сотворил."
 wc_learn_spell_counterspell: "Вы изучаете [wc_spell_counterspell|E]"

 game_concept_wc_spell_spellsteal: "Чарокрад"
 game_concept_wc_spell_spellsteal_desc: "Поглотите магию врага, обратив его защитные заклинания в свою пользу. Его сила станет вашей, а он останется беззащитным, пока вы процветаете, питаясь его заклинаниями."
 wc_spell_spellsteal_type: "[wc_spell_type_attack|E]"
 wc_spell_spellsteal_targets: "[character|E]"
 wc_spell_spellsteal_effects: "Похищает эффекты модификатора [wc_spell|E] у целевого [character|E]."
 wc_learn_spell_spellsteal: "Вы изучаете [wc_spell_spellsteal|E]"
 wc_spellsteal_effect: "Вы похищаете случайный [wc_spell|E] [modifier|E] у [this_recipient.GetShortUIName]"


 game_concept_wc_spell_scry: "Прорицание"
 game_concept_wc_spell_scry_desc: "Прозрите скрытые пути, почувствуйте опасности и постигните мудрейший курс. Позвольте неопределённости отступить, ведя вас с ясностью к безопасности и успеху."
 wc_spell_scry_type: "[wc_spell_type_enchantment|E]"
 wc_spell_scry_targets: "[character|E]"
 wc_spell_scry_effects: "Делает целевого [character|E] успешнее не только в защите от [schemes|E] и их раскрытии, но и в осуществлении собственных."
 wc_learn_spell_scry: "Вы изучаете [wc_spell_scry|E]"

 game_concept_wc_spell_haste: "Ускорение / Замедление"
 game_concept_wc_spell_haste_desc: "Измените течение времени вокруг себя: ускорьте свои шаги до размытой тени или замедлите врагов до ползучей поступи, подчинив темп битвы своей воле."
 wc_spell_haste_type: "[wc_spell_type_enchantment|E]"
 wc_spell_haste_targets: "[character|E]"
 wc_spell_haste_effects: "При сотворении на себя: ускоряет сотворение [wc_spell] и сокращает их перезарядку. При сотворении на других: замедляет сотворение заклинаний и их перезарядку."
 wc_learn_spell_haste: "Вы изучаете [wc_spell_haste|E]"

 game_concept_wc_spell_conjure_refreshment: "Сотворение Еды"
 game_concept_wc_spell_conjure_refreshment_desc: "Призовите тайное пропитание: сотворите либо сытную снедь, либо магические эликсиры — каждое создано, чтобы восстановить и укрепить вкусившего."
 wc_spell_conjure_refreshment_type: "[wc_spell_type_enchantment|E]"
 wc_spell_conjure_refreshment_targets: "[character|E]"
 wc_spell_conjure_refreshment_effects: "Целевой [character|E] либо получит еду, укрепляющую здоровье, либо напиток, усиливающий магию."
 wc_learn_spell_conjure_refreshment: "Вы изучаете [wc_spell_conjure_refreshment|E]"

 conjure_refreshment_tt1: "После начала сотворения вы можете выбрать, дать ли [this_recipient.GetShortUIName|U] модификатор [GetModifier('wc_conjure_food_modifier').GetNameWithTooltip|L] или модификатор [GetModifier('wc_conjure_drink_modifier').GetNameWithTooltip|L]."
 conjure_refreshment_tt2: "После начала сотворения вы можете выбрать, дать ли [this_recipient.GetShortUIName|U]\nи [this_recipient.GetFirstNamePossessiveOrMyNoTooltip] [Concept('courtiers', 'двору')|E] и [guests|E] модификатор [GetModifier('wc_conjure_food_modifier').GetNameWithTooltip|L] или модификатор [GetModifier('wc_conjure_drink_modifier').GetNameWithTooltip|L]."
 conjure_refreshment_tt3: "[this_recipient.GetShortUIName|U] может выбрать модификатор [GetModifier('wc_conjure_food_modifier').GetNameWithTooltip|L] или модификатор [GetModifier('wc_conjure_drink_modifier').GetNameWithTooltip|L], чтобы одарить им всех гостей на следующем [GetActivityType( 'activity_feast' ).GetName]."

 game_concept_wc_spell_chronomancy: "Хрономантия"
 game_concept_wc_spell_chronomancy_desc: "Обуздайте силу Хрономантии, закрепив себя в настоящем мгновении. По мере течения времени это заклинание возвращает вас в исходное состояние, исцеляя раны, обращая урон и даже отменяя смертельные травмы."
 wc_spell_chronomancy_type: "[wc_spell_type_enchantment|E]"
 wc_spell_chronomancy_targets: "[character|E]"
 wc_spell_chronomancy_effects: "Сохраняет ваше состояние на момент сотворения. По прошествии года или при активации решения [GetDecisionWithKey('restore_chronomancy_decision').GetName] ваши черты сбрасываются к сохранённому состоянию вместе с [wc_spell|E] [modifiers|E], срок действия которых к тому же станет максимальным."
 wc_learn_spell_chronomancy: "Вы изучаете [wc_spell_chronomancy|E]"
 chronomancy_tt: "Сохраняет ваши [traits|E] и модификаторы [wc_spell|E] на момент сотворения. Когда заклинание истечёт или будет использовано решение [GetDecisionWithKey('restore_chronomancy_decision').GetName], вы вернётесь к сохранённому состоянию. При восстановлении срок действия всех заклинательных модификаторов будет восстановлен."

 chronomancy.toast: "Время повернуто вспять!"
 chronomancy.toast.desc: "Вы вернулись к моменту, когда сотворили [wc_spell_chronomancy|E]"

 game_concept_wc_spell_evocation: "Ритуал: Прилив сил"
 game_concept_wc_spell_evocation_desc: "Пробудите исполинские тайные силы, усилив каждого заклинателя. Вы значительно повышаете запас маны и её восстановление, превращая провинцию в источник магической мощи."
 wc_spell_evocation_type: "[wc_spell_type_ritual|E]"
 wc_spell_evocation_targets: "[barony|E]"
 wc_spell_evocation_effects: "Значительно увеличивает @wc_full_mana_icon![wc_max_mana|E] и @wc_full_mana_icon![wc_mana_regeneration|E] каждого персонажа в целевой провинции."
 wc_learn_spell_evocation: "Вы изучаете [wc_spell_evocation|E]"
 evocation_double_cast_tt: "Шанс двойного сотворения благодаря [wc_spell_evocation|E]"
 wc_evocation_title: "Ваша локация находится под действием [wc_spell_evocation|E]!"

 game_concept_wc_spell_arcane_dome: "Ритуал: Тайный Купол"
 game_concept_wc_spell_arcane_dome_desc: "Воздвигните над всем графством огромный мерцающий барьер, потрескивающий тайной энергией. Вражеские армии, оказавшиеся внутри, сильно ослабнут: их сила истощится, когда мощь купола уничтожит их войска."
 wc_spell_arcane_dome_type: "[wc_spell_type_ritual|E]"
 wc_spell_arcane_dome_targets: "[county|E]"
 wc_spell_arcane_dome_effects: "Значительно ослабляет все несоюзные армии в графстве, снижая их @advantage_icon![advantage|E] и @supply_icon![supply|E], а также увеличивая время @siege_progress_icon![siege|E] и @death_icon![attrition|E]."
 wc_learn_spell_arcane_dome: "Вы изучаете [wc_spell_arcane_dome|E]"
 wc_arcane_dome_title: "Вы находитесь под [wc_spell_arcane_dome|E]!"

 game_concept_wc_spell_flash_of_light: "Вспышка Света"
 game_concept_wc_spell_flash_of_light_desc: "Используйте силу Света, чтобы быстро помочь союзнику."
 wc_spell_flash_of_light_type: "[wc_spell_type_heal|E], [wc_spell_type_dispel|E]"
 wc_spell_flash_of_light_targets: "[character|E]"
 wc_spell_flash_of_light_effects: "Исцеляет болезнь, рану, отравление и т.д.\n[wc_spell_rank|E] 1: Может исцелить или снизить тяжесть [wc_injury|E].\n[wc_spell_rank|E] 2: Может исцелить или снизить тяжесть [wc_magic_injury|E], за некоторыми исключениями. Также может исцелить [wc_illness|E].\n[wc_spell_rank|E] 3: Может исцелить [wc_major_illness|E], [wc_magic_illness|E] или [wc_curse|E]."
 wc_learn_spell_flash_of_light: "Вы изучаете заклинание: [wc_spell_flash_of_light|E]"
 wc_learn_spell_flash_of_light_2: "Изучите 2-й [wc_spell_rank|E] заклинания [wc_spell_flash_of_light|E]"
 wc_learn_spell_flash_of_light_3: "Изучите 3-й [wc_spell_rank|E] заклинания [wc_spell_flash_of_light|E]"

 game_concept_wc_spell_dispel: "Рассеивание Магии"
 game_concept_wc_spell_dispel_desc: "Очистите союзника."
