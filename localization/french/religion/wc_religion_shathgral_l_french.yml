 azshara_worship_adj:0 "Azsharic"
 azshara_worship_adherent:0 "Azshara Worshipper"
 azshara_worship_adherent_plural:0 "Azshara Worshippers"
 azshara_worship_desc:0 "Azshara was the powerful queen of the Highborne. Such was her talent and beauty, that she was widely beloved and venerated. Blinded by her hubris and lust for power, she was tricked by Sargeras into kickstarting the [Glossary( 'War of the Ancients', 'WAR_OF_THE_ANCIENTS_GLOSS' )] which led to the [Glossary( 'Sundering', 'GREAT_SUNDERING_GLOSS' )]. Not all hope was lost though, as she made a deal with N'zoth to be saved in exchanged for becoming a queen on his side once the Black Empire is established. As such, her and her followers were transformed into the Naga."
