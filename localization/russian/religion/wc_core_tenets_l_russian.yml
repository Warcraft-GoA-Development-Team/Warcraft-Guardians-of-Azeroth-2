 doctrine_pluralism_dark_name: "Тёмный фанатизм"
 doctrine_pluralism_dark_desc: "Ведомые таинственными силами из-за пределов Круговерти Пустоты, мы обрели высшее знание о том, что правильно. Все, кто встанет на нашем пути, будут сокрушены, пока воля наших Владык не исполнится на Азероте."
  
 INCOMPATIBLE_TENET_PRIMITIVISM_TRIGGER: "Несовместимо с [Concept('core_tenet', 'догматом')|E] [GetFaithDoctrine('tenet_natural_primitivism').GetName( GetPlayer.GetFaith )]"
  
 tenet_moon_worship_name: "Поклонение Луне"
 tenet_moon_worship_desc: "В трудные дни мы вглядываемся в ночное небо. Звёзды нас оберегают. Лунный свет ласкает и исцеляет наши раны. Однажды мы воссоединимся с предками на небесах."
  
 doctrine_parameter_hostility_override_shathgral_hostility_doctrine: "Рассматривает $shathgral$ие [Concept('faiths', 'конфессии')|E] и рассматривается $shathgral$ими [Concept('faiths', 'конфессиями')|E] как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_death_god_hostility_doctrine: "Рассматривает $deathbringer$ие [Concept('faiths', 'конфессии')|E] и рассматривается $deathbringer$ими [Concept('faiths', 'конфессиями')|E] как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
