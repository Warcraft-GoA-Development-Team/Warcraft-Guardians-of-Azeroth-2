 activity_invite_rulers_from_kalimdor:0 "Dirigeants de Kalimdor"
 activity_invite_rulers_from_eastern_kingdoms:0 "Dirigeants des Royaumes de l’Est"
 alk_phase_preparations:0 "Préparatifs"
 alk_phase_killing_lich_king:0 "Le roi-liche"
 alk_phase_preparations_desc:0 "$bdp_phase_preparations_desc$"
 alk_phase_killing_lich_king_desc:0 "Dans les profondeurs glaciales de la Citadelle de la Couronne de glace, les combattants affrontent le roi-liche dans une bataille décisive. Chaque coup porté résonne comme la détermination à mettre fin à ce règne de terreur, chaque guerrier se battant non seulement pour sa survie, mais aussi pour la justice et la vengeance."
 alk_seek_help_from_ek:0 "Cherchons de l'aide des Royaumes de l’Est"
 alk_seek_help_from_kalimdor:0 "Cherchons de l'aide de Kalimdor"
 alk_seek_help_from_ek_desc:0 "Partons à l'aventure dans les Royaumes de l’Est pour rallier des soutiens. Les alliés de ces terres anciennes pourraient bien détenir la clé qui nous permettra de nous renforcer."
 alk_seek_help_from_kalimdor_desc:0 "Partons en quête d'alliés en Kalimdor. Les races diverses et puissantes qui peuplent ces terres pourraient nous apporter une aide précieuse dans nos efforts."
