l_russian:
  
 felblood_0001_title: "Сделка с дьяволом"
 felblood_0001_desc: "#italic Доблесть не принесёт нам ни войн, ни земель для наших собратьев-[GetTrait('creature_orc').GetName(GetNullCharacter)]ов... честь не убережёт наши семьи#!, — пытаюсь я убедить себя, входя в гнусные владения [demon_liege.GetName].\n\nУлыбка [demon_liege.GetFirstName] расплывается шире, когда на этом лице не двигается ни одна иная мышца: #XB «О-о... что же это у нас тут за [GetTrait('creature_orc').GetName(GetNullCharacter)] маленький... Скажи-ка, слабак, почему мне не стоит просто разорвать на куски тебя и твоё жалкое отродье [wc_race|E]?»#!\n\nЯ собираюсь с духом и стою на своём: «Потому что... я жажду силы... силы, что нужна для победы, любой ценой».\n\n#XB «Любой ценой, говоришь, дорогой [ROOT.GetCharacter.GetFirstNameNoTooltip]?»#! — улыбка [demon_liege.GetFirstName] на мгновение гаснет, становится изумлённой, а затем задумчивой. #XB «...тогда преклони колено предо мной, [GetTrait('creature_orc').GetName(GetNullCharacter)]»#!\n\nЯ задерживаю дыхание и опускаюсь на колени перед [demon_liege.GetFirstName]. [demon_liege.GetFirstName] приближается, сжимает кулак и возвышается надо мной, затем подносит сжатый кулак к моей голове. Я вижу, что с его костяшек капает кровь — демоническая кровь. #XB «Не смей пролить ни единой капли, [ROOT.GetCharacter.GetFirstNameNoTooltip], ни единой — они стоят большего, чем всё, чего достигло твоё поганое [wc_race|E] до сих пор...»#!\n\nЗрение моё затуманивается, а в глазах пылает. Каждая капля крови придаёт мне силы, пока я не начинаю гореть изнутри. На мне больше нет кожи моего народа... нет и их сердец; внутри — лишь ненависть.\n\nОглядываюсь в поисках [demon_liege.GetFirstName] — и остаюсь совсем один. Топор в руке кажется легче, шаг — быстрее. Замечаю чашу с кровью, оставленную в стороне, точно такую же, как у [demon_liege.GetFirstName]. #italic Да будет так...#! Я забираю кровь с собой и возвращаюсь к своему клану."
 felblood_0001_a: "Гнев нашим врагам!"
  
 felblood_0002_title: "Дьявол, с которым нужно разобраться"
 felblood_0002_desc: "#italic Может, это единственный путь... может, нам суждено превзойти некоторых из наших предков...#! — думаю я, в одиночку приближаясь к темницам, где [demon_prisoner.GetFirstName] гниёт заживо.\n\nЯ слышу лязг цепей и тщетные попытки сотворить гнусную магию. #XB «Освободи меня, мерзкий [GetTrait('creature_orc').GetName(GetNullCharacter)]! Я позабочусь, чтобы ты и твоё [wc_race|E] умерли быстрой смертью!»#!\n\n«Да... вот то, что нужно...», — говорю я, разглядывая жалкий облик [demon_prisoner.GetFirstName]. #XB «А? Что ты—»#! — я дёргаю за цепь, притягивая [demon_prisoner.GetFirstName] ближе, и вонзаю клинок [demon_prisoner.GetHerHis] в шею.\n\n[demon_prisoner.GetFirstName] пытается что-то сказать, но я бью ещё раз, отсекая [demon_prisoner.GetHerHis] голову начисто. Пью демоническую кровь прямо из шеи [demon_prisoner.GetFirstName]. Не останавливаюсь — чем больше пью, тем сильнее себя чувствую.\n\n«Да... Да! Это превосходит всё, что я мог представить», — мой голос грохочет в темнице. Кожа моя стала красной, глаза горят, а сердце пылает скверной. Гляжу вниз на кровь, что ещё стекает с тела [demon_prisoner.GetFirstName], быстро собираю её с собой и возвращаюсь к своему клану. #italic Негоже пропадать такому добру, верно?#!"
 felblood_0002_a: "Сила нашим!"
  
 felblood_0003_title: "Радость союзникам"
 felblood_0003_desc: "Я приближаюсь к своему клану с демонической кровью при себе... гадая, стоит ли мне пойти дальше и не хранить эти силы лишь для себя.\n\nДаровать ли всему моему клану частицу этой мощи? Но тогда пути назад не будет... Или, быть может, лишь мне одному надлежит страдать ради высшей цели?"
 felblood_0003_a: "Моя кровь и мой клан восстанут к величию!"
 felblood_0003_a_tt: "Ваша семья, [courtier|E] и [vassal|E] принимают силы Скверны вместе с вами"
 felblood_0003_b: "Нет, лишь мне одному страдать..."
