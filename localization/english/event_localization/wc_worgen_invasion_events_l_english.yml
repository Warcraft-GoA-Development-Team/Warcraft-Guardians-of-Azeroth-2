l_english:
 worgen.0001.t:1 "You got bitten!"
 worgen.0001.desc:0 "While going back to your home, you heard sudden howling. You looked around and saw a dark figure running toward you. Before you could react, it jumped on you and bit your arm. Fortunately, a local guard managed to scare the creature away. The wound looks minor... maybe it'll go away with time?"
 worgen.0001.option:0 "I hope it's nothing serious."
 worgen.0002.t:1 "Mysterious Disappearances"
 worgen.0002.desc:0 "Several people in [infected_county_scope.GetNameNoTier] have gone missing without a trace. People are scared that these disappearances are related to the rumors of a dangerous wolf-like beast roaming the area at night."
 worgen.0002.option:0 "We must investigate this!"
 worgen.0003.t:1 "Deserted Villages"
 worgen.0003.desc:0 "We have lost contact with several remote villages in [infected_county_scope.GetNameNoTier]. After investigating, we found that all of them were destroyed and their inhabitants are missing. We are afraid that it may have connections to the rumors of a dangerous wolf-like beast roaming the area at night."
 worgen.0003.option:0 "Worrying"
 worgen.0004.t:1 "Attacks on the livestock"
 worgen.0004.desc:0 "Cattle and sheep have been found dead in the fields in [infected_county_scope.GetNameNoTier], with misterious bite marks on their bodies. Farmers fear that there will be no livestock left if this continues."
 worgen.0004.option:0 "There is nothing we can do"
 worgen.0005.t:1 "Night Howling"
 worgen.0005.desc:0 "During the night in Gilneas, you can hear howling and strange noises coming from the rooftops. People are stressed and tired of not feeling safe in their own homes."
 worgen.0005.option:0 "I hope this will stop soon"
 worgen.0006.t:1 "Trade caravans disappearing"
 worgen.0006.desc:0 "Recently, several trade caravans have disappeared while passing through [infected_county_scope.GetNameNoTier]. Nobility is enraged by the loss of money, we must do something to stop this from happening again."
 worgen.0006.option:0 "There is nothing we can do"
 worgen.0006.optionb:0 "Strengthen the patrols in the area"