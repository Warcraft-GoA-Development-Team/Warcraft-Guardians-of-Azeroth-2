 ARG.001_TITLE: "Орден Серебряного Рассвета"
 ARG.001_DESC: "Все, кто верен делу Рассвета, собраны! Силы милосердного [GetFaithByKey('argent').HighGodName] больше не рассеяны. Объединённые волей спасти Лордерон от гибели, совет и лидеры [GetTitleByKey('e_argent_dawn').GetName] принесли клятву стереть зло с земель Лордерона и протянуть руку помощи нуждающимся."
 ARG.001_OPT_A: "Воины обездоленных — здесь!"
