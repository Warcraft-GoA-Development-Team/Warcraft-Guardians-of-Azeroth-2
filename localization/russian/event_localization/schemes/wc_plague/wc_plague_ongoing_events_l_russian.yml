l_russian:
 plague_event_title: "Чума:"
  
 plague_ongoing.3302.t: "$plague_event_title$ добровольцы"
 plague_ongoing.3302.desc: "Несмотря на общее процветание, которым многие, кажется, наслаждаются, всё еще есть те, кто не довольны нынешним руководством в государстве [kingdom.GetName]. Эти сомнения можно использовать для достижения нашей цели.\n\nВы должны укрепить ряды Культа Проклятых, прежде чем начать вершить великие дела. Вы можете либо обмануть достаточно отчаянных обещаниями бессмертия и силы, либо попытаться склонить слабоумных своими грандиозными замыслами."
 plague_ongoing.3302.a: "Обманом заставить этих смертных служить мне!"
 plague_ongoing.3302.a.critical_success.desc: "Культисты заполонили ряды местных жителей"
 plague_ongoing.3302.a.critical_success.title: "Культисты теперь повсюду"
 plague_ongoing.3302.a.success.desc: "Культисты внедряются в ряды местного населения"
 plague_ongoing.3302.a.success.title: "Культисты успешно внедрились"
 plague_ongoing.3302.a.failure.desc: "Местные жители сопротивляются"
 plague_ongoing.3302.a.failure.title: "Сопротивление местных жителей"
 plague_ongoing.3302.a.critical_failure.desc: "Местные жители рассказали все стражникам"
 plague_ongoing.3302.a.critical_failure.title: "Местные сообщили руководству"
 plague_ongoing.3302.b: "Склонить их на свою сторону!"
 plague_ongoing.3302.c: "Это слишком опасно!"
