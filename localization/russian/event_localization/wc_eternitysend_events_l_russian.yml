l_russian:
  
 eternitysend_0200_title: "Клич Песни Войны"
 eternitysend_0200_desc: "В тенистых лесах Калимдора клан день и ночь трудится, заготавливая древесину, что необходима для будущего новой Орды.\n\nВсё выглядит мирно, не считая нескольких стычек с местными Калимдора... пока... весь клан не слышит громоподобный голос, разносящийся над землями.\n\n«Кто посмел осквернять эти древние земли? Кто бросает вызов гневу [cenarius.GetFirstName] и ночных эльфов?», — все мы насторожились и взялись за топоры. Ко мне прибегает гронн: «Лес сам оживает! На нас нападение!». Деревья начинают размахивать ветвями, словно оружием, по нашим пеонам и гроннам.\n\n«Пусть бой начнётся!», — вновь грохочет божественный голос. Ночные эльфы присоединились к атаке на нас! Проклятье на этих воительниц!"
 eternitysend_0200_a: "Их слишком много! Отходим к укреплениям!"
  
 eternitysend_0201_title: "Духи Ясеневого леса"
 eternitysend_0201_desc: "Мы наблюдали за этими зелёными тварями достаточно долго. Они разрушают и нападают на всё, что не их племени, без повода. Они нарушают само равновесие Калимдора, что так долго хранило эти земли.\n\nТеперь они приходят в наши леса и вырубают наши древние чащи? Отвратительно! Хватит! Я сам положу конец этой порочной расе! Я верну Калимдор на путь истинный!"
 eternitysend_0201_a: "Отродья Скверны! Вы все умрёте!"
  
 eternitysend_0202_title: "Колодец Силы?"
 eternitysend_0202_desc: "Ко мне подходит один из наиболее одарённых магически воинов клана. «Вождь, я чую тёмную силу, исходящую из диких земель! Она может стать ключом к низложению Полубога!»\n\nЯ смотрю на своих воинов с новой надеждой. «Так чего же мы ждём? Соберём отряд и отправимся в пустоши на поиски этого колодца»."
 eternitysend_0202_a: "Лок'тар огар!"
 eternitysend_0202_a_tt: "Вы начинаете поиски колодца силы. Это может занять время!"
  
 eternitysend_0203_title: "Колодец Рока"
 eternitysend_0203_desc: "Наконец мы пробиваемся к этому колодцу силы. [witch_doctor.GetFirstName] останавливает меня прежде, чем я успеваю приблизиться к нему: «Вода источает великую мощь, но я чую зловоние демонического проклятия вокруг!»\n\nЯ отталкиваю [witch_doctor.GetFirstName] и подхожу к воде: «Ха! Я уже проклят! Если я должен испить из этих вод, чтобы одолеть [cenarius.GetFirstName], я это сделаю».\n\nМеня вновь останавливают — на этот раз один из моих воинов: «Нет! Это противоречит всему, за что мы стоим! Мы не можем вновь позволить ярости овладеть нами!»\nЯ хлопаю воина по плечу: «Нет, воин. Мы должны принять её, как никогда прежде! Мы должны стать сосудами разрушения, которыми нам суждено быть!» С этими словами воин отступает, и я склоняюсь, чтобы испить из колодца.\n\n«Да! Я вновь чувствую, как сила течёт во мне! Подойдите, мои воины! Испийте тёмных вод, и вы возродитесь!»"
 eternitysend_0203_a: "Время убить этого «Полубога»"
  
 eternitysend_0204_title: "Охотник Теней"
 eternitysend_0204_desc: "Я делаю глубокий вдох, и каждый из них обжигает меня изнутри. Но Полубог лежит передо мной, мёртвый и поверженный.\n\nЯ оседаю, и всё тело моё ноет, но пылающие силы внутри меня исцеляют эту боль удивительно быстро, даже после столь краткого отдыха. «В какие же силы я проник...?»"
 eternitysend_0204_a: "Время снова заготовить тот проклятый лес..."
  
 eternitysend_0205_title: "Охотник Теней"
 eternitysend_0205_desc: "Мы проигрываем... мы, по сути, уже проиграли...\n\nЯ вижу, как Кенарий по-прежнему высится над нами подобно победителю, явно взирая на нас сверху вниз. Пока мои воины гибнут вокруг меня, сдерживая прочих ночных эльфов, я хватаюсь за возможность — поднимаю топор и бросаюсь на Полубога."
 eternitysend_0205_a: "КЕНАРИЙ!"
 eternitysend_0205_a_tt: "Вы и [attacker.GetFirstName] будете биться насмерть!"
  
 eternitysend_0206_title: "Предательство самого себя"
 eternitysend_0206_desc: "Полубог повержен, Песнь Войны непобедима!\n\nНо когда мы с воинами празднуем победу, к нам выступает жуткое и огромное существо. Оно заковано в броню и сжимает огромное копьё, а его спина пылает зелёным пламенем неугасимого яркого света.\n\n#XB «Снова здравствуй, [ROOT.GetCharacter.GetFirstNameNoTooltip]...»#! — я узнаю его голос, узнаю его облик. «[mannoroth.GetFirstName]... этого не может быть... зачем ты здесь?!» — чувствую внезапную утрату контроля над собственным телом, когда пытаюсь поднять топор; мои воины страдают так же, судя по их взгляду.\n\n#XB «Я пришёл вернуть тебя и твоих братьев в наше лоно. Хотя вы, орки, прежде подвели [burning_legion|E], теперь вы вновь послужите нам!»#! — я стискиваю зубы, пытаясь сохранить сознание под контролем [mannoroth.GetFirstName]. «Нет! мы... свободны...»\n\n#XB «Ха... ха-ха-ха-ха... глупое, жалкое создание. Я — ярость в твоём сердце. Я — гнев твоих мыслей. Лишь я дал вам силу нести хаос в этот мир, и бездной клянусь — вы будете!»#!"
 eternitysend_0206_a: "Нет... что... я наделал..."
 eternitysend_0206_a_tt: "Вы и клан Песни Войны присягаете на верность [burning_legion|E]"
  
 eternitysend_0207_title: "Ещё один сон, ещё одна надежда"
 eternitysend_0207_desc: "Пророк вновь явился мне во сне, на этот раз пожелав встретиться лично, чтобы обсудить нечто важное.\n\nВ моей груди разливается облегчение от того, что я наконец смогу поговорить с этим Пророком напрямую и понять, почему бегство в Калимдор было единственным выходом для моего народа...\n\nКогда мы с воинами пробираемся через леса к месту встречи, нам попадается группа Людей, но это не Пророк и не кто-то из его приближённых. На их знамёнах — герб, знакомый по Лордерону; эти мерзавцы увязались за нами аж до самого Калимдора?!\n\nЛюди, похоже, готовятся к бою, и мы тоже. «Лок-Нараш!», — кричу я своим воинам. Но прежде чем кто-либо из нас успевает нанести удар, между нами возникает огромный магический барьер.\n\n«Стойте! Здесь не будет насилия»."
 eternitysend_0207_a: "Что за—"
  
 eternitysend_0208_title: "Ещё один совет с Пророком"
 eternitysend_0208_desc: "Давно Пророк не являлся мне и не убеждал бежать из Лордерона, но назначить встречу в глубине лесов Калимдора — последнее место, где я ожидал его увидеть. Неужели он не мог найти места получше? Может, в наших новых замках в Тераморе?\n\nЯ вздыхаю, пока мы с войском продолжаем долгий путь. Наконец мы приближаемся к месту встречи. Пророк был прав насчёт Лордерона, интересно, что будет дальше?\n\nВойдя в лес, мы натыкаемся на орков... Орки? В Калимдоре?! «Орки. Я знал, что мы здесь не одни». Оглядываюсь на своих воинов: «К обороне!» Но прежде чем кто-либо из нас успевает нанести удар, между нами возникает огромный магический барьер.\n\n«Стойте! Здесь не будет насилия»."
 eternitysend_0208_a: "Кто это сделал?!"
  
 eternitysend_0209_title: "Пророк"
 eternitysend_0209_desc: "Это он, Пророк. I didn't know he possessed such vast powers, I approach him.\n\nBefore I could speak, the Prophet declares "Now that I have lured you all here, I will tell you what your destiny holds." Did the Prophet expect us both to be here?\n\n"What the hell is going on here?" I demand to the Prophet.\nThe prophet smiles, "[durotar_ruler.GetFirstName], this is [theramore_ruler.GetName], last of the surviving leaders of Lordaeron."\n"Survivors? What are you talking about?" I ask while glancing at [theramore_ruler.GetFirstName].\n"The invasion of [burning_legion|E] has begun! Lordaeron has already fallen, and now the demons come to invade Kalimdor! Only together, united against the shadow, will you be able to save this world from the flame."\nThe Human immediately interrupts and speaks, "Unite with them? Are you mad?"\n"Have you heard nothing that I have said? The Legion comes to undo history and end all life! [durotar_ruler.GetFirstName], your friend and leader of the Warsong clan has already fallen to the demons' influence. Soon he and your whole race will be lost forever!" My eyes widening at the declaration.\n"No... I'll die before I let that happen!" My grips tightens on my hammer.\n"Then you must rescue them immediately! The Warsong clan is key to the destiny I promised you. However, for that, you will need help." The prophet says while pointing at [theramore_ruler.GetFirstName].\n[theramore_ruler.GetFirstName] shakes [theramore_ruler.GetHerHisMy] head, "Wait! This is insane! You can't possibly expect me to-"\n"Destiny is at hand, [theramore_ruler.GetFirstName]. The time to choose has come. For the fate of all who live, humanity must join forces with the Horde.""
 eternitysend_0209_a: "Да будет так..."
  
 eternitysend_0210_title: "Пророк"
 eternitysend_0210_desc: "Пророк являет себя своей великой мощью, которую я, быть может, недооценивал прежде. I approach him while keeping a safe distance from the Orc brutes.\n\n"Now that I have lured you all here, I will tell you what your destiny holds." The Prophet wanted both of our kinds here?\n\n"What the hell is going on here?" the Orc brute demands from the Prophet.\nThe prophet smiles, "[durotar_ruler.GetFirstName], this is [theramore_ruler.GetName], last of the surviving leaders of Lordaeron."\n"Survivors? What are you talking about?" [durotar_ruler.GetFirstName] asks insistently while glancing at me.\n"The invasion of [burning_legion|E] has begun! Lordaeron has already fallen, and now the demons come to invade Kalimdor! Only together, united against the shadow, will you be able to save this world from the flame."\nI interrupt the Prophet, "Unite with them? Are you mad?"\n"Have you heard nothing that I have said? The Legion comes to undo history and end all life! [durotar_ruler.GetFirstName], your friend and leader of the Warsong clan has already fallen to the demons' influence. Soon he and your whole race will be lost forever!" [durotar_ruler.GetFirstName] looks shocked.\n"No... I'll die before I let that happen!" [durotar_ruler.GetFirstName] says while gripping [durotar_ruler.GetHerHisMy] hammer.\n"Then you must rescue them immediately! The Warsong clan is key to the destiny I promised you. However, for that, you will need help." The prophet says while pointing at me.\nI shake my head, "Wait! This is insane! You can't possibly expect me to-"\n"Destiny is at hand, [theramore_ruler.GetFirstName]. The time to choose has come. For the fate of all who live, humanity must join forces with the Horde.""
 eternitysend_0210_a: "Если так должно быть..."
  
 eternitysend_0220_title: "Под пылающим небом"
 eternitysend_0220_desc: "«Вождь! Небо пылает!» — предупреждает меня воин.\n\nThe sky has turned blood red, the very air now burning and now chokes us with ash. "This is no natural storm! Everyone brace yourselves!"\n\nI see the sky rain down balls of green fire that then unfold into animate beings of burning stone that march towards us. "Fight on my warriors! We must reach [defender.GetFirstName] before it's too late!""
 eternitysend_0220_a: "Благословенные предки..."
  
 eternitysend_0221_title: "Гонимые Демонами"
 eternitysend_0221_desc: "[defender.GetFirstName] наконец схвачен. Лучшие из моих магов и некоторые из союза Терамора начинают снимать влияние Демонов над [defender.GetFirstName].\n\nAfter a stonelike-pause from [defender.GetFirstName] for a while, [defender.GetFirstName] shakes [defender.GetHerHisMy] head and sits down. "[attacker,GetFirstName]... I see clearly now. I'm... sorry. I am so sorry."\nI grit my teeth, "To hell with your apologies! Right now, I need you to help me save our people!"\n"Mannoroth... we need to face Mannoroth..." [defender.GetFirstName] says with some determiation.\n"Then let's go. I don't want to keep that bastard waiting.""
 eternitysend_0221_a: "Время встретиться с Демоном"
  
 eternitysend_0222_title: "Гонимые Демонами"
 eternitysend_0222_desc: "«[defender.GetFirstName], п-подожди! Останови это безумие! You have got to come with me..." I see [attacker.GetFirstName] whimper in front of me.\n\nThe very pathetic state of [attacker.GetFirstName] cracks a smile on my face, "Why... what happened little pup? Don't you have a Horde to save?... Destiny is at Hand! Lord Mannoroth and the Burning Legion are our masters now."\n[attacker.GetFirstName] whinces, "Who? You're not talking sense!"\n"Ah, [attacker.GetFirstName]. You always believed that the demons corrupted our race, but that's only half true. We gave ourselves up willingly on Draenor! The other chieftains and I... we drank [Glossary( 'blood of Mannoroth', 'BLOOD_OF_MANNOROTH_GLOSS' )], [attacker.GetFirstName]. We brought this curse upon ourselves!"\n"You did this... to our people... knowingly? Arrrggggghhhhh!" [attacker.GetFirstName] says full of rage and tries to strike me.\n\nI easily dodge [attacker.GetFirstName]'s attack and slice [defender.GetHerHisMy] battle arm. "Pathetic... but with the powers from the daemons, our race shall no longer ever lose... but weaklings like you stop us from attaining glory!"\n\n[attacker.GetFirstName] still manages to stand up, "Like I would let you..."\n"Oh, I know little pup... you and your bloodline has long since caused problems for us... always meddling... now it is time for you all to lay rest!" I raise my axe and silence [attacker.GetFirstName] once and for all."
 eternitysend_0222_a: "Спи спокойно, маленький щенок..."
 eternitysend_0222_a_tt: "Все [GetTrait('creature_orc').GetName(GetNullCharacter)]ы дуротарской культуры станут [GetTrait('creature_fel_orc').GetName(GetNullCharacter)]ами, примут Саргеризм и (если независимы и владеют землями) станут вассалами [GetTitleByKey('h_burning_legion').GetName]"
  
 eternitysend_0224_title: "Гонимые Демонами"
 eternitysend_0224_desc: "[attacker.GetFirstName] спас меня от самого себя, но сейчас мне пора спасать свой собственный клан. We both approach the craters where Mannoroth lurks in, the stench of malice and death runs thick here.\n\nA maniac laughter surrounds us, undenibly of Mannoroth, "So predictable. I knew you would come. And I see you have brought the mighty [defender.GetFirstName]... His blood is mine..." Mannoroth suddenly appears behind us, his towering form dawning on both of us. "... as is your whole misbegotten race."\n\n[attacker.GetFirstName] charged [attacker.GetHerHisMy] hammer and strikes at Mannoroth, but it fails to put even a scratch on Mannoroth. "A worthy effort, but futile." Mannoroth easily throws [attacker.GetFirstName] away and smashes them on the crater nearby.\n\nNow it lies only on me to defeat Mannoroth."
 eternitysend_0224_a: "Давай!"
 eternitysend_0224_a_tt: "Вы и [mannoroth.GetFirstName] будете биться насмерть!"
  
 eternitysend_0225_title: "Доблестная победа"
 eternitysend_0225_desc: "«[attacker.GetFirstName]... багровая пелена рассеялась. The demon's fire... has burnt out in my veins... I... have... freed... myself..." [defender.GetFirstName] says as the burning fires inside [defender.GetHerHisMy] eyes are vanished, but so do any signs of life.\n\n"No, my old friend...""
 eternitysend_0225_a: "...Ты освободил нас всех"
  
 eternitysend_0227_title: "Приказ Пылающего Легиона"
 eternitysend_0227_desc: "[archimonde.GetName] приказал победоносному клану Песни Войны обрушить наши клинки и топоры на [GetTitleByKey('e_kaldorei').GetName].\n\nIt seems that [archimonde.GetFirstName] only expects us to be a distraction while they do the dirty work. But no! we of the Warsong clan will prove our mettle and slay those warrior women!"
 eternitysend_0227_a: "Песнь Войны будет царить!"
  
 eternitysend_0300_title: "Гонимые Демонами"
 eternitysend_0300_desc: "Пророк вновь явился мне во сне, на этот раз желая встретиться со мной в укромном месте. As I near the location of meeting, I feel a very ghastly presence approach me from the forests.\n\nThe very lush trees around set ablaze by bright green flames. A four legged beast approaches me, neither Centaur nor any nature being I have known of. Its back burning green and aflame of an unquenching bright light.\n\nI ready my warhammer for battle, but it speaks, #XB "Hello there... puny Orc..."#!\n"W-what? What even are you?" I keep my hammer at the ready.\n#XB "I... am the reason why you orcs have a place in these lands. I... am the reason why you Orcs can fight with the ferocity that you do. My [Glossary( 'blood', 'BLOOD_OF_MANNOROTH_GLOSS' )] is responsible!"#!\n"Y-you? it was you?! You are the demonic curse that has befallen my race?" I wish to strike it down but hold myself back. It would be reckless to fight a beast that strong.\n#XB "No need to think that deeply puny Orc... Submit to my blood once again like the rest of the clans once had... otherwise..."#! it strikes simply on the ground to cause a massive quake with ease.#XB "It wouldn't be that hard for me to "convince" your lonely clan on Kalimdor to work for me instead..."#!"
 eternitysend_0300_a: "К чёрту тебя!"
 eternitysend_0300_a_tt: "#XB Вы будете биться с [mannoroth.GetFirstName] насмерть#!"
 eternitysend_0300_b: "Как скажете... Лорд [mannoroth.GetFirstName]"
 eternitysend_0300_b_tt: "#help Вы подчиняетесь [burning_legion|E] и пытаетесь убить Кенария#!"
  
 eternitysend_0302_title: "Охотник Теней"
 eternitysend_0302_desc: "Мы делаем это ради выживания, мы выполним волю [burning_legion|E] и убьём [cenarius.GetFirstName]. We have razed the forests and set many a tribes ablaze to provoke this demigod, and it seems to have worked.\n\n"Who dares defile this ancient land? Who dares the wrath of [cenarius.GetFirstName] and the night elves?" we hear the booming voice across the lands and ready our battle axes. But instead of a demigod, the very trees surrounding us, even those already cut down, come to life and start attacking my warriors with their branches. "The trees are coming alive, we are under attack!" a grunt from one of the outposts warns me. I hope we haven't underestimated this demigod...\n\n"Let battle be joined!" the demigod's voice booms again as the warrior women of the Night Elves join the demigod in his battle against us. "Curse these warrior women! So it isn't Cenarius alone we are fighting... We will be victorious today my warriors! Lok'Narash!""
 eternitysend_0302_a: "Мы убьём этого Полубога!"
  
 eternitysend_0303_title: "Духи Ясеневого леса"
 eternitysend_0303_desc: "Мы наблюдали за этими зелёными тварями достаточно долго... now they seem filled with demonic energies? They give off the very stench of our ancient burning nemesis...\n\n They destroy and attack anything that is not their own kind, unprovoked. They break the very balance of Kalimdor with which it has stood for long.\n\nNow they come to our forests and cut down our ancient lands? Despicable! Enough is enough! I shall myself bring an end to this vile race! I shall set Kalimdor on the right path again."
 eternitysend_0303_a: "Ты не одолеешь меня! Я — сердце этой земли!"
  
 eternitysend_0304_title: "Конец Полубога"
 eternitysend_0304_desc: "Полубог повержен — нашими молотами и отвагой. It will hopefully be enough to satisfy the [burning_legion|E]...\n\nNow what happens next is not in our hands, we shall try to lay low and not be crushed under the feets of this battle between gods."
 eternitysend_0304_a: "Наконец-то... я могу передохнуть"
  
 eternitysend_0305_title: "Последний рубеж"
 eternitysend_0305_desc: "Мы проигрываем... мы, по сути, уже проиграли...\n\nI see Cenarius still standing tall above us like a victor, clearly looking down on us. While my warriors die arround me and fight off the other night elves for now, I take the chance, I pick up my warhammer and charge at the demigod."
 eternitysend_0305_a: "КЕНАРИЙ!"
 eternitysend_0305_a_tt: "#XB Вы будете биться с [attacker.GetFirstName] насмерть#!"
  
 eternitysend_0309_title: "Теперь к Пророку"
 eternitysend_0309_desc: "Надеюсь, битва с проклятым инопланетным демоном стоила того, чтобы найти этого Пророка...\n\nAs me and my warriors travel through the forests to meet him, we come across a group of Humans, but it is not the Prophet or someone related to him. These Humans carry similar banners from those in Lordaeron, have these rascals followed us all the way to Kalimdor?!\n\nThe Humans seem to ready themselves for battle and so do we. "Lok-Narash!", I say to my warriors. But before any of us could land an attack on the other, a massive magical barrier appears between us.\n\n"Stop! There will be no violence in this place.""
 eternitysend_0309_a: "Что за—"
  
 eternitysend_0310_title: "Ещё один совет с Пророком"
 eternitysend_0310_desc: "Давно Пророк не являлся мне и не убеждал бежать из Лордерона, but asking us to meet here in the foresty depths of Kalimdor is the last place I expected to meet him. Couldn't he find a better place? Maybe our newfound castles in Theramore?\n\nI sigh as me and my troops carry on with the long march. We finally approach the place of meeting. The Prophet has been right about lordaeron, I wonder what is next?\n\nAfter entering the forests, we come across Orcs... Orcs? In Kalimdor?! "Orcs. I knew we were not alone in these lands." I glance at my warriors, "Defend yourselves!" But before any of us could land an attack on the other, a massive magical barrier appears between us.\n\n"Stop! There will be no violence in this place.""
 eternitysend_0310_a: "Кто это сделал?!"
  
 eternitysend_0311_title: "Пророк"
 eternitysend_0311_desc: "Это он, Пророк. I didn't know he possessed such vast powers, I approach him.\n\nBefore I could speak, the Prophet declares "Now that I have lured you all here, I will tell you what your destiny holds." Did the Prophet expect us both to be here?\n\n"What the hell is going on here?" I demand to the Prophet.\nThe prophet smiles, "[frostwolf_or_alternative.GetFirstName], this is [theramore_ruler.GetName], last of the surviving leaders of Lordaeron."\n"Survivors? What are you talking about?" I ask while glancing at [theramore_ruler.GetFirstName].\n"The invasion of [burning_legion|E] has begun! Lordaeron has already fallen, and now the demons come to invade Kalimdor! Only together, united against the shadow, will you be able to save this world from the flame."\nThe Human immediately interrupts and speaks, "Unite with them? Are you mad?"\n"Have you heard nothing that I have said? The Legion comes to undo history and end all life! and for that, you will need help." The prophet says while pointing at [theramore_ruler.GetFirstName].\n[theramore_ruler.GetFirstName] shakes [theramore_ruler.GetHerHisMy] head, "Wait! This is insane! You can't possibly expect me to-"\n"Destiny is at hand, [theramore_ruler.GetFirstName]. The time to choose has come. For the fate of all who live, humanity must join forces with the Horde.""
 eternitysend_0311_a: "Да будет так..."
  
 eternitysend_0312_title: "Пророк"
 eternitysend_0312_desc: "Пророк являет себя своей великой мощью, которую я, быть может, недооценивал прежде. I approach him while keeping a safe distance from the Orc brutes.\n\n"Now that I have lured you all here, I will tell you what your destiny holds." The Prophet wanted both of our kinds here?\n\n"What the hell is going on here?" the Orc brute demands from the Prophet.\nThe prophet smiles, "[frostwolf_or_alternative.GetFirstName], this is [theramore_ruler.GetName], last of the surviving leaders of Lordaeron."\n"Survivors? What are you talking about?" [frostwolf_or_alternative.GetFirstName] asks insistently while glancing at me.\n"The invasion of [burning_legion|E] has begun! Lordaeron has already fallen, and now the demons come to invade Kalimdor! Only together, united against the shadow, will you be able to save this world from the flame."\nI interrupt the Prophet, "Unite with them? Are you mad?"\n"Have you heard nothing that I have said? The Legion comes to undo history and end all life! and for that, you will need help." The prophet says while pointing at me.\nI shake my head, "Wait! This is insane! You can't possibly expect me to-"\n"Destiny is at hand, [theramore_ruler.GetFirstName]. The time to choose has come. For the fate of all who live, humanity must join forces with the Horde.""
 eternitysend_0312_a: "Если так должно быть..."
  
 eternitysend_0401_title: "Избавление от Демонов"
 eternitysend_0401_desc: "Когда я блуждаю по древним землям как их хранитель, мне в нос ударяет зловоние, the stench of something Demonic...\n\nI easily dodge an attack from the depths of the forest. "Hmph... futile effort! Show yourself you coward!" I openly challenge it.\n\nThe being in question is demonic as I suspected. "You... your kind is not supposed to be here... you were banished a long time ago..." I ready myself for battle.\n\n#XB "You no longer need to dream about us, #italic Demigod#!. The [burning_legion|E] has returned and you stand in Lord [archimonde.GetFirstName]'s way!"#!"
 eternitysend_0401_a: "Да будет так, я стану твоим концом, Демон!"
 eternitysend_0401_a_tt: "#XB Вы будете биться с [challenger_of_cenarius.GetFirstName] насмерть#!"
  
 eternitysend_0501_title: "Последний Страж"
 eternitysend_0501_desc_tyrande: "В тихой прогалине горы Хиджал...\n\n"I don't yet understand why I brought myself here... Last night I had a dream, a great raven spoke to me and summoned me to this place." I say to myself as I reminisence of the dream.\nA Human and an Orc approach me while I was in a daze. "We were summoned here as well."\n"Who are you, outlanders?" I ask while keeping myself alert about any potential ambushes.\n"I am [thrall.GetName]. Warchief of the Horde." the Orc announces [thrall.GetHerselfHimself].\n"And I am [jaina.GetName], leader of the human survivors of Lordaeron." the Human announces [jaina.GetHerselfHimself] after the Orc.\n\nAs I am about to dismiss them both, the raven flying around us transforms and gains the shape of a Human. "They've come to aid you against the Legion." I recognize him.\n"It was you in my dream! But who are you to make such an offer to us?" I ask the mysterious Human intently.\n\n"I... am the reason for the Legion's return. Years ago, I brought the Orcs into this world, and by doing so, I opened a path for the demons as well. For my sins, I was murdured by those I cared for most. Despite my death, war raged across the lands of the east for many long years, leaving entire kingdoms desvastated in its wake. Now, at long last, I have returned to set things right. I... am Medivh, The Last Guardian. I tell you now, the only chance for this world is for you to unite in arms against the enemies of all who live!""
 eternitysend_0501_desc_thrall: "В тихой прогалине горы Хиджал...\n\n"I don't yet understand why I brought myself here... Last night I had a dream, a great raven spoke to me and summoned me to this place." both I and [jaina.GetFirstName] observe the Night Elf from a distance, we decide to approach [tyrande.GetHerHim] without trying to spook [tyrande.GetHerHim] out.\n"We were summoned here as well." I announce myself to the Night Elf.\n"Who are you, outlanders?" the Night Elf asks us with some caution in [tyrande.GetHerHis] eyes.\n"I am [thrall.GetName]. Warchief of the Horde." I introduce myself.\n"And I am [jaina.GetName], leader of the human survivors of Lordaeron." [jaina.GetFirstName] announces [jaina.GetHerselfHimself] after me.\n\nAs the Night Elf gives us both a deep frown, the raven flying around us transforms and gains the shape of a Human. "They've come to aid you against the Legion."\n"It was you in my dream! But who are you to make such an offer to us?" the Night Elf asks curiously to the Prophet.\n\n"I... am the reason for the Legion's return. Years ago, I brought the Orcs into this world, and by doing so, I opened a path for the demons as well. For my sins, I was murdured by those I cared for most. Despite my death, war raged across the lands of the east for many long years, leaving entire kingdoms desvastated in its wake. Now, at long last, I have returned to set things right. I... am Medivh, The Last Guardian. I tell you now, the only chance for this world is for you to unite in arms against the enemies of all who live!""
 eternitysend_0501_desc_jaina: "В тихой прогалине горы Хиджал...\n\n"I don't yet understand why I brought myself here... Last night I had a dream, a great raven spoke to me and summoned me to this place." both [thrall.GetFirstName] and I observe the Night Elf from a distance, we decide to approach [tyrande.GetHerHim] without trying to spook [tyrande.GetHerHim] out.\n"We were summoned here as well." [thrall.GetFirstName] announces our presence.\n"Who are you, outlanders?" the Night Elf asks us with some caution in [tyrande.GetHerHis] eyes.\n"I am [thrall.GetName]. Warchief of the Horde." [thrall.GetFirstName] introduces [thrall.GetHerselfHimself].\n"And I am [jaina.GetName], leader of the human survivors of Lordaeron." I announce myself as well after [thrall.GetFirstName].\n\nAs the Night Elf gives us both a deep frown, the raven flying around us transforms and gains the shape of a Human. "They've come to aid you against the Legion."\n"It was you in my dream! But who are you to make such an offer to us?" the Night Elf asks curiously to the Prophet.\n\n"I... am the reason for the Legion's return. Years ago, I brought the Orcs into this world, and by doing so, I opened a path for the demons as well. For my sins, I was murdured by those I cared for most. Despite my death, war raged across the lands of the east for many long years, leaving entire kingdoms desvastated in its wake. Now, at long last, I have returned to set things right. I... am Medivh, The Last Guardian. I tell you now, the only chance for this world is for you to unite in arms against the enemies of all who live!""
 eternitysend_0501_a: "...И вместе мы выступим против Легиона"
  
 eternitysend_1001_title: "Сумерки Богов"
 eternitysend_1001_desc: "Пылающий Легион и его легионы нежити разрушили всё на своём пути, стремясь добраться до кровли и самой жизни мира. The sentinels formed alliances and they all faught bravely to stop Archimonde from reaching the World Tree.\n\nWhen defeat seemed inevitable and all seemed lost, Archimonde climbed atop Mount Hyjal to destroy the World Tree and absorb the power of the Well of Eternity beneath it.\n\nBut the last thing Archimonde expected was for the Night Elves to sacrifice their immortality and instead use the powers of the Well of Eternity to destroy Archimonde once and for all.\n\nThe Demons and the Undead now remain scattered across the world. The roots of the World Tree will heal in time, as will the entire world which suffered under the wrath of the Burning Legion.\n\nThe sacrifices have been made, just as the Orcs, Humans and the Night Elves discarded their old hatred and stood united against a common foe... so did nature herself rise up to banish the shadow... forever."
 eternitysend_1001_light_opt: "Свет благословил нас!"
 eternitysend_1001_shadow_opt: "Легион больше не будет вмешиваться в наши замыслы!"
 eternitysend_1001_life_opt: "Именем Природы, мир пойдёт своим чередом!"
 eternitysend_1001_death_opt: "Свобода от Пылающих Хозяев..."
 eternitysend_1001_order_opt: "Скатертью дорога..."
 eternitysend_1001_doombringer_opt: "Нет... один Пылающий Хозяин пал, но не Легион!"
 eternitysend_1001_elemental_opt: "Лишь духи будут процветать!"
 eternitysend_1001_fallback_opt: "Нам более не нужно жить в страхе перед Легионом"
