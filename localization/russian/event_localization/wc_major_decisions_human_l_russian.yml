 # Defias Brotherhood Decisions 
 wc_defias_brotherhood.0001.title: "Блюдо под названием Справедливость"
 wc_defias_brotherhood.0001.desc: "Дворяне разгромлены, их армии разбиты, и мы стоим выше, чем когда-либо. Сейчас — момент сразить Дворян и их продажную систему, пока железо горячо!\n\nМы можем опустошить их сундуки до невосполнимого и дать этим псам подохнуть, скуля и моля других о помощи. Урок усвоен. Долг сполна.\n\nНо эта победа далась нелегко. Мы были вынуждены жить как разбойники, воры и мародёры, вести себя как жалкие отбросы, чтобы просто выжить. Наши собратья-крестьяне, поднявшиеся за свою свободу, сражались и умирали достойно. Кровь, пот и слёзы... через всё это мы прошли... и, быть может, только кровь Дворян завершит это."
 wc_defias_brotherhood.0001.a: "Заставим их заплатить наш заслуженный долг"
 wc_defias_brotherhood.0001.b: "Сжечь всё дотла!!!"
  
 wc_defias_brotherhood.0002.title: "Власть и кровь"
 wc_defias_brotherhood.0002.desc: "Мы вырезали их всех, как скот, каковым они и были. Наш гнев прокатился далеко и широко по всему Королевству. Дворян либо не стало, либо они в руинах — таков итог испытания простого люда на прочность.\n\nНаши сочувствующие растут среди горожан, и наши ряды множатся! Собратья готовы взяться за оружие и сражаться не на жизнь, а на смерть, дабы сокрушить остатки самозваных герцогов и королей.\n\nИли, быть может, есть иной путь? Вместо хаоса и анархии — позволить народу вести нас за собой? Он нас любит. Мы его освободили. Погружение наших земель в пучину хаоса означало бы лишь новые вторжения — тех презренных орков или злобных сил, что скрываются во тьме. Быть может, пришло время выковать для трона Королевства Штормград новую кровь."
 wc_defias_brotherhood.0002.a: "В конце концов, почему бы не взять всё самим?"
 wc_defias_brotherhood.0002.b: "Долой Королей и Королев!"
 defias_league: "Воля угнетённых"
  
  # Revive the Gilnean Empire, by Grekopithikos 
 gilneas_decisions.1001.t: "Восходит новый волк"
 gilneas_decisions.1001.desc: "Тысячи лет назад жители Гилнеаса высадились на Кул'Тирасе и сражались за эту землю. Хотя кул'тирасцы ныне считаются отдельным народом, их родовые связи не угасли.\n\nСегодня эти связи крепче, чем когда-либо, ведь я объединил наши народы под общим знаменем [GetTitleByKey('e_gilneas').GetName]!"
 gilneas_decisions.1001.a: "Я достигну ещё большего!"
 gilneas_decisions.1001.b: "И это не меньший подвиг от того, что повтор."
 gilneas_decisions.1002.desc: "В Гилнеасском полуострове и окрестных землях уже какое-то время зреет странная ситуация. Вопреки всему [founder.GetFullNameNoTooltip] удалось создать немалое королевство, простёршееся от Бухты Барадин на востоке до берегов Кул'Тираса на западе. Пусть и не без изъянов, но ему удалось объединить потомков древних народов Гилнеаса, и глашатаи [founder.GetFullNameNoTooltip] не замедлят возвестить об этом.\n\nСтяг [GetTitleByKey('e_gilneas').GetName] поднят, но надолго ли?"
 gilneas_decisions.1002.a: "Имперское достоинство требует большего, нежели просто земли."
 gilneas_decisions.1002.b: "На этот раз нас уже никто не разорвёт."
 gilneas_decisions.1002.c: "Столь же незначительная сноска, как и предшественник."
