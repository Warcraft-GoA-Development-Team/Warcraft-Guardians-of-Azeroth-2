l_english:
 # Key Moment
 BattlePoiDescriptionLocCasters: "The key moment of the battle was when the $BattlePoiCommanderCulture$ casters managed to navigate around the enemy, "
 BattlePoiDescriptionLocMassiveInfantry: "The battle was decided when a regiment of $BattlePoiCommanderCulture$ massive infantry pushed through enemy lines,"
 BattlePoiDescriptionLocLightAerial: "The outcome was decided when the $BattlePoiCommanderCulture$ light aerial managed to navigate behind enemy troops,"
 BattlePoiDescriptionLocMassiveAerial: "The battle came to an end when the $BattlePoiCommanderCulture$ massive aerial tore through the battle lines and into the heart of the enemy formation,"
 BattlePoiDescriptionLocCastersKnight: "The key moment of the battle was when the $BattlePoiCommanderCulture$ casters led by $BattlePoiBraveKnight$ managed to navigate around the enemy, "
 BattlePoiDescriptionLocMassiveInfantryKnight: "The battle was decided when a regiment of $BattlePoiCommanderCulture$ massive infantry led by $BattlePoiBraveKnight$ pushed through enemy lines,"
 BattlePoiDescriptionLocLightAerialKnight: "The outcome was decided when the $BattlePoiCommanderCulture$ light aerial led by $BattlePoiBraveKnight$ managed to navigate behind enemy troops,"
 BattlePoiDescriptionLocMassiveAerialKnight: "The battle came to an end when the $BattlePoiCommanderCulture$ massive aerial led by $BattlePoiBraveKnight$ tore through the battle lines and into the heart of the enemy formation,"

 # Outcome
 
 # Outro
 BattlePoiDescriptionLocOutroUndeath: "and raised $BattlePoiEnemyCommander$ to undeath."

 # Historical Battles

 ## First War
 BattlePoIHistoricalNameKyross: "The Battle of Kyross"
 BattlePoIHistoricalDescKyross: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: The [Glossary( 'Defender of the Crown', 'DEFENDER_CROWN_GLOSS' )]\nDate: 1st of March, 583 KC#!\n#weak One of the first outposts of the [GetTitleByKey('e_horde').GetBaseName], Kyross was the stage to one of the first attacks from the humans in an attempt to prevent the Orcs from launching any more surprise attacks.#!"

 BattlePoIHistoricalNameGrandHamlet: "The Battle of Grand Hamlet"
 BattlePoIHistoricalDescGrandHamlet: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetTitledFirstName]\nDefeated: The [Glossary( 'Defender of the Crown', 'DEFENDER_CROWN_GLOSS' )]\nDate: 10th of August, 584 KC#!\n#weak This human outpost was destroyed by the orcs in the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )].\n\nIt was one of the first recorded battle in which the use of clerics and necrolytes were applied in war.#!"

 BattlePoIHistoricalNameDeadmines: "The Battle of The Deadmines"
 BattlePoIHistoricalDescDeadmines: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]\nDefeated: [GetScriptedCharacterByHistoryID( '52450' ).GetFirstName]\nDate: 585 KC#!\n#weak A battle between the orcs and a group of renegade ogres lead by [GetScriptedCharacterByHistoryID( '52450' ).GetFirstName] along with [GetScriptedCharacterByHistoryID( '10004' ).GetFirstName], daughter of [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]. Both of them were slain along with their soldiers on the orders of [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName].\n\nOn another date, [GetScriptedCharacterByHistoryID( '1008' ).GetFullName] was imprisoned by the ogres while searching for the Tome of Divinity. He and his men were then saved by [GetTitleByKey('k_stormwind').GetAdjective] troops led by the [Glossary( 'Defender of the Crown', 'DEFENDER_CROWN_GLOSS' )].#!"

 BattlePoIHistoricalNameRedridge: "The Battle of The Redridge Mountains"
 BattlePoIHistoricalDescRedridge: "#emp Victor: [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 586 KC#!\n#weak The Redridge mountains was one of the places the [GetTitleByKey('e_horde').GetBaseName] descended upon during the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )].\n\n[GetScriptedCharacterByHistoryID( '10000' ).GetFullName] led a small orc raiding party into the Redridge Mountains, seeking to claim Lakeshire as a Horde stronghold. [GetScriptedCharacterByHistoryID( '1008' ).GetFullName] led his knights down the slopes, ambushed the orcs, and almost succeeded in defeating them. [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName] was accompanied by two Shadow Council warlocks who turned the tide of battle and forced Lothar to retreat. [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName] and the other survivors left the area as well but returned after several weeks with a larger force and took Lakeshire and the surrounding land.#!"

 BattlePoIHistoricalNameSunnyglade: "The Battle of Sunnyglade"
 BattlePoIHistoricalDescSunnyglade: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetNameNicknamed]\nDate: 586 KC#!\n#weak The Battle of Sunnyglade was one of the key battles between [GetTitleByKey('k_stormwind').GetNameNoTier] and the [GetTitleByKey('e_horde').GetBaseName], due to the orcs getting to study the magiks of the humans.#!"

 BattlePoIHistoricalNameBlackMorass: "The Battle of Black Morass"
 BattlePoIHistoricalDescBlackMorass: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstNameNicknamed]\nDefeated: [GetScriptedCharacterByHistoryID( '10000' ).GetNameNicknamed]\nDate: 586 KC#!\n#weak [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] took the recent disarray of the Shadow Council and a failed attack on Stormwind as an opportunity to stage a coup against [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName].\n\nAfter winning the battle, [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] challenged [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName] to a mak'gora, under the claim that [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName] was a traitor to his people. After hours of dueling, [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] cut off his head.#!"

 BattlePoIHistoricalNameNorthshire: "The Battle of Northshire Abbey"
 BattlePoIHistoricalDescNorthshire: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 586 KC#!\n#weak During the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )], the Northshire Abbey was used as a prison for the invading orcs and ogres. One of those prisoners was [GetScriptedCharacterByHistoryID( '10620' ).GetFullName].\n\nThe orcs laid siege upon the abbey and fought all manner of enemies inside.#!"

 BattlePoIHistoricalNameGoldshire: "The Battle of Goldshire"
 BattlePoIHistoricalDescGoldshire: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 586 KC#!\n#weak Goldshire was the final city the orcs laid siege to before sieging Stormwind.\n\nIts destruction severed the lifeline between [GetScriptedCharacterByHistoryID( '2' ).GetTitledFirstName] and his people, making him a figurehead waiting to be lopped off.#!"

 BattlePoIHistoricalNameStormwind: "The Fall of Stormwind Keep"
 BattlePoIHistoricalDescStormwind: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 1st of October, 586 KC#!\n#weak The second siege of Stormwind Keep was the final battle of the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )] that ended with the [GetTitleByKey('e_horde').GetBaseNamePossessive] victory over the humans of the [GetTitleByKey('k_stormwind').GetName]. The events that culminated ultimately led to the destruction of Stormwind Keep and the death of [GetScriptedCharacterByHistoryID( '2' ).GetTitledFirstName].\n\nSir [GetScriptedCharacterByHistoryID( '1008' ).GetFullName] would lead the survivors and refugees of the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )] on an exodus north to the continent of Lordaeron, where they would prepare for the $e_horde$'s impending invasion and the eventual outbreak of the [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )].#!"
 
 ## Second War
 BattlePoIHistoricalNameZulDare: "The Battle of Zul'Dare"
 BattlePoIHistoricalDescZulDare: "#emp Victor: [GetScriptedCharacterByHistoryID( '48080' ).GetTitledFirstName] [GetScriptedCharacterByHistoryID( '48080' ).GetDynastyName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 10th of November, 588 KC#!\n#weak At the start of the [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )], [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName] ordered the Blackrock clan to establish a base of operations in the island of Zul'Dare, not far from Lordaeron's shores, in order to prepare their strike towards the coastal human settlements.\n\n[GetScriptedCharacterByHistoryID( '48080' ).GetTitledFirstName] [GetScriptedCharacterByHistoryID( '48080' ).GetDynastyName] and the Alliance navy intercepted the $e_horde$ fleet near the island, successfully attacking the enemy ships, but the arrival of three enslaved red dragons turned the battle and Daelin and his ships were forced to retreat.\n\nAfter establishing order in the coastal regions, [GetScriptedCharacterByHistoryID( '48080' ).GetTitledFirstName] advised in striking the $e_horde$ base hidden in the region of the Channel Islands. Scouts managed to locate the outpost in Zul'Dare and the Alliance military sent forces to destroy it.#!"

 BattlePoIHistoricalNameTarrenMill: "Ambush at Tarren Mill"
 BattlePoIHistoricalDescTarrenMill: "#emp Victor: [GetScriptedCharacterByHistoryID( '1008' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 20th of November, 588 KC#!\n#weak When the Elves of Silvermoon sent a contingent of Archers south to survey the supposed Orcish threat for themselves, they were ambushed by $e_horde$ troops shortly after passing through the Alterac grasslands. These Elves were held in a small prison camp near the northwest region of Tarren Mill.\n\nLord [GetScriptedCharacterByHistoryID( '60001' ).GetFirstName], fervently hoping to enlist the Elves into the Alliance, asked for a search for the missing warriors and to deliver them to safety. After the elves were freed they joined with the humans and fought off the orcs in the region. After that [GetTitleByKey('e_quelthalas').GetNameNoTier] officially joined the Alliance.#!"

 BattlePoIHistoricalNameSouthshore: "The Battle of Southshore"
 BattlePoIHistoricalDescSouthshore: "#emp Victor: [GetScriptedCharacterByHistoryID( '1008' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 588 KC#!\n#weak Shortly after the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )], Southshore gained a new status as a military port for the Alliance. Unfortunately for them, its strategic position has also caught the attention of the Horde.\n\nBoth sides fought for it in order to have a base to construct their ships.#!"

 BattlePoIHistoricalNameHillsbrad: "The Battle of Hillsbrad Foothills"
 BattlePoIHistoricalDescHillsbrad: "#emp Victor: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 589 KC#!\n#weak The Battle of Hillsbrad Foothills was the first major battle between the $e_horde$ and the Alliance of Lordaeron. The Alliance side there was being lead by Supreme Commander [GetScriptedCharacterByHistoryID( '1008' ).GetFullName], with his lieutenants being [GetScriptedCharacterByHistoryID( '60247' ).GetFirstName], [GetScriptedCharacterByHistoryID( '60036' ).GetFirstName], [GetScriptedCharacterByHistoryID( '59001' ).GetFirstName] and Grand [GetScriptedCharacterByHistoryID( '48080' ).GetFullName].\n\nIn the first act of the battle, the Alliance got a preemptive strike against the $e_horde$, taking heavy casualties. After that they deployed death knights and ogres, who were countered by the Alliance's paladins and mages. After a charge lead by [GetScriptedCharacterByHistoryID( '1008' ).GetDynastyHouseName] the $e_horde$ was forced to retreat.#!"

 BattlePoIHistoricalNameDunModr: "The Battle of Dun Modr"
 BattlePoIHistoricalDescDunModr: "#emp Victor: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 589 KC#!\n#weak Dun Modr has traditionally been a major strategic point of importance for controlling the region. During the [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )] it fell to the $e_horde$, who built an outpost nestled near the ruins of the ancient dwarven city. The outpost had repeatedly beaten back Alliance troops while raiding the surrounding farmlands, and it was a vital staging area for Horde troops.\n\nA major battle was eventually fought to retake Dun Modr from the Horde. Alliance forces struck from the nearby island citadel of Tol Barad, their taskforce of [GetTitleByKey('k_stromgarde').GetAdjective] warriors laying siege and capturing the orcish outpost. They forced the orcs into a southwards retreat to their secondary outpost at Dun Algaz. The Horde forces ultimately made a counter-attack, retaking Dun Modr and even bringing their forces to bear against Tol Barad itself.#!"

 BattlePoIHistoricalNameTolBarad: "The Battle of Tol Barad"
 BattlePoIHistoricalDescTolBarad: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '44015' ).GetFullName]\nDate: 1st of February, 589 KC#!\n#weak During the [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )], the island was a strategic staging area for Alliance forces, from which they struck on the Horde-controlled city of Dun Modr and took it back from the hands of their enemies. The orcs, viewing Tol Barad as an obstacle in their path to the Eastern Kingdoms, mounted a ferocious counterstrike on the island. Unprepared for such aggression, the [GetTitleByKey('k_stromgarde').GetAdjective] soldiers were expelled from Tol Barad, and the citadel was razed, a charred symbol of the $e_horde$'s brutal victory. Most of the island's inhabitants were slaughtered, their home ravaged, and their remaining spirits crying out for vengeance.#!"

 BattlePoIHistoricalNameStromgarde: "The Battle of Stromgarde"
 BattlePoIHistoricalDescStromgarde: "#emp Victor: [GetScriptedCharacterByHistoryID( '10002' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '38001' ).GetFullName]\nDate: 589 KC#!\n#weak In the Battle of [GetTitleByKey('k_stromgarde').GetNameNoTier], the Horde used troll Destroyers and transports with ogres and catapults to invade the city from the sea.\n\nWhen the attack commenced, the catapults removed defensive structures from a distance; the troops were constantly ordered to stay near them. Slowly they leveled the city from west to east, replacing fallen ogres as necessary. Their shipyards fell last to the catapult, as well as their ships anchored in the harbor. The invasion was deemed a major success.#!"

 BattlePoIHistoricalNameDunAlgaz: "The Battle of Dun Algaz"
 BattlePoIHistoricalDescDunAlgaz: "#emp Victor: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 589 KC#!\n#weak Following their defeat at Dun Modr, the orcs were forced to retreat south across the Thandol Valley to a secondary outpost at Dun Algaz. [GetScriptedCharacterByHistoryID( '1008' ).GetFullName], hoping to push the orcs even further back into Khaz Modan, ordered the destruction of the outpost.#!"

 BattlePoIHistoricalNameCaerDarrow: "The Battle of Caer Darrow"
 BattlePoIHistoricalDescCaerDarrow: "#emp Victor: [GetScriptedCharacterByHistoryID( '10015' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '60036' ).GetFullName]\nDate: 589 KC#!\n#weak During the [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )], the island was invaded by the Horde, the fortress sacked, and the sacred runestone captured. The stone was hewn into pieces which were used to create the Altars of Storms, arcane structures which allowed [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] to instill magic into the Horde's ogre allies.#!"

 BattlePoIHistoricalNameTyrsHand: "The Battle of Tyr's Hand"
 BattlePoIHistoricalDescTyrsHand: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 589 KC#!\n#weak The Horde used ogre magi to attack the area, establishing a fortress on an island at the mouth of Tyr's Bay, hoping to cut off the Alliance supply lines into [GetTitleByKey('e_quelthalas').GetNameNoTier]. The city suffered heavy damage as the orcs razed the bayside area.#!"

 BattlePoIHistoricalNameDestructionStratholme: "The Destruction of Stratholme"
 BattlePoIHistoricalDescDestructionStratholme: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 589 KC#!\n#weak The Destruction of Stratholme by the Horde happened when the city was preparing to deliver massive amounts of oil to the kingdoms in western Lordaeron, in which the Horde sabotaged its refineries and oil platforms to halt the shipment. With the destruction of Stratholme, the Alliance supply lines to [GetTitleByKey('e_quelthalas').GetNameNoTier] were severed.#!"

 BattlePoIHistoricalNameBurningQuelThalas: "The Burning of Quel'Thalas"
 BattlePoIHistoricalDescBurningQuelThalas: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '42002' ).GetFullName]\nDate: 589 KC#!\n#weak Although [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] initially had no intention of invading [GetTitleByKey('e_quelthalas').GetNameNoTier], [GetScriptedCharacterByHistoryID( '57000' ).GetFirstName] insisted as the prerequisite of the Amani joining the Horde was the destruction of the High Elves.\n\nUsing the red dragons they obtained through enslaving [GetScriptedCharacterByHistoryID( '62400' ).GetTitledFirstName], they burned the entire kingdom to the ground.#!"

 BattlePoIHistoricalNameBlackwood: "The Razing of Blackwood"
 BattlePoIHistoricalDescBlackwood: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '60028' ).GetFullName]\nDate: 589 KC#!\n#weak During [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]'s assault on the elven [GetTitleByKey('e_quelthalas').GetName], a small band of orcs broke off from the main invading force and attacked the town of Blackwood, on the shores of Blackwood Lake. Baron [GetScriptedCharacterByHistoryID( '60028' ).GetDynastyName] marshaled his subjects to defend the town, but they were all slain by the orcish forces. Though the burning of Blackwood had marginal strategic effect on the [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )], it carried a lasting impact on the baron's son [GetScriptedCharacterByHistoryID( '60030' ).GetFullName], who was stationed in $e_quelthalas$ at the time and blamed the elves for his family's death.#!"

 BattlePoIHistoricalNameAlterac: "The Betrayal and Destruction of Alterac"
 BattlePoIHistoricalDescAlterac: "#emp Victor: [GetScriptedCharacterByHistoryID( '60036' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '58000' ).GetFullName]\nDate: 589 KC#!\n#weak It was revealed that [GetTitleByKey('k_alterac').GetNameNoTier] has betrayed the Alliance; with [GetScriptedCharacterByHistoryID( '58000' ).GetTitledFirstName] working with the Horde from the beginning by providing them passage through their lands and routes to launch their attacks.\n\n As retaliation for this betrayal, the Alliance laid siege upon the kingdom until it was completely destroyed.#!"

 BattlePoIHistoricalNameTombSargeras: "The Tomb of Sargeras"
 BattlePoIHistoricalDescTombSargeras: "#emp Victor: [GetScriptedCharacterByHistoryID( '10002' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10002' ).GetDynastyHouseName]\nDefeated: [GetScriptedCharacterByHistoryID( '10015' ).GetFullName]\nDate: 589 KC#!\n#weak [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] has betrayed the Horde. On the eve of [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]'s attack on [GetTitleByKey('e_lordaeron').GetNameNoTier]'s capital, [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] took the Stormreaver and Twilight's Hammer clans and set out to sea to locate the Tomb of Sargeras. With nearly half of his standing forces suddenly gone, [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] was forced to retreat and hunt down the traitorous warlock. This reprieve would ultimately give the Alliance time to regroup and retaliate.\n\n[GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] did indeed locate the Tomb and used his power to raise it from the ocean floor and creating the Broken Shore. Taking with him his most select followers, [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] cast open the doors and entered and began searching for the Eye of Sargeras. He did not however find the godhood he was hoping for. Instead, he was torn to shreds by a swarm of insane demons that had long ago been drawn to the tomb through the dark magics that emanated from Sargeras's remains. The remainder of his clans were slaughtered by [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]'s retaliation. In those last moments, [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] realized he had just been a pawn, that Sargeras had fooled him into doing his dirty work.\n\nThe orcs killed during the battle were eventually raised by the vile magics of the demons, and kept reliving it in their undeath.#!"

 BattlePoIHistoricalNameCapitalCity: "The Siege of Capital City"
 BattlePoIHistoricalDescCapitalCity: "#emp Victor: [GetScriptedCharacterByHistoryID( '60001' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 589 KC#!\n#weak The Siege of [GetTitleByKey('e_lordaeron').GetNameNoTier]'s capital was a massive failure of the Horde. Although unexpected, [GetScriptedCharacterByHistoryID( '60001' ).GetFirstName] quickly reacted to the Horde's invasion by ordering his soldiers to drop hot oil on the orcs. Alliance forces under [GetScriptedCharacterByHistoryID( '60247' ).GetFirstName] along with [GetScriptedCharacterByHistoryID( '59001' ).GetFirstName] then reached the City to reinforce. [GetScriptedCharacterByHistoryID( '38001' ).GetFullName] blocked mountain passes to delay further assaults.\n\nNews reached [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] that [GetScriptedCharacterByHistoryID( '10015' ).GetFullName] took his Stormreavers and Twilight's Hammer and abandoned them. Desperate, he withdrew his troops to hunt him, losing the siege.#!"

 BattlePoIHistoricalNameCrestfall: "The Battle of Crestfall"
 BattlePoIHistoricalDescCrestfall: "#emp Victor: [GetScriptedCharacterByHistoryID( '48080' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10002' ).GetFullName]\nDate: 589 KC#!\n#weak The Battle of Crestfall was a naval battle between the Alliance and Horde during the [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )]. The Horde ships were led by [GetScriptedCharacterByHistoryID( '10002' ).GetFullName] which were accompanied by red dragons. The Alliance fleet was lead by [GetScriptedCharacterByHistoryID( '48080' ).GetFullName], along with the Wildhammer gryphon riders lead by [GetScriptedCharacterByHistoryID( '22002' ).GetFullName].\n\nHaving experienced fighting dragons before, the gryphon riders managed managed to defeat these fearsome beasts.\n\nThe battle ultimately ended in an Alliance victory, but it was not earned without loss. One fleet lead by [GetScriptedCharacterByHistoryID( '48080' ).GetFirstName]'s son, [GetScriptedCharacterByHistoryID( '48082' ).GetFirstName], was destroyed along with everyone in it.#!"

 BattlePoIHistoricalNameBlackrockSpire: "The Siege of Blackrock Spire"
 BattlePoIHistoricalDescBlackrockSpire: "#emp Victor: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 589 KC#!\n#weak The Battle of Blackrock Spire was one of the bloodiest and most decisive battles of the [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )] between the Alliance and Horde. As the siege of the Spire progressed, [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] procedded with a plan to demoralize the Alliance killing their leader, [GetScriptedCharacterByHistoryID( '1008' ).GetFullName], with his ogre guard. His plan had the opposite effect though, as the death of [GetScriptedCharacterByHistoryID( '1008' ).GetFirstNameNicknamed] only served to bolster the Alliance even more.\n\nWith [GetScriptedCharacterByHistoryID( '60247' ).GetFullName] now at the lead, the Alliance won the siege, and [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] along with the other surviving orcs were captured.#!"

 BattlePoIHistoricalNameDarkPortal: "The Destruction of the Dark Portal"
 BattlePoIHistoricalDescDarkPortal: "#emp Victor: [GetScriptedCharacterByHistoryID( '60247' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10017' ).GetFullName]\nDate: 589 KC#!\n#weak Though many orcs were killed or captured in the Siege of Blackrock Spire, many also managed to flee. The vast majority of these made haste for the Dark Portal in the south. A pursuit was organized by [GetScriptedCharacterByHistoryID( '60247' ).GetFullName], who had assumed command of the Alliance army after [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]'s demise. Their goal was not necessarily to catch these stragglers. The exact location of the portal to Draenor still remained unknown to the Alliance. Thus, [GetScriptedCharacterByHistoryID( '60247' ).GetFullName] hoped to follow the fleeing remnants of [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]'s army right to the gateway itself.\n\nThe death knight known as [GetScriptedCharacterByHistoryID( '10017' ).GetFullName] largely took command of the Horde remnants following the defeat at Blackrock Mountain. He and his forces eventually reached the Dark Portal, where the $d_blacktoothgrin_clan$ was already waiting, the protection and preservation of the gateway having been given to them before the war started. But with [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]'s defeat, the orcs were unorganized.\n\nThe pursuing Alliance eventually fell upon them. The $d_burning_blade_clan$ was routed and ultimately destroyed by troops under the command of [GetScriptedCharacterByHistoryID( '60036' ).GetNameNicknamed], while [GetScriptedCharacterByHistoryID( '60247' ).GetFullName] led the charge to the stairs leading to the Dark Portal, dueling [GetScriptedCharacterByHistoryID( '10002' ).GetFirstName] and [GetScriptedCharacterByHistoryID( '10003' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10000' ).GetDynastyHouseName].\n\nThe Alliance succeeded in destroying the gateway, with the remaining Horde forces fleeing into the wilds of Azeroth or slipping back to Draenor. The destruction of the Dark Portal would mark the end of the [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )] in Azeroth.#!"
 
 ##Interlude
 BattlePoIHistoricalNameGrimBatol: "The Battle of Grim Batol"
 BattlePoIHistoricalDescGrimBatol: "#emp Victor: [GetScriptedCharacterByHistoryID( '59130' ).GetFirstName] and [GetScriptedCharacterByHistoryID( '62400' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( '10250' ).GetFullName] and [GetScriptedCharacterByHistoryID( '62200' ).GetFirstName]\nDate: 593 KC#!\n#weak Stunned to find that an orc clan still had this much power after the [Glossary( 'Second War', 'SECOND_WAR_GLOSS' )], [GetScriptedCharacterByHistoryID( '59130' ).GetFirstName] was determined to break its strength. He rallied a small group of friends including [GetScriptedCharacterByHistoryID( '42087' ).GetFirstName] and [GetScriptedCharacterByHistoryID( '22001' ).GetFirstName] and rushed to Grim Batol to free the enslaved red dragons. When they arrived, the battle was already under way.\n\nThe moment the Dragonmaw had left Grim Batol and set out for Dun Algaz, [GetScriptedCharacterByHistoryID( '62200' ).GetFirstName] attacked and slaughtered countless orcs. He had no desire to keep them or the adult dragons alive. Only the red dragonflight's eggs were of use to him. As the battle unfolded, [GetScriptedCharacterByHistoryID( '62400' ).GetFirstName] broke free of her chains, and before [GetScriptedCharacterByHistoryID( '10250' ).GetFullName] could kill her with the Demon Soul, she devoured him whole. Then she turned her wrath upon [GetScriptedCharacterByHistoryID( '62200' ).GetFirstName].\n\nThe Dragonqueen was not alone. [GetScriptedCharacterByHistoryID( '62001' ).GetFirstName], [GetScriptedCharacterByHistoryID( '62800' ).GetFirstName], and [GetScriptedCharacterByHistoryID( '62600' ).GetFirstName] soon joined her in the fight against their corrupted brother. As the five Dragon Aspects grappled in the sky, [GetScriptedCharacterByHistoryID( '59130' ).GetFirstName] and his mortal allies focused their attention on the orcs and the Demon Soul. [GetScriptedCharacterByHistoryID( '59130' ).GetFirstName] found a flaw in the ancient artifact and destroyed it. In that moment, the power trapped within the relic escaped, returning to the Dragon Aspects. [GetScriptedCharacterByHistoryID( '62200' ).GetFirstName] could not stand against the newly empowered dragons. He suffered terrible wounds and was forced to flee, remaining unseen for many years to come.\n\nThe red dragonflight was free again. Many of the Dragonmaw orcs had died in the battle, and the terrified survivors had scattered into the wilds. They would never truly regain their former power.#!"

 BattlePoIHistoricalNameWarSpider: "The War of the Spider"
 BattlePoIHistoricalDescWarSpider: "#emp Victor: [GetScriptedCharacterByHistoryID( '10014' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( 'anubarak' ).GetFirstName]\nDate: 596 KC#!\n#weak The War of the Spider was a conflict between the fledgling [GetTitleByKey('e_scourge').GetBaseName] and the Empire of Azjol-Nerub. Although the nerubians outnumbered the undead, the [GetTitleByKey('e_scourge').GetBaseName] managed to defeat them through attrition, steadily but surely turning their fallen comrades against them, including their leader, [GetScriptedCharacterByHistoryID( 'anubarak' ).GetFullName].#!"
 
 ##Third War
 BattlePoIHistoricalNameDarkspear: "Battle of the Darkspear Islands"
 BattlePoIHistoricalDescDarkspear: "#emp Victor: [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( '150100' ).GetFirstName]\nDate: 602 KC#!\n#weak After making it halfway to Kalimdor, the Horde forces landed on the Darkspear Islands. The orcs' ships were badly damaged and needed to be repaired before the journey may continue. Soon after landing, the shamans detected magic around them and found out some troll sentry wards. The trolls' chieftain, [GetScriptedCharacterByHistoryID( '68000' ).GetFirstName], revealed himself and told the orcs that humans had landed on the islands too and are now were hunting his tribesmen. The orcs and trolls agreed to join forces and set up a base to defend themselves from the humans. They assaulted the humans' base, led by the Archmage [GetScriptedCharacterByHistoryID( 'sanath_tidebringer' ).GetFullName]. Before managing to destroy the whole camp, murlocs appeared and net the humans, trolls, and orcs. They were then taken to a cave to be sacrificed to the Sea Witch [GetScriptedCharacterByHistoryID( '150100' ).GetFirstName].\n\n[GetScriptedCharacterByHistoryID( '10021' ).GetFirstName] managed to escape from the prison and freed his comrades, but not before [GetScriptedCharacterByHistoryID( '68000' ).GetFirstName] was sacrificed by the murlocs.\n\nAs [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName] escaped with the newly joined Darkspear trolls, he was chased by [GetScriptedCharacterByHistoryID( '150100' ).GetFirstName] and her murloc warriors. He had to rally his forces to hold the line and protect the ships until they were repaired. After defending against the attackers the ships were finally repaired and [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName]'s forces continued on to Kalimdor, beginning the Invasion of Kalimdor.#!"
 
 BattlePoIHistoricalNameCullingStratholme: "The Culling of Stratholme"
 BattlePoIHistoricalDescCullingStratholme: "#emp Victor: [GetScriptedCharacterByHistoryID( '60003' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( 'malganis' ).GetFirstName]\nDate: 603 KC#!\n#weak The Culling of Stratholme was the slaughter of a large portion of the civilian population of Stratholme at the hands of [GetScriptedCharacterByHistoryID( '60003' ).GetFullName], who sought to prevent the spread of the Plague of Undeath at any cost necessary. This event also marked the (temporary) disbanding of the Silver Hand, as [GetScriptedCharacterByHistoryID( '60036' ).GetNameNicknamed] refused to follow the order of executing civilians. More importantly, the event marked Prince [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName]'s first major step to becoming a death knight by slaughtering his own people.#!"

 BattlePoIHistoricalNameFrostmourne: "Frostmourne"
 BattlePoIHistoricalDescFrostmourne: "#emp Victor: [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( 'malganis' ).GetFirstName]\nDate: 603 KC#!\n#weak The final battle between [GetScriptedCharacterByHistoryID( '60003' ).GetFullName] and the dreadlord, [GetScriptedCharacterByHistoryID( 'malganis' ).GetFirstName]. It was the climax of [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName]' pursuit of the dreadlord in his quest for vengeance against [GetScriptedCharacterByHistoryID( 'malganis' ).GetFirstName]' acts against the people of [GetTitleByKey('e_lordaeron').GetNameNoTier]. It would see [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] taking up the accursed runeblade, [frostmourne|E] at the expense of his old tutor and friend's life, [GetScriptedCharacterByHistoryID( '17002' ).GetFullName], and drive his cold, hungry, and exhausted forces to certain death while using the cursed sword's power to vanquish [GetScriptedCharacterByHistoryID( 'malganis' ).GetFirstName]' forces and eventually the dreadlord himself.\n\nWhile [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] was in his search for the runeblade, the Alliance Captains bravely defended the Alliance base.#!"

 BattlePoIHistoricalNameDarrowshire: "The Battle of Darrowshire"
 BattlePoIHistoricalDescDarrowshire: "#emp Victor: [GetScriptedCharacterByHistoryID( '60679' ).GetNameNicknamed]\nDefeated: [GetScriptedCharacterByHistoryID( '60148' ).GetFullName]\nDate: 603 KC#!\n#weak The Battle of Darrowshire was a conflict which occurred as part of the [Glossary( 'Third War', 'THIRD_WAR_GLOSS' )] in [GetTitleByKey('e_lordaeron').GetNameNoTier] between a united force of humans, and a large army of Undead [GetTitleByKey('e_scourge').GetBaseName], over the fate of the human village of Darrowshire.\n\nWhen the Scourging of Lordaeron began and the undead armies of the Lich King proceeded to sweep across the [GetTitleByKey('e_lordaeron').GetName], the village of Darrowshire became cut off from the remainder of the forces of the Alliance. As it became further threatened by the arrival of [GetTitleByKey('e_scourge').GetAdjective] forces, a unified defense force was established to protect the settlement and its inhabitants. This force was a combination of [GetTitleByKey('e_lordaeron').GetNameNoTier] troops, paladins of [GetTitleByKey('k_order_of_the_silver_hand').GetNameNoTier], and a thrown-together group of militia led by [GetScriptedCharacterByHistoryID( '60148' ).GetFullName].\n\nAlthough Darrowshire's defenders were successful in repelling major undead attacks, and even slaying one of their leaders in the form of the ghoul lord Horgus, the tables turned on them when, during the battle, Captain [GetScriptedCharacterByHistoryID( '60148' ).GetDynastyName]'s spirit was torn loose from his body by the death knight [GetScriptedCharacterByHistoryID( '60679' ).GetFirstNameNicknamed]. Having had his spirit twisted and corrupted by the death knight's black magics, [GetScriptedCharacterByHistoryID( '60148' ).GetFirstName] spread his taint to the other humans. The defenders, now under the sway of the Scourge, turned on Darrowshire and promptly slaughtered all of its residents.\n\nIn the wake of the battle, the remaining Scourge forces and the corrupted defenders left the ruined village behind and pressed on to continue to ravage the once-mighty kingdom, adding to the Scourge's assault on the living.#!"

 BattlePoIHistoricalNameHunterShadows: "Hunter of Shadows"
 BattlePoIHistoricalDescHunterShadows: "#emp Victor: [GetScriptedCharacterByHistoryID( '10200' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '410002' ).GetFirstName]\nDate: 603 KC#!\n#weak Following the Warsong clan's initiation of their logging operations in southern Ashenvale, the Night Elf Sentinels launched a massive counterattack to drive the Orcs out. The Warsong clan had even attracted the attention of the ancient, reclusive demigod, [GetScriptedCharacterByHistoryID( '410002' ).GetFirstName], who personally took command of the Night Elf forces moving against them. [GetScriptedCharacterByHistoryID( '410002' ).GetFirstName] wiped out all of the Orcs' outposts before sending his forces against [GetScriptedCharacterByHistoryID( '10200' ).GetFirstName]'s main base. After barely managing to repel several savage attacks by the Sentinels, defeat for the Orcs seemed imminent. The Shamans and Witch Doctors under [GetScriptedCharacterByHistoryID( '10200' ).GetFirstName]'s command then sensed a powerful energy emanating from the woods, which turned out to be a well fouled with the [Glossary('Blood of Mannoroth', 'BLOOD_OF_MANNOROTH_GLOSS')]. After defeating the satyrs guarding the befouled well, [GetScriptedCharacterByHistoryID( '10200' ).GetFirstName], despite everything [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName] had taught him, gave himself over to the demonic corruption. The Warsong Clan drank the blood and became Chaos orcs imbued with a bloodlust and demonic powers. With these new powers, the Orcs easily overcame the Sentinels and slew [GetScriptedCharacterByHistoryID( '410002' ).GetFirstName], forcing the Night Elves to retreat back into the depths of the forests.\n\n[GetScriptedCharacterByHistoryID( '10200' ).GetDynastyHouseName]'s sense of victory was short-lived, however. [GetScriptedCharacterByHistoryID( 'mannoroth' ).GetFirstName] appeared before him and declared that the Orcs would serve the Burning Legion once again, despite [GetScriptedCharacterByHistoryID( '10200' ).GetFirstName]'s feeble protests that they were "free".#!"

 BattlePoIHistoricalNameFallQuelThalas: "The Fall of Quel'Thalas"
 BattlePoIHistoricalDescFallQuelThalas: "#emp Victor: [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( '42002' ).GetFullName]\nDate: 603 KC#!\n#weak A massive battle that occurred during the [Glossary( 'Third War', 'THIRD_WAR_GLOSS' )], instigated by the twisted [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] and his Scourge army. The conflict took place all throughout the [GetTitleByKey('e_quelthalas').GetName].\n\nFresh from destroying [GetTitleByKey('e_lordaeron').GetNameNoTier], [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] turned his to $e_quelthalas$ with the purpose of defiling its mystical Sunwell, a key component in the resurrection of the necromancer [GetScriptedCharacterByHistoryID( '59100' ).GetFirstName]. [GetScriptedCharacterByHistoryID( '42002' ).GetFirstName] rallied his people to action but left the command of their army and defense to [GetScriptedCharacterByHistoryID( '42076' ).GetFirstName]. The high elves resisted [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] but were ultimately unable to prevent the Scourge from advancing. The elven homeland was overrun by the undead, the capital of Silvermoon was sacked and reduced to ruins, and roughly ninety percent of the high elves were killed.\n\nBy the end of the conflict, [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] successfully managed to raise [GetScriptedCharacterByHistoryID( '59100' ).GetFirstName] as a powerful [GetTrait('creature_lich').GetName( GetNullCharacter )], desecrating the Sunwell in the process.\n\nThe invasion was the most damaging event in Thalassian history, and a blow its survivors, calling themselves the blood elves in honor of their perished brethren, would take years to begin recovering from.#!"

 BattlePoIHistoricalNameDemonsDriven: "By Demons Be Driven"
 BattlePoIHistoricalDescDemonsDriven: "#emp Victor: [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName] and [GetScriptedCharacterByHistoryID( '48081' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( '10200' ).GetFullName]\nDate: 603 KC#!\n#weak [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName], [GetScriptedCharacterByHistoryID( '210000' ).GetFirstName], and [GetScriptedCharacterByHistoryID( '48081' ).GetFirstName] met in preparation for their joint assault on the corrupted Warsong Clan.\n\nThe battle soon began as Horde and Alliance soldiers clashed with the unrelenting Warsong clan. The demonic corruption made them powerful and merciless. Nevertheless, [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName]'s forces attacked and pushed their way through.\n\nAfter defeating Hellscream's cadre, [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName] confronted [GetScriptedCharacterByHistoryID( '10200' ).GetFirstName]. [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName] pleaded with Grom to surrender and come with him. Grom then revealed that the Legion had corrupted the orcs because they willingly drank the [Glossary('Blood of Mannoroth', 'BLOOD_OF_MANNOROTH_GLOSS')]. [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName], enraged, attacked [GetScriptedCharacterByHistoryID( '10200' ).GetDynastyHouseName]. After a desperate struggle, [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName] managed to regain control of himself and used [GetScriptedCharacterByHistoryID( '48081' ).GetFirstName]'s Soul Gem to capture Grom.\n\n[GetScriptedCharacterByHistoryID( '10021' ).GetFirstName]'s shamans and [GetScriptedCharacterByHistoryID( '48081' ).GetFirstName]'s priests successfully purged [GetScriptedCharacterByHistoryID( '10200' ).GetFirstName] of the demonic influence. Now freed of their control, Grom told him that [GetScriptedCharacterByHistoryID( 'mannoroth' ).GetFirstName] was in a nearby canyon. The two orcs managed to defeat the demon, but Grom fell in the battle.#!"

 BattlePoIHistoricalNameDalaran: "The Siege of Dalaran"
 BattlePoIHistoricalDescDalaran: "#emp Victor: [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( '59000' ).GetFullName]\nDate: 603 KC#!\n#weak In preparation for the undead attack, a small group of wizards prepared a special spell that would do damage to any undead that entered Dalaran. [GetScriptedCharacterByHistoryID( '59100' ).GetFirstName] was able to sense them and revealed to [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] that the auras would disperse upon the deaths of their casters. With their mission of claiming the Book of [GetScriptedCharacterByHistoryID( '5000' ).GetFirstName], the Scourge began the invasion of Dalaran and quickly slew the first two wizards and freed the first levels of Dalaran of the aura harming them. With the outposts destroyed the Scourge began to ready themselves against [GetScriptedCharacterByHistoryID( '59000' ).GetFirstName], who had an army defending him as he kept up the final aura.\n\nThe Scourge engaged said army and after a fierce battle, they were victorious. [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName], [GetScriptedCharacterByHistoryID( '59100' ).GetFirstName] and [GetScriptedCharacterByHistoryID( '430000' ).GetFirstName] entered a vault where [GetScriptedCharacterByHistoryID( '59000' ).GetFirstName] awaited them and slew him. The Book of [GetScriptedCharacterByHistoryID( '5000' ).GetFirstName] fell into the hands of [GetScriptedCharacterByHistoryID( '59100' ).GetFirstName].\n\nThe Scourge moved to a hill outside Dalaran where [GetScriptedCharacterByHistoryID( '59100' ).GetFirstName] worked on the summoning spell while [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] and his units defended him. The remnants of the mages had regrouped and now sent numbers of mages on the Scourge. The effort was ultimately fruitless as the demons were successfully summoned. The summoning was complete with the coming of Archimonde who razed the city's spires to the ground.#!"

 BattlePoIHistoricalNameFlameSorrow: "A Destiny of Flame and Sorrow"
 BattlePoIHistoricalDescFlameSorrow: "#emp Victor: [GetScriptedCharacterByHistoryID( '340009' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '430000' ).GetFullName]\nDate: 603 KC#!\n#weak As the Burning Legion continued its advance toward Mount Hyjal, Lord Archimonde commanded the corruption of the surrounding forest to weaken the defenses of the protecting night elves. The dreadlord [GetScriptedCharacterByHistoryID( '430000' ).GetFirstName] used a powerful warlock artifact called the Skull of [GetScriptedCharacterByHistoryID( '10015' ).GetFullName] to desecrate the surrounding forests, resulting in mutated wildlife, corrupted ancients, and a polluted environment, creating Felwood.\n\nThe recently freed [GetScriptedCharacterByHistoryID( '340009' ).GetFirstName] [GetScriptedCharacterByHistoryID( '340009' ).GetDynastyName], was told by [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] [GetScriptedCharacterByHistoryID( '60003' ).GetDynastyName] that he could use the skull to not only halt the advancing corruption, but increase his own power as well. His desire for magic driving him, [GetScriptedCharacterByHistoryID( '340009' ).GetFirstName] braved the dangers of Felwood with an army of loyal elves and took the skull, stopping the corruption from spreading. [GetScriptedCharacterByHistoryID( '340009' ).GetFirstName] then defeated Tichondrius, but was banished by his brother [GetScriptedCharacterByHistoryID( '340008' ).GetFirstName] for using demonic power.#!"

 BattlePoIHistoricalNameMountHyjal: "The Battle of Mount Hyjal"
 BattlePoIHistoricalDescMountHyjal: "#emp Victor: [GetScriptedCharacterByHistoryID( '340003' ).GetFirstName], [GetScriptedCharacterByHistoryID( '340008' ).GetFirstName], [GetScriptedCharacterByHistoryID( '48081' ).GetFirstName] and [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName]\nDefeated: Archimonde\nDate: 604 KC#!\n#weak The Battle of Mount Hyjal was the final conflict that concluded the [Glossary( 'Third War', 'THIRD_WAR_GLOSS' )]. The battle was the culmination of years of fighting between the various mortal forces of Azeroth and the demonic and undead armies of the Burning Legion, and saw the demons' invasion end in decisive failure.\n\nSpecifically, the event took place as part of the invasion of Kalimdor phase of the war, where Archimonde struck directly at the World Tree Nordrassil on Mount Hyjal as part of his endgame. The battle began when a mortal coalition of night elves, Alliance, and Horde elements arrayed themselves before the World Tree to halt Archimonde's advance. Though they were unable to stand against the Legion indefinitely, they aimed to buy time for [GetScriptedCharacterByHistoryID( '340008' ).GetFullName] to prepare a proper defense.\n\nThe conflict would end when Archimonde reached Nordrassil. An army of wisps, called by [GetScriptedCharacterByHistoryID( '340008' ).GetFirstName], was successful in igniting the World Tree's enchantments in a large explosion, vaporizing the demon commander. In addition to closing the [Glossary( 'Third War', 'THIRD_WAR_GLOSS' )], this victory also marked the end of the Age of Chaos, and the Legion's greatest defeat since the [Glossary( 'War of the Ancients', 'WAR_OF_THE_ANCIENTS_GLOSS' )]. For many years, relations between the mortal races would be defined by their cooperation at Mount Hyjal, which saved Azeroth from certain destruction.#!"


 # Glossary
 DEFENDER_CROWN_GLOSS:0 "The Defender of the Crown was the name given to the unknown leader of the human forces of [GetTitleByKey('k_stormwind').GetNameNoTier] during the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )]. As a loyal subject of [GetScriptedCharacterByHistoryID( '2' ).GetTitledFirstName], the Defender fought on multiple battlefields against the orcs and their leader, [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]. As [GetTitleByKey('e_horde').GetNameNoTier] won the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )], it is likely that the Defender has died."
 FIRST_WAR_GLOSS:0 "The First War was a conflict fought between the orcish clans of Draenor and the humans of the [GetTitleByKey('k_stormwind').GetName]. It ultimately ended with the fall of [GetTitleByKey('k_stormwind').GetNameNoTier] and the victory of the [GetTitleByKey('e_horde').GetBaseName]."
 SECOND_WAR_GLOSS:0 "The Second War was a major conflict that took place in the Eastern Kingdoms between the armies of the $e_horde$ and an Alliance of humans and several other races. The conflict immediately succeeded the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )] and saw the two factions clash for mastery of the entire continent as well as Azeroth at large."
 THIRD_WAR_GLOSS:0 "The Third War was a massive conflict between the mortal races of Azeroth and the demons of the Burning Legion. It began in earnest when the human [GetTitleByKey('e_lordaeron').GetName] fell to the [GetTitleByKey('e_scourge').GetBaseName] army led by the death knight [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName], and ended with the defeat of the demon commander Archimonde on Mount Hyjal."
 WAR_OF_THE_ANCIENTS_GLOSS:0 "The War of the Ancients was a major conflict which constituted the first coming of the demonic Burning Legion to Azeroth 10,000 years prior to the events of the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )]. One of the largest and most costly wars in Azeroth's history, the War of the Ancients influenced the fate of all life on the planet for millennia to come. The conflict ultimately led to the [Glossary( 'Great Sundering', 'GREAT_SUNDERING_GLOSS' )]. It was the first time one of the Legion's invasions of a world had ever been stopped."
 GREAT_SUNDERING_GLOSS:0 "The Great Sundering was a cataclysmic event that shattered the continent of Kalimdor approximately 10,000 years ago, at the end of the War of the Ancients. This was caused by the implosion of the destabilized [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )], which destroyed eighty percent of Kalimdor's landmass, sending it down to the bottom of the oceans."
 WELL_OF_ETERNITY_GLOSS:0 "The Well of Eternity was a lake of scintillating arcane energies and limitless power formed from the very lifeblood of Azeroth's world-soul. The Well was located on the ancient continent of Kalimdor near the night elven city of Zin-Azshari. The present area where the Well of Eternity was located became the Maelstrom after the Great Sundering.\n\nThe Well was the central focus of the Burning Legion's invasion during the War of the Ancients, and the area around it served as the final battleground of the conflict. Its waters were so powerful, that the demons hoped to bring Sargeras himself to Azeroth by turning the Well into a great portal between Azeroth and Argus. The Well's ensuing destruction forever spread arcane power throughout the world, physically changed its geography, and heralded a new era in Azerothian history."