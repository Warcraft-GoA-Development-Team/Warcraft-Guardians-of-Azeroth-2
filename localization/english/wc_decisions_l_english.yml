 decision_group_type_scourge:0 "Scourge Decisions"

 digging_up_the_dead_decision:0 "Retrieve [GetGlobalVariable('path_of_the_damned_story').Story.MakeScope.Var('necromancer').GetCharacter.GetFirstNamePossessiveNoTooltip] remains"
 digging_up_the_dead_decision_desc:0 "The [GetTrait('lich_king').GetName(GetNullCharacter)] speaks to me through [frostmourne|E]. His command is clear: recover the remains of [GetGlobalVariable('path_of_the_damned_story').Story.MakeScope.Var('necromancer').GetCharacter.GetName] and seize a sacred urn to preserve him for a journey to Quel'Thalas."
 digging_up_the_dead_decision_urn_holder_effect.tt:0 "[artifact_owner.GetName] currently holds the urn"
 digging_up_the_dead_decision_holy_orders_join_effect.tt:0 "Every [holy_order|E] of [war_target.GetFaith.GetName] will rally to the defense of [war_target.GetShortUIName]"
 digging_up_the_dead_decision_tooltip:0 "Recover the remains of [GetGlobalVariable('path_of_the_damned_story').Story.MakeScope.Var('necromancer').GetCharacter.GetName] and prepare him for resurrection"
 digging_up_the_dead_decision_confirm:0 "For the Scourge!"

 balnazzar_become_dathrohan_decision:0 "A Life Worth Stealing"
 balnazzar_become_dathrohan_decision_desc:0 "Lordaeron is gone from my hands, and wandering these ruins landless suits nothing about what I actually am. A throne was only ever scaffolding. Bodies are harder to come by twice, and I have already found the one worth taking - a Silver Hand zealot, respected, trusted, exactly the kind of face no one thinks to look twice at.\n\nThere is no need to wait for someone to hand me a reason. I can choose the moment myself, walk into Stratholme's ruin, and become someone the Legion, Sylvanas, and whatever is left of Lordaeron's throne all stop looking for."
 balnazzar_become_dathrohan_decision_confirm:0 "Take His Life as Your Own"
 balnazzar_become_dathrohan_decision_tooltip:0 "Kill Saidan Dathrohan and take his body, continuing play as him - inherits his rank, court and holdings, while your true nature and magic talents carry over hidden beneath the disguise"

 balnazzar_move_against_alexandros_decision:0 "Turn the Son Against the Father"
 balnazzar_move_against_alexandros_decision_desc:0 "Alexandros Mograine cannot be bent, bought, or fooled - the one obstacle between me and total command of the Order. His son Renault, eaten alive by jealousy of his brother Darion, is nothing like him.\n\nA lie, well placed, is worth more than an army."
 balnazzar_move_against_alexandros_decision_confirm:0 "Whisper the Lie"
 balnazzar_move_against_alexandros_decision_effect_tooltip:0 "Turns Renault against his father, and starts a scheme to have Alexandros Mograine assassinated"
 balnazzar_move_against_alexandros_decision_requirement_alive:0 "Alexandros and Renault Mograine must both be alive"
 balnazzar_move_against_alexandros_decision_tooltip:0 "Turn Alexandros' own son against him"
 balnazzar_shed_the_mask_decision:0 "Shed the Mask"
 balnazzar_shed_the_mask_decision_desc:0 "The weight of being watched, of being questioned, of holding a stolen face steady under scrutiny - it does not ease, no matter how long I wear it. There is a simpler answer than enduring it a moment longer.\n\nI do not have to wait to be caught."
 balnazzar_shed_the_mask_decision_confirm:0 "I Won't Wait to Be Caught"
 balnazzar_shed_the_mask_decision_tooltip:0 "Strike first, before the mask is torn away"
 balnazzar_shed_the_mask_decision_effect_tooltip:0 "The faithful of your capital county are butchered and raised as the Risen, and Balnazzar reclaims his own nathrezim body and breaks that land away as his own - the rest of the Scarlet Crusade is left to continue on its own, and Saidan Dathrohan's borrowed body is left behind, finally and properly dead"
