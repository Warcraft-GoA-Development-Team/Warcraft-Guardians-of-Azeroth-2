 pam_decision_events.0020.t: "Evangelize [selected_item.GetNameNoTooltip(actor.GetRite)]"
 pam_decision_events.0020.desc: "After a mass in [clerical_region.GetName] I have gathered a group of faithfuls, to hear the word of [ROOT.Char.GetFaith.HighGodName|U] from myself. I have chosen a passage from the [ROOT.Char.GetFaith.ReligiousText|U] to teach about my belief in [selected_item.GetName( actor.GetRite )]:\n\n"[ROOT.Char.Custom('PersonalTenetRelevantBibleQuote')]""
