l_russian:
 wc_crisis_events.0100.title_pandaria: "Конец Властелина Грома"
 wc_crisis_events.0100.title_horde: "Орда была побеждена"
 wc_crisis_events.0100.title_scourge: "Конец Плети"
 wc_crisis_events.0100.title_burning_legion: "Вторжение Легиона остановлена"
 wc_crisis_events.0100.title_black_empire: "Чёрная Империя разрушена"
 wc_crisis_events.0100.title: "Кризис предотвращён"
 wc_crisis_events.0100.desc: "После долгих и неустанных усилий угроза моей державе, каким мы её знаем, была устранена. В ходе этого процесса погибло бесчисленное количество людей, но Азерот, возможно, на какое-то время обретёт мир."
 wc_crisis_events.0100.desc_pandaria: "Правлению [crisis_leader.GetNamePossessive] пришёл конец! Пандария освобождена от оков короля Могу. Его союзники-зандалары прячутся в тени, в то время как империя их восставшего императора медленно рушится."
 wc_crisis_events.0100.desc_horde: "Усилия орочьей Орды были остановлены. Те военачальники, что пытались нарушить мир в Азероте, потерпели поражение. [crisis_leader.GetFirstName] смущённо съёживается, наблюдая, как враги Орды празднуют свою победу.\n\nОднако беженцы с Дренора всё ещё остаются, и их будущее неопределенно..."
 wc_crisis_events.0100.desc_scourge: "[crisis_leader.GetNamePossessive] власть террора подошла к концу. Многие города по всему Азероту были опустошены чумой, во многих из них всё еще жили теперь уже немёртвые граждане.\n\nНо, несмотря на эту победу, немёртвые всё ещё бродят по земле, а некоторые из них становятся самостоятельными правителями. Их присутствие навсегда останется напоминанием о жизнях, унесённых Плетью, но некоторые из них могут оказаться полезными для живых."
 wc_crisis_events.0100.desc_burning_legion: "TODO"
 wc_crisis_events.0100.desc_black_empire: "TODO"
 wc_crisis_events.0100.opt_pandaria: "Новая эра для Пандарии!"
 wc_crisis_events.0100.opt_horde: "Победа!"
 wc_crisis_events.0100.opt_scourge: "В воздухе витает запах смерти..."
 wc_crisis_events.0100.opt_burning_legion: "TODO"
 wc_crisis_events.0100.opt_black_empire: "TODO"
 wc_crisis_events.0100.opt: "Мы победили!"
  
 wc_crisis_events.0200.title: "Весь мир против меня"
 wc_crisis_events.0200.desc: "Моя миссия ещё не завершена. И всё же, продолжая сражаться, я замечаю, как формируются клубы дыма восстания.\n\nЛюди по всему Азероту распространяют слухи о моих армиях, и страх перед моим могуществом растёт. Жители этой земли начали объединяться против меня, даже те, кого вряд ли можно было бы назвать союзниками. Мои собственные подданные начали сомневаться в моей скорой победе, и я боюсь, что некоторые из них могут стать моими врагами."
 wc_crisis_events.0200.a: "Я встречусь с ними лицом к лицу."
 wc_crisis_events.0200.b: "Их царства рухнут изнутри."
 wc_crisis_events.0200.b_tooltip: "Следующие #V 5#! лет, враждебные [Concept('schemes','происки')|E] направленные против правителя в [Concept('coalition','коалиции')|E] против вас будут иметь повышенный успех."
 wc_crisis_events.0200.c: "Было бы разумно защищать то, что я завоевал."
 wc_crisis_events.0200.d: "Давление слишком велико... Я вынужден уступить."
  
 crisis_bold_modifier: "Властный нападающий"
 crisis_bold_modifier_desc: ""
  
 crisis_scheme_modifier: "Коварный захватчик"
 crisis_scheme_modifier_desc: "Шанс успеха враждебных [Concept('schemes','происков')|E] против членов [Concept('coalition','коалиции')|E]: #P +25%#!"
 crisis_scheme_modifier_tt: "[GetModifier('crisis_scheme_modifier').GetNameWithTooltip]: #P +$VALUE|0$%#!"
  
 crisis_defense_modifier: "Укреплённая держава"
 crisis_defense_modifier_desc: ""
  
 crisis_surrender_modifier: "Сдавшийся"
 crisis_surrender_modifier_desc: "Не может объявлять [Concept('war','войны')|E] или быть целью любого [Concept('casus_belli','казус белли')|E] кроме [Concept('civil_wars','гражданских войн')|E]"
  
 wc_crisis_events.0210.title: "Семена инакомыслия"
 wc_crisis_events.0210.desc: "Силы, выступающие против меня, сделали многое, чтобы ослабить мое правление, и по-прежнему стремятся действовать сообща, чтобы свергнуть меня. Однако это не меняет различий между ними, и их единство в лучшем случае хрупкое. Я могу использовать это в своих интересах.\n\n[target.GetName] кажется особо уязвимым для моего влияния. Возможно я смогу обернуть [target.GetHerHim] против [target.GetHerHis] временных союзников..."
 wc_crisis_events.0210.intrigue: "Я посею семена сомнения в [target.GetHerHis] разуме."
 wc_betrayal_success: "[target.GetSheHe|U] поддаётся убеждению"
 wc_betrayal_failure: "[target.GetSheHe|U] остаётся верным"
 betrayal_cooldown: "Вы можете попытаться убедить другого члена коалиции через #V 3#! года"
 wc_crisis_events.0210.stewardship: "Возможно, я могу предложить [target.GetHerHim] богатсва за пределами [target.GetHerHis] воображения."
 wc_crisis_events.0210.martial.victor_gets.tt: "В случае победы: [target.GetFirstName] станет вашим [Concept('vassal','вассалом')|E] и $betrayal_cooldown$"
 wc_crisis_events.0210.martial.loser_gets.tt: "Если [target.GetFirstName] выигрывает: Вы теряете [Concept('prestige','престиж')|E] и получаете [Concept('stress','стресс')|E]"
 wc_crisis_events.0210.martial: "Преданность [target.GetFirstNamePossessiveNoTooltip] будет завоёвана в бою!"
 wc_crisis_events.0210.diplomacy: "Лучше всего будет обратиться к [target.GetHerHis] #italic истинному#! чувству единства."
 wc_crisis_events.0210.nothing: "Ха! [target.GetSheHe] совсем не заботит меня."
  
 wc_crisis_events.0220.title: "Братья по оружию"
 wc_crisis_events.0220.desc: "Эта война была нелегкой, но радует, что у меня есть такие люди, как [target.GetFirstName] на моей стороне. Мы стоим вместе перед лицом невзгод, стремясь победить [coalition_target.GetName].\n\nНесмотря на бытность [target.GetCulture.GetName], мне открылась [target.GetHerHim] как совершенно [target.Custom('DescriptorPositiveStandalone')]. Наши разногласия были оставлены в стороне ради общего блага, но, возможно, этот союз мог бы продлиться и после окончания войны."
 wc_crisis_events.0220.a: "Я ценю [target.GetHerHim], но мне нужно сохранять осторожность."
 wc_crisis_events.0220.b: "[target.GetFirstNameNoTooltip] подтвердил [target.GetHerHis] ценность. Я запомню это."
 wc_crisis_events.0220.c: "Мы можем извлечь уроки у [target.GetCulture.GetCollectiveNounNoTooltip]!"
  
