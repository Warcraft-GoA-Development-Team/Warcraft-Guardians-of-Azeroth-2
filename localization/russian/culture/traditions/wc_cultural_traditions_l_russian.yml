 culture_parameter_elder_culture: "Благодаря мудрости [Concept('wc_elder_race', 'Старшей расы')|E], эта культура подвергается лишь #P 20%#! воздействию #N отрицательных событий#!."
 culture_parameter_extraplanar_origin: "Эта культура происходит из космического пространства, такого как Круговерть Пустоты или Великая Запредельная Тьма."
 culture_parameter_is_undead: "Независимо от того, служат ли они приспешниками Пылающего Легиона, присягают ли на верность самому Королю-личу или жаждут свободы, нежить сеет страх среди всего живого."
 culture_parameter_liberated_undead: "Будучи освобождённой от некромантского контроля, эта культура имеет устройство власти, сходное с обществами живых, и испытывает глубокую ненависть к Плети и Пылающему Легиону."
  
