l_russian:
 thorium_brotherhood.1.t: "Глобус Вдохновения"
 thorium_brotherhood.1.desc: "Спуск в кузницу — это путь, который я не часто совершаю. Воздух здесь жаркий и душный, и я начинаю потеть так, как это совершенно не подобает [ROOT.Char.GetTitleAsNameNoTooltip]. Тем не менее, это обязанность, которую я должен выполнить сам, чтобы продемонстрировать нашему уважаемому гостю из Братства Тория максимальное гостеприимство.\n\nПосле того как я осмотрел кузницу и другие помещения и убедился, что они соответствуют необходимым стандартам, [craftsman.GetName] кладет свою сумку на рабочий стол и обращается ко мне.\n\n\"[ROOT.Char.GetTitledFirstName], пришло время вам сделать выбор.\" Пока [craftsman.GetSheHe] говорит, [craftsman.GetFirstName] достает мягко светящийся прозрачный шар из своей сумки. \"Я представляю вам Шар Вдохновения, реликвию, передаваемую из поколения в поколение братьями Тория. Его функциональность и назначение интуитивно понятны. Просто положите руку на переднюю часть шара и представьте предмет, который вы хотите, чтобы я создал для вас. Тогда образ этого предмета появится в моем собственном сознании, а также лучший способ его создания.\"\n\nЯ никогда не слышал о такой магии, но в конце концов это имеет смысл для упрощения общения между ремесленником и заказчиком. После небольшой паузы я кладу руку на шар и думаю о..."
 thorium_brotherhood.1.a: "...оружии."
 thorium_brotherhood.1.b: "...доспехах."
 thorium_brotherhood.1.c: "...изысканном украшении."
