 more_chance_to_success_scheme_effect_tt: "Votre complot commence avec un bonus de réussite"
 horde_bloodshed.t:0 "Dévastation de [bloodshed_location.GetName] terminée"
 horde_bloodshed.d:0 "[GetPlayer.MakeScope.Var('victims_enslaved').GetValue] personnes réduites en esclavage et [GetPlayer.MakeScope.Var('victims_killed').GetValue] tuées."
 horde_bloodshed.residents:0 "Les habitants de [bloodshed_location.GetName] périront sous le courroux de la Horde, mais certains seront capturés ou parviendront à s’enfuir."
 activity.war_dangerous:0 "Il est trop dangereux de voyager ici pour le moment."