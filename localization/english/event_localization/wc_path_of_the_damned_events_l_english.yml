l_english:
 PATH_OF_THE_DAMNED_GLOSS:0 "With the last remnants of the #V Alliance#! shattered, the Path of the Damned open. It is a blood-soaked road laid out by the [GetTrait('lich_king').GetName(GetNullCharacter)] for his new champion. Its greatest test will lead him to unleash an unprecedented wave of death and destruction upon the neighboring realms, paving the way for the end times."

 wc_path_of_the_damned.0001.title:0 "Invincible"
 wc_path_of_the_damned.0001.desc:0 "No horse can bear me anymore. But now, my newfound powers allow me to see an old friend once again, dead for many years. And so, I hasten to him.\n\nWhen I arrive at his final resting place, I find the grave overgrown with grass, yet the inscription upon the stone remains clear: Invincible, my steed. I watched him grow, and I was the one forced to end his life so many years ago.\n\n#italic "The power is yours. Do with it as you will."#! whispers [frostmourne|E].\n\nI reach out toward the grave. As my necrotic energy seeps into the earth, I feel a profound connection with the bones that lie within. Invincible can be awakened."
 wc_path_of_the_damned.0001.a:0 "Rise!"

 wc_path_of_the_damned.1001.title:0 "Trudging through the Ashes"
 wc_path_of_the_damned.1001.desc:0 "As I ride Invincible across the blighted lands of [ROOT.Char.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], the world suddenly dissolves around me. The next moment, I find myself standing in the heart of a graveyard, surrounded by hooded figures.\n\n"What trickery is this?" I roar, drawing my blade.\n\nI turn, and my blood runs cold. It's [killed_malganis.GetFirstName]!\n\n"[killed_malganis.GetFirstNameNoTooltip]! I don't know how you survived, but I will—"\n\n"Calm yourself, [ROOT.Char.GetFirstNameNoTooltip]." The creature interrupts. "I am [tichondrius.GetFirstNameNoTooltip]. Like [killed_malganis.GetFirstNameNoTooltip], I am a dreadlord, but I am not your enemy. In truth, I've come to congratulate you."\n\n"
 wc_path_of_the_damned.1001.a:0 "Congratulate me?"
 wc_path_of_the_damned.1001.a.flavor:0 "[frostmourne|E]'s icy voice fills your mind: you must listen to this demon. You slowly sheath your blade, wary, yet attentive."
 wc_path_of_the_damned.1001.a.tooltip:0 "#bold You will follow the [Glossary( 'Path of the Damned', 'PATH_OF_THE_DAMNED_GLOSS' )]#!"
 wc_path_of_the_damned.1001.b:0 "I've heard enough. Die, demon!"
 wc_path_of_the_damned.1001.b.flavor:0 "A whisper urges you to heed his words, but no matter! You are the [ROOT.Char.GetTitleTierName|l], and it is through your will that you have achieved all that you have. A [ROOT.Char.GetTitleTierName|l] does not serve, [ROOT.Char.GetSheHe] rules.\n\nAs your blade strikes [tichondrius.GetFirstNameNoTooltip], [tichondrius.GetSheHe] vanishes into thin air. But the message is clear: you are no one's pawn."
 wc_path_of_the_damned.1001.b.tooltip:0 "#bold This will provoke the wrath of the [nerzhul.GetTitleAsName]#!"

 wc_path_of_the_damned.1002.title:0 "$wc_path_of_the_damned.1001.title$"
 wc_path_of_the_damned.1002.desc_beginning_son_of_the_king:0 ""By killing your own father and delivering this land to the [scourge|e], you have passed your first test. The [nerzhul.GetTitleAsNameNoTooltip] is pleased with your... enthusiasm." replied [tichondrius.GetFirstNameNoTooltip], [tichondrius.GetHerHis] lips twisting into a cruel grin. I found myself torn between suffering and exaltation.\n\n"
 wc_path_of_the_damned.1002.desc_beginning_not_son_of_the_king:0 ""By killing [killed_king_of_lordaeron.GetTitledFirstName] and delivering this land to the [scourge|e], you have passed your first test. The [nerzhul.GetTitleAsNameNoTooltip] is pleased with your... enthusiasm." replied [tichondrius.GetFirstNameNoTooltip], [tichondrius.GetHerHis] lips twisting into a cruel grin. I found myself torn between suffer and exaltation.\n\n"
 wc_path_of_the_damned.1002.desc:0 ""Yes. I've damned everyone and everything I've ever loved in [nerzhul.GetHerHis] name, and I still feel no remorse. No shame. No pity."\n\n#italic Liar#!, whispered a voice from within. But that last remnant of my humanity was a burden. One I would soon cast aside. [tichondrius.GetFirstNameNoTooltip] then gestured toward [frostmourne.GetName].\n\n"The runeblade that you carry was forged by the [nerzhul.GetTitleAsNameNoTooltip] and empowered to steal souls. Yours was the first one it claimed."\n\n"Then I'll make do without one." I replied lightly."
 wc_path_of_the_damned.1002.a:0 "What is the [nerzhul.GetTitleAsName] will?"

 wc_path_of_the_damned.1003.title:0 "[champion.GetFirstName] Refuses to Obey"
 wc_path_of_the_damned.1003.desc:0 "qewf"
 wc_path_of_the_damned.1003.a:0 "[champion.GetSheHe|U] must be shown the price of [champion.GetHerHis] defiance."
 wc_path_of_the_damned.1003.b:0 "It's not worth it."