 # Dark Rituals
 tradition_dark_rituals_name:0 "Dark Rituals"
 tradition_dark_rituals_desc:0 "The people of this culture are fiercely savage and deeply superstitious. In the darkest corners of their lands, they perform sinister blood rituals with a variety of mysterious effects."
 culture_parameter_unlock_maa_orc_berserker:0 "Can recruit [GetMaA('orc_berserker').GetName] as [men_at_arms|E]"
 culture_parameter_can_perform_a_dark_ritual:0 "The [culture_head|E] or heir should [GetDecision('sacrifice_a_body_part_decision').GetName] to receive a vision of their own death"
 not_bellicose_or_stoic_or_spiritual_desc:0 "The [culture|E] does not have the $ethos_bellicose_name$ or $ethos_stoic_name$ or $ethos_spiritual_name$ [ethos|E]"

 sacrifice_a_body_part_decision:0 "Perform a Dark Ritual"
 sacrifice_a_body_part_decision_tooltip:0 "Mutilate yourself to witness a vision of your own death"
 sacrifice_a_body_part_decision_desc:0 "Our clan's leaders have always found truth in the surety of their death. Now, I must honor that tradition and witness my own end."
 sacrifice_a_body_part_decision_confirm:0 "I will face my destiny!"
 wc_is_not_already_performing_a_dark_ritual_tt:0 "You are already performing a dark ritual"
 wc_is_head_of_culture_or_heir_trigger_tt:0 "You are the [culture_head|E] of your Culture or its [primary_heir|e]"
 wc_primary_liege_is_head_of_culture_trigger_tt: "Your [top_liege|e] is the [culture_head|E] of your Culture"

 performed_a_dark_ritual_modifier:0 "Performed a Dark Ritual"

 wc_culture_tradition_events.0002.t:0 "Dark Ritual of the [ROOT.Char.GetCulture.GetName]"
 wc_culture_tradition_events.0002.desc.chieftain:0 ""Those who claim to lead our people must first behold the fate that awaits them."\n\nEvery leader of the [ROOT.Char.GetCulture.GetName] undergoes the same sacred rite. They pay the price in blood to the spirits, abandoning their mortal perception in exchange for a blessing: a vision of their own death.\n\nI stare at the ritual dagger passed down to me, heavy and cold in my hand, its blade gleaming in the torchlight. Now that I have become the clan’s chieftain, it is my duty to perform the rite. The spirits await their due, but fear tightens my throat. What should I do ?"
 wc_culture_tradition_events.0002.desc.heir:0 ""My time has not yet come, but perhaps it is time you finally saw your own. Go, face your destiny."\n\nThe words of [ROOT.Char.GetCulture.GetCultureHead.GetFirstName] echo in my mind as I stare at the ritual dagger, heavy and cold in my hand. Among the [ROOT.Char.GetCulture.GetCollectiveNoun], those who claim power must pay the price in blood. A sacrifice to the spirits for a blessing: a vision of your own death.\n\nThe blade gleams in the torchlight. To guide my people, I must abandon my mortal perception but fear tightens my throat. What should I do?"
 wc_culture_tradition_events.0002.desc.others:0 ""Those who claim to lead our people must first behold the fate that awaits them."\n\nThus speaks the creed of the [ROOT.Char.GetCulture.GetCollectiveNoun]. I am not one of the clan's heirs, yet my strength and prestige are such within the clan that the [ROOT.Char.GetCulture.GetCultureHead.GetTitledFirstName] has granted me the honor of performing the rite.\n\nThe ritual dagger now rests in my hand, heavy and cold. It is up to me to pay the spirits in blood and abandon my mortal perception in exchange for a blessing: a vision of my own death. The blade gleams in the torchlight, and fear tightens my throat. What should I do ?"
 wc_culture_tradition_events.0002.a:0 "So be it."
 wc_culture_tradition_events.0002.a_tt:0 "It is time. You will go to the ritual site and sacrifice a part of yourself to earn this vision, in honor of your clan."
 wc_culture_tradition_events.0002.b:0 "I cannot do this..."
 wc_culture_tradition_events.0002.b_tt:0 "You are not yet ready. The pain would be too great, and you would lose part of yourself. You refuse, for now."

 wc_culture_tradition_events.0003.t:0 "Vision of My Death"
 wc_culture_tradition_events.0003.t.no_vision:0 "The Spirits Reject Me"
 wc_culture_tradition_events.0002.desc.sac_eye:0 "I kneel at the edge of the basin, dagger in hand. Fear has left me now. In one motion, I raise it and drive it into my eye. Pain floods me, but I tear out my eye and place it in the water.\n\n"
 wc_culture_tradition_events.0002.desc.sac_blind:0 "I kneel at the edge of the basin, dagger in hand. Fear has left me now. I have only one eye left, and that’s why the rite demands even more: the last fragment of my perception.\nI raise the dagger and drive it into my eye. Pain floods me but, blindly, I tear out my last eye and place it in the water.\n\n"
 wc_culture_tradition_events.0002.desc.sac_leg:0 "I kneel at the edge of the basin, dagger in hand. Fear has left me now but doubt sets in. My perception is gone, so what do the spirits truly want?\nThe realization strikes me like a fact when I notice that the dagger against my ankle. In one motion, I cut off my foot. Pain floods me for long minutes, before I place it in the water.\n\n"
 wc_culture_tradition_events.0002.desc.maimed:0 "My mutilated body kneels at the edge of the basin, dagger in hand. I have already lost so much flesh, yet the spirits demand more. So I surrender my will to them. The blade falls without my command, and pain floods as a part of me joins the waters.\n\n"
 wc_culture_tradition_events.0002.desc.strong_vision:0 "And suddenly, my vision blurs. I had expected to see only the final days of my existence, but I see much more. Images race before me at great speed, and yet I understand them all. I witness every moment tied to me, near or distant. Then a figure appears, its determination unwavering.\nAnd when death finally comes for me, I feel no fear. I welcome it.\n\n"
 wc_culture_tradition_events.0002.desc.normal_vision:0 "Then my vision blurs. Time quickens, and the final moments of my life unfold before me. I feel my body more vividly than ever, yet my limbs no longer obey me. My breathing grows ragged, an unfamiliar scent fills my nose, and then, with one final beat… my heart stops. But I do not fear what I see: I welcome it.\n\n"
 wc_culture_tradition_events.0002.desc.weak_vision:0 "What I see is not clear. Shapes and colors bleed into one another until they make a formless, incoherent mass. Shapes emerge before me, and I sense my time is approaching. My breathing grows difficult. I feel my body more intensely, yet my muscles cease to obey me.\nAgony pierces me like a thousand blades, and I feel so alone.\n\n"
 wc_culture_tradition_events.0002.desc.no_vision:0 "Nothing but darkness all around me. Total emptiness. Nothing, no sensation at all. I float alone in a silent eternity. Why? Shouldn't I be witnessing my own death? My existence stretches endlessly, and anger rises as I realize I will see nothing. Despair follows as I remain trapped here.\nWhy?! What have I done to deserve this?!\nAnd as the questions tear through my mind, I am torn from this void in an instant.\n\n"
 wc_culture_tradition_events.0002.desc.dying_no_vision:0 "Suddenly, I'm back in reality. The vision I might have seen is what is going to happen to me now. My blood pours into the basin freely. Every breath tears at my chest, my limbs refuse to obey and I grow weak.\nSo weak."
 wc_culture_tradition_events.0002.desc.dying:0 "Suddenly, I'm back in reality. This future, I won't be a part of it. My blood pours into the basin freely. Every breath tears at my chest, my limbs refuse to obey and I grow weak.\nSo weak."
 wc_culture_tradition_events.0002.desc.brutally_mauled:0 "Suddenly, I'm back in reality. Agony strikes me as I lie in a pool of my blood. My last strength is spent forcing myself back to my feet.\nThe hour of my death may be closer than I think."
 wc_culture_tradition_events.0002.desc.severely_injured:0 "Suddenly, I'm back in reality. Pain strikes me as my blood pours heavily from my wound. I rise weakly...\nThe coming days will be difficult."
 wc_culture_tradition_events.0002.desc.wounded:0 "Suddenly, I'm back in reality. Pain shoots through me, and my wound is still open. My blood flows, but it is not a wound that will kill me. I know I will suffer, but I will heal. Always."
 wc_culture_tradition_events.0002.desc.no_injury:0 "Suddenly, I'm back in reality. The world is silent. I feel nothing. No pain. Beneath my fingers, my wounds have already closed and the blood has dried on my skin. I rise. Everything is still, and the spirits have fallen silent once more."
 wc_culture_tradition_events.0003.a:0 "It is done."
 wc_culture_tradition_events.0003.a.dying:0 "This... is the death.. I saw..."
 wc_culture_tradition_events.0003.a.dying_no_vision:0 "Wh... Why?..."
 wc_culture_tradition_events.0003.a.no_vision:0 "What I have done to deserve this?"