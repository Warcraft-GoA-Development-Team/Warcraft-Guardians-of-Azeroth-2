l_russian:
 wc_magic_spell_events.0001.title: "Ледяная глыба"
 wc_magic_spell_events.0001.desc: "Воздух потрескивает от враждебной магии: заклинание мчится к вам. В мгновение ока ваш ледяной щит активируется, сотворяя Ледяную глыбу, и защитный слой льда окутывает вас.\n\nТеперь обездвиженный и неспособный действовать, вы наблюдаете, как смертоносное заклинание разбивается о вашу ледяную преграду, не причиняя вреда. В безопасности внутри своей ледяной брони вы ждёте, пока минует опасность."
 wc_magic_spell_events.0001.a: "Было близко..."

 wc_magic_spell_events.0100.title: "Делясь Щитом"
 wc_magic_spell_events.0100.desc: "Вы держите Огненный Щит наготове, размышляя, кому он нужнее всего. Выбор критичен, и каждая секунда на счету. Вы взвешиваете варианты, зная, что заклинание может всё изменить.\n\nГлубоко вздохнув, вы готовитесь к сотворению, а разум лихорадочно ищет верное решение."
 wc_magic_spell_events.0100.a: "Возможно, один из моих [friends|E]"
 wc_magic_spell_events.0100.b: "Кому-то из моих [best_friends|E] нужна защита"
 wc_magic_spell_events.0100.c: "Возможно, [lover|E]..."
 wc_magic_spell_events.0100.d: "[primary_spouse.GetFirstName] не помешает щит"
 wc_magic_spell_events.1011.title: "Делясь Щитом: друзья"
 wc_magic_spell_events.1011.desc: "$wc_magic_spell_events.0100.desc$"
 wc_magic_spell_events.1011.a: "[ROOT.Var('friend1').Char.GetFirstName] нуждается в нём больше всех"
 wc_magic_spell_events.1011.b: "Быть может, это убережёт [ROOT.Var('friend2').Char.GetFirstName]?"
 wc_magic_spell_events.1011.c: "Нужна ли [ROOT.Var('friend3').Char.GetFirstName] дополнительная защита?"
 wc_magic_spell_events.1011.nvm: "Возможно, кто-то другой..."
 wc_magic_spell_events.1021.title: "Делясь Щитом: лучшие друзья"
 wc_magic_spell_events.1021.desc: "$wc_magic_spell_events.0100.desc$"
 wc_magic_spell_events.1021.a: "Будет ли [ROOT.Var('best_friend1').Char.GetFirstName] в безопасности без щита?"
 wc_magic_spell_events.1021.b: "С этим [ROOT.Var('best_friend2').Char.GetFirstName] будет достаточно защищён"
 wc_magic_spell_events.1021.c: "Пойдёт ли [ROOT.Var('best_friend3').Char.GetFirstName] на пользу дополнительная защита?"
 wc_magic_spell_events.1021.nvm: "$wc_magic_spell_events.1011.nvm$"
 wc_magic_spell_events.1031.title: "Делясь Щитом: возлюбленные"
 wc_magic_spell_events.1031.desc: "$wc_magic_spell_events.0100.desc$"
 wc_magic_spell_events.1031.a: "[ROOT.Var('lover1').Char.GetFirstName] нуждается в дополнительной защите"
 wc_magic_spell_events.1031.b: "Необходим ли щит [ROOT.Var('lover2').Char.GetFirstName]?"
 wc_magic_spell_events.1031.c: "Достаточно ли защищён [ROOT.Var('lover3').Char.GetFirstName]?"
 wc_magic_spell_events.1031.nvm: "$wc_magic_spell_events.1011.nvm$"
 wc_magic_spell_events.0200.title: "Сотворение угощения"
 wc_magic_spell_events.0200.desc: "Вы начинаете сотворение, энергия клубится вокруг ваших пальцев, и вы размышляете над выбором. Сотворить еду, чтобы восстановить здоровье, или призвать напиток, чтобы вернуть магическую силу? Решение висит в воздухе, каждый вариант сулит свой путь к восстановлению. Ваша магия гудит, ожидая указаний."
 wc_magic_spell_events.0200.a: "Сгодится еда."
 wc_magic_spell_events.0200.a.tt: "Цели получат [GetModifier('wc_conjure_food_modifier').GetNameWithTooltip], когда сотворение заклинания завершится."
 wc_magic_spell_events.0200.b: "Напиток звучит неплохо."
 wc_magic_spell_events.0200.b.tt: "Цели получат [GetModifier('wc_conjure_drink_modifier').GetNameWithTooltip], когда сотворение заклинания завершится."

 wc_magic_spell_events.0300.title: "Сотворение угощения"
 wc_magic_spell_events.0300.desc: "Пока вы плетёте заклинание, тайная энергия гудит у ваших пальцев, и вы замираете, взвешивая варианты. Сотворить питательную еду, чтобы восстановить здоровье всех, или же могущественные напитки, чтобы пополнить их магические запасы? Влияние пира зависит от вашего выбора: каждый вариант дарует свою силу."
 wc_magic_spell_events.0300.a: "Сгодится еда."
 wc_magic_spell_events.0300.a.tt: "Все гости получат [GetModifier('wc_conjure_food_modifier').GetNameWithTooltip]."
 wc_magic_spell_events.0300.b: "Напиток звучит неплохо."
 wc_magic_spell_events.0300.b.tt: "Все гости получат [GetModifier('wc_conjure_drink_modifier').GetNameWithTooltip]."

 wc_magic_spell_events.1000.title: "Спасённый Светом"
 wc_magic_spell_events.1000.desc: "«Иди сюда, дитя моё», — шепчет в моём разуме голос. «Ты ещё не готов покинуть этот мир».\n\nЯ стою на пороге смерти, вглядываясь в [ROOT.Char.GetFaith.NegativeAfterLife], и вдруг меня вырывает ввысь, к небесам."
 wc_magic_spell_events.1000.desc.caster_alive: "\n\nЗа гранью я вижу лицо [salvation_caster.GetFirstNamePossessive], зная в глубине души, что [salvation_caster.GetSheHe] спас меня от порога смерти."
 wc_magic_spell_events.1000.desc.caster_dead: "\n\nЗа гранью я вижу тень [salvation_caster.GetFirstName], зная, что [salvation_caster.GetSheHe] спас меня от порога смерти, хотя сам [salvation_caster.GetHerHim] уже перешёл в мир иной."
 wc_magic_spell_events.1000.desc.death_childbirth: "Последнее, что я помню, — мучительная боль, когда моего ребёнка вырывали из моего чрева, а затем всё погрузилось в полную тьму."
 wc_magic_spell_events.1000.desc.death_duel: "Последнее, что я помню, — холодная сталь клинка соперника, пронзающая моё сердце, леденеющая кровь и крики зевак."
 wc_magic_spell_events.1000.desc.death_execution: "Я до сих пор вижу землю под коленями, острое лезвие топора палача и женщин, закрывающих глаза своих детей: моя смерть должна была стать уроком для всех."
 wc_magic_spell_events.1000.desc.death_dungeon: "На мгновение я ощупываю свои запястья, проверяя, на месте ли цепи, но их нет. Мой желудок больше не урчит, и крысы больше не грызут мои пальцы, но я так долго жил в этих условиях, что не могу избавиться от чувства, будто я всё ещё там и должен быть мёртв."
 wc_magic_spell_events.1000.desc.death_battle: "Поле боя давно скрылось из виду, но крики умирающих и запах крови всё ещё преследуют мой разум. Я помню, как меня растоптали и сразили враги, но всё, что я чувствую, — тепло."
 wc_magic_spell_events.1000.desc.death_stress: "Я вспоминаю тот миг, когда почувствовал, как учащается сердце, дыхание сбивается, а разум затуманивается. Я рухнул на землю, и даже в беспомощном состоянии тревоги мира всё ещё терзали меня."
 wc_magic_spell_events.1000.desc.death_illness: "Я помню боль, жар, кашель и пот. Я помню слова целителя, слёзы семьи и страх детей. Я помню тьму, холод и тишину."
 wc_magic_spell_events.1000.desc.death_none: "Я не помню ничего, лишь ощущение, как моё тело медленно угасает, и тьму, что окутала меня."
 wc_magic_spell_events.1000.desc.middle: "Ощутив тепло Света на себе, я понимаю: я не перешёл в мир иной, но произошло нечто иное."
 wc_magic_spell_events.1000.desc.light_idolised: "Будучи верующим в Свет, я спасён его божественной силой по воле [salvation_caster.GetFirstNameNoTooltip]."
 wc_magic_spell_events.1000.desc.light_ok: "Хоть я и почитал Свет, теперь я ещё более впечатлён его силой — и силой [salvation_caster.GetFirstNameNoTooltip]."
 wc_magic_spell_events.1000.desc.nonbeliever: "Сила, что спасает меня, мне незнакома, но я всё равно благодарен за неё."
 wc_magic_spell_events.1000.desc.bad: "Презирая всё, что связано со Светом, я вынужден признать, что спасён его силой, которой владеет [salvation_caster.GetFirstNameNoTooltip]."
 wc_magic_spell_events.1000.desc.none: "Хотя я не питаю особой любви к Свету, я спасён его силой, которой владеет [salvation_caster.GetFirstNameNoTooltip]."
 wc_magic_spell_events.1000.a: "Я победил смерть."
 wc_magic_spell_events.1000.b: "Мне было суждено уйти."

 wc_magic_spell_events.1001.desc: "Мне является видение: [saved_character.GetFirstName] входит в [ROOT.Char.GetFaith.NegativeAfterLife], с трудом совершая [saved_character.GetHerHis] спуск. Неужели вся эта работа была напрасной и моя магия вовсе не спасла [saved_character.GetHerHim]?\n\nВнезапно меня переносит в другое видение: [saved_character.GetFirstName] вырывают из тьмы, словно могучий луч Света. [saved_character.GetSheHe] возвращается в мир живых — по моей воле..."
 wc_magic_spell_events.1001.a: "[saved_character.GetFirstName] будет жить."

 wc_magic_spell_events.1002.desc: "Моя попытка оборвать жизнь [saved_character.GetNamePossessive] не просто провалилась — она провалилась с треском. В самый момент задуманной гибели [saved_character.GetHerHis] [saved_character.GetSheHe] внезапно возвращается в мир живых, «спасённый» могучим лучом Света. Мне остаётся лишь гадать: я не так могущественен, как думал, или же [saved_character.GetFirstName] просто не пришло время умирать."
 wc_magic_spell_events.1002.a: "Жизни... не в моей власти отнимать."

 wc_magic_spell_events.1003.desc: "Узнав о смерти [saved_character.GetNamePossessive], я гадаю: неужели моей магии не хватило, чтобы спасти [saved_character.GetHerHim]?\n\nМне остаётся лишь надеяться, что [saved_character.GetFirstName] не в [ROOT.Char.GetFaith.NegativeAfterLife], а в лучшем месте.\n\nБыло ли это действительно [saved_character.GetHerHis] время? Решил ли [saved_character.GetSheHe] уйти сам?"
 wc_magic_spell_events.1003.a: "Я потерпел неудачу."

 wc_magic_spell_events.1004.desc: "Я пробуждаюсь, и что-то... изменилось.\n\nНекротический смрад, некогда окутывавший меня, исчез, и я ощущаю тепло, которого не чувствовал очень давно. Я больше не скован тьмой и волен странствовать по миру... снова как живое существо. [salvation_caster.GetFirstName] вернул меня...\n\nНо здесь ли мне место?"
 wc_magic_spell_events.1004.a: "Я освобождён."
 wc_magic_spell_events.1004.a_sus: "Моё ли место среди живых?"

 wc_magic_spell_events.1005.desc: "Я застываю в изумлении, представляя, как тело [saved_character.GetNamePossessive] преображается: [saved_character.GetHerHis] плоть вновь наполняется кровью и жизнью, а смрад смерти отступает.\n\n[saved_character.GetFirstName] спасён из объятий нежити, и мне остаётся гадать: моя ли магия спасла [saved_character.GetHerHim], или же это было нечто иное."
 wc_magic_spell_events.1005.a: "[saved_character.GetFirstName] освобождён."

 wc_magic_spell_events.2000.title: "Предводитель Бездны"
 wc_magic_spell_events.2000.desc: "Моя магия сработала! [void_leader.GetName] склоняется передо мной, готовый служить в моих рядах. [void_leader.GetSheHe|U] — именно тот искусный полководец, что был мне нужен, и прекрасно разбирается в магии Тьмы..."
 wc_magic_spell_events.2000.desc_caster: "Ко мне входит [void_leader.GetWomanMan], говоря, что [void_leader.GetSheHe] призван ко мне по воле [void_leader_caster.GetName].\n\n[void_leader.GetSheHe|U] объясняет [void_leader.GetHerHis] склонность к магии Тьмы и то, как [void_leader.GetSheHe] может быть мне полезен..."
 wc_magic_spell_events.2000.a: "Добро пожаловать, [void_leader.GetFirstNameNoTooltip]!"
 wc_magic_spell_events.2000.b: "Тебе не место в моей державе..."
 void_leader_rejected: "Предводитель Бездны отвергнут"
 void_leader_rejected_desc: "[void_recipient.GetName] принял решение не принимать [void_recipient.GetHerHis] призванного Предводителя Бездны, [void_leader.GetName]."
 void_leader_accepted: "Предводитель Бездны принят"
 void_leader_accepted_desc: "[void_recipient.GetName] принял [void_recipient.GetHerHis] призванного Предводителя Бездны, [void_leader.GetName]."

 wc_magic_spell_events.2100.desc: "Увы, время службы моего предводителя Бездны, [void_leader.GetName], подошло к концу. [void_leader.GetSheHe|U] теперь волен вернуться в бескрайнюю Бездну и, быть может, однажды снова вернуться в Азерот."
 wc_magic_spell_events.2100.a: "Прощай, [void_leader.GetFirstName]."

 wc_magic_spell_events.2200.title: "Рождённый Бездной"
 wc_magic_spell_events.2200.desc: "Энергия Бездны взывает ко мне изнутри, и я слышу крики [voidborne_person.GetFirstNamePossessive], когда [voidborne_person.GetSheHe] втягивается в Круговерть, дарующую мне силу. В каком-то смысле [voidborne_person.GetSheHe] теперь часть меня, и всё же я вытягиваю [voidborne_person.GetHerHis] сущность, чтобы питать свою магию."
 wc_magic_spell_events.2201.opt: "Во тьму [voidborne_person.GetSheHe] отправляется."

 wc_magic_spell_events.2202.desc: "Меня переносит на тёмный план бытия, где я вижу лицо [voidborne_tormentor.GetFirstNamePossessive], искажённое тенями. [voidborne_tormentor.GetSheHe|U] шепчет мне, и кажется, что [voidborne_tormentor.GetHerHis] голос доносится со всех сторон.\n\nЯ впадаю в транс, и, очнувшись, обнаруживаю себя далеко от дома. Надо мной — море бескрайних звёзд, щедрая Бездна, ждущая исследования. Но увы, я парализован, не в силах двинуться, и могу лишь наблюдать, как Бездна поглощает меня. Хотя я знаю, что не встретил смерть, это чувство почти дразнит.\n\nПередо мной возникает видение [voidborne_tormentor.GetFirstName], и [voidborne_tormentor.GetSheHe] говорит мне, что даровал мне подарок и что [voidborne_tormentor.GetSheHe] уничтожает саму мою сущность ради силы."
 wc_magic_spell_events.2202.a: "Ты ещё пожалеешь об этом дне, [voidborne_tormentor.GetFirstName]."
 wc_magic_spell_events.2202.b: "Проклятие тебе, [voidborne_tormentor.GetFirstName]!"
 wc_magic_spell_events.2202.c: "Эта темница не удержит меня!"
 wc_magic_spell_events.2202.c.tt: "Вы пытаетесь сбежать раньше времени."
 wc_magic_spell_events.2202.c.a: "Вам не удаётся освободиться."
 wc_magic_spell_events.2202.c.b: "Ваша попытка немного помогает"
 wc_magic_spell_events.2202.c.b.tt: "У вас есть 75% шанс сбежать через #V [GetPlayer.MakeScope.ScriptValue('wc_voidborne_duration_value')]#! дней."
 wc_magic_spell_events.2202.c.d: "Вы освобождаетесь!"
 wc_magic_spell_events.2202.c.d.tt: "Вы сбегаете из Бездны."
 wc_magic_spell_events.2202.tt: "У вас есть 50% шанс сбежать через #V [GetPlayer.MakeScope.ScriptValue('wc_voidborne_duration_value')]#! дней."

 wc_magic_spell_events.2203.title: "Темница Бездны"
 wc_magic_spell_events.2203.desc_return_dead: "Мой мучитель погиб! Я волен вернуться в мир живых, но мне остаётся гадать, свободен ли я по-настоящему от хватки Бездны."
 wc_magic_spell_events.2203.desc_return: "Внезапно я чувствую, как хватка Бездны ослабевает, и я волен вернуться в мир живых."
 wc_magic_spell_events.2203.desc_stuck: "Несмотря на все мои усилия и бесконечные страдания, я всё ещё в ловушке Бездны и не могу выбраться."
 wc_magic_spell_events.2203.a: "Проклятие!"
 wc_magic_spell_events.2203.b: "Я свободен!"
 wc_magic_spell_events.2204.title: "Больше не в заточении"
 wc_magic_spell_events.2204.desc: "Мой узник сбежал из Бездны, и я боюсь, что он может искать мести по возвращении..."

 wc_magic_spell_events.2400.title: "Цикл начинается"
 wc_magic_spell_events.2400.desc: "Бездна взывает ко мне, и я чувствую, как тьма во мне растёт. Меня тянет к Бездне, и я ощущаю зов Круговерти.\n\nЯ взираю на свою державу и свой народ, надеясь, что они хорошо послужат мне в этом цикле."
 wc_magic_spell_events.2400.opt: "..."

 wc_magic_spell_events.2401.desc: "Мой господин, [master.GetName], начал [Concept('Ascension Cycle', 'wc_spell_ascension')|E], и я обязан служить [master.GetHerHim] в это время.\n\nЗа каждое [Concept('wc_ascension_action', 'Ascension Action')|E], которое я совершу, [master.GetSheHe] становится всё сильнее.\n\nЕсли я хорошо послужу [master.GetHerHim], меня могут наградить..."
 wc_magic_spell_events.2401.opt: "Посмотрим, что сулит будущее."

 wc_magic_spell_events.2410.title: "Цикл продолжается"
 wc_magic_spell_events.2410.desc_first: "Мой первый вознесённый! Я почти дрожу от волнения, мечтая о силе, что обрету по завершении цикла. "
 wc_magic_spell_events.2410.desc: "[ascended.GetName] совершил достаточно [Concept('wc_ascension_action', 'actions')|E], чтобы принять мою силу! Чем же мне наградить [ascended.GetHerHim]?"
 wc_magic_spell_events.2410: "Дар вознесённого"
 wc_magic_spell_events.2410.a: "Магическая сила!"
 wc_magic_spell_events.2410.b: "Физическая сила!"
 wc_magic_spell_events.2410.c: "Силой Бездны!"
 wc_magic_spell_events.2410.d: "С честью!"
 wc_magic_spell_events.2410.e: "Средствами!"

 wc_magic_spell_events.2420.title: "Цикл завершён"
 wc_magic_spell_events.2420.desc: "Наконец мои поиски силы завершены. Мой народ хорошо мне послужил.\n\nМой самый могущественный вознесённый, [PlayerGetVar('top_ascendant').Char.GetName], послужил мне лучше всех и будет достойно награждён. Всего я вознёс [PlayerGetVar('wc_ascends').GetValue|V0] своих подданных, надеюсь, во благо моей державы..."
 wc_magic_spell_events.2420.opt: "До следующего цикла..."
 wc_magic_spell_events.2420: "Высший вознесённый"

 please_old_ones_effect.tt: "#bold Вы ублажаете древних, и в будущем сопротивляться им будет легче...#!"
 displease_old_ones_effect_tt: "#bold Чем сильнее вы сопротивляетесь, тем труднее становится...#!"

 wc_magic_spell_events.2600.title: "Шёпот: Зловещая просьба"
 wc_magic_spell_events.2600.desc: "Я пробуждаюсь ото сна и вновь оказываюсь разумом посреди Бездны. Шёпот вернулся, и он сильнее, чем когда-либо. Он велит мне сделать кое-что... кое-что ужасное.\n\nЯ вижу лицо своего [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('whispers_target'))], [whispers_target.GetFirstName], а затем...\n\n[whispers_target.GetHerHis|U] гибель."

 wc_magic_spell_events.2600.report: "Шёпот: Зловещая просьба"
 wc_magic_spell_events.2600.report_tt: "Шёпот побудил вашу жертву убить [victim.GetHerHis] собственных родных..."
 wc_magic_spell_events.2600.a: "Как пожелаешь, древний..."
 wc_magic_spell_events.2600.b: "Нет, это моя кровь и плоть!"
 wc_magic_spell_events.2600.c: "[whispers_target.GetSheHe|U] погибнет!"
 wc_magic_spell_events.2600.d: "Я некромант, и смерть [whispers_target.GetHerHis] — лишь начало..."
 wc_magic_spell_events_whispers_success: "Вам удаётся одолеть шёпот"
 wc_magic_spell_events_whispers_failure: "Шёпот одолевает вас"

 wc_magic_spell_events.2610.title: "Шёпот: Чарующее прикосновение"
 wc_magic_spell_events.2610.desc: "Я оказываюсь в объятиях [seducer.GetFirstNamePossessive]. [seducer.GetSheHe|U] шепчет мне сладкие пустяки на ухо, и я тону в [seducer.GetHerHis] объятиях.\n\nНо [seducer.GetHerHis] прикосновение кажется чуждым, становится холоднее и темнее. Я понимаю, что [seducer.GetSheHe] не тот, кем кажется, и что [seducer.GetSheHe] здесь не для того, чтобы любить меня, а чтобы поглотить меня... целиком.\n\nВ глубине души я приветствую его прикосновение, но знаю, что не должен поддаваться его тёмным желаниям."
 wc_magic_spell_events.2610.a: "Наша любовь запретна..."
 wc_magic_spell_events.2610.b: "Мне нужно твоё прикосновение!"
 wc_magic_spell_events.2610.report: "Шёпот: Чарующее прикосновение"
 wc_magic_spell_events.2610.report_tt: "Шёпот побудил вашу жертву влюбиться в тёмного соблазнителя..."

 wc_magic_spell_events.2620.title: "Шёпот: Обвинённый"
 wc_magic_spell_events.2620.desc: "[courtier.GetFirstName] в последнее время ведёт себя подозрительнее обычного: всякий раз, когда я бросаю взгляд на [courtier.GetHerHim], [courtier.GetSheHe] отводит глаза. От [courtier.GetHerHim] исходит тёмная энергия, и [courtier.GetSheHe], кажется, что-то скрывает.\n\nШёпот твердит мне, что [courtier.GetFirstName] — предатель и что с ним нужно разобраться. Но действительно ли [courtier.GetSheHe] виновен — вместе со всей своей семьёй?"
 wc_magic_spell_events.2620.a: "Семья [courtier.GetFirstNamePossessiveNoTooltip] должна заплатить..."
 wc_magic_spell_events.2620.b: "Я не стану обвинять [courtier.GetFirstNameNoTooltip]!"
 wc_magic_spell_events.2620.report: "Шёпот: Обвинённый"
 wc_magic_spell_events.2620.report_tt: "Шёпот побудил вашу жертву обвинить невинного придворного..."

 wc_magic_spell_events.2630.title: "Шёпот: В пылу ссоры"
 wc_magic_spell_events.2630.desc: "Я в разгаре жаркой перепалки с [courtier.GetFirstName], и шёпот возвращается. Я стараюсь не поддаваться гневу, но [courtier.GetFirstNamePossessiveNoTooltip] явно перешёл все границы.\n\nШёпот велит мне ударить — и я бью.\n\nОщущение крови [courtier.GetHerHis] на моих руках опьяняет, но я знаю, что совершил нечто ужасное."
 wc_magic_spell_events.2630.a: "Это должно продолжаться..."
 wc_magic_spell_events.2630.b: "Я должен быть наказан..."
 wc_magic_spell_events.2630.c: "[courtier.GetFirstNameNoTooltip] не заслуживает этого!"
 wc_magic_spell_events.2630.report: "Шёпот: В пылу ссоры"
 wc_magic_spell_events.2630.report_tt: "Шёпот побудил вашу жертву ударить своего близкого человека"
 wc_magic_spell_events.2630.report_2_tt: "Шёпот побудил вашу жертву навредить себе"

 wc_magic_spell_events.2640.title: "Шёпот: Подозрительная безделушка"
 wc_magic_spell_events.2640.desc: "Этот шёпот мучил меня слишком долго, и я отчаянно хочу от него избавиться. Я смотрю на [destroyed_artifact.GetName] и гадаю, не в нём ли источник моих мучений."
 wc_magic_spell_events.2640.report: "Шёпот: Подозрительная безделушка"
 wc_magic_spell_events.2640.a: "Я должен уничтожить его..."
 wc_magic_spell_events.2640.report_tt: "Шёпот побудил вашу жертву уничтожить одну из своих вещей"
 wc_magic_spell_events.2640.success: "Шёпот затихает"
 wc_magic_spell_events.2640.failure: "Ваша теория неверна"
 wc_magic_spell_events.2640.b: "Шёпот или нет, я не могу уничтожить свою вещь..."
 wc_magic_spell_events.2640.report_2_tt: "Шёпот принёс вашей жертве стресс"

 wc_magic_spell_events.2650.title: "Шёпот: Цена рассудка"
 wc_magic_spell_events.2650.report: "Шёпот: Цена рассудка"
 wc_magic_spell_events.2650.desc: "Шёпот усилился, и я на пределе. Я знаю, что должен что-то сделать, но не уверен, что именно.\n\nПередо мной стоит горшок золота, мерцающий в свете. Шёпот говорит, что, если я пожертвую им, они оставят меня в покое. Но потерять золото — значит потерять состояние..."
 wc_magic_spell_events.2650.a: "Моё богатство — ключ к моему рассудку..."
 wc_magic_spell_events.2650.b: "Я не обязан отдавать всё..."
 wc_magic_spell_events.2650.report_tt: "Шёпот побудил вашу жертву пожертвовать своим богатством"
 wc_magic_spell_events.2660.disease: "#n;bold [victim.GetShortUIName|U] [Select_CString( victim.IsLocalPlayer, 'подхватываете', 'подхватывает' )] смертельную заразную болезнь.#!"

 wc_magic_spell_events.2660.title: "Шёпот: Медленное пламя"
 wc_magic_spell_events.2660.report: "Шёпот: Медленное пламя"
 wc_magic_spell_events.2660.desc: "Мой желудок скручивает, и я понимаю, что отравлен. Шёпот говорит, что я сам в этом виноват и должен страдать за свои грехи.\n\nЯ знаю, что должен действовать быстро, иначе яд поглотит меня."
 wc_magic_spell_events.2660.a: "Оно должно поглотить меня..."
 wc_magic_spell_events.2660.b: "Я должен найти противоядие!"
 wc_magic_spell_events.2660.report_tt: "Шёпот побудил вашу жертву отравить себя"

 wc_magic_spell_events.2798.title: "Шёпот: Финальный акт"
 wc_magic_spell_events.2798.desc: "Шёпот начал затихать, и меня охватывает чувство дурного предчувствия. Мне предстоит последний, долгий, мучительный сон, после которого, я знаю, шёпот исчезнет навсегда."
 wc_magic_spell_events.2798.a: "..."
 wc_magic_spell_events.2798.peace: "Шёпот завершается мирно"
 wc_magic_spell_events.2798.peace_tormentor: "Шёпот завершается мирно для вашей жертвы"
 wc_magic_spell_events.2798.death: "Шёпот поглощает вашу сущность"
 wc_magic_spell_events.2798.insane: "Шёпот сводит вас с ума"
 wc_magic_spell_events.2798.insane_tormentor: "Шёпот сводит вашу жертву с ума"
 wc_magic_spell_events.2798.stupid: "Шёпот притупляет ваш разум"
 wc_magic_spell_events.2798.stupid_tormentor: "Шёпот притупляет разум вашей жертвы"
 wc_magic_spell_events.2798.religion: "Вы следуете за Древними богами"
 wc_magic_spell_events.2798.religion_tormentor: "Ваша жертва следует за Древними богами"
 wc_magic_spell_events.2798.magic: "Шёпот калечит вашу магию"
 wc_magic_spell_events.2798.magic_tormentor: "Шёпот калечит магию вашей жертвы"

 wc_magic_spell_events.2797.title: "Шёпот Древних"
 wc_magic_spell_events.2797.desc: "Моё тело и разум ощущаются... не так. Я вижу призраков Древних богов и их прислужников, шепчущих мне на языке, которого я не понимаю. Я чувствую влечение к Бездне и знаю, что должен сопротивляться, иначе буду поглощён.\n\nВ одном из видений я вижу, что [tormentor.GetFirstName] — тот, кто наложил на меня этот недуг."
 wc_magic_spell_events.2797.a: "Я буду сопротивляться шёпоту..."

 wc_magic_spell_events.6001.t: "Приём Воды Жизни"

 # Предложение 1 - В Сон
 wc_magic_spell_events.6001.desc.first: "Резкий, горький вкус — и вода жизни стекает по горлу. Тьма застилает глаза. Капля падает в необъятную гладь воды, связующую всю жизнь и магию. Ты — эта капля, и капля — это ты.\n\n"
 wc_magic_spell_events.6001.desc.subsequent: "Ты уже привык к горькому вкусу воды жизни, смело глотая зелье. Как всегда, тьма застилает глаза, и капля, что есть ты, вливается в необъятную гладь воды, связующую всю жизнь и магию.\n\n"

 # Предложение 2 - Вкус сна
 wc_magic_spell_events.6001.desc.ambitious: "Затерявшийся в огромной толпе ребёнок, с трудом пробивающий [ROOT.Char.getHerHis] путь. [ROOT.Char.GetSheHe] теряет [ROOT.Char.getHerHis] равновесие, и толпа топчет его...\n\n"
 wc_magic_spell_events.6001.desc.arbitrary: "Две руки, чьи владельцы скрыты во тьме, давят на противоположные чаши весов. Пальцы и запястья напрягаются, но ни одна чаша не перевешивает, и весы остаются в равновесии...\n\n"
 wc_magic_spell_events.6001.desc.arrogant: "Кровь струится по лбу, сочась из-под усыпанной самоцветами короны. С каждым мгновением она давит сильнее, и под потоками начинают проступать признаки возраста...\n\n"
 wc_magic_spell_events.6001.desc.brave: "Герб [ROOT.Char.GetDynastyHouseNameNoTooltip] с грохотом падает на пол и раскалывается. Его осколки тонут в растекающейся луже крови...\n\n"
 wc_magic_spell_events.6001.desc.calm: "Луна отражается в безбрежном и безмятежном море. Медленно снизу луну заливает красный цвет. Краснеющая луна поднимается над водой, и её багровое отражение расползается по взбудораженному океану, пока тот не превращается в бурлящий поток крови...\n\n"
 wc_magic_spell_events.6001.desc.callous: "Рука тянется к лохматой собаке, протягивая кусок мяса. Собака осторожно обнюхивает мясо, затем руку; разинув пасть, она смыкает челюсти на запястье, проливая кровь...\n\n"
 wc_magic_spell_events.6001.desc.chaste: "Мягкая бархатная ткань искривляется, словно её тянут, обнажая изящную кружевную кромку. Кромка скользит по мягкой и податливой плоти, намекая на стройную грудь или торс...\n\n"
 wc_magic_spell_events.6001.desc.content: "Открывают тёмный чулан, и в нём видны марионетки, свисающие с колышков. Короли, королевы, лорды, леди и придворные — все безжизненно висят в полумраке...\n\n"
 wc_magic_spell_events.6001.desc.compassionate: "Истощённый ребёнок в лохмотьях, искусанный блохами, сворачивает [ROOT.Char.getHerHis] тело вокруг пустой миски. Ветер треплет [ROOT.Char.getHerHis] изорванные одежды, и начинает падать снег...\n\n"
 wc_magic_spell_events.6001.desc.craven: "Огромная винтовая лестница бесконечно разворачивается вниз вокруг тебя, пока ты падаешь головой вперёд в непостижимые глубины. Воздух хлещет тебя, когда ты кувыркаешься в бездну...\n\n"
 wc_magic_spell_events.6001.desc.cynical: "Тебя втаскивают по ступеням [ROOT.Char.GetFaith.HouseOfWorship] на верёвке, привязанной к лодыжкам. Толпа улюлюкает, когда тебя поднимают к стропилам и избивают палками...\n\n"
 wc_magic_spell_events.6001.desc.deceitful: "Огромная клетка-ловушка наполнена пищащими крысами. Голодные и отчаявшиеся, они грызут прутья, с трудом высвобождаются и выплёскиваются дюжинами наружу...\n\n"
 wc_magic_spell_events.6001.desc.diligent: "Солнце встаёт (или садится?) над некогда великолепным замком, чьи стены испещрены трещинами и заросли плющом. Тишина земель давит, но внутри, кажется, что-то тревожно движется...\n\n"
 wc_magic_spell_events.6001.desc.depressed: "Мёртвый и опустошённый край простирается до самого горизонта. Изувеченные трупы животных усеивают землю, солнце встаёт над пейзажем, чернея и вытягивая из мира все краски...\n\n"
 wc_magic_spell_events.6001.desc.eccentric: "Ты в библиотеке ищешь книгу. Когда ты снимаешь её с полки и листаешь страницы, оказывается, что многие из них вырваны. В отчаянии ты снимаешь с полок одну книгу за другой... Страниц нет во всех...\n\n"
 wc_magic_spell_events.6001.desc.fickle: "Телега срывается с ярма и летит под гору, теряя управление, а её содержимое рассыпается повсюду. У подножия оврага она разлетается вдребезги...\n\n"
 wc_magic_spell_events.6001.desc.forgiving: "Ты входишь в шатёр, где идёт торжественное собрание. Внезапно все взгляды обращаются на тебя. Изумлённые взгляды сменяются смешками, а затем открытым улюлюканьем, когда ты понимаешь, что стоишь нагим, как в день рождения...\n\n"
 wc_magic_spell_events.6001.desc.generous: "В забытом углу кладбища одиноко стоит надгробный камень, покрытый коркой лишайника. Ни имени, ни даты; тени разросшейся зелени нависают над его покинутым ликом...\n\n"
 wc_magic_spell_events.6001.desc.gregarious: "Статуя стоит в запустении, вся в трещинах, истёртая ветром и дождём. Игнорируемая прохожими, на её распростёртых руках гнездятся птицы и роняют помёт...\n\n"
 wc_magic_spell_events.6001.desc.greedy: "Стол тянется через пиршественный зал без видимого конца. Накрытый для пира, каждый поднос гнилой, заплесневелый и облепленный мухами...\n\n"
 wc_magic_spell_events.6001.desc.gluttonous: "За обеденным столом в окружении родных и друзей сидит [ROOT.Char.GetWomanMan]. Внезапно его челюсть сводит судорогой, затем шея, плечи и руки. Каждая часть покрывается серой коркой, а [ROOT.Char.GetHerHis] глаза — последняя часть [ROOT.Char.GetHerHim], обращающаяся в камень...\n\n"
 wc_magic_spell_events.6001.desc.honest: "На холме в лучах рассвета или заката одиноко стоит виселица с пятью фигурами на верёвках. Вороны садятся им на плечи и клюют лица...\n\n"
 wc_magic_spell_events.6001.desc.humble: "Ты стоишь в зале зеркал, каждое по-своему искажает твоё тело. Одно делает тебя толстым и низким, другое — высоким и тощим, но есть зеркало, к которому тебя тянет: образ туманен, но, когда ты приближаешься, он проясняется. Безликим и размытым остаётся лишь твоё лицо...\n\n"
 wc_magic_spell_events.6001.desc.impatient: "Из ямы с песком тянется рука: фигура беспомощно утопает. Но пески не глубоки, а высоки. Из гигантских разбитых песочных часов бьёт поток песка, живьём погребая десятки людей...\n\n"
 wc_magic_spell_events.6001.desc.just: "Одинокая фигура толкает огромный валун вверх по длинному коварному холму, под дождём и в грязи. Едва [ROOT.Char.GetSheHe] достигает вершины, как [ROOT.Char.GetSheHe] оступается и едва избегает гибели, пока валун катится обратно вниз...\n\n"
 wc_magic_spell_events.6001.desc.lazy: "Великий роскошный особняк полыхает в угасающем свете. Внутри всякий великий труд обращается в пепел; труды целых жизней за одну ночь превращаются в пыль...\n\n"
 wc_magic_spell_events.6001.desc.lunatic: "Бесконечная стена лиц всех цветов и форм, выражающих всю гамму человеческих эмоций. Одни кричат, другие заливаются смехом, третьи навязчиво скандируют... Голоса, что эхом звучали в твоём разуме...\n\n"
 wc_magic_spell_events.6001.desc.lustful: "Затерявшийся ребёнок на улицах многолюдного города. [ROOT.Char.GetSheHe] ищет [ROOT.Char.GetHerHis] мать или отца, но никто, кажется, не замечает и не заботится о нём...\n\n"
 wc_magic_spell_events.6001.desc.paranoid: "Бесконечная стена нечётких лиц всех цветов и форм, каждое пылает ненавистью и злым умыслом. Каждое шепчет о заговоре против тебя вполголоса, чуть тише, чем ты можешь расслышать...\n\n"
 wc_magic_spell_events.6001.desc.patient: "Изысканный хрупкий бокал падает из невидимой руки и разбивается о холодный каменный пол. Тебя наполняет чувство ужаса и мысль о том, что осколки чего-то важного уже никогда не собрать воедино...\n\n"
 wc_magic_spell_events.6001.desc.sadistic: "Лунный свет дробится и мерцает, пробиваясь сквозь поверхность воды над тобой. Он гаснет, когда ты идёшь ко дну; ты изо всех сил пытаешься задержать дыхание. Ты едва различаешь пузыри, вырывающиеся, когда твой рот открывается, захлёбываясь мерзкой водой, пока ты тщетно борешься...\n\n"
 wc_magic_spell_events.6001.desc.stubborn: "Два быка впряжены в твою телегу, что мчится к обрыву, каждый тянет в свою сторону. Как бы ты ни натягивал вожжи, тебе не заставить их работать сообща. Вожжи лопаются, и вы втроём срываетесь в бездну; их крики звучат жутко по-человечески...\n\n"
 wc_magic_spell_events.6001.desc.shy: "Тебе предстоит произнести самую важную речь в жизни перед толпой самых устрашающих людей, которых ты когда-либо встречал. Ступив на сцену, ты обнаруживаешь, что слова, которые ты написал, размыты потными ладонями, и, когда толпа начинает истерически хохотать, ты понимаешь, что совершенно наг...\n\n"
 wc_magic_spell_events.6001.desc.temperate: "Конь галопом мчится по грязной равнине, а его всадник болтается, запутавшись в поводьях. Его роскошные одежды волочатся по грязи, покрываясь грязью, а [ROOT.Char.GetHerHis] тело избито и сломано...\n\n"
 wc_magic_spell_events.6001.desc.trusting: "Одинокая фигура сидит в крошечной лодке посреди необъятного океана. Тебя охватывает всепоглощающее чувство ужаса, когда осознаёшь: этот человек будет бороться и умрёт в одиночестве...\n\n"
 wc_magic_spell_events.6001.desc.vengeful: "Зияющая рана источает кровь из твоего бока: с каждой попыткой зажать её рана открывается всё шире, и из тела хлещет всё больше крови...\n\n"
 wc_magic_spell_events.6001.desc.wrathful: "Ты заперт в тесном пространстве, в каком-то вместилище. В него снова и снова бросают материал, и с каждой лопатой он становится всё мягче, пока тебя закапывают всё глубже и глубже...\n\n"
 wc_magic_spell_events.6001.desc.zealous: "Чувство финала охватывает тебя, когда свет возвещает присутствие [ROOT.Char.GetFaith.CreatorNamePossessive]. Ты тянешься к нему, но он медленно начинает гаснуть во тьме, пока ты опрокидываешься навзничь...\n\n"
 wc_magic_spell_events.6001.desc.learning_education: "Ты сидишь в центре огромной библиотеки, окружённый бесконечными полками книг и свитков. Перед тобой прокручивается бесконечный текст всего письменного знания мира, но он движется слишком быстро, чтобы ты успевал уловить его...\n\n"
 wc_magic_spell_events.6001.desc.martial_education: "С вершины горы ты обозреваешь битвы мира, разворачивающиеся перед тобой на бесконечной равнине. Существа из далёких земель применяют тактики, каких ты никогда не видел. Но ты слишком далеко, чтобы разглядеть полезные подробности...\n\n"
 wc_magic_spell_events.6001.desc.diplomacy_education: "В разгар величественного зала собраний придворные мира говорят на языках, которых ты не понимаешь. Ты протискиваешься сквозь толпу, пытаясь найти того, кого сможешь понять, но ничто не звучит знакомо...\n\n"
 wc_magic_spell_events.6001.desc.stewardship_education: "Ты в своём кабинете, склонившись над гроссбухами и планами. На каждые три одобренных документа прибывает ещё четыре. Бумаги растут и растут, переполняя твоё рабочее место, пока не погребают тебя...\n\n"
 wc_magic_spell_events.6001.desc.intrigue_education: "Ты проверяешь операцию, которую планировал годами. Агенты на местах, яды смешаны и переданы нужным людям, взятки розданы. Однако тебя гложет мысль, что в этой головоломке не хватает какой-то части...\n\n"
 wc_magic_spell_events.6001.desc.aspiring_blademaster: "Ты скрещиваешь клинки с фигурой в одеянии, [ROOT.Char.GetHerHis] лицо скрыто капюшоном. Долгое время никто из вас не имеет преимущества, пока внезапный размен и финт не позволяют тебе обезоружить [ROOT.Char.GetHerHim] и сбить [ROOT.Char.GetHerHim] с ног. Ты срываешь капюшон — и [ROOT.Char.GetSheHe] исчезает...\n\n"
 wc_magic_spell_events.6001.desc.eager_reveler: "Ты закатываешь вечеринку века: вино и разговоры льются рекой, но главное блюдо запаздывает. Ты лихорадочно ищешь кухню, но находишь лишь гостиные и обеденные залы, забитые нетерпеливыми гостями...\n\n"
 wc_magic_spell_events.6001.desc.novice_physician: "Пациент-мужчина явился со странным недугом: живот вздут, тело истощено. Ты кладёшь руку на его живот, и что-то давит в ответ... Затем на животе появляется рана: чёрный коготь вспарывает кожу изнутри, а пациент вопит от боли...\n\n"
 wc_magic_spell_events.6001.desc.pilgrim: "Ты поднимаешься по ступеням святого [ROOT.Char.GetFaith.HouseOfWorship], который, как говорят, является обителью самого [ROOT.Char.GetFaith.CreatorName]. Но чем выше ты поднимаешься, с каждой ступенью, тем дальше и дальше отдаляется дверь [ROOT.Char.GetFaith.HouseOfWorship]...\n\n"
 wc_magic_spell_events.6001.desc.mystic: "Ты проводишь последнюю меловую линию сигила, который видел лишь во снах, но, едва завершив его, поднимаешь взгляд и замечаешь, что одна из линий неверна. Как только ты исправляешь её, осознаёшь, что другая сбилась. Ты снуёшь туда-сюда, но, как ни стараешься, сигилу не суждено быть завершённым...\n\n"
 wc_magic_spell_events.6001.desc.Knight_errant: "unused"
 wc_magic_spell_events.6001.desc.charioteer: "unused"
 wc_magic_spell_events.6001.desc.hunter: "Ты выслеживаешь зверя сквозь заросли, но не можешь отделаться от чувства, что за тобой наблюдают. Едва ты вкладываешь стрелу и натягиваешь тетиву, что-то сбивает тебя с ног, и ты чувствуешь, как гигантские челюсти смыкаются на твоей шее...\n\n"
 wc_magic_spell_events.6001.desc.traveler: "Ты стоишь на развилке пути перед выбором. Правая тропа ведёт к коварному обрыву, где один неверный шаг может означать смерть. Левая — в лесистую долину, известную разбойниками...\n\n"
 wc_magic_spell_events.6001.desc.hastiluder: "Ты готовишься к турниру и полируешь доспехи, когда замечаешь, что не хватает одной важной пряжки. Ты ищешь и ищешь, но не можешь найти её. Объявляется сбор участников...\n\n"
 wc_magic_spell_events.6001.desc.governor: "Ты стоишь на высокой башне в глухой ночи, любуясь прекрасным багровым заревом в ночных облаках. Когда взгляд опускается на землю, ты понимаешь, что смотришь на собственные владения. Каждый город объят огнём...\n\n"
 wc_magic_spell_events.6001.desc.gallowsbait: "Шаги эхом отдаются в тёмной темнице, затенённый стражник просовывает что-то сквозь прутья твоей камеры — ключ! Ты судорожно пытаешься просунуть запястья сквозь прутья и ключ в замок, но не можешь его подобрать. Смех эхом разносится по коридору и пронзает твою душу...\n\n"

 # Предложение 4 - Исходы
 wc_magic_spell_events.6001.desc.heroism: "Из твоей кожи начинает исходить сияние, берущее начало от тепла в груди. Тебя наполняет свет, щекочущий каждое нервное окончание, дающий силы идти дальше и рисковать жизнью."
 wc_magic_spell_events.6001.desc.power: "Внезапно вокруг тебя, словно искры над пламенем, взмывают огоньки синего света. Каждая искра колеблется, словно попав в магнитное поле, и внезапно сверкающее зрелище выстраивается в стройные линии, ведущие к центру твоей груди."
 wc_magic_spell_events.6001.desc.enlightenment: "Вздрогнув, твоя голова начинает кружиться. Мир вокруг начинает смещаться, и ты понимаешь: это ты смещаешь его своей волей. Ты выстраиваешь образ в своём разуме и берёшь контроль над своим зрением."
 wc_magic_spell_events.6001.desc.foresight: "Под твоими ногами разверзается заводь, и ты падаешь в тёмное море. Вокруг тебя знакомые люди парят в полумраке, связанные нитями из чёрных пузырей. Ты видишь и прослеживаешь линии, ведущие от тебя к людям, чьи лица врезаются в твою память."
 wc_magic_spell_events.6001.desc.recognition: "Внезапно чья-то рука касается твоего плеча. Ты в комнате со своей семьёй, друзьями, со всеми, кто тебе дорог. Один за другим они кладут руку тебе на плечо, и ты чувствуешь, как в тебе сияет благосклонность [ROOT.Char.GetFaith.CreatorName]."
 wc_magic_spell_events.6001.desc.charisma: "Внезапно ты зависаешь в воздухе, хлещет холодный ветер. Лица твоего народа глядят на тебя из-под тонкой пелены, ты чувствуешь, как из их совокупного взгляда исходит сила, выше и выше к золотому солнцу, согревающему твою душу."

 wc_magic_spell_events.6001.opt.a: "Кровь Нептулона течёт во мне!"


 wc_magic_spell_events.4000.title: "Опустошение природы"
 wc_magic_spell_events.4000.desc: "Мой ритуал возвращения дикости возымел действие! Люди бегут из державы [this_recipient.GetFirstNamePossessive], земля превращается в пустошь. Деревья вянут, реки пересыхают, звери разбегаются. Земля медленно поглощается дикой природой, а я пожинаю все плоды."
 wc_magic_spell_events.4000.a: "Дикая природа в моей власти."

 wc_magic_spell_events.4001.desc: "[caster.GetFirstName] наслал на мои земли мощное заклинание, похоже, похищающее плоды моего труда. Деревья начали вянуть, а [caster.GetHerHis] собственные земли процветают. Наступают тяжёлые времена..."
 wc_magic_spell_events.4001.a: "Проклятие!"

 wc_magic_spell_events.5000.title: "Портал Пустоты: Демонический воин"
 wc_magic_spell_events.5000.desc: "Круговерть Пустоты потрескивает, и из её хаотических энергий возникает демонический воин, готовый сеять хаос в мире смертных."
 wc_magic_spell_events.5000.a: "Пусть [nether_portal_knight.GetSheHe] сражается с честью."

 wc_magic_spell_events.5001.title: "Портал Пустоты: Демоническое войско"
 wc_magic_spell_events.5001.desc: "Круговерть Пустоты дрожит, и из её энергий скверны вырывается орда демонических воинов, готовая сокрушить ваших врагов."
 wc_magic_spell_events.5001.a: "Эти войска приведут нас к победе!"

 wc_magic_spell_events.5002.title: "Портал Пустоты: Магический дар"
 wc_magic_spell_events.5002.desc: "Круговерть Пустоты мерцает, и из её тайных энергий материализуется магический дар, готовый вручить свои таинственные силы достойному — #italic вам.#!"
 wc_magic_spell_events.5002.a: "Я воспользуюсь этим даром с умом."

 wc_magic_spell_events.5003.title: "Портал Пустоты: Дар правителю"
 wc_magic_spell_events.5003.desc: "Круговерть Пустоты кружится, и из её загадочных энергий материализуется дар для законного правителя — #italic вас#!, чтобы укрепить вашу державу."

 wc_magic_spell_events.3000.title:0 "Из могилы"
 wc_magic_spell_events.3000.desc_opening: "Мои руки поднимаются вместе с телом [resurrected_character.GetFirstNamePossessive]. Заклинание сработало!\n\n"
 wc_magic_spell_events.3000.desc_family:0 "Мой [ROOT.Char.Custom2('RelationToMeShort', resurrected_character)] снова жив..."
 wc_magic_spell_events.3000.desc_generic: "Будем надеяться, что мои усилия не пропали даром..."
 wc_magic_spell_events.3000.a_default_1:0 "Восстань и служи мне!"
 wc_magic_spell_events.3000.a_default_2:0 "С возвращением, [resurrected_character.GetFirstNameNoTooltip]."
 wc_magic_spell_events.3000.a_compassionate_1:0 "Что я с тобой сделал, [resurrected_character.GetFirstNameNoTooltip]?"
 wc_magic_spell_events.3000.a_undead: "Спутник в мире нежити."