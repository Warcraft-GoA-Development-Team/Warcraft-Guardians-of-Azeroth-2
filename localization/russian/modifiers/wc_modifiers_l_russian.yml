 #Exodar Related Values
 wc_exodar_crystal_high: "Последствия крушения Экзодара - Высокие"
 wc_exodar_crystal_high_desc: "На это графство обрушился мощный шторм энергетических кристаллов из Экзодара, вызвавший повсеместное опустошение и мутацию. Земля бесплодна, население болеет, а дикая природа враждебна."
 wc_exodar_crystal_mid: "Последствия крушения Экзодара - Средние"
 wc_exodar_crystal_mid_desc: "Это графство подверглось воздействию умеренного количества энергетических кристаллов из Экзодара, что привело к некоторым повреждениям и изменениям. Земля загрязнена, а дикие животные насторожены."
 wc_exodar_crystal_low: "Последствия крушения Экзодара - Низкие"
 wc_exodar_crystal_low_desc: "Это графство подверглось воздействию нескольких энергетических кристаллов из Экзодара, что привело к небольшим повреждениям и изменениям. Земля и дикая природа слегка загрязнены."

