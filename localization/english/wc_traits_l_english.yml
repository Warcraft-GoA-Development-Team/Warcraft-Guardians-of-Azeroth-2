 trait_creature_tortollan:0 "Tortollan"
 trait_creature_tortollan_desc:0 "Tortollans are a [wc_race|E] of turtle-like humanoids native to Zandalar, although some have left their homeland to explore other areas such as Kul Tiras and Un'Goro. They are constantly in pursuit of knowledge, rare artifacts, and a good story. Tortollans make regular pilgrimages to hear the stories of Torga, the wise and benevolent turtle Loa."
 trait_creature_tortollan_character_desc:0 "This character is a tortollan. $trait_creature_tortollan_desc$"

