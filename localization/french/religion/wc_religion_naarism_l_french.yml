 naarism_religion_desc:0 "La Lumière se manifeste comme une énergie dorée et scintillante. Les naaru, des êtres énigmatiques composés de fragments de lumière fracturée, ont enseigné la voie de la Lumière aux draeneï et à d'autres races éclairées. Contrairement à d’autres qui sont venus à la Lumière de leur propre chef, les enseignements des naaru guident les êtres inférieurs vers la pureté à travers la Foi, le Courage et le Cœur." 

