 forsaken_cult_opinion:0 "Opinion sur la Foi $forsaken_cult$"
 recent_scarlet_mark_modifier:0 "Marqué[CHARACTER.Custom('FR_E')] par l'Inquisition"
 recent_scarlet_mark_modifier_desc:0 "Cette personne a récemment été marquée par l'Inquisition pour ses actes infâmes."
 scarlet_mark_recently_lifted_modifier:0 "Marque écarlate récemment levée"
 scarlet_mark_recently_lifted_modifier_desc:0 "Cette personne a récemment vu sa Marque écarlate levée et est maintenant en repentir."
 heresy_denied_repentance_modifier:0 "Repentir refusé"
 heresy_denied_repentance_modifier_desc:0 "Cet inquisiteur a refusé à quelqu'un la chance de se repentir pour ses crimes contre la foi."
 heresy_allowed_repentance_modifier:0 "Repentir accordé"
 heresy_allowed_repentance_modifier_desc:0 "Cet inquisiteur a permis à quelqu'un de se racheter."
 wc_exodar_crystal_high: "Conséquences du Crash de l'Exodar - Élevées"
 wc_exodar_crystal_high_desc:1 "Ce comté a été frappé par une tempête massive de cristaux de puissance de l'Exodar, causant une dévastation généralisée et des mutations. Les terres sont stériles, les gens sont malades et la faune est hostile."
 wc_exodar_crystal_mid: "Conséquences du Crash de l'Exodar - Moyennes"
 wc_exodar_crystal_mid_desc: "Ce comté a été exposé à une quantité modérée de cristaux de puissance de l'Exodar, causant des dommages et des altérations. Les terres sont souillées et la faune est méfiante."
 wc_exodar_crystal_low: "Conséquences du Crash de l'Exodar - Faibles"
 wc_exodar_crystal_low_desc: "Ce comté a été exposé à quelques cristaux de puissance de l'Exodar, causant une petite quantité de dommages et d'altérations. Les terres et la faune sont légèrement souillées."
 wc_thunder_king_ai_modifier:0 "Gathering Storm"
 wc_thunder_king_ai_modifier_desc:0 "The Thunder King has returned and his legions are gathering to conquer Pandaria once and for all."
 wc_troll_mogu_pact_zandalari_modifier:0 "The Zandalari-Mogu Pact"
 wc_troll_mogu_pact_zandalari_modifier_desc:0 "A Zandalari [ruler|E] of [dynasty|E] has resurrected the [thunder_king|E].\n\nThey may call him into a defensive [war|E] once for each remaining stack of this [modifier|E] via a [character_interaction|E]."
 wc_troll_mogu_pact_thunder_king_modifier:0 "The Mogu-Zandalari Pact"
 wc_troll_mogu_pact_thunder_king_modifier_desc:0 "The [thunder_king|E] has been resurrected a Zandalari [ruler|E].\n\nThey may call them into a defensive [war|E] once for each remaining stack of this [modifier|E] via a [character_interaction|E]."
 union_block_modifier:0 "Union Block"
 union_block_modifier_desc:0 "This character has recently left their union and is left with the consequences of standing alone."
 ongoing_corruption_modifier:0 "Ongoing Corruption"
 ongoing_cleansing_modifier:0 "Ongoing Cleansing"
 ongoing_genocide_modifier:0 "Ongoing Purge"
