l_english:
 wc_titanforged_restoration.0001.title:0 "The Work Before Us"
 wc_titanforged_restoration.0001.desc:0 "My Marshal lays a split cartwheel beside the map of [county.GetName]. It broke on the road into the county; the carter had to carry the last of his load to market on his back.\n\n#EMP We can order people to clear a road,#! my Marshal says, tracing its course between the villages. #EMP Before I send them out, they will want to know what we mean to build here, and whose authority they must answer to.#!"
 wc_titanforged_restoration.0001.pact:0 "Restore their traditions, and pledge autonomy."
 wc_titanforged_restoration.0001.marshal_pact:0 "\n\nMy Marshal points to the villages. #EMP These people know how to mend what is theirs. Give them back their customs, and a promise worth working for.#!"
 wc_titanforged_restoration.0001.marshal_mandate:0 "\n\nMy Marshal taps the villages on the map. #EMP A repaired road will carry our enemies as readily as our soldiers. Restore their people, but let our faith take root with them.#!"
 wc_titanforged_restoration.0001.mandate:0 "Restore their culture under my faith and rule."
 wc_titanforged_restoration.0001.implantation:0 "Prepare an Earthen settlement."
 wc_titanforged_restoration.0001.legacy:0 "Carry out the restoration already ordered."
 wc_titanforged_restoration.0001.cancel:0 "Call the Marshal away from this work."
 wc_titanforged_restoration.cancel_tt:0 "End the Marshal's assignment without choosing a method."
 wc_titanforged_restoration.implantation_tt:0 "#S Forge-supported settlement#!\nWork proceeds at #V 75%#! of normal speed. Each forge level above the first adds #V 5%#! of this rate.\nRequires a directly owned forge here or in a fully controlled land neighbor. A local forge supplies the county first. Losing forge service or eligibility ends the assignment.\nCompleted installation and institutional choices are retained if work is interrupted."
 wc_titanforged_displaced_institutions_modifier:0 "Displaced Institutions"
 wc_titanforged_displaced_institutions_modifier_desc:0 "Earthen settlers have established titan administration here. The loss of the old institutions has stirred lasting resentment."
 wc_titanforged_restoration.pact_tt:0 "Restoration speed in this [county|E]: #N −25%#!\n\n#S Upon completing this county's restoration#!\n• Historical [culture|E] and [faith|E] restored\n• [development|E] loss: at most #N 2#!\n• Corruption removed\n\n#S Promise of autonomy#!\nUpon completion, this county is promised autonomy through its duchy's eventual independence or protectorate.\nIf you keep the duchy instead: #N −20#! [county_opinion|E] for #V 10 years#! in counties restored under a Pact."
 wc_titanforged_restoration.mandate_tt:0 "Restoration speed in this [county|E]: #P +50%#!\n\n#S Upon completing this county's restoration#!\n• Historical [culture|E] restored\n• County converted to your [faith|E]\n• [development|E] loss: #N 50%#!, rounded up\n• Corruption removed\n\n#S Authority retained#!\nYou make no promise of autonomy."
 wc_titanforged_restoration.wait:0 "These orders must wait."
 wc_titanforged_restoration.legacy_task_tt:0 "#S Standing restoration orders#!\nWork proceeds at normal speed.\n\n#S Upon completion#!\n$BULLET_WITH_TAB$Historical [culture|E] and [faith|E] restored\n$BULLET_WITH_TAB$[development|E] reduced to #N 0#!\n$BULLET_WITH_TAB$[GetModifier('county_corruption_arcane_modifier').GetNameWithTooltip] applied\n\nNo new promise of autonomy is made."
 wc_titanforged_restoration.break_pact_tt:0 "#S Promise of autonomy broken#!\nOnly [counties|E] with an outstanding Restoration Pact in this duchy: #N −20#! [county_opinion|E] for #V 10 years#!."
 wc_titanforged_restoration.0090.title:0 "The Restoration Ends"
 wc_titanforged_restoration.0090.desc:0 "Word goes out for the restoration crews to stand down. Tools are gathered for the journey home; work left unfinished must wait.\n\nI can no longer carry this restoration through under its former terms. Whatever the inhabitants need next, these orders will not provide it."
 wc_titanforged_restoration.0090.a:0 "Recall those still serving me."
 wc_titanforged_broken_pact_modifier:0 "Broken Restoration Pact"
 wc_titanforged_broken_pact_modifier_desc:0 "Promised autonomy after restoration, the inhabitants instead remain under the rule that pledged to release them."
 wc_titanforged_method_approved_opinion:0 "Heeded My Restoration Advice"
 wc_titanforged_method_rejected_opinion:0 "Rejected My Restoration Advice"
 wc_titanforged_restoration.0001.upgrade:0 "My Marshal brings news from the Earthen workshops of [county.GetName]. The settlers and their neighbors are working side by side, each community still keeping its own customs.\n\n#EMP The settlement is established,#! my Marshal says. #EMP If you mean to give the Earthen authority over the whole county, we will have to return and see that change through. The people who have shared their roads with us may not welcome sharing our rule.#!"
 wc_titanforged_restoration.0001.resume:0 "My Marshal spreads the map of [county.GetName] before me again. The Earthen already have their workshops; our earlier work has not vanished merely because the assignment stopped.\n\n#EMP We can take up the work where we left it,#! my Marshal says. #EMP But we must honor the arrangements already made. I need your word before I send the crews back.#!"
 wc_titanforged_restoration.0001.implantation_resume:0 "Resume the Earthen settlement."
 wc_titanforged_restoration.0001.implantation_upgrade:0 "Extend Earthen rule over the county."
 wc_titanforged_restoration.installation_cost_tt:0 "\n#S Installation — at 25% progress#!\nPay #V 50#! [gold|E], or requisition materials: [GetModifier('wc_titanforged_requisitioned_installations_modifier').GetNameWithTooltip] for #V 5 years#! (#N −10#! [county_opinion|E])."
 wc_titanforged_restoration.institution_choice_tt:0 "\n#S Institutions — choose at 75% progress#!\n$BULLET_WITH_TAB$#V Coexistence:#! pay #V 75#! [gold|E] at completion; preserve local [culture|E] and [faith|E], with a small [development|E] loss. Forge service supports development growth.\n$BULLET_WITH_TAB$#V Earthen administration:#! replace local culture and faith with $titanforged$ culture and $mystery_of_the_makers$. Lose half the county's development, rounded up, and face lasting popular resentment. Forge service supports levies.\n\n$wc_titanforged_forge.settlement_completion_tt$"
 wc_titanforged_restoration.institutions_fixed_tt:0 "\n#S Institutions already agreed#!\nThe existing institutional choice will be carried through."
 wc_titanforged_restoration.upgrade_tt:0 "\n#S Extending Earthen rule#!\nA new assignment must run its full course; an interrupted attempt resumes from its last completed stage. Installation is already paid for. Coexistence will be replaced by Earthen administration."
