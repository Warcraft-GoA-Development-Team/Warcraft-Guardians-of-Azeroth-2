l_russian:
  
 demon_hunter_0001_title: "Судьба Пламени"
 demon_hunter_0001_desc: "Это может быть отчаянным шагом, но у меня нет иного выбора.\n\nЯ глубоко вздыхаю, направляясь ночью в темницы. Зловонная, порочная сущность [GetTrait('being_demon').GetName(GetNullCharacter)] чувствуется уже на подходе — сама её вонь заставляет морщиться.\n\nИ там лежит яростный, иссохший от маны, ничтожный [first_demon_prey.GetFirstName].\n#XB \"Ха… Пришёл добить меня? Жалкий глупец! Наш род никогда не исчезает, как вы, слабое отродье… И я вернусь, чтобы отомстить! Твои близкие, твоя держава — все познают ярость Пылающего Легиона!\"#! — рычит [first_demon_prey.GetFirstName].\n\nМеня утешает то, что я совершаю не просто поступок — службу своему народу, нечеловечески великую. Я хватаю [first_demon_prey.GetFirstName] за лицо одной рукой — он дёргается в цепях — и клинком перерубаю шею. Судороги прекращаются.\n\nПьёшь кровь, текущую из мёртвой головы — и чувствуешь, как силы [GetTrait('being_demon').GetName(GetNullCharacter)] уже текут по венам."
 demon_hunter_0001_A: "...и затем вырываю сердце"
  
 demon_hunter_0002_title: "Судьба Пламени"
 demon_hunter_0002_desc: "Когда ещё бьющееся сердце [GetTrait('being_demon').GetName(GetNullCharacter)] пульсирует у меня в руках, я понимаю, как остановить цикл его возрождения в [twisting_nether|E]:\nЯ пожираю эту мерзость, энергию и плоть, связывая душу [first_demon_prey.GetFirstName] со своей. Как только я проглатываю последнюю жилу, я ощущаю, как тёмная сила наполняет меня.\n\nВдруг мир вокруг меня меняется, глаза жжёт — и я вижу: бесчисленные легионы [GetTrait('being_demon').GetName(GetNullCharacter)] идут по мирам подобным нашему, уничтожая всё — грубой силой или ядом изнутри.\n\nБезмятежные миры обращаются в прах и пламя… Их боль звучит в моей душе… Я умоляю, чтобы видения прекратились, но они идут, и идут, и идут…\nНе выдерживая, исполняя самое отчаянное желание остановить их, я вырываю собственные глаза…"
 demon_hunter_0002_A: "...и мир погружается во тьму"
  
 demon_hunter_0003_title: "Судьба Пламени"
 demon_hunter_0003_desc: "Пробуждаясь от забытья, я ощущаю, что мерзкие видения ушли.\n\nЗрение моё — тьма, но я вижу силуэты живых — словно движущиеся потоки силы. Неизвестно отчего, но [GetTrait('spectral_sight').GetName(GetNullCharacter)] позволяет мне мгновенно отличить смертных от [GetTrait('being_demon').GetName(GetNullCharacter)]."
 demon_hunter_0003_A: "...охота начинается!"
  
 demon_hunter_0004_title: "Судьба Скорби"
 demon_hunter_0004_desc: "#XB \"…глупец, ГЛУПЕЦ… ГЛУПЕЦ!\"#! — слышу я, когда меня вновь рвёт в тот мир видений и знакомого голоса.\n\n#XB \"Ты думал, что покончил со мной? Что лишив меня плотского тела, ты меня уничтожил? Жалкий слабак!\"#! — звучит голос [first_demon_prey.GetFirstName]. Я оборачиваюсь — и вижу его куда более огромным, чем прежде.\n\n[first_demon_prey.GetFirstName] поднимает мою голову за подбородок, заставляя смотреть в его глаза.\n\n#XB \"Теперь… ты познаешь нашу ярость!\"#! — усмехается он, и в тот же миг видение рушится, а в мой череп вонзается раскалённая боль…"
 demon_hunter_0004_A: "Проклятье тебе, [first_demon_prey.GetFirstName]!"
  
 demon_hunter_0005_title: "Судьба Скорби"
 demon_hunter_0005_desc: "Меня снова затягивает в ту мерзость из огня. Я ожидаю, что [first_demon_prey.GetFirstName] явится и начнёт нести свой яд.\n\nНо я чувствую приток силы. Больше, чем когда я впервые поглотил его сущность.\n\n[first_demon_prey.GetFirstName] кладёт руки мне на плечи — и впервые его присутствие не вызывает омерзения. «Что ты вынашиваешь, [first_demon_prey.GetFirstName]?», — спрашиваю я.\n#XB \"Разве не силы ты желал? Вот они…\"#! — слышу я ухмылку.\n\n«Не держи меня за дурака, тварь. Чего ты хочешь взамен?» — рычу я.\nОн убирает руки. Я смотрю на [first_demon_prey.GetFirstName].\n#XB \"Я думал… Ты освободил меня, [newborn_demon_hunter.GetFirstName]. Я выпал из лап Тёмного Титана. Я никогда не знал свободы. Ни ножей моего рода, ни страха перед вашим. Ты достоин силы и знаний нашей природы, [newborn_demon_hunter.GetFirstName].\"#!\n\nЯ хмурюсь: «Это не ответ, [GetTrait('being_demon').GetName(GetNullCharacter)].»\nОн тычет пальцем в меня, почти касаясь глаз: #XB \"Ты достоин… пока что. Пользуйся моей силой. Но проявишь слабость — я заберу всё. Я скрывать нечего.\"#!\n\nИ меня выбрасывает обратно."
 demon_hunter_0005_A: "Это только начало..."
 demon_hunter_0005_A_tt: "#help Вы получаете решение, позволяющее обрести форму [GetTrait('metamorphosis').GetName(GetNullCharacter)].#!"
  
 demon_hunter_0006_title: "Судьба Скорби"
 demon_hunter_0006_desc: "Прошло время. Удерживать форму [GetTrait('metamorphosis').GetName(GetNullCharacter)] становится тяжело.\n\nСтоит ли #italic удерживать#! её дальше? Или позволить телу отдохнуть, чтобы вернуться сильнее?"
 demon_hunter_0006_A: "Нужно быть осторожнее"
 demon_hunter_0006_B: "Я выдержу..."
  
 demon_hunter_0007_title: "Судьба Скорби"
 demon_hunter_0007_desc: "Я слишком долго остаюсь в этой форме… Побочные эффекты усиливаются. Голоса… шумы…\n\nГоловные боли, вспышки ярости из-за пустяков."
 demon_hunter_0007_A: "Пора прекратить"
 demon_hunter_0007_B: "Я выдерживал и не такое..."
  
 demon_hunter_0008_title: "Судьба Скорби"
 demon_hunter_0008_desc: "Сила, горевшая во мне, теперь ощущается болезнью. Охотничьи руны жгут кожу, сдерживая [GetTrait('being_demon').GetName(GetNullCharacter)].\n\nТёмные порывы затмевают разум."
 demon_hunter_0008_A: "Хватит"
 demon_hunter_0008_B: "...я ещё держусь"
  
 demon_hunter_0009_title: "Судьба Скорби"
 demon_hunter_0009_desc: "Мои руны горят ярче прежнего. Испытание было долгим… но едва ли оно выдержит ещё.\n\n#XB \"Устал так скоро?\"#! — слышу голос [first_demon_prey.GetFirstName]. #XB \"Охотник… Ты знаешь — это лишь начало! Это не предел моих даров… Подумай, сколько погибнет, если ты остановишься… Сколько твоих союзников падёт, если ты не принесёшь #italic жертву#!…\"#!"
 demon_hunter_0009_A: "Конец этому безумию!"
 demon_hunter_0009_B: "...ещё… лишь раз"
  
 keep_the_form_going_tt: "Вы сохраняете форму [GetTrait('metamorphosis').GetName(GetNullCharacter)]."
  
 demon_takes_over_demon_hunter_tt: "#XB [GetTrait('being_demon').GetName(GetNullCharacter)] поглощает вашу душу и тело#!"
  
 demon_hunter_0010_title: "Судьба Завершена"
 demon_hunter_0010_desc: "[GetTrait('being_demon').GetName(GetNullCharacter)] в теле [new_fallen_hunter.GetFirstName] более не заключён.\n\nСущности демона и [new_fallen_hunter.GetFirstName] слились, утратив все следы прошлого. #help Играть ли вам за [GetTrait('fallen_demon_hunter').GetName(GetNullCharacter)]? Или за [player_heir.GetFirstName], чтобы отомстить за [new_fallen_hunter.GetFirstName]?#!"
 demon_hunter_0010_without_heir_desc: "[GetTrait('being_demon').GetName(GetNullCharacter)] в теле [new_fallen_hunter.GetFirstName] более не заключён.\n\nСущности демона и [new_fallen_hunter.GetFirstName] слились, утратив память о прошлом. #help Теперь вы играете за [GetTrait('fallen_demon_hunter').GetName(GetNullCharacter)]. Охотник стал добычей — вы покидаете свои земли и связи, начиная всё заново.#!"
 demon_hunter_0010_A: "Выбрать судьбу Падшего Охотника"
 demon_hunter_0010_B: "Выбрать судьбу Наследника"
  
 demon_hunter_0011_title: "Судьба Падшего Охотника"
 demon_hunter_0011_desc: "...словно пробуждение от кошмара.\n\nЯ свободен… Свободен от ярости, от страха, от чужой воли.\n\nНо кто я… что я? Воспоминания рваны, полны эмоций, не дающих видеть ясно. Те, кого я любил — не простят падшего. Те, кому служил — погибли от руки моего прошлого «я».\n\nМне нужно выбрать. Кому принести клятву.\nВернуться к Легиону, что жжёт миры?\nИли стать изгоем, живущим только ради себя?"
 demon_hunter_0011_A: "Я всё ещё служу Легиону!"
 demon_hunter_0011_B: "Я создам свой путь"
  
 demon_hunter_0012_title: "Судьба Детёныша Охотника"
 demon_hunter_0012_illidari_desc: "Мой [ROOT.Char.Custom2('RelationToMe', new_fallen_hunter)] был доблестным воином и истинным [GetTrait('demon_hunter').GetName(GetNullCharacter)]. Но игра с силами [GetTrait('metamorphosis').GetName(GetNullCharacter)] довела [new_fallen_hunter.GetHerHim] до падения.\n\n[new_fallen_hunter.GetFirstName] служил Иллидари верно, но теперь это конец. [GetTrait('fallen_demon_hunter').GetName(GetNullCharacter)] — порождение, опаснейшее из опасных.\n\nСтоит ли мне самому избавить своего [ROOT.Char.Custom2('RelationToMe', new_fallen_hunter)] от мук? Или сперва подготовиться?"
 demon_hunter_0012_kaldorei_religion_desc: "До меня дошли вести… Мой безрассудный [ROOT.Char.Custom2('RelationToMe', new_fallen_hunter)] пал глубже, чем Иллидари. [new_fallen_hunter.GetFirstName] не вернётся — его пожрала собственная #italic Охота#!.\n\nЯ слишком долго закрывал глаза… Должен ли я сам положить конец [ROOT.Char.Custom2('RelationToMe', new_fallen_hunter)]? Или снова отвернуться?"
 demon_hunter_0012_A: "Я отомщу за своего [ROOT.Char.Custom2('RelationToMe', new_fallen_hunter)]!"
 demon_hunter_0012_B: "Я не сойду с ума…"
