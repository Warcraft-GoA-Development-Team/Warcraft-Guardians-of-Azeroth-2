consecrate_kingdom_decision: "Consecrate a New Kingdom"
consecrate_kingdom_decision_desc_self: "It is [ROOT.Char.GetFaith.HighGodName] who makes monarchs, and it is I who speaks on [ROOT.Char.GetFaith.HighGodNamePossessive] behalf. Could there be a more fitting sovereign to rule over the lands of the faithful?"
consecrate_kingdom_decision_desc: "It is [ROOT.Char.GetFaith.HighGodName] who makes monarchs. In times of need, [ROOT.Char.GetFaith.HighGodNameSheHe|U] may even raise them up from among the humblest nobility.\n\nThis is such a time. I will beseech a sacred crown for my bare head."
consecrate_kingdom_decision_confirm: "Assume a royal mandate"
consecrate_kingdom_decision_tooltip: "Found a new [kingdom|E] [title|E] through the endorsement of high spiritual authority, not the basis of your [realm]'s power"
consecrate_kingdom_player_warning_tt: "@warning_icon! #X [religious_authority.GetShortUIName] may still refuse to consecrate your [kingdom|E], invalidating this [decision|E]!#!"
consecrated_king_ai_behavior_large_tt: "#EMP #weak Will behave more zealously and justly#!#!"
consecrated_king_modifier: "First of Consecrated Monarchs"
consecrated_king_modifier_small: "$consecrated_king_modifier$"
consecrated_king_modifier_desc: "A holy kingdom was formed so that this character could be a sovereign. Theirs is a mandate directly from the divine."
consecrated_king_modifier_small_desc: "$consecrated_king_modifier_desc$"
pam_decision_events.0030.b.decline: "The [religious_authority.GetTitleAsName] Reviles Your Kingdom"
pam_decision_events.0030.opening: "Most Holy [religious_authority.GetMotherFather|U],"
pam_decision_events.0030.desc: "[religious_authority.GetFaith.HighGodName] ordains but a precious few to serve as the high guardians of [ROOT.Char.GetFaith.HighGodHerHis|U] [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip] children, as sovereigns minding the beauteous lands [ROOT.Char.GetFaith.HighGodNameSheHe|U] afforded to the Earth.\n\nI ask to serve as one of those blessed few. Create a Kingdom of [king_aspirant.GetPrimaryTitle.GetBaseNameNoTierNoTooltip], and I shall defend it against all evils."
pam_decision_events.0030.a: "A new [religious_authority.GetFaith.GetReligion.GetAdjectiveNoTooltip] kingdom is hereby consecrated."
pam_decision_events.0030.b: "[religious_authority.GetFaith.HighGodName] has no such plans for you, [king_aspirant.GetFirstNameNoTooltip]..."
pam_decision_events.0031.t: "A [ROOT.Char.GetFaith.GetAdjectiveNoTooltip] [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]"
pam_decision_events.0031.desc.self_crowning: "What land is more blessed than [ROOT.Char.GetPrimaryTitle.GetNameNoTier]? Which fiefdom more deserving of royal auspices? Has [ROOT.Char.GetFaith.WarGodName] not guarded its people against woes, and preserved my holy seat within its borders?\n\n Wielding [ROOT.Char.GetFaith.HighGodNamePossessive] will, I have consecrated the [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip] of [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip]. I have made myself the land's sacred guardian, and never again shall my will be spurned.\n\nVassals and devotees alike — bow low! Good [religious_authority.GetFaith.GetReligion.GetAdherentNamePlural] know to revere their [ROOT.Char.GetTitleAsName]."
pam_decision_events.0031.desc_three_duchies: "By [religious_authority.GetTitledFirstNamePossessiveRegnal] decree, the lands of my realm are aligned as fated stars in the ever-wheeling sky. Of [duchy_1.GetName], [duchy_2.GetName], and [duchy_3.GetName], a blessed, united [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip|l] is made.\n\nAnd, from a righteous and worthy soul, comes a new [ROOT.Char.GetTitleAsName]! It is by the [religious_authority.GetTitleAsNamePossessiveNoTooltip] mandate I am raised up, and now by [religious_authority.GetHerHis] line I must lead."
pam_decision_events.0031.desc: "By [religious_authority.GetTitledFirstNamePossessiveRegnal] decree, a new [ROOT.Char.GetPrimaryTitle.GetTierAsNamePossessiveNoTooltip|l] name is scriven into the annals. The [ROOT.Char.GetFaith.PriestNeuterPlural] and the people raise me up in exaltation! For as long as [ROOT.Char.GetPrimaryTitle.GetNameNoTier] shall slip the grasp of heathen and heretic, I will remain its rightful [ROOT.Char.GetFaith.GetAdjective] [ROOT.Char.GetTitleAsName].\n\nThe [religious_authority.GetTitleAsNameNoTooltip], my creator, has truly blessed this modest realm... and will surely take some interest in my royal doings."
pam_decision_events.0031.a: "May [ROOT.Char.GetFaith.HighGodName] forever love my [ROOT.Char.GetPrimaryTitle.GetTierAsNameNoTooltip]."
any_landed_duchy_title_tt: "At least one [duchy|E] you hold is a [landed|E] [title|E] #weak #EMP (Not a [clerical_region|E] or a [noble_family|E])#!#!"
