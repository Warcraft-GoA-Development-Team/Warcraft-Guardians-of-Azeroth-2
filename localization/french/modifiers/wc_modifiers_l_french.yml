 wc_earth_mother_prowess: "Bénédiction de la Terre-Mère"
 wc_earth_mother_prowess_desc:1 "Cette personne a été bénie par les esprits de la Terre-Mère. Leur habileté au combat est aussi redoutable que celle d'un kodo protégeant ses jeunes."
 wc_saw_white_kodo: "Yeux Cramoisis"
 wc_saw_white_kodo_desc:1 "Ce pauvre centaure a vu un kodo à la peau blanche terrifiant, un sinistre présage pour son peuple. C'est le signe à la fois de la mort et de la malveillance."
 wc_building_undercity:0 "Développement de la Citadelle souterraine"
 wc_building_undercity_desc:0 "Les Morts-vivants travaillent dur pour construire une forteresse souterraine dans les égouts sous la ville, connue sous le nom de Citadelle souterraine."
 wc_forsaken_tolerated_selinite_modifier:0 "Ami de l'Ombre oubliée"
 wc_forsaken_tolerated_selinite_modifier_desc:0 "Ce personnage a favorisé la tolérance envers la foi de Selinite, également connue sous le nom de Culte de $d_forgotten_shadow$"
 wc_forsaken_embraced_selinite_modifier:0 "Embrasser l'Ombre !"
 wc_forsaken_embraced_selinite_modifier_desc:0 "Ce personnage a embrassé la $d_forgotten_shadow$ et est vénéré pour son rôle dans sa redécouverte."
 wc_forsaken_subsumed_selinite_modifier:0 "Assimilation de l'Oublié"
 wc_forsaken_subsumed_selinite_modifier_desc:0 "Sous les auspices du [GetGlobalVariable('sylvanas_character').Char.GetTitledFirstName], ce personnage a supervisé la redéfinition de $d_forgotten_shadow$ pour répondre aux besoins de [GetGlobalVariable('sylvanas_character').Char.GetHerHis]."
 wc_executed_religious_minority_modifier:0 "Religieux Minoritaire Exécuté"
 wc_executed_religious_minority_modifier_desc:0 "Ce personnage est connu pour persécuter impitoyablement les minorités religieuses."
 wc_arcanist_educated_casters:0 "Lanceurs Arcaniques"
 wc_alchemist_altered_troops:0 "Troupes Altérées par l'Alchimie"
 wc_arcanist_equipped_troops:0 "Troupes Armurées par l'Enchantement"
