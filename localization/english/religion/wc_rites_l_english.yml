 # Shat'gral
 azsharism:0 "Azsharism"
 azsharism_adj:0 "Azsharic"
 azsharism_adherent:0 "Azshara Worshipper"
 azsharism_adherent_plural:0 "Azshara Worshippers"
 azsharism_desc:0 "Azshara was the most glorious queen of the Highborne, adored for her beauty and power. Deceived by Sargeras and blinded by hubris, she brought about the War of the Ancients and the Great Sundering. As her kingdom sank, she struck a bargain with N'Zoth, who saved her people by transforming them into naga in exchange for her allegiance. Her followers worship her as their queen, believing that true greatness demands absolute devotion."
