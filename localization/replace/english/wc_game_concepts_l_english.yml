l_english:
 game_concept_heritages:0 "Heritages"
 game_concept_theocracy_desc:0 "$game_concept_theocracy$ is a [government_form|E] available for some [faiths|E] depending on [doctrines|E]. They are usually lead by a [head_of_faith|E] or a [landed|E] [realm_priest|E]. A Bishop might also become an [independent|E] Theocratic ruler in their own right."
 theocracy_government_desc:1 "$game_concept_theocracy_desc$\n\n#F In a theocratic government, all authority belongs to a religious institution. It is ruled by a priest or priestess who carries out the will of the divine on Azeroth.#!"

 game_concept_republic_desc:0 "$game_concept_republic_government$ is a [government_form|E] where an elected citizen rules for life — the $game_concept_government_form$ of burghers and merchants.\n\n$game_concept_republican$ [vassals|E] have static [obligations|E] that cannot be changed, and thus always provide a dependable and predictable amount of [levies|E] and [taxes|E]."
 
 game_concept_skirmishers_desc:0 "Skirmishers are [men_at_arms|E] who are lightly armed and skilled in harassing the enemy.\n\nWhile each kind of Skirmisher is unique, they generally [counter|E] [heavy_infantry|E], and are in turn Countered by [archers|E] and [massive_infantry_plural|E]."
 game_concept_archers_desc:0 "Archers are [men_at_arms|E] who fight on foot with ranged weapons.\n\nWhile each kind of Archer is unique, they generally [counter|E] [skirmishers|E] and [light_aerial|E], and are in turn Countered by [heavy_cavalry|E] and [light_cavalry|E]."
 game_concept_light_cavalry_desc:0 "Light Cavalry are mounted [men_at_arms|E] who excel at scouting and pursuing the enemy.\n\nWhile each kind of Light Cavalry is unique, they generally [counter|E] [archers|E] and [casters|E], and are in turn Countered by [spearmen|E].\n\nLight Cavalry are also often strong on flat [terrain|E].\n\nIn comparison with [heavy_cavalry|E], they are usually better at [pursuit|E] and [screen|E]."
 game_concept_heavy_cavalry_desc:0 "Heavy Cavalry are mounted, heavily armored [men_at_arms|E]\n\nWhile each kind of Heavy Cavalry is unique, they generally [counter|E] [archers|E] and [casters|E], and are in turn Countered by [spearmen|E].\n\nHeavy Cavalry are also often strong on flat [terrain|E].\n\nIn comparison with [light_cavalry|E], they are usually stronger at raw [damage|E] and [toughness|E]."
 game_concept_spearmen_desc:0 "Spearmen are [men_at_arms|E] who fight on foot with various polearms.\n\nWhile each kind of Spearman is unique, they generally [counter|E] [heavy_cavalry|E] and [light_cavalry|E], and are in turn Countered by [heavy_infantry|E].\n\nSpearmen are also often strong on hilly and mountainous [terrain|E]."
 game_concept_heavy_infantry_desc:0 "Heavy Infantry are [men_at_arms|E] who fight on foot, with heavier armor and weapons.\n\nWhile each kind of Heavy Infantry is unique, they generally [counter|E] [spearmen|E], and are in turn Countered by [skirmishers|E] and [casters|E]."
 game_concept_archer_cavalry_desc:0 "$game_concept_archer_cavalry$ are mounted [men_at_arms|E] equipped with ranged weapons.\n\nWhile each kind of $game_concept_archer_cavalry$ is unique, they generally [counter|E] [heavy_infantry|E], and are in turn Countered by [archers|E] equipped with crossbows.\n\n$game_concept_archer_cavalry$ are also often strong on flat [terrain|E], particularly Steppe."
 game_concept_camel_cavalry_desc:0 "$game_concept_camel_cavalry$ are mounted [men_at_arms|E] that, similar to [light_cavalry|E], excel at scouting and pursuing the enemy.\n\nThey generally [counter|E] $game_concept_light_cavalry$ and [casters|E] and are in turn Countered by [spearmen|E].\n\n$game_concept_camel_cavalry$ are often strong in Desert and Dryland [terrain|E]."
 game_concept_gunpowder_desc: "Handgunners are [men_at_arms|E] who are armed with potent gunpowder weapons.\n\nWhile each kind of Handgunner is unique, they generally [counter|E] [heavy_infantry|E] and [massive_aerial|E], and are in turn Countered by [heavy_cavalry|E] and [light_cavalry|E]."
