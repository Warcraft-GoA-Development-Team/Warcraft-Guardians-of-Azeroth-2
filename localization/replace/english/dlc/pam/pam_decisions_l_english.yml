 pam_proclaim_living_word_decision: "Proclaim the Living Word"
 pam_proclaim_living_word_decision_desc: "The faithful whisper that [ROOT.Char.GetFaith.HighGodName] has marked me. Pilgrims speak my name at wayside shrines, and [ROOT.Char.GetFaith.PriestNeuterPlural] cite my judgments as though they were scripture.\n\nLet it be proclaimed from every altar: through me, the living word is made known."
 pam_proclaim_living_word_decision_tooltip: "Become a $trait_herald$ of your [faith|E]"
