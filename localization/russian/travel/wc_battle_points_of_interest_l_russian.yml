l_russian:
  # Key Moment 
 BattlePoiDescriptionLocCasters: "Переломным мгновением битвы стало то, как заклинатели $BattlePoiCommanderCulture$ сумели обойти противника, "
 BattlePoiDescriptionLocMassiveInfantry: "Сражение было решено, когда полк тяжёлой пехоты $BattlePoiCommanderCulture$ прорвал вражеские ряды,"
 BattlePoiDescriptionLocLightAerial: "Исход битвы определился, когда лёгкие воздушные войска $BattlePoiCommanderCulture$ зашли в тыл неприятеля,"
 BattlePoiDescriptionLocMassiveAerial: "Бой завершился, когда тяжёлая авиация $BattlePoiCommanderCulture$ прорвала боевые порядки и ворвалась в самое сердце строя врага,"
 BattlePoiDescriptionLocCastersKnight: "Ключевым моментом стало, как заклинатели $BattlePoiCommanderCulture$ под предводительством $BattlePoiBraveKnight$ умело обошли противника, "
 BattlePoiDescriptionLocMassiveInfantryKnight: "Битва была выиграна, когда полк тяжёлой пехоты $BattlePoiCommanderCulture$ под командованием $BattlePoiBraveKnight$ прорвал вражеские ряды,"
 BattlePoiDescriptionLocLightAerialKnight: "Победа стала очевидной, когда лёгкие воздушные отряды $BattlePoiCommanderCulture$ во главе с $BattlePoiBraveKnight$ оказались за спиной врага,"
 BattlePoiDescriptionLocMassiveAerialKnight: "Сражение окончилось, когда тяжёлая авиация $BattlePoiCommanderCulture$ под началом $BattlePoiBraveKnight$ прорвала оборону и ударила в сердце вражеской формации,"
  
  # Outcome 
  
  # Outro 
 BattlePoiDescriptionLocOutroUndeath: "и вознесла $BattlePoiEnemyCommander$ в ряды нежити."
  
  # Historical Battles 
  
  ## First War 
 BattlePoIHistoricalNameKyross: "Битва при Кайроссе"
 BattlePoIHistoricalDescKyross: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nПовержен: [Glossary( 'Защитник короны', 'DEFENDER_CROWN_GLOSS' )]\nДата: 1 Марта 583 КЦ#!\n#weak Один из первых аванпостов [GetTitleByKey('e_horde').GetBaseName], Кайросс стал ареной первого удара людей, стремившихся помешать оркам наносить дальнейшие внезапные атаки.#!"
  
 BattlePoIHistoricalNameGrandHamlet: "Битва за Гранд-Хэмлет"
 BattlePoIHistoricalDescGrandHamlet: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetTitledFirstName]\nПовержен: [Glossary( 'Защитник короны', 'DEFENDER_CROWN_GLOSS' )]\nДата: 10 Августа 584 КЦ#!\n#weak Хотя войска [GetTitleByKey('k_stormwind').GetNameNoTier] смогли на время отбить орков, человеческий форпост был в итоге уничтожен [GetTitleByKey('e_horde').GetBaseName] в ходе [Glossary( 'Первой войны', 'FIRST_WAR_GLOSS' )], выживших не осталось.\n\nЭто одно из первых задокументированных сражений, где на поле боя появились клирики и некролиты.#!"
  
 BattlePoIHistoricalNameDeadmines: "Битва за Мёртвые копи"
 BattlePoIHistoricalDescDeadmines: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]\nПовержен: [GetScriptedCharacterByHistoryID( '52450' ).GetFirstName]\nДата: 585 КЦ#!\n#weak Схватка между орками и отрядом мятежных огров под предводительством [GetScriptedCharacterByHistoryID( '52450' ).GetFirstName] и [GetScriptedCharacterByHistoryID( '10004' ).GetFirstName], дочери [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]. По приказу [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName] оба лидера и их воины были убиты.\n\nПозже [GetScriptedCharacterByHistoryID( '1008' ).GetFullName] оказался пленён ограми во время поисков Томa Божественности, но был спасён штормградцами во главе с [Glossary( 'Защитник короны', 'DEFENDER_CROWN_GLOSS' )].#!"
  
 BattlePoIHistoricalNameRedridge: "Битва в Красногорье"
 BattlePoIHistoricalDescRedridge: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]\nПовержен: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nДата: 586 КЦ#!\n#weak Красногорье стало одной из точек удара [GetTitleByKey('e_horde').GetBaseName] во время [Glossary( 'Первой войны', 'FIRST_WAR_GLOSS' )].\n\n[GetScriptedCharacterByHistoryID( '10000' ).GetFullName] привёл небольшой рейд, желая захватить Лэйкшир. [GetScriptedCharacterByHistoryID( '1008' ).GetFullName] устроил засаду и почти одолел орков, но два чернокнижника Совета Тени переломили ход боя. Спустя недели орки вернулись с большими силами и всё-таки взяли округу.#!"
  
 BattlePoIHistoricalNameSunnyglade: "Битва за Санниглейд"
 BattlePoIHistoricalDescSunnyglade: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '1008' ).GetNameNicknamed]\nДата: 586 КЦ#!\n#weak Одно из ключевых столкновений между Штормградом и [GetTitleByKey('e_horde').GetBaseName]: орки получили доступ к магии людей, изучив её в близлежащей башне.#!"
  
 BattlePoIHistoricalNameBlackMorass: "Битва в Чёрной трясине"
 BattlePoIHistoricalDescBlackMorass: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstNameNicknamed]\nПовержен: [GetScriptedCharacterByHistoryID( '10000' ).GetNameNicknamed]\nДата: 586 КЦ#!\n#weak [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] воспользовался хаосом в Совете Тени и провалом штурма Штормграда, чтобы свергнуть [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName].\n\nПосле победы он вызвал его на мак'горa и, спустя часы дуэли, отрубил голову бывшему вождю.#!"
  
 BattlePoIHistoricalNameNorthshire: "Битва у аббатства Североземья"
 BattlePoIHistoricalDescNorthshire: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]\nПовержен: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nДата: 586 КЦ#!\n#weak Во время [Glossary( 'Первой войны', 'FIRST_WAR_GLOSS' )] аббатство служило тюрьмой для пленённых орков и огров. Орки осадили монастырь, превратив его залы в поле боя.#!"
  
 BattlePoIHistoricalNameGoldshire: "Битва за Златоземье"
 BattlePoIHistoricalDescGoldshire: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nДата: 586 КЦ#!\n#weak Златоземье стало последним городом, подвергшимся осаде перед штурмом Штормграда. Его падение отрезало короля [GetScriptedCharacterByHistoryID( '2' ).GetTitledFirstName] от народа, превратив монарха в беспомощного символ.#!"
  
 BattlePoIHistoricalNameStormwind: "Падение Штормградской крепости"
 BattlePoIHistoricalDescStormwind: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nДата: 1 Октября 586 КЦ#!\n#weak Второе осаждение Штормграда стало финальной битвой [Glossary( 'Первой войны', 'FIRST_WAR_GLOSS' )], завершившейся победой [GetTitleByKey('e_horde').GetBaseNamePossessive]. Крепость была разрушена, а король [GetScriptedCharacterByHistoryID( '2' ).GetTitledFirstName] погиб.\n\nСэр [GetScriptedCharacterByHistoryID( '1008' ).GetFullName] увёл выживших на север, в Лордерон, готовясь к новой агрессии Орды и вспышке [Glossary( 'Второй войны', 'SECOND_WAR_GLOSS' )].#!"
  
  ## Second War 
 BattlePoIHistoricalNameZulDare: "Битва за Зул'Даре"
 BattlePoIHistoricalDescZulDare: "#emp Победитель: [GetScriptedCharacterByHistoryID( '48080' ).GetTitledFirstName] [GetScriptedCharacterByHistoryID( '48080' ).GetDynastyName]\nПовержен: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nДата: 10 Ноября 588 КЦ#!\n#weak В начале [Glossary( 'Второй войны', 'SECOND_WAR_GLOSS' )] [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] приказал Чёрной горе основать базу на острове Зул'Даре для ударов по прибрежным поселениям людей.\n\nФлот Альянса под командованием [GetScriptedCharacterByHistoryID( '48080' ).GetTitledFirstName] перехватил Орду, но три порабощённых красных дракона обратили бой в бегство людей. Позднее Альянс всё-таки уничтожил форпост.#!"
  
 BattlePoIHistoricalNameTarrenMill: "Засада у Мельницы Таррен"
 BattlePoIHistoricalDescTarrenMill: "#emp Победитель: [GetScriptedCharacterByHistoryID( '1008' ).GetFirstName]\nПовержен: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nДата: 20 Ноября 588 КЦ#!\n#weak Когда эльфы Серебряного Рассвета отправили разведчиков оценить угрозу орков, те были схвачены войсками Орды. Освободительная операция людей и эльфов закончилась объединённой победой и последующим вступлением [GetTitleByKey('e_quelthalas').GetNameNoTier] в Альянс.#!"
  
 BattlePoIHistoricalNameSouthshore: "Битва за Южнобережье"
 BattlePoIHistoricalDescSouthshore: "#emp Победитель: [GetScriptedCharacterByHistoryID( '1008' ).GetFirstName]\nПовержен: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nДата: 588 КЦ#!\n#weak После [Glossary( 'Первой войны', 'FIRST_WAR_GLOSS' )] Южнобережье стало военным портом Альянса, но его стратегическое положение заинтересовало и Орду. Обе стороны стремились превратить город в судостроительную базу.#!"
  
 BattlePoIHistoricalNameHillsbrad: "Битва у предгорий Хилсбрада"
 BattlePoIHistoricalDescHillsbrad: "#emp Победитель: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nДата: 589 КЦ#!\n#weak Первое крупное столкновение Орды и Альянса Лордерона. После успешной прорывной атаки Альянса орки ответили рыцарями смерти и ограми, но были остановлены паладинами и магами. Решающий натиск во главе с домом [GetScriptedCharacterByHistoryID( '1008' ).GetDynastyHouseName] заставил Орду отступить.#!"
  
 BattlePoIHistoricalNameDunModr: "Битва за Дун Модр"
 BattlePoIHistoricalDescDunModr: "#emp Победитель: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nДата: 589 КЦ#!\n#weak Дун Модр — ключ к контролю региона. Альянс, высадившись из Тал Барада, взял оркский форпост, вынудив их к отступлению. Орки позже отбили крепость и даже атаковали Тал Барад, но стратегический баланс уже изменился.#!"
  
 BattlePoIHistoricalNameTolBarad: "Битва за Тол Барад"
 BattlePoIHistoricalDescTolBarad: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '44015' ).GetFullName]\nДата: 1 Февраля 589 КЦ#!\n#weak Орки сочли Тол Барад препятствием на пути в Восточные Королевства и совершили яростный штурм. Неподготовленные штормгардские войска были выбиты, цитадель сожжена, а жители острова почти полностью истреблены.#!"
  
 BattlePoIHistoricalNameStromgarde: "Битва за Стромгард"
 BattlePoIHistoricalDescStromgarde: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10002' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '38001' ).GetFullName]\nДата: 589 КЦ#!\n#weak Орда использовала тролльи разрушители, огров и катапульты, вторгшись с моря. Постепенно город был сравнен с землёй, верфи уничтожены — вторжение признано крупным успехом Орды.#!"
  
 BattlePoIHistoricalNameDunAlgaz: "Битва за Дун Альгаз"
 BattlePoIHistoricalDescDunAlgaz: "#emp Победитель: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nДата: 589 КЦ#!\n#weak После поражения у Дун Модра орки отступили к второму форпосту в Дун Альгаз. [GetScriptedCharacterByHistoryID( '1008' ).GetFullName] приказал уничтожить оплот, оттесняя орков глубже в Каз-Модан.#!"
  
 BattlePoIHistoricalNameCaerDarrow: "Битва за Каэр Дарроу"
 BattlePoIHistoricalDescCaerDarrow: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10015' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '60036' ).GetFullName]\nДата: 589 КЦ#!\n#weak Во время [Glossary( 'Второй войны', 'SECOND_WAR_GLOSS' )] остров подвергся вторжению Орды: крепость была разграблена, а священный рунический камень похищен. Обломки этого камня пошли на создание Алтарей Бурь — арканических сооружений, позволивших [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] наделить магией огров-союзников Орды.#!"
  
 BattlePoIHistoricalNameTyrsHand: "Битва за Длань Тира"
 BattlePoIHistoricalDescTyrsHand: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nДата: 589 КЦ#!\n#weak Орда применила огров-магов, чтобы штурмовать область, возведя крепость на острове у устья Залива Тира и перерезав снабжение Альянса в [GetTitleByKey('e_quelthalas').GetNameNoTier]. Город серьёзно пострадал: орки сравняли с землёй прибрежную часть.#!"
  
 BattlePoIHistoricalNameDestructionStratholme: "Разорение Стратхольма"
 BattlePoIHistoricalDescDestructionStratholme: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nДата: 589 КЦ#!\n#weak Орда уничтожила Стратхольм, когда город готовил крупную поставку нефти в западные королевства Лордерона. Саботаж нефтепереработок лишил Альянс топлива и оборвал линии снабжения в [GetTitleByKey('e_quelthalas').GetNameNoTier].#!"
  
 BattlePoIHistoricalNameBurningQuelThalas: "Пламя Кель'Таласа"
 BattlePoIHistoricalDescBurningQuelThalas: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '42002' ).GetFullName]\nДата: 589 КЦ#!\n#weak Хотя [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] изначально не планировал вторгаться в [GetTitleByKey('e_quelthalas').GetNameNoTier], [GetScriptedCharacterByHistoryID( '57000' ).GetFirstName] настоял: вступление амани в Орду требовало уничтожения высших эльфов. С помощью порабощённых красных драконов, полученных через пленение [GetScriptedCharacterByHistoryID( '62400' ).GetTitledFirstName], королевство было дотла выжжено.#!"
  
 BattlePoIHistoricalNameBlackwood: "Опустошение Блэквуда"
 BattlePoIHistoricalDescBlackwood: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '60028' ).GetFullName]\nДата: 589 КЦ#!\n#weak Во время наступления на [GetTitleByKey('e_quelthalas').GetName] отряд орков отделился и напал на город Блэквуд. Барон [GetScriptedCharacterByHistoryID( '60028' ).GetDynastyName] поднял ополчение, но все были убиты. Стратегически пожар мало что изменил, но стал личной трагедией для его сына — [GetScriptedCharacterByHistoryID( '60030' ).GetFullName].#!"
  
 BattlePoIHistoricalNameAlterac: "Предательство и падение Альтерака"
 BattlePoIHistoricalDescAlterac: "#emp Победитель: [GetScriptedCharacterByHistoryID( '60036' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '58000' ).GetFullName]\nДата: 589 КЦ#!\n#weak Выяснилось, что [GetTitleByKey('k_alterac').GetNameNoTier] предал Альянс: [GetScriptedCharacterByHistoryID( '58000' ).GetTitledFirstName] с самого начала проводил орков через свои земли. В ответ Альянс осадил королевство и полностью его уничтожил.#!"
  
 BattlePoIHistoricalNameTombSargeras: "Гробница Саргераса"
 BattlePoIHistoricalDescTombSargeras: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10002' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10002' ).GetDynastyHouseName]\nПовержен: [GetScriptedCharacterByHistoryID( '10015' ).GetFullName]\nДата: 589 КЦ#!\n#weak [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] предал Орду, уведя кланы Штормоломов и Молота Сумерек к Гробнице Саргераса. Потеряв половину армии, [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] был вынужден преследовать изменника, что дало Альянсу передышку.\n\n[GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] поднял гробницу со дна и вошёл внутрь, надеясь обрести божественность, но был разорван демонами. Оставшихся орков перебила карательная экспедиция Орды. Погибшие впоследствии были подняты демонической магией и обречены вечно переживать бой.#!"
  
 BattlePoIHistoricalNameCapitalCity: "Осада Столицы Лордерона"
 BattlePoIHistoricalDescCapitalCity: "#emp Победитель: [GetScriptedCharacterByHistoryID( '60001' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nДата: 589 КЦ#!\n#weak Осада столицы Лордерона обернулась крахом Орды. Король [GetScriptedCharacterByHistoryID( '60001' ).GetFirstName] приказал лить кипящее масло, а подкрепления [GetScriptedCharacterByHistoryID( '60247' ).GetFirstName] и [GetScriptedCharacterByHistoryID( '59001' ).GetFirstName] укрепили оборону. Узнав о предательстве [GetScriptedCharacterByHistoryID( '10015' ).GetFullName], [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] снял осаду и отправился в погоню, фактически проиграв битву.#!"
  
 BattlePoIHistoricalNameCrestfall: "Морская битва при Крестфолле"
 BattlePoIHistoricalDescCrestfall: "#emp Победитель: [GetScriptedCharacterByHistoryID( '48080' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '10002' ).GetFullName]\nДата: 589 КЦ#!\n#weak Морское сражение между Альянсом и Ордой. Флот Орды с поддержкой красных драконов возглавлял [GetScriptedCharacterByHistoryID( '10002' ).GetFullName]; Альянс — адмирал [GetScriptedCharacterByHistoryID( '48080' ).GetFullName] и грифоньи наездники из Дикого Клыка. Благодаря опыту борьбы с драконами, грифоньеры одержали верх, но ценой гибели флота сына адмирала, [GetScriptedCharacterByHistoryID( '48082' ).GetFirstName].#!"
  
 BattlePoIHistoricalNameBlackrockSpire: "Осада Пика Чёрной горы"
 BattlePoIHistoricalDescBlackrockSpire: "#emp Победитель: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nДата: 589 КЦ#!\n#weak Одно из самых кровавых сражений войны. План [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] убить главнокомандующего Альянса провалился: гибель [GetScriptedCharacterByHistoryID( '1008' ).GetFirstNameNicknamed] лишь сплотила войска. Под руководством [GetScriptedCharacterByHistoryID( '60247' ).GetFullName] Альянс захватил пик, а [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] и выжившие орки сдались.#!"
  
 BattlePoIHistoricalNameDarkPortal: "Уничтожение Тёмного Портала"
 BattlePoIHistoricalDescDarkPortal: "#emp Победитель: [GetScriptedCharacterByHistoryID( '60247' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '10017' ).GetFullName]\nДата: 589 КЦ#!\n#weak Оставшиеся орки попытались уйти через Портал, но Альянс под командованием [GetScriptedCharacterByHistoryID( '60247' ).GetFullName] преследовал их, чтобы установить местонахождение врат. Портал защищал клан $d_blacktoothgrin_clan$, но разрозненные силы Орды не смогли удержать оборону.\n\n$d_burning_blade_clan$ был разбит войсками [GetScriptedCharacterByHistoryID( '60036' ).GetNameNicknamed], а сам Портал разрушен. Это положило конец [Glossary( 'Второй войны', 'SECOND_WAR_GLOSS' )] на Азероте.#!"
  
  ##Interlude 
 BattlePoIHistoricalNameGrimBatol: "Битва за Грим Батол"
 BattlePoIHistoricalDescGrimBatol: "#emp Победители: [GetScriptedCharacterByHistoryID( '59130' ).GetFirstName] и [GetScriptedCharacterByHistoryID( '62400' ).GetFirstName]\nПовержены: [GetScriptedCharacterByHistoryID( '10250' ).GetFullName] и [GetScriptedCharacterByHistoryID( '62200' ).GetFirstName]\nДата: 593 КЦ#!\n#weak Потрясённый силой клана Драконьего Порока после войны, [GetScriptedCharacterByHistoryID( '59130' ).GetFirstName] собрал союзников, чтобы освободить красных драконов. Когда они прибыли, битва уже бушевала: [GetScriptedCharacterByHistoryID( '62200' ).GetFirstName] резал орков ради яиц. Дракониха [GetScriptedCharacterByHistoryID( '62400' ).GetFirstName] сорвала оковы, проглотила [GetScriptedCharacterByHistoryID( '10250' ).GetFullName] и сразила брата. Разрушение Демоновой души [GetScriptedCharacterByHistoryID( '59130' ).GetFirstName] вернуло силу Аспектам, вынудив [GetScriptedCharacterByHistoryID( '62200' ).GetFirstName] бежать. Клан раскололся и больше не восстановился.#!"
  
 BattlePoIHistoricalNameWarSpider: "Война Паука"
 BattlePoIHistoricalDescWarSpider: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10014' ).GetFirstName]\nПовержен: [GetScriptedCharacterByHistoryID( 'anubarak' ).GetFirstName]\nДата: 596 КЦ#!\n#weak Конфликт между новорожденным [GetTitleByKey('e_scourge').GetBaseName] и империей Азжол-Неруб. Несмотря на численное превосходство нерубиан, нежить победила войной на истощение, обращая павших врагов против их же народа, включая самого короля, [GetScriptedCharacterByHistoryID( 'anubarak' ).GetFullName].#!"
  
  ##Third War 
 BattlePoIHistoricalNameDarkspear: "Битва за острова Чёрного Копья"
 BattlePoIHistoricalDescDarkspear: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName]\nПовержен: [GetScriptedCharacterByHistoryID( '150100' ).GetFirstName]\nДата: 602 КЦ#!\n#weak На полпути к Калимдору флот Орды высадился на островах Чёрного Копья для ремонта. Вскоре тролли во главе с [GetScriptedCharacterByHistoryID( '68000' ).GetFirstName] попросили помощи против людей, но всех пленили мурлоки, готовя жертвоприношение Морской Ведьме [GetScriptedCharacterByHistoryID( '150100' ).GetFirstName].\n\n[GetScriptedCharacterByHistoryID( '10021' ).GetFirstName] сумел бежать, освободил союзников и, отбиваясь от мурлоков, дождался ремонта кораблей. Путь на Калимдор был открыт — началось вторжение.#!"
  
 BattlePoIHistoricalNameCullingStratholme: "Очищение Стратхольма"
 BattlePoIHistoricalDescCullingStratholme: "#emp Победитель: [GetScriptedCharacterByHistoryID( '60003' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( 'malganis' ).GetFirstName]\nДата: 603 КЦ#!\n#weak Князь [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] приказал истребить жителей Стратхольма, пытаясь остановить чуму нежити. Раскол Серебряной Длани и первый шаг принца к превращению в рыцаря смерти.#!"
  
 BattlePoIHistoricalNameFrostmourne: "Ледяная Скорбь"
 BattlePoIHistoricalDescFrostmourne: "#emp Победитель: [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName]\nПовержен: [GetScriptedCharacterByHistoryID( 'malganis' ).GetFirstName]\nДата: 603 КЦ#!\n#weak Кульминация охоты [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] на дредлорда. Принц завладел проклятым клинком [frostmourne|E], пожертвовав жизнью учителя [GetScriptedCharacterByHistoryID( '17002' ).GetFullName], и обратил силу меча против сил [GetScriptedCharacterByHistoryID( 'malganis' ).GetFirstName], убив его.#!"
  
 BattlePoIHistoricalNameDarrowshire: "Битва за Дарроушир"
 BattlePoIHistoricalDescDarrowshire: "#emp Победитель: [GetScriptedCharacterByHistoryID( '60679' ).GetNameNicknamed]\nПовержен: [GetScriptedCharacterByHistoryID( '60148' ).GetFullName]\nДата: 603 КЦ#!\n#weak Оборона деревни Дарроушир силами людей и паладинов против Орды нежити завершилась трагедией: дух капитана [GetScriptedCharacterByHistoryID( '60148' ).GetDynastyName] был подчинён рыцарем смерти [GetScriptedCharacterByHistoryID( '60679' ).GetFirstNameNicknamed], и защитники обратились против собственных жителей, уничтожив поселение.#!"
  
 BattlePoIHistoricalNameHunterShadows: "Охотник теней"
 BattlePoIHistoricalDescHunterShadows: "#emp Победитель: [GetScriptedCharacterByHistoryID( '10200' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '410002' ).GetFirstName]\nДата: 603 КЦ#!\n#weak Стражи Ночного эльфа во главе с полубогом [GetScriptedCharacterByHistoryID( '410002' ).GetFirstName] попытались выгнать клан Песни Войны из Ашенваля, но орки выпили [Glossary('Кровь Маннорота', 'BLOOD_OF_MANNOROTH_GLOSS')] и стали хаос-орками. Они перебили стражей и самого полубога, вновь став орудием Пылающего Легиона.#!"
  
 BattlePoIHistoricalNameFallQuelThalas: "Падение Кель'Таласа"
 BattlePoIHistoricalDescFallQuelThalas: "#emp Победитель: [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName]\nПовержен: [GetScriptedCharacterByHistoryID( '42002' ).GetFullName]\nДата: 603 КЦ#!\n#weak [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName] с армией Плети вторгся в [GetTitleByKey('e_quelthalas').GetName], стремясь осквернить Солнечный Колодец для воскрешения [GetScriptedCharacterByHistoryID( '59100' ).GetFirstName]. 90% высших эльфов погибли, столица лежала в руинах; события дали naissance народу кровавых эльфов.#!"
  
 BattlePoIHistoricalNameDemonsDriven: "Демонами гонимые"
 BattlePoIHistoricalDescDemonsDriven: "#emp Победители: [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName] и [GetScriptedCharacterByHistoryID( '48081' ).GetFirstName]\nПовержен: [GetScriptedCharacterByHistoryID( '10200' ).GetFullName]\nДата: 603 КЦ#!\n#weak Союз Орды [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName] и сил Альянса атаковал одержимый клан Песни Войны. После поимки [GetScriptedCharacterByHistoryID( '10200' ).GetFirstName] шаманы и жрецы изгнали из него демоническую кровь; вместе с [GetScriptedCharacterByHistoryID( '10200' ).GetFirstName] он сверг Маннорота ценой жизни Грома.#!"
  
 BattlePoIHistoricalNameDalaran: "Осада Даларана"
 BattlePoIHistoricalDescDalaran: "#emp Победитель: [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName]\nПовержен: [GetScriptedCharacterByHistoryID( '59000' ).GetFullName]\nДата: 603 КЦ#!\n#weak Плеть уничтожила магические барьеры Даларана, убила магов-хранителей и добыла Книгу [GetScriptedCharacterByHistoryID( '5000' ).GetFirstName]. Призывание Архимонда завершилось истреблением города, превращённого в руины.#!"
  
 BattlePoIHistoricalNameFlameSorrow: "Судьба огня и скорби"
 BattlePoIHistoricalDescFlameSorrow: "#emp Победитель: [GetScriptedCharacterByHistoryID( '340009' ).GetFullName]\nПовержен: [GetScriptedCharacterByHistoryID( '430000' ).GetFullName]\nДата: 603 КЦ#!\n#weak Архимонд приказал осквернить леса у Хиджала. Дредлорд [GetScriptedCharacterByHistoryID( '430000' ).GetFirstName] применил Череп [GetScriptedCharacterByHistoryID( '10015' ).GetFullName], создав Сквернолесье. [GetScriptedCharacterByHistoryID( '340009' ).GetFirstName] захватил артефакт, остановил порчу и победил Тихондрия, но был изгнан братом за использование демонической силы.#!"
  
 BattlePoIHistoricalNameMountHyjal: "Битва за гору Хиджал"
 BattlePoIHistoricalDescMountHyjal: "#emp Победители: [GetScriptedCharacterByHistoryID( '340003' ).GetFirstName], [GetScriptedCharacterByHistoryID( '340008' ).GetFirstName], [GetScriptedCharacterByHistoryID( '48081' ).GetFirstName] и [GetScriptedCharacterByHistoryID( '10021' ).GetFirstName]\nПовержен: Архимонд\nДата: 604 КЦ#!\n#weak Финальное сражение Третьей войны. Коалиция ночных эльфов, Альянса и Орды сдерживала Легион, пока [GetScriptedCharacterByHistoryID( '340008' ).GetFirstName] готовил ритуал. Когда Архимонд достиг Нордрассила, масса виспов взорвала Древо, испепелив демона и завершив Эпоху Хаоса.#!"
  
  
