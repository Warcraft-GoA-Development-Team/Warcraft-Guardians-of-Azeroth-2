 become_a_demon_hunter_decision:0 "Become a Demon Hunter"
 become_a_demon_hunter_decision_desc:0 "“You... were not prepared. The enemy came into our world, their only desire to extinguish all life. They slaughtered our loved ones. They razed our homes, our cities, and our sacred places. You tried to stop them... and you failed. And so you came to me, nothing remaining of you but rage and determination, and you learned that the things that once tormented you could give you power. Now you see that there is no sacrifice too great if it brings an end to the [burning_legion|E].”"
 become_a_demon_hunter_decision_confirm:0 "There is only one way to vanquish the Demons..."
 become_a_demon_hunter_decision_tooltip:0 "You get the trait [GetTrait('demon_hunter').GetName(GetNullCharacter)]"
