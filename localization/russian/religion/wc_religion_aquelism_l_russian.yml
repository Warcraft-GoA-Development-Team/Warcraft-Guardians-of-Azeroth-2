 aquelism_religion_desc: "Воды покрывают подавляющее большинство Азерота, и поэтому аквелиты провозглашают законную власть Властителей Вод над этим обширным водным царством. Они ищут способы освободить своих хозяев из заточения, наложенного древними Титанами, чтобы восстановить их законную власть над океанами мира и править безраздельно. Посредством ритуалов последователи чтят и умиротворяют воды, веря, что воля их богов выражается как в ярости, так и в спокойствии приливов."
  
