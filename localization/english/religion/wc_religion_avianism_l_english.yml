 #Anzuism-Group Faiths
 anzuism:0 "Anzuism"
 anzuism_adj:0 "Anzuli"
 anzuism_adherent:0 "Anzuli"
 anzuism_adherent_plural:0 "Anzulis"
 anzuism_desc:0 "A sect of $avianism_religion_adherent_plural$ who worship Anzu, the Raven God. Contrasting Rukhmar's love of the sun and sky, Anzu prefers the cool of the shade and the peace of the twilight hours, where he can be solitary in peaceful contemplation. He is the ancient enemy of Sethe, who cursed him long ago to be broken and flightless, along with many of his [GetTrait('creature_arakkoa_corrupted').GetName( GetNullCharacter )] followers."

 #Rukhmarism-Group Faiths
 rukhmarism:0 "Rukhmarism"
 rukhmarism_adj:0 "Rukhmari"
 rukhmarism_adherent:0 "Rukhmari"
 rukhmarism_adherent_plural:0 "Rukhmaris"
 rukhmarism_desc:0 "A branch of $avianism_religion_adherent_plural$ who worship Rukhmar, the Sun Goddess. After the god Anzu faded into darkness, Rukhmar created the [GetTrait('creature_arakkoa_corrupted').GetName( GetNullCharacter )] to represent a fusion of her grace and Anzu's cunning. As the mother of the [GetTrait('creature_arakkoa_corrupted').GetName( GetNullCharacter )], Rukhmar is considered to be their main and most traditional diety. Those who venerate her are believed to reunite with the mother in the skies after their passing."

 #Setheism-Group Faiths
 setheism:0 "Setheism"
 setheism_adj:0 "Setheli"
 setheism_adherent:0 "Setheli"
 setheism_adherent_plural:0 "Sethelis"
 setheism_desc:0 "A sect of $avianism_religion_adherent_plural$ who worship Sethe, the Dead God. He was slain by Anzu and Rukhmar, but before his death, Sethe created the Curse, causing many [GetTrait('creature_arakkoa_corrupted').GetName( GetNullCharacter )], as well as Anzu himself, to become flightless. Seen as an evil god by other $avianism_religion_adherent_plural$, $setheism_adherent_plural$ consider the Curse as a gift, a part of Sethe's divinity granted to his followers."
