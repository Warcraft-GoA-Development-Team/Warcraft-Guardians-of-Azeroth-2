  pam_1_timothy_6_12_latin: "[Glossary('Certa bonum certamen fidei, apprehende vitam aeternam, in qua vocatus es, et confessus bonam confessionem coram multis testibus.','1_TIMOTHY_6_12_LATIN_GLOSS')]"
  # Scholasticism Tenet
