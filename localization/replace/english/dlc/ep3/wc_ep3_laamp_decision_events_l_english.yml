l_english:

 #Storyteller #Warcraft
 ep3_laamp_decision_event.1031.desc_01: "#EMP "...and then he became enraged at this discovery, for the very first time the greatest warrior of the [Glossary( 'Pantheon', 'PANTHEON_GLOSS' )] felt fear. [Glossary( 'Sargeras', 'SARGERAS_GLOSS' )] then cleaved the planet in two, instantly killing the nascent titan it housed."#!"
 ep3_laamp_decision_event.1031.desc_02: "#EMP "...and that is how the large beings formed from the very crust of Azeroth came to be, the Titanforged. Lead by the Titankeepers in the war against the Black Empire, the Empire of the [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )]."#!"
 ep3_laamp_decision_event.1031.desc_03: "#EMP "...and then Kil'jaeden vowed to destroy his old friend, now arch-nemesis, Velen. Find him and his followers and destroy them... even if it took a thousand years."#!"
 ep3_laamp_decision_event.1031.desc_04: "#EMP "...and then the Elves screamed "Azshara save us!" "For Azshara" all while their Queen laughed as thousands of her kind were slaughtered. For all she desired now, was for a world as perfect as her and for her to be the Queen of the Dark Titan [Glossary( 'Sargeras', 'SARGERAS_GLOSS' )] Himself."#!"
 ep3_laamp_decision_event.1031.desc_05: "#EMP "...and then the Elves used the power of the well itself which not only stopped [Glossary( 'Sargeras', 'SARGERAS_GLOSS' )] from entering Azeroth, but also sent the Burning Legion back from whence they came. This victory did not come without consequences, as the destabalized [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )] imploded and caused what we know today as the Great Sundering which split the ancient continent of Kalimdor."#!"
 ep3_laamp_decision_event.1031.desc_06: "#EMP "...and then Archimonde razed the Violet Citadel and its inhabitants to the ground. It would be the scar that signified the first blow against the mortal world."#!"
 ep3_laamp_decision_event.1031.desc_07: "#EMP "...and then Grommash Hellscream with his Warsong clan went forth with their reddened skin and burning eyes and rageful hearts to slay the demi-god, Cenarius. Without realizing that Grommash had once more handed over his race into slavery to the Demons."#!"
 ep3_laamp_decision_event.1031.desc_08: "#EMP "...and after destroying the skull of Gul'dan and absorbing its powers for himself, Illidan Stormrage had abandoned his old form and soul to become a Demon to destroy another Demon. A decision that would not sit well with his brother Malfurion."#!"
 ep3_laamp_decision_event.1031.desc_09: "#EMP "...and while Archimonde was full of himself because of his victories, he was too blind to the plan laid out by Malfurion Stormwind. A mistake he could not regret over as this would be his end and a major defeat of the Burning Legion."#!"
 ep3_laamp_decision_event.1031.desc_10: "#EMP "...and when the spirits at the Throne of Elements rejected Gul'dan as they foresaw the darkness in his heart, Gul'dan was offered power immeasurable by Kil'jaeden in exchange for delivering the orcs to the Burning Legion and turn them into a weapon to destroy the [GetTrait('creature_draenei').GetName(GetNullCharacter)]."#!"
 ep3_laamp_decision_event.1031.desc_11: "#EMP "...and that is how Liadrin became the matriarch of the Blood Knights, the Lady of Light."#!"
 ep3_laamp_decision_event.1031.desc_12: "#EMP "...and in her zeal and obsession with justice, Maiev Shadowsong had become vengeance itself and bound forever to the hunt of the Betrayer."#!"
 ep3_laamp_decision_event.1031.desc_13: "#EMP "...and after the defeat of Galakrond, the Keepers called upon their creators, the mighty Titans to empower the proto-dragons. And then came forth the Dragon Aspects who would work together to safeguard Azeroth from threats."#!"
 ep3_laamp_decision_event.1031.desc_14: "#EMP "...and the worship of Elune came to be as the Night Elves believed the moon goddess was bound to the [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )]. The same [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )] that has granted the Kal'dorei virtually eternal life."#!"
 ep3_laamp_decision_event.1031.desc_15: "#EMP "...and after climbing the Frozen Throne and offering his soul to the [GetTrait('lich_king').GetName( GetNullCharacter )], Kel'thuzad returned to Lordaeron and secretly founded the Cult of the Damned. Recruiting the nobility and the lower classes at the promise of immortality."#!"
 ep3_laamp_decision_event.1031.desc_16: "#EMP "...and after the Cataclysm, the Zandalari prophet Zul and his followers traveled around the world to unite all trolls and build a united troll empire."#!"
 ep3_laamp_decision_event.1031.desc_17: "#EMP "...and even if Varimathras survived the betrayal of the [GetTrait('lich_king').GetName( GetNullCharacter )], even betraying his own [GetTrait('creature_nathrezim').GetName(GetNullCharacter)] to safeguard himself... he did not survive betraying the cunning Sylvanas Windrunner."#!"
 ep3_laamp_decision_event.1031.desc_18: "#EMP "...and as Azshara and her followers were being dragged beneath the waves because of the [Glossary( 'Great Sundering', 'GREAT_SUNDERING_GLOSS' )], in desperation she made a deal with the [Glossary( 'Old God', 'OLD_GODS_GLOSS' )] [Glossary( 'N’Zoth', 'NZOTH_GLOSS' )] to be saved from a frozen death in the frigid seas... and then all of her followers and herself transformed into what we know today as the [GetTrait('creature_naga').GetName(GetNullCharacter)]."#!"
 
 ep3_laamp_decision_event.1000.desc_outro_regional_kalimdor_returned_01: "\n\nA pack of sabers prance through the woods, scouting for their next prey."
 ep3_laamp_decision_event.1000.desc_outro_regional_kalimdor_returned_02: "\n\nOver yonder, priestesses of Elune sing a prayer to her quietly."
 ep3_laamp_decision_event.1000.desc_outro_cultural_orcish_returned_01: "\n\nNearby, peons scatter in attempt to finish their tasks, while others work like drones."
 ep3_laamp_decision_event.1000.desc_outro_cultural_draenei_returned_01: "\n\nElekks trot around the terrain, with their riders sitting calmly."
 ep3_laamp_decision_event.1000.desc_outro_cultural_dwarven_returned_01: "\n\nDwarven hunters mark their prey around our path, with gunshots and the sounds of wounded animals filling the air."
 ep3_laamp_decision_event.1000.desc_outro_regional_ek_returned_01: "\n\nCinders fly about as blacksmiths work their magic, with techniques that rival ancient dwarven methods."
 ep3_laamp_decision_event.1000.desc_outro_cultural_gnomish_returned_01: "\n\nA group of mechanostriders prance about robotically, their gears erupting in noise."
 ep3_laamp_decision_event.1000.desc_outro_cultural_gnomish_goblin_returned_02: "\n\nThe [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] engineers of [ROOT.Char.Custom('SettlementCity')|l] work and tinker tirelessly on gadgets and various inventions."
 ep3_laamp_decision_event.1000.desc_outro_cultural_pandaren_returned_01: "\n\nThe [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] monks train amongst each other, with various spars occurring throughout the valley."
 ep3_laamp_decision_event.1000.desc_outro_regional_quelthalas_returned_01: "\n\nHawkstriders of [ROOT.Char.Custom('SettlementCity')|l] gawk and scutter about, causing bits of chaos to the other animals."
