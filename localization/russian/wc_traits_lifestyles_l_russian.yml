 trait_user_of_death_magic_1_desc: "Некромант — тёмный заступник мёртвых и мерзостная погибель живых. Его порождения нежити терроризируют земли, пока сам он сокрушает противников искажённой магией. Живые страшатся его имени, а мёртвые стекаются к нему."
