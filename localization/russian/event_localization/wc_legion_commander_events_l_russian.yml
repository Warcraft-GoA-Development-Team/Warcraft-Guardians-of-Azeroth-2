l_russian:
  
 legion_commander_0001_title: "Воля [ROOT.Char.GetFaith.HighGodName]"
 legion_commander_0001_desc: "Я слышу голос, зовущий меня в моих беспокойных снах: #XB «Восстань... кровь [GetTrait('being_demon').GetName(GetNullCharacter)]ов, текущая в тебе, не пропадёт впустую... восстань... и затем сожги всё дотла... пусть эти силы, что я дарую тебе, пылают в тебе ярче прежнего!»#!\n\nЯ просыпаюсь в поту и оглядываюсь с оружием в руке, но здесь никого нет. Однако я чувствую это — бодрящую мощь! С ней я могу победить кого угодно!.. Но разумно ли просто принять их?"
 legion_commander_0001_a: "Пусть этот мир пылает!"
 legion_commander_0001_b: "Я не стал бы рисковать ни гневом, ни милостью [ROOT.Char.GetFaith.HighGodName]"
  
 legion_commander_0002_title: "Неудача тогда, неудача сейчас"
 legion_commander_0002_desc: "Чем больше я терплю неудач, тем отчётливее слышу голоса, что звучали тогда... моя сила угасает. Мои дары иссякли.\n\nЯ в панике оборачиваюсь, слыша громкий голос: #XB «Неудачник!»#!, но вокруг ни души... Я опускаюсь на свой трон, в надежде, что не совершил тогда ужасной ошибки..."
 legion_commander_0002_a: "Нет... этого не может быть..."
 legion_commander_0002_a_die: "#XB Гнусная магия из-за границ реальности разрывает тебя на части...#!"
 legion_commander_0002_a_live: "#P Ты пощажён... пока что...#!"
