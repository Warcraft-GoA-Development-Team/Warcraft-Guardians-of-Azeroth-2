l_english:
 #Generic Lines
 historical_commander_trait.reject.tt:1 "#I You will look elsewhere for inspiration #!"
 historical_commander_trait.wct:0 "[ROOT.Char.Custom('MartialLessonCultureLoc')] Battle Exercises - Lesson "
 historical_commander_trait.wcd:0 "While studying this ancient but well-known text regarding [ROOT.Char.Custom('MartialLessonCultureLoc')] tactics I came across the following interesting exercise:\n\n"
 historical_commander_highborne:0 "Ranger"
 historical_commander_night_elf:0 "Sentinel"
 historical_commander_human:0 "Arathi"
 historical_commander_troll:0 "Zulian"
 historical_commander_draenor:0 "Gorian"
 historical_commander_titan:0 "Titan"
 historical_commander_pandaria:0 "Mogu"
 historical_commander_fallback:0 "Elven"
 
 #Hannibal
 historical_commander_trait.0001.t:0 "$historical_commander_trait.wct$1"
 historical_commander_trait.0001.desc:1 "$historical_commander_trait.wcd$ #highlight On a long campaign behind enemy lines, you receive news from a messenger that a small force has maneuvered around your army and threatens your supply trains. Intelligence on the size of the force is reliable and your army could wipe it out, however this would result in the invasion losing ground overall. What would you do?#!"
 historical_commander_trait.0001.a:0 "Attack head-on before supplies run out!"
 historical_commander_trait.0001.b:0 "Reinforce our supply lines and outlast the enemy."
 historical_commander_trait.0001.c:0 "Judiciously distribute forces to deal with any threat."
 historical_commander_trait.0001.d:0 "I can't learn anything from this."
 #Caesar
 historical_commander_trait.0002.t:0 "$historical_commander_trait.wct$2"
 historical_commander_trait.0002.desc:0 "$historical_commander_trait.wcd$ #highlight The enemy has ensconced their force in a hilltop fortress and is attempting bait you into a siege until reinforcements can be brought in. You know the general direction that these reinforcements will attack from but you are unsure if you will have enough forces to resist an attack from both sides. What will you do?#!"
 historical_commander_trait.0002.a:0 "Surround the castle with our own fortifications."
 historical_commander_trait.0002.b:0 "Camp along the approach and bait an attack."
 historical_commander_trait.0002.c:0 "Split our forces and set up an ambush."
 historical_commander_trait.0002.d:0 "Ugh, Aerial forces have made this kind of siege obsolete..."
 #Alexander
 historical_commander_trait.0003.t:0 "$historical_commander_trait.wct$3"
 historical_commander_trait.0003.desc:0 "$historical_commander_trait.wcd$ #highlight Your nation has been invaded and you are tasked with eliminating an infiltrating force who is using a river to resupply. Your harrassing attacks have resulted in their retreat to a small thickly forested island with a possible approach at the far side of the river. The environs are home to abundant stone and lumber but a siege would deprive the homeland of needed forces and supplies. What is your solution?#!"
 historical_commander_trait.0003.a:0 "Build boats and invade across the river!"
 historical_commander_trait.0003.b:0 "Build a causeway to increase our offensive options."
 historical_commander_trait.0003.c:0 "Raid their supply ships and start a wildfire on the island!"
 historical_commander_trait.0003.d:0 "This is a classic siege, the main defense will have to do without."

 #Constantine
 historical_commander_trait.0004.t:0 "$historical_commander_trait.wct$4"
 historical_commander_trait.0004.desc:0 "$historical_commander_trait.wcd$ #highlight You are tasked with the defense of a mountain pass. Unfortunately, you have received word that your force has been cut off from both sides. There is enough supply to last the winter and a local convent that can be used as a temporary fortress. The local population is skilled in mountaineering and eager to join the defense.#!"
 historical_commander_trait.0004.a:0 "Settle in for the winter and pray to boost morale."
 historical_commander_trait.0004.b:0 "Retreat into the mountains and harass their forces!"
 historical_commander_trait.0004.c:0 "Use the locals to bait one of their armies into a decisive battle."
 historical_commander_trait.0004.d:0 "This is clearly an unwinnable situation!"

 #Khalid ibn al-Walid
 historical_commander_trait.0005.t:0 "$historical_commander_trait.wct$5"
 historical_commander_trait.0005.desc:0 "$historical_commander_trait.wcd$ #highlight The situation is dire; a bloodthirsty enemy outnumbers your forces 3 to 1 and is bearing down on an undefended town! Your imperative is to save the townspeople from slaughter. The enemy is fierce and confident but lacks mobility, making straight for the town across open farmlands. What is your course of action?#!"
 historical_commander_trait.0005.a:0 "Inspire the townspeople to rise up! For [ROOT.Char.GetFaith.HighGodName]!"
 historical_commander_trait.0005.b:0 "Use our superior mobility to surround the enemy."
 historical_commander_trait.0005.c:0 "Evacuate the townspeople to supplement our supply train."
 historical_commander_trait.0005.d:0 "The town will be sacrificed for the greater good."

 #Bilge Khagan
 historical_commander_trait.0006.t: "$historical_commander_trait.wct$6"
 historical_commander_trait.0006.desc: "$historical_commander_trait.wcd$ #highlight You have been tasked with organizing the defense of an important farming region. The enemy invasion force has surrounded the region on three sides but so far has not constructed any fortifications nor taken any of yours. If any fields are burned or granaries raided, your nation will suffer great famines come wintertime and face utter surrender. All available forces are at your disposal to deal with this threat. How do you defend the region?#!"
 historical_commander_trait.0006.a: "Shore up our fortresses, ensure no gaps in our defensive line."
 historical_commander_trait.0006.b: "Leverage the region's resources to mount a mobile defense.
 historical_commander_trait.0006.c: "Probe, isolate, and crush their thinly spread forces."
 historical_commander_trait.0006.d: "I would never allow such a situation to occur!"
