 WCHEA.1002.a: "Сделай теплее!"
 WCHEA.1002.court_physician.desc: "\n\n«Похоже, вас поразил мороз [ROOT.Char.GetFaith.DeathDeityName], мой [ROOT.Char.GetLadyLord]»."
 WCHEA.1002.desc: "Я никак не могу согреться. Сколько слоёв одежды я бы на себя ни намотал, холод пробирает до костей. Дыхание обжигает лёгкие льдом, а кожа бледнеет, почти синеет. Пальцы немеют и коченеют, руки не перестают дрожать.\n\nСтужа проникает глубже, в самые кости, замораживая меня изнутри. Каждый вдох даётся всё труднее и медленнее. Я замерзаю заживо."
 WCHEA.1002.t: "[SCOPE.Custom('EventTitleDisease')]: Замерзание"
 WCHEA.1003.a: "Я чувствую, как гниёт моя кожа..."
 WCHEA.1003.court_physician.desc: "\n\n«Мой [ROOT.Char.GetLadyLord], похоже, вас поразила Склеповая лихорадка»."
 WCHEA.1003.desc: "Я чувствую их. Они ползают. Под моей кожей, извиваясь, как черви. Я чешусь и чешусь, но это не прекращается. Кожа обвисает и сереет, и я клянусь, что под ней что-то шевелится. Мышцы ноют, будто гниют изнутри.\n\nСуставы сводит, они застывают, словно я уже мёртв не первый день. Каждая частица меня источает запах тления. Я едва могу двигаться, но это не прекращается — ничто не остановит гниение."
 WCHEA.1003.t: "[SCOPE.Custom('EventTitleDisease')]: Гниение изнутри"
 WCHEA.1004.a: "Сделай же что-нибудь, умоляю!"
 WCHEA.1004.court_physician.desc: "\n\n«Серьёзнейший недуг, мой [ROOT.Char.GetLadyLord]. В более учёных кругах это называют Кровавой чумой»."
 WCHEA.1004.desc: "Мои вены горят. Я вижу, как они темнеют и вздуваются под кожей, пульсируя, будто готовы лопнуть. Жар невыносим, а руки трясутся, слабеют и покрываются не перестающими расползаться язвами.\n\nКровь сочится из трещин на коже, и каждый вдох отдаёт железом. Болезнь распространяется быстро, слишком быстро. Я не могу её остановить. Моя кровь обратилась против меня, отравляя меня изнутри."
 WCHEA.1004.t: "[SCOPE.Custom('EventTitleDisease')]: Осквернённые вены"
 WCHEA.1005.a: "Бездна зовёт меня..."
 WCHEA.1005.court_physician.desc: "\n\n«Мой [ROOT.Char.GetLadyLord], похоже, вы страдаете от Болезни Бездны»."
 WCHEA.1005.desc: "Я чувствую это. Тьму. Она подбирается, просачивается сквозь кожу, в самые кости. Разум затуманен, мысли перекручены, и я не могу избавиться от ощущения, что за мной кто-то наблюдает. Кожа чернеет, будто гниёт изнутри.\n\nРуки трясутся, дрожат, и я не могу их остановить. Шёпот не прекращается. Он становится громче, ближе. Я не могу сбежать от Бездны."
 WCHEA.1005.t: "[SCOPE.Custom('EventTitleDisease')]: Объятия Бездны"
 WCHEA.1006.a: "Я не смогу бодрствовать гораздо дольше..."
 WCHEA.1006.court_physician.desc: "\n\n«Похоже, на вас действует Проклятие истощения, мой [ROOT.Char.GetLadyLord]»."
 WCHEA.1006.desc: "Даже утренние прогулки лишают меня сил. Чтобы прошептать, нужно столько же усилий, сколько на крик, даже веки тяжелеют.\n\nЛюбая сила во мне угасает, и смерть зовёт меня, хватая, как рука чернокнижника. Я жажду лишь покоя и сна — всего, что избавит меня от этой слабости."
 WCHEA.1006.t: "[SCOPE.Custom('EventTitleDisease')]: Нескончаемое желание отдыха"
 WCHEA.1007.a: "Слова ускользают от меня."
 WCHEA.1007.court_physician.desc: "\n\n«Мой [ROOT.Char.GetLadyLord]! Это может быть только Проклятие языков»."
 WCHEA.1007.desc: "Говоря, я чуть не давлюсь собственным языком, что приводит меня в невыразимое замешательство. Мои слова звучат так, будто я немой или у меня сильная шепелявость.\n\nКак я могу так себя вести? Даже предложения у меня в голове превращаются в кашу из слов и фраз."
 WCHEA.1007.t: "[SCOPE.Custom('EventTitleDisease')]: Мои срывающиеся слова"
 WCHEA.1008.a: "Я слаб и хил."
 WCHEA.1008.court_physician.desc: "\n\n«Не тревожьтесь, мой [ROOT.Char.GetLadyLord]. Но на вас наложено Проклятие немощи»."
 WCHEA.1008.desc: "Каждое движение отнимает у меня все силы. Руки и ноги тяжелы, как валуны. Я не могу ни сражаться, ни поднять даже чашку без мучительной боли.\n\nНеужели меня придётся носить, как младенца? Каждый раз, покидая опочивальню, я делаю это со страхом — и всё из-за этой слабости, что поразила меня."
 WCHEA.1008.t: "[SCOPE.Custom('EventTitleDisease')]: Угасающая сила"
 WCHEA.1009.a: "Стихии против меня..."
 WCHEA.1009.court_physician.desc: "\n\n«Мой [ROOT.Char.GetLadyLord], похоже, вас поразило Проклятие стихий»."
 WCHEA.1009.desc: "По моему телу пробегает леденящее ощущение, словно сами стихии сговорились против меня. Кожа покрывается мурашками, а неестественный холод проникает в кости. Я чувствую странную энергию, одновременно манящую и опасную, клубящуюся внутри меня.\n\nМой разум лихорадочно ищет источник этой напасти. Проклятие могущественно, и его действие неоспоримо. Я должен найти способ противодействовать ему, прежде чем оно поглотит меня целиком."
 WCHEA.1009.t: "[SCOPE.Custom('EventTitleDisease')]: Ярость стихий"
 WCHEA.1010.a: "Я не могу сдерживать свои порывы..."
 WCHEA.1010.court_physician.desc: "\n\n«Мой [ROOT.Char.GetLadyLord], похоже, вас поразило Проклятие безрассудства»."
 WCHEA.1010.desc: "На меня накатывает внезапное желание действовать не думая. Разум переполняют импульсивные мысли, и я чувствую неконтролируемую тягу к безрассудным поступкам.\n\nПроклятие затуманивает рассудок, превращая даже простые решения в источник опасности. Я должен найти способ противостоять его влиянию, прежде чем оно приведёт меня к гибели."
 WCHEA.1010.t: "[SCOPE.Custom('EventTitleDisease')]: Безрассудный и неумолимый"
 WCHEA.1011.a: "Моё тело меняется..."
 WCHEA.1011.court_physician.desc: "\n\n«Мой [ROOT.Char.GetLadyLord], похоже, вас поразило Проклятие мутации»."
 WCHEA.1011.desc: "Моё тело ощущается странно, словно сама моя суть искажается. Конечности кажутся непропорциональными, а черты лица меняются неестественным образом. Я ловлю в зеркале отблески перемен, и меня охватывает тревога.\n\nПроклятие изменяет мой генетический код, и я боюсь того, кем могу стать. Я должен найти способ противостоять этой мутации, прежде чем она полностью завладеет мной."
 WCHEA.1011.t: "[SCOPE.Custom('EventTitleDisease')]: Проклятие мутации"
 WCHEA.1101.a: "Я снова почувствую объятия солнца."
 WCHEA.1101.desc: "Я медленно поднимаюсь, и моё дыхание больше не висит в воздухе дымкой зимнего утра. Пронизывающий холод, что дни напролёт сковывал мои кости, наконец отступил. Кожа, прежде бледная и онемевшая, наливается теплом — непривычным ощущением.\n\nЯ сжимаю пальцы, ожидая знакомой скованности, но они слушаются с лёгкостью. Бесконечная дрожь прекратилась, и мои конечности благословенно неподвижны.\n\nЯ выдыхаю, смакуя тишину. Стужа ушла, а с ней — и страх. Покой. Как же я забыл его объятия."
 WCHEA.1101.t: "[SCOPE.Custom('EventTitleDisease')]: Тепло солнца"
 WCHEA.1102.a: "Я свободен от гниения."
 WCHEA.1102.desc: "Я выпрямляюсь, и впервые за много дней по моей коже больше не ползают невидимые твари. Тление, что пробиралось сквозь плоть, отступило, не оставив ни гноящихся ран, ни почерневших участков. Руки, прежде дрожащие и слабые, снова твёрды.\n\nЯ прижимаю ладонь к груди, ожидая возвращения грызущей боли, но её нет — гниение больше не точит мои кости.\n\nЯ делаю глубокий вдох, и воздух свободен от этой вони. Облегчение накатывает на меня. Покой. Я почти забыл, каково это."
 WCHEA.1102.t: "[SCOPE.Custom('EventTitleDisease')]: Больше никакого гниения"
 WCHEA.1103.a: "Чума больше не владеет моей кровью."
 WCHEA.1103.desc: "Я медленно сажусь, готовясь к жжению под кожей, но его нет. Лихорадка, что кипятила мою кровь, ушла, и вены больше не пульсируют почерневшей хворью. Я смотрю на руки, ожидая привычных сочащихся ран, но язвы закрылись, оставив лишь бледные шрамы.\n\nЯ сжимаю пальцы, и они двигаются без боли — больше нет ни пульсации, ни слабости.\n\nЯ глубоко дышу, и воздух свободен от этого кислого металлического привкуса. Я выдыхаю, ощущая лёгкость. Покой. Как долго он ускользал от меня?"
 WCHEA.1103.t: "[SCOPE.Custom('EventTitleDisease')]: Очищенные вены"
 WCHEA.1104.a: "Мой разум ясен, моя душа свободна."
 WCHEA.1104.desc: "Я встаю, и солнце приветствует меня. Так давно я не видел света и не был свободен от хватки Бездны. Тьма, окутывавшая меня, рассеялась.\n\nМир без страха перед тенями. Мир, в котором я снова буду жить."
 WCHEA.1104.t: "[SCOPE.Custom('EventTitleDisease')]: Свет возвращается"
 WCHEA.1105.a: "Я снова силён."
 WCHEA.1105.desc: "Сила, которой я когда-то обладал, возвращается ко мне. Мои кости, прежде хрупкие и слабые, больше не скрипят под тяжестью. С каждым мгновением я ощущал себя всё слабее — я был так немощен, что не мог даже удержать книгу на коленях. Сила рук и ног возвращается, и я снова могу ходить без страха упасть.\n\nЯ чувствую, как мощь моего тела возвращается, и благодарен за это. Покой. Как давно я не ощущал себя так?"
 WCHEA.1105.t: "[SCOPE.Custom('EventTitleDisease')]: Снова силён"
 WCHEA.1106.a: "Мой голос свободен."
 WCHEA.1106.desc: "Я говорю, и слова даются легко. Проклятие, заставившее меня замолчать, исчезло, и мой голос снова свободен.\n\nЯ смеюсь — звук, которого я не слышал, кажется, целую вечность. Я владею речью легко и непринуждённо, как и должно было быть всегда."
 WCHEA.1106.t: "[SCOPE.Custom('EventTitleDisease')]: Освобождённый язык"
 WCHEA.1107.a: "Ко мне возвращаются силы."
 WCHEA.1107.desc: "Я встаю, и груз проклятия спал. Конечности больше не налиты свинцом, и дышать легко. Истощение, что поглотило меня, ушло, и я снова чувствую себя живым.\n\nЯ делаю глубокий вдох, смакуя свободу."
 WCHEA.1107.t: "[SCOPE.Custom('EventTitleDisease')]: Истощение снято"
 WCHEA.1108.a: "Стихии снова в гармонии."
 WCHEA.1108.desc: "Я встаю, и проклятие, сковывавшее стихии, снято. Хаотические силы, клубившиеся вокруг меня, утихли, и я снова чувствую гармонию с миром.\n\nЯ делаю глубокий вдох, ощущая, как элементальные энергии свободно текут вокруг меня. Покой. Равновесие восстановлено."
 WCHEA.1108.t: "[SCOPE.Custom('EventTitleDisease')]: Стихии восстановлены"
 WCHEA.1109.a: "Мной больше не движет слепая сила."
 WCHEA.1109.desc: "Я встаю, и проклятие, толкавшее меня на безрассудные поступки, снято. Импульсивные порывы, затуманивавшие рассудок, исчезли, и я чувствую спокойствие и ясность.\n\nЯ делаю глубокий вдох, смакуя обретённый контроль над своими действиями."
 WCHEA.1109.t: "[SCOPE.Custom('EventTitleDisease')]: Безрассудство улеглось"
 WCHEA.1110.a: "Моё тело восстановлено."
 WCHEA.1110.desc: "Я встаю, и проклятие, искажавшее моё тело, снято. Неестественные изменения, менявшие мой облик, обратились вспять, и я снова ощущаю себя цельным.\n\nЯ рассматриваю своё отражение — искажения исчезли. Моё тело снова принадлежит мне, и я свободен от мутации."
 WCHEA.1110.t: "[SCOPE.Custom('EventTitleDisease')]: Мутация обращена вспять"
