 life_magic_tree_3_perk_6_desc: "Путешествуя по типу местности, вы получаете 0.5 настройки на биом для этой местности.\n\nНастройка на биом даёт небольшой накапливаемый бонус к безопасности путешествий и к лимиту снабжения в этой местности.\n\nС помощью решения вы можете пожертвовать все уровни настройки на биом, чтобы увеличить преимущество в этой местности и усилить эффект заклинания, сотворённого на провинцию с такой местностью. Вы можете быть настроены лишь на один биом за раз."
