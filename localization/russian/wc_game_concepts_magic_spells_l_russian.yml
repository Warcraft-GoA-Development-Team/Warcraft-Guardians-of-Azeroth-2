 game_concept_wc_spell_summon_void_leader: "Призыв Предводителя Бездны"
 game_concept_wc_spell_summon_void_leader_desc: "Вглядитесь в бескрайнюю Бездну, ухватите одного из её воинов и приведите его в наш мир."
 wc_spell_summon_void_leader_type: "[wc_spell_type_summon|E]"
 wc_spell_summon_void_leader_targets: "[character|E]"
 wc_spell_summon_void_leader_effects: "Призывает могущественное [GetTrait('being_void').GetName(GetNullCharacter)] [culture|E] цели и случайной [faith|E] [GetReligionByKey('shathgral_religion').GetAdjective] (той же конфессии, если цель исповедует теневую веру) с высоким [martial|E] ко двору цели. Предводителя Бездны можно призвать ко двору лишь раз в 3 года."
 wc_learn_spell_summon_void_leader: "Вы изучаете заклинание: [wc_spell_summon_void_leader|E]"
