 # Digging up the Dead
 msg_killed_paladin_title:0 "Paladin Killed"

 wc_path_of_the_damned.2004.title:0 "The Last Stand of [defender.GetNickname]"
 wc_path_of_the_damned.2004.title_no_nickname:0 "The Last Stand of [defender.GetFirstName]"
 wc_path_of_the_damned.2004.desc_attacker_silverhand:0 "An arrow strikes Steadfast. The steed cries out in pain as it collapses beneath its rider. [defender.GetFirstNameNoTooltip] grimaces as [defender.GetSheHe] struggles free from beneath the fallen horse. Too late. I am already upon [defender.GetHerHim]. [defender.GetSheHe|U] rises to [defender.GetHerHis] feet, hatred burning in [defender.GetHerHis] eyes.\n\n"Your father ruled this land for many years, and you've ground it to dust in a matter of days," [defender.GetSheHe] said bitterly.\n\nI meet [defender.GetHerHis] gaze. "Very dramatic, [defender.GetFirstName]. Give me the urn, and I'll make sure you die quickly."\n\n"The urn contains your father's ashes [attacker.GetFirstName]! What, were you hoping to piss on them one last time before you left this kingdom to rot?"\n\nI chuckle. "I didn't know what it held. Nor does it matter. I'll take what I came for one way or another.""
 wc_path_of_the_damned.2004.desc_attacker_silverhand_not_father:0 "An arrow strikes Steadfast. The steed cries out in pain as it collapses beneath its rider. [defender.GetFirstNameNoTooltip] grimaces as [defender.GetSheHe] struggles free from beneath the fallen horse. Too late. I am already upon [defender.GetHerHim]. [defender.GetSheHe|U] rises to [defender.GetHerHis] feet, hatred burning in [defender.GetHerHis] eyes.\n\n"[plagued_king.GetFirstName] ruled this land for many years, and you've ground it to dust in a matter of days," [defender.GetSheHe] said bitterly.\n\nI meet [defender.GetHerHis] gaze. "Very dramatic, [defender.GetFirstName]. Give me the urn, and I'll make sure you die quickly."\n\n"The urn contains the [plagued_king.GetTitleAsNamePossessiveNoTooltip] [attacker.GetFirstName]! What, were you hoping to piss on them one last time before you left this kingdom to rot?"\n\nI chuckle. "I didn't know what it held. Nor does it matter. I'll take what I came for one way or another.""
 wc_path_of_the_damned.2004.desc_attacker_fallback:0 "The armies of [defender.GetFirstNameNoTooltip] have fallen. Victory is mine. Only the urn remains. I walk toward [defender.GetHerHim] without haste, surrounded by the dead I command. [defender.GetSheHe|U] still stands tall, calm and defiant, while the shadows of my ghouls stretch over [defender.GetHerHim].\n\n"Greetings. Have you come to pay homage to our former leader?" [defender.GetSheHe] says calmly.\n\nI meet [defender.GetHerHis] gaze. "Amusing, [defender.GetFirstName], but I have no time for pleasantries. I am here to test your mettle."\n\n"You will not take the urn. And I will purge your kind from this world."\n\nI allow myself a faint smile. "You glow with overconfidence. Prepare to be embraced by oblivion.""

 wc_path_of_the_damned.2004.desc_defender_silverhand:0 "shabadoubadou"
 wc_path_of_the_damned.2004.desc_defender_silverhand_not_father:0 "shabadoubadou"
 wc_path_of_the_damned.2004.desc_defender_fallback:0 "shabadoubadou"
 wc_path_of_the_damned.2004.a:0 "Ghouls, attack."
 wc_path_of_the_damned.2004.b:0 "Come, then, shadow-spawn!"

 wc_path_of_the_damned.2005.title:0 "The End of [defender.GetNickname]"
 wc_path_of_the_damned.2005.title_no_nickname:0 "The End of [defender.GetFirstName]"
 wc_path_of_the_damned.2005.desc_attacker_silverhand:0 "My blade strikes deep into [defender.GetFirstNamePossessive] flesh, piercing through [defender.GetHerHis] armor. The terrible pain tears a cry from the paladin as [defender.GetSheHe] sinks to [defender.GetHerHis] knees. Each breath is an unbearable ordeal. Hot blood streams from [defender.GetHerHis] mouth, staining [defender.GetHerHis] chin.\n\nI let out a slow breath before advancing, implacable.\n\n"I dearly hope there's a special place in [defender.GetFaith.NegativeAfterLife] waiting for you, [attacker.GetFirstName]." [defender.GetFirstNamePossessiveNoTooltip] voice trembles with anger and pain.\n\n"We may never know, [defender.GetFirstName]. I intend to live forever."\n\nThe runes etched into my blade flare. [frostmourne.GetName] hungers."
 wc_path_of_the_damned.2005.desc_attacker_fallback:0 "[defender.GetFirstName] has fought for long minutes against endless waves of my ghouls. Many have fallen, but eventually even the strongest are consumed by the tide of the dead. Mortally wounded, [defender.GetSheHe] is finally brought to [defender.GetHerHis] knees. I raise a hand, and the carnage ceases. I draw [frostmourne.GetNameNoTooltip] and slowly approach [defender.GetHerHim].\n\n"I shall take my place among [defender.GetFaith.PositiveAfterLife]... but you, [attacker.GetFirstName], will writhe in the depths of [defender.GetFaith.NegativeAfterLife]," [defender.GetSheHe] spits the words through blood.\n\n"We may never know, [defender.GetFirstName]. I intend to live forever."\n\nThe runes etched into my blade flare. [frostmourne.GetName] hungers."
 wc_path_of_the_damned.2005.desc_defender_silverhand:0 "salut"
 wc_path_of_the_damned.2005.desc_defender_fallback:0 "salut"
 wc_path_of_the_damned.2005.a:0 "Goodbye, [defender.GetFirstNameNoTooltip]."
 wc_path_of_the_damned.2005.b:0 "[defender.GetFaith.HighGodName3], save my soul."

 last_stand_of_defender_effect.prowess.tt.success:0 "Success"
 last_stand_of_defender_effect.prowess.tt.failure:0 "failure"

 msg_urn_turns_into_a_phylactery.t:0 "A New Phylactery"
 msg_urn_turns_into_a_phylactery.d:0 "The ashes of its former occupant are scattered to the winds. The remains of the necromancer now lie within the urn.\n\nYou unlock [GetDecision('invade_scourge_quelthalas_decision').GetName|l] [decision|e]."