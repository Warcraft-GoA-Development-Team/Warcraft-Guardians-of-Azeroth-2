l_russian:
  
 wanderer_lifestyle_events.30.a.tt_wc: "Вы можете получить дополнительный опыт [wanderer_lifestyle|E] или [stress_loss|E], если [travel|E] через регион, упомянутый в истории."
  
 wanderer_lifestyle_events.30.desc_wc: "Листая свои книги, я нахожу путевой дневник знаменитого и много странствовавшего торговца и замираю на одном занятном отрывке:\n\n"#emp Мы продвигались по диким землям [ROOT.Char.Custom('DistantLandsLoc')], [ROOT.Char.Custom('DistantLandsObservationTypeLoc')]. Из того, что мы смогли разглядеть — [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')]. Истинно, в мире нет ничего подобного!#!"\n\nНе успеваю опомниться, как начинаю мечтать о встрече с подобным существом в дикой природе."
  
 DistantLandsQuelthalas: "Кель'Талас"
 DistantLandsLordaeron1: "Арати"
 DistantLandsLordaeron2: "Гилнеас"
 DistantLandsLordaeron3: "Внутренние земли"
 DistantLandsKhazModan1: "Дун Морог"
 DistantLandsKhazModan2: "озеро Лок Модан"
 DistantLandsKhazModan3: "Пылающие степи"
 DistantLandsKhazModan4: "Тлеющее ущелье"
 DistantLandsAzeroth1: "Западный Край"
 DistantLandsAzeroth2: "Тернистая долина"
 DistantLandsAzeroth3: "Сумеречный лес"
 DistantLandsAzeroth4: "Чернотопь"
 DistantLandsNorthKalimdor1: "Ясеневый лес"
 DistantLandsNorthKalimdor2: "Азшара"
 DistantLandsNorthKalimdor3: "Зимние Ключи"
 DistantLandsNorthKalimdor4: "Темные берега"
 DistantLandsCentralKalimdor1: "Когтистые горы"
 DistantLandsCentralKalimdor2: "Пустоши"
 DistantLandsCentralKalimdor3: "Степи"
 DistantLandsCentralKalimdor4: "Пылевые топи"
 DistantLandsSouthKalimdor1: "Танарис"
 DistantLandsSouthKalimdor2: "Кратер Ун'Горо"
 DistantLandsSouthKalimdor3: "Фералас"
 DistantLandsSouthKalimdor4: "Тысяча Игл"
  
 DistantLandsQuelthalas_observation: "мы заметили дракондора, парящего среди золотых крон деревьев"
 DistantLandsQuelthalas_description: "его сверкающие чешуя и перья переливались радужным сиянием"
  
 DistantLandsLordaeron1_observation: "наш отряд наткнулся на ужасающую сцену: гигантский тарантул пожирал свою добычу"
 DistantLandsLordaeron1_description: "его белоснежная шерсть была тоньше шёлка и переливалась на чёрном хитиновом теле"
 DistantLandsLordaeron2_observation: "наш караван проходил мимо дупла, где нас настороженно изучал редкий чёрнолесый лис"
 DistantLandsLordaeron2_description: "его коренастое тело было покрыто ярко-рыжей шерстью, а глаза светились золотом"
 DistantLandsLordaeron3_observation: "над нашим лагерем пронёсся грифон, оглашая лес пронзительным криком"
 DistantLandsLordaeron3_description: "его белоснежные перья и золотая шерсть сияли, пока он парил над верхушками деревьев"
  
 DistantLandsKhazModan1_observation: "мы замерли от ужаса, когда увидели огромного гризли"
 DistantLandsKhazModan1_description: "зверь был покрыт густой бурой шерстью, а его когти были размером с клинки фальчионов"
 DistantLandsKhazModan2_observation: "мы сделали остановку, чтобы порыбачить, и один из наших вытащил яркоокого лосося"
 DistantLandsKhazModan2_description: "его яркая окраска сочеталась с огромной головой и зубами, острыми как сталь"
 DistantLandsKhazModan3_observation: "мы почувствовали, что за нами следят, и вскоре заметили стаю скальных койотов"
 DistantLandsKhazModan3_description: "песчаные хищники двигались стаей, а вожак был почти вдвое крупнее остальных"
 DistantLandsKhazModan4_observation: "нас подстерегла жуткая лавовая паучиха в раскалённой магмой расселине"
 DistantLandsKhazModan4_description: "её суставы светились кровью Азерота, а челюсти и панцирь сверкали обсидианом"
  
 DistantLandsAzeroth1_observation: "мы прошли мимо гигантского стервятника, рвущего тушу истощённой коровы"
 DistantLandsAzeroth1_description: "его перья были чёрными как оникс, а рваные крылья расправлялись шире, чем телега"
 DistantLandsAzeroth2_observation: "мы заметили семейство серебряных горилл, купающихся под водопадом Тернистой долины"
 DistantLandsAzeroth2_description: "мускулистые существа чистили друг друга в тумане, их металлический серый мех переливался в движении"
 DistantLandsAzeroth3_observation: "один из спутников указал на ветку, увитую паутиной, где висела чёрная вдова"
 DistantLandsAzeroth3_description: "её красный песочные часы на брюхе бросались в глаза, но куда страшнее были восемь глаз и ядовитые клыки"
 DistantLandsAzeroth4_observation: "мы были поражены видом кабанообразного существа, охваченного скверной — проклятого адского кабана"
 DistantLandsAzeroth4_description: "огромные шипы торчали из его спины, головы и бёдер, а умные зелёные глаза сверкали гневом"
  
 DistantLandsNorthKalimdor1_observation: "нашу группу начал преследовать грозный ночной саблезуб"
 DistantLandsNorthKalimdor1_description: "его гибкое тело было покрыто тёмной шерстью с серебристыми полосами, а клыки могли сокрушать сталь"
 DistantLandsNorthKalimdor2_observation: "оглушительный крик заставил нас поднять глаза и увидеть величественного гиппогрифа"
 DistantLandsNorthKalimdor2_description: "его перья переливались всеми цветами радуги, а мудрые глаза пронзали душу"
 DistantLandsNorthKalimdor3_observation: "мы замерли от удивления при виде редкого и смертельно опасного ледопарда"
 DistantLandsNorthKalimdor3_description: "огромный кот легко скользил по снегу, его белая полосатая шкура почти сливалась с окружением"
 DistantLandsNorthKalimdor4_observation: "мы остановились, любуясь бескрайним пляжем и наблюдая за приливными крабами"
 DistantLandsNorthKalimdor4_description: "эти крабы были размером со стол, а мощные клешни были покрыты ракушками и обломками кораблей"
  
 DistantLandsCentralKalimdor1_observation: "мы наткнулись на свирепого виверна, пожиравшего кладку гигантских паучьих яиц"
 DistantLandsCentralKalimdor1_description: "удивительный зверь с телом льва был покрыт рыжей шерстью, но имел голые крылья и ядовитый хитиновый хвост"
 DistantLandsCentralKalimdor2_observation: "мы остановили караван, чтобы пропустить величественное стадо кодо"
 DistantLandsCentralKalimdor2_description: "это были массивные и мускулистые создания с толстой шкурой и раздвоенным выростом на морде"
 DistantLandsCentralKalimdor3_observation: "остановившись у воды, мы подверглись нападению грозного змея ветра"
 DistantLandsCentralKalimdor3_description: "его изумрудная чешуя сверкала на солнце, а белоснежные клыки блеснули, когда он атаковал"
 DistantLandsCentralKalimdor4_observation: "один из наших подошёл слишком близко к воде и едва не был проглочен гигантским кроколиском"
 DistantLandsCentralKalimdor4_description: "этот жуткий ящер был размером с телегу, а зубы длинной с человеческое предплечье"
  
 DistantLandsSouthKalimdor1_observation: "перед нашими глазами из миража возник ужасный василиск"
 DistantLandsSouthKalimdor1_description: "его каменные чешуйки казались тяжёлыми, зубы — острыми, но сильнее всего мы страшились его ледяного взгляда"
 DistantLandsSouthKalimdor2_observation: "огромный ящер ужасов прорвал джунгли и проглотил нашу лошадь целиком"
 DistantLandsSouthKalimdor2_description: "страшный хищник стоял на двух ногах, покрытый белыми чешуями с чёрными полосами и окровавленной пастью"
 DistantLandsSouthKalimdor3_observation: "мы привлекли внимание любопытного волшебного дракончика, который игриво перемещался вокруг каравана"
 DistantLandsSouthKalimdor3_description: "он был не больше домашней кошки, ярко-синий, с пурпурными крыльями в замысловатых узорах и закрученным хвостом"
 DistantLandsSouthKalimdor4_observation: "наши глаза ослепило радужное сияние панциря черепахи-искрянки"
 DistantLandsSouthKalimdor4_description: "эта черепаха была почти размером с лошадь, а её панцирь напоминал алмаз и был столь же крепок"
  
 wanderer_lifestyle_events.35.desc_wc: "Когда наша группа шла через [ROOT.Char.Custom('DistantLandsLoc')], я невольно вспомнил путевой дневник, что читал когда-то.\n\nНе прошло и часа, как [ROOT.Char.Custom('DistantLandsObservationTypeLoc')] — точно как в книге! Я заметил, что [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc')] почти один в один, как было описано.\n\nЭтот рассказ подготовил меня к встрече,"
 wanderer_lifestyle_events.35.desc.singular.neutral_wc: "и всё же это оказалось иным, чем я ожидал... Больше, чем просто дежавю!"
