 invasionofkalimdor_0002_title: "Exodus of the Horde"
 invasionofkalimdor_0002_desc: "In my restless sleep, I hear voices.\n\n"The sands of time have run out, child of the Frostwolves. The cries of war echo upon the winds. The remnants of the past scar the lands, which is besieged once again by conflict."\n\nI see the Horde, chanting warcries and marching towards conquest. Our wardrums shaking this very land. Our enemy since we have entered this new world stand against us, the humans in their thick shields and armors who we seem to have battled for ages, with both our races blood nourishing the soil time and time again.\n\n"Heroes arise to challenge fate and lead their brethren to battle. As mortal armies rush blindly towards their doom, the Burning Shadow comes to consume us all."\n\nThe sky burns as our races ignorantly clash, first with each other. Beasts arise from the fallen flames which seem lifeless and ready to destroy it all.\n\n"You must rally the Horde and lead your people to their destiny... seek me out.""
 invasionofkalimdor_0002_a: "What kind of nightmare was that?"

 invasionofkalimdor_0003_title: "Exodus of the Horde"
 invasionofkalimdor_0003_desc: "I shake my head as I go outside to get some fresh air. "It was not a nightmare, but a vision." I look up at the sight of a raven voicing its thoughts. A moment later, the raven transforms into a Human.\n\n"Greetings, [thrall_or_frostwolf_leader.GetName]." I nod to the mysterious Human's introduction.\n"It was you who I saw in the vision... in that nightmare... Who are you? How do you know me?" I ask the Human.\n"I know many things, warchief, about you and your people. My identity, at this time, is unimportant. What is important is that you rally your people and leave these shores immediately."\n\n"Leave? What's these all about, Human?"\nHe laughs and turns around, looking at the north. "Human? I left my humanity behind long ago. I am something... different now. Know that I have seen the future and beheld the great burning shadow that is coming to consume this world. You sense it as well, don't you?"\n\nI approach the Human and observe a storm brewing in the north. "The demons... they are returning."\n"Yes. And only by leading your people across the sea, to the distant lands of Kalimdor, will you have a chance to stand against them!", before I could interrupt his proposal he continues. "I will answer all your questions in time, warchief. For now, rally your warriors and prepare to leave this land. We will speak again."\n\nThe Human once again tansforms into a raven and flies away. None of this makes sense, but the spirits tell me... that I should trust him... Or do I?"
 invasionofkalimdor_0003_a: "We are like prisoners here anyways..."
 you_will_talk_to_the_warsong_leader: "You will approach the leader of the Warsong Clan"
 invasionofkalimdor_0003_b: "Azeroth is where our ancestors wished our home to be in"
 this_end_the_story_content_for_orcs: "This will end the story content of Burning Legion invasion for orcs"
