 azsharism_health_god_possessive:0 "$azsharism_good_god_azshara_possessive$"
 azsharism_fertility_god_name:0 "$azsharism_good_god_azshara$"
 azsharism_fertility_god_possessive:0 "$azsharism_good_god_azshara_possessive$"
 azsharism_wealth_god_name:0 "$azsharism_good_god_azshara$"
 azsharism_wealth_god_possessive:0 "$azsharism_good_god_azshara_possessive$"
 
 xavism:0 "Xavism"
 xavism_adj:0 "Xavist"
 xavism_adherent:0 "Xavist"
 xavism_adherent_plural:0 "Xavists"
 xavism_desc:0 "Xavius, once one of the Highborne's most powerful sorcerers, was transformed into a satyr by Sargeras as punishment. Running from one master to the next, he eventually pledged his soul and followers to N'Zoth in an attempt to corrupt the Emerald Dream into a Nightmare. His followers uphold betrayal as a virtue and corruption as worship, making desecration their sacred path to glory."
