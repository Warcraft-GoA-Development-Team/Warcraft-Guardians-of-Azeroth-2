 pam_bull_events.0001.t: "The Bull of [GetCurrentDate.GetYear]"
 pam_bull_events.0001.desc: ""I exhort all of you to oppose the infidels of the [title.GetName], to free the land from their tyranny and to snatch many thousands of your captive brothers from their hands."\n\n"So that the dignity of the Christian name may be increased in your time, and that your valour which is praised throughout the whole world, may remain intact and unshaken.""
 pam_bull_events.0001.a: "#EMP In nomine Domini.#!"
 pam_bull_events.0001.a.flavor: "#EMP In the name of the Lord.#!"

 pam_bull_events.0002.t: "$pam_bull_events.0001.t$"
 pam_bull_events.0002.desc.tenet_permitted: ""Let any of you who believe in [tenet_scope.GetName( ROOT.GetCharacter.GetRite )] know that it is now allowed under the permission of the [ROOT.Char.GetPrimaryTitle.GetNameNoTierNoTooltip].""
 pam_bull_events.0002.desc.tenet_forbidden: ""The doctrine of [tenet_scope.GetName( ROOT.GetCharacter.GetRite )] has now no place in our home. Let anyone who practices it know that they are violating the sanctity of the Church, and that they have sinned mortally.""
