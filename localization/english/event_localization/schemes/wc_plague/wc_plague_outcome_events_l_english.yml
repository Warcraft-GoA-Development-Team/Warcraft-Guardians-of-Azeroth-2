l_english:
 plague_outcome.0002.title:0 "Death is Coming"
 plague_outcome.0002.desc:0 "My plans have come to fruition! The tainted food stored in [plague_center.GetBaseNameNoTier] has spread unnoticed across the county. Chaos soon followed as the dead rose, overwhelming the local garrison.\n\nPanic grips the region as soldiers and peasants alike fall to the onslaught. Worse still, the plague has begun to spread to neighboring counties, and there is no stopping it now. Soon, all shall serve my will!\n\n"
 plague_outcome.0002.desc.exposed_scheme:0 "Some of my servants failed to flee in the ensuing chaos and were captured by the guards. Under interrogation, they have likely revealed my scheme to [target.GetTitledFirstName]."
 plague_outcome.0002.desc.not_exposed_scheme:0 "My servants slipped away amidst the confusion, leaving [target.GetTitledFirstName] oblivious to my role in the outbreak!"
 plague_outcome.0002.a:0 "Feast my children, feast upon the flesh of the living!"
 plague_outcome.0003.title:0 "$plague_outcome.0002.title$"
 plague_outcome.0003.desc:0 "A messenger arrives with troubling news: [plagued_county.GetBaseNameNoTier] is in the grip of a strange plague. Highly contagious, the disease claims its victims within days, and it appears to be spreading to neighboring lands.\nWorse still, rumors speak of the dead rising from mass graves, indiscriminately attacking anyone in their path. If these reports are true, the situation could become catastrophic."
 plague_outcome.0003.desc.exposed_scheme:0 "\n\nThe guards apprehended several hooded individuals as they attempted to flee the area. Under the pressure of questioning, they confessed to acting on the orders of [owner.GetTitledFirstName], who is also responsible for this blight."
 plague_outcome.0003.desc.not_exposed_scheme:0 "\n\nSurvivors recount troubling stories: hooded figures were seen distributing food in the days leading up to the outbreak. Yet despite thorough searches, no trace of these individuals has been found. Could they be responsible for this plague?"
 plague_outcome.0003.a.discovered:0 "Very well, [owner.GetFirstName], fire will settle this matter."
 plague_outcome.0003.a.not_discovered:0 "We should investigate further."
 plague_outcome.0004.title:0 "Death Delayed"
 plague_outcome.0004.desc.failure_declaration_1:0 "[target.GetTitledFirstNamePossessive] lands didn't get plagued!"
 plague_outcome.0004.desc.failure_declaration_2:0 "My attempt on [target.GetTitledFirstNamePossessive] lands has been thwarted."
 plague_outcome.0004.desc.failure_declaration_3:0 "It seems [target.GetTitledFirstName] has escaped [ROOT.Char.GetFaith.HighGodNamePossessive] judgment once again."
 plague_outcome.0004.desc:0 "\n\nOnly a few individuals turned before being eliminated by the guards. The tainted food has since been destroyed, and the infected quarantined, preventing the spread."
 plague_outcome.0004.desc.exposed_scheme:0 "\n\nWorse still, some of my servants were captured and tortured to death, revealing my existence and my role in this."
 plague_outcome.0004.desc.not_exposed_scheme:0 "\n\nAt least my servants managed to flee the region in time before they could be apprehended, leaving [target.GetTitledFirstName] unaware of my role in all of this."
 plague_outcome.0004.a:0 "Let my servants keep a low profile."
 plague_outcome.0004.a.discovered:0 "Cursed [target.GetFirstName]! Death will claim you sooner or later."
 plague_outcome.0004.b:0 "Death is inevitable."
 plague_outcome.0005.title:0 "$plague_outcome.0004.title$"
 plague_outcome.0005.desc:0 "My guards reported that a strange illness has struck several individuals in [plague_center.GetName], leading to their rapid death before their corpses rose again to savagely attack anyone in their path. Fortunately, they managed to eliminate the infected and trace the origin of this curse before the situation could spiral out of control. All evidence points to tainted food as the source of this plague."
 plague_outcome.0005.desc.exposed_scheme:0 "\n\nThe guards caught some individuals distributing this food. Under the pressure of an intense interrogation, they confessed that their master and the mastermind behind this attack was none other than [owner.GetTitledFirstName]."
 plague_outcome.0005.desc.not_exposed_scheme:0 "\n\nIt is rumored that before the outbreak, hooded figures were seen performing dark rituals near the granaries and distributing this food. Unfortunately, my guards found no trace of these mysterious individuals."
 plague_outcome.0005.a.discovered:0 "$plague_outcome.0003.a.discovered$"
 plague_outcome.0005.a.not_discovered:0 "What happened?"