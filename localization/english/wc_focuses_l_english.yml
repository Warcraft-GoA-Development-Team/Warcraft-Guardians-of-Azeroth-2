  education_magic_1_outcome_description:0 "The study and craft of magic never seemed to fully capture [ROOT.Char.GetHerHis] interest, and time spent practicing spells often felt more like a duty than a passion for [ROOT.Char.GetHerHim]."
  education_magic_2_outcome_description:0 "Having developed a moderate interest in the magical arts, [ROOT.Char.GetSheHe] has shown some aptitude for spell casting, though it remains more of a hobby than a true calling."
  education_magic_3_outcome_description:0 "A dedicated student of the magical arts, [ROOT.Char.GetSheHe] has demonstrated considerable skill and understanding in spell casting, often impressing mentors and peers alike."
  education_magic_4_outcome_description:0 "A prodigy in the magical arts, [ROOT.Char.GetSheHe] has mastered complex spells and magical theories, often pushing the boundaries of what is considered possible in spell casting."

