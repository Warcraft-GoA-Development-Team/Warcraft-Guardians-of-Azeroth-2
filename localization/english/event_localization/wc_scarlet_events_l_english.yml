l_english:
 SCARL.001_TITLE:1 "Those That Remain"
 SCARL.001_DESC:0 "The [GetTitleByKey('k_lordaeron').GetName] has been destroyed and it's people risen into undeath. Those that remain are scattered, defenseless and without leadership. \n\n There is rumours of a group of survivors being led by the remnants of the Silver Hand who are grouping in Southshore and have extended to us an invitation. \n\n The question remains, should we accept, what happens from here?""
 SCARL.001_OPT_A:0 "We must find those that are still living."

 