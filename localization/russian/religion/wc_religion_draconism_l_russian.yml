 yserism_desc: "Смертные последователи Зеленой драконьей стаи почитают древних драконьих хранителей природы, выступающих за равновесие и рост. Аспект Природы возложил на Зеленых драконов обязанность защищать природный мир и поддерживать тонкий баланс между всеми живыми существами, и эти смертные полагают, что это даёт им высшее право на Божественность. Для самих Драконов вера опирается на божественный договор, заключённый с Титанами и Хранителями. Она воплощается через связь с Изумрудным Сном — священным миром, где хранится сущность природы в коллективном подсознании всех существ. Хотя Зеленые драконы проводят большую часть жизни во сне, их истинная сила раскрывается именно в Изумрудном Сне, и они часто выходят на связь с избранными последователями через завесу сновидений."
