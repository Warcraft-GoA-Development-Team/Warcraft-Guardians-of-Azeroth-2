l_russian:
  
 burninglegion_0003_title: "Осада Даларана"
 burninglegion_0003_desc: "Защитники Даларана падают один за другим. Лич и я приближаемся к жалкому [antonidas.GetFirstName].\n\n[antonidas.GetFirstName] оседает и произносит [Select_CString(antonidas.IsFemale, 'свои', 'свои' )] последние слова: «Мне больно даже смотреть на тебя, [ROOT.GetCharacter.GetFirstNameNoTooltip]...»\n\n«Я с радостью прекращу твои мучения, [antonidas.GetFirstName]. Я же говорил, что твои чары меня не остановят», — отвечаю я, замечая нахмуренное лицо [antonidas.GetFirstName] с оттенком разочарования.\n\nКогда слова иссякли, я поражаю [antonidas.GetFirstName] [frostmourne|E]. Подбираю Книгу Медива, залитую кровью [antonidas.GetFirstName], и передаю Личу: «Книга заклинаний твоя, Лич. Уходим, пока маги не собрались для атаки».\n\n«Именно... я начну призывать Лорда Архимонда, как только как следует изучу Книгу Медива», — говорит [summonerofburninglegion.GetFirstName], изучая книгу."
 burninglegion_0003_a: "Пусть начнётся призыв!"
 burninglegion_0003_a_tt: "Личу потребуется время, чтобы постичь Книгу Медива и призвать Пылающий Легион"
  
 burninglegion_0004_title: "Под пылающим небом"
 burninglegion_0004_desc: "Лич [summonerofburninglegion.GetFirstName] отступает от круга призыва и открывает путь Пылающему Легиону: «Явись, Лорд Архимонд! Войди в этот мир и дай нам насладиться твоей мощью!»\n\nСама ткань реальности рвётся и расползается, когда в этот мир входит существо гнусной и могучей магии. #XB «Трепещите, смертные, и отчаивайтесь! Рок пришёл в этот мир!»#!, — провозглашает Лорд [lordarchimonde.GetFirstName]. [Select_CString(lordarchimonde.IsFemale, 'Она', 'Он' )] бросает взгляд на [summonerofburninglegion.GetFirstName]: #XB «Ты хорошо послужил, маленький Лич. Мой план сработал идеально»#!\n\n[tichondrius.GetFirstName] является Лорду [lordarchimonde.GetFirstName]: #XB «Лорд Архимонд, все приготовления завершены»#!\n#XB «Превосходно, [tichondrius.GetFirstName]. Поскольку [GetTrait('lich_king').GetName( GetNullCharacter )] более мне не нужен, отныне вы, повелители ужаса, возглавите [scourge|E]»#!, — я сдерживаю потрясение, услышав этот приказ [lordarchimonde.GetFirstName].\n#XB «Как пожелаете, Лорд [lordarchimonde.GetFirstName]»#!, — разумеется, Повелитель Ужаса не упустит такой случай.\n\nЛорд [lordarchimonde.GetFirstName] оборачивается к даларанцам, что всё ещё пытаются организовать оборону: #XB «Скоро я отдам приказ начать вторжение. Но сначала я покажу пример на этих жалких магах... раздавлю их город в прах истории»#!\n\nЯ выдыхаю, сам не зная, что задерживал дыхание. Оборачиваюсь к [summonerofburninglegion.GetFirstName]: «Это же шутка, верно?! Что теперь будет с нами?!»\n«Терпение, мой юный рыцарь смерти. [GetTrait('lich_king').GetName( GetNullCharacter )] предвидел и это. Быть может, тебе ещё предстоит сыграть свою роль в его грандиозном замысле»."
 burninglegion_0004_a: "Что ж, выбора нет..."
  
 burning_crusade: "Легионы"
  
 burninglegion_0006_title: "Пылающий Легион"
 burninglegion_0006_desc: "#XB Пусть этот шрам станет первым ударом по миру смертных. Из этой печати восстанет погибель людей, которые в своей гордыне посмели присвоить наш огонь. Слепо строили они свои королевства на украденном знании и самомнении. Теперь их пожрёт то самое пламя, которое они пытались обуздать. Пусть эхо рока прокатится по этому жалкому миру, дабы все живущие услышали его и отчаялись.#!\n\nЭхо многочисленных терзаемых душ пронизывает самый воздух Азерота. Воздух становится густым от запаха огня и крови — прелюдия к катаклизму, что вот-вот развернётся. Тёмные Повелители Хаоса возвестили о своём приходе на эту планету.\n\nВ самом сердце Даларана появился портал глубокого изумрудного цвета, потрескивающий энергией Скверны, и через него [burning_legion|E] начал своё вторжение в Азерот."
 burninglegion_0006_light_opt: "Мы очистим эту скверну, как и любую другую"
 burninglegion_0006_shadow_opt: "Наш заклятый враг здесь, и мы преуспеем, несмотря на это"
 burninglegion_0006_life_opt: "Мы уже побеждали их — победим и вновь!"
 burninglegion_0006_death_opt: "Кое-кто будет служить, но мы будем ждать, чтобы вновь присягнуть нашему истинному господину"
 burninglegion_0006_order_opt: "Их поражение от наших рук станет символичным"
 burninglegion_0006_disorder_opt: "СЛАВА ПЫЛАЮЩЕМУ ЛЕГИОНУ!"
 burninglegion_0006_elemental_opt: "Мы служим лишь тому, что нас окружает"
 burninglegion_0006_fallback_opt: "К оружию! Буря на пороге, Горе!"
  
 burninglegion_0101_opening: "Трепещи предо мной, смертный,"
 burninglegion_0101_desc: "Я явился, чтобы возвестить последнюю погибель этого смертного мира! Пылающий Легион не пощадит никого, и всё живое будет истреблено...\nПрисоединитесь ли вы к смертным в их неминуемой гибели? Или преклоните колено перед Легионом?"
 burninglegion_0101_submit: "Я живу, чтобы служить Пылающему Легиону!"
 burninglegion_0101_submit_tt: "Вы становитесь [vassal|E] [archimonde.GetShortUIName]"
 burninglegion_0101_resist: "Нет, мы свободны!"
 burninglegion_0101_resist_tt: "Вы первыми встанете пред гневом [archimonde.GetShortUIName|U]"
  
 burninglegion_0102_opening: "Всевышнему [archimonde.GetShortUIName],"
 burninglegion_0102_desc: "Мы существуем, чтобы служить Пылающему Легиону в качестве его верных приспешников. Распоряжайтесь нами и нашим народом, как пожелаете, Лорд [archimonde.GetShortUIName]."
 burninglegion_0102_a: "Хорошо, вы будете служить Легиону верно."
  
 burninglegion_0103_opening: "Пылающему рабу,"
 burninglegion_0103_desc: "Ты хочешь, чтобы мы отреклись от надежд и свобод, за которые так отчаянно сражались? Ступай обратно и скули о пощаде перед своим Тёмным Титаном — в Азероте вас ждёт поражение!"
 burninglegion_0103_a: "Что ж, можешь умереть вместе с этими жалкими смертными."
