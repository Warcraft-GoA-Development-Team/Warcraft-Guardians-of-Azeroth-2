 frghlaith_desc: "Те, кто почитает водных существ, проводят ритуалы, чтобы наладить связь с морем и его мощью, прославляя и саму воду, и обитающих в ней существ. Пантеон постоянно меняется: если новый зверь оказывается значимым, он становится символом веры, а когда умирает или исчезает, на его место приходят другие морские создания."
  
