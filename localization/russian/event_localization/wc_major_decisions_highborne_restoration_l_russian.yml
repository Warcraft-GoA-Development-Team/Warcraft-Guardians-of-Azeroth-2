l_russian:
  
 # Restoring the Highborne as Elven High Rulers/Emperors 
 wc_restoring_the_queldorei.0001.title: "Мечта Королевы Азшары"
 wc_restoring_the_queldorei.0001.a: "Я превзойду даже саму Королеву! Этот мир будет моим!"
 wc_restoring_the_queldorei.0001.b: "Весь эльфийский род признает меня своим истинным вождём!"
 wc_restoring_the_queldorei.0001.desc: "Я завоевал драгоценный Камень Кал'дорай. Они изгнали мой народ и мою Королеву, и теперь смеют восседать на её троне? Но это время прошло... Час настал: собраны военные советы, и вокруг меня сплачиваются Высокорождённые.\n\nНо как нам поступить?\n\nВерность моих Высокорождённых и мои притязания на трон упрочены, эльфийская армия собрана и готова маршем выступить, дабы я занял своё законное место как Правитель всего эльфийского рода!\n\nИли же... я могу пойти по стопам самой Королевы Азшары? Тогда не только эльфийский род, но и весь мир склонится предо мной! Впрочем... цена за обретение такой власти будет высока..."
 highborne_fel_legion: "Легион Высокорождённых"
 highborne_loyalists: "Элитные лоялисты Высокорождённых"
