 shathgral_religion_desc:0 "Un rassemblement de cultes voués à la vénération des Dieux très anciens, des horreurs parasitaires et surpuissantes créées par les Seigneurs du Vide pour corrompre le cosmos. Lors de l’ordonnancement d’Azeroth, les titans les emprisonnèrent profondément sous la terre pour freiner leur corruption et permettre au monde de s’épanouir. Leurs adeptes, profondément nihilistes, ne servent que l'insatiable faim du Vide."
