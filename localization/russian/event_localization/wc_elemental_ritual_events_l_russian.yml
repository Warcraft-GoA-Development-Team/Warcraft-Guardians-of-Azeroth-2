l_russian:

##################################
# Ритуал огненного духа
# 1000 -> 1499
##################################

wc_elemental_ritual_events.1001.title: "Путь в Огненные Просторы"
wc_elemental_ritual_events.1001.desc: "За долгие годы общения со стихиями я слышал шёпот духов и различал древние шаманские резные знаки, повествующие о вершине мастерства, что отделяет простого племенного шамана от по-настоящему легендарного элементалиста, ставшего единым с владениями Огня...\n\nОпираясь на знания, собранные за годы общения и исследований, я набросал очертания ритуала, который перенесёт меня на Элементальный план Огня. Этот ритуал был бы слишком опасен для шамана-подмастерья, но я уверен: моя крепкая связь с огненными духами Азерота защитит меня, если я успешно достигну плана Огня. Итогом станет аудиенция у легендарного Повелителя Огня, которая может даровать мне великую силу, чтобы защитить мой народ и элементальных духов этого мира."
wc_elemental_ritual_events.1001.a: "Начать ритуал!"
wc_elemental_ritual_events.1001.b: "Я не готов к этому."

wc_elemental_ritual_events.1002.title: "Ритуал перемещения — Огонь"
wc_elemental_ritual_events.1002.desc: "Зачарованные жаровни потрескивают в темноте, воздух наполнен запахом пепла и серы. Мой помощник кладёт раскалённые угли в точные точки на сигиле, начертанном углём на каменном полу. Мой разум сосредоточен, я перехожу половину сложного заклинания, и мысли мои заняты лишь одной целью — достичь Элементального плана Огня.\n\nМесяцы планирования, подготовки и общения с земными огненными духами привели к этому моменту: путешествию на элементальный план в надежде получить аудиенцию у самого Повелителя Огня. Моё владение элементальным огнём должно быть безупречным, иначе я мгновенно вспыхну по прибытии от невыносимого планарного жара. Этого не случится. Я готов."
wc_elemental_ritual_events.1002.air: "Попросить помощи у духов воздуха."
wc_air_spirits_cd: "Все заклинания стихии воздуха уходят на перезарядку."
wc_elemental_ritual_events.1002.earth: "Попросить помощи у духов земли."
wc_earth_spirits_cd: "Все заклинания стихии земли уходят на перезарядку."
wc_elemental_ritual_events.1002.water: "Попросить помощи у духов воды."
wc_water_spirits_cd: "Все заклинания стихии воды уходят на перезарядку."
wc_elemental_ritual_events.1002.none: "Пусть духи огня ведут меня."
wc_translocation_success: "Перемещение прошло успешно."
wc_translocation_fail: "Перемещение не удалось."

wc_elemental_ritual_events.1003.title: "Планарное перемещение — Огонь"
wc_elemental_ritual_events.1003.desc: "Волна жара прокатывается по моему телу, и на мгновение я вижу, как мой помощник отлетает назад, а меня поглощает пламя. Собравшиеся вокруг меня духи огненных элементалей устремляются в огонь, тянутся своими отростками к моему телу, касаются моей сущности и на время делают меня одним из них. Я чувствую их жар, их волю, чувства дружбы и доверия, что мы взрастили за это духовное путешествие. Всё нарастает до крещендо, и внезапно...\n\nПламя отступает, открывая мои глаза. Я вижу и чувствую, как моё тело светится раскалённым красным, но не горит — магическая плёнка огня сплавилась с моей кожей. По всему полю зрения в колышущемся эфире, словно деревья, мерцают и пляшут костры пламени, а элементали всех форм и размеров играют на полях лавы, пепла и расплавленной серы. У меня получилось. Я достиг плана Огня!"
wc_elements_ignore: "Стихии игнорируют вас."
wc_elements_welcome: "Стихии приветствуют вас."
wc_elemental_ritual_events.1003.a: "Моё путешествие начинается..."

wc_elemental_ritual_events.1004.title: "Прерванное перемещение — Огонь"
wc_elemental_ritual_events.1004.desc: "Моя концентрация дрогнула: призванные нами элементали окутывают меня яростным пламенем, и жар опаляет кожу. Что-то пошло не так! В глубине моей эмпатической связи с огненными духами, пришедшими мне на помощь, моё сердце отзывается, когда они переживают мгновение сомнения. Даже когда их пламя хлещет моё измученное болью тело, я преодолеваю телесные страдания и тянусь к своим адским друзьям с ободрением и благодарностью — и чувствую их тревогу обо мне. Хотя это неблагоприятное развитие событий, я учёл его в своих планах.\n\nВ ту долю секунды, что у меня есть на обдумывание вариантов, я решаю..."
wc_elemental_ritual_events.1004.giveup: "Сдаться. Мои усилия не работают."
wc_elemental_ritual_events.1004.force: "Попробовать снова, силой прорываясь на элементальный план."
wc_elemental_ritual_events.1004.sac: "Принести в жертву силу."

wc_elemental_ritual_events.1005.title: "Планарный огненный ритуал прерван"
wc_elemental_ritual_events.1005.desc: "Моя концентрация была нарушена, кожа сильно обожжена, а духи, казалось, почуяли мою слабость и отступили, тревожась о моей безопасности. Ясно, что что-то было сделано неверно, или же моя связь с духами попросту оказалась недостаточно прочной. Я должен преодолеть эту неудачу и выждать время, пока условия вновь не будут благоприятны для очередной попытки достичь Элементального плана Огня."
wc_elemental_ritual_events.1005.a: "Это конец..."

wc_elemental_ritual_events.1100.title: "Молчание огненных духов"
wc_elemental_ritual_events.1100.desc: "Похоже, моё прибытие на план Огня не привлекло ничьего внимания, несмотря на чуждость и драматичность моего появления. Элементальные планы, в отличие от мира Азерота, аморфны и не подчиняются законам геометрии. Добиться аудиенции у Повелителя Огня будет невозможно, если местные элементали не поведут меня к своему дворцу. Я должен найти способ привлечь их внимание..."
wc_elemental_ritual_events.1100.fail: "Вам не удаётся привлечь их внимание."
wc_elemental_ritual_events.1100.offended: "Ваша попытка оскорбляет их."
wc_elemental_ritual_events.1100.success: "Вам удаётся привлечь их внимание."
wc_elemental_ritual_events.1100.journey: "Ваше путешествие по Огненным Просторам продолжается..."
wc_elemental_ritual_events.1100.diplomacy: "Уж моей харизмы точно хватит."
wc_elemental_ritual_events.1100.magic: "Я покажу им свою силу!"
wc_elemental_ritual_events.1100.terr: "Призыв земного элементаля, пожалуй, будет лучшим решением."
wc_elemental_rituals_events.1100.desc_forced: "Хотя я знаю, что сила — не лучший путь, я всё же испытываю удачу с ней. Я начинаю ощущать почти болезненное тепло во всём теле и понимаю: я попал на план Огня!\n\n"
wc_elemental_rituals_events.1100.desc_sac: "Моя сила не сравнится с силой Духов Стихий, но я надеюсь, что моё подношение покажет им уважение и восхищение. Моя кожа слегка обугливается в окружении пламени, и в сосредоточении я осознаю: я попал на план Огня!\n\n"

wc_elemental_ritual_events.1101.title: "Приветствие огненных духов"
wc_elemental_ritual_events.1101.desc: "Планарные элементали признают во мне гостя с земных планов, и духи начинают тянуться ко мне, с любопытством кружа вокруг. Некоторые даже касаются меня своими пылающими отростками, озадаченные моей чуждой, материальной природой.\n\nНаконец толпа расступается, и вперёд выступает смутно человекоподобный элементаль с распростёртыми в жесте щедрости руками. В одной руке у него — источник мистической энергии, которая, кажется, притягивается к моей сущности и наверняка усилит мою мощь. Другая рука явно держит расплавленное золото — редкость и на этом плане, и в нашем мире; оно застынет, когда я вернусь домой.\n\nДружба обитателей этого священного царства обеспечена, и мой безопасный путь к дворцу Повелителя Огня, должно быть, гарантирован. Теперь мне предстоит решить, принять ли один из этих даров..."
wc_elemental_ritual_events.1101.magic: "Принять дар пламени."
wc_elemental_ritual_events.1101.magma: "Принять дар магмы."
wc_elemental_ritual_events.1101.magma_gold: "Магма застывает, превращаясь в золото:"
wc_elemental_ritual_events.1101.none: "Вежливо отказаться от их даров."
wc_elemental_ritual_events.1101.none_good: "Стихии признают вашу мудрость"

wc_elemental_ritual_events.1110.title: "Путь через Огненные Просторы"
wc_elemental_ritual_events.1110.desc: "Заручившись проводником среди моих новых друзей на плане Огня, я должен выбрать маршрут по плану в своём путешествии к дворцу Повелителя Огня. Из-за изменчивой и неевклидовой природы плана каждое путешествие различно, и каждый маршрут может занять разное время.\n\nНекоторые из этих путей пролегают по самым границам плана, что, возможно, даст мне доступ к источнику элементальной энергии такой чистоты, какая обычно недоступна в Азероте. Какой же выбрать?"
wc_elemental_ritual_events.1110.air: "Идти через Воющие Шпили."
wc_elemental_ritual_events.1110.air_tt: "Получать бонусы, связанные с магией воздуха, на протяжении всего путешествия."
wc_elemental_ritual_events.1110.water: "Идти через Магмовое море."
wc_elemental_ritual_events.1110.water_tt: "Получать бонусы, связанные с магией воды, на протяжении всего путешествия."
wc_elemental_ritual_events.1110.earth: "Идти через Извергающиеся Хребты."
wc_elemental_ritual_events.1110.earth_tt: "Получать бонусы, связанные с магией земли, на протяжении всего путешествия."
wc_elemental_ritual_events.1110.life: "Идти через Лес Огненного Сердца."
wc_elemental_ritual_events.1110.life_tt: "Получать бонусы, связанные с магией природы, на протяжении всего путешествия."
wc_elemental_ritual_events.1110.fire: "Идти через Великое Пожарище."
wc_elemental_ritual_events.1110.fire_tt: "Получать бонусы, связанные с магией огня, на протяжении всего путешествия."

wc_elemental_ritual_events.1120.title: "У врат Повелителя Огня"
wc_elemental_ritual_events.1120.desc: "Моё долгое путешествие по Огненным Просторам наконец привело меня к вратам дворца Повелителя Огня. Стены застывшего пламени вздымаются могучими колоннами, сводами и шпилями. Внутри я чувствую, как клубятся и снуют элементальные существа непостижимой мощи, а в самом центре всего этого — внушительная энергия самого Повелителя Огня.\n\nСущность земных огненных элементалей, что защищает меня здесь от вреда, взволнованно отзывается через нашу эмпатическую связь. С адским рёвом врата передо мной распахиваются..."
wc_elemental_ritual_events.1102.wow: "...и я потрясён!"
wc_elemental_ritual_events.1102.idc: "...и я НЕ впечатлён."
wc_elemental_ritual_events.1102.scared: "...и я дрожу от страха."

wc_elemental_ritual_events.1200.title: "Дворец Повелителя Огня"
wc_elemental_ritual_events.1200.desc: "Войдя во дворец Повелителя Огня, я внезапно оказываюсь под защитой пузыря планарной огненной магии, а земной элементаль, защищавший меня своей сущностью, отделяется и устремляется вперёд. Великие источники огня тянутся в умопомрачительный ветвящийся узор, нарушающий все законы физики, разветвляясь на множество миров и реальностей; источник силы огненных элементалей — в центре всех миров.\n\nМой элементальный защитник возвращается в сопровождении одного из прислужников Повелителя Огня. Меня признали за мою службу и даровали аудиенцию у Повелителя Огня; пока я жду, я волен попросить часть этой силы."

wc_elemental_ritual_events.1210.title: "Аудиенция у Повелителя Огня"
wc_elemental_ritual_events.1210.desc: "Наконец — венец всех моих усилий, аудиенция у самого Повелителя Огня! Даже внутри моего защитного пузыря жар невыносим: огненная энергия всех планов стекается сквозь великое олицетворение всего пламени.\n\n«ДОБРО ПОЖАЛОВАТЬ, СМЕРТНЫЙ, В МОЁ ЦАРСТВО», — потрескивает голос Повелителя Огня. «НЕ ЧАСТО К НАМ ПРИХОДЯТ ГОСТИ С МАТЕРИАЛЬНОГО ПЛАНА. МНЕ ИЗВЕСТНЫ ТВОЯ СИЛА И ТВОЯ СЛУЖБА МОИМ ДЕТЯМ. СКАЖИ, КАКОВА ТВОЯ ПРОСЬБА? Я ИСПОЛНЮ ЛЮБОЕ ЖЕЛАНИЕ, ЧТО В МОИХ СИЛАХ».\n\nВот и настал момент, которого я ждал. Я прошу..."
wc_elemental_ritual_events.1210.mastery: "...власть над магией огня."
wc_elemental_ritual_events.1210.peace: "...мир в моей державе."
wc_elemental_ritual_events.1210.funds: "...богатство на материальном плане."
wc_elemental_ritual_events.1210.power: "...больше силы в Азероте."
wc_elemental_ritual_events.1210.mean: "...страдания моих врагов."

wc_elemental_ritual_events.1220.title: "Пир Огня"
wc_elemental_ritual_events.1220.desc: "После аудиенции у Повелителя Огня меня приглашают сесть за его стол как почётного гостя. К моему удивлению, передо мной предстаёт выбор блюд из огненной энергии, принявших облик яств материального плана. Мне сообщают, что эти энергии не только поддержат меня, но и даруют магические дары. Глядя на стол и разглядывая всевозможные угощения, я, пожалуй, возьму..."
wc_elemental_ritual_events.1220.loaf: "...несколько ломтей магмового хлеба."
wc_elemental_ritual_events.1220.eggnog: "...глоток эгг-нога, пропитанного пламенем инферно."
wc_elemental_ritual_events.1220.burger: "...кусочек горючего бургера?!."
wc_elemental_ritual_events.1220.cake: "...изрядный кусок Пепельного пирога."
wc_elemental_ritual_events.1220.fat: "...а может, всё сразу?"

wc_elemental_ritual_events.1300.title: "Конец пути"
wc_elemental_ritual_events.1300.desc: "Наконец пришло время возвращаться в Азерот с моей новой силой и благословением Повелителя Огня. Умение не просто говорить с духами стихий, а слышать, как они отвечают, дало мне новое понимание их природы, которое я принесу в свою шаманскую практику дома.\n\nОдин из жрецов-прислужников Повелителя Огня предлагает мне последнее благословение для безопасного пути домой. Я выбираю..."
wc_elemental_ritual_events.1300.terrestrial: "Сопровождающего меня земного элементаля!"
wc_elemental_ritual_events.1300.mana: "Более лёгкий путь обратно."
wc_elemental_ritual_events.1300.mana.tt: "Следующее сотворённое вами Планарное пламя не будет стоить маны и сотворится мгновенно."
wc_elemental_ritual_events.1300.champion: "Воителя, благословлённого Огненными Просторами!"
wc_elemental_ritual_events.1300.lazy: "Вы и так дали мне достаточно."
wc_free_planar_fire: "Благословение прошлого Планарного пламени"
wc_planar_fire_army: "Войска из Огненных Просторов"

wc_elemental_ritual_events.1310.title: "Возвращение в Азерот"
wc_elemental_ritual_events.1310.desc: "Со взрывом невыносимого жара меня возвращает на земной план Азерота. Ощущение столь внезапного переноса тела оставляет меня бездыханным и онемевшим, и я спотыкаюсь, падая на землю. Вокруг мир кажется пустым и холодным: переход от постоянного невыносимого жара и элементальной сущности к умеренной материальности ошеломляет. Огненные стихии кажутся далёкими, и всё вокруг молчит.\n\nЧерез несколько мгновений я прихожу в себя и поднимаюсь на ноги. Моего помощника нет, и, по всей вероятности, я отсутствовал месяцы по земному времени. С новой силой и благословениями элементального плана огня предстоит многое сделать."
wc_elemental_ritual_events.1310.a: "И вот всё заканчивается..."

##################################
# Ритуал распада Огня
# 1500 -> 1999
##################################

wc_elemental_ritual_events.1501.title: "Новые миры для завоевания"
wc_elemental_ritual_events.1501.desc: "По мере того как я совершенствовал свои шаманские способности, мне стало ясно: у элементальных сил, которыми я владею, есть источник за пределами нашего мира. Элементали Азерота сильны, но им далеко до тех, что обитают на Элементальном плане — источнике всей огненной энергии. Очевидный вывод: мы должны открыть путь на этот план и поработить его обитателей, как поработили элементалей этого мира, чтобы умножить свою силу и упрочить власть над этим миром. После лет исследований и тщательного планирования мои замыслы наконец могут осуществиться. Пора ли вторгаться в Огненные Просторы?"
wc_elemental_ritual_events.1501.a: "Подготовить портал!"
wc_elemental_ritual_events.1501.b: "Я не готов к этому."

wc_elemental_ritual_events.1502.title: "Открытие пути"
wc_elemental_ritual_events.1502.desc: "Все приготовления завершены. Мои самые могущественные слуги-огненные элементали истратят свою энергию, принеся себя в жертву, чтобы прожечь дыру сквозь Круговерть Пустоты прямо в сердце Огненных Просторов, откуда они черпают силу. Мой личный элементальный раб превратит себя в щит для моего тела, пока я веду остальных моих элементальных янычар и воинов-шаманов в Огненные Просторы.\n\nЗдесь мы устроим плацдарм, с которого будем напрямую выкачивать силу Огненных Просторов. Оттуда мы выступим маршем к самому дворцу Повелителя Огня, осадим его и вынудим его признать наши права на эти земли. Со взрывом жара первые элементали исчезают в никуда, и портал начинает расти. Скоро моя судьба свершится!"
wc_elemental_ritual_events.1502.air: "Вытянуть силу духов воздуха."
wc_elemental_ritual_events.1502.earth: "Вытянуть силу духов земли."
wc_elemental_ritual_events.1502.water: "Вытянуть силу духов воды."
wc_elemental_ritual_events.1502.none: "Моей силы одной достаточно."
wc_portal_ritual_succ: "Портал успешно открывается."
wc_portal_ritual_fail: "Портал не открывается."

wc_elemental_ritual_events.1503.title: "Дающий сбой портал"
wc_elemental_ritual_events.1503.desc: "Внезапно один из элементалей, вливающих энергию в зарождающийся портал, взрывается, стирая тщательно начертанные ритуальные линии. Начинается цепная реакция: из портала вырывается обратная энергия, и заряды перескакивают от одного элементаля к другому, десятками уничтожая моих расходных слуг.\n\nЕсли это продолжится, я могу потерять всё, ради чего трудился! Я должен действовать — и быстро, — чтобы укрепить растущий портал и обеспечить своё вторжение в Огненные Просторы."
wc_elemental_ritual_events.1503.a: "Это может всё усложнить, но я должен продолжать!"
wc_elemental_ritual_events.1503.b: "Энергия... Её слишком много..."

wc_elemental_ritual_events.1505.title: "Вторжение в Огненные Просторы отменено"
wc_elemental_ritual_events.1505.desc: "Мои планы вторгнуться в Огненные Просторы, колонизировать их и извлечь их необъятные элементальные богатства провалились. Я принял это решение нелегко. Разумеется, это не конец моих замыслов об элементальном плане. Я перегруппируюсь, вновь соберу ресурсы и предприму новую попытку, когда придёт время."
wc_elemental_ritual_events.1505.a: "..."

wc_elemental_ritual_events.1601.title: "Огневая база «Один»"
wc_elemental_ritual_events.1601.desc: "С потоком пламени я шагаю сквозь портал в Огненные Просторы. По всему полю зрения в колышущемся эфире, словно деревья, мерцают и пляшут костры пламени, а элементали всех форм и размеров снуют по полям лавы, пепла и расплавленной серы. Всё даже лучше, чем я воображал.\n\nТеперь мои подчинённые-шаманы и отряды элементальных рабов хлынули сквозь портал и принялись лепить застывший огонь земли в укрепления и добытчики энергии, чтобы переправлять её неукротимую мощь домой, в Азерот. Но медлить нельзя. Элементали здесь должны быть покорены, а Повелитель Огня — поставлен на колени."
wc_elemental_ritual_events.1601.opt.a: "Сама стихия склонится перед моими армиями!"

wc_elemental_ritual_events.1602.title: "Сопротивление огненных элементалей"
wc_elemental_ritual_events.1602.desc: "Огненные элементали этих земель оказались куда труднее в укрощении, чем я думал. Они непокорны и не подчиняются приказам. Некоторые дают отпор, впустую растрачивая силы против моего превосходящего войска. Хуже того, несколько попытались бежать, чтобы предупредить Повелителя Огня о нашем присутствии. Пока, насколько нам известно, никому это не удалось. Однако по мере продолжения приготовлений у нас могут наступать моменты уязвимости и невнимательности. Такую дерзость нельзя оставлять безнаказанной!\n\nХорошенько всё обдумав, я решаю..."
wc_elemental_ritual_events.1602.opt.a: "Создать периметр! Никого не пропускать!"
wc_elemental_ritual_events.1602.opt.b: "Выследить всех, кто бежит к своему королю!"
wc_elemental_ritual_events.1602.opt.c: "Я лично казню каждого, кто мне противостоит!"
wc_elemental_ritual_events.1602.success: "Ваша попытка удаётся, и потенциальная армия, которую вы можете собрать, становится сильнее."
wc_elemental_ritual_events.1602.fail: "Ваша попытка проваливается, и меньше элементалей сплотится вокруг вас в этом вторжении."
wc_elemental_ritual_events.1602.a.success: "Периметр надёжен."
wc_elemental_ritual_events.1602.a.failure: "Ваш импровизированный барьер рушится."
wc_elemental_ritual_events.1602.b.success: "Охотники одерживают верх над элементалями."
wc_elemental_ritual_events.1602.b.failure: "Войска Огненных Просторов берут над вами верх."
wc_elemental_ritual_events.1602.c.success: "Вы убиваете всех, кто не подчинился."

wc_elemental_ritual_events.1605.title: "Пылающий плацдарм"
wc_elemental_ritual_events.1605.desc: "Теперь, когда наши позиции надёжны, мы можем расширять операции в этом регионе. По мере переработки элементалей и огненной энергии региона стало ясно, что не все рабы и ресурсы здесь пригодны для материального мира. Некоторые слишком слабы и попросту исчезнут, едва покинув этот план. Другие слишком сильны и взорвутся, прежде чем их удастся использовать.\n\nОдно из предложений — применить их для усиления наших сил здесь, на элементальном плане. Другое — использовать их, чтобы укрепить меня самого и моих шаманов, пока мы здесь. Я решил..."
wc_elemental_ritual_events.1605.opt.a: "Использовать их для сил вторжения."
wc_elemental_ritual_events.1605.opt.b: "Усилить меня на материальном плане."
wc_elemental_ritual_events.1605.opt.c: "Использовать этот балласт как мишени!"

wc_elemental_ritual_events.1610.title: "Марш в пламени"
wc_elemental_ritual_events.1610.desc: "Теперь, когда мы прочно утвердились здесь, на плане Огня, пришло время достичь нашей истинной цели — осадить дворец Повелителя Огня и извлечь из него его силу. Из-за изменчивой и неевклидовой природы плана каждый путь различен, и каждый маршрут может занять разное время.\n\nНекоторые из возможных походов пролегают по самым границам плана, что, возможно, даст мне доступ к источнику элементальной энергии такой чистоты, какая обычно недоступна в Азероте. Какой же выбрать?"
wc_elemental_ritual_events.1610.air: "Идти через Воющие Шпили."
wc_elemental_ritual_events.1610.air_tt: "Получать бонусы, связанные с магией воздуха, на протяжении всей кампании."
wc_elemental_ritual_events.1610.water: "Идти через Магмовое море."
wc_elemental_ritual_events.1610.water_tt: "Получать бонусы, связанные с магией воды, на протяжении всей кампании."
wc_elemental_ritual_events.1610.earth: "Идти через Извергающиеся Хребты."
wc_elemental_ritual_events.1610.earth_tt: "Получать бонусы, связанные с магией земли, на протяжении всей кампании."
wc_elemental_ritual_events.1610.death: "Идти через Склеп Огненного Сердца."
wc_elemental_ritual_events.1610.death_tt: "Получать бонусы, связанные с магией смерти, на протяжении всей кампании."
wc_elemental_ritual_events.1610.fire: "Идти через Великое Пожарище."
wc_elemental_ritual_events.1610.fire_tt: "Получать бонусы, связанные с магией огня, на протяжении всей кампании."

wc_elemental_ritual_events.1620.title: "Враг у ворот"
wc_elemental_ritual_events.1620.desc: "Наш марш по Огненным Просторам наконец привёл мою армию к вратам дворца Повелителя Огня. Стены застывшего пламени вздымаются могучими колоннами, сводами и шпилями. Внутри я чувствую, как клубятся и снуют элементальные существа непостижимой мощи, а в самом центре всего этого — внушительная энергия самого Повелителя Огня.\n\nМои элементальные слуги беспокойны в присутствии этой силы, но моя власть и воля безоговорочны, пока мы собираемся на осаду. Один из моих помощников подготовил две речи на выбор..."
wc_elemental_ritual_events.1620.opt.a: "Воодушевляющая речь"
wc_elemental_ritual_events.1620.opt.a_tt: "Мы совершили то, о чём не мечтал ни один смертный! Победа будет нашей!"
wc_elemental_ritual_events.1620.opt.b: "Высокомерная речь"
wc_elemental_ritual_events.1620.opt.b_tt: "Взгляните на это жалкое скопище праздных энергий. Оно наше, стоит лишь протянуть руку!"


wc_elemental_ritual_events.1701.title: "Осада Огня: планирование"
wc_elemental_ritual_events.1701.desc.opening: "Теперь, когда наш осадный лагерь разбит, пора планировать, как мы возьмём крепость Повелителя Огня. Каждый из моих советников предлагает свою стратегию."
wc_elemental_ritual_events.1701.desc.spymaster_real: "\n\nМой шпионмейстер,"
wc_elemental_ritual_events.1701.desc.spymaster_fake: "\n\nИскушённый в искусстве интриг,"
wc_elemental_ritual_events.1701.desc.spymaster: "[spymaster.GetShortUIName] предлагает прибегнуть к хитрости — военной уловке, чтобы получить доступ во дворец. Этот рискованный манёвр предполагает обманом вынудить врага впустить нас в крепость. С другой стороны, "
wc_elemental_ritual_events.1701.desc.marshal_real: "мой маршал,"
wc_elemental_ritual_events.1701.desc.marshal_fake: "мастер поля боя,"
wc_elemental_ritual_events.1701.desc.marshal: "[marshal.GetShortUIName] предложил провести проникновение: перебросить небольшой отряд элитных воинов через стены во дворец под прикрытием отвлекающей атаки. Это заметно ускорило бы осаду, но могло бы стоить нам лучших войск.\n\nЯ решаю..."
wc_elemental_ritual_events.1701.opt.a: "Продолжать осаду!"
wc_elemental_ritual_events.1701.opt.b: "Подготовить военную уловку."
wc_elemental_ritual_events.1701.opt.c: "Подготовить проникающий удар."

wc_elemental_ritual_events.1710.title: "Осада Огня: В пролом"
wc_elemental_ritual_events.1710.desc.opening: "Наша осада наконец достаточно ослабила врага, чтобы мы могли пойти на приступ и пробить ворота и стены крепости Повелителя Огня.\n\n"
wc_elemental_ritual_events.1710.desc.positive: "Наши силы устремляются в проломы, с рвением взбираясь на стены и в вихре атаки разя элементалей направо и налево. Враг дрогнул перед нашим сокрушительным натиском и отступает в святилище Повелителя Огня, чтобы дать последний бой. Столь быстрая и чистая победа оставила врагу мало времени на эвакуацию замкового города, и богатая добыча с элементалями-рабами — наша!"
wc_elemental_ritual_events.1710.desc.neutral: "Битва за вход в крепость была тяжёлой. Часами наши армии безжалостно молотили друг друга в проломах, потери были высоки. При помощи могущественных заклинаний и осадных орудий нам в конце концов удалось пробить новые проломы и взять замковый город."
wc_elemental_ritual_events.1710.desc.negative: "Штурм был кошмаром. Силы Повелителя Огня ждали нас: огромные толпы врагов хлынули в проломы, ошеломив наших солдат своей огненной яростью. Сколь разрушительна ни была эта атака, мне и моему [court_caster] удалось ценой немалой маны сотворить великие заклинания и переломить ход битвы. После дней сражений, израсходовав всех, кроме самых закалённых ветеранов, мы наконец добрались до замкового города."
wc_elemental_ritual_events.1710.desc.ending: "Теперь мы готовим наших элитных воинов к штурму дворца. Сопротивление внутри наверняка будет велико: самые отборные солдаты Повелителя Огня встретят нас в бою среди клубящихся элементальных энергий непостижимой мощи."
wc_elemental_ritual_events.1710.opt.a: "Во двор! Отбросьте их!"


wc_elemental_ritual_events.1720.title: "Осада Огня: Внутри крепости"
wc_elemental_ritual_events.1720.desc.opening_normal: "Закрепившись на парапетах, мы выдвигаемся в замковый город и двор Повелителя Огня. "
wc_elemental_ritual_events.1720.desc.opening_stratagem: "Наша уловка сработала! Мы открыли ворота замка прямо под носом у стражи, и теперь наши силы врываются внутрь, минуя грозные стены и встречая противника прямо во дворе. "
wc_elemental_ritual_events.1720.desc.ending: "Схватка жестока: взрывы огненной энергии взмывают в небо и сотрясают адские строения в замковом дворе. Медленно, но верно наши силы начинают теснить войска Повелителя Огня. Шаг за шагом, линия за линией мы обращаем их в бегство. Квартал за кварталом мы отбрасываем их, пока рог не возвестит их отступление в сам дворец. Наши силы одержали победу во дворе, но перед нами всё ещё стоит святилище Повелителя Огня, которое предстоит покорить."
wc_elemental_ritual_events.1720.opt.a: "Ко дворцу! К победе!"

wc_elemental_ritual_events.1730.title: "Осада Огня: Дворец Повелителя Огня"
wc_elemental_ritual_events.1730.desc.opening_normal: "Наши силы успели отдохнуть, взять добычу, элементалей-рабов и вытянуть всю доступную силу. Теперь мы обращаем взор к святилищу Повелителя Огня. С могучим рывком наш таран пробивает роскошные двери, и наши силы врываются внутрь."
wc_elemental_ritual_events.1730.desc.opening_infiltration: "Уловка удалась: мне удалось проникнуть во дворец вместе с моими элитными воинами и шаманами."
wc_elemental_ritual_events.1730.desc.ending: "Здесь элитные огненные солдаты ждут и встречают мой отряд клинок о клинок и заклинание против заклинания. В тронном зале неподалёку сам Повелитель Огня ревёт в ярости и начинает творить заклинание непостижимой мощи. Через каждые несколько футов срабатывает ловушка, уносящая жизнь одного из моих людей. Элементали возникают из ниоткуда на наших флангах, хлынув из коридоров и из-за укрытий. Это битва, которая решит всё для нас!"
wc_elemental_ritual_events.1730.opt.a: "Держаться вместе! Долой Повелителя Огня!"

wc_elemental_ritual_events.1801.title: "Ритуал Огня: Победа"
wc_elemental_ritual_events.1801.desc: "Металлические кандалы Повелителя Огня — каждый достаточно широк, чтобы охватить два десятка людей, — с грохотом падают на пол. Из хриплых глоток моих людей вырывается победный клич. Мы сделали это! С поверженным обликом Повелителя Огня мы вольны грабить Огненные Просторы в своё удовольствие. Рано или поздно он восстановится и наверняка вернёт себе власть над этим местом — по крайней мере на время. Однако сейчас наше путешествие окончено, и вторжение в Огненные Просторы увенчалось успехом! Пора пожинать плоды нашего завоевания... Сокровища, элементали-рабы и бесконечная огненная энергия!"
wc_elemental_ritual_events.1801.opt: "Забрать всё, что можем унести!"

wc_elemental_ritual_events.1802.title: "Ритуал Огня: Поражение"
wc_elemental_ritual_events.1802.desc.stage_town: "Когда наши силы взбирались на стены, казалось, что войска Повелителя Огня были готовы к нам. Наши силы, разделённые и зажатые во дворе, дрогнули под сокрушительной тяжестью контратаки Повелителя Огня. Тем, кто бежал, не было спасения: многих зарубили, когда они поворачивались к врагу спиной. Тех немногих людей, кого я сумел собрать у осадного лагеря, недостаточно, чтобы продолжать осаду и предпринять новый штурм стен.\n\n"
wc_elemental_ritual_events.1802.desc.stage_sanctum: "Святилище Повелителя Огня поглотило моих солдат целиком. Бесконечные залпы огненной магии, волна за волной огненных элементалей-солдат, давящих на мои уставшие силы, и коварные ловушки, истощавшие волю и сами жизни даже самых отборных солдат и шаманов. В конце концов нам не удалось взять дворец, и нас выгнали из замкового города, а наши удерживавшие его силы сломила мощь самого Повелителя Огня.\n\n"
wc_elemental_ritual_events.1802.desc.stage_firelord: "Хотя нам и удалось одолеть войска Повелителя Огня, мои элитные шаманы и я не смогли одолеть самого владыку плана Огня. Наши люди отчаянно сражались и победили его отборных солдат, но у них не было ни единого шанса помочь нам против столь могущественного элементального существа. Чтобы спасти то, что было можно, я приказал отступать, а Повелитель Огня собрал остатки своей армии, использовал преимущество и оттеснил наше вторгшееся войско обратно к базовому лагерю.\n\n"
wc_elemental_ritual_events.1802.desc.degree_awful: "Даже когда мы спешно отступали от замковых стен, свежая волна элементалей-солдат уже занимала позиции и чинила укрепления. Наши люди спотыкались и карабкались по горам горящих мертвецов. Над всем этим был слышен смех Повелителя Огня, насмехавшегося над нами во время отступления. Нам не удалось унести с собой никакой добычи, и Повелитель Огня наверняка упрочит своё господство и сделает дальнейшие вторжения труднее."
wc_elemental_ritual_events.1802.desc.degree_bad: "В конечном счёте нас просто превзошли превосходящие силы; отступление было поспешным, но тактически грамотным. Хотя мы наверняка нанесли Повелителю Огня сокрушительный удар, нам не удалось вывезти из его дворца ни добычи, ни ценных рабов."
wc_elemental_ritual_events.1802.desc.degree_partial: "В конечном счёте нас просто превзошли превосходящие силы; однако дисциплина наших солдат и командиров позволила провести образцовое боевое отступление. Наш надёжный плацдарм был аккуратно демонтирован, и были приняты меры, чтобы вывезти домой в Азерот всю возможную добычу и рабов. Теперь мы должны спланировать следующий штурм и непременно вырвать победу в следующий раз."
wc_elemental_ritual_events.1802.opt_awful: "Мы потерпели неудачу."
wc_elemental_ritual_events.1802.opt: "Мы вернёмся."

