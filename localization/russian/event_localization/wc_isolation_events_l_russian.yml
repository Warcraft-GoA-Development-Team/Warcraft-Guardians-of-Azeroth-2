l_russian:
 EVTTITLE_isolation_1: "Открытие Ульдума"
 EVTDESC_isolation_1: "На южных пустошах Калимдора произошло значительное событие недалеко от земель Тистлшруба. Местные жители Танариса зафиксировали появление величественных, орнаментированных ворот, ведущих в неизведанные земли.\n\nНекоторые старейшины фарраки слышали истории и слухи о давно забытном королевстве, населенном поклонниками титанов и наполненном их артефактами, возможно, даже оружием, способным наносить разрушение на огромные расстояния, хотя никто не мог подтвердить это до сих пор.\n\nМножество исследователей уже штурмует ворота, надеясь изучить или, возможно, продать артефакты самому высокому покупателю, в то время как местные жители остаются настороженными, не желая, чтобы чужаки нарушали многовековое равновесие, особенно когда на горизонте возвышается храмовый город киражи.\n\nОдно можно сказать наверняка — Ульдум никогда не будет таким, как прежде, теперь, когда покрывало исчезло."
 ISOLATION_1_OPT_A: "А где же это супероружие, о котором все говорят?"
 ISOLATION_1_OPT_B: "Посмотрим, что принесут эти чужаки в Ульдум."
 ISOLATION_1_OPT_C: "Судьба и слава, я иду."
  
 EVTTITLE_isolation_2: "Туманы Пандарии"
 EVTDESC_isolation_2_pandaria: "Сегодня утром посланец принес вам удивительные новости. Несколько смотрителей маяков заметили странные лодки, выходящие из тумана. Одна из лодок была разрушена, но остальные смогли выбраться из туманов.\n\nКак эти лодки нашли путь в и из туманов Пандарии? Неужели это значит, что туманы рассеялись?\n\nЭкипаж разрушенной лодки не похож на любые другие расы, которых мы знаем. Они рассказывают о королевствах и землях за морем. Если их рассказы правдивы, мир гораздо больше и опаснее, чем мы думали. Мы должны подготовиться к встрече с новыми кораблями и странниками."
 EVTDESC_isolation_2_azeroth: "Сегодня утром посланец принес вам удивительные новости. Группа рыбаков в Южных морях наткнулась на неотмеченную землю. Одна из лодок была разрушена, но остальные смогли выбраться из туманов.\n\nВсе корабли знали о важности избегания этих вод из-за густого тумана и старых легенд, но похоже, туманы рассеялись.\n\nРыбаки даже говорят, что видели золотые башни вдали на горизонте. Если их истории правдивы, они могли обнаружить новую землю, населенную разумными существами, прямо к югу от Мелстрома. Нам нужно отправить экспедиции туда, чтобы узнать больше."
 ISOLATION_2_OPT_A: "Новые земли для исследования и завоевания."
 ISOLATION_2_OPT_B: "Добро пожаловать, странники!"
 ISOLATION_2_OPT_C: "Отправить экспедицию, хочу узнать больше."
  
 EVTTITLE_isolation_3: "Щит Сурамара"
 EVTDESC_isolation_3_suramar: "Магический барьер, окружавший наши древние земли, разрушен. Маги Сурамара подтвердили, что щита больше нет, и теперь мы уязвимы перед остальным Азеротом.\n\nТысячи лет мы были заточены в этом коконе, полагая, что мир снаружи был уничтожен [Glossary( 'Sundering', 'GREAT_SUNDERING_GLOSS' )]. Теперь же, зная, что за нашими границами существует жизнь, мы должны постичь чудеса мира и поделиться нашими знаниями с другими."
 EVTDESC_isolation_3_azeroth: "По всему миру ощущается великое беспокойство, так как всплеск арканной энергии был обнаружен на Разрушенных Островах.\n\nСогласно сообщениям соседних правителей и дворовых, подтверждено, что древняя эльфийская цивилизация [GetTitleByKey('k_suramar').GetName] была раскрыта миру. Щит, защищавший город в течение тысяч лет, разрушен, и теперь город открыт для мира.\n\nЭльфы Сурамара были изолированы тысячелетиями, и теперь они свободны исследовать, или подчинить мир своей эльфийской мощи."
 ISOLATION_3_OPT_A: "Интересно..."
 ISOLATION_3_OPT_B: "Наша земля снова открыта для мира."
 ISOLATION_3_OPT_C_NEIGHBOR: "Поздравим наших соседей."
 ISOLATION_3_OPT_C_ELVEN: "Я позабочусь о наших эльфийских братьях и сестрах."
 ISOLATION_3_OPT_D_NEIGHBOR: "Отправьте дружеское письмо эльфам Сурамара."
 ISOLATION_3_OPT_D_ELVEN: "Отправьте дружеское сообщение нашему роду."
 ISOLATION_3_OPT_D_UNAVAILABLE: "Вы не эльф, и не можете достичь Разрушенных Островов."
 ISOLATION_3_OPT_E_NEIGHBOR: "Предупредите эльфов, чтобы они не вмешивались в наши дела."
 ISOLATION_3_OPT_E_ELVEN: "Отправьте сообщение в Сурамар, но будьте настороже."
  
 ISOLATION_3_OPT_F_ELVEN: "Дайте этим эльфам знать об их отвратительном характере!"
 ISOLATION_3_OPT_F_NEIGHBOR: "Скажите эльфам, чтобы они держались подальше от нас!"
