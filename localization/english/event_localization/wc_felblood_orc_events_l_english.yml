l_english:

 felblood_0001_title: "Deal with the Devil"
 felblood_0001_desc: "#italic Valor won't win us wars and lands for our fellow [GetTrait('creature_orc').GetName(GetNullCharacter)]s... honor won't keep our families safe#!, I try to reason with myself as I enter the foul domain of [demon_liege.GetName].\n\n[demon_liege.GetFirstName]'s smile widens into a smile with no other muscles on that face moving, #XB "My... my... don't we have a pesky little [GetTrait('creature_orc').GetName(GetNullCharacter)] here... Do tell me, weakling, why shouldn't I just tear apart you and your failure of a [wc_race|E]?"#!\n\nI steel myself and stand my ground, "Because... I wish for power... strength needed to win, at all costs."\n\n#XB "At all costs you say, dear [ROOT.GetCharacter.GetFirstNameNoTooltip]?"#!, [demon_liege.GetFirstName]'s smile drops for a second then for a second into a shocked one then back to a thinking one.#XB "...then, kneel for me, [GetTrait('creature_orc').GetName(GetNullCharacter)]."#!\n\nI hold my breath and kneel before [demon_liege.GetFirstName]. [demon_liege.GetFirstName] approaches and curls a fist and approaches me, standing tall above me, then moves the curled fist right above my head. I see the curled fist is dripping blood, demonic blood, #XB "Don't you dare waste away even a single drop, [ROOT.GetCharacter.GetFirstNameNoTooltip], not one as they are worth more than anything your filthy [wc_race|E] has accomplished until now..."#!\n\nMy vision grows hazy and my eyes feel like they are burning. Each drop of blood grants me strength as I start burning inside out. I no longer have the skin of my kind... I no longer have their hearts either, I feel hate filled within it.\n\nI look around for [demon_liege.GetFirstName], and I am all left alone. My axe feels lighter and my steps faster. I see a bowl of blood set aside, same as [demon_liege.GetFirstName]'s. #Italic So be it...#! I grab the blood with me and head back to my clan."
 felblood_0001_a: "Wrath upon our enemies!"

 felblood_0002_title: "Devil to be dealt with"
 felblood_0002_desc: "#italic Maybe this is the only way... maybe we can go beyond some of our ancestors have...#! I think as I alone approach the dungeons where [demon_prisoner.GetFirstName] is rotting.\n\nI hear the rattling of chains and failed attempts of casting foul magic. #XB "Release me you filthy [GetTrait('creature_orc').GetName(GetNullCharacter)]! I will make sure that you and your [wc_race|E] suffers a quick death!"#!\n\n"Yes... this will do...", I say while considering [demon_prisoner.GetFirstName]'s pathetic form.#XB "Huh? What are you-"#!, I yank on the chain to bring [demon_prisoner.GetFirstName] closer and stab it on [demon_prisoner.GetHerHis] neck.\n\n[demon_prisoner.GetFirstName] goes to say something as I stab once more to sever [demon_prisoner.GetHerHis] head cleanly off. I drink the demonic blood directly coming out of [demon_prisoner.GetFirstName]'s neck. I don't stop, the more I drink, the more I feel empowered by it.\n\n"Yes... Yes! This is beyond what I had imagined", my voice booms in the dungeon. My skin has turned red and my eyes are burning and my heart feels foul. I look down at the blood still dripping from [demon_prisoner.GetFirstName]'s body, I quickly manage to gather it with me as I head back to my clan. #italic Can't let this go to waste now, can we?#!"
 felblood_0002_a: "Strength to our own!"

 felblood_0003_title: "Joy upon the allies"
 felblood_0003_desc: "I approach my clan with the demonic blood besides me... wondering if I should go beyond just keeping these powers to myself.\n\nDo I reckon my whole clan with this power? But there will be no going back... Or maybe only I alone need to suffer for the greater cause?"
 felblood_0003_a: "My blood and my clan will rise to greatness!"
 felblood_0003_a_tt: "Your family, [courtier|E]s and [vassal|E]s embrace the Fel powers alongside you"
 felblood_0003_b: "No, I alone shall suffer..."
