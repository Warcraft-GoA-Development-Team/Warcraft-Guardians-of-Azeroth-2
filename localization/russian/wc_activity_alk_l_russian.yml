 activity_anti_lichking_name: "Штурм Ледяной Короны [ACTIVITY.GetOwner.GetShortUINamePossessive|U]"
 activity_anti_lichking_desc: "Под предводительством Терении Менетил начинается дерзкий штурм Ледяной Короны, целью которого является сердце власти Короля-Лича. Этот смелый шаг, рождённый из стремления к справедливости и возмездию за Лордерон, становится решающим моментом в стремлении Терении уничтожить тень, долгое время омрачавшую её родину. Бросая вызов ледяным пустошам и ордам нежити, Терения и её союзники противостоят тёмным силам, охраняющим Цитадель Ледяной Короны, решив покончить с правлением Короля-Лича раз и навсегда."
 activity_anti_lichking_owner: "Терения Менетил"
