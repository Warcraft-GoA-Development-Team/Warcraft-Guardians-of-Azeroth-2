l_russian:
  
 liberate_lordaeron.1000.title: "Возрождённый Лордерон"
 liberate_lordaeron.1000.desc: "После бесчисленных смертей и непрекращающихся сражений [GetTitleByKey('c_lordaeron').GetName] наконец вырван из лап Плети. Народ этой израненной земли может вернуться в свои исконные дома, и со временем чума будет очищена и из воздуха, и из почвы. Но вместе с освобождением встаёт насущный вопрос правления. Кто унаследует восстановленный [GetTitleByKey('k_lordaeron').GetBaseNameNoTierNoTooltip]?\n\nСправедливо ли вернуть власть династии Менетилов, чтобы даровать стабильность через традицию?\nИли праведнее поручить опеку над королевством высшему авторитету нашей Святой Веры?\nИ всё же именно моей рукой [GetTitleByKey('c_lordaeron').GetTierAsNameNoTooltip] был освобождён от Плети. Почему же тогда я не должна — или не должен — предъявить право на него сама?"
 liberate_lordaeron.1000.A: "Взять трон себе!"
 liberate_lordaeron.1000.B: "Династия Менетилов вновь взойдёт на престол."
 liberate_lordaeron.1000.C: "Моя борьба — во имя Света!"
  
 liberate_lordaeron.1001.title: "Возрождённый Лордерон"
 liberate_lordaeron.1001.desc: "Силой самого Святого Света Лордерон был освобождён.\n\nВсе права на корону Лордерона переданы [new_ruler_of_lordaeron.GetName]. Да будет правление [new_ruler_of_lordaeron.GetFirstName] благословлено Светом, и пусть народ Лордерона вновь процветает на своей родной земле."
 liberate_lordaeron.1001.A: "Интересно..."
