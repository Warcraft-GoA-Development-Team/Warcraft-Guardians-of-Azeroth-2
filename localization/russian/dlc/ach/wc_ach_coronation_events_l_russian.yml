l_russian:
     ### Coronation Events 6100 
     ## HOST 
 coronation_events.6100.desc_like_christian: "Сверкающий [host.Custom('GetRegionalSword')] подпоясан у моего бедра. Скипетр верховной власти — в моей руке. Пальцы ложатся на священный шар, украшенный символом, олицетворяющим [host.GetFaith.GetHighGodName]. Молитвы гулко продолжаются."
 coronation_events.6100.desc_glowing_symbol: "[crowner.GetTitledFirstNameRegnal] помазывает мой лоб освящённым маслом, и Дар наару начинает ярко светиться над ним… Знак признания моей праведности от [host.GetFaith.GetFateGodName]."
 coronation_events.6100.desc_demon_blood: "Я терплю, не позволяя себе вздрогнуть, когда [crowner.GetTitledFirstNameRegnal] возлагает на мой лоб демоническую кровь, начертав ею нечестивую скверноруну. Боль и сила проходят по телу, словно удар молнии!"
 coronation_events.6100.desc_kaldorei: "В храме открывают световое окно, и сияние Элуны льётся на мои переливающиеся одежды. В правую руку [crowner.GetTitledFirstNameRegnal] кладёт хрустальный шар — символ власти Элуны; в левую [crowner.getSheHe] помещает посох — символ владычества Кенария. Я ритуально соединяю их, выражая верность гармонии между жречеством и друидами."
     ## GUEST 
 coronation_events.6100.desc_like_christian_guest: "Сверкающий [host.Custom('GetRegionalSword')] подпоясан у бедра [host.GetFirstNamePossessive]. Скипетр верховной власти — в [host.GetHerHis] руке. [host.GetHerHis|U] пальцы сжимают священный шар, украшенный символом [host.GetFaith.GetHighGodName]. Молитвы гулко продолжаются."
 coronation_events.6100.desc_glowing_symbol_guest: "[crowner.GetTitledFirstNameRegnal] помазывает лоб [host.GetFirstNamePossessive] освящённым маслом, и Дар наару начинает ярко светиться над ним… Знак признания праведности [host.GetHerHis] от [host.GetFaith.GetFateGodName]."
 coronation_events.6100.desc_demon_blood_guest: "[host.GetFirstNameRegnal] едва заметно вздрагивает, когда [crowner.GetTitledFirstNameRegnal] возлагает на [host.GetHerHis] лоб демоническую кровь, выведя нечестивую скверноруну."
 coronation_events.6100.desc_kaldorei_guest: "В храме открывают световое окно, и сияние Элуны падает на переливающиеся одежды [host.GetFirstNamePossessive]. В правую руку [host.GetHerHis] [crowner.GetTitledFirstNameRegnal] вручает хрустальный шар — символ власти Элуны; в левую [crowner.getSheHe] помещает посох — символ владычества Кенария. Затем [host.GetFirstNameRegnal] ритуально соединяет их, воплощая гармонию жречества и друидов."
  
     ## Coronation Events 6101 
 coronation_events.6101.desc_crowning_intro_wc: "Кто-то назвал бы дерзкой гордыней, что [host.GetTitleAsName] возносит корону и водружает её на собственное чело, объявляя #EMP [host.GetHerselfHimself]#! одним из избранных монархов [host.GetFaith.HighGodNamePossessive].\n\n"
 coronation_events.6101.desc_no_being_crowned_intro_wc: "[host.GetTitleAsName|l], облачённый в церемониальные одежды и вооружённый согласием [host.GetHerHis] народа… может короновать [host.GetHerselfHimself]. Таков наш обычай, хотя некоторые из [host.GetFaith.BishopNeuterPlural] завидуют этому [host.Custom('GetTitleTierAdjective')] праву.\n\n"
 coronation_events.6101.desc_crowning_priests_self: "#EMP Ха!#! Мы, #EMP [host.getCulture.GetCollectiveNoun]#!, с этим не согласны. Мы возносим скромные молитвы [host.GetFaith.GetHighGodName], а затем поступаем так, как считаем нужным!"
 coronation_events.6101.desc_words_reformed: "Сжимая в пальцах диадему, украшенную символом [host.GetFaith.ReligiousSymbol], — произнося «#EMP [host.GetFaith.GetHighGodName], Ты превыше всех царей; всe материальные миры принадлежат Твоему владычеству#!» и прочие священные строки — я короную себя владыкой [host.GetPrimaryTitle.GetNameNoTier].\n\n"
 coronation_events.6101.desc_words_reformed_guest: "Сжимая в пальцах диадему, украшенную символом [host.GetFaith.ReligiousSymbol], — произнося «#EMP [host.GetFaith.GetHighGodName], Ты превыше всех царей; всe материальные миры принадлежат Твоему владычеству#!» и прочее — [host.GetFirstNameRegnal] коронует [host.GetHerselfHimself] владыкой [host.GetPrimaryTitle.GetNameNoTier].\n\n"
  
     ## Coronation Events 6110 
 coronation_events.6110.desc_tyrist: "Святая Мерельдар, принесшая Святой Свет в Азерот."
 coronation_events.6110.desc_naarist: "Л’ура, пожертвовавшая собой, чтобы мы могли жить в Свете."
 coronation_events.6110.desc_selenite: "Натали Селин, указавшая нам путь Тени."
 coronation_events.6110.desc_sunwell: "Дат'ремар Солнечный Странник, даровавший нам Солнечный Колодец."
 coronation_events.6110.desc_void: "Ксал'атат, нашептавшая нашему миру тайны."
 coronation_events.6110.desc_loa: "Резан, лоа-король."
  
