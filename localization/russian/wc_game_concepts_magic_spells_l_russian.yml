 wc_seed_of_corruption_tooltip: "При нацеливании на персонажа враждебного [wc_spell_school_shadow|E], [wc_spell_school_disorder|E] или [wc_spell_school_death|E] [wc_spell|E] есть 25% шанс наложить на него [GetModifier( 'wc_seed_of_corruption_modifier' ).GetNameWithTooltip|L]. Когда [GetModifier( 'wc_seed_of_corruption_modifier' ).GetNameWithTooltip|L] истекает или рассеивается, вы получаете [GetModifier( 'wc_seed_of_corruption_burst_modifier' ).GetNameWithTooltip|L]."
