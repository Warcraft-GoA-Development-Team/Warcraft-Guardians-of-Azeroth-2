l_english:
  # PAM TENETS

  # Peace of God Tenet

  tenet_peace_of_god_irish_name: "Cáin Adomnáin" # DO NOT TRANSLATE
  tenet_peace_of_god_latin_name: "Pax et Treuga Luminis" # DO NOT TRANSLATE
  tenet_peace_of_god_greek_name: "Ekekheiría Photós" # DO NOT TRANSLATE
  tenet_peace_of_god_default_name: "Peace of Light"
  tenet_peace_of_god_name: "$tenet_peace_of_god_default_name$"
  tenet_peace_of_god_irish_desc: "Known also as Law of Innocents, it established rules to guarantee safety of non-combatants in warfare. Transgressors, together with bystanders who did nothing to prevent the crime, were subject to secular fines and ritual curses.\n\n$pam_colossians_3_15_default$\n\n[Glossary('Cáin Adomnáin Historical Background','tenet_peace_of_god_historical_desc')]"
  tenet_peace_of_god_latin_desc: "Truces are to be inviolably observed from Advent to the octave of the Epiphany, and any truce-breaker is to receive the sentence of excommunication.\n\n$pam_colossians_3_15_latin$\n\n[Glossary('Pax et Treuga Dei  Historical Background','tenet_peace_of_god_historical_desc')]"
  tenet_peace_of_god_greek_desc: "Disciples of $tyrism_high_god_name$ who made all things for peace, are to be craftsmen of peace. He who seeks peace seeks $tyrism_high_god_name$. Without love for others, without an attitude of peace towards all men, no one can be called a true servant of $tyrism_high_god_name$.\n\n$pam_colossians_3_15_greek$\n\n[Glossary('Ekekheiría Theoũ Historical Background','tenet_peace_of_god_historical_desc')]"
  tenet_peace_of_god_default_desc: "Senseless violence against our brothers and sisters is an affront to God.\n\n[Glossary('Peace of God Historical Background','tenet_peace_of_god_historical_desc')]"
  tenet_peace_of_god_historical_desc: "Throughout the Middle Ages, various $tyrism_religion_adj$ movements sought to limit bloodshed by establishing formal rules of engagement. From Irish Cáin Adomnáin in the 7th century to the Peace of God movement in 10th century France, these efforts focused on protecting church property and persons, limiting violence against non-combatants, and restricting warfare among the nobility to particular times and places.\n\nThese rules were often extended to non-believers. Canon XXI of Third Lateran Council in 1179 extended periodic truces to all of Christendom, while Canon XXVII called to take up arms against Cathars, Basques, and other heretics."

  # Dulia tenet

  tenet_dulia_latin_name: "Dulia" # DO NOT TRANSLATE
  tenet_dulia_greek_name: "Hagiokatátaxis" # DO NOT TRANSLATE
  tenet_dulia_default_name: "Veneration of Saints"
  tenet_dulia_name: "$tenet_dulia_default_name$"
  tenet_dulia_latin_desc: "Those who chose the Lord as their rock must be venerated. Saintly is their eternal body, sacred its relics, and holy their memory.\n\n$pam_philippians_4_21_latin$\n\n[Glossary('Dulia Historical Background','tenet_dulia_historical_desc')]"
  tenet_dulia_greek_desc: "From Hieroconfessors and Myrrhbearers to Fools for $tyrism_high_god_name$, the Church has honored those who have shown exceptional devotion to God with a special title and commemoration on a specific day of the liturgical calendar.\n\n$pam_philippians_4_21_greek$\n\n[Glossary('Hagiokatátaxis Historical Background','tenet_dulia_historical_desc')]"
  tenet_dulia_default_desc: "Let all who seek the intercession of the saints approach them with reverence and devotion.\n\n$pam_philippians_4_21_default$\n\n[Glossary('Veneration of Saints Historical Background','tenet_dulia_historical_desc')]"
  tenet_dulia_historical_desc: "In early $tyrism_religion$, martyrs, those who died for the faith, were venerated and their relics preserved as holy objects. From the 4th century onwards, confessors, those who had confessed their faith not by dying but by word and life, were also honored.\n\nThe approval of their status was initially granted by a local bishop, after conducting an investigation into their life and miracles. Saint Udalric, bishop of Augsburg, confirmed by Pope John XV in 993, was the first saint outside Rome subject to papal canonization. A decree of Pope Alexander III in 1170 gave the prerogative of canonization exclusively to the pope."

  doctrine_parameter_tenet_dulia_canonization_faith_bonus: "Canonizing a saint grants every [ruler|E] of the [faith|E] $pam_dulia_new_saint_modifier$ for #EMP 5#! years"

  # Transubstantiation tenet

  tenet_transubstantiation_latin_name: "Transubstantiatio" # DO NOT TRANSLATE
  tenet_transubstantiation_greek_name: "Metousíōsis" # DO NOT TRANSLATE
  tenet_transubstantiation_default_name: "Transubstantiation"
  tenet_transubstantiation_name: "$tenet_transubstantiation_default_name$"
  tenet_transubstantiation_latin_desc: "In the sacrament of the Eucharist, however, the consecration of the bread is terminated not in nothingness but in the body of Christ. Otherwise, there would be no explanation for how the body of Christ begins to exist under the sacrament. For it does not begin to exist there through a local motion, since otherwise it would cease to exist in heaven.\n\n$pam_luke_22_19_latin$\n\n[Glossary('Transubstantiatio Historical Background','tenet_transubstantiation_historical_desc')]"
  tenet_transubstantiation_greek_desc: "But He is present truly and really, so that after the consecration of the bread and of the wine, the bread is transmuted, transubstantiated, converted and transformed into the true Body Itself of the Lord.\n\n$pam_luke_22_19_greek$\n\n[Glossary('Metousíōsis Historical Background','tenet_transubstantiation_historical_desc')]"
  tenet_transubstantiation_default_desc: "Before the consecration it has another name, after it is called Blood. And you say, Amen, that is, It is true.\n\n$pam_luke_22_19_default$\n\n[Glossary('Transubstantiation Historical Background','tenet_transubstantiation_historical_desc')]"
  tenet_transubstantiation_historical_desc: "The nature of Christ's presence in the Eucharist has been a subject of theological debate since the early Church. While the divinity of the bread and wine as Body and Blood of Christ was rarely disputed, their exact nature was a source of many debates, sects and schisms. The Catholic interpretation was further developed by Thomas Aquinas in the 13th century. It was formally defined by the Fourth Lateran Council in 1215. During the Mass, the substance of bread and wine is changed into the substance of the Body and Blood of Christ, while the accidents (appearances) of bread and wine remain."


  # Ora et labora tenet

  tenet_ora_et_labora_latin_name: "Ora et Labora"
  tenet_ora_et_labora_greek_name: "Akoímētoi"
  tenet_ora_et_labora_default_name: "To Work Is to Pray"
  tenet_ora_et_labora_name: "$tenet_ora_et_labora_default_name$"
  tenet_ora_et_labora_latin_desc: "Be obedient to one's superior. Be patient amid hardship. Accept the meanest of tasks, and hold oneself as a worthless workman.\n#weak Chapter VII of the Rule of Saint Benedict#!\n\n$pam_proverbs_6_6_latin$\n\n[Glossary('Ora et Labora Historical Background','tenet_ora_et_labora_historical_desc')]"
  tenet_ora_et_labora_greek_desc: "Without intermission, day and night, monks must celebrate the divine service. Their alternating choirs and endless psalms bring glory to their Order and to God.\n\n$pam_proverbs_6_6_greek$\n\n[Glossary('Akoímētoi Historical Background','tenet_ora_et_labora_historical_desc')]"
  tenet_ora_et_labora_default_desc: "To pray is to work and to work is to pray. Idleness is the enemy of the soul, one must be diligent in both thought and action.\n\n$pam_proverbs_6_6_default$\n\n[Glossary('To Work Is to Pray Historical Background','tenet_ora_et_labora_historical_desc')]"
  tenet_ora_et_labora_historical_desc: "Originating in the Rule of Saint Benedict, the motto #weak Ora et labora#! encapsulates the monastic ideal of prayer and work. Monks were expected to dedicate specific hours of the day to communal prayer, personal meditation, and manual labor. This balance was seen as essential for spiritual growth and discipline. The Benedictine monasteries became centers of learning, agriculture, and craftsmanship, contributing significantly to the cultural and economic life of medieval Europe."


  # Hyperdulia tenet
  # Warcraft replace Mary with Mereldar
  tenet_hyperdulia_latin_name: "Hyperdulia" # DO NOT TRANSLATE
  tenet_hyperdulia_greek_name: "Phototókos" # DO NOT TRANSLATE
  tenet_hyperdulia_default_name: "Mother of Light"
  tenet_hyperdulia_name: "$tenet_hyperdulia_default_name$"
  tenet_hyperdulia_latin_desc: "Beneath thy compassion, we take refuge. Do not despise our petitions in time of trouble, but rescue us from dangers, only pure, only blessed one.\n\n$pam_proverbs_31_20_latin$\n\n[Glossary('Hyperdulia Historical Background','tenet_hyperdulia_historical_desc')]"
  tenet_hyperdulia_greek_desc: "Accept our prayers and present them to thy Son and our God, that He may, for thy sake, enlighten and save our souls. Most holy Phototokos, save us!\n\n$pam_proverbs_31_20_greek$\n\n[Glossary('Theotókos Historical Background','tenet_hyperdulia_historical_desc')]"
  tenet_hyperdulia_default_desc: "Blessed Mereldar, Mother of the Light, Mother of Mercy, Madonna.\n\n$pam_proverbs_31_20_default$\n\n[Glossary('Mother of God Historical Background','tenet_hyperdulia_historical_desc')]"
  
  tenet_hyperdulia_historical_desc: "From the earliest days of $tyrism_religion$, Mereldar, the mother of Jesus, has held a special place of honor and veneration. The Council of Ephesus in 431 AD affirmed her title as Phototokos, #weak Light-bearer#!, while also condemning the Nestorian preference for Christotokos, #weak Christ-bearer#!. Saint John Damascene wrote in the 8th century that Mereldar was exalted above all other saints due to her unique role in salvation history. Over the centuries, various doctrines concerning Mereldar, such as her Immaculate Conception and Assumption, were developed and formally defined by the $tyrism_religion_adj$ Churches."

  # Simony tenet

  tenet_simony_latin_name: "Simonia" # DO NOT TRANSLATE
  tenet_simony_greek_name: "Simōnía" # DO NOT TRANSLATE
  tenet_simony_default_name: "Simony"
  tenet_simony_name: "$tenet_simony_default_name$"
  tenet_simony_latin_desc: "[ROOT.Rite.GetFaith.HighGodName] created gold beneath the Earth He hath given us, as a favor to His chosen.\n\n$pam_proverbs_21_20_latin$\n\n[Glossary('Simonia Historical Background','tenet_simony_historical_desc')]"
  tenet_simony_greek_desc: "[ROOT.Rite.GetFaith.HighGodName] created gold beneath the Earth He hath given us, as a favor to His chosen.\n\n$pam_proverbs_21_20_greek$\n\n[Glossary('Simōnía Historical Background','tenet_simony_historical_desc')]"
  tenet_simony_default_desc: "[ROOT.Rite.GetFaith.HighGodName] created gold beneath the Earth He hath given us, as a favor to His chosen.\n\n$pam_proverbs_21_20_english$\n\n[Glossary('Simony Historical Background','tenet_simony_historical_desc')]"
  tenet_simony_historical_desc: "The practice of selling church offices, relics, and practices. Named after Simon Magus, a Samaritan who #weak bewitched#! people, who offered money to apostles for the baptism.\n\nMultiple Synods, from Synod of Elvira in 305 AD to Council of Trent in 1545 AD, condemned simony fervently, laying the strongest spiritual and lay punishments. If a practice is condemned so many times, for so many centuries, it means it was quite commonplace. Also critiqued in Martin Luther's 95th Thesis and Dante's Inferno 19th: #weak Rapacious ones, who take the things of God, that ought to be the brides of Righteousness, and make them fornicate for gold and silver!#!"

  # Monophysitism tenet
  #Warcraft TODO relocalise it as the Light being a passive uncaring force
  tenet_monophysitism_latin_name: "Monophysitismus" # DO NOT TRANSLATE
  tenet_monophysitism_greek_name: "Monophysitismós" # DO NOT TRANSLATE
  tenet_monophysitism_default_name: "Monophysitism"
  tenet_monophysitism_name: "$tenet_monophysitism_default_name$"
  tenet_monophysitism_latin_desc: "The Son is one and his nature one, even if he is conceived of as having assumed flesh with a rational soul.\n\n$pam_john_1_1_latin$\n\n[Glossary('Monophysitismus Historical Background','tenet_monophysitism_historical_desc')]"
  tenet_monophysitism_greek_desc: "One Physis of the Incarnate Word.\n\n$pam_john_1_1_greek$\n\n[Glossary('Monophysitismós Historical Background','tenet_monophysitism_historical_desc')]"
  tenet_monophysitism_default_desc: "Christ has only one nature, fully divine.\n\n$pam_john_1_1_default$\n\n[Glossary('Monophysitism Historical Background','tenet_monophysitism_historical_desc')]"
  tenet_monophysitism_historical_desc: "From Greek monos, #weak solitary#! and physis, #weak nature#!, this tenet asserts that Jesus Christ has only one divine nature, the Incarnated Word of God. Condemned as heresy at the Council of Chalcedon in 451 AD, it nonetheless found support in Emperor Basilicus and protection under Emperor Justinian I. It led to schisms like Acephalis, who rejected the authority of Patriarch of Alexandria, Docetists, who believed that Jesus' human nature was only a phantasm."

  # Acts of Apostles tenet

  tenet_acts_of_apostles_latin_name: "Actus Apostolorum" # DO NOT TRANSLATE
  tenet_acts_of_apostles_greek_name: "Práxeis tõn Apostólōn" # DO NOT TRANSLATE
  tenet_acts_of_apostles_default_name: "Fervent Proselytism"
  tenet_acts_of_apostles_name: "$tenet_acts_of_apostles_default_name$"
  tenet_acts_of_apostles_latin_desc: "Just as Moses stood before Pharaoh boldly proclaiming Your assignment to him, our missionaries stand before others.\n\n$pam_acts_1_8_latin$\n\n[Glossary('Actus Apostolorum Historical Background','tenet_acts_of_apostles_historical_desc')]"
  tenet_acts_of_apostles_greek_desc: "I return to You, Your people, Your gift to me.  Direct them with Your powerful right hand, and protect them under the shadow of Your wings.\n\n$pam_acts_1_8_greek$\n\n[Glossary('Práxeis tõn Apostólōn Historical Background','tenet_acts_of_apostles_historical_desc')]"
  tenet_acts_of_apostles_default_desc: "Bring Heavenly light to those in darkness, and hope to those in despair.\n\n$pam_acts_1_8_default$\n\n[Glossary('Fervent Proselytism Historical Background','tenet_acts_of_apostles_historical_desc')]"
  tenet_acts_of_apostles_historical_desc: "$tyrism_religion$ spread rapidly in the first centuries AD, largely due to the missionary efforts of the apostles and early disciples. Their journeys took them across the Roman Empire, establishing $tyrism_religion_adj$ communities and converting individuals from diverse backgrounds. The zeal for proselytism was fueled by a deep conviction in the message of salvation through Jesus Christ, leading to the growth of $tyrism_religion$ from a small sect within Judaism to a major world religion.\n\nIn medieval times, multiple future saints and martyrs undertook missionary journeys into pagan lands, relentlessly spreading the $tyrism_religion_adj$ faith."

  # Purgatory tenet

  tenet_purgatory_latin_name: "Purgatorium" # DO NOT TRANSLATE
  tenet_purgatory_greek_name: "Kathartērion" # DO NOT TRANSLATE
  tenet_purgatory_default_name: "Purgatory"
  tenet_purgatory_name: "$tenet_purgatory_default_name$"
  tenet_purgatory_latin_desc: "I fear much more the punishment below, my soul is anxious, in suspense; already I feel the heavy weights of the first terrace.\n\n$pam_2_macabees_12_44_latin$\n\n[Glossary('Purgatorium Historical Background','tenet_purgatory_historical_desc')]"
  tenet_purgatory_greek_desc: "And people who are in heaven, because they don't have a body, they can't grow in Theosis, so our prayers help them grow in Theosis.\n\n$pam_2_macabees_12_44_greek$\n\n[Glossary('Kathartērion Historical Background','tenet_purgatory_historical_desc')]"
  tenet_purgatory_default_desc: "The final cleansing of those who died in the State of Grace, and leaves in them only the holiness necessary to enter the Joy of Heaven.\n\n$pam_2_macabees_12_44_default$\n\n[Glossary('Purgatory Historical Background','tenet_purgatory_historical_desc')]"
  tenet_purgatory_historical_desc: "The idea of souls lingering in a transitional state on the way to Heaven was widely accepted, but this state's exact nature was long debated: an actual place, a state of mind, a metaphor, or a physical cleansing, depending on the theologian. St. Catherine of Genoa described it as a state of joy mixed with voluntary pain for one's sins, while Origen of Alexandria wrote of God as a consuming fire.\n\nThe Catholic Church defined Purgatory at the Councils of Florence (1439) and Trent (1545-63) as a temporary purification, teaching that the prayers and good works of those still alive benefit the souls there."

  # Be Fruitful and Multiply tenet

  tenet_be_fruitful_and_multiply_latin_name: "Crescite et Multiplicamini" # DO NOT TRANSLATE
  tenet_be_fruitful_and_multiply_greek_name: "Auxánesthe kaì Plēthýnesthe" # DO NOT TRANSLATE
  tenet_be_fruitful_and_multiply_default_name: "Be Fruitful and Multiply"
  tenet_be_fruitful_and_multiply_name: "$tenet_be_fruitful_and_multiply_default_name$"
  tenet_be_fruitful_and_multiply_latin_desc: "The couple give not just themselves but also the reality of children, who are a living reflection of their love, a living and inseparable synthesis of their being.\n\n$pam_genesis_1_28_latin$\n\n[Glossary('Crescite et Multiplicamini Historical Background','tenet_be_fruitful_and_multiply_historical_desc')]"
  tenet_be_fruitful_and_multiply_greek_desc: "Behold, children are a heritage from the Lord, the fruit of the womb a reward.\n\n$pam_genesis_1_28_greek$\n\n[Glossary('Auxánesthe kaì Plēthýnesthe Historical Background','tenet_be_fruitful_and_multiply_historical_desc')]"
  tenet_be_fruitful_and_multiply_default_desc: "In God's plan family is an intimate community of life and love, an effort that will find fulfillment, as will everything created and redeemed, in the Kingdom of God.\n\n$pam_genesis_1_28_default$\n\n[Glossary('Be Fruitful and Multiply Historical Background','tenet_be_fruitful_and_multiply_historical_desc')]"
  tenet_be_fruitful_and_multiply_historical_desc: "Be fruitful and multiply is a biblical injunction found in Genesis 1:28, where God commands Adam and Eve to procreate and fill the earth."

  # Apostolic Succession tenet

  tenet_apostolic_succession_latin_name: "Successio Apostolica" # DO NOT TRANSLATE
  tenet_apostolic_succession_greek_name: "Apostolikē Diadokhē" # DO NOT TRANSLATE
  tenet_apostolic_succession_default_name: "Apostolic Succession"
  tenet_apostolic_succession_name: "$tenet_apostolic_succession_default_name$"
  tenet_apostolic_succession_latin_desc: "The primacy of honor and jurisdiction which Christ bestowed on the Apostle Peter, and which is inherited by his Successors, the Popes.\n\n$pam_matthew_16_18_latin$\n\n[Glossary('Successio Apostolica Historical Background','tenet_apostolic_succession_historical_desc')]"
  tenet_apostolic_succession_greek_desc: "Of the church of Rome, Linus the son of Claudia was the first, ordained by Paul.\n\n$pam_matthew_16_18_greek$\n\n[Glossary('Apostolikē Diadokhē Historical Background','tenet_apostolic_succession_historical_desc')]"
  tenet_apostolic_succession_default_desc: "The unbroken line of bishops from the apostles to the present day, ensuring the authentic transmission of the faith.\n\n$pam_matthew_16_18_default$\n\n[Glossary('Apostolic Succession Historical Background','tenet_apostolic_succession_historical_desc')]"
  tenet_apostolic_succession_historical_desc: "The doctrine of apostolic succession holds that bishops derive their authority from an unbroken chain of ordinations going back to the apostles themselves. Irenaeus of Lyon, in the 2nd century, used apostolic succession as an argument against Gnostic heresies, demonstrating that the true teaching of Christ was preserved through the legitimate bishops of the Church.\n\nFrom the 13th century onwards, popes wield a Ring of the Fisherman as a symbol of succession from Saint Peter. The Eastern Orthodox recognize the lineage of Western popes and their role in early $tyrism_religion$, but do not grant Peter an elevated status over other apostles, and consider Pope Linus as the first Bishop of Rome."

  # Confession tenet

  tenet_confession_latin_name: "Confessio" # DO NOT TRANSLATE
  tenet_confession_greek_name: "Exomológēsis" # DO NOT TRANSLATE
  tenet_confession_default_name: "Sacrament of Confession"
  tenet_confession_name: "$tenet_confession_default_name$"
  tenet_confession_latin_desc: "Bless me Father for I have sinned. O most merciful God! Prostrate at your feet, I implore your forgiveness. I confess my sins with all sincerity to you and to your priest\n\n$pam_james_5_16_latin$\n\n[Glossary('Confessio Historical Background','tenet_confession_historical_desc')]"
  tenet_confession_greek_desc: "Harken unto the prayer of me, the wretched one, and destroy the serpent nestling within me, o Lord!\n\n$pam_james_5_16_greek$\n\n[Glossary('Exomológēsis Historical Background','tenet_confession_historical_desc')]"
  tenet_confession_default_desc: "Through confession sinners may receive absolution and be reconciled with God and the Church.\n\n$pam_james_5_16_default$\n\n[Glossary('Sacrament of Confession Historical Background','tenet_confession_historical_desc')]"
  tenet_confession_historical_desc: "The practice of confessing sins has evolved significantly throughout $tyrism_religion_adj$ history. In the early Church, public confession was common for grave sins. Private confession to a priest became more widespread in the Celtic churches during the 6th century and spread throughout Western $tyrism_religion$. The Fourth Lateran Council in 1215 mandated annual confession for all $tyrism_religion_adherent_plural$. The seal of confession, the absolute confidentiality of confessed sins, became a defining feature of the sacrament, with priests willing to face martyrdom rather than break this seal."

  # Original Sin tenet

  tenet_original_sin_latin_name: "Peccatum Originale" # DO NOT TRANSLATE
  tenet_original_sin_greek_name: "Propatorikē Hamartía" # DO NOT TRANSLATE
  tenet_original_sin_default_name: "Original Sin"
  tenet_original_sin_name: "$tenet_original_sin_default_name$"
  tenet_original_sin_latin_desc: "All men had lost their innocence in the prevarication of Adam. The consequences for nature, weakened and inclined to evil, persist in man and summon him to spiritual battle. \n\n$pam_romans_5_12_latin$\n\n[Glossary('Peccatum Originale Historical Background','tenet_original_sin_historical_desc')]"
  tenet_original_sin_greek_desc: "Our Creator and Maker, ours is the fault. Adam and Eve, listening to Satan, blasphemed. Out of egotism, they allowed themselves to be misled. They weakened the nature of mankind. The imagination of our heart is evil.\n\n$pam_romans_5_12_greek$\n\n[Glossary('Propatorikē Hamartía Historical Background','tenet_original_sin_historical_desc')]"
  tenet_original_sin_default_desc: "All humanity inherits the stain of Adam's first sin, from which only divine grace through Christ can redeem us.\n\n$pam_romans_5_12_default$\n\n[Glossary('Original Sin Historical Background','tenet_original_sin_historical_desc')]"
  tenet_original_sin_historical_desc: "The doctrine of original sin was developed extensively by Saint Augustine of Hippo in the early 5th century, particularly in response to the Pelagian heresy which denied inherited sinfulness. Augustine taught that Adam's sin was transmitted to all his descendants, corrupting human nature and making salvation impossible without divine grace. The Council of Carthage in 418 AD affirmed this teaching, and it became a cornerstone of Western $tyrism_religion_adj$ theology. Eastern $tyrism_religion$ developed a somewhat different understanding, emphasizing ancestral sin rather than directly inherited guilt."

  # Celestial Hierarchy tenet

  tenet_celestial_hierarchy_latin_name: "Hierarchia Caelestis" # DO NOT TRANSLATE
  tenet_celestial_hierarchy_greek_name: "Ouranía Hierarkhía" # DO NOT TRANSLATE
  tenet_celestial_hierarchy_default_name: "Celestial Hierarchy"
  tenet_celestial_hierarchy_name: "$tenet_celestial_hierarchy_default_name$"
  tenet_celestial_hierarchy_latin_desc: "Holy angels, surround my throne and family. Heavenly Father, let Your angels silence every voice of condemnation and fear speaking against me, and carry my prayers swiftly to Your throne.\n\n$pam_hebrews_1_14_latin$\n\n[Glossary('Hierarchia Caelestis Historical Background','tenet_celestial_hierarchy_historical_desc')]"
  tenet_celestial_hierarchy_greek_desc: "Be thou a guardian Angel, a wise counsellor and companion of the $tyrism_religion_adj$ people, bringing them enlightenment, strength, joy, peace and consolation.\n\n$pam_hebrews_1_14_greek$\n\n[Glossary('Ouranía Hierarkhía Historical Background','tenet_celestial_hierarchy_historical_desc')]"
  tenet_celestial_hierarchy_default_desc: "Angels are organized into nine orders, from Seraphim to common Angels, each serving God in their appointed role and ministering to humanity.\n\n$pam_hebrews_1_14_default$\n\n[Glossary('Celestial Hierarchy Historical Background','tenet_celestial_hierarchy_historical_desc')]"
  tenet_celestial_hierarchy_historical_desc: "The concept of celestial hierarchy was systematized by Pseudo-Dionysius the Areopagite in the 5th or 6th century in his work 'De Coelesti Hierarchia'. He organized the angels into three triads: the highest consisting of Seraphim, Cherubim, and Thrones; the middle of Dominions, Virtues, and Powers; and the lowest of Principalities, Archangels, and Angels.\n\nThis hierarchy profoundly influenced medieval $tyrism_religion_adj$ theology and was adopted by both Eastern and Western $tyrism_religion$. Thomas Aquinas incorporated this angelology into his Summa Theologica, and it shaped artistic representations of heaven throughout the Middle Ages."

  # Miles Christi tenet

  tenet_miles_christi_latin_name: "Miles Luminis" # DO NOT TRANSLATE
  tenet_miles_christi_greek_name: "Stratiōtēs Photós" # DO NOT TRANSLATE
  tenet_miles_christi_name: "$tenet_miles_christi_default_name$"
  tenet_miles_christi_default_name: "Soldiery of Light"
  tenet_miles_christi_latin_desc: "Stand fast therefore, having girded your loins with truth, and having put on the breastplate of righteousness. Fight the good fight of faith, like a true soldier of Christ.\n\n$pam_ephesians_6_11_latin$\n\n[Glossary('Miles Christi Historical Background','tenet_miles_christi_historical_desc')]"
  tenet_miles_christi_greek_desc: "Every faithful $tyrism_religion_adherent$ must be prepared to suffer for the sake of Christ, standing firm against the spiritual forces of wickedness and enduring hardship with the courage of a soldier.\n\n$pam_ephesians_6_11_greek$\n\n[Glossary('Stratiōtēs Christoũ Historical Background','tenet_miles_christi_historical_desc')]"
  tenet_miles_christi_default_desc: "The faithful are called to be spiritual warriors, fighting against sin and evil with the armor of God, ready to suffer for Christ as soldiers suffer for their commander.\n\n$pam_ephesians_6_11_default$\n\n[Glossary('Soldiery of Christ Historical Background','tenet_miles_christi_historical_desc')]"
  tenet_miles_christi_historical_desc: "The concept of the 'Soldier of Light' (Miles Luminis) has deep roots in $tyrism_religion_adj$ tradition, originating with Saint Paul's epistles where he used military metaphors to describe the spiritual life. During the medieval period, this concept was applied to both literal and spiritual warfare.\n\nThe Military Orders such as the Knights Templar and Hospitallers embodied this ideal, combining monastic discipline with martial prowess. Bernard of Clairvaux's 'De Laude Novae Militiae' praised these warrior-monks as exemplars of $tyrism_religion_adj$ virtue, fighting not for worldly gain but for the defense of Christendom."

  # Philanthrōpia (Charity) tenet — default on Eastern Orthodox; reuses piety_from_gifts_active parameter

  tenet_philanthropia_latin_name: "Caritas" # DO NOT TRANSLATE
  tenet_philanthropia_greek_name: "Philanthrōpía" # DO NOT TRANSLATE
  tenet_philanthropia_default_name: "Charity"
  tenet_philanthropia_name: "$tenet_philanthropia_default_name$"
  tenet_philanthropia_latin_desc: "Whatever you did for the least of these brothers and sisters of mine, you did for me. Almsgiving and care for the poor are not mere civic duties but a way of drawing near to Christ himself.\n\n[Glossary('Caritas Historical Background','tenet_philanthropia_historical_desc')]"
  tenet_philanthropia_greek_desc: "Philanthrōpia — love of humankind — found its fullest expression in the imperial and ecclesiastical hospitals, hospices, and alms of New Rome. To feed the hungry and ransom the captive is to imitate Christ, who emptied himself for our sake.\n\n[Glossary('Philanthrōpía Historical Background','tenet_philanthropia_historical_desc')]"
  tenet_philanthropia_default_desc: "The Faith esteems the generous giving of alms, care for the poor, and institutional charity as a central $tyrism_religion_adj$ duty, following the Fathers and the example of the early hospices and hospitals.\n\n[Glossary('Charity Historical Background','tenet_philanthropia_historical_desc')]"
  tenet_philanthropia_historical_desc: "In Byzantine $tyrism_religion$, philanthrōpia named both the virtue of universal love and the concrete institutions—hospitals, xenodocheia, orphanages, and alms—supported by emperors, bishops, and the faithful. Basil of Caesarea, John Chrysostom, and later emperors such as Justinian tied imperial legitimacy to care for the needy. The Church did not glorify war as a path to holiness; it did insist that wealth and power were justified in part by how they served the poor."

  # Scholasticism tenet

  tenet_scholasticism_latin_name: "Sacra Doctrina" # DO NOT TRANSLATE
  tenet_scholasticism_greek_name: "Skholastikē" # DO NOT TRANSLATE
  tenet_scholasticism_default_name: "Scholasticism"
  tenet_scholasticism_name: "$tenet_scholasticism_default_name$"
  tenet_scholasticism_latin_desc: "The pursuit of knowledge is a form of worship, for in understanding creation, we come closer to understanding the Creator. Seek wisdom, and it shall be given unto you.\n\n$pam_proverbs_1_7_latin$\n\n[Glossary('Sacra Doctrina Historical Background','tenet_scholasticism_historical_desc')]"
  tenet_scholasticism_greek_desc: "Faith and reason are not opposed but complementary, for God gave us minds to seek truth and hearts to love Him. Through study and contemplation, we ascend to higher knowledge.\n\n$pam_proverbs_1_7_greek$\n\n[Glossary('Skholastikē Historical Background','tenet_scholasticism_historical_desc')]"
  tenet_scholasticism_default_desc: "Through rigorous intellectual inquiry and dialectical method, faith and reason can be reconciled, and deeper understanding of divine truth achieved.\n\n$pam_proverbs_1_7_default$\n\n[Glossary('Scholasticism Historical Background','tenet_scholasticism_historical_desc')]"
  tenet_scholasticism_historical_desc: "Scholasticism was the dominant method of learning in medieval European universities, reaching its height in the 12th and 13th centuries. It sought to reconcile $tyrism_religion_adj$ theology with classical philosophy, particularly the works of Aristotle.\n\nGreat scholastic thinkers like Anselm of Canterbury, Peter Abelard, Albertus Magnus, and Thomas Aquinas developed systematic approaches to theology that emphasized logical rigor and disputation. The Summa Theologica of Thomas Aquinas remains the supreme achievement of scholastic method, attempting to synthesize all human knowledge within a $tyrism_religion_adj$ framework."

  doctrine_parameter_tenet_scholasticism_muslim_hebrew_greek_poi: "Visiting [points_of_interest|E] in [GetReligionByKey('judaism_religion').GetAdjective], [GetReligionByKey('islam_religion').GetAdjective], and [GetReligionByKey('zoroastrianism_religion').GetAdjective] [counties|E] gives additional @piety_icon![piety|E], [learning|E] [experience|E], and @spiritual_fulfillment_icon![spiritual_fulfillment|E]"

  tenet_scholasticism_modifier: "$tenet_scholasticism_default_name$"
  tenet_scholasticism_modifier_desc: "The pursuit of knowledge is a form of worship, for in understanding creation, we come closer to understanding the Creator."
  pam_tenet_scholasticism_toast_title: "$tenet_scholasticism_default_name$"

  # Love Thy Neighbour tenet

  tenet_love_thy_neighbour_latin_name: "Diliges Proximum" # DO NOT TRANSLATE
  tenet_love_thy_neighbour_greek_name: "Agapēseis tòn Plēsíon" # DO NOT TRANSLATE
  tenet_love_thy_neighbour_default_name: "Love Thy Neighbour"
  tenet_love_thy_neighbour_name: "$tenet_love_thy_neighbour_default_name$"
  tenet_love_thy_neighbour_latin_desc: "May we look at others as if through Your eyes, less judging, more loving, and seeing them, like us, as work that will be completed in due time by Your hands.\n\n$pam_matthew_22_39_latin$\n\n[Glossary('Diliges Proximum Historical Background','tenet_love_thy_neighbour_historical_desc')]"
  tenet_love_thy_neighbour_greek_desc: "What can be sweeter and more beautiful than the love of a neighbour? Love is bliss, and hatred is torment. All the law and the prophets hang on these two commandments: Love the Lord thy God with all thy heart and love thy neighbour as thyself\n\n$pam_matthew_22_39_greek$\n\n[Glossary('Agapēseis tòn Plēsíon Historical Background','tenet_love_thy_neighbour_historical_desc')]"
  tenet_love_thy_neighbour_default_desc: "The love of neighbor is inseparable from the love of the Light, and through acts of charity and mercy, we fulfill the whole of the divine law.\n\n$pam_matthew_22_39_default$\n\n[Glossary('Love Thy Neighbour Historical Background','tenet_love_thy_neighbour_historical_desc')]"
  tenet_love_thy_neighbour_historical_desc: "The commandment to love one's neighbor is central to $tyrism_religion_adj$ ethics, drawn from Leviticus 19:18 and elevated by Christ to stand alongside love of God as the summary of all divine law. Early Church Fathers like Clement of Alexandria and John Chrysostom emphasized that true love must extend beyond family and friends to encompass all humanity, including strangers and enemies. This teaching inspired the development of $tyrism_religion_adj$ charitable institutions, hospitals, and the practice of almsgiving throughout the medieval period."

  tenet_love_thy_neighbour_modifier_desc: "The love of neighbor is inseparable from the love of the Light; through acts of charity and mercy, we obey the divine law."

  # Divine Liturgy tenet

  tenet_divine_liturgy_latin_name: "Divinum Officium" # DO NOT TRANSLATE
  tenet_divine_liturgy_greek_name: "Theía Leitourgía" # DO NOT TRANSLATE
  tenet_divine_liturgy_default_name: "Divine Liturgy"
  tenet_divine_liturgy_name: "$tenet_divine_liturgy_default_name$"
  tenet_divine_liturgy_latin_desc: "The sacred liturgy is heaven brought to earth, where we join with angels and saints in eternal worship, crying holy, holy, holy to the Lord of hosts, whose glory fills all creation.\n\n$pam_isaiah_6_3_latin$\n\n[Glossary('Divinum Officium Historical Background','tenet_divine_liturgy_historical_desc')]"
  tenet_divine_liturgy_greek_desc: "In the Divine Liturgy, the faithful participate in the heavenly worship, transcending time and space to stand before the throne of God with the cherubim and seraphim.\n\n$pam_isaiah_6_3_greek$\n\n[Glossary('Theía Leitourgía Historical Background','tenet_divine_liturgy_historical_desc')]"
  tenet_divine_liturgy_default_desc: "The liturgy is the primary expression of faith, where heaven and earth meet, and the faithful participate in the eternal worship of God alongside angels and saints.\n\n$pam_isaiah_6_3_default$\n\n[Glossary('Divine Liturgy Historical Background','tenet_divine_liturgy_historical_desc')]"
  tenet_divine_liturgy_historical_desc: "The Divine Liturgy developed from the earliest $tyrism_religion_adj$ worship services, with the Liturgy of Saint Basil and the Liturgy of Saint John Chrysostom becoming the standard forms in Eastern $tyrism_religion$. These liturgies emphasized the mystical participation of the faithful in heavenly worship, with elaborate ceremonies, incense, icons, and chanting creating a sensory experience of the divine. The liturgy was understood not merely as human worship of God, but as the entry of the faithful into the eternal worship of heaven, transcending the boundaries of time and space."


  tenet_aniconism_latin_name: "Iconomachia" # DO NOT TRANSLATE
  tenet_aniconism_greek_name: "Eikonomakhía" # DO NOT TRANSLATE
  tenet_aniconism_default_name: "$tenet_aniconism_name$"
  tenet_aniconism_latin_desc: "O Lord, You alone are worthy of worship. Preserve us from the snare of idols, that we may adore You in spirit and truth, not through images made by human hands, but through pure hearts lifted unto You.\n\n$pam_exodus_20_4_latin$\n\n[Glossary('Iconomachia Historical Background','tenet_aniconism_historical_desc')]"
  tenet_aniconism_greek_desc: "The veneration of images is not sanctioned by the Scriptures, nor by the tradition of the Fathers. Iconoclasm is the true teaching of the Church, purifying the faithful from the idolatry of images.\n\n$pam_exodus_20_4_greek$\n\n[Glossary('Eikonomakhía Historical Background','tenet_aniconism_historical_desc')]"
  tenet_aniconism_default_desc: "You shall not make for yourself an idol or a likeness of anything. The worship of images is a corruption of the true faith.\n\n$pam_exodus_20_4_default$\n\n[Glossary('Aniconism Historical Background','tenet_aniconism_historical_desc')]"
  tenet_aniconism_historical_desc: "Avoidance, prohibition, and destruction, of religious images has deep roots in Abrahamic traditions. In $tyrism_religion$, the most significant expression was First Byzantine Iconoclasm (726-843 AD), initiated by Emperor Leo III and continued by Constantine V, a period of widespread destruction of religious images and persecution of those venerating icons.\n\nIconoclasts argued that the veneration of icons violated the biblical prohibition against graven images. The Second Council of Nicaea in 787 AD condemned iconoclasm, pointing to similarities between worship via icons and via written gospel. Iconoclasm resurged under Leo V in 814 AD. Similar aniconic tendencies appeared later in various Protestant movements."

  # Alexandrian Catechism tenet

  tenet_alexandrian_catechism_latin_name: "Catechesis Alexandrina" # DO NOT TRANSLATE
  tenet_alexandrian_catechism_greek_name: "Alexandrinē Katēkhēsis" # DO NOT TRANSLATE
  tenet_alexandrian_catechism_default_name: "$tenet_alexandrian_catechism_name$"
  tenet_alexandrian_catechism_latin_desc: "O Christ, the eternal Wisdom of God, illuminate our minds that we may perceive the hidden mysteries of Your Holy Scripture. Grant us eyes to see beyond the letter, to the spirit that gives life.\n\n$pam_1_corinthians_1_30_latin$\n\n[Glossary('Catechesis Alexandrina Historical Background','tenet_alexandrian_catechism_historical_desc')]"
  tenet_alexandrian_catechism_greek_desc: "The Alexandrian tradition holds that divine wisdom is revealed through the allegorical interpretation of Scripture. The Light is the Logos, the divine Word through whom all truth is made known.\n\n$pam_1_corinthians_1_30_greek$\n\n[Glossary('Alexandrinē Katēkhēsis Historical Background','tenet_alexandrian_catechism_historical_desc')]"
  tenet_alexandrian_catechism_default_desc: "The Alexandrian school emphasizes allegorical interpretation of Scripture and the synthesis of $tyrism_religion_adj$ theology with Greek philosophy, seeking deeper spiritual meanings beneath the literal text.\n\n$pam_1_corinthians_1_30_default$\n\n[Glossary('Alexandrian Catechism Historical Background','tenet_alexandrian_catechism_historical_desc')]"
  tenet_alexandrian_catechism_historical_desc: "The Catechetical School of Alexandria, founded in the late 2nd century, was the earliest $tyrism_religion_adj$ institution of higher learning. Under teachers like Clement of Alexandria and Origen, it developed a sophisticated method of biblical interpretation that sought allegorical and spiritual meanings in Scripture. The school synthesized $tyrism_religion_adj$ theology with Platonic philosophy, arguing that Greek learning prepared the way for the Gospel.\n\nOrigen's exegetical methods and theological speculations profoundly influenced Eastern $tyrism_religion$, while the school's emphasis on the allegorical method contrasted with the more literal approach of the School of Antioch."

  # Adoptionism Tenet

  tenet_adoptionism_latin_name: "Filius Adoptivus" # DO NOT TRANSLATE
  tenet_adoptionism_greek_name: "Hyiothesía" # DO NOT TRANSLATE
  tenet_adoptionism_default_name: "Adoptionism"
  tenet_adoptionism_name: "$tenet_adoptionism_default_name$"
  tenet_adoptionism_latin_desc: "O Father, who didst look upon the righteous man Jesus and choose Him for Thy own, grant that we too may be found worthy of adoption. As Thou did raise Him from the waters and declare Him Thy beloved, so raise us from our lowliness into Thy divine family.\n\n$pam_mark_1_11_latin$\n\n[Glossary('Filius Adoptivus Historical Background','tenet_adoptionism_historical_desc')]"
  tenet_adoptionism_greek_desc: "O God, who elevates the humble and chooses the righteous for Thyself, we praise Thee for the mystery of adoption. As Christ was raised to divine sonship by Thy grace, so too may we be numbered among Thy children.\n\n$pam_mark_1_11_greek$\n\n[Glossary('Hyiothesía Historical Background','tenet_adoptionism_historical_desc')]"
  tenet_adoptionism_default_desc: "O Lord, help us understand the mystery of Thy Son's exaltation. May we follow His example of righteousness, that we too may be called children of God.\n\n$pam_mark_1_11_default$\n\n[Glossary('Adoptionism Historical Background','tenet_adoptionism_historical_desc')]"
  tenet_adoptionism_historical_desc: "Adoptionism teaches that Jesus was born an ordinary human and later 'adopted' as God's Son, usually at his baptism when the Holy Spirit descended on him. Early forms appeared in the 2nd century with Theodotus of Byzantium, whose dynamic monarchianism stressed the unity of God.\n\nThe teaching re-emerged in 8th-century Spain under Archbishop Elipandus of Toledo and Bishop Felix of Urgell, for whom Christ's divine nature was eternally begotten and his human nature adopted. The Council of Frankfurt condemned Spanish Adoptionism as heresy in 794 AD, and adoptionist ideas nonetheless influenced later anti-Trinitarian movements."

  doctrine_parameter_tenet_adoptionism_adoption_always_possible: "The [adopt|E] [interaction|E] is always available, without the usual requirements (although its target must still be eligible, and a subordinate marriage partner cannot adopt)"
  doctrine_parameter_tenet_adoptionism_adoption_accepted: "[vassals|E] and children who follow this [rite|E] do not resent an [Concept( 'adopt', 'adoption' )|E] (#N -10#! to #N -25#! [opinion|E] avoided)"
  doctrine_parameter_tenet_adoptionism_adoption_personal_active: "The [adopt|E] [interaction|E] is always available to you, without the usual requirements (although its target must still be eligible)"
  doctrine_parameter_tenet_adoptionism_sp_on_adopt: "@legitimacy_icon![legitimacy|E], @piety_icon![piety|E] and @spiritual_fulfillment_icon![spiritual_fulfillment|E] when [Concept( 'adopt', 'adopting' )|E] a [character|E]"
  pam_adoptionism_adopt_sp_toast: "[GetTenetType('tenet_adoptionism').GetName( GetPlayer.GetRite )] personal tenet"
  doctrine_parameter_tenet_adoptionism_legitimize_bastards: "The [Concept( 'legitimized_bastard', 'Legitimize Bastard')|E] [interaction|E] costs #P 50%#! less @prestige_icon![prestige|E], where your [faith|E] permits it"
  doctrine_parameter_tenet_adoptionism_legitimize_own_children: "The [Concept( 'legitimized_bastard', 'Legitimize Bastard')|E] [interaction|E] can be used on your own [children|E] of another [house|E], where your [faith|E] permits it"

  # Armed Pilgrimages Tenet

  tenet_armed_pilgrimages_latin_name: "Peregrinatio Armata" # DO NOT TRANSLATE
  tenet_armed_pilgrimages_greek_name: "Énoplon Proskýnēma" # DO NOT TRANSLATE
  tenet_armed_pilgrimages_default_name: "$tenet_armed_pilgrimages_name$"
  tenet_armed_pilgrimages_latin_desc: "O Lord, strengthen our arms as we take up the cross in Your holy name. Guide our steps on the sacred journey, that we may defend the faith and liberate the holy places from the hands of the infidel.\n\n$pam_matthew_16_24_latin$\n\n[Glossary('Peregrinatio Armata Historical Background','tenet_armed_pilgrimages_historical_desc')]"
  tenet_armed_pilgrimages_greek_desc: "The faithful are called to follow $tyrism_high_god_name$ by taking up the cross, not only spiritually but in defense of the holy places. Armed pilgrimage is an act of devotion, a journey of faith protected by the sword.\n\n$pam_matthew_16_24_greek$\n\n[Glossary('Énoplon Proskýnēma Historical Background','tenet_armed_pilgrimages_historical_desc')]"
  tenet_armed_pilgrimages_default_desc: "Pilgrimage to the holy places is a sacred duty, and the faithful are called to protect these sites and fellow pilgrims by force of arms if necessary.\n\n$pam_matthew_16_24_default$\n\n[Glossary('Armed Pilgrimages Historical Background','tenet_armed_pilgrimages_historical_desc')]"
  tenet_armed_pilgrimages_historical_desc: "A combination of the spiritual practice of visiting holy sites with military action to defend or recapture them. The Crusades, beginning in 1095 with Pope Urban II's call at the Council of Clermont, represented the most organized form of armed pilgrimage. Crusaders were granted plenary indulgences and considered their military service an act of penance and devotion.\n\nThe concept drew on earlier traditions of penitential warfare and the defense of Christendom against external threats, transforming pilgrimage from a peaceful journey into a militant expression of faith."

  # Communal Identity Tenet

  tenet_communal_identity_latin_name: "Populus Luminis" # DO NOT TRANSLATE
  tenet_communal_identity_greek_name: "Laòs Photós" # DO NOT TRANSLATE
  tenet_communal_identity_default_name: "$tenet_communal_identity_name$"
  tenet_communal_identity_latin_desc: "We are the chosen race, a royal priesthood, a holy nation, set apart by God. May we proclaim His mighty deeds and walk worthy of our calling as His people.\n\n$pam_1_peter_2_9_latin$\n\n[Glossary('Populus Dei Historical Background','tenet_communal_identity_historical_desc')]"
  tenet_communal_identity_greek_desc: "Summoned from darkness into His marvelous light, we are a holy nation, a people God claims as His possession. In $tyrism_high_god_name$ we are made one body.\n\n$pam_1_peter_2_9_greek$\n\n[Glossary('Laòs Theoũ Historical Background','tenet_communal_identity_historical_desc')]"
  tenet_communal_identity_default_desc: "The faithful are united as God's chosen people, a community set apart from the world, sharing a common identity and purpose in $tyrism_high_god_name$.\n\n$pam_1_peter_2_9_default$\n\n[Glossary('Communal Identity Historical Background','tenet_communal_identity_historical_desc')]"
  tenet_communal_identity_historical_desc: "The concept of the Church as the 'People of God' draws from Old Testament imagery of Israel as God's chosen people, reinterpreted through the lens of the New Covenant. Early $tyrism_religion_adherent_plural$ understood themselves as a new Israel, united not by blood or ethnicity but by faith in $tyrism_high_god_name$.\n\nThis communal identity transcended social, ethnic, and national boundaries, creating a universal brotherhood. The Second Vatican Council's Lumen Gentium prominently featured 'People of God' as a central ecclesiological image, emphasizing the pilgrim nature of the Church and the common dignity of all the baptized."

  # Consolamentum Tenet

  tenet_consolamentum_latin_name: "Consolamentum" # DO NOT TRANSLATE
  tenet_consolamentum_greek_name: "Paráklēsis" # DO NOT TRANSLATE
  tenet_consolamentum_default_name: "Consolamentum"
  tenet_consolamentum_latin_desc: "O Lord, we have fought the good fight, we have finished the race, we have kept the faith. Receive now Thy servant into the consolation of the Spirit, that the soul may be freed from the bonds of this material world.\n\n$pam_2_timothy_4_7_latin$\n\n[Glossary('Consolamentum Historical Background','tenet_consolamentum_historical_desc')]"
  tenet_consolamentum_greek_desc: "By the laying on of hands and the prayer of the faithful, the spirit receives divine consolation. The good fight is fought, the race is finished, and faith is kept unto the very end.\n\n$pam_2_timothy_4_7_greek$\n\n[Glossary('Paráklēsis Historical Background','tenet_consolamentum_historical_desc')]"
  tenet_consolamentum_default_desc: "Through the sacred rite of spiritual consolation, believers receive the Holy Spirit and are prepared for their journey from this world to the next.\n\n$pam_2_timothy_4_7_default$\n\n[Glossary('Consolamentum Historical Background','tenet_consolamentum_historical_desc')]"
  tenet_consolamentum_historical_desc: "The Consolamentum was the central sacrament of the Cathar faith, combining elements of baptism, confirmation, ordination, and extreme unction. Administered by the laying on of hands, it was believed to confer the Holy Spirit and free the soul from the material world.\n\nFor most believers, it was received only on the deathbed, while those who received it in full health became 'Perfecti' or 'Bons Hommes,' committing to a life of strict asceticism. The rite had roots in early $tyrism_religion_adj$ practices of spiritual baptism and shows possible influence from Eastern Bogomil traditions."

  # Divine Marriage Tenet

  tenet_divine_marriage_latin_name: "Matrimonium Sacrum" # DO NOT TRANSLATE
  tenet_divine_marriage_greek_name: "Hieròs Gámos" # DO NOT TRANSLATE
  tenet_divine_marriage_default_name: "$tenet_divine_marriage_name$"
  tenet_divine_marriage_latin_desc: "O Lord, it was not for lust that we were joined in this sacred union, but with sincerity and in truth. Grant that we may find mercy and grow old together, preserving the sanctity of our bond.\n\n$pam_tobit_8_7_latin$\n\n[Glossary('Matrimonium Sacrum Historical Background','tenet_divine_marriage_historical_desc')]"
  tenet_divine_marriage_greek_desc: "Marriage within the community of faith preserves the sacred bloodline and maintains purity before God. Not in lust but in truth are such unions blessed, that mercy may be found for husband and wife.\n\n$pam_tobit_8_7_greek$\n\n[Glossary('Hieròs Gámos Historical Background','tenet_divine_marriage_historical_desc')]"
  tenet_divine_marriage_default_desc: "Sacred marriage within the community of faith maintains spiritual purity and preserves the sanctity of the religious bloodline across generations.\n\n$pam_tobit_8_7_default$\n\n[Glossary('Divine Marriage Historical Background','tenet_divine_marriage_historical_desc')]"
  tenet_divine_marriage_historical_desc: "The concept of sacred marriage or endogamy, marriage only within religious communities, has ancient roots in many traditions. In Zoroastrianism, xwedodah (next-of-kin marriage) was practiced to maintain spiritual merit and family property. The practice aimed to preserve religious purity, consolidate spiritual power, and maintain sacred and royal bloodlines.\n\nWhile controversial and often misunderstood by outside observers, adherents viewed such marriages as fulfilling divine commandments to maintain the sanctity of their community."

  # Gnosticism Tenet

  tenet_gnosticism_latin_name: "Gnosis" # DO NOT TRANSLATE
  tenet_gnosticism_greek_name: "Gnõsis" # DO NOT TRANSLATE
  tenet_gnosticism_default_name: "$tenet_gnosticism_name$"
  tenet_gnosticism_latin_desc: "O divine Wisdom, hidden from the ages, reveal to us the mysteries of the spiritual realm. Free our souls from the prison of matter, that we may ascend to the fullness of light and knowledge.\n\n$pam_1_corinthians_2_7_latin$\n\n[Glossary('Gnosis Historical Background','tenet_gnosticism_historical_desc')]"
  tenet_gnosticism_greek_desc: "True salvation comes through gnosis, the secret knowledge of divine things hidden from the material world. We speak God's wisdom in mystery, the hidden wisdom decreed before the ages for our glory.\n\n$pam_1_corinthians_2_7_greek$\n\n[Glossary('Gnõsis Historical Background','tenet_gnosticism_historical_desc')]"
  tenet_gnosticism_default_desc: "Salvation is achieved through secret spiritual knowledge, revealing the divine spark within and the path to escape the material world created by the Demiurge.\n\n$pam_1_corinthians_2_7_default$\n\n[Glossary('Gnosticism Historical Background','tenet_gnosticism_historical_desc')]"
  tenet_gnosticism_historical_desc: "Gnosticism encompasses diverse religious movements of the early $tyrism_religion_adj$ era that emphasized salvation through gnosis, or esoteric knowledge. Gnostics typically viewed the material world as the flawed creation of a lesser deity (the Demiurge), while the true God remained hidden and transcendent. Human souls were believed to contain divine sparks trapped in matter, which could be liberated through secret knowledge.\n\nMajor Gnostic teachers included Valentinus, Basilides, and Marcion. Church Fathers like Irenaeus and Tertullian wrote extensively against Gnostic teachings, which they considered heretical departures from apostolic $tyrism_religion$."

  # Mendicant Preachers Tenet

  tenet_mendicant_preachers_latin_name: "Pax et Bonum" # DO NOT TRANSLATE
  tenet_mendicant_preachers_greek_name: "Ptōkhoì Kērykes" # DO NOT TRANSLATE
  tenet_mendicant_preachers_default_name: "$tenet_mendicant_preachers_name$"
  tenet_mendicant_preachers_latin_desc: "O Lord, as You sent forth Your apostles without gold or silver, so we go forth in poverty, relying on Your providence alone. Grant us the grace to preach Your Gospel in simplicity and truth.\n\n$pam_matthew_10_9_latin$\n\n[Glossary('Pax et Bonum Historical Background','tenet_mendicant_preachers_historical_desc')]"
  tenet_mendicant_preachers_greek_desc: "Following the example of Christ who had nowhere to lay His head, the mendicant preachers embrace voluntary poverty. Taking nothing for the journey, they trust in God's provision as they spread the Gospel.\n\n$pam_matthew_10_9_greek$\n\n[Glossary('Ptōkhoì Kērykes Historical Background','tenet_mendicant_preachers_historical_desc')]"
  tenet_mendicant_preachers_default_desc: "Religious orders devoted to poverty and preaching, wandering without possessions to spread the faith, trusting in divine providence for their daily needs.\n\n$pam_matthew_10_9_default$\n\n[Glossary('Mendicant Preaching Historical Background','tenet_mendicant_preachers_historical_desc')]"
  tenet_mendicant_preachers_historical_desc: "Mendicant orders emerged in the 13th century as a response to the wealth and worldliness of the established Church. The Second Council of Lyon in 1274 recognized four main orders: the Carmelites, the Franciscans of Francis of Assisi, the Dominicans of Dominic de Guzmán, and the Augustinians.\n\nUnlike monastic orders that owned property collectively, mendicants embraced corporate as well as individual poverty, living almost entirely on alms. They were urban-focused, preaching in towns and cities, and emphasized education and scholarship. The mendicant ideal drew directly from Christ's instructions to the apostles in Matthew 10:9-10 to take nothing for their journey."

  # Pentarchy Tenet

  tenet_pentarchy_latin_name: "Quinque Sedes" # DO NOT TRANSLATE
  tenet_pentarchy_greek_name: "Pentarkhía" # DO NOT TRANSLATE
  tenet_pentarchy_default_name: "$tenet_pentarchy_alternate_name$"
  tenet_pentarchy_latin_desc: "Wherever we gather in $tyrism_high_god_name_possessive$ name, He is with us. The five great sees of Rome, Constantinople, Alexandria, Antioch, and Jerusalem are the pillars of the Church.\n\n$pam_matthew_18_20_latin$\n\n[Glossary('Quinque Sedes Historical Background','tenet_pentarchy_historical_desc')]"
  tenet_pentarchy_greek_desc: "Our Church is governed by the five patriarchates established in apostolic times. The Light is present wherever His people gather, and through the pentarchy His authority is exercised over all the world.\n\n$pam_matthew_18_20_greek$\n\n[Glossary('Pentarkhía Historical Background','tenet_pentarchy_historical_desc')]"
  tenet_pentarchy_default_desc: "The universal Church is governed by five ancient patriarchal sees, each with authority over its region, maintaining unity through conciliar communion.\n\n$pam_matthew_18_20_default$\n\n[Glossary('Pentarchy Historical Background','tenet_pentarchy_historical_desc')]"
  tenet_pentarchy_historical_desc: "The Pentarchy was the model of Church governance that recognized five major patriarchal sees: Rome, Constantinople, Alexandria, Antioch, and Jerusalem. Formalized by the Council of Chalcedon in 451 AD, it mirrored the political weight of these cities in the Roman Empire, each patriarch ruling his region, with disputes referred to ecumenical councils.\n\nRome, claiming papal supremacy, never fully accepted the system, which the Siege of Alexandria in 641 AD shook and the Great Schism of 1054 broke apart. Eastern Orthodoxy went on honoring the pentarchic ideal, and new patriarchates arose later in Russia, Serbia, and elsewhere."

  # Unrelenting Faith Tenet

  tenet_unrelenting_faith_latin_name: "Fides Indefessa" # DO NOT TRANSLATE
  tenet_unrelenting_faith_greek_name: "Pístis Akatapónētos" # DO NOT TRANSLATE
  tenet_unrelenting_faith_default_name: "$tenet_unrelenting_faith_name$"
  tenet_unrelenting_faith_latin_desc: "O Lord, strengthen our faith, that substance of things hoped for, that conviction of things unseen. May we stand firm against all adversity, never wavering in our devotion to You.\n\n$pam_hebrews_11_1_latin$\n\n[Glossary('Fides Indefessa Historical Background','tenet_unrelenting_faith_historical_desc')]"
  tenet_unrelenting_faith_greek_desc: "Faith is the assurance of things hoped for, the conviction of things not seen. Through unshakeable belief, the faithful overcome all trials and persecutions, standing firm unto death.\n\n$pam_hebrews_11_1_greek$\n\n[Glossary('Pístis Akatapónētos Historical Background','tenet_unrelenting_faith_historical_desc')]"
  tenet_unrelenting_faith_default_desc: "A faith that cannot be shaken by persecution, hardship, or doubt. Believers are called to stand firm in their convictions regardless of worldly consequences.\n\n$pam_hebrews_11_1_default$\n\n[Glossary('Unrelenting Faith Historical Background','tenet_unrelenting_faith_historical_desc')]"
  tenet_unrelenting_faith_historical_desc: "The examples of martyrs and confessors has been posed as role models throughout $tyrism_religion_adj$ history. From the earliest persecutions under Nero and Diocletian to later trials, to the missionaries travelling and dying while trying to convert hostile populations like Adalbert of Prague, $tyrism_religion_adherent_plural$ were called to maintain their faith even unto death.\n\nThe conviction that faith must be defended, maintained, and spread, regardless of cost, inspired many monastic movements and missionary endeavors. The stories of saints who endured torture and execution for their beliefs served to strengthen the resolve of the faithful and offered a guaranteed way of salvation."


  # Miaphysitism tenet
  #Warcraft TODO relocalise it as the Light being an active anthropomorphised deity with a clear agenda
  tenet_miaphysitism_latin_name: "Miaphysitismus" # DO NOT TRANSLATE
  tenet_miaphysitism_greek_name: "Miaphysitismós" # DO NOT TRANSLATE
  tenet_miaphysitism_default_name: "Miaphysitism"
  tenet_miaphysitism_name: "$tenet_miaphysitism_default_name$"
  tenet_miaphysitism_latin_desc: "Council of Ephesus was not a latrocinium. The error of Chalcedon must be corrected. The divine and human natures are united without confusion, without change, without division, without separation in the one person of Christ.\n\n$pam_colossians_2_9_latin$\n\n[Glossary('Miaphysitismus Historical Background','tenet_miaphysitism_historical_desc')]"
  tenet_miaphysitism_greek_desc: "The Council of Éphesos was right to restore Eutyches and condemn Flavian. Christ has one united divine-human nature, fully God and fully human, free of all confusion or separation.\n\n$pam_colossians_2_9_greek$\n\n[Glossary('Miaphysitismós Historical Background','tenet_miaphysitism_historical_desc')]"
  tenet_miaphysitism_default_desc: "Christ has one united nature that is both divine and human, inseparably joined in the Incarnation.\n\n$pam_colossians_2_9_default$\n\n[Glossary('Miaphysitism Historical Background','tenet_miaphysitism_historical_desc')]"
  tenet_miaphysitism_historical_desc: "From Greek mia, #weak one#! and physis, #weak nature#!, Miaphysitism holds that in Christ, the divine and human natures are united into one composite nature without confusion or separation. Championed by Cyril of Alexandria using the formula #weak mia physis tou theou logou sesarkōménē#! (one incarnate nature of God the Word), it is distinguished from Monophysitism by maintaining the full reality of both natures within the unity.\n\nThe Council of Chalcedon in 451 AD rejected this formula in favor of Dyophysitism (two natures), and the Oriental Orthodox Churches (Coptic, Armenian, Ethiopian, Syriac) separated from the Byzantine Church, maintaining their Miaphysite theology to this day."
  doctrine_parameter_tenet_miaphysitism_honest_bonus: "[GetTrait('honest').GetName( GetNullCharacter )] [characters|E]: #P +10%#! @piety_icon![piety|E] gain, #P +10#! [clergy|E] [opinion|E]"
  doctrine_parameter_tenet_miaphysitism_deceitful_penalty: "[GetTrait('deceitful').GetName( GetNullCharacter )] [characters|E]: #N -10%#! @piety_icon![piety|E] gain, #N -10#! [clergy|E] [opinion|E]"
  doctrine_parameter_tenet_miaphysitism_open_confession: "[piety_i]#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! [piety|E] each year while your [liege|E] does not share your [faith|E]"

  # Hesychasm tenet

  tenet_hesychasm_latin_name: "Hesychasmus" # DO NOT TRANSLATE
  tenet_hesychasm_greek_name: "Hēsykhasmós" # DO NOT TRANSLATE
  tenet_hesychasm_default_name: "Hesychasm"
  tenet_hesychasm_name: "$tenet_hesychasm_default_name$"
  tenet_hesychasm_latin_desc: "O Lord, grant us the grace of holy stillness. May we find You who dwell in unapproachable light. Teach us to pray without ceasing, that our hearts may become temples of Your presence.\n\n$pam_psalm_46_10_latin$\n\n[Glossary('Hesychasmus Historical Background','tenet_hesychasm_historical_desc')]"
  tenet_hesychasm_greek_desc: "Lord Jesus Christ, Son of God, have mercy on me, a sinner. Through stillness of body and mind, through the ceaseless repetition of the Prayer of the Heart, let me ascend to theoria, the vision of the uncreated divine light.\n\n$pam_psalm_46_10_greek$\n\n[Glossary('Hēsykhasmós Historical Background','tenet_hesychasm_historical_desc')]"
  tenet_hesychasm_default_desc: "Through inner stillness, contemplative prayer, and the repetition of the Jesus Prayer, the faithful may experience direct communion with God and behold His uncreated light.\n\n$pam_psalm_46_10_default$\n\n[Glossary('Hesychasm Historical Background','tenet_hesychasm_historical_desc')]"
  tenet_hesychasm_historical_desc: "Hesychasm, from Greek #weak hēsykhía#! meaning stillness, is a contemplative tradition in Eastern $tyrism_religion$ emphasizing prayer of the heart, rooted in the 4th century Desert Fathers of Egypt. Its central practice became the repeated Jesus Prayer, #weak Lord Jesus Christ, Son of God, have mercy on me, a sinner#!, often coordinated with one's breathing and heartbeat.\n\nIn the 14th century, Saint Gregory Palamas defended the Hesychast monks of Mount Athos, and their visions of the uncreated Light of Tabor of the Transfiguration, against charges of heresy by Barlaam of Calabria. Councils at Constantinople in 1341 and 1351 vindicated Palamas and established Hesychasm as Orthodox doctrine."


  # Anachoresis tenet

  tenet_anachoresis_latin_name: "Vita Eremitica" # DO NOT TRANSLATE
  tenet_anachoresis_greek_name: "Anakhōrēsis" # DO NOT TRANSLATE
  tenet_anachoresis_default_name: "Anachoresis"
  tenet_anachoresis_name: "$tenet_anachoresis_default_name$"
  tenet_anachoresis_latin_desc: "O Lord, as You led Your Son into the wilderness to prepare for His ministry, so too lead us into the desert of our hearts. In solitude and silence, may we flee the distractions of the world and find You alone.\n\n$pam_matthew_4_1_2_latin$\n\n[Glossary('Vita Eremitica Historical Background','tenet_anachoresis_historical_desc')]"
  tenet_anachoresis_greek_desc: "Blessed are those who withdraw from the world, for they shall find God in the silence of the desert. As the prophets dwelt in caves and holes in the ground, so too do the servants of Christ seek solitude to wage war against the passions.\n\n$pam_matthew_4_1_2_greek$\n\n[Glossary('Anakhōrēsis Historical Background','tenet_anachoresis_historical_desc')]"
  tenet_anachoresis_default_desc: "Through withdrawal from worldly society into the wilderness, the faithful may achieve spiritual purity, conquer the passions, and draw closer to God through solitary prayer and ascetic discipline.\n\n$pam_matthew_4_1_2_default$\n\n[Glossary('Anachoresis Historical Background','tenet_anachoresis_historical_desc')]"
  tenet_anachoresis_historical_desc: "Anachoresis, from Greek #weak anakhorēsis#! meaning withdrawal, is the practice of hermits who left society for the wilderness to pursue a life of prayer, fasting, and spiritual combat against demonic forces. The movement began in 3rd century Egypt with Saint Paul of Thebes, traditionally regarded as the first $tyrism_religion_adj$ hermit, who fled the persecution of Emperor Decius into the Theban Desert around 250 AD.\n\nAnchorites remained common throughout the Middle Ages, living in isolated cells attached to monasteries and receiving the Eucharist through a small window called a hagioscope. Guidance texts like the 13th century English Ancrene Wisse laid down rules for anchorites and anchoresses."

  # Mortification of the Flesh tenet

  tenet_mortification_of_the_flesh_latin_name: "Mortificatio Carnis" # DO NOT TRANSLATE
  tenet_mortification_of_the_flesh_greek_name: "Nékrōsis tẽs Sarkós" # DO NOT TRANSLATE
  tenet_mortification_of_the_flesh_default_name: "Mortification of the Flesh"
  tenet_mortification_of_the_flesh_name: "$tenet_mortification_of_the_flesh_default_name$"
  tenet_mortification_of_the_flesh_latin_desc: "O Lord, grant us the grace to crucify our flesh with its passions and desires. Through holy suffering may we share in the Passion of Christ and mortify the deeds of the body, that we may truly live.\n\n$pam_galatians_5_24_latin$\n\n[Glossary('Mortificatio Carnis Historical Background','tenet_mortification_of_the_flesh_historical_desc')]"
  tenet_mortification_of_the_flesh_greek_desc: "Through fasting, vigils, and bodily mortification, the servants of God subdue the flesh and bring it into subjection, that the spirit may soar toward heaven.\n\n$pam_galatians_5_24_greek$\n\n[Glossary('Nékrōsis tẽs Sarkós Historical Background','tenet_mortification_of_the_flesh_historical_desc')]"
  tenet_mortification_of_the_flesh_default_desc: "The faithful mortify the flesh and its sinful desires, sharing in Christ's suffering to purify the soul and achieve spiritual perfection.\n\n$pam_galatians_5_24_default$\n\n[Glossary('Mortification of the Flesh Historical Background','tenet_mortification_of_the_flesh_historical_desc')]"
  
  tenet_mortification_of_the_flesh_historical_desc: "Rooted in Saint Paul's call to #weak put to death the deeds of the body#! (Romans 8:13) and to #weak punish the body and enslave it#! (1 Corinthians 9:27), mortification was central to $tyrism_religion_adj$ asceticism from the earliest centuries. Its most extreme practitioners were the Stylites: Saint Simeon the Elder spent 37 years atop a pillar near Aleppo in constant prayer through blazing heat and freezing cold.\n\nSelf-flagellation spread through medieval Western $tyrism_religion$, championed among the clergy by Saint Peter Damian (1007-1072). The Flagellant movement of the 13th and 14th centuries saw laypeople process through towns, scourging themselves as penance in times of plague and disaster."

  # Holy Myron tenet

  tenet_holy_myron_ethiopic_name: "Qeddus Meron" # DO NOT TRANSLATE
  tenet_holy_myron_latin_name: "Sanctum Chrisma" # DO NOT TRANSLATE
  tenet_holy_myron_greek_name: "Hágion Mýron" # DO NOT TRANSLATE
  tenet_holy_myron_default_name: "Holy Myron"
  tenet_holy_myron_name: "$tenet_holy_myron_default_name$"
  tenet_holy_myron_ethiopic_desc: "By the sacred Meron consecrated by the Abuna, the faithful receive the seal of the Holy Spirit. As the dove descended upon $tyrism_high_god_name$ at His baptism in the Jordan, so too does the Spirit descend upon the newly baptized through this holy anointing, marking them as children of God.\n\n$pam_john_3_5_default$\n\n[Glossary('Qeddus Meron Historical Background','tenet_holy_myron_historical_desc')]"
  tenet_holy_myron_latin_desc: "Through the sacred Chrism, consecrated by the bishop, the faithful receive the seal of the gift of the Holy Spirit. The anointing completes the grace of Baptism.\n\n$pam_john_3_5_latin$\n\n[Glossary('Sanctum Chrisma Historical Background','tenet_holy_myron_historical_desc')]"
  tenet_holy_myron_greek_desc: "The Holy Myron, consecrated by the Patriarch, is the seal of the gift of the Holy Spirit. Through this sacred anointing, the newly illumined receive the fullness of the Spirit's gifts, becoming temples of the living God.\n\n$pam_john_3_5_greek$\n\n[Glossary('Hágion Mýron Historical Background','tenet_holy_myron_historical_desc')]"
  tenet_holy_myron_default_desc: "The Holy Myron, or sacred Chrism, is a specially consecrated oil used in the sacrament of Confirmation to seal the newly baptized with the gift of the Holy Spirit, completing their initiation into the Church.\n\n$pam_john_3_5_default$\n\n[Glossary('Holy Myron Historical Background','tenet_holy_myron_historical_desc')]"
  tenet_holy_myron_historical_desc: "Holy Myron, from Greek #weak mýron#! meaning fragrant oil, is used in the sacrament of Chrismation, or Confirmation. In the East it immediately follows Baptism, even for infants; in the West it is administered separately by a bishop. Anointing has deep biblical roots: both #weak Christ#! and #weak Messiah#! mean #weak the Anointed One#!.\n\nConsecrating new Myron is a rare and solemn event: a portion of the previous batch is always added to the new, an unbroken chain said to reach back to the Apostles. Ethiopian tradition holds that the recipe of the #weak Meron#! was brought by the Nine Saints, Syrian missionaries of the 5th century, and reserves its consecration to the Patriarch, the Abuna."

  doctrine_parameter_tenet_holy_myron_artifact: "Can send the [court_chaplain|E] to create a #V Holy Myron#! [artifact|E], via the [GetDecisionWithKey('pam_prepare_holy_myron_decision').GetName] [decision|E]; its charges are spent to bless [artifacts|E][AddLocalizationIf( HasDlcFeature( 'coronations' ), 'pam_holy_myron_param_coronation_append')][AddLocalizationIf( HasDlcFeature( 'legends_of_the_dead' ), 'pam_holy_myron_param_funeral_append')]"
  doctrine_parameter_tenet_holy_myron_artifact_interaction_unlock: "Can gift charges of your #V Holy Myron#! [artifact|E] to other rulers, gaining @piety_icon![piety|E] and [opinion|E]"
  doctrine_parameter_tenet_holy_myron_chrismation_bonus: "Your newborn children gain the [GetModifier('pam_chrismated_child_modifier').GetNameWithTooltip] [modifier|E] for #V 16#! years; a charge of the #V Holy Myron#! [artifact|E] grants the [GetModifier('pam_myron_chrismated_child_modifier').GetNameWithTooltip] [modifier|E] permanently"
  doctrine_parameter_tenet_holy_myron_unction_bonus: "When falling [ill|E]: @spiritual_fulfillment_icon![spiritual_fulfillment|E] gain, [stress|E] loss, and the [GetModifier('pam_anointed_with_holy_oil_modifier').GetNameWithTooltip] [modifier|E] for #V 2#! years"



  # Khachkar tenet

  tenet_khachkar_armenian_name: "Khachkar" # DO NOT TRANSLATE
  tenet_khachkar_latin_name: "Crux Lapidea" # DO NOT TRANSLATE
  tenet_khachkar_greek_name: "Líthinos Staurós" # DO NOT TRANSLATE
  tenet_khachkar_default_name: "Khachkars"
  tenet_khachkar_name: "$tenet_khachkar_default_name$"
  tenet_khachkar_armenian_desc: "The khachkars stand as eternal witnesses to our faith. Carved with intricate designs of crosses, vines, and sacred symbols, each khachkar is a prayer in stone, glorifying the Cross by which the world was saved.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Khachkar Historical Background','tenet_khachkar_historical_desc')]"
  tenet_khachkar_latin_desc: "As the Armenians raise their stone crosses to heaven, let us mark this Earth with the symbols of Salvation, the Cross of our Lord Jesus Christ.\n\n$pam_galatians_6_14_latin$\n\n[Glossary('Crux Lapidea Historical Background','tenet_khachkar_historical_desc')]"
  tenet_khachkar_greek_desc: "Stone monuments, carved with sacred symbols, bear witness to Christ's victory and stand as eternal memorials to the faithful.\n\n$pam_galatians_6_14_greek$\n\n[Glossary('Líthinos Staurós Historical Background','tenet_khachkar_historical_desc')]"
  tenet_khachkar_default_desc: "Stone crosses carved with intricate religious imagery serve as sacred monuments marking holy sites, commemorating the dead, and celebrating divine providence.\n\n$pam_galatians_6_14_default$\n\n[Glossary('Khachkar Historical Background','tenet_khachkar_historical_desc')]"
  tenet_khachkar_historical_desc: "Khachkars, from Armenian #weak khach#! (cross) and #weak k'ar#! (stone), are intricately carved stone stelae featuring a cross, often set upon a rosette or a wheel of eternity. Unique to Armenian $tyrism_religion_adj$ culture, they mark sacred sites, commemorate events and victories, and serve as memorials for the dead.\n\nThe tradition emerged in the 9th century from the wooden crosses Saint Gregory the Illuminator raised over pagan temples after Armenia's conversion in 301 AD, and reached its zenith in the 12th-13th centuries under the Zakarid princes. Each is unique, the work of master carvers such as Momik of Noravank, and some, believed to hold miraculous powers, became objects of pilgrimage."

  doctrine_parameter_tenet_khachkar_decision_unlock: "Can use the [GetDecisionWithKey('pam_raise_khachkar_decision').GetName] [decision|E] for #V 5#! years after inheriting from a close [dynasty|E] relative"
  doctrine_parameter_tenet_khachkar_kin_death_stress_loss: "Lose #P 20#! [stress|E] when a close [family|E] member dies"
  doctrine_parameter_tenet_khachkar_building_bonuses: "[piety_i]#P [EmptyScope.ScriptValue('minor_piety_gain')|0]#! [piety|E] and #P [EmptyScope.ScriptValue('medium_spiritual_fulfillment_value')|0]#! @spiritual_fulfillment_icon![spiritual_fulfillment|E] when building in a [church_holding|E] or [temple_citadel_holding|E]"
  pam_khachkar_grief_toast: "From your [GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )]: grief carved in stone"
  pam_khachkar_building_toast: "[GetTenetType('tenet_khachkar').GetName( GetPlayer.GetRite )] [personal_tenet|E]"
  
  doctrine_parameter_gnosticism_other_tenets: "High [GetTrait('lifestyle_scholar').GetName( GetNullCharacter )] [trait_level_track_xp|E] periodically provides @spiritual_fulfillment_icon![spiritual_fulfillment|E] and knowledge of Gnosticism-related [core_tenets|E] like [GetTenetType('tenet_astrology').GetBaseName] and [GetTenetType('tenet_esotericism').GetBaseName]"

  pam_gnostic_learning_piety.t: "Gnostic Learnings"
  gnostic_tenet_learning.t: "Your studying of the Gnostic mysteries has yielded knowledge of [gnostic_tenet.GetName( GetPlayer.GetRite )]."