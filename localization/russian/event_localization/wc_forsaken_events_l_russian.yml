 ############################################## 
 # 1001 - 1099: Reclamation of Lordaeron Events 
 ############################################## 
  
 forsaken.1000.title: "Начало строительства Подгорода"
 forsaken.1000.desc: "Мой вассал начал строительство огромной крепости в канализации под руинами Лордерона, известной как Подгород. Мои советники уверяют меня, что это навсегда закрепит позиции Отрекшихся в этом регионе. Однако мне придётся смириться с тем, что эта неприступный оплот станет принадлежать им, а не мне. Возможно, было бы разумным решением возместить им расходы и получить контроль над возведением этой грандиозной постройки."
 forsaken.1000.opt.a: "Пришло время установить контроль."
 forsaken.1000.manage_construction_title: "Сюзерен берёт на себя контроль"
 forsaken.1000.manage_construction_tt: "Сюзерен возмещает затраты на строительство и берёт на себя контроль над строительством Подгорода."
 forsaken.1000.opt.b: "В этом нет необходимости, они кажутся достаточно способными."
 forsaken.1000.approve_title: "Сюзерен одобряет"
 forsaken.1000.approve_tt: "Сюзерен одобряет строительство Подгорода."
 forsaken.1000.opt.c: "Как они посмели начать строительство без моего разрешения!"
 forsaken.1000.disapprove_title: "Сюзерен не одобряет"
 forsaken.1000.disapprove_tt: "Строительство Подгорода вызвало упрёки со стороны сюзерена."
  
  
 forsaken.1001.title: "Восстановление Подгорода"
 forsaken.1001.desc.owned: "Подъёмник покачивается, и на мгновение я [Select_CString(ROOT.Char.IsFemale, 'поражена', 'поражён' )], но с началом спуска быстро прихожу в себя. Мои инженеры уверяют, что эти устройства работают с большим запасом прочности, но эффект от них не менее неприятен, так как машины такого размера - редкость на гиблой пустоши, которая когда-то была Лордероном.\n\nПо мере спуска подъёмника передо мной открывается ослепительное зрелище - огромный подземный город, кишащий солдатами, торговцами, магами и, конечно же, моими растущими правительственными чиновниками. Сводчатые туннели канализации были укреплены железными воротами и каменными укреплениями. На страже стоят поганища и воины-отрекшиеся с грозными арбалетами. Мечта персонажа [GetGlobalVariable('sylvanas_character').Char.Custom2('GetTitledFirstNamePossessiveOrMy', ROOT.Char)] осуществилась... Отрекшихся никогда не выбьют из этой подземной крепости!\n\nПо мере приближения к концу спуска я готовлю краткую речь для собравшейся толпы Отрекшихся и союзников. Слухие, которые собрали мои [spymaster] и [court_chaplains], повествуют о скрытых знаниях, найденных в руинах, которые до сих пор ускользали от нашего внимания. Наши лучшие агенты в данный момент разыскивают эту литературу, чтобы выяснить её полезность для державы. Пока же я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] выкинуть эти мысли из головы, готовясь к возведению этого монумента нашей растущей культуры.\n\nПодъёмник медленно останавливается..."
 forsaken.1001.desc.independent: "Мои шпионы сообщают, что нынешний владелец города Лордерон завершил мой проект: Укрепление Подгорода. Теперь их будет гораздо сложнее вытеснить, если мы попытаемся снова захватить город силой или интригами. Хуже того, мои агенты сообщают о слухах о скрытых знаниях, найденных в руинах. Как знаменосец нашей культуры, я, вероятно, столкнусь с последствиями такого исхода."
 forsaken.1001.opt.a.owned: "Это знаменательный день для Отрекшихся!"
 forsaken.1001.opt.a.independent: "Труд всей моей жизни повернулся против меня..."
 forsaken.1001.tooltip.a: "#X Со временем мы узнаем, насколько правдивы слухи о тайных знаниях, вновь обнаруженных в системах канализации...#!"
  
 forsaken.1002.title: "Отложенная мечта"
 forsaken.1002.desc: "Наши усилия по защите Подгорода подошли к концу, поскольку мы потеряли контроль над Столицей. Возможно, через несколько лет мы сможем повторить попытку, когда вновь завоюем эту территорию, принадлежащую нам по праву, но пока мечта о доме под руинами Лордерона остаётся за пределами нашей досягаемости."
 forsaken.1002.opt.a: "Эта потеря не пройдёт бесследно!"
 forsaken.1002.tooltip.a: "Вы или представитель вашей культуры сможете построить Подгород заново через 5 лет."
  
 forsaken.1003.title: "Наследие, нуждающееся в продолжении"
 forsaken.1003.desc: "Даже когда мы оплакиваем недавнюю потерю нашего предводителя, работа над строительством Подгорода продолжается. Теперь мне предстоит обеспечить успех строительства и устранить любые последствия. Работа идёт полным ходом, но мы должны быть бдительны и удерживать территорию города Лордерона до тех пор, пока работы не будут завершены и наш народ не сможет навсегда оставить его в руках его законных защитников."
 forsaken.1003.opt.a: "Слава Отрёкшимся!"
  
 forsaken.1004.title: "Восстановление Подгорода"
 forsaken.1004.desc.vassal: "Глубоко в недрах руин города Лордерона зашумели шестеренки массивного лифта, а рядом со мной собралась толпа. Под укрепленными порталами и усиленными каменными сводами мы стоим и ожидаем, когда [GetGlobalVariable('sylvanas_character').Char.GetTitledFirstName] присоединится к нам, чтобы осмотреть проделанную работу.\n\n«[Select_CString(ROOT.Char.IsFemale, 'Моя', 'Мой' )] [ROOT.Char.GetTitleAsName]», - сдержанно шепчет [spymaster], «наши агенты продолжают преследовать слухи о запретных мистических трудах, обнаруженных среди разрушенных туннелей в начале этого года. Было бы неразумно предупреждать [Select_CString(sylvanas_character.IsFemale, 'нашу... гостью', 'нашего... гостя' )]... об этих событиях, чтобы нас не наказали за то, что мы сами их не охраняем.»\n\nЯ киваю в знак одобрения, маскируя свой жест под приветствие одному из наиболее заметных присутствующих, и [spymaster] ускользает в толпу. Все меры предосторожности были приняты для того, чтобы церемония открытия прошла гладко, каждый приглашённый был тщательно проверен. Когда в поле зрения появляется [GetGlobalVariable('sylvanas_character').Char.GetTitle], я возглавляю аплодисменты толпы..."
 forsaken.1004.desc.independent: "Подъёмник покачивается, и на мгновение я [Select_CString(ROOT.Char.IsFemale, 'поражена', 'поражён' )], но с началом спуска быстро прихожу в себя. Мои инженеры уверяют, что эти устройства работают с большим запасом прочности, но эффект от них не менее неприятен, так как машины такого размера - редкость на гиблой пустоши, которая когда-то была Лордероном.\n\nПо мере спуска подъёмника передо мной открывается ослепительное зрелище - огромный подземный город, кишащий солдатами, торговцами, магами и, конечно же, моими растущими правительственными чиновниками. Сводчатые туннели канализации были укреплены железными воротами и каменными укреплениями. На страже стоят поганища и воины-отрекшиеся с грозными арбалетами. Мечта персонажа [GetGlobalVariable('sylvanas_character').Char.Custom2('GetTitledFirstNamePossessiveOrMy', ROOT.Char)] осуществилась... Отрекшихся никогда не выбьют из этой подземной крепости!\n\nПо мере приближения к концу спуска я готовлю краткую речь для собравшейся толпы Отрекшихся и союзников. Слухие, которые собрали мои [spymaster] и [court_chaplains], повествуют о скрытых знаниях, найденных в руинах, которые до сих пор ускользали от нашего внимания. Наши лучшие агенты в данный момент разыскивают эту литературу, чтобы выяснить её полезность для державы. Пока же я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] выкинуть эти мысли из головы, готовясь к возведению этого монумента нашей растущей культуры.\n\nПодъёмник медленно останавливается..."
 forsaken.1004.opt.a: "Это знаменательный день для Отрекшихся!"
 forsaken.1004.tooltip.a: "#X Со временем мы узнаем, насколько правдивы слухи о тайных знаниях, вновь обнаруженных в системах канализации...#!"
  
  
  
 ##################################### 
 #1100 - 1199: Post-Reclamation events 
 ##################################### 
  
 #1100 - 1109: Selenite Revival 
  
 forsaken.1100.title: "$forgotten_shadow$: Возрождение Селинитов"
 forsaken.1100.desc: "И вот, свершилось то, чего мы опасались. Пока возводили Подгород, ходили слухи о скрытых знаниях, найденных в глубинах канализаций. Наши инквизиторы, агенты и [court_chaplains] обнаружили тайные ячейки крипторелигиозников, следующих так называемому учению $forgotten_shadow$. Эти наставления берут начало у Натали Селин, жрицы из [GetTitleByKey('k_stormwind').GetNameNoTier] времён нашествия орков, что еретически призывала своих учеников не только поклоняться $LIGHT_NAME$, но и познавать Тьму. Так появились Селиниты — жрецы, ставшие действенным, хотя и нестандартным оружием в обречённой борьбе против Орды.\n\nТеперь же, когда её труды обрели новый смысл после вторжения [scourge|E] и оккупации Лордерона, наш народ, принявший эту зарождающуюся веру, стал называть себя $forgotten_shadow_adherent_plural$. И вот теперь мои советники умоляют меня решить, как поступить с этим новым течением..."
 forsaken.1100.opt.a: "Мы используем это запретное знание во благо себе!"
 forsaken.1100.opt.b: "Да будет отделена церковь от государства. Примем Тьму!"
 forsaken.1100.opt.c: "Наша земля — приют для многих вер. Умри и дай жить другим..."
  
 forsaken.1103.title: "$forgotten_shadow_adj$: Возрождение селинитов"
 forsaken.1103.desc.intro: "Со вздохом и взмахом руки я отпускаю свой малый совет. Со всех земель [Glossary('Forsaken', 'FORSAKEN_GLOSS')] поступает информация о новообращённых в новую религию под названием $forgotten_shadow$, основанную на подлинных записях, обнаруженных втайне в Подгороде во время его строительства. Источником этих учений стала Натали Селин, жрица из [GetTitleByKey('k_stormwind').GetNameNoTier] во времена вторжения орков, которая еретически призывала своих аколитов принять и понять $SHADOW_NAME$, так же как и $LIGHT_NAME$. Прозвав себя селинитами, эти жрецы были эффективным, хотя и необычным орудием в безнадёжной борьбе с Ордой.\n\nТеперь, когда её труды обретают новый контекст после вторжения [scourge|E] и оккупации Лордерона, многие, кто принял эту зарождающуюся религию, стали называть себя $forgotten_shadow_adherent_plural$."
 forsaken.1103.desc.subsumed: "Вздохнув и взмахнув рукой, я распускаю свой малый совет. Со всех земель Отрёкшихся поступает информация о новообращённых в новую религию под названием $forgotten_shadow_adj$, основанную на подлинных записях, обнаруженных в Подгороде во время его строительства. Источником этих учений стала Натали Селин, жрица из Штормграда во времена вторжения орков, которая еретически призывала своих аколитов принять и понять $SHADOW_NAME$, так же как и $LIGHT_NAME$. Прозвав себя селинитами, эти жрецы были эффективным, хотя и необычным орудием в безнадёжной борьбе с Ордой.\n\n [Select_CString(sylvanas_character.IsFemale, 'Почитаемая и уважаемая', 'Почитаемый и уважаемый' )] [GetGlobalVariable('sylvanas_character').Char.GetTitledFirstName] [Select_CString(sylvanas_character.IsFemale, 'издала', 'издал' )] указ о том, что [GetGlobalVariable('sylvanas_character').Char.GetHerHis] $forsaken_cult_adj$ является истинным преемником селинитского жречества. Теперь, когда её труды обрели новый контекст после вторжения [Concept( 'scourge', 'Плети' )|E] и оккупации Лордерона, многие, кто принял эту зарождающуюся религию, стали называть себя как $forgotten_shadow_adherent_plural$. Большинство этих новообращённых являются моими подданными, поскольку я являюсь [Select_CString(ROOT.Char.IsFemale, 'правительницей', 'правителем' )] Лордерона. Теперь мне предстоит решить, как лучше использовать эту ситуацию в своих интересах..."
  #story cycle owner chose conversion 
 forsaken.1103.desc.embraced: "Вздохнув и взмахнув рукой, я распускаю свой малый совет. Со всех земель Отрёкшихся поступает информация о новообращённых в новую религию под названием $forgotten_shadow_adj$, основанную на подлинных записях, обнаруженных в Подгороде во время его строительства. Источником этих учений стала Натали Селин, жрица из Штормграда во времена вторжения орков, которая еретически призывала своих аколитов принять и понять $SHADOW_NAME$, так же как и $LIGHT_NAME$. Прозвав себя селинитами, эти жрецы были эффективным, хотя и необычным орудием в безнадёжной борьбе с Ордой.\n\n Теперь, когда её труды обрели новый контекст после вторжения [Concept( 'scourge', 'Плети' )|E] и оккупации Лордерона, многие, кто принял эту зарождающуюся религию, стали называть себя как $forgotten_shadow_adherent_plural$. Даже [Select_CString(sylvanas_character.IsFemale, 'великая', 'великий' )] [GetGlobalVariable('sylvanas_character').Char.GetTitledFirstName] [Select_CString(sylvanas_character.IsFemale, 'приняла', 'принял' )] эту новую веру. Большинство этих новообращённых являются моими подданными, поскольку я являюсь [Select_CString(ROOT.Char.IsFemale, 'правительницей', 'правителем' )] Лордерона. Теперь мне предстоит решить, как лучше использовать эту ситуацию в своих интересах..."
  #story cycle owner chose tolerance 
 forsaken.1103.desc.tolerated: "Вздохнув и взмахнув рукой, я распускаю свой малый совет. Со всех земель Отрёкшихся поступает информация о новообращённых в новую религию под названием $forgotten_shadow_adj$, основанную на подлинных записях, обнаруженных в Подгороде во время его строительства. Источником этих учений стала Натали Селин, жрица из Штормграда во времена вторжения орков, которая еретически призывала своих аколитов принять и понять $SHADOW_NAME$, так же как и $LIGHT_NAME$. Прозвав себя селинитами, эти жрецы были эффективным, хотя и необычным орудием в безнадёжной борьбе с Ордой.\n\n Теперь, когда её труды обрели новый контекст после вторжения [Concept( 'scourge', 'Плети' )|E] и оккупации Лордерона, многие, кто принял эту зарождающуюся религию, стали называть себя как $forgotten_shadow_adherent_plural$. [Select_CString(sylvanas_character.IsFemale, 'Сама почтенная', 'Сам почтенный' )] [GetGlobalVariable('sylvanas_character').Char.GetTitledFirstName] [Select_CString(sylvanas_character.IsFemale, 'издала', 'издал' )] указ о терпимости к этой братской вере. Большинство этих новообращённых являются моими подданными, поскольку я являюсь [Select_CString(ROOT.Char.IsFemale, 'правительницей', 'правителем' )] Лордерона. Теперь мне предстоит решить, как лучше использовать эту ситуацию в своих интересах..."
  #options 
 forsaken.1103.opt.a: "Мы используем это запретное знание в своих интересах!"
 forsaken.1103.opt.b: "Отделим церковь от государства. Примем тень!"
 forsaken.1103.opt.c: "Наша земля может быть домом для многих конфессий. Умри и живи вновь..."
 forsaken.1103.obeyed: "Подчинение указу"
 forsaken.1103.disobeyed: "Неподчинение указу"
  
 ###################################### 
 #9000 - 9999: Random occurrence events 
 ###################################### 
  
 forsaken.9001.title: "Пойман на краже"
 forsaken.9001.desc.echoseeker: "Наши архивариусы поймали подозрительную личность, покидающую святилище нашей библиотеки с засекреченными магическими гримуарами и редкими свитками. Судя по всему, этот вор является членом небольшой секты свободной нежити, которая стремится вернуть себе «$echo_of_life_adj$» с помощью тайной магии. Известные как «$echo_of_life_adherent_plural$», члены этой секты не занимаются активным проповедованием, но часто участвуют в рискованных и опасных магических практиках. Однако в том создании, что предстало передо мной, я не вижу ни намёка на злобу; скорее это жалкое и отчаявшееся существо, молящее о пощаде и втором шансе.\n\nС одной стороны, я могу поступить с ним по своему усмотрению, ведь он - осуждённый вор. С другой стороны, из него может получиться полезный придворный или сильный шпион, если я смогу смириться с его жалкими убеждениями."
 forsaken.9001.desc.alchemist: "Наши аптекари поймали подозрительную личность, покинувшую наши экспериментальные камеры с засекреченными алхимическими реактивами и рецептами. Судя по всему, этот вор является членом небольшой секты свободной нежити, отвергающей всё божественное. Известные как «$alchemical_materialism_adherent_plural$», они не ведут активное проповедование, но часто участвуют в рискованных и опасных алхимических практиках. Когда вор предстал передо мной, я не могу не заметить намёка на злобу, скрывающуюся за блеском интеллекта хитрого и талантливого алхимика.\n\nС одной стороны, я могу поступить с ним по своему усмотрению, ведь он - осуждённый вор. С другой стороны, из него может получиться полезный придворный или сильный шпион, если я смогу смириться с его циничными убеждениями."
 forsaken.9001.desc.forgotten: "Наши архивариусы поймали подозрительную личность, покидающую наши библиотеки с копиями секретных документов, относящихся к учению Натали Селин. Судя по всему, этот вор является частью культа, известного как $forgotten_shadow_adj$, появившегося после наших раскопок в Подгороде. Хотя они часто занимаются благотворительностью и зачастую им свойственно благородство, их активные проповеди нарушают установленный порядок нашей державы. Однако в том воре, что предстал передо мной, я не вижу ни намёка на злобу, как не могу не заметить проблеск ума образованного жреца.\n\nС одной стороны, я могу поступить с ним по своему усмотрению, ведь он - осуждённый вор. С другой стороны, из него может получиться полезный придворный или сильный шпион, если я смогу смириться с его заблуждениями."
 forsaken.9001.desc.forsaken: "Наши аптекари поймали подозрительную личность, покинувшую наши экспериментальные камеры с засекреченными алхимическими реактивами и рецептами. Судя по всему, это один из тех последователей старых автократических путей, что известны как «$forsaken_cult_adherent_plural». Известно, что они ведут активную проповедь и часто занимаются рискованными и опасными алхимическими практиками. Я не могу игнорировать опасность, которую он представляет для зарождающегося порядка в державе.\n\nС одной стороны, я могу поступить с ним по своему усмотрению, ведь он - осуждённый вор. С другой стороны, хотя он слишком опасен, чтобы позволить ему оставаться в державе, он может оказаться умелым шпионом."
 forsaken.9001.opt.e: "Казнить этого наглого глупца."
 forsaken.9001.opt.a: "Бросить этого жалкого типа в темницу."
 forsaken.9001.opt.b: "Наложить штраф и отпустить вора, чтобы задобрить заблудших."
 forsaken.9001.opt.c: "Твой талант дал тебе второй шанс. Работай на меня."
 forsaken.9001.opt.d: "Ты живёшь только по моей воле, а теперь ступай и выполняй мою волю..."
  
 forsaken.9002.title: "Предложение, от которого можно отказаться"
 forsaken.9002.desc.echoseeker: "Мои советники ознакомили меня с предложением от некоего чародея с хорошей репутацией. Этот $echo_of_life_adherent$ утверждает, что может обучить наших заклинателей мощным экспериментальным заклинаниям в обмен на небольшую плату и временный доступ к некоторым из наших закрытых магических текстов.\n\nМы могли бы принять это предложение, но хорошо известно, что тайная магия сопряжена с рисками, а $echo_of_life_adherent_plural$ известны своей беспечностью в своих изысканиях. Другим решением было бы попросить этого мага сделать более традиционные зачарования и магические улучшения для доспехов наших солдат. В любой случае, решение остаётся за мной."
 forsaken.9002.desc.alchemist: "Мои советники ознакомили меня с предложением от алхимика с хорошей репутацией. Этот последователь идей, известных как $alchemical_materialism_adj$, утверждает, что может усилить наших рыцарей мощными экспериментальными зельями в обмен на небольшую плату и временный доступ к некоторым из наших закрытых алхимических лабораторий.\n\nМы могли бы принять это предложение, но хорошо известно, что такие алхимические изыскания несут в себе риск, а $alchemical_materialism_adherent_plural$ известны своими бездумными экспериментами и пренебрежением к благополучию своих подопытных. Другим решением было бы поручить этому алхимику изготовление более традиционных зелий и магических улучшений для доспехов наших солдат. В любой случае, решение остаётся за мной."
 forsaken.9002.desc.cultist: "Мои советники ознакомили меня с предложением от алхимика с хорошей репутацией. Этот член общества, известного как $forsaken_cult_adj$, утверждает, что может усилить наших рыцарей мощными экспериментальными зельями в обмен на небольшую плату и временный доступ к некоторым из наших закрытых алхимических лабораторий.\n\nМы могли бы принять это предложение, но хорошо известно, что такие алхимические изыскания несут в себе риск, а $forsaken_cult_adherent_plural$ известны своими бездумными экспериментами и рабской преданностью своему духовному лидеру. Другим решением было бы поручить этому алхимику изготовление более традиционных зелий и магических улучшений для доспехов наших солдат. В любой случае, решение остаётся за мной."
 forsaken.9002.opt.a: "Мы готовы пойти на риск. Начинайте эксперименты!"
 forsaken.9002.education_successful: "Магическое образование"
 forsaken.9002.education_successful_tt: "Заклинатели выучили экспериментальные чары"
 forsaken.9002.alterations_successful: "Алхимическое изменение"
 forsaken.9002.alterations_successful_tt: "Рыцари и великаны успешно улучшены"
 forsaken.9002.education_failed: "Магический взрыв"
 forsaken.9002.education_failed_tt: "Обучение магии закончилось трагедией"
 forsaken.9002.alterations_failed: "Алхимическое происшествие"
 forsaken.9002.alterations_failed_tt: "Алхимическое изменение закончилось трагедией"
 forsaken.9002.opt.b: "Остановимся на более традиционном варианте."
 forsaken.9002.opt.c: "Уберите этого еретика с глаз долой!"
  
 forsaken.9003.title: "Лабораторное происшествие"
 forsaken.9003.desc.arcanist: "Из нашей гильдии магов пришли тревожные новости. Похоже, что один из наших секретных экспериментальных центров взорвался, в результате чего по всей округе открылись разрывы во времени и пространстве. Странные существа из других измерений оставляли за собой следы разрушений, прежде чем исчезнуть в эфире, а магические молнии вызывали пожары, в которых сгорали целые поселения.\n\nОднако эта катастрофа также предоставила нам ценные данные, которые необходимо собрать и применить в поисках магического отголоска нашей божественной искры. Одна из возможностей - просто построить объект ещё больше и лучше, чем прежде. Другой вариант - спасти часть исследовательских материалов из этого места, чтобы применить их в другом месте. Наконец, некоторые из наших советников предложили воспользоваться этой возможностью, чтобы свалить вину на религиозных недоброжелателей этого региона.\n\nПока потусторонние грозовые тучи рассеиваются в ночи, наши агенты расходятся, чтобы исполнить нашу волю."
 forsaken.9003.desc.alchemist: "Из корпуса аптекарей пришли тревожные новости. Похоже, что одна из наших секретных экспериментальных лабораторий взорвалась, и опасные экспериментальные химикаты разлетелись по всей округе. Хотя наша нежить в основном невосприимчива к токсинам, непредсказуемое воздействие на дикую природу и строения привело к печальным жертвам.\n\nОднако эта катастрофа также предоставила нам... некие... возможности... Одна из возможностей - просто построить объект заново, больший и лучший (и, возможно, более безопасный). Другой вариант - спасти некоторые материалы из этого места, чтобы перенести часть этих средств обратно в наши обычные бухгалтерские книги. Наконец, некоторые члены Совета предложили воспользоваться возможностью и свалить вину на религиозных недоброжелателей региона.\n\nПока ядовитые и едкие испарения рассеиваются в ночи, наши агенты расходятся, чтобы исполнить мою волю."
 forsaken.9003.desc.other_alchemist: "Высший совет был созван глубокой ночью в связи с серьёзными новостями. Оказывается, алхимический оружейный комплекс, который поддерживали инакомыслящие $forsaken_cult_adherent_plural$, взорвался, случайно или намеренно, рассеяв опасные химикаты по всей округе. К счастью, наша нежить в основном невосприимчива к токсинам, но непредсказуемое воздействие на дикую природу и строения привело к печальным жертвам.\n\nЭта ужасная катастрофа должна быть устранена, чтобы продемонстрировать месть $WarGodNamePossessive$ и милосердие $HealthGodNamePossessive$.\n\nОдним из наших главных приоритетов является благополучие наших подданных, и быстрое распределение средств было бы лучшим способом оказать помощь пострадавшему району. Другим вариантом может стать спасение некоторых материалов с этого объекта, чтобы обеспечить финансирование и материалы для наших текущих проектов. Наконец, некоторые из наших советников предложили воспользоваться этой возможностью, чтобы свалить вину на еретиков, известных как $forsaken_cult_adherent_plural$, ответственных за эту катастрофу, и распространить $forgotten_shadow$ие идеи.\n\nПока ядовитые и едкие испарения рассеиваются в ночи, наши агенты расходятся, чтобы исполнить нашу волю."
 forsaken.9003.opt.a: "Немедленно перераспределить средства на восстановление."
 forsaken.9003.opt.b: "Направить специалистов для очистки."
 forsaken.9003.opt.c: "Я хочу, чтобы к закату была разработана пропагандистская кампания!"
  
 forsaken.9004.title: "Разгоревшийся конфликт"
 forsaken.9004.desc: "Я замедляю ход лошади и останавливаюсь, осматривая разрушенный город, который только что показался на горизонте. На обочине дороги ворон ковыряется в глазнице павшего фермера из Отрёкшихся. Там, где прошлой ночью в воздух поднимались столбы дыма, теперь лишь тишина, пепел и руины.\n\nВновь мой народ страдает от жестокости живых. Они отказываются признать нас разумными, заслуживающими мира и собственности. Они уносят наши вещи, наше богатство, плоды нашего урожая домой, а их вожди ничего не делают. На трупе крестьянина внизу видны следы грубых орудий, а не точного оружия; это сделали простые крестьяне без приказа своего господина."
 forsaken.9004.opt.a: "Перегруппировать войска, мы должны обеспечить безопастность этих людей."
 forsaken.9004.opt.b: "Выделить дополнительные средства на оборону."
 forsaken.9004.opt.d: "Это даёт нам возможность укрепить сплочённость."
 forsaken.9004.opt.c: "Мы отомстим. Мы поскачем сегодня вечером!"
 forsaken.9004.opt.c.duel: "Вы начнёте [Concept( 'martial', 'поединок' )|E] с владельцем вражеского графства."
 forsaken.9004.opt.c.duel.win: "Налёт успешен"
 forsaken.9004.opt.c.duel.lose: "Ваш налёт разгромлен"
 forsaken.9004.t: "Разгоревшийся конфликт"
 forsaken.9004.tt: "Это произошло из-за ненависти конфессии вашего графства к Отрёкшимся."
