  pam_luke_1_42_latin: "[Glossary('Et exclamavit voce magna, et dixit: Benedicta tu inter mulieres, et benedictus fructus ventris tui.','LUKE_1_42_LATIN_GLOSS')]"
  pam_luke_1_79_latin: "[Glossary('Illuminare his qui in tenebris et in umbra mortis sedent: ad dirigendos pedes nostros in viam pacis.','LUKE_1_79_LATIN_GLOSS')]"
  pam_colossians_3_15_latin: "[Glossary('Et pax Christi exsultet in cordibus vestris, in qua et vocati estis in uno corpore: et grati estote.','COLOSSIANS_3_15_LATIN_GLOSS')]"
  pam_matthew_5_9_latin: "[Glossary('Beati pacifici: quoniam filii Dei vocabuntur.','MATTHEW_5_9_LATIN_GLOSS')]"
  pam_philippians_4_21_latin: "[Glossary('Salutate omnem sanctum in Christo Jesu.','PHILIPPIANS_4_21_LATIN_GLOSS')]"
  pam_hebrews_12_1_latin: "[Glossary('Ideoque et nos tantam habentes impositam nubem testium, deponentes omne pondus, et circumstans nos peccatum, per patientiam curramus ad propositum nobis certamen.','HEBREWS_12_1_LATIN_GLOSS')]"
  pam_acts_7_59_latin: "[Glossary('Et lapidabant Stephanum invocantem, et dicentem: Domine Jesu, suscipe spiritum meum.','ACTS_7_59_LATIN_GLOSS')]"
  pam_luke_22_19_latin: "[Glossary('Et accepto pane gratias egit, et fregit, et dedit eis, dicens: Hoc est corpus meum, quod pro vobis datur: hoc facite in meam commemorationem.','LUKE_22_19_LATIN_GLOSS')]"
  pam_1_corinthians_1_10_latin: "[Glossary('Obsecro autem vos fratres per nomen Domini nostri Jesu Christi: ut idipsum dicatis omnes, et non sint in vobis schismata: sitis autem perfecti in eodem sensu, et in eadem sententia.','1_CORINTHIANS_1_10_LATIN_GLOSS')]"
  pam_1_corinthians_10_16_latin: "[Glossary('Calix benedictionis, cui benedicimus, nonne communicatio sanguinis Christi est? Et panis, quem frangimus, nonne participatio corporis Domini est?','1_CORINTHIANS_10_16_LATIN_GLOSS')]"
  pam_1_corinthians_10_17_latin: "[Glossary('Quoniam unus panis, unum corpus multi sumus, omnes qui de uno pane participamus.','1_CORINTHIANS_10_17_LATIN_GLOSS')]"
  pam_john_6_41_latin: "[Glossary('Murmurabant ergo Judaei de illo, quia dixisset: Ego sum panis vivus, qui de caelo descendi.','JOHN_6_41_LATIN_GLOSS')]"
  pam_1_thessalonians_5_16_20_latin: "[Glossary('Semper gaudete. Sine intermissione orate. In omnibus gratias agite: hæc est enim voluntas Dei in Christo Jesu in omnibus vobis. Spiritum nolite extinguere. Prophetias nolite spernere.','1_THESSALONIANS_5_16_20_LATIN_GLOSS')]"
  pam_1_thessalonians_4_11_latin: "[Glossary('Et operam detis ut quieti sitis, et ut vestrum negotium agatis, et operemini manibus vestris, sicut præcepimus vobis.','1_THESSALONIANS_4_11_LATIN_GLOSS')]"
  pam_proverbs_6_6_latin: "[Glossary('Vade ad formicam, o piger, et considera vias ejus, et disce sapientiam.','PROVERBS_6_6_LATIN_GLOSS')]"
  pam_john_19_26_27_latin: "[Glossary('Cum vidisset ergo Jesus matrem, et discipulum stantem, quem diligebat, dicit matri suae: Mulier, ecce filius tuus. Deinde dicit discipulo: Ecce mater tua. Et ex illa hora accepit eam discipulus in sua.','JOHN_19_26_27_LATIN_GLOSS')]"
  pam_isaiah_7_14_latin: "[Glossary('Propter hoc dabit Dominus ipse vobis signum: Ecce virgo concipiet, et pariet filium, et vocabitur nomen ejus Emmanuel.','ISAIAH_7_14_LATIN_GLOSS')]"
  pam_proverbs_31_20_latin: "[Glossary('Manum suam aperuit inopi, et palmas suas extendit ad pauperem.','PROVERBS_31_20_LATIN_GLOSS')]"
  pam_revelation_12_1_latin: "[Glossary('Et signum magnum apparuit in cælo: mulier amicta sole, et luna sub pedibus ejus, et in capite ejus corona stellarum duodecim.','REVELATION_12_1_LATIN_GLOSS')]"
  pam_acts_8_18_latin: "[Glossary('Cum vidisset autem Simon quia per impositionem manus Apostolorum daretur Spiritus Sanctus, obtulit eis pecuniam.','ACTS_8_18_LATIN_GLOSS')]"
  pam_proverbs_21_20_latin: "[Glossary('Thesaurus desiderabilis, et oleum in habitaculo justi: et imprudens homo dissipabit illud.','PROVERBS_21_20_LATIN_GLOSS')]"
  pam_luke_16_11_latin: "[Glossary('Si ergo in iniquo mammona fideles non fuistis: quod verum est, quis credet vobis?','LUKE_16_11_LATIN_GLOSS')]"
  pam_john_10_30_latin: "[Glossary('Ego et Pater unum sumus.','JOHN_10_30_LATIN_GLOSS')]"
  pam_john_1_1_latin: "[Glossary('In principio erat Verbum, et Verbum erat apud Deum, et Deus erat Verbum.','JOHN_1_1_LATIN_GLOSS')]"
  pam_hebrews_1_3_latin: "[Glossary('Qui cum sit splendor gloriae, et figura substantiae ejus, portansque omnia verbo virtutis suae, purgationem peccatorum faciens, sedet ad dexteram Majestatis in excelsis','HEBREWS_1_3_LATIN_GLOSS')]"
  pam_acts_1_8_latin: "[Glossary('Sed accipietis virtutem supervenientis Spiritus Sancti in vos, et eritis mihi testes in Jerusalem, et in omni Judaea, et Samaria, et usque ad ultimum terrae.','ACTS_1_8_LATIN_GLOSS')]"
  pam_acts_2_4_latin: "[Glossary('Et repleti sunt omnes Spiritu Sancto, et coeperunt loqui variis linguis, prout Spiritus Sanctus dabat eloqui illis.','ACTS_2_4_LATIN_GLOSS')]"
  pam_acts_2_38_latin: "[Glossary('Petrus vero ad illos: Poenitentiam, inquit, agite, et baptizetur unusquisque vestrum in nomine Jesu Christi in remissionem peccatorum vestrorum: et accipietis donum Spiritus Sancti.','ACTS_2_38_LATIN_GLOSS')]"
  pam_2_macabees_12_44_latin: "[Glossary('Nisi enim eos, qui ceciderant, resurrecturos speraret, superfluum videretur et vanum orare pro mortuis.','2_MACABEES_12_44_LATIN_GLOSS')]"
  pam_matthew_12_25_latin: "[Glossary('Omne regnum divisum contra se desolabitur: et omnis civitas vel domus divisa contra se, non stabit.','MATTHEW_12_25_LATIN_GLOSS')]"
  pam_matthew_12_32_latin: "[Glossary('Et quicumque dixerit verbum contra Filium hominis, remittetur ei: qui autem dixerit contra Spiritum Sanctum, non remittetur ei neque in hoc saeculo, neque in futuro.','MATTHEW_12_32_LATIN_GLOSS')]"
  pam_hebrews_12_29_latin: "[Glossary('Etenim Deus noster ignis consumens est.','HEBREWS_12_29_LATIN_GLOSS')]"
  pam_genesis_1_28_latin: "[Glossary('Benedixitque illis Deus, et ait: Crescite et multiplicamini, et replete terram, et subjicite eam, et dominamini piscibus maris, et volatilibus caeli, et universis animantibus, quae moventur super terram.','GENESIS_1_28_LATIN_GLOSS')]"
  pam_matthew_19_5_latin: "[Glossary('Et dixit: Propter hoc dimittet homo patrem, et matrem, et adhaerebit uxori suae, et erunt duo in carne una.','MATTHEW_19_5_LATIN_GLOSS')]"
  pam_ephesians_4_3_6_latin: "[Glossary('Solliciti servare unitatem Spiritus in vinculo pacis. Unum corpus, et unus Spiritus, sicut vocati estis in una spe vocationis vestrae. Unus Dominus, una fides, unum baptisma. Unus Deus et Pater omnium, qui est super omnes, et per omnia, et in omnibus nobis.','EPHESIANS_4_3_6_LATIN_GLOSS')]"
  pam_ephesians_5_25_latin: "[Glossary('Viri, diligite uxores vestras, sicut et Christus dilexit Ecclesiam, et seipsum tradidit pro ea.','EPHESIANS_5_25_LATIN_GLOSS')]"
  pam_matthew_16_18_latin: "[Glossary('Et ego dico tibi, quia tu es Petrus, et super hanc petram aedificabo Ecclesiam meam, et portae inferi non praevalebunt adversus eam.','MATTHEW_16_18_LATIN_GLOSS')]"
  pam_2_timothy_2_2_latin: "[Glossary('Et quae audisti a me per multos testes, haec commenda fidelibus hominibus, qui idonei erunt et alios docere.','2_TIMOTHY_2_2_LATIN_GLOSS')]"
  pam_titus_1_5_latin: "[Glossary('Hujus rei gratia reliqui te Creta, ut ea quae desunt corrigas, et constituas per civitates presbyteros, sicut et ego disposui tibi.','TITUS_1_5_LATIN_GLOSS')]"
  pam_james_5_16_latin: "[Glossary('Confitemini ergo alterutrum peccata vestra, et orate pro invicem ut salvemini: multum enim valet deprecatio justi assidua.','JAMES_5_16_LATIN_GLOSS')]"
  pam_1_john_1_9_latin: "[Glossary('Si confiteamur peccata nostra: fidelis est, et justus, ut remittat nobis peccata nostra, et emundet nos ab omni iniquitate.','1_JOHN_1_9_LATIN_GLOSS')]"
  pam_john_20_23_latin: "[Glossary('Quorum remiseritis peccata, remittuntur eis: et quorum retinueritis, retenta sunt.','JOHN_20_23_LATIN_GLOSS')]"
  pam_romans_5_12_latin: "[Glossary('Propterea sicut per unum hominem peccatum in hunc mundum intravit, et per peccatum mors, et ita in omnes homines mors pertransiit, in quo omnes peccaverunt.','ROMANS_5_12_LATIN_GLOSS')]"
  pam_psalm_51_5_latin: "[Glossary('Ecce enim in iniquitatibus conceptus sum: et in peccatis concepit me mater mea.','PSALM_51_5_LATIN_GLOSS')]"
  pam_genesis_3_6_latin: "[Glossary('Vidit igitur mulier quod bonum esset lignum ad vescendum, et pulchrum oculis, aspectuque delectabile: et tulit de fructu illius, et comedit: deditque viro suo, qui comedit.','GENESIS_3_6_LATIN_GLOSS')]"
  # Celestial Hierarchy Tenet
  pam_hebrews_1_14_latin: "[Glossary('Nonne omnes sunt administratorii spiritus, in ministerium missi propter eos, qui haereditatem capient salutis?','HEBREWS_1_14_LATIN_GLOSS')]"
  pam_psalm_91_11_latin: "[Glossary('Quoniam angelis suis mandavit de te: ut custodiant te in omnibus viis tuis.','PSALM_91_11_LATIN_GLOSS')]"
  pam_matthew_18_10_latin: "[Glossary('Videte ne contemnatis unum ex his pusillis: dico enim vobis quia angeli eorum in cælis semper vident faciem Patris mei, qui in caelis est.','MATTHEW_18_10_LATIN_GLOSS')]"
