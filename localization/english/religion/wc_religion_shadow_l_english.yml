 #Cult of the Forgotten Shadow-Group Faiths
 cult_of_the_forgotten_shadow:0 "Cult of the Forgotten Shadow"
 cult_of_the_forgotten_shadow_adj:0 "Forgotten"
 cult_of_the_forgotten_shadow_adherent:0 "Forgotten"
 cult_of_the_forgotten_shadow_adherent_plural:0 "Forgotten"
 cult_of_the_forgotten_shadow_desc:0 "Branded heretics by the faithful of the Light, the $cult_of_the_forgotten_shadow_adherent_plural$ see in the Shadow not corruption, but the other half of creation: as the Light sustains the world, so too does the Shadow. Their priests master its arts with iron discipline, for beyond the Shadow lies the Void, and those who delve too greedily risk falling into its devouring abyss, never to return."

 #Alchemical Materialism-Group Faiths
 alchemical_materialism:0 "Alchemical Materialism"
 alchemical_materialism_adj:0 "Alchemicist"
 alchemical_materialism_adherent:0 "Alchemicist"
 alchemical_materialism_adherent_plural:0 "Alchemicists"
 alchemical_materialism_desc:0 "Exposed to the teachings of the $cult_of_the_forgotten_shadow$, many scientifically minded individuals have come to doubt that the forces of creation deserve any reverence at all. To some, the magical science of alchemy is the key to bending those forces to one's will. For if nothing is sacred, anything can be a tool, and any tool can be a weapon."
 
