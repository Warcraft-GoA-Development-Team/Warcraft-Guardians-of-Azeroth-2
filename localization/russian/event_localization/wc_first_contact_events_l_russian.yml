l_russian:
 TRUCE_DIPLOMATIC: "\nПеремирие подписано в связи с дипломатическими отношениями."
 first_contact_letter_method: "#EMP Вы отправляете письмо [reciever.GetName], заявляя о своей позиции.#!"
 first_contact_self_method: "#EMP Вы отправляетесь в [sender.GetPrimaryTitle.GetName], заявляя о своей позиции, или, возможно, исследуя местность.#!"
 first_contact_self_method_suramar: "Вы отправляетесь в [GetTitleByKey('k_suramar').GetName] для встречи с их правителем, [GetTitleByKey('k_suramar').GetHolder.GetName].\n$BULLET$Заявите о своих дипломатических отношениях с Сурамаром как #p дружелюбные#!, #color_yellow воинственные#! или #n враждебные#!."
  
 wc_first_contact_events.0001.opening_flirty: "Для [ROOT.Char.Custom('RomanticComplimentAdjective')] [ROOT.Char.GetFirstNameNoTooltip],"
 wc_first_contact_events.0001.opening_flirty_2: "Дорогой [ROOT.Char.Custom('RomanticComplimentNoun')] — то есть, [ROOT.Char.GetFirstNameNoTooltip],"
 wc_first_contact_events.0001.opening_fancy: "К [ROOT.Char.Custom('FormalComplimentAdjective')] [ROOT.Char.GetFirstNameNoTooltip],"
 wc_first_contact_events.0001.opening_same_faith: "Товарищ [ROOT.Char.GetFaith.GetAdherentNameNoTooltip],"
 wc_first_contact_events.0001.opening_1: "Приветствую, [ROOT.Char.GetTitleAsNameNoTooltip],"
 wc_first_contact_events.0001.opening_2: "Могучий правитель,"
 wc_first_contact_events.0001.opening_3: "Для [ROOT.Char.GetTitleAsNameNoTooltip],"
 wc_first_contact_events.0001.desc_intro_1: "Надеюсь, это сообщение застанет вас в добром здравии. Я — [sender.GetFirstName], [sender.GetTitleAsNameNoTooltip] из [sender.GetPrimaryTitle.GetNameNoTier]."
 wc_first_contact_events.0001.desc_intro_2: "Я родом из [sender.GetPrimaryTitle.GetNameNoTier] и слышал(а) о решении вашего народа прекратить изоляцию."
 wc_first_contact_events.0001.desc_intro_arrogant: "Вы узнаете меня как [sender.GetFirstName], [sender.GetTitleAsNameNoTooltip] из [sender.GetPrimaryTitle.GetNameNoTier]."
 wc_first_contact_events.0001.desc_intro_3: "Я правлю [sender.GetPrimaryTitle.GetNameNoTier], и нам поступили вести о вашем возвращении в мир."
 wc_first_contact_events.0001.desc_intro_4: "[sender.GetFirstName] — моё имя, и я посылаю это сообщение из [sender.GetPrimaryTitle.GetNameNoTier]."
 wc_first_contact_events.0001.desc_intro_5: "Рождён(а) как [sender.GetFirstName], я — [sender.GetTitleAsNameNoTooltip] из [sender.GetPrimaryTitle.GetNameNoTier]."
 wc_first_contact_events.0001.desc_intro_pious: "Помазанный(ая) [sender.GetFaith.HighGodName], я — [sender.GetName]."
 wc_first_contact_events.0001.desc_newline: "\n\n"
 wc_first_contact_events.0001.desc_region_neighbor_1: "Как ваш сосед,"
 wc_first_contact_events.0001.desc_region_neighbor_2: "Будучи близким к вашему царству,"
 wc_first_contact_events.0001.desc_region_neighbor_3: "Живя на тех же землях, что и вы,"
 wc_first_contact_events.0001.desc_region_northrend: "Из холодных земель Нортренда,"
 wc_first_contact_events.0001.desc_region_northrend_2: "Правящий под холодным небом Нортренда,"
 wc_first_contact_events.0001.desc_region_northrend_3: "Правящий на севере от вас,"
 wc_first_contact_events.0001.desc_region_eastern_kingdoms: "Как житель Восточных королевств,"
 wc_first_contact_events.0001.desc_region_eastern_kingdoms_2: "Правящий во Восточных королевствах,"
 wc_first_contact_events.0001.desc_region_eastern_kingdoms_3: "Живущий к востоку от вас,"
 wc_first_contact_events.0001.desc_region_eastern_kingdoms_4: "Всего лишь через море от вас,"
 wc_first_contact_events.0001.desc_region_pandaria: "Будучи из земель Пандарии,"
 wc_first_contact_events.0001.desc_region_pandaria_2: "Правящий в землях пандаренов,"
 wc_first_contact_events.0001.desc_region_pandaria_3: "Живущий на самом юге от вас,"
 wc_first_contact_events.0001.desc_region_kalimdor: "Живущий в древних землях наших эльфов,"
 wc_first_contact_events.0001.desc_region_kalimdor_2: "Правящий в землях далеко на западе,"
 wc_first_contact_events.0001.desc_region_kalimdor_3: "Как правитель Калимдора,"
 wc_first_contact_events.0001.desc_region_1: "Будучи иностранным правителем,"
 wc_first_contact_events.0001.desc_region_2: "Как правитель далёкой земли,"
 wc_first_contact_events.0001.desc_region_3: "Как правитель далёкого царства,"
 wc_first_contact_events.0001.desc_region_broken_isles: "Живущий на Расколотых Островах,"
 wc_first_contact_events.0001.desc_region_broken_isles_2: "Правящий на Расколотых Островах,"
  
 wc_first_contact_events.0001.desc_outro_friendly_1: "Я приветствую ваше возвращение в мир и надеюсь, что мы сможем лучше узнать друг друга."
 wc_first_contact_events.0001.desc_outro_friendly_2: "Надеюсь, мы сможем лучше узнать друг друга, и народ Сурамара добьется успеха."
 wc_first_contact_events.0001.desc_outro_friendly_3: "Народ [sender.GetPrimaryTitle.GetNameNoTier] стремится встретиться с вами, и я надеюсь, что наше будущее сотрудничество будет плодотворным."
 wc_first_contact_events.0001.desc_outro_friendly_4: "Наши народы станут братьями и сёстрами и вместе противостоят любым испытаниям."
 wc_first_contact_events.0001.desc_outro_friendly_flirty: "Я желаю видеть успех вашего народа и, быть может, однажды увидеть вас в моих покоях."
 wc_first_contact_events.0001.desc_outro_friendly_extroverted: "Я надеюсь, что ваше царство будет процветать, и, быть может, народ [sender.GetPrimaryTitle.GetNameNoTier] отпразднует в ваших залах."
 wc_first_contact_events.0001.desc_outro_friendly_5: "Молю, чтобы наши пути пересеклись, будь то в моём царстве или в вашем."
 wc_first_contact_events.0001.desc_outro_friendly_6: "Я желаю установить с вами добрые отношения, [sender.GetFirstNameNoTooltip]."
 wc_first_contact_events.0001.desc_outro_friendly_7: "Я с нетерпением жду, что готовит нам будущее, [sender.GetFirstNameNoTooltip]."
  
 wc_first_contact_events.0001.desc_outro_neutral_1: "Ваше разоблачение несколько тревожит моих людей, но я готов его выслушать."
 wc_first_contact_events.0001.desc_outro_neutral_2: "Знайте, я буду наблюдать за вами, и любые проступки не останутся незамеченными."
 wc_first_contact_events.0001.desc_outro_neutral_3: "Я не слаб, но и не склонен к ярости. Держитесь в рамках, и у нас не будет ссор."
 wc_first_contact_events.0001.desc_outro_neutral_4: "Я не слишком доверяю, но не желаю вам зла."
 wc_first_contact_events.0001.desc_outro_neutral_5: "Ваш подъём к власти вызывает вопросы, но не отталкивает."
 wc_first_contact_events.0001.desc_outro_neutral_6: "Я всегда подозрителен к новым лицам, в том числе и к вам."
  
 wc_first_contact_events.0001.desc_outro_hostile_1: "Я не потерплю таких, как вы, и не поколеблюсь действовать против вас."
 wc_first_contact_events.0001.desc_outro_hostile_2: "Я желаю вашему народу только бед и не успокоюсь, пока вас не уничтожу."
 wc_first_contact_events.0001.desc_outro_hostile_3: "Мир узнает день, когда я раздавлю вас под своей сапогой, и ваш народ узнает только страдания."
 wc_first_contact_events.0001.desc_outro_hostile_4: "Ваше присутствие — позор самому существованию, и вы здесь не желанный."
 wc_first_contact_events.0001.desc_outro_hostile_5: "Мои мысли о вас схожи с мыслями моих врагов, и я обращусь с вами соответственно."
  
 wc_first_contact_events.0001.friendly: "Я приветствую вас, [sender.GetFirstName]!"
 wc_first_contact_events.0001.friendly_2: "Благодарю за ваше сообщение, [sender.GetTitleAsNameNoTooltip]!"
 wc_first_contact_events.0001.friendly_3: "Надеюсь, мы сможем подружиться, [sender.GetFirstNameNoTooltip]."
 wc_first_contact_events.0001.friendly_mutual: "Рад, что вы дружелюбны, [sender.GetFirstNameNoTooltip]."
  
 wc_first_contact_events.0001.friendly_tt: "Вы отправляете ответное сообщение [sender.GetFirstName], принимая #p дружелюбные#! дипломатические отношения:$first_contact_friendly_effects_tt_sender$"
  
 first_contact_friendly_effects_sender: "У вас положительное впечатление о [sender.GetFirstName], и вы принимаете #p дружелюбные#! дипломатические отношения:$first_contact_friendly_effects_tt_sender$"
 first_contact_friendly_effects_reciever: "Если [sender.GetFirstName] также положительно настроен к вам:\n$first_contact_friendly_effects_tt$\n$BULLET_WITH_TAB$Вы оба получаете перемирие на #V 1#! год"
 first_contact_friendly_effects: "Из-за #p положительного#! впечатления [sender.GetFirstNamePossessive] о вас:\n$first_contact_friendly_effects_tt$"
 first_contact_friendly_effects_tt: "$BULLET_WITH_TAB$[sender.GetSheHe|U] будет #bold менее склонен#! начинать или присоединяться к враждебному [scheme|E] против вас\n$BULLET_WITH_TAB$Личные [schemes|E] против [sender.GetHerHim] будут иметь #bold увеличенный#! шанс успеха\n$BULLET_WITH_TAB$[sender.GetSheHe|U] будет #bold более склонен#! присоединиться к вашему [union|E] или принять предложение о [marriage|E]\n$BULLET_WITH_TAB$Любой враждебный [scheme|E] против [sender.GetHerHim] начнется с #bold пониженной#! [secrecy|E]"
 first_contact_friendly_effects_tt_sender: "\n$BULLET_WITH_TAB$Любой враждебный [scheme|E] против [sender.GetHerHim] начнется с #bold пониженной#! [secrecy|E]\n$BULLET_WITH_TAB$Личные [schemes|E] против [sender.GetHerHim] будут иметь #bold увеличенный#! шанс успеха"
 wc_first_contact_events.0001.friendly_toast: "[reciever.GetFirstName] открыт(а) для #p дружелюбных#! отношений"
  
 wc_first_contact_events.0001.neutral: "Понятно, [sender.GetFirstNameNoTooltip]."
 wc_first_contact_events.0001.neutral_2: "Я приму во внимание ваши слова, [sender.GetTitleAsNameNoTooltip]."
 wc_first_contact_events.0001.neutral_3: "Я учту ваше сообщение, [sender.GetFirstNameNoTooltip]."
 wc_first_contact_events.0001.neutral_4: "Не привыкайте слишком, [sender.GetTitleAsNameNoTooltip]."
 wc_first_contact_events.0001.neutral_tt: "Вы отправляете ответное сообщение [sender.GetFirstName], предлагая #color_yellow настороженные#! дипломатические отношения.\n$first_contact_neutral_effects_tt_sender$"
 wc_first_contact_events.0001.neutral_toast: "[reciever.GetFirstName] #color_yellow насторожен(на)#! к вам"
 wc_first_contact_events.0001.neutral_mutual: "Не волнуйтесь, я тоже осторожен(на)."
  
 first_contact_neutral_effects_sender: "Вы настроены настороженно к [sender.GetFirstName]:\n$first_contact_neutral_effects_tt_sender$"
 first_contact_neutral_effects_reciever: "Если [sender.GetFirstName] также настроен(а) настороженно к вам:\n$first_contact_neutral_effects_tt$"
 first_contact_neutral_effects_tt_sender: "$first_contact_neutral_effects$"
 first_contact_neutral_effects: "$BULLET_WITH_TAB$Враждебные [schemes|E] от [sender.GetHerHim] будут начинаться с #bold пониженной#! секретности, но он будет более склонен присоединиться или начать их."
 first_contact_neutral_effects_tt: "$BULLET_WITH_TAB$Враждебные [schemes|E], направленные против [sender.GetHerHim], начнутся с #bold пониженной#! секретности"
 first_contact_neutral_effects_tt_2: "Из-за #color_yellow настороженного#! впечатления [sender.GetFirstName] о вас:\n$first_contact_neutral_effects_tt$"
 neutral_both_tt: "Враждебные [schemes|E] от и против [sender.GetHerHim] будут иметь #bold пониженный#! шанс успеха"
  
 first_contact_hostile_effects_sender: "У вас негативное впечатление о [sender.GetFirstName], и вы принимаете #n враждебные#! дипломатические отношения:$first_contact_hostile_effects_tt_sender$"
 first_contact_hostile_effects_reciever: "Если [sender.GetFirstName] также имеет негативное впечатление о вас:\n$first_contact_hostile_effects_tt$\n$BULLET_WITH_TAB$Вы оба получаете [claim|E] на своё царство"
 first_contact_hostile_effects: "Из-за #n негативного#! впечатления [sender.GetFirstNamePossessive] о вас:\n$first_contact_hostile_effects_tt$"
 first_contact_hostile_effects_tt: "$BULLET_WITH_TAB$[sender.GetSheHe|U] будет #bold более склонен#! начинать или присоединяться к враждебному [scheme|E] против вас\n$BULLET_WITH_TAB$Враждебные [schemes|E] против [sender.GetHerHim] будут иметь #bold увеличенный#! шанс успеха\n$BULLET_WITH_TAB$[sender.GetSheHe|U] будет #bold менее склонен#! присоединиться к вашему [union|E] или принять предложение о [marriage|E]"
 first_contact_hostile_effects_tt_sender: "\n$BULLET_WITH_TAB$Любой враждебный [scheme|E] против [sender.GetHerHim] начнется с #bold увеличенной#! [secrecy|E]\n$BULLET_WITH_TAB$Враждебные [schemes|E] против [sender.GetHerHim] будут иметь #bold увеличенный#! шанс успеха"
 wc_first_contact_events.0001.hostile_toast: "[reciever.GetFirstName] #n враждебен(на)#! к вам"
  
 wc_first_contact_events.0001.hostile_tt: "Вы отправляете ответное сообщение [sender.GetFirstName], демонстрируя #n враждебные#! дипломатические отношения:$first_contact_hostile_effects_tt_sender$"
 wc_first_contact_events.0001.hostile: "Проклят будь, [sender.GetFirstName]!"
 wc_first_contact_events.0001.hostile_2: "Я не потерплю вас, [sender.GetTitleAsNameNoTooltip]!"
 wc_first_contact_events.0001.hostile_3: "Ваше сообщение нежелательно, [sender.GetFirstNameNoTooltip]."
 wc_first_contact_events.0001.hostile_4: "Ваша дипломатия не скроет вашу подлость..."
 wc_first_contact_events.0001.hostile_5: "Я не поддамся вашим словам, [sender.GetFirstNameNoTooltip]."
 wc_first_contact_events.0001.hostile_mutual: "Еще один враг — как восхитительно."
  
 good_first_contact_opinion: "Хорошее первое впечатление"
 first_contact_opinion_desc: "Их первое впечатление о вас: $VALUE|+=0$"
 reverse_first_contact_opinion_desc: "Ваше первое впечатление о них: $VALUE|+=0$"
 bad_first_contact_opinion: "Враждебная дипломатия"
 neutral_first_contact_opinion: "Воинственность"
