l_russian:

 ##################################################################
 # arcane_magic_lifestyle_events.1001
 # цвет из иных миров
 ##################################################################

 arcane_magic_lifestyle_events.1001.t: "Цвет из иных миров"
 arcane_magic_lifestyle_events.1001.desc: "После моих последних опытов окружающее пространство приобрело странный оттенок — неописуемое зрительное ощущение на грани текстуры и цвета. Я не придавал значения этой перемене, пока она ограничивалась моей мастерской, или даже когда она начала распространяться на остальную часть [ROOT.Char.GetCapitalLocation.GetHolding.GetType.GetName|l], а мои слуги начали перешёптываться.\n\nОднако теперь, когда этот необычный эффект начал распространяться на окрестные земли, некоторые из более #italic склонных к фантазиям#! обитателей распускают мрачные слухи и придумывают нелепые объяснения этому явлению. Если подумать, странные кристаллы и светящиеся тени, что начали самопроизвольно появляться в моих покоях, могут быть предвестниками куда более радикальной стадии этой перемены..."
 arcane_magic_lifestyle_events.1001.opt.a: "Я должен изучить эту перемену!"
 arcane_magic_lifestyle_events.1001.opt.b: "Мои опыты зашли слишком далеко..."
 arcane_magic_lifestyle_events.1001.opt.c: "Кажется, я знаю, как это исправить."
 arcane_magic_lifestyle_events.1001.opt.d: "Пора провести ритуал изгнания!"

 ##################################################################
 # arcane_magic_lifestyle_events.1011
 # нечитаемый том
 ##################################################################

 arcane_magic_lifestyle_events.1011.t: "Нечитаемый том"
 arcane_magic_lifestyle_events.1011.desc: "Во время одного из недавних путешествий я остановился у старых руин, чтобы поискать что-нибудь полезное для магии. Одной из моих находок была странная книга — сильно потрёпанная, но в удивительно хорошем состоянии, с письменами на незнакомом мне языке.\n\nМои недавние изыскания в её тайнах привели меня к осознанию: эта книга написана не на каком-либо известном моему двору языке — более того, символы в ней словно бы меняются через случайные промежутки времени; открывая книгу, я никогда не знаю, окажутся ли в ней те же символы и слова, что и в прошлый раз. Эта загадка столь же озадачивает, сколь и завораживает; кто знает, какие тайны призвано скрывать это волшебство!"
 arcane_magic_lifestyle_events.1011.opt.a: "Если я приложу достаточно усилий, её тайны станут моими..."
 arcane_magic_lifestyle_events.1011.opt.b: "Этому волшебству есть чему нас научить!"
 arcane_magic_lifestyle_events.1011.opt.c: "Это не более чем диковинка."

 ##################################################################
 # arcane_magic_lifestyle_events.1021
 # вековечный спор
 ##################################################################

 arcane_magic_lifestyle_events.1021.t: "Вековечный спор"
 arcane_magic_lifestyle_events.1021.desc: "«Ты глупец! Как ты смеешь утверждать, что основные стихии превосходят чистоту Тайной магии?»\n«Основные? Тепло и холод — самые фундаментальные из всех энергий, и если ты не способен этого понять, тебе вообще не стоит изучать магию!»\n\nЯ пригласил этих двух магов в свою мастерскую в надежде просто обменяться знаниями и поучиться на их опыте, но вместо этого они лишь спорят о том, какая школа тайной магии превосходит другую — антиподная или «чистая». Эта утомительная перепалка длится уже часами, которые я мог бы потратить на свои изыскания!\n\nВнезапно [antipodean_mage.GetName] поворачивается ко мне. «[ROOT.Char.GetTitledFirstNameNoTooltip], — говорит [antipodean_mage.GetSheHe], — что вы думаете об этом споре?»\n«Да, да, разумеется, — говорит [antipodean_mage.GetName], — пусть наш [ROOT.Char.GetTitleAsNameNoTooltip] рассудит нас!»"
 arcane_magic_lifestyle_events.1021.opt.a: "Антиподная магия более уместна."
 arcane_magic_lifestyle_events.1021.opt.b: "Чистая Тайная магия, очевидно, превосходнее."
 arcane_magic_lifestyle_events.1021.opt.c: "Лишь целостное изучение откроет истину!"
 arcane_magic_lifestyle_events.1021.opt.d: "Хватит! Вон отсюда!"

 ##################################################################
 # arcane_magic_lifestyle_events.1031
 # время останавливается
 ##################################################################

 arcane_magic_lifestyle_events.1031.t: "Время останавливается"
 arcane_magic_lifestyle_events.1031.desc: "Ваши опыты с тайной магией породили временной каскад, из-за которого вы выпали из хода времени. Мир вокруг застыл в полной неподвижности, но вы вольны двигаться и действовать как пожелаете. Вы не вполне понимаете, как это произошло, но, похоже, эффект продлится не дольше пары субъективных дней.\n\nЭто событие подарило вам неожиданное изобилие свободного времени, пока вы ждёте, когда аномалия рассеется сама собой. Как правитель, вы сразу осознаёте, какой бесценной возможностью вас одарили. Как вы ею распорядитесь?"
 arcane_magic_lifestyle_events.1031.opt.a: "Пора немного почитать!"
 arcane_magic_lifestyle_events.1031.opt.b: "Наконец-то можно отдохнуть, попировать и расслабиться."
 arcane_magic_lifestyle_events.1031.opt.c: "Значит ли это... что я невидим?"

 ##################################################################
 # arcane_magic_lifestyle_events.1041
 # трещина в реальности
 ##################################################################

 arcane_magic_lifestyle_events.1041.t: "Трещина в реальности"
 arcane_magic_lifestyle_events.1041.desc: "Это случилось мгновенно и без предупреждения... Ужасный взрыв, за которым последовал всплеск пурпурного света. Почти миля растительности была расплющена в одно мгновение, а ландшафт быстро поглотили гигантские розовые и синие кристаллы неизвестного материала. Странные существа, подобные элементалям, чьи тела состоят из потрескивающей хаотичной тайной энергии, теперь кишат по всей округе. А в самом сердце всего этого — парящий рваный разлом, извергающий межпланарную магию.\n\nНеужели это мои изыскания? Неважно. Я должен действовать быстро, прежде чем эта катастрофа привлечёт внимание кого-то из могущественных существ, что заявляют о своей «защите» этого мира..."
 arcane_magic_lifestyle_events.1041.opt.a: "Его сила будет МОЕЙ!"
 arcane_magic_lifestyle_events.1041.opt.b: "Эти энергии не предназначены для этого мира."
 arcane_magic_lifestyle_events.1041.opt.c: "Это повод для осторожных исследований."
 arcane_magic_lifestyle_events.1041.opt.d: "А впрочем, пусть приходят!"

 ##################################################################
 # arcane_magic_lifestyle_events.7001
 # юный пироман
 ##################################################################

 arcane_magic_lifestyle_events.7001.title: "Юный пироман"
 arcane_magic_lifestyle_events.7001.desc: "Сообщения о местном ребёнке, которого связывали со многими необъяснимыми пожарами в округе, привели меня в сельскую местность у [location.GetName]. Под предлогом суда я велел привести ко мне юного [pyromaniac.GetFirstName], чтобы оценить [pyromaniac.GetHerHis] способности. Как только [pyromaniac.GetSheHe] предстал передо мной, я почувствовал исходящую от [pyromaniac.GetHerHim] ауру... Этот ребёнок, несомненно, вундеркинд!\n\nС одной стороны, этот юнец мог бы стать могущественным союзником. Я даже мог бы чему-то научиться благодаря [pyromaniac.GetHerHis] интуитивному владению стихиями!\nС другой стороны, существо с таким уровнем силы может доставить проблемы нам всем. Держать [pyromaniac.GetHerHim] в темнице под крепкой стражей — значит не дать раскрыться [pyromaniac.GetHerHis] полному потенциалу."
 arcane_magic_lifestyle_events.7001.opt.a: "Будем ликовать в пламени!"
 arcane_magic_lifestyle_events.7001.opt.b: "Ребёнок понесёт наказание."
 arcane_magic_lifestyle_events.7001.opt.c: "Этот ребёнок должен ответить за [pyromaniac.GetHerHis] преступления."

 ##################################################################
 # arcane_magic_lifestyle_events.7002
 # взрослый пироман
 ##################################################################

 arcane_magic_lifestyle_events.7002.title: "Взрослый пироман"
 arcane_magic_lifestyle_events.7002.desc.intro: "[pyromaniac.GetName], тронутый огнём ребёнок, которого я взял под опеку годы назад, повзрослел в прекрасного юного [pyromaniac.GetWomanMan]. Как я и подозревал, магические способности [pyromaniac.GetHerHis] и впрямь были незаурядными: [pyromaniac.GetSheHe] интуитивно овладел умениями, для освоения которых взрослому обычно требуются напряжённые занятия и тренировки.\n\n"
 arcane_magic_lifestyle_events.7002.desc.ele: "По правде говоря, таланты юного [pyromaniac.GetFirstNameNoTooltip] приняли... совсем не тот характер, на который я надеялся. Поначалу [pyromaniac.GetSheHe] без умолку говорил о голосах «духов внутри пламени». Когда [pyromaniac.GetFirstNameNoTooltip] подрос, мы постоянно оказывались в разладе: [pyromaniac.GetSheHe] называл мои заклинания «бездушными и неестественными» и убегал «советоваться с духами». Спустя какое-то время я решил отказаться от наставлений и оставить [pyromaniac.GetHerHim] на произвол [pyromaniac.GetHerHis] судьбы. Теперь, на пороге взрослой жизни, приходится признать: хотя мне совершенно нечему учиться у [pyromaniac.GetFirstNameNoTooltip], [pyromaniac.GetSheHe] всё же может оказаться полезным."
 arcane_magic_lifestyle_events.7002.desc.pyro: "Хотя потребовалось немного поощрения, чтобы посвятить юного [pyromaniac.GetFirstNameNoTooltip] в антиподную школу тайной магии, затем [pyromaniac.GetSheHe] без труда постиг науки и приёмы Тайного Огня. [pyromaniac.GetHerHis] интуитивное владение стихиями мало помогло моим собственным изысканиям, но я видел, как юный [pyromaniac.GetFirstNameNoTooltip] превращается в ценное дополнение к моему двору. С другой стороны, я мог бы просто отпустить [pyromaniac.GetHerHim], если в моей свите для него не найдётся места!"
 arcane_magic_lifestyle_events.7002.opt.a.ele: "[pyromaniac.GetSheHe] ещё может пригодиться..."
 arcane_magic_lifestyle_events.7002.opt.a.pyro: "Я могу помочь [pyromaniac.GetHerHim] раскрыть потенциал [pyromaniac.GetHerHis]..."
 arcane_magic_lifestyle_events.7002.opt.b: "[location.GetName] будет мне должен!"
 arcane_magic_lifestyle_events.7002.opt.c: "Мне нет дела до [pyromaniac.GetFirstNameNoTooltip]."

 ##################################################################
 # arcane_magic_lifestyle_events.7004
 # выгоревший талант / истинный пиромант
 ##################################################################

 arcane_magic_lifestyle_events.7004.title.dull: "Выгоревший талант"
 arcane_magic_lifestyle_events.7004.title.skilled: "Истинный пиромант"
 arcane_magic_lifestyle_events.7004.desc.dull: "Как это часто бывает с одарёнными юнцами, [pyromaniac.GetName] со временем заскучал и занервничал, пока [pyromaniac.GetSheHe] вёл [pyromaniac.GetHerHis] занятия. В конце концов я едва мог заставить [pyromaniac.GetHerHim] открыть книгу, сколько бы я ни уговаривал и ни допекал [pyromaniac.GetHerHim]. Была ли в этом моя вина или это недостаток вызова погасил искру зарождающегося гения?\n\nХуже того, годы покровительства оставили [pyromaniac.GetFirstNameNoTooltip] на редкость неамбициозным юным [pyromaniac.GetWomanMan]. Моим слугам, похоже, трудно вытащить [pyromaniac.GetHerHim] из постели, не говоря уже о том, чтобы затащить в круг заклинаний.\n\nЯ невольно вздыхаю, задумавшись... #italic Что не так с нынешней молодёжью?#!"
 arcane_magic_lifestyle_events.7004.desc.skilled: "Наблюдать за взрослением [pyromaniac.GetName] было одной из величайших радостей моей профессиональной и личной жизни, и поистине прекрасно, что я могу использовать ресурсы своего положения на благо столь талантливого юного [pyromaniac.GetWomanMan].\n\n[pyromaniac.GetName] оправдал все надежды [pyromaniac.GetHerHis] и превзошёл их. Власть [pyromaniac.GetHerHis] над стихией огня не похожа ни на что, виденное мной прежде. Напрашивается вопрос: может ли изучение Тайного Огня быть искусством в той же мере, что и наукой? Зовёт ли искра, горящая в нас обоих, к интуиции и творчеству столь же сильно или сильнее, чем к эрудиции и эмпирическим наблюдениям?\n\nОтложив на время философские размышления о гениальности, скажу: [pyromaniac.GetFirstNameNoTooltip] больше не может оставаться простым протеже. Пора [pyromaniac.GetHerHim] нести [pyromaniac.GetHerHis] собственный груз и достичь [pyromaniac.GetHerHis] предназначения."
 arcane_magic_lifestyle_events.7004.opt.a.dull: "Я не могу просто бросить [pyromaniac.GetHerHim]..."
 arcane_magic_lifestyle_events.7004.opt.a.skilled: "[pyromaniac.GetFirstNameNoTooltip] и [pyromaniac.GetHerHis] таланты на вес золота!"
 arcane_magic_lifestyle_events.7004.opt.b: "Пора устроить почётное назначение."
 arcane_magic_lifestyle_events.7004.opt.c: "Я могу найти более достойного наставника!"
 arcane_magic_lifestyle_events.7004.opt.d: "Пора прощаться, [pyromaniac.GetFirstNameNoTooltip]."

 ##################################################################
 # элементальный огонь: события образа жизни
 ##################################################################

 elemental_fire_slave_army: "Порабощённые огненные элементали"

 elemental_magic_lifestyle.2011.t: "Игра с огнём"
 elemental_magic_lifestyle.2011.desc: "Заметив пожары, бушующие на полях в отдалённой части моих владений, я отправился туда верхом в сопровождении нескольких приближённых. Когда мы приблизились к горящим полям, стало видно, что пламя пылает неестественно ярко и яростно. Я чувствую шёпот стихий на ветру; голод огня, никогда не насыщающийся, вольно пирует в этих землях. Крестьянин-арендатор приближается к нашей свите, прерывая моё общение с духами.\n\n«Мой [ROOT.Char.GetTitleAsNameNoTooltip], — обращается ко мне [pleading_peasant.GetSheHe], — слава [pleading_peasant.GetFaith.CreatorName], что вы прибыли! Ваши элементальные слуги получили полную свободу по всей округе и поджигают наши поля и конюшни. Если вы можете хоть чем-то облегчить наши страдания, прошу... Мы в вашей власти!»"
 elemental_magic_lifestyle.2011.opt.a: "Я обуздаю своих элементальных слуг."
 elemental_magic_lifestyle.2011.opt.b: "Мои элементали пойдут, куда пожелают!"
 elemental_magic_lifestyle.2011.opt.c: "Ты смеешь оспаривать волю духов? Ты будешь сожжён заживо!"
 elemental_magic_lifestyle.2011.opt.d: "Я должен исправить этот стихийный дисбаланс."

 elemental_magic_lifestyle.2021.t: "Вдохновлённые"
 elemental_magic_lifestyle.2021.desc.adventurer: "Сегодня в наш лагерь прибыл любопытный гость — кузнец, который, по его словам, слышал о моей власти над огненными стихиями.\n\n«Говорят, металл, выкованный с помощью огненной стихии, обладает особым характером и свойствами, — говорит [blacksmith.GetSheHe]. — Недавно получив звание мастера-кузнеца, я давно мечтал поработать с таким металлом, чтобы расширить свои познания. Я хотел бы временно предложить свои услуги в обмен на эти знания».\n\nНаши собственные лагерные кузнецы не отказались бы от помощи, да и наше оружие, конечно, выиграло бы от новых приёмов."
 elemental_magic_lifestyle.2021.desc.landholder: "В жарких, прокопчённых мастерских наших кузнецов мерцают угли под звон молотов о сталь. Главный кузнец подходит, низко кланяясь в знак уважения. «Мой [ROOT.Char.GetTitledFirstName], — говорит кузнец, — как видите, наши кузнецы — лучшие во всём [ROOT.Char.GetPrimaryTitle.GetNameNoTier], и они трудятся круглые сутки, чтобы вооружить ваших людей». Меня проводят по кузням, показывают методы работы кузнецов и вкратце знакомят с численностью и производительностью.\n\n«Как видите, мой [ROOT.Char.GetTitleAsNameNoTooltip], — продолжает [blacksmith.GetSheHe], — наша работа превосходна... но она могла бы стать ещё лучше с помощью вашей милости, владычествующей над стихиями огня. Особый магический характер их пламени мог бы наделить наши изделия особыми свойствами и продлить запасы топлива ради экономии средств. Не найдётся ли способ употребить ваше общение с духами на пользу кузням?»"
 elemental_magic_lifestyle.2021.opt.a: "Прекрасная мысль! Возьми моего слугу, Кальцифера."
 elemental_magic_lifestyle.2021.opt.a_tt: "Вы не знаете заклинания #V Призыв огненного элементаля#! [wc_spell|E]."
 elemental_magic_lifestyle.2021.opt.b: "Я помогу лично — быть может, я чему-нибудь научусь."
 elemental_magic_lifestyle.2021.opt.b.learn_alot: "Вы узнаете много нового"
 elemental_magic_lifestyle.2021.opt.b.learn_nothing: "Вы не узнаете ничего нового"
 elemental_magic_lifestyle.2021.opt.b.learn_something: "Вы узнаете кое-что новое"
 elemental_magic_lifestyle.2021.opt.c: "Я не стану унижать стихии этой чёрной работой."

 elemental_magic_lifestyle.2031.t: "Тушить огонь огнём"
 elemental_magic_lifestyle.2031.desc.adventurer: "Даже из нашего лагеря видно зарево дальних пожаров, а воздух полон запахом пепла. По всей округе бушуют сильные пожары; сейчас мы в безопасности, но надолго ли?\n\nКо мне подходит [steward_character.GetName]. «[ROOT.Char.GetName], — говорит [steward_character.GetSheHe], — мы должны что-то сделать, прежде чем огонь доберётся до лагеря. К тому же, как мы можем оставаться гостями в этих землях и позволить людям страдать от стихий, когда способны помочь?»\n\nРазумеется, безопасность наших людей превыше всего, но усмирение огня магическими средствами может нарушить равновесие стихий. Что мне делать?"
 elemental_magic_lifestyle.2031.desc.landholder: "Зарево пожаров видно со стен нашего замка, по ночам оно озаряет горизонт. Я наблюдаю за огнём издалека вместе с [steward_character.GetName], который пересказывает донесения об ущербе со всей округи.\n\n«Мой [ROOT.Char.GetTitleAsNameNoTooltip], — говорит мне [steward_character.GetSheHe], — правда ли, что вы общаетесь с элементальными силами огня? Быть может, ваши способности помогут уберечь наш народ».\n\nРазумеется, безопасность нашего народа превыше всего, но усмирение огня магическими средствами может нарушить равновесие стихий. Что мне делать?"
 elemental_magic_lifestyle.2031.opt.a: "Я воззову к духам."
 elemental_magic_lifestyle.2031.opt.b: "Поборемся с огнём обычными средствами."
 elemental_magic_lifestyle.2031.opt.c: "Лучше не вмешиваться."
 elemental_magic_lifestyle.2031.toast.fires_worsen: "Лесные пожары разгораются сильнее!"

 elemental_magic_lifestyle.2032.t: "Тушить огонь огнём"
 elemental_magic_lifestyle.2032.desc: "Жара и дым невыносимы, когда я приближаюсь к самой гуще пожаров. Я позволяю жару и треску пламени успокоить меня, очищаю мысли и начинаю общаться со стихиями, превращая это место бедствия в священное пространство.\n\nВидение, дарованное мне духами, позволяет заглянуть сквозь пламя в иной план бытия. Там огненные элементали пляшут, ликуют и пируют без удержу, кружась, словно пьяные, и разгуливая столь же разнузданно, как люди на пиру или свадьбе. Я знаю, что договориться с огненными элементалями будет непросто.\n\nОднако я могу выбрать и другие пути..."
 elemental_magic_lifestyle.2032.opt.a: "Тем не менее дипломатия — верный подход."
 elemental_magic_lifestyle.2032.opt.b: "Направить мою силу, чтобы принудить их к покорности!"
 elemental_magic_lifestyle.2032.opt.c: "Изгнать элементалей, разорвав их связь с этим миром."
 elemental_magic_lifestyle.2032.opt.d: "Использовать другие мои связи, чтобы уравновесить стихии."
 elemental_magic_lifestyle.2032.toast.commune_failure: "Огненные стихии игнорируют вас и продолжают бушевать."
 elemental_magic_lifestyle.2032.toast.commune_success: "Огненные стихии умиротворены вашими словами."

