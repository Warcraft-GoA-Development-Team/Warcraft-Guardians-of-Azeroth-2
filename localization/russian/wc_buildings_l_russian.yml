 building_thunderbrew_distillery_02: "Погреб Громоваров"
 building_thunderbrew_distillery_02_desc: "Прохладное тёмное место, где сваренное пиво хранится для выдержки, обретая желаемые вкус и качество."
 building_thunderbrew_distillery_03: "Варочные чаны Громоваров"
 building_thunderbrew_distillery_03_desc: "Большие ёмкости, где кипятится сусло и добавляются травы или хмель, — важнейший этап варки, придающий горечь и аромат."
 building_thunderbrew_distillery_04: "Зерновой амбар Громоваров"
 building_thunderbrew_distillery_04_desc: "Амбар для хранения больших запасов зерна в сухости и в безопасности от вредителей, обеспечивающий постоянный приток ингредиентов для варки."
 building_thunderbrew_distillery_05: "Колодезный дом Громоваров"
 building_thunderbrew_distillery_05_desc: "Колодец, созданный для надёжного источника чистой воды, необходимой для пива высшего качества."
 building_thunderbrew_distillery_06: "Бочарная Громоваров"
 building_thunderbrew_distillery_06_desc: "Место, где выбродившее пиво бережно хранится в бочках, герметично закупоренных и готовых к разливу."
 building_thunderbrew_distillery_07: "Комната розлива Громоваров"
 building_thunderbrew_distillery_07_desc: "Отдельное помещение для наполнения кегов. Их часто используют для больших объёмов, и они пользуются спросом у трактиров и таверн."
 building_thunderbrew_distillery_08: "Дегустационный зал Громоваров"
