 building_type_scholomance_desc: "$building_type_generic_university_desc$\n\nТакже известная как Школа некромантии, это коварная академия для будущих некромантов Плети, расположенная в руинах поместья дом Баров, на возвышенности с видом на заброшенный город Каэр Дарроу."
