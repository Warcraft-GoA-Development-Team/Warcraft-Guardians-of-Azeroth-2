 demon_hunter_0008_desc:0 "WIP"
 demon_hunter_0008_A:0 "This has gone on for too long"
 demon_hunter_0008_B:0 "... I can last more"

 demon_hunter_0009_title:1 "A Destiny of Sorrow"
 demon_hunter_0009_desc:0 "WIP"
 demon_hunter_0009_A:0 "Time to abandon this insanity!"
 demon_hunter_0009_B:0 "... Just... one last time..."

 demon_takes_over_demon_hunter_tt:0 "#XB [first_demon_prey.GetName] takes over your soul and being#!"

