l_english:
 wc_thalassian_flavor_events.0010.t:0 "A House in Decline"
 wc_thalassian_flavor_events.0010.d:0 "Debt has finally caught up with one of the older Thalassian houses. With little left to sell, its members have begun parting with their ancestral library.\n\nMost of the volumes are histories and genealogies, but several arcane treatises catch my eye — old works filled with corrections, observations, diagrams, and notes accumulated over generations.\n\nKnowledge such as this rarely reaches the open market."
 wc_thalassian_flavor_events.0010.a:0 "One volume should be enough."
 wc_thalassian_flavor_events.0010.b:0 "I will take the entire collection."
 wc_thalassian_flavor_events.0010.c:0 "I know collectors who will pay handsomely."

 wc_thalassian_flavor_events.0020.t:0 "The Ancient Magister"
 wc_thalassian_flavor_events.0020.d:0 "An aged magister has asked for an audience. His hands tremble around the head of his staff, but there is nothing frail in his voice.\n\nHe has spent centuries moving between schools of magic, teaching where he was welcomed and studying where he was not. A few questions are enough to dispel any doubt: the old elf knows more than most magisters learn in a lifetime.\n\nHe asks for no estate and little comfort. What he seeks is a final appointment — a place as Court Mage, where his knowledge might still be of use.\n\nMy liege would undoubtedly value a magister of such experience as well."
 wc_thalassian_flavor_events.0020.a:0 "Then spend your final years here."
 wc_thalassian_flavor_events.0020.a_tt_no_court_mage:0 "You do not currently employ a Court Mage."
 wc_thalassian_flavor_events.0020.a_tt_can_employ:0 "Your court can employ a Court Mage."
 wc_thalassian_flavor_events.0020.b:0 "My liege has greater need of your talents."
 wc_thalassian_flavor_events.0020.c:0 "You have served long enough. Choose your own road."
 wc_thalassian_ancient_magister_lifespan:0 "Weight of Centuries"
 wc_thalassian_ancient_magister_lifespan_desc:0 "This ancient magister's long life is finally drawing toward its natural end."

 wc_thalassian_flavor_events.0030.t:0 "The Old Border"
 wc_thalassian_flavor_events.0030.d:0 "Farstrider patrols along the marches have returned with troubling reports. Warbands under [amani_ruler.GetName] that usually raid and vanish on their own are moving with unusual discipline. Trails converge where they should not, camps are being supplied in concert, and signals pass between bands that seldom cooperate.\n\nNo army has crossed the border, and skirmishes here are hardly new. Yet the pattern is difficult to dismiss: the old enemy is coordinating."
 wc_thalassian_flavor_events.0030.a:0 "The Farstriders will remind them where the border lies."
 wc_thalassian_flavor_events.0030.a_cultural_acceptance:0 "Renewed hostilities along the old [ROOT.Char.GetCulture.GetName]-[amani_ruler.GetCulture.GetName] border"
 wc_thalassian_flavor_events.0030.b:0 "Strengthen the passes. Let them come."
 wc_thalassian_flavor_events.0030.b_tt:0 "Some counties will gain [GetModifier('wc_thalassian_old_border_fortifications_modifier').GetNameWithTooltip] for #V 5 years#!"
 wc_thalassian_flavor_events.0030.c:0 "Do not provoke them. I want to know who is organizing these raids."
 wc_thalassian_old_border_counter_tactics_modifier:0 "Amani Counter-Tactics"
 wc_thalassian_old_border_counter_tactics_modifier_desc:0 "Farstrider patrols have adapted their tactics to deny the Amani the advantages of familiar ground."
 wc_thalassian_old_border_fortifications_modifier:0 "Reinforced Border"
 wc_thalassian_old_border_fortifications_modifier_desc:0 "Garrisons have been reinforced, local levies drilled, and watch posts established throughout the southern marches."
 wc_thalassian_old_border_intelligence_modifier:0 "Eyes on Zul'Aman"
 wc_thalassian_old_border_intelligence_modifier_desc:0 "Farstrider scouts have been ordered to watch Amani movements closely and report any sign of coordination."

 wc_thalassian_flavor_events.0040.t:0 "The Faltering Ward"
 wc_thalassian_flavor_events.0040.d:0 "Local magisters responsible for a lesser protective ward have sent an urgent report. The warding enchantment has begun to flicker at irregular intervals, leaving a small stretch of the surrounding district less secure than intended.\n\nThe fault is limited to this single ward, and its tenders believe it can be repaired without difficulty. Yet the pattern of instability is unusual enough that careful study might reveal something about the old enchantment — if it does not worsen first."
 wc_thalassian_flavor_events.0040.a:0 "Repair it at once. There is no time for experiments."
 wc_thalassian_flavor_events.0040.b:0 "Study the flaw before completing the repairs."
 wc_thalassian_flavor_events.0040.c:0 "Leave the old enchantment undisturbed."
 wc_thalassian_faltering_ward_stabilized_modifier:0 "Stabilized Local Ward"
 wc_thalassian_faltering_ward_stabilized_modifier_desc:0 "A lesser protective ward in this county has been repaired and reinforced, modestly strengthening local defenses."
 wc_thalassian_faltering_ward_instability_modifier:0 "Lingering Ward Instability"
 wc_thalassian_faltering_ward_instability_modifier_desc:0 "A lesser protective ward in this county remains unstable, leaving a small weakness in local defenses."

 wc_thalassian_flavor_events.0050.t:0 "Without the Sun"
 wc_thalassian_flavor_events.0050.d:0 "Reports from scattered households speak of the same affliction. Elves with no great gift for spellcraft have grown weak and listless, unable to keep pace with their accustomed duties. The old, the very young, and those already ill are failing fastest.\n\nAt first, the healers feared some lingering malady of the Scourge. Yet neither they nor the magisters can find any taint or contagion. The sufferers share no wound, district, or calling — only the same emptiness.\n\nIt is not something the Scourge left behind. With the Sunwell gone, its absence is reaching into the lives of our people. Stores and skilled hands are scarce. I must decide who receives them."
 wc_thalassian_flavor_events.0050.a:0 "See that the most vulnerable are cared for."
 wc_thalassian_flavor_events.0050.b:0 "Have the healers and magisters ease their suffering."
 wc_thalassian_flavor_events.0050.c:0 "Those who can still stand must come first."
 wc_thalassian_without_sun_relief_modifier:0 "Relief for the Vulnerable"
 wc_thalassian_without_sun_relief_modifier_desc:0 "Limited supplies and skilled care have been directed to the households suffering most, easing fear and preserving local stability."
 wc_thalassian_without_sun_triage_modifier:0 "Emergency Triage"
 wc_thalassian_without_sun_triage_modifier_desc:0 "Scarce supplies have been reserved first for those able to defend and rebuild the realm, sustaining local readiness at a painful social cost."

 wc_thalassian_flavor_events.0060.t:0 "The Last of Their Name"
 wc_thalassian_flavor_events.0060.d:0 "The grim work of matching casualty rolls to abandoned properties has revealed the near-end of an old Thalassian house. One heir still lives, but almost no family remains to fill the estate's empty rooms.\n\nThe Scourge left parts of the property standing. Several buildings can still be used, stores remain sealed below, and a handful of retainers have kept what order they can. They now await my direction.\n\nElsewhere, survivors driven from ruined homes plead for shelter and supplies. I must decide whether this remnant will preserve a family, serve the realm for a time, or answer the immediate needs of the living."
 wc_thalassian_flavor_events.0060.a:0 "The House Will Endure."
 wc_thalassian_flavor_events.0060.b:0 "The Crown Will Hold It."
 wc_thalassian_flavor_events.0060.c:0 "The Living Need It More."
 wc_thalassian_last_name_preserved_modifier:0 "Continuity Preserved"
 wc_thalassian_last_name_preserved_modifier_desc:0 "Recognizing the final heir and preserving the remaining estate has earned approval among the surviving traditional elite."
 wc_thalassian_last_name_stewardship_modifier:0 "Estate Under Crown Stewardship"
 wc_thalassian_last_name_stewardship_modifier_desc:0 "The crown is temporarily administering a surviving noble estate and putting its buildings, stores, and retainers to use during reconstruction."
 wc_thalassian_last_name_refugees_modifier:0 "Refuge at the Old Estate"
 wc_thalassian_last_name_refugees_modifier_desc:0 "A surviving estate has been opened to displaced people, winning local gratitude while their settlement creates a temporary administrative burden."

 wc_thalassian_flavor_events.0070.t:0 "The Crystal Hoarder"
 wc_thalassian_flavor_events.0070.d:0 "An inventory of household stores has uncovered a locked chamber holding an unexpectedly large cache of crystals charged with arcane energy. The cache belongs to a minor member of my court, who quietly accumulated it while such stores became ever harder to find.\n\nFear, foresight, selfishness, or merely the desire to survive may have guided them; nothing proves malice. Yet other Thalassians still suffer the gnawing pain of magical withdrawal while power enough to ease it sits behind one person's lock.\n\nThe crystals are theirs — or were. I can leave the cache untouched, seize and distribute it among those suffering most, or purchase it for relief."
 wc_thalassian_flavor_events.0070.a:0 "Seize the cache and distribute it to those in need."
 wc_thalassian_flavor_events.0070.b:0 "The crystals are theirs to keep."
 wc_thalassian_flavor_events.0070.c:0 "Name your price. The cache will go to those in need."
 wc_thalassian_crystal_redistribution_modifier:0 "Arcane Crystal Relief"
 wc_thalassian_crystal_redistribution_modifier_desc:0 "Crystals charged with arcane energy have been distributed to those suffering most from magical withdrawal, earning local approval."
 wc_thalassian_crystal_elite_disapproval_modifier:0 "Private Stores Seized"
 wc_thalassian_crystal_elite_disapproval_modifier_desc:0 "The seizure of a private crystal cache has made surviving elites wary of arbitrary interference with their own property."
 wc_thalassian_crystal_property_respected_modifier:0 "Private Stores Respected"
 wc_thalassian_crystal_property_respected_modifier_desc:0 "Upholding ownership of a private crystal cache during the crisis has reassured surviving property-holders."
 wc_thalassian_crystal_popular_resentment_modifier:0 "Resentment over Crystal Scarcity"
 wc_thalassian_crystal_popular_resentment_modifier_desc:0 "Protecting a private cache while others suffer magical withdrawal has provoked resentment among the wider population."

 wc_thalassian_flavor_events.0080.t:0 "Withdrawal at Court"
 wc_thalassian_flavor_events.0080.d:0 "Unanswered correspondence crowds the desks while ledgers remain half-finished. Normally reliable scribes can no longer remain at their work for long; attendants cover multiple duties, and routine reports arrive late as minor officials pause to regain their strength.\n\nThere is no mystery in it. Without the Sunwell, withdrawal has reached the clerks and arcane functionaries who keep my household working. The realm's needs have not diminished with their strength. I must decide how this court will carry on."
 wc_thalassian_flavor_events.0080.a:0 "Give Them Time"
 wc_thalassian_flavor_events.0080.b:0 "Find Replacements"
 wc_thalassian_flavor_events.0080.c:0 "The Realm Cannot Wait"
 wc_thalassian_withdrawal_court_rest_modifier:0 "Reduced Court Workloads"
 wc_thalassian_withdrawal_court_rest_modifier_desc:0 "Afflicted members of the household have been given time to rest, slowing administration but earning appreciation for their humane treatment."
 wc_thalassian_withdrawal_court_replacements_modifier:0 "Additional Court Staff"
 wc_thalassian_withdrawal_court_replacements_modifier_desc:0 "Additional hands and reassigned personnel are keeping essential administrative work on schedule."
 wc_thalassian_withdrawal_court_discipline_modifier:0 "Unyielding Court Discipline"
 wc_thalassian_withdrawal_court_discipline_modifier_desc:0 "Essential work continues under strict discipline, improving immediate revenue at the cost of household morale."

 wc_thalassian_flavor_events.0090.t:0 "An Unlikely Friend"
 wc_thalassian_flavor_events.0090.d:0 ""[ROOT.Char.GetMotherFather|U]! You'll never guess who I was playing with." [thalassian_child.GetFirstNameNoTooltip] bounds into the room, cheeks flushed with excitement. "I met [amani_child.GetName], from the [amani_ruler.GetCulture.GetName] lands! We played together and shared stories about our families. I think we could be friends!"\n\nWhile we are not so fond of the [amani_ruler.GetCulture.GetNameNoTooltip] people, this friendship could be a valuable opportunity, or just what they need to infiltrate us."
 wc_thalassian_flavor_events.0090.a:0 "Stay away from [amani_child.GetHerHim]!"
 wc_thalassian_flavor_events.0090.a_tt: "You forbid the friendship between [thalassian_child.GetFirstNameNoTooltip] and [amani_child.GetFirstNameNoTooltip]."
 wc_thalassian_flavor_events.0090.a_cultural_acceptance:0 "A [ROOT.Char.GetCulture.GetName] ruler is forbidding friendships with an [amani_ruler.GetCulture.GetName] ruler"
 wc_thalassian_flavor_events.0090.b:0 "That is wonderful, [thalassian_child.GetFirstNameNoTooltip]!"
 wc_thalassian_flavor_events.0090.b_tt: "You encourage the friendship between [thalassian_child.GetFirstNameNoTooltip] and [amani_child.GetFirstNameNoTooltip]."
 wc_thalassian_flavor_events.0090.b_cultural_acceptance:0 "A [ROOT.Char.GetCulture.GetName] ruler is fostering friendships with an [amani_ruler.GetCulture.GetName] ruler"
 wc_thalassian_flavor_events.0090.c:0 "Bring me information about [amani_ruler.GetFirstNameNoTooltip]."
 wc_thalassian_flavor_events.0090.c_tt:0 "You have your child spy on the [amani_ruler.GetCulture.GetName] ruler."
 wc_thalassian_amani_child_spy_modifier:0 "Child Spy"
 wc_thalassian_amani_child_spy_modifier_desc:0 "This character's child has been tasked with spying on a neighboring ruler, gathering information about their court and activities."

 wc_thalassian_flavor_events.0100.t:0 "The Wretched of [root_county.GetNameNoTierNoTooltip]"
 wc_thalassian_flavor_events.0100.d:0 "As I traverse through [root_county.GetNameNoTierNoTooltip], I am struck by the smell of decay. With our Sunwell standing without power, we have all suffered without the potent source of magic.\n\n"[ROOT.Char.GetShortUINameNotMeNoTooltipNoFormat]," a sickly, skinny-looking elf calls out to me. "M-mana... please, I need mana.""
 wc_thalassian_flavor_events.0100.a:0 "Take my mana, I can spare it."
 wc_thalassian_flavor_events.0100.b:0 "Here, buy yourself a potion if you can."
 wc_thalassian_flavor_events.0100.c:0 "You are not the only one suffering."
 
 wc_thalassian_flavor_events.0150.t:0 "The Price of Ancestry"
 wc_thalassian_flavor_events.0150.desc:0 "The petition comes from one of the oldest noble houses in the realm. Their ancestral estate has stood for generations, its halls adorned with enchanted tapestries, silvered fountains, arcane lamps, and countless other embellishments intended to display the family's ancient prestige.\n\nBut grandeur has its price. The family's coffers are nearly empty, and maintaining an estate built for an age of greater prosperity has become an increasingly impossible burden.\n\nThe head of the house has come before the crown with a difficult request. They cannot afford to preserve everything their ancestors left behind, yet surrendering the estate's splendor would mean admitting that their family can no longer live as it once did.\n\nThere are several ways to resolve the matter. None will leave the old house entirely unchanged."
 wc_thalassian_flavor_events.0150.a:0 "The crown will subsidize the family."
 wc_thalassian_flavor_events.0150.b:0 "Sell what you cannot afford to maintain."
 wc_thalassian_flavor_events.0150.c:0 "The estate would serve the realm better in crown hands."
 wc_thalassian_flavor_events.0150.d:0 "Remove the unnecessary magical embellishments."
 wc_thalassian_flavor_events.0150.e:0 "I will purchase the estate myself."
 
 wc_thalassian_flavor_events.0160.t:0 "A Child's Calling"
 wc_thalassian_flavor_events.0160.desc:0 "The head of a noble house has come before the throne with an unusual complaint. Their child, old enough to begin choosing a path in life, has refused the future their family had carefully prepared for them.\n\nThe old traditions of Quel'Thalas leave little room for such defiance. Noble children are expected to uphold the customs of their house, whether that means joining the ranks of the Magisters, taking up the bow in the service of the rangers, or following another calling befitting their station.\n\nYet the child does not appear frightened. They stand beside their family with surprising resolve, clearly unwilling to surrender their own ambitions merely to satisfy an expectation inherited from their ancestors.\n\nThe family now asks the crown to settle the matter."
 wc_thalassian_flavor_events.0160.a:0 "Let them choose their own path."
 wc_thalassian_flavor_events.0160.b:0 "Remind them of their family's obligations."
 wc_thalassian_flavor_events.0160.c:0 "Offer them a place in the royal court."
 wc_thalassian_flavor_events.0160.d:0 "Encourage them to pursue an entirely new profession."
 wc_thalassian_allowed_to_choose:0 "Allowed to Choose Their Own Path" 
 wc_thalassian_allowed_to_choose_desc:0 "This character was permitted to reject the expectations of their family and pursue their own calling." 
 wc_thalassian_family_obligation:0 "Bound by Family Obligation" 
 wc_thalassian_family_obligation_desc:0 "This character has been reminded that their family's traditions and obligations come before their personal ambitions." 
 wc_thalassian_court_protégé:0 "Royal Court Protégé"
 wc_thalassian_court_protégé_desc:0 "This young Thalassian has been taken under the protection of the royal court, giving them an opportunity to forge a path beyond their family's expectations." 
 wc_thalassian_encouraged_new_path:0 "A New Calling" 
 wc_thalassian_encouraged_new_path_desc:0 "This character has been encouraged to pursue a profession outside the traditions of their family."
 
 wc_thalassian_flavor_events.0170.t:0 "A Garden of Arcane Wonders"
 wc_thalassian_flavor_events.0170.desc:0 "The gardens surrounding the estate are unlike anything you have seen before.\n\nCrystal-clear fountains rise without pumps or servants, their waters flowing upward in glittering arcs before cascading into enchanted pools. Flowers of impossible colors bloom beneath the shade of silver-leafed trees, their petals glowing softly with captured arcane light. Vines curl lazily around marble pillars, shifting their colors as you pass. Even the air seems touched by magic, carrying the faint scent of spring despite the season.\n\nThe noble responsible for this extravagance watches with barely concealed pride. A considerable fortune has clearly been spent bringing this vision to life.\n\nIt is beautiful. It is absurd. And every drop of magic sustaining it has been deliberately put here for no greater purpose than to delight the eye."
 wc_thalassian_flavor_events.0170.a:0 "Magnificent. Keep it as it is."
 wc_thalassian_flavor_events.0170.b:0 "This is an obscene waste of magic."
 wc_thalassian_flavor_events.0170.c:0 "Can the magic be made useful?"
 wc_thalassian_flavor_events.0170.d:0 "I know someone who would pay handsomely for these plants."
 
 wc_thalassian_flavor_events.0180.t:0 "An Heirloom of Another Age"
 wc_thalassian_flavor_events.0180.desc:0 "An old family comes before you bearing something that has been kept hidden for generations.\n\nThe heirloom is difficult to place. Its craftsmanship is unmistakably Thalassian, though the style belongs to an age few living elves remember. Faint traces of enchantment still cling to it, barely perceptible beneath the layers of dust and age.\n\nIts bearer speaks of ancestors who carried it through wars, migrations, and generations of prosperity. They have finally decided that such a relic belongs in the hands of someone who can decide what should become of it.\n\nThere is still magic within it. Not much, but enough to make several possibilities tempting."
 wc_thalassian_flavor_events.0180.a:0 "Preserve it untouched."
 wc_thalassian_flavor_events.0180.b:0 "Consume its remaining magic for immediate benefit."
 wc_thalassian_flavor_events.0180.c:0 "Have a Magister attempt to recharge it."
 wc_thalassian_flavor_events.0180.d:0 "Give it to my child."
 wc_thalassian_flavor_events.0180.e:0 "Sell it to a collector."
 
 wc_thalassian_flavor_events.0190.t:0 "The Common-Born Magister"
 wc_thalassian_flavor_events.0190.desc:0 "A young spellcaster has come to the attention of the court, and their talent is difficult to ignore.\n\nThey were not born to one of the old noble houses. No ancient name stands behind them, no distinguished lineage lends weight to their claim. Yet the precision of their magic has impressed even seasoned Magisters.\n\nSome argue that ability should be enough. Others remind us that the traditions of the Magisterium were not established without reason.\n\nThe spellcaster now stands before the court, waiting to learn whether their gift will earn them a place among those who wield magic in service of the realm."
 wc_thalassian_flavor_events.0190.a:0 "Talent should matter more than ancestry."
 wc_thalassian_flavor_events.0190.b:0 "Our institutions have traditions for a reason."
 wc_thalassian_flavor_events.0190.c:0 "Let them serve the crown instead."
 wc_thalassian_flavor_events.0190.d:0 "Perhaps one of the noble houses will sponsor them."
 
 wc_thalassian_flavor_events.0200.t:0 "The Old Watchtower"
 wc_thalassian_flavor_events.0200.desc:0 "The veteran ranger before me has spent decades patrolling the borders of the realm. Now, with age beginning to weigh upon him, he has come before the crown with one final request.\n\nAn abandoned watchtower stands forgotten in the wilderness, its stonework cracked and its old beacon long cold. Once, it warned our people of raiders and monsters approaching from beyond the borders. Now only the wind passes through its empty halls.\n\nThe ranger believes it can still serve a purpose. The question is what purpose we shall give it."
 wc_thalassian_flavor_events.0200.a:0 "Restore the watchtower. Let its beacon burn again."
 wc_thalassian_flavor_events.0200.b:0 "Make it a monument to those who guarded our borders."
 wc_thalassian_flavor_events.0200.c:0 "Let the old tower return to the wilderness."
 wc_thalassian_flavor_events.0200.d:0 "Give it to the rangers. They will see to its upkeep." 
 wc_watchtower_restored:0 "Restored Watchtower" 
 wc_watchtower_restored_desc:0 "An old watchtower has been restored to service, strengthening the ruler's reputation as a guardian of the realm." 
 wc_watchtower_monument:0 "Border Monument" 
 wc_watchtower_monument_desc:0 "An abandoned watchtower has been transformed into a monument commemorating those who once guarded the realm." 
 wc_watchtower_abandoned:0 "Abandoned Watchtower" 
 wc_watchtower_abandoned_desc:0 "A neglected watchtower stands as a reminder of the realm's forgotten borders." 
 wc_watchtower_ranger_outpost:0 "Ranger Outpost" 
 wc_watchtower_ranger_outpost_desc:0 "Veteran rangers have been entrusted with maintaining an old watchtower as a frontier outpost." 
 
 wc_thalassian_flavor_events.0210.t:0 "A Fortunate Mistake"
 wc_thalassian_flavor_events.0210.desc:0 "The young mage had apparently intended to demonstrate a simple household enchantment. Instead, something went wrong.\n\nThe spell collapsed, flared brightly, and left behind something none of the assembled Magisters had expected. Whatever its intended purpose, the result is surprisingly useful. A simple problem that has vexed servants and craftsmen for years now has an elegant magical solution.\n\nThe mage is scarcely able to explain what happened. They insist they were simply following the instructions as they understood them.\n\nPerhaps it was incompetence. Perhaps it was inspiration. Either way, they have stumbled upon something worth investigating."
 wc_thalassian_flavor_events.0210.a:0 "I will sponsor their work."
 wc_thalassian_flavor_events.0210.b:0 "Have the Magisters examine their work."
 wc_thalassian_flavor_events.0210.c:0 "Give them a position at court."
 wc_thalassian_flavor_events.0210.d:0 "Let established scholars take the credit."
 
 wc_thalassian_flavor_events.0220.t:0 "A Hunger Unchecked"
 wc_thalassian_flavor_events.0220.desc:0 "PH"
 wc_thalassian_flavor_events.0220.a:0 "PH"
 wc_thalassian_flavor_events.0220.b:0 "PH"
 wc_thalassian_flavor_events.0220.c:0 "PH"
 wc_thalassian_flavor_events.0220.d:0 "PH"
 
 wc_thalassian_flavor_events.0230.t:0 "A Familiar Name"
 wc_thalassian_flavor_events.0230.desc:0 "The petition is unremarkable at first glance. A forgotten family name, an old claim, a handful of documents whose ink has faded with the years.\n\nYet the name catches in your mind.\n\nYou have heard it before.\n\nThe claimant standing before you is dressed plainly, but carries themselves with the quiet certainty of someone who believes they have finally found the door to a house that was stolen from their ancestors generations ago.\n\n\"I do not ask you to believe me,\" they say. \"Only that you look.\""
 wc_thalassian_flavor_events.0230.a:0 "Bring them before me. I would hear this myself."
 wc_thalassian_flavor_events.0230.b:0 "Let the genealogists examine the claim."
 wc_thalassian_flavor_events.0230.c:0 "A dead house has no privileges."
 wc_thalassian_flavor_events.0230.d:0 "What exactly are you asking for?"
 wc_thalassian_flavor_events.0230.e:0 "Let the court hear their story."
 
 wc_thalassian_flavor_events.0231.t:0 "The Genealogy"
 wc_thalassian_flavor_events.0231.desc:0 "The old records are brought from dusty cupboards and forgotten archives. Names are compared against names. Marriages are traced. Seals are examined beneath magnifying glass and candlelight.\n\nThe further the genealogists dig, the stranger the matter becomes.\n\nThe family certainly existed. Of that there can be little doubt.\n\nThe question is what happened to them.\n\nOne record claims that the line ended generations ago. Another simply stops mentioning them. A third suggests that members of the family were still living long after they supposedly disappeared.\n\nThe claimant waits while the scholars argue."
 wc_thalassian_flavor_events.0231.a:0 "Verify every document. I want no doubt."
 wc_thalassian_flavor_events.0231.b:0 "The evidence is sufficient."
 wc_thalassian_flavor_events.0231.c:0 "Search the old estates."
 wc_thalassian_flavor_events.0231.d:0 "Ask the claimant what their family remembers."
 wc_thalassian_flavor_events.0231.e:0 "There are too many questions. Reject the claim."
 
 wc_thalassian_flavor_events.0232.t:0 "The Contradiction"
 wc_thalassian_flavor_events.0232.desc:0 "The investigation has uncovered something that none of the genealogists expected.\n\nTwo records cannot both be correct.\n\nAn older document places the family firmly within the line of succession. A newer register removes them entirely. Both bear legitimate seals. Both appear to have been kept by trustworthy hands.\n\nThere are whispers of war, factional struggles and old grudges. There are also signs that at least one page may have been replaced.\n\nThe genealogists look to you.\n\n\"We can continue searching,\" one says, \"but at some point, Your Grace, this ceases to be genealogy and becomes judgment.\""
 wc_thalassian_flavor_events.0232.a:0 "The older document is more trustworthy."
 wc_thalassian_flavor_events.0232.b:0 "The newer record is clearer."
 wc_thalassian_flavor_events.0232.c:0 "Someone tampered with these records."
 wc_thalassian_flavor_events.0232.d:0 "Enough. Recognize the claimant."
 
 wc_thalassian_flavor_events.0233.t:0 "Blood or Paper?"
 wc_thalassian_flavor_events.0233.desc:0 "The evidence is laid before you one final time.\n\nThe family name is real. The bloodline is plausible. Whether the ancestors of the claimant were wronged, disgraced, exiled or simply forgotten is another question entirely.\n\nAround the chamber, the court waits.\n\nSome nobles see an opportunity. Others see a dangerous precedent. A few look at the claimant with something approaching sympathy.\n\nThe claimant says nothing.\n\nFor all their years of searching, the next words will determine what their ancestors left them: a name, a home, a place at court—or merely a story."
 wc_thalassian_flavor_events.0233.a:0 "Restore their name."
 wc_thalassian_flavor_events.0233.b:0 "Restore their ancestral estate."
 wc_thalassian_flavor_events.0233.c:0 "Give them a seat in court."
 wc_thalassian_flavor_events.0233.d:0 "Marry them into one of the great houses."
 wc_thalassian_flavor_events.0233.e:0 "A noble name is not a noble right."
 wc_thalassian_flavor_events.0233.f:0 "Make them prove themselves."
 
 wc_thalassian_flavor_events.0234.t:0 "The Forgotten Branch"
 wc_thalassian_flavor_events.0234.desc:0 "The matter should have ended there.\n\nThe genealogists have returned their conclusions. The court has rendered its judgment. The claimant now has a place in the world that their ancestors lost.\n\nAnd yet, while the last records are being returned to the archives, one of the older genealogists approaches you in private.\n\n\"There is something else.\"\n\nFrom beneath his robes he produces a fragment of correspondence, brittle with age.\n\nThe seal is unmistakable.\n\nIt bears the same family mark.\n\nBut the letter does not speak of the claimant's ancestors.\n\nIt speaks of another relative—one who supposedly fled Quel'Thalas before the family vanished.\n\nThe final line is only a few words long.\n\nSomeone else may have survived."
 wc_thalassian_flavor_events.0234.a:0 "Then the forgotten branch may not be the last."
 
 wc_thalassian_flavor_events.0240.t:0 "A Magister's Demonstration"
 wc_thalassian_flavor_events.0240.desc:0 "A Magister has requested an audience to demonstrate a new work of arcane craftsmanship. With a gesture, lights bloom above the chamber, crystal figures dance through the air, and a delicate illusion of the Eversong woods unfolds across the ceiling.\n\n"It is hardly necessary," mutters one of your attendants.\n\n"Necessary?" the Magister replies. "No. But there are few things in this world that are improved by being merely necessary.""
 wc_thalassian_flavor_events.0240.a:0 "A worthy display of Thalassian mastery."
 wc_thalassian_flavor_events.0240.b:0 "Make something useful with that talent."
 wc_thalassian_flavor_events.0240.c:0 "The court is not a theatre."
 
 wc_thalassian_flavor_events.0250.t:0 "The Heir's Choice"
 wc_thalassian_flavor_events.0250.d:0 "One of your children has made their wishes known, and they do not accord with the path laid before them.\n\nTheir tutors insist that they possess talent enough for the role expected of them. Their relatives remind you that your family has fulfilled that role for generations. Your child, however, seems entirely unimpressed by either argument.\n\n"I do not wish to become what everyone expects me to be," comes the quiet reply. "I wish to become something of my own.""
 wc_thalassian_flavor_events.0250.a:0 "Then find your own path."
 wc_thalassian_flavor_events.0250.b:0 "A family survives because its duties survive."
 wc_thalassian_flavor_events.0250.c:0 "Serve Quel'Thalas first. The rest will follow."
 
 wc_thalassian_flavor_events.0260.t:0 "The Old Runestone"
 wc_thalassian_flavor_events.0260.d:0 "Word has come from the countryside of an ancient runestone whose wards have begun to falter. The stone has stood for centuries, its magic woven into the defenses and enchantments that protect Quel'Thalas.\n\n"The stone can be repaired," says the attending Magister. "But it will not be cheap."\n\nAnother advisor shrugs. "It has stood for centuries. Surely it can stand a little longer.""
 wc_thalassian_flavor_events.0260.a:0 "Restore it. We will not neglect the foundations of our kingdom."
 wc_thalassian_flavor_events.0260.b:0 "Leave it be. We have more pressing concerns."
 wc_thalassian_flavor_events.0260.c:0 "Study it first. There may be more to learn."
 
 wc_thalassian_flavor_events.0270.t:0 "The Empty Place at the Table"
 wc_thalassian_flavor_events.0270.d:0 "There is an empty place at the table tonight.\n\nNo one speaks of it at first. The servants simply set one fewer plate. Yet your eyes keep returning to the vacant chair, and you find yourself remembering the people who once occupied such places without a second thought.\n\nSo much of Quel'Thalas has become an absence - names without heirs, homes without families, songs whose singers are gone."
 wc_thalassian_flavor_events.0270.a:0 "We must remember those who were lost."
 wc_thalassian_flavor_events.0270.b:0 "The living need us more than the dead do."
 wc_thalassian_flavor_events.0270.c:0 "We will remember them by building what comes next."
 
 wc_thalassian_flavor_events.0280.t:0 "The Old Ways, Reconsidered"
 wc_thalassian_flavor_events.0280.d:0 "A generation has come of age that remembers the old Quel'Thalas only through the stories of its elders.\n\nThey have begun asking uncomfortable questions.\n\nWhy must every custom be restored exactly as it was? Why must every ruined hall be rebuilt upon the same foundations? Why should a kingdom that has endured so much pretend that it is still the kingdom that fell?\n\nThe elders have their answers. The young have their own."
 wc_thalassian_flavor_events.0280.a:0 "Let the next generation build something new."
 wc_thalassian_flavor_events.0280.b:0 "Our traditions survived because we preserved them."
 wc_thalassian_flavor_events.0280.c:0 "Keep what deserves to survive. Change what does not."
 
 wc_thalassian_flavor_events.0290.t:0 "The Feral Troll"
 wc_thalassian_flavor_events.0290.d:0 "A patrol has returned with troubling reports from the frontier. Tracks have been found where none should be, hunting parties have vanished, and the rangers swear that the forest has grown unusually quiet. The Amani have not forgotten their ancient claim to these lands."
 wc_thalassian_flavor_events.0290.a:0 "Strengthen the frontier."
 wc_thalassian_flavor_events.0290.b:0 "Give the Farstriders whatever they require."
 wc_thalassian_flavor_events.0290.c:0 "The border will hold. It always has."
 
 wc_thalassian_flavor_events.0300.t:0 "The Eternal Kingdom"
 wc_thalassian_flavor_events.0300.d:0 "You walk through Silvermoon after nightfall. The towers glow softly beneath the light of the Sunwell, enchantments shimmer along ancient walls, and music drifts from distant halls. It is easy, in such a moment, to believe the kingdom will endure forever. Quel'Thalas has survived for thousands of years. Surely it will survive a thousand more."
 wc_thalassian_flavor_events.0300.a:0 "Quel'Thalas will endure."
 wc_thalassian_flavor_events.0300.b:0 "Our ancestors built this kingdom. We shall build its future."
 wc_thalassian_flavor_events.0300.c:0 "Even eternal things must change."
 
