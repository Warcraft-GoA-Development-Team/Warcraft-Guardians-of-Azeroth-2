  # Holy Light tenets 
 tenet_holy_struggle_name: "Священная борьба"
 tenet_holy_struggle_desc: "[ROOT.Faith.HighGodNameAlternate|U] требует большего, чем простые молитвы: он призывает к решительной борьбе с тьмой. Наши убеждения основаны на мужестве и решимости. Доблесть - наша главная добродетель, мы противостоим невзгодам, готовы сражаться и умереть за свою веру. В этой священной борьбе страху нет места."
  
 tenet_purge_of_heresy_name: "Очищение ереси"
 tenet_purge_of_heresy_desc: "Мы подтверждаем нашу преданность, неусыпно преследуя и очищая нечестивцев. Допрос используется для того, чтобы привести заблудших к покаянию или разоблачить врагов веры. Упорное сопротивление рассматривается как неопровержимое доказательство неисправимого нечестия."
 doctrine_parameter_scarlet_mark_active: "Духовный [heads_of_faith|E] может даровать [GetTrait('scarlet_mark').GetName( GetNullCharacter )] другим персонажам этой  [Concept('faith', 'веры')|E]"
  
 tenet_united_against_darkness_name: "Объединены против Тьмы"
 tenet_united_against_darkness_desc: "Перед лицом постоянно надвигающейся тьмы наши верующие объединяются в непоколебимый союз, чтобы дать отпор темным силам, стремящимся поглотить мир целиком. Наша борьба - это не просто вопрос веры, это абсолютная необходимость для сохранения мира. Таким образом, признавая разнообразие верований, мы твёрдо убеждены в том, что наша борьба является самой праведной, и мы готовы сделать всё возможное, чтобы одержать победу над тьмой."
 doctrine_parameter_hostility_override_tenet_united_against_darkness: "Рассматривает другие [Concept('faith', 'верования')|E] с этой доктриной как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_pluralism_dark: "Рассматривает тёмные [Concept('faith', 'верования')|E], и рассматривается тёмными $game_concept_faiths$, как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_doctrine_pluralism_fundamentalist: "Рассматривает фундаменталистсткие [Concept('faith', 'верования')|E], и рассматривается фундаменталистсткими $game_concept_faiths$, как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_special_doctrine_is_mortal_faith: "Рассматривает смертные [Concept('faith', 'верования')|E], и рассматривается смертными $game_concept_faiths$, как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
 doctrine_parameter_hostility_override_special_doctrine_is_primitive_faith: "Рассматривает примитивистские [Concept('faith', 'верования')|E], и рассматривается примитивистскими $game_concept_faiths$, как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
  
 is_mortal_faith_name: "$special_doctrine_is_mortal_faith_name$"
 special_doctrine_is_mortal_faith_name: "Наследие Творцов"
 special_doctrine_is_mortal_faith_desc: "[ROOT.Faith.GetName|U] глубоко укоренён в традициях и борьбе смертных существ, воплощая стойкость и целеустремленность тех, кто ходит по земле Азерота."
 is_primitive_faith_name: "$special_doctrine_is_primitive_faith_name$"
 special_doctrine_is_primitive_faith_name: "Древние пути"
 special_doctrine_is_primitive_faith_desc: "[ROOT.Faith.GetName|U] сохраняет первобытные верования и обычаи, которые передавались из поколения в поколение задолго до появления более молодых рас."
  
 tenet_anticlericalism_name: "Антиклерикализм"
 tenet_anticlericalism_desc: "Никто не имеет права говорить от имени божественного. Наша связь со священным является прямой и личной, без посредничества клерикальных паразитов. Отвергая навязанные догмы, наша вера основана на личном стремлении к божественности, доступном для всех, в духе свободы, братства и усердия."
 doctrine_parameter_hostility_override_doctrine_theocracy_temporal: "Рассматривает [Concept('faith', 'верования')|E] со Светским лидером как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V], вместо $hostility_hostile_tooltippable$."
 doctrine_parameter_hostility_override_doctrine_spiritual_head: "Рассматривает [Concept('faith', 'верования')|E] с Духовным лидером как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V], вместо $hostility_hostile_tooltippable$."
