 ep3_laamp_decision_event.1000.desc_outro_cultural_draenei_returned_01: "\n\nПо окрестностям неспешно идут элекки, а их всадники спокойно сидят в седле."
 ep3_laamp_decision_event.1000.desc_outro_cultural_dwarven_returned_01: "\n\nДворфийские охотники отмечают добычу вокруг нашего пути; воздух наполняют выстрелы и звуки раненых животных."
 ep3_laamp_decision_event.1000.desc_outro_cultural_gnomish_goblin_returned_02: "\n\nГномьи инженеры [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] из [ROOT.Char.Custom('SettlementCity')|l] неустанно работают над устройствами и изобретениями."
 ep3_laamp_decision_event.1000.desc_outro_cultural_gnomish_returned_01: "\n\nГруппа механодолгоногов механически гарцует вокруг, а их шестерни гремят."
 ep3_laamp_decision_event.1000.desc_outro_cultural_orcish_returned_01: "\n\nНеподалёку рабы разбегаются, пытаясь закончить свои дела, а остальные трудятся словно бездушные машины."
 ep3_laamp_decision_event.1000.desc_outro_cultural_pandaren_returned_01: "\n\nМонахи [visiting_location.GetCounty.GetCulture.GetCollectiveNounNoTooltip|U] тренируются друг с другом, и по всей долине то и дело вспыхивают спарринги."
 ep3_laamp_decision_event.1000.desc_outro_regional_ek_returned_01: "\n\nВокруг кузнецов, творящих чудеса с металлом, разлетаются искры; их методы соперничают с древними дворфийскими."
 ep3_laamp_decision_event.1000.desc_outro_regional_kalimdor_returned_01: "\n\nСтая саблезубов пробирается через лес, выслеживая следующую добычу."
 ep3_laamp_decision_event.1000.desc_outro_regional_kalimdor_returned_02: "\n\nВдалеке жрицы Элуны тихо поют молитву своей богине."
 ep3_laamp_decision_event.1000.desc_outro_regional_quelthalas_returned_01: "\n\nЯстребовые кони [ROOT.Char.Custom('SettlementCity')|l] глазеют по сторонам и суетятся, внося хаос среди других животных."
