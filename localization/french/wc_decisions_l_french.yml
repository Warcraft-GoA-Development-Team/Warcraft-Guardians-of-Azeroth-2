l_french:
 use_titan_forge_to_create_pops: "Forge des Titans : Créer des Courtisans"
 use_titan_forge_to_create_pops_desc: "Créons de nouveaux $titanforged$, nos nouveaux frères d'armes qui se joindront à nous pour servir Azeroth."
 use_titan_forge_to_create_pops_tooltip: "Créer de nouveaux [courtiers|$titanforged$]"
 use_titan_forge_to_create_pops_effect_tooltip: "Générera un nombre aléatoire de [courtiers|$titanforged$] de votre [wc_race|E], [faith|E] et [culture|E] dans votre cour. Leur nombre et la qualité de leurs traits seront basés sur le [titan_forge|E] de niveau le plus élevé."
 use_titan_forge_to_create_pops_confirm: "Utiliser la Forge des Titans"
 restore_gorian_empire_decision:0 "Restaurer l'Empire Gorien"
 restore_gorian_empire_decision_confirm:0 "Je vais restaurer l'Empire"
 restore_gorian_empire_decision_tooltip:0 "L'Empire Gorien sera restauré"
 restore_gorian_empire_decision_desc:0 "Si nous pouvons unir nos frères éparpillés et former une forte protection pour nous-mêmes, nous gagnerons la reconnaissance aux yeux d'Azeroth et de tous ceux qui ont fui Draenor comme la continuation vraie et légitime de l'État Gorien."
 restore_gorian_empire_decision_effect_tooltip:0 "L'Empire Gorien sera restauré et acquerra le [de_jure|E] de tous les Duchés actuellement détenus."
 create_gorian_empire_de_jure_changes:1 "Devenir un [kingdoms|E] [de_jure|E] du nouvel Empire Gorien"
 create_gorian_empire:1 "Vous #P restaurz#! #V L'Empire Gorien#!"
 borrow_loan_goblin_decision:0 "Demander un prêt à la Banque des Gobelins"
 borrow_loan_goblin_decision_tooltip:0 "Demander un Prêt via la succursale la plus proche de la Banque des Gobelins"
 borrow_loan_goblin_decision_desc:0 "On ne peut qu'espérer que cela ne sera pas trop compliqué, mais les Gobelins ne sont pas exactement connus pour simplifier les choses pour ceux qui veulent leur faire dépenser leur argent. Mais, les machinations qui ont été soigneusement planifiées pour l'avenir de ces terres méritent certainement un investissement externe. L'avenir... il ne peut appartenir qu'à ceux qui sont assez forts pour avancer courageusement vers lui, et si ce n'est pas une démarche audacieuse, qu'est-ce que c'est ? Les Gobelins verront probablement cela comme une nouvelle ère d'un partenariat douteux, et espèrent que lorsque viendra le temps, nous serons forcés de nous souvenir de leurs gestes de bonne volonté."
 borrow_loan_goblin_decision_confirm:0 "Ce n'est qu'un simple prêt, rien de plus"
 borrow_loan_goblin_decision_effect_tooltip:1 "Vous empruntez [gold|E][gold_i] à la Banque des Gobelins. Vous ne pouvez pas emprunter à nouveau d'argent tant que vous n'avez pas remboursé ce prêt."
 borrow_from_goblin_bankers_gold_condition:0 "La Banque des #L [GetTitleByKey('k_goblin_bankers').GetNameNoTier]#! n'a pas assez d'or"
 borrow_from_goblin_bankers_gold_condition2:0 "Les Gobelins #N ne vous font pas confiance #!"
 repay_loan_goblin_decision:0 "Rembourser une partie du prêt"
 repay_loan_goblin_decision_tooltip:0 "Avoir une dette qui me pend au-dessus de la tête est indigne d'un [ROOT.Char.GetTitleAsNameNoTooltip] – il est temps de rembourser l'argent que je dois"
 repay_loan_goblin_decision_desc:0 "Vous #V allez payer#! un #P quart#! de la dette initiale et #N 25%#! en plus\n\nIl est grand temps que ces terres soient soulagées de leurs fardeaux, et quel plus grand fardeau y a-t-il sur une terre que d'être financièrement dépendante de forces externes qui cherchent à la dépouiller ? En effet, le moment est venu, et la richesse que les Gobelins ont fournie dans le passé sera maintenant rendue en abondance."
 repay_loan_goblin_decision_confirm:0 "Envoyer l'argent !"
 create_centaur_empire:0 "Fonder l'Empire des Maraudeurs"
 create_centaur_empire_desc:0 "Avec le lieu le plus sacré de notre foi sous mon règne, avec les autres khanats soit vaincus soit en fuite, et un domaine qui s'étend loin et large, je vais unir tous les adeptes de Theradras sous une nouvelle bannière, ma bannière."
 create_centaur_empire_tooltip:0 "Fonder un Empire uni pour tous les adeptes de Theradras"
 create_centaur_empire_confirm:0 "Rassembler les clans"
 take_the_walk_quilboar:0 "Faire le Dernier Chemin"
 take_the_walk_quilboar_desc:0 "J'ai vécu une longue et fructueuse vie, servant Agamaggan et ma tribu avec honneur et courage. Mais maintenant, je sens ma force s'évanouir, mon corps défaillir, mon sang se tarir. Il est temps pour moi de faire le chemin, de m'offrir à la terre et aux esprits, de faire de la place pour les jeunes et les forts. Je partirai avec dignité et fierté, sachant que j'ai accompli mon devoir."
 take_the_walk_quilboar_tooltip:0 "Faire une marche sacrificielle pour mettre fin à votre vie et bénéficier à votre tribu"
 take_the_walk_quilboar_confirm:0 "Adieu, mes amis"
 create_quilboar_empire:0 "Fonder l'Empire d'Agamaggar"
 create_quilboar_empire_desc:0 "Avec les deux lieux les plus sacrés de notre foi sous mon règne, et avec un domaine qui s'étend loin et large, je vais unir tous les adeptes d'Agamaggan sous une nouvelle bannière, ma bannière."
 create_quilboar_empire_tooltip:0 "Fonder un Empire uni pour tous les adeptes d'Agamaggan"
 create_quilboar_empire_confirm:0 "Rassembler le royaume"
 create_thorns_quilboar:0 "Invoquer les Vignes d'Agamaggan"
 create_thorns_quilboar_desc:0 "Je vais ordonner à mes tisseurs d'épines de préparer un grand rituel pour appeler de grandes vignes recouvertes d'épines dans mon royaume. Les épines scarifieront à jamais la terre et seront un symbole de la gloire d'Agamaggan."
 create_thorns_quilboar_tooltip:0 "Ordonnez à vos tisseurs d'épines de préparer un rituel pour appeler de grandes vignes recouvertes d'épines dans un comté approprié"
 create_thorns_quilboar_confirm:0 "Appeler votre tisseur d'épines aîné"
 create_thorns_quilboar_req_tt:0 "Nécessite 12 éclats de gemmes de sang (Vous en avez actuellement [GetPlayer.MakeScope.Var('blood_shard_count').GetValue])"
 change_agamaggan_blessing:0 "Effectuer le Rituel des Éclats de Gemmes de Sang"
 change_agamaggan_blessing_desc:0 "Ordonnez à vos tisseurs d'épines de préparer un festin rituel en l'honneur d'Agamaggan. Les éclats de gemmes de sang collectés seront utilisés pour effectuer l'un des cinq rituels, chacun offrant ses propres bénédictions à votre royaume. Vous ne pouvez effectuer qu'un seul rituel à la fois. Le rituel aura un coût initial de 4 éclats de gemmes de sang et de 2 éclats supplémentaires chaque année pour maintenir le rituel."
 change_agamaggan_blessing_tooltip:0 "Ordonnez à vos tisseurs d'épines de préparer un festin rituel en l'honneur d'Agamaggan. Les éclats de gemmes de sang collectés seront utilisés pour effectuer l'un des cinq rituels, chacun offrant ses propres bénédictions à votre royaume."
 change_agamaggan_blessing_confirm:0 "Commencer Le Festin Rituel"
 change_agamaggan_blessing_req_tt:0 "Nécessite 4 éclats de gemmes de sang (Vous en avez actuellement [GetPlayer.MakeScope.Var('blood_shard_count').GetValue])"
 blood_shards_gather_operation:0 "Initier la Collecte d'Éclats de Gemmes de Sang"
 blood_shards_gather_operation_desc:0 "Lancez une vaste opération de collecte d'éclats de gemmes de sang pour fouiller les terres à la recherche d'éclats de gemmes de sang. Vous pourrez utiliser ces éclats de gemmes de sang pour appeler les épines d'Agamaggan et effectuer de puissants rituels pour aider votre royaume. Chaque année, vous recevrez entre 2 et 4 éclats de gemmes de sang aux frais d'un coût annuel en or."
 blood_shards_gather_operation_tooltip:0 "Lancez une vaste opération de collecte d'éclats de gemmes de sang, vous pourrez utiliser ces éclats de gemmes de sang pour appeler les épines d'Agamaggan et effectuer de puissants rituels pour aider votre royaume."
 blood_shards_gather_operation_confirm:0 "Appeler Votre Tisseur D'épines Aîné"
 blood_shards_gather_operation_req_tt:0 "Vous n'avez pas d'opération de collecte d'éclats de gemmes de sang en cours"
 change_depot_policy:0 "Ajuster l'Opération de Prospection Pétrolière"
 change_depot_policy_desc:0 "Appelez votre intendant à votre salle du conseil pour discuter de l'état du dépôt de pétrole situé à [ROOT.Var('depot_location').Province.GetBaronyNameExplicitly]. Vous pouvez décider d'ajuster ou de maintenir la charge de travail de la prospection pétrolière, en fonction de vos besoins et de vos préférences."
 change_depot_policy_tooltip:0 "Ajustez la charge de travail de l'opération de prospection pétrolière des gobelins située à [ROOT.Var('depot_location').Province.GetBaronyNameExplicitly]."
 change_depot_policy_tt_basic:0 "Ajustez la charge de travail de l'opération de prospection pétrolière des gobelins située sur votre territoire."
 change_depot_policy_confirm:0 "Appeler votre intendant"
 create_union_universal:0 "Créer une Nouvelle Union"
 create_union_universal_desc:0 "Nous sommes en danger. Si nous voulons traverser cette tempête, nous devons former de nouvelles alliances solides avec nos voisins."
 create_union_universal_tooltip:0 "Appeler les [rulers|E] voisins à créer une [union|E]"
 create_union_universal_confirm:0 "Envoyer des messagers"
 create_union_universal_alliance_desc:0 "Vous #P rejoignez#! l'#V Alliance#!"
 create_union_universal_horde_desc:0 "Vous #P rejoignez#! la #V Horde#!"
 create_union_universal_custom_desc:0 "Vous #P rejoignez#! l'#V Union#!"
 create_union_universal_illidari_forces_desc:0 "Vous #P rejoignez#! les #V Illidari#!"
 create_union_universal_dragon_forces_desc:0 "Vous #P rejoignez#! les #V Aspects des Dragons#!"
 create_union_universal_scourge_forces_desc:0 "Vous #P rejoignez#! les #V Morts-Vivants#!"
 create_union_universal_axis_of_awful_desc:0 "Vous #P rejoignez#! l'#V Axe des Affreux#!"
 create_union_universal_no_union_valid_tt:0 "Aucune des unions n'est valide"
 create_union_universal_alliance_trigger_tt:0 "Les déclencheurs de l'#V Alliance#! ne sont pas valides"
 create_union_universal_horde_trigger_tt:0 "Les déclencheurs de la #V Horde#! ne sont pas valides"
 create_union_universal_custom_trigger_tt:0 "Les déclencheurs de l'#V Union#! ne sont pas valides"
 create_union_universal_illidari_forces_trigger_tt:0 "Les déclencheurs des #V Illidari#! ne sont pas valides"
 create_union_universal_dragon_forces_trigger_tt:0 "Les déclencheurs des #V Aspects des Dragons#! ne sont pas valides"
 create_union_universal_scourge_forces_trigger_tt:0 "Les déclencheurs des #V Morts-Vivants#! ne sont pas valides"
 create_union_universal_axis_of_awful_trigger_tt:0 "Les déclencheurs de l'#V Axe des Affreux#! ne sont pas valides"
 join_universal_union:0 "Rejoindre l'Union"
 join_universal_union_desc:0 "$create_union_universal_desc$"
 join_universal_union_tooltip:0 "Envoyez un message au [union_leader|E] pour demander à rejoindre l'[union|E]"
 join_universal_union_confirm:0 "Envoyer un messager"
 leave_universal_union:0 "Quitter l'Union"
 leave_universal_union_desc:0 "Nous n'avons plus besoin d'alliances. Notre nation peut se défendre seule."
 leave_universal_union_tooltip:0 "Vous quittez l'[union|E] actuelle"
 leave_universal_union_confirm:0 "Envoyer un messager"
 begin_totem_creation:0 "Devenir un Brave"
 begin_totem_creation_desc:0 "J'ai toujours ressenti un lien fort avec notre culture, et je souhaite l'honorer en devenant un tauren brave. Être un brave, ce n'est pas seulement un titre de respect, c'est le reflet de la force, du courage et de la sagesse d'une personne. Pour devenir un brave, je dois surmonter plusieurs épreuves pour tester l'esprit, le corps et l'âme, guidé par un marcheur des esprits."
 begin_totem_creation_tooltip:0 "Commencer le voyage pour devenir un brave"
 begin_totem_creation_confirm:0 "Il est temps, je suis prêt"
 attack_wailing_caverns:0 "Assiéger les Grottes des Lamentations"
 attack_wailing_caverns_desc:0 "Ebru, la druide elfe de la nuit, m'a convaincu de l'accompagner dans une quête périlleuse pour sauver Naralex, son mentor, de son cauchemar dans les Grottes des Lamentations. Elle dit que nous devons agir vite, avant que ses rêves ne déclenchent un cataclysme sur le monde."
 attack_wailing_caverns_tooltip:0 "Tenter de réveiller Naralex de son cauchemar avec l'aide d'Ebru pour éviter la crise imminente provoquée par les Druides des Serres."
 attack_wailing_caverns_confirm:0 "Appeler le conseil"
 wc_valid_light_faith_for_northshire_trigger_tt:0 "[THIS.Char.GetFaith.GetName] adhère à la [religion|E] [GetReligionByKey('tyrism_religion').GetAdjective] et en soutient les valeurs traditionnelles."
 wc_at_war_against_crisis_trigger_tt:0 "Engagé[THIS.Char.Custom('FR_E')] dans une guerre défensive contre une crise majeure menaçant le royaume."
 develop_the_undercity:0 "Développer Fossoyeuse"
 develop_the_undercity_desc:0 "La ville de Lordaeron a été ravagée par le Fléau. Cependant, le vaste système d'égouts en dessous, connu sous le nom de Fossoyeuse, est toujours intact et pourrait fonctionner comme une excellente position défensive et un bureau de gouvernement."
 develop_the_undercity_tooltip:0 "Déplacer la capitale sous terre"
 develop_the_undercity_confirm:0 "Déplacer la capitale sous terre"
 develop_the_undercity_effects:0 "La construction de Fossoyeuse se terminera dans deux ans."
 restore_empire_of_zul_decision:0 "Restaurer l'Empire de Zul"
 restore_empire_of_zul_decision_desc:0 "Une puissante alliance de cinq tribus de [GetTrait('creature_troll').GetName(ROOT.Char)], unies sous la direction des Zandalari, l'Empire et ses habitants ont combattu vaillamment contre tous ceux qui menacent les traditions de notre peuple. Et bien qu'il se soit écoulé plusieurs milliers d'années depuis la chute de notre grand Empire, nous nous relèverons et reprendrons notre suprématie une fois de plus."
 restore_empire_of_zul_decision_confirm:0 "Moi vais restaurer li Empire !"
 restore_empire_of_zul_decision_tt:0 "#V L'Empire de Zul#! sera restauré"
 create_empire_of_zul_titles_tt:0 "Tous les autres [GetTrait('creature_troll').GetName(GetPlayer.MakeScope.Char)] [empires|E] détenus par vous seront détruits, et l'Empire de Zul acquerra le [de_jure|E] de leurs royaumes."
 swear_fealty_to_zul_decision:0 "Jurer Fidélité à Zul"
 swear_fealty_to_zul_decision_desc:0 "Hélas, notre puissant Empire a été restauré. Bien que je ne le règne pas moi-même, je peux choisir de m'intégrer dans l'Empire, contribuant ainsi davantage à l'avancement du peuple troll."
 swear_fealty_zul_tt:0 "Vous prêterez serment de fidélité à l'Empire de Zul"
 integrate_title_zul_tt:0 "Intégrez vos nouveaux [empires|E] dans l'Empire de Zul"
 integrate_into_zul_decision:0 "Intégrer les Empires dans Zul"
 integrate_into_zul_decision_desc:0 "En tant qu'Empereur de Zul, je règne sur les terres de notre peuple. Ayant acquis un nouvel Empire troll, je dois décider s'il doit également tomber sous l'Empire de Zul ou s'il doit rester indépendant."
 integrate_into_zul_decision_confirm:0 "Tous les trolls doivent être sous #V L'Empire de Zul#!"
 enforce_the_brotherhood_decision:0 "Renforcer la Fraternité"
 enforce_the_brotherhood_decision_desc:0 "Alors que nos ennemis implacables avancent, il est temps de mobiliser la Fraternité de Comté-du-Nord. Transformons ces fidèles en une force de guerriers et de clercs combattants, prêts à défendre nos terres et notre foi. Notre détermination et notre force doivent être inébranlables face à l'ennemi à nos portes."
 brotherhood_northshire_destroyed:0 "Fraternité de Comté-du-Nord détruite"
 enforce_the_brotherhood_decision_tooltip:0 "Formez un ordre de guerriers dévoués pour défendre notre foi et notre royaume"
 enforce_the_brotherhood_decision_confirm:0 "Aux armes, pour [GetFaithByKey('holy_light').HighGodName] !"
 form_the_silver_hand_decision:0 "Fonder les paladins de la Main d'argent"
 form_the_silver_hand_decision_desc:0 "Avec la chute de Comté-du-Nord, la Lumière nous offre un choix. Allons-nous venger nos frères tombés au combat et nous unir en tant que paladins de la Sainte Lumière, ou laisserons-nous leurs accomplissements être vains ? Guidés par la Lumière, nous utiliserons nos armes comme des outils de justice et de rétribution pour vaincre le mal à travers Azeroth."
 form_the_silver_hand_decision_northshire_stay_desc:0 "La Lumière nous présente un choix crucial. Allons-nous nous unir en tant que paladins de la Sainte Lumière, embrassant notre destin pour défendre la justice et combattre le mal à travers Azeroth ? Guidés par la Lumière, nous sommes appelés à devenir ses champions, utilisant notre puissance comme outils de justice et gardiens de la paix. C'est notre opportunité de nous unir sous une cause commune, garantissant que les forces du bien prévaudront contre les ombres qui cherchent à engloutir notre monde."
 form_the_silver_hand_decision_tooltip:0 "Vengez les frères tombés et poursuivez leur mission pour défendre notre foi et nos terres"
 form_the_silver_hand_decision_confirm:0 "Gloria, Honorifice, Proelium Facio!"
 create_pandaria_decision.t.mogu:0 "Restore the Mogu Empire"
 create_pandaria_decision.t.pandaren:0 "Reunite the Pandaren Empire"
 create_pandaria_decision.t.neutral:0 "Reunite Pandaria"
 create_pandaria_decision.desc.mogu:0 "Eons ago, the continent of Pandaria was united under the great [GetTrait('creature_mogu').GetName( GetNullCharacter )] [empire|E]. The Old Kingdom created by the mighty [thunder_king|E] was ruled by might and our people enslaved the lesser races. We erected great works and broke all who opposed us for thousands of years. But it can be restored, if we manage to destroy our opponents and unite the continent once more."
 create_pandaria_decision.desc.pandaren:0 "Ten thousand years ago, the continent of Pandaria was united under the [GetTrait('creature_pandaren').GetName( GetNullCharacter )] [empire|E], led by a central government. But following the disappearance of the last emperor, Shaohao, the state crumbled and power shifted to a local level. If we reclaimed a large enough portion of the continent, Pandaria could once more stand united to face the threats on the horizon."
 create_pandaria_decision.desc.neutral:0 "Ten thousand years ago, the continent of Pandaria was united under a great [empire|E]. This time has long passed, but if we consolidated enough of the continent, perhaps we could unite the continent once more."
 create_pandaria_decision_thunder_king_defeated_tt:0 "The [thunder_king|E] cannot hold [GetTitleByKey('e_pandaria_empire').GetName]"
 create_pandaria_decision_tt:0 "You will reunite Pandaria under your rule"
 create_pandaria_decision_dejure_tt:0 "Your new [empire|E] will include all of the territories of [GetTitleByKey('e_kun_lai').GetName], [GetTitleByKey('e_yulin').GetName] and [GetTitleByKey('e_banshan').GetName]"
 create_pandaria_decision_shekmag_tt:0 "If you rule it, our new [empire|E] will also include all of the territories of [GetTitleByKey('e_shekmag').GetName]"
 create_pandaria_decision_confirm:0 "Pandaria unites once more."
 revive_lei_shen_decision:0 "Resurrect the Thunder King"
 revive_lei_shen_decision_desc:0 "Deep within the Tomb of Conquerors lies the body of the [thunder_king|E] Lei Shen, the greatest [GetTrait('creature_mogu').GetName( GetNullCharacter )] of all. He was the slayer of kings and gods, he shaped flesh and he founded the Mogu [empire|E]. When he died, his body, alongside his army, was laid to rest in the Tomb of Conquerors, deep within the [GetTitleByKey('c_lushat_lan').GetNameNoTier]. But legends tell of a secret ritual to revive him on the [GetTitleByKey('c_shangoalor').GetNameNoTier], only known to our ancient allies - the Zandalari [GetTrait('creature_troll').GetName( GetNullCharacter )]s. Perhaps the time has finally come to resurrect him, so he may usher in a new era of Mogu dominance."
 revive_lei_shen_decision_tooltip:0 "Resurrect Lei Shen, the [GetTrait('thunder_king').GetName(GetNullCharacter)], to lead the [GetTrait('creature_mogu').GetName( GetNullCharacter )] once more."
 revive_lei_shen_decision_confirm:0 "We will wake the storm."
 revive_lei_shen_decision_isle_of_thunder_tt:0 "You [completely_control|E] [GetTitleByKey('k_lei_dao').GetNameNoTier], the ancient seat of the [thunder_king|E]."
 revive_lei_shen_decision_valley_of_emperors_tt:0 "You [completely_control|E] [GetTitleByKey('d_howlingwind').GetNameNoTier], where the [thunder_king|E] was entombed and his body still rests."
 revive_lei_shen_decision_isle_of_reckoning_tt:0 "You [completely_control|E] [GetTitleByKey('c_shangoalor').GetNameNoTier], where the ritual of his resurrection must take place."
 revive_lei_shen_decision.tt:0 "You will forfeit all your [empire|E] tier [titles|E], as well as any titles held within the [GetTitleByKey('k_lei_dao').GetName] to your new [liege|E]"
 you_can_play_lei_shen.tt:0 "You will be given the option to continue playing as Lei Shen"
 TRUCE_THUNDER_KING:0 "Truce signed after [reviver.GetTitledFirstName] resurrected [lei_shen.GetTitledFirstName]"
 TRUCE_MANTID:0 "Truce signed because [lei_shen.GetTitledFirstName] was resurrected recently."
 lei_shen_negotiate_alliance_effect_tooltip:0 "We enter a mutual [alliance|E]"
 lei_shen_elite_army_name:0 "The Emperor's Shield"
 lei_shen_troll_army_name:0 "Zandalari Auxiliaries"
 lei_shen_standard_army_name:0 "Mogu Warhost"
 zandalari_lei_shen_decision:0 "$revive_lei_shen_decision$"
 zandalari_lei_shen_decision_desc:0 "Long ago, the Zandalari were allies to Lei Shen, the mighty [thunder_king|E] of the [GetTrait('creature_mogu').GetName( GetNullCharacter )] [empire|E]. Before he died, he shared with us the great secret of his resurrection. Perhaps the time has come to reawaken the [thunder_king|E], and to rekindle our ancient pact with the [GetTrait('creature_mogu').GetName(GetNullCharacter)] of Pandaria."
 zandalari_lei_shen_decision_tooltip:0 "$revive_lei_shen_decision_tooltip$"
 zandalari_lei_shen_decision_confirm:0 "A new Storm gathers"
 zandalari_lei_shen_decision.tt:0 "You will forfeit all [titles|E] held within Pandaria to the [thunder_king|E]."
 build_cosmic_observatory_decision: "Build the Cosmic Observatory"
 build_cosmic_observatory_decision_desc: "Many voices among Elven literature urge us not to look too deeply into the secrets of the [Glossary( 'Twisting Nether', 'TWISTING_NETHER_GLOSS' )]. However, many fail to see the truth: Our people are limited by our dependence on the Sunwell and we must look beyond to find safe sources of energy in order to thrive, should the worst come to pass."
 build_cosmic_observatory_decision_tooltip: "Further Elven research with a grand observatory"
 build_cosmic_observatory_decision_confirm: "Locate a suitable Ley Confluence!"
 cant_be_hof:0 "You cannot be [head_of_faith|E]"
 invade_scourge_quelthalas_decision: "The Fate of Quel'thalas"
 invade_scourge_quelthalas_decision.desc: "Frostmourne, the cursed blade, speaks to me. The relentless voice of the [GetTrait('lich_king').GetName(GetNullCharacter)] echoes and drowns out my own thoughts.\n\nThe [GetTrait('lich_king').GetName(GetNullCharacter)] compels me to move upon the great elven city of Quel'thalas and capture the [GetTitleByKey('c_sunwell_plateau').GetName], a magical conduit for the energies of the High Elves."
 invade_scourge_quelthalas_decision_tt: "Further the story of the Third War."
 invade_scourge_quelthalas_decision_confirm: "For the Lich King."
 scourge_quelthalas_decision_effect.tt: "An ultimatium will be sent to the vassals of [GetTitleByKey('k_quelthalas').GetName], giving them the opportunity to betray their liege and serve the [GetTrait('lich_king').GetName(GetNullCharacter)] willingly.\nShould they fail to heed the call of the [GetTrait('lich_king').GetName(GetNullCharacter)], you will declare war upon the [GetTitleByKey('k_quelthalas').GetName] in the name of the [GetTrait('lich_king').GetName(GetNullCharacter)] to seize and corrupt the [GetTitleByKey('c_sunwell_plateau').GetName].\nUpon corrupting the Sunwell, Kel'Thuzad will be reborn as a [GetTrait('being_undead').GetName(GetNullCharacter)] Lich and will join your court."
 resurrect_kelthuzad_decision: "The Resurrection of the Necromancer"
 resurrect_kelthuzad_decision_desc: "In order to bring forth the armies of the Burning Legion, we will require a powerful spellcaster to initiate the summoning ritual. It shall be my hand that draws his hour of rebirth."
 resurrect_kelthuzad_decision_tt: "Further the events of the Third War and the corruption of the Sunwell."
 resurrect_kelthuzad_decision_effect_tt: "You will corrupt the [GetTitleByKey('c_sunwell_plateau').GetName], a magical conduit for the energies of the High Elves.\nKel'Thuzad shall be reborn as a [GetTrait('creature_lich').GetName(GetNullCharacter)] and will join your court."
 resurrect_kelthuzad_decision_confirm: "For the Lich King!"
 thorium_invite_craftsmen_decision:0 "Invite Craftsmen from Thorium Brotherhood"
 thorium_invite_craftsmen_decision_desc:0 "The Thorium Brotherhood comprises many exceptionally talented craftsmen, and the blacksmiths of the Brotherhood are rumored to be among the finest Azeroth has ever seen. Using the formulas they have created or acquired, they make enchanted weapons and armor for anyone who can meet their exorbitant prices."
 thorium_no_dark_pluralism_trigger.tt:0 "Either [GetTitleByKey('c_chiselgrip').GetName] or [GetTitleByKey('c_drognur').GetName] must be held by a character whose [faith|E] does not have $doctrine_pluralism_dark_name$ [doctrine|E]."
 thorium_invite_craftsmen_decision.tt:0 "Send a letter of invitation to the members of the crafting guild."
 thorium_invite_craftsmen_decision_effect.tt:0 "A member of the Thorium Brotherhood will arrive in your court, giving access to high quality artifacts and county modifier."
 thorium_invite_craftsmen_decision_confirm:0 "Send a messenger."
 lower_suramar_barrier_decision: "Remove the Arcane Barrier"
 lower_suramar_barrier_decision_desc: "For thousands of years, the [GetTitleByKey('k_suramar').GetName] has been sealed off from the rest of the world.\n\nThis was done to protect our people from the devastation of the Sundering. But now, we have seen that life survives beyond our borders. It is time to lower the barrier, and rejoin the rest of Azeroth."
 lower_suramar_barrier_decision_tooltip: "Lower the barrier surrounding the [GetTitleByKey('k_suramar').GetName]"
 lower_suramar_barrier_decision_confirm: "The barrier must fall."
 lower_suramar_barrier_decision_tt: "The barrier surrounding the [GetTitleByKey('k_suramar').GetName] will be removed, and you will be able to interact with other realms."
 lower_suramar_barrier_decision_tt_modifier:0 "Every [county|E] in [GetTitleByKey('k_suramar').GetName] will lose [GetModifier('wc_suramar_isolated_modifier').GetNameWithTooltip]"
 lower_suramar_barrier_decision_trigger:0 "You must have a reason to lower the barrier, such as interference from the outside world"
 restore_arcandor_decision:0 "Restore the Arcan'dor Tree"
 restore_arcandor_decision_desc:0 "A mana tree known as the Arcan'dor once stood in the heart of Falanaar. It was a source of great power, freeing some elves from the grasp of the Nightwell, but it did not last forever.\n\nElves twisted by the explosion of the tree became the [GetTrait('creature_faldorei').GetName(ROOT.Char)]. And now, elves known as the [GetTrait('wretched').GetName(ROOT.Char)] suffer from the lack of mana, cured only by the fruit of the Arcan'dor."
 restore_arcandor_decision_trigger:0 "You have a reason to restore the Arcan'dor"
 restore_arcandor_decision_tooltip:0 "Restore the Arcan'dor tree in Falanaar"
 restore_arcandor_decision_confirm:0 "The Arcan'dor will rise again."
 decision_group_type_suramar:0 "Suramar Decisions"
 has_arcandor_seed_trigger_tt:0 "You have [arcandor_seed|E]"
 game_concept_arcandor_seed:0 "$arcandor_seed_name$"
 game_concept_arcandor_seed_desc:0 "$arcandor_seed_desc$"
 restore_arcandor_decision_wretched_tt:0 "Every elf with the [GetTrait('wretched').GetName(GetPlayer.MakeScope.Char)] will be able to visit the tree, #bold curing#! them of the curse.\n$BULLET$[GetTrait('creature_faldorei').GetName(GetPlayer.MakeScope.Char)] will be able to visit the tree, gaining a boon."
 decision_group_type_elven:0 "Elven Decisions"
 visit_the_arcandor_decision:0 "Visit the Arcan'dor Tree"
 visit_the_arcandor_decision_desc:0 "The Arcan'dor tree has been restored in Falanaar. It is said that the fruit of the tree can cure the [GetTrait('wretched').GetName(ROOT.Char)] and provide a boon to the [GetTrait('creature_faldorei').GetName(ROOT.Char)]. Before I wither and waste away, it is imperative that I visit the tree and partake of its fruit."
 visit_the_arcandor_decision_effect_tt:0 "I will travel to [GetTitleByKey('c_meredil').GetNameNoTier] and visit the Arcan'dor tree."
 visit_the_arcandor_decision_tooltip:0 "Visit the Arcan'dor tree in [GetTitleByKey('c_meredil').GetNameNoTier]"
 visit_the_arcandor_decision_confirm:0 "May my ailments be cured."
 become_crisis_decision:0 "Become a Crisis"
 become_crisis_decision_desc:0 "For too long have I been a mere [ROOT.Char.GetTitleAsNameNoTooltip]. It is time to rise above the petty squabbles of the realm and become a true force to be reckoned with.\n\nMany have threatened our homeland before, and we overcame them valiantly. Now, it is my turn to become the threat."
 become_crisis_decision_tooltip:0 "Become a [crisis|E] and unite Azeroth under your banner"
 become_crisis_decision_confirm:0 "To arms!"
 become_crisis_decision_tt:0 "#warning;bold You will become a [crisis|E]. Azeroth will unite under your banner, or be crushed by your forces.#!\n$BULLET$Gain access to the [great_invasion_casus_belli|E]\n$BULLET$Every [ally|E] will have a choice to join you, or face your wrath\n$BULLET$Rulers will be more likely to accept your [Concept('offer_vassalization', 'offers of vassalization')|E]\n$BULLET$Rulers will form a [coalition|E] against you"
 become_crisis_path_tt:0 "You will be able to #bold enhance#! your [crisis|E]:\n$BULLET$Exalt your [wc_race|E]\n$BULLET$Spread your [faith|E]\n$BULLET$Uphold your [Concept('dynasty_prestige', 'Legacy')|E]"
 become_crisis_end_tt:0 "Your journey will end when one of the following happens:\n$BULLET$Your [primary_title|E] is destroyed\n$BULLET$#V 25%#! of Azeroth is under your rule (Currently [root_scope.MakeScope.ScriptValue('counties_controlled_percentage_value')|V0%])\n$BULLET$You die"
 player_features:0 "$BULLET$Has access to the [great_invasion_casus_belli|E]\n$BULLET$Increased acceptance for [Concept('offer_vassalization', 'offers of vassalization')|E]\n\nOne of the following:\n$BULLET$Exalt their [wc_race|E]\n$BULLET$Spread their [faith|E]\n$BULLET$Uphold their [Concept('dynasty_prestige', 'Legacy')|E]"
 crisis_self_modifier:0 "Azeroth the Unmaker"
 crisis_self_modifier_desc:0 "Azeroth, your people will know my name."
 decision_group_type_class:0 "Class Decisions"
 become_a_demon_hunter_decision:0 "Become a Demon Hunter"
 become_a_demon_hunter_decision_desc:0 "“You... were not prepared. The enemy came into our world, their only desire to extinguish all life. They slaughtered our loved ones. They razed our homes, our cities, and our sacred places. You tried to stop them... and you failed. And so you came to me, nothing remaining of you but rage and determination, and you learned that the things that once tormented you could give you power. Now you see that there is no sacrifice too great if it brings an end to the Burning Legion.”"
 become_a_demon_hunter_decision_confirm:0 "There is only one way to vanquish the Demons..."
 become_a_demon_hunter_decision_tooltip:0 "You get the trait [GetTrait('demon_hunter').GetName(GetNullCharacter)]"
 a_demon_is_imprisoned_by_you:0 "You have managed to imprison a [GetTrait('being_demon').GetName(GetNullCharacter)]"
 embrace_the_demon_within:0 "Embrace the Demon Within"
 embrace_the_demon_within_desc:0 "Attaining the most demonic of forms for power is reckless. But we have come far and sacrificed much already to stop now. Only risk being that the demon within might try to take over..."
 embrace_the_demon_within_confirm:0 "Power Unbridled"
 embrace_the_demon_within_tooltip:0 "You get the trait [GetTrait('metamorphosis').GetName(GetNullCharacter)]"
 demon_hunter_atleast_has_one_thing_maxxed_out:0 "You have maximum experience in at least one of the [GetTrait('demon_hunter').GetName(GetNullCharacter)] trait tracks."
 demon_has_offered_power_to_demon_hunter:0 "The Demon's spirit that has merged with you has offered to grant you powers."
 form_the_scarlet_crusade_decision:0 "Form the Scarlet Crusade"
 form_the_scarlet_crusade_decision_desc:0 "The feeble and weak Paladins of the [GetTitleByKey('k_order_of_the_silver_hand').GetName] are barely clinging to life, forming fragile pacts in a desperate attempt to reclaim their faded glory. The Argent are no better. They are blinded by a false mercy and openly consort with the impure, the weak and scurry about like peasants seeking redemption that they will never earn. Only the Scarlet Crusade remains untainted. Only the Scarlet Crusade remains unyielding in purpose. Unwaverinmg in faith. We possess the strength to shield the desperate from the Scourge and grant righteous vengeance to those who swear fealty to our Holy cause. We are the true heirs of the Light - its purest blades made manifest. Those who oppose our sacred mission, even those we once called friends, shall be cleansed in a searing blaze of Holy Fire."
 form_the_scarlet_crusade_decision_confirm:0 "The Scarlet Crusade rises"
 form_the_scarlet_crusade_decision_tooltip:0 "Time for the Damned to become the prey"
 scarlet_crusade:0 "Elite Scarlet Crusaders"
 form_the_scarlet_onslaught_decision:0 "Wrath of the Scarlets"
 form_the_scarlet_onslaught_decision_desc:0 "For every undead we purge, twice as many rise to take their place. So long as the Scourge remains bound to its dark master, it will continue to swell with the fallen. The architect of this unholy plague - the creator of the destruction of Lordaeron, the [GetTrait('lich_king').GetName(GetNullCharacter)], must be struck down, or the tide of death will never cease. If we sever this head then the body shall wither. To that end, we must gather the bravest among us, the most purest of heart and strongest in will, and launch an expedition into the frozen wastes of Northrend. There, upon frozen throne and cursed soil, we shall confront the source of this abomination and end it once and for all."
 form_the_scarlet_onslaught_decision_confirm:0 "The Scarlet Onslaught begins"
 form_the_scarlet_onslaught_decision_tooltip:0 "Hunt the architect of the unholy plague"
 is_there_a_lich_king:0 "Does the [GetTrait('lich_king').GetName(GetNullCharacter)] even exist right now?"
 spiritual_head_of_faith_for_scarlets:0 "You create the [head_of_faith|E] [title|E] for Scarletism."
 raise_a_new_hearthglen_decision:0 "Raise our own Hearthglen"
 raise_a_new_hearthglen_decision_desc:0 "Through a long and arduous journey, we sailed across vast waters to earn the colony of [GetTitleByKey('c_moaki').GetName]. We have wrestled [GetTitleByKey('d_moaki').GetName] out of hands of the #italic animals #!that lived here. Now, with sweat and tears we shall build ourselves a New Hearthglen! This will serve as our Capital and a symbol of our burning zeal!"
 raise_a_new_hearthglen_decision_tt:0 "It will take a few years to complete the contruction of the New Hearthglen."
 raise_a_new_hearthglen_decision_confirm:0 "Let the construction begin"
 raise_a_new_hearthglen_decision_tooltip:0 "Hear me Roar!"
 form_the_argent_dawn_decision:0 "Form the Argent Dawn"
 form_the_argent_dawn_decision_desc:0 "The Paladins of the [GetTitleByKey('k_order_of_the_silver_hand').GetName] teeter on the edge of ruin, while the Scarlet Crusade spread devastation under the guise of righteousness. These zealots turn their blades against their own brethren and punish the innocent in an age of faith's collapse and mortal peril. We do not have to be the same. We will aid the poor. We will uplift the suffering. We will stand firm for all that is just, and defy all that is wicked. A new #italic Dawn #!will rise on lordaeron..."
 form_the_argent_dawn_decision_confirm:0 "The Argent Dawn is here"
 form_the_argent_dawn_decision_tooltip:0 "We will empower all and defy the wicked"
 temporal_head_of_faith_for_argents:0 "You create the [head_of_faith|E] [title|E] for Argentism."
 argent_crusade:0 "Argent Crusaders"
 liberate_lordaeron_from_the_scourge_decision:0 "Reform the Kingdom of Lordaeron"
 liberate_lordaeron_from_the_scourge_decision_desc:0 "The [GetTitleByKey('d_lordaeron').GetName] has been freed from the vile grasp of the Scourge! With the undead hordes weakened from our righteous victories, the time has come to reclaim the entirety of [GetTitleByKey('k_lordaeron').GetName] and appoint a new lord who will watch over [GetTitleByKey('k_lordaeron').GetName] to safeguard the realm and the people."
 liberate_lordaeron_from_the_scourge_decision_confirm:0 "Thy Kingdom Come"
 liberate_lordaeron_from_the_scourge_decision_tooltip:0 "The time for liberation is finally here!"