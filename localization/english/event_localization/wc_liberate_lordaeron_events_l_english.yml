l_english:
 
 liberate_lordaeron.1000.title:1 "Lordaeron Reborn"
 liberate_lordaeron.1000.desc:0 "After countless deaths and conflicts, the [GetTitleByKey('b_lordaeron').GetName] has been wrested away from the Scourge's grasp. The people of these ravaged lands will settle into their homelands once again and the plague shall be cleansed from the air and soil, but now the problem of rulership is laid bare before us... Who shall inherit the new [GetTitleByKey('k_lordaeron').GetBaseNameNoTierNoTooltip]?\n\nPerhaps the right thing to do would be to hand it back to the Menethils, to keep it stable? Or perhaps it would be most pious of me to hand it to the highest leadership of our Holy Faith?\n\nThen again, it was I alone who took back the [GetTitleByKey('b_lordaeron').GetTierAsNameNoTooltip] from the Scourge, why shouldn't I keep it for myself?"
 liberate_lordaeron.1000.A:0 "Take the Throne for myself!"
 liberate_lordaeron.1000.B:0 "The Menethil shall rule once more"
 liberate_lordaeron.1000.C:0 "My fight is for the Light!"

 liberate_lordaeron.1001.title:1 "Lordaeron Reborn"
 liberate_lordaeron.1001.desc:0 "With the strength of the Light itself, Lordaeron has been liberated.\n\nAll the rights to the Kingship of Lordaeron have been handed over to [new_ruler_of_lordaeron.GetName]. May the new reign of [new_ruler_of_lordaeron.GetFirstName] be blessed by the Light as well and may the poeple of Lordaeron flourish in their birthright."
 liberate_lordaeron.1001.A:0 "Interesting..."
