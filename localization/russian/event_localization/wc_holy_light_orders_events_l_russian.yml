l_russian:
  # TODO: Localize races 
 wc_holy_light_orders_events.0001.title: "Разрушение $c_northshire$"
 wc_holy_light_orders_events.0001.opening: "Аббатство $c_northshire$, некогда святое место для [holy_light.GetNameNoTooltip], было разграблено и полностью уничтожено [invader.GetPrimaryTitle.GetBaseName]. Большинство [holy_light.PriestNeuterPlural], включая всё руководство, были убиты.\n\n"
 wc_holy_light_orders_events.0001.desc.church: "Этот варварский акт против аббатства $c_northshire$ — неизмеримая трагедия для $k_holy_light_church$. Потеря столь многих верных и преданных священников — тяжёлый удар для нашего духовного сообщества. В ответ на этот ужас, был объявлен призыв к единству и силе.\n\nВдохновленные мужеством и жертвой Братства $c_northshire$, мы должны обдумать новый путь — такой, который сочетает нашу непоколебимую веру с силой оружия. Учения [holy_light.HighGodName] теперь должны защищаться не только через молитву, но и через меч."
 wc_holy_light_orders_events.0001.desc.holy_light_theocracy: "Это представляет собой разрушительный удар по $k_holy_light_church$ и доказательство того, что мы больше не можем игнорировать орков.\n\nСобрание было созвано для руководства нашей веры. Братство $c_northshire$, несмотря на своё поражение, было процитировано как пример для боевой ветви [holy_light.ReligiousHeadTitleName]. Несомненно, такое необходимо в эти тёмные времена.\n\nБез сомнения, новая война уже на подходе. Даже если орки проигнорируют северный континент, [holy_light.HighGodName] требует, чтобы мы вернули $c_northshire$ от демонического племени."
 wc_holy_light_orders_events.0001.desc.azerothian: "Это представляет собой разрушительный удар как для [holy_light.ReligiousHeadTitleName], так и для духа нашего народа.\n\n[high_priest.GetName] объявил, что он будет обдумывать, как верующие отреагируют на эти события. Религиозный пыл распространился по северным королевствам среди тех, кто ищет мести за павших.\n\nТе немногие священники, которые сбежали с нами, теперь ищут возмездия и с нетерпением ждут войны, чтобы освободить нашу родину. Хотя это и мало, их чувства породили надежду среди нашего побеждённого народа."
 wc_holy_light_orders_events.0001.desc.holy_light: "Это представляет собой разрушительный удар по $k_holy_light_church$ и доказательство того, что мы больше не можем игнорировать орков.\n\n[ROOT.Char.Faith.ReligiousHeadTitleName] объявил, что он будет обдумывать, как верующие отреагируют на эти события. Религиозный пыл распространился по северным королевствам среди тех, кто ищет мести за павших.\n\nНесмотря на поражение Братства $c_northshire$, их действия рассматриваются как блестящий пример того, как [holy_light.ReligiousHeadTitleName] должен противостоять волне тьмы."
 wc_holy_light_orders_events.0001.desc.normal: "Новости о разрушении аббатства $c_northshire$ распространились, как лесной пожар, вызывая шок и ужас по всем землям. Это святилище мира и преданности, разрушенное жестокостью [invader.GetPrimaryTitle.GetBaseName], стало сигналом для всех. Когда истории о героических битвах Братства $c_northshire$ распространились, среди людей появилось чувство гнева и решимости. Даже те, кто не следуют учениям $k_holy_light_church$, чувствуют необходимость в едином ответе на эту растущую угрозу."
 wc_holy_light_orders_events.0001.desc.other: "Падение аббатства $c_northshire$, оплота человеческой веры, является знаком меняющихся времен. Для народов и существ, стоящих в стороне от человеческих конфликтов, этот момент — либо шанс для действия, либо сигнал для укрепления. Другие могут увидеть в этом разрушении стратегическое преимущество, или напоминание, что война среди поверхностных рас усиливается, требуя осторожности и подготовки."
 wc_holy_light_orders_events.0001.church: "Мне нужно организовать мемориальную мессу."
 wc_holy_light_orders_events.0001.holy_light_theocracy.a: "[holy_light.ReligiousHeadTitleName] должен призвать к войне."
 wc_holy_light_orders_events.0001.holy_light_theocracy.b: "Я должен помочь выжившим из $c_northshire$."
 wc_holy_light_orders_events.0001.azerothian.a: "В следующий раз мы будем готовы!"
 wc_holy_light_orders_events.0001.azerothian.b: "Мы стали грешными. [holy_light.HighGodName] избавит нас!"
 wc_holy_light_orders_events.0001.holy_light.zealous: "Три орка за каждого убитого верующего!"
 wc_holy_light_orders_events.0001.holy_light.cynical: "Моё сердце разбивается за женщин и детей, что там."
 wc_holy_light_orders_events.0001.normal: "Что они замышляют?"
