l_english:
  reforge_liberated_county_no_target_data_tt:0 "This county's original culture and faith are not yet catalogued — no restoration will occur."

  liberate_chaos_duchy_decision:0 "Liberate the Duchy"
  liberate_chaos_duchy_decision_desc:0 "A corrupted faith holds sway over part of this duchy. As a servant of Order, you can drive out the chaos-aligned faith and set the county on the path back to its rightful people."
  liberate_chaos_duchy_decision.tt:0 "Begin the liberation of this duchy from chaos-aligned corruption."

  wc_titanforged_liberation.0001.title:0 "The Duchy is Liberated"
  wc_titanforged_liberation.0001.desc:0 "With the corrupted faith driven out, the county's original people and traditions can begin to return. But true restoration will take more than a single act of conquest."
  wc_titanforged_liberation.0001.a:0 "The work continues."

  reconstruct_liberated_duchy_decision:0 "Rebuild the Liberated Duchy"
  reconstruct_liberated_duchy_decision.desc:0 "Spend your accumulated Order to strengthen a liberated county, restoring it beyond its pre-corruption state."
  reconstruct_liberated_duchy_decision.tt:0 "Spend 20 Order Points to increase development in a liberated county of this duchy."
  reconstruct_liberated_duchy_decision_not_enough_order_points_tt:0 "You do not have enough Order Points (20 required)."

  cede_liberated_duchy_decision:0 "Cede the Liberated Duchy"
  cede_liberated_duchy_decision.desc:0 "The duchy has been restored. As is the way of Order, it is time to return it to those it belongs to — or to place it under temporary protection."
  cede_liberated_duchy_decision.tt:0 "Choose how to hand the restored duchy back to its people."

  wc_titanforged_liberation.0002.title:0 "The Restoration is Complete"
  wc_titanforged_liberation.0002.desc:0 "The duchy has been rebuilt. It is time to decide its fate."
  wc_titanforged_liberation.0002.a:0 "I relinquish this duchy to become independent."
  wc_titanforged_liberation.0002.b:0 "I place this duchy under the care of the Spiritual Head of its faith."
  wc_titanforged_liberation.0002.c:0 "I retain this duchy as a protectorate, for now."
