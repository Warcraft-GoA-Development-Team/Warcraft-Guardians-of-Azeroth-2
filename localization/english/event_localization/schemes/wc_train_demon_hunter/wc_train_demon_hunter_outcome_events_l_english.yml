l_english:
 train_demon_hunter_success_title:1 "Beginning of the Flames: Success"
 train_demon_hunter_success_desc:0 "After many days of training with [target.GetFirstName], I have finally earned [target.GetHerhis] favour and proved myself to be worthy of [target.GetFirstName]'s teachings and training.\n\n[target.GetFirstName] taught me about simpler ritual than what [target.GetSheHe] went through. By drinking the Demonic blood coursing through [target.GetFirstName], I can empower myself with the same strength that [target.GetFirstName] possesses."
 train_demon_hunter_success_A:0 "Now, I shall join the Hunt against the Demons..."

 train_demon_hunter_failure_title:1 "Beginning of the Flames: Failure"
 train_demon_hunter_failure_desc:0 "After many days of training with [target.GetFirstName], I have failed to earn [target.GetHerhis] prove myself to be worthy of [target.GetFirstName]'s teachings and training.\n\nI haven't qualified for the "ritual"... but I will come back stronger and try again."
 train_demon_hunter_failure_A:0 "I have failed now, but I will come back stronger!"
