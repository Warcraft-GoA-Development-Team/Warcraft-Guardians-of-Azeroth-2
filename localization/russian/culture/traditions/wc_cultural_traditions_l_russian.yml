l_russian:
  
 tradition_might_is_right_name: "Могущество - это право"
 tradition_might_is_right_desc: "Зачем нужна дипломатия, если мы можем просто взять то, что принадлежит нам по праву?"
  
 tradition_zandalari_cities_name: "Зандаларские города"
 tradition_zandalari_cities_desc: "Города империи Зандалар представляют собой замечательные образцы тролльской архитектуры и культуры. Эти огромные мегаполисы сочетают в себе природную красоту окружающих ландшафтов и величие древних цивилизаций. Города Зандалара характеризуются высокими строениями, сложной резьбой и яркими фресками, отображающими их богатую историю и связь с богами троллей.\nГорода разделены на различные районы, каждый из которых имеет свое собственное очарование и назначение. Они включают в себя большие рынки, где торгуют экзотическими товарами со всех уголков Азерота, оживлённые порты, связывающие империю Зандалар с другими землями, и спокойные святилища, посвящённые древним духам, известным как лоа, которых почитают зандаларцы. Храмы, пирамиды и другие монументальные сооружения воздают почести богам троллей и служат местом проведения духовных ритуалов и важных церемоний."
  
 tradition_longevity_traditions_name: "Традиции долголетия"
 tradition_longevity_traditions_desc: "Эта культура научилась (самостоятельно или от представителей [Concept( 'wc_elder_race', 'Старших рас' )|E]) секретам самосохранения, переданным существами, которые [Concept( 'wc_long_lived', 'долго живут' )|E] или обладают [Concept( 'wc_extreme_longevity', 'чрезвычайным долголетием' )|E]."
  
 tradition_liberated_undead_name: "Освобождённые нежити"
 tradition_liberated_undead_desc: "Эта культура преимущественно состоит из [Glossary('Undead', 'UNDEAD_GLOSS')] — тех, кого освободили от Плети; они пылают ненавистью к своим прежним хозяевам. Перспектива вечного не-жития породила культуру, где обиды надолго оседают в памяти, а ценность жизни заметно ниже."
  
 tradition_seducers_name: "Соблазнители"
 tradition_seducers_desc: "Искать плотских удовольствий — не только совершенно естественно, но и составляет самую сердцевину жизни. Иное даже представить невозможно."
  
 tradition_lookism_name: "Лукизм"
 tradition_lookism_desc: "В этой культуре внешность — это всё. Высоко ценится поверхностная красота, а тех, кто не соответствует стандартам, отвергают."
  
 tradition_collective_insanity_name: "Коллективное безумие"
 tradition_collective_insanity_desc: "То ли из-за общей травмы, то ли от природы — у людей этой культуры слегка не хватает нескольких гаек."
  
