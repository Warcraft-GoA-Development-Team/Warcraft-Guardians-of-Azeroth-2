 domicile_unlocks_pam_promulgate_word_of_pious_deeds_decision_tooltip: "Your [domicile|E] must have a [GetDomicileBuilding('chancery_01').GetName] [domicile_building|E] or higher"

 pam_renounce_papal_candidacy_decision: "Renounce the [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 pam_renounce_papal_candidacy_decision_embrace: "Seek the [ROOT.Char.GetFaith.ReligiousHeadTitleName]"
 pam_renounce_papal_candidacy_decision_desc_renounce: "Some spend their whole lives climbing toward the throne of the [ROOT.Char.GetFaith.ReligiousHeadName], and I have watched what the climb does to them.\n\nLet the [cardinal|E]s know that I will not stand when the next [ROOT.Char.GetFaith.ReligiousHeadName] is chosen. My work is here, in my own see."
 pam_renounce_papal_candidacy_decision_desc_embrace: "I once let it be known that I would not stand for the throne of the [ROOT.Char.GetFaith.ReligiousHeadName]. I was a younger [ROOT.Char.GetWomanMan] then, and [ROOT.Char.GetFaith.GetName] rested in gentler hands.\n\nLet the [cardinal|E]s hear that I am willing after all."
 pam_renounce_papal_candidacy_decision_tooltip_renounce: "Withdraw from consideration as the next [head_of_faith|E]"
 pam_renounce_papal_candidacy_decision_tooltip_embrace: "Stand for election as the next [head_of_faith|E] once more"
 pam_renounce_papal_candidacy_decision_renounce_tt: "You will not be considered a candidate when the next [head_of_faith|E] is elected, and you keep your own vote"
 pam_renounce_papal_candidacy_decision_embrace_tt: "You may be considered a candidate when the next [head_of_faith|E] is elected"
 pam_renounce_papal_candidacy_decision_last_candidate_tt: "Another [cardinal|E] must still be willing to stand"
 pam_renounce_papal_candidacy_decision_confirm_renounce: "Withdraw my name"
 pam_renounce_papal_candidacy_decision_confirm_embrace: "I am willing"

 pam_decision_events.0015.t: "Promulgate Word of Pious Deeds"
 pam_decision_events.0015.desc.intro.no_praiser: "My loyal priests share"
 pam_decision_events.0015.desc.intro.praiser: "My influential [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('my_praiser'))], [my_praiser.GetTitledFirstName], shares"
 pam_decision_events.0015.desc.intro: "the encomium crafted by my [GetDomicileBuilding('chancery_01').GetName]:\n\n"Virtuous deeds are like seeds, planted by the Lord, there to flourish into pious bounty. All should know [praise_worthy_priest.GetName], for [praise_worthy_priest.GetHerHis] noble"
 pam_decision_events.0015.desc.virtuoustrait: "and [my_virtuous_trait.GetName(praise_worthy_priest)]"
 pam_decision_events.0015.desc.mid: "virtues, ever guided by"
 pam_decision_events.0015.desc.virtuoustenet: "[my_virtuous_tenet.GetName( praise_worthy_priest.GetRite )]...""
 pam_decision_events.0015.desc.novirtuoustenet: "God...""
 pam_decision_events.0015.desc.bad: "\n\nDespite the laudatory words, my heart fears the kiss of hellfire."
 pam_decision_events.0015.desc.good: "\n\nTruly, I am an instrument of the Lord, a manifestation of his beauty on earth."
 pam_decision_events.0015.desc.neutral: "\n\nDespite the laudatory words, only in death will I know if my soul is right with the Lord."
 pam_decision_events.0015.desc.outro: "\n\n"...indeed, by the righteousness of [praise_worthy_priest.GetHerHis] deeds, this is the manner of [praise_worthy_priest.GetWomanMan] who could one day lead the Church!""
 
 pam_decision_events.0015.b: ""I have many a miracle to my name.""
 pam_decision_events.0015.b.flavor: "Why settle for the Papacy, when you could be canonized?"
 pam_decision_events.0015.b.tt: "#V Increase Chance of Canonization#! after death\n#weak Requires a [dynasty|E] to be canonized#!"
 
 pam_decision_events.0015.c: "If the Lord wishes me to lead..."
 pam_decision_events.0015.c.flavor: "...I must rise to the occasion"
 pam_decision_events.0015.c.tt: "#V Increase Election Score#! for [praise_worthy_priest_superior_title.GetName]: #P +30#!" 

 pam_decision_events.0015.d: "Let no other name be spoken."
 pam_decision_events.0015.d.flavor: "Empty the coffers of my devotion; I will not be second"
 pam_decision_events.0015.d.tt: "#V Increase Election Score#! for [praise_worthy_priest_superior_title.GetName]: #P +[praise_worthy_priest.MakeScope.ScriptValue('pam_papabile_place_first_populist_value')|0]#!, enough to stand first as $theocratic_elective_populist$\nRequires @piety_icon![praise_worthy_priest.MakeScope.ScriptValue('pam_place_first_as_populist_piety_cost_value')|0] [piety|E]"

