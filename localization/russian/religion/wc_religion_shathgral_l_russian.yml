 azshara_worship: "Азшаристск"
 azshara_worship_adj: "Азшаризм"
 azshara_worship_adherent: "Поклонник Азшары"
 azshara_worship_adherent_plural: "Поклонники Азшары"
 azshara_worship_desc: "Азшара была могущественной королевой Высокорожденных. Настолько велика её красота и талант, что она была повсеместно любима и почитаема. Однако, ослеплённая гордыней и жаждой власти, она была обманута Саргерасом и стала инициатором [Glossary( 'Войны Древних', 'WAR_OF_THE_ANCIENTS_GLOSS' )], приведшей к [Glossary( 'Расколу мира', 'GREAT_SUNDERING_GLOSS' )]. Но надежда не угасла: Азшара заключила сделку с Н'зотом, который спас её в обмен на верность — обещав ей корону в новом Черном Империи. Так она и её последователи были обращены в наг."
