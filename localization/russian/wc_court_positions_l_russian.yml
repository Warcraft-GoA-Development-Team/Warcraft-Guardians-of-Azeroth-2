l_russian:
 scrollsage_court_position: "Хранитель свитков"
 scrollsage_court_position_desc: "$scrollsage_court_position$ играет важную роль в культуре тортолланов. Они собирают и записывают историю в свитки."
 court_position_scrollsage: "[GetCourtPositionType('scrollsage_court_position').GetName()]"
  
 court_position_grummle_trait: "[GetTrait('creature_grummle').GetName( ROOT.Char )]"
 light_aerial_captain_camp_officer: "Капитан всадников на ветрокрылах"
 light_aerial_captain_camp_officer_desc: "$light_aerial_captain_camp_officer$ командует самыми быстрыми лётчиками лагеря. Он отвечает за руководство отрядом, подготовку и тактику."
 light_aerial_captain_camp_officer_parameter_tt: "$camp_with_following_buildings_tt$\n$BULLET$[GetDomicileBuilding('proving_grounds_flight_training').GetName]"
  
 massive_aerial_captain_camp_officer: "Капитан всадников на драконах"
 massive_aerial_captain_camp_officer_desc: "$massive_aerial_captain_camp_officer$ командует самыми крупными летающими существами лагеря. Он отвечает за руководство отрядом, подготовку и тактику."
 massive_aerial_captain_camp_officer_parameter_tt: "$camp_with_following_buildings_tt$\n$BULLET$[GetDomicileBuilding('proving_grounds_nesting_grounds').GetName]"
  
 massive_infantry_captain_camp_officer: "Укротитель великанов"
 massive_infantry_captain_camp_officer_desc: "$massive_infantry_captain_camp_officer$ командует самыми огромными воинами лагеря. Он отвечает за руководство отрядом, подготовку и тактику."
 massive_infantry_captain_camp_officer_parameter_tt: "$camp_with_following_buildings_tt$\n$BULLET$[GetDomicileBuilding('proving_grounds_titan_repair').GetName]"
  
 caster_captain_camp_officer: "Архимаг"
 caster_captain_camp_officer_desc: "$caster_captain_camp_officer$ командует магическими войсками лагеря. Он отвечает за руководство отрядом, подготовку и тактику."
 caster_captain_camp_officer_parameter_tt: "$camp_with_following_buildings_tt$\n$BULLET$[GetDomicileBuilding('proving_grounds_staff_rack').GetName]"
  
 hunter_chief: "Старший охотник"
 hunter_chief_desc: "$hunter_chief$ отвечает за охотничьи отряды и обеспечение успешной охоты для своего сюзерена."
 legend_chief: "Сказитель"
 legend_chief_desc: "$legend_chief$ ведает сказаниями, преданиями и историей."
 keg_haver: "Хмельничий"
 keg_haver_desc: "$keg_haver$ — представитель, избранный для прямого общения с бочками королевства, дабы сюзерен всегда мог получить лучшие из них."
 court_caster_conjurer: "Придворный заклинатель"
 court_caster_conjurer_desc: "Любому пользователю магии не помешает лишняя помощь при подготовке заклинаний. $court_caster_conjurer$ отдаёт свою ману в ваше распоряжение и помогает вам постигать искусство магии."
 court_caster_court_position: "Придворный чародей"
 court_caster_court_position_desc: "Любому пользователю магии не помешает лишняя помощь при подготовке заклинаний. $court_caster_court_position$ отдаёт свою ману в ваше распоряжение и помогает вам постигать искусство магии."
 court_caster_mage: "Придворный маг"
 court_caster_mage_desc: "Любому пользователю магии не помешает лишняя помощь при подготовке заклинаний. $court_caster_mage$ отдаёт свою ману в ваше распоряжение и помогает вам постигать искусство магии."
