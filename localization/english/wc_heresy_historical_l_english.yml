l_english:

 ##### Spread message and shared tooltips
 wc_heresy_historical.spread.title:0 "Heresy Spreads: [heresy_faith.GetName]"
 wc_heresy_historical.slows_spread_tt:0 "The [heresy_faith.GetName] will spread to fewer of the surrounding realms."

 ##### 0050 Outbreak notice
 wc_heresy_historical.0050.t.seline:0 "The Bishop's Shadow"
 wc_heresy_historical.0050.t.damned:0 "Whispers in [birth_location.GetNameNoTier]"
 wc_heresy_historical.0050.t.scarlet:0 "The Scarlet Zeal"
 wc_heresy_historical.0050.t.resurgence:0 "An Old Heresy Returns"
 wc_heresy_historical.0050.desc.seline:0 "Word comes from [birth_location.GetNameNoTier]: [founder.GetFullName], a bishop of the [origin_faith.GetName], teaches that the Light casts a shadow, and that a true priest must wield both. [founder.GetSheHe|U] calls it the Void. The faithful of [birth_location.GetNameNoTier] have begun to listen, and the [heresy_faith.GetName] takes root among them."
 wc_heresy_historical.0050.desc.damned:0 "In the markets of [birth_location.GetNameNoTier], preachers promise bread to the hungry, equality to the low and life without end to all who listen. They speak of a hidden master who will remake [GetTitleByKey('k_lordaeron').GetBaseNameNoTier]. Whole villages now follow the [heresy_faith.GetName], and the parish priests can't say who leads them."
 wc_heresy_historical.0050.desc.scarlet:0 "[founder.GetFullName] has come to [birth_location.GetNameNoTier] with an army of zealots. The plague hides in every peasant, [founder.GetSheHe] says, and only fire can find it. Lords who doubt the [heresy_faith.GetName] are named sympathizers. Its crimson banners now fly over the churches of the [origin_faith.GetName]."
 wc_heresy_historical.0050.desc.seline_resurgence:0 "Bishop Seline's teaching was never truly buried. In [birth_location.GetNameNoTier], [founder.GetFullName] preaches her doctrine of Light and shadow again, and the [heresy_faith.GetName] finds new followers."
 wc_heresy_historical.0050.desc.damned_resurgence:0 "The cult is back. In [birth_location.GetNameNoTier], [founder.GetFullName] gathers the poor and the desperate with the old promise of life eternal, and the [heresy_faith.GetName] spreads again."
 wc_heresy_historical.0050.desc.scarlet_resurgence:0 "A new inquisitor has risen. [founder.GetFullName] leads the faithful of [birth_location.GetNameNoTier] to the [heresy_faith.GetName], and the pyres are lit once more."
 wc_heresy_historical.0050.desc.insider:0 "Our teaching has come into the open at [birth_location.GetNameNoTier]. The faithful of the [origin_faith.GetName] call it heresy, but more of them listen every day. For now my own devotion to the [heresy_faith.GetName] remains my secret."
 wc_heresy_historical.0050.a:0 "This is the truth I have been waiting for."
 wc_heresy_historical.0050.b:0 "I will leave everything behind and follow [founder.GetFirstName]."
 wc_heresy_historical.0050.c:0 "Heresy. I will not be led astray."
 wc_heresy_historical.0050.c.insider:0 "I will keep my silence, for now."
 wc_heresy_historical.0050.t.deaths_head:0 "The Death's Head"
 wc_heresy_historical.0050.t.atalai:0 "The Soulflayer Stirs"
 wc_heresy_historical.0050.t.burning_blade:0 "A Blade in the Dark"
 wc_heresy_historical.0050.t.generic:0 "A New Heresy"
 wc_heresy_historical.0050.desc.deaths_head:0 "Word comes from [birth_location.GetNameNoTier]: [founder.GetFullName] has made a pact with the Scourge. [founder.GetHerHis|U] followers no longer bury their dead. They raise them, and call themselves the Death's Head. Many who once kept faith with the [origin_faith.GetName] now kneel to the [heresy_faith.GetName]."
 wc_heresy_historical.0050.desc.atalai:0 "From [birth_location.GetNameNoTier] comes word that [founder.GetFullName] and the priests of the Atal'ai are calling the Soulflayer back into the world. Tribes that kept faith with the [origin_faith.GetName] for generations now offer their blood to the [heresy_faith.GetName]."
 wc_heresy_historical.0050.desc.burning_blade_crypto:0 "Hooded figures meet in the shadows of [birth_location.GetNameNoTier]. They speak of the power the old Horde once drank, and of a hidden master who will lead them back to it. The [heresy_faith.GetName] has returned, and the faithful of the [origin_faith.GetName] are falling to it."
 wc_heresy_historical.0050.desc.burning_blade:0 "[founder.GetFullName] no longer hides. In [birth_location.GetNameNoTier], [founder.GetSheHe] calls on the orcs to remember the power of the old Horde, and the [heresy_faith.GetName] gathers new blades from the faithful of the [origin_faith.GetName]."
 wc_heresy_historical.0050.desc.deaths_head_resurgence:0 "The dead walk near [birth_location.GetNameNoTier] again. [founder.GetFullName] has renewed the Death's Head pact, and the [heresy_faith.GetName] spreads once more."
 wc_heresy_historical.0050.desc.atalai_resurgence:0 "The Soulflayer was cast down, but his priests endure. In [birth_location.GetNameNoTier], [founder.GetFullName] calls Hakkar back, and the [heresy_faith.GetName] spreads again."
 wc_heresy_historical.0050.desc.burning_blade_resurgence:0 "The Burning Blade was broken, never destroyed. In [birth_location.GetNameNoTier], [founder.GetFullName] gathers its last cultists, and the [heresy_faith.GetName] spreads again."
 wc_heresy_historical.0050.desc.generic:0 "In [birth_location.GetNameNoTier], [founder.GetFullName] preaches the [heresy_faith.GetName], and believers of the [origin_faith.GetName] are turning to it."

 ##### Modifiers
 wc_heresy_burned_granaries_modifier:0 "Burned Granaries"
 wc_heresy_burned_granaries_modifier_desc:0 "The grain stores were burned to keep the cult's tainted grain from the people."
 wc_heresy_seline_journals_modifier:0 "A Heretic Bishop's Journals"
 wc_heresy_seline_journals_modifier_desc:0 "This character studies the journals of a murdered bishop who wielded both Light and shadow."
 wc_heresy_sealed_writings_modifier:0 "Forbidden Writings"
 wc_heresy_sealed_writings_modifier_desc:0 "This character kept copies of writings the Kirin Tor wanted sealed away."

 ##### Opinions
 wc_heresy_refused_screening_opinion:0 "Refused the Plague Screening"
 wc_heresy_saved_the_accused_opinion:0 "Shielded the Accused"
 wc_heresy_supported_the_crusade_opinion:0 "Supported the Crusade"
 wc_heresy_sealed_writings_opinion:0 "Surrendered Forbidden Writings"

 ##### 1001-1003 Seline's Shadow
 wc_heresy_historical.1001.t:0 "The Bishop's Dagger"
 wc_heresy_historical.1001.desc.own_court:0 "[founder.GetFullName] no longer sits on my council. My former chaplain still walks my halls, though, and now preaches openly that the Light casts a shadow a priest must learn to wield. At [founder.GetHerHis] belt hangs a dagger my servants swear whispers when the candles gutter."
 wc_heresy_historical.1001.desc.chaplain:0 "[chaplain.GetTitledFirstName] comes to me pale. Bishop [founder.GetFullName] preaches in [birth_location.GetNameNoTier] that the Light casts a shadow, and that a true priest must wield both. [founder.GetSheHe|U] carries a dagger [chaplain.GetSheHe] swears whispers when the candles gutter."
 wc_heresy_historical.1001.desc.priest:0 "A parish priest begs an audience. Bishop [founder.GetFullName] preaches in [birth_location.GetNameNoTier] that the Light casts a shadow, and that a true priest must wield both. [founder.GetSheHe|U] carries a dagger the priest swears whispers when the candles gutter."
 wc_heresy_historical.1001.a:0 "Bring [founder.GetHerHim] before me. I will hear this doctrine myself."
 wc_heresy_historical.1001.a.success:0 "The Doctrine Unraveled"
 wc_heresy_historical.1001.a.failure:0 "The Shadow Takes Hold"
 wc_heresy_historical.1001.b:0 "The Church must censure [founder.GetHerHim] at once."
 wc_heresy_historical.1001.c:0 "Let [founder.GetHerHim] preach. Perhaps there is something to learn."
 wc_heresy_historical.1002.t:0 "Murder in the Night"
 wc_heresy_historical.1002.desc:0 "[founder.GetFullName] is dead, found in [founder.GetHerHis] chambers with the candles still burning. [founder.GetHerHis|U] own disciples did it, and they fled with the whispering dagger. Only [founder.GetHerHis] journals remain."
 wc_heresy_historical.1002.a:0 "Find the killers. Whatever they took must be recovered."
 wc_heresy_historical.1002.a.success:0 "The Killers Are Found"
 wc_heresy_historical.1002.a.failure:0 "The Trail Goes Cold"
 wc_heresy_historical.1002.b:0 "Bring me those journals."
 wc_heresy_historical.1002.c:0 "Let the dead rest."
 wc_heresy_historical.1003.t:0 "The Sealed Writings"
 wc_heresy_historical.1003.desc:0 "An envoy of [dalaran_ruler.GetTitledFirstName] arrives from [GetTitleByKey('k_dalaran').GetNameNoTier]. The [GetTitleByKey('d_kirin_tor').GetNameNoTier] want every page [founder.GetFullName] ever wrote, to be sealed in their vaults where no priest can read them. Copies of [founder.GetHerHis] writings still pass from hand to hand in my lands."
 wc_heresy_historical.1003.a:0 "Take them all, and purge [founder.GetHerHis] teaching from my lands."
 wc_heresy_historical.1003.b:0 "I will hand over the originals, but keep copies."

 ##### 2001-2003 Cult of the Damned
 wc_heresy_historical.2001.t:0 "The Preacher in the Market"
 wc_heresy_historical.2001.desc:0 "A stranger stands on a grain cart and preaches to a crowd of laborers. [preacher.GetFullName] promises bread to the hungry, an end to lords and ladies, and life without end for all who join [preacher.GetHerHim]. The crowd is larger every day, and some of them now wear the same black cord at the wrist."
 wc_heresy_historical.2001.a:0 "Seize [preacher.GetHerHim]. This ends today."
 wc_heresy_historical.2001.a.success:0 "The Preacher Is Taken"
 wc_heresy_historical.2001.a.failure:0 "The Crowd Turns on My Guards"
 wc_heresy_historical.2001.b:0 "I will go among them in disguise and listen."
 wc_heresy_historical.2001.c:0 "A street preacher is beneath my notice."
 wc_heresy_historical.2002.t:0 "Rot in the Granaries"
 wc_heresy_historical.2002.desc:0 "A handful of grain from the new shipment out of [birth_location.GetNameNoTier] is brought before me. It smells wrong, sweet and rotten at once, and the rats that ate it are dead. The cult's preachers are said to bless every cart that leaves [birth_location.GetNameNoTier]."
 wc_heresy_historical.2002.desc.steward:0 "[steward.GetTitledFirstName] brings me a handful of grain from the new shipment out of [birth_location.GetNameNoTier]. It smells wrong, sweet and rotten at once, and the rats that ate it are dead. The cult's preachers are said to bless every cart that leaves [birth_location.GetNameNoTier]."
 wc_heresy_historical.2002.a:0 "Burn it all, whatever it costs."
 wc_heresy_historical.2002.b:0 "We cannot waste food. Distribute it."
 wc_heresy_historical.2002.c:0 "Send for the [GetTitleByKey('k_order_of_the_silver_hand').GetNameNoTier] to inspect it."
 wc_heresy_historical.2002.c.expose_tt:0 "The paladins trace the grain back to its true master."
 wc_heresy_historical.2003.t:0 "Empty Pews"
 wc_heresy_historical.2003.desc:0 "Word reaches me that half the congregation missed the morning prayers. They were at the cult's gathering in the old barn, listening to talk of the life to come. The pews of the [origin_faith.GetName] are emptying across my lands."
 wc_heresy_historical.2003.desc.chaplain:0 "[chaplain.GetTitledFirstName] reports that half the congregation missed the morning prayers. They were at the cult's gathering in the old barn, listening to talk of the life to come. The pews of the [origin_faith.GetName] are emptying across my lands."
 wc_heresy_historical.2003.a:0 "Break up their gatherings. By force, if need be."
 wc_heresy_historical.2003.b:0 "I will preach to them myself and win them back."
 wc_heresy_historical.2003.b.success:0 "The Faithful Return"
 wc_heresy_historical.2003.b.failure:0 "My Words Fall Flat"
 wc_heresy_historical.2003.c:0 "Perhaps they have found something worth following."

 ##### 3001-3003 Scarlet zeal
 wc_heresy_historical.3001.t:0 "The Plague Screening"
 wc_heresy_historical.3001.desc:0 "Crimson-robed inquisitors ride into my capital under the banner of [founder.GetFullName]. They demand to examine every peasant for signs of the plague, by their own methods, in the town square. Anyone who refuses, they say, has something to hide."
 wc_heresy_historical.3001.a:0 "Let them search. Better safe than plagued."
 wc_heresy_historical.3001.b:0 "My people are not yours to torment. Leave."
 wc_heresy_historical.3001.c:0 "They are right. I will join the crusade."
 wc_heresy_historical.3002.t:0 "The Pyre"
 wc_heresy_historical.3002.desc:0 "The inquisitors have named [accused.GetFullName] a carrier of the plague. A pyre is already built in the square, and [accused.GetFirstName] is dragged before it, begging me to intervene. The crowd waits to see what I will do."
 wc_heresy_historical.3002.a:0 "If the Light demands it, let it burn."
 wc_heresy_historical.3002.b:0 "Release [accused.GetHerHim]. No one burns in my lands without my word."
 wc_heresy_historical.3002.c:0 "There will be a proper trial first."
 wc_heresy_historical.3002.c.success:0 "The Accused Is Acquitted"
 wc_heresy_historical.3002.c.failure:0 "The Trial Goes Poorly"
 wc_heresy_historical.3003.t:0 "The Defector"
 wc_heresy_historical.3003.desc:0 "A young crusader kneels at my gate, [defector.GetHerHis] crimson tabard torn away. [defector.GetFirstName] has seen too many innocents burn, and asks for sanctuary from the order [defector.GetSheHe] once swore to serve."
 wc_heresy_historical.3003.a:0 "Rise. You will serve me as a knight."
 wc_heresy_historical.3003.b:0 "Deserters are not welcome here. Go back."
 wc_heresy_historical.3003.c:0 "Tell my people what you have seen."
