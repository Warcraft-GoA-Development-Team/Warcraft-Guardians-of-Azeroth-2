 trait_wc_lifestyle_elemental_earth_decay_magic: "Сокрушительные геотеурги"
 trait_user_of_elemental_earth_decay_magic_name: "Геотеург"
 trait_user_of_elemental_earth_decay_magic_1: "$wc_lifestyle_magic_prefix_for_level_1$ $trait_user_of_elemental_earth_decay_magic_name$"
 trait_user_of_elemental_earth_decay_magic_1_desc: "Геотеурги научились обуздывать ярость земли: те, кто вступит с ними в битву, обнаружат, что сама земля восстаёт, принимая облик элементалей камня и скал. Легенды до сих пор повествуют о геотеургах, способных поднять землю, чтобы поглотить целые армии и сокрушить поселения врагов опустошительными землетрясениями."
