l_english:
 # The Swarm Stirs
 wc_mantid_swarm.0001.t:0 "The Swarm Stirs"
 wc_mantid_swarm.0001.desc:0 "The kypari trees of the Dread Wastes hang heavy with amber, and the hatcheries overflow with hungry young. A century has turned, and the Swarm wakes."
 wc_mantid_swarm.0001.desc_head:0 "The faithful of [swarm_faith.GetName] look to me. Before the year is out, I must send the Swarm against the Serpent's Spine."
 wc_mantid_swarm.0001.desc_empress:0 "Before the year is out, [swarm_head.GetFullName] will send the Swarm against the Serpent's Spine, and my brood must be ready to march."
 wc_mantid_swarm.0001.a:0 "Let the Hatcheries Overflow"
 wc_mantid_swarm.0001.b:0 "Offer the Hatchlings to [swarm_faith.HighGodName]"

 # The Swarm Is Due
 wc_mantid_swarm.0011.t:0 "The Swarm Is Due"
 wc_mantid_swarm.0011.desc:0 "A hundred years have passed since the last Swarm broke against the Serpent's Spine. The hatcheries are full, the [GetTitleByKey('d_klaxxi').GetBaseNameNoTier] grow restless, and every eye in the Dread Wastes turns to me. Where shall the Swarm fall?"
 wc_mantid_swarm.0011.a:0 "Unleash the Swarm on [target_1.GetName]"
 wc_mantid_swarm.0011.b:0 "Unleash the Swarm on [target_2.GetName]"
 wc_mantid_swarm.0011.c:0 "Unleash the Swarm on [target_3.GetName]"
 wc_mantid_swarm.0011.d:0 "Hold the Swarm Back"
 wc_mantid_swarm.0011.a.tt:0 "The Swarm prepares a [great_holy_war|E] against [target_1.GetName]"
 wc_mantid_swarm.0011.b.tt:0 "The Swarm prepares a [great_holy_war|E] against [target_2.GetName]"
 wc_mantid_swarm.0011.c.tt:0 "The Swarm prepares a [great_holy_war|E] against [target_3.GetName]"
 wc_mantid_swarm.0011.d.tt:0 "The Swarm waits five more years. This can only be done once per cycle."

 # The Klaxxi Wake a Paragon
 wc_mantid_swarm.0020.t:0 "Broken from Amber"
 wc_mantid_swarm.0020.desc:0 "In the deep halls of the Dread Wastes the amber has been split open. [paragon.GetFullName], a champion sealed away at the height of [paragon.GetHerHis] strength, takes [paragon.GetHerHis] first breath in an age and kneels before me, ready for the Swarm."
 wc_mantid_swarm.0020.desc_klaxxi:0 "[klaxxi_leader.GetFullName] of the [GetTitleByKey('d_klaxxi').GetBaseNameNoTier] has split the amber open. [paragon.GetFullName], a champion sealed away at the height of [paragon.GetHerHis] strength, takes [paragon.GetHerHis] first breath in an age and kneels before me, ready for the Swarm."
 wc_mantid_swarm.0020.a:0 "Welcome, Paragon"
 wc_mantid_swarm.0020.a.tt:0 "[paragon.GetFirstName] joins your court"
 wc_mantid_swarm.0020.b:0 "Return [paragon.GetHerHim] to the Amber"

 # Culling at the Wall
 wc_mantid_swarm.0030.t:0 "Culling at the Wall"
 wc_mantid_swarm.0030.desc:0 "The Swarm has thrown itself at the Serpent's Spine again and again. [strong_one.GetFullName] climbs back from the wall unbroken, while [weak_one.GetFullName] falters behind the lines. The strong survive and the weak die: so it has always been."
 wc_mantid_swarm.0030.a:0 "The Weak Feed the Strong"
 wc_mantid_swarm.0030.b:0 "Spare [weak_one.GetFirstName]"

 # The Swarm Triumphant
 wc_mantid_swarm.0040.t:0 "The Swarm Triumphant"
 wc_mantid_swarm.0040.desc:0 "[final_target.GetName] has fallen to the Swarm. The faithful of [swarm_faith.GetName] feast in the conquered lands, and the hatcheries will remember this cycle for a hundred years."
 wc_mantid_swarm.0040.a:0 "Glory to the Swarm"

 # Tempered by Defeat
 wc_mantid_swarm.0041.t:0 "Tempered by Defeat"
 wc_mantid_swarm.0041.desc:0 "The Swarm has broken against [final_target.GetName]. The weak are dead, and only the strong crawl home to the Dread Wastes. Defeat only strengthens the Swarm."
 wc_mantid_swarm.0041.a:0 "The Strong Survive"
 wc_mantid_swarm.0041.a.tt:0 "Every mantid ruler of [swarm_faith.GetName] is Tempered by Defeat for 10 years"

 # Signal Fires on the Wall
 wc_mantid_swarm.0050.t:0 "Signal Fires on the Wall"
 wc_mantid_swarm.0050.desc:0 "Fire leaps from tower to tower along the Serpent's Spine, and within hours the signal reaches my court. The mantid of [swarm_faith.GetName] are massing in the Dread Wastes, and their Swarm will fall upon [target_kingdom.GetName] within the year."
 wc_mantid_swarm.0050.a:0 "Rally the Levies"
 wc_mantid_swarm.0050.b:0 "Reinforce the Wall"
 wc_mantid_swarm.0050.c:0 "Leave It to the [GetTitleByKey('k_shado_pan').GetBaseNameNoTier]"

 # Shado-Pan Call to the Wall
 wc_mantid_swarm.0060.opening:0 "To [ROOT.Char.GetTitledFirstName],"
 wc_mantid_swarm.0060.desc:0 "The signal fires burn along the Serpent's Spine. The Swarm is coming for [target_kingdom.GetName], as it has every hundred years since the wall was raised. The [GetTitleByKey('k_shado_pan').GetBaseNameNoTier] will hold the line, but we cannot hold it alone. Send us your bravest, or your gold.\n\n[shado_pan_leader.GetFullName]"
 wc_mantid_swarm.0060.a:0 "Send [champion.GetFirstName] to the Wall"
 wc_mantid_swarm.0060.b:0 "Send Gold"
 wc_mantid_swarm.0060.c:0 "We Have Our Own Walls"

 # The Wall Falls
 wc_mantid_swarm.0070.t:0 "The Wall Falls"
 wc_mantid_swarm.0070.desc:0 "The Serpent's Spine has broken. The Swarm poured through the breach into [final_target.GetName], and towers that stood for ten thousand years lie cracked and smoking."
 wc_mantid_swarm.0070.a:0 "We Will Raise It Again"
 wc_mantid_swarm.0070.b:0 "Mourn the Fallen"

 # The Wall Holds
 wc_mantid_swarm.0071.t:0 "The Wall Holds"
 wc_mantid_swarm.0071.desc:0 "The Swarm has broken against the Serpent's Spine and fled back into the Dread Wastes. [final_target.GetName] still stands."
 wc_mantid_swarm.0071.a:0 "Honor [hero.GetFirstName]"
 wc_mantid_swarm.0071.b:0 "Credit the [GetTitleByKey('k_shado_pan').GetBaseNameNoTier]"
 wc_mantid_swarm.0071.c:0 "The Wall Endures"

 # Shado-Pan Veterans
 wc_mantid_swarm.0080.t:0 "Veterans of the Wall"
 wc_mantid_swarm.0080.desc:0 "The Swarm is beaten back and [final_target.GetName] is safe. The warriors of the [GetTitleByKey('k_shado_pan').GetBaseNameNoTier] who stood on the Serpent's Spine come home harder than they left."
 wc_mantid_swarm.0080.a:0 "Honor the Veterans"

 # War-end toast
 wc_mantid_swarm.0090.triumph_toast:0 "The Swarm Has Taken [final_target.GetName]"

 # Modifiers (plain text: modifier loc cannot use data functions)
 wc_swarm_stirring:0 "The Swarm Stirs"
 wc_swarm_stirring_desc:0 "The hatcheries overflow ahead of the Swarm."
 wc_proven_in_swarm:0 "Proven in the Swarm"
 wc_proven_in_swarm_desc:0 "This mantid survived the culling at the wall."
 wc_tempered_by_defeat:0 "Tempered by Defeat"
 wc_tempered_by_defeat_desc:0 "The Swarm failed, and only the strong came home."
 wc_wall_rallied:0 "Rallied to the Wall"
 wc_wall_rallied_desc:0 "This realm's levies have been called to defend the Serpent's Spine."
 wc_wall_reinforced:0 "Reinforced Wall"
 wc_wall_reinforced_desc:0 "Fresh stone and more defenders guard this stretch of the Serpent's Spine."
 wc_wall_defender:0 "Defender of the Wall"
 wc_wall_defender_desc:0 "This champion was sent to hold the Serpent's Spine against the Swarm."
 wc_hero_of_the_wall:0 "Hero of the Wall"
 wc_hero_of_the_wall_desc:0 "This warrior held the Serpent's Spine against the Swarm."
 wc_shado_pan_veteran:0 "Veteran of the Wall"
 wc_shado_pan_veteran_desc:0 "This warrior stood on the Serpent's Spine when the Swarm came."

 # Opinions
 wc_held_back_swarm_opinion:0 "Held Back the Swarm"
 wc_shado_pan_answered_opinion:0 "Answered the Call to the Wall"
 wc_shado_pan_refused_opinion:0 "Refused the Call to the Wall"
 wc_left_wall_to_shado_pan_opinion:0 "Left the Wall to Us"
