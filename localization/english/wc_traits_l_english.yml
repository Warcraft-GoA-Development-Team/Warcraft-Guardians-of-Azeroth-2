 trait_aspect_of_infinity:0 "Aspect of Infinity"
 trait_aspect_of_infinity_desc:0 "The Aspect of Infinity was once the powerful Aspect of Time, chosen by the titan [Glossary( 'Aman’Thul', 'AMANTHUL_GLOSS' )] to govern the flow of time and the threads of destiny. However, after seeing a vision of his own death, fear consumed his mind and soul, leading him to turn against his own kind and seek control over time itself. Corruption overtook him, and now he commands powerful servants, seeking to rewrite history to prevent his own death and posing a grave threat to the timeline and the world itself."
 trait_aspect_of_infinity_character_desc:0 "$trait_aspect_of_infinity_desc$"
 trait_aspect_of_earth:0 "Aspect of Earth"
 trait_aspect_of_earth_desc:0 "“My blessing upon you will seem humble compared to those which have been bestowed upon the others: the managing of time, of life, of dreams and magic. I offer you the earth. The soil, the ground, the deep places. But know that the earth is the basis of all things. It is where we are rooted. Where you must come from, if you are to go to. Here is whence true strength comes. From deep places... within the world, and within oneself.”\n- [Glossary( 'Khaz’goroth the Shaper', 'KHAZGOROTH_GLOSS' )]"
 trait_aspect_of_earth_character_desc:0 "$trait_aspect_of_earth_desc$"

