 # Key Moment
 BattlePoiDescriptionLocCasters: "The key moment of the battle was when the $BattlePoiCommanderCulture$ casters managed to navigate around the enemy, "
 BattlePoiDescriptionLocMassiveInfantry: "The battle was decided when a regiment of $BattlePoiCommanderCulture$ massive infantry pushed through enemy lines,"
 BattlePoiDescriptionLocLightAerial: "The outcome was decided when the $BattlePoiCommanderCulture$ light aerial managed to navigate behind enemy troops,"
 BattlePoiDescriptionLocMassiveAerial: "The battle came to an end when the $BattlePoiCommanderCulture$ massive aerial tore through the battle lines and into the heart of the enemy formation,"
 BattlePoiDescriptionLocCastersKnight: "The key moment of the battle was when the $BattlePoiCommanderCulture$ casters led by $BattlePoiBraveKnight$ managed to navigate around the enemy, "
 BattlePoiDescriptionLocMassiveInfantryKnight: "The battle was decided when a regiment of $BattlePoiCommanderCulture$ massive infantry led by $BattlePoiBraveKnight$ pushed through enemy lines,"
 BattlePoiDescriptionLocLightAerialKnight: "The outcome was decided when the $BattlePoiCommanderCulture$ light aerial led by $BattlePoiBraveKnight$ managed to navigate behind enemy troops,"
 BattlePoiDescriptionLocMassiveAerialKnight: "The battle came to an end when the $BattlePoiCommanderCulture$ massive aerial led by $BattlePoiBraveKnight$ tore through the battle lines and into the heart of the enemy formation,"

 # Outcome
 
 # Outro

 # Historical Battles

 BattlePoIHistoricalNameKyross: "The Battle of Kyross"
 BattlePoIHistoricalDescKyross: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstNameNicknamed]\nDefeated: [GetScriptedCharacterByHistoryID( 'blake_godwyn' ).GetFirstName] [GetScriptedCharacterByHistoryID( 'blake_godwyn' ).GetDynastyName]\nDate: 1st of March, 583 KC#!\n#weak One of the first outposts of the Horde, Kyross was the stage to one of the first attacks from the humans in an attempt to prevent the Orcs from launching any more surprise attacks.#!"

 BattlePoIHistoricalNameGrandHamlet: "The Battle of Grand Hamlet"
 BattlePoIHistoricalDescGrandHamlet: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetTitledFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFirstName] [GetScriptedCharacterByHistoryID( '1008' ).GetDynastyName]\nDate: 10th of August, 584 KC#!\n#weak This human outpost was destroyed by the orcs in the First War.\n\nIt was one of the first recorded battle in which the use of clerics and necrolytes were applied in war.#!"

 BattlePoIHistoricalNameDeadmines: "The Battle of The Deadmines"
 BattlePoIHistoricalDescDeadmines: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]\nDefeated: [GetScriptedCharacterByHistoryID( '52450' ).GetFullName]\nDate: 585 KC#!\n#weak A battle between the orcs and a group of renegade ogres lead by [GetScriptedCharacterByHistoryID( '52450' ).GetFirstName] along with [GetScriptedCharacterByHistoryID( '10004' ).GetFirstName], daughter of [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]. Both of them were slain along with their soldiers on the orders of [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]#!"

 BattlePoIHistoricalNameRedridge: "The Battle of The Redridge Mountains"
 BattlePoIHistoricalDescRedridge: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 586 KC#!\n#weak The Redridge mountains was one of the places the Horde descended upon.#!"

 BattlePoIHistoricalNameSunnyglade: "The Battle of Sunnyglade"
 BattlePoIHistoricalDescSunnyglade: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetNameNicknamed]\nDate: 586 KC#!\n#weak The Battle of Sunnyglade was one of the key battles between the Kingdom of Stormwind and the Orcish Horde, due to the orcs getting to study the magiks of the humans.#!"

 BattlePoIHistoricalNameNorthshire: "The Battle of Northshire Abbey"
 BattlePoIHistoricalDescNorthshire: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 586 KC#!\n#weak During the First War, the Northshire Abbey was used as a prison for the invading orcs and ogres.\n\nThe orcs laid siege upon the abbey and fought all manner of enemies inside.#!"

 BattlePoIHistoricalNameGoldshire: "The Battle of Goldshire"
 BattlePoIHistoricalDescGoldshire: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 586 KC#!\n#weak Goldshire was the final city the orcs laid siege to before sieging Stormwind.\n\nIts destruction severed the lifeline between the King and his people, making him a figurehead waiting to be lopped off.#!"

 BattlePoIHistoricalNameStormwind: "The Fall of Stormwind Keep"
 BattlePoIHistoricalDescStormwind: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 1st of October, 586 KC#!\n#weak The second siege of Stormwind Keep was the final battle of the First War that ended with the Orcish Horde's victory over the humans of the kingdom of Azeroth. The events that culminated ultimately led to the destruction of Stormwind Keep and the death of [GetScriptedCharacterByHistoryID( '2' ).GetTitledFirstName].\n\nSir [GetScriptedCharacterByHistoryID( '1008' ).GetFullName] would lead the survivors and refugees of the First War on an exodus north to the continent of Lordaeron, where they would prepare for the Horde's impending invasion and the eventual outbreak of the Second War.#!"

 BattlePoIHistoricalNameAror: "The Battle of Aror"
 BattlePoIHistoricalDescAror: "#emp Victor: Muhammad ibn al-Qasim\nDefeated: Raja Dahir\nDate: 711 AD#!\n#weak A battle in the Umayyad invasion of India, between the Raja of Sindh and the Umayyad Empire.\n\nThough his opponents were originally a more numerous force, the Umayyad commander had managed to get the better position for his army before committing to a battle. Throughout the conflict, this imbalance led to the Muslim forces slowly taking control of the flow of battle, and with the death of Raja Dahir their victory was secured.#!"

 BattlePoIHistoricalNameSvolder: "The Battle of Svolder"
 BattlePoIHistoricalDescSvolder: "#emp Victor: [GetScriptedCharacterByHistoryID( '101505' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '144004' ).GetFullName]\nDate: 9th of September, 999 KC#!\n#weak A battle between the Norwegian forces of Olafr Tryggvason on one side, against a coalition of Danish and Swedish forces led by King Sveinn of Denmark on the other.\n\nEven though massively outnumbered, the Norwegian king refused to flee from the hostile coalition, and engaged the Swedes and the Danes in battle, calling them 'horse-eaters' and 'forest goats' as he did.\n\nIn the end, though dealing a heavy blow to their enemy, the Norwegian army was crushed. Olafr disappeared in the battle, and most likely passed away.#!"

 BattlePoIHistoricalNameCivitate: "The Battle of Civitate"
 BattlePoIHistoricalDescCivitate: "#emp Victor: [GetScriptedCharacterByHistoryID( '1126' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1338' ).GetFullName]\nDate: 18th of June, 1053 KC#!\n#weak A battle between the Normans on one side, and a coalition led by the Pope on the other, including Germans and local Italians.\n\nDespite their numerical advantage, the Papal coalition were unable to break through the Norman infantry in the center of the battle, and their cavalry flanks lost the battle against the Norman cavalry.\n\nA short while after the battle, the Pope himself was captured by the Normans, leading to an end to the conflict.#!"

 BattlePoIHistoricalNameTalas: "The Battle of Talas"
 BattlePoIHistoricalDescTalas: "#emp Victor: Abbasid Caliphate\nDefeated: Tang Dynasty\nDate: 751 KC#!\n#weak A prolonged conflict between the Abbasid Caliphate expanding into Transoxiana from the south-west, and the Tang Dynasty expanding into it from the east.\n\nOriginally the heavy infantry of the Tang dynasty and their Turkic mercenaries played an important role in pushing back the Abbasid forces, but with the mercenaries changing sides and many of their allies betraying them, the Tang were forced back.\n\nThis conflict saw the end of the Tang's westward expansion, and Transoxiana being in Muslim hands for the foreseeable future.#!"
