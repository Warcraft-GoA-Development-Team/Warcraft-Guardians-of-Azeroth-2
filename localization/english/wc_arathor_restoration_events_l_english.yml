l_english:

 arathor_restoration.0100.t: "Humanity's Dream Realized"
 arathor_restoration.0100.desc: "It is an auspicious day, for today the Empire of Arathor realizes its ancient potential.\n\nFrom every corner of the empire can shouts of jubilation and pride be heard.\n\nBut I must now steer the sails of this vast enterprise. What will we make of this Arathor? Among my many predecessors and the myriad incarnations of Arathi power, the choice narrows."
 arathor_restoration.0100.a: "Now I shall pass as a Legend..."
 arathor_restoration.0100.b: "There shall be no half measures."

 arathor_restoration.0101.t: "The Second Age of Arathor"
 arathor_restoration.0101.desc: "A declaration has been issued from the imperial seat of [arathor_hegemon.GetCapitalLocation.GetBaronyNameExplicitly] by the hand of [arathor_hegemon.GetName]. Far-flung lands once belonging to the ancient Arathi are unified anew by the [arathor_hegemon.GetCulture.GetCollectiveNoun], with ambitions as grand as the Leaders of old.\n\nA formidable power now casts its shadow over Azeroth, promising a future where the might and mettle of its neighbors shall be tested like never before."
 arathor_restoration.0101.a: "[ROOT.Char.GetFaith.HighGodName] help us all..."
