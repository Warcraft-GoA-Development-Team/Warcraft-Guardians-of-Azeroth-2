  # Conquests of the Horde 
  ################################# 
  # First War 
  ### Northshire ### 
 wc_horde_invasion.9000.title: "Падение $c_northshire$"
 wc_horde_invasion.northshire.9000.title: "Последний бой за $c_northshire$"
 wc_horde_invasion.northshire.9000.desc: "Падение $c_northshire$ стало живым кошмаром. Земли вокруг полыхают, а наш народ безжалостно истребляют. Мы, горстка защитников, укрылись в аббатстве — нашем последнем оплоте.\n\nЗа забаррикадированными дверями слышим всё громче рев орков. Они вырвали из сада одно из священных [Glossary( 'древ-Holyoak', 'HOLYOAK_GLOSS' )] и превратили его в таран. Каждый их удар отзывается страхом у нас в груди. Наши молитвы тонут в коловращении битвы — в воплях умирающих и воинственных криках зелёнокожих.\n\nДверь начинает трещать и ломаться. Конец близок. Мы крепче сжимаем оружие, понимая, что, когда дубовая преграда рухнет, последние отблески света в $c_northshire$ угаснут."
 wc_horde_invasion.9000.desc: "Когда мы прорвали оборону $c_northshire$ и прилегающих земель, воины Орды погрузились в кровавое безумие. Прорванная брешь дала выход накопившейся ярости: всё вокруг рушат, жителей режут на месте.\n\nПоследнее убежище людей — аббатство. Когда наши окружили его, мы выдрали из сада древо, превратив его в таран. Грохот каждой атаки сливается с нашими боевыми кличами и криками ужаса изнутри. Доски трещат, щепки летят, и эта последняя преграда скоро рухнет.\n\nКак только двери окончательно поддадутся, туда ворвётся вся наша орда, чтобы окончательно добить последний оплот сопротивления в $c_northshire$."
 wc_horde_invasion.9000.a: "Лок’тар огар, за Орду!"
 wc_horde_invasion.9000.b: "За $c_northshire$! За $k_stormwind$!"
 wc_horde_invasion.9000.tooltip.b: "Когда враг у ворот, мы не дрогнем! С оружием в руках защитим $c_northshire$ и $k_stormwind$!"
 wc_horde_invasion.9001.title: "Разграбление $c_northshire$"
 wc_horde_invasion.9001.desc: "Теперь, когда $c_northshire$ в наших руках, отряды орков рыщут по округе, оставляя лишь пепелища. Дома разграблены, поля выжжены, а обитателей безжалостно истребляют. Стоит мне лишь решить, как поступить:\n\nМожно дать волю разъярённым громам, позволив им унести всё и уничтожить дотла. Тогда $c_northshire$ станет кровавым уроком всякому, кто вздумает бросить вызов Орде.\nИли же я могу приказать прекратить резню. Нужно будет казнить особо строптивых, чтобы навести дисциплину, зато город целым достанется мне как плацдарм для дальнейших завоеваний. Выбор за мной..."
 wc_horde_invasion.9001.a: "Пусть разносят всё!"
 wc_horde_invasion.9001.tooltip.a: "Орки пройдут по соседним графствам, сея опустошение и террор."
 wc_horde_invasion.9001.b: "Прекратите, болваны!"
 wc_horde_invasion.9001.tooltip.b: "Нельзя позволить разрушить всё дотла. Казним несогласных ради порядка."
  
 wc_horde_invasion.2203.desc: "Я выжил... несмотря ни на что... я выжил...\n\nЯ нервно оглядываюсь, проверяя, не преследует ли меня кто. Я продолжаю идти вперёд и долго-долго не останавливаюсь... этот Голос, что мной манипулировал... и этот проклятый орк...\n\nНаконец я останавливаюсь передохнуть после, как кажется, часов ходьбы и паранойи. Я делаю глубокий вдох и благодарю судьбу, что вообще сумел здесь оказаться... Мне придётся начать заново, и я не повторю тех же ошибок. Никогда, никогда больше."
  
