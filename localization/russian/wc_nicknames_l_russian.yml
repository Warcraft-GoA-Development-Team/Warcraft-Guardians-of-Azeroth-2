 nick_the_weaponmaster_desc: "Титул мастера оружия у жителей Азерота имеет множество толкований. Для [CHARACTER.GetShortUINameNoTooltipNoFormat|U] он означает, что оружие [CHARACTER.GetCulture.GetHeritage.GetName] беспрекословно подчиняется каждому [CharYourHerHis(CHARACTER)] приказу."
