l_russian:
  
 illidansbeginnings_0002_title: "Роковой Спаситель?"
 illidansbeginnings_0002_desc: "#help Это просто уведомление для игрока. Иллидан Ярость Бури собирается начать свой крестовый поход против Пылающего Легиона и его прислужников. Хотите ли вы сыграть за него?#!"
 illidansbeginnings_0002_a: "Скорбная Судьба?"
 illidansbeginnings_0002_a_tt: "#XB После начала игры за Иллидана вы не сможете играть за прежнего персонажа#!"
 illidansbeginnings_0002_b: "Я лучше пойду своим путём!"
  
 illidansbeginnings_0100_title: "Связанные кровью"
 illidansbeginnings_0100_desc: "Врата, что не пропускали даже свет в мою темницу, пали. Я ощущаю знакомое присутствие рядом, какое не чувствовал уже тысячи лет.\n\n«[illidan.GetFirstName]! Это ты?»\n\nЯ оборачиваюсь на голос и на существо, что подошло ко мне. «[tyrande.GetFirstName]... это твой голос! После стольких веков во тьме твой голос — как чистый лунный свет в моём разуме...»\n\n«Легион вернулся, [illidan.GetFirstName]. Твой народ вновь нуждается в тебе», — говорит [tyrande.GetFirstName] серьёзно, без тени лжи на [tyrande.GetHerHis] лице.\n\nЯ оборачиваюсь, размышляя о шансе не только вырваться из оков, но и доказать всем из прошлого, что они ошибались.\n\nЯ легко разбиваю решётки, державшие меня в темнице. «Потому что однажды я заботился о тебе, [tyrande.GetFirstName], я буду охотиться на демонов. Но я никогда не буду должен нашему народу!»\n\n[tyrande.GetFirstName], кажется, удовлетворена моим ответом: «Тогда поспешим на поверхность! Скверна демонов расползается с каждой потерянной секундой!»"
 illidansbeginnings_0100_a: "Время охоты!"
  
 illidansbeginnings_0101_title: "Судьба пламени и скорби"
 illidansbeginnings_0101_desc: "«Я свободен... после десяти тысяч лет... но мой собственный народ по-прежнему считает меня злодеем! Я покажу им свою истинную мощь! Я покажу, что демоны не властны надо мной!»\n\n«Ты в этом уверен, охотник? Уверен, что твоя воля принадлежит тебе?» Я оборачиваюсь и вижу человека, но не из тех пришельцев... от него разит смертью.\n\n«Ты пожалеешь, что подошёл ко мне, человек...» — бросаю я ему последнее предупреждение. Однако человек бросается на меня. Но в поединке я осознаю, что мы равны, и ни один из нас не может взять верх.\n\n«Мы могли бы продолжать вечно, чего же ты на самом деле хочешь, человек?» — спрашиваю я, когда дуэль на мгновение прерывается.\n\nЧеловек усмехается и продолжает: «Повелитель Ужаса, командующий нежитью в рядах Легиона, носит имя [tichondrius.GetFirstName]. Он владеет могущественным артефактом чернокнижника под названием #italic Череп Гул'дана#!. Именно он виновен в порче лесов Калимдора и ослаблении Ночных Эльфов».\n\nЯ не убеждён внезапным советом этого человека: «И ты хочешь, чтобы я его украл? Почему? Что тебе с того, человек?»\n\n«Скажем так, [tichondrius.GetFirstName] не вызывает у меня симпатии, а Господин, которому я служу, только выиграл бы от падения Легиона». Я не мог уловить лжи на мертвенно-бледном лице человека. Даже если у него нет причин мне помогать, в его взгляде сквозит отчаяние — он хочет, чтобы [tichondrius.GetFirstName] исчез навсегда.\n\n«Хм... считай, что сегодня твой счастливый день, человек... а теперь... прочь!»"
 illidansbeginnings_0101_a: "Время искать этот артефакт..."
 illidansbeginnings_0101_a_tt: "Потребуется время, чтобы отыскать #italic Череп Гул'дана#!"
  
 illidansbeginnings_0102_title: "Судьба пламени и скорби"
 illidansbeginnings_0102_desc: "Мы нашли его... #italic Череп Гул'дана#!.. Теперь хотя бы демоны больше не смогут осквернять леса. Но... если я уничтожу череп и присвою его силу, я стану могущественнее любого из лейтенантов [burning_legion|E]! Да... эта сила должна быть моей!\n\nЯ уничтожаю #italic Череп Гул'дана#! голыми руками и начинаю поглощать его мощь. Теперь я завершён!"
 illidansbeginnings_0102_a: "Время найти [tichondrius.GetFirstName]..."
  
 illidansbeginnings_0103_title: "Судьба пламени и скорби"
 illidansbeginnings_0103_desc: "Я приближаюсь к [tichondrius.GetFirstName] с обретённой мощью и обликом.\n\n[tichondrius.GetFirstName] готовится к бою со мной: «Что? Кто ты... такой?»\n\n«Хе-хе... посмотрим, насколько ты дерзок против равного себе, повелитель ужаса!»"
 illidansbeginnings_0103_a: "Я изгоню тебя, [tichondrius.GetFirstName]!"
 illidansbeginnings_0103_a_tt: "Вы будете биться с [tichondrius.GetFirstName] насмерть!"
  
 illidansbeginnings_0104_title: "Судьба пламени и скорби"
 illidansbeginnings_0104_desc: "Спустя несколько дней истребления затаившихся в лесах демонов ко мне подходит [tyrande.GetFirstName]: «Гнусный демон! Что ты сделал с [illidan.GetFirstName]?»\n\nЯ слегка улыбаюсь и отвечаю: «Это я, [tyrande.GetFirstName]... вот кем я стал...»\n[tyrande.GetFirstName] потрясена: «Что? [illidan.GetFirstName], как ты мог?»\nЯ указываю на лес, очищенный от порчи и свободный от демонов: «Предводитель тех легионов нежити уничтожен, леса со временем исцелятся».\n\n[tyrande.GetFirstName] приближается с разочарованным лицом: «Ценой твоей души? Убирайся прочь из этого места и наших древних земель... и никогда более не ступай сюда!»"
 illidansbeginnings_0104_a: "Да будет так... [tyrande.GetFirstName]..."
