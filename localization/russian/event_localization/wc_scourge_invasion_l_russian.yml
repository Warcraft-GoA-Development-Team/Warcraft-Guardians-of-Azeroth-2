l_russian:
 WCCSC_5_TITLE: "Ледяной Трон"
 WCCSC_5_DESC: "В этот день Нордскол погрузился во тьму. С небес обрушилась глыба неземного льда и закрепилась высоко в леднике Ледяной Короны. Те, кто видел это собственными глазами, дали ему название - Ледяной Трон. Огромный шпиль возвышается на всем сущим и бросает свою ужасную тень на свои новые владения. \n\nСлухи о существах, потерявших рассудок и мертвецах, восставших из своих могил как кровожадные монстры быстро заполонили ваши земли, сея панику и отчаяние. Страшная чума охватила вершину мира и именно вам предстоит защитить свой народ от этой нечестивой Плети."
 WCCSC_5_OPT_A_death: "В смерти все равны."
 WCCSC_5_OPT_A_legion: "Это твой последний шанс, [nerzhul.GetFirstName]. Служи или будешь уничтожен!"
 WCCSC_5_OPT_A_evil: "Смерть вступает в игру..."
 WCCSC_5_OPT_A_neutral: "[ROOT.Char.GetFaith.HighGodName|U], защити нас!"
 WCCSC_5_OPT_B: "Мы встанем на защиту против этой тьмы!"
  
 WCCSC_15_TITLE: "Тюремщики Проклятых"
 WCCSC_15_DESC: "«Ты решил, что достаточно умён, чтобы избавиться от нас, орк?» - спрашивает [scourge_jailor.GetFirstName]. В [scourge_jailor.GetHerHis] голосе явно прослеживается насмешка, пока [scourge_jailor.GetHerHis] пылающие глаза смотрят на вас. Вы чувствуете гнев и бессилие.\n\nПытаясь избавиться от одного из [scourge_jailor.GetHerHis] братьев, возможно вы сделали эту глупую ошибку из-за той темницы, в которую вас заточил Легион. Возможно вам стоило просто продолжить делать то, что велит Легион, но вы были бессильны. Пока это демоническое создание разносит на куски Ледяной Трон, вы размышляете над тем, как бы все сложилось, если бы вам удалось свершить задуманное..."
 RULKAN_OPT: "Рулкан, любовь моя, я иду к тебе..."
  
 WCCSC_20_DESC: "Восседая на вершине Ледяной Короны, где даже Свет не осмеливался явить себя, ты взирал на великие снежные просторы Нордскола, размышляя, пока твои бессмертные полчища прислужников столь покорно исполняли твой приказ.\n\nВнезапно холодный ветер донёс тихий шёпот. Перед твоим [Glossary('undead', 'UNDEAD_GLOSS')] существом стоял владыка ужаса с самодовольной усмешкой на [scourge_jailor.GetHerHis] лице; [scourge_jailor.GetHerHis] огненные глаза пронзали твою ледяную клетку: «Осталось мало времени, [ROOT.GetCharacter.GetFirstName]. У тебя есть лишь жалкие пять лет, чтобы исполнить свою роль». [scourge_jailor.GetSheHe] произнёс это, явно наслаждаясь мыслью о том, что [scourge_jailor.GetSheHe] сделает с тобой, если ты не оправдаешь ожиданий Легиона."
 WCCSC_20_OPT_A: "Я выполню то, что от меня требуется, [scourge_jailor.GetFirstName]."
  
 WCCSC_25_DESC: "«Будешь ли ты умолять о пощаде, орк? Мне так нравится, когда такие как ты просят пощады перед лицом неизбежной гибели.»\n\nПовелитель Ужаса упивается своей собственной силой и вашим отчаянием. Возвышаясь над вами, [scourge_jailor.GetSheHe] неустанно напоминает о том, что вам не удалось избавиться от н[scourge_jailor.GetHerHis] и [scourge_jailor.GetHerHis] собратьев. Вы потерпели неудачу. Вам не удалось избавиться от приспешников Кил'джедена, вы не смогли даже призвать Легион в Азерот.\n\nВы абсолютно бессильны, когда это демоническое существо разносит на куски вашу ледяную темницу. На краткий миг ваши мысли унеслись к Рулкан и Дренору, прежде, чем этот демон разорвало ваш шлем в клочья, оставив лишь пыль, развеянную по холодной ледяной пустоши..."
  
 WCCSC_30_DESC: "Наконец-то, свобода! После стольких лет гнёта своих демонических хозяев, вы наконец-то освободились, избавившись от этих надоедливых Повелителей Ужаса, служивших вам тюремщиками. Какая наглость со стороны Кил'джедена - думать, что эти слабаки-подхалимы сумеют удержать вас в подчинении.\n\nТеперь вы вольны свободны управлять ордами нежити, не опасаясь Легиона, идущего за вами по пятам. Мир содрогается от ледяных ветров, завывающих из Ледяной Короны, шепчущих ваше имя и приказы."
 LONG_LIVE_THE_KING_OPT: "Да здравствует [ROOT.GetCharacter.Custom('QueenKing')]!"
