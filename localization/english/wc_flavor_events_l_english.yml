l_english:
 # ============================================
 # MAIN EVENT
 # ============================================
 wc_flavor_events.0001.t:"A Tavern Meeting"
 wc_flavor_events.0001.desc:"The road has been long and weary. You stop at a modest tavern on the outskirts of a small village. The fire crackles, the ale is warm, and the locals mind their own business. But then, a hooded stranger slides onto the bench across from you. They seem to know who you are. Their voice is low, almost a whisper. 'You're the one they talk about,' they say. 'I have information that could change your fortunes.' The tavern fades into the background."
 
 
 wc_flavor_events.0001.desc.human:"\n Your human instincts tell you this stranger's tale is worth hearing. What do you do?!"
 wc_flavor_events.0001.desc.orc:"\n An orc never shies from a story—especially one that might lead to a fight. What do you do?!"
 wc_flavor_events.0001.desc.elf:"\n Your elven senses detect ancient magic lingering around this mysterious figure. What do you do?!"
 wc_flavor_events.0001.desc.undead:"\n The Forsaken have little to fear—you lean in, curious what this soul has to say. What do you do?!"
 wc_flavor_events.0001.desc.dwarf:"\n The promise of ale and adventure is enough to pique any dwarf's interest. What do you do?!"
 wc_flavor_events.0001.desc.goblin:"\n Your greedy little heart races at the thought of gold and opportunity. What do you do?!"
 wc_flavor_events.0001.desc.tauren:"\n The spirits guide your steps—you sense this stranger is connected to the earth. What do you do?!"
 wc_flavor_events.0001.desc.pandaren:"\n A good story is like fine brew—you're always ready to listen. What do you do?!"
 wc_flavor_events.0001.desc.dragon:"\n You have lived for eons—yet this mortal's tale piques your ancient curiosity. What do you do?!"
 wc_flavor_events.0001.desc.demon:"\n You sense fel magic and deception—but you are curious what this soul wants. What do you do?!"
 
 
 wc_flavor_events.0001.a:0 "Listen to the stranger"
 wc_flavor_events.0001.a.desc:"#weak Your curiosity gets the better of you. You motion for them to continue"
 
 
 wc_flavor_events.0001.b:0 "Ignore them and return to your drink"
 wc_flavor_events.0001.b.desc:"#weak You've met enough mysterious strangers on the road to know that most are nothing but trouble"
 
 
 wc_flavor_events.0001.success:"Valuable Information"
 wc_flavor_events.0001.gold:"A Few Coins"
 wc_flavor_events.0001.fight:"A Brawl Breaks Out"
 
 
 wc_flavor_events.0001.tt_rumors:"The stranger shares a rumor about townspeople"
 wc_flavor_events.0001.tt_gold:"The stranger's story turns out to be nothing special, but they are generous and slip you a few coins for your time"
 wc_flavor_events.0001.tt_fight:"The conversation takes a sour turn!"
 
 
 tavern_rumors:0 "Tavern Rumors"
 tavern_rumors_desc:"This character picked up useful gossip from the road"