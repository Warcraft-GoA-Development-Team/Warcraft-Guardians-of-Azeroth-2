 #Shatgral-Group Faiths
 twilights_hammer_cult:0 "Twilight's Hammer Cult"
 twilights_hammer_cult_adj:0 "Twilight"
 twilights_hammer_cult_adherent:0 "Twilight Cultist"
 twilights_hammer_cult_adherent_plural:0 "Twilight Cultists"
 twilights_hammer_cult_desc:0 "The Twilight's Hammer is an apocalyptic sect fanatically devoted to the Old Gods. Rejecting any notion of meaning in the universe, the cultists seek to hasten the world's destruction through violence to fulfill their dark prophecy, which promises them a place alongside their masters after the #italic Hour of Twilight#!."

 cthunism:0 "C'Thunism"
 cthunism_adj:0 "C'Thuni"
 cthunism_adherent:0 "C'Thuni"
 cthunism_adherent_plural:0 "C'Thunis"
 cthunism_desc:0 "C'Thun is the god of madness and chaos, and the most powerful of the Old Gods after Y'Shaarj's death. This infinitely malevolent entity embodies extreme brutality, favoring terrifying displays of force over subtlety. His Qiraji children reflect his nature, sowing destruction and madness wherever they tread."
 cthunism_divine_realm:0 "the Delirium Realm"
 cthunism_divine_realm_2:0 "$cthunism_divine_realm$" # Optional translation alt
 cthunism_divine_realm_3:0 "$cthunism_divine_realm$" # Optional translation alt
 cthunism_religious_text:0 "Prophecy of $shathgral_good_god_cthun$"
 cthunism_religious_text_2:0 "$cthunism_religious_text$"
 cthunism_religious_text_3:0 "$cthunism_religious_text$" # Optional translation alt

 yoggsaronism:0 "Yogg-Saronism"
 yoggsaronism_adj:0 "Yogg-Saroni"
 yoggsaronism_adherent:0 "Yogg-Saroni"
 yoggsaronism_adherent_plural:0 "Yogg-Saronis"
 yoggsaronism_desc:0 "Yogg-Saron is the god of death and fate. From his prison deep in the frozen north, he unleashed countless horrors upon Azeroth. His greatest triumph was the Curse of Flesh, which corrupted the titan-forged and bound them to mortality. To his followers, the flesh is no curse, but a sacred gift of transformation."
 yoggsaronism_divine_realm:0 "the Mind of $shathgral_good_god_yoggsaron$"
 yoggsaronism_divine_realm_2:0 "$yoggsaronism_divine_realm$" # Optional translation alt
 yoggsaronism_divine_realm_3:0 "$yoggsaronism_divine_realm$" # Optional translation alt
 yoggsaronism_religious_head_title_male:0 "Herald"
 yoggsaronism_religious_head_title_female:0 "$yoggsaronism_religious_head_title_male$"

 nzothism:0 "N'Zothism"
 nzothism_adj:0 "N'Zothi"
 nzothism_adherent:0 "N'Zothi"
 nzothism_adherent_plural:0 "N'Zothis"
 nzothism_desc:0 "N'Zoth is the weakest of the Old Gods, but his cunning and corruption make him the most devious. Known as the god of the deep, he was sealed after the death of Y'Shaarj in a prison now beneath the sea. From there, he continues to manipulate the world through whispers and deception, guiding his followers to embrace subterfuge and change."
 nzothism_divine_realm:0 "Visions of $shathgral_good_god_nzoth$"
 nzothism_divine_realm_2:0 "$nzothism_divine_realm$" # Optional translation alt
 nzothism_divine_realm_3:0 "$nzothism_divine_realm$" # Optional translation alt

 yshaarjism:0 "Y'Shaarjism"
 yshaarjism_adj:0 "Y'Shaarji"
 yshaarjism_adherent:0 "Y'Shaarji"
 yshaarjism_adherent_plural:0 "Y'Shaarjis"
 yshaarjism_desc:0 "Y'Shaarj was the most powerful and wicked of the Old Gods, known as the Beast of Seven Heads. Each head embodied one of his aspects: Anger, Hatred, Violence, Fear, Doubt, Despair, and Pride. When Aman'Thul tore him from Azeroth, the world itself was wounded. With his dying breath, he unleashed the Sha, malevolent echoes of his dark essence."
 yshaarjism_divine_realm:0 "the Realm of $shathgral_good_god_yshaarj$"
 yshaarjism_divine_realm_2:0 "the Heart's Abyss" # Optional translation alt
 yshaarjism_divine_realm_3:0 "$yshaarjism_divine_realm$" # Optional translation alt

 ghuunism:0 "G'huunism"
 ghuunism_adj:0 "G'huuni"
 ghuunism_adherent:0 "G'huuni"
 ghuunism_adherent_plural:0 "G'huunis"
 ghuunism_desc:0 "G'huun is the god of blood and rot. Unlike the other Old Gods, he was not born of the Void, but accidentally created by the Titans while they sought a way to destroy his kin. He scorns technology, drawing his followers into a primitive state of bloodshed and decay. Those touched by his corruption are regarded as his beloved children."
 ghuunism_good_god_ghuun:0 "G'huun"
 ghuunism_good_god_ghuun_possessive:0 "G'huun's"
 ghuunism_good_god_ghuun_alternate:0 "The Blood God"
 ghuunism_good_god_ghuun_alternate_possessive:0 "The Blood God's"
 ghuunism_divine_realm:0 "the Underrot"
 ghuunism_divine_realm_2:0 "$ghuunism_divine_realm$" # Optional translation alt
 ghuunism_divine_realm_3:0 "$ghuunism_divine_realm$" # Optional translation alt

