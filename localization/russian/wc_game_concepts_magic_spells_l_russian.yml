 wc_spell_malevolence_effects: "Даёт [GetModifier( 'wc_malevolence_modifier' ).GetNameWithTooltip|L]. Пока он действует, каждое вредоносное заклинание, сотворённое вами или вашим призывом, имеет 50% шанс нанести или усугубить цели [wc_injury_burned|E], а также 5% шанс её гибели.\n\nЕсли вредоносное заклинание сотворено на армию, армия теряет войска в зависимости от вашей [wc_spell_power|E], а полководец имеет шанс получить тяжёлое [wc_curse].\n\nЕсли заклинание сотворено на [title|E], оно потеряет [development|E] и имеет шанс потерять [control|E], также в зависимости от вашей [wc_spell_power|E]."
 wc_learn_spell_malevolence: "Вы изучаете [wc_spell_malevolence|E]"

