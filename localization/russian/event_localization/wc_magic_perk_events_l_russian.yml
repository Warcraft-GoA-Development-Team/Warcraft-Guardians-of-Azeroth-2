l_russian:
 magic_perk.0001.title: "Чародейский интеллект"
 magic_perk.0001.desc: "Пока вы каналируете тайную энергию, ваш разум обостряется, и перед вами распахиваются новые возможности.\n\nКакой путь вы усилите — способность влиять на других, повелевать с властью, управлять ресурсами, распутывать тайны или углублять познания? Магия гудит в ваших жилах, готовая усилить выбранное умение.\n\nРешение за вами."
 magic_perk.0001.a: "Дипломатия"
 magic_perk.0001.b: "Военное дело"
 magic_perk.0001.c: "Управление"
 magic_perk.0001.d: "Интрига"
 magic_perk.0001.e: "Учёность"

 magic_perk.0002.title: "Святая Аура"
 magic_perk.0002.desc: "Ваша служба в качестве агента Света не осталась незамеченной. Божественная энергия, текущая в вас, стала сильнее, и вы чувствуете, как она исходит от самого вашего существа.\n\nКакую грань вашей веры вы усилите — способность исцелять, карать нечестивых, защищать невинных, вдохновлять верующих или углублять понимание божественного? Сила Света в вашей власти.\n\nИспользуете ли вы силу святой магии ради..."
 magic_perk.0002.devotion: "Защиты?"
 magic_perk.0002.retribution: "Возмездия?"
 magic_perk.0002.retribution_tooltip: "Когда на вас направляют враждебное заклинание, а также когда умирает близкий или дальний член семьи, вы получаете [GetModifier('wc_retribution_aura_modifier').GetNameWithTooltip] на 6 месяцев."
 magic_perk.0002.concentration: "Сосредоточения?"
 magic_perk.0002.vengeance: "Гнева?"
 wc_holy_aura_tooltip: "#P Вы выберете путь для усиления вашей святой магии.#!"
 wc_retribution_aura_title: "Аура Возмездия активирована!"
 wc_vengeance_aura_title: "Аура Мести активирована!"


 magic_perk.0010.title: "Водная Щедрость"
 magic_perk.0010.desc: "Пока вы плетёте элементальные силы водной магии, в вашем разуме вспыхивают видения процветания. Побережья мерцают возможностями: их гавани полны богатств, а реки вьются по плодородным землям, обещая изобилие тем, кто от них зависит.\n\nНаправить ли щедрость вод на оживлённые берега, укрепляя прибрежную торговлю, или на речные земли, взращивая сердце страны? Потенциал заклинания бурлит в вас — приливная сила, ждущая вашей команды."
 magic_perk.0010.coastal: "Побережья получат эту щедрость"
 magic_perk.0010.coastal.effect: "[targets_size|P0] [provinces|E] навсегда получают [GetModifier('wc_aquatic_bounty_coastal_modifier').GetNameWithTooltip]"
 magic_perk.0010.riverside: "Внутренние земли нуждаются в ней больше"
 magic_perk.0010.riverside.effect: "[targets_size|P0] [provinces|E] навсегда получают [GetModifier('wc_aquatic_bounty_riverside_modifier').GetNameWithTooltip]"

 magic_perk.0020.title: "Спячка"
 magic_perk.0020.desc: "Вы черпаете магию: успокаивающее тепло окутывает ваше тело, притупляя боль и замедляя дыхание. Заклинание берёт верх, медленно затягивая раны и очищая кровь от яда.\n\nВремя замирает в неподвижности, и вы дрейфуете в пустоту, пока вас убаюкивают объятия магии. Когда вы пробудитесь, к вам вернутся сила и жизненная энергия, а тело обновится благодаря могуществу заклинания."
 magic_perk.0020.a: "Так... хочется спать..."

 magic_perk.0021.title: "Спячка: Пробуждение"
 magic_perk.0021.desc: "Чувства медленно возвращаются, когда вы пробуждаетесь из глубин спячки. Сила струится по вашим конечностям, а боль, некогда сковывавшая тело, исчезла. Раны затянуты, дыхание ровное и полное.\n\nВоздух кажется свежим и новым, а мир — нетронутым течением времени. Вы поднимаетесь, полные сил; магия завершила свою работу. Жизненная сила вернулась, а с ней — обещание грядущего."
 magic_perk.0021.a: "Я снова бодрствую"
