 game_concept_wc_spell_voidborne: "Рождённый Бездной"
 game_concept_wc_spell_voidborne_desc: "Отправьте врагов в глубины Круговерти Пустоты, вытягивая их энергию, пока они томятся в темнице, — но за определённую цену."
 wc_spell_voidborne_targets: "[character|E]"
 wc_spell_voidborne_type: "[wc_spell_type_attack|E]"
 wc_spell_voidborne_effects: "Даёт [GetModifier( 'wc_voidborne_modifier' ).GetNameWithTooltip|L], дарящий силу, но и оставляющий вас уязвимым. Вы вытягиваете часть [prowess|E] цели, присваивая её себе. Вы также получаете иные дары в зависимости от доблести цели. Ваши [diplomacy|E], эффективность снижения [stress|E] и [opinion|E] уменьшаются пропорционально доблести цели. Пока ваша цель находится в Круговерти Пустоты, у неё появятся варианты попытаться навредить вам оттуда. Каждые 3 месяца цель имеет 50% шанс вернуться в Азерот, и когда это произойдёт, вы перестаёте быть Рождённым Бездной. Вы можете выбрать одну и ту же цель лишь раз в 25 лет."
 wc_learn_spell_voidborne: "Вы изучаете заклинание: [wc_spell_voidborne|E]"
 wc_voidborne_hit_tt: "[this_recipient.GetShortUIName|U] [Select_CString(this_recipient.IsLocalPlayer, 'получаете', 'получает')] эффекты заклинания [wc_spell_voidborne|E]."
 wc_voidborne_resist_tt: "Из-за [wc_spell_school_shadow|E] [wc_magic_resistance|E] [this_recipient.GetShortUINamePossessive] заклинание не возымело эффекта."
 wc_voidborne_dodge: "[this_recipient.GetShortUIName|U] уклоняется от $game_concept_wc_spell_voidborne$!"
 wc_from_voidborne_target: "База, без цели [wc_spell_voidborne|E]"

