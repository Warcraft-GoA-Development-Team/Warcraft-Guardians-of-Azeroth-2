l_french:
 bm_the_invasion_from_draenor:0 "L'Invasion de Draenor"
 bm_the_invasion_from_draenor_desc:1 "Des années après la fin de la guerre Gurubashi, une nouvelle menace de guerre pèse sur Azeroth. La Porte des Ténèbres, faille entre les mondes d'Azeroth et de Draenor, a été secrètement ouverte dans le Noir Marécage à l'est du royaume  et à travers elle est apparue la Horde des Orcs, venue revendiquer la planète pour elle-même.\n\n L'ambitieux chef de guerre de la Horde, Main-Noire, se prépare à une campagne éclatante pour ajouter un deuxième monde à son palmarès de conquête. \nDes minorités d'orcs, comme le clan des Loups de Givre du noble chef Durotan, refusent de suivre la voie destructrice de Main-Noire et ne souhaitent que fuir leur monde mourant. Quelles que soient leurs motivations, cela ne change rien pour le roi Llane et les humains de Hurlevent qui se battront jusqu'à la mort pour défendre leur patrie.\n\n Mais il ne s'agit pas seulement d'une histoire de rois et de chefs de guerre, car, à l'insu des deux camps, la guerre est une partie d'échecs entre des maîtres sorciers et de leurs mystérieux desseins. L'humain Medivh et l'orc Gul'Dan ont ouvert la Porte des Ténèbres pour des raisons qui leur sont propres et ils n'ont pas encore révélé tous leurs plans.\n\n La Horde plongera-t-elle Azeroth dans un bain de sang sans fin ? Les orcs trouveront-ils un nouveau monde à habiter, ou seront-ils repoussés vers Draenor ? Quels sombres projets attendent de s'abattre sur le monde ?"
 llane_wrynn_character:0 "Roi Llane"
 llane_wrynn_character_desc:0 "Roi chevalier, Llane a été élevé dans les liens de la fraternité avec ses amis proches, le chevalier-champion Anduin Lothar et Medivh, le Gardien. Aux côtés de ses amis et conseillers, le jeune roi a vaincu les trolls qui ont tué son père pendant la guerre de Gurubashi. Llane s'est montré fidèle à l'héritage de la dynastie Wrynn et son royaume est désormais à son apogée. Avec l'invasion imminente de Draenor, Llane doit maintenant faire face à une menace plus terrible qu'aucune de celles que ses ancêtres ont jamais affronté. La guerre qui s'annonce risque d'anéantir le peuple et l'héritage de Llane, mais s'il réussit, il restera dans les mémoires comme le plus grand de tous les rois. Ses amis pourront-ils l'aider à repousser les ténèbres qui s'abattent sur lui ?"
 varian_character_583:0 "Prince Varian"
 medivh_character:0 "Gardien Medivh"
 medivh_character_desc:0 "Fils du conjurateur de la cour de Hurlevent et d'Aegwyn la gardienne de Tirisfal, Medivh est le plus grand descendant d'une lignée de lanceurs de sorts. Il est devenu le héros du royaume pendant la guerre des Gurubashi et s'est attaché au roi Llane. Ayant succédé à sa mère en tant que Gardien, Medivh est peut-être le mage mortel le plus puissant du monde. Sa tâche ultime est de protéger Azeroth des menaces les plus graves. Cependant, il n'a pas été vu en dehors de sa propre seigneurie de Karazhan depuis quelques temps. Beaucoup se demandent ce qui occupe le Gardien. Medivh sera-t-il capable de sauver Hurlevent une fois de plus ? A-t-il un autre plan ? Quel sort attend la tour de Karazhan au milieu de la guerre à venir ?"
 blackhand_character:0 "Chef de Guerre Main-Noire"
 blackhand_character_desc:0 "Force de la nature dont les prouesses militaires lui ont valu le surnom de \"destructeur\", Main-Noire est le chef du clan Rochenoire, le plus puissant de la Horde. Ces deux raisons lui ont valu d'être choisi par ses pairs chefs et par l'influent démoniste Gul'Dan pour devenir le chef de guerre de la Horde et le suzerain militaire des orcs unis. Avec Draenor conquise mais la Horde affamée de combats et de ressources, Main-Noire est fier de mener ses guerriers à la conquête d'Azeroth. Il cherche à la fois de nouvelles terres à gouverner et à asseoir sa position de seul vrai maître des orcs malgré la volonté de chefs idéalistes, de commandants ambitieux et de démonistes intrigants. Main-Noire mettra-t-il Azeroth à genoux et trouvera-t-il la gloire en tant que chef incontesté de la Horde ? Les humains ou les conflits internes à la Horde mettront-ils fin à l'ambition du chef de guerre ? Quoi qu'il arrive, le sang coulera..."
 dalrend_character_583:0 "Chef Dal'rend"
 guldan_character:0 "Gul'dan"
 guldan_character_desc:1 "Né infirme et paria, Gul'Dan était déterminé à ne pas laisser cela l'arrêter dans sa quête de grandeur. Autrefois apprenti du vieux chaman Ner'Zhul, chef spirituel des orcs, Gul'Dan le remplaça et introduisit une nouvelle voie magique, l'art des démonistes. Gul'Dan a rassemblé les clans au sein de la Horde et sa magie les a conduits sur Azeroth à travers la Porte des Ténèbres, mais il n'était ni chef ni guerrier et devait partager le pouvoir avec une figure de proue plus belliqueuse en la personne du chef de guerre Main-Noire. Tant qu'il sera coopératif, Main-Noire pourra jouer avec ses petits soldats, car un plus grand destin attend le démoniste. Gul'Dan parviendra-t-il à contrôler directement la Horde ? La fierté du chef de guerre sera-t-elle un obstacle à l'ambition du sorcier ? Les pouvoirs que Gul'Dan convoitent sur Azeroth le mèneront-ils à sa perte ?"
 durotan_character:0 "Chef Durotan"
 durotan_character_desc:0 "Fils et successeur du sage Garad, Durotan est à la tête du clan Loup-de-Givre. Lui et son clan préfèrent suivre l'ancienne voie et seraient restés en réclusion pacifique s'ils n'avaient pas été forcés de rejoindre la Horde pour survivre. Opposé à la sombre voie des démonistes et des bellicistes de la Horde, Durotan croit toujours que les orcs ont besoin d'échapper au désert stérile qu'est devenu Draenor, et il sait que s'opposer directement à Main-Noire et Gul'Dan pourrait mettre son peuple en danger... Durotan épargnera-t-il à son clan la damnation de la Horde ? Son peuple succombera-t-il à la corruption ? Assistera-t-il à la défaite de la Horde face aux humains ?"
 thrall_character_583:0 "Go'el"
 draka_character:0 "Draka"
 orgrim_character:0 "Orgrim"
 bm_invasion_from_draenor_northern_ek:0 "Habitants d'Azeroth"
 bm_invasion_from_draenor_northern_ek_desc:0 "Alors que la guerre fait rage au sud des Royaumes de l’Est, de nombreux Azerothiens de toutes confessions doivent réfléchir à cette nouvelle menace, car les humains de Hurlevent ne sont pas les seuls à devoir faire face aux conséquences de cette invasion.\n\n Tout en menant leurs propres combats, les dirigeants de royaumes puissants et anciens doivent décider s'ils vont s'opposer à ces envahisseurs, ou même s'allier à eux. Le destin d'Azeroth est entre leurs mains, et ils doivent faire le bon choix.\n\n#bold  Les humains de Hurlevent trouveront-ils des alliés dans cette période sombre ? La Horde trouvera-t-elle de nouveaux alliés dans sa quête de conquête ? De nouvelles puissances émergeront-elles de cette crise ?#!"
 magni_character:0 "Roi Magni"
 magni_character_desc:0 "The Kingdom of Ironforge has been at the behest of the Bronzebeards for centuries, and King Magni is no exception. A wise and just ruler, Magni has seen his kingdom prosper under his rule. However, the invasion from Draenor has put his kingdom in danger, but he is not without his own struggles. His only heir is his daughter, Moira, leaving the future of his lineage in question.\n\n#bold Will the dwarven people stand with their southern allies, or will they forge their own path?#!"
 moira_character:0 "Princess Moira"
 millhouse_character:0 "Maître Milhouse"
 millhouse_character_desc:0 "An ambitious and cunning mage, Millhouse and his wife Milificent who he both loves and hates have been on a quest for knowledge for years. When his father was imprisoned in the Twisting Nether due to threatening the fate of the world, Milhouse saw this as a wakeup call for him to seek knowledge far beyond Dalaran.\n\n#bold Will his quest for knowledge and power bear fruit or will his reckless ambition be his undoing?#!"
 milificent_character:0 "Milificent"
 magnus_character:0 "Magnus"
 terenas_character:0 "High King Terenas"
 terenas_character_desc:0 "Lordaeron has been a stronghold in the human world for centures, and their King Terenas, is one to behold. People write songs of his wisdom and his kindness, and the loyalty they have for him is unmatched.\n\nThough sharing the same tongue and flesh, human kingdoms have been divided for longer than anyone can remember. As the Orcish invasion threaten the fate of the world, the High King must decide whether to unite with his human bretheren once more.\n\n#bold Can Lordaeron meet the challenge of the horde, or will it simply become a refuge for the fleeing?#!"
 arthas_character_583:0 "Prince Arthas"
 elisande_character:0 "Grand Magistrix Elisande"
 elisande_character_desc:0 "Having ruled the Nightborne for thousands of years, Elisande is no force to be reckoned with. Her people resent her for her decision against the nightfallen, her reasons are unbeknownst to all. With her strong will to ensure Shal'dorei's survival, Elisande must ponder the coming threat to the east.\n\n#Bold Isolated for so long, will the Nightborne finally join the world in the fight against the Horde, or will they remain in their arcane haven?#!"
 danath_character:0 "Sir Danath"
 danath_character_desc:0 "The nephew of the King Thoras, and a member of the Trollbane dynasty, Danath was practically born with a sword in hand. He has been a loyal servant to the King, and has been a great asset to the kingdom of Stromgarde. Though far from home, the coming invasion threatens the very existence of his people.\n\n#bold Will Danath stay in Stromgarde to protect his home, or find his legacy elsewhere?#!"
 thoras_character:0 "King Thoras"
 bm_invasion_from_draenor_kalimdor:0 "Land of Eternal Starlight"
 bm_invasion_from_draenor_kalimdor_desc:0 "Kalimdor, once the name of the entirety of what is known known as Azeroth, is considered by some to be the most diverse continent on Azeroth. Containing vast forests, plots of rolling hills, and the hottest oases, any who travels here will find themselves immersed in many different landscapes.\n\nPrimarily ruled by the noble and wise Night Elves, smaller powers are beginning to come into play. With war being waged accross the sea in the Eastern Kingdoms, many have begun to seek refuge in these ancient lands.\n\n#bold Will the War in the East change the fate of Kalimdor, or will something else disturbe its peace?#!"
 tyrande_character_583:0 "$tyrande_character$"
 malfurion_character_583:0 "$malfurion_character$"
 BOOKMARK_RELATION_HUSBAND:0 "(Husband)"
 tyrande_character_583_desc:0 "Tyrande Whisperwind is the High Priestess of Elune, protector of the night elves and sacred guardian of Ashenvale. Devoted to her duties toward her people and her goddess, she safeguards the ancient traditions and defends the ancestral lands of Kalimdor. Independent and resolute, Tyrande embodies the wisdom and strength of her people, always ready to rise against any threat to the sacred forests of the night elves.\n\n#bold Guided by Elune's light, will Tyrande be able to preserve her people's peace, or will she be forced to take up arms to defend them?#!"
 aziypto_character:0 "Aziypto"
 aziypto_character_desc: "L'âge d'or de Zul'Farrak est révolu, et le roi Aziypto en ressent le poids. Petit-fils du légendaire « Chacal », Aziypto règne désormais sur un royaume en déclin, jadis glorieux sous le règne de son grand-père.\n\n Jadis cœur battant de Tanaris, Zul'Farrak n'est plus que l'ombre de lui-même : les ennemis se multiplient et leurs loas assoiffés de sang grondent de mécontentement.\n\n#bold Aziypto se bat pour préserver ce qui reste de l'héritage de sa tribu. Trouvera-t-il la force de restaurer la puissance des furie-des-sables et ainsi mériter le titre de « Chacal » ?#!\""
 mikloc_character:0 "Overseer Mikloc"
 mikloc_character_desc:0 "The Satyr Lord Mikloc has ruled the southern branch of Azshara Bay for 10,000 years. As charismatic as he is cunning, his legendary beauty earned him the nickname \"the Incubus,\" making him an ideal accomplice in the Legion's schemes within the ancient Kaldorei Empire, long before his transformation into a satyr.\n\nThus, he delivered the demon Immol'thar to Prince Tortheldrin, providing the Shen’dralar with a corrupted source of magic since the fall of the Well of Eternity.\n\n#bold Will the night elves put an end to Mikloc's machinations, or will the Incubus further consolidate his corrupt reign?#!"
 thortheldrin_character:0 "Prince Thortheldrin"
 thortheldrin_character_desc:0 "Tortheldrin is the prince of Eldre'thalas and a former loyal vassal of Queen Azshara. After the destruction of the Well of Eternity, he maintained control over these lands by imprisoning the demon Immol'thar, allowing his people to siphon its essence to quench their thirst for magic.\n\nBut this power inevitably waned, and Tortheldrin’s true nature was revealed: to prolong his rule, he ordered the execution of his own subjects, keeping only his most loyal followers.\n\n#bold Tortheldrin’s lands are now in decline. Will the Shen’dralar find a way to survive, or join their many fallen kin?#!"