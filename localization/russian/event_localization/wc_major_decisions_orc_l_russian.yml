l_russian:
  
 # Reforming the Orcish Horde decision 
  
 wc_reform_the_orcish_horde.0001.title: "Воспоминания"
 wc_reform_the_orcish_horde.0001.azeroth.desc: "Многие наши собратья-орки лишились своих домов и земель в Азероте из-за падения Чёрнорука и его тирании. Орки по всему Азероту страдали от унижений, что принёс Закон Альянса об интернировании.\n\nТам, где вожди прошлого потерпели неудачу, преуспею я. Как вождь [horde_invaders|E], я заставлю весь Азерот склониться предо мной!"
 wc_reform_the_orcish_horde.0001.kalimdor.desc: "Мы слишком долго терпели этих тварей на Калимдоре! Хватит!\n\nНикакой пощады тем, кто противостоит нам или даже просто угрожает нашему новому дому. Эти земли по праву наши, и эти твари склонятся перед нами или погибнут!"
 wc_reform_the_orcish_horde.0001.a: "Лок'тар Огар!"
 wc_reform_the_orcish_horde.0001.a.tt: "Вы становитесь лидером [horde_invaders|E]"
  
 # Building Orgrimmar 
  
 orgrimmar.0001.title: "Новый дом, новая надежда"
 orgrimmar.0001.desc: "Годы упорного труда наконец принесли плоды. Наша новая столица высится, бросая вызов безнадёжности.\n\nМы назовём её Оргриммар, в честь величайшего Вождя Орды."
 orgrimmar.0001.a: "За Дуумхаммер! За Орду!"
