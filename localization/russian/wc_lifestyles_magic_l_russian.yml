l_russian:
 light_magic_lifestyle_name: "Магия Света"
 shadow_magic_lifestyle_name: "Магия Тьмы"
 disorder_magic_lifestyle_name: "Магия Скверны"
 order_magic_lifestyle_name: "Тайная Магия"
 life_magic_lifestyle_name: "Магия Природы"
 death_magic_lifestyle_name: "Магия Смерти"
 elemental_fire_magic_lifestyle_name: "Магия Огня"
 elemental_water_magic_lifestyle_name: "Магия Воды"
 elemental_air_magic_lifestyle_name: "Магия Воздуха"
 elemental_earth_magic_lifestyle_name: "Магия Земли"

 light_magic_lifestyle_desc: "Сосредоточьтесь на Свете — безбрежном море живой энергии, разлившейся по всему сущему и не скованной ни временем, ни пространством."
 shadow_magic_lifestyle_desc: "Сосредоточьтесь на Тьме — тёмной вампирической силе, что стремится поглотить всю энергию, обратив творение внутрь себя, чтобы пожрать само себя."
 disorder_magic_lifestyle_desc: "Сосредоточьтесь на Скверне — разрушительной, жестокой и крайне затягивающей энергии, что питается, вытягивая жизнь из живых существ."
 order_magic_lifestyle_desc: "Сосредоточьтесь на уравновешивании приливов и отливов Тайной магии — изначально нестабильной, концентрированной чистой энергии."
 life_magic_lifestyle_desc: "Сосредоточьтесь на обуздании великой силы Жизни — сущности и душ всего живого."
 death_magic_lifestyle_desc: "Сосредоточьтесь на управлении силой Смерти — неотвратимой силой, что сеет отчаяние в смертных сердцах и толкает всё сущее к энтропийному распаду и грядущему забвению."
 elemental_fire_magic_lifestyle_desc: "Сосредоточьтесь на магии огня и лавы."
 elemental_water_magic_lifestyle_desc: "Сосредоточьтесь на магии воды и льда."
 elemental_air_magic_lifestyle_desc: "Сосредоточьтесь на магии воздуха и молний."
 elemental_earth_magic_lifestyle_desc: "Сосредоточьтесь на магии земли и камня."

 wc_lifestyle_highlight_magic_good_1_percentage_line: "[EmptyScope.ScriptValue('wc_magic_good_1_xp_gain_mult_value')|%+0]"
 wc_lifestyle_highlight_magic_good_2_percentage_line: "[EmptyScope.ScriptValue('wc_magic_good_2_xp_gain_mult_value')|%+0]"
 wc_lifestyle_highlight_magic_good_3_percentage_line: "[EmptyScope.ScriptValue('wc_magic_good_3_xp_gain_mult_value')|%+0]"
 wc_lifestyle_highlight_magic_good_noninheritable_percentage_line: "[EmptyScope.ScriptValue('wc_magic_good_noninheritable_xp_gain_mult_value')|%+0]"

 light_magic_lifestyle_highlight_desc: "Благодаря тому, что вы — [GetPlayer.Custom('GetWCMagicalLifestyleHighlightTrait')], вы получаете на [GetPlayer.Custom('GetWCMagicalLifestyleHighlightPercentage')] больше [experience|E] в этом образе жизни."
 shadow_magic_lifestyle_highlight_desc: "$light_magic_lifestyle_highlight_desc$"
 disorder_magic_lifestyle_highlight_desc: "$light_magic_lifestyle_highlight_desc$"
 order_magic_lifestyle_highlight_desc: "$light_magic_lifestyle_highlight_desc$"
 life_magic_lifestyle_highlight_desc: "$light_magic_lifestyle_highlight_desc$"
 death_magic_lifestyle_highlight_desc: "$light_magic_lifestyle_highlight_desc$"
 elemental_fire_magic_lifestyle_highlight_desc: "$light_magic_lifestyle_highlight_desc$"
 elemental_water_magic_lifestyle_highlight_desc: "$light_magic_lifestyle_highlight_desc$"
 elemental_air_magic_lifestyle_highlight_desc: "$light_magic_lifestyle_highlight_desc$"
 elemental_earth_magic_lifestyle_highlight_desc: "$light_magic_lifestyle_highlight_desc$"

 light_magic_focus_1: "Фокус: Героизм"
 light_magic_focus_1_desc: "Искореняйте зло в самых тёмных уголках мира, карая его священной яростью."
 light_magic_focus_1_effect_desc: "Сосредоточившись на Героизме, вы получаете:"
 light_magic_focus_2: "Фокус: Справедливость"
 light_magic_focus_2_desc: "Несите справедливость обиженным и ведите людей в трудные времена."
 light_magic_focus_2_effect_desc: "Сосредоточившись на Справедливости, вы получаете:"
 light_magic_focus_3: "Фокус: Защита"
 light_magic_focus_3_desc: "Защищайте слабых и исцеляйте больных."
 light_magic_focus_3_effect_desc: "Сосредоточившись на Защите, вы получаете:"

 shadow_magic_focus_1: "Фокус: Ужас"
 shadow_magic_focus_1_desc: "Вглядывайтесь в Бездну без колебаний, извлекая оттуда всевозможные мерзости."
 shadow_magic_focus_1_effect_desc: "Сосредоточившись на Ужасе, вы получаете:"
 shadow_magic_focus_2: "Фокус: Мутация"
 shadow_magic_focus_2_desc: "Плоть — это дар. Примите его и обретёте силу, что выше любой формы."
 shadow_magic_focus_2_effect_desc: "Сосредоточившись на Мутации, вы получаете:"
 shadow_magic_focus_3: "Фокус: Безумие"
 shadow_magic_focus_3_desc: "По-настоящему постичь зловещую магию Тьмы и устрашающую магию Бездны — значит сойти с ума."
 shadow_magic_focus_3_effect_desc: "Сосредоточившись на Безумии, вы получаете:"

 disorder_magic_focus_1: "Фокус: Колдовство"
 disorder_magic_focus_1_desc: "Жертвенная магия разъедает и пожирает всё, если не сдерживать тягу к ней."
 disorder_magic_focus_1_effect_desc: "Сосредоточившись на Колдовстве, вы получаете:"
 disorder_magic_focus_2: "Фокус: Разрушение"
 disorder_magic_focus_2_desc: "Запретное колдовство, сеющее хаос среди врагов заклинаниями чистой скверны."
 disorder_magic_focus_2_effect_desc: "Сосредоточившись на Разрушении, вы получаете:"
 disorder_magic_focus_3: "Фокус: Демонология"
 disorder_magic_focus_3_desc: "Обретите безраздельную власть над устрашающими демоническими силами."
 disorder_magic_focus_3_effect_desc: "Сосредоточившись на Демонологии, вы получаете:"

 order_magic_focus_1: "Фокус: Созидание"
 order_magic_focus_1_desc: "Владейте орудиями созидания, чтобы творить материю и энергию из ничего."
 order_magic_focus_1_effect_desc: "Сосредоточившись на Созидании, вы получаете:\n- Возможность получать умения пиромантии и криомантии (после получения умения «Элементальный синтез»)"
 order_magic_focus_2: "Фокус: Изменение"
 order_magic_focus_2_desc: "Изменяйте саму ткань реальности, превращая рычащих врагов в безобидных овец или даже искажая само время."
 order_magic_focus_2_effect_desc: "Сосредоточившись на Изменении, вы получаете:"
 order_magic_focus_3: "Фокус: Чары"
 order_magic_focus_3_desc: "Помогайте союзникам, оттачивая их разум и оружие."
 order_magic_focus_3_effect_desc: "Сосредоточившись на Чарах, вы получаете:"

 life_magic_focus_1: "Фокус: Дикость"
 life_magic_focus_1_desc: "Смерть — часть круговорота, что поддерживает жизнь, а природа — вечный танец хищника и жертвы."
 life_magic_focus_1_effect_desc: "Сосредоточившись на Дикости, вы получаете:"
 life_magic_focus_2: "Фокус: Выживание"
 life_magic_focus_2_desc: "На суше или в море, в цветущих джунглях или в безжизненной пустыне жизнь упорно противостоит невзгодам."
 life_magic_focus_2_effect_desc: "Сосредоточившись на Выживании, вы получаете:"
 life_magic_focus_3: "Фокус: Гармония"
 life_magic_focus_3_desc: "Где есть разложение — несите обновление. Дары природы порой нужно воздавать ей обратно."
 life_magic_focus_3_effect_desc: "Сосредоточившись на Гармонии, вы получаете:"

 death_magic_focus_1: "Фокус: Некромантия"
 death_magic_focus_1_desc: "Оскверняйте жизнь, поднимая нечестивых прислужников из-под земли."
 death_magic_focus_1_effect_desc: "Сосредоточившись на Некромантии, вы получаете:"
 death_magic_focus_2: "Фокус: Чума"
 death_magic_focus_2_desc: "Воплотите вечно разъедающую природу чумы и обрушьте мор, что погубит врагов."
 death_magic_focus_2_effect_desc: "Сосредоточившись на Чуме, вы получаете:"
 death_magic_focus_3: "Фокус: Вампиризм"
 death_magic_focus_3_desc: "Вгрызайтесь в кровь и кости живых, чтобы преступить сами законы смертности."
 death_magic_focus_3_effect_desc: "Сосредоточившись на Вампиризме, вы получаете:"

 elemental_fire_magic_focus_1: "Фокус: Пиромантия"
 elemental_fire_magic_focus_1_desc: "Общайтесь напрямую с буйной стихией, чтобы принести равновесие."
 elemental_fire_magic_focus_1_effect_desc: "Сосредоточившись на Пиромантии, вы получаете:"
 elemental_fire_magic_focus_2: "Фокус: Пирософия"
 elemental_fire_magic_focus_2_desc: "Прикоснитесь к сырой силе, что отнюдь не благожелательна."
 elemental_fire_magic_focus_2_effect_desc: "Сосредоточившись на Пирософии, вы получаете:"
 elemental_fire_magic_focus_3: "Фокус: Пиротеургия"
 elemental_fire_magic_focus_3_desc: "Свяжите стихию своей волей, обратив её в рабство и обуздав её первобытную ярость."
 elemental_fire_magic_focus_3_effect_desc: "Сосредоточившись на Пиротеургии, вы получаете:"

 elemental_water_magic_focus_1: "Фокус: Гидромантия"
 elemental_water_magic_focus_1_desc: "$elemental_fire_magic_focus_1_desc$"
 elemental_water_magic_focus_1_effect_desc: "Сосредоточившись на Гидромантии, вы получаете:"
