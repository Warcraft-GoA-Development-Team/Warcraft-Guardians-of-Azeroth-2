l_english:
 wc_balnazzar_raise_risen_decision:0 "Raise the Risen"
 wc_nathrezim_cover.0002.negotiate:0 "What would it take to settle this between us?"
 wc_balnazzar_raise_risen_decision_desc:0 "They still kneel when I enter, though they know whose shadow falls across them. I could spend another year purchasing their obedience. Or I could end their service to the living tonight."
 wc_balnazzar_raise_risen_decision_tooltip:0 "Open the rite: discard Dathrohan's identity. If it succeeds, continue as Balnazzar and the Risen."
 wc_balnazzar_raise_risen_decision_confirm:0 "Their service will not end in death."
 wc_balnazzar_story.2002.outside_stratholme:0 "The gates of my seat are shut. Beyond them lie provinces whose oaths I can no longer trust; within, my household still waits for orders.\n\nI have brought these crusaders through enough battles to know their courage. Now I shall see what remains of it when their hearts fall silent."
 wc_nathrezim_cover.0001.title:0 "A Borrowed Name"
 wc_nathrezim_cover.0001.scarlet:0 "A demon. Behind the familiar face, behind the orders we obeyed. I look down at the scarlet cloth on my breast and remember every oath spoken in that creature's hearing.\n\n[wc_cover_body.GetShortUINameNoTooltip] still expects those oaths to bind us. I send for the guards. Let the impostor answer before the Light for what it has made of our service."
 wc_nathrezim_cover.0002.scarlet:0 "[wc_cover_witness.GetShortUINameNoTooltip] wears the scarlet tabard openly, one hand pressed against its embroidered flame. The guards behind [wc_cover_witness.GetHerHim] watch me rather than the door.\n\n“You heard us swear before the Light. You let us kneel.”\n\nThe hand falls from the tabard to the sword. “You will come with us. There will be no more orders given in that stolen voice.”"
 wc_nathrezim_cover.0003.scarlet_coerced:0 "[wc_cover_witness.GetShortUINameNoTooltip] has sent the other crusaders away. The scarlet tabard lies folded over a chair.\n\n“You know what it would cost me to refuse you.” [wc_cover_witness.GetSheHe|U] pushes an empty purse across the table. “Then give me something to show for this. And when I ask a service of you, remember who kept the guards outside.”\n\nI rest a finger on the purse. Neither of us speaks of the Light."
 wc_nathrezim_cover.0003.scarlet_collusion:0 "[wc_cover_witness.GetShortUINameNoTooltip] waits until the last crusader leaves before speaking.\n\n“You have made their faith rather difficult to use.” There is irritation in the voice, but none of the horror I heard outside. “If I am to keep my part in this, you will make it worth the trouble.”\n\nThe scarlet cloth between us has concealed worse bargains. I draw my purse toward the table."
 wc_nathrezim_cover.0006.scarlet:0 "The red cloaks draw back. One crusader begins a prayer; another reaches for a weapon and waits to see who will follow. The face they obeyed is still before them, and that makes their horror sweeter.\n\n“Demon.”\n\nAt last, an honest greeting. But the household is breaking around it. These people built their lives upon the evil they would destroy. Now they must decide whether to raise their hands against the voice that gave their orders."
 wc_nathrezim_cover.0007.scarlet:0 "The whispered questions have reached the men in scarlet. They watch me through the prayers now, waiting for a word spoken wrongly, a gesture the old commander would never have made. Whoever gathered the evidence has given their doubts a shape: this life was stolen.\n\nThey do not yet need to know what took it. I could still divide the accusers, bargain with one and threaten another. Or I could let the borrowed voice fall silent, and show these hunters what has been standing among them."
 wc_nathrezim_cover.0001.bargain.public:0 "What is your place here worth to you?"
 wc_nathrezim_cover.0003.title.public:0 "The Price of Indulgence"
 wc_nathrezim_cover.0003.accept.public:0 "Take it. You shall have your favor."
 wc_nathrezim_cover.0001.public:0 "The servants have carried the news through every hall: a demon wears [wc_cover_body.GetShortUINameNoTooltip]'s face. I dismiss them before sending my summons.\n\nWhatever has answered to that name still owes me obedience. I could demand it before my guards, or hear what this creature would offer to keep its place."
 wc_nathrezim_cover.0002.public:0 "[wc_cover_witness.GetShortUINameNoTooltip] meets my eyes, then glances toward the guards. They have heard what I am. Neither moves aside.\n\n“You wore that face under my roof, under my authority. You will remain here until I decide what is to be done with you.”\n\nI let the borrowed face smile. The guards tighten their grip."
 wc_nathrezim_cover.0003.public:0 "[wc_cover_witness.GetShortUINameNoTooltip] leaves the guards outside. A purse lies open on the table between us.\n\n“The household expects an answer from me. Give me a reason to let you keep your place—and remember whose indulgence you enjoy when I ask something of you.”\n\nI weigh the purse in my hand. Even now, there is a price."
 wc_nathrezim_cover.0001.desc:0 "I lay the accounts side by side. The answers change; the hand signing the orders does not. Whoever [wc_cover_body.GetShortUINameNoTooltip] may be, that name is stolen.\n\nI fold the evidence before anyone else enters. An accusation would force a reckoning. Silence might buy me something worth keeping."
 wc_nathrezim_cover.0001.bargain:0 "Let us discuss what my silence is worth."
 wc_nathrezim_cover.0001.challenge:0 "I will hear the answer from your own lips."
 wc_nathrezim_cover.0002.title:0 "Answer for This Name"
 wc_nathrezim_cover.0002.authority:0 "[wc_cover_witness.GetShortUINameNoTooltip] sets the papers between us. No mention of demons; no name beneath the one I wear. Yet the accusation is precise enough.\n\n“You will remain here until I am satisfied.” Beyond the door, a guard shifts his weight. My answer will decide whether he enters."
 wc_nathrezim_cover.0002.desc:0 "[wc_cover_witness.GetShortUINameNoTooltip] has stopped asking questions. The papers on the table make an accusation of their own.\n\n“I know this name is not yours.”\n\nThere is no guard at the door, no command I must obey. But the person before me has ceased to believe, and will not be persuaded by another familiar smile."
 wc_nathrezim_cover.0002.submit:0 "Very well. I shall remain."
 wc_nathrezim_cover.0002.resist:0 "You have your answer. Now leave me."
 wc_nathrezim_cover.0003.title:0 "The Price of Silence"
 wc_nathrezim_cover.0003.desc:0 "[wc_cover_witness.GetShortUINameNoTooltip] does not call me by my borrowed name. That small omission tells me how far the inquiry has gone.\n\n“I can put these papers away. In return, when I ask a favor, you will remember this conversation.”\n\nThe offer is spoken quietly. Neither of us mistakes it for loyalty."
 wc_nathrezim_cover.0003.accept:0 "Put them away. I will remember."
 wc_nathrezim_cover.evaded_arrest:0 "The guards fail to take me into custody."
 wc_nathrezim_cover.0003.refuse:0 "I will owe you nothing."
 wc_nathrezim_cover.escape:0 "This face has served long enough."
 wc_nathrezim_cover.dismiss:0 "There is nothing more to settle here."
 wc_nathrezim_cover.0005.title:0 "A Way Out"
 wc_nathrezim_cover.preparation_abandoned.title:0 "A Way Closed"
 wc_nathrezim_cover.preparation_abandoned.desc:0 "The opening I meant to use is gone. I call off the preparations; this attempt will give me no new body."
 wc_nathrezim_cover.0005.desc:0 "The preparations are complete. The ruler still wakes, dresses, and receives the same servants; none of them knows how close I have come.\n\nI could enter now and leave this life behind. Or I could let that household sleep undisturbed, keeping a way out for the day I need one."
 wc_nathrezim_cover.0005.keep:0 "Leave the way open."
 wc_nathrezim_cover.0005.enter:0 "I am finished with this life."
 wc_nathrezim_cover.0006.title:0 "No More Pretending"
 wc_nathrezim_cover.0006.renault:0 "Renault reaches for me as the household draws back. His hand stops short of my sleeve.\n\n'You gave me your word.' He looks at Dathrohan's face, searching for the man who promised him shelter. 'Was any of it yours?'\n\nI could remind him how often that word has served him. Before I speak, he steps away. The others watch the space he has left beside me."
 wc_nathrezim_cover.0006.darion:0 "Darion's hand closes on his sword. He does not draw it. His eyes move over the familiar face, then toward the people still standing at my back.\n\n'Look at him,' he says. 'Before you obey another word, look.'\n\nOne of them moves aside. Darion has given no account of my bargains, no name to the designs he never saw. He has only to point at what stands before them now. I wait to see whose hand follows his."
 wc_nathrezim_cover.0006.desc:0 "They know there is a demon behind this face. The old reassurances would only make me ridiculous now.\n\nYet no army has dissolved, no seal has crumbled in my hand. There are still orders to give, bargains to honor, and people who must decide whether defying me is worth the cost."
 wc_nathrezim_cover.0006.a:0 "Then let them judge what stands before them."
 wc_nathrezim_cover.0007.title:0 "The Name They No Longer Believe"
 wc_nathrezim_cover.0007.desc:0 "The questions have stopped. Whoever assembled the evidence has gone beyond doubt: they know this life is stolen. They need not know what I am. The stolen name is enough.\n\nI can seek a private bargain, or make them press their accusation against the power I still hold. Or I can speak without the borrowed voice, and let them hear what has been answering them all this time."
 wc_nathrezim_cover.0007.negotiate:0 "Let us speak behind closed doors."
 wc_nathrezim_cover.0007.resist:0 "Then let them bring their accusation before me."
 wc_nathrezim_cover.0007.reveal:0 "I have worn this face long enough."
 wc_balnazzar_story.2002.after_revelation:0 "Stratholme is mine. They know what wears Dathrohan's face, yet the gates have opened to my soldiers all the same.\n\nI have no further use for their faith in me. Tonight, those who still answer my orders will learn how little I need their consent. Their next oath will outlast their breath."
 wc_balnazzar_use_prepared_body_decision:0 "Take the Prepared Body"
 wc_balnazzar_use_prepared_body_decision_desc:0 "Another life waits beyond this household. I have already found the way in. To take it is to abandon this face and all that it commands."
 wc_balnazzar_use_prepared_body_decision_confirm:0 "Leave this face behind."
 wc_balnazzar_use_prepared_body_decision_tooltip:0 "Enter the body prepared for possession."
 wc_nathrezim_contested_identity_modifier:0 "An Unconvinced Household"
 wc_nathrezim_contested_identity_modifier_desc:0 "The household hesitates over orders and payments while its master's identity is disputed."
 wc_nathrezim_public_impostor_modifier:0 "Revealed Impostor"
 wc_nathrezim_public_impostor_modifier_desc:0 "The demon behind this borrowed face is publicly known."
 wc_nathrezim_defied_inquiry_opinion:0 "Defied My Inquiry into Usurpation"
