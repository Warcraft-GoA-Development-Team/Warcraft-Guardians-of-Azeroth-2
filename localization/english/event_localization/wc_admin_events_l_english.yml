WCADMIN.3002.title: "An Eager Daughter of Cenarius"
WCADMIN.3002.desc: "Since I completed the Cenari Reservation, Dryads and their ilk have been filtering slowly into my lands. Attracted by the pristine nature and plentiful magicks available to them, many of Cenarius' children have admired the work I have put in to creating a home for them here. A few have even discussed leaving the safety of the Reservation to lend their talents to my court.\n\nNow, apparently, one has convinced herself to offer her services. Named [dryad.GetName], she is skilled in the arts and sciences of [ROOT.Char.Custom('WCAdminDryadGuestSkillLoc')], and could be a formidable addition to my court."
WCADMIN.3002.opt.a: "Cenarius would be pleased if I paid for her services."
WCADMIN.3002.opt.b: "I shall eagerly accept the gift of her service."
WCADMIN.3002.opt.c: "Sadly we have no room at court, but she may remain a guest as long as she likes."