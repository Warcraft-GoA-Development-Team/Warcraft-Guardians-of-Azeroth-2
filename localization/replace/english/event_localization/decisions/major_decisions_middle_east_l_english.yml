l_english:
 # Dar al-Noor
 middle_east_decisions.1100.t: "Dar al-Noor"
 middle_east_decisions.1100.desc: "Not since the Rashidun Caliphate has Noor stood united beneath a single banner. Guided by one purpose, one vision. A true [Glossary( 'Dar al-Noor', 'DAR_AL_ISLAM_GLOSS' )].\n\nFrom every corner of the world, [GetReligionByKey('noor_religion').GetAdherentNamePluralNoTooltip] now travel to [ROOT.Char.GetCapitalLocation.GetNameNoTooltip]. Pilgrims and princes, scholars and soldiers. From distant deserts and crowded ports, from every school and sect, they gather before me — to bow their heads, to pledge their hearts.\n\nOnly time will tell if this unity will last – or if it is doomed to fade into history once more. For now, the plentitudes will know the all‑embracing peace of Noor."
 middle_east_decisions.1100.a: "All of the world shall belong to the house of Noor!"
 DAR_AL_ISLAM_GLOSS: "#bold Dar al-Noor#!, translated as "the house of Noor", is a term referring to lands under Noorist sovereignty, presiding over Noorist and non-Noorist subjects."
 
 middle_east_decisions.1101.intro: "Never before has Noor been a unified force. Yet, it seems that [dar_al_islam_ruler.GetShortUIName] has done the impossible and created a one true [Glossary( 'Dar al-Noor', 'DAR_AL_ISLAM_GLOSS' )]."
 middle_east_decisions.1101.islam_desc: "[GetReligionByKey('noor_religion').GetAdherentNamePluralNoTooltip] from all over the world are flocking to [dar_al_islam_ruler.GetHerHis] banner. Providing the strength, security, and prosperity this new rule is destined to bring."
 middle_east_decisions.1101.other_desc: "Time will tell how this new [dar_al_islam_ruler.GetTitleAsNameNoTooltip] will rule. One has to pause and wonder; what this will mean for the rest of the world?"
 middle_east_decisions.1101.a: "Hail the [dar_al_islam_ruler.GetTitleAsNameNoTooltip]!"
 middle_east_decisions.1101.b: "Perhaps I, too, should join with [dar_al_islam_ruler.GetHerHim]?"
 middle_east_decisions.1101.c: "A most alarming turn of events."
 
 middle_east_decisions.1102.desc: "This means that I am no longer the religious authority of the [ROOT.Char.GetFaith.GetName] faith. And I, like every other [GetReligionByKey('noor_religion').GetAdherentName], will have to submit to the new [dar_al_islam_ruler.GetTitleAsNameNoTooltip]."
 middle_east_decisions.1102.a: "Time will tell if [dar_al_islam_ruler.GetSheHe] is worthy."
