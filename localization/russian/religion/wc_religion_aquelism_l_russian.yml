  #Aquelism Group Faiths 
 neptulism: "Нептулистск"
 neptulism_adj: "Нептулизм"
 neptulism_adherent: "Нептулит"
 neptulism_adherent_plural: "Нептулиты"
 neptulism_desc: "Нептулон, Владыка Вод, почитается последователями как защитник океанов и морской жизни, а также беспощадный судья смертных. В отличие от своего вечного врага, Владыки Огня, Нептулон способен проявлять моменты дружелюбия и даже благосклонности к смертным. Однако те, кто осмелится воспротивиться его воле или разбудить его гнев, столкнутся с катастрофическими разрушениями."
 neptulism_religious_head_title_male: "Аквафекс"
 neptulism_religious_head_title_female: "$neptulism_religious_head_title_male$"
  
 waterspeaker: "Водоглашатайск"
 waterspeaker_adj: "Глашатай воды"
 waterspeaker_adherent: "Глашатай воды"
 waterspeaker_adherent_plural: "Глашатаи воды"
 waterspeaker_desc: "Глашатай воды – древнее верование, зародившееся в Пандарии до Великого Раскола, позволяющее его последователям общаться с землей посредством ритуалов с участием речной воды. Единственными, кто сохранил долгую традицию глашатая воды, даже после того как туманы скрыли континент, были рыбообразные существа, известные как джинью. Со временем самые мудрые из них научились общаться с водами рек и прислушиваться к будущему и новостям, которые они приносят."
  
 tidemother: "Тирани"
 tidemother_adj: "Тирани"
 tidemother_adherent: "Тирани"
 tidemother_adherent_plural: "Тирани"
 tidemother_desc: "Тирани – существо, которому поклоняются многие моряки и те, чья жизнь зависит от благоприятных морских ветров. Многие тирани смотрят на моря так же, как другие обращаются к Свету, но жрецы приливов, служители Тирани, имеют гораздо более глубокую связь с водой. Долгое время жрецы приливов прислушивались к морю, чтобы направлять свои корабли и свой народ, слыша нежные шёпоты, незаметные большинству."
 tidemother_good_god_tidemother: "Тирани"
 tidemother_good_god_tidemother_possessive: "Тирани"
  
 pirate_faith: "Пиратствск"
 pirate_faith_adj: "Пиратство"
 pirate_faith_adherent: "Пират"
 pirate_faith_adherent_plural: "Пираты"
 pirate_faith_desc: "Когда первые люди отправились в плавание, они вскоре начали строить свои королевства. Однако некоторые предпочли и дальше бороздить моря, почитая обитающих в их глубинах существ. Многие из них занялись морскими набегами, получившими известность как пиратство. Хотя за это их повсеместно недолюбливают, их свободный и ничем не скованный образ жизни манил тех, кто на краю общества искал богатства и вольницы."
 pirate_faith_divine_realm: "Великое море"
 pirate_faith_good_god_great_sea: "Великое море"
 pirate_faith_good_god_great_sea_possessive: "Великого моря"
