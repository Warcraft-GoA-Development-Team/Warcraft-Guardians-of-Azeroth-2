 tenet_eastern_kingdoms_syncretism_name: "Восточный конклав"
 tenet_eastern_kingdoms_syncretism_desc: "Философии и религии, зародившиеся в Восточных королевствах, имеют много общих моральных ценностей и научились быть терпимыми друг к другу и работать вместе."
 doctrine_parameter_hostility_override_tenet_eastern_kingdoms_syncretism: "Рассматривает восточные [faiths|El] как [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"
  
 tenet_cult_of_strength_name: "Культ силы"
 tenet_cult_of_strength_desc: "Чем мы сильнее, тем ближе мы к божественному величию. Никогда не переставай бороться, никогда не переставай развиваться. С каждым днём сильнее, чем прежде."
  
 tenet_ritual_hunt_name: "Ритуальная охота"
 tenet_ritual_hunt_desc: "Нет лучшего подношения, чем то, которое добыто своими руками, так, как это делали наши предки. Охота для нас священна."
 doctrine_parameter_piety_from_hunts_active: "Проведение #E охоты#! даёт [piety|El]"
 doctrine_parameter_hunts_costs_less_active: "Проведение #E охоты#! стоит меньше [Concept('gold', 'золота')|El]"
  
 tenet_progressivism_name: "Прогрессивизм"
 tenet_progressivism_desc: "Мы рассматриваем прогресс как абсолютное благо. Наше общество ориентировано на технологическое развитие и высоко ценит ремесленников и ученых."
 doctrine_parameter_progressivist_opinion_active: ""
 progressivist_opinion_active_opinion_name: "Hated Progressivist"
 progressivist_opinion_active_county_opinion_name: "Ненавистное прогрессистское графство"
 doctrine_parameter_opinion_of_progressivist_opinion_active: "[opinion|E] прогрессивистов: $VALUE|+=0$"
 INCOMPATIBLE_TENET_PROGRESSIVISM_TRIGGER: "Несовместимо с [Concept('core_tenet', 'догматом')|E] [GetFaithDoctrine('tenet_progressivism').GetName( GetPlayer.GetFaith )]"
 INCOMPATIBLE_TENET_INTOLERANCE_TRIGGER: "Нам нечему учиться у этих примитивных догматов"
  
 tenet_consumerism_name: "Потребительство"
 tenet_consumerism_desc: "Мы рассматриваем потребление как абсолютное благо. Большой поток товаров позволяет нашим городам развиваться. Это то, что движет наше общество вперёд."
 doctrine_parameter_consumerist_opinion_active: ""
 consumerist_opinion_active_opinion_name: "Ненавистный потребитель"
 consumerist_opinion_active_county_opinion_name: "Графство, ненавидящее потребительство"
 doctrine_parameter_opinion_of_consumerist_opinion_active: "[opinion|E] потребителей: $VALUE|+=0$"
