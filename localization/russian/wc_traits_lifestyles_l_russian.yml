 trait_wc_lifestyle_life_magic: "Чуткие друиды"
 trait_user_of_life_magic_name: "Друид"
 trait_user_of_life_magic_1: "$wc_lifestyle_magic_prefix_for_level_1$ $trait_user_of_life_magic_name$"
 trait_user_of_life_magic_1_desc: "Друиды обуздывают великие силы природы, чтобы сохранять равновесие и защищать жизнь. Живя в несравненном единении с природой, дружа и с флорой, и с фауной, они общаются с дикой природой, постигая, как жизнь упорно противостоит невзгодам."
