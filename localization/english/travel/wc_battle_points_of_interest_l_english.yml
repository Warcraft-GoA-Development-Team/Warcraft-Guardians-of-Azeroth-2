 # Key Moment
 BattlePoiDescriptionLocCasters: "The key moment of the battle was when the $BattlePoiCommanderCulture$ casters managed to navigate around the enemy, "
 BattlePoiDescriptionLocMassiveInfantry: "The battle was decided when a regiment of $BattlePoiCommanderCulture$ massive infantry pushed through enemy lines,"
 BattlePoiDescriptionLocLightAerial: "The outcome was decided when the $BattlePoiCommanderCulture$ light aerial managed to navigate behind enemy troops,"
 BattlePoiDescriptionLocMassiveAerial: "The battle came to an end when the $BattlePoiCommanderCulture$ massive aerial tore through the battle lines and into the heart of the enemy formation,"
 BattlePoiDescriptionLocCastersKnight: "The key moment of the battle was when the $BattlePoiCommanderCulture$ casters led by $BattlePoiBraveKnight$ managed to navigate around the enemy, "
 BattlePoiDescriptionLocMassiveInfantryKnight: "The battle was decided when a regiment of $BattlePoiCommanderCulture$ massive infantry led by $BattlePoiBraveKnight$ pushed through enemy lines,"
 BattlePoiDescriptionLocLightAerialKnight: "The outcome was decided when the $BattlePoiCommanderCulture$ light aerial led by $BattlePoiBraveKnight$ managed to navigate behind enemy troops,"
 BattlePoiDescriptionLocMassiveAerialKnight: "The battle came to an end when the $BattlePoiCommanderCulture$ massive aerial led by $BattlePoiBraveKnight$ tore through the battle lines and into the heart of the enemy formation,"

 # Outcome
 
 # Outro

 # Historical Battles

 ## First War
 BattlePoIHistoricalNameKyross: "The Battle of Kyross"
 BattlePoIHistoricalDescKyross: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: The Defender of the Crown\nDate: 1st of March, 583 KC#!\n#weak One of the first outposts of the $e_horde$, Kyross was the stage to one of the first attacks from the humans in an attempt to prevent the Orcs from launching any more surprise attacks.#!"

 BattlePoIHistoricalNameGrandHamlet: "The Battle of Grand Hamlet"
 BattlePoIHistoricalDescGrandHamlet: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetTitledFirstName]\nDefeated: The Defender of the Crown\nDate: 10th of August, 584 KC#!\n#weak This human outpost was destroyed by the orcs in the First War.\n\nIt was one of the first recorded battle in which the use of clerics and necrolytes were applied in war.#!"

 BattlePoIHistoricalNameDeadmines: "The Battle of The Deadmines"
 BattlePoIHistoricalDescDeadmines: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]\nDefeated: [GetScriptedCharacterByHistoryID( '52450' ).GetFirstName]\nDate: 585 KC#!\n#weak A battle between the orcs and a group of renegade ogres lead by [GetScriptedCharacterByHistoryID( '52450' ).GetFirstName] along with [GetScriptedCharacterByHistoryID( '10004' ).GetFirstName], daughter of [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]. Both of them were slain along with their soldiers on the orders of [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName].\n\nOn another date, [GetScriptedCharacterByHistoryID( '1008' ).GetFullName] was imprisoned by the ogres while searching for the Tome of Divinity. He and his men were then saved by Azerothian troops led by the Defender of the Crown.#!"

 BattlePoIHistoricalNameRedridge: "The Battle of The Redridge Mountains"
 BattlePoIHistoricalDescRedridge: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 586 KC#!\n#weak The Redridge mountains was one of the places the $e_horde$ descended upon.#!"

 BattlePoIHistoricalNameSunnyglade: "The Battle of Sunnyglade"
 BattlePoIHistoricalDescSunnyglade: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetNameNicknamed]\nDate: 586 KC#!\n#weak The Battle of Sunnyglade was one of the key battles between $k_stormwind$ and the $e_horde$, due to the orcs getting to study the magiks of the humans.#!"

 BattlePoIHistoricalNameBlackMorass: "The Battle of Black Morass"
 BattlePoIHistoricalDescBlackMorass: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstNameNicknamed]\nDefeated: [GetScriptedCharacterByHistoryID( '10000' ).GetNameNicknamed]\nDate: 586 KC#!\n#weak [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] took the recent disarray of the Shadow Council and a failed attack on Stormwind as an opportunity to stage a coup against [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName].\n\n After winning the battle, [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] challenged [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName] to a mak'gora, under the claim that [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName] was a traitor to his people. After hours of dueling, [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] cut off his head.#!"

 BattlePoIHistoricalNameNorthshire: "The Battle of Northshire Abbey"
 BattlePoIHistoricalDescNorthshire: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 586 KC#!\n#weak During the First War, the Northshire Abbey was used as a prison for the invading orcs and ogres. One of those prisoners was [GetScriptedCharacterByHistoryID( '10620' ).GetFullName].\n\nThe orcs laid siege upon the abbey and fought all manner of enemies inside.#!"

 BattlePoIHistoricalNameGoldshire: "The Battle of Goldshire"
 BattlePoIHistoricalDescGoldshire: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 586 KC#!\n#weak Goldshire was the final city the orcs laid siege to before sieging Stormwind.\n\nIts destruction severed the lifeline between the King and his people, making him a figurehead waiting to be lopped off.#!"

 BattlePoIHistoricalNameStormwind: "The Fall of Stormwind Keep"
 BattlePoIHistoricalDescStormwind: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 1st of October, 586 KC#!\n#weak The second siege of Stormwind Keep was the final battle of the First War that ended with the $e_horde$'s victory over the humans of the kingdom of Azeroth. The events that culminated ultimately led to the destruction of Stormwind Keep and the death of [GetScriptedCharacterByHistoryID( '2' ).GetTitledFirstName].\n\nSir [GetScriptedCharacterByHistoryID( '1008' ).GetFullName] would lead the survivors and refugees of the First War on an exodus north to the continent of Lordaeron, where they would prepare for the $e_horde$'s impending invasion and the eventual outbreak of the Second War.#!"
 
 ## Second War
 BattlePoIHistoricalNameZulDare: "The Battle of Zul'Dare"
 BattlePoIHistoricalDescZulDare: "#emp Victor: [GetScriptedCharacterByHistoryID( '48080' ).GetTitledFirstName] [GetScriptedCharacterByHistoryID( '48080' ).GetDynastyName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 10th of November, 588 KC#!\n#weak At the start of the Second War, [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName] ordered the Blackrock clan to establish a base of operations in the island of Zul'Dare, not far from Lordaeron's shores, in order to prepare their strike towards the coastal human settlements.\n\n[GetScriptedCharacterByHistoryID( '48080' ).GetTitledFirstName] [GetScriptedCharacterByHistoryID( '48080' ).GetDynastyName] and the Alliance navy intercepted the $e_horde$ fleet near the island, successfully attacking the enemy ships, but the arrival of three enslaved red dragons turned the battle and Daelin and his ships were forced to retreat.\n\nAfter establishing order in the coastal regions, [GetScriptedCharacterByHistoryID( '48080' ).GetTitledFirstName] advised in striking the $e_horde$ base hidden in the region of the Channel Islands. Scouts managed to locate the outpost in Zul'Dare and the Alliance military sent forces to destroy it.#!"

 BattlePoIHistoricalNameTarrenMill: "Ambush at Tarren Mill"
 BattlePoIHistoricalDescTarrenMill: "#emp Victor: [GetScriptedCharacterByHistoryID( 'milan' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 20th of November, 588 KC#!\n#weak When the Elves of Silvermoon sent a contingent of Archers south to survey the supposed Orcish threat for themselves, they were ambushed by $e_horde$ troops shortly after passing through the Alterac grasslands. These Elves were held in a small prison camp near the northwest region of Tarren Mill.\n\nLord [GetScriptedCharacterByHistoryID( '60001' ).GetFirstName], fervently hoping to enlist the Elves into the Alliance, asked for a search for the missing warriors and to deliver them to safety. After the elves were freed they joined with the humans and fought off the orcs in the region. After that $e_quelthalas$ officially joined the Alliance.#!"

 BattlePoIHistoricalNameSouthshore: "The Battle of Southshore"
 BattlePoIHistoricalDescSouthshore: "#emp Victor: [GetScriptedCharacterByHistoryID( 'milan' ).GetFirstName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 588 KC#!\n#weak Shortly after the First War, Southshore gained a new status as a military port for the Alliance. Unfortunately for them, its strategic position has also caught the attention of the Horde.\n\nBoth sides fought for it in order to have a base to construct their ships.#!"

 BattlePoIHistoricalNameHillsbrad: "The Battle of Hillsbrad Foothills"
 BattlePoIHistoricalDescHillsbrad: "#emp Victor: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 589 KC#!\n#weak The Battle of Hillsbrad Foothills was the first major battle between the $e_horde$ and the Alliance of Lordaeron. The Alliance side there was being lead by Supreme Commander [GetScriptedCharacterByHistoryID( '1008' ).GetFullName], with his lieutenants being [GetScriptedCharacterByHistoryID( '60247' ).GetFirstName], [GetScriptedCharacterByHistoryID( '60036' ).GetFirstName], [GetScriptedCharacterByHistoryID( '59001' ).GetFirstName] and Grand [GetScriptedCharacterByHistoryID( '48080' ).GetFullName].\n\nIn the first act of the battle, the Alliance got a preemptive strike against the $e_horde$, taking heavy casualties. After that they deployed death knights and ogres, who were countered by the Alliance's paladins and mages. After a charge lead by [GetScriptedCharacterByHistoryID( '1008' ).GetDynastyHouseName] the $e_horde$ was forced to retreat.#!"

 BattlePoIHistoricalNameTolBarad: "The Battle of Tol Barad"
 BattlePoIHistoricalDescTolBarad: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '44015' ).GetFullName]\nDate: 1st of February, 589 KC#!\n#weak During the Second War, the island was a strategic staging area for Alliance forces, from which they struck on the Horde-controlled city of Dun Modr and took it back from the hands of their enemies. The orcs, viewing Tol Barad as an obstacle in their path to the Eastern Kingdoms, mounted a ferocious counterstrike on the island. Unprepared for such aggression, the Stromgarde soldiers were expelled from Tol Barad, and the citadel was razed, a charred symbol of the $e_horde$'s brutal victory. Most of the island's inhabitants were slaughtered, their home ravaged, and their remaining spirits crying out for vengeance.#!"

 BattlePoIHistoricalNameStromgarde: "The Battle of Stromgarde"
 BattlePoIHistoricalDescStromgarde: "#emp Victor: [GetScriptedCharacterByHistoryID( 'utok_scratcher' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '38001' ).GetFullName]\nDate: 589 KC#!\n#weak In the Battle of Stromgarde, the Horde used troll Destroyers and transports with ogres and catapults to invade the city from the sea.\n\nWhen the attack commenced, the catapults removed defensive structures from a distance; the troops were constantly ordered to stay near them. Slowly they leveled the city from west to east, replacing fallen ogres as necessary. Their shipyards fell last to the catapult, as well as their ships anchored in the harbor. The invasion was deemed a major success.#!"

 BattlePoIHistoricalNameDunAlgaz: "The Battle of Dun Algaz"
 BattlePoIHistoricalDescDunAlgaz: "#emp Victor: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 589 KC#!\n#weak Following their defeat at Dun Modr, the orcs were forced to retreat south across the Thandol Valley to a secondary outpost at Dun Algaz. [GetScriptedCharacterByHistoryID( '1008' ).GetFullName], hoping to push the orcs even further back into Khaz Modan, ordered the destruction of the outpost.#!"

 BattlePoIHistoricalNameCaerDarrow: "The Battle of Caer Darrow"
 BattlePoIHistoricalDescCaerDarrow: "#emp Victor: [GetScriptedCharacterByHistoryID( '10015' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '60036' ).GetFullName]\nDate: 589 KC#!\n#weak During the Second War, the island was invaded by the Horde, the fortress sacked, and the sacred runestone captured. The stone was hewn into pieces which were used to create the Altars of Storms, arcane structures which allowed [GetScriptedCharacterByHistoryID '10015' .GetFirstName] to instill magic into the Horde's ogre allies.#!"

 BattlePoIHistoricalNameTyrsHand: "The Battle of Tyr's Hand"
 BattlePoIHistoricalDescTyrsHand: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 589 KC#!\n#weak the Horde used ogre magi to attack the area, establishing a fortress on an island at the mouth of Tyr's Bay, hoping to cut off the Alliance supply lines into Quel'Thalas. The city suffered heavy damage as the orcs razed the bayside area.#!"

 BattlePoIHistoricalNameDestructionStratholme: "The Destruction of Stratholme"
 BattlePoIHistoricalDescDestructionStratholme: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDate: 589 KC#!\n#weak The Destruction of Stratholme by the Horde happened when the city was preparing to deliver massive amounts of oil to the kingdoms in western Lordaeron, in which the Horde sabotaged its refineries and oil platforms to halt the shipment. With the destruction of Stratholme, the Alliance supply lines to Quel'Thalas were severed.#!"

 BattlePoIHistoricalNameBurningQuelThalas: "The Burning of Quel'Thalas"
 BattlePoIHistoricalDescBurningQuelThalas: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '42002' ).GetFullName]\nDate: 589 KC#!\n#weak Although [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] initially had no intention of invading $e_quelthalas$, [GetScriptedCharacterByHistoryID( '57000' ).GetFirstName] insisted as the prerequisite of the Amani joining the Horde was the destruction of the High Elves.\n\nUsing the red dragons they obtained through enslaving [GetScriptedCharacterByHistoryID( '62400' ).GetTitledFirstName], they burned the entire kingdom to the ground.#!"

 BattlePoIHistoricalNameBlackwood: "The Razing of Blackwood"
 BattlePoIHistoricalDescBlackwood: "#emp Victor: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '60028' ).GetFullName]\nDate: 589 KC#!\n#weak During [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]'s assault on the elven kingdom of $e_quelthalas$, a small band of orcs broke off from the main invading force and attacked the town of Blackwood, on the shores of Blackwood Lake. Baron [GetScriptedCharacterByHistoryID( '60028' ).GetDynastyName] marshaled his subjects to defend the town, but they were all slain by the orcish forces. Though the burning of Blackwood had marginal strategic effect on the Second War, it carried a lasting impact on the baron's son [GetScriptedCharacterByHistoryID( '60030' ).GetFullName], who was stationed in $e_quelthalas$ at the time and blamed the elves for his family's death.#!"

 BattlePoIHistoricalNameAlterac: "The Betrayal and Destruction of Alterac"
 BattlePoIHistoricalDescAlterac: "#emp Victor: [GetScriptedCharacterByHistoryID( '60036' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '58000' ).GetFullName]\nDate: 589 KC#!\n#weak It was revealed that $k_alterac$ has betrayed the Alliance; with [GetScriptedCharacterByHistoryID( '58000' ).GetTitledFirstName] working with the Horde from the beginning by providing them passage through their lands and routes to launch their attacks.\n\n As retaliation for this betrayal, the Alliance laid siege upon the kingdom until it was completely destroyed.#!"

 BattlePoIHistoricalNameTombSargeras: "The Tomb of Sargeras"
 BattlePoIHistoricalDescTombSargeras: "#emp Victor: [GetScriptedCharacterByHistoryID( '10002' ).GetFirstName] [GetScriptedCharacterByHistoryID( '10002' ).GetDynastyHouseName]\nDefeated: [GetScriptedCharacterByHistoryID( '10015' ).GetFullName]\nDate: 589 KC#!\n#weak [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] has betrayed the Horde. On the eve of [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]'s attack on Lordaeron's capital, [GetScriptedCharacterByHistoryID '10015' .GetFirstName] took the Stormreaver and Twilight's Hammer clans and set out to sea to locate the Tomb of Sargeras. With nearly half of his standing forces suddenly gone, [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] was forced to retreat and hunt down the traitorous warlock. This reprieve would ultimately give the Alliance time to regroup and retaliate.\n\n[GetScriptedCharacterByHistoryID '10015' .GetFirstName] did indeed locate the Tomb and used his power to raise it from the ocean floor and creating the Broken Shore. Taking with him his most select followers, [GetScriptedCharacterByHistoryID '10015' .GetFirstName] cast open the doors and entered and began searching for the Eye of Sargeras. He did not however find the godhood he was hoping for. Instead, he was torn to shreds by a swarm of insane demons that had long ago been drawn to the tomb through the dark magics that emanated from Sargeras's remains. The remainder of his clans were slaughtered by [GetScriptedCharacterByHistoryID( '10050' ).GetDynastyName]'s retaliation. In those last moments, [GetScriptedCharacterByHistoryID '10015' .GetFirstName] realized he had just been a pawn, that Sargeras had fooled him into doing his dirty work.\n\nThe orcs killed during the battle were eventually raised by the vile magics of the demons, and kept reliving it in their undeath.#!"

 BattlePoIHistoricalNameCapitalCity: "The Siege of Capital City"
 BattlePoIHistoricalDescCapitalCity: "#emp Victor: [GetScriptedCharacterByHistoryID( '60001' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 589 KC#!\n#weak The Siege of Lordaeron's capital was a massive failure of the Horde. Although unexpected, [GetScriptedCharacterByHistoryID( '60001' ).GetFirstName] quickly reacted to the Horde's invasion by ordering his soldiers to drop hot oil on the orcs. Alliance forces under [GetScriptedCharacterByHistoryID( '60247' ).GetFirstName] along with [GetScriptedCharacterByHistoryID( '59001' ).GetFirstName] then reached the City to reinforce. [GetScriptedCharacterByHistoryID( '38001' ).GetFullName] blocked mountain passes to delay further assaults.\n\nNews reached [GetScriptedCharacterByHistoryID( '10050' ).GetFullName] that [GetScriptedCharacterByHistoryID( '10015' ).GetFullName] took his Stormreavers and Twilight's Hammer and abandoned them. Desperate, he withdrew his troops to hunt him, losing the siege.#!"

 BattlePoIHistoricalNameCrestfall: "The Battle of Crestfall"
 BattlePoIHistoricalDescCrestfall: "#emp Victor: [GetScriptedCharacterByHistoryID( '48080' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10002' ).GetFullName]\nDate: 589 KC#!\n#weak #!"

 BattlePoIHistoricalNameBlackrockSpire: "The Siege of Blackrock Spire"
 BattlePoIHistoricalDescBlackrockSpire: "#emp Victor: [GetScriptedCharacterByHistoryID( '1008' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10050' ).GetFullName]\nDate: 589 KC#!\n#weak #!"

 BattlePoIHistoricalNameDarkPortal: "The Destruction of the Dark Portal"
 BattlePoIHistoricalDescDarkPortal: "#emp Victor: [GetScriptedCharacterByHistoryID( '60247' ).GetFullName]\nDefeated: [GetScriptedCharacterByHistoryID( '10017' ).GetFullName]\nDate: 589 KC#!\n#weak #!"
