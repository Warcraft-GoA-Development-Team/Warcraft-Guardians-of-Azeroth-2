l_russian:
 necro_authority: "[dark_authority|E]"
 necro_authority_0: "Незначимые круги"
 necro_authority_1: "Разрозненные культы"
 necro_authority_2: "Тёмные ковены"
 necro_authority_3: "Нечестивые конгрегации"
  
 necro_authority_1_effects: "$title_revocation_allowed$$vassal_retraction_allowed$"
 necro_authority_2_effects: "$vassal_refusal_is_treason$$titles_cannot_leave_realm_on_succession$"
 necro_authority_3_effects: "$can_designate_heirs$"
  
 necro_authority_1_effects_not_in_prev: "$crown_authority_1_effects_not_in_prev$"
 necro_authority_2_effects_not_in_prev: "$increase_dark_special_effects_by_50$\n$crown_authority_2_effects_not_in_prev$"
 necro_authority_3_effects_not_in_prev: "$increase_dark_special_effects_by_100$\n$crown_authority_3_effects_not_in_prev$"
  
 title_revocation_allowed: "$EFFECT_LIST_BULLET$[titles|E] могут быть отняты\n"
 vassal_retraction_allowed: "$EFFECT_LIST_BULLET$[vassals|E] могут быть отозваны\n"
 can_change_partition_succession_laws: "$EFFECT_LIST_BULLET$Правители могут изменять доступные [Concept('succession_laws', 'законы наследования')|E] 'разделение'\n"
  
 vassal_refusal_is_treason: "$EFFECT_LIST_BULLET$Вассалы, которые отвергают отзыв титула или вассала - [criminals|El]\n"
 can_change_succession_laws: "$EFFECT_LIST_BULLET$Правители могут менять все доступные [succession_laws|El]\n"
 titles_cannot_leave_realm_on_succession: "$EFFECT_LIST_BULLET$[titles|E] вассалов не могут быть унаследованы за пределами [Concept('realm', 'государства')|E]\n"
  
 can_designate_heirs: "$EFFECT_LIST_BULLET$Правители могут назначать своих [Concept('heir', 'наследников')|E]\n"
  
 increase_dark_special_effects_by_50: "$EFFECT_LIST_BULLET$Увеличивает случайные эффекты от [Concept('dark_government', 'тёмного правления')|E] на #V 50%#!"
 increase_dark_special_effects_by_100: "$EFFECT_LIST_BULLET$Увеличивает случайные эффекты от [Concept('dark_government', 'тёмного правления')|E] на #V 100%#!"
  
 demonic_authority: "[dark_authority|E]"
 demonic_authority_0: "$necro_authority_0$"
 demonic_authority_1: "$necro_authority_1$"
 demonic_authority_2: "$necro_authority_2$"
 demonic_authority_3: "$necro_authority_3$"
  
 demonic_authority_1_effects: "$title_revocation_allowed$$vassal_retraction_allowed$"
 demonic_authority_2_effects: "$vassal_refusal_is_treason$$titles_cannot_leave_realm_on_succession$"
 demonic_authority_3_effects: "$can_designate_heirs$"
  
 demonic_authority_1_effects_not_in_prev: "$crown_authority_1_effects_not_in_prev$"
 demonic_authority_2_effects_not_in_prev: "$increase_dark_special_effects_by_50$\n$crown_authority_2_effects_not_in_prev$"
 demonic_authority_3_effects_not_in_prev: "$increase_dark_special_effects_by_100$\n$crown_authority_3_effects_not_in_prev$"
  
 eldritch_authority: "[dark_authority|E]"
 eldritch_authority_0: "$necro_authority_0$"
 eldritch_authority_1: "$necro_authority_1$"
 eldritch_authority_2: "$necro_authority_2$"
 eldritch_authority_3: "$necro_authority_3$"
  
 eldritch_authority_1_effects: "$title_revocation_allowed$$vassal_retraction_allowed$"
 eldritch_authority_2_effects: "$vassal_refusal_is_treason$$titles_cannot_leave_realm_on_succession$"
 eldritch_authority_3_effects: "$can_designate_heirs$"
  
 eldritch_authority_1_effects_not_in_prev: "$crown_authority_1_effects_not_in_prev$"
 eldritch_authority_2_effects_not_in_prev: "$increase_dark_special_effects_by_50$\n$crown_authority_2_effects_not_in_prev$"
 eldritch_authority_3_effects_not_in_prev: "$increase_dark_special_effects_by_100$\n$crown_authority_3_effects_not_in_prev$"
