 neltharism_desc: "Последователи Черной драконьей стаи выступают в роли могущественных защитников и блюстителей равновесия, считая, что их мудрый Аспект Земли возложил на чёрных драконов священный долг — оберегать Азерот и сохранять его гармонию. Они чтут ценности порядка и защиты, стоя на страже от хаоса и разрушения. Имея глубокую связь с силой земли, они уверены, что должны любой ценой защищать Азерот, используя мощь и мудрость для поддержания равновесия. Однако порча омрачила их благородную миссию. И всё же некоррумпированные чёрные драконы остаются лучом надежды на искупление заложенного в их предназначении."
