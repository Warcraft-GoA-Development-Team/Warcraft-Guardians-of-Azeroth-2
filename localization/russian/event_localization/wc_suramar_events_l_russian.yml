l_russian:
 wc_suramar_events.0001.t: "Эльфийский город"
 wc_suramar_events.0001.d: "Будучи избранным правителем [GetTitleByKey('k_suramar').GetName], я обладаю властью формировать будущее нашего народа.\n\nХотя мир спал в тишине тысячи лет, вероятно, опустошённый Расколом, мы всё ещё можем процветать, даже в эту новую эпоху."
 wc_suramar_events.0001_tt: "Каждое [county|E] в [GetTitleByKey('k_suramar').GetName]:\nПолучило [GetModifier('wc_suramar_isolated_modifier').GetNameWithTooltip]"
  
 wc_suramar_isolated_modifier: "Изолирован"
 wc_suramar_isolated_modifier_desc: "Древняя эльфийская цивилизация Сурамара изолирована, что способствует дальнейшему развитию эльфов."
 wc_suramar_city_modifier: "Реновация города"
 wc_suramar_city_modifier_desc: "В этом городе проводится масштабный проект развития: строятся новые здания и районы."
 wc_suramar_ruler_modifier: "Помазанный правитель"
 wc_suramar_ruler_modifier_desc: "Этот персонаж использует свою мудрость, чтобы стать ещё могущественнее."
 wc_suramar_events.001.a: "Пора сосредоточиться на строительстве города."
 wc_suramar_events.001.b: "Моя сила — вот что имеет значение."
  
 wc_suramar_events.0002.t: "За пределами Барьера"
 wc_suramar_events.0002.desc: "Недавние события заставили меня поверить, что мир за пределами Сурамара не так опустошён, как мы когда-то думали.\n\nТысячи лет мы были запечатаны в этом пузыре, веря, что внешний мир уничтожен Расколом. Теперь, зная, что жизнь существует за нашими границами, встает вопрос: стоит ли нам принимать участие?"
 wc_suramar_events.0002.a: "Я должен решить сам..."
 suramar_discover_outside_world_effect_tt: "[Select_CString( suramar_ruler.IsLocalPlayer, 'I', suramar_ruler.GetName )] [Select_CString( suramar_ruler.IsLocalPlayer, 'узнаю', 'узнаёт' )] о мире за пределами, и поразмышляю, возможно ли снизить барьер:\n$BULLET$ [Select_CString( suramar_ruler.IsLocalPlayer, 'Ты', suramar_ruler.GetFirstName )] [Select_CString( suramar_ruler.IsLocalPlayer, 'разблокируешь', 'разблокирует' )] [GetDecisionWithKey('lower_suramar_barrier_decision').GetName] [decision|E]"
 wc_suramar_events.0002.b: "Правитель захочет узнать..."
  
 wc_suramar_events.0003.t: "В пустоте силы"
 wc_suramar_events.0003.desc: "Наш Найтвелл поддерживает нас, это сама жизнь Найтборнов, наша суть, наша сила.\n\nДо сих пор никто не знал, какой будет жизнь того, кто лишён его, но, увы, я узнал. Я видел эльфа, иссохшего и отчаявшегося, слабого и умоляющего о пощаде.\n\nВозможно, я смогу им помочь, а может, они заслуживают своей участи..."
 wc_suramar_events.0003.desc_non_nightborne: "Найтвелл поддерживает любого Найтборна, это их жизнь, их суть, их сила.\n\nДо сих пор никто не знал, какой будет жизнь того, кто лишён его, но, увы, я узнал. Я видел эльфа, иссохшего и отчаявшегося, слабого и умоляющего о пощаде.\n\nВозможно, я смогу им помочь, а может, они заслуживают своей участи..."
 suramar_discover_nightfallen_effect_tt: "Ты разблокируешь [GetDecisionWithKey('restore_arcandor_decision').GetName] [decision|E]"
 wc_suramar_events.0003.a: "Только время покажет..."
  
 wc_suramar_events.0010.t: "Беспокойные склепы"
 wc_suramar_events.0010.d: "[informant.GetName] принес(ла) новости о возмущении в склепах под [location_scope.GetName]. [informant.GetSheHe|U] рассказывает мне о шуме и движении под поверхностью, намекая на что-то, скользящее там.\n\n"
 wc_suramar_events.0010.desc_nightwell: "Так как линии маны, ведущие к нашему драгоценному Найтвеллу, проходят через эти склепы, Арквей, [informant.GetSheHe] умоляет меня принять меры."
 wc_suramar_events.0010.desc_ruler: "Многие важные линии маны проходят через склепы под [location_scope.GetName], и это возмущение может иметь страшные последствия для нашего народа."
 wc_suramar_events.0010.a: "Я пойду и посмотрю своими глазами."
 wc_suramar_events.0010.a_tt: "Ты отправляешься в склепы для расследования"
 wc_suramar_events.0010.b: "Возьми немного золота и отправь туда небольшую группу."
 wc_suramar_events.0010.b_tt: "Ты посылаешь доверенного рыцаря, [investigator.GetName], для расследования"
 wc_suramar_events.0010.c: "Не беспокой меня такими мелочами, [informant.GetFirstName]."
 wc_suramar_events.0010.c_bad: "Возмущение оставляет след на этой местности"
  
 wc_suramar_vaults_bad_modifier: "Склепы опустошены"
 wc_suramar_vaults_bad_modifier_desc: "Склепы под этим графством нарушены, владелец не обращает внимания на их упадок."
  
 wc_suramar_events.0011.desc_nightwell: "[Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'Я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetName )] [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'пробираюсь', 'пробирается' )] по тихому Арквею, внимательно прислушиваясь к любым признакам нарушителя.\n\nВдруг,"
 wc_suramar_events.0011.desc_ruler: "[Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'Я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetName )] [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'пробираюсь', 'пробирается' )] по склепам под городом, внимательно прислушиваясь к любым признакам нарушителя.\n\nВдруг,"
 wc_suramar_events.0011.desc_dog: "Слышится громкий стук, за которым следуют звуки... лая?"
 wc_suramar_events.0011.desc_cat: "Звук разбивающегося стекла эхом разносится по склепам, за которым следует громкий шипящий звук."
 wc_suramar_events.0011.desc_monster: "Звук тяжелого шуршания становится громче, и ужасный рев наполняет воздух."
 wc_suramar_events.0011.desc_bandit: "Звук приближающихся шагов усиливается, и раздается голос: 'Кажется, за нами следят.'"
 wc_suramar_events.0011.desc_outsider: "Кто-то кашляет, за которым следуют шепоты на неизвестном языке."
 wc_suramar_events.0011.desc_nightfallen: "Звук шагов усиливается, и слышится стон."
 wc_suramar_events.0011.a: "[ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe|U] продолжает..."
 wc_suramar_events.0011.b: "Может, мне стоит подождать здесь..."
 wc_suramar_events.0011.b_duel: "Ты ждёшь, пока нарушитель подойдет к тебе"
 wc_suramar_events.0011.c: "Атакуй!"
 wc_suramar_events.0011.c_duel: "Ты атакуешь нарушителя прямо в лицо"
 wc_suramar_events.0011.d: "Подумав ещё раз, я ухожу!"
 wc_suramar_events.0011.d_tt: "Ты отказываешься от расследования"
 wc_suramar_events.0011.success: "Ты поймал(а) нарушителя на месте"
 wc_suramar_events.0011.failure: "Нарушитель ускользает"
 wc_suramar_events.0011.knight_success: "[investigator.GetSheHe|U] ловит нарушителя с поличным"
 wc_suramar_events.0011.knight_failure: "[investigator.GetSheHe|U] не удается поймать нарушителя"
  
 wc_suramar_events.0112.desc_knight: "[ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetFirstName] медленно приближается к источнику шума и следует за тенью по коридорам.\n\n"
 wc_suramar_events.0112.desc_sneak: "Я иду медленно, стараясь не создавать шума. Я поворачиваю в коридор и вижу, как вдалеке движется тень.\n\n"
 wc_suramar_events.0112.desc_attack: "Не испытывая страха, я бросаюсь в атаку при первой возможности, готов(а) встретить всё, что прячется в тенях.\n\n"
 wc_suramar_events.0112.desc_dog: "К моему удовольствию, [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] нахожу маленькую собаку, виляющую хвостом и смотрящую на [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'меня', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetHerHim )] большими, невинными глазами.\n\nРазве это действительно создавало весь этот шум?"
 wc_suramar_events.0112.desc_cat: "К моему удивлению, [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] нахожу маленькую кошку, шерсть которой взъерошена, а глаза сужены.\n\nРазве это действительно создавало весь этот шум?"
 wc_suramar_events.0112.desc_monster: "Ужасное существо с острыми когтями и зубами бросается на [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'меня', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetHerHim )]."
 wc_suramar_events.0112.desc_bandit: "Группа разбойников во главе с [secondary_character.GetName] спешит атаковать [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'меня', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetHerHim )]."
 wc_suramar_events.0112.desc_outsider: "Незнакомое существо, одетое в странную одежду, смотрит на [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'меня', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetHerHim )] со смесью страха и любопытства."
 wc_suramar_events.0112.desc_nightfallen: "Эльф, иссохший и отчаявшийся, смотрит на [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'меня', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetHerHim )] со смесью страха и надежды."
  
 wc_suramar_events.0112.desc_knight_won: "К счастью, [ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe] умён(умна), [ROOT.Char.Custom('GetSuramarDefeatDisturbanceDesc')]"
 wc_suramar_events.0112.desc_knight_lost: "К сожалению, [ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe] спотыкается и не может [ROOT.Char.Custom('GetSuramarLoseDisturbanceDesc')]"
  
 wc_suramar_events.0112.desc_lost: "Я не могу [ROOT.Char.Custom('GetSuramarLoseDisturbanceDesc')]"
 wc_suramar_events.0112.desc_won: "К счастью, я умен(умна), [ROOT.Char.Custom('GetSuramarDefeatDisturbanceDesc')]"
  
 suramar_defeat_disturbance_monster: "и [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'подчиняю', 'подчиняет' )] это отвратительное чудовище. Его визг разносится эхом по склепам, и существо падает на землю, побеждённое. При дальнейшем осмотре кажется, что оно пропитано силой Найтвелла."
 suramar_defeat_disturbance_bandit: "и [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'поймаю', 'поймает' )] разбойников. Они сбрасывают оружие и капитулируют, умоляя о пощаде. Теперь встает вопрос: что с ними делать?"
 suramar_defeat_disturbance_outsider: "и [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'пытаюсь подойти', 'пытается подойти' )] к чужестранцу. Он смотрит на [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'меня', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetHerHim )] со страхом, бормоча на незнакомом языке. Теперь встает вопрос: что с ним делать?"
 suramar_defeat_disturbance_nightfallen: "и [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'пытаюсь подойти', 'пытается подойти' )] к существу. Оно смотрит на [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'меня', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetHerHim )] со страхом, и [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] обращает внимание на его иссохший вид."
  
 suramar_lose_disturbance_monster: "усмирить чудовищного монстра. Его визг пронзает [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'мои', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetHerHis )] уши, причиняя невыносимую боль. Монстр ускользает глубже в хранилища, и [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'не могу', 'не может' )] последовать за ним."
 suramar_lose_disturbance_bandit: "поймать бандитов. Одним ударом они одолевают [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'меня', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetHerHim )], и [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'вынужден отступить', 'вынуждена отступить' )]."
 suramar_lose_disturbance_outsider: "приблизиться к чужеземцу. Он смотрит на [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'меня', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetHerHim )] с испугом, а [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'не могу', 'не может' )] понять его язык. Чужеземец убегает глубже в хранилища, и [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'не могу', 'не может' )] последовать за ним."
 suramar_lose_disturbance_nightfallen: "приблизиться к погибельному эльфу. Он тут же разворачивается и убегает, и [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'я', ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.GetSheHe )] [Select_CString( ROOT.Char.MakeScope.Var('investigator_var').GetCharacter.IsLocalPlayer, 'не могу', 'не может' )] последовать за ним."
 wc_suramar_events.0012.bandit_1: "Я не причиню вреда [secondary_character.GetHerHim] напрямую, но [secondary_character.GetSheHe] должен(на) покинуть Сурамар."
 suramar_exile_character_effect_tt: "Это может иметь непредсказуемые последствия в будущем..."
 suramar_exile_character_effect_tt_wretched: "Без Найтвелла они могут стать [GetTrait('wretched').GetName( GetPlayer )]"
 wc_suramar_events.0012.bandit_2: "Гни в камере!"
 wc_suramar_events.0012.lost: "Чёрт возьми!"
 wc_suramar_events.0012.lost_tt: "Возмущение может вновь возникнуть скоро..."
 wc_suramar_events.0012.pet_1: "Ты идёшь со мной!"
 wc_suramar_events.0012.pet_2: "Ой, как мило."
 wc_suramar_events.0012.monster_1: "Изучи его, откуда у него такая сила?"
 wc_suramar_events.0012.monster_2: "Принеси труп этого зверя в город для демонстрации."
 wc_suramar_events.0012.outsider_1: "Иди со мной, странное существо..."
 wc_suramar_events.0012.outsider_2: "Кто ты? Умри!"
 wc_suramar_studying_monsters_modifier: "Изучение чудовищ"
 wc_suramar_studying_monsters_modifier_desc: "Этот персонаж изучает труп неизвестного существа, найденного в его склепах, и извлекает из этого выгоду."
 wc_suramar_events.0112.desc_nightfallen_outro: "Однако этот эльф мне не чужд. Да, [secondary_character.GetFirstName] когда-то был(а) из Сурамара, но покинул(а) эту землю. Так ли случается с теми, кто осмеливается выйти за его пределы?"
 wc_suramar_events.0012.nightfallen_1: "Эльф, иди со мной."
 wc_suramar_events.0012.nightfallen_2: "Умри, жалкое существо!"
 wc_suramar_events.0012.nightfallen_3: "[secondary_character.GetSheHe|U] не обычный Найтборн..."
  
 exiled_opinion: "Изгнан(а) мной"
  
 wc_suramar_events.0020.t: "Вечная королева"
 wc_suramar_events.0020.d: "Азшара, наша некогда любимая королева, всё ещё преследует мои мысли, проникая в мои сны. Даже спустя тысячелетия её магическое присутствие ощущается в каждом уголке Сурамара.\n\nЕё предательство всё ещё болит, но разве у неё не было каких-то положительных качеств?"
 wc_suramar_events.0020.a: "Её красота была поистине несравненной."
 wc_suramar_events.0020.b: "Хотел(а) бы я уметь цепляться за других так, как она."
  
 wc_suramar_beauty_queen_modifier: "Красота королевы"
 wc_suramar_beauty_queen_modifier_desc: "Красота королевы Азшары всё ещё помнится этим персонажем."
  
 wc_suramar_cunning_queen_modifier: "Голос королевы"
 wc_suramar_cunning_queen_modifier_desc: "Хитрость королевы Азшары всё ещё помнится этим персонажем."
  
 wc_suramar_events.0030.t: "Мольба Луны"
 wc_suramar_events.0030.desc: "Однажды вечером, когда луна висела высоко в небе, жрец в одеянии молился у колодца. #italic «Элуна, альра, шу даллас на»#! — прошептал [priestess.GetSheHe] на древнем языке, и [priestess.GetHerHis|U] голос отозвался эхом в ночи.\n\n[priestess.GetSheHe|U] поворачивается ко мне и говорит: «[ROOT.Char.GetTitleAsNameNoTooltip], присоединись ко мне в молитве. Свет Элуны сияет для всех нас, и мы должны чтить её»."
 wc_suramar_events.0030.a: "Конечно, да направит нас её свет."
 wc_suramar_events.0030.a_tt: "Каждая [priestess.GetFaith.GetAdjective] [vassal|E] и [courtier|E]:\nПолучает #p 20#! [opinion|E] о #V вас#! #weak (-1.20/год) (Уважение)#!"
 wc_suramar_events.0030.b: "Нет, у меня есть другие дела."
 wc_suramar_elunic_influence_modifier: "Влияние Элуны"
 wc_suramar_elunic_influence_modifier_desc: "Этот персонаж подвергся влиянию поклонения Элуне и с большей вероятностью будет следовать и уважать учения Богини Луны.\nСтоимость обращения в [GetFaithByKey('kaldorei_religion').GetName]: #p -25%#!"
 MODIFIER_DESC_wc_suramar_elunic_influence_modifier: "[GetModifier('wc_suramar_elunic_influence_modifier').GetNameWithTooltip]"
 wc_suramar_events.0030.c: "Если она нас не оставила, то спасёт тебя."
 wc_suramar_events.0030.d: "Скажи, как ты говоришь на древнем языке?"
  
