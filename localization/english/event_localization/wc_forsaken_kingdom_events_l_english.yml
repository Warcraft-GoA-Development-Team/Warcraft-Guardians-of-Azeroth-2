l_english:
 bandarion_keep_custom_name:0 "Bandarion Keep"
 bandarion_keep_custom_name_adj:0 "Bandarionese"
 forsaken_kingdom.0001.t:0 "Bandarion Keep"
 forsaken_kingdom.0001.desc.founded:0 "Garek Bandarion, Captain of the Deathguard, is dead. His guard carried him back to Autumnacre and would not hear of the old name: from this day the keep is Bandarion Keep, and the Deathguard will answer for it.\n\nBefore the vigil is over, Evin Schmidtt comes before me. A paladin of the Silver Hand in life, he has served in silence since the day the Forsaken were freed. He tells me the Light did not abandon him when he died, and that watching the Deathguard carry one of their own home has ended that silence. He asks to hold Bandarion Keep and to gather every Forsaken who would take up the Light again.\n\nThey call themselves Tyr's Watch."
 forsaken_kingdom.0001.desc.rename_only:0 "Garek Bandarion, Captain of the Deathguard, is dead. His guard carried him back to Autumnacre and would not hear of the old name: from this day the keep is Bandarion Keep, and the Deathguard will answer for it.\n\nNo one steps forward to keep his vigil. The keep stands, and the name will have to be enough."
 forsaken_kingdom.0001.a.founded:0 "Let the Watch keep his vigil."
 forsaken_kingdom.0001.a.rename_only:0 "Let the name stand."
 forsaken_kingdom.0002.t:0 "Tyr's Watch"
 forsaken_kingdom.0002.desc.light:0 "Word comes out of Tirisfal Glades that is hard to credit. Evin Schmidtt, a paladin of the Silver Hand who was raised in the fall of Lordaeron and freed with the Forsaken, has taken up the Light again and founded an order of it among the undead. He holds Bandarion Keep, named for Garek Bandarion, a captain of the Forsaken Deathguard whose own guard carried him home.\n\nThey call themselves Tyr's Watch. Whether the Light truly answers the dead, or whether this is one more Forsaken deceit, no one who tells the story can say."
 forsaken_kingdom.0002.desc.forsaken:0 "Word spreads through Tirisfal Glades. Evin Schmidtt, once a paladin of the Silver Hand, has taken up the Light again and founded an order of it at Bandarion Keep, the keep named for Garek Bandarion, Captain of the Deathguard.\n\nThey call themselves Tyr's Watch. Some of us call it a betrayal of everything the Banshee Queen has built. Some of us have gone to the keep to see whether the Light will answer them too."
 forsaken_kingdom.0002.desc.other:0 "Word comes out of the plaguelands of Lordaeron. Among the Forsaken, a former paladin named Evin Schmidtt has founded an order of the Holy Light at a keep named for a fallen captain of their Deathguard, Garek Bandarion.\n\nThey call themselves Tyr's Watch. An order of the Light, made of the walking dead, is not a thing anyone expected to hear of."
 forsaken_kingdom.0002.a.light:0 "The Light finds its own."
 forsaken_kingdom.0002.a.forsaken:0 "We will see what the Light makes of them."
 forsaken_kingdom.0002.a.other:0 "The dead keeping a vigil. What next."
