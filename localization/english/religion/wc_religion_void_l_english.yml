 voidfarer_desc:0 "While dangerous, Void magic can be carefully used for the benefit of its users and their allies. Some Void practitioners have devoted their lives to the study and use of the Void for good, such as the denizens of the Telogrus Rift, although there are some that are much more morally ambiguous than their peers, such as the K'areshi ethereals. Nevertheless, they can all enjoy the benefits of the Void without interference from the [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )], but still risk being corrupted by the malevolent whispers." # Need rework
