 wc_spell_raise_dead_disclaimer: "#italic Это заклинание можно сотворить, открыв окно персонажа мёртвого героя и нажав на иконку книги заклинаний.#!"

 game_concept_wc_spell_death_coil: "Лик смерти"
 game_concept_wc_spell_death_coil_desc: "Направьте эссенцию смерти, выпустив сгусток тёмной энергии. Это заклинание вытягивает жизненную силу живых, причиняя им вред, и в то же время врачует раны нежити-союзников, возвращая жизненную силу скованным смертью."
 wc_spell_death_coil_type: "[wc_spell_type_enchantment|E]"
 wc_spell_death_coil_targets: "[character|E]"
 wc_spell_death_coil_effects: "Направляет некромантическую энергию в цель, вредя живым и исцеляя мёртвых."
 wc_learn_spell_death_coil: "Вы изучаете заклинание: [wc_spell_death_coil|E]"
 wc_death_coil_hit_tt: "[this_recipient.GetShortUIName|U] [Select_CString(this_recipient.IsLocalPlayer, 'получаете', 'получает')] эффекты заклинания [wc_spell_death_coil|E]."
 wc_death_coil_dodge: "[this_recipient.GetShortUIName|U] уклоняется от [wc_spell_death_coil|E]!"
 wc_death_coil_resist_tt: "Из-за [wc_spell_school_death|E] [wc_magic_resistance|E] [this_recipient.GetShortUINamePossessive] заклинание не возымело эффекта."

 game_concept_wc_spell_death_grip: "Хватка смерти"
 game_concept_wc_spell_death_grip_desc: "Обрушьте незримую силу, чтобы схватить цель и притянуть её к себе неодолимой хваткой. Её движения замедляются, и она остаётся уязвимой, пока холодная хватка смерти лежит на её плоти."
 wc_spell_death_grip_type: "[wc_spell_type_attack|E]"
 wc_spell_death_grip_targets: "[army|E]"
 wc_spell_death_grip_effects: "Перемещает армию на одну провинцию ближе к армии заклинателя и на короткое время замедляет её движение."
 wc_learn_spell_death_grip: "Вы изучаете заклинание: [wc_spell_death_grip|E]"
 death_grip_movement_tt: "[this_recipient.GetName|U] перемещается на одну провинцию в сторону вашей армии."

 game_concept_wc_spell_give_disease: "Наслать Болезнь"
 game_concept_wc_spell_give_disease_desc: "Обуздайте силу мора, обрушив на цель разлагающую мощь. Это заклинание поражает её мерзостной болезнью — обычной или магической, разъедающей тело заразой."
 wc_spell_give_disease_type: "[wc_spell_type_attack|E]"
 wc_spell_give_disease_targets: "[character|E]"
 wc_spell_give_disease_effects: "Поражает цель магической или обычной болезнью."
 wc_learn_spell_give_disease: "Вы изучаете заклинание: [wc_spell_give_disease|E]"
 give_disease_tt: "Вы сможете выбрать, какой болезнью поразить цель, после начала сотворения заклинания."

 game_concept_wc_spell_death_and_decay: "Смерть и Разложение"
 game_concept_wc_spell_death_and_decay_desc: "Высвободите сырую мощь магии смерти, распространив по земле волну разложения, которая разъедает всё на своём пути, увядая жизнь и руша оборону."
 wc_spell_death_and_decay_type: "[wc_spell_type_enchantment|E]"
 wc_spell_death_and_decay_targets: "[county|E]"
 wc_spell_death_and_decay_effects: "Причиняет значительные потери от истощения каждой вражеской армии в графстве и снижает развитие."
 wc_learn_spell_death_and_decay: "Вы изучаете заклинание: [wc_spell_death_and_decay|E]"
 death_and_decay_title: "Вы находитесь под действием [wc_spell_death_and_decay|E]!"

 game_concept_wc_spell_cripple: "Калечение"
 game_concept_wc_spell_cripple_desc: "Призовите тёмную магию, резко ослабив физические и умственные способности цели. Когда проклятие берёт верх, цель остаётся хрупкой и уязвимой: её жизненная сила истощена, а воля к бою угасла."
 wc_spell_cripple_type: "[wc_spell_type_enchantment|E]"
