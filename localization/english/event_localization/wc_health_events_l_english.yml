l_english:
 WCHEA.1001.TITLE:0 "Plague of Undeath: Turning"
 WCHEA.1001.DESC:0 "It has been three days since I have last gotten up from my bed. At first, I had thought the ailment afflicting me to be nothing more than a simple cold, but it soon turned out to be far from the truth.\n\nThe first day, my courtiers brought me some foul loaf of bread which I couldn’t finish due to its putrid taste. But slowly they stopped coming, the hushed whispers of this place replaced by what seemed to be guttural screams.\n\nThen came the necrosis, as parts of my skin started falling apart. Yet I did not fear for I felt nothing any longer but a longing for a distant melody, a soft whisper in the wind calling to me.\n\n“Rise, and serve your King,” it said. And so, I rose anew."
 WCHEA.1001.OPT.A:0 "Must feed!"

 WCHEA.9000.TITLE:0 "World Weary"
 WCHEA.9000.DESC.other_being:0 "For the past few years, I have been tired; filled with longing to leave the world behind. Azeroth is a place of great power, but I am made of more than what it claims as its own. The affairs of its denizens seem so irrelevant and frivolous to me, and even my own accomplishments here feel hollow. I have grown in power beyond what this world can offer, and I long to experience the next plane of existence.\n\n[root.GetCharacter.player_heir.GetFirstNameRegnal] will handle my worldly affairs as my successor. My preparations are complete, all that is needed is to begin the ritual in a secluded place."
 WCHEA.9000.DESC.undead:0 "Today my leg fell off, and then when I went to stitch it back on, my right fingers all fell off. It was nearly three hours before [root.GetCharacter.player_heir.GetFirstNameRegnal] found me and took me to the corpse-stitcher to put me back together again.\n\nThis is not the first time this has occurred; in fact my body has been falling apart more and more often of late. The more it occurs, the more my will to continue has been drained. Lately I find myself fantasizing about simply disappearing, and finding somewhere to let my body fall apart in peace."
 WCHEA.9000.DESC:0 "The burden of my people is great. Since time immemorial, we have persisted in this land; many of us even remember the dawn of time, the sundering of the continents themselves. I do not know how they have endured so long.\n\nOf late I have begun to tire of this existence and the people that surround me. I want to let [root.GetCharacter.player_heir.GetFirstNameRegnal] have a chance to fill my shoes, for this world to continue moving without me. Yet my people take our burden and our duty seriously. I cannot simply retire, I must vanish from this world where none can find me."
 WCHEA.9000.OPT.A:0 "The time has come to leave all this behind."
 WCHEA.9000.OPT.B:0 "Not yet, there is still much to do."

 WCHEA.9001.TITLE:0 "Sargeras' Call"
 WCHEA.9001.DESC:0 "My mission on this world is complete. I have won victory after victory for [root.GetCharacter.GetFaith.HighGodName]; subjugated and slaughtered untold numbers of mortals for [root.GetCharacter.GetFaith.HighGodHerHis] gain and my personal enjoyment. Now, I hear [root.GetCharacter.GetFaith.HighGodNamePossessive] call once again, to return to the realms beyond and pursue [root.GetCharacter.GetFaith.HighGodHerHis] aims elsewhere. I shall not miss the stench of uncorrupted life which pervades its every corner.\n\nTo obey this command, I have set up a ritual which will allow me to leave this plane via the [twisting_nether|E]. All preparations are complete, my successor [root.GetCharacter.player_heir.GetFirstNameRegnal] stands ready to assume command after my departure. I must only speak the words of the spell in order to depart this realm for good."