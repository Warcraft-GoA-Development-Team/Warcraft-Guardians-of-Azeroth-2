 nozdormism: "Ноздормистск"
 nozdormism_adj: "Ноздормизм"
 nozdormism_adherent: "Ноздормист"
 nozdormism_adherent_plural: "Ноздормисты"
 nozdormism_desc: "Из всех Драконов именно Бронзовая драконья стая остаётся наиболее непостижимой — и не без оснований. Их сфера, которую они считают священным долгом, возложенным на них Аспектом Времени, — сохранение хронологического и причинно-следственного порядка, а также поддержание целостности мироздания. Это ставит Бронзовых драконов за гранью понимания даже самых мудрых смертных, хотя их обычно считают самыми дружелюбными к меньшим расам, когда выпадает редкая возможность встретиться с ними. Для смертных последователей Бронзовой стаи их загадочные пророчества и таинственные деяния служат свидетельством высшего права на Божественность, унаследованного от древних Титанов. Из-за ограниченного понимания живых богов Бронзовой стаи эти смертные глубоко верят в судьбу и предопределение, считая себя во власти непостижимых законов вселенной."
