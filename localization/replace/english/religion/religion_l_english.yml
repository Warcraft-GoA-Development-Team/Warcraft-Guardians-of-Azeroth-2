l_english: 
 special_doctrine_ecumenical_christian_name: "Ecumenism"
 special_doctrine_ecumenical_christian_desc: "Our religious leaders have historically been engaged in inter-faith dialogs to increase cooperation amongst the different Christian denominations."
 special_doctrine_ecumenical_miaphysite_name: "Miaphysite Communion"
 special_doctrine_ecumenical_miaphysite_desc: "Despite their separate hierarchies, the Miaphysite churches remain in full communion, recognizing one another's sacraments and clergy."

 # Doctrine is invisible, but still needs these keys
 special_doctrine_has_clerical_electors_name: "Clerical Electors"
 special_doctrine_has_clerical_electors_desc: "This [faith|E] elects its [head_of_faith|E] through [cardinals|E]."
 has_clerical_electors_name: "Clerical Electors"
 
 adoptionist_school_name: "Adoptionist Creed"
 special_doctrine_adoptionist_school_elipandic_doctrine_name: "Elipandic School"
 special_doctrine_adoptionist_school_elipandic_doctrine_desc: "Preferring to focus on subtle variations in Christology, the Elipandic variant of $adoptionist$ stresses the importance of #EMP precise#! differences from Trinitarian dogma. A complex distinction well made is considered infinitely better than a simple explanation poorly justified."
 special_doctrine_adoptionist_school_felicitous_doctrine_name: "Felicitous School"
 special_doctrine_adoptionist_school_felicitous_doctrine_desc: "Felician $adoptionist$ believes in practicality above purity, understanding that it must work within hostile systems to undermine them. A heinous lie in pursuit of a noble cause is thought to be worth a thousand blunt truths."
 special_doctrine_adoptionist_school_radical_doctrine_name: "Radical School"
 special_doctrine_adoptionist_school_radical_doctrine_desc: "Radical $adoptionist_adherent_plural$ admit no God but the Father, accept no divinity from mortal flesh, and acknowledge no $christianity_religion_adherent_plural$ but themselves. To receive Christ without agreeing on every #EMP letter#! of canon is to acknowledge apostasy."

 special_doctrine_is_christian_faith_name: "Teachings of Jesus"
 is_christian_faith_name: "$special_doctrine_is_christian_faith_name$"
 special_doctrine_is_christian_faith_desc: "There are those in the world who adhere to the teachings of Jesus without acknowledging his divinity. Though blasphemous, we should still show compassion to these misguided souls, as they may one day become converts to the true faith."

 special_doctrine_is_islamic_faith_name: "Teachings of the Prophet"
 is_islamic_faith_name: "$special_doctrine_is_islamic_faith_name$"
 special_doctrine_is_islamic_faith_desc: "Although they do not follow all of the laws of the Prophet, there are some in this world who are more guided by the will of Allah than they know. With time, these half-converts may even give up their evil ways and become true members of the Ummah!"

 special_doctrine_is_jewish_faith_name: "Teachings of Moses"
 is_jewish_faith_name: "$special_doctrine_is_jewish_faith_name$"
 special_doctrine_is_jewish_faith_desc: "Not all among the gentility dwell in sin. There are those who respect God's chosen people, and these deserve a measure of our respect in turn."

 prophecy_of_malachi_name: "The Prophecy of Malachi"
 special_doctrine_not_allowed_to_hof_name: "Dismantled Priesthood"
 not_allowed_to_hof_name: "$special_doctrine_not_allowed_to_hof_name$"
 prophecy_of_malachi_desc: "Under traditional Jewish doctrine, a new High Priest can only be named either with the coming of the Prophet or if a descendant of Aaron fit to serve as priest is found."
 special_doctrine_not_allowed_to_hof_desc: "The High Priesthood of this faith has been completely dismantled. Any attempts to name a High Priest would first require a thorough reconstruction of traditional church structure."
 doctrine_parameter_block_from_create_hof_parameter: "This faith cannot recreate its [head_of_faith|E] under normal circumstances."

 doctrine_parameter_hostility_override_tenet_eastern_syncretism:0 "Non-Eastern [faiths|E] with the $tenet_eastern_syncretism_name$ tenet are considered [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_evil_tooltippable$"

 special_doctrine_is_sinitic_faith_name: "Sinitic Cosmology"
 is_sinitic_faith_name: "$special_doctrine_is_sinitic_faith_name$"
 special_doctrine_is_sinitic_faith_desc: "$special_doctrine_is_eastern_faith_desc$"
 doctrine_parameter_hostility_override_tenet_sinitic_syncretism: "Non-Sinitic [faiths|E] with the $tenet_sinitic_syncretism_name$ tenet are considered [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V] instead of $hostility_evil_tooltippable$"

 special_doctrine_fire_worship_name: "Sacred Fire"
 fire_worship_name: "$special_doctrine_fire_worship_name$"
 special_doctrine_fire_worship_desc: "We are all united by our veneration of fire, the purest element and agent of divine glory. It is our sacred duty to keep the eternal fires burning in the world, to dispel falsehood and evil." 
 doctrine_parameter_same_hof_hostility_override:0 "Considers other [faiths|E] that share their [head_of_faith|E] to be [GetHostilityLevelName( TOKEN_PARAMETER.GetIntValue )|V]"

 is_hostile_to_maitreya_name: "$maitreya$ Hostility"
 special_doctrine_maitreya_hostility_name: "Hostile to $maitreya_adherent_plural$"
 special_doctrine_maitreya_hostility_descriptive_name: "Hostililty towards $maitreya_adherent_plural$"
 special_doctrine_maitreya_hostility_desc: "$maitreya_adherent_plural$ seek to destroy all other followers of the Buddha's teachings. While not all follow the same path, the ways of $maitreya$ are intolerable."
 special_doctrine_is_maitreya_name: "Is $maitreya$"
 special_doctrine_is_maitreya_descriptive_name: "$maitreya_adj$ Take on Buddha's teachings"
 special_doctrine_is_maitreya_desc: "It is our solemn duty to rebuild the world and usher in the age of the Maitreya Buddha."
 #Internal, invisible classification doctrines used by portrait/appearance triggers.
 special_doctrine_is_western_christian_faith_name: "Western Christian"
 special_doctrine_is_western_christian_faith_desc: "Belongs to the Western (Latin) Christian tradition."
 special_doctrine_is_eastern_christian_faith_name: "Eastern Christian"
 special_doctrine_is_eastern_christian_faith_desc: "Belongs to an Eastern Christian tradition (Orthodox, Miaphysite, Church of the East, etc.)."
 christian_tradition_classification_name: "Christian Tradition"

 doctrine_christianity_monasticism_latin_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_latin$\n\n[Glossary('Monasticism Historical Background','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_christianity_monasticism_greek_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_greek$\n\n[Glossary('Monasticism Historical Background','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_christianity_monasticism_default_desc: "$tenet_monasticism_desc$\n\n$pam_matthew_16_24_default$\n\n[Glossary('Monasticism Historical Background','doctrine_monasticism_christianity_historical_desc')]"
 doctrine_monasticism_general_desc: "$tenet_monasticism_desc$\n\n[Glossary('Monasticism Historical Background','doctrine_monasticism_general_historical_desc')]"
 doctrine_monasticism_christianity_historical_desc: "Monasticism spread throughout the Catholic world during the Middle Ages, with monasteries established across Europe, North Africa, and the Middle East. Monks and nuns took vows of poverty, chastity, and obedience, living either as hermits in isolated cells or in communal houses under strict rules.\n\nThese institutions served multiple functions: preserving manuscripts and classical texts, providing education, operating hospitals and hospices, managing agricultural estates, and offering hospitality to travelers. Monastic orders like the Benedictines, Cistercians, and Carthusians each developed distinct traditions regarding prayer, work, and community life."
 doctrine_monasticism_general_historical_desc: "Monastic communities exist across many religious traditions, not only Christianity but also Buddhism, Hinduism, and Jainism. These institutions typically involve individuals withdrawing from ordinary society to pursue religious devotion through prayer, meditation, study, and ascetic practices.\n\nMonasteries often function as centers of learning, preserving sacred texts and providing education. They may be completely isolated from the surrounding population or maintain active engagement through charitable works, medical care, and agricultural production. The specific rules governing monastic life vary widely between traditions and individual communities."
 doctrine_sacraments_central_latin_desc: "$tenet_communion_desc$\n\n$pam_luke_22_19_latin$"
 doctrine_sacraments_central_greek_desc: "$tenet_communion_desc$\n\n$pam_luke_22_19_greek$"
 doctrine_communion_historical_desc: "At the Passover meal on the eve of his crucifixion, Christ blessed bread, broke it, and gave it to his disciples, saying #weak 'This is my body, which is given for you. Do this in remembrance of me.'#! He declared the cup of wine his blood of the new covenant, shed for the forgiveness of sins.\n\nThis institution of the Eucharist became the central act of Christian worship, repeated in each Mass and Divine Liturgy. For believers, communion is a participation in Christ's sacrifice, not a memorial only, uniting the faithful with their Savior and with one another."
 doctrine_sacraments_general_desc: "The faith gives sacraments and sacred rites central importance. Rituals are not merely symbolic but invoke the presence of the divine. The clergy administer them and the faithful may be excommunicated."

 NEW_ECCLESIASTICAL_TITLE: "$d_et_archdiocese_prefix$ of [region_capital.GetNameNoTooltip|U]"

 doctrine_pilgrimage_mandatory_hajj_name: "Hajj"
 doctrine_pilgrimage_mandatory_hajj_desc: "It is expected that all able-bodied Muslims complete a Hajj to Mecca during their lifetime. While special exemptions are often made, any [ROOT.Faith.GetAdherentNameNoTooltip] who fails to complete a Hajj will be looked upon with skepticism."
 mandatory_hajj_name: "$doctrine_pilgrimage_name$: $doctrine_pilgrimage_mandatory_name$"
 doctrine_parameter_mandatory_hajj: "The [GetTrait('hajjaj').GetName( GetNullCharacter )] [trait|E] grants additional bonuses and the [hajj|E] [activity|E] grants extra [piety|E] upon completion"