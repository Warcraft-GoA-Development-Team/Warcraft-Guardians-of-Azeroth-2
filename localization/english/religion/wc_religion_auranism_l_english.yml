 al_akirism_adherent_plural:0 "Al'Akirites"
 al_akirism_desc:0 "Al'Akir is the most cunning of the Elemental Lords. Master of storms, he commands the winds to bring destruction or protection at his will. His followers admire his subtlety, seeing in him a strategist able to both dominate and defend the heavens. Though his actions may seem unpredictable, all serve a single purpose: his supremacy over the skies."
 
