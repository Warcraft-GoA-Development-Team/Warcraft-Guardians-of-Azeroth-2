    building_arcandor_tree_desc:0 "Created from the essence of Arcane and Nature magic alike, the tree survives even in the absence of water, light and soil. Kept alive by the energy of a ley line, it nourshes those once dependent on wells of power, essentially curing their addictions."


  ##Broken Shores
    building_type_vault_of_the_wardens_01:0 "$holy_site_vault_of_the_wardens_name$"
    building_vault_of_the_wardens_01:0 "$building_type_vault_of_the_wardens_01$"
    building_vault_of_the_wardens_01_desc:0 "Opened by the Darnassian phrase 'Anu'dorini Talah', which translates to "Let my will be known", this grand prison complex holds some of the Legion's worst criminals; among void beings, demons, and others. Built by Maiev Shadowsong after the War of the Ancients, this Warden facility was carved into the mountainside and protected with magic to keep prisoners from escaping. Yet not all agree that all who are held within are a danger to Azeroth, and in the right hands the prisoners of the Vault could become valuable allies for those with the unscrupulousness or desperation to do whatever it takes to win."
    
    building_type_cathedral_eternal_night:0 "Cathedral of Eternal Night"
    building_type_cathedral_eternal_night_desc:1 "This dread edifice, forged in the crucible of ancient lore and sinister power, looms over the tumultuous seas with an imposing presence that eclipses mortal comprehension. Its jagged spires, laced with the malevolent remnants of fel energy, pierce the skyline like ominous reminders of a tumultuous past, etching tales of unfathomable turmoil into the very fabric of the skies."
    building_cathedral_eternal_night:1 "Cathedral of Eternal Night"
    building_cathedral_eternal_night_desc:1 "The Cathedral of Eternal Night is a great structure containing the corpse of the Avatar of Sargeras in the deepest depths of the temple. After centuries, the dark power of the Avatar worked its influence upon the halls of the structure, twisting and corrupting it with fel energy."
 

  
