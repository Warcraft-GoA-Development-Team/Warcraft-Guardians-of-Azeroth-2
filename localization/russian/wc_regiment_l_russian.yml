 ###MaA types 
 caster: "[caster|E]"
 light_aerial: "[light_aerial|E]"
 massive_aerial: "[massive_aerial|E]"
 massive_infantry: "[massive_infantry|E]"
  
  #Warcraft Base MaA 
 caster_unit: "Заклинатели"
 giant_unit: "Гиганты"
 massive_aerial_unit: "Большие воздушные единицы"
 riflemen: "Стрелки"
 aerial_unit: "Воздушные единицы"
  
  # Warcraft Base MaA Descriptions 
 caster_unit_flavor: "#F Умелые заклинатели из всех магических школ являются основой любой армии, так как быстро адаптируются к любым полям боя.#!"
 giant_unit_flavor: "#F Эти могучие воины возвышаются над любым простым солдатом и с легкостью уничтожают большие скопления врагов.#!"
 aerial_unit_flavor: "#F Хорошо вооруженные наездники доминируют в небесах, делая всех, кто находится на земле, уязвимыми для атак с любых сторон.#!"
  
 massive_aerial_unit_flavor: "#F Колоссальные летающие чудовища бороздят небеса, с ужасающей легкостью опустошая поверхность.#!"
 riflemen_flavor: "#F Война изменилась по мере того, как огнестрельное оружие стало более эффективным и широко применяемым. Хотя винтовки признаны относительно неточными, особенно на больших дистанциях, они облаают большой огневой мощью и могут пробить даже самых крупных и тяжелобронированных противников.#!"
  
 ###Regional MaA 
 gryphon_rider: "Всадники на грифонах"
 gryphon_rider_flavor: "#F Отважные наездники на грифонах устремляются в бой на своих благородных грифонах, с неустанной решимостью защищая небеса от врагов."
 unlock_maa_gryphon_rider: "Можно нанимать [GetMaA('gryphon_rider').GetName] в качестве [men_at_arms|E]"
  
 kodo_rider: "Всадники на кодо"
 kodo_rider_flavor: "#F Огромные кодо, служащие символам мощи и доблести, умело используют своё огромный размер и силу, чтобы помочь нашим армиям в бою."
 unlock_maa_kodo_rider: "Можно нанимать [GetMaA('kodo_rider').GetName] в качестве [men_at_arms|E]"
  
 wyvern_rider: "Ветрокрылы"
 wyvern_rider_flavor: "#F Вместе с нашими новыми союзниками, вивернами, мы создали отряд опытных воздушных бойцов - Ветрокрылов. Наконец-то небо находится под нашим контролем."
 unlock_maa_wyvern_rider: "Можно нанимать [GetMaA('wyvern_rider').GetName] в качестве [men_at_arms|E]"
  
 unlock_maa_camel_rider: "Можно нанимать [GetMaA('camel_rider').GetName] в качестве [men_at_arms|E]"
  
 unlock_maa_aerial_unit: "Можно нанимать [GetMaA('aerial_unit').GetName] в качестве [men_at_arms|E]"
  
