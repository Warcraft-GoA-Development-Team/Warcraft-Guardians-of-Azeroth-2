 wc_learn_spell_expulsion: "Вы изучаете заклинание: [wc_spell_expulsion|E]"

 game_concept_wc_spell_salvation: "Ритуал: Спасение"
 game_concept_wc_spell_salvation_desc: "Воззовите к Свету, чтобы спасти персонажа от смерти."
 wc_spell_salvation_type: "[wc_spell_type_ritual|E]"
 wc_spell_salvation_targets: "[character|E]"
 wc_spell_salvation_effects: "Спасает персонажа от смерти при определённых условиях.\n\nЕсли персонаж является [GetTrait('being_undead').GetName( GetNullCharacter )] (кроме тех, чей [wc_race_class|E] — #V Нежить#!), его можно вернуть к нормальному состоянию, возможно, вернув ему прежнюю [faith|E] и [culture|E], но срок его жизни сократится. Не обязательно спасает от естественной смерти.\n\nПомните: никого нельзя спасти дважды, а Свет не может коснуться [GetTrait('being_demon').GetName( GetNullCharacter )]."
 wc_learn_spell_salvation: "Вы изучаете заклинание: [wc_spell_salvation|E]"

 game_concept_wc_spell_divine_storm: "Ритуал: Божественная Буря"
 game_concept_wc_spell_divine_storm_desc: "Воззовите к Свету, ранив себя, но покарав врагов на своём пути."
 wc_spell_divine_storm_type: "[wc_spell_type_ritual|E]"
 wc_spell_divine_storm_targets: "[duchy|E]"
 wc_spell_divine_storm_effects: "Наносит вам [wc_injury_burned|E], [GetTrait('holy_wrath').GetName( GetNullCharacter )] или [GetTrait('wounded_1').GetName( GetNullCharacter )]. Это вызывает священный взрыв в выбранном [duchy|E], сжигающий всё на своём пути. Большинство людей в герцогстве получают огромный урон и могут получить [wc_injury_burned|E], [GetTrait('holy_wrath').GetName( GetNullCharacter )] или [GetTrait('wounded_1').GetName( GetNullCharacter )], а персонажи (Бездны, скверны, нежити) имеют небольшой шанс погибнуть в зависимости от их [wc_magic_resistance|E] к Свету."
 wc_learn_spell_divine_storm: "Вы изучаете заклинание: [wc_spell_divine_storm|E]"
 wc_divine_storm_tt: "На каждого персонажа в этом герцогстве подействует [wc_spell_divine_storm|E], а [GetTrait('being_void').GetName( GetNullCharacter )], [GetTrait('being_undead').GetName( GetNullCharacter )], [GetTrait('being_demon').GetName( GetNullCharacter )] или похожие персонажи имеют шанс получить травму."
 wc_divine_storm_title: "Божественная Буря настигла вас!"

 game_concept_wc_spell_blessed_bastion: "Ритуал: Благословенный Бастион"
 game_concept_wc_spell_blessed_bastion_desc: "Создайте бастион Света, защищающий вашу державу от вреда."
 wc_spell_blessed_bastion_type: "[wc_spell_type_ritual|E]"
 wc_spell_blessed_bastion_targets: "[duchy|E]"
 wc_spell_blessed_bastion_effects: "Создаёт барьер вокруг целевых герцогств, повышая уровень укреплений. Также даёт заклинателю оборонительные преимущества."
 wc_learn_spell_blessed_bastion: "Вы изучаете заклинание: [wc_spell_blessed_bastion|E]"
 wc_adventurer_perk_blessed_bastion: "#help Поскольку [wc_spell_blessed_bastion|E] не подходит безземельному авантюристу, вы будете получать постоянные преимущества, пока остаётесь авантюристом. Получив земли, вы сможете использовать [wc_spell_blessed_bastion|E] так, как это задумано для оседлых правителей.#!"

