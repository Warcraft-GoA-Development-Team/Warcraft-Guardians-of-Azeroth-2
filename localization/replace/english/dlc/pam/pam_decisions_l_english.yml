 pam_kingdom_of_heaven.0001.t: "The Kingdom of Heaven"
 pam_kingdom_of_heaven.0001.desc: ""The kingdom of God is as if someone would scatter seed on the ground and would sleep and rise night and day, and the seed would sprout and grow, he does not know how."\n\nI turn my body to Christendom. In my fingers, I hold dirt from the Holy Land.\n\n"The earth produces of itself first the stalk," I hold my hand open and the dirt dissipates into the air. "Then the head," I point at my people. "Then the full grain in the head." I raise my crozier.\n\n"But when the grain is ripe... at once he goes in with his sickle because the harvest has come.""
 pam_kingdom_of_heaven.0001.a: "I will not abandon [previous_capital.GetNameNoTooltip]."
 pam_kingdom_of_heaven.0001.b: "What is the Seat of Saint Peter compared to the Seat of Christ?"
