 building_thunderdrome: "Громодром"
 building_thunderdrome_desc: "Здесь устраивают бои для развлечения публики — чем кровавее, тем лучше, но не насмерть. Желающим поучаствовать следует обратиться к устроителю боёв доктору Сделвеллу."
 building_thunderstrike_mountain: "$building_type_thunderstrike_mountain$"
 building_thunderstrike_mountain_desc: "$building_type_thunderstrike_mountain_desc$"
 building_timbermaw_tunnels: "$building_type_timbermaw_tunnels$"
 building_timbermaw_tunnels_desc: "$building_type_timbermaw_tunnels_desc$"
 building_tirion_statue: "Статуя Тириона Фордринга"
 building_tirion_statue_desc: "Хартгленом правил паладин Тирион Фордринг; эта статуя посвящена ему."
 building_torga_rest: "Приют Торги"
 building_torga_rest_desc: "Труп Торги — мудрой и доброй лоа, убитой кровяными троллями."
 building_totem_dominance: "Тотем Господства"
 building_totem_dominance_desc: "Когда между двумя [GetTrait('creature_yaungol').GetName( GetNullCharacter )] возникает спор, под ними водружается знамя. Затем они сражаются друг с другом затупленным оружием, пока один не сдастся или не потеряет сознание. "
 # Типы зданий
 building_type_aerie_aviary: "Авиарий грифонов"
 building_type_aerie_aviary_desc: "Дань уважения легендарным зверям, что обитают внутри, — колоссальная громада Авиария грифонов возвышается над всем, что видит. Священнее всего для дворфов — зачарованная кузня, что лежит в сердце каждого авиария."
 building_type_agamaggan_blood: "Кровь Агамаггана"
 building_type_agamaggan_blood_desc: "Легенды гласят, что там, где пал полубог Агамагган, его кровь породила огромные заросли тернистых лоз. Его дух до сих пор пребывает в этих землях."
 building_type_alonsus_chapel: "Часовня Вечного Пламени Алонсуса"
 building_type_alonsus_chapel_desc: "Защищённая от [GetTrait('being_undead').GetName(GetNullCharacter)] Вечным Пламенем, Часовня Алонсуса — место, где были посвящены первые паладины Ордена Серебряной Длани."
 building_type_altar_of_harkoa: "Алтарь Хар'коа"
 building_type_altar_of_harkoa_desc: "Этот алтарь посвящён Хар'коа, лоа-леопарду драккари."
 building_type_altar_of_kings: "Алтарь Королей"
 building_type_altar_of_kings_desc: "Мистическое здание с волшебными свойствами, служащее вместилищем для осиротевших жизненных сил."
 building_type_altar_of_quetzlun: "Алтарь Кецу'лун"
 building_type_altar_of_quetzlun_desc: "Этот алтарь посвящён Кецу'лун, лоа-крылатому змею драккари."
 building_type_altar_of_rhunok: "Алтарь Ру'нока"
 building_type_altar_of_rhunok_desc: "Этот алтарь посвящён Ру'ноку, лоа-арктическому медведю драккари."
 building_type_altar_of_sseratus: "Алтарь Ссератуса"
 building_type_altar_of_sseratus_desc: "Этот алтарь посвящён Ссератусу, лоа змей и ползучих тварей драккари."
 building_type_altar_of_storms: "$building_altar_of_storms$"
 building_type_altar_of_storms_desc: "$building_altar_of_storms_desc$"
 building_type_ammen_fields_01: "Поля Аммена"
 building_type_ammen_fields_01_desc: "Этот небольшой ландшафт состоит из странной фиолетовой травы и цветов. По полям также разбросаны обломки крушения «Экзодара»."
 building_type_andrassil_01: "Андрассил"
 building_type_andrassil_01_desc: "В переводе — «Корона Снегов»; древо было выращено из ветви Нордрассила Фандралом Оленьим Шлемом и его друидами, чтобы остановить распространение саронита на северном континенте."
 building_type_atulnazman: "Атул'назман"
 building_type_atulnazman_desc: "[Glossary( 'titan', 'TITAN_GLOSS' )] пирамида, хранящая Печать Назмира."
 building_type_azora_tower: "Башня Азоры"
 building_type_azora_tower_desc: "Добрая противоположность [GetBuilding('ilgalar_tower').GetName]; этой башней владеют те, кто изучает тайные искусства."
 building_type_azure_dragonshrine: "Лазурное святилище драконов"
 building_type_azure_dragonshrine_desc: "Это огромный разлом в земле, извергающий магию в воздух; над ним парит очередная вездесущая игла-усилитель синей драконьей стаи."
 building_type_banana_tree: "Банановые деревья Тел'Абима"
 building_type_banana_tree_desc: "Все бананы в мире родом с Тел'Абима. Их целебные свойства делают их отличным лакомством."
 building_type_bandinoriel_01: "Бан'динориэль"
 building_type_bandinoriel_01_desc: "Почти неприступный тайный щит, защищающий Луносвет."
 building_type_baradin_hold_01: "Цитадель Барадин"
 building_type_baradin_hold_01_desc: "Цитадель Барадин — главная крепость Тол Барада; тот, кто владеет Цитаделью, владеет Тол Барадом."
 building_type_blackmaw_scar: "Ущелье Чёрной Пасти"
 building_type_blackmaw_scar_desc: "Неглубокий каньон, полный улиток."
 building_type_blackwing_lair: "Логово Чёрного Крыла"
 building_type_blackwing_lair_desc: "В тёмных глубинах горной вершины Нефариан, старший сын Смертокрыла, проводит свои самые чудовищные эксперименты, управляя могучими существами, словно марионетками, и сочетая яйца разных драконьих стай с ужасающими последствиями. Если он преуспеет, впереди его ждут ещё более тёмные изыскания."
 building_type_blood_god_altar: "Алтарь Кровавого бога"
 building_type_blood_god_altar_desc: "Здесь можно найти Кровавого бога Хаккара Пожирателя Душ и многих его детей-змей. "
 building_type_bloodsail_hold: "Крепость Кровавого Паруса"
 building_type_bloodsail_hold_desc: "Огромная крепость, ощетинившаяся пушками; Крепость Кровавого Паруса — главная база буканьеров Кровавого Паруса."
 building_type_bogpaddle_resort: "Курорт Топь-Пристань"
 building_type_bogpaddle_resort_desc: "Единственный приморский курорт и склад военного оружия в Восточных королевствах."
 building_type_brewing_cauldron: "Варочный котёл хозенов"
 building_type_brewing_cauldron_desc: "Каждую ночь [GetTrait('creature_hozen').GetName( GetNullCharacter )] устраивают вечеринки и варят пунш в этом котле."
 building_type_bronze_dragonshrine: "Бронзовое святилище драконов"
 building_type_bronze_dragonshrine_desc: "Это невероятно тёплый оазис, описываемый как невыносимо жаркий водоём из вечно перетекающего песка."
 building_type_circle_of_spirits: "Круг Духов"
 building_type_circle_of_spirits_desc: "Сновидная роща — оплот друидов, а Круг Духов содержит четыре статуи, олицетворяющие каждую из специализаций друида."
 building_type_crane_temple: "Храм Красного Журавля"
 building_type_crane_temple_desc: "Возвышающийся комплекс изысканной каменной кладки с крышей из багровых черепиц, которую видно издалека; дом Августейшего Небожителя Чи-Цзи, небесного воплощения надежды."
 building_type_crapopolis: "Краполис"
 building_type_crapopolis_desc: "Городок [GetTrait('creature_goblin').GetName( GetNullCharacter )]ов на южном берегу Кезана."
 building_type_crash_site_01: "Место крушения"
 building_type_crash_site_01_desc: "Крупный обломок «Экзодара» рухнул здесь, из-за чего радиация просочилась в окружающую среду."
 building_type_deatholme: "Смертхольм"
 building_type_deatholme_desc: "Смертхольм — крупнейший опорный пункт [scourge|E] в Восточных королевствах"
 building_type_deeprun_tram: "Метро Глубинного Пути"
 building_type_deeprun_tram_desc: "Метро Глубинного Пути соединяет Штормград и Стальгорн."
 building_type_dragon_spine: "Хребет Дракона"
 building_type_dragon_spine_desc: "Здесь, окружённые лавой, покоятся кости чёрных драконов, убитых в разгар ярости Смертокрыла. Они излучают отголоски мощи чёрной драконьей стаи, что делает Хребет Дракона самой могущественной частью логова."
 building_type_dream_portal: "Портал Сна"
 building_type_dream_portal_desc: "Портал, ведущий в Изумрудный Сон."
 building_type_durnholde_camp_01: "Лагерь для интернированных в Дернхольде"
 building_type_durnholde_camp_01_desc: "Годы [GetTrait('creature_human').GetName(GetNullCharacter)]ы использовали крепость как лагерь для интернированных и тюрьму для [GetTrait('creature_orc').GetName(GetNullCharacter)]ов."
 building_type_emerald_dragonshrine: "Изумрудное святилище драконов"
 building_type_emerald_dragonshrine_desc: "Пышный лес, окружающий озеро; Изумрудное святилище драконов — единственное место, способное затмить Рубиновое святилище драконов."
 building_type_emperor_tombs: "Гробницы Императоров"
 building_type_emperor_tombs_desc: "Последнее пристанище нескольких императоров [GetTrait('creature_mogu').GetName( GetNullCharacter )]ов и одного императора [GetTrait('creature_hozen').GetName( GetNullCharacter )]ов."
 building_type_everstill_bridge_01: "Мост Вечной Тишины"
 building_type_everstill_bridge_01_desc: "Мост через озеро Вечной Тишины, соединяющий городок Озёрная Гавань с южной частью Красногорья."
 building_type_forge_origination_01: "Кузня Созидания"
 building_type_forge_origination_01_desc: "В глубине места, именуемого Залами Созидания, находится устройство [Glossary( 'titan', 'TITAN_GLOSS' )]ов. Оно задумано как аварийный переключатель сброса для всей жизни на Азероте. Если его активировать, оно уничтожит всё живое в мире!"
 building_type_forgotten_pools: "Забытые Омуты"
 building_type_forgotten_pools_desc: "Родина уникального Грузного Гриба; этот оазис патрулируют [GetTrait('creature_centaur').GetName(GetNullCharacter)]."
 building_type_frostsaber_rock: "Скала Морозного Клыка"
 building_type_frostsaber_rock_desc: "Скала Морозного Клыка — небольшая пещера; внутри она используется не кошками, а надеющимися на удачу укротителями. Морозные клыки бродят у вершины скалы, а укротители разбивают лагерь рядом, пытаясь убедить могучих зверей стать их спутниками. "
 building_type_giant_dino_bones: "Гигантские кости динозавров"
 building_type_giant_dino_bones_desc: "Гигантские кости динозавров можно найти близ паровых источников в середине острова."
 building_type_gol_inath: "Гол Инат"
 building_type_gol_inath_desc: "Это древо смерти почитается друстами и используется для входа в Трос, поражённые земли."
 building_type_greymane_court: "Двор Греймейна"
 building_type_greymane_court_desc: "Мы будем биться с ними в переулках, пока наши костяшки не ободраны в кровь, а рапиры не лежат разбитыми на земле."
 building_type_grimbatol_fortress: "Крепость Грим Батол"
 building_type_grimbatol_fortress_desc: "Грим Батол — горная крепость, основанная кланом Громового Молота; она была проклята после вторжения сил [Glossary( 'Dark Iron dwarves', 'DARK_IRON_DWARF_GLOSS' )]ов."
 building_type_grommash_hold: "Цитадель Громмаша"
 building_type_grommash_hold_desc: "Огромная крепость, названная в честь героя [GetCulturePillar('heritage_orcish').GetName] — Громмаша Адского Крика."
 building_type_guardian_hozen: "Каменный Хранитель-хозен"
 building_type_guardian_hozen_desc: "Зелёные статуи [GetTrait('creature_hozen').GetName( GetNullCharacter )]ов охраняют вход на Холм Грукина."
 building_type_gundrak_temple: "Гун'Драк"
 building_type_gundrak_temple_desc: "Древние лоа, убитые собственными почитателями-драккари; их священные святилища, утопающие в моджо, даруют силу драккари."
 building_type_hall_of_chieftains: "Зал Вождей"
 building_type_hall_of_chieftains_desc: "Центр Громового Тотема, где могут собраться вожди всех племён. "
 building_type_hall_of_valor: "Чертоги Доблести"
 building_type_hall_of_valor_desc: "В облаках высоко над Штормхеймом титанический хранитель Один призвал величайших воинов [GetTrait('creature_vrykul').GetName(GetNullCharacter)]ов Азерота стать его валарьярами. Среди пиршественных залов и охотничьих угодий эти вознесённые врайкулы испытывают себя и готовятся к великой грядущей войне."
 building_type_haustvauld_altar: "Алтарь Хауствальда"
 building_type_haustvauld_altar_desc: "Могущественный алтарь, используемый мистиками [GetTrait('creature_vrykul').GetName(GetNullCharacter)]ов для воссоединения духа и тела павших воинов. Хауствальд также служит одной из немногих точек доступа в царство Хельхейма — владения Морской ведьмы Хелии."
 building_type_heart_of_fear: "Сердце Страха"
 building_type_heart_of_fear_desc: "Ша Страха развратил великую императрицу мантидов."
 building_type_heroes_vigil: "Бдение Героев"
 building_type_heroes_vigil_desc: "Кольцо камней и монумент под названием Камень Памяти, отмечающий погибших во время разграбления [GetTrait('creature_orc').GetName(GetNullCharacter)]ами Голдшира и соседних областей в ходе [Glossary( 'First War', 'FIRST_WAR_GLOSS' )]."
 building_type_howling_oak: "Воющий Дуб"
 building_type_howling_oak_desc: "Это древо — «воргенское древо», как Тал'дорен в Чёрном Лесу."
 building_type_icemist_waterfalls: "Водопады Ледяной Дымки"
 building_type_icemist_waterfalls_desc: "Деревню Ледяная Дымка окружает множество водопадов, берущих начало из озера Зимней Хватки."
 building_type_ilgalar_tower: "Башня Ильгалара"
 building_type_ilgalar_tower_desc: "Злая противоположность [GetBuilding('azora_tower').GetName]; этой башней владеют те, кто изучает тёмные искусства."
 building_type_ironforge_gate: "Врата Стальгорна"
 building_type_ironforge_gate_desc: "Неприступные врата Стальгорна защищают город."
 building_type_jade_temple: "Храм Нефритовой Змеи"
 building_type_jade_temple_desc: "Возвышаясь над восточным побережьем Пандарии, Храм Нефритовой Змеи стоит как священный памятник победе легендарного императора [GetTrait('creature_pandaren').GetName( GetNullCharacter )]ов Шаохао над Ша Сомнения тысячи лет назад."
 building_type_jaina_tower: "Башня Джайны"
 building_type_jaina_tower_desc: "Эта башня мага — самое высокое сооружение Терамора, в ней размещается обширная библиотека. Стены, защищённые всевозможными охранительными чарами, делают её надёжной крепостью против атак."
 building_type_janeiro_point: "Мыс Жанейро"
 building_type_janeiro_point_desc: "Гигантская статуя неизвестного [GetTrait('creature_goblin').GetName( GetNullCharacter )]а приветствует всех в этом процветающем приморском городе!"
 building_type_kamagua_harbor: "Гавань Камагуа"
 building_type_kamagua_harbor_desc: "Важная остановка в кочевьях многих различных кланов [GetTrait('creature_tuskarr').GetName( GetNullCharacter )]ов."
 building_type_knights_hollow: "Лощина Рыцаря"
 building_type_knights_hollow_desc: "Две статуи окружают могилу неизвестного солдата."
 building_type_kodo_rock: "Скала Кодо"
 building_type_kodo_rock_desc: "Для шаманов принято выпивать сапту на этом святом месте, чтобы открыть разум духам."
 building_type_kros_ritual_stone: "Ритуальный камень Кроса"
 building_type_kros_ritual_stone_desc: "Племя Скрябок из [GetTrait('creature_saurok').GetName( GetNullCharacter )]ов верит, что их создал невидимый девозавр из небес — Крос."
 building_type_leviroth_prison: "Тюрьма Левирота"
 building_type_leviroth_prison_desc: "500 лет назад кракен по имени Левирот был заточён здесь Азшарой."
 building_type_leyhollow: "Лей-Лощина"
 building_type_leyhollow_desc: "Из-за близкой открытой лей-линии пещеру заполняют кристаллы, богатые маной."
 building_type_lights_hope_01: "Часовня Упования Света"
 building_type_lights_hope_01_desc: "Одна из древнейших и наиболее почитаемых из этих святых мест поклонения Святому Свету."
 building_type_lion_pride_inn: "Гостиница «Львиная гордость»"
 building_type_lion_pride_inn_desc: "Отдых и покой для усталых и продрогших — вот наш девиз! Прошу, присядьте у огня и дайте отдых своим утомлённым костям."
 building_type_maisara_hills: "Холмы Майсары"
 building_type_maisara_hills_desc: "Холмы Майсары были бы отличным местом для расширения познаний в вуду, если бы не тот факт, что тролли благодаря своей магии способны заметить даже самых скрытных чужаков."
 building_type_maker_perch: "Насест Создателей"
 building_type_maker_perch_desc: "Сооружение [Glossary( 'titan', 'TITAN_GLOSS' )]ов, возведённое как наблюдательный пункт, с которого они надзирали за своими творениями."
 building_type_maldraz: "Малдраз"
 building_type_maldraz_desc: "Малдраз — великое древо в Осквернённом лесу Выжженных земель."
 building_type_maraudon_temple: "Храм Мараудона"
 building_type_maraudon_temple_desc: "По легенде, Заэтар, сын Кенария, и принцесса земляных элементалей Терадрас породили варварских [GetTrait('creature_centaur').GetName(GetNullCharacter)]ов [wc_race|E]. Вскоре после сотворения кентавров безжалостные создания убили своего отца. Говорят, что сражённая горем Терадрас заточила дух своего возлюбленного внутри Мараудона, развратив всю округу."
 building_type_master_glaive: "Глефа Мастера"
 building_type_master_glaive_desc: "Огромная адамантитовая глефа, вонзённая в череп Соггота Ползучего, Вестника [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )]. Кронн, крупнейший из каменных великанов, позволил щупальцам Соггота опутать себя — ровно настолько, чтобы его подняло к черепу чудовища в пределах досягаемости могучего меча Кронна."
 building_type_maw_of_souls: "Утёсы Челюсти Хеля"
 building_type_maw_of_souls_desc: "Пока величайших воинов [GetTrait('creature_vrykul').GetName(GetNullCharacter)]ов уносят в Чертоги Доблести для вечной славы — сияющих и золотых, — проклятые и обречённые оказываются на берегах Устья Душ, чей вход лежит в Утёсах Челюсти Хеля."
 building_type_mogushan_vaults: "Подземелья Могу'шан"
 building_type_mogushan_vaults_desc: "[GetTrait('creature_mogu').GetName( GetNullCharacter )], гордые своим превосходством, вели подробные летописи своих свершений в обширном комплексе хранилищ. Охраняемые свирепыми магическими созданиями, эти священные залы хранят молчание с тех пор, как могу покинули их. "
 building_type_niffelem_spikes: "Шипы Ниффелема"
 building_type_niffelem_spikes_desc: "Дун-Ниффелем покрыт исполинскими ледяными шипами и железными цепями."
 building_type_niuzao_temple: "Храм Нюцзао"
 building_type_niuzao_temple_desc: "Храм Нюцзао, Чёрного Быка, духа стойкости. Его называют силой запада и защитником слабых."
 building_type_nordrassil_01: "Нордрассил"
 building_type_nordrassil_01_desc: "В переводе — «Корона Небес»; это первое Мировое древо, посаженное на вершине горы Хиджал после Войны Древних, выращенное из семени Матери-древа Г'Ханир."
 building_type_obsidian_dragonshrine: "Обсидиановое святилище драконов"
 building_type_obsidian_dragonshrine_desc: "Расположение у подножия вулкана отражает землезащитную обязанность чёрной драконьей стаи и могучие энергии, таящиеся в земле; постоянное тление также отражает разрушительную природу стаи."
 building_type_pearl_of_depths: "Жемчужина Глубин"
 building_type_pearl_of_depths_desc: "Жемчужина используется для общения с Оач'ноа, богиней мудрости."
 building_type_pearlfin_pool: "Омут Жемчужного Плавника"
 building_type_pearlfin_pool_desc: "В центре Жемчужного Плавника лежит омут, позволяющий зовущим Воду общаться с духами."
 building_type_rigger_shipyard: "Верфь Бухты Канатов"
 building_type_rigger_shipyard_desc: "Пираты Южных Морей используют эту верфь для строительства новых кораблей."
 building_type_ring_booty: "Ринг Бутти"
 building_type_ring_booty_desc: "В Вольнице проводится бойцовский турнир, где самые свирепые головорезы со всех морей испытывают свою силу."
 building_type_ruby_dragonshrine: "Рубиновое святилище драконов"
 building_type_ruby_dragonshrine_desc: "Это островок зелени и жизни среди заснеженной пустоши, подобающий красной драконьей стае, чья стихия — огонь, дарующий и жизнь, и смерть."
 building_type_ruby_tree: "Рубиновое Древо"
 building_type_ruby_tree_desc: "Маяк великой жизни; это великое древо было создано красной драконьей стаей."
 building_type_ruins_zulkunda: "Руины Зул'Кунды"
 building_type_ruins_zulkunda_desc: "Тролли Кровавого Скальпа занимают эти северные руины в джунглях к югу от гор, отделяющих Тернистую Долину от Западного Края. Эти тролли, помимо нападений на путников, их ограблений и поедания, охраняют кристаллы на склоне холма от добывающих их гоблинов. Тролли Кровавого Скальпа считают эти кристаллы священными, а гоблины — прибыльными."
 building_type_sanctuary_devoted: "Святилище Преданных"
 building_type_sanctuary_devoted_desc: "Древний храм, посвящённый лоа Сетралисс. На алтаре лежат ключевые камни, отпирающие Атул'Аман."
 building_type_sanctum_of_the_moon_01: "Святилище Луны"
 building_type_sanctum_of_the_moon_01_desc: "Лей-линии были словно кровеносные сосуды земли, несущие магию вместо алой жидкости. Будучи соединены, кристаллы создавали поле энергии, известное как Бан'динориэль, Вратарь."
 building_type_scalawag_port: "Порты Мошенников"
 building_type_scalawag_port_desc: "Импровизированный порт, укреплённый множеством смертоносных оборонительных сооружений и близлежащими фрегатами."
 building_type_scarlet_basilica: "Алая Базилика"
 building_type_scarlet_basilica_desc: "Верховное место религиозной власти Алого Ордена."
 building_type_shadowforge_city: "Город Тенелитейных"
 building_type_shadowforge_city_desc: "Город Тенелитейных — столица [Glossary( 'Dark Iron dwarves', 'DARK_IRON_DWARF_GLOSS' )]ов, чьим размахом соперничает со Стальгорном. Город Тенелитейных находится в постоянном конфликте с кланом Черной Скалы и их господами [GetTrait('creature_black_dragon').GetName(GetNullCharacter)]ами."
 building_type_shaladrassil_01: "Шаладрассил"
 building_type_shaladrassil_01_desc: "Мировое древо, под которым выжившие сатиры Войны Древних были погружены в вечный сон в глубинах его корней."
 building_type_shatterspear_waterfall: "Водопад Осколочного Копья"
 building_type_shatterspear_waterfall_desc: "Тысячи лет его водопад бил о землю, высекая чашу долины."
 building_type_shrine_aessina: "Святилище Аессины"
 building_type_shrine_aessina_desc: "Возведённое века назад ночными эльфами, это древнее святилище, посвящённое духу дикой природы Аессине, лежит посреди лесной поляны в сердце Ясеневого леса. Святилище — это прозрачный лесной омут со статуей Аессины рядом, одетой лишь в плющ. Известно, что дриады посещают святилище, чтобы воздать ей почести."
 building_type_shrine_agamaggan: "Святилище Агамаггана"
 building_type_shrine_agamaggan_desc: "Великий Вепрь был одним из Древних Хранителей и одним из первых и самых могущественных существ из когда-либо живших. Ему поклоняются и [GetTrait('creature_quilboar').GetName(GetNullCharacter)]ы, и племя тёмных троллей Тенезуб."
 building_type_shrine_aviana: "Святилище Авианы"
 building_type_shrine_aviana_desc: "Авиана, мать гарпий, — дикий бог птиц Азерота и прочих крылатых созданий. Заботливая к своим детям и почитателям, она была свирепой и дикой воительницей, убившей множество демонов во время [Glossary( 'War of the Ancients', 'WAR_OF_THE_ANCIENTS_GLOSS' )], прежде чем пала сама."
 building_type_shrine_fallen_warrior: "Святилище Павшего Воина"
 building_type_shrine_fallen_warrior_desc: "Там, где некогда герой ступил на родную землю, вознёсся монумент\nГде ныне часть его сущности пребывает, дарован будет мистический дар\nНа монументе выгравированы рунические инициалы МК\nВ честь всех путей и битв, что павший прошёл\nНесокрушимый дух героя превосходит многие миры за пределами нашего\nЛишь упорные и преданные обретут связь с этим неведомым\nСтранствуй по континентам и ищи святилище, возвышающееся вдали\nИбо в присутствии монолита воин будет с тобой всегда."
 building_type_shrine_goldrinn: "Святилище Голдринна"
 building_type_shrine_goldrinn_desc: "Голдринн воплощает ярость, дикость и несгибаемую волю; легенды гласят, что он обладал беспримерным гневом и неистовством. Воины со всех концов света посещают святилище в надежде прикоснуться к легендарному боевому мастерству."
 building_type_shrine_malorne: "Святилище Малорна"
 building_type_shrine_malorne_desc: "Малорн был лесным полубогом, всегда принимавшим облик огромного белого оленя, несмотря на могучую природную магию, которой владел. Он и богиня луны Элуна были родителями полубога Кенария. Малорн также обладал целительными силами и умиротворяющей аурой, иногда останавливавшей битвы до их начала."
 building_type_shrine_remulos: "Святилище Ремулоса"
 building_type_shrine_remulos_desc: "Многие молодые друиды обращаются за советом к Ремулосу, сыну легендарного полубога Кенария."
 building_type_shrine_storm: "Святилище Бури"
 building_type_shrine_storm_desc: "Святилище Бури — средоточие власти как дома Штормовая Песнь, так и волноволков. Здесь совершаются благословения флота, чтобы кул-тирасский флот не знал равных в бою."
 building_type_shrine_ulatek: "Святилище Ула-Тек"
 building_type_shrine_ulatek_desc: "Тролли поклоняются Ула-Тек и почитают зиккурат святыней, совершая среди руин свои тёмные обряды и вуду-ритуалы. Тролли хранят свои сокровища — собранные за столетия — внутри зиккурата, что также служит причиной их столь бдительной охраны."
 building_type_southmoon_ruins: "Руины Южной Луны"
 building_type_southmoon_ruins_desc: "Здесь были обнаружены древние таблички, которые, как полагают, содержат знания [Glossary( 'Titan', 'TITAN_GLOSS' )]ов."
 building_type_spitescale_cavern: "Пещера Злочешуя"
 building_type_spitescale_cavern_desc: "Эта система пещер используется [GetTrait('creature_naga').GetName(GetNullCharacter)] для нападений на чужаков."
 building_type_steam_springs: "Паровые источники"
 building_type_steam_springs_desc: "[GetTrait('creature_taunka').GetName( GetNullCharacter )] использовали пар из горячих источников, чтобы подготавливать шкуры для кожевенного дела. Таунка подчиняют себе паровые стихии, чтобы выжить."
 building_type_stonewrought_dam: "Каменная плотина"
 building_type_stonewrought_dam_desc: "Одно из самых впечатляющих чудес света; немногие знают, что это творение [Glossary( 'Dark Iron dwarf', 'DARK_IRON_DWARF_GLOSS' )]а. Строение перекрыло Лох, более чем удвоив его первоначальные размеры. Плотина также создала затопленные равнины Заболоченных земель, которые прежде большей частью были сушей. "
 building_type_stormstout_brewery_01: "Пивоварня Штормопортов"
 building_type_stormstout_brewery_01_desc: "На протяжении поколений Пивоварня Штормопортов была источником радости для жителей Пандарии, неустанно производя бесконечный, казалось бы, поток вкусных изысканных напитков, не сбавляя шага."
 building_type_stormwind_throne: "Львиный трон"
 building_type_stormwind_throne_desc: "Великий узорчатый трон королей Риннов. Золотой трон украшен витражами, на которых род Риннов внушает страх не меньше, чем вдохновляет."
 building_type_sunspire: "Солнечный Шпиль"
 building_type_sunspire_desc: "Солнечный Шпиль — место, где новые [wc_elven_wo_family|E] искатели приключений могут обучиться своему классу."
 building_type_tal_doren: "Тал'дорен"
 building_type_tal_doren_desc: "Тал'дорен, дикий дом, некогда был обителью ордена друидов, принимавших облик волков."
 building_type_tayutka_altar: "Алтарь Тайутки"
 building_type_tayutka_altar_desc: "Тайутка — богиня, которой поклоняются [GetTrait('creature_tuskarr').GetName( GetNullCharacter )]. Говорят, её дух вёл предков тускаров к священному городу Каскала."
 building_type_teldrassil_01: "Тельдрассил"
 building_type_teldrassil_01_desc: "В переводе — «Корона Земли»; это была неудачная попытка архидруида Фандрала Оленьего Шлема и его соратников вернуть ночным эльфам бессмертие, утраченное с почти полным уничтожением Нордрассила."
 building_type_temple_of_zinmalor: "Храм Зин-Малор"
 building_type_temple_of_zinmalor_desc: "Некогда видный храм ночных эльфов, посвящённый поклонению их богине Элуне. Его сходство с близлежащим Храмом Арккорана поразительно: оба очень похожи на нынешний Храм Луны."
 building_type_temple_sethraliss: "Храм Сетралисс"
 building_type_temple_sethraliss_desc: "Столетия назад Сетралисс, могущественная лоа-змея, пожертвовала собой, чтобы помешать Митраксу выпустить своего господина на Азерот. После битвы её преданные последователи перенесли её останки и воздвигли вокруг них храм, ожидая её перерождения."
 building_type_thaldarah_grove: "Роща Тал'дара"
 building_type_thaldarah_grove_desc: "Это древнее древо поколениями было местом мира и знаний и использовалось как ночными эльфами, так и тауренами. Ходят слухи об оружии массового поражения, скрытом внутри древа."
 building_type_throne_four_winds: "Трон Четырёх Ветров"
 building_type_throne_four_winds_desc: "Личное логово Повелителя Ветров Аль'Акира — Трон Четырёх Ветров — парит высоко среди безбрежных просторов Небесной выси."
 building_type_thunderbluff_inn: "«Кот и Шаман»"
 building_type_thunderbluff_inn_desc: "В главном торговом узле Громового Утёса находится трактир под названием «Кот и Шаман»."
 building_type_thunderbrew_distillery_01: "Пивоварня Громоваров"
 building_type_thunderbrew_distillery_01_desc: "Таверна [GetCulturePillar('heritage_dwarven').GetName]ов, известная далеко и широко своим превосходным элем."
 building_type_thunderdrome: "Громодром"
 building_type_thunderdrome_desc: "Здесь устраивают бои для развлечения публики — чем кровавее, тем лучше, но не насмерть. Желающим поучаствовать следует обратиться к устроителю боёв доктору Сделвеллу."
 building_type_thunderstrike_mountain: "Гора Громового Удара"
 building_type_thunderstrike_mountain_desc: "Громовницы Сумеречного Нагорья чтят своих павших героев в Киртавене, прежде чем похоронить их вместе с их грифонами на вершине Громового Удара, где, как считается, они проводят вечность в единении с небом."
 building_type_timbermaw_tunnels: "Туннели Древобрюхов"
 building_type_timbermaw_tunnels_desc: "Искусно прорубленные пути ведут из Осквернённого леса в Лунную поляну и Зимние ключи; есть в них туннели и к Азшаре и горе Хиджал, но они доступны не всем."
 building_type_tirion_statue: "Статуя Тириона Фордринга"
 building_type_tirion_statue_desc: "Хартгленом правил паладин Тирион Фордринг; эта статуя посвящена ему."
 building_type_torga_rest: "Приют Торги"
 building_type_torga_rest_desc: "Труп Торги — мудрой и доброй лоа, убитой кровяными троллями."
 building_type_totem_dominance: "Тотем Господства"
 building_type_totem_dominance_desc: "Когда между двумя [GetTrait('creature_yaungol').GetName( GetNullCharacter )] возникает спор, под ними водружается знамя. Затем они сражаются друг с другом затупленным оружием, пока один не сдастся или не потеряет сознание. "
 building_type_uldaman: "Ульдаман"
 building_type_uldaman_desc: "Ульдаман — древнее хранилище [Glossary( 'titan', 'TITAN_GLOSS' )]ов, погребённое глубоко под землёй. Сказания о баснословном сокровище, хранящем великие знания, прельщают искателей сокровищ копать глубже в поисках тайн Ульдамана."
 building_type_uldir_facility: "Лаборатория Ульдир"
 building_type_uldir_facility_desc: "Исследовательский и карантинный объект [Glossary( 'titan', 'TITAN_GLOSS' )]ов, где титаны проводили эксперименты над [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )] и рассекали их, пытаясь понять."
 building_type_ursoc_den: "Логово Урсока"
 building_type_ursoc_den_desc: "Голова огромного медведя, высеченная из цельной скалы; это логово древнего хранителя Урсока."
 building_type_vector_coil: "Катушка-Вектор"
 building_type_vector_coil_desc: "Силовое ядро «Экзодара», рухнувшего в западную часть острова Кровавых Туманов."
 building_type_vermillion_redoubt: "Багровый Редут"
 building_type_vermillion_redoubt_desc: "Это роща вечного багрянца, стоящая на страже высоко над крепостью Грим Батол. Чешуевидные листья могучих дубов дрожат и слетают на резком горном ветру."
 building_type_wailing_caverns: "Пещеры Стенаний"
 building_type_wailing_caverns_desc: "Пещеры Стенаний — сеть подземных пещер в самом сердце Степей. Их водные потоки несут подземные реки на многие мили под саванной, естественным образом пробиваясь на поверхность небольшими оазисами по всей округе."
 building_type_weather_shrine: "Великий Камень Дождя"
 building_type_weather_shrine_desc: "Этим большим каменным святилищам поклоняются Оракулы; говорят, что с помощью кристаллов они способны управлять погодой."
 building_type_white_tiger_temple: "Храм Белого Тигра"
 building_type_white_tiger_temple_desc: "Древняя тренировочная площадка, охраняемая элитным отрядом воинов-жрецов, а также духом самого Белого Тигра."
 building_type_winter_terrace: "Зимняя Терраса"
 building_type_winter_terrace_desc: "Крепость [GetTrait('creature_vrykul').GetName(GetNullCharacter)]ов, где они проводят ритуалы — и для пробуждения давно спящих врайкулов, и, предположительно, для поднятия мёртвых врайкулов как воинов-нежити."
 building_type_wintergarde_crypt: "Склеп Зимней Стражи"
 building_type_wintergarde_crypt_desc: "В холодных каменных стенах этого склепа покоятся останки знати и сановников, умерших в Нордсколе."
 building_type_wyrmrest_temple: "Храм Упокоения драконов"
 building_type_wyrmrest_temple_desc: "Древнее строение, возведённое до [Glossary( 'Great Sundering', 'GREAT_SUNDERING_GLOSS' )], чтобы новосозданные драконьи стаи имели место встреч и могли наблюдать за Азеротом."
 building_type_yshaarj_vault: "Хранилище И'Шараджа"
 building_type_yshaarj_vault_desc: "Область под Долиной Вечных Цветов, где титаны запечатали Сердце [Glossary( 'Y’Shaarj', 'YSHAARJ_GLOSS' )]."
 building_type_zanchul_pyramid: "Пирамида Занчула"
 building_type_zanchul_pyramid_desc: "В пирамиде на среднем этаже размещаются Совет Занчули и их Зал Совета, а на нижнем — Зал Верховных жрецов. На вершине пирамиды расположены святилища, посвящённые каждому из лоа зандаларов."
 building_type_zandalar_stone: "Древние сооружения зандаларов"
 building_type_zandalar_stone_desc: "Древние зандалары возвели на этом острове сооружения, которые ныне обратились в руины."
 building_type_zarkhenar_temple: "Храм Зархенара"
 building_type_zarkhenar_temple_desc: "Главное строение руин Зархенара, переоборудованное в объект по откачке энергии лей-линий."
 building_type_zul_altar: "Алтарь Зула"
 building_type_zul_altar_desc: "Священный алтарь лесных троллей Злобной Ветви."
 building_type_zulfarrak_pyramid: "Пирамида Зул'Фаррака"
 building_type_zulfarrak_pyramid_desc: "Зул'Фаррак некогда был сияющей жемчужиной Танариса, яростно оберегаемой хитроумным племенем Песчаной Ярости."
 building_uldaman: "$building_type_uldaman$"
 building_uldaman_desc: "$building_type_uldaman_desc$"
 building_uldir_facility: "Лаборатория Ульдир"
 building_uldir_facility_desc: "Исследовательский и карантинный объект [Glossary( 'titan', 'TITAN_GLOSS' )]ов, где титаны проводили эксперименты над [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )] и рассекали их, пытаясь понять."
 building_ursoc_den: "$building_type_ursoc_den$"
 building_ursoc_den_desc: "$building_type_ursoc_den_desc$"
