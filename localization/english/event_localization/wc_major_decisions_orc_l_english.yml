l_english:
 
# Reforming the Orcish Horde decision
 
 wc_reform_the_orcish_horde.0001.title:0 "Reminiscence"
 wc_reform_the_orcish_horde.0001.azeroth.desc:0 "Many of our fellow Orcs have lost their homes and their lands in Azeroth because of Blackhand's downfall and his tyranny. Orcs across these lands have suffered because of the humiliation that comes from the Alliance Internment Act.\n\nWhere the warlords of the past have failed, I will succeed. As the leader of [horde_invaders|E], I will make all of Azeroth kneel before me!"
 wc_reform_the_orcish_horde.0001.kalimdor.desc:0 "We have tolerated these beasts on Kalimdor for far too long! But no more!\n\nThere shall be no mercy for any who oppose or even merely threaten us our new home. These are our rightful lands and these beasts shall bow before us or perish!"
 wc_reform_the_orcish_horde.0001.a:0 "Lok'tar Ogar!"
 wc_reform_the_orcish_horde.0001.a.tt:0 "You become leader of [horde_invaders|E]"

# Building Orgrimmar

 orgrimmar.0001.title:0 "New Home, New Hope"
 orgrimmar.0001.desc:0 "Years of hard work has finally beared fruit. Our new capital now stands tall in defiance of hopelessness.\n\nWe shall call this Orgrimmar, in honor of the greatest Warchief of the Horde."
 orgrimmar.0001.a:0 "For Doomhammer! For the Horde!"
