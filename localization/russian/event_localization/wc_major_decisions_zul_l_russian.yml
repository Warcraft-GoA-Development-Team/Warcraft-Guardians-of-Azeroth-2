l_russian:
 zul_restoration.0001.t: "Возрождение Зул"
 zul_restoration.0001.desc.intro: "Возрадуйтесь, тролли Азерота! Мы стали свидетелями возрождения империи Зул.\n\nНаш народ был разбросан по всему миру, который когда-то был нашим, и забыл наше древнее наследие. Наш народ более не будет разделён, ведь [scoped_emperor.GetName] [Select_CString(scoped_emperor.IsFemale, 'объединила', 'объединил' )] пять плёмен под своей властью."
 zul_restoration.0001.desc.troll: "\n\nНам остаётся с нетерпением ждать, когда весь Азерот будет покорён народом троллей. Наш народ более не склонится ни перед ничтожными эльфами, ни перед какой-либо другой расой."
 zul_restoration.0001.desc.neutral: "\n\nЭто событие на руку троллям, но не приведёт ли это к дальнейшей агрессии с их стороны? Что это #italic может#! означать для остального Азерота?"
 zul_restoration.0001.troll: "Это будет славный день!"
 zul_restoration.0001.neutral: "Тревожно..."
 zul_restoration.0002.desc: "$swear_fealty_to_zul_decision_desc$"
 swear_fealty_to_zul_decision_confirm: "Присоединиться к империи Зул"
 zul_swore_fealty: "Поклясться в верности империи Зул"
 zul_restoration.0002.a: "Присоединиться к империи Зул"
 zul_restoration.0002.b: "Сохранить независимость"
 zulian_elite_troops_name: "Зулианские элитные войска"
  
 zul_restoration.1001.title: "Разрушение империи Кель'Таласа"
 zul_restoration.1001.desc: "Многие луны назад, после Великого Раскола, эльфийские захватчики, изгнанные своими собратьями, пришли заявить свои права на земли, населённые амани. И хотя тогда они одолели нас, теперь мы наконец отбросили их прочь. Некоторые ещё сопротивляются, но они утратили былое владычество, и ныне мой народ с гордостью может назвать эту землю своей."
 zul_restoration.1001.a: "Слава лоа и слава народу Зул'Амана!"
