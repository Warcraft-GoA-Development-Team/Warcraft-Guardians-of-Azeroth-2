l_english: 
    ### Coronation Events 6100
    ## HOST
 coronation_events.6100.desc_like_christian: "The glittering [host.Custom('GetRegionalSword')] is girded to my hip. The scepter of sovereign authority — taken up in my hand. My fingers wrap round a holy orb emblazoned with a symbol representing [host.GetFaith.GetHighGodName]. The prayers rumble on."
 coronation_events.6100.desc_glowing_symbol: "[crowner.GetTitledFirstNameRegnal] anoints my forehead with sanctified oil, and the Gift of the Naaru begins to glow brightly above it... An acknowledegement of my righteous character from [host.GetFaith.GetFateGodName]."
 coronation_events.6100.desc_demon_blood: "I endeavor not to wince in pain as [crowner.GetTitledFirstNameRegnal] anoints my forehead with powerful demonic blood in the shape of a profane fel rune. I feel pain, and power, coursing through my body like lightning!"
 coronation_events.6100.desc_kaldorei: "A skylight is opened in the Temple roof, allowing Elune's brilliance to fall upon my glittering robes. In my right hand [crowner.GetTitledFirstNameRegnal] places a crystal orb, symbol of Elune's authority; in the left [crowner.getSheHe] places a staff, symbol of Cenarius' dominion. I ritually bring them together symbolozing my commitment to harmony between the priesthood and the druids."
    ## GUEST
 coronation_events.6100.desc_like_christian_guest: "The glittering [host.Custom('GetRegionalSword')] is girded to [host.GetFirstNamePossessive] hip. The scepter of sovereign authority — taken up in [host.GetHerHis] hand. [host.GetHerHis|U] fingers wrap round a holy orb emblazoned with a symbol representing [host.GetFaith.GetHighGodName]. The prayers rumble on."
 coronation_events.6100.desc_glowing_symbol_guest: "[crowner.GetTitledFirstNameRegnal] anoints [host.GetFirstNamePossessive] forehead with sanctified oil, and the Gift of the Naaru begins to glow brightly above it... An acknowledegement of [host.GetHerHis] righteous character from [host.GetFaith.GetFateGodName]."
 coronation_events.6100.desc_demon_blood_guest: "[host.GetFirstNameRegnal] barely winces as [crowner.GetTitledFirstNameRegnal] anoints [host.GetHerHis] forehead with powerful demonic blood in the shape of a profane fel rune."
 coronation_events.6100.desc_kaldorei_guest: "A skylight is opened in the Temple roof, allowing Elune's brilliance to fall upon [host.GetFirstNamePossessive] glittering robes. In [host.GetHerHis] right hand [crowner.GetTitledFirstNameRegnal] places a crystal orb, symbol of Elune's authority; in the left [crowner.getSheHe] places a staff, symbol of Cenarius' dominion. [host.GetFirstNameRegnal] then ritually brings them together, symbolizing harmony between the priesthood and the druids."

    ## Coronation Events 6101
 coronation_events.6101.desc_crowning_intro_wc: "Some would call it shameless pride for a [host.GetTitleAsName] to lift a crown high and place it upon [host.GetHerHis] own brow and, in doing so, proclaim #EMP [host.GetHerselfHimself]#! among [host.GetFaith.HighGodNamePossessive] chosen monarchs.\n\n"
 coronation_events.6101.desc_no_being_crowned_intro_wc: "A [host.GetTitleAsName|l], when [host.GetSheHe] is clothed in ceremony and armed with the assent of [host.GetHerHis] people... may crown [host.GetHerselfHimself]. That is our way, though some [host.GetFaith.BishopNeuterPlural] envy this [host.Custom('GetTitleTierAdjective')] right.\n\n"
 coronation_events.6101.desc_crowning_priests_self: "#EMP Hah!#! We #EMP [host.getCulture.GetCollectiveNoun]#! do not agree. We give our humble words to [host.GetFaith.GetHighGodName], and then we do as we will!"
 coronation_events.6101.desc_words_reformed: "Gripping the [host.GetFaith.ReligiousSymbol]-bearing diadem in my fingers — reciting "#EMP [host.GetFaith.GetHighGodName], you are above all kings; to your dominion belong all the material relams#!" and so forth — I crown myself master of [host.GetPrimaryTitle.GetNameNoTier].\n\n"
 coronation_events.6101.desc_words_reformed_guest: "Gripping the [host.GetFaith.ReligiousSymbol]-bearing diadem in [host.GetHerHis] fingers — reciting "#EMP [host.GetFaith.GetHighGodName], you are above all kings; to your dominion belong all the material relams#!"" and so forth — [host.GetFirstNameRegnal] crowns [host.GetHerselfHimself] master of [host.GetPrimaryTitle.GetNameNoTier].\n\n"

    ## Coronation Events 6110
 coronation_events.6110.desc_tyrist: "St. Mereldar, bringer of the Holy Light to Azeroth."
 coronation_events.6110.desc_naarist: "L'ura, who sacrificed her life that we may live in the Light."
 coronation_events.6110.desc_selenite: "Natalie Seline, who showed us the way of the Shadow."
 coronation_events.6110.desc_sunwell: "Dath'remar Sunstrider, who gave us the Sunwell."
 coronation_events.6110.desc_void: "Xal'atath, whisperer of secrets to our realm."
 coronation_events.6110.desc_loa: "Rezan, loa of Kings."
 