    building_type_maw_of_souls_desc: "While the greatest vrykul warriors are spirited away to the Halls of Valor to glory eternal, shiny and gold, the cursed and the damned find themselves on the shores of the Maw of Souls. Amidst fog and mist, they await the Naglfar, a fearsome ship formed from sinew and bone, which comes to deliver these poor souls to Helheim, and the clutches of Helya."
