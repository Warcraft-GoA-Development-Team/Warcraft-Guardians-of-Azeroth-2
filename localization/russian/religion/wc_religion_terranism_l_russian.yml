  #terranism Group Faiths 
 therazanism: "Теразанистск"
 therazanism_adj: "Теразанизм"
 therazanism_adherent: "Теразанист"
 therazanism_adherent_plural: "Теразанисты"
 therazanism_desc: "В отличие от других Элементальных Владык, Теразан является более мирным божеством, предпочитающим защищать своих детей, а не вступать в ненужные конфликты. Её последователи почитают её как материнскую фигуру, воплощая заботливые аспекты земли. Они отвергают ненужное насилие и стремятся следовать её примеру, пропагандируя сохранение, стабильность и терпение."
 therazanism_religious_head_title_male: "Префект"
 therazanism_religious_head_title_female: "$therazanism_religious_head_title_male$"
  
 theradrasism: "Терадразистск"
 theradrasism_adj: "Терадразизм"
 theradrasism_adherent: "Терадразист"
 theradrasism_adherent_plural: "Терадразисты"
 theradrasism_desc: "Терадрас, единственная дочь Теразан, является могущественным земным элементалем и матерью центавров Калимдора. Когда её потомки убили их отца Заэтара из-за его отвращения к их внешности, Терадрас впала в ярость, граничащую с безумием. Убегая в Мародон, она теперь заключает сделки с тёмными силами, чтобы свергнуть свою мать и распространяет коррупцию по земле через своих уродливых детей."
 theradrasism_good_god_theradras: "Терадрас"
 theradrasism_good_god_theradras_possessive: "Терадрас'"
  
