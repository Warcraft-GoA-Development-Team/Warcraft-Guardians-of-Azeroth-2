  pam_luke_10_27_latin: "[Glossary('Ille respondens dixit: Diliges Dominum Deum tuum ex toto corde tuo, et ex tota anima tua, et ex omnibus viribus tuis, et ex omni mente tua: et proximum tuum sicut teipsum.','LUKE_10_27_LATIN_GLOSS')]"
  pam_galatians_5_14_latin: "[Glossary('Omnis enim lex in uno sermone impletur: Diliges proximum tuum sicut teipsum.','GALATIANS_5_14_LATIN_GLOSS')]"
  # Divine Liturgy Tenet
  pam_isaiah_6_3_latin: "[Glossary('Et clamabant alter ad alterum, et dicebant: Sanctus, Sanctus, Sanctus, Dominus Deus exercituum, plena est omnis terra gloria ejus.','ISAIAH_6_3_LATIN_GLOSS')]"
