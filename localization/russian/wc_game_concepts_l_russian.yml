l_russian:
  #WARCRAFT# 
 game_concept_caster: "Заклинатели"
 game_concept_casters: "Заклинатели"
 game_concept_caster_desc: "Заклинатели - [Concept('men_at_arms', 'профессионалы')|E], использующие магию. Они носят легкую броню, но наносят огромный урон.\n\nХотя каждый вид заклинателей уникален, у них имеется [Concept('counter', 'преимущество')|E] против [Concept('massive_infantry', 'крупной пехоты')|E], [Concept('heavy_infantry', 'тяжёлой пехоты')|E] и #E [Concept('pikemen', 'пикинеров')|E]#!, в свою очередь, они уязвимы перед [Concept('light_cavalry', 'лёгкой кавалерией')|E] и [Concept('heavy_cavalry', 'тяжёлой кавалерией')|E] .\n\nПлоская или холмистая [terrain|El] дает заклинателям преимущество."
  
 game_concept_light_aerial: "Воздушные единицы"
 game_concept_light_aerial_desc: "Воздушные единицы - [Concept('men_at_arms', 'профессионалы')|E], ведущие сражение с неба, используя разное вооружение.\n\nХотя каждый вид воздушных единиц уникален, у них имеется [Concept('counter', 'преимущество')|E] против [Concept('massive_aerial', 'крупных воздушных единиц')|E], и в свою очередь, они уязвимы перед [Concept('archers', 'лучниками')|E] и #E [Concept('crossbowmen', 'арбалетчиками')|E]#!.\n\nЛесная [terrain|El] и джунгли ослабляют воздушные единицы."
  
 game_concept_massive_aerial: "Крупные воздушные единицы"
 game_concept_massive_aerial_desc: "Крупные воздушные единицы - [Concept('men_at_arms', 'профессионалы')|E], ведущие сражение с небя, используя разное вооружение. Они лучше бронированы и вооружены в сравнении с обычными воздушными юнитами.\n\nХотя каждый вид крупных воздушных юнитов уникален, у них имеется [Concept('counter', 'преимущество')|E] против [Concept('heavy_cavalry', 'тяжёлой кавалерии')|E], в свою очередь, они уязвимы перед [Concept('light_aerial', 'лёгкими воздушными единицами')|E].\n\nОгромный размер этого отряда и урон, наносимый им, исключают влияние местности на ход боя."
  
 game_concept_massive_infantry: "Великаны"
 game_concept_massive_infantry_plural: "Великаны"
 game_concept_massive_infantry_desc: "Великаны - огромные [Concept('men_at_arms', 'профессионалы')|E], чья сила и стойкость повергает всех врагов в страх.\n\nОни сражаются, используя различное оружие или голыми рукам.\n\nХотя каждый вид великанов уникален, у них имеется [Concept('counter', 'преимущество')|E] против [Concept('skirmishers', 'пехоты')|E], в свою очередь, они уязвимы перед #E [Concept('pikemen', 'пикинерами')|E]#! и [Concept('caster', 'заклинателями')|E].\n\nДжунгли, гористая или влажная [terrain|El] довольно часто ослабляет великанов."
  
 game_concept_union: "Фракция"
 game_concept_unions: "Фракции"
 game_concept_union_possessive: "Фракции"
 game_concept_union_desc: "Фракция - это сеть [Concept('alliances', 'альянсов')|E].\n\n$union_member_common_info$\n\n Лишь [union_leader|El] имеет право приглашать во фракцию новых членов. [union|E] может быть уничтожена, если [union_leader|El] проиграет в войне с казус белли «[shatter_realm_casus_belli|E]».\n\nТолько семь фракций могут существовать одновременно:\n$EFFECT_LIST_BULLET$$union_alliance_name$ #weak (историческая фракция)#!\n$EFFECT_LIST_BULLET$$union_horde_name$ #weak (историческая фракция)#!\n$EFFECT_LIST_BULLET$$union_illidari_forces_name$ #weak (историческая фракция)#!\n$EFFECT_LIST_BULLET$$union_dragon_forces_name$ #weak (историческая фракция)#!\n$EFFECT_LIST_BULLET$$union_scourge_forces_name$ #weak (историческая фракция)#!\n$EFFECT_LIST_BULLET$$union_axis_of_awful_name$ #weak (историческая фракция)#!\n$EFFECT_LIST_BULLET$ игрока"
 game_concept_union_leader: "Лидер фракции"
 game_concept_leader_wo_union: "Предводитель"
 game_concept_union_leader_desc: "Лидер фракции - это самый главный персонаж во [Concept('union', 'фракции')|E]. Они единственные, кто имеет право принимать или отклонять прошения о вступлении, а так же приглашать новых членов во [Concept( 'union', 'фракцию' )|E]. На них могут напасть, используя казус белли «[shatter_realm_casus_belli|E]»."
  
 game_concept_union_heir: "Наследник фракции"
 game_concept_heir_wo_union: "Наследник"
 game_concept_union_heir_desc: "Наследник фракции - это персонаж, который унаследует [Concept( 'union', 'фракцию' )|E] после того, как текущий [union_leader|El] умрёт."
  
 game_concept_union_powerful_member: "Кандидат на лидерство"
 game_concept_powerful_member_wo_union: "Кандидат"
 game_concept_union_powerful_member_desc: "Кандидат на лидерство - один из членов [Concept( 'union', 'фракции' )|E] или [Concept('primary_heir','первый наследник')|E] действующего лидера. Счёт зависит от различных условий. \n\nКандидат с наибольшим счётом не станет следующим лидером. Очки определяют шанс стать следующим лидером #help (ваш счёт/общий счёт всех кандидатов*100)%#!"
  
 game_concept_crisis: "Бедствие"
 game_concept_ongoing_crisis: "Активное бедствие"
 game_concept_crisis_desc: "Колоссальная сила, с которой нужно считаться.\n\nОни получают практически бесплатные [casus_bellis|El], вроде [great_invasion_casus_belli|E], и имеют повышенную агрессивность. За ними нужен глаз да глаз, мирным правителям не следует расслабляться с такими соседями.\n\n$game_concept_ongoing_crisis$ открывает дополнительные возможности для защиты, такие как возможность использовать казус белли «[shatter_realm_casus_belli|E]» против них или [unions|El].\n\n$game_concept_crises$ бывает разных видов:\n$EFFECT_LIST_BULLET$$e_horde$\n$EFFECT_LIST_BULLET$[scourge|E]\n$EFFECT_LIST_BULLET$$e_burning_legion$\n$EFFECT_LIST_BULLET$[the_thunder_king|E]\n$EFFECT_LIST_BULLET$и другие..."
  
 game_concept_grim_religion: "Зловещая религия"
 game_concept_grim_religions: "Зловещие религии"
 game_concept_grim_religion_desc: "[religion|E] настолько тёмная и злая, что противостоит остальному миру. Они отказываются искать внешних союзников и никогда не остановятся, пока не достигнут своей конечной цели.\n\nТакими религиями являются:\n$EFFECT_LIST_BULLET$$deathbringer_adj$\n$EFFECT_LIST_BULLET$$doombringer_adj$\n$EFFECT_LIST_BULLET$$shathgral_religion_adj$"
  
 game_concept_dark_authority: "Тёмная власть"
 game_concept_dark_authority_desc: "Заменяет [crown_authority|El] для [Concept('dark_governments', 'тёмных правительств')|E].\n\n$game_concept_dark_authority$ меняет свои законы автоматически, когда правитель соберёт достаточно [Concept('dark_frenzy', 'тёмного безумия')|E], следовательно, оно не может быть изменено вручную.\n\nВысокая $game_concept_dark_authority$ предоставляет бонусы, в то время как низкая власть предоставляют штрафы. У каждого [Concept('dark_government', 'тёмного правительства')|E] есть уникальный набор бонусов и штрафов."
  
 game_concept_dark_frenzy: "Тёмное Безумие"
 game_concept_dark_frenzy_desc: "Используется [Concept('dark_governments', 'тёмными правительствами')|E] для принятия законов [Concept('dark_authority', 'тёмной власти')|E]. В зависимости от [Concept('dark_government', 'тёмного правления')|E], есть разные способы получить $game_concept_dark_frenzy$.\n\n$game_concept_dark_frenzy$ со временем снижается."
  
 game_concept_dark_government: "Тёмное правительство"
 game_concept_dark_governments: "Тёмные правительства"
 game_concept_dark_wo_government: "Тёмные"
 game_concept_dark_government_desc: "[Concept('government_forms', 'Формы правления')|E], которые используют [Concept('dark_authority', 'тёмную власть')|E] вместо [Concept('crown_authority', 'авторитета короны')|E]. [levies|E] и [taxes|El], предоставляемые [Concept('liege', 'сюзерену')|E] его [Concept('vassals', 'вассалами')|E], зависят от их [Concept('opinion', 'отношения')|E] к упомянутому сюзерену. Однако [dark_authority|El] сюзерена может увеличить минимальное значение, которую они должны предоставить, вне зависимости от их мнения."
  
 game_concept_necro_government: "$necro_government_adjective$ое правительство"
 game_concept_necro_governments: "$necro_government_adjective$ Governments"
 game_concept_necro_i: "@government_type_necro!"
 game_concept_necro_government_desc: "[dark_government|E], доступное для нежити ([GetTrait('being_undead').GetName( GetNullCharacter )]) с принятой доктриной $doctrine_death_magic_name$.\nИмея высокую [Concept('dark_authority', 'тёмную власть')|E], они получают больше [Concept('levies', 'ополчения')|E] и собирают их быстрее, их [men_at_arms|El] становятся дешевле."
  
 twisting_nether_return_years: "#V [EmptyScope.ScriptValue( 'return_to_twisting_nether_min' )|0]-[EmptyScope.ScriptValue( 'return_to_twisting_nether_max' )|0]#!"
  
 game_concept_twisting_nether: "Круговерть Пустоты"
 game_concept_twisting_nether_desc: "Вместо того, чтобы [Concept('character_death_dying', 'умереть')|E], [characters|El] со [Concept('trait', 'свойством')|E] «[GetTrait('being_demon').GetName( GetNullCharacter )]» возвращаются в Круговерть Пустоты.\n\nОни получают [trait|El] «[GetTrait('in_twisting_nether').GetName( GetNullCharacter )]», но могут вернуться на Азерот через $twisting_nether_return_years$ лет.\n\nВозвращение стоит #V 2#! [Concept('prestige_level', 'уровня репутации')|E] и повышает [stress|El].\n\nДемоны не могут вернуться если они...\n$EFFECT_LIST_BULLET$Исчезли\n$EFFECT_LIST_BULLET$Принесены в жертву\n$EFFECT_LIST_BULLET$Совершили самоубийство\n$EFFECT_LIST_BULLET$Напуганы до смерти"
  
 game_concept_wc_incapable: "Недееспособный"
 game_concept_wc_incapable_desc: "Недееспособные персонажи не могут самостоятельно предпринимать действия из-за тяжелой болезни или изоляции."
  
 game_concept_demonic_government: "$demonic_government_adjective$ое правительство"
 game_concept_demonic_governments: "$demonic_government_adjective$ правительства"
 game_concept_demonic_i: "@government_type_demonic!"
 game_concept_demonic_government_desc: "[dark_government|E], доступное для демонов ([GetTrait('being_demon').GetName( GetNullCharacter )]), с принятой доктриной «$doctrine_disorder_magic_name$».\nПри высокой [Concept('dark_authority', 'тёмной власти')|E], они могут поднять больше [Concept('dead_soldiers', 'мертвецов')|E], спад [Concept('dread', 'ужаса')|E] замедляется, а их [armies|El] становятся более маневренными."
  
 game_concept_eldritch_government: "$eldritch_government_adjective$ое правительство"
 game_concept_eldritch_governments: "$eldritch_government_adjective$ правительства"
 game_concept_eldritch_i: "@government_type_eldritch!"
 game_concept_eldritch_government_desc: "[dark_government|E] доступное для созданий Бездны ([GetTrait('being_void').GetName( GetNullCharacter )]) с принятой доктриной «$doctrine_shadow_magic_name$».\nПри высокой [Concept('dark_authority', 'тёмной власти')|E], они получают все [skills|El] за [stress_level|El] и повышают [county_development_growth|El]."
  
 game_concept_knowledge_overflow: "Переизбыток знаний"
 game_concept_knowledge_overflow_common_desc: "Когда вы изучаете новые [perks|El], ваш персонаж может почувствовать $game_concept_knowledge_overflow$: прирост [Concept('lifestyle_experience', 'опыта за образ жизни')|E] замедляется за каждое [perk|El].\n\nЗамедление темпа зависит от [Concept('life_expectancy', 'ожидаемой продолжительности жизни')|E] текущей [Concept('wc_race', 'расы')|E]. У долгоживущих [Concept('wc_races', 'рас')|E] эффект замедления меньше, но проявляется быстрее. Те, у кого жизнь коротка, наоборот, замедляются быстро, но не сразу"
 game_concept_knowledge_overflow_desc: "$game_concept_knowledge_overflow_common_desc$\n\nНапример, люди ([GetTrait('creature_human').GetName( GetNullCharacter )]) замедляются на #N [EmptyScope.ScriptValue('long_lived_lifestyle_xp_slowdown_human_per_perk_percent_value')|2]%#! за каждое [perk|El], начиная с «[EmptyScope.ScriptValue('long_lived_lifestyle_xp_slowdown_human_offset_value')|V0]»."
  
 game_concept_scourge_jailor: "Тюремщик Плети"
 game_concept_scourge_jailors: "Тюремщики Плети"
 game_concept_scourge_jailor_and_damned_common_desc: "Пока [scourge_jailors|E] живы, [scourge|E] гарантированно будет оставаться [Concept('legions_puppet', 'марионеткой Легиона')|E]. Любое открытое враждебное действие [Concept('scourge_damned', 'Пленника')|E] в отношении [Concept('scourge_jailor', 'Тюремщиков')|E], например, [imprisoning|El] или открытое #E [murder|El]#! неминуемо приведёт к [Concept('execution', 'казни')|E]."
 game_concept_scourge_jailor_desc: "[relation|E], обозначаюшее натрезимов ([GetTrait('creature_nathrezim').GetName( GetNullCharacter )]), посланных для контролирования [Concept('scourge_damned', 'Пленника')|E].\n\n$game_concept_scourge_jailor_and_damned_common_desc$"
  
 game_concept_legions_puppet: "Марионетка Легиона"
 game_concept_legions_puppet_desc: "Это состояние [Concept('scourge', 'Плети')|E], пока она подчинена приказам Легиона. При этом, $deathbringer$ие и $doombringer$ие [faiths|El] считают друг друга [Concept('faith_astray', 'заблудшими')|E].\n\n[GetTrait('lich_king').GetName( GetNullCharacter )] должен призвать Легион в течение 15 лет. Если [GetTrait('lich_king').GetName( GetNullCharacter )] падёт, [scourge_jailors|E] распустят [scourge|E]. Если все [scourge_jailors|E] мертвы, заключены в тюрьму или же Легион призван, [scourge|E] становится свободной и может действовать в своих интересах."
  
 game_concept_scourge: "Плеть"
 game_concept_scourge_possessive: "Плети"
 game_concept_scourge_desc: "Один из главных [Concept('crises', 'бедствий')|E] в Азероте. У $game_concept_scourge_possessive$ есть [necro_government|El] и его возглавляет [GetTrait('lich_king').GetName( GetNullCharacter )], могущественный некромант, который держит своих [Concept('vassals', 'вассалов')|E] в ежовых рукавицах.\n\nУ $game_concept_scourge_possessive$ имеется казус белли «[great_invasion_casus_belli|E]», но вместо захвата земель, это нашествие подчиняет правителей захваченных земель и обращает их в [GetTrait('being_undead').GetName( GetNullCharacter )].\n\n$game_concept_scourge$ начинает как [legions_puppet|E] и течение 15 лет должна сделать всё для призыва Легиона в Азерот."
  
 game_concept_great_invasion_casus_belli: "Великое вторжение"
 game_concept_great_invasion_casus_belli_desc: "[casus_belli|E], доступный для некоторых [Concept('crises', 'бедствий')|E].\n\nОн может сразу быть направлен против всех [Concept('title', 'титулов')|E] [Concept('kingdom', 'королевства')|E], и позволяет в короткие сроки захватывать большие участки земли."
  
 game_concept_obey_legion: "Повиновение Легиону"
  
 game_concept_scourge_damned: "Пленник"
 game_concept_scourge_damned_desc: "[relation|E], обозначаюшее Короля-лича ([GetTrait('lich_king').GetName( GetNullCharacter )]), за которым наблюдают [scourge_jailors|E].\n\n$game_concept_scourge_jailor_and_damned_common_desc$"
  
 game_concept_plague_scheme: "Распространение чумы"
 game_concept_plague: "Чума"
 game_concept_plagued: "чумой"
 game_concept_plague_scheme_desc: "Это [Concept('hostile_scheme', 'происки')|E], которые могут спровоцировать вспышку болезни, превращающей окружающих в [GetTrait('being_undead').GetName(GetNullCharacter)]. Болезнь может распространиться и на соседние провинции.\n\n[scourge|E] начинает [Concept('war', 'войну')|E] и может захватить поражённые $game_concept_plagued$ [counties|El] в случае победы. Помимо этого, каждое поражённое $game_concept_plagued$ [county|El] предоставляет [Concept('special_troops', 'особые войска')|E] в зависимости от [Concept('development', 'развития')|E].\n\nЕсли $game_concept_plague_scheme$ проведено успешно, [agents|El] обращаются в [Concept('faith', 'конфессию')|E] [Concept('scheme_owner', 'организатора происков')|E].\n\nТолько [GetTrait('creature_human').GetName(GetNullCharacter)] и насёленные #E людьми#! провинции уязвимы перед этим взаимодействием."
  
 game_concept_union_member: "Член фракции"
 game_concept_union_members: "Члены фракции"
 game_concept_union_member_desc: "Персонаж, который является частью [Concept('union', 'фракции')|E].\n\n$union_member_common_info$"
  
 union_member_common_info: "Каждый [union_member|El] связан друг с другом договорами. Они не могут быть ввязаны в [civil_wars|El]. Чтобы остаться во [Concept('union', 'фракции')|E], он жертвует частью своего [Concept('income', 'дохода')|E], [Concept('levies', 'ополчения')|E] и содержание [Concept('men_at_arms', 'профессионалов')|E] обходится ему очень дорого."
  
 game_concept_crises: "Бедствие"
 game_concept_union_leaders: "Лидеры фракции"
  
 game_concept_shatter_realm_casus_belli: "Раскол государства"
 game_concept_shatter_realm_casus_belli_desc: "[casus_belli|E], направленный против [Concept('crises', 'бедствий')|E] и [Concept('union_leaders', 'лидеров фракций')|E]. В результате чего $shatter_realm_casus_belli_common_info$."
  
 shatter_realm_casus_belli_common_info: "государство распадается, [vassals|El] получают независимость, [claimants|El] получают земли, а побежденный [character|El] уничтожает или покидает [Concept( 'union', 'фракцию' )|E]"
  
 game_concept_great_invasion: "Великое вторжение"
 game_concept_shatter_short: "Раскол"
 #game_concept_scheme_owner_possessive: "Владельца происков"
  
 game_concept_frostmourne: "$frostmourne_name$"
 game_concept_frostmourne_desc: "$frostmourne_desc$"
  
 game_concept_titan_forge: "Кузня Титанов"
 game_concept_titan_forge_desc: "Место, в котором создаются новые $titanforged$."
  
 game_concept_lei_shen: "Лэй Шэнь"
 game_concept_thunder_king: "Властелин Грома"
 game_concept_thunder_king_possessive: "Властелина Грома"
 game_concept_the_thunder_king: "Властелин Грома"
 game_concept_the_thunder_king_desc: "Одно из малозначимых [Concept( 'crises', 'бедствий' )|E] на Азероте. [GetTrait('thunder_king').GetName( GetNullCharacter )] Лэй Шэнь был первым императором империи могу. Он вобрал в себя силы хранителя титанов Ра-дена, став одним из самых могущественных существ на Азероте, и завоевал всю Пандарию, основав тиранический режим, который продержался тысячи лет. В конце концов он был убит вместе со своими союзниками-зандаларами при попытке захватить Кузню Созидания в Ульдуме.\n\nПо слухам, тролли-зандалары владеют секретным ритуалом его воскрешения. Если легенды правдивы, воскресший Властелин Грома не станет тратить время на то, чтобы собрать кланы [GetTrait('creature_mogu').GetName( GetNullCharacter )], чтобы восстановить господство своей древней [Concept( 'empire', 'империи' )|E] над Пандарией.\n\nКак [ongoing_crisis|El], Властелину Грома доступен [casus_belli|El] «[great_invasion|E]», но в целом он не будет расширяться за пределы Пандарии."
 thunder_king_features: "$EFFECT_LIST_BULLET$Лидер имеет [Concept( 'trait', 'черту' )|E] [GetTrait('thunder_king').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Разблокирует казус белли [great_invasion_casus_belli|E], но обычно он не расширяется за пределы Пандарии\n$EFFECT_LIST_BULLET$Может формировать [Concept( 'alliance', 'союзы' )|E] с любым [Concept( 'ruler', 'правителем' )|E] Зандаларской культуры\n$EFFECT_LIST_BULLET$Собирает других [GetTrait('creature_mogu').GetName( GetNullCharacter )] вокруг себя"
 CRISIS_THUNDER_KING_START: "$EFFECT_LIST_BULLET$[lei_shen|E] воскрешён через решение [GetDecision('revive_lei_shen_decision').GetName]\n#help Правитель культуры Могу или Зандаларов может захватить нужные места для возвращения павшего Владыки.#!"
 CRISIS_THUNDER_KING_END: "Одно из:\n$EFFECT_LIST_BULLET$Властелин Грома мёртв @death_icon!\n$EFFECT_LIST_BULLET$Он больше не удерживает титул [GetTitleByKey('e_pandaria_empire').GetName]"
 CRISIS_THUNDER_KING_DESC: "Небо трещит, а облака ревут. Властелин Грома приближается!"
  
 game_concept_purge_population: "Очистить население"
 game_concept_genocide: "$game_concept_purge_population$"
 game_concept_purge_population_desc: "[councillor_task|E] выполняемое [Concept( 'marshal', 'маршалом' )|E] нацеленное на [Concept( 'county', 'графство' )|E] иной [Concept( 'culture', 'культуры' )|E] или [Concept( 'faith', 'веры' )|E], чем [Concept( 'liege', 'сюзерен' )|E]\nПрогресс растёт с каждым месяцем, и на 100% целевое графство изменит свою прежнюю культуру и веру на сюзерена.\n\nНа скорость чистки влияют много факторов, включая навык [Concept( 'martial_skill', 'военного ремесла' )|E] [Concept( 'councillor', 'советника' )|E] , сила несобранной [Concept( 'army', 'армии' )|E] сюзерена, [Concept( 'development', 'развитие' )|E] графства, а так же [Concept( 'fervor', 'религиозное рвение' )|E] двух конфессий."
  
 scourge_features: "$EFFECT_LIST_BULLET$Лидер имеет [Concept( 'trait', 'черту' )|E] [GetTrait('lich_king').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Начинает как [legions_puppet|E], таким образом, должен привести в течении 15 лет Легион на Азерот.\n$EFFECT_LIST_BULLET$Разблокирует казус белли [great_invasion_casus_belli|E], но вместо того, чтобы захватывать земли, вы забираете вассалов и превращаете их в [GetTrait('being_undead').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$$TRAIT_FLAG_DESC_undead_interactions$\n$EFFECT_LIST_BULLET$$TRAIT_FLAG_DESC_undead_revolts$\n$EFFECT_LIST_BULLET$$TRAIT_FLAG_DESC_plague_scheme_available$"
 CRISIS_SCOURGE_START: "$EFFECT_LIST_BULLET$[GetBuilding('dark_portal_02').GetName] в [GetTitleByKey('c_dark_portal').GetName] закрыт.\n#help Это может сделать правитель, имеющий не дренорское происхождение или веру. Он должен владеть землями, на которых расположен портал, или разбить там лагерь, и завершить активность [GetActivityType('activity_beyond_dark_portal').GetName].#!"
  
 game_concept_horde_invaders: "Орда"
 game_concept_horde_invaders_possessive: "Орды"
 game_concept_horde_invaders_desc: "Одна из главных [crises|E] на Азероте. $game_concept_horde_invaders$ прибыла из Дренора благодаря открытию [GetBuilding('dark_portal_02').GetName]. В поисках нового дома — или же просто желая завоеваний — многие жители разрушенного мира готовы на всё, чтобы установить своё господство над Азеротом.\n\nОсобенности:\n$horde_features$"
 horde_features: "$EFFECT_LIST_BULLET$Лидер имеет [Concept( 'trait', 'черту' )|E] [GetTrait('conqueror').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Разблокирует [great_invasion_casus_belli|E], главным образом расширяясь в Восточных королевствах\n$EFFECT_LIST_BULLET$Будет периодически получать подкрепления, пока [GetBuilding('dark_portal_02').GetName] остаётся открытым"
 CRISIS_HORDE_START: "$EFFECT_LIST_BULLET$[GetBuilding('dark_portal_02').GetName] открыт в #V 583#!"
  
 game_concept_burning_legion: "Пылающий Легион"
 game_concept_burning_legion_possessive: "Пылающего Легиона"
 game_concept_burning_legion_desc: "Одна из главных угроз-[crises|E] для всего Азерота и, быть может, та, что положит конец всему сущему. $game_concept_burning_legion$ — это необъятная, бесчисленная армия [GetTrait('being_demon').GetName(GetNullCharacter)]ов и осквернённых рас, жаждущих уничтожить всякую жизнь. Легион несёт ответственность за истребление бесчисленных видов и даже целых миров по всему [Glossary( 'Great Dark Beyond', 'GREAT_DARK_BEYOND_GLOSS' )].\n\nОсобенности:\n$burning_legion_features$"
 burning_legion_features: "$EFFECT_LIST_BULLET$Лидер имеет [trait|E] [GetTrait('legion_commander').GetName( GetNullCharacter )]\n$EFFECT_LIST_BULLET$Только [GetTrait('archimonde').GetName( GetNullCharacter )] или [GetTrait('kiljaeden').GetName( GetNullCharacter )], ЛИБО носители модификаторов [GetModifier('weaker_world_tree_destroyed_by_demon').GetNameWithTooltip] или [GetModifier('stronger_world_tree_destroyed_by_demon').GetNameWithTooltip] могут возглавлять [GetTitleByKey('h_burning_legion').GetName]\n$EFFECT_LIST_BULLET$Открывает доступ к [great_invasion_casus_belli|E] без ограничений на то, куда можно расширяться и что разрушать\n$EFFECT_LIST_BULLET$Каждый раз, когда [GetTitleByKey('h_burning_legion').GetName] побеждает в [great_invasion_casus_belli|E], появляется новый [GetTrait('being_demon').GetName( GetNullCharacter )]-авантюрист"
 CRISIS_BURNING_LEGION_START: "$EFFECT_LIST_BULLET$$game_concept_burning_legion$ призывается в Азерот после того, как владелец [frostmourne|E] успешно использует Книгу Медива и могущественного Лича для призыва [burning_legion|E]."
  
 game_concept_coalition: "Коалиция"
 game_concept_coalitions: "Коалиции"
 game_concept_coalition_desc: "Коалиции похожи на [Concept( 'alliances', 'союзы' )|E] или [Concept( 'unions', 'фракции' )|E], но созданы, чтобы противостоять [Concept( 'ongoing_crisis', 'действующее бедствие' )|E].\n\nКогда [Concept( 'ongoing_crisis', 'действующее бедствие' )|E] объявляет войну члену коалиции, используя казус белли [great_invasion_casus_belli|E], другие участники смогут присоединиться к войне на стороне коалиции.\n\nЧлены коалиции так же могут использовать казус белли [shatter_realm_casus_belli|E] против [Concept( 'ongoing_crisis', 'действующего бедствия' )|E], и могут призвать других членов коалиции присоединиться к войне.\n\nВ отличии от [Concept( 'unions', 'фракций' )|E], коалиции не являются постоянными и распадутся, как только [Concept( 'ongoing_crisis', 'действующее бедствие' )|E] будет побеждено."
 not_in_coalition_against_any: "Не в [Concept( 'coalition', 'коалиции' )|E] против противоположной стороны"
  
 game_concept_lore: "Лор"
 game_concept_lore_desc: "#highlight Лор#! — это общепризнанные сюжет, персонажи, хронология и порядок событий, с которыми вы, возможно, знакомы по #highlight Warcraft#!. Из любви к песочнице #highlight Crusader Kings 3#! мы стремимся сохранить #italic порядок#! событий истории #highlight Warcraft#!, но не обязательно их #italic своевременность#! и #italic точность#!. Это значит, что события могут происходить раньше или позже, могут включать иных персонажей или трактоваться командой иначе. Подсказки помогут вам пройти по сюжету — или отклониться от него, если доступен дополнительный #highlight лор#!."
 game_concept_lore_path: "Путь лора"
 game_concept_lore_path_desc: "#highlight Путь лора#! — это игровой выбор, который в целом следует [lore|E] и должен приводить к событиям в порядке истории #highlight Warcraft#!. Сюжетные варианты, решения и иные игровые выборы, согласующиеся с лором, могут иметь #N негативные#! последствия или даже неизбежную [character_death|E]; но такой выбор позволит вам отыграть историю #highlight Warcraft#!, как вы уже знаете её по другим источникам."
 game_concept_alternate_path: "Альтернативный путь"
 game_concept_alternate_path_desc: "#highlight Альтернативный путь#! — это игровой выбор, который не обязательно следует [lore|E] #highlight Warcraft#!, но может вести к оригинальному контенту, добавленному специально для того, чтобы подарить богатый и разнообразный опыт тем, кто хочет слепить мир Азерота по своей воле. Такие решения могут иметь незнакомые или неожиданные последствия, возможно #N негативные#!, но #highlight не#! приведут к гарантированной [character_death|E]."
 game_concept_earth_elemental: "Каменный элементаль"
 game_concept_earth_elemental_desc: "Каменные элементали — это мощные [men_at_arms|E] с элементального плана. Обычно их призывают могущественные [wc_spells|E].\n\nОни защищают своих союзников и крушат укрепления. Против них эффективны мобильные и летающие [men_at_arms|E]."
 game_concept_fire_elemental: "Огненный элементаль"
 game_concept_fire_elemental_desc: "Огненные элементали — это мощные [men_at_arms|E] с элементального плана. Обычно их призывают могущественные [wc_spells|E].\n\nОни сжигают поля боя дотла; против них эффективны морские и связанные с водой [men_at_arms|E], а также их противоположность — [water_elemental|E]."
 game_concept_fire_tempest: "Огненная буря"
 game_concept_fire_tempest_desc: "Огненная буря — это мощный [fire_elemental|E], состоящий в основном из огня и дыма. Обычно её призывают могущественные [wc_spells|E].\n\nИз-за своей эфирной природы она чувствует себя в сухой местности немного лучше, чем большинство огненных элементалей."
 game_concept_fire_terrestrial: "Огненный террестриал"
 game_concept_fire_terrestrial_desc: "Огненный террестриал — это малый [fire_elemental|E], состоящий в основном из камня и раскалённой лавы. Обычно его призывают могущественные [wc_spells|E].\n\nИз-за своей твёрдой природы он чувствует себя во влажной местности немного лучше, чем большинство огненных элементалей."
 game_concept_master: "Мастер"
 game_concept_master_desc: "Мастер — это тот, кто властвует над [thrall|E], $thrall_master_loc$"
 game_concept_summon: "Призыв"
 game_concept_summon_desc: "Призыв — это персонаж, призванный в этот мир могущественной магией [summoner|E]."
 game_concept_summoned: "Призванный"
 game_concept_summoner: "Призыватель"
 game_concept_summoner_desc: "Призыватель — это человек, который с помощью могущественной магии призывает другого. Этот человек $thrall_master_loc$"
 game_concept_summons: "Призывы"
 game_concept_thrall: "Раб"
 game_concept_thrall_desc: "Раб — это персонаж, порабощённый своим [master|E]; он может сотворять заклинания от его имени, $thrall_master_loc$"
 game_concept_thralls: "Рабы"
 game_concept_water_elemental: "Водный элементаль"
 game_concept_water_elemental_desc: "Водные элементали — это мощные [men_at_arms|E] с элементального плана. Обычно их призывают могущественные [wc_spells|E].\n\nОни сметают поля боя; против них эффективны связанные с землёй [men_at_arms|E], а также их противоположность — [fire_elemental|E]."
 thrall_master_loc: "обычно [GetTrait('being_demon').GetName( GetNullCharacter )] в случае мастера-чернокнижника или призывателя. Когда Призыв — это [GetTrait('being_demon').GetName( GetNullCharacter )] от заклинания [wc_spell_summon_demon|E], он получает особые способности и пассивные умения, приносящие пользу его мастеру, в зависимости от его [wc_race|E] и других факторов.\n\n#help Эти заклинания и преимущества описаны во вкладке «Наблюдение» на магической панели, а также отображаются при сотворении [wc_spell_summon_demon|E] или [wc_spell_subjugate|E] [wc_spells|E].#!"
