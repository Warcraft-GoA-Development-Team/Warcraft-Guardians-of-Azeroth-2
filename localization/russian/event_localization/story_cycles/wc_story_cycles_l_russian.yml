l_russian:

 story_horde_invasion: "Восход Орды"
 story_horde_invasion_desc: "Лок'тар Огар!"
 HORDE_INVASION_LOC_KEY: "Явившись из умирающего мира, орки и их предводитель полны решимости добыть дом для своего народа... войной или погибелью."

 story_scourge_invasion: "Плеть Проклятых"
 story_scourge_invasion_desc: "За Короля-лича!"
 SCOURGE_INVASION_LOC_KEY: "Орда нежити под предводительством бессмертного Короля, что держит над ними вечную власть."

 story_cycle_pa_childhood: "Дитя Судьбы?"
 story_cycle_pa_childhood_desc: "Нежданный ребёнок..."
 CALIA_MENETHIL_STORY_LOC_KEY: "Ребёнок сомнительного происхождения — приведёт ли её судьба к обычной жизни или к пути славы... а быть может, и мести?"

 story_cycle_terenia_invasion: "Дитя Бури!"
 story_cycle_terenia_invasion_desc: "Новая кровь займёт своё законное место..."
 TERENIA_MENETHIL_INVASION_STORY_LOC_KEY: "Судьба делает неожиданный поворот: дитя королевской крови требует вернуть земли её предков — миром или мечом."

 dynamic_story_burning_legion: "Меч Разрушения"
 dynamic_story_burning_legion_desc: "Судьба смертных висит на волоске по воле разрушителя..."
 DYNAMIC_STORY_BURNING_LEGION_LOC_KEY: "Стражи древнего мира ослаблены, а смертные по-прежнему грызутся между собой — настало время положить конец всему, как мы знаем."

 story_thunder_king: "Лэй Шэнь"
 story_thunder_king_desc: "Само небо раскалывается надвое, ибо древняя угроза пробудилась вновь!"
 THUNDER_KING_LOC_KEY: "Король, некогда претендовавший на весь Азерот ради себя, вернулся — кто осмелится противостоять Королю, что собственноручно поверг [Glossary( 'Titan', 'TITAN_GLOSS' )]?"

 story_balnazzar_dreadlord: "Незримый гость"
 story_balnazzar_dreadlord_desc: "Тал'китуун — маска никогда не спадает."
