 game_concept_wc_ascension_action_desc: "Действия, которые позволяют получать очки Эволюции (ОЭ):\n\n$EFFECT_LIST_BULLET$Убить кого-либо\n$EFFECT_LIST_BULLET$Завести ребёнка\n$EFFECT_LIST_BULLET$Провести [scheme|E] «Обхаживание», «Соблазнение», «Роман», «Изучение языка» или «Убийство»\n$EFFECT_LIST_BULLET$Получить немагическое [perk|E] образа жизни\n$EFFECT_LIST_BULLET$Стать взрослым\n$EFFECT_LIST_BULLET$Выиграть [war|E]\n$EFFECT_LIST_BULLET$Начать [travel|E]\n$EFFECT_LIST_BULLET$Назначить [court_position|E]\n$EFFECT_LIST_BULLET$Сотворить [wc_spell|E]\n$EFFECT_LIST_BULLET$Получить новый уровень [piety|E], [influence|E] или [prestige|E]\n$EFFECT_LIST_BULLET$Получить [trait|E] характера (только для детей)\n$EFFECT_LIST_BULLET$Обратиться в новую [faith|E] или [culture|E]\n$EFFECT_LIST_BULLET$Использовать [hook|E]\n$EFFECT_LIST_BULLET$Покинуть [prison|E]\n$EFFECT_LIST_BULLET$Получить или потерять уровень [stress|E]\n$EFFECT_LIST_BULLET$Получить [title|E]\n$EFFECT_LIST_BULLET$Вступить в брак\n\n[vassals|E] дают больше ОЭ, чем [courtiers|E], а [adventurers|E] получают больше очков эволюции. Число ОЭ зависит от действия."

