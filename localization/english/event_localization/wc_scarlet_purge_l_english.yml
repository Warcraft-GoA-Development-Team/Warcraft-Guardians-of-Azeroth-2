l_english:
 wc_scarlet_internal_purge_decision:0 "Purge the Dead from Our Ranks"
 wc_scarlet_internal_purge_decision_desc:0 "There are faces among us that should lie beneath the earth. No robe, oath, or inherited seal can make them living again. I will call them to account before my own people begin to ask why I have not."
 wc_scarlet_internal_purge_decision_tooltip:0 "Summon the known undead under your authority."
 wc_scarlet_internal_purge_decision_confirm:0 "Send the summons."
 wc_scarlet_purge.0001.title:0 "The Living Demand an Answer"
 wc_scarlet_purge.0001.desc:0 "The summons bears [wc_purge_authority.GetTitledFirstNamePossessive] seal. My service is not mentioned. Neither is my rank. There is only the charge that I walk among the living when I should be in my grave.\n\nI am to surrender myself for judgment. The messenger has brought guards. They wait beyond the door, leaving me a little time to decide what my life is still worth."
 wc_scarlet_purge.submit:0 "I will answer before your court."
 wc_scarlet_purge.resist:0 "Then come and take me."
 wc_scarlet_purge.flee:0 "They will find my chambers empty."
