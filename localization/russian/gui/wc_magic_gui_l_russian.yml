l_russian:
 CAST_SPELL_TEXT: "Сотворить заклинание"
 CAST_SPELL_tt: "#P Откройте книгу заклинаний и назначьте этого персонажа главной целью вашего заклинания.#!"
 SPELLBOOK_HEADER_TEXT: "Книга заклинаний"
 SPELLBOOK_HEADER_TEXT_SPELLHACK: "Используется тайное умение «Взлом заклинания»: бесплатно изучите подходящее заклинание.\nКнига заклинаний вернётся в обычный режим, как только вы выберете заклинание."
 SPELLBOOK_HEADER_TEXT_PRESENCE_OF_MIND: "Используется тайное умение «Величие разума»: сократите перезарядку заклинания на 50%.\nКнига заклинаний вернётся в обычный режим, как только вы выберете заклинание или используете [GetDecisionWithKey('deactivate_presence_of_mind_decision').GetName]."
 SPELLBOOK_HEADER_TEXT_REVERSE_CAUSALITY: "Используется тайное умение «Обратная причинность»: отправьте заклинание на перезарядку и увеличьте\nмаксимум маны на 10% за каждый год перезарядки.\nКнига заклинаний вернётся в обычный режим, как только вы выберете заклинание или используете [GetDecisionWithKey('deactivate_reverse_causality_decision').GetName]."
 SPELLBOOK_HEADER_TEXT_CONVOKE: "Используется [wc_spell_convoke|E]:\nВы можете творить любое неритуальное заклинание стихий, [wc_spell_school_order|E] или [wc_spell_school_life|E].\nОно получит сокращённую вдвое перезарядку, мгновенное сотворение, от него нельзя будет уклониться, и оно не будет стоить маны (кроме каналируемых).\nЭффект продлится на следующие [GetPlayer.MakeScope.ScriptValue('convoke_remaining_value')|V0] сотворённых вами заклинаний."
