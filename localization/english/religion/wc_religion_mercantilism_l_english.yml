 #Fortunism-Group Faiths
 fortunism:0 "Fortunism"
 fortunism_adj:0 "Fortunistic"
 fortunism_adherent:0 "Fortunist"
 fortunism_adherent_plural:0 "Fortunists"
 fortunism_desc:0 "$fortunism$ is an ideology based around the goal of making a profit. $fortunism_adherent_plural$ find themselves to be pragmatic, placing their faith in gold and their own abilities to hoard it. They dismiss insubstantial concepts such as shamanism and religion, preferring power and influence in measurable quantities that they can touch, see, and spend as their aspirations demand."
