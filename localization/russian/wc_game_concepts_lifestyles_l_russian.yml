 game_concept_wc_magic_lifestyles_no_lifestyles_line: "Путь"
 game_concept_wc_magic_lifestyle_desc: "[lifestyles|E], используемые для прохождения магического пути, называются $game_concept_wc_magic_lifestyles$.\n\nК $game_concept_wc_magic_lifestyles$ относятся:\n$BULLET_WITH_TAB$ [wc_light_magic_lifestyle|E]\n$BULLET_WITH_TAB$ [wc_shadow_magic_lifestyle|E]\n$BULLET_WITH_TAB$ [wc_disorder_magic_lifestyle|E]\n$BULLET_WITH_TAB$ [wc_order_magic_lifestyle|E]\n$BULLET_WITH_TAB$ [wc_life_magic_lifestyle|E]\n$BULLET_WITH_TAB$ [wc_death_magic_lifestyle|E]\nКроме того, к ним также относятся [wc_elemental_magic_lifestyle_no_lifestyles_line|E]:\n$BULLET_WITH_TAB$ [wc_elemental_fire_magic_lifestyle|E]\n$BULLET_WITH_TAB$ [wc_elemental_water_magic_lifestyle|E]\n$BULLET_WITH_TAB$ [wc_elemental_air_magic_lifestyle|E]\n$BULLET_WITH_TAB$ [wc_elemental_earth_magic_lifestyle|E]"
