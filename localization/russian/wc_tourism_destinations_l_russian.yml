l_russian:
 building_atul_aman_destination_desc: "Просеивая пески Вольдуна, я ощущаю темную энергию, исходящую от [GetBuilding('atul_aman_01').GetName]. Здесь была разрушена печать, которая когда-то сдерживала Г'хуна, миллионы лет назад. С тех пор сюда тянет множество людей, ищущих силы или богатства. Немногие вернулись, не потерявшись в коррумпирующем влиянии Древнего Бога."
 building_caverns_of_time_destination_desc: "Входя в чудесные Пещеры Времени, я ощущаю мощь Бронзового Драконьего Клана. Здесь прошлое, настоящее и будущее сливаются в одно. Пещеры — это узел времени, место, где пересекаются пути времени. Говорят, что это единственное место, где можно путешествовать во времени, не вызывая парадоксов."
 building_corpse_of_agamaggan_destination_desc: "Я ступаю в Резервуары, ощущая дух Агамаггана, великого кабана. Его труп лежит здесь, как доказательство силы смертных. Квилбоары почитают его как бога и построили свое жилище вокруг его останков."
 building_dark_portal_closed_destination_desc: "Рифт между Дренором и Азеротом, [GetBuilding('dark_portal_01').GetName], когда-то был вратами Орды Орков. Теперь это всего лишь трещина в мире, напоминание о темных временах, когда Азероту угрожала опасность. Закрыто Экспедицией, можно ли когда-нибудь снова открыть его?"
 building_dire_maul_arena_destination_desc: "Я наблюдаю за [GetBuilding('dire_maul_arena_01').GetName], представляя сражения, которые когда-то происходили здесь, и различных Эльдре'Таласских Высокородных, приветствующих с трибун. Сейчас арена используется для военной стратегической ценности, это место великой силы и большой опасности."
 building_icc_destination_desc: "Замороженный Трон, как его называют. [GetBuilding('icecrown_citadel_01').GetName] возвышается над всем континентом Нордскола, доказательство силы Лича. Я восхищаюсь его ледяными вершинами и размышляю о прикосновении смерти, которое скрывается в его залах."
 building_ironforge_destination_desc: "Входя в великий город Железных Кузнецов, я поражаюсь его величию и согреваюсь у огней [GetBuilding('ironforge_01').GetName]. Гномы построили город, который является доказательством их силы и изобретательности. Мастерство гномов не имеет себе равных, а их залы наполняет звук молотов на наковальнях."
 building_karazhan_destination_desc: "Башня [medivh.GetName] возвышается передо мной, и энергия ley-линий потрескивает в воздухе. Все знают о силе [medivh.GetFirstNamePossessiveNoTooltip], но что именно он делает в этой грандиозной башне [GetBuilding('karazhan_01').GetName], никто не скажет."
 building_karazhan_later_destination_desc: "Когда-то дом Хранителя, [medivh.GetName], Башня [GetBuilding('karazhan_01').GetName] теперь кажется заброшенной, а ее содержимое остается загадкой для внешнего мира. Ее темная история известна всем, и многие пытались раскрыть ее секреты."
 building_lordaeron_palace_destination_desc: "Дворец Лордерона передо мной, доказательство силы Людей. Его связи с церковью Святого Света очевидны, и исходящая от него сила почти что приветствует меня."
 building_onyxias_lair_destination_desc: "Снаружи это просто пещера. Но внутри — логово Ониксии, матери Черного Драконьего Клана. Многие пытались захватить логово, но пока ни один из них не добился успеха."
 building_ruined_palace_destination_desc: "Когда-то великий человеческий дворец Лордерона, теперь он разрушен Смертными и другими силами. [GetBuilding('ruined_palace_01').GetName] теперь является памятником силе нежити и разрушению, которое они принесли в Азерот."
 building_stormwind_harbor_destination_desc: "Один из крупнейших и самых оживленных портов Восточных Королевств, [GetBuilding('stormwind_harbor_01').GetName] является доказательством изобретательности Людей. Наполненный активностью, порт — место торговли и путешествий. Корабли, которые пришвартовываются здесь, прибывают со всех уголков Азерота, и люди, которые проходят через него, так же разнообразны, как и сами корабли."
 building_sulfuron_spire_destination_desc: "Стоя перед [GetBuilding('sulfuron_spire_01').GetName], я ощущаю силу Повелителя Огня, Рагнароса. Здесь пламя танцует в воздухе, а жара почти невыносимая."
 building_sunwell_destination_desc: "Маяк света для Высших Эльфов, [GetBuilding('sunwell_01').GetName], служит их источником силы. Он излучает силу, которую можно почти почувствовать, а магия, которая из него исходит, почти опьяняет."
 building_sunwell_corrupted_destination_desc: "Когда-то источник силы для Высших Эльфов, Солнечный Колодец был испорчен силами нежити, чтобы подпитать мощь Смертных. Теперь он стал местом тьмы и смерти, отправляя даже самые храбрые души в бегство в ужасе."
 building_nightwell_destination_desc: "Как и их братья-Высшие Эльфы, Ночной Родовитый народ имеет свой собственный источник силы — [GetBuilding('nightwell_01').GetName]. Говорят, что это источник великой силы, доводящей даже самые стойкие души до безумия из-за своей мощи."
 building_ahn_qiraj_destination_desc: "Памятник для созерцания, [GetBuilding('ahn_qiraj_01').GetName] — это дом, который многие Кираджа считают своим единственным домом. Я задаюсь вопросом, какие тайны хранят в себе эти храмы, и есть ли у их жителей желание освободиться или они довольны своей тюрьмой?"
 building_nexus_destination_desc: "Путешествуя под рифами Колдарры, я встречаю вид [GetBuilding('nexus_01').GetName]. Сила Синего Драконьего Клана очевидна здесь, и влияние Малигоса ощущается на протяжении всего здания."
 building_ulduar_destination_desc: "Подходя к крепости, которая является [GetBuilding('ulduar_01').GetName], я задаюсь вопросом о ее цели и тайнах. Построенная тысячелетия назад, Титаны оставили много секретов, и говорят, что Древний Бог Йогг-Сарон был заключен в его залах."
 building_undermine_destination_desc: "Спускаясь под устье горы Каражана, я оказываюсь в городе Подземелье. Гоблины построили город, который является доказательством их изобретательности и жадности, а также напоминанием о их опасностях в прошлом. Эти [GetBuilding('undermine_01').GetName] довольно хорошие, если не учитывать рабов-троллей."
 building_violet_citadel_destination_desc: "Я поражен башней Фиолетового, [GetBuilding('violet_citadel_01').GetName]. Не только как лаборатория и центр исследований для магов по всему Азероту, но и как центр города Даларана."
 building_zuldazar_destination_desc: "Сиденье могущественных Зандалари, город золота, оправдывает сказания о своей величественности. [GetBuilding('zuldazar_01').GetName] стоит крепко, на самых высоких скалах Зандалара, как будто он смотрит на весь Азерот. Самый старый город Азерота, многие народы и культуры могут проследить свои корни от этого величественного храма."
 building_mogushan_palace_destination_desc: "Сиденье великих Могу, [GetBuilding('mogushan_palace_01').GetName] — это доказательство их силы. Великолепно построенное и вырезанное века назад, здесь собираются многие кланы Могу, чтобы обсудить дела государства и поклониться своим предкам."
 building_throne_of_thunder_destination_desc: "Когда-то место силы Громового Короля, Лей Шена, [GetBuilding('throne_of_thunder_01').GetName] теперь является местом прошлого. Я наслаждаюсь его славой и удивляюсь силе, которая когда-то здесь пребывала."
 building_neltharions_lair_destination_desc: "Дрогбары скользят по пещерам Высокой Горы, включая [GetBuilding('neltharions_lair_01').GetName], так же как и его родственница Ониксия, Нелтарион смог вырубить себе логово, которое невозможно осадить никем, кроме самых стойких искателей приключений."
 building_nordrassil_destination_desc: "Посаженное самими Титанами, Древо Мира, [GetBuilding('nordrassil_01').GetName], возвышается передо мной на вершине могучей горы Хиджал. Потомок великого дерева Г'Ханир, оно считается источником великой силы и маяком надежды для всех, кто в поисках."
 building_teldrassil_destination_desc: "Корона Земли, [GetBuilding('teldrassil_01').GetName], дом для могущественной расы Ночных Эльфов. Я чувствую силы жизни и природы под этим величественным деревом и размышляю о цивилизации, которая выросла вокруг и внутри него."
