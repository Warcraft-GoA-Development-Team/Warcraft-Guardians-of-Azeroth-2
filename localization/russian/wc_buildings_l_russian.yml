 building_type_northshire_abbey_01: "Аббатство Североземья"
 building_type_northshire_abbey_01_desc: "Дом братства Североземья. Его священнослужители поддерживали граждан королевства и обеспечивали защиту королевства наряду с армией на протяжении десятилетий."
