l_english:
 # Study Faith adaptation (issue #1969)

 # Holy-book names
 wc_titanic_religious_text:0 "Discs of Norgannon"
 wc_pandaren_religious_text:0 "Lorewalker scrolls"
 SELINES_WRITINGS_NAME:0 "writings of Seline"

 # Scheme
 STUDY_RITE_WC_SYNCRETISM:0 "Syncretic Faith"

 # Rites in the Dark (study_faith_ongoing.1012)
 wc_study_faith_ongoing.1012.t:0 "$study_faith$: Rites in the Dark"
 wc_study_faith_ongoing.1012.desc.intro:0 "I pressed, and [scheme.GetTargetCharacter.GetTitledFirstName] finally stopped pretending. [scheme.GetTargetCharacter.GetSheHe|U] does not worship [scheme.GetTargetCharacter.GetFaith.GetName] at all. [scheme.GetTargetCharacter.GetHerHis|U] true faith is [actual_faith.GetName]."
 wc_study_faith_ongoing.1012.desc.damned:0 "\n\nThe signs were there. Grain carts routed through [GetTitleByKey('c_andorhal').GetBaseNameNoTier], an Orb of Illusion hidden in a chest, talk of 'eternal life and equality' for the poor. The Cult of the Damned recruits in the shadow of every chapel."
 wc_study_faith_ongoing.1012.desc.burning_blade:0 "\n\nA searing collar under [scheme.GetTargetCharacter.GetHerHis] furs, and a greeting I was never meant to hear: 'Galtak Ered'nash.' The Burning Blade still whispers to orcs who miss the old power."
 wc_study_faith_ongoing.1012.desc.atalai:0 "\n\nThe bat sigil of Hir'eek, and dried blood on a private altar. The Atal'ai were hunted nearly to extinction for calling on the Soulflayer, and some of them clearly survived."
 wc_study_faith_ongoing.1012.desc.dark_iron:0 "\n\nEmber-runes carved under the hearthstone, and a heat in [scheme.GetTargetCharacter.GetHerHis] voice when [scheme.GetTargetCharacter.GetSheHe] speaks of the deep places. [actual_faith.HighGodName] has servants far from [GetTitleByKey('d_blackrock_mountain').GetBaseNameNoTier]."
 wc_study_faith_ongoing.1012.desc.twilight:0 "\n\nA flaming-hammer sign inked inside a book cover, and pages of the Twilight Canticle tucked among the 'scripture'. The Twilight's Hammer recruits the doubtful and the bitter wherever they find them."
 wc_study_faith_ongoing.1012.a:0 "Expose [scheme.GetTargetCharacter.GetHerHim] before the court!"
 wc_study_faith_ongoing.1012.a.tt:0 "Unmasked cultists sometimes throw off the mask entirely."
 wc_study_faith_ongoing.1012.b:0 "Say nothing. Keep [scheme.GetTargetCharacter.GetHerHim] close, and keep learning."
 wc_study_faith_ongoing.1012.c:0 "Show me what you truly believe."
 wc_study_faith_ongoing.1012.c.tt:0 "You will secretly follow [actual_faith.GetName] and may learn one of its tenets. Your studies of [scheme.GetTargetCharacter.GetFaith.GetName] end."
 wc_study_faith_ongoing.1012.d:0 "I need a teacher who believes what they teach."

 # 0400
 wc_study_faith_knows_my_secret_opinion:0 "Knows My Secret"
 wc_study_faith.0400.t:0 "$study_faith$: A Knowing Look"
 wc_study_faith.0400.desc:0 "[target.GetFirstName] has stopped smiling at me. Somehow [target.GetSheHe] has worked out that I know [target.GetHerHis] secret, and our lessons have turned cold and guarded."
 wc_study_faith.0400.a:0 "Let [target.GetHerHim] stew."

 # Holy text quotes (RandomHolyTextQuote). Canon lines carry their source; the rest are original lines in the faith's voice.
 # Uther, The Light and How to Swing It
 wc_holy_text_light_1:0 "Only a calm mind will provide clear actions; only a peaceful heart may be truly infused with the Light."
 # Uther, Warcraft III
 wc_holy_text_light_2:0 "Vengeance cannot be a part of what we must do."
 wc_holy_text_light_3:0 "Respect thy foe, endure thy trial, and grieve with the grieving; so the Light that dwells in all shall dwell in thee."
 wc_holy_text_light_4:0 "The Light asks no blood of you. It asks only that you stand where others cannot."
 # Prophet's Lesson
 wc_holy_text_naaru_1:0 "Each life, a universe."
 wc_holy_text_naaru_2:0 "Each life, a universe; each universe, a song the Light remembers."
 wc_holy_text_naaru_3:0 "What was broken may yet be mended, and what is mended shines brightest where it broke."
 wc_holy_text_naaru_4:0 "Many worlds fell to shadow. One people walked on. So long as one walks, the Light walks beside them."
 # Promise of Elune
 wc_holy_text_elune_1:0 "When others receive life and energy from you, you too shall receive life and energy from me."
 # Astarii Starseeker's elegy
 wc_holy_text_elune_2:0 "By the moons' glow, listen. Beside the river, listen. Holding those you love, listen."
 wc_holy_text_elune_3:0 "When the sun is gone, She is not gone. Walk softly beneath Her and be seen."
 wc_holy_text_elune_4:0 "Take what you need and thank what you take; the forest keeps its own accounts."
 # Cloudsong, War Crimes
 wc_holy_text_shaman_1:0 "Welcome, Spirit of Life. You are in our breath with air, our blood with fire, our bones with earth, our tears with water."
 # The Farseer, Earthen Ring
 wc_holy_text_shaman_2:0 "Others shout, and fight, and abandon reason. But we listen."
 wc_holy_text_shaman_3:0 "Ask, and the earth may answer. Demand, and it will be silent, as it was silent to our fathers."
 wc_holy_text_shaman_4:0 "From her we rose; to her we return; between, we walk lightly upon her."
 # Kobold saying
 wc_holy_text_kobold_1:0 "Never pick above your snout, else the darkness snuff you out!"
 wc_holy_text_loa_1:0 "Speak de name, feed de idol, keep de bargain. De loa remember what ya promised, even when ya forget."
 wc_holy_text_loa_2:0 "A loa without worshippers be a whisper in de jungle. A people without loa be a song nobody sings."
 wc_holy_text_loa_3:0 "Every gift from de loa got a price, and de price always come due."
 # Bwonsamdi
 wc_holy_text_loa_4:0 "Sooner or later, everyone comes to me."
 # Umbrella of Chi-Ji
 wc_holy_text_pandaren_1:0 "Hope is the sun behind a stormy sky. Ever in the heart, but veiled to the eye."
 # Pearl of Yu'lon
 wc_holy_text_pandaren_2:0 "There is but one certainty - every end marks a new beginning."
 # Master Feng
 wc_holy_text_pandaren_3:0 "Discipline is not a war that is won. It is a battle, constantly fought."
 wc_holy_text_pandaren_4:0 "Endure as the Ox, hope as the Crane, strike as the Tiger, and know, as the Serpent, when not to strike."
 # The Twilight Apocrypha
 wc_holy_text_void_1:0 "In the beginning was shadow eternal. Hate blazed forth, and FIRE was born."
 # The Twilight Apocrypha
 wc_holy_text_void_2:0 "We live in the shadow. The world we know. Built of rage, hurt, anguish and sorrow."
 wc_holy_text_void_3:0 "Before the Light, the shadow; after the Light, the shadow. Open the eye that was never shut."
 wc_holy_text_void_4:0 "Every choice you make feeds the hunger beneath the world, and the hunger is patient."
 # Lore Keeper of Norgannon
 wc_holy_text_titan_1:0 "They are the beings that seeded and shaped this world by their own design."
 wc_holy_text_titan_2:0 "We were carved, not born; so let us read the chisel-marks and learn the hand that held it."
 wc_holy_text_titan_3:0 "Every stone remembers the hand that set it. Ask the stone."
 # Edict of the Thunder King
 wc_holy_text_thunder_king_1:0 "To be mogu is to rule. It is why we were created."
 # Prophecy of Rythas the Oracle
 wc_holy_text_odyn_1:0 "Do not fear death. To live as a vrykul is to know danger."
 wc_holy_text_shadow_1:0 "A Forsaken priest walks a road the Church never mapped, and walks it without apology."
 wc_holy_text_shadow_2:0 "Respect. Tenacity. Power. The Light abandoned the grave; we did not."
 wc_holy_text_shadow_3:0 "Shadow is no enemy of the Light. It is the half of the coin the Church would not spend."
 wc_holy_text_shadow_4:0 "Soon Azeroth will see the rise of the Forgotten Shadows."
 wc_holy_text_death_1:0 "Flesh fails; will endures. Serve in death what you could not master in life."
 wc_holy_text_death_2:0 "The grave is not an ending. It is an apprenticeship."
 wc_holy_text_death_3:0 "The living promised the poor bread and gave them hunger. We promise them eternity, and we keep our word."
 # Knights of the Ebon Blade
 wc_holy_text_ebon_1:0 "Our penance is to stand vigil against that evil for all time."
 # Kil'jaeden, Tomb of Sargeras
 wc_holy_text_fel_1:0 "Every creature serves a master, even I. That is the choice of all: serve another, or die alone."
 # Kil'jaeden, Tomb of Sargeras
 wc_holy_text_fel_2:0 "Servitude is not imprisonment. You will serve me, others will serve you."
 wc_holy_text_fel_3:0 "The universe is a wound; fire is the cautery. Kneel, and be given the knife."
 # Burning Blade greeting
 wc_holy_text_burning_blade_1:0 "Galtak Ered'nash. All hail the Burning Blade."
 # Thalassian
 wc_holy_text_arcane_1:0 "Anar'alah belore. By the light of the sun."
 wc_holy_text_arcane_2:0 "The sun guides us; the Well sustains us; what is drawn must be returned in kind."
 wc_holy_text_arcane_3:0 "Catalog every spell, and lock away the ones that would catalog you."
 # Thalassian
 wc_holy_text_arcane_4:0 "Ishnu alah terro shar. Until even stars fade."
 # The Pantheon's charge to the Aspects
 wc_holy_text_dragon_1:0 "Unto each of you is given a gift; unto all of you is given the duty."
 # Alexstrasza, Charge of the Aspects
 wc_holy_text_dragon_2:0 "To protect life, there are times when we must destroy that which seeks to end it."
 wc_holy_text_dragon_3:0 "Five were charged and five were bound; ask of each only what was given to it."
 wc_holy_text_dragon_4:0 "The flights remember what the younger races forget, and forgive less than they remember."
 # Majordomo Executus
 wc_holy_text_fire_1:0 "Behold Ragnaros - the Firelord! He who was ancient when this world was young!"
 wc_holy_text_fire_2:0 "Fire does not ask permission. It only asks for more."
 wc_holy_text_earth_1:0 "Stone does not hurry, and stone does not forgive."
 wc_holy_text_earth_2:0 "Dig deep enough and every road leads home to her."
 wc_holy_text_water_1:0 "The tide takes back everything it lends, in its own time."
 wc_holy_text_water_2:0 "Bless the hull, bury the silver, and the sea will remember your name."
 wc_holy_text_air_1:0 "The wind carries every word you speak to one who listens."
 wc_holy_text_air_2:0 "Even his own storms are uneasy speaking his name."
 wc_holy_text_minor_1:0 "The first ones are not gone. They wait where the old songs end."
 wc_holy_text_minor_2:0 "What the elders knew, the young must find again, and pay for again."
 wc_holy_text_minor_3:0 "Small gods are still gods, to those who are small enough to hear them."
 # Seer Ul'Tomon (Warcraft RPG)
 wc_holy_text_nerubian_1:0 "Worshipping the Old Gods makes as much sense as a fly caught in a web worshipping the spider who is about to devour him."
 wc_holy_text_avian_1:0 "Rukhmar sees all that lies beneath the sun, and the sun sees all that lies beneath her."

 # Modifiers
 wc_study_faith_archive_access:0 "Archive Access"
 wc_study_faith_archive_access_desc:0 "The stacks of a great archive are open to this study."
 wc_study_faith_archive_stolen:0 "Stolen Pages"
 wc_study_faith_archive_stolen_desc:0 "Pages taken from a great archive, read by candlelight."
 wc_study_faith_endorsed:0 "Endorsed Studies"
 wc_study_faith_endorsed_desc:0 "A voice of the faith has blessed this study."
 wc_study_faith_fel_insight:0 "Fel Insight"
 wc_study_faith_fel_insight_desc:0 "Whispered secrets of the Burning Legion sharpen mind and arm alike."
 wc_study_faith_fel_insight_greater:0 "Fel Bargain"
 wc_study_faith_fel_insight_greater_desc:0 "A pact has been struck. The power is real, and so is the debt."
 wc_study_faith_fel_taint:0 "Fel Taint"
 wc_study_faith_fel_taint_desc:0 "Fel corruption lingers in the blood."

 # Opinions
 wc_study_faith_endorsed_studies_opinion:0 "Endorsed Their Studies"
 wc_study_faith_condemned_studies_opinion:0 "Condemned Their Studies"
 wc_study_faith_defended_me_opinion:0 "Defended Me"
 wc_study_faith_defied_me_opinion:0 "Defied My Warning"
 wc_study_faith_recanted_opinion:0 "Recanted Dark Studies"
 wc_study_faith_archive_meddling_opinion:0 "Bribed My Librarians"
 wc_study_faith_archive_theft_opinion:0 "Stole From My Archive"

 # Scheme
 wc_study_faith_condemned_faith_tt:0 "Your studies of this faith have not been condemned in the last five years"

 # 0100 Void
 wc_study_faith.0100.t:0 "$study_faith$: The Whispering Margin"
 wc_study_faith.0100.desc:0 "#EMP "[scheme.GetTargetCharacter.Custom('RandomHolyTextQuote')]"#!\n\nThere is a line in the margin of my notes that I did not write. It is in my hand. It answers a question I have not asked yet.\n\nSeline studied the shadow to fight it, and her own students murdered her in the night. I could stop now. Or I could read the next page."
 wc_study_faith.0100.a:0 "One more page."
 wc_study_faith.0100.b:0 "Burn it. All of it."
 wc_study_faith.0100.c:0 "Seal the notes away in the Dalaran Vaults."

 # 0110 Fel
 wc_study_faith.0110.t:0 "$study_faith$: Serve Another"
 wc_study_faith.0110.desc:0 "The grimoire [scheme.GetTargetCharacter.GetFirstName] lent me is warm to the touch. Tonight the warmth spoke.\n\n#EMP "Every creature serves a master. Serve, and be served. Refuse, and die alone."#!\n\nThe voice offers strength and clarity, freely, for now."
 wc_study_faith.0110.a:0 "I will take what the pages teach, and nothing more."
 wc_study_faith.0110.b:0 "Into the fire with it."
 wc_study_faith.0110.c:0 "Name your price."
 wc_study_faith.0110.c.tt:0 "The voice will come to collect, in two to four years."

 # 0111 Fel debt
 wc_study_faith.0111.t:0 "The Debt Comes Due"
 wc_study_faith.0111.desc:0 "The warmth is back, and this time it burns. The voice does not ask. It reminds.\n\nA life was promised for the power I took. Mine, or another's."
 wc_study_faith.0111.a:0 "Take [victim.GetFirstName]."
 wc_study_faith.0111.b:0 "Take my blood instead."
 wc_study_faith.0111.c:0 "I owe you nothing!"

 # 0120 Death
 wc_study_faith.0120.t:0 "$study_faith$: Tainted Notes"
 wc_study_faith.0120.desc:0 "My notes on [scheme.GetTargetCharacter.GetFaith.GetName] have been moved. Someone has read them: the sketches of binding circles, the reagent lists, the passage on raising the willing dead.\n\nAntonidas once searched Kel'Thuzad's rooms for less. Whoever found these will talk."
 wc_study_faith.0120.desc.ebon:0 "My notes on [scheme.GetTargetCharacter.GetFaith.GetName] have been moved. The knights of the Ebon Blade claim they stand vigil against the Scourge that made them, but their runes are still death magic, and someone has seen my copies.\n\nWhoever found these will talk."
 wc_study_faith.0120.a:0 "Let them talk. I am nearly there."
 wc_study_faith.0120.b:0 "Burn the notes before anyone else sees them."
 wc_study_faith.0120.c:0 "I will recant before the court."

 # 0200 Sealed archive
 wc_study_faith.0200.t:0 "$study_faith$: A Sealed Archive"
 wc_study_faith.0200.desc.intro.mine:0 "Every road in my study of [scheme.GetTargetCharacter.GetFaith.GetName] leads to the same place: [archive.GetName], and it is mine."
 wc_study_faith.0200.desc.intro:0 "Every road in my study of [scheme.GetTargetCharacter.GetFaith.GetName] leads to the same place: [archive.GetName], held by [archive_holder.GetTitledFirstName]."
 wc_study_faith.0200.desc.cathedral:0 "\n\nBeneath the Cathedral of Light lies a library in the catacombs, where the Church keeps the writings it would rather the faithful never read."
 wc_study_faith.0200.desc.athenaeum:0 "\n\nThe Highborne of Eldre'Thalas trade lore for relics, and their Athenaeum guards tomes from Azshara's own court. They say something beneath its floors feeds the scholars who stay too long."
 wc_study_faith.0200.desc.explorers:0 "\n\nThe Explorers' League keeps its finds in the Hall of Explorers: tablets, discs and rune-stones that turned a nation of miners into a nation of scholars."
 wc_study_faith.0200.desc.vaults:0 "\n\nThe Kirin Tor lock away what they fear in the Dalaran Vaults. Natalie Seline's writings lie among them, sealed after her own students murdered her."
 wc_study_faith.0200.desc.scholomance:0 "\n\nAt Caer Darrow, the Scholomance teaches a curriculum no chapel would print: the dark arts, reanimation, and the care of the willing dead."
 wc_study_faith.0200.desc.zuldazar:0 "\n\nIn Zuldazar the Zandalari priest caste keeps the histories of every troll tribe, and they do not share them lightly."
 wc_study_faith.0200.desc.karazhan:0 "\n\nMedivh's library at Karazhan dwarfs even the Kirin Tor's collection. Not every book in it wants to be read, and not every assistant who shelved them came back."
 wc_study_faith.0200.a:0 "Open the stacks. They are mine."
 wc_study_faith.0200.b:0 "Ask for access, and pay for it."
 wc_study_faith.0200.c:0 "Ask for access, and owe a favor."
 wc_study_faith.0200.d:0 "A librarian can always use more coin."
 wc_study_faith.0200.d.success:0 "The librarian looks the other way"
 wc_study_faith.0200.d.failure:0 "The librarian reports the bribe"
 wc_study_faith.0200.e:0 "We will take the pages ourselves."
 wc_study_faith.0200.e.success:0 "The pages are taken unnoticed"
 wc_study_faith.0200.e.failure:0 "The thief is caught"
 wc_study_faith.0200.f:0 "It is not worth the trouble."

 # 0300-0313 Rejection and ruling
 wc_study_faith.0300.t:0 "$study_faith$: An Outsider at the Altar"
 wc_study_faith.0300.desc:0 "[zealot.GetTitledFirstName] has denounced [target.GetFirstName] before the faithful for teaching the ways of [target.GetFaith.GetName] to an outsider like me.\n\n"Our rites are not a curiosity for a [ROOT.Char.GetFaith.GetAdherentName] to collect!" [zealot.GetSheHe] declares. [target.GetFirstName] looks to me, waiting to see what I will do."
 wc_study_faith.0300.a:0 "[target.GetFirstName] is under my protection."
 wc_study_faith.0300.b:0 "I will not cost [target.GetHerHim] [target.GetHerHis] place. I will find another teacher."
 wc_study_faith.0300.c:0 "Let the faith's own voice decide."
 wc_study_faith.0300.c.tt:0 "You petition [judge.GetTitledFirstName] for a ruling on your studies. The answer will come in one to two months."
 wc_study_faith.0310.opening:0 "To [ROOT.Char.GetTitledFirstName],"
 wc_study_faith.0310.desc:0 "I have been studying the ways of [ROOT.Char.GetFaith.GetName] in good faith, but [zealot.GetTitledFirstName] has denounced my teacher, [target.GetTitledFirstName], for instructing me.\n\nI ask for your ruling. Will you bless my studies, or forbid them?"
 wc_study_faith.0310.a:0 "Knowledge of the faith harms no one. I endorse it."
 wc_study_faith.0310.b:0 "Our rites are not for outsiders. I forbid it."
 wc_study_faith.0311.t:0 "$study_faith$: Endorsed"
 wc_study_faith.0311.desc:0 "[judge.GetTitledFirstName] has answered my petition and blessed my studies. [zealot.GetFirstName] can say what [zealot.GetSheHe] likes now."
 wc_study_faith.0311.a:0 "Excellent."
 wc_study_faith.0312.t:0 "$study_faith$: Condemned"
 wc_study_faith.0312.desc:0 "[judge.GetTitledFirstName] has answered my petition by condemning my studies of [studied_faith.GetName]. No teacher of that faith will dare instruct me now."
 wc_study_faith.0312.a:0 "So be it."
 wc_study_faith.0312.a.tt:0 "You cannot study [studied_faith.GetName] again for five years."
 wc_study_faith.0313.t:0 "Petition Unanswered"
 wc_study_faith.0313.tt:0 "Your petition for a ruling on your studies went unanswered."

 # 1030 relic
 wc_study_faith_ongoing.1030.desc.relic:0 "A [chosen_peasant.GetWomanMan] approaches me, cradling something wrapped in old cloth.\n\n"[ROOT.Char.Custom('FormOfAddressForLiege')|U], they say you study the ways of [scheme.GetTargetCharacter.GetFaith.GetName]. My father brought this back from [holy_site.GetNameNoTier]. Folk call it the [newly_created_artifact.GetName]."\n\n"It gives me bad dreams. I would happily part with it, for some coin.""

 # Relics
 wc_study_faith_relic_libram_ancient_kings_name:0 "Libram of Ancient Kings"
 wc_study_faith_relic_libram_ancient_kings_desc:0 "A libram of the Silver Hand in which every leader of the order inscribes their name. It was lost when Lordaeron fell."
 wc_study_faith_relic_arrival_of_the_naaru_name:0 "Arrival of the Naaru"
 wc_study_faith_relic_arrival_of_the_naaru_desc:0 "A recording crystal that holds the first meeting of the eredar and the naaru. Its light still hums."
 wc_study_faith_relic_headdress_first_shaman_name:0 "Headdress of the First Shaman"
 wc_study_faith_relic_headdress_first_shaman_desc:0 "A wolf-head cowl. Orcish shamanism has no known origin, and its creator and first wearer are lost to history."
 wc_study_faith_relic_puzzle_box_name:0 "Puzzle Box of Yogg-Saron"
 wc_study_faith_relic_puzzle_box_desc:0 "A box that cannot be opened. Those who try insist, after a while, that the fault is their own."
 wc_study_faith_relic_doomsday_prophecy_name:0 "Doomsday Prophecy"
 wc_study_faith_relic_doomsday_prophecy_desc:0 "A tablet carved with seven different, sometimes conflicting, ends of the world, under the sign of a flaming hammer."
 wc_study_faith_relic_praying_mantid_name:0 "The Praying Mantid"
 wc_study_faith_relic_praying_mantid_desc:0 "An amber-set figure inscribed with a prayer to 'the seven-headed one'."
 wc_study_faith_relic_edicts_thunder_king_name:0 "Edicts of the Thunder King"
 wc_study_faith_relic_edicts_thunder_king_desc:0 "A law tablet decreeing that sedition, insurrection and rebellion be punished by public evisceration."
 wc_study_faith_relic_talonpriest_mask_name:0 "Talonpriest Mask"
 wc_study_faith_relic_talonpriest_mask_desc:0 "Talonpriests hid their faces from the sun they served. This mask has not seen daylight in centuries."
 wc_study_faith_relic_atalai_scepter_name:0 "Atal'ai Scepter"
 wc_study_faith_relic_atalai_scepter_desc:0 "The scepter of 'the devoted ones', the Hakkari priests who were hunted nearly to extinction for calling on the Soulflayer."
 wc_study_faith_relic_druid_priest_statues_name:0 "Druid and Priest Statue Set"
 wc_study_faith_relic_druid_priest_statues_desc:0 "Paired statues recording the 'momentous and turbulent' day when night elf men took up druidism and women the priesthood of Elune."
