# Reforming the Orcish Horde decision
 
 wc_reform_the_orcish_horde.0001.title:0 "Reminisce"
 wc_reform_the_orcish_horde.0001.desc:0 "Many of our fellow orcs have lost their homes and their lands in Azeroth because of Blackhand's downfall and his tyranny. Orc across these lands have suffered because of his defeat and the humiliation that comes from the Alliance Internment Act.\n\nWhere the warlords of the past have failed, I will succeed. As the leader of [horde_invaders|E], I will make all of Azeroth kneel before me!"
 wc_reform_the_orcish_horde.0001.a:0 "Lok'tar Ogar!"
 wc_reform_the_orcish_horde.0001.a.tt:0 "You will become a [horde_invaders|E] [crisis|E]"
