l_french:
 nomad_events.0250.wc_civlilized_intro: "Un[priest.Custom('FR_E')] visit[priest.Custom('FR_EurRice')] étranger[priest.Custom('FR_ErEre')] est arrivé[priest.Custom('FR_E')] à ma cour, porteu[priest.Custom('FR_RSe')] d'un message des plus étranges qui, m'assure-t-on, devrait m'intéresser. Cependant, lorsqu'[priest.GetSheHe] commence à parler, je suis tellement surpris[ROOT.Char.Custom('FR_E')] que je me demande s'il ne s'agit pas d'une blague élaborée :\n\n"
 nomad_events.0250.wc_default_intro: "Certains de mes proches ont amené un[priest.Custom('FR_E')] visit[priest.Custom('FR_EurRice')] étranger[priest.Custom('FR_ErEre')] devant moi, avec un message qui, selon eux, m'intéressera. Ils lui font signe avec excitation de parler :\n\n"
 nomad_events.0250.wc: "\"Exécutez c[priest.Custom('FR_EEtte')] blasphemat[priest.Custom('FR_EurRice')] immédiatement !\""