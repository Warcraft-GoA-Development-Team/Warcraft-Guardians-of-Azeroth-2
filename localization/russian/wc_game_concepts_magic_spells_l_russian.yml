 game_concept_wc_spell_raise_dead: "Воскрешение мёртвых"
 game_concept_wc_spell_raise_dead_desc: "Повелевайте тёмными силами некромантии, поднимая павший труп в качестве нежити-слуги. Связанный вашей волей, оживший слуга подчиняется без вопросов, неотступно сражаясь рядом с вами."
 wc_spell_raise_dead_type: "[wc_spell_type_summon|E]"
