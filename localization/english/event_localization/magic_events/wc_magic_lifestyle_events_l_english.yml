arcane_magic_lifestyle_events.1031.t:0 "Time Stops"
arcane_magic_lifestyle_events.1031.desc:0 "Your experiments with the arcane have created an atemporal cascade which has caused you to become temporarily unstuck from time. As a result of this event, the world around you remains at a complete standstill, but you are free to move and act as you will. You are unsure exactly how this has happened, but it seems that this effect will not last more than a couple days.\n\nThis event has resulted in an unexpected glut of free time as you wait for the cascade to resolve itself. As a leader, you are immediately aware of the precious opportunity you have been afforded. How will you use it?"
arcane_magic_lifestyle_events.1031.opt.a:0 "Time for some light reading!"
arcane_magic_lifestyle_events.1031.opt.b:0 "Finally, a chance to rest, feast, and decompress."
arcane_magic_lifestyle_events.1031.opt.c:0 "Does this mean... I am invisible?"

