l_english:
  wc_balnazzar_contingency_outcome.1001.title:0 "A Face Worth Wearing"
  wc_balnazzar_contingency_outcome.1001.desc:0 "Saidan Dathrohan is worth watching - his devotions, his blind spots, the small vanities not one of his knights has noticed. I do this alone. There is no coven of demons to whisper this to, no Legion to arrange the pieces for me. Just patience, and time enough to spend it."
  wc_balnazzar_contingency_outcome.1001.a:0 "Watch, and wait."

  wc_balnazzar_contingency_outcome.1002.title:0 "A Careful Habit"
  wc_balnazzar_contingency_outcome.1002.desc:0 "Watching Dathrohan has stopped feeling like work. I know the hour he prays, the hand he favors, the way he pauses before he lies to himself about the Light still listening. None of it is urgent. All of it is useful."
  wc_balnazzar_contingency_outcome.1002.a:0 "Keep watching."

  wc_balnazzar_contingency_outcome.1003.title:0 "Old Pages"
  wc_balnazzar_contingency_outcome.1003.desc:0 "Half-forgotten texts, the kind most who might have used them against me never bothered to keep. I read them slowly, alone, and no one asks what a keeper of ash does with his evenings."
  wc_balnazzar_contingency_outcome.1003.a:0 "Keep reading."

  wc_balnazzar_contingency_outcome.2001.title:0 "Ready, If It Comes to That"
  wc_balnazzar_contingency_outcome.2001.desc:0 "The magic that keeps a corpse from rotting while something else wears it is not difficult, only forgotten by most who might have used it against me. I relearn it slowly, and quietly secure what I'll need. The plan is complete now, waiting the way a blade waits in its sheath - unused, unremarked, entirely ready. If Lordaeron isn't mine to keep, there will be no scramble, no improvising in front of witnesses. Only a body found burned past recognition, and a keeper who never really left."
  wc_balnazzar_contingency_outcome.2001.a:0 "Let it wait, ready."

  wc_balnazzar_contingency_outcome.4001.title:0 "An Unfinished Thought"
  wc_balnazzar_contingency_outcome.4001.desc:0 "The threads I meant to gather come apart before I can weave them into anything worth trusting - watched too closely, distracted too often, or simply not patient enough this time. If the crown falls, I will have to find another way through it when the moment comes."
  wc_balnazzar_contingency_outcome.4001.a:0 "Let it go, for now."

  wc_balnazzar_contingency_invalidated_title:0 "An Interrupted Plan"
  wc_balnazzar_contingency_invalidated_desc:0 "Whatever I was building comes apart before it can finish - patience spent for nothing."

  wc_balnazzar_accomplice_agent:0 "Silent Accomplice"
  wc_balnazzar_accomplice_agent_desc:0 "Someone who knows enough to keep the story straight, and says nothing."
  wc_balnazzar_accomplice_agent_i:0 "Silent Accomplice"
  wc_balnazzar_confidant_agent:0 "Trusted Confidant"
  wc_balnazzar_confidant_agent_desc:0 "Someone close enough to notice the seams, kept close enough not to ask."
  wc_balnazzar_confidant_agent_i:0 "Trusted Confidant"
