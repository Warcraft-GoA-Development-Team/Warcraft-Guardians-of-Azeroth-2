 wc_scarlet_purge_targets_requirement:0 "A known undead subject is available to be summoned before the Inquisition"
 wc_scarlet_stratholme_single_claim_requirement:0 "The campaign for Stratholme must claim that duchy alone"
 wc_scarlet_purge.0002.title:0 "The Dead Among Us"
 wc_scarlet_purge.0002.desc:0 "The summons lie before me, their seals still soft. Beyond the door, eager crusaders wait for the names. They have seen the dead walk beneath our banners; now they demand that I act.\n\nThey will seek out the known undead among my subjects and bring them before the Inquisition. Those who answer will face judgment. Those who refuse may flee, or raise their weapons against us. I press my seal into the wax."
 wc_scarlet_purge.0002.a:0 "Let the summons be read."
 wc_scarlet_raymond_fairbanks:0 "[CHARACTER.GetShortUIName|U] broke with [TARGET_CHARACTER.GetShortUIName] over the imprisonment of Fairbanks."
 wc_scarlet_raymond_fairbanks_corresponding:0 "[TARGET_CHARACTER.GetShortUIName|U] broke with [CHARACTER.GetShortUIName] over the imprisonment of Fairbanks."
