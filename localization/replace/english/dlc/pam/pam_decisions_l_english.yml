 pam_promulgate_word_of_pious_deeds_decision: "Promulgate Word of Pious Deeds"
 pam_promulgate_word_of_pious_deeds_decision_desc: "My chancery has assembled an encomium praising my Christlike deeds. Though it is unbecoming to extol my own virtues, those close to me wish to spread word of my godliness to all [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip].\n\nWith such knowledge, word might spread that I am the [ROOT.Char.GetWomanMan] most worthy to ascend St. Peter's Throne... and beyond."
 pam_promulgate_word_of_pious_deeds_decision_desc_tooltip: "#V Increase Election Score#! for [Select_CString(ROOT.Char.GetReligiousSuperior.IsValid, ROOT.Char.GetReligiousSuperior.GetPrimaryTitle.GetName, ROOT.Char.GetPrimaryTitle.GetName)]: #P +30#! or Improve Chances for [canonization|E]"
 
 pam_promulgate_word_of_pious_deeds_decision_tooltip_effect: "Choose Between: \n\t$EFFECT_LIST_BULLET$Pay [piety|E] to #V Increase Election Score#! for [praise_worthy_priest_superior_title.GetName] \n\t$EFFECT_LIST_BULLET$Improve your chance at future [canonization|E]"
 pam_promulgate_word_of_pious_deeds_decision_confirm: "Permit their praise!"
