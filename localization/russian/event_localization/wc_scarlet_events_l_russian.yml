l_russian:
 SCARL.000_TITLE: "Оставшиеся"
 SCARL.000_DESC: "Когда-то сиявший Светом, [GetTitleByKey('k_lordaeron').GetBaseNameNoTier] теперь представляет собой лишь кишащие мертвецами руины — пир для проклятых. Нас, выживших, осталось мало. Мы рассеяны, нас преследует Плеть, а хуже всего — предатели из числа тех, кто некогда называл себя нашими братьями, добровольно ставшие частью армии проклятых.\n\n[GetTitleByKey('k_order_of_the_silver_hand').GetName] стоит на грани уничтожения, его величайшие защитники пали или обратились против нас.\n\n[scoped_betrayer.GetName] отдал наши земли самой смерти, и теперь ходят слухи о тех, кто в наших рядах предпочёл бы дрожать от страха или сговориться с врагом, а не встать и дать отпор.\n\nНо я не дрогну.\n\nЕсли в этом крае остались праведные воины — я найду их. Мы поднимемся из пепла Лордерона не жертвами, а теми, кто очистит чуму, похитившую наш дом. [GetTrait('lich_king').GetName(GetNullCharacter)] узнает, что эта земля принадлежит нам."
 SCARL.000_OPT_A: "Я разошлю посланцев тем, кто верен трону."
 SCARL.000_OPT_A_tt: "Вы разошлёте призывы внутри [GetTitleByKey('k_lordaeron').GetBaseNameNoTier] для объединения против Короля-лича."
 SCARL.000_OPT_B: "Я не могу позволить себе гоняться за призраками."
 SCARL.000_OPT_tt: "Вы выбираете стоять в одиночестве."
  
 SCARL.001_TITLE: "Оставшиеся"
 SCARL.001_DESC: "Последним истинным рыцарям Лордерона,\n\nЛордерон пал, но Свет всё ещё горит в нас. Предатели и проклятые желают, чтобы королевство было утеряно навеки.\nЯ отказываюсь уступать.\nЕсли у вас ещё есть воля сражаться — встаньте рядом с последними из Серебряной Длани. Вместе мы очистим эти земли от заразы и вернём то, что принадлежит нам."
 SCARL.001_OPT_A: "За Лордерон! Мы будем стоять и сражаться!"
 SCARL.001_OPT_A_TT: "Вы присоединитесь к встрече с Серебряной Дланью, чтобы обсудить судьбу Лордерона."
 SCARL.001_OPT_B: "Эта война уже проиграна."
 SCARL.001_OPT_B_TT: "Вы игнорируете призыв."
  
 SCARL.002_TITLE: "Оставшиеся"
 SCARL.002_DESC: "Ваш зов услышан. Свет не оставил нас — и мы не оставим вас. Лордерон может лежать в руинах, но наш долг остаётся до самой смерти. Мы соберём силы и явимся на встречу.\nЗа Лордерон и за Свет."
 SCARL.002_OPT_A: "Отлично."
  
 SCARL.003_TITLE: "Оставшиеся"
 SCARL.003_DESC: "Лордерон утрачен. Мёртвые правят улицами, а благоволение Света к нам угасло.\nЯ не поведу свой народ на смерть ради королевства, которого больше нет. Нам нужно искать другие пути выживания.\nНе ищите нас вновь."
 SCARL.003_OPT_A: "Трусы."
  
 SCARL.004_TITLE: "Оставшиеся"
 SCARL.004_DESC: "Вы входите в зал совета и мгновенно ощущаете, как напряжение висит в воздухе. Остатки [GetTitleByKey('k_order_of_the_silver_hand').GetName], собравшиеся здесь, раскалываются прямо у вас на глазах.\n\nС одной стороны — рыцари в окровавлённых доспехах, их голоса полны ярости. #italic \"Мы должны очистить [GetTitleByKey('k_lordaeron').GetBaseNameNoTier]! Искоренить заражённых, выследить предателей — никакой пощады! Никаких колебаний! [ROOT.Char.GetFaith.HighGodName] требует этого!\"#!\n\nИм противостоит уставшая, но твёрдая группа, чья вера в [ROOT.Char.GetFaith.HighGodName] смягчена состраданием. #italic \"Невинные всё ещё страдают\"#! — возражают они, — #italic \"[ROOT.Char.GetFaith.HighGodName] не требует жестокости! Если мы их бросим, то станем не лучше монстров, с которыми сражаемся.\"#!\n\nРазделение очевидно.\nКаждый, кто здесь, должен сделать свой выбор."
 SCARL.004_OPT_A: "Свет должен быть защищён. Любой ценой."
 SCARL.004_OPT_B: "Мы не позволим Свету стать орудием тирании."
 SCARL.004_OPT_C: "Я стою за Светоносцем и его решимость."
 SCARL.004_OPT_C_tt: "Оставайтесь верны Свету.\n$BULLET$ Вы формируете Альянс с [GetTitleByKey('k_order_of_the_silver_hand').GetName]."
  
 scarlet_uprising: "Багровые фанатики"
 argent_uprising: "Аргентские полки"
  
 SCARL.0045_TITLE: "Последний оплот [GetTitleByKey('k_order_of_the_silver_hand').GetName]"
 SCARL.0045_DESC: "Заключив союз с тем, что осталось от некогда могучего королевства [GetTitleByKey('k_lordaeron').GetBaseNameNoTier], мы приняли на себя ответственность защищать последние осколки [GetTitleByKey('k_lordaeron').GetBaseNameNoTierNoTooltip].\n\nХотя некоторые отвергли наш призыв к единству и сформировали собственные фракции в борьбе против Короля-лича, мы будем стоять твёрдо... Возможно, мы ещё сможем собрать достаточно сил, чтобы вернуть наш возлюбленный дом!"
 SCARL.0045_OPT_A: "Мы восстанем вновь — или падём напрасно!"
  
 SCARL.006_TITLE: "Пламя Оставшихся"
 SCARL.006_DESC: "Мы больше не стоим в одиночестве против Плети. Соседние #italic лорды #!трусливо прячутся за стенами, отказываясь присоединиться к братьям в нашей святой борьбе.\n\nНаши лидеры, охваченные рвением и жаждой возмездия, объединены единой целью. Мы собрали чистых сердцем и создали постоянный #bold Крестовый поход #! против Плети и всех, кто осмелится встать на пути нашей святой миссии.\n\n[scarlet_leader.GetName] избран вести нас к победе! [GetTitleByKey('k_lordaeron').GetName] возродится вновь, когда Плеть и её мертвецы будут обращены в пепел очищающим пламенем Света!"
 SCARL.006_OPT_A: "Спасители явились!"
  
 SCARL.007_TITLE: "Гнев Алого Похода"
 SCARL.007_DESC: "Сколько ещё наших братьев должно пасть, прежде чем Плеть будет искоренена?\n\nКак долго мы будем цепляться за увядающие воспоминания о мире, скованные страхом и нерешительностью?\n\nМы сами должны взять судьбу в свои руки. Мы должны ударить в самое сердце скверны. Мы должны маршировать в ледяную тьму Нордскола и принести праведный суд самому [GetTrait('lich_king').GetName(GetNullCharacter)]!"
 SCARL.007_OPT_A: "Разошлите призыв добровольцам..."
 SCARL.007_OPT_A_tt: "Вы отправляете послание, призывающее верных."
  
 SCARL.008_TITLE: "Я ХОЧУ ТЕБЯ в Алой армии"
 SCARL.008_DESC: "Всем воинам, преданным Алому делу,\nКак продвигается очищение [GetTitleByKey('k_lordaeron').GetName] от Плети? Плохо, полагаю.\nОни бесчисленны, беспощадны и постоянно восстают вновь. Единственная надежда человечества — уничтожить архитектора этой нечестивой заразы, [GetTrait('lich_king').GetName(GetNullCharacter)]!\nПрисоединяйтесь ко мне. Встаньте рядом со мной и маршируйте в мою экспедицию в $world_northrend$!"
 SCARL.008_OPT_A: "Это безумие!"
 SCARL.008_OPT_B: "Ты прав. Это единственный выход."
  
 SCARL.009_TITLE: "Глупая затея"
 SCARL.009_DESC: "К [scarlet_onslaught_leader.GetName],\nВы должно быть безумец.\nИдти на север, где процветает лишь Плеть? Где даже Свет не даст ни тепла, ни надежды?\nЯ желаю вам удачи в вашей #italic \"смелой экспедиции\"#! и надеюсь, Свет всё же благословит вас за вашу отвагу.\nНе беспокойте нас снова."
 SCARL.009_OPT_A: "Трус!"
  
 SCARL.010_TITLE: "Доблестный воин"
 SCARL.010_DESC: "К [scarlet_onslaught_leader.GetName],\nВы выразили мою мысль! Столкновения по всей территории [GetTitleByKey('k_lordaeron').GetName] до сих пор не дали почти никакого результата.\nЯ и мои люди размышляли о бегстве из королевства, но теперь нам стыдно за такие слабые мысли.\nМы искупим сам факт, что допустили такую слабость. Мы присоединимся к вашей экспедиции, вашей святой миссии, и сокрушим Плеть раз и навсегда объединёнными силами!"
 SCARL.010_OPT_A: "Превосходно..."
  
 SCARL.011_TITLE: "Начало конца"
 SCARL.011_DESC: "Мы наконец высадились в [GetTitleByKey('c_moaki').GetName], на расстоянии удара от цитадели [GetTrait('lich_king').GetName(GetNullCharacter)].\n\nОтсюда мы сможем наносить удары по Плети и, с благословением [ROOT.Char.GetFaith.HighGodName], одержать победу в этой Святой войне.\n\nНо сперва нам предстоит очистить наш лагерь от этих... #italic животных#!... что окружают наш будущий оплот."
 SCARL.011_OPT_A: "Это станет нашей новой базой командования."
  
 scarlet_onslaught_troops: "Алая Армада"
  
 SCARL.012_TITLE: "Начало конца"
 SCARL.012_DESC: "С благословением [ROOT.Char.GetFaith.HighGodName] [GetTitleByKey('c_moaki').GetName] наконец освобождена от бесчеловечной скверны, разъедавшей это место. Мы очистим Плеть с лица Азерота так же!\n\nСледует ли нам расширять базу, укреплять свои позиции и расти в силе? Или же у нас достаточно войск, чтобы маршировать прямо к самому [GetTrait('lich_king').GetName(GetNullCharacter)]?"
 SCARL.012_OPT_A: "Конец [GetTrait('lich_king').GetName(GetNullCharacter)] близок!"
  
 SCARL.013_TITLE: "Наша гордость — наш Хартглен"
 SCARL.013_DESC: "Те, в чьих сердцах горит [ROOT.Char.GetFaith.HighGodName], больше не чувствуют холода и тьмы $world_northrend$. Мы возвели новый $c_hearthglen$, далеко от нашего старого дома. Он дарует нам гордость, он дарует нам радость, он дарует нам тепло.\n\nС нашим Маяком Света за спиной мы будем ведомы против Плети и еретиков! Чистые [GetTrait('creature_human').GetName(GetNullCharacter)]и, заблудшие в морозе, вернутся к нам по воле [ROOT.Char.GetFaith.HighGodName]!"
 SCARL.013_OPT_A: "Возможно, мы даже превзойдём тех, кто остался в Лордероне..."
