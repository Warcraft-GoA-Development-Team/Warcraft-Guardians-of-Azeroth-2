l_russian:
  
 arathor_restoration.0100.t: "Мечта человечества сбылась"
 arathor_restoration.0100.desc: "Это благословенный день, ибо сегодня Империя Аратор осознаёт свой древний потенциал.\n\nСо всех уголков империи слышны крики ликования и гордости.\n\nНо теперь я должен направить паруса этого огромного предприятия. Что мы сделаем из этого Аратора? Среди моих многочисленных предшественников и бесчисленных воплощений аратейской власти выбор сужается."
 arathor_restoration.0100.a: "Теперь я войду в историю как легенда..."
 arathor_restoration.0100.b: "Полумер не будет."
  
 arathor_restoration.0101.t: "Вторая эпоха Аратора"
 arathor_restoration.0101.desc: "Из имперской столицы [arathor_hegemon.GetCapitalLocation.GetBaronyNameExplicitly] рукой [arathor_hegemon.GetName] обнародована декларация. Далёкие земли, некогда принадлежавшие древним арати, вновь объединены [arathor_hegemon.GetCulture.GetCollectiveNoun], и амбиции их столь же грандиозны, как у Правителей былых времён.\n\nГрозная сила отбрасывает свою тень на Азерот, обещая будущее, в котором мощь и стойкость её соседей будут испытаны как никогда прежде."
 arathor_restoration.0101.a: "[ROOT.Char.GetFaith.HighGodName], помоги нам всем..."
