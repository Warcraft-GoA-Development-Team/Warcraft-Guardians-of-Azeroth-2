l_english:
 
 demon_hunter_0001_title:1 "A Destiny of Flame"
 demon_hunter_0001_desc:0 "This may be a drastic decision I have taken, but I see no other choice.\n\nI take a deep breath while walking to our prisons at night. I could already smell the foul and evil nature of the [GetTrait('being_demon').GetName(GetNullCharacter)] which can only make one frown.\n\nAnd there lies a violent and mana-ridden and pathetic [first_demon_prey.GetName].\n#XB "Ha... Here to finish me off? Ignorant fool! Our kind never passes away like you weaklings... and I will be back to have vengeance! Your loved ones and your nation, all will face the wrath of the Burning Legion!"#!, [first_demon_prey.GetName] says.\n\nIt comforts me knowing that what I am about to do is nothing short of huge service to my kind. I hold [first_demon_prey.GetName] by its face in one hand as it struggles in its chains and with my blade I strike at the neck to sever [first_demon_prey.GetName]'s head and the struggling stops.\n\nI drink the blood that drips from the lifeless head. I already feel the powers of the [GetTrait('being_demon').GetName(GetNullCharacter)] flowing through me."
 demon_hunter_0001_A:0 "...and then, I carve into its heart"

 demon_hunter_0002_title:1 "A Destiny of Flame"
 demon_hunter_0002_desc:0 "As the still beating heart of the [GetTrait('being_demon').GetName(GetNullCharacter)] still thumps in my hands, I had learnt that they pass away from whence they came... only to return to our worlds at will...\n\nBut I #italic know #!that they cannot come back if they never return to their world.\nI grab the heart and consume it with its filthy smell and energy and all, binding [first_demon_prey.GetName] to my soul. By the time I finish consuming it, I not only feel the dark energies inside me but also my surroundings suddenly change...\n\nNo... this is a vision or a past?... my eyes burn trying to grasp what I see... I see numerous [GetTrait('being_demon').GetName(GetNullCharacter)]s marching onto countless worlds like ours and destroying them through sheer force and sometimes even from within...\n\nSo much bloodshed, kind worlds slain and only flames that remain... the pain is resonates within my soul... I wish for them to stop but they keep going and going and going...\nIn my most desperate urge to stop them, my arms move on their own to stop the pain and the visions, I rip my own eyes out."
 demon_hunter_0002_A:0 "...and it all goes dark"

 demon_hunter_0003_title:1 "A Destiny of Flame"
 demon_hunter_0003_desc:0 "As I awake from my slumber, the vile visions and dreams have passed away.\n\nMy vision is now all darkened yet I can still see those around me clearly and their silhouette visible like forces of nature itself dancing around. Something tells me this [GetTrait('spectral_vision').GetName(GetNullCharacter)] will allow me to easily tell apart others from the [GetTrait('being_demon').GetName(GetNullCharacter)]s."
 demon_hunter_0003_A:0 "...and so the hunt begins!"

 demon_hunter_0004_title:1 "A Destiny of Sorrow"
 demon_hunter_0004_desc:0 "#XB "...fool, Fool... FOOL"#! , I hear as I am suddenly pulled back into the plane of visions that haunted me before and a familiar voice.\n\n#XB "Did you really think you could escape my wrath? Did you think stopping me from attaining a physical form of my own could end me? A weakling like you?"#! , I hear once again the voice [first_demon_prey.GetName]. As I turn back to look at [first_demon_prey.GetName], it appears in a much larger form than I remember.\n\nI suddenly cannot move to defend myself. [first_demon_prey.GetName] moves its a hand under my chin to make me look directly in its eyes.\n\n#XB "Now... you will learn of our wrath!"#! , [first_demon_prey.GetName] smirks and suddenly all my surroundings return to normal while a sharp pain hinges itself right through my head..."
 demon_hunter_0004_A:0 "Damn you [first_demon_prey.GetName]"

 demon_hunter_0005_title:1 "A Destiny of Sorrow"
 demon_hunter_0005_desc:0 "Once again I am pulled into that vile place flames. I expect [first_demon_prey.GetName] to already show up and waste my time.\n\nI feel a surge of power within. Strength even greater then when I first absorbed the powers of [first_demon_prey.GetName].\n\nI feel [first_demon_prey.GetName]'s hands on my shoulders but I am not revolted by its presence like before... "What are you scheming, [first_demon_prey.GetName]?", I ask.\n#XB "Power is what you wished for when you killed me, was it? Here you have it..."#! , I can hear the smirk.\n\n"You truly take me for a fool you beast. What do you for wish in return? I know you have something in mind.", I retort.\nIt pulls its hands away and look back at [first_demon_prey.GetName].\n #XB "I have thought about it... You have freed me [newborn_demon_hunter.GetName]. I have fallen out of the grasp and wrath of the Dark Titan. I had never tasted such freedom before. No backstabbing by my own kind and neither the fear of losing to yours... You indeed are worthy of my powers and the knowledge of my kind's weaknesses, [newborn_demon_hunter.GetName]."#! \n\nI frown, "That doesn't answer the question, [GetTrait('being_demon').GetName(GetNullCharacter)]."\nIt takes an indifferent demeanour and points a finger at me, almost stabbing my eyes and says, #XB "You... are worthy for now. You can use my powers. But if I see any moment of weakness then be sure of it, I won't fail to grasp it. I have nothing to hide."#! \n\nI get thrown back to where I was."
 demon_hunter_0005_A:0 "This is just the beginning, I see..."
 demon_hunter_0005_A_tt:0 "$BULLET$ #help You get access to a decision which allows you to attain the [GetTrait('metamorphosis').GetName(GetNullCharacter)] form.#!"

 demon_hunter_0006_title:1 "A Destiny of Sorrow"
 demon_hunter_0006_desc:0 "WIP"
 demon_hunter_0006_A:0 "I will be cautious"
 demon_hunter_0006_B:0 "I can tolerate it..."
 
