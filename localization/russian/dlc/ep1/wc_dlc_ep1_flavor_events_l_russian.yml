l_russian:
  
  # Martial Exercise 
  
 ep1_flavor.2000.caster: ""Заклинателям предстоит проверить свою собранность и интеллект в спарринге друг с другом.""
 ep1_flavor.2000.massive_infantry: ""Наши стойкие гиганты будут тренировать свою силу и мужество.""
 ep1_flavor.2000.light_aerial: ""Они устроят гонки в небе.""
 ep1_flavor.2000.massive_aerial: ""Обучение поможет маневрировать в небе.""
  
 ep1_flavor.2000.desc_caster: ""Заклинатели - универсальные бойцы, их тренировки позволят нам всегда быть начеку.""
 ep1_flavor.2000.desc_massive_infantry: ""Мышцы наших сухопутных войск должны быть готовы ко всему, что может произойти.""
 ep1_flavor.2000.desc_light_aerial: ""Контроль над каждым аспектом поля боя очень важен, эти всадники помогут нам сохранить контроль над небом.""
 ep1_flavor.2000.desc_massive_aerial: ""Смерть свыше должна быть гарантирована нашим врагам; те, кто ее обеспечивает, должны быть еще более бдительными.""
  
 ep1_2000_caster_modifier: "Могущественные заклинатели"
 ep1_2000_caster_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_massive_infantry_modifier: "Неудержимые великаны"
 ep1_2000_massive_infantry_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_light_aerial_modifier: "Стремительные крылатые"
 ep1_2000_light_aerial_modifier_desc: "$ep1_2000_generic_modifier_desc$"
 ep1_2000_massive_aerial_modifier: "Ненасытные чудовища"
 ep1_2000_massive_aerial_modifier_desc: "$ep1_2000_generic_modifier_desc$"
  
  # Interservice Rivalry 
 ep1_flavor.2020.desc_knight_1_caster: ""... это всё, чародей? Ну, для моего следующего фокуса, я заставлю тебя #EMP исчезнуть#!!""
 ep1_flavor.2020.desc_knight_1_massive_infantry: ""... гора мышц, но нет мозгов, да? В любом случае, я #EMP уменьшу тебя в размере#!!"
 ep1_flavor.2020.desc_knight_1_light_aerial: ""... лучше улетай прочь, у тебя #EMP нет шансов#!!"
 ep1_flavor.2020.desc_knight_1_massive_aerial: ""... чем они больше, тем тяжелее им падать, особенно с #EMP такой высоты#!!"
  
 ep1_flavor.2020.desc_knight_2_caster: ""Ха! Как смешно это звучит от шута в тряпье. Иди пей свои маленькие зелья!""
 ep1_flavor.2020.desc_knight_2_massive_infantry: ""Если бы вы были нормального размера, вы бы не бегали с такой губой.""
 ep1_flavor.2020.desc_knight_2_light_aerial: ""Ба! У тебя голова в облаках или в другом месте, если быть честным!""
 ep1_flavor.2020.desc_knight_2_massive_aerial: ""Я не слышу тебя с высоты! Смотри мне в глаза, когда говоришь это!""
  
 ep1_flavor_2020_caster_modifier: "$ep1_flavor_2020_generic_modifier$"
 ep1_flavor_2020_massive_infantry_modifier: "$ep1_flavor_2020_generic_modifier$"
 ep1_flavor_2020_light_aerial_modifier: "$ep1_flavor_2020_generic_modifier$"
 ep1_flavor_2020_massive_aerial_modifier: "$ep1_flavor_2020_generic_modifier$"
