 wc_stopping_arcane_studies_modifier: "Прекращение тайных исследований"
 wc_stopping_arcane_studies_modifier_desc: "Исследования этого персонажа в области тайной магии вызвали слишком много потрясений, поэтому ему пришлось прекратить занятия."

 arcane_magic_lifestyle_events.1011.a_tt: "Вам удаётся прочесть часть книги."
 arcane_magic_lifestyle_events.1011.b_good: "Вы узнаёте много нового из книги."
 arcane_magic_lifestyle_events.1011.b_bad: "Схемы лишь ещё больше вас запутывают."
 wc_enchanted_diagrams_modifier: "Зачарованные схемы"
 wc_enchanted_diagrams_modifier_desc: "Этот персонаж изучил зачарованные тайные схемы, чтобы усилить свои заклинания.\nПерезарядка [wc_spells|E] [wc_spell_school_order|E]: @wc_spell_icon! #P -10%#!"
 arcane_magic_lifestyle_events.1011.opt.c_tt: "Вы продаёте книгу."

 arcane_magic_lifestyle_events.1021.toast.convince_success: "Вам удаётся убедить тайного мага в своей правоте."
 arcane_magic_lifestyle_events.1021.toast.convince_failure: "Вам не удаётся убедить тайного мага в своей правоте."
 arcane_magic_lifestyle_events.1021.toast.convince_success.tooltip: "Вы получаете #V 1#! [perk|E] пироманта или криоманта [wc_order_magic_lifestyle|E]."
 wc_antipodean_magic_supremacy_modifier: "Превосходство антиподной магии"
 wc_antipodean_magic_supremacy_modifier_desc: "Этот персонаж продемонстрировал предпочтение антиподной магии, повысив эффективность соответствующих заклинаний.\nСтоимость [wc_mana|E] @wc_full_mana_icon! заклинаний криомантии: #p -15%#!\nСтоимость [wc_mana|E] @wc_full_mana_icon! заклинаний пиромантии: #p -15%#!\nВремя сотворения заклинаний криомантии: #p -5%#!\nВремя сотворения заклинаний пиромантии: #p -5%#!"
 arcane_magic_lifestyle_events.1021.toast_b.convince_success: "Вам удаётся убедить антиподного мага в своей правоте."
 arcane_magic_lifestyle_events.1021.toast_b.convince_failure: "Вам не удаётся убедить антиподного мага в своей правоте."
 arcane_magic_lifestyle_events.1021.toast_b.convince_success.tooltip: "Вы получаете #V 1#! [perk|E] [wc_order_magic_lifestyle|E], не связанный с пиромантией или криомантией."
 wc_arcane_magic_supremacy_modifier: "Превосходство тайной магии"
 wc_arcane_magic_supremacy_modifier_desc: "Этот персонаж продемонстрировал предпочтение чистой тайной магии, повысив эффективность соответствующих заклинаний.\nСтоимость [wc_mana|E] @wc_full_mana_icon! заклинаний магии Порядка, не относящихся к антиподной: #p -15%#!\nВремя сотворения заклинаний магии Порядка, не относящихся к антиподной: #p -5%#!"
 wc_mediator_modifier: "Посредник"
 wc_mediator_modifier_desc: "Этот персонаж умеет улаживать споры."
 arcane_magic_lifestyle_events.1021.toast.convince_both_failure: "Вам не удаётся убедить ни одного из магов в своей правоте."
 arcane_magic_lifestyle_events.1021.toast.convince_both_success: "Вам удаётся убедить обоих магов в своей правоте."

 arcane_magic_lifestyle_events.1041.desc_none: "Я должен действовать быстро, пока эта катастрофа не привлекла внимание кого-нибудь из могущественных существ, заявляющих, что «защищают» этот мир..."
 arcane_magic_lifestyle_events.1041.blue_dragonflight: "Я должен действовать быстро, пока эта катастрофа не привлекла внимание [dragonflight_leader.GetName]..."
 arcane_magic_lifestyle_events.1041.d_tt: "Вы используете разлом, чтобы заманить силы [dragonflight_leader.GetShortUINamePossessive] и попытаться поработить их."
 enslaved_dragon_troops: "Порабощённые драконьи войска"
 arcane_magic_lifestyle_events.1041.d_win: "Вам удаётся поработить драконьи силы [dragonflight_leader.GetShortUINamePossessive]."
 arcane_magic_lifestyle_events.1041.d_lose: "Вам не удаётся поработить драконьи силы [dragonflight_leader.GetShortUINamePossessive]."

 magic_lifestyle.1000.title: "Безутешная вдова"
 magic_lifestyle.1000.desc: "«Грусть тяжёлым грузом легла мне на сердце, [ROOT.Char.GetTitleAsNameNoTooltip]», — плачет [despondent_widow.GetName]. «Моя любовь, [husband.GetName], ушёл, и я перепробовала всё, чтобы залечить свою боль, но ничего не помогает».\n\n«Прошу, я знаю, что вы могущественны и [ROOT.Char.Custom('ComplimentAdjective')]. Неужели вы знаете совет или средство от моей печали?» — умоляет [despondent_widow.GetNameNoTooltip]."
 magic_lifestyle.1000.option_order: "Быть может, я создам образ [husband.GetHerHim]."
 magic_lifestyle.1000.success_order: "Созданный образ [husband.GetName] приносит утешение [despondent_widow.GetName]."
 magic_lifestyle.1000.failure_order: "Созданный образ [husband.GetName] не утешает [despondent_widow.GetName]."
 magic_lifestyle.1000.option_death: "А если на время оживить тело [husband.GetHerHis]?"
 magic_lifestyle.1000.success_death: "Оживлённое тело [husband.GetName] ненадолго утешает [despondent_widow.GetName]."
 magic_lifestyle.1000.failure_death: "Попытка оживить тело [husband.GetHerHis] не утешает [despondent_widow.GetName]."
 magic_lifestyle.1000.option_disorder: "Возможно, вы найдёте следы [husband.GetHerHis] в Круговерти Пустоты."
 magic_lifestyle.1000.success_disorder: "[despondent_widow.GetNamePossessive] путешествие в Круговерть Пустоты приносит результаты."
 magic_lifestyle.1000.failure_disorder: "[despondent_widow.GetNamePossessive] попытка найти [husband.GetName] в Круговерти Пустоты оказывается безуспешной."
 magic_lifestyle.1000.option_life: "[husband.GetSheHe|U] ушёл, но вы продолжите жить."
 magic_lifestyle.1000.success_life: "Благословение магии Природы возвращает [despondent_widow.GetName] жизненные силы."
 magic_lifestyle.1000.failure_life: "Благословение магии Природы не возвращает [despondent_widow.GetName] жизненных сил."
 magic_lifestyle.1000.option_seance: "Давайте проведём сеанс."
 magic_lifestyle.1000.success_seance: "Сеанс успешно связывает вас с духом [husband.GetName]."
 magic_lifestyle.1000.failure_seance: "Сеансу не удаётся связаться с духом [husband.GetName]."
 magic_lifestyle.1000.option_seduce: "Быть может, я помогу вам... забыться."
 magic_lifestyle.1000.success_seduce: "[despondent_widow.GetName] ненадолго отвлекается."
 magic_lifestyle.1000.failure_seduce: "Ваша попытка соблазнить [despondent_widow.GetName] проваливается."
 magic_lifestyle.1000.option_refuse: "Убирайся, [despondent_widow.Custom('InsultNoun')]!"

 wc_despondent_widow_unsatisfied: "Недовольная вдова"
 wc_despondent_widow_unsatisfied_desc: "Этот персонаж пытался помочь скорбящей вдове, но не оправдал её ожиданий."
 wc_despondent_widow_cursed_you: "Проклятие вдовы"
 wc_despondent_widow_cursed_you_desc: "Эта вдова прокляла персонажа за неспособность ей помочь.\nСтоимость всех [wc_spells|E] @wc_full_mana_icon! [wc_mana|E]: #N +10%#!"
 wc_corpse_practice_modifier: "Практика работы с трупами"
 wc_corpse_practice_modifier_desc: "Этот персонаж эффективно овладел искусством управления трупами.\nСтоимость [wc_spells|E] [wc_spell_school_death|E] @wc_full_mana_icon! [wc_mana|E]: #P -10%#!\nВремя сотворения [wc_spell_raise_dead|E] @wc_spell_icon!: #P -25%#"
 wc_widow_life_modifier: "Благословение жизни"
 wc_widow_life_modifier_desc: "Этот персонаж получил благословение жизненной магии, повышающее плодовитость и привлекательность."

