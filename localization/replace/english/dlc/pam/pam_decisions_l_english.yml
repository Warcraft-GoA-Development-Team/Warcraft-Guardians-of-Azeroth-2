 pam_decision_last_rites_desc: "#EMP Have mercy on me, O [ROOT.Char.GetFaith.HighGodName]! Wash me thoroughly from my iniquity, and cleanse me from my sin.#!\n\nWith my imminent departure from this carnal existence, I hope to set my soul in order. Armored from infernal influence, I may then find a good death and eternal life, housed in the Kingdom of Heaven."
 pam_decision_events.0005.no_last_rites_warning: "@warning_icon! #X If you do not Receive Last Rites:\n$BULLET_WITH_TAB$You lose [legitimacy_i][EmptyScope.ScriptValue('massive_legitimacy_gain')]\n$BULLET_WITH_TAB$$every_zealot_vassal$:\n$TAB$$BULLET_WITH_TAB$Loses #N 30#! [opinion|E] of #V you#! #!"
 pam_decision_events.0005.details: "You will have opportunities to [lease|E] [titles|E], or if you have no available ones, donate [gold|E] to [monastic_holy_orders|E], [holy_orders|E] or [the_christian_church|E] - this will provide beneficial [modifiers|E] for your [player_heir|E]"
 pam_decision_events.0005.desc.bad: "I have struggled to honor [ROOT.Char.GetFaith.HighGodName], and in my arrogance have tried to hide my sin from his all-seeing eyes.\n\n"
 pam_decision_events.0005.desc.good: "Mercifully, I feel as though angels are close at hand, guarding my soul from the demons who would hope to claim it.\n\n"
 pam_decision_events.0005.desc.neutral: "Though I have sought to honor [ROOT.Char.GetFaith.HighGodName], as I approach the threshold of eternity, I worry if my soul will be judged fit for his Kingdom of Heaven?\n\n"
 
 pam_decision_events.0005.desc.outro: "My confessor, [Glossary('sacramentary','SACRAMENTARY_GLOSS')] in hand, advises me to, "Face [ROOT.Char.GetFaith.HighGodName] without deception!"\n\nEven King David, robed in sin, was made clean after his confession...[Glossary('$pam_psalm_51_english|q$','PSALM_51_5_GLOSS')]"
 pam_decision_events.0005.b: "The Devil take me! Rid me of this priest."
 pam_psalm_51_english: ""Against you...have I sinned and done what is evil...you are justified in your sentence and blameless when you pass judgment."
 SACRAMENTARY_GLOSS: "Sacramentary or #EMP liturgikon#! were books used in liturgical services by a Christian bishop or priest. Depending on the era and region, they could contain texts to be spoken or sung, along with those for the sacraments."
 pam_decision_events.0006.t: "Last Rites: My Sin is Ever Before Me" 
 pam_decision_events.0006.intro: ""To err is human. But without confession, there can be no absolution," says [confessor.GetTitledFirstName]."
 #pam_decision_events.0006.intro.purgatory: "Though I shrink from light shone now on my wrongdoings, this short discomfort is better than an eternity trapped in cleansing fire."
 pam_decision_events.0006.desc.bad: "\n\nMy sins have been great and frequent. My soul weighs heavy, grasped in the searing fingers of Satan, intent to take which is so clearly his.\n\n"
 pam_decision_events.0006.desc.good: "\n\nMy heart is light as my actions have been in keeping with the Lord's will.\n\n"
 pam_decision_events.0006.desc.neutral: "\n\nI am but a [ROOT.Char.GetWomanMan], and sin has found me despite my best intentions.\n\n"
 pam_decision_events.0006.desc.my_sinful_trait_sin: "How often have I been led astray by my [my_sinful_trait.GetName(soon_dead)] nature!"
 pam_decision_events.0006.desc.secret_sin: "I have harbored in a port of darkness my being a [my_secret.GetName]."
 pam_decision_events.0006.desc.my_criminal_trait_sin: "Perhaps worst of all, I am a [my_criminal_trait.GetName(soon_dead)]! My suffocating guilt chokes every breath."

 pam_decision_events.0006.desc.sin_default: "My sins, though assuredly many, are hard to call to mind. I am sure they will flow as if an ocean overrunning a dike, once I speak to [confessor.GetTitledFirstNameNoTooltip]."
 pam_decision_events.0006.desc.sin_default_good_sp: "May [ROOT.Char.GetFaith.HighGodName] crush my bones and blot out iniquity."
 pam_decision_events.0006.desc.outro: "I must lay bare my sins with proper contrition, or be denied the Eucharist."
  
 pam_decision_events.0007.t: "Last Rites: Flesh, Blood and Oil"
 pam_decision_events.0007.intro: "So has passed the accounting of my sins. It is one thing to owe but a farthing, and another ten thousand talents.\n\nMy confessor presents the consecrated bread and wine."
 pam_decision_events.0007.desc.bad: "Even now as the flesh and blood of my Lord are presented I hear the whispers of imps begging me to give over my soul, so I may live on and indulge in worldly pleasures.\n\n"
 pam_decision_events.0007.desc.good: "Having unburdened myself, I leap to the embrace of death. I long to consume the flesh and blood of my Lord, who I shall soon be beside.\n\n"
 pam_decision_events.0007.desc.neutral: "May the Lord's flesh and blood guard me against the demons who lurk like wolves, here to take me before my appointed time.\n\n"
 pam_decision_events.0007.desc.oil.intro: "[confessor.GetSheHe|U] then anoints my forehead, hands and feet with holy oil."
 pam_decision_events.0007.desc.oil.bad: "My soul remains troubled.\n\n"
 pam_decision_events.0007.desc.oil.good: "My soul beams with the Lord's love.\n\n"
 pam_decision_events.0007.desc.oil.neutral: "My soul feels guarded for its journey.\n\n"
 pam_decision_events.0007.desc.outro: "The [Glossary('viaticum','VIATICUM_GLOSS')] and [Glossary('unction','UNCTION_GLOSS')] complete, I can plan for who will pray for me."
 VIATICUM_GLOSS: "Latin for "provision for a journey". Viaticum is the name for the sacrament of communion, or Eucharist in the context of one's last rites. The journey in question is one's passage into the eternal afterlife."
 UNCTION_GLOSS: "Extreme Unction, is the term for anointing of the sick with holy oil, when done 'in extremis' or near death. It is done to prepare one for the eternal afterlife."
 pam_decision_events.0007.a: "May the [monastic_order.GetName] pray for me."
 pam_decision_events.0007.b: "I would bolster the [military_order.GetName]."
 pam_decision_events.0007.c: "[religious_head.GetTitledFirstNameNoTooltip] may have my wealth, and I [religious_head.GetHerHis] prayers."
 pam_decision_events.0007.d: "A pious word to [confessor.GetTitledFirstNameNoTooltip] is enough."
