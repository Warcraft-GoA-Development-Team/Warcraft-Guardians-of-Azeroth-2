l_english:
  wc_greymane_wall_events.0001.t: "The Future of Gilneas"
  wc_greymane_wall_events.0001.desc: ""You want to do what, again?" [GetTitleByKey('k_gilneas').GetHolder.GetCouncillor('councillor_chancellor').GetDynastyHouseName] glared at me through ice-cube thick spectacles. The implications of what he had just heard were indeed heavy. It was fitting for us to be in the war room.\n"You heard me, [GetTitleByKey('k_gilneas').GetHolder.GetCouncillor('councillor_chancellor').GetDynastyHouseNameNoTooltip]."\n"You want to wall off our entire nation? Close our borders and end trade with the rest of the Alliance? I… it is a rather large decision, would you not say?""
  wc_greymane_wall_events.0001.a: "[GetTitleByKey('e_lordaeron').GetHolder.GetFirstNameNoTooltip] wants more of our gold. Perhaps more of our blood. Nay, I say."
  wc_greymane_wall_events.0001.b: "Perhaps it's best to think it over some more."

  wc_greymane_wall_events.0002.t: "Picking A Location"
  wc_greymane_wall_events.0002.desc: ""The wall will have to cut through a noble’s land. You must see that. None of our natural borders will do. They are all rather pliable."\n"Of course I do, man! Whoever it is will be compensated, and so will the farmers and citizens of his domain."\n"On this map it seems you are suggesting the possibility of [GetTitleByKey('c_western_strand').GetHolder.GetLadyLord|U] [GetTitleByKey('c_western_strand').GetHolder.GetDynastyHouseName]’s realm…. But look at the terrain, my liege…. We have this mountainous region right here. What a grand hold that would make, with mountains on either side that would create a secure natural barrier."\n"What you say is true."\n"Of course, to attain it, we’d have to cut off some of [GetTitleByKey('d_crowvale').GetHolder.GetLadyLord|U] [GetTitleByKey('d_crowvale').GetHolder.GetDynastyHouseName]’s lands. Cut off [GetTitleByKey('c_pyrewood').GetNameNoTierNoTooltip] and [GetTitleByKey('c_ambermill').GetNameNoTierNoTooltip].""
  wc_greymane_wall_events.0002.a: ""[GetTitleByKey('d_crowvale').GetHolder.GetDynastyHouseNameNoTooltip] is powerful. It's best to stick with [GetTitleByKey('c_western_strand').GetHolder.GetLadyLord|U] [GetTitleByKey('c_western_strand').GetHolder.GetDynastyHouseNameNoTooltip].""
  wc_greymane_wall_events.0002.b: ""I concede to your logic. [GetTitleByKey('d_crowvale').GetHolder.GetLadyLord|U] [GetTitleByKey('d_crowvale').GetHolder.GetDynastyHouseNameNoTooltip]… [GetTitleByKey('d_crowvale').GetHolder.GetFirstNameNoTooltip] will have to understand.""

  wc_greymane_wall_events.0003.t: "[GetTitleByKey('c_western_strand').GetHolder.GetLadyLord|U] [GetTitleByKey('c_western_strand').GetHolder.GetDynastyHouseNameNoTooltip] Makes His Case"
  wc_greymane_wall_events.0003.desc: ""My [ROOT.Char.GetLadyLord|U], surely the wall can be placed in a better spot? It would be quite a hit to your own treasury if you were to build it all along the north.""
  wc_greymane_wall_events.0003.a: ""The wall shall be built along the northern border of [GetTitleByKey('k_gilneas').GetNameNoTierNoTooltip]""
  wc_greymane_wall_events.0003.b: ""It would be better to place it in [GetTitleByKey('d_crowvale').GetHolder.GetLadyLord|U] [GetTitleByKey('d_crowvale').GetHolder.GetDynastyHouseNameNoTooltip]'s territory""

  wc_greymane_wall_events.0004.t: "Greymane Wall"
  wc_greymane_wall_events.0004.desc: ""My [ROOT.Char.GetLadyLord|U], this is truly a splendid wall you've built to protect our people.""
  wc_greymane_wall_events.0004.a: "The wall is complete"

  wc_greymane_wall_events.0010.t: "[GetTitleByKey('d_crowvale').GetHolder.GetLadyLord|U] [GetTitleByKey('d_crowvale').GetHolder.GetDynastyHouseNameNoTooltip] Makes His Case"
  wc_greymane_wall_events.0010.desc: ""By building a wall you are betraying not only our allies but your own people! You're going down a dangerous road stuck in the past.""
  wc_greymane_wall_events.0010.a: ""The wall is the only way forward.""
  wc_greymane_wall_events.0010.b: ""Fine. I will reconsider building the wall for now.""

  wc_greymane_wall_events.0011.desc: ""Building [GetBuilding('greymane_wall_02').GetName] has been an act of Tyranny. I will do what is best for [GetTitleByKey('k_gilneas').GetNameNoTierNoTooltip].""
  wc_greymane_wall_events.0011.a: "I tried to be reasonable."
  wc_greymane_wall_events.0011.b: ""You're right. [GetTitleByKey('k_gilneas').GetHolder.GetCouncillor('councillor_chancellor').GetLadyLord|U] [GetTitleByKey('k_gilneas').GetHolder.GetCouncillor('councillor_chancellor').GetDynastyHouseNameNoTooltip], tear down this wall!""

  wc_greymane_wall_events.0102.desc: ""The wall will have to cut through your land. You must see that. None of our natural borders will do. They are all rather pliable."\n"Of course I do, man! The farmers and citizens of my domain will be compensated."\n"On this map it seems you are suggesting the possibility of the north…. But look at the terrain, my liege…. We have this mountainous region right here. What a grand hold that would make, with mountains on either side that would create a secure natural barrier."\n"What you say is true."\n"Of course, to attain it, we’d have to cut off [GetTitleByKey('c_pyrewood').GetNameNoTierNoTooltip] and [GetTitleByKey('c_ambermill').GetNameNoTierNoTooltip].""
  wc_greymane_wall_events.0102.a: ""I will not abandon my people. The wall will follow the northern border.""
  wc_greymane_wall_events.0102.b: ""I concede to your logic. The wall will cut off [GetTitleByKey('c_pyrewood').GetNameNoTierNoTooltip] and [GetTitleByKey('c_ambermill').GetNameNoTierNoTooltip]. ""
  wc_greymane_wall_events.0102.c: ""I need more time to think about this.""