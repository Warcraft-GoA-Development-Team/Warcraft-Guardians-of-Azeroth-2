 shathgral_religion_adherent:0 "Shath'gral"
 shathgral_religion_adherent_plural:0 "Shath'gral"
 shathgral_religion_desc:0 "A congregation of cults worshipping the [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )], parasitic, eldritch horrors spawned by the [Glossary( 'Void Lords', 'VOID_LORDS_GLOSS' )] to corrupt the cosmos. During the Ordering of Azeroth, the [Glossary( 'Titans', 'TITAN_GLOSS' )] imprisoned them deep beneath the earth to halt their corruption and allow the world to flourish. Their adherents are nihilistic, serving only the Void's endless hunger."

