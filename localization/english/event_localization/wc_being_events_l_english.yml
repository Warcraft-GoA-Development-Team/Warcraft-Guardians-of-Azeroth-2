l_english:
 WCBEI_10_TITLE:0 "Till Death Do Us Part"
 WCBEI_10_DESC_start:0 "They told me the news and I no longer knew what to do with myself. My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lost_character'))] [lost_character.GetFirstName] died but was brought back to our world by unholy magic.\n\n"
 WCBEI_10_DESC_start_caster:0 "They told me the news and I no longer knew what to do with myself. My [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lost_character'))] [lost_character.GetFirstName] died but was brought back to our world by unholy magic wielded by [raise_dead_caster.GetFirstName].\n\n"
 WCBEI_10_DESC_protect:0 "I'm sorry, [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('lost_character'))], I couldn't protect you."
 WCBEI_10_DESC_feel:0 "I cannot believe that I will never feel the warmth of [lost_character.GetHerHis] body again."
 WCBEI_10_DESC_child:0 "The adults didn't say much about what that means. Will I never see [lost_character.GetHerHim] again?"
 WCBEI_10_DESC_fate:0 "What a shame! It is difficult to imagine a fate worse than this."
 WCBEI_10_OPT_A:0 "A part of [lost_character.GetHerHim] is still alive."
 WCBEI_10_OPT_B:0 "This is not my [ROOT.Char.Custom2('RelationToMeShort', SCOPE.sC('lost_character'))] anymore."

 WCBEI_100_TITLE:0 "Twisting Nether"
 WCBEI_100_DESC:0 "I have lost my body in the mortal planes but my soul has found its way to the [Glossary( 'Twisting Nether', 'TWISTING_NETHER_GLOSS' )].\n\nThousands of twisted demonic souls, merging into a single stream, chasing grains of cosmic energy. Only the strongest may survive, the rest meet oblivion.\n\nI can join the stream, feeding on magic and regain my mortal shell or give up and dive into the [Glossary( 'Great Dark Beyond', 'GREAT_DARK_BEYOND_GLOSS' )]."

 WCBEI_100_OPT_A:0 "I will return!"
 WCBEI_100_OPT_B:0 "Finally I can rest..."

 WCBEI_110_DESC:0 "Time goes differently in the [Glossary( 'Twisting Nether', 'TWISTING_NETHER_GLOSS' )]. I have lost track of whether it has been decades or centuries.\n\nI have been wandering in the [Glossary( 'Great Dark Beyond', 'GREAT_DARK_BEYOND_GLOSS' )], lurking for magic and my way back to Azeroth. Finally, I have found it.\n\nBy sheer force of will, I materialize back in the mortal plane in my formal body."
 WCBEI_110_OPT_A:0 "I have returned!"

 WCBEI_3_TITLE:0 "A Light in the Darkness"
 WCBEI_3_DESC:0 "My body trembles as holy energy courses through me, illuminating my body with shining radiance.\n\nI did it! After all the trials and tribulations, I am now one with the light."
 WCBEI_3_OPT:0 "Amazing!"
 WCBEI_20_DESC:0 "News of my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lost_character'))], [lost_character.GetFirstName], have reached me. [lost_character.GetSheHe|U] has infused [lost_character.GetHerHis]self with holy energy, essentially becoming one with the light."
 
 WCBEI_20_DESC_feel:0 "Someone so close to me achieving such a profound transformation fills me with awe."
 WCBEI_20_DESC_bad:0 "Such a development has filled me with dread. I cannot stand the thought of [lost_character.GetFirstName] being consumed by this power!"
 WCBEI_20_OPT_A:0 "Interesting."
 WCBEI_20_OPT_A_PIOUS:0 "[ROOT.Char.GetFaith.HighGodName] be praised!"
 WCBEI_20_OPT_B:0 "[lost_character.GetFirstName] is lost to me."

 WCBEI_4_TITLE:0 "A Lord of Chaos"
 WCBEI_4_DESC:0 "Green liquid oozes from my veins, resembling the blood of a demon. My body convulses as my skin brightens and tightens into a demonic form.\n\nMy transformation is complete. The nether now has my eternal soul."
 WCBEI_21_DESC:0 "I hear news of a Demon arising. It is none other than my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lost_character'))], [lost_character.GetFirstName]. [lost_character.GetSheHe|U] has embraced the chaotic powers, transforming into a being of disorder."

 WCBEI_5_TITLE:0 "A Weapon of the Void"
 WCBEI_5_DESC:0 "Darkness envelops me, bleaching my skin an ashy dark. I can hear whispers, pulsing from thousands of unseen entities, guiding me into the void.\n\nMy transformation is complete. I am now one with the void."
 WCBEI_22_DESC:0 "I have heard the news regarding [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lost_character'))]. [lost_character.GetSheHe|U] is my [ROOT.Char.Custom2('RelationToMe', SCOPE.sC('lost_character'))], and has now become a being of the void."