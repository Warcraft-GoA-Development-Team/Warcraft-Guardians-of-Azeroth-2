l_english:
 #################################
 # Glossary
 #################################
 APOCALYPSE_RENILASH_GLOSS:0 "The Apocalypse, or Renilash in the ancient common tongue, prophesied by Mereldar, refers to the final conflict between the forces of good and evil. This event, seen as an ultimate judgment, will seal the world’s fate, bringing both destruction and renewal."
 WAR_DRAENEI_GLOSS:0 "The [war|E] against the [GetTrait('creature_draenei').GetName(GetNullCharacter)] was a catastrophic conflict instigated by Kil’jaeden and carried out by the [GetTrait('creature_orc').GetName(GetNullCharacter)] clans under [GetScriptedCharacterByHistoryID( '10014' ).GetFirstName]’s guidance. Deceived into believing the draenei were enemies of their survival, the orcs waged a brutal campaign, massacring countless innocents. This [war|E] marked the beginning of the orcs' descent into corruption and the eventual shattering of Draenor."
 NERZHUL_GLOSS:0 "[GetScriptedCharacterByHistoryID( '10014' ).GetFirstName], once the most revered shaman among the orcs and the mentor of [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName], was a spiritual leader who guided his people with wisdom. Deceived by Kil'jaeden, he initiated a bloody [war|E] against the [GetTrait('creature_draenei').GetName(GetNullCharacter)], leading to a catastrophic massacre. Upon realizing the demonic betrayal, [GetScriptedCharacterByHistoryID( '10014' ).GetFirstName] sought to defy the Legion, only to be dethroned and replaced by [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName], missing the Horde's grim descent into corruption. Now, [GetScriptedCharacterByHistoryID( '10014' ).GetFirstName] lives in exile, a shadow of his former self, left to dwell on the ashes of Draenor."
 HAND_OF_GULDAN_GLOSS:0 "The Hand of Gul'dan, formerly Mount Cyrukhar, is a colossal fel-tainted volcano in Draenor. Once dormant, [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] gathered his loyal followers at its base for a demonstration of unparalleled power. Using the Cipher of Damnation, he struck down Cyrukh the Firelord, awakening the volcano and unleashing a demonic eruption that scorched the land. This act severed the orcs’ bond with the elemental spirits, leaving Draenor to wither and die. The Hand of Gul'dan now stands as a scar upon the world."
 BLOOD_OF_MANNOROTH_GLOSS:0 "The Blood of Mannoroth, a vile substance, is the very essence of the pit lord [GetScriptedCharacterByHistoryID( 'mannoroth' ).GetFirstName]. When consumed, it grants immense strength and bloodlust but at a terrible cost: eternal servitude to the Burning Legion. It was this cursed blood that [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] used to corrupt the orcs, marking the beginning of their descent into darkness."
 OGRE_BLACKROCK_WAR_GLOSS:0 "The [GetTrait('creature_ogre').GetName( GetNullCharacter )] [war|E] was a brutal conflict where the Blackrock Clan, led by [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName] and his second-in-command [GetScriptedCharacterByHistoryID( '10050' ).GetFullName], faced annihilation at the hands of the ogres. Outnumbered, the orcs resorted to ambush tactics and sheer perseverance to overcome their foes. During the war, [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName], haunted by the Doomhammer’s dark prophecy, attempted to return it to the lava where it was forged. The elements, however, rejected his plea. With [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]’s support, [GetScriptedCharacterByHistoryID( '10050' ).GetFirstName] reclaimed the weapon and finally achieved total victory against the ogres."
 THRONE_OF_KILJAEDEN_GLOSS:0 "The Throne of Kil'Jaeden was once a sacred mountain of the Bonechewer Clan, located in the Hellfire Peninsula, formerly the Tanaan Jungle. [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] renamed this site when he gathered all the orcish clans here for a dark ritual — drinking the blood of Mannoroth, sealing their pact with the Burning Legion, and forever altering the fate of the orcs."
 JUNGLE_OF_TANAAN_GLOSS:0 "Once a lush and untamed jungle, Tanaan was home to some of the fiercest [GetTrait('creature_orc').GetName(GetNullCharacter)] clans. But, as Draenor fell into decline, it withered at an alarming and unexplained pace. Today, it is nothing more than a barren wasteland, now known as the Hellfire Peninsula."
 EYE_RITUAL_GLOSS:0 "When a new chieftain rises, every Bleeding Hollow lord must undergo the dark Eye Ritual. This rite demands they sacrifice one of their eyes in exchange for a prophetic vision of their own death. It is no trivial act: those who dare to perform the ritual emerge forever changed, freed from fear but haunted by the certainty of their fate."
 CHOGALL_FORMATION_GLOSS:0 "The arrogance and thirst for power of Cho and Gall led to their exile from Highmaul, their birthplace. When [GetScriptedCharacterByHistoryID( '10015' ).GetFirstName] created the Shadow Council, he took [GetScriptedCharacterByHistoryID( '52000' ).GetFirstName] under his wing, teaching him the demonic arts. Thus, [GetScriptedCharacterByHistoryID( '52000' ).GetFirstName] became one of the first [GetTrait('creature_ogre').GetName( GetNullCharacter )] mages bound to the Horde and a devoted servant of the Shadow Council."
 PALE_ORCS_GLOSS:0 "The pale orcs, Void-corrupted outcasts beneath Nagrand, worshipped the Void and its prophecy of the Hour of Twilight — when darkness consumes the cosmos. Once savage and uncontrollable, they embraced [GetScriptedCharacterByHistoryID( '52000' ).GetFirstName] as the herald of their dark gods when he came to annihilate them. He returned to the Horde with these fanatics fully under his control."
 DARK_STAR_GLOSS:0 "The Dark Star, worshipped by the pale orcs as a divine omen, vanished after the assault on Karabor. Called down by their rituals, its shadow engulfed the temple in voidlight, breaking minds and corrupting the land. Its disappearance is seen as a prelude to the Hour of Twilight."
 HOLYOAK_GLOSS:0 "Holyoak is a rare type of wood originating from the [GetTitleByKey('k_stormwind').GetName]. It is known to have existed at some point during the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )] and it was used primarily to build [GetTitleByKey('k_stormwind').GetNameNoTier]'s churches. This sacred wood must be carefully cut and therefore it had to be specially prepared at a [GetTrait('creature_human').GetName(GetNullCharacter)] lumber mill before a church could be built."

 DEFENDER_CROWN_GLOSS:0 "The Defender of the Crown was the name given to the unknown leader of the [GetTrait('creature_human').GetName(GetNullCharacter)] forces of [GetTitleByKey('k_stormwind').GetNameNoTier] during the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )]. As a loyal subject of [GetScriptedCharacterByHistoryID( '2' ).GetTitledFirstName], the Defender fought on multiple battlefields against the orcs and their leader, [GetScriptedCharacterByHistoryID( '10000' ).GetFirstName]. As the [GetTitleByKey('e_horde').GetBaseName] won the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )], it is likely that the Defender has died."
 FIRST_WAR_GLOSS:0 "The First War was a conflict fought between the orcish clans of Draenor and the humans of the [GetTitleByKey('k_stormwind').GetName]. It ultimately ended with the fall of [GetTitleByKey('k_stormwind').GetNameNoTier] and the victory of the [GetTitleByKey('e_horde').GetBaseName]."
 SECOND_WAR_GLOSS:0 "The Second War was a major conflict that took place in the Eastern Kingdoms between the armies of the $e_horde$ and an Alliance of humans and several other [wc_races|E]. The conflict immediately succeeded the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )] and saw the two factions clash for mastery of the entire continent as well as Azeroth at large."
 THIRD_WAR_GLOSS:0 "The Third War was a massive conflict between the mortal [wc_races|E] of Azeroth and the demons of the Burning Legion. It began in earnest when the [GetTrait('creature_human').GetName(GetNullCharacter)] [GetTitleByKey('e_lordaeron').GetName] fell to the [GetTitleByKey('h_scourge').GetBaseName] army led by the death knight [GetScriptedCharacterByHistoryID( '60003' ).GetFirstName], and ended with the defeat of the demon commander Archimonde on Mount Hyjal."
 WAR_OF_THE_ANCIENTS_GLOSS:0 "The War of the Ancients was a major conflict which constituted the first coming of the demonic Burning Legion to Azeroth 10,000 years prior to the events of the [Glossary( 'First War', 'FIRST_WAR_GLOSS' )]. One of the largest and most costly wars in Azeroth's history, the [war|E] of the Ancients influenced the fate of all life on the planet for millennia to come. The conflict ultimately led to the [Glossary( 'Great Sundering', 'GREAT_SUNDERING_GLOSS' )]. It was the first time one of the Legion's invasions of a world had ever been stopped."
 GREAT_SUNDERING_GLOSS:0 "The Great Sundering was a cataclysmic event that shattered the continent of Kalimdor approximately 10,000 years ago, at the end of the [Glossary( 'War of the Ancients', 'WAR_OF_THE_ANCIENTS_GLOSS' )]. This was caused by the implosion of the destabilized [Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )], which destroyed eighty percent of Kalimdor's landmass, sending it down to the bottom of the oceans."
 WELL_OF_ETERNITY_GLOSS:0 "The Well of Eternity was a lake of scintillating arcane energies and limitless power formed from the very lifeblood of Azeroth's world-soul. The Well was located on the ancient continent of Kalimdor near the night elven city of Zin-Azshari. The present area where the Well of Eternity was located became the Maelstrom after the [Glossary( 'Great Sundering', 'GREAT_SUNDERING_GLOSS' )].\n\nThe Well was the central focus of the Burning Legion's invasion during the [Glossary( 'War of the Ancients', 'WAR_OF_THE_ANCIENTS_GLOSS' )], and the area around it served as the final battleground of the conflict. Its waters were so powerful, that the demons hoped to bring [Glossary( 'Sargeras', 'SARGERAS_GLOSS' )] himself to Azeroth by turning the Well into a great portal between Azeroth and Argus. The Well's ensuing destruction forever spread arcane power throughout the world, physically changed its geography, and heralded a new era in Azerothian history."
 CURSE_OF_FLESH_GLOSS:0 "The Curse of Flesh is a curse created by [Glossary( 'Yogg-Saron', 'YOGG_SARON_GLOSS' )] and suffered by many titanic creations. The Curse was planted into the [Glossary( 'Forge of Wills', 'FORGE_OF_WILLS_GLOSS' )] by the Old God, slowly spreading through the titan-forged, and turning them from metal and stone to flesh beings."
 FORGE_OF_WILLS_GLOSS:0 "The Forge of Wills and its twin, the [Glossary( 'Forge of Origination', 'FORGE_OF_ORIGINATION_GLOSS' )], was built by the titanic watchers [GetScriptedCharacterByHistoryID( '400505' ).GetFirstName] and [GetScriptedCharacterByHistoryID( '400506' ).GetFirstName] after the Old Gods were defeated, with the purpose of infusing Azeroth's slumbering worldsoul with cosmic energies to shape its sentience. The Forge was also able to draw on the life essence of Azeroth and create sentient life. It was here that the various titan-forged were born, such as the stone [GetTrait('creature_trogg').GetName(GetNullCharacter)]s, earthen, [GetTrait('creature_mechagnome').GetName(GetNullCharacter)]s, and the [GetTrait('creature_vrykul').GetName(GetNullCharacter)]."
 FORGE_OF_ORIGINATION_GLOSS:0 "The Forge of Origination is a titan-forged re-origination device and super weapon located in Uldum. Its main output is a pyramid-like structure in the Halls of Origination, but the system extends throughout the entire region. Capable of being reconfigured for any number of uses, the Forge of Origination is the twin of the [Glossary( 'Forge of Wills', 'FORGE_OF_WILLS_GLOSS' )] in Ulduar, and like its counterpart serves a dual purpose: it regulates the rhythms of the earth and fortifies the form of Azeroth's Worldsoul, but if the planet's life becomes corrupted, the immense energies stored inside can be released to re-originate the planet—destroying all of its flora and fauna, reducing it to its base elements, and then creating a new generation of life."
 TWISTING_NETHER_GLOSS:0 "The Twisting Nether is the astral plane between worlds, described as the line between the ebb of Light and the flow of Void. Its counterpart is the physical plane called the [Glossary( 'Great Dark Beyond', 'GREAT_DARK_BEYOND_GLOSS' )]. The Nether is an ethereal dimension of chaotic magics that connects the myriad worlds of the universe, and while it existed outside the borders of the mortal realm, its volatile energies occasionally tear through the veil of the physical realm, flooding into reality and warping creation."
 GREAT_DARK_BEYOND_GLOSS:0 "The Great Dark Beyond is described as the physical universe, an infinite realm composed of innumerable stars, worlds, moons, and mortal civilizations. Azeroth is found in it, and it is merely one of the countless worlds drifting through the cosmos. Its counterpart is the astral plane called the [Glossary( 'Twisting Nether', 'TWISTING_NETHER_GLOSS' )]."
 SARGERAS_GLOSS:0 "Sargeras is a titan and the creator of the Burning Legion. He was once the champion of the [Glossary( 'Pantheon of Order', 'PANTHEON_GLOSS' )], chosen to defend the worlds the titans had ordered across the [Glossary( 'Great Dark Beyond', 'GREAT_DARK_BEYOND_GLOSS' )]. However, while he once served as a guardian and protector, he later set out with the purpose of destroying all worldsouls in the universe. At the head of an infinite demonic army, he began the Burning Crusade to prevent the [Glossary( 'void lords', 'VOID_LORDS_GLOSS' )] from corrupting the worldsouls, which would lead to the birth of a dark titan, a being of unspeakable evil that would utterly annihilate and consume the universe."
 OLD_GODS_GLOSS:0 "Old Gods are parasitic, eldritch horrors created by the [Glossary( 'void lords', 'VOID_LORDS_GLOSS' )] in order to find and corrupt slumbering [Glossary( 'titan', 'TITAN_GLOSS' )] Worldsouls. These immense mountains of flesh, physical manifestations of the Void, grow like cancers within the worlds of the [Glossary( 'Great Dark Beyond', 'GREAT_DARK_BEYOND_GLOSS' )]. Four Old Gods — [Glossary( 'Y’Shaarj', 'YSHAARJ_GLOSS' )], [Glossary( 'C’Thun', 'CTHUN_GLOSS' )], [Glossary( 'Yogg-Saron', 'YOGG_SARON_GLOSS' )], and [Glossary( 'N’Zoth', 'NZOTH_GLOSS' )] — ruled the planet of Azeroth during its primordial age, forming what would become known as the Black Empire. When the [Glossary( 'titans', 'TITAN_GLOSS' )] arrived, they sent their armies, the titan-forged, to shatter the Old Gods' citadels and crumble their empire."
 YSHAARJ_GLOSS:0 "Y'Shaarj  was the most powerful and wicked of the [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )]. Y'Shaarj was also known as "the seven headed one" or "the beast of seven heads", and is said to have inhaled courage and breathed fear. Y'Shaarj was the only one of the four Old Gods to be killed by the [Glossary( 'Pantheon of Order', 'PANTHEON_GLOSS' )], when the [Glossary( 'titan', 'TITAN_GLOSS' )] [Glossary( 'Aman’Thul', 'AMANTHUL_GLOSS' )] ripped it off the planet. Its heart was then imprisoned in a vault beneath the Vale of Eternal Blossoms. When it died, its last, terrible breath manifested as the seven prime sha — Anger, Hatred, Violence, Fear, Doubt, Despair and Pride. Y'Shaarj is fervently worshipped by the [GetTrait('creature_mantid').GetName(GetNullCharacter)], a race of violent, expansionistic insectoids who dwell in the lands west of the Serpent's Spine wall."
 CTHUN_GLOSS:0 "C'Thun, was the [Glossary( 'Old God', 'OLD_GODS_GLOSS' )] of madness and chaos. C'Thun created the [GetTrait('creature_qiraji').GetName(GetNullCharacter)] and resided within the city of Ahn'Qiraj in Silithus."
 YOGG_SARON_GLOSS:0 "Yogg-Saron was one of the four [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )] of Azeroth. Upon its fall at the hands of the [Glossary( 'titans', 'TITAN_GLOSS' )] countless millennia ago, Yogg-Saron was imprisoned inside the titan complex of Ulduar, within the depths of what would become the continent of Northrend. Yogg-Saron is responsible for many horrors suffered by Azeroth. In an attempt to escape its prison, the Old God corrupted Keeper Loken and turned him against his own brethren, resulting in the death of Tyr, and created the [Glossary( 'Curse of Flesh', 'CURSE_OF_FLESH_GLOSS' )], which turned countless titan-forged into mortal beings of flesh and blood. Millennia later, Yogg-Saron also corrupted the World Tree Andrassil, forcing its night elven creators to cut it down, but not before the Old God secretly managed to open a gateway into the ethereal spirit world known as the Emerald Dream and plant the seed of corruption that would later grow into the Emerald Nightmare."
 NZOTH_GLOSS:0 "N'Zoth was one of the four [Glossary( 'Old Gods', 'OLD_GODS_GLOSS' )] that landed on Azeroth, malefic beings that were sequestered by the [Glossary( 'titans', 'TITAN_GLOSS' )] during Azeroth's primordial ages."
 GHUUN_GLOSS:0 "G'huun was an [Glossary( 'Old God', 'OLD_GODS_GLOSS' )] inadvertently created by the [Glossary( 'Pantheon', 'PANTHEON_GLOSS' )] during their experiments on the other imprisoned Old Gods, as the titans tried to find a solution to the problem that they posed. Worshiped by the blood trolls of Nazmir as a loa, G'huun was known as the Blood God. Though it was quite less powerful than the other Old Gods, the threat it posed was still world-ending. G'huun's corruption was called "underrot". It sought to spread its rot, pestilence and decay across the world and beyond, and to consume Azeroth in the process."
 VOID_LORDS_GLOSS:0 "The void lords are monstrous entities composed of pure shadow energy who rule over the Void, outside the borders of reality. Merciless and cruel beyond imagination, they seek only to twist reality into a realm of eternal torment, and ultimately to devour all matter and energy and the universe itself. However, only the most powerful of the void lords can actually manifest in the physical universe, weakened, and only for limited amounts of time, for their energies quickly seep into nothingness. They must therefore consume untold amounts of matter and energy to maintain their presence."
 PANTHEON_GLOSS:0 "The titan Pantheon are a group of titans who shaped and ordered worlds while watching over the [Glossary( 'Great Dark Beyond', 'GREAT_DARK_BEYOND_GLOSS' )] and searching for others of their kind. They created the titan-forged, various races of Azeroth, and empowered the Dragon Aspects through the titanic keepers."
 AMANTHUL_GLOSS:0 "Aman'Thul the Highfather is the leader of the titan [Glossary( 'Pantheon', 'PANTHEON_GLOSS' )]. He is the oldest and wisest of his kind. The [Glossary( 'titan', 'TITAN_GLOSS' )] who originally blessed [GetScriptedCharacterByHistoryID( '62800' ).GetFirstName] and the bronze dragonflight, Aman'Thul has mastery over temporal magic. Having led the Pantheon during the ordering of the universe, he and his brothers were felled by [Glossary( 'Sargeras', 'SARGERAS_GLOSS' )], their souls held captive by the Dark Titan until they were freed by the heroes of Azeroth."
 EONAR_GLOSS:0 "Eonar the Life-Binder is the [Glossary( 'titan', 'TITAN_GLOSS' )] patron of all life and nature. She blessed the [GetTrait('creature_red_dragon').GetName(GetNullCharacter)] [GetScriptedCharacterByHistoryID( '62400' ).GetFirstName] with the power to safeguard all living creatures and Life and the [GetTrait('creature_green_dragon').GetName(GetNullCharacter)] [GetScriptedCharacterByHistoryID( '62001' ).GetFirstName] to safeguard nature and the Emerald Dream."
 NORGANNON_GLOSS:0 "Norgannon is the master of all magic, knowledge, secrets, and mysteries. He gave power to the keepers [GetScriptedCharacterByHistoryID( '400501' ).GetFirstName] and [GetScriptedCharacterByHistoryID( '400505' ).GetFirstName], and bestowed great power upon the [GetTrait('creature_blue_dragon').GetName(GetNullCharacter)] [GetScriptedCharacterByHistoryID( '62600' ).GetFirstName] to be the guardian of magic and arcanum."
 GOLGANNETH_GLOSS:0 "Golganneth the Thunderer is a member of the [Glossary( 'titan', 'TITAN_GLOSS' )] [Glossary( 'Pantheon', 'PANTHEON_GLOSS' )] and is the lord of the skies and roaring oceans."
 KHAZGOROTH_GLOSS:0 "Khaz'goroth is the [Glossary( 'titan', 'TITAN_GLOSS' )] shaper and forger of worlds. He empowered the [GetTrait('creature_black_dragon').GetName(GetNullCharacter)] Neltharion, who later became Deathwing, with dominance over the earth and the deep places of the world."
 AGGRAMAR_GLOSS:0 "Aggramar the Avenger is a [Glossary( 'titan', 'TITAN_GLOSS' )] and the former lieutenant of [Glossary( 'Sargeras', 'SARGERAS_GLOSS' )]. When Sargeras betrayed the [Glossary( 'Pantheon', 'PANTHEON_GLOSS' )], Aggramar took up his role of champion, until he was slain by his former tutor and friend."
 RAGNAROS_GLOSS:0 "Ragnaros the Firelord was the Elemental Lord of fire. After being summoned to Azeroth by Sorcerer-Thane Thaurissan, he took control of Blackrock Mountain and ruled there for more than two hundred years over his minions from deep inside its fiery core."
 
 UNDEAD_GLOSS:0 "$trait_being_undead_desc$"
 FORSAKEN_GLOSS:0 "$trait_creature_forsaken_desc$"
 DARK_IRON_DWARF_GLOSS:0 "$trait_creature_dark_iron_dwarf_desc$"
