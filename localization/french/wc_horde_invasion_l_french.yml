l_french:
 #################################
 # Base Events
 #################################
 wc_horde_invasion.medivh.1000.title:0 "L'ouverture de la Porte des ténèbres"
 wc_horde_invasion.magic.1000.title:0 "Anomalie magique surpuissante"
 wc_horde_invasion.pale_orcish.1000.title:0 "Les dieux sombres du cosmos"
 wc_horde_invasion.orcish.1000.title:0 "L'invasion venue de Draenor"
 wc_horde_invasion.generic_close.1000.title:0 "Une tempête dans les marais"
 wc_horde_invasion.medivh.1000.desc:0 "Tout mon corps tremble alors que je prononce les dernières syllabes de l'incantation. La tempête redouble de fureur, comme si les cieux eux-mêmes refusaient ce que je m'apprête à faire.\n\nDevant moi, les pierres s'écartent dans un grondement terrifiant alors que la Porte des ténèbres s'élève, immense et menaçante. Une énergie pulse dans l'air, et un vortex magique tourbillonne autour de son cadre. Il n'y a plus de retour possible...\nJe lève les bras, invoquant les forces du Néant, et dans un fracas assourdissant, la Porte s'ouvre, libérant une brume glaciale. Je les sens, de l'autre côté : les orcs.\n\nMon devoir accompli, j'utilise mes dernières forces pour retourner à Karazhan. J'allume un feu et m'effondre devant les flammes, laissant échapper un soupir. Ce maudit démoniste... Il nous trahira, c'est certain, mais il devra attendre que nous jugions qu'il mérite notre attention. Le destin d'Azeroth est scellé, et ce que j'ai fait aujourd'hui marquera le début d'une ère de chaos et de destruction sans précédent pour notre monde."
 wc_horde_invasion.draenor_first_part_general.1000.desc:0 ""[guldan.GetFirstNameNoTooltip] disait vrai ! Un autre monde nous attend de l'autre côté !" lança le chef des éclaireurs. Aussitôt, une clameur sauvage enflamma la Horde. [guldan.GetFirstName] avait mis sa tête en jeu sur ce pari, et si ce portail n'avait mené nulle part, il aurait entraîné tous ses fanatiques avec lui dans la tombe."
 wc_horde_invasion.draenor_first_part_shadow_council.1000.desc:0 ""[guldan.GetFirstNameNoTooltip] disait vrai ! Un autre monde nous attend de l'autre côté du portail !" lança le chef des éclaireurs. Aussitôt, une clameur sauvage enflamma la Horde. Je soupire. [guldan.GetFirstName] avait mis sa tête en jeu sur ce pari, et si le portail n'avait mené nulle part, nous l'aurions tous suivi dans la tombe."
 wc_horde_invasion.draenor_first_part_guldan.1000.desc:0 ""[guldan.GetFirstNameNoTooltip] disait vrai ! Un autre monde nous attend de l'autre côté du portail !" lança le chef des éclaireurs. Aussitôt, une clameur sauvage enflamma la Horde. Je souffle. J'avais mis ma tête en jeu sur ce pari, et si le portail n'avait mené nulle part, j'aurais fini dépecé vivant et jeté aux worgs."
 wc_horde_invasion.draenor_second_part_general.1000.desc:0 ""En avant !" tonna [blackhand.GetDynastyHouseNameNoTooltip], brandissant son arme vers le portail. La Horde s'ébranla, prête à engloutir ce monde inconnu."
 wc_horde_invasion.draenor_second_part_warchief.1000.desc:0 ""En avant !" tonnai-je, brandissant mon arme vers le portail. La Horde s'ébranla, prête à engloutir ce monde inconnu."
 wc_horde_invasion.warchief_draenor.1000.desc:0 "$wc_horde_invasion.draenor_first_part_general.1000.desc$\n\nJe me tiens à l'avant, mon arme en main, face au chaos tourbillonnant du portail. Le sol tremble, et l'air vibre de puissance. Il n'y a plus de retour possible.\n\n$wc_horde_invasion.draenor_second_part_warchief.1000.desc$ Alors que je traverse, Draenor s'efface derrière moi. La lumière et le son disparaissent en une tempête tourbillonnante de couleurs avant de s'évanouir. Je suis aspiré à travers l'immensité du cosmos.\n\nPuis, tout s'arrête. Je trébuche en avant, mes pieds s'enfonçant dans un sol détrempé et épais de boue. Autour de moi, le marécage s'étend à perte de vue dans toutes les directions, et derrière moi, la Horde déferle.\n\n#EMP #bold Voici donc Azeroth, le futur monde des orcs !#!#!"
 wc_horde_invasion.warchief_shadow_council_draenor.1000.desc:0 "$wc_horde_invasion.draenor_first_part_shadow_council.1000.desc$\n\nJe me tiens à l'avant, mon arme en main, face au chaos tourbillonnant du portail. L'air est saturé d'énergie gangrenée, chaque pulsation rappelant les promesses [guldan.GetFirstNamePossessiveNoTooltip].\n\n$wc_horde_invasion.draenor_second_part_warchief.1000.desc$ Alors que je traverse, Draenor s'efface derrière moi. La lumière et le son meurent en une tempête tourbillonnante de couleurs avant de s'évanouir dans le néant. Je suis aspiré dans le Néant Distordu, entrevoyant des visions fracturées d'autres mondes. Chacun est consumé par les flammes.\n\nPuis, tout s'arrête. Je trébuche en avant, mes pieds s'enfonçant dans un sol détrempé et épais de boue. Autour de moi, le marécage s'étend à perte de vue dans toutes les directions, et derrière moi, la Horde déferle.\n\n#EMP #bold Voici donc Azeroth, le futur monde des orcs !#!#!"
 wc_horde_invasion.guldan_draenor.1000.desc:0 "$wc_horde_invasion.draenor_first_part_guldan.1000.desc$\Avec difficulté, je monte sur l'estrade. D'une voix forte, je m'adresse à la Horde rassemblée devant moi :\n\n"Les éléments nous ont peut-être abandonnés, mais moi, non. Par mon pouvoir, j'ai trouvé un nouveau monde, un monde bien plus riche et fertile que ce Draenor mourant. Des batailles nous attendent, mais je vous connais : vous, les plus puissants guerriers triompherez. Leurs terres seront les nôtres, leurs peuples plieront, et leurs richesses forgeront notre avenir. Le salut des orcs passe par la conquête ! Pour la Horde !"\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ Alors que je traverse le portail, le chaos tourbillonnant du Néant Distordu m'engloutit. Puis Azeroth s'étend devant moi, une terre fertile, prête pour la domination. Ce monde s'agenouillera devant #EMP #bold moi#!#!. Devant la #EMP #bold Horde#!#!."
 wc_horde_invasion.chogall.1000.desc:0 "$wc_horde_invasion.draenor_first_part_shadow_council.1000.desc$\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ Je traverse le portail, et tout change. L'air, la lumière, l'essence même de la réalité se transforment alors que je plonge dans l'inconnu.\n\nDans le Néant Distordu, je les vois : les mondes, chacun plus grotesque que le précédent, grouillant d'horreurs indicibles. Des créatures informes aux contours trop parfaits m'observent sans bouger. Sur certains de ces royaumes, j'aperçois la Légion en pleine guerre. Mais elle ne triomphe pas.\n\nJe suffoque et ferme les yeux sous le choc. Quand je les rouvre, la vision s'est évanouie, remplacée par de l'air humide. Je suis dans un marécage, et des centaines d'orcs émergent du portail les uns après les autres... Voici donc le monde promis par [guldan.GetFirstNameNoTooltip]."
 wc_horde_invasion.twilights_hammer.1000.desc:0 "$wc_horde_invasion.draenor_first_part_general.1000.desc$\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ Alors que je traverse le portail, les murmures deviennent un chœur. Leur chant n'est pas destiné aux mortels, mais il m'emplit de DÉTERMINATION. L'air s'alourdit, et la réalité elle-même s'effondre alors que je pénètre dans l'inconnu.\n\nDans le Néant Distordu, je les vois : les mondes glorieux, chacun grouillant d'une perfection incompréhensible. Des créatures informes aux contours trop parfaits m'observent sans bouger. Sur certains de ces royaumes, j'aperçois la Légion ardente en pleine guerre. Mais elle ne triomphe pas.\n\nJe baisse la tête, indigne de tant de grandeur. Lorsque je rouvre les yeux, la vision s'est évanouie, remplacée par de l'air humide. Je suis dans un marécage, et des centaines d'orcs émergent du portail les uns après les autres... Voici donc le monde promis par [guldan.GetFirstNameNoTooltip]."
 wc_horde_invasion.shadow_council.1000.desc:0 "$wc_horde_invasion.shadow_council.1000.desc$\nJe me tiens à l'avant, au milieu de la foule rassemblée devant le portail. L'air est saturé d'énergie, chaque pulsation rappelant les promesses [guldan.GetFirstNamePossessiveNoTooltip]. Il monte sur l'estrade, s'appuyant sur son bâton, et s'adresse à la Horde :\n\n"Les éléments nous ont peut-être abandonnés, mais moi, non. Par mon pouvoir, j'ai trouvé un nouveau monde, un monde bien plus riche et fertile que ce Draenor mourant. Des batailles nous attendent, mais je vous connais : vous, les plus puissants guerriers triompherez. Leurs terres seront les nôtres, leurs peuples plieront, et leurs richesses forgeront notre avenir. Le salut des orcs passe par la conquête ! Pour la Horde !"\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ Alors que je traverse le portail, le chaos tourbillonnant du Néant Distordu m'engloutit. Puis Azeroth s'étend devant moi, un monde prêt pour la conquête. Il appartiendra aux orcs, au nom des démons !"
 wc_horde_invasion.orcish_shamanism.1000.desc:0 "$wc_horde_invasion.draenor_first_part_general.1000.desc$\nJe me tiens à l'avant, au milieu de la foule rassemblée devant le portail. [guldan.GetFirstNameNoTooltip] monte sur l'estrade, s'appuyant sur son bâton, et s'adresse à la Horde :\n\n"Les éléments nous ont peut-être abandonnés, mais moi, non. Par mon pouvoir, j'ai trouvé un nouveau monde, un monde bien plus riche et fertile que ce Draenor mourant. Des batailles nous attendent, mais je vous connais : vous, les plus puissants guerriers triompherez. Leurs terres seront les nôtres, leurs peuples plieront, et leurs richesses forgeront notre avenir. Le salut des orcs passe par la conquête ! Pour la Horde !"\n\nLa Horde rugit à nouveau. Choisi par le chef, je m'avance vers le portail. Une lumière jaillit, les ombres tourbillonnent, et je suis projeté dans le néant. Lorsque j'atterris, je suis plongé jusqu'aux genoux dans une eau boueuse. C'est un marécage.\n\n#EMP #bold Voici donc Azeroth. Ici, nous commencerons un nouveau chapitre.#!#!"
 wc_horde_invasion.draenor.1000.desc:0 "$wc_horde_invasion.draenor_first_part_general.1000.desc$\nJe me tiens à l'avant, au milieu de la foule rassemblée devant le portail. [guldan.GetFirstNameNoTooltip] monte sur l'estrade, s'appuyant sur son bâton, et s'adresse à la Horde :\n\n"Les éléments nous ont peut-être abandonnés, mais moi, non. Par mon pouvoir, j'ai trouvé un nouveau monde, un monde bien plus riche et fertile que ce Draenor mourant. Des batailles nous attendent, mais je vous connais : vous, les plus puissants guerriers triompherez. Leurs terres seront les nôtres, leurs peuples plieront, et leurs richesses forgeront notre avenir. Le salut des orcs passe par la conquête ! Pour la Horde !"\n\n$wc_horde_invasion.draenor_second_part_general.1000.desc$ Mon cœur bat à tout rompre alors que je m'avance, rejoignant le flot de guerriers se précipitant vers le portail. Une lumière éclate, les ombres tourbillonnent, et je suis aspiré dans le néant. Lorsque j'atterris, je me retrouve plongé jusqu'aux genoux dans une eau boueuse. Le marécage qui m'entoure a son air est lourd de promesses.\n\n#EMP #bold Voici Azeroth. Un monde à conquérir.#!#!"
 wc_horde_invasion.evil_magic.1000.desc:0 "Ma concentration est brisée par une vague de magie gangrenée d'une intensité jamais ressenties. Incapable d'y résister, je tente de puiser dans cette source colossale, mais je n'en saisis qu'une infime fraction. L'immensité de cette puissance me coupe le souffle : un aperçu de quelque chose d'incompréhensible.\n\nMais que se passe-t-il ?\n\nJe regarde dehors et aperçois une aurore gangrenée, une lueur imposante qui perce le ciel, pointant vers la source de l'onde de choc, au sud-est. L'air vibre encore, comme si le monde lui-même peinait à contenir cette force. Les êtres inférieures ne l'ont sûrement pas perçue, mais les mages à travers le monde l'ont sans doute ressentie.\n\nAlors que l'onde passe, une vision m'envahit. Un portail gigantesque a été levé, une porte vers une terre saturée de pouvoirs gangrenés et nécrotiques. La marque de la Légion ardente est évidente. Serait-ce vraiment eux ?"
 wc_horde_invasion.good_magic.1000.desc:0 "Ma concentration est brusquement troublée par une vague de magie gangrenée d'une intensité inédite. La magie autour de moi vibre, en dissonance avec l'ordre naturel de la planète. L'air devient lourd, presque étouffant, saturé de cette énergie inconnue. Instinctivement, je canalise mes pouvoirs pour purifier mon esprit et mes alentours de cette souillure.\n\nQue se passe-t-il ?\n\nAu loin, une aurore éclatante de magie gangrenée fend le ciel, pointant vers la source de cette onde de choc, quelque part au sud-est de la planète. L'air vibre encore, empli de résonances oppressantes, comme si le monde peinait à contenir cette force écrasante. Les êtres ordinaires ne l'ont sans doute pas perçue, mais les mages du monde entier ont sûrement ressenti cette immense puissance.\n\nJe le sens au plus profond de moi : ce n'est pas un simple déséquilibre. C'est le signe d'un mal bien plus grand."
 wc_horde_invasion.elemental_magic.1000.desc:0 "Les éléments se mettent soudain à hurler autour de moi, leurs voix déchirées par la douleur alors qu'une vague d'énergie noire d'une intensité sans précédent balaie la planète. Mes sens sont submergés par leurs cris, et je tombe à genoux.\n\nQue se passe-t-il ?\n\nJe regarde autour de moi et aperçois une aurore d'énergie démoniaque traversant le ciel, sa lueur émanant d'un point au sud-est de la planète. Les éléments tremblent encore, vibrants de défi, comme s'ils tentaient de contenir cette force. Ce n'était pas une perturbation ordinaire. Je suis sûr que beaucoup à travers le monde ont ressenti cet assaut démoniaque.\n\nLes esprits semblent inquiets. Ils murmurent qu'un terrible événement a frappé la planète."
 wc_horde_invasion.fallback_magic.1000.desc:0 "Un brusque changement dans le monde me fige sur place. Une force écrasante traverse l'air, invisible mais indéniable. Elle imprègne tout : lourde, suffocante, oppressante. Je la sens vibrer jusque dans le sol sous mes pieds.\n\nQue se passe-t-il ?\n\nJe lève les yeux et aperçois une lueur gangrenée perçant les cieux, émanant d'un point au sud-est de la planète. Le sol tremble, résonnant d'une puissance ancienne et implacable. Je ne sais pas ce que c'est, mais une chose est sûre : je ne suis pas le seul à l'avoir ressentie.\n\nQuelque chose a changé. Et rien ne pourra l'effacer."
 wc_horde_invasion.generic_close.1000.desc:0 "Une tempête inhabituelle gronde au-dessus des Morasses Noires. Le tonnerre est si fort qu'on l'entend à des lieues à la ronde. La pluie tombe sans répit, et l'air, lourd et oppressant, semble chargé d'un poids invisible.\n\nMais ce n'est pas tout.\n\nCes derniers jours, des rumeurs évoquent des créatures à la peau verte attaquant les caravanes. Pas des trolls, ni des gobelins mais autre chose. Les survivants parlent de silhouettes massives entrevues dans la pluie, des formes puissantes aux yeux rouges luisants. Les convois disparaissent, nombreux à ne jamais revenir.\n\nPersonne ne sait ce que c'est. Mais entre la tempête et ces attaques, les Morasses Noires sont désormais un lieu à fuir."
 wc_horde_invasion.1000.medivh:0 "Ainsi commence la fin du monde..."
 wc_horde_invasion.1000.magic:0 "Cela ne peut que mal finir."
 wc_horde_invasion.1000.orcish_warchief_and_shadowlord:0 "La Horde écrasera le monde !"
 wc_horde_invasion.1000.orcish_shamanic:0 "Je dois sauver mon peuple."
 wc_horde_invasion.1000.orcish:0 "La victoire ou la mort !"
 wc_horde_invasion.1000.draenor_not_horde:0 "Un tout nouveau monde pour nous."
 wc_horde_invasion.1000.stormwind_king:0 "Nous devrions enquêter."
 wc_horde_invasion.1000.generic_close:0 "On dirait qu'une tempête se prépare."

 # Horde Fatigue
 wc_horde_invasion.1001.title:0 "La fatigue de la Horde"
 wc_horde_invasion.1001.desc:0 "Il est l'heure de mettre fin à ce bain de sang. La Horde a conquis suffisamment de terres pour bâtir une nouvelle vie sur Azeroth. De nombreux orcs retournent déjà auprès de leurs familles, enterrant leurs haches de guerre, et ils jurent d'oublier les horreurs des batailles qu'ils ont traversées.\n\nLes seigneurs de guerre de la Horde restent une menace pour certaines régions d'Azeroth, mais les guerres les plus sanglantes appartiennent désormais au passé. Les clans ne trouvent plus d'intérêt à maintenir l'unité des orcs."
 wc_horde_invasion.1001.a:0 "Les orcs ont besoin d'un chef !"
 wc_horde_invasion.1001.b:0 "Nous tracerons notre propre route."
 wc_horde_invasion.1002.title:0 "$wc_horde_invasion.1001.title$"
 wc_horde_invasion.1002.desc:0 "$wc_horde_invasion.1001.desc$"
 wc_horde_invasion.1002.orcish.a:0 "Les orcs ont besoin d'un chef !"
 wc_horde_invasion.1002.a:0 "Nous avons besoin d'un chef !"
 wc_horde_invasion.1002.orcish.b:0 "$wc_horde_invasion.1001.b$"
 wc_horde_invasion.1002.b:0 "C'est terminé..."
 wc_horde_invasion.1003.title:0 "$wc_horde_invasion.1001.title$"
 wc_horde_invasion.1003.desc:0 "$wc_horde_invasion.1001.desc$"
 wc_horde_invasion.1003.a:0 "Nous avons besoin d'un chef !"
 wc_horde_invasion.1003.b:0 "C'est terminé..."

 # Assault on Stormwind
 wc_horde_invasion.1004.title:0 "Assaut sur [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]"
 wc_horde_invasion.1004.desc:0 "Alors que je sors de ma tente, les torches illuminent les visages déterminés de mes guerriers. Leurs regards se tournent vers moi lorsque je lève mon arme bien haut pour capter leur attention. Je rugis :\n\n$warchief_speech_stormwind$"
 wc_horde_invasion.1004.a:0 "La victoire ou la mort ! Réduisez leurs foyers en cendres !"
 wc_horde_invasion.1004.a.flavor:0 "Les grunts rugissent avec ferveur ! La machine de guerre se met en marche, et vous pouvez déjà sentir la balance du destin pencher en votre faveur. Les murs de Hurlevent tomberont !"
 wc_horde_invasion.1005.title:0 "Le discours de notre chef"
 wc_horde_invasion.other.1005.title:0 "Le rugissement des orcs"
 wc_horde_invasion.1005.desc:0 "La lueur des torches illumine les visages des guerriers rassemblés ici autour de leur [warchief.GetTitleAsNameNoTooltip]. Je me tiens parmi eux, sentant la tension dans l'air tandis que [warchief.GetDynastyHouseNameNoTooltip] sort de sa tente. [warchief.Custom('FR_IlElle')|U] lève son arme bien haut, rugissant :\n\n$warchief_speech_stormwind$"
 wc_horde_invasion.orcish_shamanism.1005.desc:0 "La lueur des torches illumine les visages des guerriers rassemblés ici. Je me tiens légèrement à l'écart, sentant la tension dans l'air tandis que [warchief.GetDynastyHouseNameNoTooltip] sort de sa tente. [warchief.Custom('FR_IlElle')|U] lève son arme bien haut, rugissant :\n\n$warchief_speech_stormwind$"
 wc_horde_invasion.other.1005.desc:0 "Depuis le lointain, la lueur des torches transperce l'obscurité oppressante du marais. En m'approchant discrètement, poussé par la curiosité, je distingue des centaines de silhouettes rassemblées autour d'une tente. Une voix puissante s'élève.\n\nJe ne comprends pas un traître mot de ce discours, mais chaque rugissement semble imprégné d'une énergie sauvage. Lorsque la voix s'éteint, une acclamation éclate, et les silhouettes commencent à bouger.\n\nIls se préparent à quelque chose."
 wc_horde_invasion.1005.a:0 "Lok'tar Ogar ! Sang et tonnerre !"
 wc_horde_invasion.orcish_shamanism.1005.a:0 "Moi aussi, je me battrai."
 wc_horde_invasion.other.1005.a:0 "Je ferais mieux de déguerpir."
 warchief_speech_stormwind:0 ""Les faibles humains ont repéré nos pillages. Ces lâches, au lieu de défendre leurs terres, ont préféré fuir pour implorer leur [king_of_stormwind.GetTitleAsNameNoTooltip|l]. Nos éclaireurs rapportent qu'il a envoyé ses espions jusqu'ici pour percer nos intentions. Mais cela ne changera rien ! Certains tremblent déjà à l'évocation de notre puissance et parlent de ramper vers le nord pour quémander de l'aide. Nous devons les frapper avant qu'ils n'agissent !\n\nGuerriers de la [warchief.GetPrimaryTitle.GetBaseNameNoTooltip], ce marais poisseux n'est pas une terre pour construire nos rêves de conquête. [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip] doit tomber, et un sillage de pleurs et de cendres doit anéantir leurs pathétiques royaumes !""
 wc_horde_invasion.1006.title:0 "$wc_horde_invasion.1004.title$"
 wc_horde_invasion.1006.desc:0 "Le [warchief.GetTitleAsNameNoTooltip] [warchief.GetDynastyHouseName] a déclaré la guerre aux humains. Déjà, des milliers de grunts traversent les frontières pour frapper les terres de [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. Depuis des semaines, de petites bandes d'orcs ravagent les terres humaines, détruisant des villages et réduisant leurs misérables temples en cendres. Cette menace croissante a attiré l'attention de leur [king_of_stormwind.GetTitleAsNameNoTooltip|l], et des rumeurs circulent déjà : ils pourraient chercher de l'aide au nord.\n\n[warchief.GetDynastyHouseNameNoTooltip] nous a promis des terres riches et fertiles si la [warchief.GetPrimaryTitle.GetBaseNameNoTooltip] parvient à anéantir ses ennemis et à soumettre les races inférieures qui peuplent ce monde. Lok'tar Ogar, guerriers : mort aux humains !"
 wc_horde_invasion.orcish_shamanism.1006.desc:0 "Le [warchief.GetTitleAsNameNoTooltip] [warchief.GetDynastyHouseName] a déclaré la guerre aux humains. Déjà, des milliers de grunts traversent les frontières, cherchant à revendiquer les terres de [king_of_stormwind.GetPrimaryTitle.GetBaseNameNoTierNoTooltip]. Depuis des semaines, de petites bandes d'orcs, incapables de contenir leur soif de sang, mènent des pillages sur les terres humaines, perturbant leurs villages et renversant leurs fragiles temples. Cela n'est pas passé inaperçu, et des rumeurs murmurent que leur [king_of_stormwind.GetTitleAsNameNoTooltip|l] pourrait appeler à l'aide au nord.\n\n[warchief.GetDynastyHouseNameNoTooltip] parle de terres fertiles et d'un avenir pour notre peuple : une chance de reconstruire ce que nous avons perdu sur Draenor. Pourtant, le chemin à venir sera jalonné de batailles. Lok'tar Ogar, je combattrai !"
 wc_horde_invasion.1006.a:0 "$wc_horde_invasion.1005.a$"
 wc_horde_invasion.orcish_shamanism.1006.a:0 "$wc_horde_invasion.orcish_shamanism.1005.a$"
 wc_horde_invasion.1007.title:0 "$wc_horde_invasion.1004.title$"
 wc_horde_invasion.1007.desc:0 ""[ROOT.Char.Custom('FR_MonseigneurMadame')|U] !" s'écrie l'un de mes serviteurs en accourant, essoufflé, alors que je vaque à mes occupations. Se penchant à mon oreille, il me murmure des nouvelles inquiétantes.\n\nLa [warchief.GetPrimaryTitle.GetBaseName] a traversé les frontières et lance un assaut massif sur nos terres. Déjà, des centaines de réfugiés terrorisés fuient vers les terres intérieures, leurs cris de désespoir nous implorant de leur venir en aide.\n\nLe temps presse. Je dois décider, et vite, avant que ces peaux-vertes enragées n'atteignent nos portes et ne réduisent tout en cendres."
 wc_horde_invasion.king.1007.desc:0 "Les éclaireurs envoyés dans les Morasses Noires sont revenus, leurs rangs décimés et leurs corps meurtris. Leur chef, le visage marqué par la fatigue, se tient devant moi.\n\n"[ROOT.Char.Custom('FR_MonseigneurMadame')], la situation est bien plus grave que ce que nous avions imaginé. Ces peaux-vertes ne sont pas des trolls. Et elles sont bien plus nombreuses que nous l'avions cru !"\n\nIl poursuit son rapport, décrivant leur violence inouïe, leurs pratiques rituelles étranges, et leur origine toujours inconnue. Un courtisan m'adresse un regard inquiet : la menace est bien plus sérieuse que nous ne l'avions pensé, mais certains nobles s'obstinent à la prendre à la légère.\n\nMais que se passe-t-il au juste ? Se pourrait-il que [Glossary( 'l'Apocalypse', 'APOCALYPSE_RENILASH_GLOSS' )] approche ? Quoi qu'il en soit, tout se décidera sur le champ de bataille."
 wc_horde_invasion.1007.a:0 "Puisse [ROOT.Char.GetFaith.WarGodName] nous venir en aide..."
 wc_horde_invasion.1007.b:0 "Préparez les défenses !"
 wc_horde_invasion.1007.c:0 "Peut-être m'épargneront-ils si je leur ramène la tête de [king_of_stormwind.GetFirstNamePossessive]."
 wc_horde_invasion.king.1007.a:0 "Nos Frères du Cheval mèneront la charge."
 wc_horde_invasion.king.1007.b:0 "Laissez-les venir."
 horsemen_brotherhood_of_the_horse_effect_tt:0 "300 cavaliers lourdement armés seront immédiatement levés et rejoindront vos rangs."
 pikemen_brotherhood_of_the_horse_effect_tt:0 "Vous équiperez 800 hommes de la Confrérie du Cheval avec des armes d'hast."
 brotherhood_of_the_horse_army:0 "Confrérie du Cheval"

 #################################
 # Introduction Events
 #################################
 wc_horde_invasion.1500.title:0 "Le plus grand des chefs"
 wc_horde_invasion.1500.desc:0 "J'ai fait ce que j'avais à faire. Désormais, la Horde déferlera sur ce monde, et les orcs y régneront pour des siècles. La [Glossary('guerre contre les draeneï', 'WAR_DRAENEI_GLOSS')] marqua le début de mon ascension. [blackrock_clan_title.GetName|U] est devenu le clan le plus craint et respecté de tous, et j'en étais le chef impitoyable.\n\nQuand la Horde a eu besoin d'un chef, qui d'autre aurait pu être choisi ? Je suis un chef respecté et craint par mes guerriers. [guldan.GetFirstName] a peut-être manipulé ma popularité pour m'élever à ce rang, et qu'importe. Cela sert autant ses ambitions que les miennes. Draenor est morte, mais cela m'est égal. Je régnerai sur des galaxies entières s'il le faut, pas sur un monde trop faible pour supporter le pouvoir des démons.\n\nMes fils hériteront de ce monde. Un monde que les orcs forgeront à leur image."
 wc_horde_invasion.1500.a:0 "Le Conseil est notre plus grand allié."
 wc_horde_invasion.1500.a.flavor:0 "Le Conseil des Ombres a guidé la Horde vers la grandeur, et [guldan.GetFirstNameNoTooltip] est l'architecte de son destin. La loyauté envers le Conseil assurera l'unité des clans et la victoire contre vos ennemis. Ensemble, vous forgerez un avenir digne des orcs."
 wc_horde_invasion.1500.a_alternative:0 "L'univers s'inclinera devant la puissance des orcs !"
 wc_horde_invasion.1500.a_alternative.flavor:0 "Draenor est peut-être perdue, mais la Horde s'élèvera au-delà de ce monde mourant. La force de vos guerriers et votre volonté graveront votre héritage à travers les étoiles !"
 wc_horde_invasion.1500.b:0 "[guldan.GetFirstNameNoTooltip] a outrepassé son utilité."
 wc_horde_invasion.1500.b.flavor:0 "Les machinations [guldan.GetFirstNamePossessiveNoTooltip] ont servi un temps, mais c'est terminé. La Horde ne sera plus l'instrument de ses ambitions. Sa mort vous libérera de son emprise, et sous votre commandement, vous mènerez les orcs vers une gloire que lui-même n'aurait jamais pu imaginer."
 wc_horde_invasion.1501.title:0 "Les Ténèbres incarnées"
 wc_horde_invasion.1501.desc:0 "Le portail a fonctionné comme il l'avait promis. Mais cette fois, je ne serai pas un pion mais le roi. Ner'zhul a cru en ces êtres et a tout perdu, tout comme moi. Kil'jaeden m'a fait massacrer les draeneï, [Glossary( 'briser les éléments', 'HAND_OF_GULDAN_GLOSS' )] de Draenor et à réduire la Horde, mon chef-d'œuvre, en esclavage avec le [Glossary('Sang de Mannoroth', 'BLOOD_OF_MANNOROTH_GLOSS')]. Tout ça pour un monde mourant, des clans s'entretuant pour les ressources, et une perte de leur foi en moi, le prophète de leur ascension ! Mais Draenor est désormais derrière moi. Et devant s'étend Azeroth, prête à être conquise.\n\nCe portail nous offre un monde rempli de royaumes divisés et de seigneurs faibles… Ils brûleront, mais pas pour lui. Je ne referai pas deux fois la même erreur. Ce sorcier a mentionné la Tombe de Sargeras une seule fois, mais c'était suffisant : je sais qu'elle existe. [stormwind_holder.GetPrimaryTitle.GetNameNoTier] brûlera, comme il le veut. Ensuite, il me révélera tous ses secrets… #EMP #bold avant que je ne l'écrase !#!#!"
 wc_horde_invasion.1501.a:0 "Et le Conseil des Ombres sera mon épée !"
 wc_horde_invasion.1501.a.flavor:0 "Le Conseil des Ombres est votre meilleure arme. Vos agents et vos serviteurs se trouvent partout dans la Horde, même auprès vos ennemis. Ils croient toujours en vous, convaincus que vous les conduirez au pouvoir ultime. La force de la Horde est dans la paume de votre main."
 wc_horde_invasion.1501.a_alternative:0 "Je dois rebâtir le Conseil, sinon je suis fichu."
 wc_horde_invasion.1501.a_alternative.flavor:0 "Le Conseil des Ombres est brisé. La plupart de ses membres sont morts ou vous ont trahi, vous laissant vulnérable. Beaucoup au sein de la Horde n'ont pas oublié comment vous avez failli les mener à l'extinction. Sans vos agents et votre influence, il sera difficile de leur faire face."
 wc_horde_invasion.1501.b:0 "Main-Noire me trahira un moment ou un autre."
 wc_horde_invasion.1501.b.flavor:0 "Main-Noire est trop ambitieux pour rester loyal bien longtemps. Il sait que vous avez manipulé son ascension au pouvoir et ressent le poids des chaînes que vous maintenez autour de son cou. Un jour, il tentera de vous écarter pour revendiquer la Horde comme sienne... mieux vaut frapper le premier."
 wc_horde_invasion.1502.title:0 "Le traître à sa race"
 wc_horde_invasion.1502.desc:0 "Cela fait maintenant des années que [guldan.GetFirstName] a rassemblé les orcs sur le [Glossary('Trône de Kil'jaeden', 'THRONE_OF_KILJAEDEN_GLOSS')], leur offrant son [Glossary('"cadeau"', 'BLOOD_OF_MANNOROTH_GLOSS')]. Cette mixture nous a rendus forts, mais elle a aussi teint nos peaux de vert et éveillé en nous une grande soif de sang et de violence. Horrifié par ce que j'ai vu, j'ai interdit aux [ROOT.Char.GetCulture.GetCollectiveNoun] d'y toucher. Mais cela n'a pas suffi : nos peaux ont aussi verdi, et je vois déjà cette soif de sang nous guetter.\n\nLes clans restés sur Draenor ont sombré dans l'ensauvagement. [ROOT.Char.GetLiege.GetFirstName] a préféré choisir les clans qui avaient encore un semblant de raison pour l'accompagner ici."
 wc_horde_invasion.1502.desc_normal_outro:0 "\n\n[orgrim.GetFirstName] doute encore de moi ; il prétend qu'un seul orc ne peut détruire un monde. Et pourtant, autour du portail, la terre se flétrit déjà, comme sur Draenor. #EMP Maudit soit [guldan.GetFirstNameNoTooltip] !#! S'il n'est pas arrêté, notre peuple court à sa perte."
 wc_horde_invasion.1502.desc_no_ogrim_outro:0 "\n\nLes autres clans refusent de m'écouter ; ils disent qu'un seul orc ne peut détruire un monde. Et pourtant, autour du portail, la terre se flétrit déjà, comme sur Draenor. #EMP Maudit soit [guldan.GetFirstNameNoTooltip] !#! S'il n'est pas arrêté, notre peuple court à sa perte."
 wc_horde_invasion.1502.desc_no_more_corruption_outro:0 "\n\nGul'dan n'est plus, mais ses sous-fifres rôdent encore, et la corruption continue de gangrener notre peuple. Il faut agir : les esprits réclament vengeance !"
 wc_horde_invasion.1502.a:0 "Maudit sorcier !"
 wc_horde_invasion.1502.a.flavor:0 "Gul'dan ne s'en tirera pas comme ça ! Azeroth ne peut pas être abandonnée à la mort comme Draenor, et vous ne pouvez pas envahir de nouveaux mondes indéfiniment. Un jour, il paiera pour ses crimes."
 wc_horde_invasion.1502.a_alternative:0 "La corruption finira par disparaître."
 wc_horde_invasion.1502.a_alternative.flavor:0 "Vous inspirez profondément, vous persuadant que maintenant que Gul'dan n'est plus, la corruption finira par s'effacer avec le temps. Pourtant, une ombre persiste dans votre esprit. Vous ressentez toujours son emprise sur votre peuple, malgré tous vos efforts pour le nier."
 wc_horde_invasion.1502.b:0 "Je dois suivre les autres clans pour le moment."
 wc_horde_invasion.1502.b.flavor:0 "Le goût de la défaite est amer. Les autres clans ont déjà choisi leur chemin et refusent d'écouter... Pour l'instant, vous devez les suivre, vous pliant à la volonté des dae'mons. Vous avez besoin de temps, de temps pour trouver l'instant où vous pourrez sauver votre peuple."
 wc_horde_invasion.1503.title:0 "Le chemin de la gloire"
 wc_horde_invasion.1503.desc:0 "Les marais nous dévorent. Chaque pas enfonce mes grunts un peu plus dans la boue. Derrière moi, l'un d'eux grogne : "#EMP On devrait être sur le champ de bataille !#!" D'un regard, je le réduis au silence. Ce marais est impitoyable, mais moi, je le suis plus.\n\nDepuis [Glossary( 'la guerre contre les ogres', 'OGRE_BLACKROCK_WAR_GLOSS' )], je suis le second [blackhand.GetFirstNamePossessive] et porteur du Marteau-du-Destin. Ce fardeau pèse autant sur mon bras que sur mon âme. Quand [guldan.GetFirstName] offrit son [Glossary( '"cadeau"', 'BLOOD_OF_MANNOROTH_GLOSS' )], j'ai refusé. Par peur, peut-être. Par lucidité, je l'espère. Les éléments se sont tus, et je me demande si [durotan.GetFirstName] n'avait pas raison. Est-ce que c'est vraiment [guldan.GetFirstNameNoTooltip] qui a tué Draenor ?\n\nOn murmure que je serai le prochain chef. Qu'ils parlent, cela m'importe peu. Je n'ai pas besoin de mots pour asseoir mon autorité, Marteau-du-Destin parlera pour moi."
 wc_horde_invasion.1503.a:0 "Mon nom traversera les âges."
 wc_horde_invasion.1503.a_flavor:0 "La Horde prospère grâce à la force et à l'ambition, et vous prouverez que vous méritez d'être bien plus qu'un simple second. [durotan.GetFirstNameNoTooltip] a tort : aucun démoniste ne peut détruire un monde seul. Avec votre arme, vous ouvrirez votre voie vers la gloire."
 wc_horde_invasion.1503.b:0 "[durotan.GetFirstNameNoTooltip] avait raison depuis le début."
 wc_horde_invasion.1503.b_flavor:0 "Les dons de [guldan.GetFirstNamePossessiveNoTooltip] ont corrompu votre peuple bien avant que le Sang de Mannoroth ne coule dans leurs veines. Le silence des éléments est un signe : vos ancêtres ont été trahis, peut-être par vous plus que quiconque. [guldan.GetFirstNameNoTooltip] doit être arrêté avant qu'il ne soit trop tard, même si cela signifie défier la Horde elle-même."
 wc_horde_invasion.1504.title:0 "Le vieil orc"
 wc_horde_invasion.1504.desc:0 "Nos [Glossary( 'terres ancestrales', 'JUNGLE_OF_TANAAN_GLOSS' )] sont perdues, transformées en désert stérile, et Draenor dépérit, abandonnée par les éléments. Mais les [ROOT.Char.GetCulture.GetName] refusent de plier face au destin !\n\nApres des années de lutte, [guldan.GetFirstName] a ouvert la Porte des Ténèbres et [ROOT.Char.GetLiege.GetFirstName] nous a ordonné d'envahir ce nouveau monde, promettant des terres fertiles pour notre peuple : une chance de tout recommencer.\n\nMais ma fin approche, je le sais. En [Glossary( 'sacrifiant mon œil', 'EYE_RITUAL_GLOSS' )], j'ai vu ma propre mort : terrassé par des ennemis inconnus. Aujourd'hui, je comprends qu'il s'agit des peaux-roses d'ici !\n\n[ROOT.Char.GetLiege.GetFirstNameNoTooltip] me respecte et m'accorde une certaine liberté. Mais agir est vital : sécuriser l'avenir de mon clan avant que ma vision ne se réalise… ou prouver qu'elle peut être défiée."
 wc_horde_invasion.1504.a:0 "Les terres autours n'attendent que nous pour les revendiquer."
 wc_horde_invasion.1504.a_flavor:0 "Vous êtes venu ici pour offrir une nouvelle patrie à votre peuple. Les Morasses Noires rappellent l'ancestrale Tanaan, et une jungle luxuriante doit se trouver à proximité. Il est temps d'envoyer des éclaireurs explorer les environs."
 wc_horde_invasion.1504.a_tooltip:0 "Vous envoyez des éclaireurs explorer l'ouest à la recherche de terres à conquérir."
 wc_horde_invasion.1504.b:0 "Je m'emparerai de la Horde avant de trépasser !"
 wc_horde_invasion.1504.b_flavor:0 "Votre vie a été marquée par une lutte incessante pour assurer la survie de votre clan. Devenir chef de guerre avant votre mort serait l'apogée de votre gloire, gravant à jamais votre nom dans l'histoire. Les autres seigneurs de guerre ne manqueront pas d'admirer votre audace."
 wc_horde_invasion.1505.title:0 "Les murmures"
 wc_horde_invasion.1505.desc:0 "Au moment où #EMP nous#! avons traversé le Portail, des visions et des murmures ont assiégé #EMP nos#! esprits. Au début, je pensais qu'il s'agissait d'une nouvelle manifestation des démons que [guldan.GetFirstName] nous avait [Glossary('enseignés', 'CHOGALL_FORMATION_GLOSS')]. Mais, alors que je menais [ROOT.Char.GetPrimaryTitle.GetName|l], j'ai compris. Ces visions ne viennent pas des démons, mais de leurs dieux oubliés, des forces bien plus anciennes et puissantes que la Légion elle-même.\n\n#EMP Gall#! reste étrangement silencieux. #EMP Lui#!, si prompt à l'impulsivité, semble épargné par ces voix. Mais moi, je les entends, et elles deviennent de plus en plus fortes… Et #EMP nos#! [Glossary('orcs pâles', 'PALE_ORCS_GLOSS')], jadis les plus indisciplinés, nous obéissent désormais sans poser de questions, comme guidés par une volonté supérieure. Ils #EMP nous#! appellent leurs Prophètes…"
 wc_horde_invasion.1505.a:0 "Et s'ils avaient raison ? Je dois convaincre Gall. @twilights_hammer_cult_icon!"
 wc_horde_invasion.1505.a_flavor:0 "#EMP "Tout est clair maintenant. La Légion mène sa croisade dérisoire par peur de ces dieux, mais elle est condamnée à l'échec, car le destin inéluctable de l'univers est l'Heure du Crépuscule.\nLa Horde, ces visions, ma rencontre avec les orcs pâles, tout cela ne peut être une simple coïncidence. Gall ne respecte que la force, et il doit voir que c'est la véritable voie à suivre."#!"
 wc_horde_invasion.1505.b:0 "Nous ne pouvons pas trahir la Légion."
 wc_horde_invasion.1505.b_flavor:0 "Lorsque vous passez un pacte avec la Légion, il n'y a pas de retour possible. Penser que vous pourriez déjouer les pouvoirs démoniaques suprêmes serait du suicide. Vous ne pouvez pas trahir le Conseil des Ombres."
 wc_horde_invasion.1505.c:0 "Personne ne nous dit quoi faire."
 wc_horde_invasion.1505.c_flavor:0 "#EMP "Nous ne sommes les esclaves ni des démons, ni des murmures dans le noir. Gall avait raison : nous sommes les maîtres de notre destin, et la force est notre arme. Ces voix... je les ferai taire moi-même !"#!"
 wc_horde_invasion.1506.title:0 "L'Heure du Crépuscule"
 wc_horde_invasion.1506.desc:0 ""#EMP (TUE ÇA !)#!", grogne Gall lorsque j'arrache l'âme [devoted.GetNamePossessive], l'envoyant [new_faith.PositiveAfterLife2].\n\n"Tu vois, Gall ? Leur essence complète le cercle. [new_faith.PantheonTerm|U] approuvent cette offrande. #EMP (Ha ! POUVOIR… OUI ! PLUS !)#!"\n\nJ'expire sur le livre dans #EMP nos#! mains, imprégnant ses pages, déjà trempées du sang des [new_faith.GetAdjective], avec l'essence de [devoted.GetName]. Gall exulte : ce soir, des dizaines de corps démembrés m'ont permis de forger ce livre. [new_faith.PantheonTerm|U] ont révélé la vérité qui sera inscrite en son sein : les titans, l'Empire noir, la Légion, le Vide...\n\nCes dernières semaines, Gall s'est ouvert aux murmures. Il comprend enfin. Chaque décision que #EMP nous#! avons prise nous a menés à cet instant précis. #EMP Nous#! sommes leurs prophètes. Le crépuscule tombe !"
 wc_horde_invasion.1506.a:0 "L'Heure du Crépuscule approche!"
 wc_horde_invasion.1506.a_flavor:0 "Vous incarnez désormais la volonté des Dieux très anciens. Les étoiles s'éteignent, les cieux tremblent, et la terre frissonne. La Horde sera sans doute l'instrument de l'Heure du Crépuscule, mais vous devez en être l'un des architectes. Leurs murmures l'exigent : #EMP combattez pour la Horde !#!"
 wc_horde_invasion.1507.title:0 "$wc_horde_invasion.1505.title$"
 wc_horde_invasion.1507.desc:0 "Depuis notre arrivée sur Azeroth, des murmures rampent dans mon esprit. Parfois des chuchotements, parfois des cris. Des ombres sans forme hantent mes rêves, m'ordonnant de m'incliner.\n\nLes dieux de Draenor... eux, ils se sont tus. Et [Glossary( 'l'Étoile noire', 'DARK_STAR_GLOSS' )] a disparu. Mais ici, c'est différent. Ici, ils sont nombreux. Quatre... Non, cinq ? Je les connais, même sans les avoir vus.\n\nYogg-Saron, la mort et la fin des choses. Y'Shaarj, la rage et la haine dans mon cœur. N'Zoth, les secrets qui ne doivent pas être révélés. C'Thun, la folie pure. Et un autre… Lointain, faible, mais là. Le dieu du sang et de la pourriture.\n\nEst-ce que tout cela a un sens ? Peut-être qu'Azeroth est un nouveau départ... ou bien une erreur. Une terrible, terrible erreur."
 wc_horde_invasion.1507.a:0 "Je suivrai. @twilights_hammer_cult_icon!"
 wc_horde_invasion.1507.a_flavor:0 "Les murmures sont clairs désormais. Ils n'implorent pas, ils appellent. Yogg-Saron, Y'Shaarj, N'Zoth, C'Thun... et l'ombre sanglante qui les dépasse tous. Pas de chaînes. Pas de maîtres. Seulement le destin."
 wc_horde_invasion.1507.b:0 "Les démons paient mieux que des murmures."
 wc_horde_invasion.1507.b_flavor:0 "Les murmures promettent. Les démons agissent. Le pouvoir est fait de sang, pas de rêves. La Légion vous a donné la force, et grâce à elle, vous avez conquis des mondes. Vous en prendrez un de plus."
 convert_to_twilights_hammer_effect_tt:0 "Ceci peut vous mener à votre conversion secrète au [new_faith.GetName|V]"

 #################################
 # Conquests of the Horde
 #################################
 # First War
 ### Northshire ###
 wc_horde_invasion.9000.title:0 "La chute de $c_northshire$"
 wc_horde_invasion.northshire.9000.title:0 "L'ultime résistance de $c_northshire$"
 wc_horde_invasion.northshire.9000.desc:0 "La chute de $c_northshire$ est un cauchemar devenu réalité. Les terres flambent autour de nous, et notre peuple est impitoyablement massacré. Les derniers défenseurs que nous sommes se sont repliés dans l'abbaye, notre ultime sanctuaire.\n\nÀ travers les portes barricadées, nous entendons la fureur des orcs monter en puissance. Ils ont déraciné l'un des [Glossary('arbres', 'HOLYOAK_GLOSS')] sacrés de nos jardins pour en faire un instrument de destruction. Chaque coup porté contre les portes envoie une vague d'effroi à travers nos cœurs. Nos prières pour le salut se noient dans la cacophonie de la bataille : les cris de guerre des orcs, le craquement du bois, les hurlements des condamnés.\n\nAlors que les portes se fendent et craquent, la fin approche. Nous nous préparons, sachant que la déferlante de rage et d'acier est sur le point d'envahir notre refuge, emportant avec elle la dernière lueur de $c_northshire$."
 wc_horde_invasion.9000.desc:0 "Alors que les défenses de $c_northshire$ et des terres environnantes s'effondrent, nos guerriers s'abandonnent à une frénésie destructrice. La percée a déclenché une orgie de violence : chaque bâtiment est pillé, chaque humain massacré sans pitié.\n\nLe dernier bastion des humains se dresse dans l'abbaye. Tandis que nos guerriers l'encerclent, nous déracinons un vieil arbre des jardins pour en faire un bélier. Chaque coup, résonnant comme un tonnerre, mêle les clameurs de nos cris de guerre aux hurlements désespérés des réfugiés terrés à l'intérieur. Le bois craque, des éclats fusent, et la dernière barrière à notre courroux ploie sous notre assaut.\n\nAlors que les portes vacillent, prêtes à s'effondrer pour livrer leur ultime sanctuaire à notre Horde, nous nous préparons à étouffer la dernière étincelle de résistance en $c_northshire$."
 wc_horde_invasion.9000.a:0 "Lok'tar ogar, pour la Horde !"
 wc_horde_invasion.9000.b:0 "Pour $c_northshire$ ! Pour $k_stormwind$ !"
 wc_horde_invasion.9000.tooltip.b:0 "Face à l'envahisseur, nous résistons ! Battons-nous avec honneur pour nos terres, pour $c_northshire$ ! Pour $k_stormwind$ !"
 wc_horde_invasion.9001.title:0 "Le sac de $c_northshire$"
 wc_horde_invasion.9001.desc:0 "Maintenant que $c_northshire$ est sous notre contrôle, des orcs se répandent dans les terres environnantes, ne laissant derrière elles que des ruines fumantes. Les habitations sont pillées et incendiées, les champs détruits, et aucun habitant n'est épargné par leur rage sanguinaire. Face à cela, un choix s'impose à moi :\n\nD'un côté, je peux laisser libre cours à la soif de violence de mes guerriers. $c_northshire$ serait dévastée, et ses richesses alimenteraient la machine de nos conquêtes, offrant une démonstration brutale de l'inutilité de résister à la Horde.\n\nD'un autre, je pourrais ordonner à mes guerriers de cesser leur destruction. Exécuter ceux qui défieraient cet ordre serait nécessaire pour maintenir la discipline. Cela permettrait de préserver et de réutiliser des structures clés au profit de la Horde, transformant les vestiges de $c_northshire$ en un point stratégique pour nos campagnes futures. La décision m'appartient..."
 wc_horde_invasion.9001.a:0 "Laissez-les faire."
 wc_horde_invasion.9001.tooltip.a:0 "Des groupes d'orcs se répandront dans les terres environnantes et ravageront tout sur leur passage."
 wc_horde_invasion.9001.b:0 "Arrêtez, bande d'idiots !"
 wc_horde_invasion.9001.tooltip.b:0 "Nous ne pouvons pas les laisser détruire les infrastructures : exécutez les récalcitrants pour donner l'exemple."

