 #Mrligion Group Faiths
 frghlaith:0 "Frghloi"
 frghlaith_adj:0 "frghlidèlre"
 frghlaith_adherent:0 "frghlent"
 frghlaith_adherent_plural:0 "frghlents"
 frghlaith_desc:0 "Those who worship water deities perform rituals to commune with the sea and its powers, venerating both the water and the mighty beings within it. The pantheon is ever-shifting, adapting as new creatures are encountered. Even a strong shark or swift fish may become a living symbol, and as they die or move on, the faith changes to embrace new symbols from the ocean."

 frghlaith_old:0 "$frghlaith$ ancien"
 frghlaith_old_adj:0 "$frghlaith_adj$ ancienne"
 frghlaith_old_adherent:0 "$frghlaith_adherent$ ancien"
 frghlaith_old_adherent_plural:0 "$frghlaith_adherent_plural$ anciens"
 
 arkkoroc:0 "Arkkoroc"
 arkkoroc_adj:0 "arkkoran"
 arkkoroc_adherent:0 "arkkoran"
 arkkoroc_adherent_plural:0 "arkkoran"
 arkkoroc_desc:0 "Arkkoroc is revered by his followers as the demigod of the sea. The $arkkoroc_adherent_plural$ believe he protects them but also tests their faith through violent tempests and surging tides. Residing in Azshara, Arkkoroc is worshipped by the local creatures."
 arkkoroc_good_god_arkkoroc:0 "Arkkoroc"
 arkkoroc_good_god_arkkoroc_possessive:0 "d'Arkkoroc"
 arkkoroc_religious_head_title_male:0 "Seigneur"
 arkkoroc_religious_head_title_female:0 "Dame"