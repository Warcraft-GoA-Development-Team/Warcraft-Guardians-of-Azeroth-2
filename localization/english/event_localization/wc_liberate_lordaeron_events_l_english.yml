l_english:
 
 liberate_lordaeron.1000.title:1 "Lordaeron Reborn"
 liberate_lordaeron.1000.desc:0 "After countless deaths and conflicts, [GetTitleByKey('b_lordaeron').GetName] has been wrestled away from the Scourge's grasp.\n\nThe people of Lordaeron will settle back into their homelands and the plague shall be cleansed off... but now the choices are laid bare before us...\n\nWho shall inherit the new [GetTitleByKey('k_lordaeron').GetName]? I have taken back the Kingdom from the Scourge after all, why shouldn't I keep it to myself? Should I hand it back to the Menethils, to keep it stable? Or do I hand it to our Theocratic Leaders?"
 liberate_lordaeron.1000.A:0 "Take the Throne for myself!"
 liberate_lordaeron.1000.A_tt:0 "You get the [GetTitleByKey('k_lordaeron').GetName]"
 liberate_lordaeron.1000.B:0 "The Menethil shall rule once more"
 liberate_lordaeron.1000.B_tt:0 "You grant [GetTitleByKey('k_lordaeron').GetName] to the House Head of the Menethil Dynasty"
 liberate_lordaeron.1000.C:0 "My fight is for [Character.GetFaith]"
 liberate_lordaeron.1000.C_tt:0 "You grant [GetTitleByKey('k_lordaeron').GetName] to your Religious Leader"

 liberate_lordaeron.1001.title:1 "Lordaeron Reborn"
 liberate_lordaeron.1001.desc:0 "With the strength of the Light itself, Lordaeron has been liberated.\n\nAll the rights to the Kingship of Lordaeron have been handed over to [new_ruler_of_lordaeron.GetName]. May the new reign of [new_ruler_of_lordaeron.GetFirstName] be blessed by the Light as well and may the poeple of Lordaeron flourish in their birthright."
 liberate_lordaeron.1001.A:0 "Interesting..."
