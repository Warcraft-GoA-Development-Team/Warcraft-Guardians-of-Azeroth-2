l_english:
 wc_murder_save.0002.t:0 "$murder_save_header$ Demon"
 wc_murder_save.0002.desc:0 "[target.GetTitledFirstName] is still alive!\n\nThe assassin successfully snuck into the [target.GetTitleTierNamePossessive] bedroom, but a dreadful demon struck them before they could carry out their task!"

 wc_murder_save.1002.desc:0 ""#bold What are you hiding...?#!" The muttering of my summoned demon startles me awake just as I am about to fall asleep. Before I have a chance to ask them to be silent, the Demon is shooting a beam of fel magic at something unseen. A hidden assassin!\n\nIf not for my summon, would I have detected the invisible enemy in time?"