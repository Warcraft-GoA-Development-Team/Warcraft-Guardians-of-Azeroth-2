 activity_anti_lichking_desc:0 "Under the leadership of Terenia Menethil, a daring assault on Icecrown is launched, targeting the heart of the Lich King's power. This bold move, born out of a desire for justice and retribution for Lordaeron, represents a critical moment in Terenia's quest to vanquish the shadow that has long cast its pall over her homeland. Braving the frozen wastes and the undead legions, Terenia and her allies confront the dark forces that guard the Icecrown Citadel, determined to end the Lich King's reign once and for all."
