 building_shrine_ulatek: "Святилище Ула-Тек"
 building_shrine_ulatek_desc: "Тролли поклоняются Ула-Тек и почитают зиккурат святыней, совершая среди руин свои тёмные обряды и вуду-ритуалы. Тролли хранят свои сокровища — собранные за столетия — внутри зиккурата, что также служит причиной их столь бдительной охраны."
