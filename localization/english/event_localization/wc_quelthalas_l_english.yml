 wc_quelthalas_events.103.t:0 "Reconnecting With the Sunwell's Nature"
 wc_quelthalas_events.103.desc:0 "The important discovery should be that its Arcane essence is not merely a fuel source; it has unusual properties that might allow it to interact with another form of cosmic power."
 wc_quelthalas_events.103.a:0 "placeholder"
 
 wc_quelthalas_events.104.t:0 "Seeking Answers in Outland"
 wc_quelthalas_events.104.desc:0 "Azeroth has no surviving equivalent to the Sunwell and no accessible Naaru. Outland does."
 wc_quelthalas_events.104.a:0 "placeholder"
 
 wc_quelthalas_events.105.t:0 "Storming Tempest Keep"
 wc_quelthalas_events.105.desc:0 "The elves aren't peacefully studying the Naaru; they're desperate enough to take one by force."
 wc_quelthalas_events.105.a:0 "placeholder"
 
 wc_quelthalas_events.106.t:0 "M'uru Captured"
 wc_quelthalas_events.106.desc:0 "This should feel like the apparent breakthrough. The Magisters now possess something they previously thought impossible: a living source of the Light."
 wc_quelthalas_events.106.a:0 "placeholder"
 
 wc_quelthalas_events.107.t:0 "Formation of the Blood Knights"
 wc_quelthalas_events.107.desc:0 "This is a fantastic Phase One event because it proves the central thesis: The elves don't need to be naturally compatible with a cosmic power. They can force compatibility through the Sunwell's remaining Arcane essence."
 wc_quelthalas_events.107.a:0 "placeholder"
 
 wc_quelthalas_events.108.t:0 "The Naaru's Light"
 wc_quelthalas_events.108.desc:0 "The elves realize that the Arcane residue of the Sunwell and M'uru's Light are not merely compatible—they can be combined/interfaced in a way that alters the nature of the resulting magical energy. and that is the discovery that makes Event 109 inevitable."
 wc_quelthalas_events.108.a:0 "placeholder"
 
 wc_quelthalas_events.109.t:0 "The Void Hypothesis"
 wc_quelthalas_events.109.desc:0 "Umbric asks the forbidden question: If Sunwell essence can interface with the Light, why couldn't it interface with the Void? These become arc words for his part of the story."
 wc_quelthalas_events.109.a:0 "Exile him."
 wc_quelthalas_events.109.b:0 "Sanction his research, but keep a tight leash on him."
 wc_quelthalas_events.109.c:0 "Allow him to proceed as he wishes."
 
