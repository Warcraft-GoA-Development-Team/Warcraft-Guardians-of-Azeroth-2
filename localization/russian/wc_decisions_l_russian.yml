 create_union_universal_dragon_forces_desc: "Вы #P станете#! частью #V Драконьих стай#!"
 create_union_universal_scourge_forces_desc: "Вы #P станете#! частью #V Плети#!"
 create_union_universal_axis_of_awful_desc: "Вы #P станете#! частью #V Оси ужаса#!"
 create_union_universal_no_union_valid_tt: "Ни одна из фракций не является действительной"
 create_union_universal_alliance_trigger_tt: "Триггеры фракции #V Альянс#! недействительны"
 create_union_universal_horde_trigger_tt: "Триггеры фракции #V Орда#! недействительны"
 create_union_universal_custom_trigger_tt: "Триггеры #V пользовательской#! фракции недействительны"
 create_union_universal_illidari_forces_trigger_tt: "Триггеры фракции #V Иллидари#! недействительны"
 create_union_universal_dragon_forces_trigger_tt: "Триггеры фракции #V Драконьих стай#! недействительны"
 create_union_universal_scourge_forces_trigger_tt: "Триггеры фракции #V Плеть#! недействительны"
 create_union_universal_axis_of_awful_trigger_tt: "Триггеры фракции #V Ось ужаса#! недействительны"

 join_universal_union: "Присоединиться к фракции"
 join_universal_union_desc: "$create_union_universal_desc$"
 join_universal_union_tooltip: "Отправить гонца к [Concept( 'union_leader', 'лидеру фракции' )|E] с просьбой о принятии во [Concept( 'union', 'фракцию' )|E]"
 join_universal_union_confirm: "Отправить гонца"

 leave_universal_union: "Покинуть фракцию"
 leave_universal_union_desc: "Мы больше не нуждаемся в союзниках. Наш народ в состоянии защитить себя сам."
 leave_universal_union_tooltip: "Вы покинете текущую [Concept( 'union', 'фракцию' )|E]"
 leave_universal_union_confirm: "Отправить гонца"

 begin_totem_creation: "Стать Храбрецом"
 begin_totem_creation_desc: "Я всегда [Select_CString(ROOT.Char.IsFemale, 'очущала', 'очущал' )] сильную связь с нашей культурой, и я хочу почтить её, став тауренским Храбрецом. Храбрец - это не просто титул, выражающий уважение, это отражение силы, мужества и мудрости. Чтобы стать Храбрецом, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] преодолеть несколько испытаний, чтобы проверить разум, тело и дух под руководством служителя духов."
 begin_totem_creation_tooltip: "Начать путешествие, чтобы стать Храбрецом"
 begin_totem_creation_confirm: "Время пришло, я [Select_CString(ROOT.Char.IsFemale, 'готова', 'готов' )]"

 attack_wailing_caverns: "Осадить Пещеры Стенаний"
 attack_wailing_caverns_desc: "Эбру, ночная эльфийка-друид, убедила меня присоединиться к ней в опасном походе, чтобы спасти Наралекса, своего наставника, от Кошмара в Пещерах Стенаний. Она говорит, что действовать нужно быстро, пока его сны не обрушили на мир катаклизм."
 attack_wailing_caverns_tooltip: "Попытайтесь пробудить Наралекса от кошмара с помощью Эбру, чтобы предотвратить грядущий кризис со стороны друидов-змей."
 attack_wailing_caverns_confirm: "Созвать совет"

 wc_valid_light_faith_for_northshire_trigger_tt: "[THIS.Char.GetFaith.GetName] исповедует [GetReligionByKey('tyrism_religion').GetAdjective] [religion|E] и чтит её традиционные ценности"
 wc_at_war_against_crisis_trigger_tt: "Ведёт оборонительную войну против крупного кризиса, угрожающего королевству"

 develop_the_undercity: "Развивать Подгород"
 develop_the_undercity_desc: "Город Лордерон был опустошён Плетью. Однако расположенная под ним огромная канализационная система, известная как Подгород, всё ещё цела и может служить отличной оборонительной позицией и правительственным центром."
 develop_the_undercity_tooltip: "Перенести столицу под землю"
 develop_the_undercity_confirm: "Перенести столицу под землю"
 develop_the_undercity_effects: "Строительство Подгорода завершится через два года."

 restore_empire_of_zul_decision: "Восстановить империю Зул"
 restore_empire_of_zul_decision_desc: "Могущественный союз пяти [GetTrait('creature_troll').GetName(ROOT.Char)]ских племён, объединённых под руководством Зандалара, империя и её подданные доблестно сражаются против всех, кто угрожает обычаям нашего народа. И хотя прошло несколько тысяч лет после падения нашей великой империи, мы восстанем и снова добьёмся своего превосходства."
 restore_empire_of_zul_decision_confirm: "Моя восстановит империя!"
 restore_empire_of_zul_decision_tt: "#V Империя Зул#! будет восстановлена"
 create_empire_of_zul_titles_tt: "Все прочие [GetTrait('creature_troll').GetName(GetPlayer.MakeScope.Char)]ские [empires|El], принадлежащие вам, будут уничтожены, а королевства станут [de_jure|El] частью империи Зул."
 swear_fealty_to_zul_decision: "Поклясться в верности империи Зул"
 swear_fealty_to_zul_decision_desc: "Увы, наша могущественная империя восстановлена. Хотя я не буду править ею [Select_CString(ROOT.Char.IsFemale, 'сама', 'сам' )], я могу присягнуть империи на верность и внести свой вклад в развитие народа троллей."
 swear_fealty_zul_tt: "Вы поклянётесь в верности империи Зул."
 integrate_title_zul_tt: "Интегрировать новые [empires|El] в империю Зул"
 integrate_into_zul_decision: "Интегрировать Зулианские империи"
 integrate_into_zul_decision_desc: "Как [Select_CString(ROOT.Char.IsFemale, 'императрица', 'император' )] Зул, я правлю землями нашего народа. Поскольку я [Select_CString(ROOT.Char.IsFemale, 'присоединила', 'присоединил' )] новую империю троллей, я [Select_CString(ROOT.Char.IsFemale, 'должна', 'должен' )] решить, перейдёт ли она под власть империи Зул или останется сама по себе."
 integrate_into_zul_decision_confirm: "Все тролли объединятся под властью #V империи Зул#!"

 enforce_the_brotherhood_decision: "Созвать Братство"
 enforce_the_brotherhood_decision_desc: "Когда наши неустанные враги наступают, настало время мобилизовать Братство Североземья. Мы превратим этих верных последователей в воинов и боевых клириков, готовых защищать нашу землю и нашу веру. В нашем решимости и силе не должно быть сомнений, пока враг стоит у наших врат."
 brotherhood_northshire_destroyed: "Братство Североземья уничтожено"
 enforce_the_brotherhood_decision_tooltip: "Сформировать орден воинов, преданных защите нашей веры и государства"
 enforce_the_brotherhood_decision_confirm: "К оружию, во имя [GetFaithByKey('holy_light').HighGodName]!"

 form_the_silver_hand_decision: "Учредить Орден Серебряной Длани"
 form_the_silver_hand_decision_desc: "После падения Братства Североземья Свет даровал нам выбор. Отомстим ли мы за павших братьев и объединимся как паладины Святого Света, или позволим их жертве оказаться напрасной? Мы последуем за Светом и обратим наше оружие в орудие правосудия и возмездия, чтобы искоренить зло по всему Азероту."
 form_the_silver_hand_decision_northshire_stay_desc: "Свет ставит перед нами судьбоносный выбор. Объединимся ли мы как паладины Святого Света, приняв своё предназначение хранителей правосудия и борцов со злом по всему Азероту? Ведомые Светом, мы призваны стать его чемпионами, обращая свою мощь в орудие справедливости и защиту мира. Это наш шанс объединиться под единым знаменем, чтобы силы добра восторжествовали над тенями, стремящимися поглотить наш мир."
 form_the_silver_hand_decision_tooltip: "Отомстить за павших братьев и продолжить их миссию по защите нашей веры и государства"
 form_the_silver_hand_decision_confirm: "Слава, Честь, К бою!"

 # Create the Empire of Pandaria
 create_pandaria_decision.t.mogu: "Возродить империю Могу"
 create_pandaria_decision.t.pandaren: "Объединить Пандаренскую империю"
 create_pandaria_decision.t.neutral: "Воссоединить Пандарию"
 create_pandaria_decision.desc.mogu: "Много веков назад континент Пандария был объединён под властью великой [Concept( 'empire', 'империи' )|E] #L [GetTrait('creature_mogu').GetName( GetNullCharacter )]#!. Старое королевство, созданное могущественным [Concept( 'thunder_king', 'Властелином Грома' )|E], управлялось силой, и наш народ поработил низшие расы. Мы воздвигли великие творения и тысячелетиями сокрушали всех, кто выступал против нас. Но все может быть восстановлено, если нам удастся уничтожить наших врагов и вновь объединить континент."
 create_pandaria_decision.desc.pandaren: "Десять тысяч лет назад континент Пандария был объединён под властью #L [GetTrait('creature_pandaren').GetName( GetNullCharacter )]ской#! [Concept( 'empire', 'империи' )|E], во главе которой стояло центральное правительство. Но после исчезновения последнего императора, Шаохао, государство распалось, и власть перешла на местный уровень. Если мы отвоюем достаточно большую часть континента, Пандария сможет вновь стать единым целым, чтобы противостоять надвигающимся угрозам."
 create_pandaria_decision.desc.neutral: "Десять тысяч лет назад континент Пандария был объединен под властью великой [Concept( 'empire', 'империи' )|E]. Это время давно прошло, но если мы объединим достаточно большую часть континента, то, возможно, сможем объединить его снова."
 create_pandaria_decision_thunder_king_defeated_tt: "[thunder_king|E] не может владеть титулом [GetTitleByKey('e_pandaria_empire').GetName]"
 create_pandaria_decision_tt: "Вы воссоедините Пандарию под своей властью"
 create_pandaria_decision_dejure_tt: "Ваша новая [empire|El] будет включать в себя территории следующих держав: [GetTitleByKey('e_kun_lai').GetName], [GetTitleByKey('e_yulin').GetName] и [GetTitleByKey('e_banshan').GetName]"
 create_pandaria_decision_shekmag_tt: "Если вы контролируете эти земли, ваша новая [empire|El] также включит в себя территории державы [GetTitleByKey('e_shekmag').GetName]"
 create_pandaria_decision_confirm: "Пандария вновь воссоединилась."

 # Resurrect Lei Shen the Thunder King
 revive_lei_shen_decision: "Возродить Властелина Грома"
 revive_lei_shen_decision_desc: "Глубоко в Гробнице Завоевателей лежит тело [Concept( 'thunder_king', 'Властелина Грома' )|E] Лэй Шэня, величайшего [GetTrait('creature_mogu').GetName( GetNullCharacter )] из всех. Он убивал королей и богов, придавал форму плоти и основал [Concept( 'empire', 'империю' )|E] Могу. Когда он умер, его тело вместе с его войском было упокоено в Гробнице Завоевателей, расположенной глубоко во владении [GetTitleByKey('c_lushat_lan').GetNameNoTier]. Но легенды гласят о тайном ритуале его возрождения во владении [GetTitleByKey('c_shangoalor').GetNameNoTier], известном только нашим древним союзникам - троллям Зандалара. Возможно, наконец-то пришло время воскресить его, чтобы он возвестил начало новой эры господства Могу."
 revive_lei_shen_decision_tooltip: "Возрождённый Лэй Шэнь, [GetTrait('thunder_king').GetName(GetNullCharacter)], вновь возглавит [GetTrait('creature_mogu').GetName( GetNullCharacter )]."
 revive_lei_shen_decision_confirm: "Мы пробудим бурю."
 revive_lei_shen_decision_isle_of_thunder_tt: "Вы [Concept( 'completely_control', 'полностью контролируете' )|E] [GetTitleByKey('k_lei_dao').GetNameNoTier], древнюю резиденцию Властелина Грома."
 revive_lei_shen_decision_valley_of_emperors_tt: "Вы [Concept( 'completely_control', 'полностью контролируете' )|E] [GetTitleByKey('d_howlingwind').GetNameNoTier], гробницу Властелина Грома, где всё ещё покоится его тело."
 revive_lei_shen_decision_isle_of_reckoning_tt: "Вы [Concept( 'completely_control', 'полностью контролируете' )|E] [GetTitleByKey('c_shangoalor').GetNameNoTier], где будет проведён ритуал воскрешения."
 revive_lei_shen_decision.tt: "Вы лишитесь всех ваших [Concept( 'titles', 'титулов' )|E] уровня [Concept( 'empire', 'империй' )|E], а также всех титулов в пределах области [GetTitleByKey('k_lei_dao').GetName] в пользу вашего нового [Concept( 'liege', 'сюзерена' )|E]"
 you_can_play_lei_shen.tt: "У вас будет возможность переключиться на Лэй Шэня"
 TRUCE_THUNDER_KING: "Перемирие подписано после того, как [reviver.GetTitledFirstName] [Select_CString(reviver.IsFemale, 'воскресила', 'воскресил' )] персонажа [lei_shen.GetTitledFirstName]"
 TRUCE_MANTID: "Перемирие подписано, потому что [lei_shen.GetTitledFirstName] был недавно воскрешён."
 lei_shen_negotiate_alliance_effect_tooltip: "Мы заключили [alliance|El]"

 lei_shen_elite_army_name: "Щит Императора"
 lei_shen_troll_army_name: "Вспомогательные войска Зандалара"
 lei_shen_standard_army_name: "Воинство могу"

 # Resurrect Lei Shen the Thunder King - Zandalari Version
 zandalari_lei_shen_decision: "$revive_lei_shen_decision$"
 zandalari_lei_shen_decision_desc: "Давным-давно зандалары были союзниками Лэй Шэня, могущественного [Concept( 'thunder_king', 'Властелина Грома' )|E] [Concept( 'empire', 'империи' )|E] [GetTrait('creature_mogu').GetName( GetNullCharacter )]. Перед смертью он поделился с нами великим секретом своего воскрешения. Возможно, настало время вновь пробудить Властелина Грома и возобновить наш древний договор с могу из Пандарии."
 zandalari_lei_shen_decision_tooltip: "$revive_lei_shen_decision_tooltip$"
 zandalari_lei_shen_decision_confirm: "Собирается новая буря."
 zandalari_lei_shen_decision.tt: "Вы лишаетесь всех [Concept( 'titles', 'титулов' )|E] в пределах Пандарии в пользу [Concept( 'thunder_king', 'Властелина Грома' )|E]."

 build_cosmic_observatory_decision: "Построить комическую обсерваторию"
 build_cosmic_observatory_decision_desc: "Многие авторы эльфийской литературы призывают нас не заглядывать слишком глубоко в тайны Круговерти Пустоты. Однако многие не видят правды: наш народ ограничен нашей зависимостью от Солнечного Колодца, и мы должны заглянуть вдаль, чтобы найти безопасные источники энергии, дабы продолжить процветать, если случится худшее."
 build_cosmic_observatory_decision_tooltip: "Дальнейшие эльфийские исследования с помощью грандиозной обсерватории"
 build_cosmic_observatory_decision_confirm: "Найти подходящее место слияния Лей-линий!"
 cant_be_hof: "Вы не должны быть [Concept( 'head_of_faith', 'главой конфессии' )|E]"

 invade_scourge_quelthalas_decision: "Судьба Кель'Таласа"
 invade_scourge_quelthalas_decision.desc: "Ледяная Скорбь, проклятый клинок, говорит со мной. Безжалостный голос [GetTrait('lich_king').GetName(GetNullCharacter)] звучит в голове, заглушая собственные мысли.\n\n[GetTrait('lich_king').GetName(GetNullCharacter)] велит мне двинуться на великий эльфийский город Кель'Талас и захватить [GetTitleByKey('c_sunwell_plateau').GetName], магический источник силы Высших эльфов."
 invade_scourge_quelthalas_decision_tt: "Продвинуть историю Третьей Войны."
 invade_scourge_quelthalas_decision_confirm: "Во имя Короля-Лича."
 scourge_quelthalas_decision_effect.tt: "Вассалам [GetTitleByKey('k_quelthalas').GetName] будет направлен ультиматум, дарующий им возможность предать своего сюзерена и добровольно служить [GetTrait('lich_king').GetName(GetNullCharacter)].\nЕсли они осмелятся не внять зову [GetTrait('lich_king').GetName(GetNullCharacter)], ты объявишь войну [GetTitleByKey('k_quelthalas').GetName] во имя [GetTrait('lich_king').GetName(GetNullCharacter)], дабы захватить и осквернить [GetTitleByKey('c_sunwell_plateau').GetName].\nПосле осквернения Солнечного Колодца Кел'Тузад будет возрождён как [GetTrait('being_undead').GetName(GetNullCharacter)]–лич и присоединится к твоему двору."

 resurrect_kelthuzad_decision: "Воскрешение некроманта"
 resurrect_kelthuzad_decision_desc: "Чтобы призвать армии Пылающего Легиона, нам понадобится могущественный заклинатель для проведения ритуала. Моей рукой будет назначен час его возрождения."
 resurrect_kelthuzad_decision_tt: "Продвинуть события Третьей Войны и осквернение Солнечного Колодца."
 resurrect_kelthuzad_decision_effect_tt: "Ты осквернишь [GetTitleByKey('c_sunwell_plateau').GetName], магический источник силы Высших эльфов.\n"
 resurrect_kelthuzad_decision_confirm: "Во имя Короля-Лича!"

 # Thorium Brotherhood
 thorium_invite_craftsmen_decision: "Пригласить мастеров из Братства Тория"
 thorium_invite_craftsmen_decision_desc: "Братство Тория объединяет множество исключительно талантливых ремесленников, а кузнецы Братства считаются одними из лучших в истории Азерота. Используя созданные или добытые формулы, они куют зачарованное оружие и доспехи для любого, кто способен оплатить их непомерные цены."
 thorium_no_dark_pluralism_trigger.tt: "Либо [GetTitleByKey('c_chiselgrip').GetName], либо [GetTitleByKey('c_drognur').GetName] должно принадлежать персонажу, чья [faith|E] не содержит [doctrine|E] $doctrine_pluralism_dark_name$."
 thorium_invite_craftsmen_decision.tt: "Отправить письмо-приглашение членам гильдии ремесленников."
 thorium_invite_craftsmen_decision_effect.tt: "В твой двор прибудет мастер из Братства Тория, давший доступ к артефактам высокого качества и бонусам графства."
 thorium_invite_craftsmen_decision_confirm: "Отправить гонца."

 # Suramar
 lower_suramar_barrier_decision: "Снять Чародейский Барьер"
 lower_suramar_barrier_decision_desc: "На протяжении тысяч лет [GetTitleByKey('k_suramar').GetName] был отрезан от остального мира.\n\nЭто было сделано, чтобы защитить наш народ от разрушений Раскола. Но теперь мы видим, что за пределами наших земель жизнь продолжается. Пора снизить барьер и воссоединиться с остальным Азеротом."
 lower_suramar_barrier_decision_tooltip: "Снять барьер вокруг [GetTitleByKey('k_suramar').GetName]"
 lower_suramar_barrier_decision_confirm: "Барьер должен пасть."
 lower_suramar_barrier_decision_tt: "Барьер вокруг [GetTitleByKey('k_suramar').GetName] будет снят, и ты сможешь взаимодействовать с другими державами."
 lower_suramar_barrier_decision_tt_modifier: "Каждое [county|E] в [GetTitleByKey('k_suramar').GetName] потеряет [GetModifier('wc_suramar_isolated_modifier').GetNameWithTooltip]"
 lower_suramar_barrier_decision_trigger: "У тебя должна быть причина снять барьер, например вмешательство извне."

 restore_arcandor_decision: "Восстановить древо Аркан'дор"
 restore_arcandor_decision_desc: "Древо маны, известное как Аркан'дор, некогда росло в сердце Фаланаара. Оно было источником великой силы, освобождая некоторых эльфов от власти Ночесвета, но не пережило взрыв.\n\nЭльфы, искажённые взрывом, стали [GetTrait('creature_faldorei').GetName(ROOT.Char)]. А эльфы, известные как [GetTrait('wretched').GetName(ROOT.Char)], страдают от недостатка маны и могут исцелиться лишь плодами Аркан'дора."
 restore_arcandor_decision_trigger: "У тебя должна быть причина восстановить Аркан'дор."
 restore_arcandor_decision_tooltip: "Восстановить древо Аркан'дор во Фаланааре."
 restore_arcandor_decision_confirm: "Аркан'дор восстанет вновь."
 decision_group_type_suramar: "Решения Сурамара"
 has_arcandor_seed_trigger_tt: "У тебя есть [arcandor_seed|E]"
 game_concept_arcandor_seed: "$arcandor_seed_name$"
 game_concept_arcandor_seed_desc: "$arcandor_seed_desc$"
 restore_arcandor_decision_wretched_tt: "Каждый эльф с признаком [GetTrait('wretched').GetName(GetPlayer.MakeScope.Char)] сможет посетить древо и #bold излечиться#! от проклятия.\n$BULLET$[GetTrait('creature_faldorei').GetName(GetPlayer.MakeScope.Char)] сможет посетить древо и получить дар."

 decision_group_type_elven: "Решения эльфов"
 visit_the_arcandor_decision: "Посетить древо Аркан'дор"
 visit_the_arcandor_decision_desc: "Древо Аркан'дор было восстановлено во Фаланааре. Говорят, его плоды способны излечить [GetTrait('wretched').GetName(ROOT.Char)] и даровать силу [GetTrait('creature_faldorei').GetName(ROOT.Char)]. Пока я не иссох и не угас, необходимо посетить древо и отведать его плодов."
 visit_the_arcandor_decision_effect_tt: "Я отправлюсь в [GetTitleByKey('c_meredil').GetNameNoTier] и посещу древо Аркан'дор."
 visit_the_arcandor_decision_tooltip: "Посетить древо Аркан'дор в [GetTitleByKey('c_meredil').GetNameNoTier]"
 visit_the_arcandor_decision_confirm: "Да исцелятся мои недуги."

 # Amani war
 amani_destruction_of_quelthalas: "Вернуть земли Амани у Эльфов"
 amani_destruction_of_quelthalas_desc: "Спустя тысячелетия эльфийского владычества мы наконец одолели их! После долгой борьбы мы можем возвестить возрождение наших земель!"
 amani_destruction_of_quelthalas_tooltip: "Официально возвращает земли Амани у Эльфов"
 amani_destruction_of_quelthalas_confirm: "Вернём нашу землю у этих захватчиков!"

 become_crisis_decision: "Стать Кризисом"
 become_crisis_decision_desc: "Слишком долго я был всего лишь [ROOT.Char.GetTitleAsNameNoTooltip]. Настало время подняться над мелочными распрями держав и стать силой, с которой придётся считаться.\n\nМногие угрожали нашей родине, и мы доблестно их побеждали. Теперь моя очередь стать угрозой."
 become_crisis_decision_tooltip: "Стать [crisis|E] и объединить Азерот под своим знаменем."
 become_crisis_decision_confirm: "К оружию!"

 become_crisis_decision_tt: "#warning;bold Ты станешь [crisis|E]. Азерот объединится под твоим знаменем или будет сокрушён твоими войсками.#!\n$BULLET$Получаешь доступ к [great_invasion_casus_belli|E]\n$BULLET$Каждый [ally|E] сможет выбрать — присоединиться к тебе или столкнуться с твоим гневом\n$BULLET$Правители будут чаще соглашаться на твои [Concept('offer_vassalization', 'предложения вассалитета')|E]\n$BULLET$Правители объединятся в [coalition|E] против тебя"
 become_crisis_path_tt: "Ты сможешь #bold усилить#! свой [crisis|E]:\n$BULLET$Возвеличить свою [wc_race|E]\n$BULLET$Распространить свою [faith|E]\n$BULLET$Сохранить свою [Concept('dynasty_prestige', 'наследие')|E]"
 become_crisis_end_tt: "Твоё восхождение завершится, если случится одно из следующих событий:\n$BULLET$Твой [primary_title|E] будет уничтожен\n$BULLET$#V 25%#! Азерота окажется под твоей властью (сейчас [root_scope.MakeScope.ScriptValue('counties_controlled_percentage_value')|V0%])\n$BULLET$Ты умрёшь"

 player_features: "$BULLET$Доступ к [great_invasion_casus_belli|E]\n$BULLET$Повышенное согласие на [Concept('offer_vassalization', 'предложения вассалитета')|E]\n\nОдно из следующих:\n$BULLET$Возвеличить свою [wc_race|E]\n$BULLET$Распространить свою [faith|E]\n$BULLET$Сохранить своё [Concept('dynasty_prestige', 'наследие')|E]"

 crisis_self_modifier: "Азерот-Разрушитель"
 crisis_self_modifier_desc: "Азерот, твой народ узнает моё имя."

 decision_group_type_class: "Классовые решения"

 become_a_demon_hunter_decision: "Стать охотником на демонов"
 become_a_demon_hunter_decision_desc: "«Вы… не были готовы. В наш мир явился враг, жаждущий лишь уничтожить всё живое. Он убил наших близких. Он разорил наши дома, наши города и наши святыни. Вы пытались его остановить… и потерпели неудачу. И тогда вы пришли ко мне — от вас остались лишь ярость и решимость. И вы узнали, что то, что некогда терзало вас, может даровать силу. Теперь вы видите, что нет жертвы слишком великой, если она принесёт конец Пылающему Легиону»."
 become_a_demon_hunter_decision_confirm: "Есть лишь один путь победить демонов..."
 become_a_demon_hunter_decision_tooltip: "Ты получаешь признак [GetTrait('demon_hunter').GetName(GetNullCharacter)]"
 a_demon_is_imprisoned_by_you: "Тебе удалось заключить в тюрьму [GetTrait('being_demon').GetName(GetNullCharacter)]"

 embrace_the_demon_within: "Принять демона внутри"
 embrace_the_demon_within_desc: "Стремиться к самой демонической из форм ради силы — безрассудно. Но мы прошли слишком далеко и принесли слишком много жертв, чтобы остановиться сейчас. Единственный риск в том, что демон внутри может попытаться захватить контроль…"
 embrace_the_demon_within_confirm: "Несдерживаемая мощь"
 embrace_the_demon_within_tooltip: "Вы получаете признак [GetTrait('metamorphosis').GetName(GetNullCharacter)]"
 demon_hunter_atleast_has_one_thing_maxxed_out: "У вас максимальный опыт хотя бы в одной из ветвей признака [GetTrait('demon_hunter').GetName(GetNullCharacter)]."
 demon_has_offered_power_to_demon_hunter: "Демон, слившийся с вами, предлагает даровать вам силу."

 form_the_scarlet_crusade_decision: "Создать Алый Орден"
 form_the_scarlet_crusade_decision_desc: "Немощные и ослабленные паладины [GetTitleByKey('k_order_of_the_silver_hand').GetName] едва держатся на плаву, заключая хрупкие союзы в отчаянной попытке вернуть утраченную славу. Аргентцы ничем не лучше — их ослепляет ложное милосердие, и они открыто водятся с нечистыми и слабыми, мечущимися как крестьяне в поисках искупления, которого им не сыскать. Лишь Алый Крестовый поход остаётся несвершённым порчей. Лишь он неуклонен в своём предназначении. Несокрушим в вере. Мы обладаем силой, чтобы защитить отчаявшихся от Плети и даровать праведную месть тем, кто принесёт клятву служения нашему Святому делу. Мы истинные наследники Света — его чистейшие клинки, воплощённые в плоти. И всякий, кто встанет против нашей святой миссии, даже те, кого мы когда-то называли друзьями, будет очищен обжигающим пламенем Святого Огня."
 form_the_scarlet_crusade_decision_confirm: "Алый Крестовый поход восстаёт"
 form_the_scarlet_crusade_decision_tooltip: "Время проклятым стать добычей"
 scarlet_crusade: "Элитные воины Алого Ордена"

 form_the_scarlet_onslaught_decision: "Гнев Алых"
 form_the_scarlet_onslaught_decision_desc: "За каждым очищённым нежитью встают двое новых. Пока Плеть связана со своим тёмным хозяином, она будет разрастаться, пожирая павших. Архитектор этой нечестивой заразы — создатель гибели Лордерона, [GetTrait('lich_king').GetName(GetNullCharacter)], — должен быть низвергнут, иначе поток смерти не иссякнет. Если отсечь голову, тело увянет. Ради этого мы соберём самых отважных, чистых сердцем и сильных духом, и отправимся в ледяные пустоши Нордскола. Там, у Ледяного Трона, на осквернённой земле, мы встретимся с источником этого порождения тьмы — и положим ему конец раз и навсегда."
 form_the_scarlet_onslaught_decision_confirm: "Алое Наступление начинается"
 form_the_scarlet_onslaught_decision_tooltip: "Охота на творца нечестивой заразы"
 is_there_a_lich_king: "Существует ли сейчас [GetTrait('lich_king').GetName(GetNullCharacter)]?"
 spiritual_head_of_faith_for_scarlets: "Вы создаёте [head_of_faith|E]–[title|E] для скарлетизма."

 raise_a_new_hearthglen_decision: "Возвести собственный Приют"
 raise_a_new_hearthglen_decision_desc: "Долгим и тяжёлым путём мы пересекли огромные воды, чтобы завоевать колонию [GetTitleByKey('c_moaki').GetName]. Мы вырвали [GetTitleByKey('d_moaki').GetName] из рук #italic тварей #!, живших здесь. Теперь, потами и трудами, мы воздвигнем Новый Приют! Он станет нашей столицей и символом нашего пылающего рвения!"
 raise_a_new_hearthglen_decision_tt: "Строительство Нового Приюта займёт несколько лет."
 raise_a_new_hearthglen_decision_confirm: "Пусть строительство начнётся"
 raise_a_new_hearthglen_decision_tooltip: "Услышьте наш рык!"

 form_the_argent_dawn_decision: "Создать Серебряный Рассвет"
 form_the_argent_dawn_decision_desc: "Паладины [GetTitleByKey('k_order_of_the_silver_hand').GetName] стоят на грани гибели, тогда как Алый Орден творит разрушения под маской праведности. Эти фанатики обращают клинки против собственных братьев и карают невинных в эпоху падения веры и смертельной угрозы. Но мы не обязаны быть такими же. Мы будем помогать бедным. Мы поднимем страждущих. Мы станем оплотом всего праведного — и бросим вызов всему порочному. Новый #italic Рассвет #!взойдёт над Лордероном…"
 form_the_argent_dawn_decision_confirm: "Серебряный Рассвет наступил"
 form_the_argent_dawn_decision_tooltip: "Мы дадим силу всем и бросим вызов пороку"
 temporal_head_of_faith_for_argents: "Вы создаёте [head_of_faith|E]–[title|E] для аргентизма."
 argent_crusade: "Воины Серебряного Рассвета"

 liberate_lordaeron_from_the_scourge_decision: "Воссоздать Королевство Лордерон"
 liberate_lordaeron_from_the_scourge_decision_desc: "[GetTitleByKey('d_lordaeron').GetName] освобождён от гнусных лап Плети! С нежитью, ослабленной нашими праведными победами, настало время вернуть себе всю [GetTitleByKey('k_lordaeron').GetName] и назначить нового правителя, который будет хранить королевство и его народ."
 liberate_lordaeron_from_the_scourge_decision_confirm: "Да приидет царствие Твоё"
 liberate_lordaeron_from_the_scourge_decision_tooltip: "Час освобождения настал!"

 restore_the_queldorei_rule_decision: "Восстановить империю Квел'дорай"
 restore_the_queldorei_rule_decision_desc: "Десять тысяч лет назад... мы, Высокорождённые, жили здесь в достатке. Мы стояли выше прочих ночных эльфов. Наши нужды утолялись магией и богатством, мы предавались утехам, развлечениям и жадности... Настал час вновь преподать кал'дорай заслуженный урок и вернуть себе место верховных правителей всего эльфийского рода!"
 restore_the_queldorei_rule_decision_confirm: "Воле Азшары да свершиться!"
 restore_the_queldorei_rule_decision_tooltip: "Сможешь ли ты вернуть Высокорождённым былую славу? Или ты готов превзойти мощь Королевы Азшары?"
 restore_the_queldorei_rule_decision_tt: "Мир содрогнётся перед твоей мощью!.. Но какими силами ты готов воспользоваться и чем готов пожертвовать?"

 reintegrate_shendralar_into_kaldorei_decision: "Исцелить раскол Шен'дралар"
 reintegrate_shendralar_into_kaldorei_decision_desc: "Долгие века Шен'дралар пребывали в изоляции от нас, и мы изгнали их из общества Ночных Эльфов за злоупотребление магией Тайн. Возможно, пришла пора отложить разногласия и вновь проявить терпимость к Высокорождённым? Хотя... Син'дорай не одобрят подобного шага..."
 reintegrate_shendralar_into_kaldorei_decision_confirm: "Приветствуем Высокорождённых"
 reintegrate_shendralar_into_kaldorei_decision_tooltip: "Пришло время воссоединить общество Ночных Эльфов"
 shendralar_and_kaldorei_cultures_are_united_desc: "Наши культуры объединились!"
 sindorei_and_kaldorei_cultures_are_united_desc: "Обидел Син'дорай, сблизившись с Квел'дорай"

 legacy_of_defias_brotherhood_decision: "Отомстим за братьев наших"
 legacy_of_defias_brotherhood_decision_desc: "Опора дворянской власти пала. Их армии разгромлены, и час настал! Мы заставим их заплатить долги, что они перед нами имеют... или последствия для них будут ужасны..."
 legacy_of_defias_brotherhood_decision_confirm: "Решить участь Дворянства"
 legacy_of_defias_brotherhood_decision_tooltip: "День суда над надменными Дворянами настал!"
 legacy_of_defias_brotherhood_decision_tt: "Довершим ли мы начатое? Или же заслуживаем большей награды за наши усилия?"

 remake_the_orcish_horde_decision: "Возжечь заново очаги Орды"
 remake_the_orcish_horde_decision_azeroth_desc: "Старые земли, куда Орда впервые высадилась в новом мире, возвращены! Настал час объединить кланы под одним знаменем и вернуть наши исконные земли."
 remake_the_orcish_horde_decision_kalimdor_desc: "Пусть это и новый мир, мы окружены множеством опасностей, и наша безопасность на этих землях всегда под угрозой... Нам нужно вновь объединить кланы под одним знаменем, если мы хотим, чтобы эти земли по праву были нашими."
 remake_the_orcish_horde_decision_fallback_desc: "Может быть, однажды и мы, орки, сможем мечтать о воссоединении Орды?"
 remake_the_orcish_horde_decision_confirm: "Закрепим права!"
 remake_the_orcish_horde_decision_tooltip: "Возвращение Вождя!"

 build_orgrimmar: "Возвести столицу"
 build_orgrimmar_desc: "Войны, испытания и невзгоды... [GetTrait('creature_orc').GetName(GetNullCharacter)]ы претерпели слишком многое, чтобы найти место, по праву именуемое домом. Выбран идеальный клочок земли, ресурсы собраны, а собратья-[GetTrait('creature_orc').GetName(GetNullCharacter)] готовы трудиться ради будущего нашего рода. Время пришло."
 build_orgrimmar_confirm: "Зуг зуг!"
 build_orgrimmar_tooltip: "Чё надо сделать? Пеон готов!"
 will_take_time_to_build_orgrimmar: "На возведение новой столицы уйдёт немало лет."

 create_gilnean_empire_decision: "Возродить Великий Гилнеас"
 create_gilnean_empire_decision_desc: "Было время в далёком прошлом, когда народы Гилнеаса и Кул'Тираса были едины. Это время может вернуться вновь, и на этот раз — под предводительством одного правителя."
 create_gilnean_empire_decision_tooltip: "Гилнеас становится [de_jure|E] [empire|E]"
 create_gilnean_empire_decision_effects_de_jure_tt_a: "Если [kingdom|E] удерживается, следующие [kingdoms|E] станут [de_jure|E] частью [gilnean_gilneas_empire.GetNameNoTier]:\n[gilnean_kul_tiras.GetNameNoTier], [gilnean_tol_barad.GetNameNoTier], [gilnean_hillsbrad.GetNameNoTier], [gilnean_dustwallow.GetNameNoTier], [gilnean_mechagon.GetNameNoTier], [gilnean_plunder_isle.GetNameNoTier], [gilnean_valsharah.GetNameNoTier]"
 create_gilnean_empire_decision_effects_de_jure_tt_b: "Все [duchies|E] в $custom_greater_gilneas$ становятся [de_jure|E] частью [gilnean_gilneas.GetNameNoTier] или остаются в составе своего нынешнего [kingdom|E], если вы владеете им"
 create_gilnean_empire_decision_confirm: "От моря до моря, вновь."

 restore_arathor_decision: "Восстановить Аратор"
 restore_arathor_decision_desc: "Слишком долго [kingdoms|E] Аратора, [GetTrait('creature_human').GetName(ROOT.Char)]ические, были раздроблены. Настал час вернуть нашу былую славу. #EMP Мне#!."
 restore_arathor_decision_tt: "Учредить [GetTitleByKey('h_arathor').GetName] как ваш [primary_title|E]"
 restore_arathor_decision_confirm: "$restore_arathor_decision$"

 realm_controls_enough_noor_counties_desc: "Вы контролируете [EmptyScope.ScriptValue('dar_al_noor_religion_county_control_value')|V0%] всех [counties|E] [GetReligionByKey('noor_religion').GetAdjective]: [root_scope.MakeScope.ScriptValue('noor_required_county_number_value')|V0] #weak ([root_scope.MakeScope.ScriptValue('noor_controlled_county_number_value')|V0])#!"

 invade_gnomeregan_decision: "Расследовать странные звуки"
 invade_gnomeregan_decision.desc: "Во время прокладки новых тоннелей наш народ стал слышать странные звуки, доносящиеся из глубин земли. Эти звуки явно не были естественными."
 invade_gnomeregan_decision_tt: "Это начнёт вторжение в Гномреган."
 invade_gnomeregan_decision_effect.tt: "Мы попытаемся добраться до источника этих странных звуков."
 invade_gnomeregan_decision_confirm: "Отправить разведчиков"

 spread_radiation_decision: "Распространить радиацию"
 spread_radiation_decision.desc: "Выпуская радиацию среди наших же людей, мы можем упрочить благословение Сияния."
 spread_radiation_decision_tt: "Это подвергнет ваш двор воздействию радиации."
 spread_radiation_decision_effect.tt: "Ваши придворные облучатся."
 spread_radiation_decision_confirm: "Выпустить радиацию"

 gnomeregan_rebuilding_efforts_decision: "Восстановить Гномреган"
 gnomeregan_rebuilding_efforts_decision.desc: "Начать восстановительные работы в окрестностях Гномрегана."
 gnomeregan_rebuilding_efforts_decision_tt: "Это поможет вновь сделать окрестности Гномрегана пригодными для жизни."
 gnomeregan_rebuilding_efforts_decision_effect.tt: "Это уменьшит ущерб, причинённый Сикко."
 gnomeregan_rebuilding_efforts_decision_confirm: "Приступить к работе"

 operation_gnomeregan_decision: "Операция «Гномреган»"
 operation_gnomeregan_decision.desc: "Пришло время отбить нашу бывшую столицу из рук Сикко и его прокажённых гномов."
 operation_gnomeregan_decision_tt: "Мы начнём операцию по освобождению Гномрегана."
 operation_gnomeregan_decision_effect.tt: "Это поможет нам вернуть Гномреган."
 operation_gnomeregan_decision_confirm: "Начать операцию"

 summon_burning_legion_decision: "Призвать Пылающий Легион"
 summon_burning_legion_decision_desc: "[frostmourne|E] шепчет, и слуга [GetTrait('lich_king').GetName(GetNullCharacter)] манит меня. Смысл существования [scourge|E] вот-вот будет оправдан."
 summon_burning_legion_decision_tooltip: "Начать приготовления"
 summon_burning_legion_decision_confirm: "Начало конца"
 summon_burning_legion_decision.tt: "Если [GetTrait('lich_king').GetName(GetNullCharacter)] или один из его [vassal|E]ов владеет [GetTitleByKey('c_dalaran').GetName], этот титул будет передан вам, чтобы вы могли отыскать Книгу Медива. В противном случае вы вторгнетесь в [GetTitleByKey('c_dalaran').GetName]. Если вы уже владеете [GetTitleByKey('c_dalaran').GetName], то сразу перейдёте к поискам Книги Медива."

 embrace_felblood_decision: "Принять энергии Скверны"
 embrace_felblood_decision_desc: "Это единственный путь к победе..."
 embrace_felblood_decision_tooltip: "Отчаянные времена требуют отчаянных мер"
 embrace_felblood_decision_confirm: "Лок'тар огар!"
 you_are_a_fel_religion_fangirl: "Ваша вера — одна из следующих: #V Корруптизм#!, #V Саргеризм#!, #V Чёрный Жатвен#!"
 a_non_demon_hunter_demon_is_your_prisoner: "У вас в плену [GetTrait('being_demon').GetName(GetNullCharacter)] #help (это не может быть [GetTrait('demon_hunter').GetName(GetNullCharacter)])#!"
 a_non_demon_hunter_demon_is_your_liege: "У вас есть [GetTrait('being_demon').GetName(GetNullCharacter)] как [top_liege|E]/[liege|E] #help (это не может быть [GetTrait('demon_hunter').GetName(GetNullCharacter)])#!"
 demon_liege_tt: "Вы приближаетесь к своему [liege|E]..."
 demon_prisoner_tt: "Вы приближаетесь к своим застенкам..."

 become_legion_commander_decision: "Снискать благословение Саргераса"
 become_legion_commander_decision_desc: "Я доказал свою ценность! Я уже чувствую, как сила поднимается внутри меня. Время пришло — я стану слугой [burning_legion|E], как никто иной!"
 become_legion_commander_decision_enough_battle_kills: "Вы убили как минимум 20 смертных или более"
 become_legion_commander_decision_tooltip: "Трепещите, смертные!"
 become_legion_commander_decision_confirm: "Принять волю Саргераса!"

 destroy_the_world_tree: "Уничтожить Нордрассил"
 destroy_the_world_tree_desc: "Судьба настала! Свидетели конца Ночных Эльфов, вы, смертные! Последний час пробил!"
 destroy_the_world_tree_tooltip: "Теперь не будет бога, что превзойдёт меня!"
 destroy_the_world_tree_confirm: "Уничтожить Мировое Древо"
 weaker_nordrassil_being_destroyed: "Поскольку вы уничтожаете ослабленное Мировое Древо, вы получите более слабый модификатор после поглощения сил Колодца Вечности под ним."
 prime_nordrassil_being_destroyed: "Поскольку вы уничтожаете полное Мировое Древо, вы получите более сильный модификатор после поглощения сил Колодца Вечности под ним."

 restore_well_of_eternity: "Восстановить Колодец Вечности"
 restore_well_of_eternity_desc: "[Glossary( 'Well of Eternity', 'WELL_OF_ETERNITY_GLOSS' )] необходимо восстановить в определённой мере, если мы хотим стабилизировать нашу цивилизацию в Калимдоре. Лишь росток от [GetBuilding('teldrassil').GetName] достаточно могуч, чтобы вернуть ему силу и позволить природе над ним укорениться."
 restore_well_of_eternity_tooltip: "Да восстановится равновесие!"
 restore_well_of_eternity_confirm: "Анду-фалах-дор!"
 restore_well_of_eternity_tt: "Восстановлению потребуется время, чтобы укорениться и вновь даровать нам свои благословения..."

 # Separate from Zul Head of Faith
 separate_from_zul_head_of_faith_decision: "Отделиться от религиозной власти Зандалари"
 separate_from_zul_head_of_faith_decision_desc: "[ROOT.Char.GetFaith.GetReligiousHead.GetTitledFirstName] — далёкая, недостойная фигура, неспособная вести нас. Слишком долго мы позволяли Зандалари контролировать нас в делах веры! Хватит!"
 separate_from_zul_head_of_faith_decision_confirm: "Меня ведёт [ROOT.Char.GetFaith.PositiveAfterLife|U]!"
 separate_from_zul_head_of_faith_decision_tooltip: "Мы получим нового [head_of_faith|E]!"
 separate_from_zul_new_hof: "Местный жрец станет нашим новым [Concept( 'head_of_faith', 'главой конфессии' )|E]"
 separate_from_zul_new_hof_past: "[CHARACTER.GetFaith.GetReligiousHead.GetTitledFirstName] становится нашим новым [Concept( 'head_of_faith', 'главой конфессии' )|E]"
 separate_from_zul_head_of_faith_decision.cant_be_zul_prophet: "Вы ещё не являетесь [head_of_faith|E] вашей [faith|E]"
 separate_from_zul_head_of_faith_decision.no_more_than_x_sinful_traits: "У вас не может быть более 1 греховной черты"
 separate_from_zul_head_of_faith_decision.zul_prophet_not_in_diplo_range: "Старый Зульский Пророк ([head_of_faith|E]) вне вашей дипломатической досягаемости"
 separate_from_zul_head_of_faith_decision.control_one_holy_site: "Вы контролируете как минимум одно [holy_site|E] вашей [faith|E]"
 separate_from_zul_head_of_faith_decision.control_two_holy_sites: "Вы контролируете два или более [holy_site|E] вашей [faith|E]"
 separate_from_zul_head_of_faith_decision.zul_prophet_has_x_or_more_traits_sinful_to_your_faith: "Ваш старый [head_of_faith|E] имеет как минимум 2 или более греховных черт"
 activate_presence_of_mind_decision: "Активировать Присутствие духа"
 activate_presence_of_mind_decision.disable_tt: "Если это состояние нежелательно, его можно снова отключить решением [GetDecisionWithKey('deactivate_presence_of_mind_decision').GetName]."
 activate_presence_of_mind_decision.effect_tt: "С включённым Присутствием духа вы можете вдвое сократить перезарядку [wc_spell|E] с помощью книги заклинаний. В течение этого времени вы не сможете сотворять заклинания обычным образом."
 activate_presence_of_mind_decision_confirm: "Активировать"
 activate_presence_of_mind_decision_desc: "Активировать Присутствие духа, значительно сокращая перезарядку [wc_spell|E]"
 activate_presence_of_mind_decision_tooltip: "$activate_presence_of_mind_decision_desc$"
 activate_reverse_causality_decision: "Активировать Обратную причинность"
 activate_reverse_causality_decision.disable_tt: "Если это состояние нежелательно, его можно снова отключить решением [GetDecisionWithKey('deactivate_reverse_causality_decision').GetName]."
 activate_reverse_causality_decision.effect_tt: "С включённой Обратной причинностью вы можете намеренно вызвать перезарядку [wc_spell|E], увеличивая ваш [wc_max_mana|E] на #V 10%#! за каждый год, пока заклинание на перезарядке. В течение этого времени вы не сможете сотворять заклинания обычным образом."
 activate_reverse_causality_decision_confirm: "Активировать"
 activate_reverse_causality_decision_desc: "Активировать Обратную причинность, увеличивая ваш [wc_max_mana|E] за счёт намеренной перезарядки [wc_spell|E]"
 activate_reverse_causality_decision_tooltip: "$activate_reverse_causality_decision_desc$"
 activate_shadow_form_decision: "Активировать Форму Тьмы"
 activate_shadow_form_decision_confirm: "В Бездну!"
 activate_shadow_form_decision_desc: "Активировать Форму Тьмы, принося в жертву [knights|E], чтобы получить хорошую [trait|E]."
 activate_shadow_form_decision_tooltip: "Совершите жертвоприношение, чтобы получить черту"
 communion_cthun_decision: "Общение с К'Туном"
 communion_cthun_tooltip: "Пожертвуйте своим #bold рассудком#!, чтобы обрести #bold положение#!"
 communion_ghuun_decision: "Общение с Г'хууном"
 communion_ghuun_tooltip: "#bold Защитите себя#! с помощью своего #bold положения#!"
 communion_nzoth_decision: "Общение с Н'Зотом"
