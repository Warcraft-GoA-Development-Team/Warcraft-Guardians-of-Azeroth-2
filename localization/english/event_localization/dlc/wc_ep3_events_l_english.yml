DistantLandsQuelthalas_observation: "our group caught sight of a Dragonhawk soaring amongst the golden-leaved treetops"
DistantLandsQuelthalas_description: "its brilliantly colored scales and feathers rippled with an iridescent sheen"

DistantLandsLordaeron1_observation: "our traveling party was met with the gruesome sight of a Giant Tarantula feeding upon its prey"
DistantLandsLordaeron1_description: "its fur was glistening white and finer than silk, rippling over its shiny black carcass"
DistantLandsLordaeron2_observation: "our caravan passed a large tree hollow, where an elusive Blackwald Fox paused to observe us warily"
DistantLandsLordaeron2_description: "its stocky body was covered in bright red fur, and its eyes glowed luminous gold"
DistantLandsLordaeron3_observation: "as we camped, a Gryphon swooped overhead and screeched its powerful and piercing cry"
DistantLandsLordaeron3_description: "its alabaster feathers and golden fur shone as it soared over the treetops"

DistantLandsKhazModan1_observation: "we stopped in our tracks, seized with fear at the sight of the great Grizzly Bear"
DistantLandsKhazModan1_description: "the beast bristled with thick brown fur and its claws were as big as falchion blades"
DistantLandsKhazModan2_observation: "we paused to fish for a moment, and one of our number was shocked to pull in a Loch Frenzy"
DistantLandsKhazModan2_description: "the brightly colored fish had a large, bulbous head with teeth as sharp as steel"
DistantLandsKhazModan3_observation: "we suddenly felt watched, and soon realized we were being followed by a pack of Crag Coyotes"
DistantLandsKhazModan3_description: "the sandy-furred canines traveled in a pack, with the pack leader nearly twice the sise of the others"
DistantLandsKhazModan4_observation: "we were ambushed by a fearsom Lava Spiders of Blackrock Mountain in a magma-filled ravine"
DistantLandsKhazModan4_description: "its joints glowed with the blood of Azeroth itself, its jaws and carapace glistening obsidian"

DistantLandsAzeroth1_observation: "our team passed a Giant Buzzard feasting upon the carcass of a starved heifer"
DistantLandsAzeroth1_description: "the bird's feathers were as black as onyx and its ragged wings spread as wide as an oxcart"
DistantLandsAzeroth2_observation: "we paused to observe a family of Silverback Gorrilas bathing beneath a waterfall in Stranglethorn"
DistantLandsAzeroth2_description: "the muscular creatures groomed one another in the mist, their metallic gray fur rippling as they moved"
DistantLandsAzeroth3_observation: "one of our number pointed up at a silk-lined bough, from which hung a dreaded Black Widow spider"
DistantLandsAzeroth3_description: "its red hourglass mark was vivid, but much more menacing were its eight large eyes and venomous jaws"
DistantLandsAzeroth4_observation: "our crew was shocked to see a warthog-like creature that burned with fel flame; the cursed Helboar"
DistantLandsAzeroth4_description: "huge spikes erupted from the creature's spine, head, and haunches and it glared at us with canny green eyes"

DistantLandsKalimdorNorth1_observation: "our team found ourselves being stalked by the fearsome Nightsaber"
DistantLandsKalimdorNorth1_description: "the feline's lithe form was covered in dark fur striped with silver, with fanged jaws that could crush steel"
DistantLandsKalimdorNorth2_observation: "a cry like a crash of thunder turned our eyes skyward to see a majestic hippogryph"
DistantLandsKalimdorNorth2_description: "the chimeric creature's feathers glistened with all the rainbow's hues, and its knowing eyes pierded my soul"
DistantLandsKalimdorNorth3_observation: "our team was shocked by the sight of the rare and deadly Frostsaber"
DistantLandsKalimdorNorth3_description: "the great cat glided effortlessly over the snow, its white striped pelt a near-perfect camoflage"
DistantLandsKalimdorNorth4_observation: "we paused to admire the endless beach and watch the movements of the Tide Crawlers"
DistantLandsKalimdorNorth4_description: "the crabs were as wide as a dinner table and their powerful claws were encrusted with barnacles and flotsam"

DistantLandsKalimdorCentral1_observation: “we happened upon a fearsome wyvern feasting upon a clutch of giant spider eggs”
DistantLandsKalimdorCentral1_description: “the fascinating lionlike beast was covered in tawny fur except for its bare-skinned wings and menacing chitinous tail”
DistantLandsKalimdorCentral2_observation: “we had to halt our caravan for the passing of a majestic herd of Kodo”
DistantLandsKalimdorCentral2_description: “they were hulking and muscular creatures with thick hides and a strange pronged growth upon the snout”
DistantLandsKalimdorCentral3_observation: “stopping for water, we found ourselves beset by the feared Wind Serpent”
DistantLandsKalimdorCentral3_description: “its sharp emerald scales glistened in the sun and its sharp fangs flashed brilliant white as it struck”
DistantLandsKalimdorCentral4_observation: “one of our number strayed too close to the water and was nearly swallowed whole by a giant Crocolisk”
DistantLandsKalimdorCentral4_description: "the fearsome reptile was as large as an oxcart with teeth as long as a man's forearm"

DistantLandsKalimdorSouth1_observation: "a fearful basilisk emerged out of a mirage before our very eyes"
DistantLandsKalimdorSouth1_description: "the creature's stone scales looked heavy and its teeth sharp, but it was its cold gaze that we truly feared"
DistantLandsKalimdorSouth2_observation: "a massive terrorsaur crashed through the jungle trees and swallowed one of our horses whole"
DistantLandsKalimdorSouth2_description: "the fearsome reptile stood on two legs and was covered in alabaster scales with black stripes and a maw stained red with blood"
DistantLandsKalimdorSouth3_observation: "we seem to have attracted the attention of a curious Faerie Dragon which playfully blinked about the caravan"
DistantLandsKalimdorSouth3_description: "was no bigger than a housecat, bright blue with magenta wings adorned in fantastic patterns and a curled tail"
DistantLandsKalimdorSouth4_observation: "our eyes were dazzled by the iridescent carapace of a Sparkleshell Tortoise"
DistantLandsKalimdorSouth4_description: "the reptile was almost the size of a horse with a shell that resembled diamond and was almost as hard"

wanderer_lifestyle_events.35.desc: "As our party made its way through [ROOT.Char.Custom('DistantLandsRegionLoc')], I found myself reflecting back on the travel journal I once read. Not an hour later [ROOT.Char.Custom('DistantLandsObservationTypeLoc)] just like in the book!\n\nAlmost exactly as described, [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc)]. The account had prepared me well for this experience,"
wanderer_lifestyle_events.35.desc.singular.neutral_wc: "and yet it is somewhat different than what I expected... More than mere deja vu!"