l_russian:
 ### Terenas Funeral 
 lordaeron.2001.t: "Смерть нашего короля"
 lordaeron.2001.d: "Тёмная атмосфера охватывает Лордерон, когда сжигается погребальный костёр [terenas.GetNamePossessive].\n\nШёпоты разносятся среди собравшихся на месте, выражения шока и рассказы о прошлых подвигах. Гроза молчания охватывает нас, когда мы смотрим, как тело [terenas.GetNamePossessiveNoTooltip] начинает сгорать. Пламя танцует и крутится, отражая оранжевое сияние, которое видится в слезящихся глазах собравшихся. Когда сила огня возрастает, столб дыма поднимается в небо, унося с собой остатки ушедшего.\n\nПогибнуть от руки собственного сына, своей крови — это судьба, которую никто не пожелает пережить. Каждый треск костра представляет собой шаг, который он сделал — проблему, с которой он столкнулся — помогая нам процветать в этой великой стране. Даже в самые тёмные дни, в этот нынешний мор, он не ослаб. Потеря справедливого правителя этого королевства никогда не будет забыта."
 lordaeron.2001.a: "\"Прощай, [terenas.GetName].\""
 lordaeron.2001.b: "Произнеси краткую похвальную речь."
 terenas_eulogy_success: "#italic Люди ценят то, что ты говоришь#!"
 terenas_eulogy_fail: "#italic Твои слова не находят отклика#!"
