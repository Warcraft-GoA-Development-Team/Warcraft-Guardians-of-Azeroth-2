 game_concept_wc_elemental_spirit_decay_magic_disposition_desc: "$game_concept_wc_elemental_spirit_decay_magic_disposition$ отражает отношения [character|E] со [wc_elemental_magic_lifestyle_elements|E] и влияет на [traits|E], получаемые за [perks|E] в [wc_elemental_magic_lifestyle|E].\nЕсли [character|E] имеет [EmptyScope.ScriptValue('wc_spirit_elemental_favour_threshold_value')|=+0] или больше [wc_elemental_spirit_decay_magic_favour|E] с [wc_elemental_magic_lifestyle_element|E], $game_concept_wc_elemental_spirit_decay_magic_disposition$ этой [wc_elemental_magic_lifestyle_element|E] принимает значение «[wc_elemental_magic_spirit|E]».\nЕсли [character|E] имеет [EmptyScope.ScriptValue('wc_decay_elemental_favour_threshold_value')|=+0] или меньше [wc_elemental_spirit_decay_magic_favour|E] с [wc_elemental_magic_lifestyle_element|E], $game_concept_wc_elemental_spirit_decay_magic_disposition$ этой стихии принимает значение «[wc_elemental_magic_decay|E]».\nЕсли [character|E] имеет больше [EmptyScope.ScriptValue('wc_decay_elemental_favour_threshold_value')|=+0] и меньше [EmptyScope.ScriptValue('wc_spirit_elemental_favour_threshold_value')|=+0] [wc_elemental_spirit_decay_magic_favour|E] с [wc_elemental_magic_lifestyle_element|E], отношение этой [wc_elemental_magic_lifestyle_element|E] становится $game_concept_wc_elemental_magic_disposition_neutral$.\n\n#weak Например, если [character|E] с [GetTrait('user_of_elemental_water_magic_3').GetName( GetPlayer )] и [EmptyScope.ScriptValue('wc_major_elemental_favour_change_value')|=+0] [wc_elemental_spirit_decay_magic_favour|E] получит [EmptyScope.ScriptValue('wc_massive_elemental_favour_change_value')|=+0] [wc_elemental_spirit_decay_magic_favour|E], $game_concept_wc_elemental_magic_disposition_neutral$ сменится на $game_concept_wc_elemental_spirit_decay_magic_disposition$ со значением «[wc_elemental_magic_spirit|E]», а [GetTrait('user_of_elemental_water_magic_3').GetName( GetPlayer )] [trait|E] сменится на [GetTrait('user_of_elemental_water_spirit_magic_3').GetName( GetPlayer )].#!"

 game_concept_wc_elemental_spirit_decay_magic_favour: "Благосклонность стихий"
 game_concept_wc_elemental_fire_spiritdecay_magic_favour: "Благосклонность стихии Огня"
 game_concept_wc_elemental_water_spiritdecay_magic_favour: "Благосклонность стихии Воды"
 game_concept_wc_elemental_air_spiritdecay_magic_favour: "Благосклонность стихии Воздуха"
 game_concept_wc_elemental_earth_spiritdecay_magic_favour: "Благосклонность стихии Земли"
 game_concept_wc_elemental_spirit_decay_magic_favour_desc: "$game_concept_wc_elemental_spirit_decay_magic_favour$ показывает, насколько [wc_elemental_magic_lifestyle_element|E] расположена к [character|E], и выражается значением от [EmptyScope.ScriptValue('wc_min_elemental_favour_value')|=+0] до [EmptyScope.ScriptValue('wc_max_elemental_favour_value')|=+0]. Она напрямую влияет на [wc_elemental_spirit_decay_magic_disposition|E].\nЕсли [character|E] прежде никак не взаимодействовал с [wc_elemental_magic_lifestyle_element|E], начальное значение $game_concept_wc_elemental_spirit_decay_magic_favour$ будет зависеть от [wc_elemental_magic_lifestyle_no_lifestyles_line|E] [doctrines|E] его [faith|E]."
