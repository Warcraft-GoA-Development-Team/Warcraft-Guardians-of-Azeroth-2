l_english:
 
 tradition_might_is_right_name:0 "Might is Right"
 tradition_might_is_right_desc:0 "What need is there for diplomacy when we can simply take what is rightfully ours?"
 
 tradition_zandalari_cities_name:0 "Zandalari Cities"
 tradition_zandalari_cities_desc:0 "The cities of the Zandalari Empire are remarkable examples of troll architecture and culture. These sprawling metropolises blend the natural beauty of the surrounding landscapes with the grandeur of ancient civilizations. The Zandalari cities are characterized by towering structures, intricate carvings, and vibrant murals that depict their rich history and connection to the troll gods.\nThe cities are divided into various districts, each with its own unique charm and purpose. They encompass grand marketplaces, where exotic goods from all corners of Azeroth are traded, bustling ports that connect the Zandalari Empire to other lands, and tranquil sanctuaries dedicated to the ancient spirits known as loa, which the Zandalari hold in high regard. Temples, pyramids, and other monumental structures pay homage to the troll gods and serve as gathering places for spiritual rituals and important ceremonies."

 tradition_longevity_traditions_name:0 "Longevity Traditions"
 tradition_longevity_traditions_desc:0 "This culture has learned (either on its own or from an [wc_elder_race|E]) the secrets of self-preservation passed down by beings who are [wc_long_lived] or have [wc_extreme_longevity]."

 tradition_liberated_undead_name:0 "Liberated Undead"
 tradition_liberated_undead_desc:0 "This culture is comprised mostly of [Glossary('Undead', 'UNDEAD_GLOSS')] individuals who were liberated from the [scourge|E] and bare a burning hatred for their former masters. The prospect of eternal undeath has resulted in a culture where greivances lodge themselves in long memories and the value of life is much diminished."
 
 tradition_seducers_name:0 "Seducers"
 tradition_seducers_desc:0 "Seeking carnal pleasure is not only completely natural, but a central part of life. To say otherwise is inconceivable."
 
 tradition_lookism_name:0 "Lookism"
 tradition_lookism_desc:0 "Physical appearance is everything in this culture. High value is placed on superficial beauty and those who do not fit the standards are shunned."
 
 tradition_collective_insanity_name:0 "Collective Insanity"
 tradition_collective_insanity_desc:0 "Whether it's because of shared trauma or nature, people of this culture have some screws loose."
 
