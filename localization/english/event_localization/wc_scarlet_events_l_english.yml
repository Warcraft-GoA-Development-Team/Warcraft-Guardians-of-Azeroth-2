l_english:
 SCARL.000_TITLE:1 "Those Who Remain"
 SCARL.000_DESC:0 "Once a beacon of the Light, the [GetTitleByKey('k_lordaeron').GetBaseNameNoTier] is now little more than a corpse-ridden ruin, a feast for the damned. Those of us who yet live are few, scattered and hunted by the Scourge and worse yet — traitors who once called themselves our brethren who have willingly submitted themselves into the armies of the damned.\n\n[GetTitleByKey('k_order_of_the_silver_hand').GetName] stands on the edge of ruin, its greatest champions slain or turned against us.\n\n[scoped_betrayer.GetName] has delivered our lands to death itself, and now whispers tell of others within our ranks who would rather cower or consort with the enemy than stand and fight.\n\nBut I will not falter.\n\nIf there are still righteous warriors left in this land, I will find them. We will rise from the ashes of Lordaeron, not as victims, but as those who would purge the plague that stole our home. The [GetTrait('lich_king').GetName(GetNullCharacter)] will know that this land belongs to us."
 SCARL.000_OPT_A:0 "I will send out emissaries to those loyal to the throne."
 SCARL.000_OPT_A_tt:0 "You will send out calls within [GetTitleByKey('k_lordaeron').GetBaseNameNoTier] for a joint alliance against the Lich King."
 SCARL.000_OPT_B:0 "I cannot afford to chase ghosts."
 SCARL.000_OPT_tt:0 "You choose to stand alone."

 SCARL.001_TITLE:1 "Those Who Remain"
 SCARL.001_DESC:0 "To the last true knights of Lordaeron,\n\nLordaeron has fallen, but the Light still burns in us. The traitors and the damned would see our kingdom lost forever.\nI refuse to yield.\nIf you still have the will to fight, stand with the last of the Silver Hand. Together, we will cleanse this land of its plague and take back what is ours."
 SCARL.001_OPT_A:0 "For Lordaeron! We stand and fight!"
 SCARL.001_OPT_A_TT:0 "You will join a meeting with the Silver Hand to discuss the fate of Lordaeron."
 SCARL.001_OPT_B:0 "This war is already lost."
 SCARL.001_OPT_B_TT:0 "You ignore the call."

 SCARL.002_TITLE:1 "Those Who Remain"
 SCARL.002_DESC:0 "Your call has been heard. The Light has not abandoned us, nor will we abandon you. Lordaeron may be in ruins, but our duty still remains until our death. We will gather our forces and attend your meeting.\nFor Lordaeron, and for the Light."
 SCARL.002_OPT_A:0 "Excellent."

 SCARL.003_TITLE:1 "Those Who Remain"
 SCARL.003_DESC:0 "Lordaeron is lost. The dead rule the streets, and the Light's favour in us has faded.\nI will not march my people to their deaths for a kingdom that no longer exists. We must look to other paths for our endurance.\nDo not seek us again."
 SCARL.003_OPT_A:0 "Cowards."

 SCARL.004_TITLE:1 "Those Who Remain"
 SCARL.004_DESC:0 "You walk into the meeting room and quickly realise that the dimly lit hall is thick with tension. The remnants of [GetTitleByKey('k_order_of_the_silver_hand').GetName] gathered here have begun to splinter before your very eyes.\n\nOn one side of the room, knights in bloodstained armour speak with righteous fury - their voices sharp with anger. #italic "We must cleanse [GetTitleByKey('k_lordaeron').GetBaseNameNoTier]! Purge the infected, root out the traitors— No mercy! No hesitation! [ROOT.Char.GetFaith.HighGodName] demands it! #!"\n\nOpposite to them stands a weary but resolute group, their conviction and faith in [ROOT.Char.GetFaith.HighGodName] being tempered by their compassion. #italic "The innocent still suffer" #!, they argue in response, #italic "[ROOT.Char.GetFaith.HighGodName] does not demand cruelty! If we abandon them, we are no better than the monsters we fight." #!\n\nThe divide is clear:\nAll who have gathered here must make their choice."
 SCARL.004_OPT_A:0 "The Light must be defended. No matter the cost."
 SCARL.004_OPT_B:0 "We must not let the Light become a weapon of tyranny."
 SCARL.004_OPT_C:0 "I stand with the Lightbringer and his resolve."
 SCARL.004_OPT_C_tt:0 "Remain true to the Light. \n$BULLET$ You form an Alliance with [GetTitleByKey('k_order_of_the_silver_hand').GetName]."

 scarlet_uprising:0 "Scarlet Zealots"
 argent_uprising:0 "Argent Regiments"

 SCARL.0045_TITLE:1 "Last Stand of the [GetTitleByKey('k_order_of_the_silver_hand').GetName]"
 SCARL.0045_DESC:0 "By allying ourselves with what remains of the once powerful Kingdom of [GetTitleByKey('k_lordaeron').GetBaseNameNoTier], we have taken upon ourselves to protect the last vestiges of [GetTitleByKey('k_lordaeron').GetBaseNameNoTierNoTooltip].\n\nAlthough it seems that some did not trust our call for a United front and have formed their own factions to stand up against the Lich King, we shall stand tall against the Scourge... Perhaps we may yet gather enough strength to take back our beloved home!"
 SCARL.0045_OPT_A:0 "We shall rise once again or fall in vain!"

 SCARL.006_TITLE:1 "Flames of the Remaining"
 SCARL.006_DESC:0 "No longer are we standing isolated against the Scourge. The neighbouring #italic Lords #!cower behind their walls refusing to join their brethren in our holy struggle.\n\nOur leaders, ignited by zeal and vengeance stand united in purpose. We have gathered the pure of heart and formed a permanent #bold Crusade #! against the Scourge and any who would dare stand in the path of our holy cause. \n\n[scarlet_leader.GetName] has been chosen to lead us to victory! The [GetTitleByKey('k_lordaeron').GetName] will be born anew, when the Scourge and the undead hordes are reduced to ash beneath the Light's purifying fire!"
 SCARL.006_OPT_A:0 "The Saviours are here!"

 SCARL.007_TITLE:1 "Wrath of the Scarlet Crusade"
 SCARL.007_DESC:0 "How many more of our brethren must fall before the Scourge is eradicated?\n\nHow long shall we cling to fading memories of pace, shackled by fear and hesitation?\n\nWe must take our fate in our own hands. We must strike at the source of the abomination. We must march into the frozen darkness of Northrend and bring righteous judgement against the [GetTrait('lich_king').GetName(GetNullCharacter)] itself!"
 SCARL.007_OPT_A:0 "Send the word out for volunteers..."
 SCARL.007_OPT_A_tt:0 "You send a message, calling for the faithful."

 SCARL.008_TITLE:1 "I want YOU for the Scarlet Army"
 SCARL.008_DESC:0 "To all warriors devoted to the Scarlet cause,\nHow has the purge to remove the Scourge from [GetTitleByKey('k_lordaeron').GetName] been going? Poorly, I would wager.\nThey are countless, relentless, and ever rising. Humanity's only true hope lies in destroying the architect of the unholy plague, the [GetTrait('lich_king').GetName(GetNullCharacter)]!\nJoin me. Stand at my side, and march with my expedition to $world_northrend$!"
 SCARL.008_OPT_A:0 "This is madness!"
 SCARL.008_OPT_B:0 "You are right. This is the only solution."

 SCARL.009_TITLE:1 "Foolish Endeavour"
 SCARL.009_DESC:0 "To [scarlet_onslaught_leader.GetName],\nYou must be a fool.\nGoing to the north where only the Scourge thrive? Where even the Light can give you neither warmth nor hope?\nI wish you the best on your #italic "brave expedition" #! and hope the Light blesses you nonetheless for your bravery.\nDo not bother us again."
 SCARL.009_OPT_A:0 "Coward!"

 SCARL.010_TITLE:1 "Brave Warrior"
 SCARL.010_DESC:0 "To [scarlet_onslaught_leader.GetName],\nYou spoke my mind! The skirmishes across [GetTitleByKey('k_lordaeron').GetName] have thus far made little to no progress.\nMyself and my men considered fleeing the kingdom, but we are now ashamed of such foolish thoughts.\nWe will atone for even letting such sinful thoughts cloud our judgement. We will join your expedition, your holy mission and crush the Scourge once and for all with our combined strength!"
 SCARL.010_OPT_A:0 "Excellent..."

 SCARL.011_TITLE:1 "Beginning of the End"
 SCARL.011_DESC:0 "We have finally landed in the [GetTitleByKey('c_moaki').GetName] within striking distance of the [GetTrait('lich_king').GetName(GetNullCharacter)]'s bastion.\n\nFrom here we can launch our attacks on the Scourge and, with [ROOT.Char.GetFaith.HighGodName]'s blessing, win this Holy War.\n\nBut first, we will need to rid our new garrison of these... #italic animals#!... that surround our settlement."
 SCARL.011_OPT_A:0 "This will serve as our new base of command."

 scarlet_onslaught_troops:0 "Scarlet Armada"

 SCARL.012_TITLE:1 "Beginning of the End"
 SCARL.012_DESC:0 "With [ROOT.Char.GetFaith.HighGodName]'s blessing, [GetTitleByKey('c_moaki').GetName] is finally liberated from the inhuman filth that infected this place. We shall cleanse the Scourge from the face of Azeroth the same way!\n\nShall we keep expanding our base and secure more land and grow stronger? Or do we have enough forces to march against the [GetTrait('lich_king').GetName(GetNullCharacter)] itself?"
 SCARL.012_OPT_A:0 "The end of the [GetTrait('lich_king').GetName(GetNullCharacter)] is nigh!"

 SCARL.013_TITLE:1 "Our Pride, Our Hearthglen"
 SCARL.013_DESC:0 "Those with [ROOT.Char.GetFaith.HighGodName] burning inside their heart, will no longer feel the cold and darkness of $world_northrend$. We have raised our own New $c_hearthglen$, far away from our old home. It gives us pride, it gives us joy, it gives us warmth.\n\nWith our Beacon of Light shining behind us, we shall be guided against the Scourge and the heretics! The pure [GetTrait('creature_human').GetName(GetNullCharacter)]s lost in the cold shall return to us by the guidance of the [ROOT.Char.GetFaith.HighGodName]!"
 SCARL.013_OPT_A:0 "We might even surpass those in Lordaeron..."
