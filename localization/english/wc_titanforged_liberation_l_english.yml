l_english:
 reforge_liberated_county_no_target_data_tt:0 "This county's original culture and faith are not yet catalogued — no restoration will occur."

 cede_liberated_duchy_decision:0 "Cede the Liberated Duchy"
 cede_liberated_duchy_decision.desc:0 "The land has recovered under its own strength, its control and prosperity restored. As is the way of Order, it is time to decide its future — full freedom, continued protection, or a place within your own realm."
 cede_liberated_duchy_decision.tt:0 "Choose how to hand the recovered duchy back to its people."
 cede_liberated_duchy_decision_confirm:0 "Decide the duchy's fate"

 wc_titanforged_liberation.0002.title:0 "The Duchy Has Recovered"
 wc_titanforged_liberation.0002.desc:0 "[ceded_duchy.GetName] has recovered enough to stand on its own. It is time to decide its fate."
 wc_titanforged_liberation.0002.a:0 "I grant this duchy full independence, under a ruler of its own people."
 wc_titanforged_liberation.0002.b:0 "I set this duchy free as a protectorate under my watch, for now."
 wc_titanforged_liberation.0002.c:0 "This duchy will remain within my realm."

 task_reorder_county:0 "Reorder County"
 task_reorder_county_desc:0 "Choose one method for this county. Each new assignment offers its own eligible choices.\n\n#S Historical restoration#!\nPact: historical culture and faith, at most #N 2#! development lost, corruption removed; #V 75%#! speed and autonomy promised. Mandate: historical culture and your Order faith, corruption removed; #V 150%#! speed and #N 50%#! development lost, rounded up. Both mark the county as Reordered.\n\n#S Forge projects#!\nRequires Titanforged race and culture, Pantheonism, and a directly owned forge here or in a fully controlled land neighbor.\n• Earthen settlement: #V 75%#! speed, increased by #V 5%#! per forge level above the first; installation and institutional choices at #V 25%#! and #V 75%#!. Choose coexistence or dominant Earthen administration. Resolved stages survive interruption.\n• Arcane imbuement: #V 100#! gold upfront, normal speed, no culture or faith change. Forge support and maintenance are required after completion.\n\nRestoration and settlement improve control recovery for five years. No forge project transfers titles or promises autonomy."


 wc_titanforged_ongoing_reordering_county_modifier:0 "Being Reordered"
 wc_titanforged_ongoing_reordering_county_modifier_desc:0 "The Marshal oversees the restoration of this county's institutions and administration."
 wc_titanforged_reordered_county_modifier:0 "Reordered"
 wc_titanforged_reordered_county_modifier_desc:0 "This county has been restored to Order."
 wc_titanforged_reordered_county_control_growth_modifier:0 "Order Reestablished"
 wc_titanforged_reordered_county_control_growth_modifier_desc:0 "The Marshal's administration still oversees this county's recovery, speeding the return of control."

 WC_TITANFORGED_REORDER_BASE:0 "Base Progress"
 WC_TITANFORGED_REORDER_SKILL_BONUS:0 "Marshal's Martial Skill"
 WC_TITANFORGED_REORDER_FRIEND_BONUS:0 "Marshal is your Friend"
 WC_TITANFORGED_REORDER_BEST_FRIEND_BONUS:0 "Marshal is your Best Friend"
 WC_TITANFORGED_REORDER_RIVAL_BONUS:0 "Marshal is your Rival"
 WC_TITANFORGED_REORDER_NEMESIS_BONUS:0 "Marshal is your Nemesis"
 WC_TITANFORGED_REORDER_SAME_CULTURE_BONUS:0 "County shares your Culture"
 WC_TITANFORGED_REORDER_SAME_FAITH_BONUS:0 "County shares your Faith"
 WC_TITANFORGED_REORDER_DEVELOPMENT_PENALTY:0 "County's Development"
 WC_TITANFORGED_REORDER_UNRAISED_ARMY_BONUS:0 "Armies at Peace"

 wc_titanforged_reorder_task.0001.title:0 "The County is Reordered"
 wc_titanforged_reorder_task.0001.desc:0 "My Marshal has brought the final report. The work I ordered in the county is complete, and the workers have been released from this assignment. The records now pass to those who will maintain what we have established."
 wc_titanforged_reorder_task.0001.a:0 "The work continues elsewhere."


 wc_titanforged_reorder_target_tt:0 "Completely control the county. The chosen method must remain eligible; another county may use a different method. The special Lordaeron exclusion still applies.\n\nHistorical restoration requires your Order faith, a county faith opposed to Order and known historical traditions.\n\nForge projects require Titanforged race and culture, Pantheonism, and a directly owned forge in this county or a fully controlled land neighbor. Settlement requires a county differing from Titanforged culture or Pantheonism. Arcane imbuement requires no existing arcane modifier and #V 100#! gold to begin."
 wc_titanforged_duchy_ready_tt:0 "Completely control a duchy with at least one Reordered county, no remaining chaotic county faiths, development of at least 10 in every county, and control of at least 80 in every county."
 wc_titanforged_release_duchy_tt:0 "[local_ruler.GetName] will receive [ceded_duchy.GetName] and all its counties, becoming independent. A new cession will require another cycle of reordering."
 wc_titanforged_protectorate_tt:0 "[local_ruler.GetName] will receive [ceded_duchy.GetName] and all its counties as your tributary, with no gold, levy or prestige obligations. A new cession will require another cycle of reordering."
 wc_titanforged_keep_duchy_tt:0 "[ceded_duchy.GetName] remains in your realm with its current holders. A new decision on its fate will require another cycle of reordering."
 wc_titanforged_liberation.0002.invalid:0 "The duchy's fate must wait."
 wc_titanforged_duchy_invalid_tt:0 "The duchy no longer meets the requirements. No land is transferred and no reward is granted."
