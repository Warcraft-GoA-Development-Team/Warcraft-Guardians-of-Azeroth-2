wanderer_lifestyle_events.30.desc: "Perusing my books, I find myself reading a travel journal from a famed and well-traveled merchant and am captivated by a certain anecdote:\n\n"#emp Making our way through the wilderness of [ROOT.Char.Custom('DistantLandsRegionLoc')], [ROOT.Char.Custom('DistantLandsObservationTypeLoc)]. From what we could see of the creature, [ROOT.Char.Custom('DistantLandsDescriptionTypeLoc)]. Truly there is nothing else like it in the world!#!"\n\nBefore long I find myself daydreaming about encountering one such beast in the wild one day."

