l_english:
 # wc_heresy.0010 - New Major Heresy
 wc_heresy.0010.t:0 "Heresy: [heretic_faith.GetAdherentNamePluralNoTooltip] in [heretic_title.GetNameNoTierNoTooltip]"
 wc_heresy.0010.desc:0 "[heretic_ruler.GetTitledFirstName] of [heretic_title.GetNameNoTier] has announced to the world that [heretic_ruler.GetSheHe] and [heretic_ruler.GetHerHis] vassals have converted to [heretic_faith.GetName]."
 wc_heresy.0010.desc.new:0 "\n\nHaving become disillusioned with the teachings of the [origin_faith.GetAdjective] [origin_faith.PriestMalePlural], the nobles of [heretic_title.GetNameNoTierNoTooltip] no longer consider the [origin_faith.AltPriestTermPlural] to be righteous and true. As [heretic_faith.GetAdherentNamePluralNoTooltip], they believe their new faith properly aligns with the will of [heretic_faith.HighGodName] and they are distancing themselves from their former religious institutions."
 wc_heresy.0010.desc.existing:0 "\n\nHaving become disillusioned with the teachings of the [origin_faith.GetAdjective] [origin_faith.PriestMalePlural], the nobles of [heretic_title.GetNameNoTierNoTooltip] no longer consider the [origin_faith.AltPriestTermPlural] to be righteous and true and are distancing themselves from their former religious institutions. They are instead professing themselves [heretic_faith.GetAdherentNamePluralNoTooltip], whose doctrines they feel better align with [heretic_faith.HighGodNamePossessive] will."
 wc_heresy.0010.tt:0 "[heretic_faith.GetName|V] appears in the [heretic_title.GetName]"
 wc_heresy.0010.a.new_heresy:0 "What twisted mockery of our faith is this!?"
 wc_heresy.0010.a.existing_heresy:0 "Those vile heretics have led them astray!"
 wc_heresy.0010.a.astray_faith:0 "I don't get it, but I guess it makes them happy?"
 wc_heresy.0010.a.same_faith:0 "I knew they would see the light eventually!"
 wc_heresy.0010.b:0 "You know, they do have some good points..."
 wc_heresy.0010.notification.title:0 "New Religious Movement"
 wc_heresy.0010.notification:0 "[heretic_ruler.GetFullName] has founded a new [heretic_faith.GetAdjective] movement!"

 # wc_heresy.0011 - Major Heresy Spreads
 wc_heresy.0011.notification.heresy:0 "[convert_ruler.Custom2('HierarchicalStatus', me)] Embraces Heresy: [convert_ruler.GetShortUINameNoTooltip]"
 wc_heresy.0011.notification.same_faith:0 "[convert_ruler.Custom2('HierarchicalStatus', me)] Embraces the True Faith: [convert_ruler.GetShortUINameNoTooltip]"
 wc_heresy.0011.notification.other:0 "[convert_ruler.Custom2('HierarchicalStatus', me)] Changes Faith: [convert_ruler.GetShortUINameNoTooltip]"

 # Fervor change reasons
 wc_fervor_gain_new_heresy:0 "Birth of the [heretic_faith.GetAdjectiveNoTooltip] Heresy"
 wc_fervor_gain_defector_heresy:0 "$wc_fervor_gain_new_heresy$"
