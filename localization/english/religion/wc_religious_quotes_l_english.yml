l_english:
 # United Against Darkness
 # Holy Light (Tyrism) - Book of Ruin 12:4, about the last battle of the War of the Ancients
 wc_book_of_ruin_12_4_english: "And the demon went forth with his Legion, and all the nations were gathered together to make war against him that sat upon the throne of Disorder, and against his servants."
 wc_book_of_ruin_12_4_default: "[Glossary('$wc_book_of_ruin_12_4_english|q$','BOOK_OF_RUIN_12_4_GLOSS')]"
 wc_book_of_ruin_12_4_default_short: "[Glossary('And the demon went forth with his Legion...','BOOK_OF_RUIN_12_4_GLOSS')]"
 BOOK_OF_RUIN_12_4_GLOSS: "#weak Book of Ruin 12:4#!\n\nRecounts the end of the War of the Ancients, when all nations stood against the Burning Legion."

 # Naarism - Vision of the Prophet, Xe'ra and Army of the Light
 wc_vision_of_the_prophet_army_of_the_light_english: "The Prophet saw the land of our forefathers set ablaze. But from the depths of the cosmos descended the Warrior Star, and it spoke: “Behold: none shall be spared from the flames. Gather the peoples under the banner of the Army of the Light, and together you shall make Good triumph over Evil.”"
 wc_vision_of_the_prophet_army_of_the_light_default: "[Glossary('$wc_vision_of_the_prophet_army_of_the_light_english|q$','VISION_OF_THE_PROPHET_ARMY_OF_THE_LIGHT_GLOSS')]"
 wc_vision_of_the_prophet_army_of_the_light_default_short: "[Glossary('The Prophet saw the land of our forefathers set ablaze...','VISION_OF_THE_PROPHET_ARMY_OF_THE_LIGHT_GLOSS')]"
 VISION_OF_THE_PROPHET_ARMY_OF_THE_LIGHT_GLOSS: "#weak Vision of the Prophet Velen#!\n\nAfter the flight from Argus, Xe'ra came to the Draenei and called the peoples to unite under the Army of the Light."

 # Noorism - Odyssey 3:12, divine commandment to stay united with all who fight the Darkness
 wc_odyssey_3_12_english: "Hold fast, all together, to the rope of Noor, and be not divided; fight in the path of Noor alongside the heathens, and against whosoever lets go of the rope, that Good alone may triumph."
 wc_odyssey_3_12_default: "[Glossary('$wc_odyssey_3_12_english|q$','ODYSSEY_3_12_GLOSS')]"
 wc_odyssey_3_12_default_short: "[Glossary('Hold fast, all together, to the rope of Noor...','ODYSSEY_3_12_GLOSS')]"
 ODYSSEY_3_12_GLOSS: "#weak $noor_religious_text$ 3:12#!\n\nA divine commandment calling the faithful to stand united to fight the Darkness."
