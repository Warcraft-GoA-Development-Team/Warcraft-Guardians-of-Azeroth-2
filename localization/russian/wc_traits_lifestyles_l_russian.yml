 trait_wc_lifestyle_light_magic: "Жрецы Света"
 trait_user_of_light_magic_name: "Жрец Света"
 trait_user_of_light_magic_1: "$wc_lifestyle_magic_prefix_for_level_1$ $trait_user_of_light_magic_name$"
 trait_user_of_light_magic_1_desc: "Жрецы Света преданы Свету и выражают свою непоколебимую веру служением людям. Тысячелетиями они покидали стены своих храмов и покой святилищ, чтобы поддержать союзников на землях, раздираемых войной. В разгар ужасных битв ни один герой не усомнится в ценности жреческих орденов. Эти мастера искусства исцеления удерживают своих соратников в строю далеко за пределами обычных возможностей — благодаря множеству восстанавливающих сил и благословений. Божественные силы, что в распоряжении жреца, могут быть обращены и против врагов, карая их священной яростью."
 trait_user_of_light_magic_1_character_desc: "[ROOT.GetCharacter.GetFirstNameNoTooltip] — $trait_user_of_light_magic_1$. $trait_user_of_light_magic_1_desc$"
