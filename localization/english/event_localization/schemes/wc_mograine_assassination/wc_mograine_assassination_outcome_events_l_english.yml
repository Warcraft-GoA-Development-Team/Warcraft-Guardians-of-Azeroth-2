l_english:
  wc_mograine_whitemane_agent:0 "Sally Whitemane"
  wc_mograine_whitemane_agent_desc:0 "Sally Whitemane, ever ready to see faith enforced with fire and steel."
  wc_mograine_whitemane_agent_i:0 "Sally Whitemane"

  wc_mograine_voss_agent:0 "Benedictus Voss"
  wc_mograine_voss_agent_desc:0 "Benedictus Voss, who trusts the Grand Crusader's judgment too much to ask what it's for."
  wc_mograine_voss_agent_i:0 "Benedictus Voss"

  wc_mograine_founders_agent:0 "A Founder of the Crusade"
  wc_mograine_founders_agent_desc:0 "One of the old guard who built the Scarlet Crusade at Alexandros's side - and would not believe him betrayed even now."
  wc_mograine_founders_agent_i:0 "A Founder of the Crusade"

  wc_mograine_assassination_outcome.1001.title:0 "The Long Approach"
  wc_mograine_assassination_outcome.1001.desc:0 "My father plans another sweep through Stratholme's dead, and asks me to lead the column in. Darion would have gone gladly, proudly, the way he does everything. I go instead, and no one thinks to ask why I offered.\n\nIt only needs to look like the dead did it."
  wc_mograine_assassination_outcome.1001.a:0 "Lead the column in."

  wc_mograine_assassination_outcome.1003.title:0 "Renault's Own Doubt"
  wc_mograine_assassination_outcome.1003.desc:0 "Some nights I still think of turning back - riding home, letting Darion have the glory he was always going to get anyway. Then I remember the way my father looks at him and not at me, and the thought passes, the way it always does."
  wc_mograine_assassination_outcome.1003.a:0 "Push the thought away."

  wc_mograine_assassination_invalidated_title:0 "The Moment Passes"
  wc_mograine_assassination_invalidated_desc:0 "Whatever I meant to do at Stratholme, the chance for it is gone."

  wc_mograine_assassination_outcome.2001.title:0 "The Ambush at Stratholme"
  wc_mograine_assassination_outcome.2001.desc:0 "Renault leads them in - his father, and Fairbanks, the old priest who has never once doubted Alexandros. Ahead, Stratholme's dead rise in numbers no war council prepared for.\n\nRenault finds a doorway to hide in. Fairbanks goes down first, buried alive beneath a mountain of corpses he cannot claw free of. Alexandros fights alone, and fights well, and fights until his arms will no longer answer him - until Ashbringer slips from his grip and rings against the stone.\n\nRenault steps out of the dark. His father does not even raise a hand against him. The blade that has slaughtered ten thousand of the undead takes a mortal man's life for the first time, and something in it curdles at the wrongness of it - the way faith curdles into zealotry when grief is the only fuel left.\n\nRenault cannot make himself pick it back up. He leaves it beside the body and walks away."
  wc_mograine_assassination_outcome.2001.a:0 "Watch the boy become a weapon."

  wc_mograine_assassination_outcome.2002.title:0 "A Brother's Grief"
  wc_mograine_assassination_outcome.2002.desc:0 "Word reaches Darion before I need to send it - Stratholme's dead do their own kind of talking. He grieves the way the favored son is allowed to, openly, publicly. But grief has a way of asking questions that eulogies don't answer, and Renault was the one who lived.\n\nI have not decided yet whether that's a problem I need to solve."
  wc_mograine_assassination_outcome.2002.a:0 "Let him wonder."

  wc_mograine_assassination_outcome.4001.title:0 "Nerve Breaks"
  wc_mograine_assassination_outcome.4001.desc:0 "My father lowers his guard, and for one long moment I have every opening I need. I take none of them. My hand will not close around the hilt, and the moment passes into an ordinary skirmish like any other.\n\nThere will be another Stratholme. There always is."
  wc_mograine_assassination_outcome.4001.a:0 "Walk away. Not today."
  wc_mograine_assassination_outcome.4001.a_tooltip:0 "The scheme is not over - it will attempt itself again, given time"
