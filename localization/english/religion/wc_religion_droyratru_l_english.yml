 throsatru_desc:0 "Bound to Thros, a withered realm of thorn and decay, the fallen Drust claw at the veil to return to their ancient woods and slaughter the trespassers who stole them. Their faithful work the old craft in its rotted form, binding the dead into effigies of wood and bone, while their most devoted witches open their own throats to rise as Matrons."
 
