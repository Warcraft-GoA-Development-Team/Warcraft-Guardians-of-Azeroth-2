l_russian:
 necro_government: "Некрократия"
 necro_government_with_icon: "@government_type_necro! $necro_government$"
 necro_government_adjective: "Некротическ"
 necro_government_realm: "Царство мёртвых"
 necro_government_desc: "\n$game_concept_necro_government_desc$\n\n#F Земли, которыми правят неупокоенные мертвецы. Жестокие по своей природе и неспособные к размножению, они вынуждены убивать и воскрешать живых, чтобы пополнить свои ряды.#!"
 necro_government_vassals_label: "Некротические [obligations|El] основаны на [Concept('opinion', 'мнении')|E]"
 necro_government_filter_option: "Некро"
 necro_government_filter_option_desc: "Показывать только персонажей с $necro_government_with_icon$"
  
 government_dark_frenzy_from_battles: "Получает [dark_frenzy|E] от [Concept('battles', 'сражений')|E], которые выигрывают [commanders|El]"
 government_dark_frenzy_from_sieges_and_raids: "Получает [dark_frenzy|E] от [Concept('sieges', 'осад')|E] и [Concept('raids', 'налётов')|E]"
 government_dark_frenzy_from_conversions: "Получает [dark_frenzy|E] от [Concept('convert_county', 'обращения графств')|E][|E] и [Concept('promote_culture', 'распространения культуры')|E]"
  
 government_resurrect_knights: "Убитые вражеские [knights|El] становятся #L #TOOLTIP:GAME_TRAIT,being_undead, нежитью#!#! и присоединяются к $necro_government_adjective|l$им [Concept('court', 'дворам')|E] #F (высокая [Concept('dark_authority', 'тёмная власть')|E] увеличивает шанс)#!"
  
 demonic_government: "Демоническое правление"
 demonic_government_with_icon: "@government_type_demonic! $demonic_government$"
 demonic_government_adjective: "Демоническ"
 demonic_government_realm: "Царство демонов"
 demonic_government_desc: "\n$game_concept_demonic_government_desc$\n\n#F Демонические орды, вышедшие из Круговерти Пустоты, чтобы сеять хаос и разрушение. Их бессмертные души всегда жаждут боли и страданий, причиняемых смертным цивилизациям.#!"
 demonic_government_vassals_label: "Демонические [obligations|El] основаны на [Concept('opinion', 'мнении')|E]"
 demonic_government_filter_option: "Демоническое"
 demonic_government_filter_option_desc: "Показывать только персонажей с $demonic_government_with_icon$"
  
 government_dark_frenzy_from_executions: "Получает [dark_frenzy|El] от [Concept('executions', 'казней')|E]"
 government_dark_frenzy_from_torturing: "Получает [dark_frenzy|El] от [Concept('torturing', 'пыток')|E]"
  
 government_get_demon_knight: "Привлекает демонических ([GetTrait('being_demon').GetName( GetNullCharacter )]) [Concept('knights', 'рыцарей')|E] и [Concept('guests', 'гостей')|E] с высокими [Concept('skills', 'навыками')|E] #F (высокая [Concept('dark_authority', 'тёмная власть')|E] увеличивает шанс)#!"
  
 eldritch_government: "Тёмное правление"
 eldritch_government_with_icon: "@government_type_eldritch! $eldritch_government$"
 eldritch_government_adjective: "Тёмн"
 eldritch_government_realm: "Царство тьмы"
 eldritch_government_desc: "\n$game_concept_eldritch_government_desc$\n\n#F Правящий порядок, который господствовал в Азероте задолго до прибытия Титанов. В то время как существа из самых дальних уголков Запредельной Тьмы правят миром, смертные расы служат им рабами.#!"
 eldritch_government_vassals_label: "Тёмные [obligations|El] основаны на [Concept('opinion', 'мнении')|E]"
 eldritch_government_filter_option: "Потустороннее"
 eldritch_government_filter_option_desc: "Показывать только персонажей с $eldritch_government_with_icon$"
  
 government_dark_frenzy_from_mental_breaks: "Получает [dark_frenzy|E] от [Concept('mental_breaks', 'нервных срывов')|E]"
 government_mental_breaks_cant_kill: "[mental_breaks|E] не могут привести к смерти"
  
 government_get_void_creatures: "Привлекает из Бездны ([GetTrait('being_void').GetName( GetNullCharacter )]) [Concept('knights', 'рыцарей')|E] и [Concept('guests', 'гостей')|E] с высокими [Concept('skills', 'навыками')|E] #F (высокая [Concept('dark_authority', 'тёмная власть')|E] увеличивает шанс)#!"
  
 government_offer_vassalization_turns_undead: "[offer_vassalization|E] может обратить в [GetTrait('being_undead').GetName( GetNullCharacter )]"
  
 government_can_be_matchmaker: "Можно [Concept('marry', 'заключить браки')|E] между [Concept('courtiers', 'придворными')|E] и [Concept('children', 'детьми')|E]"
