 shadow_religion_desc:0 "Desperate times have led many who once walked the path of Light to question whether it alone can bring salvation to the benighted realms of Azeroth. This is especially true for those who live in lands ravaged by the $scourge$ and the depredations of the $fel_group$. For many of these lost souls, the logical assumption is that the $tyrism_religion$ must be balanced with the forces of the $shadow_religion$ for peace to return. Some of these seak a cure to the curse of Undeath; others a potent weapon to fight the $fel_group$. Whatever their motives be, these often outcast individuals have banded together around the rediscovered teachings of $forgotten_shadow$." # Need rework
