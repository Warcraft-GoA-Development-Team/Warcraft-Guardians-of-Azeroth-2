l_english:

 game_concept_absolute_tribal_authority_desc:0 "$game_concept_absolute_tribal_authority$ is the highest level of [tribal_authority|E]. [vassals|E] have a #N -30#! [opinion|E] penalty towards their [liege|E].\n\nAt this level, in addition to the effects of [limited_tribal|E] and [high_tribal_authority|E], rulers can now settle and become [feudal|E].\n\nUnreformed [tribal|E] rulers require this law to reform their [faith|E]."

 game_concept_religion_desc: "A $game_concept_religion$ can consist of many different denominations, called [faiths|E].  In Warcraft lore, religion is often aligned to one of the cosmic powers from whence the powers of magic flow. Therefore, religions, belong to one of seven larger [religious_families|E] which affect their opinions towards one another and the types of magic they prefer, allow, and disallow."

 game_concept_cultural_acceptance_baseline_desc:1 "[cultural_acceptance|E] has a baseline which it will decay towards if exceeded. The baseline depends on:\n$EFFECT_LIST_BULLET$Shared [heritage|E]\n$EFFECT_LIST_BULLET$Shared [language|E]\n$EFFECT_LIST_BULLET$Shared [faith|E] and [religion|E], especially if [GetFaithDoctrine('doctrine_pluralism_pluralistic').GetBaseName]\n$EFFECT_LIST_BULLET$Shared [ethos|E] within the same [region|E]"

 game_concept_religious_family_desc:0 "A $game_concept_religious_family$ is a group of [religions|E]. The $game_concept_religious_family$ affects how the various Religions, and [faiths|E] therein, view each other.\n\n These families are grouped by which of seven cosmic forces they most closely align to: [GetReligionFamily('rf_light').GetName], [GetReligionFamily('rf_shadow').GetName], [GetReligionFamily('rf_life').GetName], [GetReligionFamily('rf_death').GetName], [GetReligionFamily('rf_order').GetName], [GetReligionFamily('rf_disorder').GetName], or [GetReligionFamily('rf_elemental').GetName]. The [GetReligionFamily('rf_elemental').GetName] forces are further divided into Fire, Water, Air, and Earth."
 
 game_concept_organized_desc:0 "An Organized [faith|E] has a religious hierarchy. Worship and practices are more organized and scriptures are formalized.\n\n[GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] Faiths can become Organized by reforming, while other Faiths are always considered Organized."

 game_concept_unreformed_pagan_combat_bonus_desc:1 "[GetFaithDoctrine('unreformed_faith_doctrine').GetBaseName] [faiths|E] get a [battle|E] [advantage|E] in [counties|E] of their faith."