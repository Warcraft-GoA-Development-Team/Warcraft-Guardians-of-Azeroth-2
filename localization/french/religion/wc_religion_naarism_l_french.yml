 lightbound:0 "Empreint de Lumière"
 lightbound_adj:0 "empreinte de Lumière"
 lightbound_adherent:0 "empreint de Lumière"
 lightbound_adherent_plural:0 "empreints de Lumière"
 lightbound_desc:0 "Membres d'une branche fervente des enseignements des Naaru, les $lightbound_adherent_plural$ poussent leurs adeptes à répandre l’influence de la Lumière à travers l’univers, convertissant les incroyants par tous les moyens… y compris par la force, si cela s’avère nécessaire. Pour eux, la Lumière est le chemin vers une paix véritable et une justice absolue, et ils n’hésiteront pas à éliminer tout ce qu’ils considèrent comme un obstacle à son unité."
