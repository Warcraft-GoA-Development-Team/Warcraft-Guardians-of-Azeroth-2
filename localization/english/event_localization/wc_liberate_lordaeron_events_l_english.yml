l_english:
 
 liberate_lordaeron.1000.title:1 "Lordaeron Reborn"
 liberate_lordaeron.1000.desc:0 "After countless deaths and ceaseless conflicts, the [GetTitleByKey('c_lordaeron').GetName] has at last been torn away from the Scourge’s grasp. The people of this scarred land may now return to their ancestral homes, and in time the plague shall be purged from both air and soil. Yet, with liberation comes a pressing question of governance. Who shall inherit the newly restored [GetTitleByKey('k_lordaeron').GetBaseNameNoTierNoTooltip]?\n\nIs it just to restore the realm to the Menethil dynasty, granting stability through tradition?\nOr would it be most righteous to entrust its stewardship to the highest authority of our Holy Faith?\nAnd yet, it was by my hand alone that the [GetTitleByKey('c_lordaeron').GetTierAsNameNoTooltip] was reclaimed from the Scourge. Why, then, should I not claim it for myself?"
 liberate_lordaeron.1000.A:0 "Take the Throne for myself!"
 liberate_lordaeron.1000.B:0 "The Menethil dynasty shall rule once more."
 liberate_lordaeron.1000.C:0 "My fight is for the Light!"

 liberate_lordaeron.1001.title:1 "Lordaeron Reborn"
 liberate_lordaeron.1001.desc:0 "With the strength of the Holy Light itself, Lordaeron has been liberated.\n\nAll the rights to the Kingship of Lordaeron have been handed over to [new_ruler_of_lordaeron.GetName]. May the new reign of [new_ruler_of_lordaeron.GetFirstName] be blessed by the Light, and may the people of Lordaeron flourish once more in their birthright."
 liberate_lordaeron.1001.A:0 "Interesting..."
