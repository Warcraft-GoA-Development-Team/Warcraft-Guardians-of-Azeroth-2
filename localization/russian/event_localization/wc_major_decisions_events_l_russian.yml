l_russian:
 # Enforce the Brotherhood # TODO: Localize races 
 wc_holy_order_decision.0001.t: "Оружие верующих"
 wc_holy_order_decision.0001.desc: "Гнусный [invader.GetPrimaryTitle.GetBaseName] доказал, что они не остановятся ни перед чем, чтобы уничтожить добрых людей. Их воины учинили резню среди невинных, где бы их ни нашли, включая дома [founder.GetFaith.HighGodNameAlternate].\n\n[abbot.GetTitleAsNameNoTooltip] из $c_northshire$ умолял меня позволить его клирикам и их последователям взять оружие и тренироваться для войны.\nЯ не имею выбора, [invader.GetPrimaryTitle.GetBaseNameNoTooltip] давит на нас и угрожает уничтожить мой народ. Эта новая военная сила будет известна как [leader.GetPrimaryTitle.GetBaseName]."
 wc_holy_order_decision.0001.a: "Только вера в [founder.GetFaith.HighGodName] может нас спасти."
 wc_holy_order_decision.0001.b: "Давайте присмотрим за этими людьми."
 wc_holy_order_decision.0002.t: "$wc_holy_order_decision.0001.t$"
 wc_holy_order_decision.0002.desc: "Гнусный [invader.GetPrimaryTitle.GetBaseName] доказал, что они не остановятся ни перед чем, чтобы уничтожить добрых людей. Их воины учинили резню среди невинных, где бы их ни нашли, включая дома [founder.GetFaith.HighGodNameAlternate].\n\nЯ умолял [founder.GetTitleAsNameNoTooltip|l] позволить моим священникам присоединиться к борьбе, не только как целителей, но и как носителей оружия и разрушительных заклинаний. Без этих средств они будут уничтожены свирепым [invader.GetPrimaryTitle.GetBaseNameNoTooltip], что приведет только к новым смертям.\n\nЗная это, [founder.GetTitleAsNameNoTooltip|l] мудро удовлетворил мою просьбу, позволив нашему народу вооружиться для войны."
 wc_holy_order_decision.0002.a: "Слава [founder.GetFaith.HighGodName]!"
 wc_holy_order_decision.0002.b: "Теперь у меня есть больше власти в этих землях."
 wc_holy_order_decision.0003.t: "$wc_holy_order_decision.0001.t$"
 wc_holy_order_decision.0003.desc: "Гнусный [invader.GetPrimaryTitle.GetBaseName] доказал, что они не остановятся ни перед чем, чтобы уничтожить добрых людей. Их воины учинили резню среди невинных, где бы их ни нашли, включая дома [founder.GetFaith.HighGodNameAlternate].\n\nТеперь среди всех клириков возросла пылкость. [abbot.GetTitleAsNameNoTooltip] из $c_northshire$ призвал их взять оружие и изучать разрушительную святую магию.\n\nЗа ними идут отряды фанатичных паломников, крестьяне, которые больше не довольствуются помощью войне лишь помощью в тяжёлых работах. Наш [founder.GetPrimaryTitle.GetTierAsNameNoTooltip|l] теперь включит эту новую военную группу в нашу армию."
 wc_holy_order_decision.0003.a: "Слава [founder.GetFaith.HighGodName]!"
 wc_holy_order_decision.0003.a.medivh: "Чёрт, [founder.GetFirstNameNoTooltip]!"
 wc_holy_order_decision.0003.b: "Кучка безумных фанатиков..."
 wc_holy_order_decision.0004.t: "$wc_holy_order_decision.0001.t$"
 wc_holy_order_decision.0004.desc: "Никчёмные люди так и не оказали сопротивления нашему наступлению. Даже их религиозные лидеры, клирики, едва ли могут защитить своих верующих. Недавно они, похоже, научились у наших магов и начали использовать наступательные магии, с большой пользой против наших сил.\n\nНаши шпионы сообщают, что их называют Братством $c_northshire$, и они начали призывать рабов людей взять оружие и присоединиться к бою. Их раны лечат клирики, которые ими руководят, а их слабые тела укреплены святыми благословениями."
 wc_holy_order_decision.0004.a: "Ха! Они добровольно идут на свою гибель!"
 wc_holy_order_decision.0004.orcs.a: "Ха! Эти розовые шкуры добровольно бегут на свою погибель!"
 wc_holy_order_decision.0004.b: "Мне стоит изучить их теологию, чтобы противостоять им."
 wc_holy_order_decision.0005.t: "$wc_holy_order_decision.0001.t$"
 wc_holy_order_decision.0005.desc: "В течение некоторого времени Королевство $k_stormwind$ ведёт войну с таинственным врагом, известным лишь как сила тьмы и разрушения. Среди священников $c_northshire$ наблюдается рост фанатизма, видимо, вызванный желанием победы.\n\n[abbot.GetTitleAsNameNoTooltip] из $c_northshire$ призвал клириков взять оружие и изучать святую магию, предназначенную только для разрушения. Эта новая военная сила называет себя Братством $c_northshire$ и представляет собой тревожную новую норму для верующих [founder.GetFaith.HighGodNameAlternatePossessive]."
 wc_holy_order_decision.0005.holy_light.a: "Это, должно быть, еретично."
 wc_holy_order_decision.0005.holy_light.b: "Наши [ROOT.Char.GetFaith.PriestNeuterPlural] должны научиться этому."
 wc_holy_order_decision.0005.a: "Тревожное развитие событий..."
  
 # Silver Hand 
 wc_holy_order_decision.silver_hand_letter_was_sent: "[founder.GetTitledFirstName] отправил весточку всем [founder.GetFaith.PriestNeuterPlural] [founder.GetFaith.HighGodName]."
 wc_holy_order_decision.silver_hand_allies: "Если человечество и его союзники хотят выжить в наступающую эпоху борьбы, им понадобятся воины, которые могут исцелить невинных и уничтожать злых."
 wc_holy_order_decision.silver_hand_paladins_were_chosen: "Эти воины будут называться «паладинами». Пять человек уже были выбраны как первые из них. Известные своей силой и преданностью, каждому из них была вручена книга силы, и они получили задание обучать своих младших."
 wc_holy_order_decision.silver_hand_mythical_hero: "В древности человечество имело защитника, мифического героя Тира. Этот орден паладинов будет называться Рыцарями [leader.GetPrimaryTitle.GetBaseName], в честь этой легендарной личности."
 wc_holy_order_decision.silver_hand_general: "$wc_holy_order_decision.silver_hand_letter_was_sent$ Тьма наступает, и верующие должны быть готовы. Формируется новый орден, вдохновлённый мучениками Братства $c_northshire$.\n\n$wc_holy_order_decision.silver_hand_allies$\n\n$wc_holy_order_decision.silver_hand_paladins_were_chosen$\n\n$wc_holy_order_decision.silver_hand_mythical_hero$"
 wc_holy_order_decision.silver_hand_northshire_stay_general: "$wc_holy_order_decision.silver_hand_letter_was_sent$ Война близка, и верующие должны быть готовы.\n\n$wc_holy_order_decision.silver_hand_allies$\n\n$wc_holy_order_decision.silver_hand_paladins_were_chosen$\n\n$wc_holy_order_decision.silver_hand_mythical_hero$"
 wc_holy_order_decision.silver_hand_originaL_paladin: "$wc_holy_order_decision.silver_hand_letter_was_sent$ Война близка, и верующие должны быть готовы.\n\n$wc_holy_order_decision.silver_hand_allies$\n\nЭти воины будут называться «паладинами». Среди верующих пять человек, включая меня, были выбраны как первые воины. Известные своей силой и преданностью, каждому из нас была вручена книга силы, поручив нам обязанность обучать тех, кто будет идти за нами. С древних времён говорится, что человечество имело защитника, мифического героя Тира. Наш орден паладинов будет называться Рыцарями [leader.GetPrimaryTitle.GetBaseName], в честь этого легендарного героя."
  
 wc_holy_order_decision.0010.title: "Рыцари [leader.GetPrimaryTitle.GetBaseNameNoTooltip]"
 wc_holy_order_decision.0010.desc: "$wc_holy_order_decision.silver_hand_general$"
 wc_holy_order_decision.0010.desc.northshire_stay: "$wc_holy_order_decision.silver_hand_northshire_stay_general$"
 wc_holy_order_decision.0010.a: "Во имя [founder.GetFaith.HighGodName]!"
 wc_holy_order_decision.0011.title: "Рыцари [leader.GetPrimaryTitle.GetBaseNameNoTooltip]"
 wc_holy_order_decision.0011.desc: "$wc_holy_order_decision.silver_hand_general$"
 wc_holy_order_decision.0011.desc.northshire_stay: "$wc_holy_order_decision.silver_hand_northshire_stay_general$"
 wc_holy_order_decision.0011.desc.original_paladin: "$wc_holy_order_decision.silver_hand_originaL_paladin$"
 wc_holy_order_decision.0011.desc.original_paladin_northshire_stay: "$wc_holy_order_decision.silver_hand_originaL_paladin$"
 wc_holy_order_decision.0011.a: "Слава, Честь, Бой!"
 wc_holy_order_decision.0011.a_other: "Тревожное развитие событий..."
  
 wc_holy_order_decision.0012: "Мы оба знаем, что тьма проникает в эти земли. Наши союзники сообщают о стычках повсюду. Я отправляю тебе это сообщение, потому что знаю, что ты не будешь сидеть сложа руки, пока силы [ROOT.Char.GetFaith.NegativeAfterLife] несут разрушение миру. Нам понадобишься ты и твои единомышленники в предстоящих войнах. Я хочу, чтобы ты стал одним из первых, кто примет нашу сторону. Если ты хочешь идти этим путём, присоединяйся к нам. Нам предстоит много обсудить."
 wc_holy_order_decision.0012.a: "Аминь!"
