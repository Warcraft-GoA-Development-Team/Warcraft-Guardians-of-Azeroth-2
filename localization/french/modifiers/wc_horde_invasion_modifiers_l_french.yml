 ### Destruction caused by the Horde ###
 recently_sacked_by_the_horde_modifier:0 "Mise à sac par la Horde récente"
 recently_sacked_by_the_horde_modifier_desc:0 "Ce domaine a été récemment mis à sac par la Horde. Des groupes d'orcs errent dans la région, il faudra du temps avant que l'ordre ne soit rétabli."
 brought_discipline_horde_modifier:0 "Discipline restaurée dans la Horde"
 brought_discipline_horde_modifier_desc:0 "Plusieurs dizaines de grunts ont été exécutés pour rétablir la discipline."
 path_to_glory_modifier:0 "Chemin de la gloire"
 path_to_glory_modifier_desc:0 "Ce personnage s'illustre sur le champ de bataille et nourrit de grandes ambitions."
 horde_conqueror_modifier:0 "Conquiert de nouvelles terres"
 horde_conqueror_modifier_desc:0 "Sous le commandement de ce personnage, la Horde s'empare de nouvelles terres fertiles, par le feu et le sang, pour le peuple des orcs."