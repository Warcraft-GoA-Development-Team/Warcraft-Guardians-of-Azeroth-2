l_english:
 wc_proclaim_holy_war_decision:0 "Proclaim the Age of [ROOT.Char.GetFaith.GHWNamePlural]"
 wc_proclaim_holy_war_decision_desc:0 "Our enemies hold what [ROOT.Char.GetFaith.HighGodName] promised to the faithful. As head of [ROOT.Char.GetFaith.GetName], I can make holy war a core belief of my people."
 wc_proclaim_holy_war_decision_tooltip:0 "Make a holy war [core_tenet|E] part of your [mainline_rite|E], replacing a chosen one"
 wc_proclaim_holy_war_decision_confirm:0 "Let the faithful march"
 wc_proclaim_holy_war_decision_select_tt:0 "A [core_tenet|E] to replace must be chosen"
 wc_proclaim_holy_war_decision_unlock_tt:0 "The Age of [ROOT.Char.GetFaith.GHWNamePlural] begins for your [religion|E]"
 wc_proclaim_holy_war_communion_tt:0 "[GetTenetType('tenet_communion').GetBaseName] cannot be given up"
 wc_proclaim_holy_war_incompatible_tt:0 "A [core_tenet|E] that cannot coexist with [GetTenetType('tenet_armed_pilgrimages').GetBaseName] must be replaced first"

 wc_holy_war.0001.t:0 "The Age of [ROOT.Char.GetFaith.GHWNamePlural]"
 wc_holy_war.0001.desc.light:0 "Pilgrims bound for our holy sites are cut down on the roads, and the faithful look to me for protection. Today I proclaim that they may bear arms in the name of [ROOT.Char.GetFaith.HighGodName]. Let every sword of [ROOT.Char.GetFaith.GetName] be ready when I call."
 wc_holy_war.0001.desc.aldor:0 "For too long we counseled peace while demons burned world after world. The Naaru never asked us to stand idle. From this day [ROOT.Char.GetFaith.GetName] takes up the Light as a weapon, and its army marches again."
 wc_holy_war.0001.desc.zandalari:0 "The troll empires fell because they stood apart. The loa demand that every tribe be brought back under one banner, by persuasion or by the spear. I proclaim it: [ROOT.Char.GetFaith.GetName] will see the others submit, or conquer them."
 wc_holy_war.0001.desc.sethraliss:0 "Our serpent god was struck down and her temples buried in the sand. The time for hiding is over. The children of [ROOT.Char.GetFaith.HighGodName] will take back what was stolen from them."
 wc_holy_war.0001.desc.nerubian:0 "Our kingdom beneath the ice will not be devoured by the dead. Every brood of [ROOT.Char.GetFaith.GetName] will rise as one and carry the war to our enemies."
 wc_holy_war.0001.desc.forsaken:0 "We were murdered, raised and enslaved. Now we are free, and the land we died in is still held by our former masters and the living who fear us. [ROOT.Char.GetFaith.GetName] will take it back, one grave at a time."
 wc_holy_war.0001.desc.sunwell:0 "The holy places of our people lie open to anyone who would defile them. Let the faithful of [ROOT.Char.GetFaith.GetName] bear arms on every pilgrimage, and let no enemy stand between us and what is sacred."
 wc_holy_war.0001.a:0 "So it shall be."

 wc_holy_war.0002.opening:0 "To [ROOT.Char.GetFaith.GetAdherentNamePluralNoTooltip] of every land,"
 wc_holy_war.0002.desc.armed_pilgrimages:0 "I have set my seal upon the matter. From this day, [GetTenetType('tenet_armed_pilgrimages').GetName( hof_scope.GetRite )] stands among the core beliefs of [hof_scope.GetFaith.GetName].\n\nLet every ruler of the faith take heed."
 wc_holy_war.0002.desc.struggle_submission:0 "I have set my seal upon the matter. From this day, [GetTenetType('tenet_struggle_submission').GetName( hof_scope.GetRite )] stands among the core beliefs of [hof_scope.GetFaith.GetName].\n\nLet every ruler of the faith take heed."
 wc_holy_war.0002.desc.communion:0 "I have set my seal upon the matter. [GetTenetType('tenet_pacifism').GetName( hof_scope.GetRite )] no longer binds [hof_scope.GetFaith.GetName], and [GetTenetType('tenet_communion').GetName( hof_scope.GetRite )] takes its place.\n\nLet every ruler of the faith take heed."
 wc_holy_war.0002.a:0 "So be it."
